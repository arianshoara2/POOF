function tell(msg){document.querySelector('.status')?.remove();const z=document.createElement('div');z.className='status';z.textContent=msg;document.body.appendChild(z);setTimeout(()=>z.remove(),4200)}
function nav(id){stopAudio();page=id;render();window.scrollTo(0,0)}
function intext(x){return `<div class="de">${es(x)}</div>`}
function labelTag(tag){return TAGS[tag]||tag}
function showSource(c,i,isExam){return `<div class="grid2"><div class="source"><h3>Lesetext / Bericht</h3>${intext(c.text)}</div><div class="panel" style="margin:10px 0"><h3>Daten / Tabelle</h3><div class="tablewrap"><table class="data">${c.table.map((r,i)=>`<tr>${r.map(v=>i===0?`<th>${es(v)}</th>`:`<td>${es(v)}</td>`).join('')}</tr>`).join('')}</table></div><div class="subline"></div><h3>Hörbeitrag</h3><p class="small muted">متن صوت فقط پس از تصحیح قابل‌مشاهده است. برای شنیدن روی دکمه بزن؛ صدای آلمانی نصب‌شدهٔ دستگاه استفاده می‌شود.</p><div class="speaker"><button class="btn mainbtn" data-op="speak" data-index="${i}" data-exam="${isExam?'1':'0'}">▶ شنیدن</button><button class="btn" data-op="stop">■ قطع صدا</button></div>${(!isExam&&state.graded[i])||(isExam&&state.exam.finished)?`<details><summary>رونوشت کامل صوت (Transcript)</summary>${intext(c.audio)}</details>`:''}<div class="sourcewarn">اگر صدای آلمانی روی دستگاه نصب نیست، کیفیت شبیه‌سازی شنیداری کافی نخواهد بود. بخش کتبی و جدول همچنان آفلاین‌اند.</div></div></div>`}
function questionHTML(q,idx,key,val,locked,review){return `<div class="question"><div class="qhead"><b class="de" style="font-weight:700;flex:1">${idx}. ${es(q.prompt)}</b><span class="qtag">${es(labelTag(q.tag))}</span></div><div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="${es(key)}" data-answer="${es(key)}" value="${j}" ${Number(val)===j?'checked':''} ${locked?'disabled':''}><span>${'ABC'[j]}. ${es(o)}</span></label>`).join('')}</div>${review?`<div class="answerbox"><b>پاسخ صحیح: ${'ABC'[q.answer]} ${Number(val)===q.answer?'✓':'·'}</b>${q.options.map((o,j)=>`<div class="answerrow ${j===q.answer?'good':'bad'}"><b class="de">${'ABC'[j]}. ${es(o)}</b><div>${es(q.reasons[j])}</div></div>`).join('')}</div>`:''}</div>`}
function navList(){return `<div class="side"><div class="brand"><div class="logo">D8</div><div><strong>Digital TestDaF</strong><small>EXTRA · PART 08 · ARGUMENTATION</small></div></div><div class="sidecap">مسیر یادگیری</div><div class="navlist"><button class="navbtn ${page==='home'?'active':''}" data-nav="home">خانه و راهنمای استفاده</button>${MODS.map((c,i)=>`<button class="navbtn ${page==='m'+i?'active':''}" data-nav="m${i}">${state.graded[i]?'✓ ':'۰'+(i+1)+' · '}${es(c.fa)}</button>`).join('')}<button class="navbtn ${page==='exam'?'active':''}" data-nav="exam">آزمون پایانی · ۳ پرونده</button><button class="navbtn ${page==='report'?'active':''}" data-nav="report">گزارش و خروجی پاسخ‌ها</button></div><div class="sidebottom">سؤال‌ها تازه و تألیفی‌اند؛ فایل رسمی TestDaF نیست. نمرهٔ تمرینی معادل TDN رسمی نیست.</div></div>`}
function navMobile(){return `<div class="mobilejump"><select id="mobile-nav"><option value="home" ${page==='home'?'selected':''}>خانه و راهنما</option>${MODS.map((m,i)=>`<option value="m${i}" ${page==='m'+i?'selected':''}>${i+1}. ${es(m.fa)}</option>`).join('')}<option value="exam" ${page==='exam'?'selected':''}>آزمون پایانی</option><option value="report" ${page==='report'?'selected':''}>گزارش</option></select></div>`}
function head(){return `<div class="toolbar"><span class="tiny">TestDaF دیجیتال • تمرین تعاملی مستقل • پارت هشتم</span><div class="actions"><button class="btn" data-op="export">دریافت پاسخ‌ها (JSON)</button><button class="btn" data-op="exporttxt">گزارش متنی</button></div></div>`}
function home(){return `<section class="hero"><span class="eyebrow">ADVANCED ACADEMIC REASONING</span><h1>آزمایشگاه استدلال و زبان علمی</h1><p>۸ فصل پیشرفته برای تفسیر شواهد، نگارش دقیق و گفتار دانشگاهی؛ سپس سه پروندهٔ تازه برای آزمون پایانی زمان‌دار. متن و سؤال آلمانی، آموزش و پاسخ‌نامهٔ تحلیلی فارسی.</p></section><div class="stats"><div class="stat"><b>۸</b><span>فصل آموزشی</span></div><div class="stat"><b>۸۸</b><span>سؤال جدید</span></div><div class="stat"><b>۱۶</b><span>تکلیف تولیدی</span></div><div class="stat"><b>۳۶</b><span>دقیقه آزمون پایانی</span></div></div><div class="notice">این مجموعه «کارگاه تکمیلیِ مهارت» است، نه یک نسخهٔ کاملِ چهارمهارتی. برای آزمون رسمی، ترتیب Lesen → Hören → Schreiben → Sprechen و محدودیت عدم بازگشت به تکلیف‌های قبلی را در نظر بگیر. اینجا برای یادگیری، متن و داده و صوتِ یک پرونده کنار هم آمده‌اند.</div><div class="panel"><h2>روش استفاده</h2><p>۱. ابتدا متن آلمانی و جدول داده را بررسی کن؛ سپس از دکمهٔ شنیدن برای گفتار استفاده کن. ۲. هر هشت سؤال فصل را جواب بده و روی «ثبت و تصحیح» بزن. ۳. در انتهای همان فصل، پاسخ تمام گزینه‌ها و متن صوت آشکار می‌شوند. ۴. یک نوشته و یک گفتار تولید کن و با نمونه‌پاسخ پس از تصحیح مقایسه کن. ۵. آزمون پایانی را پس از تمام فصل‌ها شروع کن.</p><div class="warning notice">صدای برنامه از <strong>گفتارساز آلمانی دستگاه</strong> استفاده می‌کند؛ صوت از پیش جاسازی نشده تا حجم فایل پایین بماند. روی بعضی دستگاه‌ها صدا یا میکروفون آفلاین در دسترس نیست. در این صورت تمرین شنیداریِ زمان‌دار را معیار قابل‌اعتماد ارزیابی خودت قرار نده.</div></div><div class="panel"><h3>انتخاب گوینده و سرعت</h3><div class="speaker"><select id="voice-select"><option value="">بررسی صداهای آلمانی…</option></select><label class="small">سرعت</label><select id="speed-select"><option value="0.82" ${state.rate===.82?'selected':''}>۰٫۸۲ آهسته</option><option value="0.94" ${state.rate===.94?'selected':''}>۰٫۹۴ عادی</option><option value="1.05" ${state.rate===1.05?'selected':''}>۱٫۰۵ سریع</option></select></div><p class="tiny">صدا باید روی دستگاه یا مرورگر نصب و برای استفاده آفلاین موجود باشد.</p></div><h2>هشت فصل آموزشی</h2><div class="cards">${MODS.map((c,i)=>`<div class="card" data-nav="m${i}"><span class="tag">فصل ${i+1} · ۸ سؤال</span><h3>${es(c.fa)}</h3><p class="muted small de">${es(c.title)}</p><p class="small">${es(c.lesson.slice(0,145))}…</p><div class="info"><b>${state.graded[i]?getScore(i)+'/8':'هنوز تصحیح نشده'}</b><button class="btn" data-nav="m${i}">بازکردن فصل</button></div></div>`).join('')}</div><div class="panel"><h2>آزمون پایانی</h2><p>سه پروندهٔ تازه، هرکدام هشت سؤال. هر مرحله ۱۲ دقیقه؛ پس از عبور از یک پرونده، امکان بازگشت وجود ندارد. پاسخ‌نامه فقط پس از پایان باز می‌شود.</p><button class="btn mainbtn" data-nav="exam">ورود به آزمون پایانی</button></div>`}
function getScore(i){return MODS[i].questions.reduce((s,q,j)=>s+(state.answers[`m${i}_${j}`]===q.answer?1:0),0)}
function renderModules(i){const c=MODS[i],graded=!!state.graded[i],s=getScore(i);return `<section class="hero"><span class="eyebrow">LERNMODUL ${i+1}/8</span><h1>${es(c.fa)}</h1><p class="de">${es(c.title)}</p></section><div class="panel"><h2>درس و نکته‌های کلیدی</h2><p>${es(c.lesson)}</p><div class="terms">${c.signals.map(x=>`<span class="term">${es(x)}</span>`).join('')}</div></div>${showSource(c,i,false)}<section class="panel"><div class="info"><h2>۸ سؤال این فصل</h2><span class="tag">سؤالات تألیفی · نزدیک به زبان دانشگاهی</span></div>${c.questions.map((q,j)=>questionHTML(q,j+1,`m${i}_${j}`,state.answers[`m${i}_${j}`],graded,graded)).join('')}<div class="info"><button class="btn mainbtn" data-op="grade" data-index="${i}" ${graded?'disabled':''}>${graded?'تصحیح شده ✓':'ثبت پاسخ‌ها و نمایش پاسخ‌نامهٔ تشریحی'}</button>${graded?`<span class="score">${s}/8</span>`:''}</div></section><section class="panel"><h2>تمرین تولید زبان: Schreiben</h2><div class="source">${intext(c.writing)}</div><p class="small muted">تمرین تألیفیِ کوتاه؛ زمان پیشنهادی ۲۰ دقیقه. این تکلیف معادل قالب ۳۰دقیقه‌ای Schreiben رسمی نیست.</p><div class="info"><button class="btn" data-op="wstart" data-index="${i}">شروع زمان‌سنج ۲۰ دقیقه‌ای</button><span class="timer" id="wtimer">${wt?.index===i?fmt((wt.end-Date.now())/1000):'20:00'}</span><span class="tiny" id="wcount">${numWords(state.writing[i]||'')} Wörter</span></div><textarea class="textbox" data-write="${i}" placeholder="Schreiben Sie Ihren eigenen Text auf Deutsch…">${es(state.writing[i]||'')}</textarea>${graded?`<details><summary>نمونه‌پاسخ کامل آلمانی + تحلیل</summary><div class="source">${intext(c.models[0])}</div><div class="notice"><b>ترجمهٔ فارسی نمونه‌پاسخ:</b><p>${es(c.model_fa[0])}</p></div><div class="notice">آموزش: در نمونه، دادهٔ اصلی، میزان قطعیت، محدودیت روش‌شناختی و پیشنهاد یا نتیجه متناسب با تکلیف حفظ شده‌اند. متن خودت را با همین چهار محور بسنج؛ شباهت واژه‌به‌واژه لازم نیست.</div></details>`:'<p class="small muted">نمونه‌پاسخ پس از ثبت و تصحیح هشت سؤال این فصل ظاهر می‌شود.</p>'}</section><section class="panel"><h2>تمرین تولید زبان: Sprechen</h2><div class="source">${intext(c.speaking)}</div><p>۹۰ ثانیه پاسخ مستقل بده. این تمرین آموزشی است، نه شبیه‌سازی دقیق یک تکلیف مشخص گفتاری.</p><div class="actions"><button class="btn mainbtn" data-op="sstart" data-index="${i}">شروع شمارش ۹۰ ثانیه</button><span class="timer" id="stimer">${pt?.index===i?fmt((pt.end-Date.now())/1000):'01:30'}</span><button class="btn" data-op="record">● شروع ضبط</button><button class="btn" data-op="recordstop">■ پایان ضبط</button><button class="btn" data-op="recordsave">دریافت فایل ضبط‌شده</button></div><p class="tiny">ضبط در مرورگرهای دارای MediaRecorder و اجازهٔ میکروفون کار می‌کند. در فایل محلی بعضی مرورگرها اجازهٔ ضبط نمی‌دهند؛ از ضبط‌کنندهٔ گوشی استفاده کن.</p><textarea class="textbox" style="min-height:100px" data-speaknote="${i}" placeholder="اختیاری: طرح و نکته‌های گفتار خود را اینجا بنویس…">${es(state.speakingNotes[i]||'')}</textarea>${graded?`<details><summary>نمونه‌پاسخ گفتاری آلمانی</summary><div class="source">${intext(c.models[1])}</div><div class="notice"><b>ترجمهٔ فارسی نمونه‌پاسخ:</b><p>${es(c.model_fa[1])}</p></div><div class="notice">در ارزیابی گفتار، ارتباط با وظیفه، پوشش نکات، دقت نسبت‌دادن شواهد، انسجام و روانی مهم‌اند؛ صرف استفاده از واژه‌های پیچیده کافی نیست.</div></details>`:''}</section><div class="actions"><button class="btn" data-nav="home">بازگشت به فهرست</button>${i<7?`<button class="btn mainbtn" data-nav="m${i+1}">فصل بعدی</button>`:`<button class="btn mainbtn" data-nav="exam">آزمون پایانی</button>`}</div>`}
function examScore(){return EX.reduce((s,c,i)=>s+c.questions.reduce((a,q,j)=>a+(state.exam.answers[`e${i}_${j}`]===q.answer?1:0),0),0)}
function examHTML(){let e=state.exam;if(!e.started)return `<div class="hero"><span class="eyebrow">ABSCHLUSSPRÜFUNG</span><h1>آزمون پایانی: سه پروندهٔ تازه</h1><p>۲۴ سؤال در سه مرحلهٔ ۱۲دقیقه‌ای. بعد از عبور از هر پرونده، بازگشت بسته می‌شود. نتیجه و تحلیل تمام گزینه‌ها فقط در پایان نمایش داده خواهند شد.</p></div><div class="panel"><h2>قوانین این تمرین</h2><p>هر پرونده شامل متن پژوهشی، جدول و توضیح شنیداری است. متن گفتار تا پایان آزمون پنهان می‌ماند. پاسخ تستی را ثبت کن؛ پس از تکمیل مرحله روی دکمهٔ ادامه بزن. به خاطر زمان‌سنج محلی، در صورت بسته‌شدن مرورگر ممکن است مرحله به پایان برسد. برای شنیدن، به صدای آلمانی دستگاه نیاز داری.</p><button class="btn mainbtn" data-op="startExam">شروع آزمون ۳۶دقیقه‌ای</button></div>`;if(e.finished){return `<div class="hero"><span class="eyebrow">ERGEBNIS UND AUSWERTUNG</span><h1>نتیجهٔ آزمون پایانی</h1><p>پاسخ درست: ${examScore()} از ۲۴. درصدها و نمره‌ها تمرینی‌اند و قابل تبدیل مستقیم به TDN رسمی نیستند.</p></div><div class="stats"><div class="stat"><b>${examScore()}/24</b><span>پاسخ درست</span></div><div class="stat"><b>${Math.round(examScore()/24*100)}٪</b><span>دقت تمرینی</span></div><div class="stat"><b>۳</b><span>پروندهٔ مستقل</span></div><div class="stat"><b>۳۶</b><span>دقیقه هدف</span></div></div>${EX.map((c,i)=>`<section class="panel"><h2>مرحلهٔ ${i+1} — ${es(c.fa)}</h2>${showSource(c,i,true)}${c.questions.map((q,j)=>questionHTML(q,j+1,`e${i}_${j}`,e.answers[`e${i}_${j}`],true,true)).join('')}<details><summary>تکلیف نوشتن، گفتار و نمونه‌پاسخ‌های تکمیلی</summary><h3>Schreiben</h3><div class="source">${intext(c.writing)}</div><div class="source">${intext(c.models[0])}</div><div class="notice"><b>ترجمه:</b> ${es(c.model_fa[0])}</div><h3>Sprechen</h3><div class="source">${intext(c.speaking)}</div><div class="source">${intext(c.models[1])}</div><div class="notice"><b>ترجمه:</b> ${es(c.model_fa[1])}</div></details></section>`).join('')}<div class="actions"><button class="btn" data-nav="report">گزارش مهارت‌ها</button><button class="btn danger" data-op="resetExam">اجرای دوبارهٔ آزمون</button></div>`}
let i=e.step,c=EX[i],remaining=Math.max(0,(e.expires-Date.now())/1000);return `<section class="hero"><div class="info"><div><span class="eyebrow">PRÜFUNGSPHASE ${i+1}/3</span><h1>${es(c.fa)}</h1><p class="de">${es(c.title)}</p></div><div><div class="bigclock" id="examclock">${fmt(remaining)}</div><div class="small">۱۲ دقیقه برای این مرحله</div></div></div></section><div class="notice">پس از عبور از مرحله امکان بازگشت وجود ندارد. فقط در پایانِ هر سه مرحله پاسخ‌نامه آشکار می‌شود.</div>${showSource(c,i,true)}<section class="panel"><h2>۸ سؤال مرحلهٔ ${i+1}</h2>${c.questions.map((q,j)=>questionHTML(q,j+1,`e${i}_${j}`,e.answers[`e${i}_${j}`],false,false)).join('')}<button class="btn mainbtn" data-op="nextExam">${i===2?'پایان آزمون و مشاهدهٔ تحلیل':'ثبت مرحله و رفتن به مرحلهٔ بعد'}</button></section>`}
function progressReport(){const graded=MODS.map((m,i)=>i).filter(i=>state.graded[i]);let all=graded.flatMap(i=>MODS[i].questions.map((q,j)=>({q,a:state.answers[`m${i}_${j}`]})));if(state.exam.finished)all.push(...EX.flatMap((c,i)=>c.questions.map((q,j)=>({q,a:state.exam.answers[`e${i}_${j}`]}))));let groups={};for(const {q,a} of all){if(!groups[q.tag])groups[q.tag]={n:0,ok:0};groups[q.tag].n++;if(a===q.answer)groups[q.tag].ok++}let worst=Object.entries(groups).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n)[0];return `<section class="hero"><h1>گزارش یادگیری و نقاط ضعف</h1><p>پیشرفت را از روی نوع خطا بررسی کن، نه صرفاً یک درصد کلی. برای تفسیر سطح TestDaF لازم است عملکرد نوشتن و گفتار هم به‌طور جداگانه ارزیابی شود.</p></section><div class="stats"><div class="stat"><b>${graded.length}/8</b><span>فصل تصحیح‌شده</span></div><div class="stat"><b>${all.filter(z=>z.a===z.q.answer).length}/${all.length}</b><span>سؤال صحیح از تصحیح‌شده‌ها</span></div><div class="stat"><b>${Object.values(state.writing).filter(x=>String(x).trim()).length}/8</b><span>نوشته‌های ذخیره‌شده</span></div><div class="stat"><b>${state.exam.finished?examScore()+'/24':'—'}</b><span>آزمون پایانی</span></div></div><div class="panel"><h2>تحلیل بر اساس نوع خطا</h2>${Object.entries(groups).map(([tag,x])=>`<div class="info"><b>${es(labelTag(tag))}</b><span>${x.ok}/${x.n}</span></div><div class="progress"><div class="fill" style="width:${x.ok/x.n*100}%"></div></div><div class="spacer"></div>`).join('')||'<p>برای ساخت گزارش، ابتدا فصل‌ها را حل و تصحیح کن.</p>'}${worst?`<div class="notice">کمترین دقت فعلی: <b>${es(labelTag(worst[0]))}</b> (${worst[1].ok}/${worst[1].n}). یک متن تازه انتخاب کن و برای سؤال‌های این دسته، دلیل رد تمام گزینه‌ها را به‌صورت مکتوب ثبت کن.</div>`:''}</div><div class="panel"><h3>روال تصحیح انسانیِ نوشته و گفتار</h3><ul class="rubric"><li>Aufgabenerfüllung — تمام وظایف را پوشش داده‌ای؟</li><li>Inhalt und Quellentreue — داده‌ها و موضع گوینده را درست منتقل کرده‌ای؟</li><li>Logische Struktur — ارتباط ادعا، دلیل و نتیجه روشن است؟</li><li>Wissenschaftliche Genauigkeit — قطعیت، درصد و شرایط را تحریف نکرده‌ای؟</li><li>Sprachliche Mittel — واژگان و دستور زبان برای هدف کافی‌اند؟</li><li>Mündliche Verständlichkeit — گفتار روان و قابل‌فهم است؟</li></ul><p>این چک‌لیست آموزشی است؛ جایگزین معیارگذاری رسمی TestDaF و نمره‌دهی متخصص نیست.</p><div class="actions"><button class="btn mainbtn" data-op="export">دانلود JSON برای ارسال به ChatGPT</button><button class="btn" data-op="exporttxt">دانلود TXT</button><button class="btn danger" data-op="resetAll">پاک‌کردن پیشرفت محلی</button></div></div>`}
function footer(){return `<div class="footer">Digital TestDaF · Extra Part 8 · مجموعهٔ تألیفی مستقل · غیررسمی · بدون نیاز به فایل خارجی<br>ساختار رسمی TestDaF: <a href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/" target="_blank" rel="noopener noreferrer">testdaf.de</a> · استفاده از لینک نیازمند اینترنت است.</div>`}
function render(){if(state.exam.started&&!state.exam.finished&&Date.now()>=state.exam.expires){nextStage(false);return}let body=page==='home'?home():page==='exam'?examHTML():page==='report'?progressReport():renderModules(Number(page.slice(1)));$.innerHTML=`<div class="layout">${navList()}<main class="main">${navMobile()}${head()}${body}${footer()}</main></div>`;voiceOptions();tick()}
function voiceOptions(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices()||[];const v=voices.filter(x=>/^de(?:[-_]|$)/i.test(x.lang));const el=document.getElementById('voice-select');if(el){el.innerHTML=v.length?v.map(x=>`<option value="${es(x.voiceURI)}">${es(x.name)} (${es(x.lang)})</option>`).join(''):'<option value="">صدای آلمانی نصب‌شده پیدا نشد</option>';if(v.some(x=>x.voiceURI===state.voice))el.value=state.voice;else if(v[0])el.value=v[0].voiceURI}}
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}uttQueue=[];voicePlaying=false;currentUtterance=null}
function speak(index,isExam){if(!('speechSynthesis' in window)){tell('مرورگر گفتارساز ندارد؛ رونوشت در حالت تمرین پس از تصحیح قابل مشاهده است.');return}stopAudio();voiceOptions();const v=voices.filter(x=>/^de(?:[-_]|$)/i.test(x.lang));if(!v.length){tell('صدای آلمانی دستگاه پیدا نشد. در صورت امکان صدای آلمانی نصب کن.');return}const src=(isExam?EX:MODS)[index];const voice=v.find(x=>x.voiceURI===state.voice)||v[0];let sentences=src.audio.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[src.audio];uttQueue=sentences.flatMap(x=>x.length>220?(x.match(/.{1,180}(?:\s|$)/g)||[x]):[x]).map(x=>x.trim()).filter(Boolean);voicePlaying=true;function playOne(){if(!voicePlaying)return;const t=uttQueue.shift();if(!t){voicePlaying=false;return}const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.voice=voice;u.rate=state.rate||.94;u.pitch=1;u.onend=playOne;u.onerror=()=>{voicePlaying=false;tell('پخش صوت متوقف شد؛ صدای آلمانی این دستگاه ممکن است آفلاین در دسترس نباشد.')};currentUtterance=u;speechSynthesis.speak(u)}playOne();tell('پخش متن شنیداری شروع شد؛ در صورت لزوم گوینده را از خانه تغییر بده.')}
function download(name,content,mime){const b=new Blob([content],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportReport(isText){const d={title:'Digital_TestDaF_Extra_Part8_Argumentationslabor',createdAt:new Date().toISOString(),notice:'Self-assessment exercise; not an official TDN score',chapters:MODS.map((c,i)=>({chapter:c.title,graded:!!state.graded[i],score:state.graded[i]?getScore(i):null,answers:c.questions.map((q,j)=>({question:q.prompt,selectedIndex:state.answers[`m${i}_${j}`]??null,selectedText:q.options[state.answers[`m${i}_${j}`]]??'',correctIndex:q.answer,tag:q.tag})),writing:state.writing[i]||'',speakingPlan:state.speakingNotes[i]||''})),exam:{finished:state.exam.finished,score:state.exam.finished?examScore():null,answers:EX.map((c,i)=>({chapter:c.title,questions:c.questions.map((q,j)=>({question:q.prompt,selectedIndex:state.exam.answers[`e${i}_${j}`]??null,correctIndex:q.answer,tag:q.tag}))}))}};if(!isText)return download('Digital_TestDaF_Extra_Part8_Antworten.json',JSON.stringify(d,null,2),'application/json');let chunks=[d.title,'نمرهٔ تمرینی، نه نمرهٔ رسمی TestDaF',''];for(let c of d.chapters){chunks.push('=== '+c.chapter+' ===',c.graded?c.score+'/8':'noch nicht bewertet');c.answers.forEach((q,j)=>chunks.push(`${j+1}. ${q.question}\nAntwort: ${q.selectedText||'—'}\nRichtige Lösung: ${q.correctIndex+1}`));chunks.push('SCHREIBEN:',c.writing,'SPRECHEN NOTIZEN:',c.speakingPlan)}chunks.push('Exam:',d.exam.finished?d.exam.score+'/24':'not finished');download('Digital_TestDaF_Extra_Part8_Bericht.txt',chunks.join('\n'),'text/plain;charset=utf-8')}
function nextStage(doRender=true){if(!state.exam.started||state.exam.finished)return;stopAudio();if(state.exam.step<2){state.exam.step++;state.exam.expires=Date.now()+12*60*1000}else{state.exam.finished=true;state.exam.expires=0}save();if(doRender){render();window.scrollTo(0,0)}}
async function record(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){tell('در این مرورگر اجازهٔ میکروفون برای فایل HTML وجود ندارد. از ضبط‌کنندهٔ گوشی استفاده کن.');return}try{if(recorder&&recorder.state==='recording'){tell('ضبط از قبل فعال است.');return}recStream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recorder=new MediaRecorder(recStream);recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};recorder.onstop=()=>{if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(new Blob(recChunks,{type:recorder.mimeType||'audio/webm'}));recStream.getTracks().forEach(t=>t.stop());tell('فایل گفتار آمادهٔ ذخیره است.')};recorder.start();tell('ضبط شروع شد.')}catch(err){tell('میکروفون در این دستگاه یا در حالت فایل محلی قابل‌دسترسی نیست.')}}
function tick(){const ex=state.exam;if(ex.started&&!ex.finished){if(Date.now()>=ex.expires){nextStage();tell('زمان مرحله به پایان رسید؛ به مرحلهٔ بعد منتقل شدی.');return}const e=document.getElementById('examclock');if(e)e.textContent=fmt((ex.expires-Date.now())/1000)}if(wt){let e=document.getElementById('wtimer');if(e&&page==='m'+wt.index)e.textContent=fmt((wt.end-Date.now())/1000);if(Date.now()>wt.end){wt=null;tell('زمان تمرین نوشتن تمام شد؛ متن ذخیره شده است.')}}if(pt){let e=document.getElementById('stimer');if(e&&page==='m'+pt.index)e.textContent=fmt((pt.end-Date.now())/1000);if(Date.now()>pt.end){pt=null;tell('زمان گفتار تمام شد.')}}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}const b=e.target.closest('[data-op]');if(!b)return;const op=b.dataset.op,i=Number(b.dataset.index);if(op==='grade'){state.graded[i]=true;save();render();tell('پاسخ‌نامهٔ همین فصل باز شد.')}if(op==='speak')speak(i,b.dataset.exam==='1');if(op==='stop')stopAudio();if(op==='export')exportReport(false);if(op==='exporttxt')exportReport(true);if(op==='wstart'){wt={index:i,end:Date.now()+20*60*1000};tick();tell('زمان‌سنج نوشتن آغاز شد.')}if(op==='sstart'){pt={index:i,end:Date.now()+90*1000};tick();tell('۹۰ ثانیهٔ پاسخ گفتاری آغاز شد.')}if(op==='record')record();if(op==='recordstop'){if(recorder&&recorder.state==='recording')recorder.stop();else tell('ضبط فعالی وجود ندارد.')}if(op==='recordsave'){if(recUrl){const a=document.createElement('a');a.href=recUrl;a.download='TestDaF_Extra_Part8_Sprechen_Aufnahme.webm';a.click()}else tell('هنوز فایل ضبط‌شده‌ای آماده نیست.')}if(op==='startExam'){stopAudio();state.exam={started:true,finished:false,step:0,answers:{},expires:Date.now()+12*60*1000};save();render();window.scrollTo(0,0)}if(op==='nextExam'){nextStage();}if(op==='resetExam'){if(confirm('آزمون پایانی از ابتدا شروع شود؟')){state.exam={started:false,finished:false,step:0,answers:{},expires:0};save();render()}}if(op==='resetAll'){if(confirm('تمام پاسخ‌ها و نوشته‌های ذخیره‌شدهٔ این فایل حذف شوند؟')){state=DEFAULT();save();nav('home')}}});
document.addEventListener('change',e=>{if(e.target.id==='mobile-nav'){nav(e.target.value);return}if(e.target.id==='voice-select'){state.voice=e.target.value;save();return}if(e.target.id==='speed-select'){state.rate=Number(e.target.value);save();return}let key=e.target.dataset.answer;if(key){if(key.startsWith('m'))state.answers[key]=Number(e.target.value);else if(key.startsWith('e'))state.exam.answers[key]=Number(e.target.value);save()}});
document.addEventListener('input',e=>{if(e.target.dataset.write!==undefined){let i=Number(e.target.dataset.write);state.writing[i]=e.target.value;save();let el=document.getElementById('wcount');if(el)el.textContent=numWords(e.target.value)+' Wörter'}if(e.target.dataset.speaknote!==undefined){state.speakingNotes[Number(e.target.dataset.speaknote)]=e.target.value;save()}});
setInterval(tick,700);if('speechSynthesis' in window)speechSynthesis.addEventListener?.('voiceschanged',voiceOptions);
render();
</script><a href="testdaf.html" style="position:fixed;bottom:76px;left:16px;z-index:9999;background:#173f55;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.3)">← بازگشت به POOF</a></body></html>
