radient(122deg,#153348,#196863);color:white;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;left:-60px;top:-85px;width:240px;height:240px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 40px rgba(255,255,255,.03)}.hero h1{margin:7px 0;font-size:clamp(23px,3vw,37px);line-height:1.45}.hero p{max-width:840px;opacity:.91;margin:8px 0}.eyebrow{font:600 11px Arial;letter-spacing:1.1px;opacity:.78}h2{font-size:22px;line-height:1.5;margin:0 0 12px}h3{font-size:17px;line-height:1.5;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:16px 0}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:14px;text-align:center}.stat b{display:block;font:750 28px Arial,sans-serif;color:var(--dark)}.stat span{color:var(--muted);font-size:11px}.panel,.card{padding:19px;margin:13px 0}.card{cursor:pointer;margin:0}.card:hover{border-color:#71bfb5}.card h3{margin-bottom:5px}.tag{background:#e5f5f0;color:#126e62;padding:3px 9px;border-radius:100px;display:inline-flex;font-size:11px;font-weight:bold}.notice{padding:12px 14px;border-radius:10px;background:#e8f5f1;border-right:4px solid var(--accent);margin:12px 0}.warning{background:#fff5e7;border-right-color:#b88940}.source{padding:17px;background:#f8fafb;border:1px solid var(--line);border-radius:11px;margin:10px 0}.de{direction:ltr;text-align:left;font:15px/1.76 Arial,"Segoe UI",sans-serif;unicode-bidi:plaintext;white-space:pre-wrap}.de b{font-weight:700}.data{width:100%;border-collapse:collapse;direction:ltr;text-align:left;font-family:Arial,sans-serif}.data th,.data td{border:1px solid #dfe7ea;padding:9px 12px}.data th{background:#e9f2f3}.tablewrap{max-width:100%;overflow:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.question{padding:13px;border-radius:11px;background:#f9fbfc;border:1px solid var(--line);margin:11px 0}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.qhead b{font-size:14px}.qtag{font-size:10px;color:var(--accent);font-weight:bold}.opts{display:grid;gap:7px;margin-top:9px}.opt{display:flex;align-items:flex-start;gap:10px;direction:ltr;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid #dbe5e8;background:#fff;font:14px/1.6 Arial,sans-serif}.opt:has(input:checked){border-color:#4bafa3;background:#e6f6f1}.opt input{accent-color:var(--accent);margin-top:4px;flex-shrink:0}.answerbox{margin-top:12px;padding:14px;border:1px solid #d8e7e2;border-radius:11px;background:#f5faf8}.answerrow{padding:9px 11px;margin:7px 0;background:white;border-radius:8px;border:1px solid var(--line);font-size:13px}.answerrow.good{border-right:4px solid var(--good)}.answerrow.bad{border-right:4px solid var(--bad)}.terms{display:flex;flex-wrap:wrap;gap:6px}.term{border-radius:8px;background:#eaf1f4;padding:5px 9px;font:13px Arial,sans-serif;direction:ltr;unicode-bidi:plaintext}.muted{color:var(--muted)}.textbox{width:100%;min-height:160px;border:1px solid #cadde0;border-radius:10px;padding:12px;font:15px/1.75 Arial,"Segoe UI",sans-serif;direction:ltr;resize:vertical}.textbox:focus{outline:2px solid #93d0c7}.info{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}.subline{height:1px;background:var(--line);margin:20px 0}.timer{font:700 21px Arial,sans-serif;direction:ltr;color:var(--accent);letter-spacing:.5px}.score{font:750 27px Arial;color:var(--accent);direction:ltr}.bigclock{font:800 29px Arial;color:white;direction:ltr}.progress{background:#dde8e8;border-radius:8px;height:9px;overflow:hidden}.fill{height:100%;background:var(--accent)}.speaker{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0}.speaker select{max-width:min(100%,290px);border:1px solid var(--line);padding:7px;border-radius:8px;background:white;font-size:12px}.small{font-size:12 <script>
const DB={"modules":[{"slug":"evidenz","title":"Behauptungen vorsichtig formulieren","fa":"درجهٔ قطعیت و زبان پژوهش","skill":"Gewissheit","lesson":"در بیان علمی باید بین «پژوهش نشان داده»، «شواهد حاکی از آن است» و «اثبات شده» فرق گذاشت. واژه‌های deuten darauf hin، möglicherweise و lässt sich nicht ausschließen برای بیان محدودیت شواهد به کار می‌روند. این فصل بررسی می‌کند که کجا یک نتیجه‌گیری از داده‌ها فراتر می‌رود.","signals":["deuten auf etwas hin — حاکی از چیزی بودن","nachweisen — اثبات با شواهد","nicht zwingend — لزوماً نه","eine Einschränkung — محدودیت"],"text":"An der Universität Nordstadt untersuchte ein Team, ob kurze Lernpausen die Konzentration im Seminar beeinflussen. In acht Seminaren wurden über vier Wochen zwei Ablaufmodelle eingesetzt. In vier Seminaren gab es nach jeweils 25 Minuten eine dreiminütige Pause; die übrigen vier Seminare arbeiteten ohne festgelegte Unterbrechung. Die Teilnehmenden bearbeiteten am Ende jeder Sitzung einen kurzen Aufmerksamkeitstest. Die Gruppe mit Pausen erzielte im Mittel 72 von 100 Punkten, die Vergleichsgruppe 67 Punkte. Die Forschenden betonen jedoch, dass sich die Gruppen bereits vor Beginn der Studie in ihrer Zusammensetzung unterschieden. Zudem war die Teilnahme freiwillig. Die Ergebnisse deuten daher auf einen möglichen positiven Zusammenhang hin, erlauben aber keinen eindeutigen Nachweis einer ursächlichen Wirkung. Für eine belastbarere Aussage wären weitere Studien mit zufälliger Gruppenzuteilung erforderlich.","audio":"Die Studienleiterin erläutert: Wir haben einen kleinen Unterschied zugunsten der Gruppe mit Lernpausen beobachtet. Das ist interessant, aber noch kein Beweis dafür, dass allein die Pausen die besseren Ergebnisse verursacht haben. Vielleicht waren die Teilnehmenden dieser Gruppe bereits motivierter. Wir planen deshalb eine weitere Untersuchung mit zufälliger Zuteilung.","table":[["Gruppe","Mittelwert Aufmerksamkeitstest"],["Mit Pausen","72 / 100"],["Ohne festgelegte Pausen","67 / 100"]],"questions":[{"prompt":"Welche Aussage fasst das Ergebnis am präzisesten zusammen?","options":["Die Pausen bewirken nachweislich höhere Aufmerksamkeit.","Die Daten sprechen für einen möglichen Vorteil von Pausen, ohne die Ursache zu belegen.","Die Pausen haben keinerlei Einfluss."],"answer":1,"reasons":["این گزینه از شواهد فراتر می‌رود: تخصیص تصادفی انجام نشده و علیت اثبات نشده است.","درست: تفاوت مشاهده‌شده را حفظ می‌کند و محدودیت نتیجه‌گیری علّی را بیان می‌کند.","نادرست: تفاوتی مشاهده شده؛ «هیچ اثری» نیز اثبات نشده است."],"tag":"Gewissheit"},{"prompt":"Was bedeutet „deuten auf ... hin“ im Text?","options":["Die Ergebnisse legen etwas nahe, ohne es sicher zu beweisen.","Die Ergebnisse widerlegen jede andere Erklärung.","Die Ergebnisse garantieren eine Wirkung bei allen Studierenden."],"answer":0,"reasons":["درست: این عبارت بیانگر شواهد محتاطانه است.","غلط: پژوهش توضیح‌های جایگزین را رد نکرده است.","غلط: نتیجه برای همهٔ دانشجویان قابل تعمیم نیست."],"tag":"Gewissheit"},{"prompt":"Welche Aussage über die Gruppen ist belegt?","options":["Die Gruppen waren vor der Studie identisch.","Alle Teilnehmenden wurden zufällig aufgeteilt.","Die Gruppen unterschieden sich schon vor Untersuchungsbeginn."],"answer":2,"reasons":["غلط: خود متن اختلاف اولیهٔ گروه‌ها را گزارش کرده است.","غلط: تقسیم تصادفی پیشنهاد مطالعهٔ بعدی است.","درست: محدودیت روش‌شناختی صریحاً ذکر شده است."],"tag":"Methode"},{"prompt":"Welche Formulierung wäre wissenschaftlich angemessen?","options":["Die Untersuchung beweist die Überlegenheit jeder Lernpause.","Es lässt sich ein möglicher Zusammenhang zwischen Pausen und Testleistung erkennen.","Die Vergleichsgruppe war grundsätzlich ungeeignet."],"answer":1,"reasons":["غلط: ادعای قطعی و تعمیم ناروا است.","درست: عبارت «محتمل» و «رابطه» متناسب با داده‌هاست.","غلط: متن چنین داوری‌ای دربارهٔ اعتبار گروه ندارد."],"tag":"Register"},{"prompt":"Wie groß war der beobachtete Unterschied der Mittelwerte?","options":["Fünf Testpunkte.","Fünf Prozentpunkte bei der Teilnahmequote.","Fünfzig Testpunkte."],"answer":0,"reasons":["درست: ۷۲ منهای ۶۷ برابر ۵ امتیاز آزمون است.","غلط: جدول دربارهٔ امتیاز تمرکز است، نه نرخ مشارکت.","غلط: اختلاف مقدار ۵ است، نه ۵۰."],"tag":"Zahlen"},{"prompt":"Welche weitere Untersuchung schlägt das Team vor?","options":["Eine Untersuchung ohne Vergleichsgruppe.","Eine zufällige Zuteilung zu den Gruppen.","Die Abschaffung aller Aufmerksamkeitstests."],"answer":1,"reasons":["غلط: حذف گروه مقایسه مانع بررسی اثر مداخله می‌شود.","درست: تخصیص تصادفی می‌تواند تأثیر تفاوت‌های اولیه را کاهش دهد.","غلط: متن حذف سنجش را پیشنهاد نکرده است."],"tag":"Methode"},{"prompt":"Welche Einschränkung nennt die Studienleiterin zusätzlich?","options":["Die Testwerte wurden gar nicht erhoben.","Die Pausen dauerten jeweils 25 Minuten.","Unterschiedliche Motivation könnte die Ergebnisse beeinflusst haben."],"answer":2,"reasons":["غلط: امتیازهای آزمون ثبت شده‌اند.","غلط: فاصلهٔ کار ۲۵ دقیقه بود، خود استراحت سه دقیقه.","درست: انگیزهٔ متفاوت یک توضیح جایگزین محتمل است."],"tag":"Sprecher"},{"prompt":"Welche Schlagzeile sollte man vermeiden?","options":["Lernpausen garantiert wirksam – Kausalität bewiesen!","Kleiner Leistungsvorteil in einer Studie beobachtet.","Neue Untersuchung mit Zufallszuteilung geplant."],"answer":0,"reasons":["درست: عنوان گمراه‌کننده است؛ قطعیت و علیت اثبات نشده‌اند.","این عنوان با یافتهٔ توصیفی متناسب است و اغراق نمی‌کند.","این جمله برنامهٔ پژوهش آینده را درست بازتاب می‌دهد."],"tag":"Gewissheit"}],"writing":"Verfassen Sie einen wissenschaftlich vorsichtigen Absatz (120–160 Wörter), in dem Sie den Befund darstellen, zwei Grenzen der Untersuchung nennen und eine sinnvolle Folgestudie vorschlagen.","speaking":"Stellen Sie in 90 Sekunden die Ergebnisse vor und erläutern Sie, warum eine kausale Schlussfolgerung noch nicht möglich ist.","models":["Die Untersuchung an acht Seminaren ergab im Aufmerksamkeitstest einen Mittelwert von 72 Punkten in Gruppen mit kurzen Lernpausen und 67 Punkten in der Vergleichsgruppe. Diese Differenz deutet auf einen möglichen Zusammenhang zwischen regelmäßigen Unterbrechungen und der Konzentrationsleistung hin. Allerdings ist eine kausale Interpretation nicht gerechtfertigt: Die Gruppen unterschieden sich bereits vor Beginn der Erhebung, und die Teilnahme an der Studie erfolgte freiwillig. Auch eine unterschiedliche Motivation könnte die Ergebnisse beeinflusst haben. Eine weiterführende Untersuchung sollte die Teilnehmenden nach dem Zufallsprinzip zuweisen und die Ausgangsbedingungen genauer dokumentieren. Erst auf dieser Grundlage ließe sich zuverlässiger beurteilen, ob die Pausen selbst zu einer verbesserten Testleistung beitragen.","Die Gruppe mit Lernpausen erreichte durchschnittlich 72 Punkte, die andere Gruppe 67. Das ist ein interessanter Unterschied, aber noch kein Beweis für eine Wirkung der Pausen. Die Gruppen waren vor der Untersuchung nicht gleich zusammengesetzt. Außerdem könnten Unterschiede in der Motivation eine Rolle spielen. Daher würde ich eine neue Studie mit zufälliger Zuteilung empfehlen."],"model_fa":["پژوهش انجام‌شده در هشت سمینار نشان داد که میانگین امتیاز گروه‌های دارای استراحت کوتاه در آزمون توجه ۷۲ و در گروه مقایسه ۶۷ بود. این تفاوت می‌تواند حاکی از ارتباطی احتمالی میان وقفه‌های منظم و تمرکز باشد. بااین‌حال، تفسیر علّی آن موجه نیست: ترکیب گروه‌ها از پیش متفاوت بود و مشارکت در پژوهش داوطلبانه انجام شد. تفاوت انگیزهٔ افراد نیز ممکن است نتیجه را تغییر داده باشد. در پژوهش بعدی بهتر است افراد به‌صورت تصادفی به گروه‌ها تقسیم و شرایط اولیه دقیق‌تر ثبت شوند. تنها با این روش می‌توان مطمئن‌تر بررسی کرد که آیا خود استراحت‌ها واقعاً عملکرد را بهبود می‌دهند.","گروه دارای استراحت به‌طور متوسط ۷۲ امتیاز و گروه دیگر ۶۷ امتیاز گرفت. این تفاوت جالب است، اما هنوز اثبات نمی‌کند که خود استراحت عامل نتیجه بوده است. گروه‌ها پیش از آزمایش یکسان نبودند و انگیزهٔ متفاوت نیز می‌تواند نقش داشته باشد. بنابراین پیشنهاد می‌کنم پژوهش تازه‌ای با تقسیم تصادفی افراد انجام شود."]},{"slug":"sampling","title":"Stichproben und Reichweite","fa":"نمونه‌گیری و تعمیم‌پذیری","skill":"Methode","lesson":"نمونهٔ بزرگ الزاماً نمایندهٔ تمام جامعه نیست. باید پرسید چه کسانی دعوت شده‌اند، چه کسانی پاسخ داده‌اند و چه کسانی اصلاً امکان شرکت نداشته‌اند. Selbstselektion یعنی خودانتخابی؛ Repräsentativität یعنی نمایندگی آماری جامعه.","signals":["die Stichprobe — نمونهٔ پژوهش","repräsentativ — نمایندهٔ جامعه","sich beteiligen — مشارکت کردن","Selbstselektion — خودانتخابی"],"text":"Eine Onlinebefragung an der Hochschule Talburg sollte die Zufriedenheit mit der Universitätsbibliothek messen. Den Link erhielten 6.000 eingeschriebene Studierende per E-Mail; 960 Personen beantworteten den Fragebogen vollständig. Von ihnen gaben 78 Prozent an, mit den Öffnungszeiten zufrieden zu sein. Besonders häufig beteiligten sich Personen, die die Bibliothek mindestens dreimal pro Woche besuchten. Studierende, die selten auf dem Campus sind, antworteten dagegen deutlich seltener. Die Autorinnen berichten außerdem, dass der Fragebogen nur auf Deutsch verfügbar war. Sie warnen daher davor, den Anteil von 78 Prozent ungeprüft auf alle Studierenden zu übertragen. Als nächster Schritt ist eine gezielte Befragung bisher unterrepräsentierter Gruppen vorgesehen. Dabei soll nicht allein die Zahl der Antworten steigen, sondern vor allem die Zusammensetzung der Stichprobe verbessert werden.","audio":"Der Bibliotheksleiter sagt: Wir haben fast tausend Rückmeldungen erhalten, aber eine große Zahl allein reicht nicht. Wer die Bibliothek häufig nutzt, nimmt auch eher an einer Bibliotheksumfrage teil. Außerdem müssen wir jene berücksichtigen, die selten auf dem Campus sind oder mit einem deutschsprachigen Fragebogen Schwierigkeiten haben.","table":[["Kennzahl","Wert"],["Einladungen","6.000"],["Vollständige Antworten","960"],["Zufriedenheit unter Antwortenden","78 %"]],"questions":[{"prompt":"Welche Quote beschreibt den Rücklauf korrekt?","options":["16 Prozent der eingeladenen Personen antworteten vollständig.","78 Prozent der Eingeladenen antworteten.","6 Prozent der Eingeladenen antworteten."], :"Welche Maßnahme würde das Hauptproblem am ehesten mindern?","options":["Einladungen nur an besonders aktive Bibliotheksnutzer senden.","Nur die Antwortzahl veröffentlichen.","Bisher unterrepräsentierte Gruppen gezielt erreichen."],"answer":2,"reasons":["غلط: سوگیری را تشدید می‌کند.","غلط: تعداد بدون ترکیب نمونه مسئله را حل نمی‌کند.","درست: طرحِ پژوهش هم همین راه را برای بهبود نمایندگی نمونه پیش‌بینی کرده است."],"tag":"Methode"},{"prompt":"Was betont der Bibliotheksleiter?","options":["Fast tausend Rückmeldungen garantieren Repräsentativität.","Die Zusammensetzung der Stichprobe ist ebenso wichtig wie ihre Größe.","Nur täglich anwesende Studierende dürfen antworten."],"answer":1,"reasons":["غلط: مدیر دقیقاً این استدلال را رد کرده است.","درست: کمیت پاسخ‌ها به‌تنهایی کافی نیست.","غلط: چنین محدودیتی مطرح نشده است."],"tag":"Sprecher"},{"prompt":"Welche Formulierung ist als wissenschaftliche Überschrift geeignet?","options":["Onlineumfrage: 78 Prozent der Teilnehmenden mit Öffnungszeiten zufrieden.","Alle Studierenden feiern Öffnungszeiten der Bibliothek.","Unzufriedene Studierende wurden grundsätzlich ausgeschlossen."],"answer":0,"reasons":["درست: نتیجه را دقیقاً به پاسخ‌دهندگان محدود می‌کند.","غلط: هم تعمیم نارواست هم زبان غیرعلمی دارد.","غلط: متن می‌گوید گروه‌هایی کمتر پاسخ داده‌اند، نه اینکه عمداً حذف شده‌اند."],"tag":"Register"}],"writing":"Fassen Sie die Befragung in 120–160 Wörtern zusammen. Erläutern Sie die Verzerrung und schlagen Sie zwei konkrete Verbesserungen für eine Folgestudie vor.","speaking":"Erklären Sie in 90 Sekunden, weshalb eine große Stichprobe nicht automatisch repräsentativ ist. Verwenden Sie das Beispiel der Bibliotheksbefragung.","models":["Von 6.000 eingeladenen Studierenden beantworteten 960 den Onlinefragebogen vollständig. Unter den Antwortenden waren 78 Prozent mit den Bibliotheksöffnungszeiten zufrieden. Obwohl die Zahl der Rückmeldungen relativ groß ist, darf das Ergebnis nicht ohne Weiteres auf alle Studierenden übertragen werden. Personen mit häufigen Bibliotheksbesuchen waren überrepräsentiert, während selten anwesende Studierende seltener teilnahmen. Außerdem stand der Fragebogen ausschließlich auf Deutsch zur Verfügung. Für eine Folgestudie wäre es sinnvoll, bisher wenig erreichte Gruppen gezielt einzuladen und den Fragebogen mehrsprachig anzubieten. Entscheidend ist nicht nur eine höhere Beteiligung, sondern eine ausgewogenere Zusammensetzung der Stichprobe.","Fast tausend Personen haben an der Bibliotheksbefragung teilgenommen. Trotzdem ist die Studie nicht automatisch repräsentativ. Menschen, die die Bibliothek häufig besuchen, haben eher geantwortet. Studierende, die selten auf dem Campus sind, wurden schlechter erreicht. Deshalb sollten wir von der Zufriedenheit der Antwortenden sprechen und nicht von der aller Studierenden."],"model_fa":["از میان ۶۰۰۰ دانشجوی دعوت‌شده، ۹۶۰ نفر پرسش‌نامهٔ آنلاین را کامل پاسخ دادند. ۷۸ درصد پاسخ‌دهندگان از ساعت‌های کتابخانه رضایت داشتند. با وجود تعداد نسبتاً زیاد پاسخ‌ها، نمی‌توان این نتیجه را بی‌بررسی به همهٔ دانشجویان تعمیم داد. کسانی که بیشتر به کتابخانه می‌رفتند بیش‌ازحد در نمونه حضور داشتند و دانشجویانی که کمتر در دانشگاه حاضر می‌شدند کمتر شرکت کردند. پرسش‌نامه فقط به آلمانی نیز ارائه شده بود. برای بررسی بعدی بهتر است گروه‌های کمترنمایان به‌شکل هدفمند دعوت شوند و پرسش‌نامه چندزبانه باشد. مهم فقط افزایش تعداد پاسخ‌ها نیست، بلکه متعادل‌ترشدن ترکیب نمونه است.","تقریباً هزار نفر در نظرسنجی کتابخانه شرکت کردند، اما این تعداد زیاد لزوماً نمونه را نمایندهٔ همه نمی‌کند. استفاده‌کنندگان پرتکرار بیشتر پاسخ داده‌اند و کسانی که کمتر به دانشگاه می‌آیند کمتر دیده شده‌اند. بنابراین باید دربارهٔ رضایت پاسخ‌دهندگان حرف بزنیم، نه رضایت همهٔ دانشجویان."]},{"slug":"statistics","title":"Prozent, Prozentpunkte und Bezugsgrößen","fa":"درصد، واحد درصد و مخرج کسر","skill":"Zahlen","lesson":"در پژوهش‌های دانشگاهی، یک افزایش از ۲۰٪ به ۳۰٪ معادل ۱۰ واحد درصد و افزایش نسبی ۵۰٪ است. تغییر گروه مبنا نیز می‌تواند نتایج ظاهراً مشابه را غیرقابل‌مقایسه کند. هر بار بپرس: «از چند نفر؟ در چه بازه‌ای؟ با کدام تعریف؟»","signals":["der Anteil — سهم","die Prozentpunkte — واحد درصد","die Bezugsgröße — مبنای محاسبه","absolut/relativ — مطلق/نسبی"],"text":"Die Hochschule Riedlingen hat zwei Semester lang die Nutzung eines freiwilligen Online-Tutoriums beobachtet. Im Wintersemester waren 200 von 800 Erstsemesterstudierenden angemeldet; im Sommersemester waren es 330 von 1.100. Die Zahl der Anmeldungen stieg somit um 130, während der Anteil der Angemeldeten von 25 auf 30 Prozent zunahm. Die Hochschulleitung bezeichnete dies in einer ersten Mitteilung als „deutlichen Zuwachs um fünf Prozent“. Die Evaluationsstelle wies darauf hin, dass diese Formulierung mehrdeutig sei. Korrekt sei eine Zunahme um fünf Prozentpunkte beziehungsweise relativ um 20 Prozent. Zudem habe sich die Gesamtzahl der Studierenden verändert. Um zu beurteilen, ob das Tutorium tatsächlich bessere Lernleistungen ermöglicht, reichen Nutzungszahlen allein nicht aus; dafür müssten Lernergebnisse vergleichbar erhoben werden.","audio":"Die Evaluatorin erklärt: Wir unterscheiden zwischen absoluten Anmeldungen und dem prozentualen Anteil. Die Anmeldungen nahmen von zweihundert auf dreihundertdreißig zu. Der Anteil stieg von fünfundzwanzig auf dreißig Prozent. Das sind fünf Prozentpunkte, aber relativ gesehen zwanzig Prozent mehr. Aus der Nutzung allein können wir keinen Lernerfolg ableiten.","table":[["Semester","Studierende","Tutorium angemeldet","Anteil"],["Winter","800","200","25 %"],["Sommer","1.100","330","30 %"]],"questions":[{"prompt":"Um wie viele Prozentpunkte stieg der Anteil?","options":["Um fünf Prozentpunkte.","Um zwanzig Prozentpunkte.","Um einhundertdreißig Prozentpunkte."],"answer":0,"reasons":["درست: ۳۰٪ منهای ۲۵٪ برابر ۵ واحد درصد است.","غلط: ۲۰٪ افزایش نسبی سهم است، نه واحد درصد.","غلط: ۱۳۰ افزایش تعداد ثبت‌نام است، نه واحد درصد."],"tag":"Zahlen"},{"prompt":"Wie hoch war der relative Anstieg des Anteils?","options":["Fünf Prozent.","Zwanzig Prozent.","Fünfzig Prozent."],"answer":1,"reasons":["غلط: پنج واحد درصد با رشد نسبی پنج درصد فرق دارد.","درست: ۵ تقسیم بر ۲۵ برابر ۰٫۲ یا ۲۰٪ است.","غلط: نسبت افزایش ۵ به مقدار پایه ۲۵ برابر ۵۰٪ نیست."],"tag":"Zahlen"},{"prompt":"Wie viele zusätzliche Anmeldungen wurden gezählt?","options":["110","500","130"],"answer":2,"reasons":["غلط: ۱۱۰ اختلاف تعداد کل افراد است؟ در واقع افزایش کل دانشجویان ۳۰۰ است.","غلط: عدد ۵۰۰ از جدول حاصل نمی‌شود.","درست: ۳۳۰ منهای ۲۰۰ برابر ۱۳۰ است."],"tag":"Zahlen"},{"prompt":"Welche Aussage ist durch die Daten nicht gedeckt?","options":["Das Tutorium führte nachweislich zu besseren Prüfungsleistungen.","Im Sommer waren insgesamt mehr Erstsemester eingeschrieben.","Der Anteil der Angemeldeten war im Sommer höher."],"answer":0,"reasons":["درست: این ادعا پشتیبانی ندارد؛ داده‌ها دربارهٔ استفاده‌اند، نه عملکرد تحصیلی.","درست است: تعداد کل از ۸۰۰ به ۱۱۰۰ رسید.","درست است: سهم از ۲۵٪ به ۳۰٪ رسید."],"tag":"Kausalitaet"},{"prompt":"Was kritisiert die Evaluationsstelle an „Zuwachs um fünf Prozent“?","options":["Die Anmeldungen seien tatsächlich gesunken.","Es bleibt unklar, ob Prozent oder Prozentpunkte gemeint sind.","Eine Prozentangabe darf niemals verwendet werden."],"answer":1,"reasons":["غلط: تعداد و سهم هر دو بالا رفتند.","درست: ابهام واحد تغییر را مشخص نمی‌کند.","غلط: درصد قابل‌استفاده است، به شرط تعریف روشن."],"tag":"Register"},{"prompt":"Welche Bezugsgröße steht hinter dem Sommeranteil?","options":["Die 200 Winteranmeldungen.","Die 330 Anmeldungen im Sommer.","Die 1.100 Studierenden im Sommersemester."],"answer":2,"reasons":["غلط: ۲۰۰ صورتِ نسبت زمستان است.","غلط: ۳۳۰ صورتِ کسر تابستان است، نه مخرج.","درست: ۳۳۰ تقسیم بر ۱۱۰۰ برابر ۳۰٪ است."],"tag":"Zahlen"},{"prompt":"Was wäre für einen Wirksamkeitsnachweis zusätzlich nötig?","options":["Vergleichbare Angaben zu Lernergebnissen.","Eine reine Auflistung weiterer Anmeldungen.","Eine farbigere Darstellung derselben Tabelle."],"answer":0,"reasons":["درست: شاخص نتیجهٔ آموزشی مستقل از شاخص استفاده لازم است.","غلط: ثبت‌نام بیشتر اثربخشی آموزشی را ثابت نمی‌کند.","غلط: شکل ظاهری نمودار دادهٔ علّی ایجاد نمی‌کند."],"tag":"Methode"},{"prompt":"Welcher Satz ist statistisch präzise?","options":["Das Tutorium wurde um 130 Prozentpunkte beliebter.","Die Teilnahmequote stieg von 25 auf 30 Prozent, also um fünf Prozentpunkte.","Die Quote verdoppelte sich zwischen den Semestern."],"answer":1,"reasons":["غلط: ۱۳۰ تعداد ثبت‌نام‌های اضافه است.","درست: سطح اولیه و نهایی و تفاوت واحد درصد روشن‌اند.","غلط: دوبرابر شدن از ۲۵ به ۵۰ درصد بود، نه ۳۰."],"tag":"Register"}],"writing":"Verfassen Sie einen Absatz (120–160 Wörter), in dem Sie die absoluten und relativen Änderungen präzise erläutern. Grenzen Sie Nutzung vom nachgewiesenen Lernerfolg ab.","speaking":"Erklären Sie in 90 Sekunden den Unterschied zwischen Prozent und Prozentpunkten an der Tabelle und nennen Sie eine Grenze der Daten.","models":["Im Wintersemester nutzten 200 von 800 Erstsemesterstudierenden das freiwillige Online-Tutorium; im Sommersemester waren es 330 von 1.100. Die absolute Zahl der Anmeldungen erhöhte sich daher um 130. Gleichzeitig stieg die Teilnahmequote von 25 auf 30 Prozent, was einer Zunahme um fünf Prozentpunkte entspricht. Bezogen auf den Ausgangswert ist dies ein relativer Anstieg um 20 Prozent. Die Formulierung „fünf Prozent mehr“ wäre ohne nähere Angabe missverständlich. Zudem veränderte sich die Gesamtzahl der Erstsemesterstudierenden zwischen den Semestern. Aus höheren Anmeldezahlen lässt sich nicht schließen, dass das Tutorium die Prüfungsleistungen verbessert hat. Um seine Wirksamkeit zu beurteilen, müssten zusätzlich vergleichbare Lernergebnisse erhoben werden.","Die Anmeldungen stiegen von 200 auf 330. Das sind 130 zusätzliche Anmeldungen. Der Anteil erhöhte sich von 25 auf 30 Prozent, also um fünf Prozentpunkte. Relativ zum Anfangswert von 25 Prozent entspricht das einer Steigerung um 20 Prozent. Wichtig ist aber, dass diese Daten nur die Nutzung zeigen, nicht den Lernerfolg."],"model_fa":["در زمستان، ۲۰۰ نفر از ۸۰۰ دانشجوی ترم اول از سامانهٔ کمک‌آموزشی آنلاین استفاده کردند؛ در تابستان این تعداد ۳۳۰ نفر از ۱۱۰۰ نفر بود. در نتیجه شمار مطلق ثبت‌نام‌ها ۱۳۰ نفر افزایش یافت. هم‌زمان نرخ مشارکت از ۲۵ به ۳۰ درصد رسید، یعنی پنج واحد درصد افزایش. نسبت به مقدار اولیه، این رشد نسبی ۲۰ درصد است. عبارت «پنج درصد بیشتر» بدون توضیح می‌تواند گمراه‌کننده باشد. از سوی دیگر، تعداد کل دانشجویان دو ترم نیز متفاوت است. از تعداد بیشتر ثبت‌نام نمی‌توان نتیجه گرفت که سامانه عملکرد امتحانی را بهتر کرده است. برای سنجش اثربخشی باید نتایج یادگیری را نیز به‌صورت قابل‌مقایسه ثبت کرد.","ثبت‌نام‌ها از ۲۰۰ به ۳۳۰ رسیدند؛ یعنی ۱۳۰ ثبت‌نام بیشتر. سهم مشارکت نیز از ۲۵ درصد به ۳۰ درصد افزایش یافت که برابر پنج واحد درصد است. نسبت به مقدار اولیهٔ ۲۵ درصد، این یک افزایش نسبی ۲۰درصدی است. بااین‌حال، این ارقام فقط میزان استفاده را نشان می‌دهند و موفقیت آموزشی را ثابت نمی‌کنند."]},{"slug":"time","title":"Zeitreihen und Prognosen","fa":"روند زمانی و پیش‌بینی","skill":"Zeit","lesson":"روندهای زمانی با نوسان کوتاه‌مدت، پیش‌بینی و دادهٔ تحقق‌یافته تفاوت دارند. برای تحلیل علمی müssen، planen و werden voraussichtlich نباید به یک سطح قطعیت تبدیل شوند. در یک جدول نیز دوره‌های پایه و افق پیش‌بینی را جدا نگه دار.","signals":["voraussichtlich — احتمالاً طبق پیش‌بینی","gegenüber dem Vorjahr — در مقایسه با سال قبل","vorläufig — مقدماتی","die Prognose — پیش‌بینی"],"text":"Eine Hochschule veröffentlicht jedes Jahr Zahlen zu ihren internationalen Austauschplätzen. In den Jahren 2022 und 2023 wurden 420 beziehungsweise 460 Plätze tatsächlich vergeben. Für 2024 waren zunächst 520 Plätze vorgesehen; aufgrund geringerer Fördermittel wurden letztlich 480 vergeben. Für 2025 liegt bisher nur ein Planwert von 550 Plätzen vor. Die Verwaltung weist darauf hin, dass eine hohe geplante Zahl nicht automatisch eine gleich hohe tatsächliche Vergabe bedeutet. In einer Präsentation stellte ein Studierendenvertreter die Werte von 2022 bis 2025 als durchgehend realisierten Zuwachs dar. Die Statistikstelle korrigierte die Darstellung: Zwischen 2023 und 2024 habe es zwar einen moderaten Anstieg der tatsächlichen Vergaben gegeben, für 2025 liege aber noch kein Ist-Wert vor. Deshalb könne die Entwicklung bis 2025 nicht als gesicherte Zeitreihe dargestellt werden.","audio":"Die Mitarbeiterin der Statistikstelle erklärt: Für 2024 waren 520 Plätze geplant, tatsächlich wurden 480 vergeben. Der neue Wert für 2025 ist wieder nur ein Planwert. Wir sollten deshalb nicht behaupten, die Plätze seien bereits auf 550 gestiegen. Die tatsächliche Vergabe kennen wir erst nach Abschluss des Jahres.","table":[["Jahr","Planplätze","Tatsächlich vergeben"],["2022","—","420"],["2023","—","460"],["2024","520","480"],["2025","550","noch unbekannt"]],"questions":[{"prompt":"Was ist für 2025 bekannt?","options":["550 Plätze wurden bereits vergeben.","550 Plätze sind geplant; die tatsächliche Vergabe steht aus.","Die Vergabe sank sicher auf 480 Plätze."],"answer":1,"reasons":["غلط: ۵۵۰ مقدار برنامه‌ریزی‌شده است، نه تحقق‌یافته.","درست: Planwert را از Ist-Wert جدا می‌کند.","غلط: رقم ۴۸۰ مربوط به تحقق سال ۲۰۲۴ است."],"tag":"Zeit"},{"prompt":"Wie veränderte sich die tatsächliche Vergabe von 2023 zu 2024?","options":["Sie stieg um 20 Plätze.","Sie sank um 40 Plätze.","Sie stieg um 90 Plätze."],"answer":0,"reasons":["درست: ۴۸۰ منهای ۴۶۰ برابر ۲۰ است.","غلط: ۴۰ تفاوت طرح ۵۲۰ با تحقق ۴۸۰ در ۲۰۲۴ است.","غلط: ۹۰ از داده‌های تحقق‌یافته به دست نمی‌آید."],"tag":"Zahlen"},{"prompt":"Wie groß war 2024 die Abweichung vom Plan?","options":["Die Vergabe übertraf den Plan um 40 Plätze.","Plan und Ist waren identisch.","Es wurden 40 Plätze weniger vergeben als vorgesehen."],"answer":2,"reasons":["غلط: مقدار واقعی کمتر از هدف بود.","غلط: ۵۲۰ با ۴۸۰ برابر نیست.","درست: ۵۲۰ منهای ۴۸۰ برابر ۴۰ است."],"tag":"Zahlen"},{"prompt":"Warum war die Darstellung des Vertreters irreführend?","options":["Weil die Jahre 2022 und 2023 keine Werte enthalten.","Weil ein Planwert als bereits realisierte Entwicklung dargestellt wurde.","Weil die Austauschplätze im Jahr 2024 vollständig wegfielen."],"answer":1,"reasons":["غلط: هر دو سال عدد تحقق‌یافته دارند.","درست: ادعای رشد مستمر تا ۲۰۲۵، Plan را با Ist مخلوط کرده است.","غلط: ۴۸۰ جایگاه واقعاً واگذار شده‌اند."],"tag":"Zeit"},{"prompt":"Welche Aussage über 2024 stimmt?","options":["Weniger Fördermittel reduzierten die tatsächlich vergebenen Plätze gegenüber dem ursprünglichen Plan.","Die geplante Zahl stieg erst nach der Vergabe.","Die Finanzierungsbedingungen hatten laut Text keinerlei Bedeutung."],"answer":0,"reasons":["درست: علت کاهش نسبت به برنامه مشخصاً کمبود حمایت مالی ذکر شده است.","غلط: متن چنین توالی‌ای را گزارش نمی‌کند.","غلط: کاهش Fördermittel به‌صراحت آمده است."],"tag":"Kausalitaet"},{"prompt":"Welche Grafikbeschriftung wäre korrekt?","options":["Internationale Plätze 2022–2025: tatsächliche Vergabe.","Alle Werte bis 2025 sind gesichert.","Ist-Werte 2022–2024 und Planwert 2025."],"answer":2,"reasons":["غلط: سال ۲۰۲۵ دادهٔ واقعی ندارد.","غلط: مقدار ۲۰۲۵ قطعی نیست.","درست: اطلاعات محقق‌شده و پیش‌بینی را شفاف جدا می‌کند."],"tag":"Register"},{"prompt":"Was sagt die Statistikstelle ausdrücklich?","options":["2025 werden sicher weniger Plätze als 2024 vergeben.","Die tatsächliche Zahl für 2025 lässt sich noch nicht angeben.","550 Plätze sind bereits vertraglich vergeben."],"answer":1,"reasons":["غلط: پیش‌بینی منفی قطعی مطرح نشده است.","درست: رقم نهایی ۲۰۲۵ هنوز معلوم نیست.","غلط: ۵۵۰ صرفاً هدف برنامه است."],"tag":"Sprecher"},{"prompt":"Welche Schlussfolgerung ist zulässig?","options":["Die tatsächlich vergebenen Plätze nahmen 2022 bis 2024 insgesamt zu.","Die Vergabe verdoppelte sich bis 2025.","Seit 2022 wurde jedes Planungsziel erreicht."],"answer":0,"reasons":["درست: ۴۲۰→۴۶۰→۴۸۰ در سال‌های دارای دادهٔ واقعی افزایش یافته است.","غلط: ۲۰۲۵ مقدار تحقق ندارد و دوبرابرشدن هم دیده نمی‌شود.","غلط: در ۲۰۲۴ هدف برنامه محقق نشده است."],"tag":"Zeit"}],"writing":"Schreiben Sie 120–160 Wörter zu der Zeitreihe. Kennzeichnen Sie Plan- und Ist-Werte korrekt und erläutern Sie eine Grenze von Prognosen.","speaking":"Erklären Sie in 90 Sekunden, warum die Zahl für 2025 nicht mit den Vorjahres-Ist-Werten als gesicherter Trend verglichen werden darf.","models":["Die Zahl der tatsächlich vergebenen internationalen Austauschplätze stieg von 420 im Jahr 2022 auf 460 im Jahr 2023 und 480 im Jahr 2024. Für 2024 waren ursprünglich 520 Plätze vorgesehen; die tatsächliche Vergabe lag wegen geringerer Fördermittel um 40 Plätze darunter. Für 2025 nennt die Verwaltung einen Planwert von 550 Plätzen, aber noch keine endgültige Zahl. Deshalb sollte eine grafische Darstellung die Ist-Werte von 2022 bis 2024 klar vom Planwert für 2025 unterscheiden. Die Behauptung eines bereits realisierten Anstiegs auf 550 Plätze wäre irreführend. Ob die geplante Ausweitung erreicht wird, hängt unter anderem von der Finanzierung und den tatsächlich verfügbaren Plätzen ab.","Von 2022 bis 2024 stieg die tatsächliche Zahl der Austauschplätze schrittweise von 420 auf 480. Im Jahr 2024 lag der Wert aber unter dem Plan. Für 2025 gibt es bisher nur einen Planwert von 550. Daher darf man nicht sagen, die Hochschule habe 2025 bereits 550 Plätze vergeben. Eine Prognose ist eben kein abgeschlossenes Ergebnis."],"model_fa":["شمار واقعی فرصت‌های تبادل بین‌المللی از ۴۲۰ در سال ۲۰۲۲ به ۴۶۰ در سال ۲۰۲۳ و ۴۸۰ در سال ۲۰۲۴ رسید. قرار بود برای ۲۰۲۴ تعداد ۵۲۰ فرصت ایجاد شود، اما به علت کاهش منابع مالی، مقدار واقعی ۴۰ مورد کمتر بود. برای سال ۲۰۲۵، مدیریت تنها رقم برنامه‌ریزی‌شدهٔ ۵۵۰ را اعلام کرده است و هنوز رقم قطعی وجود ندارد. بنابراین نمودار باید آمار واقعی سال‌های ۲۰۲۲ تا ۲۰۲۴ را به‌وضوح از هدف سال ۲۰۲۵ جدا کند. ادعای تحقق افزایش تا ۵۵۰ فرصت گمراه‌کننده خواهد بود. دستیابی به برنامه به منابع مالی و ظرفیت‌های واقعاً موجود وابسته است.","از ۲۰۲۲ تا ۲۰۲۴ تعداد فرصت‌های واقعی از ۴۲۰ به ۴۸۰ افزایش یافت، اما در سال ۲۰۲۴ از برنامه عقب ماند. برای سال ۲۰۲۵ فقط هدف ۵۵۰ فرصت اعلام شده است. بنابراین نمی‌توان گفت دانشگاه همین حالا ۵۵۰ فرصت واگذار کرده است. پیش‌بینی با نتیجهٔ تحقق‌یافته فرق دارد."]},{"slug":"perspectives","title":"Positionen korrekt zuordnen","fa":"نسبت‌دادن موضع‌ها و اختلاف نظر","skill":"Sprecher","lesson":"در گزارش اختلاف نظر، مهم است که «چه کسی چه چیزی را با چه شرطی گفته» حفظ شود. indirekte Rede (گفتار غیرمستقیم)، während (درحالی‌که) و hingegen (در مقابل) کمک می‌کنند دیدگاه‌ها را بدون تحریف مقایسه کنی.","signals":["hingegen — در مقابل","während — در حالی که","einwenden — ایراد گرفتن","die Stellungnahme — موضع‌گیری"],"text":"Eine Universität diskutiert die Einführung einer digitalen Anwesenheitserfassung. Die Vizepräsidentin für Studium, Dr. Hoffmann, sieht darin vor allem einen organisatorischen Vorteil: Lehrende könnten die Teilnahme an verpflichtenden Laborveranstaltungen schneller dokumentieren. Sie fordert jedoch, dass Daten spätestens nach dem jeweiligen Semester gelöscht werden. Der Studierendenrat spricht sich gegen eine allgemeine Erfassung in Vorlesungen aus. Seine Sprecherin, Aylin Kaya, befürchtet, dass aus einer technischen Vereinfachung ein unangemessener Kontrolldruck entstehen könnte. Bei sicherheitsrelevanten Laboren hält sie eine Dokumentation dagegen grundsätzlich für nachvollziehbar. Der Datenschutzbeauftragte, Herr Weber, weist auf einen dritten Aspekt hin: Eine technische Lösung sei erst dann vertretbar, wenn ein konkreter Zweck definiert und geprüft sei, welche Daten tatsächlich benötigt würden. Er äußert sich nicht grundsätzlich gegen jedes digitale System. Eine Entscheidung soll erst nach einer Datenschutzprüfung und einer Anhörung der Fachbereiche fallen.","audio":"In der Diskussion sagt Hoffmann: Bei Laboren kann eine digitale Erfassung Verwaltungsarbeit reduzieren, aber die Daten dürfen nicht dauerhaft gespeichert werden. Kaya antwortet: Eine pauschale Erfassung in Vorlesungen lehnen wir ab; bei sicherheitsrelevanten Laboren verstehen wir die Dokumentationspflicht. Weber ergänzt: Entscheidend sind Zweckbindung und Datensparsamkeit, nicht die Technik allein.","table":[["Person","Schwerpunkt"],["Hoffmann","Organisation + Löschung"],["Kaya","Keine allgemeine Vorlesungskontrolle"],["Weber","Zweckbindung + Datensparsamkeit"]],"questions":[{"prompt":"Wer fordert ausdrücklich die Löschung nach dem Semester?","options":["Aylin Kaya.","Herr Weber.","Dr. Hoffmann."],"answer":2,"reasons":["غلط: کایا دربارهٔ نظارت عمومی موضع دارد.","غلط: وبر بر هدف و کمینه‌سازی داده تأکید دارد.","درست: شرط حذف داده بعد از ترم به هوفمان نسبت داده شده است."],"tag":"Sprecher"},{"prompt":"Welche Position vertritt der Studierendenrat?","options":["Er lehnt eine allgemeine Kontrolle in Vorlesungen ab, hält Labordokumentation aber für nachvollziehbar.","Er fordert die Abschaffung sämtlicher Laborkontrollen.","Er begrüßt die Speicherung aller Anwesenheitsdaten ohne Begrenzung."],"answer":0,"reasons":["درست: مخالفت با رصد همگانی، نه رد همهٔ ثبت‌های آزمایشگاهی.","غلط: استثنای آزمایشگاه در موضع دانشجویان مطرح شده است.","غلط: پذیرش ذخیرهٔ نامحدود وجود ندارد."],"tag":"Sprecher"},{"prompt":"Was ist für Weber entscheidend?","options":["Möglichst viele Daten zu sammeln.","Vor der technischen Lösung Zweck und Datenbedarf zu bestimmen.","Die verpflichtende Einführung in allen Veranstaltungen."],"answer":1,"reasons":["غلط: با اصل Datensparsamkeit مغایر است.","درست: Zweckbindung و حداقل‌گرایی اطلاعات دو اصل گفته‌شده‌اند.","غلط: وبر از اجرای اجباری عمومی حمایت نکرده است."],"tag":"Bedingung"},{"prompt":"Welche Aussage über Hoffmann ist korrekt?","options":["Sie fordert die vollständige Abschaffung von Laboren.","Sie sieht keinen organisatorischen Nutzen.","Sie sieht einen Nutzen, verlangt aber eine zeitliche Begrenzung der Speicherung."],"answer":2,"reasons":["غلط: متن دربارهٔ حذف آزمایشگاه‌ها نیست.","غلط: او فایدهٔ اجرایی را صریحاً بیان کرده است.","درست: موضع او دو بخش دارد؛ فایده و شرط."],"tag":"Sprecher"},{"prompt":"Welche Formulierung gibt die Debatte neutral wieder?","options":["Alle Beteiligten halten Datensammlung für unproblematisch.","Während Hoffmann organisatorische Vorteile sieht, warnt Kaya vor allgemeinem Kontrolldruck.","Weber verlangt ausnahmslos analoge Listen."],"answer":1,"reasons":["غلط: اختلاف نظر و محدودیت‌های حریم خصوصی حذف شده‌اند.","درست: تضاد دیدگاه‌ها را بدون اغراق بیان می‌کند.","غلط: وبر همهٔ راهکارهای دیجیتال را رد نکرده است."],"tag":"Register"},{"prompt":"Was muss vor einer endgültigen Entscheidung erfolgen?","options":["Eine Datenschutzprüfung und eine Anhörung der Fachbereiche.","Die sofortige Speicherung aller Daten.","Eine Abstimmung nur unter Laborleitern."],"answer":0,"reasons":["درست: هر دو گام در پایان متن ذکر شده است.","غلط: تصمیم هنوز گرفته نشده است.","غلط: شنیدن نظر بخش‌های مختلف لازم است، نه فقط مدیران آزمایشگاه."],"tag":"Zeit"},{"prompt":"Was bedeutet „nicht grundsätzlich gegen jedes digitale System“?","options":["Weber ist uneingeschränkt dafür.","Weber fordert, niemals digitale Systeme zu nutzen.","Weber schließt eine datenschutzgerechte digitale Lösung nicht aus."],"answer":2,"reasons":["غلط: عدم مخالفت مطلق برابر تأیید بدون شرط نیست.","غلط: متن دقیقاً این مخالفت مطلق را نفی کرده است.","درست: با رعایت شرایط، امکان پذیرش وجود دارد."],"tag":"Gewissheit"},{"prompt":"Welche Aussage verfälscht eine Sprecherposition?","options":["Hoffmann will eine begrenzte Speicherdauer.","Kaya fordert die lückenlose Kontrolle sämtlicher Vorlesungen.","Weber verlangt die Prüfung der benötigten Daten."],"answer":1,"reasons":["درست است و موضع هوفمان را حفظ می‌کند.","درست به‌عنوان پاسخ سؤال: موضع کایا را وارونه می‌کند.","درست است و نظر وبر را بازگو می‌کند."],"tag":"Sprecher"}],"writing":"Fassen Sie die drei Positionen neutral in 120–160 Wörtern zusammen und nennen Sie eine sachgerechte Bedingung für eine mögliche Entscheidung.","speaking":"Stellen Sie in 90 Sekunden die Positionen von Hoffmann, Kaya und Weber dar. Achten Sie darauf, dass keine Position übertrieben wird.","models":["In der Debatte über eine digitale Anwesenheitserfassung werden unterschiedliche Interessen sichtbar. Dr. Hoffmann betont die organisatorischen Vorteile bei verpflichtenden Laborveranstaltungen, verlangt jedoch die Löschung der Daten nach dem jeweiligen Semester. Der Studierendenrat warnt dagegen vor einem allgemeinen Kontrolldruck in Vorlesungen. Seine Sprecherin Kaya hält eine Dokumentation bei sicherheitsrelevanten Laboren grundsätzlich für nachvollziehbar. Datenschutzbeauftragter Weber fordert, dass vor der Einführung ein konkreter Zweck festgelegt und die Notwendigkeit einzelner Daten geprüft wird. Er lehnt digitale Lösungen nicht pauschal ab. Eine sachgerechte Entscheidung sollte daher die Ergebnisse der Datenschutzprüfung sowie die Stellungnahmen der Fachbereiche berücksichtigen und zwischen unterschiedlichen Veranstaltungsformen unterscheiden.","Hoffmann sieht Vorteile für die Organisation von Laboren, will die Daten aber am Semesterende löschen. Kaya lehnt eine allgemeine Kontrolle in Vorlesungen ab, versteht jedoch eine Dokumentation in sicherheitsrelevanten Laboren. Weber möchte vor allem den Zweck und den notwendigen Datenumfang klären. Keiner dieser drei Standpunkte ist einfach nur uneingeschränkt für oder gegen Digitalisierung."],"model_fa":["در بحث ثبت دیجیتال حضور، منافع و دغدغه‌های متفاوتی وجود دارد. خانم دکتر هوفمان بر مزایای اجرایی در آزمایشگاه‌های اجباری تأکید دارد، اما می‌خواهد اطلاعات پس از همان ترم پاک شوند. شورای دانشجویان دربارهٔ ایجاد فشار نظارتی عمومی در کلاس‌های نظری هشدار می‌دهد؛ نمایندهٔ آن، کایا، ثبت حضور در آزمایشگاه‌های حساس از نظر ایمنی را قابل‌درک می‌داند. مسئول حفاظت از داده‌ها، وبر، می‌خواهد پیش از اجرا هدف مشخص شود و نیاز واقعی به هر نوع داده بررسی شود. او همهٔ راهکارهای دیجیتال را به‌صورت مطلق رد نمی‌کند. تصمیم مناسب باید به نتیجهٔ بررسی حریم خصوصی و نظرات بخش‌های دانشگاه توجه کند و میان انواع کلاس تفاوت بگذارد.","هوفمان برای ادارهٔ آزمایشگاه‌ها فایده می‌بیند، اما می‌خواهد داده‌ها پایان ترم حذف شوند. کایا با کنترل عمومی کلاس‌های نظری مخالف است و ثبت حضور در آزمایشگاه‌های حساس را قابل‌فهم می‌داند. وبر می‌خواهد هدف ثبت و میزان اطلاعات لازم روشن شود. هیچ‌کدام صرفاً طرفدار یا مخالف مطلق دیجیتالی‌سازی نیستند."]},{"slug":"tradeoffs","title":"Maßnahmen und Zielkonflikte","fa":"ارزیابی اقدامات و مصالحه میان هدف‌ها","skill":"Argumentation","lesson":"در ارزیابی یک اقدام، باید مزیت را به شرایط اجرایی و هزینهٔ فرصت ربط بدهی. Zielkonflikt یعنی تعارض دو هدف مطلوب؛ Verhältnismäßigkeit یعنی تناسب اقدام با هدف. از «همیشه خوب/همیشه بد» فاصله بگیر.","signals":["der Zielkonflikt — تعارض هدف‌ها","verhältnismäßig — متناسب","die Umsetzung — اجرا","unter der Voraussetzung — با این شرط که"],"text":"Die Stadt Lichtenfeld prüft die Einführung eines vergünstigten Semestertickets für Berufspendlerinnen und Studierende. Die Verkehrsbetriebe erwarten, dass ein günstigeres Ticket mehr Menschen zum Umstieg auf Bus und Bahn bewegt. Die Finanzverwaltung warnt jedoch vor jährlichen Mehrkosten von rund 1,8 Millionen Euro. Eine Hochschulgruppe schlägt vor, das Angebot zunächst ein Jahr lang in zwei Stadtteilen zu testen. Dabei sollen Fahrgastzahlen, Zufriedenheit und tatsächliche Betriebskosten erhoben werden. Der Verkehrsdezernent unterstützt einen Pilotversuch, sofern zusätzliche Busverbindungen in den Hauptverkehrszeiten finanziert werden können. Andernfalls könnte das Ticket zwar günstiger sein, gleichzeitig aber zu einer Überlastung bestehender Linien führen. Die Entscheidung über eine dauerhafte Einführung soll von den Ergebnissen der Pilotphase abhängen.","audio":"Die Hochschulvertreterin sagt: Wir möchten zuerst wissen, wer das Ticket tatsächlich nutzt und ob der öffentliche Verkehr attraktiver wird. Der Dezernent ergänzt: Ein günstiger Preis genügt nicht; wenn die Busse zu voll werden, ist niemandem geholfen. Deshalb brauchen wir die Möglichkeit, das Angebot während der Testphase anzupassen.","table":[["Aspekt","Angabe"],["Geschätzte Mehrkosten jährlich","1,8 Mio. €"],["Vorgeschlagene Pilotdauer","1 Jahr"],["Pilotgebiet","2 Stadtteile"]],"questions":[{"prompt":"Welchen Zielkonflikt beschreibt der Text?","options":["Günstigere Tickets können zusätzliche Kosten und Kapazitätsprobleme auslösen.","Das Ticket führt nachweislich zu weniger Fahrgästen.","Die Kosten sind null, sobald mehr Menschen fahren."],"answer":0,"reasons":["درست: دسترس‌پذیری بهتر با هزینه و ظرفیت در تعارض قرار می‌گیرد.","غلط: چنین نتیجه‌ای گزارش نشده، صرفاً افزایش استفاده انتظار می‌رود.","غلط: درآمد و هزینه به این سادگی خنثی نمی‌شوند."],"tag":"Argumentation"},{"prompt":"Welche Bedingung nennt der Verkehrsdezernent?","options":["Die Abschaffung aller Buslinien.","Die Finanzierung zusätzlicher Verbindungen zu Stoßzeiten.","Die sofortige unbefristete Einführung."],"answer":1,"reasons":["غلط: او خواستار افزایش سرویس است، نه حذف.","درست: شرط حمایت او تأمین ظرفیت اضافی در ساعات اوج است.","غلط: او از آزمایش محدود حمایت می‌کند."],"tag":"Bedingung"},{"prompt":"Wie lange soll der Pilotversuch dauern?","options":["Zwei Monate.","Zwei Jahre.","Ein Jahr."],"answer":2,"reasons":["غلط: مدت آزمایش یک سال است، نه دو ماه.","غلط: دو عددِ شهرک‌ها را با مدت اشتباه نگیر.","درست: در دو محله طی یک سال."],"tag":"Zahlen"},{"prompt":"Welche Information wäre für die Entscheidung am relevantesten?","options":["Fahrgastzahlen, Zufriedenheit und tatsächliche Betriebskosten.","Nur die Farbe der Tickets.","Nur die Zahl der Werbeplakate."],"answer":0,"reasons":["درست: سه شاخصِ پیامد و هزینه تعیین‌کننده‌اند.","غلط: رنگ بلیت شاخص اثربخشی طرح نیست.","غلط: تعداد پوستر به‌تنهایی تصمیم هزینه/فایده را توجیه نمی‌کند."],"tag":"Relevanz"},{"prompt":"Welche Aussage ist derzeit unzulässig?","options":["Es gibt Befürchtungen wegen einer Überlastung.","Die Pilotphase hat bereits eindeutig den Erfolg bewiesen.","Mehrkosten von rund 1,8 Mio. Euro werden geschätzt."],"answer":1,"reasons":["درست است: نگرانی ظرفیت مطرح شده است.","درست به‌عنوان پاسخ: هنوز آزمایشی انجام نشده که موفقیت را اثبات کند.","درست است: برآورد هزینه در متن آمده است."],"tag":"Zeit"},{"prompt":"Was passiert, wenn keine zusätzlichen Busse finanziert werden können?","options":["Das Ticket ist automatisch kostenlos.","Alle Linien werden sicher geschlossen.","Bestehende Linien könnten überlastet werden."],"answer":2,"reasons":["غلط: متن دربارهٔ رایگان‌شدن نیست.","غلط: تعطیلی قطعی مطرح نشده است.","درست: هشدارِ احتمالی دربارهٔ تراکم خطوط است."],"tag":"Gewissheit"},{"prompt":"Welche Empfehlung wägt beide Seiten ab?","options":["Pilotprojekt mit Messung der Kosten und Kapazitäten, danach Entscheidung.","Unbefristete Einführung ohne Untersuchung.","Vollständiger Verzicht allein wegen einer Kostenschätzung."],"answer":0,"reasons":["درست: نتیجه‌گیری متناسب با عدم قطعیت و هدف‌های متعدد است.","غلط: ریسک‌های مالی و ظرفیت را نادیده می‌گیرد.","غلط: دادهٔ اولیه برای رد قطعی هر طرح کافی نیست."],"tag":"Argumentation"},{"prompt":"Was bedeutet „sofern ... finanziert werden können“?","options":["Eine bereits erfüllte Tatsache.","Eine Bedingung, von der die Unterstützung abhängt.","Eine Aussage über vergangene Fahrgastzahlen."],"answer":1,"reasons":["غلط: عبارت شرطی است و تحقق را اثبات نمی‌کند.","درست: حمایت سیاسی به تأمین منابع وابسته است.","غلط: به آیندهٔ اجرای طرح مربوط است."],"tag":"Bedingung"}],"writing":"Schreiben Sie einen ausgewogenen Vorschlag (130–170 Wörter) für eine städtische Entscheidung. Berücksichtigen Sie Chancen, Kosten, Kapazitäten und Evaluation.","speaking":"Kritisieren Sie in 90 Sekunden eine sofortige unbefristete Einführung. Schlagen Sie eine bessere Vorgehensweise vor.","models":["Ein vergünstigtes Semesterticket könnte den öffentlichen Verkehr attraktiver machen und Studierende finanziell entlasten. Eine sofortige dauerhafte Einführung wäre jedoch voreilig, weil die Verwaltung jährliche Mehrkosten von etwa 1,8 Millionen Euro erwartet. Zudem könnten zusätzliche Fahrgäste bestehende Buslinien überlasten. Daher halte ich einen einjährigen Pilotversuch in zwei Stadtteilen für sinnvoll. Währenddessen sollten nicht nur die Fahrgastzahlen und die Zufriedenheit, sondern auch die tatsächlichen Betriebskosten erhoben werden. Zusätzliche Verbindungen in den Hauptverkehrszeiten müssten dabei geprüft werden. Erst wenn die Daten eine tragfähige Finanzierung und ausreichende Kapazitäten zeigen, sollte die Stadt über eine langfristige Einführung entscheiden. Auf diese Weise ließen sich soziale und ökologische Ziele mit finanzieller Verantwortung verbinden.","Ein günstigeres Ticket ist eine gute Idee, aber eine sofortige dauerhafte Einführung halte ich für riskant. Die Kosten und die Kapazitäten sind noch nicht ausreichend geklärt. Deshalb würde ich zunächst einen einjährigen Versuch in zwei Stadtteilen empfehlen. Die Stadt sollte messen, wie viele Menschen das Angebot nutzen, wie zufrieden sie sind und welche Kosten tatsächlich entstehen."],"model_fa":["بلیت دانشجویی ارزان‌تر می‌تواند حمل‌ونقل عمومی را جذاب‌تر کند و فشار مالی دانشجویان را کم کند. اما اجرای فوری و دائمی شتاب‌زده خواهد بود، زیرا مدیریت سالانه حدود ۱٫۸ میلیون یورو هزینهٔ بیشتر پیش‌بینی کرده است. همچنین مسافران تازه ممکن است خطوط موجود را شلوغ کنند. بنابراین آزمایش یک‌ساله در دو محله منطقی است. طی این مدت باید تعداد مسافران، رضایت آنان و هزینهٔ واقعی بهره‌برداری اندازه‌گیری شود. امکان افزودن سرویس در ساعت‌های شلوغ نیز باید بررسی شود. تنها اگر داده‌ها از تأمین مالی پایدار و ظرفیت کافی پشتیبانی کنند، شهر باید دربارهٔ اجرای بلندمدت تصمیم بگیرد. این کار میان اهداف اجتماعی و محیط‌زیستی و مسئولیت مالی توازن ایجاد می‌کند.","بلیت ارزان‌تر ایدهٔ خوبی است، اما اجرای دائمی و فوری را پرخطر می‌دانم. هنوز هزینه و ظرفیت کافی روشن نشده است. بنابراین ابتدا آزمایش یک‌ساله در دو محله را پیشنهاد می‌کنم. شهر باید میزان استفاده، رضایت و هزینه‌های واقعی را اندازه بگیرد."]},{"slug":"confounders","title":"Kausalketten und Störfaktoren","fa":"علیت، عوامل مداخله‌گر و توضیح‌های جایگزین","skill":"Kausalitaet","lesson":"یک همبستگی ممکن است به علت عامل سوم ایجاد شود. Störfaktor یعنی عامل مخدوش‌کننده. برای گفتن علت باید زمان‌بندی، تفاوت اولیهٔ گروه‌ها و امکان توضیح‌های جایگزین را بررسی کرد.","signals":["der Störfaktor — عامل مخدوش‌کننده","die Ausgangsbedingung — وضعیت اولیه","die Ursache — علت","ausschließen — منتفی دانستن"],"text":"Eine Arbeitsgruppe untersuchte den Zusammenhang zwischen dem Besuch freiwilliger Schreibwerkstätten und den Noten in wissenschaftlichen Hausarbeiten. Von 240 Studierenden nahmen 80 regelmäßig an den Werkstätten teil. Ihre durchschnittliche Note lag bei 1,9; die übrigen Studierenden erreichten durchschnittlich 2,5. In einer ersten Pressemitteilung hieß es, die Werkstätten hätten die besseren Noten verursacht. Später stellte das Forschungsteam fest, dass die Teilnehmenden der Werkstätten im Durchschnitt bereits im vorherigen Semester bessere Schreibnoten erzielt hatten. Zudem berichteten sie häufiger von einer hohen Lernmotivation. Das Team nahm die ursprüngliche Kausalaussage zurück und sprach nun von einer beobachteten Beziehung. Ob die Werkstätten zusätzlich zum Vorwissen und zur Motivation einen eigenen Beitrag leisten, soll in einer weiteren Untersuchung geprüft werden.","audio":"Die Projektleiterin sagt: Wir freuen uns über die guten Ergebnisse der Teilnehmenden. Aber wir haben zu früh von einer Wirkung der Schreibwerkstätten gesprochen. Die Gruppen waren schon vorher unterschiedlich stark. Das müssen wir in einer neuen Untersuchung berücksichtigen, bevor wir einen kausalen Effekt behaupten.","table":[["Gruppe","Personen","Durchschnittsnote"],["Werkstatt besucht","80","1,9"],["Nicht regelmäßig besucht","160","2,5"]],"questions":[{"prompt":"Was lässt sich aus den Noten sicher ableiten?","options":["Die Werkstatt verursachte die bessere Note.","Die Teilnehmenden hatten im Mittel bessere Noten als die Vergleichsgruppe.","Ohne Werkstatt ist gutes Schreiben unmöglich."],"answer":1,"reasons":["غلط: Ursache wurde nicht nachgewiesen.","درست: توصیف تفاوت میانگین‌ها مستقیماً از داده‌ها حاصل می‌شود.","غلط: تعمیم قطعی و ناسازگار با داده‌هاست."],"tag":"Kausalitaet"},{"prompt":"Welcher Störfaktor wird ausdrücklich genannt?","options":["Die Farbe des Seminarraums.","Die Zahl der Prüfungsräume.","Unterschiedliche Vorkenntnisse und Motivation."],"answer":2,"reasons":["غلط: رنگ کلاس در متن نیست.","غلط: ظرفیت اتاق‌ها بررسی نشده است.","درست: سطح قبلی نوشتن و انگیزهٔ متفاوت ذکر شده‌اند."],"tag":"Methode"},{"prompt":"Was geschah mit der ursprünglichen Pressemitteilung?","options":["Die starke Kausalaussage wurde zurückgenommen.","Die These wurde endgültig bewiesen.","Die Notentabelle wurde vollständig gelöscht."],"answer":0,"reasons":["درست: گروه پژوهشی از ادعای علّی عقب نشست.","غلط: شواهد علیت کافی نبود.","غلط: داده‌ها همچنان گزارش شده‌اند."],"tag":"Zeit"},{"prompt":"Wie viele Studierende nahmen nicht regelmäßig teil?","options":["80","160","240"],"answer":1,"reasons":["غلط: ۸۰ عضو گروه شرکت‌کننده‌اند.","درست: ۲۴۰ منهای ۸۰ برابر ۱۶۰ است.","غلط: ۲۴۰ کل جمعیت پژوهش است."],"tag":"Zahlen"},{"prompt":"Welche Aussage berücksichtigt die Notenskala?","options":["Die Werkstattgruppe war schlechter, weil 1,9 kleiner ist.","Die Noten sind identisch.","Die Werkstattgruppe hatte im Mittel die bessere Note, denn in diesem System ist 1,9 besser als 2,5."],"answer":2,"reasons":["غلط: در نظام نمره‌دهی آلمان عدد کوچک‌تر بهتر است.","غلط: ۱٫۹ با ۲٫۵ متفاوت است.","درست: برداشت عددی با جهت مقیاس نمره سازگار است."],"tag":"Zahlen"},{"prompt":"Welche Studie könnte die Kausalfrage besser prüfen?","options":["Eine Untersuchung mit vergleichbaren Ausgangsbedingungen und möglichst zufälliger Zuteilung.","Eine reine Werbebefragung nach Abschluss des Kurses.","Eine Studie nur mit bisherigen Werkstattteilnehmenden."],"answer":0,"reasons":["درست: کنترل شرایط اولیه و تخصیص تصادفی به ارزیابی اثر مستقل کمک می‌کند.","غلط: رضایت‌سنجی برای علیت کافی نیست.","غلط: نبود گروه مقایسه مسئله را حل نمی‌کند."],"tag":"Methode"},{"prompt":"Was bezeichnet „ein eigener Beitrag“ der Werkstätten?","options":["Die Gesamtzahl aller eingeschriebenen Personen.","Ein zusätzlicher Effekt, der nicht allein durch Vorwissen und Motivation erklärt wird.","Die Kosten für die Kursleitung."],"answer":1,"reasons":["غلط: بحث دربارهٔ اثر است، نه شمار ثبت‌نام.","درست: اثر مستقل از عامل‌های شناخته‌شدهٔ دیگر مدنظر است.","غلط: هزینه‌ها موضوع ادعا نیست."],"tag":"Kausalitaet"},{"prompt":"Welche Aussage der Projektleiterin ist zutreffend?","options":["Sie behauptet weiterhin uneingeschränkt eine Wirkung.","Sie bestreitet jeden Unterschied zwischen den Gruppen.","Sie räumt ein, dass die ursprüngliche Interpretation zu weit ging."],"answer":2,"reasons":["غلط: او صریحاً به برداشت قبلی انتقاد می‌کند.","غلط: تفاوت عملکرد موجود است.","درست: نتیجه‌گیری علّی اولیه عجولانه بوده است."],"tag":"Sprecher"}],"writing":"Erklären Sie in 120–160 Wörtern die Unterschiede der Gruppen und zwei mögliche Störfaktoren. Formulieren Sie ein passendes Studiendesign.","speaking":"Erläutern Sie in 90 Sekunden, warum ein Zusammenhang zwischen Werkstattbesuch und Note noch keine Ursache beweist.","models":["Die Studierenden, die regelmäßig eine Schreibwerkstatt besuchten, erzielten mit einer Durchschnittsnote von 1,9 bessere Ergebnisse als jene ohne regelmäßige Teilnahme, deren Mittelwert bei 2,5 lag. Daraus darf jedoch nicht geschlossen werden, dass der Werkstattbesuch allein die besseren Noten verursacht hat. Die Teilnehmenden verfügten bereits zuvor über bessere Schreibkenntnisse und berichteten häufiger von hoher Lernmotivation. Beide Merkmale könnten die beobachtete Beziehung teilweise erklären. Die ursprüngliche Kausalaussage der Pressemitteilung war deshalb zu stark. Eine weiterführende Untersuchung sollte Ausgangsleistungen und Motivation erfassen und die Teilnehmenden möglichst zufällig auf verschiedene Bedingungen verteilen. Erst dann ließe sich zuverlässiger abschätzen, ob die Werkstatt selbst einen zusätzlichen Beitrag leistet.","Die Werkstattgruppe hatte im Durchschnitt die bessere Note. Das heißt aber nicht automatisch, dass die Werkstatt die Ursache war. Die Teilnehmenden waren schon vor dem Kurs stärker und häufig motivierter. Diese Unterschiede könnten den Notenvorteil erklären. Deshalb sollte man in einer neuen Studie die Ausgangsbedingungen berücksichtigen und die Gruppen möglichst zufällig bilden."],"model_fa":["دانشجویانی که مرتب در کارگاه نوشتن شرکت کردند، با میانگین ۱٫۹ نسبت به گروه دیگر با میانگین ۲٫۵ نمرهٔ بهتری داشتند. اما نمی‌توان نتیجه گرفت که کارگاه به‌تنهایی باعث بهترشدن نمره‌ها شده است. شرکت‌کنندگان از پیش مهارت نوشتاری بهتری داشتند و انگیزهٔ بالاتری گزارش کرده بودند. هر دو عامل می‌توانند بخشی از رابطهٔ مشاهده‌شده را توضیح دهند. بنابراین ادعای علّی اولیهٔ اطلاعیهٔ مطبوعاتی بیش‌ازحد قوی بود. پژوهش بعدی باید سطح اولیه و انگیزه را بسنجد و تا حد ممکن تقسیم افراد به گروه‌ها را تصادفی انجام دهد. تنها آن زمان می‌توان سهم مستقل خود کارگاه را قابل‌اعتمادتر برآورد کرد.","گروه کارگاه به‌طور میانگین نمرهٔ بهتری گرفت، اما این لزوماً به معنای اثر کارگاه نیست. شرکت‌کنندگان از قبل قوی‌تر و اغلب باانگیزه‌تر بودند و این تفاوت‌ها ممکن است برتری نمره را توضیح دهند. بنابراین پژوهش جدید باید شرایط اولیه را در نظر بگیرد و گروه‌ها را تا حد ممکن تصادفی تشکیل دهد."]},{"slug":"synthesis","title":"Quellen zusammenführen und knapp schreiben","fa":"تلفیق منابع و خلاصه‌سازی بدون تحریف","skill":"Synthese","lesson":"در خلاصه‌سازی علمی باید مشترکات، تفاوت‌ها و حد شواهد را حفظ کنی. یک خلاصه خوب نباید به متن نظر شخصی اضافه کند، و نباید یک روند فرعی را به نتیجهٔ اصلی تبدیل کند. Synopse به معنی کنارهم‌گذاشتن اطلاعات منابع است.","signals":["zusammenfassen — خلاصه‌کردن","der Widerspruch — تعارض","die Übereinstimmung — توافق/همخوانی","hervorheben — برجسته‌کردن"],"text":"Eine Universität untersuchte zwei Maßnahmen zur Verringerung des Papierverbrauchs. Nach der Einführung eines digitalen Abgabesystems sank die Zahl der ausgedruckten Hausarbeiten innerhalb eines Jahres von 9.000 auf 5.400. Gleichzeitig nahm der gesamte Papierverbrauch der Universität jedoch nur um acht Prozent ab, weil Verwaltungsabteilungen weiterhin viele Unterlagen druckten. Eine zweite Maßnahme bestand in Schulungen zum doppelseitigen Drucken. Laut einer Befragung fanden 68 Prozent der Beschäftigten diese Schulungen hilfreich. Die Evaluation weist darauf hin, dass eine positive Bewertung der Schulung nicht automatisch belegt, dass das Druckverhalten dauerhaft verändert wurde. Die Hochschulleitung plant deshalb, im nächsten Jahr zusätzlich den Papierverbrauch einzelner Verwaltungsbereiche zu erfassen. Nur so könne geklärt werden, an welchen Stellen weitere Einsparungen möglich seien.","audio":"Die Nachhaltigkeitsbeauftragte erklärt: Bei den Hausarbeiten sehen wir einen klaren Rückgang der Ausdrucke. Der gesamte Papierverbrauch ist aber viel weniger stark zurückgegangen. Für die Schulungen haben wir bislang vor allem Zufriedenheitsdaten. Wir müssen noch messen, ob die Beschäftigten tatsächlich langfristig anders drucken.","table":[["Indikator","Früher","Später"],["Ausgedruckte Hausarbeiten","9.000","5.400"],["Gesamter Papierverbrauch","Index 100","Index 92"],["Schulung hilfreich gefunden","—","68 % der Antwortenden"]],"questions":[{"prompt":"Wie stark sank die Zahl gedruckter Hausarbeiten relativ?","options":["Um acht Prozent.","Um vierzig Prozent.","Um achtzig Prozent."],"answer":1,"reasons":["غلط: هشت درصد مربوط به کل مصرف کاغذ است.","درست: کاهش ۳۶۰۰ از پایهٔ ۹۰۰۰ برابر ۴۰٪ است.","غلط: ۸۰٪ از جدول به دست نمی‌آید."],"tag":"Zahlen"},{"prompt":"Warum sank der Gesamtverbrauch weniger stark?","options":["Andere Bereiche, insbesondere die Verwaltung, druckten weiterhin viel.","Die Zahl gedruckter Hausarbeiten stieg an.","Die Schulungen wurden offiziell verboten."],"answer":0,"reasons":["درست: متن نقش تداوم مصرف در بخش‌های اداری را ذکر کرده است.","غلط: چاپ تکلیف‌ها کاهش یافت.","غلط: چنین ممنوعیتی در متن نیست."],"tag":"Kausalitaet"},{"prompt":"Was belegen die 68 Prozent genau?","options":["68 Prozent aller Beschäftigten drucken seitdem doppelseitig.","68 Prozent des Papierverbrauchs entfällt auf Schulungen.","68 Prozent der Befragten bewerteten die Schulungen als hilfreich."],"answer":2,"reasons":["غلط: برداشت از یک پرسش رضایت را به رفتار قطعی تبدیل می‌کند.","غلط: نرخ رضایت سهم مصرف کاغذ نیست.","درست: تنها ارزیابی ذهنی پاسخ‌دهندگان گزارش شده است."],"tag":"Methode"},{"prompt":"Welche Aussage widerspricht dem Text?","options":["Der Druck von Hausarbeiten nahm ab.","De iese Werte als Beleg dafür, dass der gesamte Energieverbrauch gesunken sei. Eine unabhängige Prüfgruppe widersprach: Weil die Zahl der Fahrgäste deutlich zugenommen hatte, könne eine Einsparung pro Person mit einem steigenden Gesamtverbrauch einhergehen. Unter vereinfachten und sonst gleichen Bedingungen würde die Kombination aus 0,88 Energie je Person und 1,30-mal so vielen Fahrgästen rechnerisch sogar einen Gesamtwert von rund 1,144 gegenüber dem Ausgangswert ergeben. Die Prüfgruppe empfiehlt, tatsächliche Gesamtverbrauchsdaten zu erheben. Außerdem seien die Herkunft des Stroms und die Auslastung einzelner Linien zu berücksichtigen.","audio":"Der Verkehrsanalyst sagt: Zwölf Prozent weniger Verbrauch pro Fahrgast sind ein gutes Zeichen, aber wir hatten gleichzeitig dreißig Prozent mehr Fahrgäste. Deshalb darf man nicht ohne Rechnung behaupten, der Gesamtverbrauch sei gesunken. Zusätzlich müssen wir wissen, aus welchen Quellen der Strom stammt.","table":[["Indikator","Veränderung"],["Energie je Fahrgast","−12 %"],["Fahrgäste","+30 %"],["vereinfachter Gesamtindex","114,4 bei Basis 100"]],"questions":[{"prompt":"Was geschah mit dem Energieverbrauch je Fahrgast?","options":["Er stieg um 12 Prozent.","Er sank um 12 Prozent.","Er blieb unverändert."],"answer":1,"reasons":["غلط: کاهش گزارش شده است.","درست: شاخص سرانه ۱۲٪ کم شد.","غلط: مقدار ثابت نمانده است."],"tag":"Zahlen"},{"prompt":"Um wie viel stieg die Fahrgastzahl?","options":["30 Prozent.","12 Prozent.","114,4 Prozent."],"answer":0,"reasons":["درست: افزایش شمار مسافران ۳۰٪ بوده است.","غلط: ۱۲٪ کاهش انرژی سرانه است.","غلط: ۱۱۴٫۴ شاخص کل نسبی در محاسبهٔ ساده‌شده است."],"tag":"Zahlen"},{"prompt":"Warum ist die Aussage über sinkenden Gesamtverbrauch nicht belegt?","options":["Weil alle Busse weiter mit Diesel fahren.","Weil elektrische Fahrzeuge grundsätzlich keine Energie benötigen.","Weil die höhere Fahrgastzahl eine Einsparung pro Person überkompensieren kann."],"answer":2,"reasons":["غلط: متن چنین اطلاعاتی دربارهٔ ‌های متن سازگار است.","این گزاره مستقیماً دادهٔ گزارش‌شده است."],"tag":"Gewissheit"}],"writing":"Schreiben Sie eine 100–150 Wörter lange kritische Zusammenfassung der Bilanz. Erklären Sie Pro-Kopf- und Gesamtwerte.","speaking":"Erläutern Sie in 90 Sekunden, warum ein sinkender Pro-Kopf-Wert mit einem steigenden Gesamtwert zusammenfallen kann.","models":["Die Stadt Neuwerder berichtet über einen um zwölf Prozent geringeren Energieverbrauch je Fahrgast nach der Ergänzung der Busflotte durch elektrische Fahrzeuge. Gleichzeitig nahm die Fahrgastzahl um 30 Prozent zu. Daraus lässt sich nicht ohne Weiteres ein geringerer Gesamtverbrauch ableiten. Eine vereinfachte Rechnung ergibt vielmehr einen Gesamtindex von 114,4 gegenüber dem Ausgangswert 100. Die unabhängige Prüfgruppe fordert deshalb zusätzliche Daten zum tatsächlichen Gesamtverbrauch. Für die Bewertung der Umweltwirkung seien außerdem die Herkunft des Stroms und die Auslastung der Linien zu berücksichtigen. Eine positive Entwicklung des Pro-Kopf-Werts ist daher noch kein ausreichender Nachweis für eine insgesamt geringere Umweltbelastung.","Pro Fahrgast sank der Energieverbrauch um zwölf Prozent. Gleichzeitig stieg die Zahl der Fahrgäste um dreißig Prozent. Wenn man die beiden Änderungen kombiniert, kann der gesamte Verbrauch sogar höher liegen. Deshalb braucht die Stadt echte Gesamtverbrauchsdaten und Informationen über die Stromquellen."],"model_fa":["شهر نووردر پس از افزودن اتوبوس‌های برقی، کاهش دوازده‌درصدی مصرف انرژی به‌ازای هر مسافر را گزارش کرده است. هم‌زمان تعداد مسافران ۳۰ درصد بیشتر شده است. بنابراین نمی‌توان به‌سادگی نتیجه گرفت که مصرف کل کمتر شده است. یک محاسبهٔ ساده‌شده حتی شاخص کل ۱۱۴٫۴ را در مقایسه با مبنای ۱۰۰ نشان می‌دهد. گروه ارزیابی مستقل به همین دلیل داده‌های واقعی مصرف کل را درخواست کرده است. همچنین برای بررسی اثر محیط‌زیستی باید منشأ برق و میزان پُربودن خطوط را در نظر گرفت. کاهش مصرف سرانه، به‌تنهایی اثبات‌کنندهٔ کاهش فشار محیط‌زیستی کل نیست.","مصرف سرانهٔ انرژی دوازده درصد کاهش یافت، اما شمار مسافران ۳۰ درصد بالا رفت. با ترکیب این تغییرها، حتی ممکن است مصرف کل بیشتر شده باشد. بنابراین شهر به داده‌های واقعی مصرف کل و اطلاعات مربوط به منابع برق نیاز دارد."]},{"slug":"examc","title":"KI-Schreibassistenz im Seminar","fa":"آزمون C: هوش مصنوعی در نوشتن دانشگاهی","skill":"Argumentation","lesson":"متن و گفتار را با هم بررسی کن: چه اثری اندازه‌گیری شده و چه ادعایی فقط دیدگاه افراد است؟ بین شواهد عملکردی، رضایت و نگرانی اخلاقی تفاوت بگذار.","signals":["eine Kontrollgruppe — گروه کنترل","die Eigenständigkeit — استقلال","die Bewertungsfairness — عدالت در ارزیابی"],"text":"In einem Methodenseminar testete eine Hochschule ein freiwilliges KI-Werkzeug, das Hinweise zur Gliederung wissenschaftlicher Texte gibt. Von 120 Studierenden entschieden sich 70 für die Nutzung. In einer anonymen Befragung erklärten 84 Prozent dieser Nutzenden, das Werkzeug helfe ihnen bei der Planung. Eine unabhängige Bewertung der eingereichten Texte zeigte jedoch keinen eindeutigen Unterschied in der Argumentationsqualität zwischen Nutzenden und Nichtnutzenden. Die Seminarleiterin betonte, dass die Entscheidung zur Nutzung freiwillig gewesen sei und sich die Gruppen in ihrer bisherigen Schreiberfahrung unterschieden. Der Prüfungsausschuss diskutiert nun verbindliche Regeln zur Kennzeichnung automatisierter Hilfen. Während einige Studierende eine klare Offenlegung fordern, warnen andere vor einer Regelung, die auch einfache Rechtschreibkorrekturen unnötig kompliziert macht. Ein Entwurf sieht deshalb vor, zwischen sprachlicher Korrektur und inhaltlicher Textproduktion zu unterscheiden.","audio":"Die Seminarleiterin erklärt: Viele Nutzende fanden die Planungshilfe praktisch, doch wir konnten keinen eindeutigen Vorteil in der Argumentationsqualität nachweisen. Der Prüfungsausschuss sollte deshalb nicht nur über Verbote sprechen, sondern klare Regeln dafür entwickeln, welche Formen der Unterstützung offengelegt werden müssen. Dabei sollten einfache Korrekturen anders beurteilt werden als die automatische Erstellung ganzer Argumentationsabschnitte.","table":[["Indikator","Wert"],["Teilnehmende","120"],["Freiwillige KI-Nutzende","70"],["Planungshilfe nützlich","84 % der Nutzenden"]],"questions":[{"prompt":"Wie viele Studierende nutzten das Werkzeug?","options":["50","70","120"],"answer":1,"reasons":["غلط: ۵۰ شمار غیرکاربران است.","درست: ۷۰ نفر به‌صورت داوطلبانه استفاده کردند.","غلط: ۱۲۰ شمار کل شرکت‌کنندگان بود."],"tag":"Zahlen"},{"prompt":"Worauf beziehen sich die 84 Prozent?","options":["Auf alle Studierenden des Seminars.","Auf die Gruppe der Nichtnutzenden.","Auf die befragten Nutzenden des Werkzeugs."],"answer":2,"reasons":["غلط: محدودهٔ پاسخ‌دهندگان کوچک‌تر از کل گروه است.","غلط: این افراد از ابزار استفاده نکرده‌اند.","درست: رضایت فقط میان استفاده‌کنندگان گزارش شده است."],"tag":"Methode"},{"prompt":"Was zeigte die unabhängige Textbewertung?","options":["Keinen eindeutigen Unterschied in der Argumentationsqualität.","Einen nachweislich großen Vorteil für KI-Nutzende.","Ein vollständiges Scheitern aller Texte ohne KI."],"answer":0,"reasons":["درست: تفاوت روشن در کیفیت استدلال مشاهده نشد.","غلط: نتیجهٔ مثبت قطعی گزارش نشده است.","غلط: چنین نتیجه‌ای دربارهٔ متن‌های بدون هوش مصنوعی وجود ندارد."],"tag":"Gewissheit"},{"prompt":"Welche methodische Einschränkung wird genannt?","options":["Alle wurden zufällig zugeteilt.","Die Nutzung war freiwillig, und die Gruppen unterschieden sich in Schreiberfahrung.","Die Befragung fand ausschließlich mit Lehrenden statt."],"answer":1,"reasons":["غلط: گزینش تصادفی انجام نشده است.","درست: تفاوت اولیه و خودانتخابی می‌توانند اثر بر نتیجه داشته باشند.","غلط: داده دربارهٔ دانشجویان است."],"tag":"Methode"},{"prompt":"Worüber diskutiert der Prüfungsausschuss?","options":["Über eine Abschaffung aller wissenschaftlichen Hausarbeiten.","Über die Pflicht, KI immer zu verwenden.","Über Regeln zur Kennzeichnung automatisierter Unterstützung."],"answer":2,"reasons":["غلط: حذف تکلیف‌ها مطرح نیست.","غلط: استفاده اجباری نشده است.","درست: شفافیت کاربرد ابزار موضوع گفت‌وگوست."],"tag":"Relevanz"},{"prompt":"Welche Unterscheidung sieht der Entwurf vor?","options":["Sprachliche Korrektur gegenüber inhaltlicher Textproduktion.","Digitale Texte gegenüber handschriftlichen Notizen.","Wissenschaftliche Fächer gegenüber Sportkursen."],"answer":0,"reasons":["درست: تفکیک میان اصلاح زبان و تولید محتوای استدلالی مطرح است.","غلط: روش نگارش کاغذی/دیجیتال محور طرح نیست.","غلط: تفکیک بر اساس دانشکده در متن نیامده است."],"tag":"Bedingung"},{"prompt":"Welche Behauptung wäre überzogen?","options":["Einige Nutzende fanden die Planungshilfe nützlich.","Der Einsatz von KI verbessert wissenschaftliche Argumentation in jedem Fall nachweislich.","Die Gruppen unterschieden sich vorab in ihren Erfahrungen."],"answer":1,"reasons":["این گزاره با نتیجهٔ نظرسنجی سازگار است.","درست به‌عنوان پاسخ: کیفیت استدلال تفاوت واضح نشان نداده و تعمیم قطعی بی‌پایه است.","محدودیت روش‌شناختی به‌صراحت آمده است."],"tag":"Generalisierung"},{"prompt":"Welche Empfehlung passt zur Diskussion?","options":["Jede Form der Unterstützung undifferenziert verbieten.","Auf Regeln vollständig verzichten.","Klare, verhältnismäßige Offenlegungsregeln mit Unterscheidung verschiedener Nutzungen entwickeln."],"answer":2,"reasons":["غلط: نگرانی دربارهٔ افراط در تنظیم‌گری نادیده گرفته می‌شود.","غلط: کمیته در پی قاعده‌گذاری است.","درست: هم شفافیت و هم تناسبِ کاربردهای مختلف را در نظر می‌گیرد."],"tag":"Argumentation"}],"writing":"Fassen Sie die Daten und die Diskussion um Kennzeichnungsregeln in 100–150 Wörtern neutral zusammen.","speaking":"Stellen Sie in 90 Sekunden eine ausgewogene Empfehlung für Kennzeichnungsregeln vor.","models":["In einem Methodenseminar nutzten 70 von 120 Studierenden freiwillig ein KI-Werkzeug zur Gliederungsplanung. Unter den Nutzenden bewerteten 84 Prozent die Hilfe als nützlich. Eine unabhängige Bewertung der Hausarbeiten ergab jedoch keinen eindeutigen Unterschied in der Argumentationsqualität. Da sich die Gruppen in ihrer Schreiberfahrung unterschieden und die Teilnahme freiwillig war, lässt sich kein klarer kausaler Effekt bestimmen. Der Prüfungsausschuss diskutiert Regeln zur Kennzeichnung automatisierter Unterstützung. Ein Entwurf unterscheidet zwischen einfacher sprachlicher Korrektur und der inhaltlichen Erstellung von Textteilen. Ziel ist eine nachvollziehbare Regelung, die Transparenz gewährleistet, ohne geringfügige Hilfen unverhältnismäßig zu behandeln.","Viele Studierende fanden die KI-Planungshilfe nützlich, aber ein besseres Argumentationsniveau wurde nicht nachgewiesen. Deshalb sollten wir weder pauschal verbieten noch ohne Regeln weitermachen. Ich würde klare Vorgaben zur Offenlegung unterstützen. Dabei muss man zwischen Rechtschreibkorrektur und automatisch erzeugten Argumenten unterscheiden."],"model_fa":["در یک سمینار روش‌شناسی، ۷۰ نفر از ۱۲۰ دانشجو به‌شکل داوطلبانه از ابزاری برای طراحی ساختار متن با هوش مصنوعی استفاده کردند. ۸۴ درصد استفاده‌کنندگان آن را مفید دانستند، اما ارزیابی مستقل تکالیف، تفاوت روشنی در کیفیت استدلال نشان نداد. چون گروه‌ها از نظر تجربهٔ نوشتاری متفاوت بودند و مشارکت داوطلبانه بود، اثر علّی روشنی قابل تعیین نیست. کمیتهٔ آزمون دربارهٔ قواعد اعلام استفاده از کمک‌های خودکار گفت‌وگو می‌کند. یکی از طرح‌ها میان تصحیح سادهٔ زبان و تولید محتوای متن تفاوت می‌گذارد تا هم شفافیت تأمین شود و هم کمک‌های جزئی نامتناسب محدود نشوند.","بسیاری از دانشجویان ابزار را مفید می‌دانستند، اما بهبود کیفیت استدلال ثابت نشد. بنابراین نباید همه‌چیز را یکسره ممنوع یا بی‌قانون رها کرد. من از قواعد شفاف دربارهٔ اعلام استفاده حمایت می‌کنم که میان اصلاح املا و تولید خودکار استدلال تفاوت می‌گذارند."]}]};
const MODS=DB.modules,EX=DB.exam;

const DEFAULT=()=>({answers:{},graded:{},writing:{},speakingNotes:{},exam:{started:false,finished:false,step:0,answers:{},expires:0},voice:'',rate:0.94});
let state=DEFAULT();try{const s=localStorage.getItem(K);if(s){const a=JSON.parse(s);state={...state,...a,exam:{...state.exam,...a.exam}}}}catch(e){}
let page='home';let wt=null,pt=null,recorder=null,recStream=null,recChunks=[],recUrl=null,voices=[],voicePlaying=false,uttQueue=[],currentUtterance=null;

const es=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
