<script>
/* =====================================================================
   POOF Schritte — standalone learning path for Schritte international Neu A1.1.
   Reads shared localStorage "poof_v2" (theme, decks, cards).
   Writes ONLY: db.schritte (progress) and db.cards (new cards from lessons).
   Lesson data: schritte-lektion-<n>.json (text only; images in schritte-images/,
   audio in schritte-audio/ — both uploaded by the user via GitHub web UI).
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();

/* ---------- shared db (same pattern as learn.html) ---------- */
const K="poof_v2";let db=null;
function readRaw(){try{const d=JSON.parse(localStorage.getItem(K));return d&&d.v===2?d:null}catch(e){return null}}
function load(){db=readRaw();if(!db)db={v:2,schritte:{},cards:[],decks:[{id:"default",name:"پیش‌فرض"}]};if(!db.schritte||typeof db.schritte!=="object")db.schritte={};if(!db.cards)db.cards=[];if(!db.decks)db.decks=[{id:"default",name:"پیش‌فرض"}];return true}
function commit(fn){const d=readRaw()||db;if(!d)return false;if(!d.schritte||typeof d.schritte!=="object")d.schritte={};if(!d.cards)d.cards=[];if(!d.decks)d.decks=[{id:"default",name:"پیش‌فرض"}];fn(d);try{localStorage.setItem(K,JSON.stringify(d));db=d;return true}catch(e){toast("ذخیره‌سازی ناموفق بود");return false}}
function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- tap-a-word ---------- */
function tapWords(t){return String(t||"").split(/(\s+)/).map(p=>{
  if(/^\s+$/.test(p)||!p)return esc(p);
  const m=p.match(/^([^A-Za-zÀ-ÿ'’-]*)([A-Za-zÀ-ÿ'’-]+)([^A-Za-zÀ-ÿ'’-]*)$/);
  if(!m)return esc(p);
  return `${esc(m[1])}<span class="w" data-w="${esc(m[2].toLowerCase())}">${esc(m[2])}</span>${esc(m[3])}`;
 }).join("")}

/* ---------- dictionary: offline manual dict + Wiktionary + MyMemory ---------- */
let _man=null,_manP=null;
async function loadManual(){if(_man)return _man;
 if(!_manP)_manP=(async()=>{const r=await fetch("./manual-dict.json");if(!r.ok)throw new Error("manual "+r.status);
  const j=await r.json(),byKey=new Map();
  for(const e of j.entries){const k=String(e.headword||"").toLowerCase();if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(e)}
  return byKey})().catch(e=>{_manP=null;throw e});
 _man=await _manP;return _man}
async function manMeanings(w){try{const m=await loadManual(),arr=m.get(w.toLowerCase());if(!arr)return[];
  const out=[];
  for(const e of arr){
   for(const s of (e.senses||[]))if(s.persian)out.push({fa:s.persian,ctx:s.context_de||"",ex:(s.examples||[])[0]||""});
   if(e.persian)out.push({fa:e.persian,ctx:"",ex:""});
  }
  return out.slice(0,4)}catch(e){return[]}}
/* ---------- dictionary: 10k German→Persian (dict-fa.jsonl) ---------- */
let _fa=null,_faP=null;
async function loadFa(){if(_fa)return _fa;
 if(!_faP)_faP=(async()=>{const r=await fetch("./dict-fa.jsonl");if(!r.ok)throw new Error("fa-dict "+r.status);
  const txt=await r.text(),byKey=new Map(),byForm=new Map();
  for(const line of txt.split("\n")){const t=line.trim();if(!t)continue;let rec;try{rec=JSON.parse(t)}catch(e){continue}
   const lk=String(rec.lemma||"").toLowerCase();if(!lk)continue;
   if(!byKey.has(lk))byKey.set(lk,[]);byKey.get(lk).push(rec);
   const fm=rec.forms||{},addF=f=>{if(!f)return;const k=String(f).toLowerCase().split(/\s+/).pop();if(k&&k!==lk&&!byForm.has(k))byForm.set(k,rec)};
   addF(fm.pres3);addF(fm.past);addF(fm.perf);if(rec.pl&&rec.pl!=="—")addF(rec.pl);}
  return {byKey,byForm}})().catch(e=>{_faP=null;throw e});
 _fa=await _faP;return _fa}
/* Lektion 1 verb forms the dictionary's form-map doesn't carry (1st/2nd person) */
const VERB_FORMS={bin:"sein",bist:"sein",seid:"sein",sind:"sein",heiße:"heißen",komme:"kommen",kommst:"kommen",
 sprichst:"sprechen",spreche:"sprechen",sprich:"sprechen",lerne:"lernen",lernst:"lernen",wohne:"wohnen",wohnst:"wohnen",
 arbeite:"arbeiten",arbeitest:"arbeiten",mache:"machen",machst:"machen",spiele:"spielen",spielst:"spielen"};
async function faMeanings(w){try{const d=await loadFa(),k=w.toLowerCase();
  let recs=d.byKey.get(k),via=null;
  if(!recs&&d.byForm.has(k)){recs=[d.byForm.get(k)];via="form"}
  if(!recs&&VERB_FORMS[k]){recs=d.byKey.get(VERB_FORMS[k]);via="verb:"+VERB_FORMS[k]}
  if(!recs)return[];
  const out=[];
  for(const rec of recs)for(const s of (rec.senses||[]))if(s.fa)out.push({fa:s.fa,ipa:rec.ipa||"",pos:rec.pos||"",via:via||""});
  return out.slice(0,4)}catch(e){return[]}}
const dedupDefs=ds=>{const n=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();
 return ds.filter((d,i)=>{const a=n(d.def);if(!a)return false;
  if(ds.findIndex(o=>n(o.def)===a)<i)return false;
  return !ds.some((o,j)=>j!==i&&n(o.def).length>a.length&&n(o.def).includes(a))})};
async function wikiDefs(w){try{const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(w));
  if(!r.ok)return[];const j=await r.json(),sec=j.de||j.en;if(!sec)return[];const out=[];
  for(const s of sec){for(const d of dedupDefs((s.definitions||[]).slice(0,3).map(d=>({def:strip(d.definition)}))).filter(d=>d.def))out.push({pos:s.partOfSpeech,def:d.def})}
  return out.slice(0,4)}catch(e){return[]}}
async function mmFa(w){try{const r=await fetch("https://api.mymemory.translated.net/get?langpair=de|fa&q="+encodeURIComponent(w));
  const j=await r.json();
  return [...new Set([j.responseData&&j.responseData.translatedText,...(j.matches||[]).map(m=>m.translation)].filter(Boolean))].slice(0,3)}catch(e){return[]}}

/* ---------- pronunciation (Web Speech, German voice when available) ---------- */
let _saySeq=0;
function say(t){const seq=++_saySeq;
 try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}
 const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;
 try{for(const v of (speechSynthesis.getVoices()||[])){if(v.lang&&v.lang.toLowerCase().indexOf("de")===0){u.voice=v;break}}}catch(e){}
 u.onerror=()=>{if(seq===_saySeq)toast("صدا روی این دستگاه پخش نشد")};
 try{speechSynthesis.speak(u)}catch(e){toast("صدا روی این دستگاه پخش نشد")}}

/* ---------- word tap popup ---------- */
function hideTap(){const p=$("#tapPop");if(p)p.hidden=true}
function ctxFor(el,txt){const hit=String(el.textContent||"").trim().split(/(?<=[.!?])\s+/).find(x=>x.includes(txt));return hit&&hit!==txt?hit:""}
async function openTap(word,el){
 const pop=$("#tapPop");
 pop.innerHTML=`<div class="de" style="font-size:18px;color:var(--accent)">${esc(word)}</div><div class="mute sm" style="margin:4px 0">در حال جست‌وجو…</div>`;
 const r=el.getBoundingClientRect();
 pop.hidden=false;
 pop.style.top=Math.min(innerHeight-160,r.bottom+8+scrollY)+"px";
 pop.style.left=Math.max(10,Math.min(innerWidth-200,r.left+r.width/2-90))+"px";
 const [faD,man,wiki,mm]=await Promise.all([faMeanings(word),manMeanings(word),wikiDefs(word),mmFa(word)]);
 const fa=(faD[0]&&faD[0].fa)||(man[0]&&man[0].fa);
 let h=`<div class="de" style="font-size:18px;color:var(--accent)">${esc(word)}</div>`;
 if(faD.length)h+=faD.map(m=>`<div style="margin:4px 0">${esc(m.fa)}${m.via&&m.via.startsWith("verb:")?` <span class="mute sm">صرف‌شده از: <span class="de">${esc(m.via.slice(5))}</span></span>`:""}${m.ipa?` <span class="mute sm de">${esc(m.ipa)}</span>`:""}</div>`).join("");
 if(man.length)h+=man.map(m=>`<div style="margin:4px 0">${esc(m.fa)}${m.ctx?` <span class="mute sm de">${esc(m.ctx)}</span>`:""}</div>`).join("");
 if(!faD.length&&!man.length&&mm.length)h+=`<div style="margin:4px 0">${mm.map(esc).join("، ")}</div>`;
 if(wiki.length)h+=`<div class="mute sm" style="margin-top:6px">${wiki.map(w=>`<i>${esc(w.pos)}</i> — ${esc(w.def)}`).join("<br>")}</div>`;
 if(!faD.length&&!man.length&&!wiki.length&&!mm.length)h+=`<div class="mute sm" style="margin:4px 0">معنی‌ای پیدا نشد — از دیکشنری بپرس</div>`;
 h+=`<div class="row" style="margin-top:8px;gap:8px"><button class="btn ghost sm" id="tapSay" style="padding:6px 14px;font-size:14px">🔊 تلفظ</button>${fa?`<button class="btn ghost sm" id="tapAdd" style="padding:6px 14px;font-size:14px">+ کارت</button>`:""}</div>`;
 pop.innerHTML=h;
 $("#tapSay").onclick=ev=>{ev.stopPropagation();say(word)};
 const add=$("#tapAdd");
 if(add)add.onclick=ev=>{ev.stopPropagation();hideTap();
  const deEl=el.closest(".de"),ctx=deEl?ctxFor(deEl,el.textContent):"";
  $("#cF").value=word;$("#cB").value=fa||"";$("#cC").value=ctx;
  const ds=(db.decks&&db.decks.length?db.decks:[{id:"default",name:"پیش‌فرض"}]);
  $("#cD").innerHTML=ds.map(d=>`<option value="${esc(d.id)}" ${d.id===(db.active||"default")?"selected":""}>${esc(d.name)}</option>`).join("");
  $("#sheet").hidden=false;$("#cB").focus();
 };
}

/* ---------- selection → card (same pattern as learn.html) ---------- */
let pend=null,st;
function hideSel(){$("#selBtn").hidden=true;pend=null}
document.addEventListener("selectionchange",()=>{clearTimeout(st);st=setTimeout(()=>{
 if(!$("#sheet").hidden)return;

 if(!el||!$("#app").contains(el)||!txt||txt.length>200)return hideSel();
 const r=s.getRangeAt(0).getBoundingClientRect(),b=$("#selBtn");
 pend={txt,ctx:ctxFor(el,txt)};b.hidden=false;
 b.style.top=Math.min(innerHeight-60,r.bottom+14)+"px";b.style.left=Math.max(10,Math.min(innerWidth-100,r.left+r.width/2-45))+"px";
},180)});
$("#selBtn").addEventListener("pointerdown",e=>e.preventDefault());
$("#selBtn").onclick=async()=>{

 $("#cF").value=pend.txt;$("#cB").value=man[0]?man[0].fa:"";$("#cC").value=pend.ctx;
 const ds=(db.decks&&db.decks.length?db.decks:[{id:"default",name:"پیش‌فرض"}]);
 $("#cD").innerHTML=ds.map(d=>`<option value="${esc(d.id)}" ${d.id===(db.active||"default")?"selected":""}>${esc(d.name)}</option>`).join("");

};

$("#shX").onclick=closeSheet;$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};

 const now=Date.now(),deck=$("#cD").value||"default";

 "Kursbuch|Grammatik":"کتاب درسی · صفحه‌ی ۱۸","Kursbuch|Kommunikation":"کتاب درسی · صفحه‌ی ۱۹",

 "Arbeitsbuch|D":"کتاب کار · صفحه‌های ۱۵ و ۱۶","Arbeitsbuch|E":"کتاب کار · صفحه‌های ۱۶ و ۱۷","Arbeitsbuch|Test":"کتاب کار · صفحه‌ی ۱۸"};

/* ---------- progress ---------- */
function doneSet(){return new Set(((db.schritte&&db.schritte.L1&&db.schritte.L1.done)||[]))}
function isDone(id){return doneSet().has(id)}
function toggleDone(id){commit(d=>{d.schritte=d.schritte||{};d.schritte.L1=d.schritte.L1||{done:[]};
  const a=d.schritte.L1.done;const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id)})}
function updateProg(total){const n=doneSet().size;
 $("#progFill").style.width=Math.round(n/total*100)+"%";
 $("#progLbl").textContent=`${n} از ${total} تمرین انجام شده`;}

/* ---------- render ---------- */
function itemsHTML(s){
 return s.items.map((it,ix)=>`<div class="it" data-ix="${ix}"><div class="de it-q">${tapWords(it.q)}</div>
  <div class="opts">${it.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div>
  <button class="btn ghost sm chk" data-chk="${ix}" style="margin-top:10px">بررسی</button>
  <div class="ans-line" hidden></div></div>`).join("");
}
function secHTML(s,prevImg){
 const done=isDone(s.id);
 const img=s.image&&s.image!==prevImg?`<div class="sec-img"><img src="schritte-images/${esc(s.image)}" alt="" loading="lazy" onerror="this.closest('.sec-img').remove()"></div>`:"";
 const au=s.audio?`<div class="au"><audio controls preload="none" src="schritte-audio/${esc(s.audio)}"></audio><div class="au-note" hidden>فایل صوتی هنوز در گیت‌هاب بارگذاری نشده؛ بعد از پوش فایل‌های صوتی، اینجا پخش می‌شود.</div></div>`:"";
 const tr=s.transcript?`<details class="tr"><summary>متن صوت</summary><div class="de" style="margin-top:8px">${tapWords(s.transcript)}</div></details>`:"";
 const it=s.items?itemsHTML(s):"";
 const an=s.answers&&s.answers.length?`<details class="an"><summary>جواب‌ها</summary>${s.answers.map(a=>`<div class="ans-line de">${tapWords(a)}</div>`).join("")}</details>`:"";
 return `<article class="sec${done?" done":""}" id="sec-${esc(s.id)}" data-id="${esc(s.id)}">
  <div class="sec-h"><b>${esc(s.exercise)}</b><span class="bdg k">${KIND[s.kind]||esc(s.kind)}</span><span class="bdg">${s.source==="Kursbuch"?"کتاب درسی":"کتاب کار"} · ص ${esc(s.page)}</span><button class="done-btn" data-done="${esc(s.id)}" aria-label="انجام شد">${done?"✓":"○"}</button></div>
  ${img}
  <div class="de">${tapWords(s.text)}</div>
  ${au}${tr}${it}${an}
 </article>`;
}
function render(L){
 const app=$("#app");let h="",prevImg=null;
 const groups=[];for(const s of L.sections){const k=s.source+"|"+s.schritt;if(!groups.length||groups[groups.length-1][0]!==k)groups.push([k,[]]);groups[groups.length-1][1].push(s)}
 for(const [k,secs] of groups){
  h+=`<section class="grp"><h2>${esc(GTITLE[k]||k)}</h2><div class="gsub">${esc(GSUB[k]||"")}</div>`;
  for(const s of secs){h+=secHTML(s,prevImg);if(s.image)prevImg=s.image}
  h+="</section>";
 }
 app.innerHTML=h;
 updateProg(L.sections.length);
 $$("#app audio").forEach(a=>a.addEventListener("error",()=>{const n=a.parentElement.querySelector(".au-note");if(n)n.hidden=false}));
}

/* ---------- interactions (delegated) ---------- */
$("#app").addEventListener("click",e=>{
 const w=e.target.closest(".w");
 if(w){const s=getSelection();if(s&&!s.isCollapsed)return;e.stopPropagation();openTap(w.dataset.w,w);return}
 const dbtn=e.target.closest("[data-done]");
 if(dbtn){const id=dbtn.dataset.done;toggleDone(id);
  const card=dbtn.closest(".sec");card.classList.toggle("done",isDone(id));dbtn.textContent=isDone(id)?"✓":"○";
  updateProg($$("#app .sec").length);return}
 const opt=e.target.closest(".opt");
 if(opt){opt.classList.toggle("sel");return}
 const chk=e.target.closest("[data-chk]");
 if(chk){const it=chk.closest(".it"),ans=it.querySelector(".ans-line");
  const correct=it.dataset.ans||"";
  [...it.querySelectorAll(".opt")].forEach(o=>{const t=o.textContent.trim(),wasSel=o.classList.contains("sel");
   o.classList.remove("sel");
   if(correct.includes(t))o.classList.add("right");
   else if(wasSel)o.classList.add("wrong")});
  ans.innerHTML=`<b>جواب درست:</b> <span class="de">${tapWords(correct)}</span>`;ans.hidden=false;return}
});
