<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>POOF · مسیر یادگیری</title>
<style>
/* ===== tokens (same as main app) ===== */
:root{--bg:#111111;--surface:#1b1814;--text:#f5f1e8;--muted:#b8b0a4;--accent:#e6b96f;--error:#ff8f87;--ok:#9fd8a8;--border:#4a4032;
--r-sm:12px;--r-md:16px;--r-lg:20px;
--sans:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;--serif:ui-serif,Georgia,"Times New Roman",serif;color-scheme:dark}
html[data-theme=snowy]{--bg:#081421;--surface:#10263a;--text:#f3f8fc;--muted:#b8c7d3;--accent:#f3c879;--error:#ff9d9d;--ok:#9fe0c0;--border:#294861}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.75 var(--sans);-webkit-tap-highlight-color:transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 25px/1 var(--serif)}
h1{margin:0;font:600 21px/1.2 var(--serif);letter-spacing:.16em;color:var(--accent)}.sub{color:var(--muted);font-size:14px}
main{max-width:720px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px))}
h2{margin:6px 0 14px;font-size:21px;color:var(--accent)}h3{margin:0 0 10px;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card.tip{border:1.5px dashed var(--accent)}
.mk{display:grid;gap:10px}.mk .wrong{color:#e08080}.mk .right{color:#9fd6a4}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mute{color:var(--muted)}.sm{font-size:14px}
.de{direction:ltr;unicode-bidi:isolate;font-family:var(--serif)}
div.de{text-align:left}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:700 16px var(--sans);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--accent)}.btn.full{width:100%;margin-top:14px}.btn:disabled{opacity:.5}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* path */
.lesson{display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s}.lesson:hover{border-color:var(--accent)}
.lesson.locked{opacity:.45;cursor:default}.lesson .t{flex:1;min-width:0}.lesson b{display:block;font-size:17px}
.num{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;font:600 21px var(--serif);color:var(--accent);flex:none}
.badge{display:inline-block;padding:0 10px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);font-size:12px;margin-inline-end:8px}
.st{color:var(--muted)}.st.completed{color:var(--ok)}.st.available,.st.in-progress{color:var(--accent)}
/* lesson */
.bub{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;border:1px solid var(--border)}
.bub.a{background:var(--bg);margin-inline-end:auto;border-end-start-radius:4px}.bub.b{background:color-mix(in srgb,var(--accent) 12%,transparent);margin-inline-start:auto;border-end-end-radius:4px}
.bub .de{font-size:18px}
.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}.v:last-child{border:0}
.v .de{font-size:18px;color:var(--accent)}
.gb{white-space:normal;line-height:2}.gb .de{color:var(--accent);font-size:17px}
.read .de{font-size:20px;line-height:2}
/* exercises */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--border)}
.dot.cur{border-color:var(--accent);background:var(--accent)}.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.bad{background:var(--error);border-color:var(--error)}
.q{font-size:19px;margin-bottom:14px}.q .de{color:var(--accent)}
.opt{display:block;width:100%;margin-top:10px;padding:14px 16px;text-align:start;border:1px solid var(--border);border-radius:var(--r-md);background:transparent;color:var(--text);font:500 17px var(--sans);cursor:pointer}
.opt.de{text-align:left}.opt.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.wrong{border-color:var(--error);color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font:17px var(--sans);margin-bottom:6px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 4px}
.fb{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid}.fb.ok{border-color:var(--ok);color:var(--ok)}.fb.bad{border-color:var(--error);color:var(--error)}.fb .de{color:var(--text)}
.score{font:600 58px/1.2 var(--serif);color:var(--accent);text-align:center}.center{text-align:center}
/* floating add-card + sheet + toast */
#selBtn{position:fixed;z-index:50;padding:9px 16px;border-radius:99px;border:0;background:var(--accent);color:var(--bg);font:700 15px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tapPop{position:absolute;z-index:60;min-width:150px;max-width:190px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-pop)}
.w{cursor:pointer;border-bottom:1px dotted var(--muted)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sc{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sc label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
#toast{position:fixed;z-index:80;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:10px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--accent);opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
/* Winding lesson path */
.pnode{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.pring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 22px var(--sans);background:var(--surface);border:2px solid var(--border);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s}
.pnode:active .pring{transform:scale(.92)}
.pnode.done .pring{border-color:var(--ok);background:rgba(159,224,192,.12)}
.pnode.done .pchk{color:var(--ok);font-size:26px}
.pnode.locked{opacity:.45;cursor:not-allowed}
.pnode.locked .pring{border-style:dashed}
.pnode.available .pring,.pnode.in-progress .pring{border-color:var(--accent);box-shadow:0 0 0 4px rgba(230,185,111,.15),0 4px 14px rgba(0,0,0,.4)}
.pnode.in-progress .pring{animation:pring-pulse 2s ease-in-out infinite}
@keyframes pring-pulse{0%,100%{box-shadow:0 0 0 4px rgba(230,185,111,.15),0 4px 14px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 10px rgba(230,185,111,.08),0 4px 14px rgba(0,0,0,.4)}}
.plab{position:absolute;top:50%;transform:translateY(-50%);width:128px;pointer-events:none;font-size:13px}
.plab.right{left:74px;text-align:start}
.plab.left{right:74px;text-align:end}
.plab b{display:block;font-size:13px;line-height:1.35}
.plab .badge{font-size:11px;padding:1px 8px}
.plab .sm{font-size:11px}
.pnum{color:var(--accent)}
/* Snowy learn-path background */
#learnBg{display:block;position:fixed;top:0;left:0;width:100vw;height:100dvh;height:100svh;z-index:0;pointer-events:none}
#learnBg::after{content:"";position:absolute;inset:0;background:rgba(8,20,33,.68)}
html:not([data-theme=snowy]) #learnBg::after{background:rgba(20,16,12,.68)}
#app{position:relative;z-index:1}
header{position:relative;z-index:2}
html[data-theme=snowy] .brand-mascot{display:block!important;animation:poof-float 3s ease-in-out infinite}
html[data-theme=snowy] .hd h1,html[data-theme=snowy] .hd .mark{display:none}
html:not([data-theme=snowy]) .brand-mascot{display:block!important;animation:poof-float 3s ease-in-out infinite}
html:not([data-theme=snowy]) .hd h1,html:not([data-theme=snowy]) .hd .mark{display:none}
@keyframes poof-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.path-mascot{animation:poof-float 3s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}

/* ?v=118: full theme support (tokens mirror main app) */ html[data-theme=lilac]{--bg:#EEF2FF;--surface:#FFFFFF;--text:#1E1B4B;--muted:#55547E;--accent:#4F46E5;--error:#B91C1C;--ok:#166534;--border:#C7D2FE;color-scheme:light} html[data-theme=peachy]{--bg:#FFF7ED;--surface:#FFFFFF;--text:#1C1917;--muted:#57534E;--accent:#C2410C;--error:#B91C1C;--ok:#166534;--border:#FED7AA;color-scheme:light} html[data-theme=minty]{--bg:#F0FDF4;--surface:#FFFFFF;--text:#052E16;--muted:#365314;--accent:#166534;--error:#B91C1C;--ok:#166534;--border:#BBF7D0;color-scheme:light} html[data-theme=ocean]{--bg:#0B1E3A;--surface:#12294D;--text:#E8F1FF;--muted:#A8BDD8;--accent:#38BDF8;--error:#ff9d9d;--ok:#9fe0c0;--border:#2A4A73;color-scheme:dark} html[data-theme=sun]{--bg:#FFF7E0;--surface:#FFFFFF;--text:#3B2A00;--muted:#6B5A2E;--accent:#92400E;--error:#B91C1C;--ok:#166534;--border:#F5D67B;color-scheme:light} html[data-theme=nebula]{--bg:#1A0B2E;--surface:#2A1650;--text:#F3EFFF;--muted:#C9B8E8;--accent:#F5C97B;--error:#ff9d9d;--ok:#9fe0c0;--border:#4C2E85;color-scheme:dark} html[data-theme=lilac] #learnBg{background-image:url('pouf-lilac-scene-path.webp');background-size:cover;background-position:center} html[data-theme=minty] #learnBg{background-image:url('pouf-minty-scene-path.webp');background-size:cover;background-position:center} html[data-theme=nebula] #learnBg{background-image:url('pouf-nebula-scene-path.webp');background-size:cover;background-position:center} html[data-theme=ocean] #learnBg{background-image:url('pouf-blue-scene-boardwalk.webp');background-size:cover;background-position:center} html[data-theme=sun] #learnBg{background-image:url('pouf-sun-scene-stairs.webp');background-size:cover;background-position:center} html[data-theme=lilac] #learnBg::after{background:rgba(255,255,255,.38)} html[data-theme=peachy] #learnBg::after{background:rgba(255,255,255,.72)} html[data-theme=minty] #learnBg::after{background:rgba(255,255,255,.38)} html[data-theme=sun] #learnBg::after{background:rgba(255,255,255,.38)} html[data-theme=ocean] #learnBg::after{background:rgba(8,20,40,.68)} html[data-theme=nebula] #learnBg::after{background:rgba(26,11,46,.68)}</style>
<script>try{var _t=(function(){try{var _th=JSON.parse(localStorage.getItem('poof_v2')||'{}').theme;return (['snowy','lilac','peachy','minty','ocean','sun','nebula'].indexOf(_th)>=0?_th:'classic');}catch(e){return 'classic';}})();document.write('<link rel="stylesheet" id="themeCss" href="theme-'+(_t==='snowy'?'snowy':'classic')+'.css?v=16">')}catch(e){document.write('<link rel="stylesheet" id="themeCss" href="theme-classic.css?v=16">')}</script>
</head>
<style>
/* ---------- Schritte v2: accordion book + reader-style word bar ---------- */
#learnBg{display:none!important}
.hd .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;max-width:720px;margin:0 auto;scrollbar-width:none}
.sch-nav::-webkit-scrollbar{display:none}
.sch-nav .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font:600 13px/1.4 var(--sans);cursor:pointer;white-space:nowrap}
.sch-nav .chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.sch-nav .chip.off{opacity:.55}
.prog{max-width:720px;margin:12px auto 0;padding:0 16px}
.prog .bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.prog .lbl{font-size:12.5px;color:var(--muted);margin-top:5px}
.hint{max-width:720px;margin:8px auto 0;padding:0 16px;color:var(--muted);font-size:13px}
.book{max-width:720px;margin:28px auto 0;padding:0 16px}
.book>h2{font:600 20px/1.3 var(--serif);color:var(--accent);margin:0 0 3px}
.book>.bsub{color:var(--muted);font-size:13px;margin-bottom:6px}
.grp{margin:20px 0 0;padding:0}
.grp>h3{font:600 16.5px/1.3 var(--serif);color:var(--text);margin:0 0 3px}
.grp>.gsub{color:var(--muted);font-size:13px;margin-bottom:10px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin:0 0 10px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:transparent;border:0;color:var(--text);padding:13px 14px;cursor:pointer;font:inherit}
.sec-h .num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 13px/1 var(--sans)}
.sec.done .num{background:var(--ok)}
.sec-h .tt{flex:1;min-width:0}
.sec-h .tt b{font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sec-h .tt .pv{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sec-h .chev{flex:0 0 auto;color:var(--muted);transition:transform .2s;font-size:15px}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{padding:2px 14px 14px}
.sec-b[hidden]{display:none}
.bdg{font-size:11.5px;border:1px solid var(--border);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.bdg.k{color:var(--accent);border-color:var(--accent)}
.done-btn{flex:0 0 auto;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:99px;width:28px;height:28px;font-size:15px;cursor:pointer;line-height:1}
.sec.done .done-btn{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.sec-img{margin:10px 0;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.sec-img img{display:block;width:100%;height:auto}
.de{font-family:var(--serif);font-size:16.5px;line-height:1.9;direction:ltr;text-align:left}
.au{margin:10px 0}
.au audio{width:100%;height:40px}
.au-note{font-size:13px;color:var(--muted);margin-top:6px}
details.tr,details.an{margin-top:10px;border:1px dashed var(--border);border-radius:var(--r-sm);padding:8px 12px}
details.tr summary,details.an summary{cursor:pointer;font-weight:600;font-size:14px}
details.tr .de{margin-top:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:99px;padding:7px 14px;font:500 14.5px/1.4 var(--sans);cursor:pointer}
.opt.sel{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.opt.right{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{background:var(--error);color:#fff;border-color:var(--error)}
.ans-line{margin-top:8px;font-size:14.5px}
.it-q{margin-top:10px}
/* reader-style selection */
.w.sel{background:color-mix(in srgb,var(--accent) 28%,transparent);box-shadow:0 2px 0 var(--accent)}
.w.lpp{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.sel-hd{position:absolute;z-index:260;width:20px;height:20px;background:var(--accent);opacity:.95;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sel-hd::before{content:"";position:absolute;inset:-12px}
#pop{position:fixed;z-index:270;width:min(372px,94vw);padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(0,0,0,.45)}
#popLangMenu{display:flex;gap:6px;margin:0 0 8px}
#popLangMenu[hidden]{display:none}
#popLangMenu button{flex:1;height:30px;font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text)}
.popT{min-height:34px;padding:6px 4px 12px;margin-bottom:8px;border-bottom:1px solid var(--border);font:19px/1.5 var(--serif);text-align:center;word-break:break-word}
.popB{display:flex;gap:2px;justify-content:space-between;align-items:center}
.popB button{width:42px;height:42px;padding:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:19px;cursor:pointer}
.popB .with-lbl{width:auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:0 8px}
.popB .popLang{width:auto;min-width:30px;height:30px;align-self:center;font-size:11px;font-weight:700;padding:0 6px;border:1px solid var(--border);border-radius:999px;flex:none}
.popB .plus{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--bg);flex:none;font-size:24px;line-height:1}
/* ask dialog (✨) */
#ask{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#ask[hidden]{display:none}
.ask-card{width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0}
.ask-word{font:600 26px var(--serif);color:var(--accent);margin:4px 0}
.ask-sec{margin:14px 0}.ask-sec>h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.ask-chip{display:inline-block;border:1px solid var(--border);border-radius:99px;padding:3px 12px;margin:2px 4px 2px 0;font-size:13px}
.ask-load{display:flex;align-items:center;gap:10px;justify-content:center;padding:30px 0;color:var(--muted)}
/* detail sheet (جزئیات) */
#detail{position:fixed;inset:0;z-index:290;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#detail[hidden]{display:none}
#detail .sc{width:100%;max-width:560px;max-height:88dvh;overflow:auto}
.dt-word{font:600 24px var(--serif);color:var(--accent)}
.dt-sec{margin:12px 0}
.dt-sec h4{margin:0 0 5px;font-size:13px;color:var(--muted);font-weight:600}
/* ---------- Schritte v3: chapter path (book feel + Duolingo wayfinding) ---------- */
#progRail{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border);padding:10px 16px 8px;margin:0}
#progRail .bar{height:8px}
#progRail .row{margin-top:6px}
.mapbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px;font:600 12.5px var(--sans);cursor:pointer}
.mapbtn:active{transform:scale(.96)}
.chbar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:8px}
.chbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

<script>
/* =====================================================================
   POOF Schritte v2 — smart book for Schritte international Neu A1.1.
   Word bar = the reader's #pop system (tap = select + bar, drag handles,
   long-press drag, sentence extension, + card, details, ask).
   Reads shared localStorage "poof_v2" (theme, decks, cards, worker proxy).
   Writes ONLY: db.schritte (progress) and db.cards (new cards).
   Lesson data: schritte-lektion-<n>.json (text only; images in schritte-images/,
   audio in schritte-audio/ — both uploaded by the user via GitHub web UI).
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>String(s||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const FA=/[\u0600-\u06FF]/;
const faNum=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

/* ---------- shared db (same pattern as learn.html) ---------- */
const K="poof_v2";let db=null;
function readRaw(){try{const d=JSON.parse(localStorage.getItem(K));return d&&d.v===2?d:null}catch(e){return null}}
function load(){db=readRaw();if(!db)db={v:2,schritte:{},cards:[],decks:[{id:"default",name:"پیش‌فرض"}]};if(!db.schritte||typeof db.schritte!=="object")db.schritte={};if(!db.cards)db.cards=[];if(!db.decks)db.decks=[{id:"default",name:"پیش‌فرض"}];return true}
function commit(fn){const d=readRaw()||db;if(!d)return false;if(!d.schritte||typeof d.schritte!=="object")d.schritte={};if(!d.cards)d.cards=[];if(!d.decks)d.decks=[{id:"default",name:"پیش‌فرض"}];fn(d);try{localStorage.setItem(K,JSON.stringify(d));db=d;return true}catch(e){toast("ذخیره‌سازی ناموفق بود");return false}}
function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- mascots: 5 poses per theme, header uses wave (like the app) ---------- */
const MASCOT_WAVE={snowy:"snowy-wave.webp",classic:"pouf-classic-wave.webp",lilac:"pouf-lilac-wave.webp",minty:"pouf-minty-wave.webp",ocean:"pouf-ocean-smile.webp",sun:"pouf-sun-wave.webp",nebula:"pouf-nebula-wave.webp"};
function mascotWave(t){return MASCOT_WAVE[t]||MASCOT_WAVE.snowy}

/* ---------- tap-a-word ---------- */
function tapWords(t){return String(t||"").split(/(\s+)/).map(p=>{
  if(/^\s+$/.test(p)||!p)return esc(p);
  const m=p.match(/^([^A-Za-zÀ-ÿ'’-]*)([A-Za-zÀ-ÿ'’-]+)([^A-Za-zÀ-ÿ'’-]*)$/);
  if(!m)return esc(p);
  return `${esc(m[1])}<span class="w" data-w="${esc(m[2].toLowerCase())}">${esc(m[2])}</span>${esc(m[3])}`;
 }).join("")}

/* ---------- dictionary: 10k German→Persian (dict-fa.jsonl) ---------- */
let _fa=null,_faP=null;
async function loadFa(){if(_fa)return _fa;
 if(!_faP)_faP=(async()=>{const r=await fetch("./dict-fa.jsonl");if(!r.ok)throw new Error("fa-dict "+r.status);
  const txt=await r.text(),byKey=new Map(),byForm=new Map();
  for(const line of txt.split("\n")){const t=line.trim();if(!t)continue;let rec;try{rec=JSON.parse(t)}catch(e){continue}
   const lk=String(rec.lemma||"").toLowerCase();if(!lk)continue;
   if(!byKey.has(lk))byKey.set(lk,[]);byKey.get(lk).push(rec);
   const fm=rec.forms||{},addF=f=>{if(!f)return;const k=String(f).toLowerCase().split(/\s+/).pop();if(k&&k!==lk&&!byForm.has(k))byForm.set(k,rec)};
   addF(fm.pres3);addF(fm.past);addF(fm.perf);if(rec.pl&&rec.pl!=="—")addF(rec.pl);}
  return {byKey,byForm}})().catch(e=>{_faP=null;throw e});
 _fa=await _faP;return _fa}
const VERB_FORMS={bin:"sein",bist:"sein",seid:"sein",sind:"sein",heiße:"heißen",komme:"kommen",kommst:"kommen",
 sprichst:"sprechen",spreche:"sprechen",sprich:"sprechen",lerne:"lernen",lernst:"lernen",wohne:"wohnen",wohnst:"wohnen",
 arbeite:"arbeiten",arbeitest:"arbeiten",mache:"machen",machst:"machen",spiele:"spielen",spielst:"spielen"};
async function faMeanings(w){try{const d=await loadFa(),k=w.toLowerCase();
  let recs=d.byKey.get(k),via=null;
  if(!recs&&d.byForm.has(k)){recs=[d.byForm.get(k)];via="form"}
  if(!recs&&VERB_FORMS[k]){recs=d.byKey.get(VERB_FORMS[k]);via="verb:"+VERB_FORMS[k]}
  if(!recs)return[];
  const out=[];
  for(const rec of recs)for(const s of (rec.senses||[]))if(s.fa)out.push({fa:s.fa,ipa:rec.ipa||"",pos:rec.pos||"",via:via||""});
  return out.slice(0,4)}catch(e){return[]}}

/* ---------- dictionary: offline manual dict ---------- */
let _man=null,_manP=null;
async function loadManual(){if(_man)return _man;
 if(!_manP)_manP=(async()=>{const r=await fetch("./manual-dict.json");if(!r.ok)throw new Error("manual "+r.status);
  const j=await r.json(),byKey=new Map();
  for(const e of j.entries){const k=String(e.headword||"").toLowerCase();if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(e)}
  return byKey})().catch(e=>{_manP=null;throw e});
 _man=await _manP;return _man}
async function manMeanings(w){try{const m=await loadManual(),arr=m.get(w.toLowerCase());if(!arr)return[];
  const out=[];
  for(const e of arr){
   for(const s of (e.senses||[]))if(s.persian)out.push({fa:s.persian,ctx:s.context_de||"",ex:(s.examples||[])[0]||""});
   if(e.persian)out.push({fa:e.persian,ctx:"",ex:""});
  }
  return out.slice(0,4)}catch(e){return[]}}

/* ---------- dictionary: Wiktionary + MyMemory (online) ---------- */
const dedupDefs=ds=>{const n=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();
 return ds.filter((d,i)=>{const a=n(d.def);if(!a)return false;
  if(ds.findIndex(o=>n(o.def)===a)<i)return false;
  return !ds.some((o,j)=>j!==i&&n(o.def).length>a.length&&n(o.def).includes(a))})};
async function wikiDefs(w){try{const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(w));
  if(!r.ok)return[];const j=await r.json(),sec=j.de||j.en;if(!sec)return[];const out=[];
  for(const s of sec){for(const d of dedupDefs((s.definitions||[]).slice(0,3).map(d=>({def:strip(d.definition)}))).filter(d=>d.def))out.push({pos:s.partOfSpeech,def:d.def})}
  return out.slice(0,4)}catch(e){return[]}}
async function mmFa(w){try{const r=await fetch("https://api.mymemory.translated.net/get?langpair=de|fa&q="+encodeURIComponent(w));
  const j=await r.json();
  return [...new Set([j.responseData&&j.responseData.translatedText,...(j.matches||[]).map(m=>m.translation)].filter(Boolean))].slice(0,3)}catch(e){return[]}}
async function mmTr(text,from,to){try{const r=await fetch("https://api.mymemory.translated.net/get?langpair="+from+"|"+to+"&q="+encodeURIComponent(text));
  const j=await r.json();return (j.responseData&&j.responseData.translatedText)||""}catch(e){return""}}

/* ---------- inline translation (reader's tr): Google first, MyMemory fallback ---------- */
const _trCache={};
async function tr(text,from,to){
 const k=from+">"+to+":"+text.toLowerCase();
 if(_trCache[k])return _trCache[k];
 let r="";
 try{const j=await (await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+from+"&tl="+to+"&q="+encodeURIComponent(text))).json();
  r=j[0].map(x=>x[0]).join("").trim()}catch(e){}
 if(!r)r=await mmTr(text,from,to);
 if(r)_trCache[k]=r;
 return r;
}

/* ---------- pronunciation + copy ---------- */
let _saySeq=0;
function say(t){const seq=++_saySeq;
 try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}
 const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;
 try{for(const v of (speechSynthesis.getVoices()||[])){if(v.lang&&v.lang.toLowerCase().indexOf("de")===0){u.voice=v;break}}}catch(e){}
 u.onerror=()=>{if(seq===_saySeq)toast("صدا روی این دستگاه پخش نشد")};
 try{speechSynthesis.speak(u)}catch(e){toast("صدا روی این دستگاه پخش نشد")}}
function copyText(t){
 const done=()=>toast("کپی شد");
 const legacy=()=>{const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");
  a.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(a);a.focus({preventScroll:true});a.select();a.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();
  if(ok)done();else toast("کپی ممکن نشد")};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,legacy);else legacy();
}

/* ---------- reader-style selection engine (scoped to one .de block) ---------- */
let W=[],sel=null,selRoot=null,lpSuppress=false;
const LB={de:"DE",en:"EN",fa:"فا"};
let pop={n:0,text:"",ctx:"",src:"schritte:L1",trg:"fa",lang:"de",tr:"",word:"",_rect:null,_explang:null};
const selText=()=>!sel||!W.length?"":W.slice(sel.a,sel.b+1).map(w=>w.textContent).join(" ");
function sentRange(root,a,b){ /* sentence boundaries from the text after each word */
 let ends=[];
 W.forEach((w,i)=>{const nx=w.nextSibling;
  if(!nx||/[.!?…\u2026]/.test(nx.textContent||""))ends.push(i)});
 if(!ends.length||ends[ends.length-1]<W.length-1)ends.push(W.length-1);
 let lo=0,hi=ends[0];
 for(const e of ends){if(e>=a){hi=e;break}lo=e+1}
 return [lo,hi];
}
function ctxFor(root){ /* the sentence containing the selection, plain text */
 if(!sel||!W.length)return "";
 const [lo,hi]=sentRange(root,sel.a,sel.b);
 return W.slice(lo,hi+1).map(w=>w.textContent).join(" ");
}
function drawSel(){
 $$("#app .w.sel").forEach(x=>x.classList.remove("sel"));
 const hs=$("#hs"),he=$("#he");
 if(!sel||!W[sel.a]||!W[sel.b]){hs.hidden=he.hidden=true;return}
 W.forEach((x,i)=>x.classList.toggle("sel",i>=sel.a&&i<=sel.b));
 const f=W[sel.a].getClientRects()[0],l=[...W[sel.b].getClientRects()].pop();
 if(!f||!l){hs.hidden=he.hidden=true;return}
 hs.hidden=he.hidden=false;
 hs.style.cssText=`left:${f.left+scrollX-20}px;top:${f.bottom+scrollY-2}px;border-radius:50% 0 50% 50%`;
 he.style.cssText=`left:${l.right+scrollX}px;top:${l.bottom+scrollY-2}px;border-radius:0 50% 50% 50%`;
}
function placePop(r){
 const p=$("#pop");p.hidden=false;const w=p.offsetWidth,h=p.offsetHeight,top=8;
 let y=r.top-h-12;
 if(y<top)y=r.bottom+40;
 if(y+h>innerHeight-8)y=Math.max(top,innerHeight-h-8);
 p.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+"px";p.style.top=y+"px";
}
function popSrcLang(){
 if(FA.test(pop.text))return "fa";
 if(pop._explang)return pop._explang;
 return "de";

const CH_BIG={"Folge 1":"1",Grammatik:"§",Kommunikation:"K",Lernziele:"L",Audiotraining:"♪",Zwischendurch:"✦",Test:"T"};
const TEST_PTS={"L1-AB-Test1":5,"L1-AB-Test2":7,"L1-AB-Test3":3,"L1-AB-Test4":9,"L1-AB-Test5":5};
let CHAPS=[],chIdx=0,chDir=1;
function buildChapters(){
 CHAPS=[];
 for(const key of CH_ORDER){
  const kb=LESSON.sections.map((s,i)=>({s,i})).filter(x=>x.s.schritt===key&&x.s.source==="Kursbuch");
  const ab=LESSON.sections.map((s,i)=>({s,i})).filter(x=>x.s.schritt===key&&x.s.source==="Arbeitsbuch");
  if(/^[A-E]$/.test(key)){
   if(kb.length)CHAPS.push({id:key+"-kb",key,book:"kb",items:kb});
   if(ab.length)CHAPS.push({id:key+"-ab",key,book:"ab",items:ab});
  }else{
   const all=[...kb,...ab];
   if(all.length)CHAPS.push({id:key,key,book:all[0].s.source==="Arbeitsbuch"?"ab":"kb",items:all});
  }
 }
}
function chTitle(c){
 if(c.book==="ab"&&/^[A-E]$/.test(c.key)){
  const exs=c.items.map(x=>parseInt(x.s.exercise,10)).filter(n=>!isNaN(n));
  const range=exs.length?` · تمرین‌های ${faNum(Math.min(...exs))} تا ${faNum(Math.max(...exs))}`:"";
  return {de:CH_DE[c.key],fa:"کتاب کار"+range};
 }
 return {de:CH_DE[c.key],fa:(c.book==="ab"?"کتاب کار · ":"کتاب درسی · ")+CH_FA[c.key]};
}
function chDoneCount(c){const d=doneSet();return c.items.filter(x=>d[x.s.id]).length}
function chIsDone(c){return c.items.length>0&&chDoneCount(c)===c.items.length}
function goChapter(d){
 const ni=chIdx+d;
 if(ni<0||ni>=CHAPS.length)return;
 chDir=d;chIdx=ni;
 commit(dd=>{const o=dd.schritte.L1||(dd.schritte.L1={});o.chapter=chIdx});
 render();
 const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
 window.scrollTo({top:0,behavior:rm?"auto":"smooth"});
}
function renderMap(){
 const B=$("#chmapBody");if(!B)return;
 B.innerHTML=CHAPS.map((c,i)=>{
  const t=chTitle(c),dn=chDoneCount(c),done=dn===c.items.length;
  return `<button type="button" class="chm-row${i===chIdx?" cur":""}${done?" done":""}" data-ch="${i}">
   <span class="n">${done?"✓":faNum(i+1)}</span>
   <span class="t"><b dir="ltr" style="text-align:left;display:block">${esc(t.de)}</b><span>${esc(t.fa)}</span></span>
   <span class="mute" style="font-size:12.5px">${faNum(dn)}/${faNum(c.items.length)}</span></button>`;
 }).join("");
}
$("#mapBtn").onclick=()=>{renderMap();$("#chmap").hidden=false};
$("#chmapX").onclick=()=>{$("#chmap").hidden=true};
$("#chmap").addEventListener("click",e=>{if(e.target.id==="chmap")$("#chmap").hidden=true});
$("#chmapBody").addEventListener("click",e=>{
 const r=e.target.closest("[data-ch]");if(!r)return;
 const ni=+r.dataset.ch;
 $("#chmap").hidden=true;
 if(ni===chIdx)return;
 chDir=ni>chIdx?1:-1;chIdx=ni;
 commit(dd=>{const o=dd.schritte.L1||(dd.schritte.L1={});o.chapter=chIdx});
 render();window.scrollTo({top:0});
});

/* ---------- v3.1 rich text: sentences on their own lines, a/b/c parts, {{blue}} [[pink]] [?] blanks ---------- */
function plainText(t){return String(t||"").replace(/\{\{(.*?)\}\}/g,"$1").replace(/\[\[(.*?)\]\]/g,"$1").replace(/\[\?\]/g,"……")}
function richInline(t){
 const parts=String(t||"").split(/(\{\{.*?\}\}|\[\[.*?\]\]|\[\?\])/g);
 return parts.map(p=>{
  if(/^\{\{.*\}\}$/.test(p))return `<span class="hl-b">${tapWords(p.slice(2,-2))}</span>`;
  if(/^\[\[.*\]\]$/.test(p))return `<span class="hl-p">${tapWords(p.slice(2,-2))}</span>`;
  if(p==="[?]")return `<span class="gap" aria-label="جای خالی"></span>`;
  return tapWords(p);
 }).join("");
}
function richText(t){
 const raw=String(t||"").replace(/z\.\s*B\./g,"z.\u00A0B.").replace(/Nr\.\s/g,"Nr.\u00A0");
 const sents=splitSent(raw);
 let html="",open=false;
 const close=()=>{if(open){html+="</div>";open=false}};
 for(const s of sents){
  const m=s.match(/^([a-f])\s+/)||s.match(/^([a-f])[.)]\s+/)||s.match(/^(\d+)[.)]\s+/);
  if(m){close();html+=`<div class="tx-part"><span class="tx-part-lbl">${esc(m[1])}</span><div class="tx-part-body"><div class="de tx-line">${richInline(s.slice(m[0].length))}</div>`;open=true;continue}
  if(open){html+=`<div class="de tx-line">${richInline(s)}</div>`;continue}
  html+=`<div class="de tx-line">${richInline(s)}</div>`;
 }
 close();
 return html;
}

/* ---------- book-faithful special bodies ---------- */
function splitSent(t){return String(t||"").split(/(?<=[.!?…])\s+/).map(x=>x.trim()).filter(Boolean)}
function pinkEnd(form,end){
 if(!form.endsWith(end))return esc(form);
 return esc(form.slice(0,form.length-end.length))+'<b class="pk">'+esc(end)+"</b>";
}
function conjCell(form,who){
 if(who==="ich")return form==="bin"?esc(form):pinkEnd(form,"e");
 if(who==="du")return form.endsWith("st")?pinkEnd(form,"st"):pinkEnd(form,"t");
 return form==="sind"?esc(form):pinkEnd(form,"en");
}
function grammarBody(s){
 try{
  const t=s.text||"";
  const i1=t.indexOf("1 Aussage"),i2=t.indexOf("2 W-Frage"),i3=t.indexOf("3 Verb:"),im=t.indexOf("Merke:"),ik=t.indexOf("Kommunikation.");
  if(i1<0||i2<0||i3<0||im<0||ik<0)return null;
  const sentBlock=txt=>splitSent(txt).map(x=>`<div class="de" style="font-size:15.5px">${richInline(x)}</div>`).join("");
  /* book p.18: Aussage/W-Frage as Position-2 tables — the verb (2nd position) in pink */
  const VERBS2=new Set(["ist","bin","bist","sind","komme","kommst","kommt","kommen","heiße","heißt","heißen","spreche","sprichst","spricht","sprechen"]);
  const pos2Table=txt=>{
   const rows=splitSent(txt).map(sent=>{
    const tok=sent.split(/\s+/);
    let vi=tok.findIndex((w,i)=>i>0&&VERBS2.has(w.replace(/[^A-Za-zÀ-ÿß]+$/,"").toLowerCase()));
    if(vi<1)return `<tr><td colspan="3"><span class="de" style="font-size:15px">${richInline(sent)}</span></td></tr>`;
    const subj=tok.slice(0,vi).join(" "),verb=tok[vi],rest=tok.slice(vi+1).join(" ");
    return `<tr><td><span class="de" style="font-size:15px">${richInline(subj)}</span></td><td><span class="de pk" style="font-size:15px">${richInline(verb)}</span></td><td><span class="de" style="font-size:15px">${richInline(rest)}</span></td></tr>`;
   }).join("");
   return `<table class="gram-tab"><tr><th></th><th>Position 2</th><th></th></tr>${rows}</table>`;
  };
  const aussage=t.slice(i1+9,i2).trim();
  const wfrage=t.slice(i2+9,i3).trim();
  const komm=t.slice(ik+14);
  const blocks=[];
  for(const h of ["BEGRÜSSUNG:","ABSCHIED:","NAME:"]){
   const a=komm.indexOf(h);if(a<0)continue;
   let b=komm.length;
   for(const h2 of ["BEGRÜSSUNG:","ABSCHIED:","NAME:"]){const j=komm.indexOf(h2,a+1);if(j>=0&&j<b)b=j}
   blocks.push({h:h.replace(":",""),txt:komm.slice(a+h.length,b).trim()});
  }
  const CONJ=[["ich","komme","heiße","spreche","bin"],["du","kommst","heißt","sprichst","bist"],["Sie","kommen","heißen","sprechen","sind"]];
  const VERBS=["kommen","heißen","sprechen","sein"];
  let h=`<div class="komm-h">۱ · Aussage</div>${pos2Table(aussage)}`;
  h+=`<div class="komm-h">۲ · W-Frage</div>${pos2Table(wfrage)}`;
  h+=`<div class="komm-h">۳ · Verb: Konjugation</div><table class="gram-tab"><tr><th></th>${VERBS.map(v=>`<th>${esc(v)}</th>`).join("")}</tr>`;
  for(const r of CONJ){h+=`<tr><td>${r[0]}</td>${r.slice(1).map(f=>`<td>${conjCell(f,r[0])}</td>`).join("")}</tr>`}
  h+=`</table><div class="merke"><b>Merke:</b> ich <span class="pk">-e</span>, du <span class="pk">-st</span>, Sie <span class="pk">-en</span> · du heißt, du sprichst</div>`;
  for(const b of blocks){h+=`<div class="komm-h">${esc(b.h)}</div>${sentBlock(b.txt)}`}
  h+=`<div class="merke"><b>Merke:</b> <span dir="ltr">Ich heiße <s>Frau Baumann</s></span> — <span dir="ltr">Mein Name ist Frau Baumann</span></div>`;
  return h;
 }catch(e){return null}
}
function kommBody(s){
 try{
  const t=s.text||"";
  const heads=["HERKUNFT:","SPRACHE:","ENTSCHULDIGUNG:","BITTEN UND DANKEN:","STRATEGIEN:"];
  let found=0,out="";
  for(let k=0;k<heads.length;k++){
   const a=t.indexOf(heads[k]);if(a<0)continue;found++;
   let b=t.length;
   for(let j=k+1;j<heads.length;j++){const jj=t.indexOf(heads[j],a+1);if(jj>=0&&jj<b)b=jj}
   const txt=t.slice(a+heads[k].length,b).trim();
   out+=`<div class="komm-h">${esc(heads[k].replace(":",""))}</div>`+splitSent(txt).map(x=>`<div class="de" style="font-size:15.5px">${richInline(x)}</div>`).join("");
  }
  return found>=3?out:null;
 }catch(e){return null}
}
function lernzieleBody(s){
 try{
  const t=s.text||"";
  const a=t.indexOf("Ich kann jetzt");
  if(a<0)return null;
  let rest=t.slice(a);
  const tailI=rest.indexOf("Ich kenne jetzt");
  let tail="";
  if(tailI>=0){tail=rest.slice(tailI);rest=rest.slice(0,tailI)}
  const parts=rest.split(/\s([A-E])\s/);
  const items=[];
  for(let i=1;i<parts.length;i+=2){if(parts[i]&&parts[i+1])items.push({L:parts[i],tx:parts[i+1].trim()})}
  if(items.length<3)return null;
  const saved=(db.schritte&&db.schritte.L1&&db.schritte.L1.lernziele)||{};
  let h=`<div class="komm-h">Ich kann jetzt …</div>`;
  for(const it of items){
   const v=saved[it.L]||0;
   h+=`<div class="lz-row"><span class="lt">${it.L}</span><div class="tx"><div class="de" style="font-size:15px">${richInline(it.tx)}</div></div>
    <div class="lz-sm" data-lz="${it.L}">
     <button type="button" data-v="3" class="${v===3?"on":""}" aria-label="خوب بلدم">☺</button>
     <button type="button" data-v="2" class="${v===2?"on":""}" aria-label="نسبتاً">😐</button>
     <button type="button" data-v="1" class="${v===1?"on":""}" aria-label="هنوز سخت است">☹</button>
    </div></div>`;
  }
  if(tail)h+=`<div class="komm-h">Ich kenne jetzt …</div><div class="de" style="font-size:15px">${richInline(tail.replace("Ich kenne jetzt …","").trim())}</div>`;
  return h;
 }catch(e){return null}
}
function liedBody(s){
 try{
  const t=s.text||"";
  const a=t.indexOf("sprechen Sie mit.");
  if(a<0)return null;
  const words=t.slice(a+("sprechen Sie mit.".length)).split(",").map(x=>x.trim().replace(/\.+$/,"")).filter(Boolean);
  if(words.length<20)return null;
  const abc="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let h=`<div class="komm-h">Das Alphabet · آهنگ الفبا</div><div class="abc-grid">`;
  words.forEach((w,i)=>{h+=`<div class="abc-cell"><b>${abc[i]||""}</b><span class="de" style="font-size:14px">${richInline(w)}</span></div>`});
  return h+"</div>";
 }catch(e){return null}
}
function specialBody(s){
 if(s.id==="L1-Grammatik"){const g=grammarBody(s);if(g)return g}
 if(s.id==="L1-Kommunikation-19"){const g=kommBody(s);if(g)return g}
 if(s.id==="L1-Lernziele"){const g=lernzieleBody(s);if(g)return g}
 if(s.id==="L1-Zwischen-Lied"){const g=liedBody(s);if(g)return g}
 return richText(s.text);
}

/* ---------- progress ---------- */
function doneSet(){return (db.schritte&&db.schritte.L1&&db.schritte.L1.done)||{}}
function toggleDone(id){
 const was=CHAPS[chIdx]?chDoneCount(CHAPS[chIdx]):0;
 commit(d=>{const o=d.schritte.L1||(d.schritte.L1={});o.done=o.done||{};o.done[id]=!o.done[id]});
 render();
 const c=CHAPS[chIdx];
 if(c&&chIsDone(c)&&was<c.items.length){
  if(navigator.vibrate)try{navigator.vibrate([12,40,12])}catch(e){}
  toast("آفرین! این فصل کامل شد 🎉");
 }
}
function updateProg(total){const d=doneSet(),n=Object.values(d).filter(Boolean).length;
 $("#progFill").style.width=(total?Math.round(n/total*100):0)+"%";
 $("#progLbl").textContent=`${faNum(n)} از ${faNum(total)} تمرین · درس ۱`;
 const c=CHAPS[chIdx];
 if(c){const dn=chDoneCount(c);
  const cf=$("#chFill");if(cf)cf.style.width=(c.items.length?Math.round(dn/c.items.length*100):0)+"%";
  const cl=$("#chLbl");if(cl)cl.textContent=`فصل ${faNum(chIdx+1)} از ${faNum(CHAPS.length)} · ${faNum(dn)} از ${faNum(c.items.length)} تمرین این فصل`;}
}

/* ---------- render: two books, accordion sections ---------- */
function itemsHTML(s){
 if(!s.items||!s.items.length)return "";
 return `<div class="it-q">${s.items.map((it,i)=>{
  if(it.type==="multiple_choice"&&it.options){
   const ans=it.answer||"";
   return `<div class="it" data-ans="${esc(ans)}"><div class="de" style="font-size:15px">${richInline(it.question||"")}</div>
    <div class="opts">${it.options.map(o=>`<button type="button" class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="chk" hidden><button type="button" class="btn ghost" data-chk="1">بررسی ✓</button></div></div>`;
  }
  if(it.type==="fill_blank"&&it.blanks){
   return `<div class="it"><div class="de" style="font-size:15px">${richInline((it.question||"").replace(/_+/g,"……"))}</div>
    <div class="ans-line" hidden><b>جواب:</b> <span dir="ltr">${esc(it.blanks.map(b=>b.answer||"").join(" · "))}</span></div>
    <div class="chk"><button type="button" class="btn ghost" data-chk="1">نمایش جواب</button></div></div>`;
  }
  return `<div class="it"><div class="de" style="font-size:15px">${richInline(it.question||"")}</div></div>`;
 }).join("")}</div>`;
}
function secHTML(s,idx,prevImg){
 const done=!!doneSet()[s.id];
 const sub=secSub(s);
 const label=sub||s.exercise;
 const pv=strip(plainText(s.text)).slice(0,70)+(strip(plainText(s.text)).length>70?"…":"");
 const img=s.image&&s.image!==prevImg?`<div class="sec-img"><img src="schritte-images/${s.image}" alt="صفحه‌ی کتاب" loading="lazy" onerror="this.closest('.sec-img').remove()"></div>`:"";
 const audio=s.audio?`<div class="au"><audio controls preload="metadata" src="schritte-audio/${s.audio}"></audio><div class="au-note" hidden>فایل صوتی هنوز در گیت‌هاب بارگذاری نشده — بعد از پوش، همین‌جا پخش می‌شود</div></div>`:"";
 const tr=s.transcript?`<details class="tr"><summary>متن صوت ◂</summary>${richText(s.transcript)}</details>`:"";
 const ans=s.answers&&s.answers.length?`<details class="an"><summary>جواب‌ها ◂</summary>${s.answers.map(a=>`<div class="ans-line de" dir="ltr">${richInline(a)}</div>`).join("")}</details>`:"";
 return `<article class="sec${done?" done":""}" id="sec-${s.id}" data-id="${s.id}">
  <div class="sec-top" style="display:flex;align-items:center;gap:8px;padding:0 8px 0 0">
   <button type="button" class="sec-h" data-sec="${s.id}" aria-expanded="false">
    <span class="num">${faNum(idx+1)}</span>
    <span class="tt"><b dir="ltr">${esc(label)}</b><span class="pv" dir="ltr">${esc(pv)}</span></span>
    <span class="bdg k">${KIND[s.kind]||s.kind}</span>
    ${TEST_PTS[s.id]?`<span class="bdg">از ${faNum(TEST_PTS[s.id])} نمره</span>`:""}
    <span class="bdg">ص ${faNum(s.page)}</span>
    <span class="chev">▾</span>
   </button>
   <button type="button" class="done-btn" data-done="${s.id}" aria-label="انجام شد">${done?"✓":"○"}</button>
  </div>
  <div class="sec-b" hidden>${img}${specialBody(s)}${audio}${tr}${itemsHTML(s)}${ans}</div>
 </article>`;
}
function render(){
 const app=$("#app");
 const secs=LESSON.sections;
 buildChapters();
 if(chIdx>=CHAPS.length)chIdx=0;
 updateProg(secs.length);
 const c=CHAPS[chIdx];
 const t=chTitle(c);
 const doneN=chDoneCount(c), total=c.items.length;
 const big=CH_BIG[c.key]||c.key;
 const hero=`<div class="ch-view${chDir<0?" rev":""}">
  <div class="ch-hero${c.book==="ab"?" ab":""}">
   <div class="band"><div class="ltr"><span class="big">${esc(big)}</span>${esc(t.de)}</div>
   <div class="fa-sub">${esc(t.fa)}</div></div>
   <div class="meta"><span>فصل ${faNum(chIdx+1)} از ${faNum(CHAPS.length)}</span><span class="sp"></span><span>${c.book==="ab"?"📗 کتاب کار":"📘 کتاب درسی"}</span><span>ص ${faNum(c.items[0].s.page)}–${faNum(c.items[c.items.length-1].s.page)}</span></div>
   <div class="ch-prog"><div class="bar"><i style="width:${total?Math.round(doneN/total*100):0}%"></i></div>
   <div class="lbl">${doneN===total?"✓ این فصل کامل شد":`${faNum(doneN)} از ${faNum(total)} تمرین · ${faNum(total-doneN)} تمرین مانده تا پایان این فصل`}</div>
   <div class="ch-dots">${c.items.map(x=>`<i class="${doneSet()[x.s.id]?"ok":""}"></i>`).join("")}</div></div>
  </div>
  <p class="ch-sec-count">${faNum(total)} تمرین در این فصل</p>`;
 let html=hero;
 let prevImg=null;
 for(const {s,i} of c.items){html+=secHTML(s,i,prevImg);prevImg=s.image||prevImg}
 const prev=chIdx>0, next=chIdx<CHAPS.length-1;
 const allDone=doneN===total;
 html+=`<div class="ch-foot">
   <button type="button" class="btn ghost" data-nav="-1" ${prev?"":"disabled"}>→ فصل قبل</button>
   <button type="button" class="btn${allDone?" done-next":""}" data-nav="1" ${next?"":"disabled"}>${next?(allDone?"✓ فصل بعد":"فصل بعد ←"):"پایان درس ۱ ✓"}</button>
  </div>
  ${allDone?`<p class="ch-done-note">آفرین! این فصل کامل شد 🎉</p>`:""}`;
 html+="</div>";
 app.innerHTML=html;
  /* note: networkState is 3 right after insertion even for valid files (preload=none),
     so ONLY the error event may reveal the note — with preload=metadata the
     browser fetches headers, so a missing file fires error and the note appears */
  $$(".au audio").forEach(a=>{a.addEventListener("error",()=>{a.hidden=true;const n=a.parentElement.querySelector(".au-note");if(n)n.hidden=false},{once:true})});
}

/* ---------- delegated clicks ---------- */
$("#app").addEventListener("click",e=>{
 const nav=e.target.closest("[data-nav]");
 if(nav&&!nav.disabled){goChapter(+nav.dataset.nav);return}
 const lzb=e.target.closest("[data-lz] button");
 if(lzb){
  const grp=lzb.closest("[data-lz]"),L=grp.dataset.lz,v=+lzb.dataset.v;
  commit(d=>{const o=d.schritte.L1||(d.schritte.L1={});o.lernziele=o.lernziele||{};o.lernziele[L]=v});
  grp.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===lzb));
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
  return;
 }
 const dbtn=e.target.closest("[data-done]");
 if(dbtn){e.stopPropagation();toggleDone(dbtn.dataset.done);return}
 const h=e.target.closest(".sec-h");
 if(h){
  const art=h.closest(".sec"),body=art.querySelector(".sec-b");
  const open=art.classList.toggle("open");
  h.setAttribute("aria-expanded",open?"true":"false");
  body.hidden=!open;
  if(!open){$("#pop").hidden=true;sel=null;drawSel()}
  return;
 }
 const opt=e.target.closest(".opt");
 if(opt){
  const it=opt.closest(".it");if(!it||it.dataset.locked)return;
  it.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  opt.classList.add("sel");
  const chk=it.querySelector(".chk");if(chk)chk.hidden=false;
  return;
 }
 const chk=e.target.closest("[data-chk]");
 if(chk){
  const it=chk.closest(".it");if(!it)return;
  const ans=it.dataset.ans;
  if(ans!==undefined){
   const selOpt=it.querySelector(".opt.sel");
   if(!selOpt){toast("اول یک گزینه را انتخاب کنید");return}
   const ok=String(selOpt.dataset.opt).trim().toLowerCase()===String(ans).trim().toLowerCase();
   it.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong")});
   selOpt.classList.add(ok?"right":"wrong");
   it.dataset.locked="1";
   toast(ok?"درسته ✓":"جواب درست: "+ans);
  }else{
   const al=it.querySelector(".ans-line");if(al)al.hidden=false;
  }
  return;
 }
 const w=e.target.closest(".w");
 if(w&&!lpSuppress)pick(w,e.shiftKey);
});
$("#app").addEventListener("keydown",e=>{
 if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("sec-h")){e.preventDefault();e.target.click()}
});
document.addEventListener("click",e=>{
 if(e.target.closest("#pop")||e.target.closest(".w")||e.target.closest("#detail")||e.target.closest("#ask"))return;
 if(!$("#pop").hidden){$("#pop").hidden=true;sel=null;drawSel()}
});

/* ---------- lesson nav + init ---------- */
function renderNav(){
 $("#lessonNav").innerHTML=LESSONS.map(l=>`<button type="button" class="chip${l.n===1?" on":" off"}" data-l="${l.n}">${l.n===1?"✓ ":""}درس ${faNum(l.n)} · ${esc(l.title)}</button>`).join("");
}
$("#lessonNav").addEventListener("click",e=>{
 const b=e.target.closest("[data-l]");if(!b)return;
 const n=+b.dataset.l;
 if(n!==1){toast("درس "+faNum(n)+" هنوز آماده نیست — به‌زودی");return}
 document.querySelector("#app").scrollIntoView({behavior:"smooth"});
});
$("#backApp").onclick=()=>{location.href="index.html"};
async function init(){
 load();
 try{const d=readRaw();document.documentElement.dataset.theme=(d&&d.theme)||"classic"}catch(e){document.documentElement.dataset.theme="classic"}
 const bm=$("#brandMascot");if(bm)bm.src=mascotWave(document.documentElement.dataset.theme);
 renderNav();
 try{
  const r=await fetch("schritte-lektion-1.json");if(!r.ok)throw new Error("HTTP "+r.status);
  LESSON=await r.json();
  buildChapters();
  const saved=(db.schritte&&db.schritte.L1&&db.schritte.L1.chapter)||0;
  chIdx=Math.max(0,Math.min(saved,CHAPS.length-1));
  render();
 }catch(e){$("#app").innerHTML=`<p style="padding:24px;color:var(--muted)">فایل درس بارگذاری نشد: ${esc(e.message||"خطا")}</p>`}
}
init();
</script>
