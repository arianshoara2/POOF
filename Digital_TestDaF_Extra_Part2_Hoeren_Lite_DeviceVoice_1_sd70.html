<script id="data" type="application/json">{"sets":[{"id":"A","tasks":[{"title":"Forschungswoche an der Hochschule","intro":"Sie hören ein Gespräch über das Programm einer universitären Forschungswoche. Ergänzen Sie die fünf Angaben. Pro Feld höchstens zwei Wörter. Die Reihenfolge der Lücken entspricht nicht unbedingt dem Gespräch.","script":"LEON: Hi Mira, du koordinierst doch die Forschungswoche. Gibt es noch Änderungen am Programm? Ich muss für unsere Erstsemester eine Übersicht erstellen.\nMIRA: Ja, und zwar einige. Der offene Vortrag am Montag bleibt im Audimax, aber die Laborführung am Dienstagvormittag wurde aus Sicherheitsgründen ins Gebäude Nord verlegt.\nLEON: Gut. Und für was muss man sich vorher anmelden? Für sämtliche Veranstaltungen?\nMIRA: Nein, ausschließlich für die Laborführungen. Die Vorträge und die Posterausstellung sind frei zugänglich. Übrigens beginnt die Ausstellung am Mittwoch erst um vierzehn Uhr, weil am Vormittag noch die Stellwände aufgebaut werden.\nLEON: Ist der Workshop zur Datenvisualisierung am Donnerstag weiter für elf Uhr angesetzt?\nMIRA: Ursprünglich ja. Da die Referentin erst später anreisen kann, beginnt er jetzt um dreizehn Uhr. Er findet weiterhin im Seminarraum zwölf statt.\nLEON: Und was sollen die Studierenden zum Workshop mitbringen? In der ersten Nachricht stand ein Laptop.\nMIRA: Das war nur eine vorläufige Information. Der Raum verfügt über feste Rechner. Was sie wirklich brauchen, ist ihr Studierendenausweis, damit wir die Teilnahme nachweisen können.\nLEON: Danke. Eine letzte Sache: Wer führt das Abschlussgespräch am Freitag?\nMIRA: Das macht Professorin Weber. Eigentlich war Herr Brandt vorgesehen, aber er ist auf einer Tagung. Ich schicke dir die endgültige Tabelle nachher.\nLEON: Perfekt, dann verbreite ich keine veralteten Angaben mehr.","items":[{"kind":"short","q":"Anmeldung nur für …","answers":["Laborführungen","die Laborführungen"],"why":"ثبت‌نام فقط برای بازدیدهای آزمایشگاهی لازم است؛ سخنرانی‌ها آزادند.","trap":"«sämtliche Veranstaltungen» در سؤال رد شده است.","translation":"ثبت‌نام فقط برای بازدیدهای آزمایشگاهی"},{"kind":"short","q":"Ort der Laborführung am Dienstagvormittag","answers":["Gebäude Nord"],"why":"مکان عوض شده و حالا ساختمان شمال است.","trap":"در مورد Audimaxِ سخنرانی دوشنبه اشتباه نکن.","translation":""},{"kind":"short","q":"Beginn der Posterausstellung am Mittwoch","answers":["14 Uhr","vierzehn Uhr","14:00 Uhr"],"why":"زمان چهارده است؛ صبح صرف آماده‌سازی می‌شود.","trap":"پیش از این زمان، نمایشگاه شروع نمی‌شود.","translation":""},{"kind":"short","q":"Neuer Beginn des Workshops am Donnerstag","answers":["13 Uhr","dreizehn Uhr","13:00 Uhr"],"why":"زمان اولیه یازده بوده ولی به سیزده تغییر کرده است.","trap":"دام جابه‌جایی زمان.","translation":""},{"kind":"short","q":"Zum Workshop mitbringen","answers":["Studierendenausweis","den Studierendenausweis"],"why":"رایانه در محل موجود است و فقط کارت دانشجویی لازم است.","trap":"دام اصلاح اطلاعات اولیه «Laptop».","translation":""}],"summary":"","teaching":"اطلاعات اصلاح‌شده را بر مقدار اولیه مقدم بدان. در این تکلیف سقف دو واژه را رعایت کن؛ پاسخ‌های کوتاه معادل نیز قابل‌پذیرش‌اند.","id":"A1","set":"A","type":1},{"title":"Offene Forschungsdaten","intro":"Sie hören eine Podiumsdiskussion. Notieren Sie für beide Gäste jeweils eine Forderung und das passende Argument in Stichpunkten.","script":"MODERATOR: Willkommen zu unserer Reihe Wissenschaft und Öffentlichkeit. Heute diskutieren wir den Umgang mit Forschungsdaten. Frau Doktor Kern, was sollte sich Ihrer Ansicht nach ändern?\nKERN: Ich fordere, dass für öffentlich finanzierte Projekte eine verbindliche Dokumentation der Datensätze eingeführt wird. Mir geht es ausdrücklich nicht darum, sämtliche Rohdaten sofort für alle zugänglich zu machen. Ohne einheitliche Metadaten können andere Forschungsteams häufig nicht nachvollziehen, wie Messwerte zustande gekommen sind. Selbst veröffentlichte Dateien sind dann kaum wiederverwendbar.\nMODERATOR: Herr Vogel, Sie sind in der Forschungsethik tätig. Stimmen Sie zu?\nVOGEL: Einer besseren Dokumentation durchaus. Meine wichtigste Forderung ist jedoch, sensible Datensätze zunächst durch zeitlich begrenzte Schutzfristen abzusichern. Gerade bei Interviews mit Patientinnen oder Beschäftigten könnten scheinbar anonymisierte Informationen zusammen mit anderen Quellen Rückschlüsse auf Einzelpersonen ermöglichen.\nKERN: Schutzmaßnahmen sind notwendig. Aber wir dürfen daraus keine allgemeine Begründung machen, um auch unproblematische Messdaten jahrelang zurückzuhalten.\nVOGEL: Da widerspreche ich nicht. Ich spreche ausdrücklich von sensiblen Datensätzen, nicht von Wetterdaten oder Messwerten aus einer Materialprüfung.\nMODERATOR: Also Einigkeit bei der Dokumentation, aber unterschiedliche Schwerpunkte bei der Veröffentlichung?\nKERN: Genau. Dokumentation ist die Voraussetzung für jede spätere sinnvolle Nutzung.\nVOGEL: Und bei besonders schutzbedürftigen Informationen hat die Privatsphäre Vorrang vor einer sofortigen Freigabe.","items":[{"kind":"short","q":"Frau Kern — Forderung","answers":["Metadatenpflicht","verbindliche Dokumentation","einheitliche Metadaten","Datensätze dokumentieren"],"why":"کرن مستندسازی اجباری و یکدست داده‌ها را می‌خواهد.","trap":"او انتشار فوری تمام داده‌ها را مطالبه نکرده است.","translation":""},{"kind":"short","q":"Frau Kern — Argument","answers":["Wiederverwendbarkeit","Daten wiederverwenden","Nachvollziehbarkeit","Messwerte nachvollziehbar"],"why":"بدون فراداده، استفادهٔ مجدد و بازسازی روش اندازه‌گیری دشوار است.","trap":"","translation":""},{"kind":"short","q":"Herr Vogel — Forderung","answers":["Schutzfristen","befristete Schutzfristen","sensible Daten schützen","Schutz sensibler Daten"],"why":"فوگل دوره‌های محافظت موقت برای داده‌های حساس می‌خواهد.","trap":"درخواست او ممنوعیت همیشگی انتشار نیست.","translation":""},{"kind":"short","q":"Herr Vogel — Argument","answers":["Datenschutz","Schutz der Privatsphäre","Reidentifizierung","Rückschlüsse auf Einzelpersonen"],"why":"تلفیق داده‌های ظاهراً ناشناس با منابع دیگر ممکن است هویت افراد را آشکار کند.","trap":"","translation":""}],"summary":"","teaching":"تکلیف دوم چهار پاسخ مستقل دارد: Forderung/Argument برای هر فرد. هم‌نظرشدن نسبی دربارهٔ یک اصل، تفاوت مطالبه‌های اصلی دو نفر را از بین نمی‌برد.","id":"A2","set":"A","type":2},{"title":"Städtische Hitzeinseln","intro":"Sie hören einen Ausschnitt aus einer Vorlesung. Erst nach dem Hören erscheint eine Zusammenfassung. Markieren Sie genau zwei Sätze mit falschen Informationen.","script":"DOZENTIN: Unter einer städtischen Wärmeinsel versteht man den Befund, dass dicht bebaute Stadtteile bei bestimmten Wetterlagen wärmer sein können als ihr Umland. Besonders nachts kann sich dieser Unterschied verstärken, weil versiegelte Oberflächen tagsüber Wärme aufnehmen und sie später abgeben. Die Unterschiede sind jedoch keineswegs in jeder Stadt und zu jeder Tageszeit gleich groß. Neben der Gebäudedichte spielen auch Windverhältnisse und Vegetation eine Rolle. In unserem Modellprojekt wurden über acht Wochen Messgeräte in drei Vierteln aufgestellt. Wir konnten beobachten, dass Straßen mit dichtem Baumbestand an mehreren heißen Tagen geringere Oberflächentemperaturen aufwiesen. Daraus folgt nicht automatisch, dass allein das Pflanzen von Bäumen sämtliche gesundheitlichen Risiken der Hitze beseitigt. Für die Planung müssen außerdem Trinkwasserstellen, schattige Aufenthaltsorte und der Zugang zu kühlen Innenräumen berücksichtigt werden. Interessanterweise zeigte der Vergleich von zwei ähnlich breiten Straßen, dass das Pflanzen junger Bäume zunächst nur begrenzte Wirkungen hatte; der Kühlungseffekt stieg erst mit der wachsenden Baumkrone. Abschließend ist mir wichtig: Unsere Messungen liefern Hinweise für konkrete Maßnahmen, sie beweisen aber noch nicht, wie groß deren langfristiger gesundheitlicher Nutzen sein wird.","items":[{"kind":"wrong","q":"In dicht bebauten Quartieren kann es besonders nachts wärmer sein als im Umland.","answer":false,"why":"درست: گرمای ذخیره‌شدهٔ روز در شب آزاد می‌شود."},{"kind":"wrong","q":"Die Temperaturunterschiede sind zu jeder Tageszeit in allen Städten ungefähr gleich hoch.","answer":true,"why":"غلط: سخنران صریحاً تفاوت شهرها و ساعت‌های روز را تأکید می‌کند. دام تعمیم مطلق."},{"kind":"wrong","q":"Im Modellprojekt wurden acht Wochen lang Messdaten in drei Stadtvierteln gesammelt.","answer":false,"why":"درست: هشت هفته و سه محله به‌صراحت بیان شده است."},{"kind":"wrong","q":"Die Untersuchung beweist, dass allein neue Bäume sämtliche Gesundheitsrisiken beseitigen.","answer":true,"why":"غلط: اثر درخت‌ها محدود و تدریجی است و حذف همهٔ ریسک‌ها نتیجه نمی‌شود. دام علیت و حذف شرط."},{"kind":"wrong","q":"Die Wirkung neu gepflanzter Bäume kann mit dem Wachstum ihrer Kronen zunehmen.","answer":false,"why":"درست: رشد تاج درخت اثر خنک‌کنندگی را تقویت کرده است."},{"kind":"wrong","q":"Der langfristige gesundheitliche Nutzen der Maßnahmen ist noch nicht abschließend nachgewiesen.","answer":false,"why":"درست: سخنران قطعیتِ سود بلندمدت را رد می‌کند."}],"summary":"","teaching":"خلاصه تا پایان صوت مخفی می‌ماند. دقیقاً دو جمله غلط‌اند؛ یک جملهٔ صحیح با واژه‌های متفاوت نباید انتخاب شود.","id":"A3","set":"A","type":3},{"title":"Einwegmaterial in Forschungslaboren","intro":"Videobasiertes Format: In dieser Offline-Datei wird die Podiumsdiskussion mit synthetischem Mehrsprecher-Audio und einer einfachen Sprecheranzeige dargestellt. Ordnen Sie sechs Aussagen einer Person, beiden oder keiner Person zu.","script":"MODERATION: Willkommen zur Diskussion über Einwegmaterialien in Laboren. Herr Doktor Albrecht, was halten Sie von einer Verringerung des Plastikverbrauchs?\nALBRECHT: Unser Ziel sollte sein, unnötige Einwegverpackungen konsequent abzubauen. Das ist besonders bei Transportboxen möglich, die niemals mit gefährlichen Stoffen in Kontakt kommen. Bei sterilen Verbrauchsmaterialien müssen wir dagegen sorgfältig prüfen, ob Mehrwegprodukte tatsächlich dieselben Sicherheitsstandards erfüllen.\nMODERATION: Frau Professorin Duran, Ihre Perspektive?\nDURAN: Die Verringerung von Abfall ist für mich ebenfalls ein wichtiges Ziel. Aber wer nur die Zahl der Plastikartikel betrachtet, übersieht häufig Energie und Wasser für die Reinigung. Wir brauchen Lebenszyklusanalysen statt pauschaler Verbote. Bei manchen Geräten kann eine wiederverwendbare Alternative sogar mehr Ressourcen beanspruchen.\nALBRECHT: Da bin ich einverstanden. Ich plädiere deshalb für eine schrittweise Umstellung mit überprüfbaren Daten, nicht für ein sofortiges Verbot aller Einwegprodukte.\nDURAN: Und ich fordere, dass die Hochschulen die Berechnungsgrundlagen öffentlich dokumentieren. Denn nur so kann man nachvollziehen, welche Lösungen tatsächlich ökologisch günstiger sind.\nMODERATION: Würden Sie gesetzliche Strafen für jede Einwegverpackung befürworten?\nALBRECHT: Nein, das wäre zu undifferenziert.\nDURAN: Das lehne ich ebenfalls ab. Bevor wir sanktionieren, sollten wir gute Alternativen entwickeln.\nMODERATION: Vielen Dank.","items":[{"kind":"select","q":"Unnötige Transportverpackungen sollten reduziert werden.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":0,"why":"فقط آلبرشت بسته‌بندی حمل‌ونقل را صریحاً نام می‌برد."},{"kind":"select","q":"Eine geringere Abfallmenge ist ein grundsätzlich erstrebenswertes Ziel.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":2,"why":"هر دو کاهش پسماند را مطلوب می‌دانند."},{"kind":"select","q":"Wasser- und Energiebedarf bei der Reinigung müssen berücksichtigt werden.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":1,"why":"دوران این موضوع را مستقلاً مطرح می‌کند."},{"kind":"select","q":"Alle Einwegprodukte sollten sofort verboten werden.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":3,"why":"هیچ‌کدام ممنوعیت فوری همهٔ اقلام را تأیید نمی‌کنند."},{"kind":"select","q":"Die Umstellung sollte schrittweise und durch Daten überprüfbar erfolgen.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":0,"why":"این مطالبه صریح آلبرشت است؛ سخن دوران مشابه ولی مستندسازی مبانی است."},{"kind":"select","q":"Hochschulen sollen die Berechnungsgrundlagen offen dokumentieren.","options":["Herr Albrecht","Frau Duran","beide","keiner"],"answer":1,"why":"خواست صریح دوران شفافیت محاسبات است."}],"summary":"","teaching":"هر گزاره را دقیق به گوینده نسبت بده. Zustimmung به یک اصل به معنای بیانِ همهٔ جزئیات طرف دیگر نیست. ویدئوی واقعی این تکلیف در این فایل بازسازی نشده است.","id":"A4","set":"A","type":4},{"title":"Akustische Erfassung von Insekten","intro":"Videobasiertes Format: Sie hören einen vorgetragenen Forschungsbericht mit einer grafischen Vortragsansicht. Ergänzen Sie vier Gliederungspunkte in Stichpunkten.","script":"DOZENT: Heute geht es um eine neuere Methode zur Beobachtung von Insektenpopulationen. Viele Arten lassen sich nicht zuverlässig durch bloßes Zählen auf einer Wiese erfassen, weil sie sich nur in bestimmten Tageszeiten zeigen. Einige Insekten erzeugen aber charakteristische Geräusche, die sich mit empfindlichen Aufnahmegeräten aufzeichnen lassen. Unser Forschungsteam hat deshalb kleine akustische Sensoren in mehreren Landschaftstypen installiert. Die Geräte zeichneten nicht ununterbrochen auf, sondern in festgelegten Zeitfenstern, um Energie und Speicherkapazität zu sparen. Früher nahm man häufig an, dass eine lautere Geräuschkulisse automatisch eine größere Zahl von Individuen belege. Diese Annahme ist problematisch, weil einzelne Arten besonders laut sind und Windgeräusche die Daten verfälschen können. In unserem Projekt haben wir daher die Aufnahmen zunächst nach Frequenzmustern sortiert und anschließend ausgewählte Ausschnitte mit Beobachtungen vor Ort verglichen. Das Verfahren ermöglicht es, Veränderungen im Auftreten bestimmter Arten über längere Zeiträume zu beobachten. Es liefert jedoch keine zuverlässige Gesamtzahl aller Insekten im Gebiet. Das liegt unter anderem daran, dass geräuschlose Arten gar nicht erfasst werden. Ein weiterer Vorteil besteht darin, dass weniger häufig Menschen zur Kontrolle an abgelegene Messpunkte fahren müssen. Künftig wollen wir prüfen, ob die Methode auch in Städten eingesetzt werden kann, wo Verkehrslärm die Aufzeichnungen stärker überlagert.","items":[{"kind":"short","q":"Grundlage der Methode","answers":["charakteristische Geräusche","akustische Signale","Insektengeräusche","Frequenzmuster"],"why":"حشرات خاص با صداهای شاخص شناسایی می‌شوند.","trap":"نه شمارش چشمی.","translation":""},{"kind":"short","q":"Frühere problematische Annahme","answers":["laut bedeutet viele","Lautstärke gleich Anzahl","lauter gleich mehr Insekten","Lautstärke zeigt Individuenzahl"],"why":"بلندی صدا را با تعداد حشرات یکی می‌گرفتند؛ گوینده این ادعا را نقد می‌کند.","trap":"","translation":""},{"kind":"short","q":"Vorgehen bei der Auswertung","answers":["Frequenzmuster sortieren","Abgleich mit Feldbeobachtungen","mit Beobachtungen vergleichen"],"why":"الگوهای فرکانسی مرتب و با مشاهدهٔ میدانی مقایسه می‌شوند.","trap":"","translation":""},{"kind":"short","q":"Wesentliche Grenze","answers":["geräuschlose Arten","keine Gesamtzahl","stumme Insekten unerfasst","Gesamtzahl unbekannt"],"why":"گونه‌های بی‌صدا ثبت نمی‌شوند؛ عدد کل حشرات قابل‌استنتاج نیست.","trap":"","translation":""}],"summary":"","teaching":"هدف تکلیف ۵ بازسازی ساختار سخنرانی است. عنوان‌های حاضر روی صفحه را با کلیدواژه‌های علمی کامل کن، نه با جمله‌های بلند.","id":"A5","set":"A","type":5},{"title":"Bürgerwissenschaft bei Luftmessungen","intro":"Sie hören einen wissenschaftlichen Vortrag einmal. Beantworten Sie fünf Multiple-Choice-Fragen; pro Frage genau eine Lösung.","script":"VORTRAG: Heute möchte ich über sogenannte Bürgerwissenschaft sprechen, insbesondere über ihre Rolle bei lokalen Luftmessungen. Seit einigen Jahren stellen manche Stadtverwaltungen interessierten Personen preisgünstige Sensoren zur Verfügung. Das bedeutet allerdings nicht, dass diese Geräte die amtlichen Messstationen vollständig ersetzen können. Die Messwerte sind häufig anfällig für Temperatur und Luftfeuchtigkeit. Gerade darin liegt eine wichtige methodische Herausforderung. In einem von uns begleiteten Projekt installierten Freiwillige insgesamt vierzig Sensoren. Die Stationen wurden nicht gleichmäßig im Stadtgebiet verteilt, sondern überwiegend in Wohnstraßen, in denen die Teilnehmenden selbst lebten. Deshalb wäre es methodisch falsch, die Daten als repräsentatives Bild der gesamten Stadt zu behandeln. Das Team verglich die Messreihen mit Werten einer zertifizierten Referenzstation und korrigierte erkennbare Abweichungen. Danach zeigten sich an einigen Straßenabschnitten erhöhte Werte, allerdings nicht an sämtlichen Hauptverkehrsstraßen. Bemerkenswert war ein anderes Ergebnis: Durch die gemeinsame Analyse der Messungen entstanden Gespräche zwischen Anwohnenden und Verwaltung über die Verkehrsplanung. Der größte Gewinn des Projekts bestand aus Sicht der Projektleitung daher nicht in einer besonders präzisen Gesamtkarte der Belastung, sondern darin, dass Bürgerinnen und Bürger lernten, Messdaten kritisch zu interpretieren. Die oft geäußerte Forderung, eine einzelne hohe Messung müsse sofort zu einer Straßensperrung führen, wäre wissenschaftlich nicht begründbar. Einzelwerte können Ausreißer sein und müssen eingeordnet werden. Für künftige Projekte empfehlen wir eine gezieltere Standortauswahl und eine bessere Schulung der Freiwilligen. Bürgerwissenschaft bietet damit wertvolle Ergänzungen zur professionellen Forschung, sofern ihre Grenzen offen benannt werden.","items":[{"kind":"mc","q":"Welche Einschränkung nennt die Vortragende für günstige Sensoren?","options":["Sie dürfen nicht im Freien eingesetzt werden.","Ihre Werte können durch Luftfeuchtigkeit beeinflusst werden.","Sie erfordern durchgehend Internetverbindungen.","Sie sind grundsätzlich präziser als Referenzstationen."],"answer":1,"why":"حساسیت به رطوبت و دما صریحاً گفته شده است.","wrong":["هیچ ممنوعیتی برای فضای بیرون مطرح نشد.","درست.","این الزام ذکر نشده است.","برعکس، نیاز به کالیبراسیون دارند."]},{"kind":"mc","q":"Warum waren die Daten nicht repräsentativ für die ganze Stadt?","options":["Die Freiwilligen wohnten außerhalb der Stadt.","Es wurden nur amtliche Sensoren benutzt.","Die Standorte waren ungleich verteilt.","Die Messgeräte wurden nach zwei Tagen entfernt."],"answer":2,"why":"تمرکز سنسورها در خیابان‌های محل سکونت داوطلبان باعث نمونه‌گیری نامتوازن شد.","wrong":["برعکس، در شهر بودند.","سنسورهای کم‌هزینه استفاده شد.","درست.","مدت دو روز مطرح نشد."]},{"kind":"mc","q":"Was geschah mit den Messdaten vor der Interpretation?","options":["Sie wurden mit einer Referenzstation abgeglichen.","Man veröffentlichte sie ohne weitere Kontrolle.","Man löschte alle erhöhten Werte.","Die Stadt verbot die Auswertung."],"answer":0,"why":"داده‌ها با ایستگاه مرجع مقایسه و انحراف‌ها اصلاح شدند.","wrong":["درست.","کنترل انجام شد.","فقط اصلاح انحراف؛ حذف همه مقادیر بالا مطرح نیست.","چنین ممنوعیتی نبود."]},{"kind":"mc","q":"Welchen Gewinn betont die Projektleitung besonders?","options":["Eine vollständig präzise Stadtkarte.","Die sofortige Sperrung belasteter Straßen.","Das Abschaffen amtlicher Messstellen.","Den kritischen Umgang der Bürger mit Messdaten."],"answer":3,"why":"هدف آموزشی و مشارکت انتقادی برجسته‌تر از نقشهٔ دقیق بود.","wrong":["گوینده این را مزیت اصلی نمی‌داند.","رد شده است.","رد شده است.","درست."]},{"kind":"mc","q":"Welche Schlussfolgerung entspricht dem Vortrag?","options":["Ein hoher Einzelwert beweist eine dauerhafte Belastung.","Bürgerwissenschaft kann professionelle Messungen unter bestimmten Bedingungen ergänzen.","Jeder Sensorstandort ist automatisch repräsentativ.","Bürgerwissenschaft benötigt keine Schulung."],"answer":1,"why":"پروژه مکمل مشروط پژوهش حرفه‌ای است، نه جانشین بی‌قیدوشرط.","wrong":["تعمیم از یک مقدار نامعتبر است.","درست.","توزیع نامتوازن بود.","آموزش توصیه شده است."]}],"summary":"","teaching":"در متن سخنرانی علمی به واژه‌های sofern، allerdings، repräsentativ و Einzelwert توجه کن؛ دام اصلی تبدیل نتایج محدود به تعمیم قطعی است.","id":"A6","set":"A","type":6},{"title":"Wissenschaftliche Poster","intro":"Hören und Schriftbild sind ähnlich, aber nicht identisch. Klicken Sie die genau vier Wörter an, die Sie anders hören.","script":"Ein wissenschaftliches Poster soll komplexe Ergebnisse übersichtlich präsentieren. Forschende wählen deshalb eine lesbare Schrift und beschränken sich auf zentrale Kernaussagen. Besonders wichtig ist eine präzise Beschriftung der Abbildungen. Farben können die Orientierung erleichtern, sollten aber konsequent eingesetzt werden. Eine knappe Zusammenfassung unterstützt den Einstieg. In der Diskussion können Rückfragen neue Perspektiven eröffnen.","items":[{"kind":"word","q":"große","answer":"lesbare","why":"شنیده می‌شود «lesbare» نه «große»؛ اندازهٔ صرف با خوانایی فرق دارد."},{"kind":"word","q":"wenige","answer":"zentrale","why":"شنیده می‌شود «zentrale» نه «wenige»؛ کمیت با اهمیت یکسان نیست."},{"kind":"word","q":"klare","answer":"präzise","why":"شنیده می‌شود «präzise» نه «klare»؛ دقت عبارت را عوض کرده است."},{"kind":"word","q":"kurze","answer":"knappe","why":"شنیده می‌شود «knappe» نه «kurze»؛ اینجا تفاوت واژگانی ظریف است."}],"summary":"","teaching":"چهار تفاوت واقعی واژه‌ای را در متن قابل‌کلیک بیاب؛ لزوماً همهٔ تفاوت‌ها معنای کلی را کاملاً تغییر نمی‌دهند.","display":"Ein wissenschaftliches Poster soll komplexe Ergebnisse übersichtlich präsentieren. Forschende wählen deshalb eine große Schrift und beschränken sich auf wenige Kernaussagen. Besonders wichtig ist eine klare Beschriftung der Abbildungen. Farben können die Orientierung erleichtern, sollten aber konsequent eingesetzt werden. Eine kurze Zusammenfassung unterstützt den Einstieg. In der Diskussion können Rückfragen neue Perspektiven eröffnen.","id":"A7","set":"A","type":7}]},{"id":"B","tasks":[{"title":"Woche der digitalen Archive","intro":"Sie hören ein Gespräch über eine Woche der digitalen Archive. Ergänzen Sie fünf Angaben mit jeweils höchstens zwei Wörtern.","script":"NORA: Hallo Tim, ich aktualisiere gerade das Programm unserer Archivwoche. Du warst doch im Organisationsteam.\nTIM: Stimmt. Denk daran: Die Einführung in alte Handschriften am Montag bleibt im Lesesaal. Der Termin am Dienstagnachmittag zur Fotodigitalisierung ist aber von Gebäude Ost nach Raum sieben im Hauptgebäude verlegt worden.\nNORA: Gut. Die Führung durch das Tonarchiv ist am Mittwoch um elf Uhr, oder?\nTIM: Nicht mehr. Weil eine Schulklasse angemeldet ist, beginnt sie jetzt erst um fünfzehn Uhr. Vormittags gibt es dafür eine offene Fragestunde.\nNORA: Muss man sich für die ganze Woche anmelden?\nTIM: Nein. Nur die Restaurierungswerkstatt hat begrenzte Plätze. Für diese Werkstatt muss man sich anmelden. Sonst kann man spontan kommen.\nNORA: Auf dem alten Plakat steht, alle sollen einen eigenen Laptop zur Werkstatt mitbringen.\nTIM: Das stimmt nicht mehr. Die Arbeitsplätze sind ausgestattet. Ein weicher Bleistift ist sinnvoll, aber verpflichtend mitbringen müssen die Teilnehmenden nur Baumwollhandschuhe.\nNORA: Und wer hält den Abschlussvortrag über die Zukunft der Archive?\nTIM: Professor Malik. Doktor Hahn war ursprünglich geplant, hat aber kurzfristig abgesagt.\nNORA: Dann fehlen mir nur noch die genauen Zeiten für Freitag.\nTIM: Der Abschlussvortrag beginnt um sechzehn Uhr. Sag bitte ausdrücklich dazu, dass die Ausstellung danach noch bis achtzehn Uhr offen bleibt.","items":[{"kind":"short","q":"Anmeldung nur für …","answers":["Restaurierungswerkstatt","die Restaurierungswerkstatt"],"why":"ثبت‌نام فقط برای کارگاه مرمت لازم است.","trap":"","translation":""},{"kind":"short","q":"Neuer Ort des Fotodigitalisierungstermins","answers":["Raum sieben","Raum 7"],"why":"برنامه از ساختمان شرق به اتاق هفت ساختمان اصلی جابه‌جا شده است.","trap":"اگر فقط ساختمان اصلی بنویسی جزئیات اتاق را از دست می‌دهی؛ پاسخ ترجیحی «Raum 7» است.","translation":""},{"kind":"short","q":"Neuer Beginn der Tonarchivführung","answers":["15 Uhr","fünfzehn Uhr","15:00 Uhr"],"why":"زمان آغاز از یازده به پانزده منتقل شد.","trap":"damals 11 Uhr / jetzt 15 Uhr","translation":""},{"kind":"short","q":"Pflichtmaterial in der Restaurierungswerkstatt","answers":["Baumwollhandschuhe","Handschuhe"],"why":"دستکش‌های نخی لازم‌اند؛ مداد نرم فقط توصیه شده است.","trap":"","translation":""},{"kind":"short","q":"Abschlussvortrag hält","answers":["Professor Malik","Prof. Malik","Malik"],"why":"سخنران اصلی تغییر کرده و اکنون پروفسور مالک است.","trap":"","translation":""}],"summary":"","teaching":"تغییرات اصلاحی: ابتدا/اکنون، پیشنهاد/الزام و مکان قدیم/جدید.","id":"B1","set":"B","type":1},{"title":"Offenes oder anonymes Peer Review","intro":"Sie hören eine akademische Debatte. Notieren Sie für beide Personen Forderung und dazugehöriges Argument.","script":"MODERATORIN: Unser Thema ist die Begutachtung wissenschaftlicher Artikel. Frau Professorin Yildiz, Sie fordern eine Veränderung des Peer-Review-Verfahrens.\nYILDIZ: Ja. Ich halte ein offenes Begutachtungsverfahren für sinnvoll, bei dem die Gutachten nach der Veröffentlichung gemeinsam mit dem Artikel zugänglich sind. Lesende könnten dann nachvollziehen, welche Einwände vorgebracht wurden und wie Autorinnen darauf reagiert haben. Das erhöht aus meiner Sicht die Transparenz.\nMODERATORIN: Herr Doktor Maas, warum sind Sie skeptisch?\nMAAS: Ich fordere, dass die Identität der Gutachtenden zumindest während der Begutachtung geschützt bleibt. Junge Forschende müssen manchmal Arbeiten einflussreicher Professorinnen kritisieren. Wenn sie mögliche berufliche Nachteile fürchten, werden sie ihre Einwände möglicherweise abschwächen. Anonymität kann deshalb ehrliche Kritik ermöglichen.\nYILDIZ: Ich verstehe diese Sorge. Mein Vorschlag bedeutet nicht, dass jedes Gutachten schon vor Abschluss des Verfahrens öffentlich sein muss. Dennoch sollten die fachlichen Argumente nach der Veröffentlichung überprüfbar sein.\nMAAS: Mir ist ebenfalls wichtig, dass Kritik nachvollziehbar begründet wird. Ich würde das aber lieber durch klare redaktionelle Standards erreichen als durch eine allgemeine Offenlegung der Namen.\nMODERATORIN: Also sehen Sie beide Verbesserungsbedarf, unterscheiden sich aber hinsichtlich der Veröffentlichung?\nYILDIZ: Genau.\nMAAS: Richtig, das ist der Kern des Unterschieds.","items":[{"kind":"short","q":"Frau Yildiz — Forderung","answers":["offene Gutachten","offenes Peer Review","Gutachten veröffentlichen","Begutachtung offenlegen"],"why":"ییلدیز خواستار انتشار گزارش‌های داوری پس از انتشار مقاله است.","trap":"","translation":""},{"kind":"short","q":"Frau Yildiz — Argument","answers":["Transparenz","Kritik nachvollziehbar","Einwände nachvollziehen"],"why":"استدلال‌ها و واکنش نویسندگان شفاف و قابل‌پیگیری می‌شوند.","trap":"","translation":""},{"kind":"short","q":"Herr Maas — Forderung","answers":["anonyme Gutachten","Anonymität der Gutachter","Identität schützen","anonyme Begutachtung"],"why":"ماس حفاظت از هویت داوران، دست‌کم حین بررسی، را می‌خواهد.","trap":"","translation":""},{"kind":"short","q":"Herr Maas — Argument","answers":["ehrliche Kritik","Angst vor Nachteilen","berufliche Nachteile vermeiden"],"why":"ناشناس‌ماندن به محققان جوان در انتقاد بی‌واهمه کمک می‌کند.","trap":"","translation":""}],"summary":"","teaching":"تمایز زمان اهمیت دارد: ییلدیز از افشای گزارش پس از چاپ می‌گوید؛ ماس از حفاظت هویت حین داوری.","id":"B2","set":"B","type":2},{"title":"Lernpausen und Gedächtnis","intro":"Sie hören einen Vorlesungsausschnitt. Danach erscheint eine Zusammenfassung. Wählen Sie genau zwei inhaltlich falsche Sätze.","script":"DOZENT: In der Lernpsychologie wird seit Langem untersucht, wie Pausen die Verarbeitung neuer Informationen beeinflussen. Dabei wäre es falsch zu behaupten, dass jede Pause unabhängig von ihrer Gestaltung dieselbe Wirkung hat. In einem kleinen Versuch lernten zwei Gruppen denselben Wortschatz. Die erste Gruppe machte nach zwanzig Minuten eine kurze Pause ohne Bildschirm, während die zweite Gruppe anschließend weiter auf ihren Smartphones Nachrichten las. Im späteren Test erzielte die erste Gruppe im Durchschnitt etwas bessere Ergebnisse. Allerdings war die Stichprobe begrenzt, und wir wissen nicht, ob die Unterschiede bei komplexeren Lerninhalten genauso ausfallen würden. Ein zweiter Befund betraf die Stimmung: Teilnehmende aus der ersten Gruppe berichteten häufiger, dass sie sich nach der Pause erholt fühlten. Die Forschenden konnten jedoch nicht nachweisen, dass dieses Erholungsgefühl allein die Leistungsunterschiede verursachte. Wichtig ist auch die Dauer. Sehr lange Unterbrechungen können den Wiedereinstieg erschweren, während kurze Unterbrechungen die Aufmerksamkeit vorübergehend unterstützen können. Für die Praxis lässt sich daraus vor allem eine vorsichtige Empfehlung ableiten: Lernende sollten verschiedene Formen kurzer Pausen ausprobieren und ihre Wirkung auf die eigene Konzentration beobachten. Eine universelle Minutenregel lässt sich aus dieser Untersuchung nicht ableiten.","items":[{"kind":"wrong","q":"Die Studie verglich zwei Gruppen, die denselben Wortschatz lernten.","answer":false,"why":"درست: محتوای یادگیری دو گروه یکسان بود."},{"kind":"wrong","q":"In beiden Gruppen wurden die Pausen vollständig ohne digitale Geräte verbracht.","answer":true,"why":"غلط: گروه دوم در تلفن همراه پیام می‌خواند."},{"kind":"wrong","q":"Die Gruppe ohne Bildschirm erreichte im Mittel etwas bessere Testergebnisse.","answer":false,"why":"درست: تفاوت کوچک در میانگین بیان شده است."},{"kind":"wrong","q":"Die Forschenden bewiesen, dass das Gefühl der Erholung allein den Leistungsvorteil verursachte.","answer":true,"why":"غلط: سخنران تأکید کرد رابطهٔ علّی اثبات نشده است."},{"kind":"wrong","q":"Sehr lange Unterbrechungen können den Wiedereinstieg ins Lernen erschweren.","answer":false,"why":"درست: به دشوارشدن بازگشت پس از وقفهٔ طولانی اشاره شد."},{"kind":"wrong","q":"Aus dem Versuch lässt sich keine universell gültige Minutenregel ableiten.","answer":false,"why":"درست: خود سخنران تعمیم عددی را رد کرده است."}],"summary":"","teaching":"دام‌های اینجا: شرط یکسان‌بودن گروه‌ها، ارتباط علّی در برابر گزارش ذهنی و تعمیم نتیجهٔ نمونهٔ کوچک.","id":"B3","set":"B","type":3},{"title":"Grüne Dächer für historische Gebäude","intro":"Videobasiertes Format: Diskussionsansicht mit synthetischem Mehrsprecher-Audio; kein echtes Prüfungs-Video. Ordnen Sie sechs Aussagen zu.","script":"MODERATION: Heute diskutieren wir über begrünte Dächer auf historischen Gebäuden. Frau Dr. Richter, Sie sind Denkmalpflegerin.\nRICHTER: Ich unterstütze grundsätzlich Maßnahmen zur Anpassung an steigende Temperaturen. Allerdings dürfen zusätzliche Lasten die historische Bausubstanz nicht gefährden. Vor einer Entscheidung muss deshalb für jedes Gebäude eine statische Prüfung erfolgen. Ein generelles Verbot begrünter Dächer halte ich nicht für sinnvoll.\nMODERATION: Herr Professor Adeyemi, Sie forschen zur Stadtökologie.\nADEYEMI: Dachbegrünung kann Regenwasser zeitweise zurückhalten und die Umgebung im Sommer kühlen. Aber ich stimme zu: Eine statische Prüfung ist unverzichtbar, auch wenn sie zusätzliche Kosten verursacht. Oft lässt sich außerdem eine leichtere Begrünung einsetzen.\nRICHTER: Gerade diese Unterscheidung zwischen leichter und intensiver Begrünung ist wichtig. Ich fordere, dass die Kosten für die Pflege langfristig in den Bauplänen berücksichtigt werden.\nADEYEMI: Ich möchte zusätzlich ein begleitendes Messprogramm. Nur durch Daten über mehrere Jahre erkennen wir, wie groß die versprochenen Effekte tatsächlich ausfallen.\nMODERATION: Sollten Hauseigentümer verpflichtet werden, sämtliche historischen Dächer sofort umzugestalten?\nRICHTER: Nein.\nADEYEMI: Das wäre schon technisch unrealistisch. Ich würde zunächst geeignete Pilotgebäude auswählen.\nMODERATION: Vielen Dank für die differenzierte Diskussion.","items":[{"kind":"select","q":"Vor jeder Begrünung ist eine statische Prüfung nötig.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":2,"why":"هر دو به ضرورت بررسی سازه اشاره می‌کنند."},{"kind":"select","q":"Die langfristigen Pflegekosten sollen in die Planung aufgenommen werden.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":0,"why":"ریشتر به هزینهٔ نگهداری بلندمدت اشاره می‌کند."},{"kind":"select","q":"Dachbegrünung kann vorübergehend Regenwasser speichern.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":1,"why":"آدیمی این اثر محیط‌زیستی را بیان می‌کند."},{"kind":"select","q":"Alle historischen Dächer sollen sofort verpflichtend begrünt werden.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":3,"why":"هر دو اجبار فوری همگانی را رد می‌کنند."},{"kind":"select","q":"Eine Untersuchung über mehrere Jahre soll die Wirkung überprüfen.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":1,"why":"درخواست برنامهٔ پایش چندساله از آدیمی است."},{"kind":"select","q":"Ein allgemeines Verbot begrünter Dächer ist keine gute Lösung.","options":["Frau Richter","Herr Adeyemi","beide","keiner"],"answer":0,"why":"ریشتر صریحاً ممنوعیت کلی را رد کرده است."}],"summary":"","teaching":"در چندگوینده، یکی از دام‌ها این است که تأیید یک اصل مشترک را با مالکیت تمام جزئیات استدلال طرف مقابل اشتباه بگیری.","id":"B4","set":"B","type":4},{"title":"Fernerkundung von Stadtbäumen","intro":"Videobasiertes Format: Wissenschaftlicher Vortrag mit schematischer Ansicht und synthetischer Stimme. Ergänzen Sie vier Gliederungspunkte.","script":"DOZENTIN: In der Stadtökologie wollen wir wissen, wie sich der Zustand von Bäumen über lange Zeiträume verändert. Eine direkte Untersuchung jedes einzelnen Baumes wäre in großen Städten ausgesprochen aufwendig. Deshalb nutzen Forschende heute häufig Satellitenbilder und Aufnahmen von Drohnen. Die beiden Verfahren haben unterschiedliche Stärken. Satelliten erfassen regelmäßig große Flächen, während Drohnen kleinere Gebiete in höherer räumlicher Auflösung dokumentieren können. Ein zentraler Messwert ist die Reflexion bestimmter Lichtbereiche durch Blätter. Aus diesen Reflexionsmustern können Algorithmen Hinweise auf den Zustand der Vegetation ableiten. Früher wurde manchmal angenommen, dass ein sehr grünes Satellitenbild automatisch gesunde Einzelbäume beweise. Diese Schlussfolgerung ist zu einfach: Auch die Jahreszeit, Schatten und gemischte Bildpunkte beeinflussen die Messungen. In unserer Studie kombinierten wir deshalb Bilddaten mit Stichproben, bei denen Fachleute ausgewählte Bäume direkt untersuchten. Dadurch konnten auffällige Gebiete identifiziert werden, in denen weitere Kontrollen sinnvoll waren. Das Verfahren ersetzt eine Diagnose vor Ort nicht, macht die Auswahl der Kontrollstandorte aber effizienter. Eine wichtige Grenze bleibt: Aus den Bildern lässt sich nicht zuverlässig erkennen, welche konkrete Krankheit ein Baum hat. In Zukunft wollen wir untersuchen, ob zusätzliche Temperaturinformationen die Einschätzung verbessern.","items":[{"kind":"short","q":"Vorteil von Satellitenbildern","answers":["große Flächen","regelmäßige Flächenerfassung","großflächige Erfassung"],"why":"ماهواره‌ها سطح‌های وسیع را به‌طور منظم ثبت می‌کنند.","trap":"","translation":""},{"kind":"short","q":"Grundlage der algorithmischen Auswertung","answers":["Reflexionsmuster","Lichtreflexion","Reflexion der Blätter"],"why":"الگوهای بازتاب نور برگ‌ها شاخص تحلیلی‌اند.","trap":"","translation":""},{"kind":"short","q":"Zusätzliche Kontrolle der Bilddaten","answers":["Stichproben vor Ort","direkte Baumuntersuchung","Vor-Ort-Kontrollen","Kontrollen vor Ort"],"why":"داده‌های تصویری با بررسی میدانی نمونه‌ها ترکیب می‌شوند.","trap":"","translation":""},{"kind":"short","q":"Grenze der Fernerkundung","answers":["keine konkrete Diagnose","Krankheit nicht erkennbar","konkrete Krankheit unbekannt"],"why":"نوع بیماری معین از روی عکس قابل تشخیص قطعی نیست.","trap":"","translation":""}],"summary":"","teaching":"مزیت روش را با جایگزینی کامل تشخیص بالینی/میدانی اشتباه نگیر؛ ترکیب روش‌ها به معنای حذف روش قبلی نیست.","id":"B5","set":"B","type":5},{"title":"Reproduzierbarkeit in der Forschung","intro":"Sie hören einen wissenschaftlichen Vortrag. Lösen Sie fünf Multiple-Choice-Fragen; pro Frage eine Antwort.","script":"VORTRAG: In der heutigen Veranstaltung beschäftigen wir uns mit der Reproduzierbarkeit wissenschaftlicher Ergebnisse. Wenn ein Forschungsteam eine Untersuchung wiederholt und dabei nicht genau dieselben Zahlen erhält, bedeutet das nicht automatisch, dass die ursprüngliche Arbeit wertlos oder betrügerisch war. Unterschiede können beispielsweise durch veränderte Messgeräte, andere Stichproben oder zufällige Schwankungen entstehen. Dennoch ist es ein Problem, wenn zentrale Ergebnisse dauerhaft nicht bestätigt werden können. In einem Forschungsverbund unseres Instituts wurden in den vergangenen Jahren veröffentlichte Methoden aus mehreren Fachbereichen erneut erprobt. Das Team stellte fest, dass schon kleine Lücken in der Dokumentation das Nachstellen der Versuche erschwerten. Besonders schwierig war es, wenn verwendete Softwareversionen fehlten. Eine erste Empfehlung lautet deshalb, Datenaufbereitung und Auswertung nachvollziehbar zu dokumentieren. Das bedeutet nicht, dass aus Datenschutzgründen vertrauliche Rohdaten frei veröffentlicht werden müssen. Häufig können ausreichend genaue Beschreibungen oder synthetische Beispieldatensätze helfen. Eine zweite Empfehlung betrifft Forschungsanreize. Wissenschaftlerinnen und Wissenschaftler sollten nicht ausschließlich dafür belohnt werden, spektakuläre neue Ergebnisse zu präsentieren. Auch sorgfältige Überprüfungen vorhandener Befunde verdienen Anerkennung. Allerdings muss man differenzieren: Eine einzelne fehlgeschlagene Wiederholung beweist noch nicht, dass eine Hypothese falsch ist. Erst wenn mehrere gut dokumentierte Untersuchungen unter vergleichbaren Bedingungen ein ähnliches Bild ergeben, kann man stärkere Schlussfolgerungen ziehen. Die zentrale Botschaft lautet daher nicht, der Wissenschaft grundsätzlich zu misstrauen, sondern Unsicherheit methodisch transparent zu machen und Überprüfungen als normalen Teil des Forschungsprozesses zu betrachten.","items":[{"kind":"mc","q":"Welche Aussage zur fehlgeschlagenen Wiederholung macht der Vortrag?","options":["Sie beweist grundsätzlich wissenschaftlichen Betrug.","Sie kann verschiedene methodische Ursachen haben.","Sie zeigt immer, dass die Hypothese falsch ist.","Sie kommt nur in sozialwissenschaftlichen Studien vor."],"answer":1,"why":"شکست در بازتولید ممکن است علت‌های ابزاری و نمونه‌گیری متفاوت داشته باشد.","wrong":["اتهام تقلب بیان نشده.","درست.","«immer» نادرست است.","چنین محدودیتی مطرح نیست."]},{"kind":"mc","q":"Was erschwerte den Versuch, frühere Studien nachzustellen?","options":["Fehlende Softwareversionsangaben.","Zu viele öffentlich zugängliche Daten.","Verpflichtende Finanzierungslücken.","Ausschließlich die Größe der Forschungsgruppen."],"answer":0,"why":"نبود نسخهٔ نرم‌افزار مثال مشخص نقص مستندسازی است.","wrong":["درست.","حجم داده باز مطرح نشده.","این موضوع مطرح نیست.","صرف اندازهٔ تیم علت نیست."]},{"kind":"mc","q":"Wie sollen vertrauliche Rohdaten laut Vortrag behandelt werden?","options":["Sie müssen immer ungeschützt veröffentlicht werden.","Sie müssen grundsätzlich gelöscht werden.","Sie dürfen nie in einer Forschung verwendet werden.","Vertraulichkeit kann durch Beschreibungen oder Beispieldaten berücksichtigt werden."],"answer":3,"why":"توصیف روش یا دادهٔ مصنوعی جایگزین افشای دادهٔ محرمانه می‌شود.","wrong":["خلاف متن است.","حذف داده خواسته نشده.","ممنوعیت کاربرد داده مطرح نیست.","درست."]},{"kind":"mc","q":"Welche Veränderung der Forschungsanreize wird vorgeschlagen?","options":["Nur völlig neue Ergebnisse sollen belohnt werden.","Auch die Überprüfung bestehender Ergebnisse soll Anerkennung finden.","Wiederholungsstudien sollen abgeschafft werden.","Forschungsergebnisse sollen nicht mehr veröffentlicht werden."],"answer":1,"why":"ارزش‌گذاری پژوهش‌های تکرار/بازآزمایی در کنار یافتهٔ جدید.","wrong":["برعکس است.","درست.","حذف نشده.","موضوع نیست."]},{"kind":"mc","q":"Was ist die Hauptaussage des Vortrags?","options":["Einzelne Abweichungen widerlegen grundsätzlich die Wissenschaft.","Wissenschaft ist ohne Unsicherheit möglich.","Transparenz und überprüfbare Verfahren stärken Forschung.","Nur spektakuläre Ergebnisse sollten finanziert werden."],"answer":2,"why":"پیام مرکزی شفافیت روش و بازبینی به‌عنوان بخش طبیعی پژوهش است.","wrong":["تعمیم ناروا.","خلاف متن است.","درست.","صریحاً نقد شده است."]}],"summary":"","teaching":"دام‌ها: «یک بار تکرار ناموفق» مساوی با رد کامل فرضیه نیست؛ محرمانگی داده لزوماً تضاد با بازتولیدپذیری ندارد.","id":"B6","set":"B","type":6},{"title":"Digitale Archive und Metadaten","intro":"Vergleichen Sie Hörtext und angezeigten Text. Markieren Sie vier abweichende Wörter.","script":"Digitale Archive bewahren nicht nur Texte, sondern auch Fotografien und Tonaufnahmen. Für eine gezielte Suche benötigen die Dateien ausführliche Metadaten. Besonders relevant sind Angaben zur Herkunft und zum Zeitpunkt der Erstellung. Manche Sammlungen sind kostenlos zugänglich, andere bleiben wegen rechtlicher Fragen begrenzt verfügbar. Eine sorgfältige Sicherung verhindert, dass Informationen durch technische Fehler verloren gehen. Auch langfristig müssen Dateiformate systematisch überprüft werden.","items":[{"kind":"word","q":"zuverlässige","answer":"gezielte","why":"شنیداری «gezielte» است، متن «zuverlässige». هدف‌گذاری با قابلیت اعتماد فرق دارد."},{"kind":"word","q":"einheitliche","answer":"ausführliche","why":"شنیداری «ausführliche» است؛ استانداردبودن با مفصل‌بودن یکسان نیست."},{"kind":"word","q":"öffentlich","answer":"kostenlos","why":"شنیداری «kostenlos» است؛ عمومی‌بودن با رایگان‌بودن فرق دارد."},{"kind":"word","q":"regelmäßig","answer":"systematisch","why":"شنیداری «systematisch» است؛ منظم‌بودن زمانی با روش‌مندبودن متفاوت است."}],"summary":"","teaching":"روی واژهٔ دقیق کلیک کن؛ این چهار تفاوت را با گوش و چشم هم‌زمان تشخیص بده.","display":"Digitale Archive bewahren nicht nur Texte, sondern auch Fotografien und Tonaufnahmen. Für eine zuverlässige Suche benötigen die Dateien einheitliche Metadaten. Besonders relevant sind Angaben zur Herkunft und zum Zeitpunkt der Erstellung. Manche Sammlungen sind öffentlich zugänglich, andere bleiben wegen rechtlicher Fragen begrenzt verfügbar. Eine sorgfältige Sicherung verhindert, dass Informationen durch technische Fehler verloren gehen. Auch langfristig müssen Dateiformate regelmäßig überprüft werden.","id":"B7","set":"B","type":7}]}],"clinic":[{"title":"Quantoren — کمیت‌سازها","script":"Die Arbeitsgruppe befragte einige der Erstsemester. Viele fanden das neue Lernangebot hilfreich, aber eine Mehrheit wurde in dieser Umfrage nicht ausdrücklich festgestellt. Von einer Zustimmung aller kann schon gar keine Rede sein.","items":[{"kind":"mc","q":"Was wurde ausdrücklich NICHT festgestellt?","options":["Dass überhaupt Studierende befragt wurden.","Eine Zustimmung der Mehrheit.","Dass einige Erstsemester beteiligt waren."],"answer":1,"why":"گوینده وجود اکثریت موافق را صریحاً تأیید نکرده.","wrong":["مصاحبه بوده.","درست.","برخی سال‌اولی‌ها مشارکت داشتند."]},{"kind":"mc","q":"Welche Formulierung ist gedeckt?","options":["Alle Erstsemester waren begeistert.","Niemand fand das Angebot gut.","Viele Befragte empfanden es als hilfreich."],"answer":2,"why":"«viele» برابر با «alle» نیست.","wrong":["تعمیم مطلق.","خلاف شنیده است.","درست."]}],"tip":"هرگاه alle، viele، einige یا Mehrheit آمد، گسترهٔ ادعا را با متن شنیده‌شده تطبیق بده.","id":"C1"},{"title":"Modalverben — افعال وجهی","script":"Für das Seminar dürfen Sie eigene Tablets benutzen, Sie müssen es aber nicht. Fotoaufnahmen sind während der Veranstaltung nicht erlaubt. Für den praktischen Teil sollten Sie Schreibmaterial mitbringen; verpflichtend ist das jedoch nicht.","items":[{"kind":"mc","q":"Was gilt für Tablets?","options":["Sie sind erlaubt, aber nicht verpflichtend.","Sie sind grundsätzlich verboten.","Alle müssen ein Tablet mitbringen."],"answer":0,"why":"darf = مجاز؛ muss nicht = لازم نیست.","wrong":["درست.","ممنوع نیست.","اجباری نیست."]},{"kind":"mc","q":"Welche Tätigkeit ist verboten?","options":["Notizen machen.","Schreibmaterial mitbringen.","Fotografieren während des Seminars."],"answer":2,"why":"«nicht erlaubt» دربارهٔ عکس است.","wrong":["ممنوعیت یادداشت نبود.","توصیه شده بود.","درست."]}],"tip":"darf nicht را با muss nicht اشتباه نگیر؛ توصیه با الزام نیز فرق دارد.","id":"C2"},{"title":"Korrelation oder Kausalität","script":"In einer Beobachtungsstudie hatten Personen mit regelmäßigen Spaziergängen im Durchschnitt eine höhere Lebenszufriedenheit. Die Forschenden betonen jedoch, dass diese Daten nicht beweisen, dass die Spaziergänge allein die Zufriedenheit verursachen. Denkbar sind auch andere Einflussfaktoren.","items":[{"kind":"mc","q":"Was wurde beobachtet?","options":["Ein statistischer Zusammenhang.","Ein eindeutiger Kausalbeweis.","Ein Laborversuch mit zufälliger Zuteilung."],"answer":0,"why":"ارتباط مشاهده شده نه اثبات علت.","wrong":["درست.","رد شده.","طرح مطالعهٔ آزمایشگاهی نبود."]},{"kind":"mc","q":"Welche Schlussfolgerung wäre unzulässig?","options":["Weitere Faktoren könnten eine Rolle spielen.","Spaziergänge allein erhöhen nachweislich die Zufriedenheit.","Beobachtungsdaten erlauben vorsichtige Aussagen."],"answer":1,"why":"«allein verursachen» اثبات نشده است.","wrong":["ممکن است.","درست به‌عنوان استنتاج نامجاز.","محتاطانه مناسب است."]}],"tip":"«hängt zusammen» با «verursacht» یکسان نیست.","id":"C3"},{"title":"Bedingung — حذف شرط","script":"Die Hochschule will den Computerraum auch abends öffnen, sofern genügend Aufsichtspersonal verfügbar ist. Sollte sich kein geeignetes Personal finden, bleibt es bei den bisherigen Öffnungszeiten. Eine endgültige Entscheidung ist noch nicht gefallen.","items":[{"kind":"mc","q":"Wann wird der Computerraum länger geöffnet?","options":["Unabhängig von der Personalsituation.","Wenn ausreichend Aufsicht verfügbar ist.","Nur an Sonntagen."],"answer":1,"why":"شرط نیروی ناظر کافی لازم است.","wrong":["شرط حذف شده.","درست.","یکشنبه مطرح نیست."]},{"kind":"mc","q":"Was ist zum aktuellen Zeitpunkt richtig?","options":["Die längeren Zeiten sind bereits beschlossen.","Der Raum ist dauerhaft geschlossen.","Die Entscheidung ist noch offen."],"answer":2,"why":"تصمیم هنوز نهایی نشده.","wrong":["خلاف متن.","نه.","درست."]}],"tip":"sofern، falls و vorausgesetzt نشانگر شرط‌اند.","id":"C4"},{"title":"Zeitwechsel — جابه‌جایی زمان","script":"Der Vortrag war zunächst für Mittwoch vorgesehen. Weil die Referentin an diesem Tag verhindert ist, wurde er auf Freitag verschoben. Die Unterlagen sollten ursprünglich am Donnerstag eintreffen, stehen inzwischen aber bereits am Dienstag online.","items":[{"kind":"mc","q":"Wann findet der Vortrag nun statt?","options":["Mittwoch.","Donnerstag.","Freitag."],"answer":2,"why":"قرار نهایی جمعه است.","wrong":["اولیه.","زمان فایل نیست.","درست."]},{"kind":"mc","q":"Wann sind die Unterlagen online verfügbar?","options":["Bereits am Dienstag.","Erst am Donnerstag.","Nach dem Vortrag."],"answer":0,"why":"اطلاعات اولیه اصلاح شده؛ سه‌شنبه فایل موجود است.","wrong":["درست.","برنامهٔ اولیه.","نه."]}],"tip":"zunächst و ursprünglich را از jetzt و inzwischen متمایز کن.","id":"C5"},{"title":"Sprecherzuordnung — جابه‌جایی صاحب دیدگاه","script":"Professor Reuter schlägt vor, die Datenerhebung zu verlängern. Doktor Seifert hält dagegen eine größere Stichprobe für dringender. Beide stimmen darin überein, dass die bisherige Untersuchung allein noch keine eindeutigen Schlussfolgerungen erlaubt.","items":[{"kind":"mc","q":"Wer will die Datenerhebung verlängern?","options":["Professor Reuter.","Doktor Seifert.","Beide nennen nur die größere Stichprobe."],"answer":0,"why":"پیشنهاد افزایش مدت از رویتر است.","wrong":["درست.","سایفرت نمونهٔ بزرگ‌تر می‌خواهد.","نادرست."]},{"kind":"mc","q":"Worin besteht Einigkeit?","options":["Die Studie beweise alles.","Die Ergebnisse erlauben noch keine eindeutige Schlussfolgerung.","Eine größere Stichprobe sei unnötig."],"answer":1,"why":"هر دو از ناکافی بودن نتیجهٔ قطعی گفته‌اند.","wrong":["خلاف شنیده.","درست.","چنین توافقی نبود."]}],"tip":"مواضع شخصی و نقطهٔ توافق را جداگانه یادداشت کن.","id":"C6"},{"title":"Unzulässige Verallgemeinerung — تعمیم ناروا","script":"An einer kleinen Hochschule wurden vierzig Studierende aus zwei Fachbereichen befragt. Die meisten Befragten bevorzugten ein hybrides Seminarformat. Die Forschenden warnen ausdrücklich davor, diese Beobachtung ohne weitere Studien auf sämtliche Hochschulen zu übertragen.","items":[{"kind":"mc","q":"Worauf beziehen sich die Daten?","options":["Alle Hochschulen Deutschlands.","Nur auf zwei Fachbereiche einer Hochschule.","Ausschließlich auf Schülerinnen und Schüler."],"answer":1,"why":"نمونه محدود به دو گروه یک دانشگاه است.","wrong":["تعمیم ناروا.","درست.","دانشجویان بودند."]},{"kind":"mc","q":"Welche Aussage ist unzulässig?","options":["In der untersuchten Gruppe war hybrid beliebt.","Weitere Studien wären nötig.","Alle deutschen Studierenden bevorzugen hybrid."],"answer":2,"why":"نتیجه به جامعهٔ بسیار گسترده تعمیم داده شده است.","wrong":["مجاز.","درست است.","درست به عنوان گزارهٔ نامجاز."]}],"tip":"Stichprobe را با Gesamtpopulation یکی نگیر.","id":"C7"},{"title":"Hauptaussage oder Detail — پیام اصلی یا جزئیات","script":"Der Beitrag beschreibt zunächst technische Schwierigkeiten bei der Digitalisierung historischer Dokumente. Anschließend erläutert er neue Methoden zur Texterkennung und ihre Grenzen. Im Mittelpunkt steht jedoch die Frage, wie digitale Archive langfristig zugänglich bleiben können. Dabei spielen Dateiformate und dauerhafte Finanzierung eine wichtige Rolle.","items":[{"kind":"mc","q":"Was ist die Hauptfrage des Beitrags?","options":["Ob Archive nur Fotos speichern.","Wie Archive langfristig zugänglich bleiben.","Wie teuer ein bestimmter Scanner ist."],"answer":1,"why":"پرسش مرکزی دسترس‌پذیری درازمدت است.","wrong":["موضوع فرعی/ساختگی.","درست.","جزئیات خاصی نبود."]},{"kind":"mc","q":"Welche Aussage kann stimmen, ist aber nur ein Teilaspekt?","options":["Technische Texterkennung hat Grenzen.","Es gibt überhaupt keine langfristigen Probleme.","Archivierung spielt keine Rolle."],"answer":0,"why":"نکتهٔ فنی درست است اما موضوع مرکزی نیست.","wrong":["درست.","خلاف متن.","خلاف متن."]}],"tip":"در پرسش Hauptaussage یک جزئیات درست را به جای پیام اصلی انتخاب نکن.","id":"C8"}],"sources":[{"title":"TestDaF — Digitaler Testaufbau","url":"https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/"},{"title":"Offizielle Beispielaufgaben Hören","url":"https://www.testdaf.de/fileadmin/testdaf/downloads/Demo_Version_digitaler_TestDaF/Beispielaufgaben_Demo-Version_digitaler_TestDaF_Hoeren.pdf"},{"title":"Offizielle Bewertung","url":"https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/auswertung-des-digitalen-testdaf/"}]}</script>

function soundSettingsUI(){let v=deVoices();return `<div class="sound-settings"><div><b>کیفیت و صدای گوینده</b><p class="small muted" style="margin:3px 0 8px">صدای دستگاه معمولاً دلنشین‌تر است، اگر صدای آلمانی روی گوشی یا رایانه موجود باشد. اگر صدای دستگاه نداری یا راضی نیستی، «صدای گوگل (آنلاین)» را انتخاب کن؛ به اینترنت نیاز دارد و بدون نصب صدای آلمانی هم کار می‌کند.</p></div><div class="sound-line"><label>منبع پخش <select data-sound-mode><option value="device" ${audioSettings.mode==='device'?'selected':''}>صدای آلمانی دستگاه (انتخاب پیشنهادی)</option><option value="google" ${audioSettings.mode==='google'?'selected':''}>صدای گوگل (آنلاین)</option></select></label><label>گوینده <select data-voice-pick><option value="">خودکار — آلمانی ${v.length?'('+v.length+' صدا موجود)':'(ممکن است نیاز به نصب داشته باشد)'}</option>${v.map(x=>`<option value="${esc(x.voiceURI)}" ${audioSettings.voice===x.voiceURI?'selected':''}>${esc(x.name)} · ${esc(x.lang)} ${x.localService?'· نصب‌شده':''}</option>`).join('')}</select></label><label>سرعت <select data-audio-rate>${[0.8,0.9,1,1.1].map(n=>`<option value="${n}" ${Number(audioSettings.rate)===n?'selected':''}>${n===1?'عادی':n+'×'}</option>`).join('')}</select></label>${S.exam?.active?'':'<button class="btn sm" data-try-voice>▶ نمونهٔ کوتاه</button>'}</div><div class="small muted">صدای دستگاه به امکانات مرورگر و صداهای نصب‌شده وابسته است؛ بعضی صداها برای اجرا به اینترنت نیاز دارند. نسخهٔ سبک فاقد فایل صوتی داخلی است؛ برای صوت داخلی از نسخهٔ کامل استفاده کن. صدای گوگل از سرویس ترجمهٔ گوگل پخش می‌شود و به اینترنت نیاز دارد.</div></div>`}
function bindSoundSettings(){document.querySelectorAll('[data-sound-mode]').forEach(x=>x.onchange=()=>{stopAudio();audioSettings.mode=x.value;saveAudioSettings();render()});document.querySelectorAll('[data-voice-pick]').forEach(x=>x.onchange=()=>{audioSettings.voice=x.value;saveAudioSettings();render()});document.querySelectorAll('[data-audio-rate]').forEach(x=>x.onchange=()=>{audioSettings.rate=Number(x.value);saveAudioSettings();render()});document.querySelectorAll('[data-try-voice]').forEach(x=>x.onclick=()=>{stopAudio();if(audioSettings.mode==='google'){try{player=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=de&client=tw-ob&q='+encodeURIComponent('Guten Tag. Herzlich willkommen zum digitalen TestDaF. Dies ist eine kurze Hörprobe.'));player.playbackRate=audioSettings.rate;player.play().catch(()=>flash('پخش نمونهٔ صدای گوگل ممکن نشد؛ اینترنت را بررسی کن.'))}catch(err){flash('پخش نمونهٔ صدای گوگل ممکن نشد.')}}else if(audioSettings.mode==='device'&&'speechSynthesis' in window){const u=new SpeechSynthesisUtterance('Guten Tag. Herzlich willkommen zum digitalen TestDaF. Dies ist eine kurze Hörprobe.');u.lang='de-DE';u.rate=audioSettings.rate;const v=chosenVoice();if(v)u.voice=v;speechSynthesis.speak(u);u.onerror=()=>flash('صدای آلمانی دستگاه فعال نیست؛ منبع صدا را روی صدای گوگل بگذار.')}else{flash('منبع صدای نامشخصی انتخاب شده است.')}})}
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',()=>{if(S.view==='home'||S.view.startsWith('task:')){if(!activeNative&&!player)render()}})}

const $=q=>document.querySelector(q);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){flash('مرورگر اجازهٔ ذخیرهٔ محلی نداد. گزارش پاسخ‌ها را دانلود کن.')}}
function allTasks(){return BANK.sets.flatMap(s=>s.tasks)}
function getTask(id){return allTasks().find(t=>t.id===id)}
function answeredKey(id,i){return id+':'+i}
function answer(id,i){return S.answers[answeredKey(id,i)]}
function norm(x){return String(x||'').toLocaleLowerCase('de').trim().normalize('NFKC').replace(/[.,;!?„“"']/g,'').replace(/\s+/g,' ').replace(/^(die|der|das|den|dem|im)\s+/,'')}
function closeEnough(a,item){return item.answers?.some(v=>norm(a)===norm(v))}
function countAnswer(t){if(t.type===3)return t.items.filter((_,i)=>answer(t.id,i)===true).length;if(t.type===7)return Object.entries(S.answers).filter(([k,v])=>k.startsWith(t.id+':word:')&&v===true).length;return t.items.filter((_,i)=>{let a=answer(t.id,i);return a!==null&&a!==undefined&&String(a).trim()!==''}).length}
function countSet(id){return allTasks().filter(t=>t.set===id).reduce((n,t)=>n+countAnswer(t),0)}
function checkItem(t,i){let q=t.items[i],a=answer(t.id,i);if(q.kind==='short')return closeEnough(a,q);if(q.kind==='mc'||q.kind==='select')return Number(a)===q.answer;if(q.kind==='wrong')return a===true&&q.answer===true;if(q.kind==='word'){const tokens=t.display.split(/(\s+)/);const idx=tokens.findIndex(w=>w.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')===q.q);return S.answers[t.id+':word:'+idx]===true;}return false}
function taskScore(t){if(t.type===3)return t.items.reduce((s,q,i)=>s+(checkItem(t,i)?1:0),0);return t.items.reduce((s,q,i)=>s+(checkItem(t,i)?1:0),0)}
function setScore(id){return BANK.sets.find(s=>s.id===id).tasks.reduce((n,t)=>n+taskScore(t),0)}
function clinicScore(){return BANK.clinic.reduce((n,d)=>n+d.items.reduce((m,q,i)=>m+(Number(S.answers[d.id+':'+i])===q.answer?1:0),0),0)}
function taskById(task){return task.id.slice(0,1)}
function flash(msg){clearTimeout(flashTO);$('#toastspace').innerHTML='<div class="toast">'+esc(msg)+'</div>';flashTO=setTimeout(()=>{$('#toastspace').innerHTML=''},4600)}
function stopAudio(){synthToken++;activeNative=false;if('speechSynthesis' in window){try{speechSynthesis.cancel()}catch(e){}}if(player){try{player.pause();player.src=''}catch(e){}player=null}playingId=null;clearInterval(playerTick);playerTick=null}
function audioFinished(tid,task){S.listened[tid]=true;save();activeNative=false;if(S.view==='task:'+tid){let t=getTask(tid);if(t.type===3){render();flash('صوت تمام شد؛ اکنون متن خلاصه برای انتخاب دو جملهٔ نادرست باز شد.')}else{$('#pulse')?.classList.remove('play');flash('صوت تمام شد؛ پاسخ‌ها را بررسی و ثبت کن.')}}else if(S.view==='clinic')flash('صوت به پایان رسید.');}
function speakerName(line){const m=line.match(/^([A-ZÄÖÜ]+):\s*(.*)$/);return m?{speaker:m[1],text:m[2]}:{speaker:'VORTRAG',text:line}}
function nativePlay(tid,task){if(!('speechSynthesis' in window))return false;if(!deVoices().length)return false;const token=++synthToken;activeNative=true;playingId=tid;const rows=task.script.split(/\n/).map(x=>x.trim()).filter(Boolean).map(speakerName),segments=[];rows.forEach(row=>{(row.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[row.text]).forEach(s=>{if(s.trim())segments.push({text:s.trim(),speaker:row.speaker})})});if(!segments.length){activeNative=false;return false}let i=0;const voices=deVoices(),v=chosenVoice();const duration=AUD[tid].duration/1000;const speakerAlt=voices.find(x=>x.voiceURI!==v?.voiceURI)||v;const say=()=>{if(token!==synthToken)return;if(i>=segments.length){audioFinished(tid,task);return}const seg=segments[i];const u=new SpeechSynthesisUtterance(seg.text);u.lang='de-DE';u.rate=audioSettings.rate;u.pitch=1;u.volume=1;if(v){const female=/(MIRA|MODERATORIN|KERN|DOZENTIN|DURAN|NORA|YILDIZ|RICHTER)/.test(seg.speaker);u.voice=female?(speakerAlt||v):v}u.onstart=()=>{$('#pulse')?.classList.add('play');let p=$('#audioProgress');if(p)p.style.width=(i/segments.length*100)+'%';let tm=$('#audioTime');if(tm)tm.textContent='بخش '+(i+1)+' از '+segments.length+' · صدای دستگاه'; if(task.type===4){let who=tid[0]==='A'?(seg.speaker==='ALBRECHT'?0:seg.speaker==='DURAN'?1:-1):(seg.speaker==='RICHTER'?0:seg.speaker==='ADEYEMI'?1:-1);[0,1].forEach(j=>$('#speaker-'+j)?.classList.toggle('active',j===who))}};u.onend=()=>{if(token!==synthToken)return;i++;setTimeout(say,80)};u.onerror=e=>{if(token!==synthToken)return;stopAudio();flash('پخش صدای دستگاه در این مرورگر پشتیبانی نشد. منبع صدا را روی «صوت داخلی» قرار بده.')};speechSynthesis.speak(u)};try{speechSynthesis.cancel();say();return true}catch(e){activeNative=false;return false}}

function googleChunks(text){const out=[];const parts=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];parts.forEach(p=>{p=p.trim();if(!p)return;while(p.length>190){let cut=p.lastIndexOf(' ',190);if(cut<60)cut=190;out.push(p.slice(0,cut).trim());p=p.slice(cut).trim()}if(p)out.push(p)});return out}
function googlePlay(tid,task){const token=++synthToken;playingId=tid;const rows=task.script.split(/\n/).map(x=>x.trim()).filter(Boolean).map(speakerName),chunks=[];rows.forEach(row=>{googleChunks(row.text).forEach(c=>{if(c)chunks.push({text:c,speaker:row.speaker})})});if(!chunks.length)return false;let i=0;if(!player)player=new Audio();player.preload='auto';player.playbackRate=audioSettings.rate||1;const playNext=()=>{if(token!==synthToken)return;if(i>=chunks.length){audioFinished(tid,task);return}const url='https://translate.google.com/translate_tts?ie=UTF-8&tl=de&client=tw-ob&q='+encodeURIComponent(chunks[i].text);player.src=url;player.onended=()=>{if(token!==synthToken)return;i++;setTimeout(playNext,120)};player.onerror=()=>{if(token!==synthToken)return;i++;setTimeout(playNext,100)};player.onplay=()=>{$('#pulse')?.classList.add('play');let pr=$('#audioProgress');if(pr)pr.style.width=(i/chunks.length*100)+'%';let tm=$('#audioTime');if(tm)tm.textContent='بخش '+(i+1)+' از '+chunks.length+' · صدای گوگل';if(task.type===4){let who=tid[0]==='A'?(chunks[i].speaker==='ALBRECHT'?0:chunks[i].speaker==='DURAN'?1:-1):(chunks[i].speaker==='RICHTER'?0:chunks[i].speaker==='ADEYEMI'?1:-1);[0,1].forEach(j=>$('#speaker-'+j)?.classList.toggle('active',j===who))}};player.play().catch(()=>{if(token!==synthToken)return;i++;setTimeout(playNext,100)})};playNext();return true}
function labelTime(secs){secs=Math.max(0,Math.floor(secs));return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}
function hasEnded(t){return !!S.listened[t.id]}
function changeView(v){if(S.exam?.active){
  let allowed='task:'+S.exam.set+S.exam.current;
  if(v!==allowed){flash('حالت آزمون فعال است؛ تا پایان ست نمی‌توان به صفحه یا تکلیف قبلی رفت.');return}
 }
 stopAudio();S.view=v;save();render();window.scrollTo({top:0,behavior:'instant'});
}

for(let s of BANK.sets){navs+='<div class="nav-title">SET '+s.id+' · 30 ITEMS</div>';for(let t of s.tasks){let sc=S.submitted[s.id]?taskScore(t)+'/'+COUNTS[t.type]:countAnswer(t)+'/'+COUNTS[t.type];navs+='<button class="nav-btn '+(S.view==='task:'+t.id?'active':'')+'" data-nav="task:'+t.id+'" '+(ex?.active&&!(ex.set===s.id&&ex.current===t.type)?'disabled':'')+'><span>'+t.type+'. '+esc(TITLES[t.type])+'</span><b>'+sc+'</b></button>'}}
navs+='<div class="nav-title">ERGEBNISSE & TRAINING</div><button class="nav-btn '+(S.view==='clinic'?'active':'')+'" data-nav="clinic" '+(ex?.active?'disabled':'')+'>کلینیک شنیداری <b>16</b></button><button class="nav-btn '+(S.view==='answers'?'active':'')+'" data-nav="answers" '+(ex?.active?'disabled':'')+'>پاسخ‌نامهٔ تشریحی <b>✓</b></button><button class="nav-btn '+(S.view==='tools'?'active':'')+'" data-nav="tools" '+(ex?.active?'disabled':'')+'>ابزار تمرین <b>⏱</b></button><button class="nav-btn '+(S.view==='report'?'active':'')+'" data-nav="report" '+(ex?.active?'disabled':'')+' >گزارش و خروجی <b>⇩</b></button>';
$('#nav').innerHTML=navs;
}

function questionHtml(t){let out='<div class="questionlist">'; if(t.type===3 && !hasEnded(t))return '<div class="locked"><h3>متن خلاصه بعد از پایان صوت نمایش داده می‌شود</h3><p>در این تکلیف باید ابتدا سخنرانی را بشنوی، سپس دو جملهٔ نادرست را انتخاب کنی. تا پایان صوت به‌جای متن، از یادداشت کوتاه استفاده کن.</p></div>';

function answerFor(t,q,i){if(q.kind==='short')return q.answers.join(' / ');if(q.kind==='mc'||q.kind==='select')return q.options[q.answer];if(q.kind==='wrong')return q.answer?'FALSCH — باید انتخاب می‌شد.':'RICHTIG — نباید انتخاب می‌شد.';if(q.kind==='word')return q.q+' → '+q.answer;return ''}

for(let s of BANK.sets){if(!S.submitted[s.id]){h+=`<div class="locked"><h3>پاسخ‌نامهٔ ست ${s.id} قفل است</h3><p>ابتدا هر هفت تکلیف ست ${s.id} را پاسخ بده و ثبت کن.</p><button class="btn" data-nav="task:${s.id}1">رفتن به ست ${s.id}</button></div>`;continue}

for(let t of s.tasks){h+=`<div class="panel"><h3 class="de">${esc(t.id)} — ${esc(t.title)}</h3>${t.type===3?`<p class="muted">در این تکلیف باید دو جملهٔ نادرست را انتخاب می‌کردی.</p>`:''}${t.type===7?`<p class="muted">چهار واژهٔ نادرست در متن نوشته‌شده با واژهٔ شنیده‌شده مقایسه شده‌اند.</p>`:''}${t.items.map((q,i)=>q.kind==='wrong'&&!q.answer?`<div class="feedback"><div class="de small"><b>${i+1}. ${esc(q.q)}</b></div><p>${esc(q.why)}</p></div>`:explainQ(t,i)).join('')}<div class="teaching"><b>نکتهٔ کلیدی:</b> ${esc(t.teaching)}</div><details><summary><b>Transkript — متن کامل صوتِ این تکلیف</b></summary><div class="transcript">${esc(t.script)}</div></details></div>`}}

function tools(){return `<div class="eyebrow">EXTRA TRAINING</div><h2>ابزارهای مکمل شنیدن</h2><div class="panel"><h3>زمان‌سنج گفتار</h3><p>برای بازگویی شفاهی محتوای یک فایل شنیداری استفاده کن. این ابزار صدا را ضبط نمی‌کند.</p><div class="buttons"><button class="btn" data-speakersecs="45">۴۵ ثانیه</button><button class="btn" data-speakersecs="90">۹۰ ثانیه</button><button class="btn" data-speakersecs="120">۱۲۰ ثانیه</button><button class="btn" data-speakersecs="150">۱۵۰ ثانیه</button></div><p style="text-align:center"><span class="timer" id="speechTimer">01:30</span></p><div class="buttons"><button class="btn primary" id="toggleSpeech">شروع / مکث</button><button class="btn" id="resetSpeech">بازنشانی</button></div></div><div class="panel"><h3>متن تمرین و شمارندهٔ واژه</h3><p>پس از شنیدن، یک Zusammenfassung (خلاصهٔ شنیداری) به آلمانی بنویس؛ بررسی انسانی آن را می‌توانی در چت بگیری.</p><textarea id="practiceNote" class="text-note de" style="min-height:200px" placeholder="In dem Vortrag geht es um …">${esc(S.notes||'')}</textarea><p>واژه: <b id="words">${wordCount(S.notes||'')}</b></p></div><div class="panel"><h3>عبارت‌های کاربردی برای یادداشت</h3><table class="table"><tr><th>Deutsch</th><th>فارسی</th></tr>${[['zunächst / ursprünglich','در ابتدا'],['inzwischen / mittlerweile','اکنون / در این میان'],['allerdings / jedoch','اما / بااین‌حال'],['ausschließlich / nur','منحصراً / فقط'],['sofern / vorausgesetzt','مشروط به اینکه'],['daraus folgt nicht, dass','از آن نتیجه نمی‌شود که'],['übereinstimmen / widersprechen','موافقت / مخالفت کردن'],['einräumen / betonen','پذیرفتن یک نکته / تأکید کردن']].map(r=>`<tr><td class="de">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`}

 a.onerror=()=>flash('در پخش فایل صوتی داخلی مشکلی پیش آمد. از مرورگر دیگری استفاده کن یا گزینهٔ صدای دستگاه را فعال کن.');a.play().catch(()=>flash('مرورگر پخش را مسدود کرد؛ دوباره روی پخش صوت بزن.'));}

function highlightSpeaker(tid,time){let t=getTask(tid);if(!t||t.type!==4)return;let meta=AUD[tid].speakers;let last='';for(let s of meta){if(s[0]/1000<=time)last=s[1];else break}let who=tid[0]==='A'?(last==='ALBRECHT'?0:last==='DURAN'?1:-1):(last==='RICHTER'?0:last==='ADEYEMI'?1:-1);[0,1].forEach(i=>$('#speaker-'+i)?.classList.toggle('active',i===who));}
function handleChoice(e){let t=getTask(S.view.slice(5));if(!t||S.submitted[t.set])return;let i=Number(e.dataset.q),q=t.items[i];if(q.kind==='short'){setAnswer(t.id,i,e.value);return}if(q.kind==='mc'||q.kind==='select'){setAnswer(t.id,i,Number(e.value));e.closest('.question')?.querySelectorAll('.opt').forEach(o=>o.classList.toggle('chosen',o.querySelector('input').checked));return}if(q.kind==='wrong'){if(e.checked&&countAnswer(t)>=2){e.checked=false;flash('دقیقاً دو جمله باید انتخاب شود.');return}setAnswer(t.id,i,!!e.checked);e.closest('.opt')?.classList.toggle('chosen',e.checked)}}
function handleWord(e){let t=getTask(S.view.slice(5));if(!t||t.type!==7||S.submitted[t.set])return;let i=Number(e.dataset.word),k=t.id+':word:'+i,was=S.answers[k]===true;if(!was&&countAnswer(t)>=4){flash('در این تکلیف باید فقط چهار واژه انتخاب کنی.');return}S.answers[k]=!was;save();renderCurrentKeep();e.classList.toggle('marked',!was);e.setAttribute('aria-pressed',String(!was));}
function goNext(){if(!S.view.startsWith('task:'))return;let t=getTask(S.view.slice(5));if(S.exam?.active){if(t.type<7){S.exam.current=t.type+1;S.exam.deadline=Date.now()+MINUTES[t.type+1]*60000;S.view='task:'+t.set+(t.type+1);stopAudio();save();render();window.scrollTo(0,0)}else submitSet(t.set,true)}else{if(t.type<7)changeView('task:'+t.set+(t.type+1));else submitSet(t.set,false)}}
function startExam(id){if(S.submitted[id]){flash('ست ثبت شده است. برای تکرار باید پاسخ‌ها را پاک کنی.');return}if(S.exam?.active){flash('آزمون دیگری در حال اجراست.');return}if(!confirm('حالت آزمون برای ست '+id+' آغاز شود؟ مدت تمرینی ۴۰ دقیقه؛ صوت فقط یک بار و بازگشت به مرحلهٔ قبل ممنوع است.'))return;S.exam={active:true,set:id,current:1,deadline:Date.now()+MINUTES[1]*60000};S.view='task:'+id+'1';save();render();window.scrollTo(0,0)}
function examClock(){clearInterval(examTicker);let draw=()=>{if(!S.exam?.active){clearInterval(examTicker);return}let diff=Math.max(0,Math.ceil((S.exam.deadline-Date.now())/1000));let e=$('#examClock');if(e)e.textContent=labelTime(diff);if(diff<=0){clearInterval(examTicker);flash('زمان مرحله تمام شد؛ به مرحلهٔ بعد رفتی.');goNext()}};draw();examTicker=setInterval(draw,600)}
function submitSet(id,auto){let c=countSet(id);if(!auto&&c<30&&!confirm(`فقط ${c} از ۳۰ جای پاسخ تکمیل شده است. تصحیح انجام شود؟`))return;S.submitted[id]=true;S.exam=null;stopAudio();save();S.view='answers';render();window.scrollTo(0,0);flash('مجموعهٔ '+id+': '+setScore(id)+'/30 امتیاز تمرینی');}
function submitClinic(){let done=BANK.clinic.reduce((n,d)=>n+d.items.filter((_,i)=>S.answers[d.id+':'+i]!==undefined).length,0);if(done<16&&!confirm('تنها '+done+'/16 پاسخ داده‌ای. تصحیح شود؟'))return;S.clinicSubmitted=true;save();changeView('answers');}
function downloadReport(){let raw={title:'Digital TestDaF Extra Part 02 Hören',exportedAt:new Date().toISOString(),answers:S.answers,submitted:S.submitted,clinicSubmitted:S.clinicSubmitted,notes:S.notes,counts:{setA:S.submitted.A?setScore('A'):null,setB:S.submitted.B?setScore('B'):null,clinic:S.clinicSubmitted?clinicScore():null},notice:'Training only, not official TDN.'};let blob=new Blob([JSON.stringify(raw,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Digital_TestDaF_Extra_Part2_My_Answers.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function copyReport(){let t=reportText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>flash('گزارش کپی شد.')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();flash(ok?'گزارش کپی شد.':'کپی مستقیم پشتیبانی نشد؛ فایل JSON را دریافت کن.')}
function bind(){bindSoundSettings();document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>changeView(e.dataset.nav));document.querySelectorAll('[data-start]').forEach(e=>e.onclick=()=>startExam(e.dataset.start));document.querySelectorAll('[data-play]').forEach(e=>e.onclick=()=>play(e.dataset.play,false));document.querySelectorAll('[data-replay]').forEach(e=>e.onclick=()=>play(e.dataset.replay,true));document.querySelectorAll('[data-short]').forEach(e=>e.oninput=()=>handleChoice(e));document.querySelectorAll('[data-q]:not([data-short]):not([data-word])').forEach(e=>e.onchange=()=>handleChoice(e));document.querySelectorAll('[data-word]').forEach(e=>e.onclick=()=>handleWord(e));document.querySelectorAll('[data-clinic]').forEach(e=>e.onchange=()=>{S.answers[e.dataset.clinic]=Number(e.value);save();e.closest('.question')?.querySelectorAll('.opt').forEach(o=>o.classList.toggle('chosen',o.querySelector('input').checked))});document.querySelectorAll('[data-next]').forEach(e=>e.onclick=goNext);document.querySelectorAll('[data-finish]').forEach(e=>e.onclick=()=>submitSet(e.dataset.finish,false));document.querySelectorAll('[data-submitclinic]').forEach(e=>e.onclick=submitClinic);document.querySelectorAll('[data-home]').forEach(e=>e.onclick=()=>changeView('home'));document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{S['note:'+e.dataset.note]=e.value;save();let x=$('#noteCount');if(x)x.textContent=wordCount(e.value)});$('#practiceNote')?.addEventListener('input',e=>{S.notes=e.target.value;save();$('#words').textContent=wordCount(e.target.value)});document.querySelectorAll('[data-speakersecs]').forEach(e=>e.onclick=()=>{clearInterval(speechInt);speechInt=null;speechSeconds=Number(e.dataset.speakersecs);$('#speechTimer').textContent=labelTime(speechSeconds)});$('#toggleSpeech')?.addEventListener('click',()=>{if(speechInt){clearInterval(speechInt);speechInt=null;return}speechInt=setInterval(()=>{speechSeconds=Math.max(0,speechSeconds-1);let el=$('#speechTimer');if(el)el.textContent=labelTime(speechSeconds);if(!speechSeconds){clearInterval(speechInt);speechInt=null;flash('زمان گفتار پایان یافت.')}},1000)});$('#resetSpeech')?.addEventListener('click',()=>{clearInterval(speechInt);speechInt=null;speechSeconds=90;$('#speechTimer').textContent=labelTime(speechSeconds)});$('#copyReport')?.addEventListener('click',copyReport);$('#downloadReport')?.addEventListener('click',downloadReport);$('#resetAll')?.addEventListener('click',()=>{if(confirm('همهٔ پاسخ‌ها، نمره‌ها و یادداشت‌های محلی پاک شوند؟')){stopAudio();localStorage.removeItem(STORAGE);S={answers:{},submitted:{},clinicSubmitted:false,listened:{},exam:null,view:'home',night:S.night,notes:''};save();render();flash('حافظهٔ محلی پاک شد.')}})}
$('#darkToggle').onclick=()=>{S.night=!S.night;document.body.classList.toggle('night',S.night);save()};$('#exportTop').onclick=downloadReport;document.body.classList.toggle('night',S.night);if(S.exam?.active){S.view='task:'+S.exam.set+S.exam.current}render();
</script><a href="testdaf.html" dir="rtl" lang="fa" style="position:fixed;bottom:76px;left:16px;z-index:9999;background:#312e81;color:#fff;text-decoration:none;font-family:Vazirmatn,system-ui,sans-serif;font-size:14px;font-weight:700;padding:10px 16px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35)">← بازگشت به POOF</a></body></html>
