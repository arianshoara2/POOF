<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Digital TestDaF · Extra 5 | Zwei Volltests</title><style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#1b3345;--muted:#63798a;--line:#dce5e9;--teal:#126e78;--cyan:#e6f5f3;--dark:#173449;--gold:#b18140;--red:#ab4d52;--ok:#176e53}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.9 Tahoma,'Segoe UI',Arial,sans-serif}h1,h2,h3{line-height:1.6;margin:8px 0 14px}h1{font-size:24px}h2{font-size:21px}h3{font-size:16px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{background:var(--dark);color:white;padding:20px;position:sticky;top:0;height:100vh;overflow-y:auto}.side h2{font-size:20px;margin:0 0 8px}.side p{color:#bfd5df;font-size:12px}.side .sect{border-top:1px solid #456172;padding-top:14px;margin-top:17px}.side button{width:100%;background:#234e60;border:1px solid #4c7181;color:#fff;text-align:right;margin:4px 0}.side button.on{background:#178480;border-color:#9ed2ce}.side button:disabled{opacity:.4}.main{min-width:0;padding:27px clamp(15px,4vw,60px) 80px;max-width:1200px;width:100%;margin:auto}.hero{background:linear-gradient(120deg,#15364f,#126b76);color:#fff;border-radius:20px;padding:26px 30px;box-shadow:0 14px 25px #17304412}.hero h1{font-size:clamp(23px,3vw,34px);margin:0}.hero p{color:#d4eeeb;font-size:13px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);padding:clamp(17px,2.8vw,26px);border-radius:17px;margin:16px 0;box-shadow:0 7px 24px #18384909;min-width:0}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.tag{background:#eff5f6;padding:4px 10px;border-radius:20px;display:inline-block;font-weight:650;font-size:12px}.tag.dark{background:#ffffff25;color:#fff}.warn{border-right:4px solid var(--gold);background:#fff9eb;padding:12px 15px;border-radius:8px;margin:12px 0;font-size:13px}.note{border-right:4px solid var(--teal);background:var(--cyan);padding:12px 15px;border-radius:8px;margin:12px 0;font-size:13px}.danger{color:var(--red)}.ok{color:var(--ok)}button,select,input,textarea{font:inherit}button{border:1px solid #cbdce1;background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:650;color:var(--ink)}button:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}button:disabled{opacity:.43;cursor:not-allowed}button.primary{background:var(--teal);border-color:var(--teal);color:#fff}button.primary:hover:not(:disabled){background:#0f5c61;color:white}.quiet{background:#eff6f6!important}.source,.de{direction:ltr;text-align:left;unicode-bidi:plaintext;font:15px/1.82 'Segoe UI',Arial,sans-serif;white-space:pre-line}.source{border:1px solid var(--line);border-radius:12px;background:#f8fbfd;padding:17px;max-height:475px;overflow:auto}.source strong{color:var(--dark)}.question{padding:16px;margin:14px 0;border:1px solid #dce6ea;border-radius:12px;background:#fff}.question h4{margin:0 0 10px;font-size:14px}.opt{display:flex;gap:10px;align-items:start;border:1px solid #e2e9ed;border-radius:9px;margin:7px 0;padding:8px 10px;cursor:pointer;font-weight:normal}.opt:has(input:checked){background:#e6f5f3;border-color:#71bab1}.opt input{margin-top:7px;accent-color:var(--teal)}input[type=text],textarea,select{background:#fbfdfe;color:#213d4a;border:1px solid #cad9e0;border-radius:10px;padding:11px 12px;outline:0}input[type=text]:focus,textarea:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #127a8815}input[type=text]{width:100%}textarea{width:100%;min-height:225px;resize:vertical;direction:ltr;text-align:left;line-height:1.8}.notearea{min-height:85px}select{max-width:100%;width:100%}.clock{direction:ltr;font:bold 34px/1.2 ui-monospace,'Consolas',monospace;color:var(--teal);letter-spacing:1px}.progress{background:#dce9eb;height:8px;border-radius:99px;overflow:hidden}.progress div{background:#159187;height:100%;width:0;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#f4f8fa;padding:14px;border-radius:12px}.tile strong{display:block;font-size:22px}.review{background:#f9fbfc;border:1px solid #e0e8eb;border-radius:12px;padding:14px;margin:10px 0}.review.good{border-right:4px solid #27956d}.review.bad{border-right:4px solid #c36f69}.review .de{font-size:14px}.phase{background:#f0f7f7;padding:12px 15px;border-radius:10px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{border-radius:20px;background:#e6f0f2;padding:5px 10px;font-size:12px}.pill.active{background:#167679;color:white}.speakingSource{border:1px solid #dce6ea;border-radius:10px;padding:13px;background:#f7fbfd}.hiddenmsg{text-align:center;padding:26px;background:#eef3f5;border-radius:10px;color:#577080}.logo{font-size:12px;color:#85d2cf;font-weight:bold;letter-spacing:2px}.links a{color:#b1d7e4}.side select{width:100%;background:white;color:#243f4c}.answer-key{margin-top:14px}.outcome{background:#edf6f2;border-radius:12px;padding:18px}.mobilemenu{display:none}.sep{height:1px;background:var(--line);margin:16px 0}.toast{position:fixed;bottom:20px;left:20px;background:#133d46;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:0 7px 25px #1a2c3545;z-index:100;font-size:13px;display:none}.nowrap{white-space:nowrap}hr{border:0;border-top:1px solid var(--line);margin:17px 0}.valid{color:#177154}.invalid{color:#bb5f5c}.topsticky{position:sticky;top:0;z-index:4;background:#f2f5f7e9;backdrop-filter:blur(8px);padding:8px 0}@media(max-width:850px){.layout{display:block}.side{position:relative;height:auto;overflow:visible;padding:15px}.side h2{font-size:18px}.side .sect{margin-top:8px}.main{padding:16px 13px 56px}.hero{padding:20px}.grid{grid-template-columns:1fr}.clock{font-size:28px}.card{padding:16px}.source{font-size:14px;max-height:360px}.opt{padding:8px}.buttonrow button{flex:1}.side .navsmall{display:flex;gap:6px;flex-wrap:wrap}.side .navsmall button{width:auto;flex:1;min-width:75px;text-align:center}.mobilemenu{display:inline-block}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="layout"><aside class="side"><div class="logo">TESTDAF DIGITAL · EXTRA 05</div><h2>دو آزمون ترکیبی</h2><p>۲ × چهار مهارت · فارسی / Deutsch · آفلاین</p><div class="sect"><div class="small">آزمون فعال</div><div class="navsmall"><button id="chooseA" onclick="setTest('A')">آزمون A</button><button id="chooseB" onclick="setTest('B')">آزمون B</button></div><div class="small" style="margin-top:8px">حالت</div><div class="navsmall"><button id="freeMode" onclick="setMode('practice')">تمرین آزاد</button><button id="examMode" onclick="setMode('exam')">آزمون زمان‌دار</button></div></div><div class="sect"><div class="small">انتخاب صدا (برای آلمانی)</div><select id="voices" aria-label="German voice selection"><option value="">صدای آلمانی دستگاه</option></select><div class="small">سرعت خواندن</div><input style="width:100%" type="range" min="0.75" max="1.12" value="0.92" step="0.01" id="voiceRate" aria-label="voice speed"><button onclick="testVoice()">▶ آزمایش صدا</button><p>صدای آلمانی دستگاه، نه MP3 داخلی؛ برای پخش آفلاین باید زبان آلمانی روی دستگاه نصب باشد.</p></div><div class="sect"><button onclick="showHome()">⌂ صفحهٔ اصلی</button><button onclick="downloadJSON()">⇩ خروجی پاسخ‌ها (JSON)</button><button onclick="downloadTXT()">⇩ خروجی متن‌ها و یادداشت‌ها</button><button onclick="showResults()">▤ نتیجه و پاسخ‌نامه</button><button onclick="resetTest()">↺ پاک‌کردن آزمون جاری</button></div><div class="sect links small">منابع معتبر: <a target="_blank" rel="noopener" href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/">ساختار آزمون</a> · <a target="_blank" rel="noopener" href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/auswertung-des-digitalen-testdaf/">شیوهٔ ارزیابی</a></div></aside><main class="main"><div id="view"></div></main></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const DATA={"A":{"name":"A","reading":[{"name":"Lückentext ergänzen","typ":"fill","source":"Im Rahmen eines hochschulweiten Projekts untersuchte ein Forschungsteam, wie sich offene Lernräume auf die Zusammenarbeit auswirken. Die Ergebnisse sind jedoch mit Vorsicht zu (1) ____, da sich überwiegend Studierende beteiligten, die solche Räume ohnehin regelmäßig nutzen. Die Wissenschaftlerinnen betonen, dass aus der Untersuchung keine eindeutigen (2) ____ zwischen Raumgestaltung und Studienerfolg abgeleitet werden können. Gleichwohl lassen die Befragungen (3) ____, dass flexibel nutzbare Tische spontane Lerngruppen begünstigen. Die Hochschule will die Erkenntnisse bei künftigen Umbauten (4) ____ und zugleich prüfen, ob ruhigere Einzelarbeitsplätze ausreichend zur Verfügung (5) ____.","qs":[{"kind":"choice","q":"Lücke 1","opts":["interpretieren","unterbrechen","verursachen"],"a":"interpretieren","why":"interpretieren = نتایج را تفسیر کردن؛ «با احتیاط تفسیر شود» ترکیب طبیعی است.","trap":"ترکیب واژگانی"},{"kind":"choice","q":"Lücke 2","opts":["Ursachen","Rückschlüsse","Voraussetzungen"],"a":"Rückschlüsse","why":"Rückschlüsse ableiten = نتیجه‌گیری کردن. شواهد محدود اجازهٔ نتیجه‌گیری روشن نمی‌دهد.","trap":"هم‌آیی علمی"},{"kind":"choice","q":"Lücke 3","opts":["vermuten","widersprechen","zu","erkennen"],"a":"erkennen","why":"erkennen lassen, dass = نشان دادن / قابل استنباط ساختن.","trap":"گرامر/ترکیب"},{"kind":"choice","q":"Lücke 4","opts":["berücksichtigen","erledigen","vermeiden"],"a":"berücksichtigen","why":"Erkenntnisse berücksichtigen = یافته‌ها را لحاظ کردن.","trap":"هم‌آیی"},{"kind":"choice","q":"Lücke 5","opts":["stehen","gehen","lassen"],"a":"stehen","why":"zur Verfügung stehen = در دسترس بودن.","trap":"عبارت ثابت"}],"min":6,"guide":"Wählen Sie für jede Lücke das Wort, das grammatisch und inhaltlich passt."},{"name":"Textabschnitte ordnen","typ":"order","source":"**Einleitung:** Eine Hochschule möchte prüfen, ob die Nutzung einer neuen Campus-App tatsächlich Wege verkürzt. Ein Forschungsbericht erläutert das Vorgehen.\n\n[A] Abschließend verglich das Team die Angaben aus den Befragungen mit den anonymisierten Nutzungsdaten. Dabei ergaben sich in mehreren Bereichen deutliche Abweichungen.\n\n[B] Zunächst formulierten die Forschenden zwei Fragen: Wie häufig wird die App genutzt, und verändern sich dadurch die Wege zwischen den Gebäuden?\n\n[C] Anschließend wurden Studierende verschiedener Fachbereiche vier Wochen lang befragt. Dabei sollten sie sowohl die App-Nutzung als auch die Dauer ihrer Wege dokumentieren.\n\n[D] Auf Grundlage dieser Unterschiede empfahl das Team, zunächst die Wegbeschilderung zu verbessern, statt weitere App-Funktionen einzuführen.","qs":[{"kind":"choice","q":"Welche Position erhält Abschnitt A?","opts":["1","2","3","4"],"a":"3","why":"A = Abgleich nach Datenerhebung؛ واژهٔ Abschließend اینجا به پایان ارزیابی اشاره می‌کند، نه الزاماً آخرین بند کل گزارش.","trap":""},{"kind":"choice","q":"Welche Position erhält Abschnitt B?","opts":["1","2","3","4"],"a":"1","why":"B مسئلهٔ پژوهش را در آغاز مطرح می‌کند (Zunächst).","trap":""},{"kind":"choice","q":"Welche Position erhält Abschnitt C?","opts":["1","2","3","4"],"a":"2","why":"C پس از تعیین پرسش‌ها، روش گردآوری داده‌ها را توضیح می‌دهد.","trap":""},{"kind":"choice","q":"Welche Position erhält Abschnitt D?","opts":["1","2","3","4"],"a":"4","why":"D توصیهٔ نهایی را از مقایسهٔ قبلی نتیجه می‌گیرد.","trap":""}],"min":6,"guide":"Ordnen Sie die vier Abschnitte in die logische Reihenfolge. Jede Position wird genau einmal vergeben."},{"name":"Multiple-Choice: Forschung zu Stadtbäumen","typ":"mc","source":"Stadtbäume gelten vielerorts als einfache Antwort auf sommerliche Hitze. Tatsächlich können sie durch Schatten und Verdunstung die unmittelbare Umgebung abkühlen. Ob eine Stadt insgesamt messbar kühler wird, hängt jedoch von der Verteilung der Bäume, den Straßenverhältnissen und der Wasserversorgung ab. Ein Forschungsteam untersuchte hierzu drei Wohnviertel mit unterschiedlicher Bebauung. Gemessen wurde nicht nur die Lufttemperatur, sondern auch die Temperatur der Oberflächen und die Einschätzung der Anwohnerinnen und Anwohner.\n\nEin überraschender Befund: Ein dicht begrüntes Viertel wies am frühen Abend zwar niedrigere Oberflächentemperaturen auf, die gemessene Lufttemperatur unterschied sich jedoch kaum von jener in einem benachbarten Viertel. Die Befragten nahmen die Umgebung trotzdem als angenehmer wahr. Die Autorinnen vermuten, dass Schatten, Wind und persönliche Erwartungen gemeinsam eine Rolle spielen. Dies beweise nicht, dass die Bäume wirkungslos seien; vielmehr verdeutliche es die Grenzen einer einzigen Messgröße.\n\nDie Studie liefert deshalb keine Rangliste der „besten“ Baumarten. Auch lässt sich aus den drei untersuchten Vierteln keine allgemeine Aussage über alle deutschen Städte ableiten. Das Team empfiehlt, Baumpflanzungen mit Maßnahmen zur Speicherung von Regenwasser zu verbinden. Ohne ausreichend Wasser könnten besonders junge Bäume während längerer Trockenperioden Schaden nehmen. Zugleich müsse die Stadtverwaltung die Pflegekosten berücksichtigen, denn neue Grünflächen seien keine einmalige Investition.","qs":[{"kind":"choice","q":"Was ist der zentrale Gegenstand der Studie?","opts":["Wirtschaftlicher Nutzen der Holzproduktion","Wirkung städtischer Begrünung auf Hitze und Wahrnehmung","Vergleich deutscher Baumarten"],"a":"Wirkung städtischer Begrünung auf Hitze und Wahrnehmung","why":"مطالعه هم داده‌های دما و هم تجربهٔ شهروندان را بررسی می‌کند.","trap":"پاسخ موضوعی اما فرعی"},{"kind":"choice","q":"Wovon hängt die Kühlwirkung laut Text unter anderem ab?","opts":["Von der Wasserverfügbarkeit","Ausschließlich von der Baumhöhe","Nur von den Erwartungen der Bewohner"],"a":"Von der Wasserverfügbarkeit","why":"آبرسانی یکی از عوامل است؛ گزینه‌های ausschließlich و nur تعمیم ناروا هستند.","trap":"کمیت‌ساز"},{"kind":"choice","q":"Welcher Unterschied wurde am frühen Abend beobachtet?","opts":["Lufttemperaturen waren überall stark unterschiedlich","Oberflächen waren kühler, Lufttemperatur kaum anders","Die Befragten bemerkten keine Unterschiede"],"a":"Oberflächen waren kühler, Lufttemperatur kaum anders","why":"تمایز میان دمای سطح و دمای هوا مهم است.","trap":"جابه‌جایی شاخص"},{"kind":"choice","q":"Warum wurde ein Viertel als angenehmer wahrgenommen?","opts":["Die Autorinnen nennen mehrere mögliche Einflüsse","Die Wirkung der Erwartungen wurde endgültig bewiesen","Ausschließlich wegen der Lufttemperatur"],"a":"Die Autorinnen nennen mehrere mögliche Einflüsse","why":"متن از حدس چندعاملۀ پژوهشگران سخن می‌گوید، نه اثبات قطعی.","trap":"قطعیت"},{"kind":"choice","q":"Welche Aussage wird ausdrücklich eingeschränkt?","opts":["Eine Verallgemeinerung auf alle Städte","Die Existenz aller Stadtbäume","Die Notwendigkeit jeder Messung"],"a":"Eine Verallgemeinerung auf alle Städte","why":"سه محله برای نتیجه‌گیری دربارهٔ همهٔ شهرها کافی نیست.","trap":"تعمیم"},{"kind":"choice","q":"Was schlagen die Forschenden vor?","opts":["Regenwasser speichern und Pflanzungen kombinieren","Pflege der Bäume vollständig einstellen","Nur neue Baumarten importieren"],"a":"Regenwasser speichern und Pflanzungen kombinieren","why":"راهکار ترکیبی در پاراگراف آخر آمده است.","trap":"راهکار دقیق"},{"kind":"choice","q":"Welche Funktion erfüllt der letzte Satz?","opts":["Er erläutert einen langfristigen Kostenaspekt","Er nennt die Zahl der befragten Personen","Er widerlegt die Temperaturmessungen"],"a":"Er erläutert einen langfristigen Kostenaspekt","why":"جملۀ آخر به هزینهٔ نگهداری مستمر اشاره می‌کند.","trap":"گزارهٔ درست اما بی‌ربط"}],"min":12,"guide":"Wählen Sie die Aussage, die dem Text tatsächlich entspricht."},{"name":"Sprachhandlungen zuordnen","typ":"speechact","source":"**Ausschnitt eines Berichts:**\n1. „Zwar ließen sich die Abläufe beschleunigen, allerdings profitierten nicht alle Gruppen gleichermaßen.“\n2. „Daher empfehlen wir eine zusätzliche Beratung für internationale Studienanfänger.“\n3. „Unter einer hybriden Sprechstunde verstehen wir ein Angebot, das sowohl online als auch vor Ort genutzt werden kann.“\n4. „Ob die Regelung langfristig zu besseren Ergebnissen führt, bleibt offen.“","qs":[{"kind":"choice","q":"Welche sprachliche Handlung liegt in Aussage 1 vor?","opts":["Einschränken","Definieren","Empfehlen"],"a":"Einschränken","why":"Zwar … allerdings محدودیت مزیت ادعاشده را نشان می‌دهد.","trap":""},{"kind":"choice","q":"Welche sprachliche Handlung liegt in Aussage 2 vor?","opts":["Vermuten","Empfehlen","Belegen"],"a":"Empfehlen","why":"empfehlen wir صریحاً پیشنهاد می‌دهد.","trap":""},{"kind":"choice","q":"Welche sprachliche Handlung liegt in Aussage 3 vor?","opts":["Definieren","Widerlegen","Warnen"],"a":"Definieren","why":"Unter ... verstehen wir یک تعریف عملی ارائه می‌کند.","trap":""},{"kind":"choice","q":"Welche sprachliche Handlung liegt in Aussage 4 vor?","opts":["Einschränken / Unsicherheit markieren","Vergleichen","Fordern"],"a":"Einschränken / Unsicherheit markieren","why":"bleibt offen به عدم قطعیت نتیجه اشاره دارد.","trap":""}],"min":7,"guide":"Bestimmen Sie die kommunikative Funktion der Aussagen."},{"name":"Aussagen Kategorien zuordnen","typ":"categorize","source":"**Studie zu studentischer Mobilität:** Im Untersuchungsbericht werden drei Bereiche unterschieden.\n\n**A: Befunde (Ergebnisse):** Bei einer Befragung von 900 Studierenden nutzten 38 Prozent überwiegend das Fahrrad. An Regentagen sank dieser Anteil. Besonders häufig nannten Studierende fehlende Abstellmöglichkeiten als Hindernis.\n\n**B: Methodische Grenzen:** Teilgenommen haben freiwillige Studierende eines einzigen Campus. Wer bereits viel Fahrrad fährt, könnte eher auf die Einladung reagiert haben. Die Befragung fand ausschließlich im Frühjahr statt.\n\n**C: Empfehlungen:** Die Hochschule sollte weitere überdachte Stellplätze schaffen. Zudem wäre eine Erhebung im Winter sinnvoll. Eine Zusammenarbeit mit der Stadt könnte gefährliche Kreuzungen entschärfen.","qs":[{"kind":"choice","q":"38 Prozent nutzten überwiegend das Fahrrad.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"A: Befunde","why":"یک یافتهٔ اندازه‌گیری‌شده است.","trap":""},{"kind":"choice","q":"Die Befragung war auf einen Campus beschränkt.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"B: Methodische Grenzen","why":"نمونه فقط از یک دانشگاه است.","trap":""},{"kind":"choice","q":"Weitere Stellplätze sollen geschaffen werden.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"C: Empfehlungen","why":"sollen نشان‌دهندهٔ پیشنهاد است.","trap":""},{"kind":"choice","q":"An Regentagen war der Fahrradanteil geringer.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"A: Befunde","why":"توصیف دادهٔ مشاهده‌شده است.","trap":""},{"kind":"choice","q":"Die Teilnahme könnte durch Selbstselektion verzerrt sein.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"B: Methodische Grenzen","why":"تردید دربارهٔ نمایندگی نمونه.","trap":""},{"kind":"choice","q":"Eine Winterstudie könnte die Daten ergänzen.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"C: Empfehlungen","why":"پیشنهاد تکمیل مطالعه.","trap":""},{"kind":"choice","q":"Die Stadt sollte problematische Kreuzungen umbauen.","opts":["A: Befunde","B: Methodische Grenzen","C: Empfehlungen"],"a":"C: Empfehlungen","why":"پیشنهاد اقدام اجرایی.","trap":""}],"min":10,"guide":"Ordnen Sie jede Aussage einem Bereich zu."},{"name":"Aussagen Begriffspaar zuordnen","typ":"pairs","source":"**Wissenschaft und Öffentlichkeit:**\nForschungsinstitute diskutieren zwei Herausforderungen: die **Transparenz** ihrer Arbeit und den **Schutz persönlicher Daten**. Transparenz bedeutet, dass Methoden, Finanzierungsquellen und allgemeine Ergebnisse nachvollziehbar dokumentiert werden. Datenschutz verlangt dagegen, personenbezogene Informationen nur auf einer rechtmäßigen Grundlage und so sparsam wie möglich zu verarbeiten. Beide Ziele sind wichtig, können aber in einzelnen Projekten in Spannung geraten. So kann ein Datensatz für die Überprüfung wissenschaftlicher Ergebnisse hilfreich sein, zugleich aber Rückschlüsse auf einzelne Personen ermöglichen.","qs":[{"kind":"choice","q":"Forschungsmethoden öffentlich dokumentieren","opts":["Transparenz","Datenschutz"],"a":"Transparenz","why":"شفافیت روش‌شناسی.","trap":""},{"kind":"choice","q":"Personenbezogene Angaben minimieren","opts":["Transparenz","Datenschutz"],"a":"Datenschutz","why":"اصل به‌حداقل‌رساندن دادهٔ شخصی.","trap":""},{"kind":"choice","q":"Finanzierungsquellen offenlegen","opts":["Transparenz","Datenschutz"],"a":"Transparenz","why":"انتشار منابع مالی.","trap":""},{"kind":"choice","q":"Rückschlüsse auf einzelne Teilnehmende verhindern","opts":["Transparenz","Datenschutz"],"a":"Datenschutz","why":"پیشگیری از شناسایی افراد.","trap":""}],"min":7,"guide":"Ordnen Sie die vier Aussagen den Begriffen zu."},{"name":"Fehler in Zusammenfassung erkennen","typ":"errors","source":"**Text:** Ein Pilotprojekt untersuchte digitale Beratungstermine für Erstsemester. Von 500 eingeladenen Studierenden nahmen 180 an einer freiwilligen Befragung teil. 62 Prozent der Befragten bewerteten die Terminbuchung positiv. Die Projektgruppe weist jedoch darauf hin, dass daraus keine Aussagen über sämtliche Studienanfänger abgeleitet werden können. Die Wartezeiten sanken im untersuchten Zeitraum von durchschnittlich acht auf sechs Tage. Die Hochschule plant deshalb zunächst eine Fortsetzung an zwei Fakultäten.\n\n**Tabelle:**\nVor dem Projekt: Wartezeit 8 Tage | Nach dem Projekt: 6 Tage\nBefragte Personen: 180 | Eingeladene Personen: 500\n\n**Zusammenfassung – sieben Sätze:**","qs":[{"kind":"pick","q":"Markieren Sie GENAU drei inhaltlich falsche Sätze in der Zusammenfassung.","opts":["1. Ein Pilotprojekt befasste sich mit digitaler Terminberatung.","2. Alle 500 eingeladenen Personen nahmen an der Befragung teil.","3. Mehr als die Hälfte der Befragten äußerte sich positiv zur Buchung.","4. Die Wartezeit stieg im Projekt von sechs auf acht Tage.","5. Die Autorinnen warnen vor einer Verallgemeinerung.","6. Die Hochschule führt das Angebot sofort an sämtlichen Fakultäten ein.","7. Die Teilnahme an der Befragung war freiwillig."],"a":[1,3,5],"why":"غلط‌ها ۲، ۴ و ۶ هستند: مشارکت ۱۸۰ از ۵۰۰، کاهش ۸ به ۶ روز، و گسترش تنها به دو دانشکده. برای امتیاز هر خطای درست یک واحد، گزینه‌های اضافی جریمهٔ آموزشی دارند."}],"min":7,"guide":"Wählen Sie genau drei fehlerhafte Sätze (3 Items)."}],"listening":[{"name":"Kurzantwort: Übersicht ergänzen","typ":"short","source":"Thema: Projekt zur Wiederverwendung von Laborgeräten.\nErgänzen Sie die Übersicht anhand der Ansage. Antworten Sie mit Stichwörtern.","qs":[{"kind":"short","q":"1. Für welche Geräte gilt die Initiative?","a":["funktionsfähige Kleingeräte","kleingeräte","funktionsfähige laborgeräte"],"why":"گفته می‌شود فقط دستگاه‌های کوچک سالم."},{"kind":"short","q":"2. Bis wann können Einrichtungen Geräte anmelden?","a":["bis 15. Juni","15. Juni","15 juni"],"why":"مهلت پانزدهم ژوئن است."},{"kind":"short","q":"3. Wer kontrolliert die Sicherheit?","a":["die technische Werkstatt","technische werkstatt","werkstatt"],"why":"بازرسی را کارگاه فنی انجام می‌دهد."},{"kind":"short","q":"4. Wofür werden Geräte zuerst angeboten?","a":["für Lehrveranstaltungen","lehrveranstaltungen","lehre"],"why":"اولویت استفادهٔ آموزشی است."},{"kind":"short","q":"5. Was ist bei defekten Geräten erforderlich?","a":["fachgerechte entsorgung","entsorgung","fachgerecht entsorgen"],"why":"دستگاه خراب باید اصولی دفع شود."}],"min":5,"guide":"Das Audio ist eine mit Geräte-Stimmen erzeugte Lernsimulation. Nutzen Sie die Antwortfelder; Transkript erst nach der Abgabe.","audio":"Guten Tag. Ich informiere Sie über unsere Initiative zur Wiederverwendung von Laborgeräten. Gesucht werden ausschließlich funktionsfähige Kleingeräte, zum Beispiel Waagen oder kleine Messinstrumente. Die Anmeldung ist bis zum fünfzehnten Juni möglich. Danach prüft die technische Werkstatt jedes Gerät auf Sicherheit. Geeignete Geräte werden zunächst für Lehrveranstaltungen angeboten. Defekte Geräte nehmen wir nicht in die Vermittlung auf. Sie müssen fachgerecht entsorgt werden. Vielen Dank."},{"name":"Kurzantwort: Textstellen Begriffspaar","typ":"short","source":"In einem Interview geht es um **Vorteile** und **Probleme** einer studentischen Fahrradwerkstatt. Notieren Sie je zwei Aspekte.","qs":[{"kind":"short","q":"1. Vorteil: Was spart die Werkstatt?","a":["reparaturkosten","kosten","geld"],"why":"کارگاه به کاهش هزینهٔ تعمیر کمک می‌کند."},{"kind":"short","q":"2. Vorteil: Was lernen Studierende dort?","a":["reparaturen selbst durchführen","selbst reparieren","handwerkliche fähigkeiten"],"why":"یادگیری تعمیر مستقل."},{"kind":"short","q":"3. Problem: Welche Ressource fehlt häufig?","a":["ehrenamtliche helfer","freiwillige","helfer"],"why":"کمبود داوطلب."},{"kind":"short","q":"4. Problem: Welches Material ist nicht immer vorhanden?","a":["ersatzteile","teile"],"why":"قطعهٔ یدکی همیشه نیست."}],"min":5,"guide":"Ordnen Sie die gehörten Stichwörter zwei Kategorien zu.","audio":"Moderatorin: Welche Vorteile bietet die studentische Fahrradwerkstatt?\nProjektleiter: Erstens sparen die Studierenden Reparaturkosten. Zweitens lernen sie, kleinere Reparaturen selbst durchzuführen.\nModeratorin: Und wo liegen die Schwierigkeiten?\nProjektleiter: Wir haben oft zu wenige ehrenamtliche Helfer. Außerdem sind bestimmte Ersatzteile nicht immer auf Lager. Deshalb können wir nicht jedes Fahrrad sofort reparieren."},{"name":"Fehler in Zusammenfassung erkennen","typ":"errors","source":"Hören Sie zunächst die Mitteilung. **Erst nach dem Abspielen** lesen Sie die Zusammenfassung und markieren genau zwei falsche Aussagen.","qs":[{"kind":"pick","q":"Wählen Sie genau zwei Fehler.","opts":["1. Die neue Lernberatung beginnt Anfang Oktober.","2. Termine können nur persönlich im Büro vereinbart werden.","3. Die Beratung richtet sich besonders an Studierende des ersten Jahres.","4. Eine Beratung dauert höchstens dreißig Minuten.","5. Die Teilnahme ist verpflichtend.","6. Die Gespräche sind kostenlos."],"a":[1,4],"why":"جملۀ ۲ نادرست است چون رزرو آنلاین انجام می‌شود؛ جملهٔ ۵ نادرست است چون شرکت داوطلبانه است."}],"min":5,"guide":"Zusammenfassung wird während der Audio-Wiedergabe verborgen.","audio":"Ab Anfang Oktober bietet das Studienzentrum eine neue Lernberatung an. Termine lassen sich ausschließlich online buchen. Besonders angesprochen sind Studierende im ersten Studienjahr. Ein Gespräch dauert maximal dreißig Minuten und ist kostenlos. Die Teilnahme ist natürlich freiwillig. Wir freuen uns auf Ihre Anmeldung.","hide_until_audio":true},{"name":"Aussagen Personen zuordnen","typ":"speaker","source":"Drei Personen diskutieren über freie Kursmaterialien. Ordnen Sie jede Aussage der richtigen Person zu.","qs":[{"kind":"choice","q":"1. Fordert klare Lizenzen für Lehrmaterialien.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Dozentin Keller","why":"کلر بر مجوز انتشار تأکید می‌کند.","trap":""},{"kind":"choice","q":"2. Berichtet von Problemen beim Auffinden von Materialien.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Student Omar","why":"عمر مسئلهٔ جست‌وجو را گزارش می‌کند.","trap":""},{"kind":"choice","q":"3. Fragt nach den Kosten der Umsetzung.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Moderatorin","why":"پرسش هزینه را مجری می‌پرسد.","trap":""},{"kind":"choice","q":"4. Schlägt einen zentralen Suchkatalog vor.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Student Omar","why":"ایدهٔ فهرست یکپارچه از دانشجو است.","trap":""},{"kind":"choice","q":"5. Warnt vor unklaren Urheberrechten.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Dozentin Keller","why":"بحث حق تکثیر را استاد مطرح می‌کند.","trap":""},{"kind":"choice","q":"6. Leitet das Gespräch mit einer allgemeinen Frage ein.","opts":["Moderatorin","Dozentin Keller","Student Omar"],"a":"Moderatorin","why":"گفتگو با پرسش مجری آغاز می‌شود.","trap":""}],"min":7,"guide":"Im Originalformat Video; hier eine klar gekennzeichnete Mehrsprecher-Sprechsimulation.","audio":"Moderatorin: Wir sprechen heute über frei zugängliche Kursmaterialien. Was sollte eine Hochschule zuerst tun?\nDozentin Keller: Sie muss klare Nutzungs- und Veröffentlichungslizenzen festlegen. Sonst entstehen Schwierigkeiten mit dem Urheberrecht.\nStudent Omar: Für mich ist die Suche das größere Problem. Viele Dateien liegen an völlig unterschiedlichen Orten. Ein zentraler Suchkatalog wäre hilfreich.\nModeratorin: Welche Kosten hätte eine solche Umstellung?\nDozentin Keller: Das muss sorgfältig geprüft werden. Besonders wichtig bleibt, dass Lehrende die Rechte an fremden Abbildungen beachten.\nStudent Omar: Selbst ein einfacher Katalog würde uns schon sehr helfen."},{"name":"Kurzantwort: Gliederung Vortrag","typ":"short","source":"Notieren Sie die fehlenden Stichwörter zu einem Kurzvortrag über **Hitzeschutz in Bibliotheken**.","qs":[{"kind":"short","q":"1. Erste Belastung für Nutzerinnen und Nutzer?","a":["hohe raumtemperaturen","hitze","raumtemperatur"],"why":"دمای بالای داخل ساختمان."},{"kind":"short","q":"2. Sofortmaßnahme an Fenstern?","a":["außenliegender sonnenschutz","sonnenschutz","verschattung"],"why":"سایه‌بان خارجی."},{"kind":"short","q":"3. Langfristige bauliche Maßnahme?","a":["dämmung","bessere dämmung"],"why":"عایق‌بندی."},{"kind":"short","q":"4. Welcher Aspekt darf nicht vergessen werden?","a":["ausreichende belüftung","belüftung","luftqualität"],"why":"تهویه/کیفیت هوا."}],"min":6,"guide":"Im Originalformat Video mit Vortragsfolie; hier eine Audiovortrags-Simulation.","audio":"In öffentlichen Bibliotheken führt sommerliche Hitze häufig zu hohen Raumtemperaturen. Viele Besucherinnen und Besucher können sich dann schlechter konzentrieren. Als unmittelbare Maßnahme empfiehlt sich außenliegender Sonnenschutz an den Fenstern. Langfristig kann eine bessere Dämmung den Energiebedarf verringern. Bei sämtlichen baulichen Veränderungen darf allerdings eine ausreichende Belüftung nicht vergessen werden. Andernfalls leidet die Luftqualität."},{"name":"Multiple-Choice: Gespräch zur Studienfinanzierung","typ":"mc","source":"Hören Sie das Gespräch. Kreuzen Sie jeweils eine Antwort an.","qs":[{"kind":"choice","q":"Warum nimmt Jana am Gespräch teil?","opts":["Sie sucht Informationen zu einem Stipendium","Sie möchte ein Zimmer vermieten","Sie beantragt einen Bibliotheksausweis"],"a":"Sie sucht Informationen zu einem Stipendium","why":"او دربارهٔ بورسیه اطلاعات می‌خواهد.","trap":""},{"kind":"choice","q":"Welche Voraussetzung nennt der Berater?","opts":["Ein Motivationsschreiben","Zwei Jahre Berufserfahrung","Ein bestimmter Familienstand"],"a":"Ein Motivationsschreiben","why":"نامهٔ انگیزه لازم است.","trap":""},{"kind":"choice","q":"Was gilt für eine Nebentätigkeit?","opts":["Sie muss angegeben werden","Sie ist grundsätzlich verboten","Sie erhöht automatisch die Förderung"],"a":"Sie muss angegeben werden","why":"باید اعلام شود، نه ممنوع.","trap":""},{"kind":"choice","q":"Bis wann erfolgt die Bewerbung?","opts":["Bis Ende Mai","Bis Mitte Juli","Bis Ende August"],"a":"Bis Ende Mai","why":"مهلت تا آخر مه است.","trap":""},{"kind":"choice","q":"Was wird zur Auswahl gesagt?","opts":["Ein Gespräch kann folgen","Die Förderung wird sofort bewilligt","Die Entscheidung fällt ohne Unterlagen"],"a":"Ein Gespräch kann folgen","why":"مصاحبه ممکن است بعد از بررسی مدارک باشد.","trap":""}],"min":7,"guide":"Die wichtigsten Antworten stehen nicht immer im ersten Satz.","audio":"Jana: Guten Tag. Ich möchte mich über das neue Stipendienprogramm informieren.\nBerater: Gerne. Neben dem Formular benötigen Sie ein Motivationsschreiben. Berufserfahrung ist keine Pflicht.\nJana: Und wie sieht es mit einem Nebenjob aus?\nBerater: Den müssen Sie angeben, aber er schließt eine Förderung nicht grundsätzlich aus.\nJana: Ist die Frist wirklich erst im Juli?\nBerater: Nein, die Bewerbung muss bis Ende Mai eingehen. Danach prüfen wir die Unterlagen. Falls Sie in die engere Auswahl kommen, kann ein Gespräch folgen.\nJana: Vielen Dank, das hilft mir."},{"name":"Laut- und Schriftbild abgleichen","typ":"errors","source":"Hören Sie die gesprochene Version. Der folgende schriftliche Text enthält **vier Wörter**, die nicht mit dem Gesprochenen übereinstimmen. Wählen Sie genau vier.","qs":[{"kind":"pick","q":"Markieren Sie die vier abweichenden Wörter.","opts":["„Die","Arbeitsgruppe","hat","gestern","eine","kurze","Umfrage","unter","Lehrenden","durchgeführt.","Die","Ergebnisse","werden","im","Januar","veröffentlicht.","Eine","ausführliche","Diskussion","folgt","danach.“"],"a":[3,5,8,14],"why":"در صوت عبارت‌های heute (به‌جای gestern)، umfangreiche (به‌جای kurze)، Studierenden (به‌جای Lehrenden) و Februar (به‌جای Januar) شنیده می‌شود."}],"min":5,"guide":"Vier falsche Wörter auswählen. Der gesprochene Text unterscheidet sich an vier Stellen.","audio":"Die Arbeitsgruppe hat heute eine umfangreiche Umfrage unter Studierenden durchgeführt. Die Ergebnisse werden im Februar veröffentlicht. Eine ausführliche Diskussion folgt danach."}],"writing":[{"name":"Argumentativen Text schreiben","title":"Soll ein verpflichtender Kurs zur Datenkompetenz eingeführt werden?","prompt":"Ihre Universität diskutiert, ob alle Studierenden im ersten Studienjahr einen Pflichtkurs zum kritischen Umgang mit Daten besuchen sollen. Schreiben Sie einen argumentativen Text für ein Hochschulforum (mindestens 200 Wörter). Stellen Sie Vor- und Nachteile dar und nehmen Sie begründet Stellung. Gehen Sie auf unterschiedliche Studienfächer und auf die begrenzte Zeit im Studienplan ein.","source":"","model":"Die Fähigkeit, Daten kritisch zu lesen, wird in vielen Studiengängen immer wichtiger. Deshalb halte ich einen Einführungskurs zur Datenkompetenz grundsätzlich für sinnvoll. Eine verpflichtende Teilnahme sollte allerdings an bestimmte Bedingungen geknüpft werden.\n\nEin wesentlicher Vorteil besteht darin, dass Studierende früh lernen könnten, statistische Aussagen von unbegründeten Behauptungen zu unterscheiden. Diese Fähigkeit ist nicht nur in naturwissenschaftlichen Fächern relevant. Auch in den Geistes- und Sozialwissenschaften müssen beispielsweise Umfragen, Diagramme oder Forschungsergebnisse interpretiert werden. Ein gemeinsamer Kurs könnte daher eine Grundlage schaffen, auf der spätere Lehrveranstaltungen aufbauen.\n\nAndererseits sind die Studienpläne vieler Fächer bereits stark ausgelastet. Ein zusätzlicher Pflichtkurs würde den zeitlichen Druck erhöhen, vor allem wenn er viele wöchentliche Präsenzstunden erfordert. Hinzu kommt, dass Studierende unterschiedliche Vorkenntnisse mitbringen. Während einige noch grundlegende Begriffe benötigen, arbeiten andere längst mit komplexen Datensätzen.\n\nAus diesen Gründen würde ich einen kurzen Pflichtbaustein mit Wahlmöglichkeiten empfehlen. Alle Studierenden sollten gemeinsame Grundlagen erwerben, anschließend aber Übungen wählen können, die zum jeweiligen Studienfach passen. Digitale Selbstlernmodule könnten die Präsenzzeit begrenzen. Wichtig wäre außerdem, den Erfolg des Angebots nach dem ersten Jahr zu überprüfen.\n\nInsgesamt überwiegen für mich die Vorteile eines solchen Kurses. Entscheidend ist jedoch, dass er fachübergreifend nützlich bleibt und nicht zu einer zusätzlichen Belastung ohne erkennbaren Mehrwert wird. Eine regelmäßige Rückmeldung der Studierenden wäre dabei hilfreich, um Inhalte und Arbeitsaufwand besser an den tatsächlichen Bedarf anzupassen.","translation":"نمونهٔ پاسخ موضع حمایتی مشروط دارد: مزایا، محدودیت برنامهٔ درسی و تفاوت رشته‌ها را پوشش می‌دهد و راهکار ارائه می‌کند.","analysis":"ساختار: طرح مسئله → مزایا → معایب → راه‌حل مشروط → نتیجه. از تعمیم «همهٔ رشته‌ها یک نیاز دارند» پرهیز شده.","words":200,"min":30},{"name":"Informationen zusammenfassen","title":"Studierendennahe Lernberatung: Text und Grafik","prompt":"Fassen Sie die wichtigsten Informationen aus Text und Tabelle in einem sachlichen Text von etwa 100–150 Wörtern zusammen. Vergleichen Sie die Entwicklung beider Beratungsformen. Fügen Sie keine eigene Meinung hinzu.","source":"Text: Eine Universität erprobte im Studienjahr 2025 zwei Formate der Lernberatung. Die Online-Beratung wird überwiegend für kurze organisatorische Fragen genutzt. Persönliche Gespräche dienen häufiger der langfristigen Lernplanung. Die Projektleitung warnt davor, aus steigenden Buchungszahlen unmittelbar auf bessere Studienleistungen zu schließen. Dafür fehlen Vergleichsdaten zu den Prüfungsergebnissen. Die Befragung fand nur an zwei Fakultäten statt.\n\nTabelle: Gebuchte Beratungstermine 2024 / 2025: Online 120 / 210; Präsenz 180 / 165.","model":"Im Studienjahr 2025 erprobte eine Universität zwei Formen der Lernberatung. Laut dem begleitenden Text wird die Online-Beratung vor allem für kurze organisatorische Anliegen genutzt, während persönliche Gespräche häufiger der längerfristigen Lernplanung dienen.\n\nDie Tabelle zeigt unterschiedliche Entwicklungen: Die Zahl der Online-Termine stieg von 120 im Jahr 2024 auf 210 im Jahr 2025. Dagegen ging die Zahl der Präsenztermine im selben Zeitraum leicht von 180 auf 165 zurück. Damit wurden 2025 erstmals mehr Online- als Präsenztermine gebucht.\n\nDie Projektleitung betont jedoch, dass aus den Buchungszahlen kein unmittelbarer Zusammenhang mit besseren Studienleistungen abgeleitet werden kann. Zudem beschränkt sich die Befragung auf zwei Fakultäten. Die Ergebnisse erlauben daher keine pauschalen Aussagen über die gesamte Universität.","translation":"نمونهٔ متن داده‌ها را درست نقل می‌کند؛ روندها را مقایسه می‌کند و محدودیت استنباط دربارهٔ موفقیت تحصیلی را حفظ می‌کند.","analysis":"دام: افزایش تعداد رزرو را نباید با اثبات افزایش عملکرد تحصیلی یکی دانست. دو دانشکده ≠ کل دانشگاه.","words":100,"min":30}],"speaking":[{"name":"Rat geben","typ":"advice","source":"Ihr Kommilitone Deniz sagt: „Ich verstehe die wissenschaftlichen Texte im Seminar, aber ich brauche dafür sehr viel Zeit. Was soll ich tun?“","question":"Geben Sie Deniz einen konkreten Rat und begründen Sie ihn.","model":"An deiner Stelle würde ich zuerst versuchen, die Texte in zwei Schritten zu lesen. Beim ersten Lesen könntest du nur das Thema, die zentrale Frage und die wichtigsten Ergebnisse markieren. Erst danach würde ich schwierige Abschnitte genauer untersuchen. Außerdem kann es helfen, Fachbegriffe in einer kleinen Liste zu sammeln und mit Beispielsätzen zu lernen. Wenn du trotzdem regelmäßig zu viel Zeit brauchst, würde ich mit der Seminarleitung über geeignete Lesestrategien sprechen. So könntest du gezielter üben, statt jeden Satz sofort vollständig übersetzen zu wollen.","coach":"نقش گفت‌وگوی دوستانه است؛ دو راهکار مشخص بده و توضیح بده چرا کمک می‌کند. پاسخ طولانی و بسیار رسمی لزومی ندارد.","phases":[{"name":"Vorbereitung","sec":30,"show":false},{"name":"Sprechen","sec":45,"record":true}],"voice":""},{"name":"Optionen abwägen","typ":"weigh","source":"Ihr Freund Jonas kann in der nächsten Woche entweder an einem intensiven Statistik-Workshop teilnehmen oder in einer Lerngruppe alte Prüfungsaufgaben bearbeiten. Für beide Aktivitäten reicht seine Zeit nicht.","question":"Wägen Sie die beiden Optionen ab. Empfehlen Sie eine und begründen Sie Ihre Empfehlung.","model":"Beide Möglichkeiten haben Vorteile. In einem Statistik-Workshop könnte Jonas systematisch offene Fragen klären und direkt Rückmeldungen von einer Fachperson erhalten. Das wäre besonders sinnvoll, wenn ihm grundlegende Konzepte noch unklar sind. Allerdings könnte der Workshop Themen behandeln, die in seiner konkreten Prüfung kaum vorkommen. In der Lerngruppe könnte er dagegen alte Prüfungsaufgaben bearbeiten und lernen, unter Zeitdruck vorzugehen. Der Nachteil besteht darin, dass die Gruppe möglicherweise Fehler nicht zuverlässig erkennt. Ich würde zunächst prüfen, wo seine größten Schwierigkeiten liegen. Wenn ihm die Grundlagen fehlen, würde ich den Workshop empfehlen. Wenn er die Inhalte bereits versteht, aber beim Lösen der Aufgaben zu langsam ist, erscheint mir die Lerngruppe nützlicher. Unter diesen Bedingungen würde ich mich eher für die Lerngruppe entscheiden.","coach":"معیار تصمیم را به وضعیت فرد وابسته کن و هر دو گزینه را واقعاً مقایسه کن. توصیهٔ نهایی باید روشن باشد.","phases":[{"name":"Vorbereitung","sec":45,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":""},{"name":"Text zusammenfassen","typ":"summary","source":"**Text: Motivation bei Lernprojekten**\nIn einer Untersuchung zur Gruppenarbeit wurden 140 Studierende befragt. Viele berichteten, dass klar verteilte Aufgaben den Arbeitsprozess erleichtern. Gleichzeitig zeigte sich, dass eine starre Aufgabenverteilung problematisch sein kann, wenn sich während des Projekts neue Schwierigkeiten ergeben. Die Forschungsgruppe empfiehlt daher, die Verantwortlichkeiten am Anfang festzulegen und sie in regelmäßigen Treffen zu überprüfen. Die Ergebnisse erlauben jedoch keine sicheren Aussagen über alle Studiengänge, da hauptsächlich technische Fächer vertreten waren. Außerdem wurden die Angaben der Studierenden nicht mit den tatsächlich erzielten Projektnoten verglichen.","question":"Fassen Sie den Text für Ihre Arbeitsgruppe sachlich zusammen. Nennen Sie Ergebnisse und Einschränkungen.","model":"Der Text behandelt die Frage, welche Rolle eine klare Aufgabenverteilung bei studentischen Gruppenprojekten spielt. Grundlage ist eine Befragung von 140 Studierenden. Viele Teilnehmende fanden es hilfreich, wenn Verantwortlichkeiten von Anfang an festgelegt waren, weil sich Arbeitsabläufe dadurch leichter organisieren ließen. Gleichzeitig kann eine zu starre Verteilung problematisch werden, wenn sich Anforderungen während eines Projekts verändern. Die Forschungsgruppe empfiehlt deshalb, Aufgaben zunächst zu verteilen, diese Zuständigkeiten aber in regelmäßigen Besprechungen erneut zu prüfen. Wichtig ist auch die methodische Einschränkung: An der Befragung nahmen überwiegend Studierende technischer Fächer teil. Die Ergebnisse lassen sich daher nicht ohne Weiteres auf alle Studiengänge übertragen. Außerdem wurde nicht geprüft, ob die Einschätzungen der Befragten mit den tatsächlichen Projektnoten zusammenhängen. Insgesamt beschreibt die Untersuchung also mögliche organisatorische Vorteile, aber keinen nachgewiesenen Einfluss auf den Studienerfolg.","coach":"فقط وفادار به منبع خلاصه کن؛ نتیجهٔ «بهبود نمره» از متن قابل‌استنباط نیست. متن در حالت آزمون پس از مدت مطالعه پنهان می‌شود.","phases":[{"name":"Quelle lesen / Grafik prüfen","sec":240,"show":true},{"name":"Sprechen","sec":120,"record":true}],"voice":""},{"name":"Informationen abgleichen, Stellung nehmen","typ":"compare","source":"**Grafik: Anteil Studierender, die die Uni-Bibliothek mindestens dreimal pro Woche besuchen**\n2019: 42 % | 2023: 31 % | 2025: 36 %.\n\nSie hören anschließend einen Seminarbeitrag.","question":"Vergleichen Sie die Aussage des Seminarbeitrags mit den Zahlen und nehmen Sie Stellung.","model":"Der Seminarbeitrag behauptet, die regelmäßigen Bibliotheksbesuche nähmen seit einigen Jahren kontinuierlich ab. Das wird von der Grafik jedoch nur teilweise gestützt. Zwischen 2019 und 2023 sinkt der Anteil von 42 auf 31 Prozent. Im Jahr 2025 steigt er dagegen wieder auf 36 Prozent. Deshalb kann man nicht von einem durchgehenden Rückgang sprechen. Zwar liegt der Wert von 2025 weiterhin unter dem Ausgangsniveau, aber die Entwicklung ist nicht linear. Die Vermutung, digitale Materialien seien der alleinige Grund, lässt sich mit diesen Zahlen ebenfalls nicht belegen. Dafür müsste man zusätzliche Informationen berücksichtigen, etwa die Nutzung digitaler Angebote und Veränderungen der Studienbedingungen. Ich würde deshalb empfehlen, im Seminar die Zeiträume genauer zu unterscheiden und keine eindeutige Ursache zu behaupten.","coach":"دام اصلی «کاهش پیوسته» است؛ ۴۲←۳۱←۳۶ کاهش یکنواخت نیست. همچنین نمودار دربارهٔ علت چیزی نمی‌گوید.","phases":[{"name":"Quelle lesen / Grafik prüfen","sec":30,"show":true},{"name":"Beitrag hören","sec":20,"speak":true},{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":"Ich denke, dass immer weniger Studierende die Bibliothek regelmäßig besuchen. Seit zweitausendneunzehn ist der Anteil meiner Meinung nach kontinuierlich gesunken, vermutlich allein wegen digitaler Lernangebote."},{"name":"Thema präsentieren","typ":"presentation","source":"Im Tutorium sollen Sie einen kurzen Vortrag zum Thema „Lernen mit offenen Online-Materialien“ halten. Gehen Sie auf Chancen, Grenzen und eine konkrete Empfehlung für neue Studierende ein.","question":"Präsentieren Sie das Thema klar gegliedert.","model":"Ich möchte heute über offene Online-Lernmaterialien sprechen. Zunächst erläutere ich ihre Vorteile, anschließend gehe ich auf Grenzen ein und abschließend formuliere ich eine Empfehlung. Ein wichtiger Vorteil ist die zeitliche Flexibilität: Studierende können Erklärungen wiederholt ansehen und in ihrem eigenen Tempo lernen. Zusätzlich bieten frei zugängliche Materialien eine Möglichkeit, Grundlagen zu wiederholen, ohne ein weiteres kostenpflichtiges Lehrbuch erwerben zu müssen. Allerdings ist nicht jede Internetquelle wissenschaftlich zuverlässig. Inhalte können veraltet sein oder wichtige Voraussetzungen auslassen. Gerade bei komplexen Fächern reicht es häufig nicht, ein Video anzusehen; Rückfragen und praktische Übungen bleiben wichtig. Deshalb würde ich neuen Studierenden empfehlen, zuerst Materialien zu nutzen, die von Hochschulen oder bekannten Forschungseinrichtungen bereitgestellt werden. Außerdem sollten sie die Inhalte mit Vorlesungsunterlagen abgleichen und offene Fragen in einer Lerngruppe diskutieren. Zusammenfassend sind offene Materialien eine sinnvolle Ergänzung, aber kein vollständiger Ersatz für strukturierte Lehrveranstaltungen. Entscheidend ist, wie kritisch und zielgerichtet man sie verwendet.","coach":"ساختار معرفی، دو فرصت، دو محدودیت، یک توصیه و جمع‌بندی. برای ۲:۳۰ زمان، می‌توان مثال‌های دقیق‌تری افزود؛ فقط تیتر گفتن کافی نیست.","phases":[{"name":"Vorbereitung","sec":120,"show":false},{"name":"Sprechen","sec":150,"record":true}],"voice":""},{"name":"Argumente wiedergeben, Stellung nehmen","typ":"argument","source":"In einer Diskussionsveranstaltung hören Sie den Beitrag eines Studenten zum Thema „Pflichtpraktikum im ersten Studienjahr“.","question":"Geben Sie die zentralen Argumente wieder und nehmen Sie begründet Stellung.","model":"Der Student spricht sich für ein verpflichtendes Praktikum bereits im ersten Studienjahr aus. Er argumentiert, dass Studierende dadurch früh einen Einblick in mögliche Berufsfelder bekommen. Außerdem könnten sie rechtzeitig feststellen, ob ihre Erwartungen zum Studiengang passen. Diesen Vorteilen stimme ich grundsätzlich zu. Allerdings sehe ich Probleme bei einer allgemeinen Verpflichtung. Erstsemester müssen sich zunächst mit den Grundlagen des Studiums vertraut machen, und nicht in jedem Fach stehen ausreichend geeignete Praktikumsplätze zur Verfügung. Darüber hinaus könnten Studierende mit Betreuungspflichten oder einer Nebentätigkeit organisatorisch benachteiligt werden. Deshalb würde ich eher ein begleitetes Orientierungsangebot empfehlen, das verschiedene Formen zulässt: kurze Hospitationen, Projektbesuche oder Gespräche mit Berufstätigen. Ein längeres Pflichtpraktikum wäre meiner Meinung nach erst in einer späteren Studienphase sinnvoll. So ließen sich Berufsorientierung und Studienorganisation besser miteinander vereinbaren.","coach":"دو استدلال گوینده را دقیق بازگو کن و سپس موضع مستقل ارائه بده. نقل نظر شخصی را با نظر گوینده قاطی نکن.","phases":[{"name":"Beitrag hören","sec":45,"speak":true},{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":120,"record":true}],"voice":"Ich finde, dass alle Studierenden gleich im ersten Studienjahr ein Pflichtpraktikum machen sollten. So könnten sie einen frühen Einblick in verschiedene Berufsfelder erhalten. Außerdem würden sie schneller merken, ob ihre Erwartungen zum Studiengang passen. Deshalb wäre eine Verpflichtung aus meiner Sicht sinnvoll."},{"name":"Maßnahmen kritisieren","typ":"critique","source":"Die Universität plant, die Öffnungszeiten aller Lernräume um zwei Stunden zu verkürzen. Gleichzeitig sollen zusätzliche digitale Reservierungssysteme eingeführt werden. Bei einer Informationsveranstaltung können Sie Kritik und Alternativen äußern.","question":"Kritisieren Sie die Maßnahmen konstruktiv und schlagen Sie Alternativen vor.","model":"Ich verstehe, dass die Hochschule ihre Ressourcen effizient einsetzen möchte. Die geplante Verkürzung der Öffnungszeiten halte ich jedoch für problematisch. Gerade berufstätige Studierende sind häufig darauf angewiesen, abends einen ruhigen Lernraum zu finden. Eine digitale Reservierung kann zwar die Platzvergabe verbessern, sie ersetzt aber keine tatsächlich verfügbaren Lernzeiten. Ich würde deshalb zunächst prüfen, zu welchen Uhrzeiten die Räume besonders stark genutzt werden. Vielleicht ließen sich einzelne Bereiche abends offen halten, während schwach genutzte Räume früher schließen. Zusätzlich sollte die Hochschule Studierende zu ihrem Bedarf befragen. So könnte man Kosten sparen, ohne bestimmte Gruppen unnötig zu benachteiligen.","coach":"نقد مؤدبانه با اشاره به گروه متأثر؛ پیشنهاد جایگزین باید مشخص و قابل‌اجرا باشد.","phases":[{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":""}]},"B":{"name":"B","reading":[{"name":"Lückentext ergänzen","typ":"fill","source":"Eine interdisziplinäre Arbeitsgruppe entwickelte ein Verfahren, um den Energieverbrauch universitärer Labore transparenter zu machen. Zunächst mussten die Forschenden (1) ____, welche Geräte besonders viel Strom benötigen. Dabei wurde (2) ____, dass nicht nur große Messanlagen, sondern auch ungenutzte Kühlgeräte erhebliche Kosten verursachen. Die Ergebnisse sind allerdings nur bedingt auf andere Standorte (3) ____, weil die technische Ausstattung stark variiert. Dennoch könnte ein gemeinsames Monitoring dazu (4) ____, unnötige Laufzeiten zu verringern. Entscheidend ist, dass Sicherheitsvorgaben dabei stets (5) ____ werden.","qs":[{"kind":"choice","q":"Lücke 1","opts":["ermitteln","vermeiden","ersetzen"],"a":"ermitteln","why":"ermitteln = تعیین یا شناسایی‌کردن مصرف دستگاه‌ها.","trap":""},{"kind":"choice","q":"Lücke 2","opts":["festgestellt","zugesagt","verhindert"],"a":"festgestellt","why":"es wurde festgestellt, dass = مشخص شد که.","trap":""},{"kind":"choice","q":"Lücke 3","opts":["übertragbar","verfügbar","vermeidbar"],"a":"übertragbar","why":"auf andere Standorte übertragbar = قابل تعمیم/انتقال به سایت‌های دیگر.","trap":""},{"kind":"choice","q":"Lücke 4","opts":["beitragen","gehören","widersprechen"],"a":"beitragen","why":"dazu beitragen, ... zu = به تحقق چیزی کمک‌کردن.","trap":""},{"kind":"choice","q":"Lücke 5","opts":["berücksichtigt","vergessen","vermehrt"],"a":"berücksichtigt","why":"Sicherheitsvorgaben berücksichtigen = لحاظ کردن الزامات ایمنی.","trap":""}],"min":6,"guide":"Ergänzen Sie die fachsprachlich passende Form."},{"name":"Textabschnitte ordnen","typ":"order","source":"**Einleitung:** Eine Forschungsgruppe möchte herausfinden, weshalb bestimmte digitale Archive von Studierenden selten genutzt werden.\n\n[A] Die Interviews zeigten, dass viele Studierende nicht wussten, welche Materialien frei zugänglich waren. Technische Probleme wurden seltener erwähnt.\n\n[B] Aus diesem Befund leitete die Gruppe zwei Maßnahmen ab: eine verständlichere Suchoberfläche und Einführungen in der Bibliothek.\n\n[C] Als Erstes wurde die Nutzung der Archive anhand anonymisierter Zugriffszahlen untersucht; anschließend entwickelte die Gruppe einen Interviewleitfaden.\n\n[D] Danach wurden Studierende unterschiedlicher Semester eingeladen, ihre Suchwege zu beschreiben und konkrete Schwierigkeiten zu benennen.","qs":[{"kind":"choice","q":"Position von Abschnitt A","opts":["1","2","3","4"],"a":"3","why":"بعد از مصاحبه‌ها نتایج توضیح داده می‌شود.","trap":""},{"kind":"choice","q":"Position von Abschnitt B","opts":["1","2","3","4"],"a":"4","why":"از یافته‌ها اقدام اجرایی نتیجه می‌شود.","trap":""},{"kind":"choice","q":"Position von Abschnitt C","opts":["1","2","3","4"],"a":"1","why":"Als Erstes صریحاً آغاز روش را تعیین می‌کند.","trap":""},{"kind":"choice","q":"Position von Abschnitt D","opts":["1","2","3","4"],"a":"2","why":"Danach روند دعوت و مصاحبه را شرح می‌دهد.","trap":""}],"min":6,"guide":"Achten Sie auf zeitliche Konnektoren und argumentative Bezüge."},{"name":"Multiple-Choice: Citizen Science","typ":"mc","source":"An einem Forschungsprojekt zur Luftqualität beteiligen sich Bürgerinnen und Bürger, indem sie kleine Sensoren an ihren Wohnorten aufstellen. Solche Vorhaben werden häufig als „Citizen Science“ bezeichnet. Ihre Stärke liegt unter anderem darin, dass viele Messpunkte entstehen, die ein professionelles Messnetz nicht ohne Weiteres abdecken könnte. Allerdings unterscheiden sich die Sensoren in ihrer Qualität. Zudem können direkte Sonneneinstrahlung oder ein Standort in Fensternähe die Werte beeinflussen.\n\nDie Projektleitung führte deshalb zwei Maßnahmen ein: regelmäßige Vergleichsmessungen mit Referenzgeräten und kurze Schulungen für Freiwillige. Nach sechs Monaten waren die Daten konsistenter. Das Team betont dennoch, dass die preiswerten Geräte amtliche Messstationen nicht ersetzen. Sie können vielmehr Hinweise darauf liefern, an welchen Orten eine genauere Untersuchung sinnvoll wäre.\n\nEine weitere Frage betrifft die Beteiligung. Personen mit einem ausgeprägten Interesse an Umweltfragen melden sich überdurchschnittlich häufig freiwillig. Die Ergebnisse einer Befragung unter Teilnehmenden lassen sich daher nicht automatisch auf die gesamte Stadtbevölkerung übertragen. Gleichzeitig berichten viele Beteiligte, durch die Messungen besser verstanden zu haben, wie wissenschaftliche Daten entstehen. Die Verantwortlichen halten es deshalb für wichtig, nicht nur die Sensorwerte zu veröffentlichen, sondern auch Unsicherheiten und Messgrenzen verständlich zu erklären.","qs":[{"kind":"choice","q":"Welcher Vorteil wird Citizen Science zugeschrieben?","opts":["Viele zusätzliche Messorte","Vollständige Abschaffung professioneller Messnetze","Garantiert fehlerfreie Messwerte"],"a":"Viele zusätzliche Messorte","why":"گسترش گسترهٔ اندازه‌گیری مزیت اصلی است.","trap":"اغراق"},{"kind":"choice","q":"Was kann die Werte beeinflussen?","opts":["Der konkrete Standort des Sensors","Ausschließlich die Jahreszeit","Nur die Anzahl der Freiwilligen"],"a":"Der konkrete Standort des Sensors","why":"محل قرارگیری و نور مستقیم بر داده‌ها اثر دارند.","trap":"حذف شرط"},{"kind":"choice","q":"Warum gibt es Vergleichsmessungen?","opts":["Um Datenqualität zu prüfen","Um alle Freiwilligen zu ersetzen","Um den Sensorverkauf zu steigern"],"a":"Um Datenqualität zu prüfen","why":"هدف کنترل کیفیت داده‌ها است.","trap":"هدف"},{"kind":"choice","q":"Welche Rolle haben preiswerte Geräte?","opts":["Hinweise für genauere Untersuchungen liefern","Amtliche Stationen vollständig ersetzen","Jede Unsicherheit ausschließen"],"a":"Hinweise für genauere Untersuchungen liefern","why":"از ابزار ارزان به‌عنوان راهنما نه جایگزین کامل استفاده می‌شود.","trap":"جابه‌جایی نقش"},{"kind":"choice","q":"Welches Problem betrifft die Befragung?","opts":["Teilnehmende sind möglicherweise nicht repräsentativ","Es wurden grundsätzlich keine Menschen befragt","Alle Einwohner müssen teilnehmen"],"a":"Teilnehmende sind möglicherweise nicht repräsentativ","why":"داوطلبان علاقه‌مند بیش‌ازحد نمایندگی دارند.","trap":"تعمیم"},{"kind":"choice","q":"Was berichten viele Teilnehmende?","opts":["Ein besseres Verständnis wissenschaftlicher Daten","Ein Ende aller Luftverschmutzung","Einen staatlichen Messauftrag"],"a":"Ein besseres Verständnis wissenschaftlicher Daten","why":"متن به تجربهٔ یادگیری افراد اشاره می‌کند.","trap":"برداشت بی‌ربط"},{"kind":"choice","q":"Was empfiehlt die Projektleitung für die Veröffentlichung?","opts":["Unsicherheiten mit erklären","Nur Zahlen ohne Kontext veröffentlichen","Alle problematischen Werte löschen"],"a":"Unsicherheiten mit erklären","why":"شفاف‌کردن محدودیت‌ها و عدم قطعیت.","trap":"قید فقط"}],"min":12,"guide":"Wählen Sie jeweils die genau gestützte Aussage."},{"name":"Sprachhandlungen zuordnen","typ":"speechact","source":"**Aussagen aus einem Kommentar zur Bibliotheksnutzung:**\n1. „Dass digitale Medien gedruckte Bücher vollständig ersetzen, halte ich für eine unbegründete Annahme.“\n2. „Die Angaben der Befragung beziehen sich ausschließlich auf Studierende des ersten Semesters.“\n3. „Wir schlagen vor, die Öffnungszeiten während der Prüfungsphase auszuweiten.“\n4. „Mit ‚Informationskompetenz‘ ist die Fähigkeit gemeint, Quellen kritisch zu finden und zu bewerten.“","qs":[{"kind":"choice","q":"Aussage 1","opts":["Widersprechen","Zusammenfassen","Definieren"],"a":"Widersprechen","why":"ادعایی را صریحاً رد می‌کند.","trap":""},{"kind":"choice","q":"Aussage 2","opts":["Einschränken","Fordern","Vergleichen"],"a":"Einschränken","why":"محدودسازی جامعهٔ موردبررسی با ausschließlich.","trap":""},{"kind":"choice","q":"Aussage 3","opts":["Vorschlagen","Kritisieren","Beweisen"],"a":"Vorschlagen","why":"schlagen vor پیشنهاد است.","trap":""},{"kind":"choice","q":"Aussage 4","opts":["Definieren","Warnen","Widerlegen"],"a":"Definieren","why":"Mit ... ist ... gemeint تعریف می‌کند.","trap":""}],"min":7,"guide":"Ordnen Sie die sprachlichen Handlungen zu."},{"name":"Aussagen Kategorien zuordnen","typ":"categorize","source":"**Bericht über digitale Lernkarten**\n\n**A: Daten:** In einer freiwilligen Umfrage von 420 Studierenden verwendeten 58 Prozent regelmäßig digitale Lernkarten. Besonders häufig wurden sie vor Klausuren genutzt. Studierende aus höheren Semestern gaben seltener an, täglich zu üben.\n\n**B: Grenzen:** Die Befragung erfasste nur die Selbstauskunft. Ob tatsächliche Lernergebnisse besser ausfielen, wurde nicht geprüft. Außerdem nahmen hauptsächlich Studierende eines Studienbereichs teil.\n\n**C: Vorschläge:** Künftig sollten Lerndaten und Prüfungsergebnisse getrennt und datenschutzkonform analysiert werden. Ergänzend wäre eine fachübergreifende Studie sinnvoll.","qs":[{"kind":"choice","q":"58 Prozent nutzten digitale Lernkarten regelmäßig.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"A: Daten","why":"یافتهٔ نظرسنجی.","trap":""},{"kind":"choice","q":"Die Angaben beruhen auf Selbstauskünften.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"B: Grenzen","why":"ضعف روش سنجش.","trap":""},{"kind":"choice","q":"Eine fachübergreifende Studie wird angeregt.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"C: Vorschläge","why":"پیشنهاد برای آینده.","trap":""},{"kind":"choice","q":"Eine Verbesserung der Noten wurde nicht gemessen.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"B: Grenzen","why":"هیچ آزمون علّی/عملکردی انجام نشده.","trap":""},{"kind":"choice","q":"Vor Prüfungen nutzten viele Lernkarten häufiger.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"A: Daten","why":"الگوی کاربرد گزارش‌شده.","trap":""},{"kind":"choice","q":"Zukünftig sollen Lerndaten datenschutzkonform ausgewertet werden.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"C: Vorschläge","why":"برنامهٔ پژوهشی آینده.","trap":""},{"kind":"choice","q":"Ein Fachbereich war überrepräsentiert.","opts":["A: Daten","B: Grenzen","C: Vorschläge"],"a":"B: Grenzen","why":"محدودیت نمایندگی نمونه.","trap":""}],"min":10,"guide":"Beachten Sie die Trennung zwischen Befund, Einschränkung und Empfehlung."},{"name":"Aussagen Begriffspaar zuordnen","typ":"pairs","source":"**Effizienz und Resilienz:** In der Hochschulverwaltung wird zwischen **Effizienz** und **Resilienz** unterschieden. Effizienz beschreibt das Ziel, mit möglichst geringem Zeit- und Ressourceneinsatz ein Ergebnis zu erreichen. Resilienz bezeichnet dagegen die Fähigkeit, auch bei Ausfällen oder außergewöhnlichen Belastungen funktionsfähig zu bleiben. Eine sehr schlanke Organisation kann effizient sein, aber bei Störungen anfällig werden. Zusätzliche Reservekapazitäten können Kosten erhöhen und zugleich die Resilienz stärken.","qs":[{"kind":"choice","q":"Mit weniger Personalstunden dieselbe Zahl von Anträgen bearbeiten","opts":["Effizienz","Resilienz"],"a":"Effizienz","why":"منابع کمتر برای خروجی مشابه.","trap":""},{"kind":"choice","q":"Bei einem Serverausfall weiterhin erreichbar bleiben","opts":["Effizienz","Resilienz"],"a":"Resilienz","why":"تاب‌آوری در برابر اختلال.","trap":""},{"kind":"choice","q":"Bearbeitungszeit je Antrag reduzieren","opts":["Effizienz","Resilienz"],"a":"Effizienz","why":"سرعت و منابع را بهینه‌کردن.","trap":""},{"kind":"choice","q":"Ersatzsysteme für Notfälle vorhalten","opts":["Effizienz","Resilienz"],"a":"Resilienz","why":"ظرفیت جایگزین برای بحران.","trap":""}],"min":7,"guide":"Ordnen Sie die Aussagen einem Begriff zu."},{"name":"Fehler in Zusammenfassung erkennen","typ":"errors","source":"**Text:** Eine Universität führte testweise Wochenkurse zur wissenschaftlichen Literaturrecherche durch. Insgesamt wurden 240 Plätze angeboten, von denen 192 genutzt wurden. Die Teilnahme war freiwillig. Nach Abschluss des Kurses konnten die Teilnehmenden Quellen zuverlässiger bewerten als zuvor. Das Projektteam weist ausdrücklich darauf hin, dass keine Kontrollgruppe untersucht wurde und daher kein eindeutiger kausaler Effekt belegt ist. Für das kommende Semester ist eine Ausweitung auf drei Fachbereiche geplant.\n\n**Tabelle:** Angebotene Plätze 240 | Belegte Plätze 192 | Pilot-Fachbereiche 1 | Geplant 3.\n\n**Zusammenfassung:**","qs":[{"kind":"pick","q":"Markieren Sie GENAU drei fehlerhafte Aussagen.","opts":["1. Der Kurs behandelte die Suche nach wissenschaftlicher Literatur.","2. Alle 240 angebotenen Plätze waren belegt.","3. Die Teilnahme erfolgte auf freiwilliger Grundlage.","4. Eine Kontrollgruppe bestätigte den eindeutigen Kurseffekt.","5. Nach dem Kurs bewerteten Teilnehmende Quellen zuverlässiger.","6. Bereits im Pilotsemester waren alle drei Fachbereiche beteiligt.","7. Eine Erweiterung ist für das nächste Semester vorgesehen."],"a":[1,3,5],"why":"خطاهای ۲،۴،۶: ۱۹۲ از ۲۴۰ جا پُر شده؛ گروه کنترل وجود نداشت؛ سه حوزه برای ترم آینده برنامه‌ریزی شده است."}],"min":7,"guide":"Wählen Sie genau drei inhaltliche Fehler (3 Items)."}],"listening":[{"name":"Kurzantwort: Übersicht ergänzen","typ":"short","source":"Informationsveranstaltung zur neuen Campus-Mensa: Tragen Sie die fünf Angaben ein.","qs":[{"kind":"short","q":"1. Wann öffnet die neue Mensa?","a":["am 4. November","4. november","vierter november"],"why":"افتتاح چهارم نوامبر."},{"kind":"short","q":"2. Wie viele vegetarische Hauptgerichte sind täglich geplant?","a":["zwei","2"],"why":"دو غذای اصلی گیاهی."},{"kind":"short","q":"3. Wie kann bezahlt werden?","a":["mit campuskarte","campuskarte"],"why":"پرداخت با کارت دانشگاه."},{"kind":"short","q":"4. Was muss online reserviert werden?","a":["gruppenplätze","gruppenplatz","tische für gruppen"],"why":"جای گروهی نیاز به رزرو آنلاین دارد."},{"kind":"short","q":"5. Wer sammelt Rückmeldungen?","a":["der studierendenrat","studierendenrat","stura"],"why":"شورای دانشجویی بازخورد جمع می‌کند."}],"min":5,"guide":"Fünf Kurzantworten; Transkript erst nach der Abgabe.","audio":"Unsere neue Campus-Mensa eröffnet am vierten November. Täglich bieten wir zwei vegetarische Hauptgerichte an. Die Bezahlung erfolgt ausschließlich mit der Campuskarte. Wer mit einer größeren Lerngruppe kommen möchte, muss die Gruppenplätze vorher online reservieren. Nach den ersten Wochen sammelt der Studierendenrat Rückmeldungen zur Organisation und zum Angebot."},{"name":"Kurzantwort: Begriffspaar","typ":"short","source":"In einer Diskussion werden **Chancen** und **Risiken** digitaler Labortagebücher genannt. Notieren Sie je zwei Aspekte.","qs":[{"kind":"short","q":"1. Chance: Was wird leichter gefunden?","a":["frühere versuchsdaten","versuchsdaten","daten"],"why":"پیداکردن داده‌های قدیمی."},{"kind":"short","q":"2. Chance: Was wird bei Gruppenarbeit erleichtert?","a":["zusammenarbeit","abstimmung","austausch"],"why":"هماهنگی اعضای گروه."},{"kind":"short","q":"3. Risiko: Was passiert bei unzureichender Sicherung?","a":["datenverlust","verlust von daten"],"why":"خطر ازدست‌رفتن داده‌ها."},{"kind":"short","q":"4. Risiko: Welcher rechtliche Bereich ist betroffen?","a":["datenschutz","schutz personenbezogener daten"],"why":"حفاظت داده‌ها."}],"min":5,"guide":"Achten Sie auf die Zuordnung Chance versus Risiko.","audio":"Moderator: Welche Chancen haben digitale Labortagebücher?\nDoktorandin: Frühere Versuchsdaten lassen sich viel schneller wiederfinden. Außerdem können Gruppen ihre Arbeit leichter miteinander abstimmen.\nModerator: Und welche Risiken sehen Sie?\nDoktorandin: Ohne regelmäßige Sicherung droht Datenverlust. Zudem müssen Datenschutzvorgaben beachtet werden, wenn personenbezogene Angaben enthalten sind."},{"name":"Fehler in Zusammenfassung erkennen","typ":"errors","source":"Hören Sie die Ansage vollständig. Danach erscheinen sechs Sätze; zwei davon sind falsch.","qs":[{"kind":"pick","q":"Wählen Sie genau zwei inhaltlich falsche Sätze.","opts":["1. Die Bibliothek führt einen neuen Abholservice ein.","2. Bestellte Bücher können schon nach einer Stunde abgeholt werden.","3. Die Benachrichtigung erfolgt per E-Mail.","4. Der Dienst kostet zwei Euro pro Bestellung.","5. Der Service gilt zunächst nur für einen Standort.","6. Die reguläre Ausleihe bleibt bestehen."],"a":[1,3],"why":"تغییرها: تحویل پس از یک روز کاری است، نه یک ساعت؛ خدمت رایگان است، نه دو یورو."}],"min":5,"guide":"Die Zusammenfassung bleibt bis nach dem Anhören verdeckt.","audio":"Ab nächster Woche bietet unsere Bibliothek einen neuen Abholservice an. Bestellte Bücher liegen spätestens nach einem Arbeitstag bereit. Sie werden per E-Mail benachrichtigt. Der Service ist kostenlos und steht zunächst nur am Standort Nord zur Verfügung. Die reguläre Ausleihe bleibt unverändert bestehen.","hide_until_audio":true},{"name":"Aussagen Personen zuordnen","typ":"speaker","source":"Diskussion über Tutorien für internationale Studierende. Ordnen Sie die Aussagen den Beteiligten zu.","qs":[{"kind":"choice","q":"1. Moderiert und fragt nach den bisherigen Erfahrungen.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Moderator","why":"آغاز و هدایت بحث.","trap":""},{"kind":"choice","q":"2. Möchte kleinere Lerngruppen.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Tutorin Lea","why":"لئا پیشنهاد گروه کوچک‌تر دارد.","trap":""},{"kind":"choice","q":"3. Berichtet von unklaren Fachbegriffen.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Studentin Farah","why":"فراح از اصطلاحات علمی شکایت می‌کند.","trap":""},{"kind":"choice","q":"4. Fragt nach möglichen Mehrkosten.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Moderator","why":"سؤال افزایش هزینه.","trap":""},{"kind":"choice","q":"5. Schlägt ein Glossar zu jedem Termin vor.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Studentin Farah","why":"فراح پیشنهاد واژه‌نامه دارد.","trap":""},{"kind":"choice","q":"6. Warnt davor, Betreuung nur online anzubieten.","opts":["Moderator","Tutorin Lea","Studentin Farah"],"a":"Tutorin Lea","why":"لئا می‌خواهد ارتباط حضوری بماند.","trap":""}],"min":7,"guide":"Im Original Videodiskussion; hier eine mehrstimmig markierte Geräte-Stimmen-Übung.","audio":"Moderator: Welche Erfahrungen haben Sie bisher mit den Tutorien gemacht?\nTutorin Lea: Die Treffen helfen vielen. Ich würde aber kleinere Lerngruppen empfehlen. Und bitte nicht alles nur online anbieten. Der persönliche Kontakt bleibt wichtig.\nStudentin Farah: Mich irritieren oft unklare Fachbegriffe. Ein kurzes Glossar zu jedem Termin wäre hilfreich.\nModerator: Würden kleinere Gruppen nicht mehr kosten?\nTutorin Lea: Möglicherweise, aber wir könnten die Termine besser aufteilen.\nStudentin Farah: Besonders das Glossar wäre ohne großen Aufwand möglich."},{"name":"Kurzantwort: Gliederung Vortrag","typ":"short","source":"Ergänzen Sie die Gliederung eines Vortrags über **Mehrwegbehälter in Hochschulmensen**.","qs":[{"kind":"short","q":"1. Hauptproblem bei Einwegverpackungen?","a":["großes abfallaufkommen","abfall","verpackungsmüll"],"why":"افزایش زبالهٔ بسته‌بندی."},{"kind":"short","q":"2. Voraussetzung für das Pfandsystem?","a":["rückgabestationen","rückgabestation","rückgabeorte"],"why":"ایستگاه‌های بازگشت."},{"kind":"short","q":"3. Was muss regelmäßig kontrolliert werden?","a":["hygiene","reinigung","sauberkeit"],"why":"نظافت و بهداشت."},{"kind":"short","q":"4. Welche Kennzahl soll gemessen werden?","a":["rücklaufquote","quote der rückgaben","rückgaben"],"why":"نرخ بازگشت ظرف‌ها."}],"min":6,"guide":"Vortragsgliederung; im Originalformat Video und Tafel/Handout.","audio":"Einwegverpackungen verursachen in der Hochschulmensa ein großes Abfallaufkommen. Mehrwegbehälter können helfen, diesen Verpackungsmüll zu verringern. Damit ein Pfandsystem funktioniert, sind gut erreichbare Rückgabestationen notwendig. Die Reinigung und Hygiene müssen regelmäßig kontrolliert werden. Besonders wichtig ist die Rücklaufquote, also der Anteil der Behälter, die tatsächlich zurückgegeben werden."},{"name":"Multiple-Choice: Forschungspraktikum","typ":"mc","source":"Hören Sie ein Beratungsgespräch über ein Forschungspraktikum.","qs":[{"kind":"choice","q":"Was interessiert Daniel?","opts":["Ein Forschungspraktikum","Ein Auslandssemester ohne Praktikum","Ein Sprachkurs für Anfänger"],"a":"Ein Forschungspraktikum","why":"موضوع کارآموزی پژوهشی است.","trap":""},{"kind":"choice","q":"Wann beginnt die Bewerbung?","opts":["Anfang Februar","Anfang April","Ende Juni"],"a":"Anfang Februar","why":"شروع فوریه.","trap":""},{"kind":"choice","q":"Welche Unterlage fehlt Daniel noch?","opts":["Ein kurzes Projektkonzept","Ein Reisepass","Ein Zeugnis der Grundschule"],"a":"Ein kurzes Projektkonzept","why":"طرح پروژه ندارد.","trap":""},{"kind":"choice","q":"Was sagt die Beraterin zur Vergütung?","opts":["Sie hängt vom Projekt ab","Sie ist in allen Projekten identisch","Sie ist grundsätzlich ausgeschlossen"],"a":"Sie hängt vom Projekt ab","why":"وابستگی به پروژه، نه ادعای مطلق.","trap":""},{"kind":"choice","q":"Was empfiehlt die Beraterin zuerst?","opts":["Mit der möglichen Betreuung sprechen","Sofort die Reise buchen","Auf eine automatische Zusage warten"],"a":"Mit der möglichen Betreuung sprechen","why":"ابتدا صحبت با استاد راهنما.","trap":""}],"min":7,"guide":"Notieren Sie Fristen und Bedingungen genau.","audio":"Daniel: Ich würde gern im Sommer ein Forschungspraktikum machen.\nBeraterin: Die Bewerbung startet bereits Anfang Februar. Sie brauchen einen Lebenslauf und ein kurzes Projektkonzept.\nDaniel: Den Lebenslauf habe ich, am Projektkonzept muss ich noch arbeiten.\nBeraterin: Die Vergütung hängt vom jeweiligen Projekt ab. Klären Sie deshalb zuerst mit einer möglichen Betreuung, ob dort überhaupt ein Platz verfügbar ist.\nDaniel: Dann vereinbare ich zunächst ein Gespräch. Vielen Dank."},{"name":"Laut- und Schriftbild abgleichen","typ":"errors","source":"Hören Sie den Text. **Vier Wörter** unterscheiden sich vom Gesprochenen. Wählen Sie sie aus.","qs":[{"kind":"pick","q":"Markieren Sie genau vier nicht passende Wörter.","opts":["„Unsere","Universität","erweitert","ab","September","das","digitale","Angebot.","Der","Kurs","richtet","sich","an","Lehrende","und","findet","am","Dienstag","statt.","Anmeldungen","sind","kostenlos.“"],"a":[4,6,13,17],"why":"صوت November به‌جای September، hybride به‌جای digitale، Studierende به‌جای Lehrende و Donnerstag به‌جای Dienstag می‌گوید."}],"min":5,"guide":"Achten Sie auf vier gezielte Wortabweichungen.","audio":"Unsere Universität erweitert ab November das hybride Angebot. Der Kurs richtet sich an Studierende und findet am Donnerstag statt. Anmeldungen sind kostenlos."}],"writing":[{"name":"Argumentativen Text schreiben","title":"Sollten Seminare regelmäßig öffentlich aufgezeichnet werden?","prompt":"In einem Hochschulforum wird diskutiert, ob alle Seminare automatisch aufgezeichnet und für Studierende bereitgestellt werden sollten. Schreiben Sie einen argumentativen Text mit mindestens 200 Wörtern. Berücksichtigen Sie die Zugänglichkeit für Studierende, den Schutz persönlicher Beiträge und organisatorische Alternativen. Nehmen Sie Stellung.","source":"","model":"Die Aufzeichnung von Seminaren kann Studierenden den Zugang zu Lehrinhalten erleichtern. Dennoch halte ich eine automatische Aufzeichnung sämtlicher Veranstaltungen für problematisch. Entscheidend ist, die Vorteile digitaler Materialien mit dem Schutz persönlicher Beiträge zu verbinden.\n\nFür Aufzeichnungen spricht vor allem, dass komplexe Erklärungen mehrfach angesehen werden können. Studierende mit einem Nebenjob, längeren Anfahrtswegen oder kurzfristigen Erkrankungen könnten bestimmte Inhalte leichter nacharbeiten. Auch für die Prüfungsvorbereitung wären kurze Videosequenzen hilfreich.\n\nAllerdings unterscheiden sich Seminare von klassischen Vorlesungen. Oft lebt ein Seminar davon, dass Studierende vorläufige Ideen entwickeln, Fragen stellen und persönliche Erfahrungen diskutieren. Wenn jede Äußerung dauerhaft gespeichert wird, könnten sich einzelne Personen weniger offen beteiligen. Zusätzlich entstehen Fragen zum Datenschutz und zu den Rechten an präsentierten Materialien.\n\nDeshalb bevorzuge ich ein differenziertes Modell. Lehrende könnten vorbereitete Kurzvorträge oder zentrale Erklärungen aufzeichnen. Diskussionen sollten dagegen nur mit ausdrücklicher Zustimmung aller Beteiligten aufgenommen werden. Für Studierende, die nicht teilnehmen konnten, ließen sich alternativ strukturierte Notizen und Literaturhinweise bereitstellen.\n\nEine solche Lösung würde die Zugänglichkeit verbessern, ohne den besonderen Charakter von Seminardiskussionen vollständig zu verändern. Sinnvoll wäre außerdem, vor der Einführung mit Lehrenden und Studierenden über praktische Regeln zu sprechen und die Erfahrungen nach einem Semester auszuwerten. Auf diese Weise ließen sich technische Schwierigkeiten sowie unerwünschte Auswirkungen auf die Beteiligung frühzeitig erkennen. Insgesamt erscheint mir eine freiwillige, klar geregelte Aufzeichnung sinnvoller als eine pauschale Verpflichtung.","translation":"نمونهٔ پاسخ دسترسی آموزشی و حقوق مشارکت‌کنندگان را می‌سنجد؛ راهکار تفکیکی و موضع روشن دارد.","analysis":"دام: «همهٔ سمینارها» با «بعضی ارائه‌ها» فرق دارد؛ در بحث محرمانگی از ادعاهای حقوقی قطعی بدون مبنا پرهیز شده.","words":200,"min":30},{"name":"Informationen zusammenfassen","title":"Energieverbrauch in Studierendenwohnheimen","prompt":"Fassen Sie Text und Tabelle in etwa 100–150 Wörtern zusammen. Stellen Sie die Entwicklungen dar, beachten Sie die Einschränkungen der Untersuchung und vermeiden Sie eigene Bewertungen.","source":"Text: Ein Projekt untersuchte den durchschnittlichen Stromverbrauch in zwei Wohnheimen. In Haus A wurden alte Leuchten ausgetauscht; in Haus B wurde lediglich eine Informationskampagne durchgeführt. Die Autorinnen weisen darauf hin, dass die Bewohnerzahl und die Auslastung im Messzeitraum schwankten. Daher lassen sich Veränderungen nicht ausschließlich auf die jeweiligen Maßnahmen zurückführen.\n\nTabelle: Durchschnittlicher Verbrauch pro Monat (kWh): Haus A vor Projekt 6.200, nach Projekt 5.100; Haus B vor Projekt 5.800, nach Projekt 5.500.","model":"Ein Hochschulprojekt untersuchte den durchschnittlichen monatlichen Stromverbrauch in zwei Studierendenwohnheimen. In Haus A wurden ältere Leuchten ersetzt, während Haus B eine Informationskampagne durchführte.\n\nDen Tabellenangaben zufolge sank der Verbrauch in Haus A von 6.200 auf 5.100 Kilowattstunden pro Monat. Das entspricht einem Rückgang um 1.100 Kilowattstunden. In Haus B ging der durchschnittliche Verbrauch von 5.800 auf 5.500 Kilowattstunden zurück, also um 300 Kilowattstunden.\n\nDamit war der Rückgang in Haus A im untersuchten Zeitraum größer als in Haus B. Die Autorinnen betonen jedoch, dass die Zahl der Bewohnerinnen und Bewohner sowie die Auslastung schwankten. Deshalb kann aus der Untersuchung nicht eindeutig geschlossen werden, dass allein die neuen Leuchten oder die Informationskampagne für die Veränderungen verantwortlich waren.","translation":"نمونهٔ خلاصه هر دو مقدار و روند را صحیح ثبت می‌کند و ادعای علّی نمی‌سازد.","analysis":"دام: همزمانی اقدام و کاهش مصرف به‌تنهایی علت‌ومعلول قطعی را ثابت نمی‌کند.","words":100,"min":30}],"speaking":[{"name":"Rat geben","typ":"advice","source":"Ihre Kommilitonin Sara sagt: „In Referaten verliere ich manchmal den Faden, obwohl ich mich gut vorbereitet habe. Hast du einen Tipp?“","question":"Geben Sie Sara einen praktischen Rat und begründen Sie ihn.","model":"Ich würde dir empfehlen, deine Präsentation nicht Wort für Wort auswendig zu lernen. Besser wäre eine Karte mit drei bis vier Hauptpunkten und kurzen Übergängen. So weißt du auch nach einer Unterbrechung, welcher Gedanke als Nächstes kommt. Außerdem könntest du den Vortrag mehrmals mit einer Stoppuhr üben und einmal vor einer Freundin präsentieren. Besonders hilfreich finde ich es, die ersten und letzten Sätze gut vorzubereiten. Wenn du zwischendurch den Faden verlierst, kannst du kurz auf die Gliederung zurückgreifen, statt hektisch nach einer perfekten Formulierung zu suchen.","coach":"توصیه باید مشخص، دوستانه و مرتبط با مشکل واقعی فرد باشد.","phases":[{"name":"Vorbereitung","sec":30,"show":false},{"name":"Sprechen","sec":45,"record":true}],"voice":""},{"name":"Optionen abwägen","typ":"weigh","source":"Ihr Kommilitone Niklas überlegt, ob er für eine Prüfung vor allem allein zu Hause oder in der Bibliothek mit einer Lerngruppe lernen soll. Beide Möglichkeiten haben für ihn Vorteile.","question":"Wägen Sie Vor- und Nachteile ab und geben Sie eine Empfehlung.","model":"Wenn Niklas allein zu Hause lernt, kann er sein Tempo selbst bestimmen und sich auf die Themen konzentrieren, die ihm noch Schwierigkeiten bereiten. Andererseits besteht die Gefahr, dass er längere Pausen macht oder Probleme nicht bemerkt. In einer Lerngruppe könnte er Aufgaben erklären und direkt
