Rückmeldungen bekommen. Das ist besonders wertvoll, wenn unterschiedliche Lösungswege diskutiert werden. Allerdings kann eine Gruppe auch Zeit verlieren, wenn die Treffen nicht gut vorbereitet sind. Ich würde ihm deshalb nicht pauschal eine der beiden Möglichkeiten empfehlen. Für das erste Durcharbeiten der Inhalte ist individuelles Lernen oft sinnvoll. Für die letzte Woche vor der Prüfung würde ich dagegen feste Treffen mit einer kleinen Lerngruppe planen. Wenn er unbedingt nur eine Option wählen muss, wäre eine gut organisierte Lerngruppe meine Empfehlung, vorausgesetzt, alle bereiten sich darauf vor.","coach":"هر دو گزینه و محدودیت‌هایشان، معیار و توصیهٔ روشن را بگو.","phases":[{"name":"Vorbereitung","sec":45,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":""},{"name":"Text zusammenfassen","typ":"summary","source":"**Text: Digitale Sprechstunden in der Studienberatung**\nEine Hochschule verglich die Nutzung digitaler und persönlicher Sprechstunden. Im digitalen Format wurden vor allem Fragen zu Formularen und Terminen gestellt. Komplexe Anliegen, etwa Studienzweifel oder langfristige Studienplanung, besprachen viele Teilnehmende lieber persönlich. Die Forschenden vermuten daher, dass beide Formate unterschiedliche Funktionen erfüllen. Allerdings nahmen an der Befragung ausschließlich Personen teil, die mindestens eine Beratung genutzt hatten. Über die Bedürfnisse Studierender ohne Beratungskontakt liegen keine Daten vor. Die Projektgruppe empfiehlt, beide Formate anzubieten und verständlich über ihre jeweiligen Vorteile zu informieren.","question":"Fassen Sie Ziel, Ergebnisse, Einschränkungen und Empfehlung zusammen.","model":"Der Text beschreibt eine Untersuchung zur Nutzung digitaler und persönlicher Sprechstunden an einer Hochschule. Im Mittelpunkt steht die Frage, wofür Studierende die beiden Beratungsformen verwenden. Nach den Ergebnissen eignen sich digitale Angebote besonders für kurze organisatorische Anliegen, beispielsweise Fragen zu Formularen oder Terminen. Bei komplexeren Themen wie Studienzweifeln und langfristiger Planung bevorzugten viele Befragte dagegen das persönliche Gespräch. Daraus schließen die Forschenden vorsichtig, dass beide Formate unterschiedliche Funktionen erfüllen. Allerdings gibt es eine wichtige Einschränkung: Befragt wurden nur Personen, die bereits eine Beratung genutzt hatten. Über Studierende ohne solche Erfahrungen liegen keine Informationen vor. Deshalb lässt sich nicht beurteilen, ob diese Gruppe andere Bedürfnisse hätte. Die Projektgruppe empfiehlt, sowohl digitale als auch persönliche Sprechstunden anzubieten und ihre jeweiligen Vorteile deutlich zu erklären. Der Text plädiert also nicht für die vollständige Ersetzung eines Formats durch das andere.","coach":"گروه شرکت‌کنندگان فقط استفاده‌کنندگان مشاوره‌اند؛ دربارهٔ دیگران چیزی نمی‌دانیم. نظر شخصی اضافه نکن.","phases":[{"name":"Quelle lesen / Grafik prüfen","sec":240,"show":true},{"name":"Sprechen","sec":120,"record":true}],"voice":""},{"name":"Informationen abgleichen, Stellung nehmen","typ":"compare","source":"**Tabelle: Anteil der Studierenden, die mindestens einmal pro Woche Online-Lernvideos nutzen**\n2021: 48 % | 2023: 64 % | 2025: 59 %.\n\nDanach hören Sie eine Stellungnahme im Seminar.","question":"Prüfen Sie den Beitrag anhand der Daten und nehmen Sie Stellung.","model":"Die Sprecherin behauptet, der Anteil der Studierenden mit wöchentlicher Nutzung von Online-Lernvideos sei seit 2021 kontinuierlich gestiegen. Die Tabelle zeigt jedoch eine differenziertere Entwicklung. Zwischen 2021 und 2023 nimmt der Anteil von 48 auf 64 Prozent zu. Im Jahr 2025 fällt er anschließend auf 59 Prozent. Zwar ist der letzte Wert weiterhin höher als 2021, aber von einem durchgehenden Wachstum kann keine Rede sein. Auch die Erklärung, dies liege ausschließlich an kostenlosen Angeboten, lässt sich aus der Tabelle nicht ableiten. Die Zahlen geben nur Auskunft über die Nutzungshäufigkeit, nicht über die Ursachen. Meiner Ansicht nach sollte man ergänzende Informationen sammeln, zum Beispiel zu Gebühren, Qualität und Verfügbarkeit verschiedener Plattformen. Erst damit ließen sich mögliche Gründe für die Veränderungen prüfen.","coach":"در جدول افزایش ۲۰۲۱ تا ۲۰۲۳ و کاهش بعدی است؛ علت «فقط رایگان‌بودن» با داده‌ها ثابت نمی‌شود.","phases":[{"name":"Quelle lesen / Grafik prüfen","sec":30,"show":true},{"name":"Beitrag hören","sec":20,"speak":true},{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":"Die Nutzung von Online-Lernvideos hat meiner Ansicht nach seit zweitausendeinundzwanzig ununterbrochen zugenommen. Wahrscheinlich liegt das ausschließlich daran, dass viele Angebote kostenlos sind."},{"name":"Thema präsentieren","typ":"presentation","source":"Im Propädeutikum präsentieren Sie das Thema „Forschung und gesellschaftliche Beteiligung“. Erläutern Sie Chancen von Bürgerforschung, Grenzen der Datenerhebung und eine Empfehlung.","question":"Halten Sie eine strukturierte Kurzpräsentation.","model":"In meinem Kurzvortrag geht es um die Beteiligung der Bevölkerung an wissenschaftlichen Projekten. Zunächst möchte ich erklären, welche Chancen solche Formen der Forschung bieten. Anschließend gehe ich auf Grenzen ein und formuliere eine Empfehlung. Bürgerinnen und Bürger können zum Beispiel Beobachtungen zur Luftqualität, zu Pflanzen oder zu Wetterereignissen sammeln. Dadurch entstehen viele Messpunkte, die Forschungsteams allein möglicherweise nicht erfassen könnten. Außerdem kann die Beteiligung das Interesse an wissenschaftlichen Methoden stärken. Gleichzeitig gibt es methodische Herausforderungen. Unterschiedliche Geräte, ungenaue Beobachtungen oder eine einseitige Auswahl besonders interessierter Personen können die Ergebnisse beeinflussen. Deshalb dürfen die gesammelten Daten nicht ungeprüft als repräsentativ gelten. Ich halte es für sinnvoll, Teilnehmende zunächst kurz zu schulen und einfache Standards für die Erhebung festzulegen. Fachleute sollten anschließend Stichproben überprüfen und Unsicherheiten offen dokumentieren. Insgesamt sehe ich in Bürgerforschung eine wertvolle Ergänzung professioneller Wissenschaft. Ihr Nutzen hängt jedoch stark davon ab, wie sorgfältig die Daten gewonnen und ausgewertet werden.","coach":"مثال، مزیت، محدودیت روش‌شناختی، راهکار عملی و جمع‌بندی باید وجود داشته باشد.","phases":[{"name":"Vorbereitung","sec":120,"show":false},{"name":"Sprechen","sec":150,"record":true}],"voice":""},{"name":"Argumente wiedergeben, Stellung nehmen","typ":"argument","source":"In einer Seminarsitzung hören Sie eine Studentin, die sich für eine verpflichtende Schulung zur Quellenprüfung ausspricht.","question":"Geben Sie ihre Argumente wieder und nehmen Sie Stellung.","model":"Die Studentin fordert eine verpflichtende Schulung zur Prüfung wissenschaftlicher Quellen. Ihr wichtigstes Argument ist, dass Studierende im Internet oft sehr unterschiedliche Informationen finden und nicht immer erkennen können, welche davon verlässlich sind. Außerdem meint sie, dass eine gemeinsame Grundlage für die Literaturrecherche die Qualität von Seminararbeiten verbessern könnte. Diese Überlegungen halte ich für nachvollziehbar. Allerdings sollte eine Schulung nicht einfach zusätzliche Prüfungsbelastung schaffen. Ich würde einen kurzen Einführungskurs befürworten, der mit praktischen Beispielen aus verschiedenen Fachgebieten arbeitet. Die Teilnehmenden könnten etwa lernen, zwischen wissenschaftlichen Veröffentlichungen, Kommentaren und Werbung zu unterscheiden. Für Studierende mit bereits guten Vorkenntnissen sollte es die Möglichkeit geben, ihre Kenntnisse durch eine kurze Aufgabe nachzuweisen. So ließe sich das Ziel erreichen, ohne alle Studierenden unabhängig von ihrem Bedarf gleich lange zu verpflichten.","coach":"ابتدا استدلال‌های گوینده؛ سپس نقد و پیشنهاد فردی. از نسبت‌دادن حرف‌های ناگفته به سخنران پرهیز کن.","phases":[{"name":"Beitrag hören","sec":45,"speak":true},{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":120,"record":true}],"voice":"Ich bin dafür, dass alle Studierenden eine kurze Schulung zur Prüfung von Quellen besuchen. Im Internet stoßen wir auf sehr unterschiedliche Informationen und können nicht immer erkennen, was zuverlässig ist. Außerdem würde eine gemeinsame Grundlage für die Literaturrecherche die Qualität von Seminararbeiten verbessern."},{"name":"Maßnahmen kritisieren","typ":"critique","source":"Die Stadt plant, Fahrräder auf dem gesamten Universitätscampus nur noch an zwei zentralen Sammelstellen abstellen zu lassen. Die bisherigen kleineren Abstellplätze sollen entfernt werden.","question":"Äußern Sie begründete Kritik und schlagen Sie eine Alternative vor.","model":"Das Ziel, die Wege auf dem Campus sicherer zu machen, kann ich gut nachvollziehen. Trotzdem halte ich die geplante Beschränkung auf nur zwei Fahrradstellplätze für zu weitgehend. Studierende und Beschäftigte müssten ihre Fahrräder zum Teil weit entfernt von den Gebäuden abstellen. Das wäre insbesondere bei Zeitdruck oder eingeschränkter Mobilität problematisch. Außerdem könnte die Maßnahme dazu führen, dass mehr Personen auf andere Verkehrsmittel umsteigen. Ich würde zunächst untersuchen, an welchen Stellen abgestellte Fahrräder tatsächlich Wege blockieren. Dort könnte man klare Markierungen und zusätzliche sichere Abstellflächen schaffen. Statt alle kleinen Stellplätze zu entfernen, sollte die Stadt problematische Bereiche gezielt umgestalten und die Nutzerinnen und Nutzer beteiligen.","coach":"مقصود سیاست عمومی را منصفانه توصیف کن، سپس اشکال مشخص و راه‌حل عملی بده.","phases":[{"name":"Vorbereitung","sec":90,"show":false},{"name":"Sprechen","sec":90,"record":true}],"voice":""}]}};

function showHome(){stopTick();inHome=true;inReview=false;const v=document.getElementById('view');let totals={reading:34,listening:30,writing:2,speaking:7};v.innerHTML=`<section class="hero"><div class="tag dark">EXTRA 05 · VOLLSIMULATION</div><h1>آزمون ترکیبی دیجیتال TestDaF</h1><p>دو مجموعهٔ مستقل، ۲ × (۳۴ Lesen + ۳۰ Hören + ۲ Schreiben + ۷ Sprechen)</p><div class="flex"><span class="tag dark">HTML سبک و بدون اینترنت</span><span class="tag dark">پاسخ‌های آلمانی · تحلیل فارسی</span><span class="tag dark">ذخیرهٔ پاسخ‌ها</span></div></section><section class="card"><h2>آزمون ${test} — ${mode==='exam'?'حالت زمان‌دار':'حالت تمرین آزاد'}</h2><div class="grid">${KEYS.map(k=>`<div class="tile"><strong>${totals[k]}</strong><span class="muted">${NAM[k]} · ${ALL[test][k].length} تکلیف</span></div>`).join('')}</div><div class="note"><b>شیوهٔ تمرین:</b> تمام متن‌ها و سؤال‌ها تألیفی‌اند؛ آزمون رسمی نیستند. در حالت زمان‌دار ترتیب واقعی Lesen → Hören → Schreiben → Sprechen رعایت می‌شود و پس از رفتن به تکلیف بعدی، بازگشت ممکن نیست. ۵۵ دقیقه Lesen، ۴۰ دقیقه Hören، ۶۰ دقیقه Schreiben و مراحل کوتاه‌شدهٔ گفتاری (بدون همهٔ راهنماها و مکث‌های رسمی). تکالیف آزمایشی اضافی آزمون واقعی و استراحت‌ها در این شبیه‌سازی نیستند.</div>${toastWarn('<b>محدودیت صوت و ویدئو:</b> برای کم‌حجم‌ماندن فایل، صوت مستقل جاسازی نشده و مرورگر از صدای آلمانی نصب‌شده روی دستگاه استفاده می‌کند. دو تکلیف ویدئویی Hören با صدای مصنوعیِ چندگوینده شبیه‌سازی شده‌اند؛ نه با فیلم واقعی. اگر صدای آلمانی دستگاه مناسب نبود، حالت تمرین و متن صوت پس از تحویل در دسترس است. نمرهٔ خام این مجموعه معادل TDN رسمی نیست.')}
<div class="flex buttonrow">${button(session.started&&!session.finished?'ادامه از مرحلهٔ '+(session.step+1):'شروع آزمون '+test,'startTest()','primary')}${button('راهنمای استفاده','showGuide()')}${button('نتایج و پاسخ‌نامه','showResults()')}</div></section><section class="card"><h3>محتوای هر آزمون</h3><div class="de">Lesen: 7 Aufgabentypen / 34 Items<br>Hören: 7 Aufgabentypen / 30 Items<br>Schreiben: argumentativer Text + Zusammenfassung aus Text und Tabelle<br>Sprechen: 7 kommunikative Aufgaben mit Vorbereitungs- und Sprechzeit</div><hr><p class="muted small">حالت تمرین را برای آشنایی با فرمت و حالت زمان‌دار را برای شبیه‌سازی استفاده کن. در هر دو حالت پاسخ‌های کوتاه شنیدن فقط به‌طور تقریبی و خودکار بررسی می‌شوند. برای بازبینی انسانی می‌توانی گزارش JSON را ارسال کنی.</p></section>`}
function showGuide(){inHome=false;inReview=false;stopTick();document.getElementById('view').innerHTML=`<section class="hero"><h1>راهنمای استفاده و محدودیت‌ها</h1><p>آزمون ترکیبی – نسخهٔ سبک و تک‌فایلی</p></section><section class="card"><h2>چگونه تمرین کنم؟</h2><p>۱. اول از دکمهٔ «آزمایش صدا» استفاده کن. برای صدای طبیعی‌تر باید یک گفتارساز آلمانی (de-DE) روی دستگاه نصب باشد.</p><p>۲. حالت تمرین: می‌توانی پس از ثبت هر تکلیف به پاسخ‌نامه و رونوشت شنیداری آن مراجعه کنی. حالت آزمون: پاسخ‌نامه تا پایان کل مجموعه قفل می‌ماند و بعد از حرکت جلو، برگشت ممنوع است.</p><p>۳. برای هر مرحله آزمون، زمان‌سنج مستقل فعال می‌شود. مدت کلی به علت شبیه‌سازیِ کوتاه‌شدهٔ دستورها و نبود Erprobungsaufgaben، با مدت آزمون واقعی برابر نیست. با بسته‌شدن مرورگر، زمان ممکن است ادامه پیدا کند؛ ذخیرهٔ پاسخ‌ها با localStorage انجام می‌شود و در برخی مرورگرهای موبایل محدودیت دارد؛ خروجی JSON بگیر.</p><p>۴. گفتارساز دستگاه دقیقاً با سرعت صوت‌های امتحان واقعی اجرا نمی‌شود و دو تکلیف Hören که در TestDaF واقعی ویدئو دارند، در اینجا صوتی‌اند.</p><p>۵. ضبط صدا به مجوز میکروفون و پشتیبانی مرورگر نیاز دارد؛ فایل ضبط‌شده را جداگانه ذخیره کن، چون صوت در localStorage نگهداری نمی‌شود.</p><p>۶. در بخش نوشتن، شمارش واژه کمک‌آموزشی است. متن آلمانی خودت را با نمونه‌پاسخ و معیارها مقایسه کن و در صورت امکان برای تصحیح انسانی ارسال کن.</p><div class="warn"><b>دربارهٔ TDN:</b> TestDaF-Institut امتیازها را با روشی مقیاس‌بندی‌شده و ارزیابی تخصصی تعیین می‌کند؛ در این فایل، درصد صحت سؤال‌های تمرینی هرگز به‌صورت مکانیکی به سطح TDN تبدیل نمی‌شود.</div><div class="flex">${button('برگشت به صفحهٔ اصلی','showHome()')}${button('شروع','startTest()','primary')}</div></section>`}
function startTest(){inHome=false;inReview=false;session.started=true;session.mode=mode;save();renderTask()}
function stopTick(){if(interval){clearInterval(interval);interval=null}}
function stopAll(){stopTick();if('speechSynthesis' in window)speechSynthesis.cancel();voicePlaying=false;if(recorder&&recorder.state==='recording'){recorder.stop()}recorder=null}
function locate(){return seq()[step]}
function taskId(k,i){return `${k}${i}`}

function onPick(k,i,j,idx,check,max){let key=ansKey(k,i,j),arr=Array.isArray(session.answers[key])?[...session.answers[key]]:[];if(check&&!arr.includes(idx)){if(arr.length>=max){toast(`حداکثر ${max} مورد مجاز است.`);document.querySelector(`[data-pick="${key}_${idx}"]`).checked=false;return}arr.push(idx)}if(!check)arr=arr.filter(x=>x!==idx);editAnswer(k,i,j,arr);updatePickCount(k,i,j)}
function updatePickCount(k,i,j){let q=ALL[test][k][i].qs[j],cnt=(getAnswer(k,i,j)||[]).length,el=document.getElementById(`pc_${k}_${i}_${j}`);if(el)el.textContent=`${cnt} / ${q.a.length} انتخاب`}

function startDeadline(x){if(mode!=='exam')return;let id=taskId(x.key,x.i);if(session.liveTask!==id){session.liveTask=id;session.deadline=Date.now()+taskLen(x)*1000;session.phase=0;session.phaseDeadline=null;save()}}
function renderTask(){stopTick();inHome=false;inReview=false;let arr=seq();if(step>=arr.length){finishTest();return}let x=arr[step],t=x.task,k=x.key,i=x.i;startDeadline(x);session.step=step;save();const n=arr.length;let h=`<div class="topsticky"><div class="flex between"><span class="tag">آزمون ${test} · مرحله ${step+1} از ${n}</span><span class="tag">${NAM[k]} · تکلیف ${i+1} از ${ALL[test][k].length}</span></div><div class="progress" aria-label="exam progress"><div style="width:${(step/n)*100}%"></div></div>${mode==='practice'?`<div class="flex"><select aria-label="انتخاب تکلیف تمرینی" onchange="jumpPractice(this.value)">${arr.map((v,j)=>`<option value="${j}" ${step===j?'selected':''}>${j+1}. ${NAM[v.key]} – ${E(v.task.name)}</option>`).join('')}</select></div>`:''}</div><section class="hero"><div class="tag dark">${NAM[k]}</div><h1>${E(t.name)}</h1><p>${k==='speaking'?'مراحل زمان‌دار آماده‌سازی و صحبت':k==='writing'?`زمان: ${t.min} دقیقه`: `زمان پیشنهادی این تکلیف: ${t.min} دقیقه`}</p></section><section class="card"><div class="flex between"><span class="tag">${mode==='exam'?'حالت زمان‌دار — برگشت ممنوع':'حالت تمرین — پاسخ‌نامه پس از ثبت'}</span><div id="clock" class="clock" aria-live="off">--:--</div></div>${k==='listening'?`<div class="note">صوت ساختگی با صدای دستگاه؛ برای پخش روی «▶ پخش» بزن. در صورت نبود گفتارساز آلمانی، در حالت تمرین بعد از ثبت پاسخ می‌توانی متن فایل را بخوانی.</div><div class="flex">${button('▶ پخش گفتار','playListening()', 'primary')}<span class="small muted" id="audstate">آمادهٔ پخش</span></div>`:''}
${t.guide?`<p class="muted small">${E(t.guide)}</p>`:''}`;
if(k==='speaking'){h+=renderSpeaking(x)}else{if(k!=='listening'||!t.hide_until_audio||session.heard?.[taskId(k,i)]||mode==='practice') h+=`<div class="source de">${fmt(t.source)}</div>`;else h+=`<div class="hiddenmsg" id="hiddenSrc">ابتدا صوت را کامل گوش بده تا متن خلاصه‌سازی نمایش داده شود.</div>`;
if(k==='writing')h+=renderWriting(x);else h+=`<div id="questions" ${k==='listening'&&t.hide_until_audio&&mode==='exam'&&!session.heard?.[taskId(k,i)]?'style="display:none"':''}>${t.qs.map((q,j)=>renderQuestion(q,k,i,j)).join('')}</div>`}
h+=`<div class="sep"></div><div class="flex buttonrow"><button class="primary" id="advance" onclick="advance()">${step===n-1?'پایان آزمون و مشاهدهٔ نتیجه':'ثبت و رفتن به تکلیف بعدی ←'}</button>${mode==='practice'?button('بررسی همین تکلیف','submitOne()'):''}${button('دانلود پاسخ‌ها','downloadJSON()')}</div><p class="muted small">${mode==='exam'?'در صورت عبور به جلو، بازگشت به مراحل قبلی غیرفعال است.':'در حالت تمرین بعد از ثبت تکلیف می‌توانی پاسخ‌نامهٔ آن را ببینی.'}</p><div id="practiceReview"></div></section>`;document.getElementById('view').innerHTML=h;window.scrollTo({top:0,behavior:'instant'});if(k==='speaking')runSpeechPhase(x);else tickNormal(x);if(session.submitted[taskId(k,i)]&&mode==='practice')renderOneReview(x)}
function renderQuestion(q,k,i,j){let val=getAnswer(k,i,j),num=j+1,h=`<div class="question"><h4 class="de">${num}. ${E(q.q)}</h4>`;if(q.kind==='choice'){h+=q.opts.map((o,n)=>`<label class="opt de"><input type="radio" name="${k}_${i}_${j}" ${val===o?'checked':''} onchange='onChoice(${JSON.stringify(k)},${i},${j},${JSON.stringify(o)})'> <span><b>${String.fromCharCode(65+n)}.</b> ${E(o)}</span></label>`).join('')}
if(q.kind==='short'){h+=`<input type="text" dir="ltr" placeholder="Kurze Antwort auf Deutsch ..." value="${E(val)}" oninput="editAnswer('${k}',${i},${j},this.value)" aria-label="short answer ${num}">`}
if(q.kind==='pick'){let a=Array.isArray(val)?val:[];h+=`<div class="small muted" id="pc_${k}_${i}_${j}">${a.length} / ${q.a.length} انتخاب</div>`+q.opts.map((o,n)=>`<label class="opt de"><input data-pick="${ansKey(k,i,j)}_${n}" type="checkbox" ${a.includes(n)?'checked':''} onchange="onPick('${k}',${i},${j},${n},this.checked,${q.a.length})"> <span>${E(o)}</span></label>`).join('')}
return h+'</div>'}
function renderWriting(x){let t=x.task,k=x.key,i=x.i,txt=getAnswer(k,i,0);return `<div class="source de">${fmt(t.prompt)}${t.source?'<br><br>'+fmt(t.source):''}</div><h3>پاسخ خود را بنویس</h3><textarea id="writingText" spellcheck="false" placeholder="Schreiben Sie hier auf Deutsch ..." oninput="editAnswer('${k}',${i},0,this.value);updateWordCount()">${E(txt)}</textarea><div class="flex between"><span class="tag">شمارش واژه: <strong id="wordnum">${wc(txt)}</strong></span><span class="small muted">${t.words===200?'حداقل ۲۰۰ واژه':'حدود ۱۰۰–۱۵۰ واژه'}</span></div><div class="note">نمرهٔ متن نوشته‌شده در این فایل به‌صورت خودکار تعیین نمی‌شود. پس از پایان، نمونه‌پاسخ و نکات آموزشی باز می‌شوند. برای تصحیح دقیق، خروجی متن را ارسال کن.</div>`}
function updateWordCount(){let a=document.getElementById('writingText'),b=document.getElementById('wordnum');if(a&&b)b.textContent=wc(a.value)}
function renderSpeaking(x){let t=x.task,k=x.key,i=x.i,p=session.phase||0;let notes=session.note?.[taskId(k,i)]||'';return `<div class="pills" id="phasepills">${t.phases.map((z,n)=>`<span class="pill ${n===p?'active':''}">${n+1}. ${E(z.name)} (${Math.ceil(z.sec/60)} دقیقه)</span>`).join('')}</div><div class="phase" id="phaseInfo"></div><div id="speechSource" class="speakingSource de">${fmt(t.source)}</div><p class="de"><strong>Aufgabe:</strong> ${E(t.question)}</p>${t.voice?`<button onclick="playSpeechClip()">▶ پخش گفتهٔ فرد در تکلیف</button>`:''}<div class="small muted">یادداشت‌ها در فایل ذخیره می‌شوند؛ در زمان ضبط از پاسخ آماده استفاده نکن.</div><textarea class="notearea" placeholder="Stichwörter / یادداشت..." oninput="saveNote('${k}',${i},this.value)">${E(notes)}</textarea><div class="flex"><button id="micStart" onclick="startRecording()">● آغاز ضبط</button><button id="micStop" onclick="stopRecording()">■ توقف ضبط</button><a id="recDownload" style="display:none;color:var(--teal);font-weight:bold" download="TestDaF_Sprechen_${test}_${i+1}.webm">⇩ دانلود صدای ضبط‌شده</a></div><div class="flex" style="margin-top:10px">${mode==='practice'?button('مرحلهٔ بعدی گفتار','nextSpeechPhase()'):''}<span class="small muted" id="micstatus">ضبط به مجوز میکروفون نیاز دارد؛ فایل صوتی جداگانه دانلود می‌شود.</span></div>`}
function saveNote(k,i,v){if(!session.note)session.note={};session.note[taskId(k,i)]=v;save()}
function tickNormal(x){const id=taskId(x.key,x.i);if(mode!=='exam'){let c=document.getElementById('clock');if(c)c.textContent=`${String(x.task.min).padStart(2,'0')}:00`;return;}let update=()=>{if(!document.getElementById('clock')||inHome||inReview||taskId(locate()?.key,locate()?.i)!==taskId(x.key,x.i)){stopTick();return;}let rem=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));updateClock(rem);if(rem<=0){stopTick();toast('زمان تکلیف تمام شد؛ مرحلهٔ بعد آغاز می‌شود.');advance(true)}};update();interval=setInterval(update,350)}
function updateClock(s){let el=document.getElementById('clock');if(el)el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function runSpeechPhase(x){stopTick();let p=session.phase||0,task=x.task;if(p>=task.phases.length){advance(true);return;}let ph=task.phases[p];if(session.phaseTask!==taskId(x.key,x.i)||!session.phaseDeadline){session.phaseTask=taskId(x.key,x.i);session.phaseDeadline=Date.now()+ph.sec*1000;save()}let area=document.getElementById('phaseInfo');if(area)area.textContent=`مرحلهٔ ${p+1} / ${task.phases.length}: ${ph.name}`;let src=document.getElementById('speechSource');if(src){let visible=(p===0&&ph.show)||(ph.show)||(task.typ==='compare'&&p!==2)||(task.typ!=='summary'&&task.typ!=='compare');src.innerHTML=visible?fmt(task.source):'<div class="hiddenmsg">منبع این مرحله پنهان شده است. از یادداشت‌هایت استفاده کن.</div>'}
let pill=document.getElementById('phasepills');if(pill)pill.innerHTML=task.phases.map((z,n)=>`<span class="pill ${n===p?'active':''}">${n+1}. ${E(z.name)} (${z.sec} ثانیه)</span>`).join('');
if(ph.speak&&task.voice&&mode==='exam')playText(task.voice,true,()=>{});
let update=()=>{let rem=Math.max(0,Math.ceil((session.phaseDeadline-Date.now())/1000));updateClock(rem);if(rem<=0){stopTick();nextSpeechPhase(true)}};update();interval=setInterval(update,350)}
function nextSpeechPhase(auto=false){stopTick();stopRecording();let x=locate();if(x?.key!=='speaking')return;session.phase=(session.phase||0)+1;session.phaseDeadline=null;save();if(session.phase>=x.task.phases.length){advance(true);return;}runSpeechPhase(x)}
function jumpPractice(n){if(mode!=='practice')return;stopAll();step=Number(n);session.step=step;session.phase=0;session.phaseDeadline=null;session.phaseTask=null;save();renderTask()}
function submitOne(){if(mode==='exam'){toast('در حالت آزمون، پاسخ‌نامه فقط پس از پایان کل آزمون باز می‌شود.');return}let x=locate();session.submitted[taskId(x.key,x.i)]=true;save();renderOneReview(x)}

function advance(automatic=false){stopTick();stopRecording();if('speechSynthesis'in window)speechSynthesis.cancel();voicePlaying=false;let x=locate();if(x)session.submitted[taskId(x.key,x.i)]=true;step++;session.step=step;session.deadline=null;session.liveTask=null;session.phase=0;session.phaseTask=null;session.phaseDeadline=null;save();if(step>=seq().length)finishTest();else renderTask()}
function finishTest(){stopAll();session.finished=true;session.started=true;session.step=seq().length;save();showResults()}
function normalAnswer(a){return (Array.isArray(a)?a:[]).join(', ')}
function isCorrect(q,v){if(q.kind==='choice')return v===q.a;if(q.kind==='short'){let nv=norm(v);return q.a.some(z=>norm(z)===nv)}if(q.kind==='pick'){let a=Array.isArray(v)?[...v].sort((x,y)=>x-y):[],b=[...q.a].sort((x,y)=>x-y);return JSON.stringify(a)===JSON.stringify(b)}return false}
function scoreTask(x){if(!['reading','listening'].includes(x.key))return null;let points=0,max=0;const t=x.task;for(let j=0;j<t.qs.length;j++){let q=t.qs[j],v=getAnswer(x.key,x.i,j);if(q.kind==='pick'){let arr=Array.isArray(v)?v:[];points+=q.a.filter(idx=>arr.includes(idx)).length;points-=arr.filter(idx=>!q.a.includes(idx)).length;max+=q.a.length}else{max++;if(isCorrect(q,v))points++}}return {points:Math.max(0,points),max}}
function totalScore(k){let pts=0,max=0;for(let i=0;i<ALL[test][k].length;i++){let z=scoreTask({key:k,i,task:ALL[test][k][i]});if(z){pts+=z.points;max+=z.max}}return{pts,max}}
function correctDisplay(q){if(q.kind==='choice')return E(q.a);if(q.kind==='short')return E(q.a[0]);if(q.kind==='pick')return q.a.map(i=>E(q.opts[i])).join('<br>');return''}
function userDisplay(q,v){if(q.kind==='pick')return Array.isArray(v)&&v.length?v.map(i=>E(q.opts[i])).join('<br>'):'(بدون پاسخ)';return v?E(v):'(بدون پاسخ)'}
function reviewTask(x){let t=x.task,k=x.key,i=x.i;let out=`<div class="note"><b>${NAM[k]} ${i+1} — ${E(t.name)}</b></div>`;
if(k==='reading'||k==='listening'){out+=t.qs.map((q,j)=>{let v=getAnswer(k,i,j),good=isCorrect(q,v);let z=q.kind==='pick'?`${(Array.isArray(v)?v:[]).filter(a=>q.a.includes(a)).length} مورد درست از ${q.a.length}`:(good?'درست':'نیاز به اصلاح');return `<div class="review ${good?'good':'bad'}"><b>سؤال ${j+1} · ${z}</b><div class="de"><b>${E(q.q)}</b></div><div class="small"><b>پاسخ تو:</b> ${userDisplay(q,v)}</div><div class="small ok"><b>پاسخ صحیح:</b><div class="de">${correctDisplay(q)}</div></div><div class="small"><b>تحلیل:</b> ${E(q.why)}</div>${q.trap?`<div class="small muted">دام: ${E(q.trap)}</div>`:''}</div>`}).join('');if(k==='listening')out+=`<details><summary>متن کامل گفتارِ تمرینی (Transkript) — مشاهده پس از تحویل</summary><div class="source de">${fmt(t.audio)}</div></details>`;
}
else if(k==='writing'){let v=getAnswer(k,i,0);out+=`<div class="review"><b>واژگان متن تو: ${wc(v)}</b><div class="de">${E(v)||'(هیچ متنی وارد نشده است)'}</div></div><div class="review good"><b>نمونهٔ پاسخ آلمانی:</b><div class="de">${fmt(t.model)}</div><hr><b>توضیح فارسی:</b><p>${E(t.translation)}</p><p><b>نکتهٔ آموزشی:</b> ${E(t.analysis)}</p></div><p class="small muted">برای نمرهٔ واقعی، ارزیابی محتوای منبع، زبان، ساختار و انجام تکلیف ضروری است. این نمونه تنها یک مسیر پاسخ ممکن را نشان می‌دهد.</p>`}
else if(k==='speaking'){out+=`<div class="review good"><b>نمونه‌پاسخ آلمانی:</b><div class="de">${fmt(t.model)}</div><hr><b>راهنمای فارسی:</b><p>${E(t.coach)}</p></div>${t.voice?`<details><summary>متن گویندهٔ ورودی</summary><div class="source de">${fmt(t.voice)}</div></details>`:''}<p class="small muted">صداهای ضبط‌شده روی دستگاه تو باقی می‌مانند و برای بازبینی باید جداگانه دانلود شوند؛ نمونهٔ آماده جای پاسخ شخصی را نمی‌گیرد.</p>`}
return out}
function showResults(){stopTick();inHome=false;inReview=true;let finished=session.finished,arr=seq();let r=totalScore('reading'),h=totalScore('listening');let canReview=finished||(mode==='practice'&&Object.keys(session.submitted||{}).length>0);let view=document.getElementById('view');view.innerHTML=`<section class="hero"><h1>نتیجه و پاسخ‌نامهٔ آزمون ${test}</h1><p>نتایج آموزشی؛ نه مدرک رسمی TestDaF</p></section>${!canReview?`<section class="card"><div class="warn">در حالت آزمون، پاسخ‌نامه تا پایان تمام ۲۳ تکلیف قفل می‌ماند.</div><div class="flex">${button('ادامهٔ آزمون','startTest()','primary')}${button('خروجی پاسخ‌ها','downloadJSON()')}</div></section>`:`<section class="card"><div class="grid"><div class="tile"><strong>${r.points??r.pts}/${r.max}</strong>Lesen — امتیاز خام تمرینی</div><div class="tile"><strong>${h.pts}/${h.max}</strong>Hören — امتیاز خام تمرینی</div></div><div class="warn">پاسخ‌های کوتاه Hören فقط با چند شکل پذیرفته‌شدهٔ واژگان به‌صورت تقریبی تصحیح شده‌اند. Writing و Speaking خودکار نمره نمی‌گیرند. حتی درصد کامل تمرینی هم معادل TDN 5 نیست.</div><div class="flex">${button('خروجی کامل پاسخ‌ها','downloadJSON()','primary')}${button('خروجی نوشته‌ها','downloadTXT()')}${button('صفحهٔ اصلی','showHome()')}</div></section><section class="card"><h2>پاسخ‌نامهٔ تفکیکی و توضیح اشتباه‌ها</h2><p class="muted small">در حالت تمرین فقط تکالیف ثبت‌شده نمایش داده می‌شوند. روی هر عنوان بزن تا تحلیل فارسی، پاسخ درست و در Hören متن گفتار را ببینی.</p>${arr.filter(x=>finished||!!session.submitted[taskId(x.key,x.i)]).map(x=>`<details class="review"><summary><b>${NAM[x.key]} ${x.i+1}: ${E(x.task.name)}</b>${scoreTask(x)?` — ${scoreTask(x).points}/${scoreTask(x).max}`:''}</summary>${reviewTask(x)}</details>`).join('')}</section>`}`}
function download(name,contents,typ='application/json'){let blob=new Blob([contents],{type:typ+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadJSON(){download(`Digital_TestDaF_Extra5_${test}_answers.json`,JSON.stringify({file:'TestDaF Extra 5',test,mode,exportedAt:new Date().toISOString(),answerRecords:session.answers,notes:session.note,finished:session.finished,practiceScore:{Lesen:totalScore('reading'),Hoeren:totalScore('listening')}},null,2))}
function downloadTXT(){let s=`Digital TestDaF Extra 5 — ${test}\n\n`;for(let k of ['writing','speaking'])for(let [i,t] of ALL[test][k].entries()){s+=`${NAM[k]} ${i+1}: ${t.name}\n`;s+=k==='writing'?(getAnswer(k,i,0)||'[keine Antwort]'):(session.note?.[taskId(k,i)]||'[keine Notizen]');s+='\n\n'}download(`Digital_TestDaF_Extra5_${test}_texts.txt`,s,'text/plain')}
function resetTest(){if(!confirm('تمام پاسخ‌ها و پیشرفت آزمون '+test+' پاک شود؟'))return;stopAll();try{localStorage.removeItem(storageName())}catch(e){}session=getState(test);mode='practice';step=0;setActive();showHome()}
function pickVoice(){let v=(speechSynthesis.getVoices?.()||[]);let sel=document.getElementById('voices'),choice=sel?.value||'';return v.find(x=>x.name===choice)||v.find(x=>/^de(-|_)/i.test(x.lang))||v.find(x=>/deutsch|german/i.test(x.name))||null}
function populateVoices(){if(!('speechSynthesis' in window))return;let sel=document.getElementById('voices'),current=sel.value;let vs=speechSynthesis.getVoices().filter(x=>/^de(-|_)/i.test(x.lang)||/deutsch|german/i.test(x.name));sel.innerHTML='<option value="">انتخاب خودکار صدای آلمانی</option>'+vs.map(v=>`<option value="${E(v.name)}">${E(v.name)} (${E(v.lang)})</option>`).join('');if([...sel.options].some(x=>x.value===current))sel.value=current}
function playText(s,automated=false,done=()=>{}){if(!('speechSynthesis' in window)){toast('مرورگر گفتارساز ندارد. برای شنیدن از مرورگر دیگری استفاده کن.');done(false);return}speechSynthesis.cancel();let v=pickVoice();if(!v){toast('صدای آلمانی روی دستگاه پیدا نشد؛ در تنظیمات گفتار دستگاه، German را نصب کن.');done(false);return}let u=new SpeechSynthesisUtterance(s);u.lang=v.lang||'de-DE';u.voice=v;u.rate=Number(document.getElementById('voiceRate').value)||0.92;u.pitch=1;voicePlaying=true;u.onend=()=>{voicePlaying=false;done(true)};u.onerror=()=>{voicePlaying=false;toast('پخش صوت توسط مرورگر متوقف شد.');done(false)};try{speechSynthesis.speak(u)}catch(e){toast('امکان پخش وجود ندارد: '+e.message);done(false)}}
function testVoice(){playText('Guten Tag. Dies ist eine Probe mit der deutschen Stimme Ihres Geräts. Bitte prüfen Sie, ob Sie die Wörter klar verstehen können.')} 
function playListening(){let x=locate();if(x?.key!=='listening')return;let id=taskId(x.key,x.i);if(mode==='exam'&&session.heard?.[id]){toast('این فایل صوتی در حالت آزمون یک‌بار پخش شده است.');return;}let label=document.getElementById('audstate');if(label)label.textContent='در حال پخش با گفتارساز دستگاه…';playText(x.task.audio,false,ok=>{if(ok){session.heard[id]=true;save();if(x.task.hide_until_audio){let hidden=document.getElementById('hiddenSrc');if(hidden)hidden.outerHTML=`<div class="source de">${fmt(x.task.source)}</div>`;let qs=document.getElementById('questions');if(qs)qs.style.display='block';} }if(label)label.textContent=ok?'پخش پایان یافت':'پخش انجام نشد';});let qs=document.getElementById('questions');if(x.task.hide_until_audio&&qs&&mode==='exam'&&!session.heard[id])qs.style.display='none'}
function playSpeechClip(){let x=locate();if(x&&x.task.voice)playText(x.task.voice)}
async function startRecording(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('این مرورگر برای فایل محلی اجازهٔ ضبط نمی‌دهد؛ از ضبط‌کنندهٔ گوشی استفاده کن.');return;}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}),chunks=[];recordedBlob=null;recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recordedBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(recordedURL)URL.revokeObjectURL(recordedURL);recordedURL=URL.createObjectURL(recordedBlob);let a=document.getElementById('recDownload');if(a){a.href=recordedURL;a.style.display='inline-block'}let s=document.getElementById('micstatus');if(s)s.textContent='ضبط کامل شد. پیش از رفتن به تکلیف بعدی فایل را دانلود کن.'};recorder.start();let s=document.getElementById('micstatus');if(s)s.textContent='● در حال ضبط ...';}catch(e){toast('مجوز ضبط داده نشد یا محیط فایل محلی ضبط را پشتیبانی نمی‌کند.')}}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop()}
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});
init();if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices;setTimeout(populateVoices,600)}
