Unterrichtseinsätze.","Offene Lizenzen heben sämtliche Urheberrechte automatisch auf."],"reasons":["Kombiniert Anwendungsnutzen mit Grenzen und Pflichten.","Die Zahl nachweislicher Einsätze beträgt 76.","Die Lizenz bestimmt ausdrücklich, was erlaubt ist."],"answer":0}],"prompt1":"Sollten Hochschulen offene Lehrmaterialien gegenüber kommerziellen Lehrbüchern bevorzugen? Diskutieren Sie Zugang, Qualität, Finanzierung und Urheberrecht (mindestens 200 Wörter).","prompt2":"Fassen Sie Download- und Nutzungszahlen sowie die Grenzen der Zufriedenheitsmessung anhand von Text und Tabelle in 100–150 Wörtern zusammen.","speech":"Kritisieren Sie die geplante Maßnahme, den Erfolg offener Materialien künftig ausschließlich anhand der Downloadzahl zu beurteilen (90 Sekunden).","model1":"Offene Lehrmaterialien können das Studium zugänglicher und flexibler gestalten. Wenn Lehrende Texte, Grafiken oder Aufgaben unter geeigneten Lizenzen bereitstellen, lassen sich Materialien häufig an verschiedene Lerngruppen anpassen. Dies kann besonders für Studierende mit unterschiedlichen Vorkenntnissen hilfreich sein. Auch finanzielle Barrieren könnten sinken, wenn teure Lehrbücher nicht für jeden Kurs gekauft werden müssen. Dennoch halte ich es nicht für sinnvoll, kommerzielle Bücher grundsätzlich durch freie Materialien zu ersetzen. Verlage investieren in redaktionelle Betreuung, fachliche Prüfung und verständliche Gestaltung. Diese Leistungen werden auch bei offenen Materialien benötigt und müssen auf andere Weise finanziert werden. Hinzu kommen rechtliche Fragen. Nicht jede im Internet verfügbare Grafik darf ohne Erlaubnis verändert oder weiterverbreitet werden; entscheidend sind die konkreten Lizenzbedingungen. Darüber hinaus sollten Hochschulen die Qualität nicht anhand bloßer Downloadzahlen bewerten. Ein heruntergeladenes Dokument wird nicht automatisch im Unterricht eingesetzt, und selbst eine häufige Nutzung beweist noch keinen Lernerfolg. Ich befürworte daher eine Kombination aus frei zugänglichen und kommerziellen Quellen. Hochschulen könnten Lehrende bei der Erstellung offener Materialien unterstützen und klare Qualitätsstandards entwickeln. Gleichzeitig sollten sie untersuchen, wie die Materialien tatsächlich verwendet werden und welchen Nutzen Studierende daraus ziehen. Eine solche Strategie verbessert den Zugang, ohne fachliche Qualität oder rechtliche Sicherheit zu vernachlässigen.  Damit die Qualität nicht von einzelnen engagierten Personen abhängt, wäre zudem eine dauerhafte Finanzierung der redaktionellen Prüfung und technischen Pflege wichtig.","model2":"In einem fiktiven Hochschulverbund testeten acht Lehrstühle offene Lehrmaterialien. Im Verlauf eines Semesters wurden 320 Materialien heruntergeladen, aber nur 76 davon nachweislich in mindestens einer Lehrveranstaltung verwendet. Die Downloadzahl ist deshalb kein verlässlicher Beleg für tatsächliche Nutzung. Von 44 freiwillig befragten Lehrenden bezeichneten 29 die Möglichkeit zur Anpassung als Vorteil. Wegen der begrenzten und selbst ausgewählten Stichprobe lässt sich dies nicht auf alle Lehrenden übertragen. Teilweise stieg die Zufriedenheit in Kursen, doch gleichzeitig wurde die technische Ausstattung verbessert. Ein eindeutiger Kausaleffekt der offenen Materialien wurde daher nicht nachgewiesen. Bearbeitungen sind nur erlaubt, soweit die jeweilige Lizenz dies vorsieht und die nötige Namensnennung erfolgt. Weitere Evaluationen sollten Nutzung, Qualität und Lernwirkung getrennt untersuchen.","modelSpeech":"Im Pilotprojekt wurden 320 Materialien heruntergeladen, aber nur 76 nachweislich eingesetzt. Deshalb darf man Downloads nicht mit tatsächlicher Unterrichtsnutzung gleichsetzen. Außerdem zeigt eine höhere Zufriedenheit nicht automatisch die Wirkung der Materialien, weil gleichzeitig die technische Ausstattung verbessert wurde. Offene Lizenzen erleichtern die Anpassung, doch die konkreten Nutzungsrechte müssen geprüft werden. Ich würde deshalb sowohl die Qualität als auch den tatsächlichen Einsatz der Materialien untersuchen.","review":"«Heruntergeladen» ≠ «im Unterricht eingesetzt» ≠ «Lernerfolg». Die Lizenzbedingungen regeln Bearbeitungen, und die freiwillige Befragung erlaubt keine universelle Verallgemeinerung.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":90,"prepSeconds":90,"speakType":"Maßnahmen kritisieren","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"در هشت گروه آموزشی، ۳۲۰ دانلود ثبت شده اما فقط ۷۶ مورد استفادهٔ واقعی در کلاس داشته است. ۲۹ نفر از ۴۴ مدرسِ داوطلب انعطاف منابع آزاد را مثبت دیده‌اند. این‌ها اثبات بهبود کیفیت یا رضایت ناشی از منابع نیست، چون امکانات فنی هم تغییر کرده. مقاله ترکیب منابع آزاد و تجاری را همراه با رعایت مجوز و سنجش یادگیری پیشنهاد می‌کند.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Prüfungsassistenz im Labor","sub":"FINAL · digitale Checklisten und Sicherheitskultur","text":"In einem fiktiven Chemiepraktikum wurde eine digitale Sicherheitscheckliste getestet. Von 150 Teilnehmenden nutzten 112 die Liste vor dem ersten Versuch. Die Zahl der dokumentierten kleineren Zwischenfälle sank im folgenden Semester von 18 auf 12. Allerdings wurden gleichzeitig die Gruppen verkleinert und zusätzliche Aufsichtspersonen eingestellt. Die Daten erlauben deshalb noch keine eindeutige Aussage über die isolierte Wirkung der Checkliste. Vor einem Versuch müssen alle Studierenden eine Sicherheitsunterweisung absolvieren. Die Nutzung der digitalen Checkliste wird hingegen dringend empfohlen, ist aber nicht in jedem Praktikum verpflichtend. Sicherheitskritische Fehler dürfen nur in Anwesenheit einer betreuenden Person behoben werden. Die Umfrage nach dem Versuch erfasste lediglich 60 freiwillige Rückmeldungen. Daraus lässt sich keine allgemeine Aussage über alle naturwissenschaftlichen Studierenden ableiten.","audio":"Moderatorin: Würden Sie die Checkliste verpflichtend machen? Frau Krüger: Sie hat Vorteile, aber ohne gründliche Unterweisung reicht sie keinesfalls aus. Professor Malik: Ich würde zuerst prüfen, welcher Anteil des Rückgangs auf kleinere Gruppen zurückgeht. Moderatorin: Die Informationsveranstaltung war für den 8. Januar angekündigt. Bleibt es dabei? Krüger: Nein, wegen einer Raumänderung findet sie am 15. Januar statt. Malik: Wichtig ist auch, dass Studierende sicherheitskritische Fehler nicht allein korrigieren. Krüger: Das sehe ich genauso.","table":[["Teilnehmende","150"],["Checkliste genutzt","112"],["Zwischenfälle vorher","18"],["Zwischenfälle nachher","12"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Teilnehmende nutzten die Checkliste vor dem ersten Versuch?","options":["112 von 60.","Alle 150.","112 von 150."],"reasons":["60 bezieht sich auf freiwillige Rückmeldungen.","38 nutzten sie nicht.","Zähler und Nenner stehen im Text."],"answer":2},{"tag":"Modal","kind":"abgleich","question":"Was ist eindeutig verpflichtend?","options":["Die Sicherheitsunterweisung vor dem Versuch.","Die digitale Checkliste in jedem Praktikum.","Die Teilnahme an der freiwilligen Umfrage."],"reasons":["Die Unterweisung ist als Pflicht definiert.","Die Liste wird nur empfohlen.","Die Befragung war freiwillig."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Warum beweist der Rückgang kleinerer Zwischenfälle nicht die Wirkung der Checkliste?","options":["Gruppengröße und Betreuung wurden zugleich verändert.","Die Zahl der Zwischenfälle stieg deutlich an.","Nur Chemiepraktika haben Checklisten."],"reasons":["Gleichzeitige Maßnahmen könnten den Rückgang erklären.","18 auf 12 ist ein Rückgang.","Eine solche allgemeine Aussage steht nicht im Text."],"answer":0},{"tag":"Bedingung","kind":"lesen","question":"Wann dürfen sicherheitskritische Fehler behoben werden?","options":["Nur nach Abschluss aller Semester.","Allein, sobald die Liste geöffnet ist.","In Anwesenheit einer betreuenden Person."],"reasons":["Ein Studienabschluss ist nicht erwähnt.","Eine Checkliste ersetzt die Aufsicht nicht.","Aufsicht ist ausdrücklich erforderlich."],"answer":2},{"tag":"Zeit","kind":"hoeren","question":"Wann findet die Informationsveranstaltung statt?","options":["Am 18. Januar.","Am 8. Januar.","Am 15. Januar."],"reasons":["18. Januar wird nicht erwähnt.","8. Januar war der alte Termin.","15. Januar ist der neue Termin."],"answer":2},{"tag":"Perspektive","kind":"hoeren","question":"Wer fordert ausdrücklich, den Einfluss kleinerer Gruppen zu untersuchen?","options":["Die Moderatorin.","Professor Malik.","Frau Krüger."],"reasons":["Moderatorin stellt Fragen.","Malik nennt den Einfluss der Gruppengröße.","Krüger verweist auf die Bedeutung der Unterweisung."],"answer":1},{"tag":"Transfer","kind":"lesen","question":"Welche Verallgemeinerung ist nicht gerechtfertigt?","options":["Die Befragung erfasste 60 freiwillige Rückmeldungen.","Die Zahl kleinerer Zwischenfälle sank in diesem Praktikum.","Die Checkliste reduziert garantiert in allen Laboren Unfälle."],"reasons":["Die Befragungsgröße steht im Text.","18 und 12 belegen lokal Rückgang.","Wirkung nicht isoliert, nur lokaler Pilot."],"answer":2},{"tag":"Synthese","kind":"abgleich","question":"Welche Aussage fasst beide Quellen angemessen zusammen?","options":["Checklisten können ergänzen; Unterweisung und Aufsicht bleiben nötig, und ihre Wirkung muss genauer geprüft werden.","Checklisten ersetzen bereits alle Sicherheitsregeln und Betreuung.","Der Veranstaltungsbeginn wurde auf den 8. Januar vorverlegt."],"reasons":["Vorsichtige Synthese von Nutzen, Sicherheitsregeln und Evidenzlücken.","Gesetzte Regeln widersprechen dem.","8. Januar war ursprünglicher, nicht aktueller Termin."],"answer":0}],"prompt1":"","prompt2":"","speech":"","model1":"","model2":"","modelSpeech":"","review":"Finale Fallstudie A: Unterscheide lokale Änderung und kausale Wirkung; Sicherheitspflicht ≠ Nutzungsempfehlung."},{"title":"Lernorte in der Stadtbibliothek","sub":"FINAL · Erhebung, Nutzung und ausgewählte Stichproben","text":"Eine fiktive Stadtbibliothek richtete während einer Prüfungsphase zusätzliche Lernplätze ein. Insgesamt wurden 280 neue Platzreservierungen gezählt; 75 Personen buchten mindestens zweimal. Bei einer Befragung gaben 48 von 65 anwesenden Nutzerinnen und Nutzern an, sie seien mit der Ruhe zufrieden. Es wurden aber keine Personen befragt, die wegen voller Plätze abgewiesen worden waren. Die Öffnungszeiten wurden von 19 auf 21 Uhr verlängert, zugleich wurde eine neue Lärmschutzwand eingebaut. Eine Abnahme der Beschwerden lässt sich daher nicht eindeutig einer einzigen Maßnahme zuordnen. Reservierungen sind für Gruppenräume verpflichtend, Einzelplätze dürfen ohne Anmeldung genutzt werden, solange sie frei sind. Wer einen reservierten Gruppenraum länger als 15 Minuten nicht nutzt, verliert die Reservierung. Die Bibliothek empfiehlt eine breitere Befragung, bevor das Konzept dauerhaft eingeführt wird.","audio":"Journalistin: Die Bibliothek erhält positives Feedback. Wie zuverlässig sind die Ergebnisse? Leiterin Vogt: Die meisten befragten Anwesenden waren zufrieden. Menschen, die keinen freien Platz bekamen, fehlen aber in der Befragung. Herr Özdemir: Ich wünsche mir vor allem ein transparentes Reservierungssystem für Gruppen. Journalistin: Das neue Angebot startet am 7. Februar? Vogt: Ursprünglich sollte es am 7. beginnen; tatsächlich eröffnen wir am 14. Februar. Özdemir: Ohne Reservierung sollte man weiterhin Einzelplätze nutzen können. Vogt: Genau, wenn ein freier Platz vorhanden ist.","table":[["Neue Reservierungen","280"],["Mehrfach gebucht","75"],["Zufrieden","48 von 65"],["Öffnungszeit vorher/nachher","19 / 21 Uhr"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Befragte waren mit der Ruhe zufrieden?","options":["75 von 280 Reservierungen.","48 von 65 anwesenden Nutzenden.","48 von allen Stadtbewohnern."],"reasons":["75 bezeichnet Mehrfachbuchungen, 280 Reservierungen.","48 von 65 ist die Umfragegruppe.","Nur anwesende Nutzende wurden befragt."],"answer":1},{"tag":"Modal","kind":"abgleich","question":"Welche Reservierung ist verpflichtend?","options":["Für Gruppenräume.","Für jeden Einzelplatz.","Für alle Onlinebefragungen."],"reasons":["Gruppenräume sind reservierungspflichtig.","Einzelplätze sind ohne Anmeldung nutzbar, falls frei.","Umfragen wurden nicht als Pflicht definiert."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Warum lässt sich weniger Lärm nicht allein längeren Öffnungszeiten zuschreiben?","options":["Weil nur 75 Personen reservierten.","Weil gleichzeitig eine Lärmschutzwand eingebaut wurde.","Weil die Bibliothek früher schloss."],"reasons":["75 sind Mehrfachnutzende, kein Maß für Lärm.","Zeitgleich wirkende Änderungen verhindern eindeutigen Schluss.","Sie schließt später, nicht früher."],"answer":1},{"tag":"Bedingung","kind":"lesen","question":"Wann verliert man eine Gruppenraumreservierung?","options":["Wenn der Raum länger als 15 Minuten ungenutzt bleibt.","Wenn ein Einzelplatz noch frei ist.","Wenn mindestens 48 Personen zufrieden sind."],"reasons":["Die 15-Minuten-Regel ist explizit.","Einzelplätze sind unabhängig geregelt.","Zufriedenheit beeinflusst keine Buchung."],"answer":0},{"tag":"Zeit","kind":"hoeren","question":"Wann eröffnet das neue Angebot?","options":["Am 7. Februar.","Am 14. Februar.","Am 21. Februar."],"reasons":["7. Februar war geplant.","Vogt nennt 14. Februar als aktuellen Termin.","21. ist eine Uhrzeit der Öffnung, kein Datum."],"answer":1},{"tag":"Perspektive","kind":"hoeren","question":"Wer fordert ein transparenteres Reservierungssystem für Gruppen?","options":["Herr Özdemir.","Die Journalistin.","Leiterin Vogt."],"reasons":["Özdemir formuliert den Wunsch.","Die Journalistin fragt nach Eröffnung und Aussagekraft.","Vogt weist auf Befragungsgrenzen hin."],"answer":0},{"tag":"Transfer","kind":"lesen","question":"Warum ist die Zufriedenheitsumfrage selektiv?","options":["Abgewiesene Personen wurden nicht erfasst.","Weil die Bibliothek bis 21 Uhr öffnet.","Weil alle Einwohner befragt wurden."],"reasons":["Fehlende Nichtnutzende verzerren die Stichprobe.","Öffnungszeit ist kein Argument zur Stichprobenauswahl.","Gerade nicht alle wurden erfasst."],"answer":0},{"tag":"Synthese","kind":"abgleich","question":"Welche Schlussfolgerung ist am besten gestützt?","options":["Die Befragung beweist, dass alle Einwohner mit dem Angebot zufrieden sind.","Einzelplätze dürfen nur nach Gruppenraumreservierung genutzt werden.","Mehr Plätze und längere Zeiten können helfen; für die Bewertung fehlen aber Rückmeldungen abgewiesener Personen."],"reasons":["Der Befragungskreis ist begrenzt.","Einzelplätze sind bei Verfügbarkeit ohne Buchung möglich.","Berücksichtigt Nutzen und Stichprobenlimit."],"answer":2}],"prompt1":"","prompt2":"","speech":"","model1":"","model2":"","modelSpeech":"","review":"Finale Fallstudie B: 48/65 gilt nur für Anwesende; 280 Reservierungen sind nicht 280 individuelle Personen."},{"title":"Wiederverwendung von Laborwasser","sub":"FINAL · Messwerte, Aufbereitung und Ressourceneffizienz","text":"In einem fiktiven Hochschullabor wurden Verfahren zur Wiederverwendung von Kühlwasser erprobt. Vor der Umstellung lag der gemessene Frischwasserverbrauch bei durchschnittlich 1.000 Litern pro Versuchstag, danach bei 760 Litern. Gleichzeitig sank jedoch die Zahl der durchgeführten Versuche. Daher ist eine Reduktion des Gesamtverbrauchs nicht identisch mit einer nachgewiesenen Verbesserung der Effizienz je Versuch. Die neue Anlage darf nur betrieben werden, wenn Wasserqualität und Wartung kontrolliert wurden. Bei sicherheitsrelevanten Versuchen muss weiterhin Frischwasser eingesetzt werden. Für ungefährliche Übungsversuche empfiehlt das Labor die Nutzung eines geschlossenen Kreislaufs; die Nutzung ist jedoch noch nicht verpflichtend. Von 40 befragten Studierenden bezeichneten 27 die neuen Abläufe als gut verständlich. Die Befragung fand ausschließlich in einem einzigen Labor statt. Der Bericht fordert, beim nächsten Versuch sowohl den Verbrauch pro Versuch als auch die Reinigungsenergie zu dokumentieren.","audio":"Moderator: Haben Sie jetzt bewiesen, dass jeder Versuch weniger Wasser benötigt? Professor Adler: Nein. Insgesamt wurde weniger Wasser verbraucht, aber es gab auch weniger Versuche. Frau Neumann: Für mich ist außerdem die Kontrolle der Wasserqualität entscheidend. Ohne sie kann die Anlage nicht betrieben werden. Moderator: Die Besichtigung war für den 12. Juli angekündigt. Neumann: Wir mussten sie wegen Wartungsarbeiten auf den 19. Juli verschieben. Adler: Ich möchte vor einer größeren Anschaffung auch den zusätzlichen Energiebedarf für Reinigung prüfen.","table":[["Frischwasser vorher","1.000 L / Tag"],["Frischwasser nachher","760 L / Tag"],["Befragte","40"],["Verständlich","27"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Befragte hielten die neuen Abläufe für gut verständlich?","options":["40 von 27.","27 von 1.000.","27 von 40."],"reasons":["Zähler und Nenner vertauscht.","1.000 steht für Liter vor der Umstellung.","27 von 40 Studierenden steht im Text."],"answer":2},{"tag":"Modal","kind":"abgleich","question":"Welche Aussage zu sicherheitsrelevanten Versuchen stimmt?","options":["Dort muss weiterhin Frischwasser eingesetzt werden.","Dort ist jede Form der Wartung freiwillig.","Dort ist Frischwasser grundsätzlich verboten."],"reasons":["Pflicht zur Frischwassernutzung wird ausdrücklich genannt.","Wartung und Qualität sind Betriebsvoraussetzungen.","Das Gegenteil wird festgelegt."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Warum beweisen 240 Liter weniger pro Versuchstag keine höhere Effizienz je Versuch?","options":["Weil die neue Anlage bereits überall eingesetzt wird.","Weil es keine Befragung gab.","Weil zugleich weniger Versuche durchgeführt wurden."],"reasons":["Es handelt sich um ein einzelnes Pilotlabor.","Eine Befragung gab es mit 40 Personen.","Die geringere Versuchszahl beeinflusst den Gesamtverbrauch."],"answer":2},{"tag":"Bedingung","kind":"lesen","question":"Unter welchen Bedingungen darf die Anlage betrieben werden?","options":["Nur wenn alle Studierenden sie gut finden.","Sofort und ohne Qualitätskontrolle.","Nach Kontrolle von Wasserqualität und Wartung."],"reasons":["Zufriedenheit ist keine Sicherheitsbedingung.","Widerspricht dem expliziten Vorbehalt.","Betrieb ist an beide Kontrollen gebunden."],"answer":2},{"tag":"Zeit","kind":"hoeren","question":"Wann ist die Besichtigung nach der Verschiebung geplant?","options":["Am 19. Juli.","Am 27. Juli.","Am 12. Juli."],"reasons":["Neumann nennt den 19. Juli.","27 ist Teil der Befragungszahl im Text, kein Datum.","12. Juli war der alte Termin."],"answer":0},{"tag":"Perspektive","kind":"hoeren","question":"Wer betont die Bedeutung der Wasserqualitätskontrolle?","options":["Der Moderator.","Professor Adler.","Frau Neumann."],"reasons":["Moderator stellt Fragen.","Adler fragt nach effizienter Gesamtbilanz.","Neumann spricht ausdrücklich über Qualitätskontrolle."],"answer":2},{"tag":"Transfer","kind":"lesen","question":"Welche allgemeine Behauptung wäre unzulässig?","options":["Alle Labore sparen durch den Kreislauf pro Versuch genau 24 Prozent Wasser.","Der Gesamtverbrauch sank im beobachteten Labor.","Im nächsten Schritt soll Reinigungsenergie erfasst werden."],"reasons":["Nur Gesamtwerte eines Labors, Versuchszahl änderte sich.","1.000 auf 760 ist lokal dokumentiert.","Die Forderung steht im Bericht."],"answer":0},{"tag":"Synthese","kind":"abgleich","question":"Welche Bewertung ist am besten begründet?","options":["Die 40 Befragten sind repräsentativ für alle Hochschullabore.","Ein niedrigerer Gesamtverbrauch ist beobachtet; Effizienz und Reinigungsaufwand müssen getrennt geprüft werden.","Die Anlage braucht nie Qualitätskontrollen, weil Wasser gespart wird."],"reasons":["Befragung nur in einem Labor, nicht repräsentativ.","Differenziert Beobachtung, Bedingung und offene Messgrößen.","Qualitätskontrollen sind vorgeschrieben."],"answer":1}],"prompt1":"","prompt2":"","speech":"","model1":"","model2":"","modelSpeech":"","review":"Finale Fallstudie C: Gesamtverbrauch und Effizienz je Versuch sind verschiedene Kennzahlen. 24 % weniger Tagesverbrauch ist kein gemessener Einspareffekt pro Versuch."}]}</script>

function home(){return `<section class="hero"><div class="eyebrow">DIGITAL TESTDAF · EXTRA SERIES · PART 7</div><h1>کارگاهٔ پیشرفتهٔ شواهد و انتقال اطلاعات</h1><p class="lead">از خواندن و شنیدن مستقل، به مقایسهٔ منبع‌ها، تشخیص حدود شواهد و ساختن پاسخ نوشتاری و گفتاری برس. متن آلمانی و تحلیل فارسی؛ ۷ پروندهٔ آموزشی و ۳ پروندهٔ امتحانی.</p></section>
<div class="stats"><div class="stat"><b>۸۰</b><span>سؤال چهارگزینه‌ای نیست: سه‌گزینه‌ای دقیق</span></div><div class="stat"><b>۱۰</b><span>پروندهٔ دانشگاهی تازه</span></div><div class="stat"><b>۱۴</b><span>تکلیف نوشتاری در ۷ پرونده</span></div><div class="stat"><b>۷</b><span>تکلیف گفتاری زمان‌دار</span></div></div>
<div class="panel"><h2>روش مطالعه</h2><p>ابتدا هفت پروندهٔ آموزشی را حل کن. هر پرونده دو منبع دارد: متن و جدول برای Lesen، و گفت‌وگوی آلمانی برای Hören. بعد ۸ سؤال با تحلیل هر سه گزینه، دو تکلیف نوشتن و یک گفتار انجام می‌دهی. در پایان، آزمون ۲۴سؤالیِ ۴۵دقیقه‌ای از سه پروندهٔ جدید را اجرا کن.</p><div class="notice"><strong>صوت سبک:</strong> فایل هیچ صدای ضبط‌شده یا فایل MP3 ندارد. گفت‌وگوها با صدای آلمانی دستگاه (SpeechSynthesis) خوانده می‌شوند؛ طبیعی‌بودن صدا و کارکرد آفلاین به صدای نصب‌شده و مرورگر بستگی دارد. برای دستگاه فاقد صدای آلمانی، رونوشت اضطراری در حالت تمرین قابل نمایش است. تکالیف شنیداریِ واقعی TestDaF ممکن است ویدئو باشند؛ این پرونده‌ها آزمون رسمی نیستند.</div><div class="notice warning"><strong>مرز اعتبار:</strong> زمان و ترتیب آزمون نهایی برای تمرین طراحی شده‌اند، نه شبیه‌سازی دقیق هر ۷ نوع سؤال رسمی. پاسخ کوتاه، نوشتن و گفتار به ارزیابی انسانی نیاز دارند؛ درصد این مجموعه سطح TDN تعیین نمی‌کند.</div><div class="actions"><button class="btn primary" data-do="nav" data-id="case0">شروع پروندهٔ اول</button><button class="btn" data-do="nav" data-id="exam">آزمون پایانی</button></div></div>
<div class="panel"><h2>۱۰ پروندهٔ مستقل</h2><div class="chapter-list">${C.map((c,i)=>`<div class="chapter-card"><span class="pill">${i<7?'پروندهٔ آموزشی '+(i+1):'آزمون نهایی'}</span><h3>${esc(c.title)}</h3><p class="muted mini">${esc(c.sub)}</p><p class="meta">۸ سؤال · خواندن + شنیدن + تطبیق منابع</p>${i<7?`<button class="btn small" data-do="nav" data-id="case${i}">${state.graded[i]?'مرور و تحلیل':'شروع تمرین'}</button>`:''}</div>`).join('')}</div></div>
<div class="panel"><h3>مراجع قالب و محدودیت‌ها</h3><p>ساختار رسمی نسخهٔ دیجیتال شامل ۳۴ سؤال Lesen، ۳۰ سؤال Hören، دو تکلیف Schreiben و هفت تکلیف Sprechen است. برنامهٔ حاضر «کارگاهٔ تکمیلی چندمنبعی» است و از نظر تعداد و نوع سؤال، آزمون رسمی TestDaF محسوب نمی‌شود.</p><p><a href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/" target="_blank" rel="noopener">ساختار رسمی TestDaF</a> · <a href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/vorbereitung-auf-den-digitalen-testdaf/" target="_blank" rel="noopener">تمرین‌های رسمی رایگان</a></p></div>`}
function voiceChoice(){return `<div class="voice-controls"><label class="label">گویندهٔ آلمانی دستگاه: <select class="voice" id="voice-sel">${voiceList.filter(v=>/^de\b|^de[-_]/i.test(v.lang)).length?voiceList.filter(v=>/^de\b|^de[-_]/i.test(v.lang)).map(v=>`<option value="${esc(v.voiceURI)}" ${state.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">در حال بررسی صدای آلمانی …</option>'}</select></label><label class="label">سرعت <select id="rate-sel">${[.8,.9,.95,1,1.08].map(n=>`<option value="${n}" ${state.rate==n?'selected':''}>${n}×</option>`).join('')}</select></label></div>`}
function sourceBox(c,i,isExam=false){const hiddenRead=!isExam&&i===2&&speaking.idx===i&&speaking.phase==='speak';return `<div class="source-grid"><div class="panel"><div class="between"><strong>LESEN · مقالهٔ دانشگاهی</strong><span class="q-tag">منبع A</span></div>${hiddenRead?'<p class="empty">زمان مطالعه تمام شده و متن برای مرحلهٔ خلاصه‌گویی پنهان است.</p>':raw(c.text)}</div><div class="panel"><strong>DATEN · جدول عددی</strong><div class="table-wrap"><table class="data"><tbody>${c.table.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div><p class="tiny">همهٔ اعداد و مطالعات این مجموعه فرضی‌اند.</p></div></div>`}
function audioBox(c,i,isExam=false){const revealAllowed=!isExam && (state.transcript[i]||state.graded[i]);return `<div class="panel"><div class="between"><strong>HÖREN · گفت‌وگوی دانشگاهی</strong><span class="q-tag">منبع B</span></div><p>ابتدا صوت را پخش کن و نکته‌های کلیدی را یادداشت کن. صدای دستگاه ممکن است برای چند گوینده یکسان باشد؛ نام گوینده‌ها در صوت خوانده می‌شود.</p>${voiceChoice()}<div class="actions"><button class="btn primary" data-do="playAudio" data-case="${i}">▶ پخش آلمانی</button><button class="btn" data-do="stopAudio">■ توقف</button>${!isExam?`<button class="btn" data-do="transcript" data-case="${i}">${revealAllowed?'پنهان‌کردن رونوشت':'نمایش رونوشت اضطراری'}</button>`:''}</div>${revealAllowed?`<div class="source">${raw(c.audio)}</div>`:`<div class="notice">رونوشت قبل از ارزیابی پنهان است. اگر دستگاه گویندهٔ آلمانی ندارد، از دکمهٔ «رونوشت اضطراری» استفاده کن؛ در این صورت تمرین حالت شنیداری واقعی ندارد.</div>`}</div>`}
function question(q,num,key,graded,selected,examMode=false){return `<div class="qa-item"><div class="question-meta"><span>سؤال ${num}</span><span>${q.kind==='lesen'?'LESEN':q.kind==='hoeren'?'HÖREN':'ABGLEICH'}</span><span>دام: ${esc(TAGS.find(t=>t[0]===q.tag)?.[1])}</span></div><div class="q-title">${esc(q.question)}</div><div class="options">${q.options.map((s,k)=>`<label class="option"><input type="radio" name="${key}" value="${k}" data-ans="${key}" ${selected===k?'checked':''} ${graded?'disabled':''}><span>${'ABC'[k]}. ${esc(s)}</span></label>`).join('')}</div>${graded?`<div class="answers"><strong>پاسخ: ${'ABC'[q.answer]} ${selected===q.answer?'✅':'·'} ${selected===undefined?'(بدون پاسخ)':selected===q.answer?'پاسخ صحیح':'نیاز به اصلاح'}</strong>${q.options.map((op,k)=>`<div class="reason ${k===q.answer?'right':'wrong'}"><span class="letters">${'ABC'[k]}.</span> <span class="de" style="display:block">${esc(op)}</span><span>${k===q.answer?'✓ ':'✗ '}${esc(q.reasons[k])}</span></div>`).join('')}<p class="tiny">دام هدف: ${esc(TAGS.find(t=>t[0]===q.tag)?.[1])}</p></div>`:''}</div>`}
function writeBox(c,i){const wc1=`write-${i}-essay`,wc2=`write-${i}-summary`;const graded=!!state.graded[i];return `<div class="sectionbar"><h2>Schreiben · دو تکلیف انتقال اطلاعات</h2><p>در تکلیف اول استدلال شخصی بنویس، در دومی به داده‌های منبع وفادار بمان. هرکدام در آزمون واقعی دیجیتال تقریباً ۳۰ دقیقه زمان دارد؛ زمان‌سنج اینجا تمرینی است.</p></div>${[[wc1,'Argumentativen Text schreiben · mindestens 200 Wörter',c.prompt1,c.model1],[wc2,'Text und Tabelle zusammenfassen · circa 100–150 Wörter',c.prompt2,c.model2]].map(([id,title,prompt,model],j)=>`<div class="panel"><div class="between"><h3 class="de">${esc(title)}</h3><span class="text-timer" id="writingclock-${j}">30:00</span></div><p class="de">${esc(prompt)}</p><div class="actions"><button class="btn small" data-do="timerWrite" data-id="${j}">۳۰ دقیقه شروع</button><button class="btn small" data-do="timerStop">توقف زمان‌سنج</button></div><textarea class="textbox de" data-write="${id}" dir="ltr" spellcheck="false" placeholder="Schreiben Sie Ihren Text hier ...">${esc(state.texts[id]||'')}</textarea><p class="between"><span class="mini">واژه‌های نوشته‌شده: <strong id="wc-${id}">${count(state.texts[id])}</strong></span><span class="muted mini">${j===0?'حداقل ۲۰۰':'هدف ۱۰۰–۱۵۰'} واژه</span></p>${graded?`<details><summary>نمونه‌پاسخ کامل و تحلیل آموزشی</summary><div class="sample">${raw(model)}<div class="essay-review"><strong>راهنمای فارسی</strong><p>${esc(c.faTranslation)}</p><p>${esc(c.translation)}</p><p><strong>نمونهٔ جمله و ترجمه:</strong></p><p class="de">${esc(c.exampleDE)}</p><p>${esc(c.exampleFA)}</p></div></div></details>`:'<div class="tiny">نمونه‌پاسخ پس از ثبت و ارزیابی ۸ سؤال باز می‌شود تا پاسخ‌های تو مستقل بمانند.</div>'}</div>`).join('')}`}
function speechBox(c,i){const graded=!!state.graded[i];return `<div class="sectionbar"><h2>Sprechen · ${esc(c.speakType)}</h2><p>آماده‌سازی: ${c.prepSeconds} ثانیه · پاسخ: ${c.speakSeconds} ثانیه. گفتار واقعی TestDaF دارای مراحل منبع‌خوانی و صوتی ویژهٔ هر تکلیف است؛ این زمان‌سنج برای تمرین فشردهٔ همان مهارت ساخته شده.</p></div><div class="panel"><p class="de prompt">${esc(c.speech)}</p><div class="between"><strong id="speech-label">آمادهٔ شروع</strong><span class="clock" id="speech-clock">--:--</span></div><div class="actions"><button class="btn primary" data-do="startSpeak" data-case="${i}">شروع آماده‌سازی و گفتار</button><button class="btn" data-do="stopSpeak">توقف زمان‌سنج</button><button class="btn" data-do="micStart">ضبط میکروفون</button><button class="btn" data-do="micStop">پایان ضبط</button><button class="btn" data-do="micSave">دریافت ضبط</button></div><p class="tiny">ضبط محلی ممکن است در فایل HTML روی بعضی مرورگرهای موبایل مجاز نباشد. در این صورت از ضبط‌کنندهٔ خود گوشی استفاده کن.</p>${graded?`<details><summary>نمونه‌پاسخ آلمانی و راهبرد فارسی</summary>${raw(c.modelSpeech)}<div class="essay-review"><strong>راهبرد ارزیابی:</strong> ${esc(c.review)}</div></details>`:'<p class="muted mini">پاسخ نمونه پس از ارزیابی تستی نمایش داده می‌شود.</p>'}</div>`}
function caseHTML(i){const c=C[i], graded=!!state.graded[i];const qRows=c.qs.map((q,j)=>question(q,j+1,ansKey(i,j),graded,state.answers[ansKey(i,j)])).join('');return `<div class="hero"><div class="eyebrow">FORSCHUNGSAKTE ${i+1} / 7</div><h1>${esc(c.title)}</h1><p class="lead">${esc(c.sub)}</p></div><div class="panel"><div class="between"><strong>۸ سؤال + ۲ نوشتن + ۱ گفتار</strong><strong class="score">${graded?score(i)+'/8':'بدون تصحیح'}</strong></div><p>ترتیب پیشنهادی: متن و جدول ← شنیدن ← پاسخ به هشت سؤال ← ثبت پاسخ‌نامه ← نوشتن و گفتار ← مرور تحلیل.</p><div class="actions">${i<6?`<button class="btn" data-do="nav" data-id="case${i+1}">پروندهٔ بعد ←</button>`:''}<button class="btn" data-do="nav" data-id="report">گزارش پیشرفت</button></div></div>${sourceBox(c,i)}${audioBox(c,i)}<div class="panel"><h2>آزمون هشت‌سؤالیِ چندمنبعی</h2><div class="notice">سؤال‌ها به آلمانی‌اند و برای بعضی سؤال‌ها باید هر دو منبع را مقایسه کنی. پاسخ‌نامهٔ تشریحی تا زمان تصحیح این پرونده پنهان می‌ماند.</div>${qRows}<div class="actions"><button class="btn primary" data-do="gradeCase" data-case="${i}">${graded?'دوباره دیدن نتیجه':'تصحیح و بازکردن پاسخ‌نامهٔ تشریحی'}</button>${graded?`<button class="btn danger" data-do="resetCase" data-case="${i}">شروع دوبارهٔ سؤال‌های این پرونده</button>`:''}</div>${graded?`<div class="notice"><b>نکتهٔ کلیدی:</b> ${esc(c.review)}</div>`:''}</div>${writeBox(c,i)}${speechBox(c,i)}<div class="panel"><h3>برگهٔ خودارزیابی کیفی</h3>${c.rubric?.map(x=>`<div class="feature">${esc(x)}</div>`).join('')}<p class="tiny">این موارد برای بازخورد شخصی‌اند و به معنی تصحیح رسمی آزمون نیستند.</p></div>`}
function examHTML(){let m=state.exam;if(!m.started){return `<div class="hero"><h1>آزمون پایانی · ۲۴ سؤال</h1><p class="lead">سه پروندهٔ تازه با ۸ سؤال در هر پرونده، ۴۵ دقیقه زمان کل و ممنوعیت بازگشت به پروندهٔ قبلی. پس از شروع، پاسخ‌نامه تا پایان آزمون پنهان می‌ماند.</p></div><div class="panel"><h2>قواعد شبیه‌سازی</h2><p>این آزمون تمرینی هر پرونده را یک «مرحله» در نظر می‌گیرد. می‌توانی هشت سؤال همان مرحله را به هر ترتیبی پاسخ بدهی، اما پس از عبور از مرحله نمی‌توانی برگردی. این تنها یک تقریب آموزشی از قاعدهٔ عدم بازگشت در TestDaF دیجیتال است؛ قالب هشت‌سؤالی آن، نوع رسمی تکلیف نیست.</p><div class="notice">برای پاسخ شنیداری، از صدای آلمانی دستگاه استفاده کن؛ در حالت آزمون رونوشت نمایش داده نمی‌شود. اگر گوشی صدای آلمانی ندارد، این آزمون را در حالت تمرین با کمک یکی از افراد دیگر اجرا کن.</div><button class="btn primary" data-do="startExam">شروع آزمون ۴۵دقیقه‌ای</button></div>`}
if(m.finished){let score=examScore();return `<div class="hero"><h1>نتیجهٔ آزمون پایانی</h1><p class="lead">${score} پاسخ درست از ۲۴ سؤال. این نتیجهٔ تمرینی است، نه TDN رسمی.</p></div><div class="stats"><div class="stat"><b>${score}/24</b><span>پاسخ‌های درست</span></div><div class="stat"><b>${(score/24*100).toFixed(0)}٪</b><span>دقت تمرینی</span></div><div class="stat"><b>۳/۳</b><span>پرونده‌های آزمون</span></div><div class="stat"><b>۴۵</b><span>دقیقهٔ زمان هدف</span></div></div><div class="actions"><button class="btn" data-do="nav" data-id="report">تحلیل دام‌ها</button><button class="btn danger" data-do="restartExam">اجرای دوباره</button></div>${C.slice(7).map((c,k)=>`<div class="panel"><h2>${esc(c.title)} · ${c.qs.reduce((s,q,j)=>s+(m.answers[ansKey(k+7,j)]===q.answer?1:0),0)}/8</h2>${sourceBox(c,7+k,true)}<details><summary>رونوشت منبع شنیداری این پرونده</summary>${raw(c.audio)}</details>${c.qs.map((q,j)=>question(q,j+1,ansKey(k+7,j),true,m.answers[ansKey(k+7,j)],true)).join('')}<div class="notice"><b>درس:</b> ${esc(c.review)}</div></div>`).join('')}`}
let i=m.step, c=C[i+7];return `<div class="hero"><div class="between"><div><h1>آزمون نهایی · مرحلهٔ ${i+1} از ۳</h1><p class="lead">${esc(c.title)}</p></div><div class="clock" id="exam-clock">45:00</div></div></div><div class="exam-top"><strong>بازگشت به پروندهٔ قبلی ممنوع است.</strong><div class="progress"><div style="width:${i/3*100}%"></div></div></div>${sourceBox(c,i+7,true)}${audioBox(c,i+7,true)}<div class="panel"><h2>۸ سؤال این پرونده</h2>${c.qs.map((q,j)=>question(q,j+1,ansKey(i+7,j),false,m.answers[ansKey(i+7,j)],true)).join('')}<div class="actions"><button class="btn primary" data-do="nextExam">${i===2?'پایان آزمون و نمایش پاسخ‌نامه':'ثبت این مرحله و رفتن به مرحلهٔ بعد ←'}</button></div></div>`}
function reportHTML(){const completed=Array.from({length:7},(_,i)=>i).filter(i=>state.graded[i]);const total=completed.length*8;const good=completed.reduce((s,i)=>s+score(i),0);const byTags=TAGS.map(([tag,fa])=>{let t=0,n=0;completed.forEach(i=>C[i].qs.forEach((q,j)=>{if(q.tag===tag){t++;n+=state.answers[ansKey(i,j)]===q.answer?1:0}}));if(state.exam.finished){C.slice(7).forEach((c,k)=>c.qs.forEach((q,j)=>{if(q.tag===tag){t++;n+=state.exam.answers[ansKey(k+7,j)]===q.answer?1:0}}))}return {tag,fa,t,n}});const weak=byTags.filter(x=>x.t>0).sort((a,b)=>a.n/a.t-b.n/b.t);return `<div class="hero"><h1>گزارش تشخیصی و پیشنهاد تمرین</h1><p class="lead">نقاط ضعف را بر اساس نوع استدلال بررسی کن؛ نه فقط تعداد جواب‌های صحیح. این تحلیل آموزشی و تقریبی است و نباید به سطح TDN تبدیل شود.</p></div><div class="stats"><div class="stat"><b>${completed.length}/7</b><span>پروندهٔ آموزشی</span></div><div class="stat"><b>${good}/${total}</b><span>پاسخ درست آموزش</span></div><div class="stat"><b>${state.exam.finished?examScore()+'/24':'—'}</b><span>آزمون پایانی</span></div><div class="stat"><b>${Object.values(state.texts).filter(s=>String(s).trim()).length}/14</b><span>تمرین نوشتن ثبت‌شده</span></div></div><div class="panel"><h2>عملکرد در هشت نوع دام</h2>${byTags.map(x=>`<div class="between" style="margin:12px 0 5px"><strong>${esc(x.fa)}</strong><span>${x.t?x.n+'/'+x.t:'هنوز داده‌ای ندارد'}</span></div>${x.t?bar(x.n,x.t):''}`).join('')}</div><div class="panel"><h3>پیشنهاد تشخیصی</h3>${weak.length?`<p>پایین‌ترین دقت فعلی مربوط به <strong>${esc(weak[0].fa)}</strong> است (${weak[0].n}/${weak[0].t}). پیشنهاد: در یک متن تازه، شواهد پشتیبان و دلیل رد گزینه‌های غلط همین نوع را جدا ثبت کن. سپس تمرین مشابهِ حل‌نشده انجام بده.</p>`:'<p>ابتدا یک پرونده را حل و تصحیح کن تا گزارش ساخته شود.</p>'}<div class="notice">این اعداد به نوع، تعداد و دشواری سؤال‌های تألیفی وابسته‌اند. از آن‌ها نتیجهٔ رسمی TDN یا درصد موردنیاز TestDaF استخراج نکن.</div></div><div class="panel"><h3>صادرات و حفظ پاسخ‌ها</h3><p>گزینهٔ JSON برای ارسال به ChatGPT مناسب‌تر است؛ نوشته‌های آلمانی و جواب‌های ۸۰ سؤال نیز در آن قرار می‌گیرند. گفتار ضبط‌شده را باید جدا ذخیره کنی.</p><div class="actions"><button class="btn primary" data-do="exportJSON">دانلود JSON</button><button class="btn" data-do="exportTXT">دانلود TXT</button><button class="btn danger" data-do="resetAll">حذف پیشرفت همین مرورگر</button></div></div>`}
let speaking={idx:-1,phase:'',ends:0}, wtimer={active:false,endAt:0,id:''},rec=null,stream=null,chunks=[],recBlob=null,recURL=null;
function stopVoice(){try{speechSynthesis.cancel()}catch(e){}speechActive=false}
function voiceOptions(){try{voiceList=speechSynthesis.getVoices()||[]}catch(e){voiceList=[]}const s=document.getElementById('voice-sel');if(s){const vs=voiceList.filter(v=>/^de\b|^de[-_]/i.test(v.lang));if(vs.length){s.innerHTML=vs.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');s.value=vs.some(v=>v.voiceURI===state.voice)?state.voice:vs[0].voiceURI}else s.innerHTML='<option value="">صدای آلمانی نصب‌شده پیدا نشد</option>'}}
function speakAudio(i){if(!('speechSynthesis' in window)){tell('مرورگر گفتارساز ندارد. برای تمرین از رونوشت اضطراری استفاده کن.');return}stopVoice();voiceOptions();const vs=voiceList.filter(v=>/^de\b|^de[-_]/i.test(v.lang));if(!vs.length){tell('صدای آلمانی روی دستگاه پیدا نشد. از بخش رونوشت در حالت تمرین کمک بگیر.');return}const u=new SpeechSynthesisUtterance(C[i].audio);u.lang='de-DE';u.rate=Number(state.rate)||.95;u.pitch=1;u.voice=vs.find(v=>v.voiceURI===state.voice)||vs[0];u.onend=()=>{speechActive=false};u.onerror=()=>{speechActive=false;tell('پخش صدا قطع شد؛ ممکن است گفتارساز دستگاه از متن‌های طولانی پشتیبانی نکند.')};speechActive=true;speechSynthesis.speak(u);tell('پخش گفت‌وگو آغاز شد. اگر صدای گوینده طبیعی نیست، گوینده را از منو تغییر بده.')}
function formatSec(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateClocks(){if(state.exam.started&&!state.exam.finished){if(Date.now()>=state.exam.endAt){state.exam.finished=true;save();render();tell('زمان ۴۵دقیقه‌ای به پایان رسید.');return}const el=document.getElementById('exam-clock');if(el)el.textContent=formatSec((state.exam.endAt-Date.now())/1000)}if(speaking.phase){let left=Math.ceil((speaking.ends-Date.now())/1000);const e=document.getElementById('speech-clock');if(e)e.textContent=formatSec(left);const lab=document.getElementById('speech-label');if(lab)lab.textContent=speaking.phase==='prep'?'آماده‌سازی':'صحبت‌کردن';if(left<=0){if(speaking.phase==='prep'){speaking.phase='speak';speaking.ends=Date.now()+C[speaking.idx].speakSeconds*1000;if(speaking.idx===2)render();tell('زمان صحبت آغاز شد.')}else{speaking={idx:-1,phase:'',ends:0};tell('زمان پاسخ گفتاری تمام شد.');if(page==='case2')render()}}}if(wtimer.active){const el=document.getElementById('writingclock-'+wtimer.id);if(el)el.textContent=formatSec((wtimer.endAt-Date.now())/1000);if(Date.now()>=wtimer.endAt){wtimer.active=false;tell('۳۰ دقیقهٔ تکلیف نوشتن به پایان رسید؛ پاسخ تو حفظ شده است.')}}}
function render(){if(state.exam.started&&!state.exam.finished&&Date.now()>=state.exam.endAt){state.exam.finished=true;save()}$.innerHTML=`<div class="shell">${side()}<main class="main">${navMobile()}${head()}${page==='home'?home():page==='exam'?examHTML():page==='report'?reportHTML():caseHTML(parseInt(page.slice(4),10)||0)}${foot()}</main></div>`;voiceOptions();updateClocks()}
function startExam(){stopVoice();speaking.phase='';state.exam={started:true,finished:false,step:0,answers:{},endAt:Date.now()+45*60*1000};save();jump('exam')}
function nextExam(){stopVoice();if(state.exam.step<2){state.exam.step++;save();render();window.scrollTo(0,0)}else{state.exam.finished=true;save();render();window.scrollTo(0,0)}}
function download(name,content,mime){const b=new Blob([content],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.download=name;a.href=url;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportAnswers(txt){let exportObj={title:'Digital_TestDaF_Extra_Part7_Forschungswerkstatt',timestamp:new Date().toISOString(),note:'نتایج تمرینی، نه نمرهٔ رسمی TestDaF',questions:80,training:[],exam:state.exam,writing:state.texts};C.slice(0,7).forEach((c,i)=>exportObj.training.push({topic:c.title,graded:!!state.graded[i],score:state.graded[i]?score(i):null,answers:c.qs.map((q,j)=>({question:q.question,tag:q.tag,answerIndex:state.answers[ansKey(i,j)]??null,correctIndex:q.answer}))}));if(!txt)download('Digital_TestDaF_Extra_Part7_Antworten.json',JSON.stringify(exportObj,null,2),'application/json');else{let lines=[exportObj.title,'',...exportObj.training.map(x=>`${x.topic} ${x.graded?x.score+'/8':'noch nicht bewertet'}`),'','Exam: '+(state.exam.finished?examScore()+'/24':'nicht abgeschlossen'),'',...C.slice(0,7).flatMap((c,i)=>['=='+c.title+'==',...c.qs.map((q,j)=>`${j+1}. ${q.question}\nAntwort: ${q.options[state.answers[ansKey(i,j)]]||'—'}\nLösung: ${q.options[q.answer]}`),`Argumentativer Text:\n${state.texts[`write-${i}-essay`]||''}`,`Zusammenfassung:\n${state.texts[`write-${i}-summary`]||''}`])];download('Digital_TestDaF_Extra_Part7_Bericht.txt',lines.join('\n'),'text/plain;charset=utf-8')}}
async function startMic(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){tell('مرورگر فایل محلی اجازهٔ ضبط نمی‌دهد؛ از ضبط‌کنندهٔ گوشی استفاده کن.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{recBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(recURL)URL.revokeObjectURL(recURL);recURL=URL.createObjectURL(recBlob);stream.getTracks().forEach(x=>x.stop());tell('ضبط آمادهٔ دریافت است.')};rec.start();tell('ضبط گفتار شروع شد.')}catch(e){tell('اجازهٔ میکروفون داده نشد؛ از برنامهٔ ضبط گوشی استفاده کن.')}}
function stopMic(){if(rec&&rec.state==='recording')rec.stop();else tell('ضبط فعالی وجود ندارد.')}
function saveMic(){if(!recBlob){tell('ابتدا گفتار را ضبط و سپس متوقف کن.');return}const a=document.createElement('a');a.href=recURL;a.download='Digital_TestDaF_Part7_Sprechen.'+(recBlob.type.includes('mp4')?'m4a':'webm');document.body.append(a);a.click();a.remove()}
$.addEventListener('change',e=>{const t=e.target;if(t.id==='mobile-nav'){jump(t.value);return}if(t.id==='voice-sel'){state.voice=t.value;save();return}if(t.id==='rate-sel'){state.rate=Number(t.value);save();return}if(t.dataset.ans){const k=t.dataset.ans;if(page==='exam')state.exam.answers[k]=Number(t.value);else if(!state.graded[Number(k.match(/^c(\d+)/)?.[1])])state.answers[k]=Number(t.value);save()}});
$.addEventListener('input',e=>{let id=e.target.dataset.write;if(id){state.texts[id]=e.target.value;save();const w=document.getElementById('wc-'+id);if(w)w.textContent=count(e.target.value)}});
$.addEventListener('click',e=>{let x=e.target.closest('[data-do]');if(!x)return;let a=x.dataset.do,i=Number(x.dataset.case||0),id=x.dataset.id;if(a==='nav'){speaking.phase='';wtimer.active=false;jump(id)}else if(a==='gradeCase'){state.graded[i]=true;save();render();tell(`نتیجه: ${score(i)}/8؛ تحلیل گزینه‌ها باز شد.`)}else if(a==='resetCase'){if(confirm('پاسخ‌های تستی این پرونده را پاک کنیم؟ نوشته‌های تو باقی می‌مانند.')){C[i].qs.forEach((q,j)=>delete state.answers[ansKey(i,j)]);delete state.graded[i];save();render()}}else if(a==='playAudio')speakAudio(i);else if(a==='stopAudio')stopVoice();else if(a==='transcript'){state.transcript[i]=!state.transcript[i];save();render()}else if(a==='startExam')startExam();else if(a==='nextExam')nextExam();else if(a==='restartExam'){if(confirm('آزمون پایانی از اول اجرا شود و پاسخ‌های قبلی آن پاک شوند؟'))startExam()}else if(a==='timerWrite'){wtimer={active:true,endAt:Date.now()+30*60*1000,id};tell('زمان‌سنج نوشتن آغاز شد.')}else if(a==='timerStop'){wtimer.active=false;tell('زمان‌سنج نوشتن متوقف شد.')}else if(a==='startSpeak'){speaking={idx:i,phase:'prep',ends:Date.now()+C[i].prepSeconds*1000};tell('آماده‌سازی آغاز شد.')}else if(a==='stopSpeak'){speaking={idx:-1,phase:'',ends:0};tell('زمان‌سنج گفتار متوقف شد.');if(page==='case2')render()}else if(a==='micStart')startMic();else if(a==='micStop')stopMic();else if(a==='micSave')saveMic();else if(a==='exportJSON')exportAnswers(false);else if(a==='exportTXT')exportAnswers(true);else if(a==='resetAll'){if(confirm('همهٔ پیشرفت‌ها و پاسخ‌های این فایل در همین مرورگر پاک شود؟')){try{localStorage.removeItem(K)}catch(e){}state=EMPTY();page='home';render()}}});
setInterval(updateClocks,500);render();
try{speechSynthesis.addEventListener('voiceschanged',voiceOptions)}catch(e){}
