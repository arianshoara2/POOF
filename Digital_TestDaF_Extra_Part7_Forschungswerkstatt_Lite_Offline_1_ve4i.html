*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.85}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}a{color:var(--accent)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{background:var(--deep);color:#e6f2f1;position:sticky;top:0;height:100vh;overflow-y:auto;padding:25px 16px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:25px}.logo{width:45px;height:45px;border-radius:13px;background:linear-gradient(135deg,#84d4bf,#34aaa2);display:grid;place-items:center;color:#103946;font-size:22px;font-weight:bold}.brand strong{font-family:Arial,sans-serif;font-size:17px}.brand small{display:block;color:#bed8db;font-size:11px}.side-label{color:#a3c0c6;font-size:11px;margin:18px 8px 8px;letter-spacing:.7px}.navbtn{display:block;background:transparent;border:1px solid transparent;color:#d6e8e9;text-align:right;border-radius:10px;width:100%;padding:9px 11px;font-size:13px;margin:3px 0;line-height:1.7}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.14)}.side-foot{font-size:11px;color:#abc8cd;border-top:1px solid rgba(255,255,255,.14);margin-top:20px;padding-top:16px}.main{min-width:0;padding:25px clamp(14px,3vw,48px) 70px;max-width:1340px;width:100%;margin-inline:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:24px}.crumb{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border-radius:10px;padding:9px 13px;border:1px solid var(--border);background:white;color:var(--ink);font-size:13px;font-weight:bold;line-height:1.65}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--red);border-color:#e7c9c8}.btn.ghost{background:transparent}.btn.small{font-size:12px;padding:6px 10px}.btn:hover:not(:disabled){filter:brightness(.97)}.hero{border-radius:20px;padding:30px;background:linear-gradient(125deg,#13344a,#176762);color:#fff;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;left:-75px;top:-90px;width:280px;height:280px;border:2px solid rgba(255,255,255,.10);border-radius:50%;box-shadow:0 0 0 55px rgba(255,255,255,.03)}h1{font-size:clamp(25px,3vw,37px);line-height:1.5;margin:8px 0}h2{font-size:23px;line-height:1.55;margin:0 0 11px}h3{font-size:17px;line-height:1.55;margin:0 0 9px}.lead{max-width:850px;margin:7px 0;font-size:14px;color:inherit;opacity:.88}.eyebrow{font-size:12px;letter-spacing:1px;font-family:Arial,sans-serif;opacity:.75}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat,.panel,.chapter-card,.case,.question,.note{background:white;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:16px;text-align:center}.stat b{font:700 29px Arial,sans-serif;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{padding:21px;margin:15px 0}.chapter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.chapter-card{padding:18px}.chapter-card h3{margin:0 0 7px}.pill{display:inline-flex;padding:2px 9px;border-radius:999px;background:var(--pale);color:#146b67;font-size:11px;font-weight:bold;margin-bottom:9px}.meta{font-size:12px;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}.tagline{color:var(--accent);font-weight:bold;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.steps{margin:8px 0;padding:0 20px}.steps li{margin:6px 0}.signals{display:flex;gap:7px;flex-wrap:wrap}.signal{display:inline-block;background:#eef3f6;border:1px solid #dde6ea;padding:4px 9px;border-radius:7px;font-family:Arial,sans-serif;font-size:13px;direction:ltr}.notice{border-right:4px solid var(--accent);padding:12px 14px;background:#ebf6f2;border-radius:10px;margin:13px 0}.warning{border-right-color:#b37b32;background:#fff7e8}.de{direction:ltr;text-align:left;font-family:Arial,"Segoe UI",sans-serif;line-height:1.72;unicode-bidi:plaintext;font-size:15px}.de.prompt{font-size:16px;color:#122f40}.source{border:1px solid #d9e5e9;border-radius:12px;padding:16px;margin:10px 0 18px;background:#f8fafb}.source.hidden{background:#f2f6f6;text-align:center;color:var(--muted)}.case{padding:20px;margin:17px 0}.case-title{font-size:13px;font-weight:bold;color:var(--accent)}.question{padding:14px 15px;margin:12px 0;background:#fbfcfc;box-shadow:none}.question strong{display:block;margin-bottom:8px}.options{display:grid;gap:7px}.option{display:flex;align-items:flex-start;gap:10px;background:white;border:1px solid #d9e4e7;border-radius:10px;padding:9px 11px;cursor:pointer;direction:ltr;text-align:left;font-family:Arial,sans-serif;line-height:1.55;font-size:14px}.option:has(input:checked){border-color:var(--accent);background:#e9f6f3}.option input{accent-color:var(--accent);margin-top:4px;flex-shrink:0}.keybox{background:#f4f8f8;border:1px solid #dce5e5;padding:17px;border-radius:12px;margin:10px 0}.reason{padding:9px 12px;border-radius:9px;background:white;border:1px solid #e2e9ec;margin:6px 0;font-size:13px}.reason.right{border-right:3px solid #278b65}.reason.wrong{border-right:3px solid #be7a60}.letters{font-family:Arial,sans-serif;font-weight:bold;direction:ltr;display:inline-block}.split{border:0;border-top:1px solid var(--border);margin:20px 0}.textbox{width:100%;min-height:170px;resize:vertical;border-radius:11px;border:1px solid #d2e0e1;padding:13px;font-family:Arial,sans-serif;font-size:15px;line-height:1.7;background:#fff}.textbox:focus{outline:2px solid #84c9c2}.sample{background:#f4f8f7;padding:15px;border-radius:11px;border:1px solid #dceae5}.progress{height:9px;border-radius:6px;background:#e1e9e8;overflow:hidden}.progress>div{height:100%;background:#258f88;transition:width .3s}.score{font-size:26px;font-weight:bold;color:var(--accent);direction:ltr}.footer{font-size:11px;color:var(--muted);text-align:center;margin:45px 0 5px}.voice-controls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;align-items:center}.voice-controls select{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;max-width:100%;font-size:12px}.exam-top{background:#f0f6f5;border:1px solid #d1e6e0;border-radius:13px;padding:14px;margin:15px 0}.clock{font:700 22px Arial,sans-serif;direction:ltr;color:var(--accent);letter-spacing:1px}.stage{display:inline-block;padding:3px 8px;background:#e7f1ef;border-radius:7px;color:#215c55;font-size:12px}.nav-mobile{display:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:5px 9px;background:white;border:1px solid var(--border);border-radius:8px;font-size:12px}.mini{font-size:12px}.empty{background:#fff8ef;border:1px solid #eddcc0;border-radius:8px;padding:12px}.audio-placeholder{font-size:13px;color:#45636b}.num{font-family:Arial,sans-serif;direction:ltr;display:inline-block}.toasts{position:fixed;bottom:19px;left:20px;background:#183a43;color:white;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:9;font-size:13px;max-width:min(360px,90vw)}

<script id="DATA" type="application/json">{"tags":[["Menge","کمیت‌سازها و نسبت‌ها"],["Modal","اجازه، الزام و احتمال"],["Kausal","همبستگی و علیت"],["Bedingung","شرط و محدودیت"],["Zeit","تغییر زمان و ترتیب"],["Perspektive","نسبت‌دادن دیدگاه"],["Transfer","تعمیم و دامنهٔ شواهد"],["Synthese","ترکیب منابع و پاسخ به سؤال"]],"cases":[{"title":"Offene Forschungsdaten","sub":"نشر داده، محرمانگی و تکرارپذیری","text":"An der fiktiven Hochschule Nordfels wurde im Wintersemester ein Pilotprojekt zur Veröffentlichung von Forschungsdaten durchgeführt. Von 240 eingeladenen wissenschaftlichen Mitarbeitenden beantworteten 160 den Fragebogen. 104 dieser Befragten hatten bereits mindestens einen Datensatz in einem institutsinternen Archiv hinterlegt; 38 hatten ihn zusätzlich öffentlich zugänglich gemacht. Die Befragung bezog sich ausschließlich auf drei naturwissenschaftliche Institute. Nach Angaben des Projektteams nahm die Zahl der archivierten Datensätze während des Piloten zu. Allerdings fehlte eine Vergleichsgruppe, sodass der Anstieg nicht eindeutig dem Projekt zugeschrieben werden kann. Für die öffentliche Freigabe müssen personenbezogene Angaben entweder entfernt oder rechtlich abgesichert werden. Institutsinterne Speicherung ist dagegen auch ohne öffentliche Freigabe möglich. Die Hochschule empfiehlt eine frühzeitige Dokumentation, schreibt aber keine Veröffentlichung aller Datensätze vor. Ein Bericht des Projekts weist darauf hin, dass gut beschriebene Daten leichter von anderen Teams überprüft werden können. Ob dies langfristig tatsächlich zu mehr Wiederholungsstudien führt, wurde nicht gemessen.","audio":"Moderatorin: Im Projektbericht ist von einem erfolgreichen Start die Rede. Was bedeutet das genau? Dr. Mertens: Vor allem, dass mehr Teams ihre Dateien strukturiert ablegen. Daraus folgt nicht automatisch, dass nun alle Daten öffentlich sein sollten. Herr Yilmaz: Ich würde sogar stärker auf verbindliche Dokumentationsstandards setzen. Ohne Angaben zu Messmethode und Version kann kaum jemand die Ergebnisse prüfen. Moderatorin: Wann beginnt die Schulung? Dr. Mertens: Zunächst war der 9. April vorgesehen. Wegen einer Überschneidung mit einer Laborveranstaltung findet sie nun am 16. April statt. Herr Yilmaz: Eine offene Veröffentlichung sollte allerdings nur erfolgen, wenn Datenschutz und Einwilligungen geklärt sind. Dr. Mertens: Das sehe ich genauso; zunächst brauchen wir vor allem klare interne Abläufe.","table":[["Befragte","160"],["Intern archiviert","104"],["Öffentlich zugänglich","38"],["Untersuchte Institute","3"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Welche Aussage trifft auf die Befragten zu?","options":["104 von 240 Eingeladenen veröffentlichten Daten im Internet.","Alle Befragten hatten Daten öffentlich freigegeben.","104 von 160 Befragten hatten mindestens einen Datensatz intern archiviert."],"reasons":["240 bezeichnet Eingeladene; öffentlich veröffentlicht hatten nur 38 Befragte.","38 statt 160 gaben Daten öffentlich frei.","Die 104 beziehen sich auf die 160 Antwortenden und auf internes Archivieren."],"answer":2},{"tag":"Modal","kind":"abgleich","question":"Was verlangt die Hochschule grundsätzlich?","options":["Sie empfiehlt die Dokumentation, verpflichtet aber nicht zur Veröffentlichung sämtlicher Datensätze.","Sie verpflichtet alle Beschäftigten zur sofortigen öffentlichen Veröffentlichung.","Sie untersagt die Speicherung ohne öffentliche Freigabe."],"reasons":["Die Unterscheidung „empfiehlt“ und „schreibt nicht vor“ ist zentral.","Der Text enthält ausdrücklich keine Pflicht zur Veröffentlichung sämtlicher Daten.","Interne Speicherung ist ohne öffentliche Freigabe möglich."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Was lässt sich aus dem beobachteten Anstieg der Archivierungen ableiten?","options":["Die Zahl der Wiederholungsstudien hat sich verdoppelt.","Das Projekt hat den Anstieg nachweislich verursacht.","Ein Anstieg wurde beobachtet; seine Ursache lässt sich ohne Vergleichsgruppe nicht sicher bestimmen."],"reasons":["Wiederholungsstudien wurden nicht gemessen.","Der Text verneint den Nachweis einer eindeutigen Ursache.","Ohne Kontrollgruppe lässt sich der Effekt nicht eindeutig zuordnen."],"answer":2},{"tag":"Bedingung","kind":"lesen","question":"Unter welcher Voraussetzung ist die öffentliche Freigabe möglich?","options":["Sobald Daten intern gespeichert wurden, ohne weitere Prüfung.","Wenn personenbezogene Angaben entfernt oder rechtlich abgesichert sind.","Nur wenn auch eine Vergleichsgruppe untersucht wurde."],"reasons":["Interne Speicherung allein genügt nicht für öffentliche Freigabe.","Datenschutzrechtliche Voraussetzung wird ausdrücklich genannt.","Kontrollgruppen betreffen Wirkungsanalyse, nicht Veröffentlichung."],"answer":1},{"tag":"Zeit","kind":"hoeren","question":"Wann findet die Schulung nach aktuellem Plan statt?","options":["Im Wintersemester ohne konkreten Termin.","Am 16. April.","Am 9. April."],"reasons":["Der Projektzeitraum ist nicht der aktuelle Schulungstermin.","Die Sprecherin korrigiert den ursprünglichen Termin auf den 16. April.","Der 9. April war nur der ursprüngliche Plan."],"answer":1},{"tag":"Perspektive","kind":"hoeren","question":"Wer fordert verbindliche Dokumentationsstandards besonders deutlich?","options":["Dr. Mertens.","Die Moderatorin.","Herr Yilmaz."],"reasons":["Mertens betont eher interne Abläufe und Freigabevorsicht.","Die Moderatorin stellt Fragen, fordert dies aber nicht.","Yilmaz sagt „stärker auf verbindliche Dokumentationsstandards setzen“."],"answer":2},{"tag":"Transfer","kind":"lesen","question":"Welche Verallgemeinerung ist durch den Bericht NICHT gedeckt?","options":["Die Befragung erfasste drei naturwissenschaftliche Institute.","Der langfristige Effekt auf Wiederholungsstudien blieb ungeklärt.","Alle deutschen Hochschulen würden von einer verpflichtenden Veröffentlichung profitieren."],"reasons":["Das steht explizit im Text und ist daher gedeckt.","Der Bericht erwähnt die fehlende Langzeitmessung.","Eine begrenzte Stichprobe und fehlende Wirkungsmessung erlauben keinen bundesweiten Schluss."],"answer":2},{"tag":"Synthese","kind":"abgleich","question":"Welche Zusammenfassung passt am besten zu Text und Gespräch?","options":["Es geht ausschließlich darum, alle Forschenden zu einer Schulung am 9. April einzuladen.","Dokumentation hilft bei der Überprüfung, öffentliche Freigaben benötigen aber Schutzvorkehrungen; die Wirkung ist noch nicht bewiesen.","Öffentliche Freigabe ist in allen Fällen Pflicht und führt bereits messbar zu mehr Wiederholungen."],"reasons":["Beschränkt den Gegenstand falsch und nennt den alten Termin.","Verbindet Vorteil, Bedingung und Grenzen der Evidenz aus beiden Quellen.","Pflicht und gemessene Wiederholungsstudien sind erfunden."],"answer":1}],"prompt1":"Sollten Hochschulen die Veröffentlichung anonymisierter Forschungsdaten verpflichtend machen? Erörtern Sie Chancen und Risiken und begründen Sie Ihren Standpunkt. Schreiben Sie mindestens 200 Wörter.","prompt2":"Fassen Sie die wesentlichen Ergebnisse des Textes und der Tabelle zum Pilotprojekt zusammen. Trennen Sie beobachtete Entwicklungen und nicht nachgewiesene Wirkungen. Schreiben Sie etwa 100–150 Wörter.","speech":"Ihre Kommilitonin möchte Forschungsdaten ohne Prüfung öffentlich hochladen. Geben Sie ihr einen begründeten Rat in 45 Sekunden.","model1":"Die Forderung, anonymisierte Forschungsdaten grundsätzlich öffentlich zugänglich zu machen, erscheint auf den ersten Blick überzeugend. Wenn Daten gut dokumentiert sind, können andere Forschungsgruppen Ergebnisse überprüfen, zusätzliche Fragestellungen untersuchen und möglicherweise unnötige Wiederholungen vermeiden. Öffentliche Finanzierung könnte zudem ein Argument dafür sein, wissenschaftliche Ergebnisse möglichst breit zugänglich zu machen. Ein wichtiger Vorteil besteht also in der Nachvollziehbarkeit der Forschung. Allerdings ist eine verpflichtende Veröffentlichung nicht in jeder Situation sinnvoll. Erstens reicht es nicht aus, Namen aus einer Datei zu entfernen: Gerade kleine Datensätze können in Verbindung mit anderen Informationen Rückschlüsse auf einzelne Personen ermöglichen. Zweitens entstehen erhebliche Kosten für die Beschreibung, Pflege und langfristige Speicherung. Drittens können Forschungsteams mit vertraulichen Kooperationspartnern rechtlich begrenzt sein. Meiner Ansicht nach sollten Hochschulen deshalb eine abgestufte Regelung einführen. Zunächst müssten Forschende ihre Daten strukturiert dokumentieren und intern sicher archivieren. Eine öffentliche Freigabe sollte dann erfolgen, sofern Datenschutz, Rechte Dritter und technische Qualität geklärt sind. Wo eine Veröffentlichung nicht möglich ist, könnten Metadaten oder begründete Zugangsbeschränkungen Transparenz schaffen. Darüber hinaus wäre es wichtig, den tatsächlichen Nutzen des Systems systematisch zu untersuchen: Mehr archivierte Dateien allein beweisen noch nicht, dass Forschung automatisch reproduzierbarer wird. Insgesamt befürworte ich offene Forschungsdaten als Regelfall, aber nicht als bedingungslose Verpflichtung.  Eine solche Vorgehensweise verlangt zwar zusätzliche Ressourcen, ermöglicht aber eine nachvollziehbare Entscheidung und schützt das Vertrauen in wissenschaftliche Ergebnisse.","model2":"Das fiktive Pilotprojekt einer Hochschule untersuchte die Dokumentation und Veröffentlichung von Forschungsdaten an drei naturwissenschaftlichen Instituten. Von 240 eingeladenen wissenschaftlichen Mitarbeitenden beteiligten sich 160 an der Befragung. Unter ihnen hatten 104 mindestens einen Datensatz intern archiviert; 38 hatten Daten zusätzlich öffentlich zugänglich gemacht. Der Bericht beschreibt einen Anstieg der Zahl archivierter Datensätze während des Projekts. Allerdings wurde keine Vergleichsgruppe untersucht, weshalb die beobachtete Entwicklung nicht eindeutig auf die Einführung des Projekts zurückgeführt werden kann. Für die öffentliche Freigabe müssen personenbezogene Angaben entfernt oder rechtlich abgesichert werden. Die Hochschule empfiehlt eine frühzeitige Dokumentation, macht jedoch die Veröffentlichung sämtlicher Daten nicht zur Pflicht. Ob die bessere Archivierung langfristig zu mehr Wiederholungsstudien führt, blieb offen.","modelSpeech":"Der Text beschreibt ein Pilotprojekt zu Forschungsdaten. Von 160 Antwortenden archivierten 104 intern Daten, aber nur 38 machten sie öffentlich. Eine solche Unterscheidung ist wichtig, denn Archivierung und Veröffentlichung sind unterschiedliche Schritte. Der beobachtete Anstieg kann nicht eindeutig dem Projekt zugeschrieben werden, weil eine Vergleichsgruppe fehlt. Auch die Zahl erfolgreicher Wiederholungsstudien wurde nicht gemessen. Ein verantwortliches System sollte deshalb Datensicherheit und ausreichende Dokumentation verbinden.","review":"نکتهٔ مرکزی: «intern archivieren» با «öffentlich veröffentlichen» متفاوت است. تعداد ۱۰۴ مربوط به آرشیو داخلی از ۱۶۰ پاسخ‌دهنده است، نه کل دعوت‌شدگان؛ هیچ گروه کنترلی وجود ندارد.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":45,"prepSeconds":30,"speakType":"Rat geben","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"در این پرونده ۱۶۰ نفر از ۲۴۰ پژوهشگر دعوت‌شده پاسخ داده‌اند. ۱۰۴ نفر داده را داخلی آرشیو کرده‌اند، اما تنها ۳۸ نفر آن را عمومی منتشر کرده‌اند. افزایش آرشیو بدون گروه مقایسه نمی‌تواند به‌طور قطعی معلول خود پروژه باشد. انتشار عمومی هم به حذف یا حفاظت قانونی داده‌های شخصی وابسته است. مقالهٔ نمونه از انتشار مسئولانه دفاع می‌کند، نه انتشار بی‌قیدوشرط.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Hitzeinseln auf dem Campus","sub":"اندازه‌گیری دما، مداخله و اثر شرایط محیطی","text":"Im Rahmen einer Lehrveranstaltung untersuchte eine fiktive Universität die Temperaturunterschiede auf ihrem Campus. An zwölf Sommertagen wurden jeweils um 14 Uhr Messungen an vier Orten durchgeführt. Im Mittel lag die Temperatur auf dem unbeschatteten Platz bei 34 Grad Celsius, unter den Bäumen bei 30 Grad und im begrünten Innenhof bei 31 Grad. Diese Zahlen beschreiben unterschiedliche Messorte, nicht die Entwicklung desselben Ortes vor und nach einer Maßnahme. Die Projektgruppe schlug mobile Sonnensegel für den Platz vor. Für deren dauerhafte Montage wäre jedoch eine Genehmigung der Gebäudeverwaltung erforderlich. Kleinere bewegliche Schirme dürfen vorübergehend aufgestellt werden, wenn Fluchtwege freibleiben. Die Befragung von 90 freiwilligen Teilnehmenden ergab, dass 58 Personen mehr Schattenplätze wünschten. Das Projektteam betonte, dass die Teilnehmergruppe nicht repräsentativ für alle Hochschulangehörigen sei. Zudem könnten Wind, Untergrund und Sonneneinstrahlung die gemessenen Unterschiede beeinflusst haben; eine eindeutige Kausalwirkung einzelner Faktoren wurde nicht untersucht.","audio":"Sprecher: Die studentische Gruppe möchte möglichst rasch Sonnensegel installieren. Frau Brandt, wie bewerten Sie den Plan? Brandt: Ich halte den Vorschlag für sinnvoll, aber die Gebäudeverwaltung muss eine dauerhafte Anlage erst genehmigen. Professor Klein: Mich überzeugt vor allem, dass mehrere Orte systematisch verglichen wurden. Dennoch fehlen Vergleichsmessungen bei gleicher Beschattung und gleichem Untergrund. Sprecher: Wann soll das Konzept vorgestellt werden? Brandt: Ursprünglich am 3. Juni. Wegen der Prüfungswoche wurde die Präsentation auf den 10. Juni verlegt. Professor Klein: Mobile Schirme könnten wir vorher testen, solange Rettungswege frei bleiben. Brandt: Das wäre ein guter Zwischenschritt; ein Test darf die Genehmigung für eine feste Anlage aber nicht ersetzen.","table":[["Offener Platz","34 °C"],["Unter Bäumen","30 °C"],["Begrünter Hof","31 °C"],["Schattenwunsch","58 von 90"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Befragte wünschten mehr Schattenplätze?","options":["58 von 90 freiwillig Befragten.","58 von allen Hochschulangehörigen.","90 von 58 Teilnehmenden."],"reasons":["Zähler und Nenner stehen explizit im Text.","Die Befragung ist freiwillig und nicht hochschulweit repräsentativ.","Nenner und Zähler wurden vertauscht."],"answer":0},{"tag":"Modal","kind":"abgleich","question":"Welche Maßnahme ist unter genannten Bedingungen ohne dauerhafte Montagegenehmigung denkbar?","options":["Eine dauerhaft verschraubte Konstruktion ohne Genehmigung.","Vorübergehende bewegliche Schirme, sofern Fluchtwege frei bleiben.","Die beliebige Sperrung sämtlicher Fluchtwege."],"reasons":["Dauerhafte Anlagen benötigen Genehmigung.","Bewegliche Schirme dürfen bei freibleibenden Wegen genutzt werden.","Freie Rettungswege sind eine ausdrücklich genannte Bedingung."],"answer":1},{"tag":"Kausal","kind":"lesen","question":"Was zeigt der Temperaturvergleich NICHT?","options":["Dass der offene Platz wärmer gemessen wurde als der Bereich unter Bäumen.","Dass das Anpflanzen von Bäumen am selben Ort genau vier Grad Abkühlung verursacht.","Dass sich die mittleren Messwerte zwischen Orten unterscheiden."],"reasons":["34 °C und 30 °C sind direkt angegeben.","Unterschiedliche Orte wurden verglichen, keine Intervention an identischem Ort.","Messwerte verschiedener Orte stehen in der Tabelle."],"answer":1},{"tag":"Bedingung","kind":"lesen","question":"Was gilt für dauerhaft installierte Sonnensegel?","options":["Sie können jederzeit ohne Abstimmung angebracht werden.","Ihre Montage erfordert die Genehmigung der Gebäudeverwaltung.","Sie werden nur erlaubt, wenn 90 Personen sie unterstützen."],"reasons":["Die Genehmigungspflicht wird geleugnet.","Der Genehmigungsvorbehalt steht ausdrücklich im Text.","Eine Zustimmungsquote wird nicht als Bedingung genannt."],"answer":1},{"tag":"Zeit","kind":"hoeren","question":"Wann soll die Präsentation stattfinden?","options":["Erst im folgenden Semester.","Am 10. Juni.","Am 3. Juni."],"reasons":["Ein Termin im nächsten Semester wird nicht erwähnt.","Wegen der Prüfungswoche verschoben auf den 10. Juni.","3. Juni war der alte Termin."],"answer":1},{"tag":"Perspektive","kind":"hoeren","question":"Wer kritisiert die fehlende Vergleichbarkeit von Untergrund und Beschattung?","options":["Frau Brandt.","Der Sprecher.","Professor Klein."],"reasons":["Brandt betont vor allem Genehmigung und pragmatische Umsetzung.","Der Sprecher stellt Fragen.","Klein erwähnt die fehlenden Vergleichsmessungen."],"answer":2},{"tag":"Transfer","kind":"lesen","question":"Warum lässt sich das Umfrageergebnis nicht auf alle Hochschulangehörigen übertragen?","options":["Weil Fluchtwege grundsätzlich geschlossen sind.","Weil nur eine freiwillige, nicht repräsentative Gruppe von 90 Personen befragt wurde.","Weil im Hof genau 31 Grad gemessen wurden."],"reasons":["Der Text verlangt gerade freie Fluchtwege.","Die Auswahl der Befragten begrenzt die Verallgemeinerung.","Temperaturwerte entscheiden nicht über Repräsentativität."],"answer":1},{"tag":"Synthese","kind":"abgleich","question":"Welche Schlussfolgerung verbindet die Quellen sachgerecht?","options":["Die Messungen beweisen die exakte Wirkung fester Sonnensegel und ersetzen Genehmigungen.","Weil die Mehrheit der Befragten Schatten wünscht, wurde der gesamte Campus bereits umgebaut.","Die Beobachtungen begründen einen Test von Schattenspendern, aber keine eindeutige Wirkungsbehauptung oder Genehmigungsfreiheit."],"reasons":["Keine Messung der Wirksamkeit fester Sonnensegel; Genehmigung bleibt erforderlich.","Kein Campusumbau wurde berichtet.","Die Schlussfolgerung berücksichtigt Messgrenzen und Verwaltungsregeln."],"answer":2}],"prompt1":"Sollten Hochschulen vor allem in technische Klimaanlagen oder in natürliche Maßnahmen wie Bäume und Begrünung investieren? Argumentieren Sie abwägend (mindestens 200 Wörter).","prompt2":"Fassen Sie die Messungen, die Befragung und die wichtigsten Einschränkungen der Aussagekraft aus Text und Tabelle in 100–150 Wörtern zusammen.","speech":"Sie sollen zwischen festen Sonnensegeln und mobilen Schirmen wählen. Wägen Sie die Optionen in 90 Sekunden ab und empfehlen Sie eine Lösung.","model1":"Viele Universitäten stehen vor der Aufgabe, ihre Gebäude und Freiflächen an häufigere Hitzeperioden anzupassen. Dabei stellt sich die Frage, ob technische Klimaanlagen oder natürliche Maßnahmen wie Bäume und Begrünung Vorrang haben sollten. Klimaanlagen können in Laboren oder Räumen mit empfindlichen Geräten notwendig sein, weil dort bestimmte Temperaturen zuverlässig eingehalten werden müssen. Ihr Nachteil besteht jedoch darin, dass sie Strom benötigen und häufig nur Innenräume kühlen. Begrünte Flächen können dagegen Schatten bieten, das Aufenthaltsklima verbessern und zugleich Räume für Begegnungen schaffen. Auch die Gestaltung des Bodens und die Verfügbarkeit von Wasser spielen eine Rolle. Allerdings benötigen Bäume Zeit zum Wachsen, und ihre Wirkung hängt von Standort, Pflege und Wetterbedingungen ab. Ein Pilotprojekt, bei dem verschiedene Campusorte gleichzeitig gemessen werden, kann erste Hinweise liefern, aber nicht den isolierten Effekt einer späteren Baumpflanzung beweisen. Ich würde daher eine Kombination empfehlen: Vorrang für langfristige Maßnahmen wie Entsiegelung und Begrünung, ergänzt durch technische Kühlung dort, wo sie aus Sicherheits- oder Forschungsgründen notwendig ist. Vor der Investition sollten Hochschulen die tatsächliche Nutzung der Flächen, Pflegekosten sowie messbare Wirkungen verschiedener Maßnahmen prüfen. Eine transparente Evaluation verhindert, dass aus einzelnen Beobachtungen voreilige Schlussfolgerungen gezogen werden. So lässt sich nicht nur die Temperatur, sondern auch die Aufenthaltsqualität nachhaltig verbessern.  Dafür sollten Studierende und Beschäftigte an der Planung beteiligt werden, denn eine langfristig wirksame Maßnahme muss auch im Alltag akzeptiert werden.","model2":"An einer fiktiven Universität wurden an zwölf Sommertagen die Temperaturen an vier Campusorten verglichen. Der unbeschattete Platz erreichte im Mittel 34 Grad Celsius, der Bereich unter Bäumen 30 Grad und ein begrünter Innenhof 31 Grad. Die Ergebnisse zeigen damit Unterschiede zwischen verschiedenen Orten, nicht den Effekt einer konkreten Maßnahme am selben Standort. Von 90 freiwillig Befragten wünschten 58 zusätzliche Schattenplätze. Da die Stichprobe nicht repräsentativ war, lässt sich dieses Ergebnis nicht ohne Weiteres auf alle Hochschulangehörigen übertragen. Als mögliche Maßnahme wurden Sonnensegel vorgeschlagen. Für eine dauerhafte Montage wäre eine Genehmigung erforderlich; bewegliche Schirme dürfen nur eingesetzt werden, wenn Fluchtwege frei bleiben. Weitere Messungen müssten Unterschiede von Untergrund, Wind und Sonneneinstrahlung berücksichtigen.","modelSpeech":"Die Tabelle vergleicht unterschiedliche Orte auf einem Campus. Der offene Platz war mit durchschnittlich 34 Grad wärmer als die Fläche unter Bäumen mit 30 Grad. Das ist ein beobachteter Unterschied von vier Grad zwischen zwei Standorten. Daraus kann man jedoch nicht schließen, dass die Pflanzung eines Baumes an genau diesem Platz immer vier Grad Abkühlung bewirken würde. Unterschiedliche Untergründe und Windverhältnisse könnten mitwirken. Sinnvoll wäre daher ein kontrollierter Vergleich vor und nach einer Maßnahme.","review":"«۴ درجه Unterschied» یعنی تفاوت میان دو مکان در همان زمان، نه لزوماً اثر علّی کاشت درخت در یک محل. به انتخاب داوطلبانهٔ نمونه و شرط آزادبودن مسیر خروج توجه کن.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":90,"prepSeconds":45,"speakType":"Optionen abwägen","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"اندازه‌گیری در چند نقطهٔ متفاوت نشان می‌دهد میدان بدون سایه گرم‌تر از فضای زیر درخت بوده است. این نتیجه اثر کاشت یک درخت در همان محل را ثابت نمی‌کند. در نظرسنجی ۵۸ نفر از ۹۰ شرکت‌کنندهٔ داوطلب سایهٔ بیشتر خواسته‌اند. مقاله پیشنهاد می‌کند راهکارهای طبیعی و فنی به‌صورت مکمل و با ارزیابی کنترل‌شده اجرا شوند.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Peer-Mentoring im ersten Semester","sub":"تطبیق گروه‌ها و ارزیابی اثر آموزش همتا","text":"Eine fiktive Fachhochschule führte ein freiwilliges Mentoringprogramm für neue Studierende ein. Von 300 Studienanfängerinnen und Studienanfängern meldeten sich 120 an; 96 besuchten mindestens drei Treffen. In einer anonymen Onlinebefragung erklärten 70 dieser 96 Personen, sie fühlten sich mit dem Studienalltag besser vertraut. Da sich die Teilnehmenden freiwillig anmeldeten, kann ihre Motivation bereits vor Programmstart höher gewesen sein als die der übrigen Studierenden. Es gab keine zufällige Zuteilung und keine aussagekräftige Kontrollgruppe. Die Organisatoren wollten zunächst die Zahl der Teilnehmenden erhöhen und erst später Leistungsdaten vergleichen. Mentorinnen und Mentoren müssen vor ihrem ersten Einsatz eine zweistündige Schulung besuchen. Für neue Studierende ist die Teilnahme am Mentoring dagegen ausdrücklich freiwillig. Beratungen zu psychischen Belastungen werden nicht von den Mentoren ersetzt; bei Bedarf verweisen sie an professionelle Stellen. Der Bericht zeigt also subjektiv wahrgenommenen Nutzen, aber noch keinen Nachweis besserer Prüfungsleistungen.","audio":"Moderator: Wie beurteilen Sie das Programm, Frau Roth? Roth: Es erleichtert vielen den Einstieg, besonders bei Stundenplan und Bibliothek. Wir sollten es aber nicht mit einer psychologischen Beratung verwechseln. Dr. Nguyen: Mir fehlen Vergleichsdaten. Wer freiwillig kommt, ist möglicherweise ohnehin stärker engagiert. Moderator: Wann ist die nächste Schulung? Roth: Zuerst war der 21. September geplant. Wegen einer Einführungsveranstaltung verschieben wir sie auf den 28. September. Dr. Nguyen: Ich würde zunächst eine Vergleichsstudie planen, bevor wir über bessere Noten sprechen. Roth: Für die praktische Orientierung haben wir bereits erfreuliche Rückmeldungen.","table":[["Studienanfänger","300"],["Angemeldet","120"],["Mindestens 3 Treffen","96"],["Positives Feedback","70 von 96"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Auf welche Gruppe bezieht sich das positive Feedback von 70 Personen?","options":["Auf alle 300 Studienanfänger.","Auf 96 Personen, die mindestens drei Treffen besuchten.","Auf die 120 Mentoren."],"reasons":["Es ist keine Befragung aller 300.","70 von 96 mit mindestens drei Treffen ist die Bezugsgröße.","120 sind angemeldete Studierende, nicht Mentoren."],"answer":1},{"tag":"Modal","kind":"abgleich","question":"Wer muss an einer zweistündigen Schulung teilnehmen?","options":["Alle Fachkräfte der psychologischen Beratung.","Alle neuen Studierenden vor ihrer Anmeldung.","Mentorinnen und Mentoren vor ihrem ersten Einsatz."],"reasons":["Die Tätigkeit professioneller Stellen wird nicht reguliert.","Mentoring ist für neue Studierende freiwillig.","Diese Voraussetzung ist ausdrücklich für Mentoren formuliert."],"answer":2},{"tag":"Kausal","kind":"lesen","question":"Warum darf man noch nicht behaupten, Mentoring verbessere die Noten?","options":["Die Mentoren müssen zwei Stunden lernen.","Es haben weniger als 300 Personen teilgenommen.","Eine geeignete Vergleichsgruppe und Daten zu Prüfungsleistungen fehlen."],"reasons":["Schulungsdauer ist keine Evidenz über Noten.","Allein die Zahl der Teilnehmenden beantwortet Kausalfrage nicht.","Ohne Vergleichsgruppe und Leistungsdaten fehlt der Wirkungsnachweis."],"answer":2},{"tag":"Bedingung","kind":"lesen","question":"Welche Voraussetzung gilt vor dem Einsatz als Mentor?","options":["Mindestens drei besuchte Mentorentreffen als Studienanfänger.","Eine bestandene psychologische Abschlussprüfung.","Die Teilnahme an einer zweistündigen Schulung."],"reasons":["Drei Treffen beziehen sich auf Teilnehmende, nicht Mentorenzulassung.","Eine entsprechende Prüfung wird nicht erwähnt.","Die Schulungspflicht steht im Text."],"answer":2},{"tag":"Zeit","kind":"hoeren","question":"Wann findet die nächste Schulung statt?","options":["Am 28. September.","Am 21. September.","Erst nach der nächsten Prüfungsphase."],"reasons":["Roth nennt den 28. September als neuen Termin.","21. September wurde verschoben.","Ein Termin nach Prüfungen wird nicht erwähnt."],"answer":0},{"tag":"Perspektive","kind":"hoeren","question":"Wer fordert zusätzliche Vergleichsdaten vor Aussagen über Prüfungsnoten?","options":["Dr. Nguyen.","Der Moderator.","Frau Roth."],"reasons":["Nguyen verlangt Vergleichsstudie und warnt vor Motivationseffekt.","Der Moderator fragt nur nach Einschätzungen.","Roth hebt Orientierungshilfe und Feedback hervor."],"answer":0},{"tag":"Transfer","kind":"lesen","question":"Welche Aussage wäre eine unzulässige Verallgemeinerung?","options":["120 von 300 Erstsemestern meldeten sich an.","70 Prozent aller Studierenden bestehen dank Mentoring ihre Prüfungen.","96 Angemeldete besuchten mindestens drei Treffen."],"reasons":["Anmeldungen sind genau beziffert.","Keine entsprechende Leistungsmessung; Bezugsgruppen werden vermischt.","Die 96 werden im Text genannt."],"answer":1},{"tag":"Synthese","kind":"abgleich","question":"Was ist die sachgerechte Gesamtaussage beider Quellen?","options":["Das Programm wird positiv erlebt, aber seine Wirkung auf Prüfungsergebnisse bleibt ungeklärt.","Das Programm ersetzt professionelle Beratungsangebote vollständig.","Mentoring hat nachweislich die Prüfungsnoten sämtlicher Studierender verbessert."],"reasons":["Subjektiver Nutzen ist erkennbar, ein Noteneffekt wurde nicht nachgewiesen.","Text und Roth grenzen psychologische Beratung explizit ab.","Noten wurden noch nicht verglichen."],"answer":0}],"prompt1":"Sollten Hochschulen für alle Erstsemester verpflichtendes Peer-Mentoring einführen? Diskutieren Sie Nutzen, Grenzen und mögliche Alternativen (mindestens 200 Wörter).","prompt2":"Fassen Sie die Beteiligungszahlen, das Feedback und die methodischen Grenzen des Programms anhand von Text und Tabelle in 100–150 Wörtern zusammen.","speech":"Lesen Sie den Bericht über das Mentoringprogramm vier Minuten und fassen Sie ihn danach in zwei Minuten zusammen. Nennen Sie die Einschränkung der Untersuchung.","model1":"Ein verpflichtendes Mentoringprogramm für alle Erstsemester könnte die Orientierung an Hochschulen erleichtern. Wer neu an einer Universität ist, muss zahlreiche Entscheidungen treffen: Lehrveranstaltungen wählen, Prüfungsordnungen verstehen und Kontakte aufbauen. Erfahrene Studierende können dabei praktische Hinweise geben, die in offiziellen Informationsveranstaltungen manchmal zu kurz kommen. Außerdem kann regelmäßiger Austausch das Gefühl verringern, mit Anfangsschwierigkeiten allein zu sein. Trotzdem halte ich eine vollständige Teilnahmepflicht nicht für sinnvoll. Nicht alle Erstsemester haben dieselben Bedürfnisse. Manche verfügen bereits über Studienerfahrung, andere arbeiten neben dem Studium oder haben familiäre Verpflichtungen. Eine Pflicht könnte für diese Gruppen unnötige Belastungen verursachen. Zudem dürfen Mentorinnen und Mentoren professionelle Beratungsstellen nicht ersetzen, besonders bei finanziellen oder psychischen Krisen. Hinzu kommt ein methodisches Problem: Positive Rückmeldungen von freiwillig teilnehmenden Personen beweisen noch nicht, dass das Programm bessere Prüfungsnoten verursacht. Diese Personen könnten schon zuvor motivierter gewesen sein. Meiner Meinung nach sollten Hochschulen Mentoring deshalb deutlich bewerben und allen leicht zugänglich machen, aber grundsätzlich freiwillig gestalten. Für Mentorinnen und Mentoren sind Schulungen sowie klare Regeln zur Weitervermittlung an Fachstellen notwendig. Schließlich wäre eine sorgfältige Evaluation hilfreich, die sowohl Zufriedenheit als auch längerfristige Ergebnisse erfasst. So ließe sich die Maßnahme verbessern, ohne aus begrenzten Befragungen zu weitreichende Behauptungen abzuleiten.  Vor einer hochschulweiten Einführung sollten deshalb auch Belastung und Nutzen für unterschiedliche Gruppen sorgfältig und über längere Zeit erfasst werden.","model2":"In dem fiktiven Mentoringprojekt einer Fachhochschule meldeten sich 120 von 300 Studienanfängerinnen und Studienanfängern freiwillig an. Von den Angemeldeten nahmen 96 an mindestens drei Treffen teil. Unter diesen 96 Personen berichteten 70, sie fühlten sich im Studienalltag besser orientiert. Das ist ein Hinweis auf subjektiv wahrgenommenen Nutzen, aber noch kein Beleg für bessere Prüfungsleistungen. Da die Teilnahme freiwillig erfolgte, könnte die Ausgangsmotivation der Teilnehmenden höher gewesen sein. Eine zufällige Zuteilung und eine geeignete Vergleichsgruppe fehlten. Mentorinnen und Mentoren müssen eine zweistündige Schulung absolvieren. Für neue Studierende bleibt die Teilnahme freiwillig; professionelle psychologische Beratung wird nicht ersetzt. Weitere Studien müssten Leistungsentwicklung und Ausgangsunterschiede berücksichtigen.","modelSpeech":"Das Projekt zeigt, dass sich viele Teilnehmende besser orientiert fühlen. Von 300 Studienanfängern meldeten sich 120 freiwillig an. 96 besuchten mindestens drei Treffen und 70 dieser Personen berichteten von einem positiven Orientierungseffekt. Man darf diese Zahl nicht auf alle Studierenden übertragen. Vor allem wurden weder Noten verglichen noch Teilnehmende zufällig ausgewählt. Ein Mentoringprogramm kann praktische Fragen beantworten, ersetzt aber keine professionelle Beratung. Ich würde deshalb zunächst eine bessere Evaluation empfehlen.","review":"«۷۰ von ۹۶» ≠ «۷۰ از ۳۰۰». «fühlen sich vertrauter» بیان تجربه است و مساوی «bessere Prüfungsnoten» نیست. خودگزینی داوطلبانه نمونه را جانبدارانه می‌کند.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":120,"prepSeconds":240,"speakType":"Text zusammenfassen","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"از ۳۰۰ دانشجوی تازه‌وارد، ۱۲۰ نفر داوطلب برنامه شده‌اند و ۹۶ نفر دست‌کم سه جلسه حضور داشته‌اند. ۷۰ نفر از همین ۹۶ نفر احساس جهت‌یابی بهتری داشته‌اند؛ این موضوع اثبات بهبود نمرات امتحان نیست. مقاله می‌گوید برنامهٔ راهنمایی همتا بهتر است داوطلبانه و با آموزش راهنمایان و ارجاع به مشاورهٔ تخصصی باشد.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Digitale Sprechstunden","sub":"دسترسی آموزشی، حریم خصوصی و تفاوت استفاده","text":"In einem fiktiven Fachbereich wurden über zwölf Wochen digitale Sprechstunden erprobt. Insgesamt 210 Studierende nutzten das Angebot mindestens einmal, 54 meldeten sich zu mehr als drei Terminen an. Die durchschnittliche Wartezeit für eine Antwort sank nach Einführung des Buchungssystems von sechs auf vier Tage. Während desselben Zeitraums wurde allerdings auch zusätzliches Personal eingestellt. Deshalb lässt sich der Rückgang der Wartezeit nicht allein dem Buchungssystem zuschreiben. Die digitale Sprechstunde darf für allgemeine organisatorische Fragen genutzt werden. Vertrauliche Prüfungsangelegenheiten müssen über den geschützten Hochschulkanal geklärt werden; private Messenger sind dafür nicht zugelassen. Die Lehrenden müssen mindestens einen Termin pro Woche anbieten, Studierende sind jedoch nicht verpflichtet, ihn wahrzunehmen. Eine Befragung von 80 Personen, die das Angebot verwendet hatten, zeigte hohe Zufriedenheit. Ob Studierende ohne Nutzung ähnlich zufrieden gewesen wären, wurde nicht untersucht. Der Bericht empfiehlt deshalb, die digitale Lösung zu ergänzen statt alle Präsenzgespräche abzuschaffen.","audio":"Moderatorin: Die Wartezeit ist um zwei Tage gesunken. Ist die Software dafür verantwortlich? Frau Stein: Vielleicht teilweise. Aber wir haben gleichzeitig eine zusätzliche halbe Stelle geschaffen. Herr Abbas: Für mich ist wichtig, dass digitale Termine nicht zum einzigen Weg werden. Gerade bei sensiblen Anliegen brauchen Studierende persönliche Alternativen. Moderatorin: Wann werden die neuen Datenschutzregeln vorgestellt? Frau Stein: Ursprünglich am 4. November, jetzt am 11. November. Herr Abbas: Und selbstverständlich dürfen vertrauliche Prüfungsdaten nicht über private Messenger geschickt werden. Frau Stein: Ja, dafür ist unser geschütztes System vorgesehen.","table":[["Einmalige Nutzung","210"],["Mehr als 3 Termine","54"],["Wartezeit vorher","6 Tage"],["Wartezeit danach","4 Tage"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Personen nutzten das Angebot mehr als dreimal?","options":["54.","210.","80."],"reasons":["54 meldeten sich zu mehr als drei Terminen an.","210 nutzten das Angebot mindestens einmal.","80 waren Teil einer Befragung unter Nutzenden."],"answer":0},{"tag":"Modal","kind":"abgleich","question":"Welche Aussage zu Terminen ist richtig?","options":["Lehrende müssen wöchentlich mindestens einen Termin anbieten; Studierende müssen ihn nicht nutzen.","Lehrende dürfen überhaupt keine Präsenztermine anbieten.","Studierende müssen jede Woche teilnehmen."],"reasons":["Verpflichtung gilt für Lehrende, nicht für Nutzung durch Studierende.","Das Angebot soll Präsenz ergänzen, nicht verbieten.","Teilnahme ist explizit freiwillig."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Warum ist die Wirkung des Buchungssystems auf die Wartezeit nicht eindeutig?","options":["Weil die Wartezeit nach der Einführung anstieg.","Weil zeitgleich Personal aufgestockt wurde.","Weil alle Studierenden private Messenger nutzen mussten."],"reasons":["Sie sank von sechs auf vier Tage.","Zusätzliche Mitarbeitende sind eine mögliche alternative Erklärung.","Private Messenger sind für vertrauliche Angaben verboten."],"answer":1},{"tag":"Bedingung","kind":"lesen","question":"Wie sind vertrauliche Prüfungsangelegenheiten zu behandeln?","options":["Nur öffentlich im Seminarforum.","Über den geschützten Hochschulkanal.","Über frei wählbare private Messenger."],"reasons":["Eine öffentliche Veröffentlichung wäre dem Schutz widersprechend.","Explizit vorgegebener sicherer Kanal.","Private Messenger sind ausgeschlossen."],"answer":1},{"tag":"Zeit","kind":"hoeren","question":"Wann werden die Datenschutzregeln nun vorgestellt?","options":["Am 4. November.","Am 1. Dezember.","Am 11. November."],"reasons":["4. November war ursprünglich vorgesehen.","1. Dezember kommt im Gespräch nicht vor.","11. November ist der korrigierte Termin."],"answer":2},{"tag":"Perspektive","kind":"hoeren","question":"Wer betont besonders die Notwendigkeit persönlicher Alternativen?","options":["Die Moderatorin.","Frau Stein.","Herr Abbas."],"reasons":["Moderatorin fragt nach Ursachen und Terminen.","Stein spricht über Personal und sicheren Kanal.","Abbas warnt vor rein digitaler Lösung."],"answer":2},{"tag":"Transfer","kind":"lesen","question":"Warum kann die Zufriedenheit der Nutzenden nicht für alle Studierenden stehen?","options":["Weil das Buchungssystem zwölf Wochen lang erprobt wurde.","Weil die Wartezeit genau vier Tage beträgt.","Befragt wurden nur 80 Personen, die das Angebot bereits genutzt hatten."],"reasons":["Die Dauer behebt die Auswahleinschränkung nicht.","Wartezeit ist kein Repräsentativitätsnachweis.","Nichtnutzende fehlen als Vergleichsgruppe."],"answer":2},{"tag":"Synthese","kind":"abgleich","question":"Welche Empfehlung berücksichtigt Text und Gespräch am besten?","options":["Digitale Sprechstunden ergänzen Präsenzangebote; vertrauliche Fälle brauchen geschützte Kanäle und Wirkungen weitere Prüfung.","Die Präsenzberatung abschaffen, da das System alle Probleme nachweislich löst.","Alle vertraulichen Anliegen über private Messenger bearbeiten."],"reasons":["Entspricht beiden Aussagen sowie den Evaluationsgrenzen.","Vollständige Ersetzung und eindeutige Wirkung sind nicht belegt.","Private Messenger sind für diese Anliegen nicht erlaubt."],"answer":0}],"prompt1":"Sollten digitale Sprechstunden persönliche Beratung an Hochschulen ersetzen? Beurteilen Sie Zugänglichkeit, Datenschutz und die Bedeutung persönlicher Gespräche (mindestens 200 Wörter).","prompt2":"Fassen Sie die Nutzung, die Entwicklung der Wartezeiten und mögliche alternative Erklärungen anhand von Text und Tabelle in 100–150 Wörtern zusammen.","speech":"Sie hören im Seminar, die neue Software habe die Wartezeit halbiert. Vergleichen Sie diese Behauptung mit der Tabelle und nehmen Sie Stellung (90 Sekunden).","model1":"Digitale Sprechstunden haben das Potenzial, Studierenden die Kommunikation mit Lehrenden zu erleichtern. Besonders Personen mit langen Anfahrtswegen oder Nebenjobs können davon profitieren, dass sie nicht für jede organisatorische Frage persönlich auf dem Campus erscheinen müssen. Terminbuchungen können außerdem Wartezeiten transparenter machen. Dennoch wäre es problematisch, sämtliche persönlichen Beratungsgespräche durch digitale Formate zu ersetzen. Einige Anliegen sind vertraulich oder emotional belastend. Dabei kann ein persönliches Gespräch hilfreicher sein, weil Missverständnisse schneller bemerkt werden und Gesprächspartner unmittelbar aufeinander reagieren können. Datenschutz ist ein weiterer entscheidender Faktor. Wenn sensible Prüfungsinformationen über private Messenger verschickt werden, entstehen unnötige Risiken. Hochschulen sollten dafür geschützte Kommunikationskanäle einsetzen. Auch die Evaluation digitaler Angebote muss sorgfältig erfolgen. Sinkt die Wartezeit nach Einführung einer Software, könnte dies ebenso mit zusätzlichem Personal zusammenhängen. Ebenso kann eine Befragung ausschließlich zufriedener Nutzender kein vollständiges Bild der Bedürfnisse aller Studierenden liefern. Meiner Ansicht nach ist ein hybrides Beratungsmodell die beste Lösung. Digitale Termine sollten unkompliziert verfügbar sein, während für sensible oder komplexe Fälle Präsenzgespräche angeboten werden. Klare Zuständigkeiten, barrierefreie Zugänge und ein transparenter Datenschutzstandard wären dabei wichtig. Eine regelmäßige Befragung von Nutzenden und Nichtnutzenden könnte zeigen, welche Gruppen bisher übersehen werden. So lassen sich Effizienz und persönliche Unterstützung sinnvoll verbinden.  Eine verständliche Kommunikation über Zuständigkeiten und Wartezeiten wäre dabei ebenso wichtig wie die Auswahl zuverlässiger technischer Systeme.","model2":"In einem zwölfwöchigen Pilotprojekt wurden digitale Sprechstunden an einem fiktiven Fachbereich erprobt. Insgesamt 210 Studierende nutzten das Angebot mindestens einmal, während 54 mehr als drei Termine buchten. Die durchschnittliche Wartezeit sank nach der Einführung des Buchungssystems von sechs auf vier Tage. Gleichzeitig wurde jedoch zusätzliches Personal eingestellt, weshalb der Rückgang nicht eindeutig der Software zugeschrieben werden kann. Für allgemeine organisatorische Fragen darf das System genutzt werden. Vertrauliche Prüfungsangelegenheiten müssen über einen geschützten Hochschulkanal bearbeitet werden. Lehrende sind verpflichtet, mindestens einen wöchentlichen Termin anzubieten; Studierende müssen dieses Angebot nicht nutzen. Eine Zufriedenheitsbefragung erfasste nur 80 bereits aktive Nutzerinnen und Nutzer. Für eine umfassendere Bewertung wären auch Rückmeldungen nicht teilnehmender Studierender wichtig.","modelSpeech":"Digitale Sprechstunden bieten organisatorische Vorteile, weil Wege entfallen und Termine einfacher gebucht werden können. Im Bericht sank die Wartezeit von sechs auf vier Tage. Die Ursache ist aber nicht eindeutig, da gleichzeitig mehr Personal eingestellt wurde. Außerdem wurden in der Zufriedenheitsbefragung nur Nutzende berücksichtigt. Ich würde daher persönliche Beratung nicht abschaffen, sondern beide Formate verbinden. Besonders vertrauliche Prüfungsfragen gehören in einen sicheren Kanal.","review":"زمان پاسخ از ۶ به ۴ روز کاهش یافته، اما نیروی کار هم افزایش یافته است. «gleichzeitig» نشانهٔ مخدوش‌گر احتمالی است؛ رضایت فقط از میان استفاده‌کنندگان سنجیده شده.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":90,"prepSeconds":90,"speakType":"Informationen abgleichen, Stellung nehmen","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"سامانهٔ مشاورهٔ دیجیتال با کاهش میانگین انتظار از شش به چهار روز همراه بوده، اما استخدام نیروی بیشتر نیز هم‌زمان اتفاق افتاده است. چون فقط استفاده‌کنندگان نظرسنجی شدند، رضایت کل دانشجویان معلوم نیست. مقاله از مدل ترکیبی مشاورهٔ حضوری و دیجیتال همراه با رعایت حریم خصوصی دفاع می‌کند.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Mehrweg in der Mensa","sub":"کاهش پسماند، اثر فصل و سیاست تشویقی","text":"Eine fiktive Hochschulmensa testete ein Pfandsystem für wiederverwendbare Essensbehälter. Im ersten Monat wurden 600 Mahlzeiten zum Mitnehmen ausgegeben, davon 180 in Mehrwegbehältern. Im vierten Monat waren es 750 Mahlzeiten, davon 330 in Mehrwegbehältern. Der Anteil der Mehrwegverpackungen stieg damit von 30 auf 44 Prozent. Die Mengen sind allerdings nicht unmittelbar als Abfallreduktion zu verstehen, da die Behälter gereinigt und mehrfach genutzt werden müssen. Außerdem wurde zwischen dem ersten und vierten Monat das Mensamenü verändert, sodass die höhere Nachfrage nicht eindeutig auf das Pfandsystem zurückzuführen ist. Gäste dürfen weiterhin Einwegverpackungen wählen; für Mehrweg wird ein rückzahlbares Pfand erhoben. Wer einen Behälter nicht innerhalb von 30 Tagen zurückbringt, erhält das Pfand nicht automatisch zurück. Eine Befragung von 140 freiwilligen Gästen ergab, dass 92 ein einheitliches Rückgabesystem bevorzugen. Der Bericht fordert, die tatsächlichen Reinigungs- und Transportaufwände in einer vollständigen Ökobilanz zu erfassen.","audio":"Moderator: Was hat sich nach vier Monaten gezeigt? Herr Beck: Der Mehrweganteil ist deutlich gestiegen. Das ist erfreulich, aber eine ökologische Gesamtbilanz haben wir noch nicht. Frau Demir: Gerade deshalb sollten wir Rückgabestellen auch außerhalb der Mensa prüfen. Moderator: Wann wird die neue Rückgabestation eingerichtet? Beck: Sie war für den 2. März vorgesehen, nun ist wegen Lieferverzögerungen der 9. März geplant. Demir: Aus meiner Sicht ist die Rückgabe der entscheidende praktische Engpass. Beck: Gleichzeitig wollen wir die Transportwege messen, bevor wir eine große Einsparung behaupten.","table":[["1. Monat gesamt","600"],["1. Monat Mehrweg","180"],["4. Monat gesamt","750"],["4. Monat Mehrweg","330"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie entwickelte sich der Mehrweganteil?","options":["Von 30 auf 44 Prozent.","Von 30 auf 44 Prozentpunkte.","Von 180 auf 330 Prozent."],"reasons":["180/600 = 30 %, 330/750 = 44 %.","14 Prozentpunkte Zuwachs, nicht Endwert von 44 Prozentpunkten.","Absolute Stückzahlen sind keine Prozentwerte."],"answer":0},{"tag":"Modal","kind":"abgleich","question":"Welche Wahl haben Gäste nach den Regeln?","options":["Sie dürfen Behälter grundsätzlich nie zurückgeben.","Sie müssen alle Mahlzeiten im Mehrwegbehälter kaufen.","Sie dürfen Einweg wählen oder Mehrweg mit rückzahlbarem Pfand nutzen."],"reasons":["Rückgabe ist gerade Teil des Pfandsystems.","Einweg bleibt erlaubt.","Wahlfreiheit und Pfand sind ausdrücklich genannt."],"answer":2},{"tag":"Kausal","kind":"lesen","question":"Was verhindert die eindeutige Zuordnung der Nachfrageentwicklung zum Pfandsystem?","options":["Auch das Menü wurde verändert.","Es gab im vierten Monat weniger Mahlzeiten.","Die Befragung umfasste exakt 140 Personen."],"reasons":["Menüänderung ist eine alternative Erklärung für Nachfrage.","Die Zahl stieg von 600 auf 750.","Befragungsgröße allein erklärt keine Kausalität."],"answer":0},{"tag":"Bedingung","kind":"lesen","question":"Wann ist die Pfandrückgabe nicht automatisch gesichert?","options":["Wenn der Behälter nicht innerhalb von 30 Tagen zurückgebracht wird.","Wenn 92 Personen ein einheitliches System wünschen.","Wenn Mehrweg im vierten Monat beliebter ist."],"reasons":["30 Tage ist die ausdrücklich genannte Rückgabefrist.","Umfragewünsche sind keine Rückgabebedingung.","Nachfrage beeinflusst diese Bedingung nicht."],"answer":0},{"tag":"Zeit","kind":"hoeren","question":"Wann soll die neue Station nun eröffnet werden?","options":["Am 9. März.","Erst nach Abschluss der Ökobilanz.","Am 2. März."],"reasons":["Lieferverzögerung verschob Termin auf 9. März.","Abschluss einer Ökobilanz ist keine erwähnte Terminbedingung.","2. März ist der alte Termin."],"answer":0},{"tag":"Perspektive","kind":"hoeren","question":"Wer bezeichnet die Rückgabe als wichtigsten praktischen Engpass?","options":["Frau Demir.","Der Moderator.","Herr Beck."],"reasons":["Demir sagt ausdrücklich „entscheidende praktische Engpass“.","Moderator stellt Fragen.","Beck spricht vor allem über Umweltbilanz und Transportmessung."],"answer":0},{"tag":"Transfer","kind":"lesen","question":"Welche Behauptung geht über die Daten hinaus?","options":["140 freiwillige Gäste nahmen an einer Befragung teil.","Das Pfandsystem habe bereits eindeutig die Umweltbilanz aller Mensen verbessert.","Im vierten Monat wurden 330 Mehrwegbehälter ausgegeben."],"reasons":["140 Befragte stehen im Text.","Weder Ökobilanz noch Stichprobe aller Mensen vorhanden.","330 ist direkt angegeben."],"answer":1},{"tag":"Synthese","kind":"abgleich","question":"Welche Schlussfolgerung ist angemessen?","options":["Einwegverpackungen sind seit Beginn des Projekts verboten.","Die Anzahl der ausgegebenen Mehrwegbehälter belegt bereits eine vollständige CO2-Einsparung.","Mehrweg wird häufiger gewählt, aber Rückgabe, Reinigung und Transporte müssen für eine Umweltbewertung geprüft werden."],"reasons":["Einwegverpackungen bleiben ausdrücklich zulässig.","Ohne Aufwandmessung keine vollständige Bilanz.","Verbindet Veränderung, praktische Probleme und fehlende Ökobilanz."],"answer":2}],"prompt1":"Sollte eine Hochschulmensa Einwegverpackungen vollständig verbieten? Diskutieren Sie ökologische, soziale und organisatorische Gesichtspunkte (mindestens 200 Wörter).","prompt2":"Beschreiben Sie die Entwicklung der Mehrwegnutzung mit exakten Anteilen. Nennen Sie die Einschränkungen der Aussagekraft von Text und Tabelle (100–150 Wörter).","speech":"Präsentieren Sie im Tutorium die Entwicklung des Mehrweganteils, den Unterschied zwischen Prozent und Prozentpunkten und die Voraussetzungen einer positiven Ökobilanz (150 Sekunden).","model1":"Das Ziel, Verpackungsmüll auf dem Campus zu reduzieren, ist sinnvoll. Ein vollständiges Verbot von Einwegverpackungen könnte jedoch unerwartete Probleme verursachen. Für ein Verbot spricht zunächst, dass dadurch weniger kurzlebige Verpackungen ausgegeben würden. Wenn Mehrwegbehälter häufig zurückgegeben und tatsächlich oft benutzt werden, können Ressourcen eingespart werden. Ein Pfandsystem schafft zudem einen finanziellen Anreiz zur Rückgabe. Andererseits müssen Mehrwegbehälter gereinigt, transportiert und gelagert werden. Dabei werden Wasser und Energie benötigt. Ob die ökologische Bilanz günstiger ist, hängt deshalb von der Zahl der Nutzungen und den konkreten Abläufen ab. Ein weiteres Problem betrifft Menschen, die Behälter unterwegs schlecht zurückbringen können. Für sie wäre ein sofortiges Verbot möglicherweise unpraktisch oder teurer. Ich plädiere daher für eine schrittweise Einführung. Zunächst sollten Hochschulen gut erreichbare Rückgabestellen schaffen, die Pfandbedingungen verständlich erklären und die tatsächlichen Rückgabequoten erfassen. Außerdem wäre eine transparente Ökobilanz nötig, die Reinigung und Transport einbezieht. Danach könnte die Hochschule prüfen, ob Einwegverpackungen in bestimmten Bereichen eingeschränkt werden sollten. Eine Entscheidung sollte nicht nur auf dem steigenden Anteil von Mehrwegverpackungen beruhen. Dieser zeigt zunächst eine Verhaltensänderung, aber noch keine vollständige Umweltwirkung. Mit einer Kombination aus Anreizen, Infrastruktur und Evaluation lassen sich langfristig wahrscheinlich bessere Ergebnisse erzielen.  Darüber hinaus sollten Studierende die Regelung regelmäßig bewerten können, damit praktische Hindernisse frühzeitig erkannt und behoben werden.","model2":"Eine fiktive Mensa untersuchte die Nutzung eines Pfandsystems für wiederverwendbare Verpackungen. Im ersten Monat wurden von 600 Mahlzeiten zum Mitnehmen 180 in Mehrwegbehältern ausgegeben. Dies entspricht 30 Prozent. Im vierten Monat waren es 330 von 750 Mahlzeiten beziehungsweise 44 Prozent. Der Anteil nahm somit um 14 Prozentpunkte zu. Während des Untersuchungszeitraums wurde jedoch auch das Menü verändert, was die Nachfrage beeinflusst haben könnte. Außerdem lässt sich aus der Ausgabe von Mehrwegbehältern noch keine vollständige Einsparung von Ressourcen ableiten. Dafür müssten Rückgabehäufigkeit, Reinigung und Transport berücksichtigt werden. Einweg bleibt erlaubt; für Mehrweg wird ein rückzahlbares Pfand erhoben. Von 140 freiwillig befragten Gästen bevorzugten 92 ein einheitliches Rückgabesystem. Der Bericht fordert eine umfassendere Ökobilanz.","modelSpeech":"Der Mehrweganteil stieg in vier Monaten von 30 auf 44 Prozent, also um 14 Prozentpunkte. Gleichzeitig wurden insgesamt mehr Mahlzeiten verkauft, und das Menü wurde geändert. Deshalb sollte man den Erfolg nicht allein dem Pfandsystem zuschreiben. Ebenso lässt sich aus mehr Mehrwegbehältern noch keine sichere Umweltbilanz ableiten. Entscheidend ist, wie häufig sie zurückgegeben, gereinigt und wiederverwendet werden. Ich würde die Rückgabestellen ausbauen und diese Faktoren messen.","review":"Mehrweganteil steigt **um ۱۴ Prozentpunkte** (von ۳۰ % auf ۴۴ %). Absolute Ausgaben steigen ebenfalls, aber sind kein Nachweis einer ökologischen Gesamtbilanz.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":150,"prepSeconds":120,"speakType":"Thema präsentieren","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"سهم ظروف چندبارمصرف از ۳۰ به ۴۴ درصد رسیده؛ یعنی ۱۴ واحد درصد افزایش. هم‌زمان منو نیز تغییر کرده و هزینهٔ شست‌وشو و حمل‌ونقل بررسی نشده است. پس افزایش استفاده لزوماً اثبات سود محیط‌زیستی نهایی نیست. مقاله اجرای تدریجی با ایستگاه بازگشت، مقررات روشن و ارزیابی محیط‌زیستی را پیشنهاد می‌کند.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Bürgerwissenschaft in der Stadt","sub":"Laienbeteiligung und Zuverlässigkeit von Beobachtungsdaten","text":"Bei einem fiktiven Projekt zur Beobachtung städtischer Insekten meldeten sich 480 Freiwillige. Von ihnen luden 260 mindestens eine Beobachtung hoch; insgesamt wurden 1.400 Einträge dokumentiert. Ein Expertenteam bestätigte 980 Einträge nach einer Qualitätskontrolle. Die übrigen waren nicht automatisch falsch: Einige waren unvollständig oder nicht eindeutig genug. Teilnehmende dürfen Beobachtungen selbst einreichen. Für die Veröffentlichung als geprüfter Datensatz ist jedoch eine fachliche Freigabe erforderlich. Eine kurze Einführung wird empfohlen, ist aber für einfache Meldungen nicht verpflichtend. Es zeigte sich, dass die meisten Einträge aus gut zugänglichen Parks stammten. Daraus kann nicht geschlossen werden, dass Insekten in anderen Stadtgebieten seltener sind; möglicherweise wurden diese Gebiete schlicht seltener besucht. Der Bericht empfiehlt zusätzliche Begehungen in weniger häufig untersuchten Quartieren und eine Erfassung der Beobachtungsintensität. Nur so lassen sich Unterschiede zwischen der Zahl gemeldeter Tiere und der tatsächlichen Verbreitung besser trennen.","audio":"Journalistin: Sind die Daten schon für wissenschaftliche Karten geeignet? Dr. Seidel: Nach Prüfung durchaus, aber wir müssen die ungleiche Verteilung der Beobachtungsorte berücksichtigen. Frau Karim: Ich finde es wichtig, dass Freiwillige unkompliziert teilnehmen können. Eine lange Pflichtschulung könnte Interessierte abschrecken. Journalistin: Wann beginnt die Kartierung im Süden? Seidel: Wir wollten am 6. Mai starten, tatsächlich wird die Aktion wegen Regenwarnungen erst am 13. Mai beginnen. Karim: Gerade dort fehlen bislang viele Meldungen. Seidel: Genau, die geringe Zahl der Einträge darf nicht automatisch mit geringer Insektenvielfalt gleichgesetzt werden.","table":[["Freiwillige","480"],["Aktive Meldende","260"],["Meldungen insgesamt","1.400"],["Bestätigte Meldungen","980"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Meldungen wurden nach fachlicher Kontrolle bestätigt?","options":["980 Einträge.","480 Einträge.","260 Einträge."],"reasons":["980 bestätigte Einträge stehen ausdrücklich im Text.","480 ist die Zahl der Freiwilligen.","260 ist die Zahl der aktiven Meldenden."],"answer":0},{"tag":"Modal","kind":"abgleich","question":"Was gilt für die Einführung neuer Freiwilliger?","options":["Sie wird empfohlen, ist aber für einfache Meldungen nicht verpflichtend.","Sie ist grundsätzlich verboten.","Sie ist ausnahmslos für jede Meldung obligatorisch."],"reasons":["„empfohlen“ und „nicht verpflichtend“ sind die Schlüsselwörter.","Der Text befürwortet eine Einführung.","Eine Pflicht wird ausdrücklich ausgeschlossen."],"answer":0},{"tag":"Kausal","kind":"lesen","question":"Warum bedeuten wenige Meldungen aus einem Stadtteil nicht automatisch wenige Insekten?","options":["Weil die Stadt insgesamt 1.400 Bewohner hat.","Weil dort garantiert keine Insekten leben.","Der Stadtteil könnte seltener besucht und beobachtet worden sein."],"reasons":["1.400 bezeichnet Einträge, nicht Einwohner.","Das wäre das Gegenteil einer begründeten Schlussfolgerung.","Beobachtungsaufwand kann die Meldezahl beeinflussen."],"answer":2},{"tag":"Bedingung","kind":"lesen","question":"Wann darf eine Meldung als geprüfter Datensatz veröffentlicht werden?","options":["Nach fachlicher Freigabe.","Nur wenn die meldende Person schon zwei Jahre studiert hat.","Sofort nach jedem Hochladen ohne Kontrolle."],"reasons":["Für geprüfte Veröffentlichung ist Freigabe nötig.","Eine Studienzeit wird nirgendwo verlangt.","Die Kontrolle ist eine Bedingung."],"answer":0},{"tag":"Zeit","kind":"hoeren","question":"Wann beginnt die Kartierung im Süden tatsächlich?","options":["Am 13. Mai.","Sofort bei jedem Wetter.","Am 6. Mai."],"reasons":["Regenwarnungen verschieben Beginn auf 13. Mai.","Wetterbedingte Verschiebung widerspricht „sofort“.","6. Mai war die ursprüngliche Planung."],"answer":0},{"tag":"Perspektive","kind":"hoeren","question":"Wer warnt davor, Freiwillige durch eine lange Pflichtschulung abzuschrecken?","options":["Die Journalistin.","Frau Karim.","Dr. Seidel."],"reasons":["Journalistin fragt nach Eignung und Terminen.","Karim vertritt den niederschwelligen Zugang.","Seidel betont Datenqualität und Beobachtungsorte."],"answer":1},{"tag":"Transfer","kind":"lesen","question":"Welche Aussage kann aus den bestätigten Meldungen NICHT abgeleitet werden?","options":["Die bestätigten Meldungen wurden fachlich kontrolliert.","In allen nicht besuchten Stadtteilen gebe es nachweislich weniger Arten.","Die Beobachtungen sind räumlich ungleich verteilt."],"reasons":["Kontrollvorgang ist genannt.","Unbeobachtete Bereiche erlauben keine Aussage über Artenzahl.","Ungleiche räumliche Verteilung ist genannt."],"answer":1},{"tag":"Synthese","kind":"abgleich","question":"Welche Empfehlung ergibt sich aus beiden Quellen?","options":["Wenige Meldungen automatisch als biologische Artenarmut ausweisen.","Alle Freiwilligen ausschließen, bis ausschließlich Fachleute Daten erheben.","Ergänzend unterrepräsentierte Gebiete untersuchen und geprüfte Meldungen von ungeprüften trennen."],"reasons":["Meldehäufigkeit ist nicht gleich Artenhäufigkeit.","Beide Quellen befürworten freiwillige Beteiligung mit Qualitätssicherung.","Die Empfehlung berücksichtigt Beobachtungsaufwand und Qualitätskontrolle."],"answer":2}],"prompt1":"Sollten wissenschaftliche Einrichtungen Bürgerforschungsprojekte stärker fördern? Diskutieren Sie Vorteile für Bildung und Forschung sowie Risiken für Datenqualität (mindestens 200 Wörter).","prompt2":"Fassen Sie Teilnahme, Datenprüfung und mögliche Beobachtungsverzerrungen anhand von Text und Tabelle in 100–150 Wörtern zusammen.","speech":"Geben Sie die Argumente von Dr. Seidel und Frau Karim wieder. Nehmen Sie anschließend zur Frage Stellung, ob eine verpflichtende Schulung nötig ist (120 Sekunden).","model1":"Bürgerforschungsprojekte können Wissenschaft und Gesellschaft auf eine besonders direkte Weise verbinden. Wenn Freiwillige Beobachtungen sammeln, entstehen oft umfangreiche Datenbestände, die eine kleine Forschungsgruppe allein nur mit großem Aufwand gewinnen könnte. Gleichzeitig lernen Teilnehmende, wissenschaftliche Fragen zu stellen und ihre Beobachtungen sorgfältig zu dokumentieren. Dieses Bildungspotenzial ist ein wichtiges Argument für eine stärkere Förderung. Allerdings ist die Menge der gesammelten Daten kein ausreichender Qualitätsnachweis. Manche Meldungen sind unvollständig, andere lassen sich wegen fehlender Bilder oder ungenauer Ortsangaben nicht überprüfen. Die Forschung muss deshalb nachvollziehbare Kriterien für die fachliche Freigabe festlegen. Ebenso problematisch ist die ungleiche räumliche Verteilung von Beobachtungen. Wenn besonders viele Meldungen aus leicht zugänglichen Parks stammen, darf daraus nicht geschlossen werden, dass andere Viertel weniger Arten besitzen. Möglicherweise wurden sie lediglich seltener besucht. Meiner Meinung nach sollten wissenschaftliche Einrichtungen solche Projekte ausbauen, aber die Datenerhebung methodisch begleiten. Kurze freiwillige Einführungsmodule könnten den Einstieg erleichtern. Für die Veröffentlichung geprüfter Daten sollte dagegen eine fachliche Kontrolle obligatorisch bleiben. Zusätzlich wären gezielte Aktionen in bisher kaum besuchten Stadtteilen sinnvoll. So könnte die Beteiligung vieler Menschen mit belastbareren wissenschaftlichen Ergebnissen kombiniert werden. Insgesamt liegt die Stärke von Bürgerwissenschaft nicht allein in großen Datenmengen, sondern in der Verbindung aus Teilhabe, Transparenz und systematischer Qualitätssicherung.  Ein solches Vorgehen würde nicht nur Datenprobleme verringern, sondern auch die Motivation der Freiwilligen und die Akzeptanz wissenschaftlicher Ergebnisse stärken.","model2":"Im fiktiven Insektenprojekt meldeten sich 480 Freiwillige. Von ihnen luden 260 mindestens eine Beobachtung hoch; insgesamt entstanden 1.400 Einträge. Ein Expertenteam bestätigte nach einer Qualitätskontrolle 980 dieser Meldungen. Die übrigen Einträge waren nicht zwangsläufig falsch, sondern teilweise unvollständig oder nicht eindeutig zuzuordnen. Eine kurze Einführung wurde empfohlen, für einfache Meldungen aber nicht vorgeschrieben. Erst nach fachlicher Freigabe konnten Daten als geprüft veröffentlicht werden. Die meisten Meldungen stammten aus gut erreichbaren Parks. Daraus kann nicht geschlossen werden, dass in anderen Stadtteilen weniger Insekten leben, da dort möglicherweise seltener beobachtet wurde. Der Bericht empfiehlt deshalb zusätzliche Begehungen und eine systematische Dokumentation des Beobachtungsaufwands.","modelSpeech":"An dem Projekt waren 480 Freiwillige beteiligt; 260 meldeten mindestens eine Beobachtung. Von 1.400 Einträgen wurden 980 fachlich bestätigt. Die übrigen Daten waren nicht unbedingt falsch, sondern konnten teilweise nicht ausreichend geprüft werden. Eine weitere Schwierigkeit ist die räumliche Verteilung: Leicht zugängliche Parks wurden häufiger besucht. Weniger Meldungen aus anderen Stadtteilen bedeuten daher nicht automatisch weniger Insekten. Für belastbare Aussagen müsste die Beobachtungsintensität besser kontrolliert werden.","review":"«bestätigt» heißt fachlich freigegeben, nicht dass alle übrigen 420 Meldungen falsch sind. Meldewahrscheinlichkeit kann vom Besuchsaufwand abhängen.","translation":"در نمونهٔ مقاله، دیدگاه نهایی پس از بررسی مزایا، محدودیت‌ها و یک راهکار اجرایی بیان شده است. جمله‌هایی مثل «Ein wichtiger Vorteil besteht darin, dass …» را به معنای «یکی از مزایای مهم این است که …» و «Allerdings …» را به معنای «بااین‌حال …» به‌کار ببر؛ این عبارت‌ها جای استدلال واقعی را نمی‌گیرند. متن نمونه را کپی نکن؛ ساختارش را برای موضوع تازه بازآفرینی کن.","rubric":["تمام خواسته‌های صورت سؤال را پوشش بده؛ استدلال و خلاصه‌سازی را با هم اشتباه نگیر.","عددها را با مخرج درست بیان کن و «Prozent» را با «Prozentpunkte» خلط نکن.","اگر متن مشاهده‌ای است، از واژهٔ „beweisen“ برای ادعای علّی استفاده نکن.","در گفتار دو دقیقه‌ای، ادعای اصلی، شواهد و محدودیت را جدا کن."],"speakSeconds":120,"prepSeconds":90,"speakType":"Argumente wiedergeben, Stellung nehmen","keywords":["indirekter Nutzen","Vergleichsgruppe","Voraussetzung","Datenlage","Einschränkung","Stichprobe","Handlungsempfehlung"],"faTranslation":"از ۴۸۰ داوطلب، ۲۶۰ نفر دست‌کم یک مشاهده ثبت کرده‌اند و ۹۸۰ مورد از ۱۴۰۰ گزارش تأیید کارشناسی شده است. بقیه الزاماً نادرست نیستند. گزارش بیشتر از پارک‌های در دسترس آمده و تعداد کم گزارش‌ها در محله‌های دیگر به معنی تعداد کم حشرات نیست. مقاله بر آموزش اختیاری و کنترل تخصصی پیش از انتشار تأکید می‌کند.","exampleDE":"Die Ergebnisse deuten auf einen möglichen Nutzen hin; ein eindeutiger Kausalzusammenhang ist jedoch nicht nachgewiesen.","exampleFA":"نتایج حاکی از سود احتمالی‌اند؛ بااین‌حال، یک رابطهٔ علّی قطعی اثبات نشده است."},{"title":"Offene Lehrmaterialien","sub":"Nutzungszahlen, Urheberrecht und Unterrichtsqualität","text":"In einem fiktiven Hochschulverbund testeten acht Lehrstühle frei lizenzierte Unterrichtsmaterialien. Während eines Semesters wurden 320 Materialien heruntergeladen; 76 davon wurden von Lehrenden in mindestens einer Veranstaltung tatsächlich eingesetzt. Ein Download sagt daher noch nichts über die Unterrichtsnutzung aus. Die Materialien dürfen verändert werden, sofern die jeweilige Lizenz eine Bearbeitung erlaubt und die geforderte Namensnennung erfolgt. Geschützte Grafiken fremder Verlage dürfen nicht ohne entsprechende Rechte übernommen werden. In einer Befragung von 44 Lehrenden bezeichneten 29 die Möglichkeit zur Anpassung als Vorteil. Die Befragung war freiwillig und bildet nicht alle Lehrenden des Hochschulverbunds ab. Zugleich stieg in einigen Kursen die Zufriedenheit, aber auch die technische Ausstattung wurde verbessert. Es gibt keine geeignete Vergleichsgruppe, um die Zufriedenheit eindeutig den offenen Materialien zuzuschreiben. Die Projektleitung hält eine redaktionelle Prüfung für sinnvoll, schreibt jedoch keinen einheitlichen Stil für alle Fächer vor.","audio":"Moderator: Sind offene Materialien automatisch qualitativ besser? Professor Winter: Nein. Ihre Stärke liegt in der Anpassbarkeit, aber Quellen und Aufgaben müssen weiterhin geprüft werden. Frau Arslan: Zusätzlich sollten Lehrende kurze Schulungen zum Lizenzrecht erhalten. Viele wissen nicht, welche Abbildungen verändert werden dürfen. Moderator: Wann beginnt die Fortbildung? Arslan: Sie war für den 15. Oktober angesetzt, beginnt nun aber wegen Raumproblemen am 22. Oktober. Winter: Und eine hochgeladene Datei ist nicht automatisch im Seminar angekommen. Wir sollten die tatsächliche Nutzung untersuchen. Arslan: Genau; ein Download ist nur ein erster Hinweis.","table":[["Downloads","320"],["Im Unterricht genutzt","76"],["Befragte Lehrende","44"],["Anpassung vorteilhaft","29"]],"qs":[{"tag":"Menge","kind":"lesen","question":"Wie viele Materialien wurden nachweislich im Unterricht eingesetzt?","options":["29.","76.","320."],"reasons":["29 sind positive Antworten von Lehrenden.","76 wurden mindestens einmal tatsächlich verwendet.","320 bezeichnet Downloads, keine nachweisliche Nutzung."],"answer":1},{"tag":"Modal","kind":"abgleich","question":"Welche Aussage über Veränderungen der Materialien stimmt?","options":["Jede fremde Verlagsgrafik darf beliebig kopiert werden.","Alle offenen Materialien müssen unverändert bleiben.","Bearbeitungen sind zulässig, wenn Lizenzbedingungen und Namensnennung eingehalten werden."],"reasons":["Fremde geschützte Grafiken brauchen Rechte.","Bearbeitung kann ausdrücklich erlaubt sein.","Die Erlaubnis ist an Lizenzbedingungen geknüpft."],"answer":2},{"tag":"Kausal","kind":"lesen","question":"Warum kann die höhere Zufriedenheit nicht sicher den offenen Materialien zugeschrieben werden?","options":["Weil keine Materialien heruntergeladen wurden.","Auch die technische Ausstattung wurde verbessert und eine Vergleichsgruppe fehlt.","Weil die Lehrenden exakt 76 Kurse betreuen."],"reasons":["320 Downloads wurden verzeichnet.","Gleichzeitige Veränderung und fehlender Vergleich verhindern klare Kausalzuordnung.","76 beschreibt Materialnutzung, nicht Kursanzahl."],"answer":1},{"tag":"Bedingung","kind":"lesen","question":"Was ist Voraussetzung für zulässige Bearbeitungen?","options":["Die konkrete Lizenz muss die Bearbeitung erlauben; erforderliche Namensnennung muss erfolgen.","Jede Datei muss vorher 320-mal heruntergeladen worden sein.","Eine redaktionelle Prüfung ist gesetzlich ausnahmslos vorgeschrieben."],"reasons":["Der Text nennt beide Lizenzbedingungen.","Downloadzahl ist keine rechtliche Voraussetzung.","Redaktionelle Prüfung wird empfohlen, nicht als einheitliche Pflicht geregelt."],"answer":0},{"tag":"Zeit","kind":"hoeren","question":"Wann startet die Fortbildung laut aktuellem Plan?","options":["Am 15. Oktober.","Am 22. Oktober.","Erst nach Ende des Semesters."],"reasons":["15. Oktober war ursprünglicher Termin.","Arslan korrigiert auf 22. Oktober.","Semesterende wurde nicht genannt."],"answer":1},{"tag":"Perspektive","kind":"hoeren","question":"Wer fordert besonders Schulungen zum Lizenzrecht?","options":["Professor Winter.","Der Moderator.","Frau Arslan."],"reasons":["Winter hebt Qualität und Nutzung hervor.","Moderator fragt nach Qualität und Termin.","Arslan spricht über Fortbildungen und Unsicherheit bei Abbildungen."],"answer":2},{"tag":"Transfer","kind":"lesen","question":"Welche Schlussfolgerung wäre unzulässig?","options":["Alle Hochschullehrenden bevorzugen offene Materialien.","29 von 44 Befragten fanden Anpassbarkeit vorteilhaft.","Die Befragung war freiwillig."],"reasons":["44 freiwillige Befragte repräsentieren nicht alle Lehrenden.","Die Zahlen sind ausdrücklich genannt.","Freiwillige Teilnahme ist erwähnt."],"answer":0},{"tag":"Synthese","kind":"abgleich","question":"Was folgt aus Text und Gespräch am ehesten?","options":["Offene Materialien können angepasst werden, doch Nutzungsnachweise, Lizenzprüfung und Qualitätssicherung bleiben nötig.","320 Downloads beweisen 320 erfolgreiche
