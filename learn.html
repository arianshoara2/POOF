const EN_B2=[{"id":"en07","order":7,"level":"B2","minutes":25,"title":"جمله‌های شرطی و فرضی","titleEn":"Conditionals: real, unreal and mixed","blocks":[{"type":"dialog","lines":[{"de":"Are you still applying for that scholarship, Mina?","fa":"مینا، هنوز برای آن بورسیه درخواست می‌دهی؟"},{"de":"Yes. If I get it, I'll move to Bristol in September.","fa":"آره. اگر قبول شوم، سپتامبر به بریستول می‌روم."},{"de":"What if you do not get it?","fa":"اگر قبول نشوی چی؟"},{"de":"I'll apply again, unless the deadline has passed.","fa":"دوباره درخواست می‌دهم، مگر اینکه مهلتش گذشته باشد."},{"de":"If I were you, I'd check the requirements today.","fa":"اگر جای تو بودم، امروز شرایط را بررسی می‌کردم."},{"de":"I did. I wish I had started preparing earlier.","fa":"بررسی کردم. کاش زودتر آماده‌سازی را شروع کرده بودم."},{"de":"Did you miss something important?","fa":"چیز مهمی را از دست دادی؟"},{"de":"I missed the language test. If I'd booked it in June, I'd have my results now.","fa":"آزمون زبان را از دست دادم. اگر ژوئن ثبت‌نام کرده بودم، الان نتیجه‌اش را داشتم."},{"de":"Could you take the test next week?","fa":"می‌توانی هفتهٔ آینده در آزمون شرکت کنی؟"},{"de":"Yes, provided that there are still places available.","fa":"بله، به شرط آنکه هنوز ظرفیت داشته باشد."},{"de":"Suppose you got the scholarship. Would you live alone?","fa":"فرض کن بورسیه را گرفتی. تنها زندگی می‌کردی؟"},{"de":"Not if the rent stayed this high. I'd share a flat.","fa":"نه اگر اجاره همین‌قدر بالا می‌ماند. خانهٔ اشتراکی می‌گرفتم."},{"de":"If only the city were cheaper!","fa":"کاش شهر ارزان‌تر بود!"},{"de":"I know. But as long as I keep applying, I've got a chance.","fa":"می‌دانم. اما تا وقتی به درخواست‌دادن ادامه بدهم، شانس دارم."}]},{"type":"vocab","items":[{"de":"zero conditional","fa":"شرط نوع صفر","note":"حقیقت عمومی: if + present, present."},{"de":"first conditional","fa":"شرط نوع اول","note":"احتمال واقعی آینده: if + present, will + verb."},{"de":"second conditional","fa":"شرط نوع دوم","note":"حال یا آیندهٔ فرضی: if + past, would + verb."},{"de":"third conditional","fa":"شرط نوع سوم","note":"حسرت گذشته: if + past perfect, would have + p.p."},{"de":"mixed conditional","fa":"شرط ترکیبی","note":"شرط در گذشته و پیامد در حال، یا برعکس."},{"de":"unless","fa":"مگر اینکه / اگر نه","note":"اغلب معادل if ... not؛ منفی اضافه نکن."},{"de":"provided that","fa":"به شرط آنکه","note":"شرط رسمی؛ در قرارداد و مکاتبه رایج است."},{"de":"as long as","fa":"تا وقتی که / به شرط اینکه","note":"شرط تداوم: as long as you study."},{"de":"otherwise","fa":"وگرنه / در غیر این صورت","note":"برای بیان نتیجهٔ جایگزین."},{"de":"suppose","fa":"فرض کن","note":"برای بازکردن موقعیت فرضی: Suppose you won."},{"de":"if only","fa":"ای کاش","note":"حسرتی قوی‌تر از wish."},{"de":"wish","fa":"آرزو داشتن / کاش","note":"wish + past simple یا past perfect."},{"de":"regret","fa":"پشیمانی","note":"regret + -ing برای کاری که انجام شده است."},{"de":"deadline","fa":"مهلت نهایی","note":"miss a deadline یعنی از دست دادن مهلت."},{"de":"scholarship","fa":"بورسیه","note":"get / win a scholarship."},{"de":"requirement","fa":"شرط / الزام","note":"meet the requirements یعنی واجد شرایط بودن."},{"de":"application","fa":"درخواست / پروندهٔ درخواست","note":"submit an application."},{"de":"available","fa":"در دسترس / دارای ظرفیت","note":"places are available."},{"de":"to apply","fa":"درخواست دادن","note":"apply for a scholarship."},{"de":"to submit","fa":"ارسال یا ثبت کردن","note":"submit a form before the deadline."},{"de":"to book","fa":"رزرو کردن","note":"book a test or appointment."},{"de":"to afford","fa":"توان مالی داشتن","note":"can afford the rent."},{"de":"to share a flat","fa":"خانهٔ اشتراکی گرفتن","note":"share a flat with someone."},{"de":"to miss","fa":"از دست دادن","note":"miss a bus یا miss a deadline."},{"de":"to improve","fa":"بهبود یافتن / دادن","note":"improve your chances."},{"de":"forecast","fa":"پیش‌بینی هوا","note":"check the forecast before travelling."},{"de":"outcome","fa":"نتیجه / پیامد","note":"the outcome of a decision."},{"de":"in case","fa":"برای احتیاط / در صورتی که","note":"Take a coat in case it rains؛ با if یکی نیست."}]},{"type":"grammar","title":"چهار نوع شرط: از واقعیت تا گذشتهٔ فرضی","body":"نوع صفر یک رابطهٔ عمومی یا عادت را توضیح می‌دهد: دو فعل معمولاً در زمان حال ساده‌اند. نوع اول دربارهٔ امکان واقعی در آینده است؛ در بند شرط معمولاً زمان حال می‌آید، حتی وقتی معنی آینده باشد. نوع دوم به موقعیتی خلاف واقع یا دور از انتظار در حال و آینده اشاره می‌کند؛ گذشتهٔ ساده در اینجا نشانهٔ فاصله از واقعیت است، نه لزوماً زمان گذشته. نوع سوم دربارهٔ گذشته‌ای است که تغییر نکرده، با [[had + past participle]] در شرط و [[would have + past participle]] در نتیجه. [[could]] و [[might]] هم می‌توانند به‌جای [[would]] بیایند تا توانایی یا احتمال نشان دهند.\nمثال‌ها: [[If you heat ice, it melts.]] (اگر یخ را گرم کنی، ذوب می‌شود)؛ [[If I finish early, I will call you.]] (اگر زود تمام کنم، بهت زنگ می‌زنم)؛ [[If the train is late, we can wait.]] (اگر قطار دیر کند، می‌توانیم صبر کنیم)؛ [[If I were rich, I would travel more.]] (اگر پولدار بودم، بیشتر سفر می‌کردم)؛ [[If she had more time, she could join us.]] (اگر وقت بیشتری داشت، می‌توانست به ما بپیوندد)؛ [[If we had left earlier, we would have arrived on time.]] (اگر زودتر حرکت کرده بودیم، به‌موقع رسیده بودیم)؛ [[If he had checked his email, he might have seen the offer.]] (اگر ایمیلش را چک کرده بود، شاید پیشنهاد را می‌دید)."},{"type":"tip","body":"در شرط نوع اول ننویس [[If it will rain, we will stay home]]. شکل معمول [[If it rains, we will stay home.]] است. ولی [[will]] گاهی برای نشان‌دادن تمایل، در جملهٔ شرطی کاربرد دارد؛ قانونِ «هرگز will بعد از if» مطلق نیست."},{"type":"grammar","title":"شرط ترکیبی و تفاوت wish با if only","body":"در شرط ترکیبی زمان شرط و نتیجه فرق می‌کند. اگر گذشته متفاوت بود و امروز نتیجهٔ متفاوتی داشتیم، از [[if + past perfect]] و [[would + base verb]] استفاده می‌کنیم. اگر ویژگیِ فرضیِ حال باعث می‌شد رویدادی در گذشته رخ ندهد، نتیجه با [[would have + past participle]] ساخته می‌شود. برای آرزو دربارهٔ حال از [[wish + past simple]] استفاده می‌شود؛ برای حسرت گذشته از [[wish + past perfect]]. ساخت [[wish + would]] معمولاً برای خواسته دربارهٔ تغییر رفتار یا وضعیتی در آینده به کار می‌رود، نه برای تغییر گذشته.\nمثال‌ها: [[If I had studied harder, I would feel confident now.]] (اگر بیشتر درس خوانده بودم، الان اعتمادبه‌نفس داشتم)؛ [[If she had taken the job, she would live in Berlin now.]] (اگر شغل را پذیرفته بود، الان برلین زندگی می‌کرد)؛ [[If he were more careful, he would not have lost the file.]] (اگر دقیق‌تر بود، فایل را از دست نداده بود)؛ [[I wish I knew the answer.]] (کاش جواب را می‌دانستم)؛ [[I wish I had applied earlier.]] (کاش زودتر درخواست داده بودم)؛ [[If only the rent were lower!]] (کاش اجاره کمتر بود!)؛ [[I wish you would stop interrupting me.]] (کاش دیگر وسط حرفم نمی‌پریدی)."},{"type":"mistakes","items":[{"wrong":"If I will have time, I will help.","right":"If I have time, I will help.","fa":"در شرط نوع اول، بند if معمولاً زمان حال ساده می‌گیرد."},{"wrong":"If I knew yesterday, I would call you.","right":"If I had known yesterday, I would have called you.","fa":"برای حسرت رویداد تمام‌شدهٔ دیروز، ساخت نوع سوم لازم است."},{"wrong":"I wish I would know the answer.","right":"I wish I knew the answer.","fa":"برای آرزوی دانش یا وضعیت فعلی، wish + past simple مناسب است."}]},{"type":"grammar","title":"unless، provided that و in case","body":"همهٔ جمله‌های وابستهٔ شرطی دقیقاً یکسان نیستند. [[unless]] بیشتر یعنی «اگر ... نه» و معمولاً شرطِ منفی را بدون [[not]] بیان می‌کند. [[provided that]] شرطی روشن و نسبتاً رسمی می‌گذارد. [[as long as]] یعنی به شرط ادامهٔ یک وضعیت. [[otherwise]] نتیجهٔ عدم اجرای شرط را نشان می‌دهد. [[in case]] معمولاً دلیل احتیاط‌کردن در برابر یک احتمال را بیان می‌کند، نه صرفاً خودِ شرط را. جای بندها را می‌توان تغییر داد؛ اگر بند شرط اول بیاید معمولاً بعدش ویرگول می‌گذاریم.\nمثال‌ها: [[Unless you hurry, you will miss the bus.]] (اگر عجله نکنی، اتوبوس را از دست می‌دهی)؛ [[We can start provided that everyone agrees.]] (به شرط موافقت همه می‌توانیم شروع کنیم)؛ [[You can stay as long as you help.]] (تا وقتی کمک کنی می‌توانی بمانی)؛ [[Take a coat in case it gets cold.]] (برای احتیاط کت بردار، شاید هوا سرد شود)؛ [[Check the form; otherwise, you may miss a detail.]] (فرم را چک کن؛ وگرنه شاید نکته‌ای را از دست بدهی)؛ [[If you were in my position, what would you do?]] (اگر جای من بودی چه می‌کردی؟)؛ [[Even if it rains, we will go.]] (حتی اگر باران ببارد، می‌رویم)."},{"type":"tip","body":"برای تشخیص شرط ترکیبی اول دو سؤال بپرس: «اتفاق شرط چه زمانی بوده؟» و «پیامد چه زمانی دیده می‌شود؟» در [[If I had slept well, I would feel better now.]]، شرط گذشته و نتیجه حال است."},{"type":"text","de":"Mina wants to study abroad, but she has not decided which university to choose. If she receives a scholarship, she will move to Bristol in September. If she does not get one, she will look for a cheaper course. She knows that if students prepare early, they usually have more options. Last spring, she missed an important deadline because she had not checked her email. If she had submitted the form on time, she would have been considered for a place. She still regrets that mistake. 'If only I had read the instructions carefully,' she says. Her friend Leo encourages her: 'If I were you, I would make a list of every deadline.' Mina agrees. She would feel calmer now if she had started that list months ago. Instead, she is spending her evenings checking documents. She will take the language test next week, provided that a place is still available. She also plans to save money in case the rent is higher than expected. If she could afford a flat alone, she would enjoy more privacy, but sharing would be cheaper. Whatever happens, she has decided to keep applying. Otherwise, she might regret giving up too soon.","fa":"مینا می‌خواهد خارج از کشور تحصیل کند اما هنوز تصمیم نگرفته کدام دانشگاه را انتخاب کند. اگر بورسیه بگیرد، سپتامبر به بریستول می‌رود؛ وگرنه دوره‌ای ارزان‌تر پیدا می‌کند. می‌داند دانشجوهایی که زود آماده می‌شوند معمولاً انتخاب‌های بیشتری دارند. بهار گذشته چون ایمیلش را بررسی نکرده بود، مهلت مهمی را از دست داد. اگر فرم را به‌موقع فرستاده بود، درخواستش بررسی می‌شد. هنوز از این اشتباه پشیمان است: «کاش دستورالعمل‌ها را دقیق خوانده بودم.» دوستش لئو پیشنهاد می‌دهد فهرست مهلت‌ها را تهیه کند. اگر چند ماه قبل این فهرست را شروع کرده بود، الان آرام‌تر بود. فعلاً عصرها مشغول بررسی مدارک است. به شرط وجود ظرفیت هفتهٔ آینده آزمون زبان می‌دهد. برای احتیاط پول پس‌انداز می‌کند، شاید اجاره بیشتر از انتظار باشد. اگر توان پرداخت اجارهٔ خانهٔ مستقل داشت، حریم خصوصی بیشتری داشت، ولی خانهٔ اشتراکی ارزان‌تر است. تصمیم گرفته به درخواست‌دادن ادامه دهد؛ وگرنه شاید از زود تسلیم‌شدن پشیمان شود."},{"type":"tip","body":"در [[Take an umbrella in case it rains.]] چتر را از پیش برمی‌داری؛ اما در [[If it rains, take an umbrella.]] اقدام به وقوع باران وابسته است. این تفاوت در ترجمه مهم است."}],"exercises":[{"type":"blank","text":"If you ___ water to 100°C at normal atmospheric pressure, it boils.","answer":"heat","hint":"در شرط صفر از حال ساده استفاده می‌شود."},{"type":"mc","q":"کدام جمله شرط نوع اول است؟","options":["If I were taller, I would play basketball.","If it rains tomorrow, we will stay home.","If I had studied, I would have passed."],"answer":1,"why":"شرط نوع اول: [[if + present simple]] و در نتیجه معمولاً [[will + verb]]."},{"type":"type","q":"به انگلیسی بنویس: «اگر وقت داشته باشم، به تو کمک می‌کنم.»","answer":"If I have time, I will help you","accept":["If I have time, I'll help you","I will help you if I have time"]},{"type":"blank","text":"If I ___ you, I would ask for advice.","answer":"were","hint":"در موقعیت فرضی، If I were you رایج و در زبان رسمی معیار است."},{"type":"mc","q":"If she had taken the job, she would live here now. این چه نوع شرطی است؟","options":["نوع صفر","نوع سوم کامل","شرط ترکیبی: گذشته → حال"],"answer":2,"why":"گرفتن شغل فرضی در گذشته است؛ زندگی در حال نتیجهٔ آن است."},{"type":"type","q":"به انگلیسی بنویس: «کاش زودتر درخواست داده بودم.»","answer":"I wish I had applied earlier","accept":["If only I had applied earlier"]},{"type":"blank","text":"We will go hiking ___ it rains heavily.","answer":"unless","hint":"مگر اینکه باران شدیدی ببارد."},{"type":"mc","q":"کدام جمله برای احتیاط طبیعی‌تر است؟","options":["Take a charger in case your phone runs out of battery.","Take a charger if your phone ran out yesterday.","Take a charger unless your phone has no battery."],"answer":0,"why":"[[in case]] دلیل اقدام احتیاطی را بیان می‌کند."},{"type":"type","q":"به انگلیسی بنویس: «اگر قطار را از دست نداده بودیم، دیر نمی‌رسیدیم.»","answer":"If we had not missed the train, we would not have been late","accept":["If we hadn't missed the train, we wouldn't have been late"]},{"type":"blank","text":"If I had slept better, I ___ feel so tired now.","answer":"would not","hint":"پیامد حالِ یک شرطِ گذشته.","accept":["wouldn't"]},{"type":"mc","q":"کدام ساختار صحیح است؟","options":["Unless you do not hurry, you will miss it.","Unless you hurry, you will miss it.","Unless you will hurry, you miss it."],"answer":1,"why":"[[unless]] خود معنای «اگر نه» دارد."},{"type":"type","q":"به انگلیسی بنویس: «به شرط اینکه همه موافق باشند، شروع می‌کنیم.»","answer":"We will start provided that everyone agrees","accept":["We'll start provided that everyone agrees","Provided that everyone agrees, we will start"]}],"glossary":{"a":"یک","abroad":"خارج از کشور","afford":"توان مالی داشتن","again":"دوباره","ago":"پیش","agrees":"موافقت می‌کند","alone":"تنها","also":"همچنین","an":"یک","application":"درخواست","apply":"درخواست دادن","applying":"در حال اعمال","are":"هستند","as":"چنان‌که","available":"در دسترس / دارای ظرفیت","be":"بودن","because":"زیرا","been":"بوده","book":"کتاب","booked":"رزرو کرده بود","bristol":"بریستول","but":"اما","calmer":"آرام‌تر","carefully":"با دقت","case":"مورد / حالت","chance":"شانس / فرصت","cheaper":"ارزان‌تر","check":"بررسی‌کردن","checked":"بررسی‌کرده","checking":"بررسی کردن / در حال بررسی","choose":"انتخاب‌کردن","city":"شهر","conditional":"شرطی","considered":"در نظر گرفته","could":"می‌توانستم","course":"دوره","deadline":"مهلت","decided":"تصمیم گرفت / گرفته","did":"انجام داد","do":"انجام دادن","documents":"مدارک","does":"انجام می‌دهد","earlier":"زودتر","early":"زود","email":"ایمیل","encourages":"تشویق می‌کند","enjoy":"لذت بردن","evenings":"عصرها","every":"هر","expected":"مورد انتظار","feel":"احساس‌کردن","first":"اول","flat":"آپارتمان","for":"برای","forecast":"پیش‌بینی","form":"فرم","friend":"دوست","get":"گرفتن","giving":"دادن","got":"گرفت","had":"داشت","happens":"اتفاق می‌افتد","has":"دارد","have":"داشتن","her":"او را","high":"بلند","higher":"بالاتر","i":"من","i'd":"می‌کردم","i'll":"خواهم","i've":"کرده‌ام","if":"اگر","important":"مهم","improve":"بهبود دادن","in":"در","instead":"در عوض","instructions":"دستورالعمل‌ها","is":"است","it":"آن","june":"ژوئن","keep":"نگه‌داشتن","know":"دانستن","knows":"می‌داند","language":"زبان","last":"آخر","leo":"لئو","list":"فهرست","live":"زندگی‌کردن","long":"تا وقتی","look":"نگاه کردن","make":"ساختن","might":"شاید","mina":"مینا","miss":"از دست دادن","missed":"از دست داده","mistake":"اشتباه","mixed":"ترکیبی","money":"پول","months":"ماه‌ها","more":"بیشتر","move":"حرکت","my":"مال من","next":"کناری","not":"نه","now":"حالا","of":"از","on":"روی","one":"یک","only":"فقط","options":"گزینه‌ها","otherwise":"در غیر این صورت","outcome":"پیامد / نتیجه","passed":"گذشت / پایان یافت","place":"جا","places":"جاها / ظرفیت‌ها","plans":"برنامه‌ریزی می‌کند / برنامه‌ها","prepare":"آماده کردن / شدن","preparing":"در حال آماده‌کردن","privacy":"حریم خصوصی","provided":"مشروط","read":"خواندن","receives":"دریافت می‌کند","regret":"پشیمانی / پشیمان بودن","regrets":"پشیمان است","rent":"اجاره","requirement":"شرط / الزام","requirements":"شرایط / الزامات","results":"نتایج","save":"پس‌انداز کردن / ذخیره کردن","says":"می‌گوید","scholarship":"بورسیه","second":"دوم","september":"سپتامبر","share":"به اشتراک گذاشتن","sharing":"به‌اشتراک‌گذاشتن","she":"او","something":"چیزی","soon":"به‌زودی","spending":"صرف کردن / گذراندن","spring":"بهار","started":"شروع کرد / شروع شده","stayed":"ماند","still":"هنوز","students":"دانشجویان","study":"درس خواندن","submit":"ثبت / ارسال کردن","submitted":"ثبت کرد","suppose":"فرض کن","take":"گرفتن","test":"آزمون","than":"از","that":"که","the":"حرف تعریف","there":"آنجا","they":"آن‌ها","third":"سوم","this":"این","time":"زمان","to":"برای","today":"امروز","too":"هم","university":"دانشگاه","unless":"مگر اینکه","up":"بالا","usually":"معمولاً","wants":"می‌خواهد","week":"هفته","were":"بودند","what":"چه","whatever":"هرچه / هر اتفاقی که","which":"کدام","will":"خواهیم","wish":"آرزو","would":"می‌ـ","yes":"بله","you":"تو / شما","zero":"صفر"}},{"id":"en08","order":8,"level":"B2","minutes":25,"title":"مجهول و نقل‌قول غیرمستقیم","titleEn":"Passive Voice and Reported Speech","blocks":[{"type":"dialog","lines":[{"de":"Have the results of the student survey been published?","fa":"نتیجه‌های نظرسنجی دانشجویی منتشر شده‌اند؟"},{"de":"Not yet. The report is being checked by the research team.","fa":"هنوز نه. گزارش دارد توسط تیم پژوهش بررسی می‌شود."},{"de":"I thought the director said it was ready yesterday.","fa":"فکر می‌کردم مدیر دیروز گفته بود آماده است."},{"de":"She said they had finished the first version.","fa":"گفت نسخهٔ اول را تمام کرده بودند."},{"de":"Did she say when the final report would be released?","fa":"گفت گزارش نهایی چه وقت منتشر می‌شود؟"},{"de":"She told us it would be shared on Friday.","fa":"به ما گفت جمعه به اشتراک گذاشته می‌شود."},{"de":"Was the survey conducted online?","fa":"نظرسنجی به صورت آنلاین انجام شده بود؟"},{"de":"Yes, and more than six hundred students took part.","fa":"بله، و بیش از ششصد دانشجو شرکت کردند."},{"de":"Did anyone ask whether the answers were anonymous?","fa":"کسی پرسید آیا پاسخ‌ها ناشناس بوده‌اند؟"},{"de":"Yes. The director explained that names had not been collected.","fa":"بله. مدیر توضیح داد که نام‌ها جمع‌آوری نشده بودند."},{"de":"What about the new study room?","fa":"اتاق مطالعهٔ جدید چی شد؟"},{"de":"It is being built now, and the equipment will be installed next month.","fa":"الان در حال ساخت است و تجهیزات ماه بعد نصب می‌شوند."},{"de":"Could you tell me who designed it?","fa":"می‌توانی بگویی چه کسی آن را طراحی کرده؟"},{"de":"The manager said a local architect had designed it.","fa":"مدیر گفت یک معمار محلی آن را طراحی کرده بود."}]},{"type":"vocab","items":[{"de":"passive voice","fa":"وجه مجهول","note":"ساخت کلی: be + past participle."},{"de":"active voice","fa":"وجه معلوم","note":"فاعلِ عمل مشخص است: The team checked it."},{"de":"past participle","fa":"شکل سوم فعل","note":"written, built, checked؛ برای مجهول ضروری است."},{"de":"reported speech","fa":"نقل‌قول غیرمستقیم","note":"He said that ...؛ تغییر زمان بسته به بافت."},{"de":"to announce","fa":"اعلام کردن","note":"The results will be announced."},{"de":"to publish","fa":"منتشر کردن","note":"The report was published yesterday."},{"de":"to release","fa":"منتشر یا عرضه کردن","note":"release a report / new version."},{"de":"to conduct","fa":"انجام دادن (پژوهش)","note":"conduct a survey."},{"de":"to collect","fa":"جمع‌آوری کردن","note":"collect personal data."},{"de":"to install","fa":"نصب کردن","note":"The equipment will be installed."},{"de":"to design","fa":"طراحی کردن","note":"was designed by an architect."},{"de":"to repair","fa":"تعمیر کردن","note":"The road is being repaired."},{"de":"to check","fa":"بررسی کردن","note":"The data have been checked."},{"de":"to approve","fa":"تأیید کردن","note":"The plan must be approved."},{"de":"to warn","fa":"هشدار دادن","note":"warn somebody not to do something."},{"de":"to advise","fa":"توصیه کردن","note":"advise somebody to wait."},{"de":"to claim","fa":"ادعا کردن","note":"He claimed that it was safe."},{"de":"to deny","fa":"انکار کردن","note":"deny doing something."},{"de":"to explain","fa":"توضیح دادن","note":"explain that ... / explain something to someone."},{"de":"to remind","fa":"یادآوری کردن","note":"remind somebody to send a form."},{"de":"survey","fa":"نظرسنجی / پیمایش","note":"conduct a survey."},{"de":"anonymous","fa":"ناشناس","note":"anonymous answers protect privacy."},{"de":"reliable","fa":"قابل اعتماد","note":"a reliable source."},{"de":"equipment","fa":"تجهیزات","note":"اسم غیرقابل‌شمارش است: the equipment is."},{"de":"deadline","fa":"مهلت نهایی","note":"a deadline was announced."},{"de":"whether","fa":"آیا / خواه ... یا نه","note":"در پرسش غیرمستقیم بله/خیر."},{"de":"by","fa":"توسط","note":"در جملهٔ مجهول برای عامل: by the team."},{"de":"according to","fa":"طبق گفتهٔ / بر اساس","note":"برای ارجاع به منبع، نه لزوماً جملهٔ گزارش‌شده."}]},{"type":"grammar","title":"ساخت مجهول در زمان‌های مهم","body":"در مجهول، توجه روی عمل یا چیزی است که عمل روی آن انجام می‌شود، نه لزوماً انجام‌دهنده. ساخت پایه [[be + past participle]] است. زمان و نمود با تغییر شکل [[be]] مشخص می‌شود: حال ساده [[is published]]، گذشتهٔ ساده [[was published]]، حال استمراری [[is being published]]، حال کامل [[has been published]]، گذشتهٔ کامل [[had been published]] و آینده [[will be published]]. با فعل وجهی می‌گوییم [[must be checked]]. عامل را فقط اگر مهم باشد با [[by]] اضافه کن.\nمثال‌ها: [[The library is used every day.]] (کتابخانه هر روز استفاده می‌شود)؛ [[The report was published yesterday.]] (گزارش دیروز منتشر شد)؛ [[The road is being repaired.]] (جاده در حال تعمیر است)؛ [[The results have been announced.]] (نتیجه‌ها اعلام شده‌اند)؛ [[The form had been signed before the meeting.]] (فرم پیش از جلسه امضا شده بود)؛ [[The equipment will be installed next week.]] (تجهیزات هفتهٔ آینده نصب می‌شوند)؛ [[Personal data must be protected.]] (داده‌های شخصی باید محافظت شوند)."},{"type":"tip","body":"در مجهولِ استمراری، [[being]] را جا ننداز: [[The road is being repaired.]] یعنی الان در حال تعمیر است. [[The road is repaired.]] اغلب چنین معنای استمراریِ صریحی ندارد."},{"type":"grammar","title":"نقل غیرمستقیم: said، told، backshift","body":"برای بازگویی گفتهٔ دیگران می‌توان از [[said (that)]] استفاده کرد. [[told]] معمولاً به مفعول شخصی نیاز دارد: [[She told me that ...]]. اگر فعل گزارش در گذشته باشد، زمان فعلِ گفته اغلب یک مرحله به عقب منتقل می‌شود: حال ساده به گذشته، حال کامل به گذشتهٔ کامل، [[will]] به [[would]] و [[can]] به [[could]]. بااین‌حال اگر موضوع هنوز واقعیت دارد یا زمان/مکان تغییر نکرده، عقب‌بردن زمان همیشه ضروری نیست؛ به بافت دقت کن. ضمیرها و قیدها نیز بنا به موقعیت جدید تغییر می‌کنند.\nمثال‌ها: [[She said she was tired.]] (او گفت خسته بود)؛ [[He told me he had finished.]] (به من گفت کارش را تمام کرده بود)؛ [[They said they would arrive late.]] (گفتند دیر می‌رسند)؛ [[She said she could help.]] (گفت می‌توانست کمک کند)؛ [[He said the earth is round.]] (گفت زمین گرد است)؛ [[Mina told us she had called the office.]] (مینا به ما گفت با دفتر تماس گرفته بود)؛ [[The teacher said the test was difficult.]] (معلم گفت آزمون سخت بوده است)."},{"type":"mistakes","items":[{"wrong":"She said me that she was late.","right":"She told me that she was late.","fa":"با told مخاطب می‌آید؛ بعد از said به این شکل me نمی‌گذاریم."},{"wrong":"He asked where was the office.","right":"He asked where the office was.","fa":"در سؤال غیرمستقیم ترتیب جمله خبری است، نه وارونگی سؤال مستقیم."},{"wrong":"The document has checked.","right":"The document has been checked.","fa":"حال کامل مجهول به has/have been + p.p. نیاز دارد."}]},{"type":"grammar","title":"نقل سؤال و دستور: if / whether / to + verb","body":"برای گزارش سؤال بله/خیر از [[asked if]] یا [[asked whether]] استفاده کن. برای پرسش‌های دارای [[where]]، [[when]]، [[why]] یا [[how]] همان کلمهٔ پرسشی باقی می‌ماند، ولی ترتیب جمله مانند جملهٔ خبری است. گزارش دستور و درخواست معمولاً با [[told / asked + person + to + verb]] ساخته می‌شود و دستور منفی با [[not to]]. در مجهول، پرسش نیز با جابه‌جایی فعل کمکی ساخته می‌شود. مرجع ضمیرها را از دید گویندهٔ تازه تنظیم کن.\nمثال‌ها: [[He asked whether I was ready.]] (پرسید آیا آماده‌ام)؛ [[She asked where I lived.]] (پرسید کجا زندگی می‌کردم)؛ [[The teacher asked us to wait.]] (معلم از ما خواست صبر کنیم)؛ [[The guard told us not to touch the door.]] (نگهبان گفت به در دست نزنیم)؛ [[She asked when the results would be published.]] (پرسید نتایج کی منتشر می‌شوند)؛ [[Was the room cleaned yesterday?]] (اتاق دیروز تمیز شد؟)؛ [[He asked if the report had been approved.]] (پرسید آیا گزارش تأیید شده بود)."},{"type":"tip","body":"با [[according to]] می‌توان منبع خبر را ذکر کرد، اما این ترکیب به‌تنهایی فعلِ گزارشی نیست. در خبرنویسی، تفاوت [[The report was published]] و [[The director said the report had been published]] مهم است: دومی ادعایی منسوب به مدیر است."},{"type":"text","de":"A new study centre was opened near the station last month. According to the university, the building was designed by a local architect and its equipment was paid for by several partners. The centre is used by students who need a quiet place to work. At the moment, another room is being prepared, and more computers will be installed next week. On Monday, a student survey was conducted online. More than six hundred answers were collected, but no names were recorded. The director said that the data had already been checked. She told the staff that the results would be published on Friday. One student asked whether the answers were anonymous. The director explained that no personal information had been stored. Another student wanted to know when the new room would be ready. The manager replied that it would open before the next exam period. Students were also reminded not to leave their bags in the corridors. By the end of the meeting, a short report had been written, and the main decisions were shared by email. Some students still had questions, so they were asked to contact the office directly. The university promised that feedback would be considered before the final plan was approved.","fa":"ماه گذشته یک مرکز مطالعهٔ تازه نزدیک ایستگاه افتتاح شد. طبق اعلام دانشگاه، ساختمانی که معمار محلی طراحی کرده با کمک مالی چند شریک تجهیز شده است. دانشجویانی که جای آرامی برای کار می‌خواهند از آن استفاده می‌کنند. اکنون اتاق دیگری آماده می‌شود و هفتهٔ آینده رایانه‌های بیشتری نصب خواهند شد. دوشنبه نظرسنجی آنلاین برگزار شد؛ بیش از ششصد پاسخ جمع‌آوری شد ولی نامی ثبت نشد. مدیر گفت داده‌ها قبلاً بررسی شده‌اند و به کارکنان اطلاع داد نتایج جمعه منتشر خواهند شد. یک دانشجو پرسید آیا پاسخ‌ها ناشناس‌اند؛ مدیر توضیح داد اطلاعات شخصی ذخیره نشده است. دانشجوی دیگری پرسید اتاق جدید کی آماده می‌شود؛ مدیر پاسخ داد پیش از دورهٔ امتحانات باز خواهد شد. همچنین به دانشجویان یادآوری شد کیف‌ها را در راهرو نگذارند. تا پایان جلسه گزارشی کوتاه نوشته شد و تصمیم‌های اصلی با ایمیل فرستاده شد. چند دانشجو هنوز سؤال داشتند و از آن‌ها خواسته شد مستقیم با دفتر تماس بگیرند. دانشگاه قول داد پیش از تأیید برنامهٔ نهایی، بازخوردها را بررسی کند."},{"type":"tip","body":"اگر گزارش مربوط به رویدادی در گذشته است ولی حقیقتِ جمله هنوز برقرار است، عقب‌بردن زمان ممکن است اختیاری باشد: [[She said the museum is free.]] و [[She said the museum was free.]] بسته به بافت هر دو می‌توانند درست باشند."}],"exercises":[{"type":"blank","text":"The first report ___ in 2024. (publish; past simple passive)","answer":"was published"},{"type":"mc","q":"مجهول حال استمراری جملهٔ They are repairing the road کدام است؟","options":["The road is being repaired.","The road has repaired.","The road was being repair."],"answer":0,"why":"حال استمراری مجهول: [[am/is/are being + past participle]]."},{"type":"type","q":"به انگلیسی بنویس: «گزارش دیروز منتشر شد.»","answer":"The report was published yesterday"},{"type":"blank","text":"The results have ___ announced.","answer":"been"},{"type":"mc","q":"گزارش درستِ Mia said, “I have lost my keys.” کدام است؟","options":["Mia said me she lost her keys.","Mia said she had lost her keys.","Mia told that she has lost her keys."],"answer":1,"why":"در گزارش با فعل گذشته، حال کامل معمولاً به گذشتهٔ کامل می‌رود."},{"type":"type","q":"به انگلیسی بنویس: «او به من گفت که خسته است.»","answer":"She told me that she was tired","accept":["She told me she was tired","She said that she was tired"]},{"type":"blank","text":"The manager asked whether the room ___ ready.","answer":"was"},{"type":"mc","q":"در سؤال غیرمستقیم کدام درست است؟","options":["He asked where was the station.","He asked where the station was.","He asked where is the station?"],"answer":1,"why":"در پرسش غیرمستقیم، ترتیب خبری است."},{"type":"type","q":"به انگلیسی بنویس: «نگهبان به ما گفت به در دست نزنیم.»","answer":"The guard told us not to touch the door"},{"type":"blank","text":"Personal data must ___ protected.","answer":"be"},{"type":"mc","q":"برای تبدیل “Will you come?” he asked، کدام طبیعی‌تر است؟","options":["He asked if I would come.","He asked would I come.","He asked if would I come."],"answer":0,"why":"در جملهٔ گزارشی [[if/whether + subject + would + verb]]."},{"type":"type","q":"به انگلیسی بنویس: «اتاق اکنون در حال تمیزشدن است.»","answer":"The room is being cleaned now","accept":["The room is being cleaned at the moment"]}],"glossary":{"a":"یک","about":"درباره","according":"طبق / مطابق","active":"معلوم / فعال","advise":"توصیه کردن","already":"قبلاً","also":"همچنین","and":"و","announce":"اعلام‌کردن","anonymous":"ناشناس","another":"دیگری","answers":"پاسخ‌ها","anyone":"هرکسی / کسی","approve":"تأیید کردن","approved":"تأیید شد / تأیید شده","architect":"معمار","ask":"پرسیدن","asked":"پرسید","at":"در","bags":"کیف‌ها","be":"شدن","been":"شده","before":"پیش از","being":"در حال","building":"ساختمان","built":"ساخته‌شده","but":"اما","by":"توسط","centre":"مرکز","check":"بررسی‌کردن","checked":"بررسی‌شده","claim":"ادعا کردن","collect":"جمع‌آوری کردن","collected":"جمع‌آوری شد","computers":"رایانه‌ها","conduct":"انجام دادن (پژوهش)","conducted":"انجام شد","considered":"در نظر گرفته","contact":"تماس گرفتن","corridors":"راهروها","could":"می‌توانست","data":"داده","deadline":"مهلت","decisions":"تصمیم‌ها","deny":"انکار کردن","design":"طراحی کردن","designed":"طراحی کرد","did":"انجام داد","directly":"مستقیماً","director":"مدیر","email":"ایمیل","end":"پایان","equipment":"تجهیزات","exam":"امتحان","explain":"توضیح دادن","explained":"توضیح داد","feedback":"بازخورد","final":"نهایی","finished":"تمام‌کرده","first":"اول","for":"برای","friday":"جمعه","had":"داشت","have":"داشتن","hundred":"صد","i":"من","in":"در","information":"اطلاعات","install":"نصب کردن","installed":"نصب شد / نصب‌شده","is":"است","it":"آن","its":"مال آن / متعلق به آن","know":"دانستن","last":"آخر","leave":"ترک‌کردن","local":"محلی","main":"اصلی","manager":"مدیر","me":"به من","meeting":"جلسه","moment":"لحظه","monday":"دوشنبه","month":"ماه","more":"بیشتر","names":"نام‌ها","near":"نزدیک","need":"نیاز داشتن","new":"جدید","next":"کناری","no":"نه","not":"نه","now":"اکنون","of":"از","office":"دفتر","on":"روی","one":"یک","online":"آنلاین","open":"باز کردن","opened":"افتتاح کرد","paid":"پرداخت‌شده","part":"بخش / در take part: شرکت‌کردن","participle":"وجه وصفی","partners":"شرکا / حامیان","passive":"مجهول","past":"گذشته","period":"دوره / بازه","personal":"شخصی","place":"جا","plan":"برنامه","prepared":"آماده شد / آماده‌شده","promised":"قول داد","publish":"منتشر کردن","published":"منتشرشده","questions":"سؤال‌ها","quiet":"ساکت","ready":"آماده","recorded":"ثبت شد / ضبط‌شده","release":"منتشر کردن","released":"منتشر شد / انتشار یافته","reliable":"قابل اعتماد","remind":"یادآوری کردن","reminded":"یادآوری شد","repair":"تعمیر کردن","replied":"جواب داد","report":"گزارش","reported":"گزارش‌شده / غیرمستقیم","research":"پژوهش","results":"نتایج","room":"اتاق","said":"گفت","say":"گفتن","several":"چند","shared":"به اشتراک گذاشت","she":"او","short":"کوتاه","six":"شش","so":"پس","some":"بعضی","speech":"گفتار / سخن","staff":"کارکنان","station":"ایستگاه","still":"هنوز","stored":"ذخیره شد / ذخیره‌شده","student":"دانشجو","students":"دانشجویان","study":"درس خواندن","survey":"نظرسنجی","team":"گروه","tell":"گفتن","than":"از","that":"که","the":"حرف تعریف","their":"مال آن‌ها","they":"آن‌ها","thought":"فکر می‌کرد / فکر","to":"برای","told":"به ... گفت","took":"گرفت","university":"دانشگاه","us":"ما","used":"استفاده‌شده","version":"نسخه","voice":"صدا / وجه (دستوری)","wanted":"می‌خواست","warn":"هشدار دادن","was":"بود","week":"هفته","were":"بودند","what":"چه","when":"کی","whether":"آیا","who":"کی","will":"خواهد","work":"کار","would":"می‌ـ","written":"نوشته‌شده","yes":"بله","yesterday":"دیروز","yet":"هنوز","you":"تو / شما"}},{"id":"en09","order":9,"level":"B2","minutes":25,"title":"جمله‌واره‌های موصولی، وجه وصفی و وارونگی","titleEn":"Relative Clauses, Participles and Inversion","blocks":[{"type":"dialog","lines":[{"de":"Did you visit the science centre that opened last year?","fa":"به مرکز علمی‌ای که پارسال افتتاح شد سر زدی؟"},{"de":"Yes. My sister, who studies biology, took me there.","fa":"بله. خواهرم که زیست‌شناسی می‌خواند مرا برد آنجا."},{"de":"Was there a guide who could explain the experiments?","fa":"راهنمایی بود که بتواند آزمایش‌ها را توضیح بدهد؟"},{"de":"We met a researcher whose work focuses on memory.","fa":"با پژوهشگری آشنا شدیم که کارش روی حافظه متمرکز است."},{"de":"That sounds fascinating. Did you understand everything?","fa":"جالب به نظر می‌آید. همه چیز را فهمیدی؟"},{"de":"Not quite. The first machine I saw was complicated.","fa":"نه کاملاً. اولین دستگاهی که دیدم پیچیده بود."},{"de":"What happened when you entered the laboratory?","fa":"وقتی وارد آزمایشگاه شدی چه شد؟"},{"de":"Walking through the door, I noticed a strange sound.","fa":"وقتی از در رد می‌شدم، متوجه صدای عجیبی شدم."},{"de":"Did the guide explain what was making it?","fa":"راهنما توضیح داد چه چیزی آن صدا را ایجاد می‌کرد؟"},{"de":"Yes. The device placed near the window was recording signals.","fa":"بله. دستگاهی که کنار پنجره قرار داشت سیگنال‌ها را ثبت می‌کرد."},{"de":"Had you ever seen anything like that before?","fa":"قبلاً چیزی شبیه آن دیده بودی؟"},{"de":"Never had I seen such detailed images of the brain.","fa":"تا آن موقع هرگز چنین تصاویر دقیقی از مغز ندیده بودم."},{"de":"Did you learn anything surprising?","fa":"چیز غافلگیرکننده‌ای یاد گرفتی؟"},{"de":"Only after the demonstration did I understand the results.","fa":"فقط بعد از نمایش بود که نتایج را فهمیدم."}]},{"type":"vocab","items":[{"de":"defining relative clause","fa":"جمله‌وارهٔ موصولیِ تعیین‌کننده","note":"اطلاعات لازم؛ بدون کاما."},{"de":"non-defining relative clause","fa":"جمله‌وارهٔ موصولیِ توضیحی","note":"اطلاعات اضافه، بین کاما؛ that نمی‌آید."},{"de":"who","fa":"که؛ برای شخص","note":"The student who called me."},{"de":"whom","fa":"که؛ مفعولی برای شخص","note":"رسمی؛ در گفتار اغلب who یا حذف."},{"de":"whose","fa":"که ... متعلق به اوست","note":"برای مالکیت اشخاص و حتی اشیا."},{"de":"which","fa":"که؛ برای چیز یا حیوان","note":"در بند توضیحی می‌آید؛ نه that."},{"de":"that","fa":"که؛ در بند تعیین‌کننده","note":"برای شخص یا چیز؛ در non-defining ممنوع."},{"de":"where","fa":"جایی که","note":"The lab where I worked."},{"de":"when","fa":"زمانی که","note":"The day when we met."},{"de":"participle clause","fa":"جمله‌وارهٔ وجه وصفی","note":"برای خلاصه‌کردن بندهای دارای مرجع مناسب."},{"de":"present participle","fa":"وجه وصفی حال","note":"فرم ing: Walking along the road ..."},{"de":"past participle","fa":"وجه وصفی گذشته","note":"broken, written, placed؛ اغلب نقش مجهول."},{"de":"having finished","fa":"پس از تمام‌کردن","note":"برای نشان‌دادن تقدم یک عمل: Having finished ..."},{"de":"inversion","fa":"وارونگی","note":"جابه‌جایی فعل کمکی و فاعل در ساختارهای خاص."},{"de":"rarely","fa":"به‌ندرت","note":"Rarely do we see this."},{"de":"seldom","fa":"به‌ندرت","note":"Seldom have I heard that."},{"de":"never","fa":"هرگز","note":"Never have I seen ... با وارونگی."},{"de":"not until","fa":"نه تا زمانی که","note":"Not until Friday did we know."},{"de":"only after","fa":"فقط بعد از","note":"Only after the meeting did she call."},{"de":"hardly","fa":"به‌سختی / به‌محض اینکه","note":"Hardly had I arrived when ..."},{"de":"researcher","fa":"پژوهشگر","note":"a researcher whose work ..."},{"de":"experiment","fa":"آزمایش","note":"conduct an experiment."},{"de":"demonstration","fa":"نمایش علمی / توضیح عملی","note":"after the demonstration."},{"de":"device","fa":"دستگاه","note":"a device placed near the window."},{"de":"signal","fa":"سیگنال","note":"record a signal."},{"de":"laboratory","fa":"آزمایشگاه","note":"laboratory یا کوتاه‌شدهٔ lab."},{"de":"to notice","fa":"متوجه شدن","note":"notice a sound or change."},{"de":"to overlook","fa":"نادیده گرفتن","note":"overlook a detail."}]},{"type":"grammar","title":"موصولی تعیین‌کننده و توضیحی: تفاوتی مهم در معنا","body":"جمله‌وارهٔ [[defining]] مشخص می‌کند دقیقاً دربارهٔ چه کسی یا چه چیزی حرف می‌زنیم؛ ویرگول نمی‌گیرد. [[who]] معمولاً برای اشخاص، [[which]] برای اشیا، [[whose]] برای مالکیت و [[where]] برای مکان است. [[that]] می‌تواند در بند تعیین‌کننده جای who یا which را بگیرد. اگر ضمیر موصولی نقش مفعول داشته باشد گاهی می‌توان آن را حذف کرد. اما جمله‌وارهٔ [[non-defining]] توضیح اضافی می‌دهد، با ویرگول جدا می‌شود، و در آن از [[that]] استفاده نمی‌کنیم. حذف ضمیر موصولی در بند توضیحی مجاز نیست.\nمثال‌ها: [[The student who called is my friend.]] (دانشجویی که تماس گرفت دوست من است)؛ [[The book that I borrowed is useful.]] (کتابی که قرض گرفتم مفید است)؛ [[The book I borrowed is useful.]] (کتابی که قرض گرفتم مفید است)؛ [[My sister, who lives in Leeds, is a doctor.]] (خواهرم که در لیدز زندگی می‌کند پزشک است)؛ [[The laboratory, which opened in May, is busy.]] (آزمایشگاه که در مه افتتاح شد شلوغ است)؛ [[We met a researcher whose work is famous.]] (با پژوهشگری آشنا شدیم که کارش مشهور است)؛ [[This is the room where we studied.]] (این اتاقی است که در آن درس خواندیم)."},{"type":"tip","body":"در [[My brother, who lives abroad, is a doctor.]] بند بین ویرگول اطلاعات اضافه می‌دهد. اما [[My brother who lives abroad is a doctor.]] ممکن است یعنی چند برادر داری و منظورت آن یکی است که خارج زندگی می‌کند؛ پس ویرگول فقط تزئینی نیست."},{"type":"grammar","title":"Participle clauses: فشرده‌سازی بدون فاعلِ آویزان","body":"با [[-ing]] یا قسمت سوم فعل می‌توان بندهای طولانی را خلاصه کرد. معمولاً مرجع فاعلِ جمله‌واره باید همان فاعلِ جملهٔ اصلی باشد، مگر در ساختارهای مشخص دیگر. [[Walking into the lab, I noticed a sound]] یعنی من وارد شدم و من صدا را شنیدم. [[Having + past participle]] تقدم انجام یک عمل را روشن‌تر می‌کند. شکل گذشته در ساختارهای کوتاه‌شده غالباً به معنای مجهول است: [[The device placed on the table]]. مراقب [[dangling participle]] باش: نباید به اشتباه چنین برداشت شود که یک شیء بی‌جان عملی را انجام داده است.\nمثال‌ها: [[Walking to class, I met an old friend.]] (در راه کلاس با دوستی قدیمی دیدار کردم)؛ [[Feeling tired, she went home.]] (چون خسته بود به خانه رفت)؛ [[Having finished the test, he left the room.]] (پس از تمام‌کردن آزمون از اتاق بیرون رفت)؛ [[Built in 2020, the centre is still modern.]] (مرکزی که در سال ۲۰۲۰ ساخته شده هنوز مدرن است)؛ [[The documents sent yesterday have arrived.]] (مدارکی که دیروز ارسال شدند رسیده‌اند)؛ [[Not knowing the answer, I asked for help.]] (چون جواب را نمی‌دانستم درخواست کمک کردم)؛ [[Looking at the results, we noticed a pattern.]] (هنگام نگاه‌کردن به نتایج متوجه الگویی شدیم)."},{"type":"mistakes","items":[{"wrong":"My friend, that lives here, is a doctor.","right":"My friend, who lives here, is a doctor.","fa":"در موصولی توضیحی که ویرگول دارد، that نمی‌آید."},{"wrong":"Walking into the room, the lights were bright.","right":"Walking into the room, I noticed the bright lights.","fa":"فاعل walking باید همان کسی باشد که وارد اتاق شده است؛ نه چراغ‌ها."},{"wrong":"Never I have seen that before.","right":"Never have I seen that before.","fa":"پس از Never ابتدای جمله، فعل کمکی پیش از فاعل می‌آید."}]},{"type":"grammar","title":"وارونگی پس از قیدهای محدودکننده و منفی","body":"در نوشتار رسمی‌تر یا برای تأکید، وقتی قیدهایی مانند [[never]]، [[rarely]]، [[seldom]]، [[only after]] یا [[not until]] در آغاز جمله قرار می‌گیرند، در بند اصلی معمولاً فعل کمکی پیش از فاعل می‌آید. اگر فعل کمکی نداریم، از [[do/does/did]] کمک می‌گیریم. در [[only after]] و [[not until]] اگر عبارتی وابسته در آغاز باشد، وارونگی در **بند اصلی** رخ می‌دهد، نه لزوماً در خود عبارت وابسته. این ساختار در نوشتار B2+ دیده می‌شود اما استفادهٔ افراطی متن را مصنوعی می‌کند.\nمثال‌ها: [[Never have I seen such a view.]] (هرگز چنین منظره‌ای ندیده‌ام)؛ [[Rarely do students ask that question.]] (دانشجویان به‌ندرت آن سؤال را می‌پرسند)؛ [[Seldom had she felt so nervous.]] (او به‌ندرت این‌قدر مضطرب شده بود)؛ [[Only after the lecture did I understand the topic.]] (فقط بعد از درس موضوع را فهمیدم)؛ [[Not until Friday did they reply.]] (تا جمعه جواب ندادند)؛ [[Hardly had we arrived when it started raining.]] (به‌محض اینکه رسیدیم باران شروع شد)؛ [[Only when I read the report did I notice the error.]] (تنها وقتی گزارش را خواندم اشتباه را دیدم)."},{"type":"tip","body":"اگر بعد از [[only when]] یک جملهٔ کامل آمد، وارونگی در بندِ اصلی است: [[Only when I arrived did the lecture begin.]]، نه [[Only when did I arrive the lecture began.]]."},{"type":"text","de":"Last Friday, I visited a science centre that opened near the river. My sister, who studies biology, came with me. We met a researcher whose work focuses on memory and attention. She led us into a laboratory where several experiments were being demonstrated. Walking through the entrance, I noticed a quiet buzzing sound. The researcher explained that a machine placed near the window was recording signals from a model brain. Having checked the settings, she invited us to examine the images on a screen. The images, which were surprisingly detailed, showed how the signals changed over time. One student asked a question I had been too shy to ask myself. The researcher answered clearly, without using complicated words. Never had I seen such an engaging explanation. Only after the demonstration did I understand why the experiment mattered. Before leaving, we visited a small exhibition showing older scientific devices. Some were displayed beside notes written by their original inventors. My sister pointed out an instrument that had been used in a famous study. We stayed until closing time, when the staff began preparing for the next day. Rarely do I enjoy a museum visit so much, especially one that makes difficult ideas feel accessible.","fa":"جمعهٔ گذشته از مرکز علمی‌ای کنار رودخانه بازدید کردم. خواهرم که زیست‌شناسی می‌خواند همراه من آمد. با پژوهشگری آشنا شدیم که کارش روی حافظه و توجه است. او ما را به آزمایشگاهی برد که در آن چند آزمایش نمایش داده می‌شد. هنگام ورود صدای وزوز آرامی شنیدم. پژوهشگر گفت دستگاه کنار پنجره سیگنال‌های یک مغز مدل‌سازی‌شده را ثبت می‌کند. پس از بررسی تنظیمات، دعوتمان کرد تصاویر روی صفحه را ببینیم. تصاویر که به شکل شگفت‌آوری دقیق بودند، نشان می‌دادند سیگنال‌ها چگونه تغییر می‌کنند. دانشجویی پرسشی را مطرح کرد که خودم خجالت کشیده بودم بپرسم. پژوهشگر ساده و روشن توضیح داد. هرگز توضیحی تا این حد جذاب ندیده بودم. فقط بعد از نمایش متوجه اهمیت آزمایش شدم. پیش از رفتن، نمایشگاهی از دستگاه‌های علمی قدیمی دیدیم؛ کنار برخی یادداشت‌های مخترعان اصلی‌شان قرار داشت. خواهرم ابزاری را نشان داد که در مطالعه‌ای مشهور به کار رفته بود. تا زمان بسته‌شدن ماندیم، وقتی کارکنان برای روز بعد آماده می‌شدند. به‌ندرت این‌قدر از موزه لذت می‌برم، به‌خصوص جایی که مفاهیم دشوار را قابل‌فهم می‌کند."},{"type":"tip","body":"در نوشتار رسمی از [[whose]] برای اشیا هم می‌توان استفاده کرد: [[a company whose products are popular]]. این کاربرد محدود به انسان نیست."}],"exercises":[{"type":"mc","q":"در کدام جمله that مجاز نیست؟","options":["The book that I bought is new.","My teacher, that lives in Berlin, is kind.","The person that called me was polite."],"answer":1,"why":"در بند موصولیِ توضیحی با کاما، باید از [[who/which]] استفاده کنیم، نه [[that]]."},{"type":"blank","text":"The woman ___ brother works here is my teacher.","answer":"whose"},{"type":"type","q":"به انگلیسی بنویس: «کتابی که قرض گرفتم مفید است.»","answer":"The book I borrowed is useful","accept":["The book that I borrowed is useful","The book which I borrowed is useful"]},{"type":"mc","q":"کدام جمله dangling participle ندارد؟","options":["Driving to work, the rain started.","Walking into the room, I noticed the lights.","Having finished the test, the bell rang."],"answer":1,"why":"فاعلِ عمل در جمله‌وارهٔ participle با فاعل اصلی باید سازگار باشد."},{"type":"blank","text":"___ finished the exam, she went home.","answer":"Having"},{"type":"type","q":"به انگلیسی بنویس: «هرگز چنین چیزی ندیده‌ام.»","answer":"Never have I seen anything like this","accept":["Never have I seen anything like that"]},{"type":"mc","q":"کدام جمله وارونگی درست دارد؟","options":["Only after the lecture I understood the topic.","Only after the lecture did I understand the topic.","Only after did I understand the lecture the topic."],"answer":1,"why":"وقتی only after در آغاز باشد، فعل کمکی پیش از فاعلِ بند اصلی می‌آید."},{"type":"blank","text":"The laboratory, ___ opened last year, is already famous.","answer":"which"},{"type":"type","q":"به انگلیسی بنویس: «زنی که کنار در ایستاده، معلم من است.»","answer":"The woman standing by the door is my teacher","accept":["The woman who is standing by the door is my teacher"]},{"type":"blank","text":"Rarely ___ we see such a result.","answer":"do"},{"type":"mc","q":"کدام گزینه کوتاه‌سازی درستی است؟","options":["Built in 2019, the museum attracts visitors.","Building in 2019, the museum attracts visitors.","Walking in 2019, the museum was built."],"answer":0,"why":"[[Built in 2019]] یک participle phrase مجهول است و دربارهٔ museum توضیح می‌دهد."},{"type":"type","q":"به انگلیسی بنویس: «فقط بعد از جلسه، جواب را فهمیدم.»","answer":"Only after the meeting did I understand the answer","accept":["Only after the meeting did I understand the response"]}],"glossary":{"a":"یک","accessible":"قابل‌دسترس / قابل‌فهم","after":"پس از","an":"یک","and":"و","answered":"پاسخ داد","anything":"هر چیزی / چیزی","ask":"پرسیدن","asked":"پرسید","attention":"توجه","been":"بوده","before":"پیش از","began":"شروع شد / آغاز کرد","being":"در حال","beside":"کنار","biology":"زیست‌شناسی","brain":"مغز","buzzing":"وزوز / صدای زنبورگونه","by":"کنار","came":"آمد","centre":"مرکز","changed":"تغییر کرد","checked":"بررسی‌کرده","clause":"بند","clearly":"روشن","closing":"بسته‌شدن / ساعت تعطیلی","complicated":"پیچیده","could":"می‌توانست","day":"روز","defining":"محدودکننده","demonstrated":"به نمایش گذاشته شد","demonstration":"نمایش عملی / توضیح علمی","detailed":"دقیق / پرجزئیات","device":"دستگاه","devices":"دستگاه‌ها","did":"کرد","difficult":"سخت","displayed":"به نمایش درآمد / نمایش داده‌شده","do":"انجام دادن","door":"در","engaging":"جذاب / درگیرکننده","enjoy":"لذت بردن","entered":"وارد شد","entrance":"ورودی","especially":"به‌ویژه","ever":"تاکنون / هرگز (در سؤال)","everything":"همه‌چیز","examine":"بررسی کردن / مشاهدهٔ دقیق","exhibition":"نمایشگاه","experiment":"آزمایش","experiments":"آزمایش‌ها","explain":"توضیح دادن","explained":"توضیح داد","explanation":"توضیح","famous":"مشهور","fascinating":"بسیار جالب / جذاب","feel":"احساس‌کردن","finished":"تمام‌کرده","first":"اول","focuses":"متمرکز است","for":"برای","friday":"جمعه","from":"از","guide":"راهنما","had":"داشت","happened":"اتفاق افتاد","hardly":"به‌سختی","having":"داشتن","how":"چطور","i":"من","ideas":"ایده‌ها / مفاهیم","images":"تصاویر","in":"در","instrument":"ابزار علمی / دستگاه","into":"به داخل","inventors":"مخترعان","inversion":"وارونگی","invited":"دعوت کرد","it":"آن","laboratory":"آزمایشگاه","last":"آخر","learn":"یاد گرفتن","leaving":"ترک‌کردن / رفتن","led":"هدایت کرد / برد","like":"دوست داشتن","machine":"دستگاه / ماشین","makes":"می‌سازد / باعث می‌شود","making":"ساختن / ایجادکردن","mattered":"اهمیت داشت","me":"به من","memory":"حافظه","met":"دیدار کرد / آشنا شد","model":"مدل / نمونهٔ شبیه‌سازی‌شده","much":"زیاد","museum":"موزه","my":"مال من","myself":"خودم","near":"نزدیک","never":"هرگز","next":"کناری","non":"غیر / نا (پیشوند)","not":"نه","notes":"یادداشت‌ها","notice":"متوجه شدن","noticed":"متوجه شد","of":"از","older":"قدیمی‌تر","on":"روی","one":"یک","only":"فقط","opened":"افتتاح‌شده","original":"اصلی / اولیه","out":"بیرون","over":"روی","overlook":"نادیده گرفتن","participle":"وجه وصفی","past":"گذشته","placed":"قرار داده شد / قرارگرفته","pointed":"اشاره کرد","preparing":"در حال آماده‌کردن","present":"حال","question":"سؤال","quiet":"آرام","quite":"کاملاً / نسبتاً","rarely":"به‌ندرت","recording":"در حال ثبت‌کردن","relative":"موصولی","researcher":"پژوهشگر","results":"نتایج","river":"رودخانه","saw":"دید","science":"علم","scientific":"علمی","screen":"صفحه‌نمایش","seen":"دیده","seldom":"به‌ندرت","settings":"تنظیمات","several":"چند","she":"او","showed":"نشان داد","showing":"نشان‌دادن / به نمایش گذاشتن","shy":"خجالتی","signal":"سیگنال / علامت","signals":"سیگنال‌ها / علامت‌ها","sister":"خواهر","small":"کوچک","so":"پس","some":"بعضی","sound":"صدا","sounds":"به نظر می‌رسد / صداها","staff":"کارکنان","stayed":"ماند","strange":"عجیب","student":"دانشجو","studies":"درس می‌خواند / مطالعات","study":"درس خواندن","such":"چنین","surprising":"غافلگیرکننده","surprisingly":"به‌طرز غافلگیرکننده","that":"که","the":"حرف تعریف","their":"مال آن‌ها","there":"آنجا","through":"از میان","time":"زمان","to":"به","too":"هم","took":"گرفت","understand":"فهمیدن","until":"تا","us":"ما را","used":"استفاده‌شده","using":"با استفاده از","visit":"بازدید کردن","visited":"بازدید کرد","walking":"قدم‌زدن / راه‌رفتن","was":"بود","we":"ما","were":"بودند","what":"چه","when":"وقتی که","where":"جایی که","which":"که","who":"که","whom":"که را","whose":"که مال او","why":"چرا","window":"پنجره","with":"با","without":"بدون","words":"کلمات","work":"کار","written":"نوشته‌شده","year":"سال","yes":"بله","you":"تو","non-defining":"غیرتحدیدی"}},{"id":"en10","order":10,"level":"B2","minutes":25,"title":"اصطلاح‌ها و انگلیسی طبیعی","titleEn":"Idioms, register and natural English","blocks":[{"type":"dialog","lines":[{"de":"You look worried about tomorrow's presentation.","fa":"به نظر می‌آید نگران ارائهٔ فردایی."},{"de":"I am. I do not know how to break the ice.","fa":"هستم. نمی‌دانم چطور سر صحبت را باز کنم."},{"de":"Start with a short story. That usually puts people at ease.","fa":"با یک داستان کوتاه شروع کن. این معمولاً مردم را راحت می‌کند."},{"de":"Good idea. I also want to get straight to the point.","fa":"فکر خوبیه. می‌خواهم مستقیم بروم سر اصل مطلب."},{"de":"Exactly. Do not beat around the bush for ten minutes.","fa":"دقیقاً. ده دقیقه حاشیه نرو."},{"de":"Our manager says the new plan will cost an arm and a leg.","fa":"مدیرمان می‌گوید برنامهٔ تازه خیلی گران تمام می‌شود."},{"de":"Then say the costs may be substantial. It sounds more professional.","fa":"پس بگو هزینه‌ها ممکن است قابل‌توجه باشند. حرفه‌ای‌تر است."},{"de":"What if someone asks about the problems we had?","fa":"اگر کسی دربارهٔ مشکل‌هایی که داشتیم پرسید چی؟"},{"de":"Be honest. Do not sweep them under the rug.","fa":"صادق باش. مشکلات را زیر فرش پنهان نکن."},{"de":"I hope nobody spills the beans about our surprise.","fa":"امیدوارم کسی سورپرایزمان را لو ندهد."},{"de":"Relax. We are all on the same page about confidentiality.","fa":"آرام باش. همه دربارهٔ محرمانه‌بودن هم‌نظر هستیم."},{"de":"Maybe I am overthinking it. The slides are finally ready.","fa":"شاید دارم زیادی فکر می‌کنم. اسلایدها بالاخره آماده‌اند."},{"de":"You have worked hard. The practice will pay off.","fa":"خیلی زحمت کشیده‌ای. تمرین نتیجه می‌دهد."},{"de":"Thanks. Let us call it a day and get some sleep.","fa":"مرسی. بیایید کار امروز را تمام کنیم و کمی بخوابیم."}]},{"type":"vocab","items":[{"de":"break the ice","fa":"سر صحبت را باز کردن","note":"محاوره‌ای و مناسب شروع جلسه."},{"de":"hit the nail on the head","fa":"دقیقاً به نکتهٔ اصلی زدن","note":"در بحث و تحلیل طبیعی است."},{"de":"beat around the bush","fa":"حاشیه رفتن","note":"معمولاً با بار انتقادی."},{"de":"spill the beans","fa":"راز را لو دادن","note":"غیررسمی؛ برای متن رسمی مناسب نیست."},{"de":"a piece of cake","fa":"مثل آب خوردن / بسیار آسان","note":"محاوره‌ای و غیررسمی."},{"de":"call it a day","fa":"کار را برای امروز تمام کردن","note":"در محیط کاری غیررسمی."},{"de":"under the weather","fa":"کمی ناخوش بودن","note":"برای ناخوشی خفیف؛ غیررسمی."},{"de":"cost an arm and a leg","fa":"خیلی گران تمام شدن","note":"اغراق‌آمیز؛ در گزارش رسمی ننویس."},{"de":"get down to business","fa":"رفتن سراغ کار اصلی","note":"برای جلسه‌ها و پروژه‌ها."},{"de":"on the same page","fa":"هم‌نظر / هم‌اطلاع","note":"We are on the same page."},{"de":"jump the gun","fa":"عجولانه شروع کردن","note":"یعنی پیش از زمان مناسب اقدام کردن."},{"de":"pay off","fa":"نتیجه دادن / به ثمر نشستن","note":"Hard work pays off."},{"de":"cheer somebody up","fa":"حال کسی را بهتر کردن","note":"فعل جداشدنی: cheer her up."},{"de":"cut corners","fa":"کیفیت را فدای سرعت یا هزینه کردن","note":"معمولاً بار منفی دارد."},{"de":"keep an eye on","fa":"مراقب چیزی بودن","note":"Keep an eye on the time."},{"de":"a blessing in disguise","fa":"خیرِ پنهان در اتفاقی بد","note":"اتفاقی بد که بعدها سودمند می‌شود."},{"de":"the last straw","fa":"قطرهٔ آخر / کاسهٔ صبر","note":"The delay was the last straw."},{"de":"get something off your chest","fa":"حرفی سنگین را از دل گفتن","note":"دربارهٔ نگرانی یا احساس."},{"de":"make a long story short","fa":"خلاصه‌اش این است","note":"محاوره‌ای، برای کوتاه‌کردن روایت."},{"de":"once in a blue moon","fa":"خیلی به‌ندرت","note":"معنای تحت‌اللفظی ندارد."},{"de":"look forward to","fa":"مشتاق بودن / منتظر بودن","note":"بعد از to اسم یا فعل ing: seeing you."},{"de":"run out of","fa":"تمام‌شدن موجودی چیزی","note":"We ran out of time."},{"de":"get along with","fa":"رابطهٔ خوبی داشتن","note":"get along with colleagues."},{"de":"take responsibility for","fa":"مسئولیت پذیرفتن","note":"ترکیب رسمی: responsibility for + noun/gerund."},{"de":"reach a conclusion","fa":"به نتیجه رسیدن","note":"collocation رسمی‌تر از make a conclusion."},{"de":"substantial","fa":"قابل‌توجه / چشمگیر","note":"substantial costs در گزارش رسمی."},{"de":"confidentiality","fa":"محرمانگی","note":"maintain confidentiality."},{"de":"to the point","fa":"مختصر و سرراست","note":"Keep your answer to the point."}]},{"type":"grammar","title":"اصطلاح، بافت و لحن: طبیعی اما نه همه‌جا","body":"اصطلاح‌ها اغلب معنا و لحن ثابتی دارند که با ترجمهٔ لفظی به دست نمی‌آید. [[spill the beans]] یعنی راز را لو دادن، نه ریختن لوبیا. در مکالمهٔ دوستانه استفاده از اصطلاح می‌تواند طبیعی باشد، اما انباشتن چند اصطلاح در یک جمله مصنوعی است. در گزارش دانشگاهی یا ایمیل رسمی، معمولاً واژهٔ روشن و مستقیم بهتر است. معنی اصطلاح را همراه موقعیت کاربردی و درجهٔ رسمی‌بودن به خاطر بسپار.\nمثال‌ها: [[She broke the ice with a joke.]] (او با شوخی سر صحبت را باز کرد)؛ [[You hit the nail on the head.]] (دقیقاً اصل مسئله را گفتی)؛ [[Please do not beat around the bush.]] (لطفاً حاشیه نرو)؛ [[Someone spilled the beans.]] (کسی راز را لو داد)؛ [[The exam was a piece of cake.]] (امتحان مثل آب خوردن بود)؛ [[Let us call it a day.]] (بیایید کار امروز را تمام کنیم)؛ [[The new laptop costs an arm and a leg.]] (لپ‌تاپ تازه خیلی گران است)."},{"type":"tip","body":"در ایمیل حرفه‌ای به‌جای [[The software costs an arm and a leg.]] بهتر است بنویسی [[The software is considerably more expensive.]]. هدف طبیعی‌بودن است، نه نمایش تعداد اصطلاحات."},{"type":"grammar","title":"Collocations و حروف اضافه: یادگیری به‌صورت تکه‌های زبانی","body":"بسیاری از عبارت‌های طبیعی، ترکیب‌های تثبیت‌شدهٔ فعل و اسم یا حرف اضافه‌اند که به آن‌ها [[collocations]] می‌گویند. در انگلیسی معمولاً [[make a decision]] و [[take responsibility]] می‌گوییم. بعد از [[look forward to]] حرف [[to]] حرف اضافه است، بنابراین اسم یا فعلِ [[-ing]] می‌آید. فعل عبارتی [[run out of]] با مفعول همراه می‌شود، و در [[cheer someone up]] اگر مفعول ضمیر باشد باید میان فعل و ذره قرار بگیرد. صرف حفظ لغتِ جدا کافی نیست؛ یک جملهٔ نمونه و نقش دستوری آن را هم حفظ کن.\nمثال‌ها: [[We made a decision yesterday.]] (دیروز تصمیم گرفتیم)؛ [[She took responsibility for the error.]] (او مسئولیت خطا را پذیرفت)؛ [[I look forward to hearing from you.]] (مشتاق دریافت پاسخ شما هستم)؛ [[We ran out of time.]] (وقتمان تمام شد)؛ [[He cheered me up after the exam.]] (بعد از امتحان حالم را بهتر کرد)؛ [[The practice finally paid off.]] (تمرین بالاخره نتیجه داد)؛ [[We reached a conclusion together.]] (با هم به نتیجه رسیدیم)."},{"type":"mistakes","items":[{"wrong":"I look forward to hear from you.","right":"I look forward to hearing from you.","fa":"در این عبارت to حرف اضافه است؛ فعل بعدش ing می‌گیرد."},{"wrong":"He cheered up me.","right":"He cheered me up.","fa":"در فعل جداشدنی با ضمیر مفعولی، ضمیر وسط قرار می‌گیرد."},{"wrong":"We made a research about the topic.","right":"We did research on the topic.","fa":"research در این کاربرد معمولاً غیرقابل‌شمارش است؛ do/conduct research on."}]},{"type":"grammar","title":"تبدیل لحن دوستانه به زبان حرفه‌ای","body":"محتوا را می‌توان بدون تغییر پیام، برای شنوندهٔ جدید بازنویسی کرد. یک اصطلاح دوستانه گاهی اثر صمیمی دارد، اما در گزارش‌ها ابهام یا اغراق ایجاد می‌کند. برای ارائهٔ دانشگاهی به‌جای بیان غیررسمیِ «سرهم‌بندی کردن»، صریحاً کمبود زمان یا کیفیت را توصیف کن. [[register]] یعنی انتخاب زبان متناسب با مخاطب و موقعیت. در گفت‌وگو با دوست، ساخت‌های کوتاه و مستقیم معمول‌اند؛ در ایمیل رسمی، بیان مؤدبانه و واژه‌های دقیق مفیدترند.\nمثال‌ها: [[The project cost a lot of money.]] (پروژه هزینهٔ زیادی داشت)؛ [[The project required substantial funding.]] (پروژه به بودجهٔ قابل‌توجهی نیاز داشت)؛ [[We need to get down to business.]] (باید سراغ کار اصلی برویم)؛ [[We should begin discussing the main issue.]] (باید بررسی موضوع اصلی را شروع کنیم)؛ [[We cut corners to save time.]] (برای صرفه‌جویی در زمان از کیفیت زدیم)؛ [[Some quality checks were omitted.]] (برخی بررسی‌های کیفیت حذف شدند)؛ [[I would appreciate your feedback.]] (از بازخورد شما سپاسگزار خواهم بود)."},{"type":"tip","body":"اصطلاح‌ها را در متن امتحان نوشتاری صرفاً برای «سطح بالاتر نشان‌دادن» نچپان. یک عبارت دقیق و مناسبِ مخاطب، از سه اصطلاح نابه‌جا ارزشمندتر است."},{"type":"text","de":"Nora was nervous before presenting her team's project. Her friend Maya tried to cheer her up and told her that the practice would pay off. At first, Nora wanted to break the ice with a funny story, but she was afraid of sounding unprofessional. Maya suggested a short introduction followed by a clear explanation of the main problem. When the presentation began, Nora took a deep breath. She did not beat around the bush. Instead, she got straight to the point and explained why the costs were higher than expected. In a private conversation, she might have said the equipment cost an arm and a leg. In front of the university committee, however, she called the expense substantial. A professor asked whether the team had cut corners during testing. Nora answered honestly that some checks had been delayed, but none had been cancelled. Her teammate then hit the nail on the head: the project needed better planning, not fewer safety checks. Everyone seemed to be on the same page. After the meeting, Maya said the talk had been a piece of cake. Nora laughed. It had not felt easy, but the preparation had clearly paid off. They decided to call it a day and celebrate with dinner.","fa":"نورا پیش از ارائهٔ پروژهٔ گروهشان مضطرب بود. دوستش مایا سعی کرد دلگرمش کند و گفت تمرین نتیجه خواهد داد. نورا اول می‌خواست با داستانی بامزه سر صحبت را باز کند، اما می‌ترسید غیرحرفه‌ای به نظر برسد. مایا پیشنهاد داد بعد از معرفی کوتاه، مسئلهٔ اصلی را واضح توضیح دهد. وقتی ارائه شروع شد، نورا نفس عمیقی کشید و حاشیه نرفت؛ مستقیم گفت چرا هزینه‌ها از انتظار بالاتر بوده‌اند. در گفت‌وگوی خصوصی شاید می‌گفت تجهیزات «خیلی خفن گران» بودند، اما جلوی کمیتهٔ دانشگاه هزینه را «قابل‌توجه» توصیف کرد. استادی پرسید آیا تیم در آزمایش‌ها از کیفیت زده است. نورا صادقانه گفت بعضی بررسی‌ها به تعویق افتاده‌اند اما هیچ‌کدام لغو نشده‌اند. هم‌تیمی‌اش اصل مسئله را دقیق بیان کرد: پروژه برنامه‌ریزی بهتر می‌خواست، نه بررسی ایمنی کمتر. به نظر رسید همه هم‌نظرند. بعد از جلسه مایا گفت ارائه مثل آب خوردن بوده است. نورا خندید. برای خودش آسان نبود، ولی تمرین قطعاً نتیجه داده بود. تصمیم گرفتند کار آن روز را تمام کنند و برای شام جشن کوچکی بگیرند."},{"type":"tip","body":"برای آمادگی B2، اصطلاح‌ها را به‌شکل «معنی + لحن + جایگزین رسمی» مرور کن. مثلاً [[a piece of cake]] (محاوره‌ای) در گزارش رسمی می‌شود [[relatively straightforward]]."}],"exercises":[{"type":"mc","q":"عبارت a piece of cake یعنی چه؟","options":["یک دسر گران","کاری بسیار آسان","مراسم رسمی"],"answer":1,"why":"[[a piece of cake]] اصطلاح محاوره‌ای برای کاری آسان است."},{"type":"blank","text":"Please do not beat around the ___.","answer":"bush"},{"type":"type","q":"به انگلیسی بنویس: «تمرین بالاخره نتیجه داد.»","answer":"The practice finally paid off","accept":["Practice finally paid off"]},{"ty const EN_LESSONS=[...EN_LESSONS_PART1,...EN_LESSONS_PART2,...EN_B2];

/* ---------- 2) STORAGE (never destroys foreign keys) ---------- */
const K="poof_v2";let db=null;
function readRaw(){try{const d=JSON.parse(localStorage.getItem(K));return d&&d.v===2?d:null}catch(e){return null}}
function load(){db=readRaw();if(!db)return false;if(!db.learn||typeof db.learn!=="object")db.learn={};return true}
// re-read fresh data, apply a mutation, write back (safe even if the main app changed data meanwhile)
function commit(fn){
 const d=readRaw();if(!d){toast("داده‌ی اپ اصلی پیدا نشد");return false}
 if(!d.learn||typeof d.learn!=="object")d.learn={};if(!Array.isArray(d.cards))d.cards=[];
 fn(d);try{localStorage.setItem(K,JSON.stringify(d));db=d;return true}catch(e){toast("ذخیره‌سازی ناموفق بود");return false}
}

/* ---------- 3) HELPERS ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="de">$1</span>').replace(/\n/g,"<br>");
const app=$("#app");let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
const I={lock:'<path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="9" rx="2.5"/>',play:'<path d="M8 5.5v13l11-6.5z"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',check:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12.3 2.8 2.7L16 9.5"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const done=l=>!!(db.learn[l.id]&&db.learn[l.id].completedAt);
/* ---------- TRACKS ---------- */
let TRACK="en";
try{TRACK=localStorage.getItem("poof_learn_track")||"en"}catch(e){}
if(TRACK!=="en"&&TRACK!=="de")TRACK="en";
let LESSONS=[];
function setTrack(t){TRACK=t;try{localStorage.setItem("poof_learn_track",t)}catch(e){}LESSONS=t==="en"?EN_LESSONS:DE_ALL;location.hash="#/";route()}
const trackName=()=>TRACK==="en"?"انگلیسی":"آلمانی پیشرفته";
const trackLang=()=>TRACK==="en"?"en":"de";
const byId=id=>LESSONS.find(l=>l.id===id);
/* status is DERIVED: completed > in-progress > available > locked */
function status(l){
 const p=db.learn[l.id]||{};if(p.completedAt)return"completed";if(p.startedAt)return"in-progress";
 const prev=LESSONS.find(x=>x.order===l.order-1);return(l.order===1||!prev||done(prev))?"available":"locked";
}
const LBL={locked:"قفل",available:"آماده",["in-progress"]:"در حال یادگیری",completed:"تمام‌شده"};
const ICN={locked:"lock",available:"play","in-progress":"clock",completed:"check"};
const nz=s=>String(s).toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[.,!?;:"«»]/g,"").replace(/\s+/g," ").trim();

/* ---------- 4) ROUTER: #/ · #/l01 · #/l01/ex ---------- */
function route(){
 hideSel();hideTap();
 if(!db)return viewError();
 const m=location.hash.match(/^#\/([a-z]+\d+)(\/ex)?$/),l=m&&byId(m[1]);
 if(!l)return viewPath();
 if(status(l)==="locked"){toast("اول درس قبلی را تمام کن");location.hash="#/";return}
 if(m[2])return viewEx(l);
 viewLesson(l);
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});

/* ---------- 5) VIEWS ---------- */
function viewError(){
 app.innerHTML=`<div class="card center"><h3>داده‌ی اپ پیدا نشد</h3><p class="mute">اطلاعات اپ اصلی (poof_v2) روی این دستگاه نیست یا خراب است. ابتدا اپ اصلی را یک‌بار باز کنید، بعد دوباره به اینجا برگردید.</p><a class="btn" href="index.html">رفتن به اپ اصلی</a></div>`;
}
function viewPath(){
 if(!LESSONS.length){app.innerHTML=`<div class="card center mute">هنوز درسی اضافه نشده.</div>`;return}
 const n=LESSONS.filter(done).length,next=LESSONS.slice().sort((a,b)=>a.order-b.order).find(l=>["in-progress","available"].includes(status(l)));
 const tabs=`<div class="row" style="margin-bottom:14px;gap:8px">
  <button class="btn ${TRACK==="en"?"":"ghost"}" style="flex:1" id="tabEn">🇬🇧 انگلیسی</button>
  <button class="btn ${TRACK==="de"?"":"ghost"}" style="flex:1" id="tabDe">🇩🇪 آلمانی پیشرفته</button></div>`;
 app.innerHTML=tabs+`<div class="card"><div class="row"><b>پیشرفت کلی · ${trackName()}</b><span class="mute">${n} از ${LESSONS.length} درس</span></div>
  <div class="bar"><i style="width:${n/LESSONS.length*100}%"></i></div>
  <button class="btn full" id="cont" ${next?"":"disabled"}>${next?"ادامه‌ی یادگیری":"همه‌ی درس‌ها تمام شد"}</button></div>`+
 LESSONS.slice().sort((a,b)=>a.order-b.order).map(l=>{
  const s=status(l),p=db.learn[l.id]||{};
  return `<div class="card lesson ${s==="locked"?"locked":""}" data-id="${l.id}"><div class="num">${l.order}</div>
   <div class="t"><b>${esc(l.title)}</b><span class="de mute" style="font-size:15px">${esc(l.titleDe)}</span>
    <div class="sm mute" style="margin-top:4px"><span class="badge">${l.level}</span>${l.minutes} دقیقه${p.score!=null?` · بهترین نمره ${p.score}٪`:""}</div>
    ${s==="in-progress"?`<div class="bar"><i style="width:${Math.max(8,p.score||0)}%"></i></div>`:""}</div>
   <div class="st ${s}" title="${LBL[s]}">${ic(ICN[s])}</div></div>`}).join("");
 const go=l=>{location.hash="#/"+l.id};
 if(next)$("#cont").onclick=()=>go(next);
 $("#tabEn").onclick=()=>setTrack("en");
 $("#tabDe").onclick=()=>setTrack("de");
 $$(".lesson").forEach(c=>c.onclick=()=>{const l=byId(c.dataset.id);status(l)==="locked"?toast("اول درس قبلی را تمام کن"):go(l)});
}
function viewLesson(l){
 if(!(db.learn[l.id]&&db.learn[l.id].startedAt))commit(d=>{d.learn[l.id]={...(d.learn[l.id]||{}),startedAt:Date.now()}});
 const tw=t=>tapWords(esc(t));
 const B={
  dialog:b=>`<div class="card"><h3>گفت‌وگو</h3>${b.lines.map((x,i)=>`<div class="bub ${i%2?"b":"a"}"><div class="de">${tw(x.de)}</div><div class="mute sm">${esc(x.fa)}</div></div>`).join("")}</div>`,
  vocab:b=>`<div class="card"><h3>واژگان</h3>${b.items.map(x=>`<div class="v"><div class="de">${esc(x.de)}</div><div>${esc(x.fa)}${x.note?`<div class="mute sm">${fmt(x.note)}</div>`:""}</div></div>`).join("")}</div>`,
  grammar:b=>`<div class="card"><h3>${fmt(b.title)}</h3><div class="gb">${fmt(b.body)}</div></div>`,
  text:b=>`<div class="card read"><h3>متن</h3><div class="de">${tw(b.de)}</div><p class="mute">${esc(b.fa)}</p></div>`,
  tip:b=>`<div class="card tip"><h3>💡 نکته‌ی پووف</h3><div class="gb">${fmt(b.body)}</div></div>`,
  mistakes:b=>`<div class="card"><h3>⚠️ اشتباهات رایج</h3><div class="mk">${b.items.map(x=>`<div><div class="wrong">❌ <s>${esc(x.wrong)}</s></div><div class="right">✅ ${esc(x.right)}</div><div class="mute sm">${esc(x.fa)}</div></div>`).join("")}</div></div>`};
 app.innerHTML=`<a class="btn ghost" href="#/" style="margin-bottom:14px">همه‌ی درس‌ها</a>
  <h2>${esc(l.title)}</h2><div class="de mute" style="margin:-8px 0 14px">${esc(l.titleDe)} · ${l.level}</div>
  ${l.blocks.map(b=>(B[b.type]||(()=>""))(b)).join("")}
  <p class="mute sm center">روی هر کلمه بزنید تا معنی‌اش بیاید · برای ساخت کارت، بخشی از متن را انتخاب کنید.</p>
  <a class="btn full" href="#/${l.id}/ex">شروع تمرین</a>`;
 bindTap(l);
}

/* ---------- 6) EXERCISE ENGINE ---------- */
let X=null; // {l,i,ok,res[]}
const accepts=e=>[e.answer,...(e.accept||[])].map(nz);
function viewEx(l){
 if(!X||X.l.id!==l.id)X={l,i:0,ok:0,res:[]};

/* ---------- 6b) TAP-A-WORD glossary ---------- */
function tapWords(t){
 return t.split(/(\s+)/).map(p=>{
  if(/^\s+$/.test(p)||!p)return p;
  const m=p.match(/^([^A-Za-z'’-]*)([A-Za-z'’-]+)([^A-Za-z'’-]*)$/);
  if(!m)return p;
  return `${m[1]}<span class="w" data-w="${esc(m[2].toLowerCase())}">${m[2]}</span>${m[3]}`;
 }).join("");
}
function hideTap(){const p=$("#tapPop");if(p)p.hidden=true}
function tapLookup(l,key){
 const gl=l.glossary||{};
 if(gl[key])return{fa:gl[key]};
 for(const b of l.blocks){
  if(!b||b.type!=="vocab"||!b.items)continue;
  for(const x of b.items){
   const dx=String(x.de||"").toLowerCase().replace(/^(der|die|das)\s+/,"");
   if(dx===key)return{fa:x.fa,de:x.de,note:x.note};
  }
 }
 for(const b of l.blocks){
  if(!b||b.type!=="vocab"||!b.items)continue;
  for(const x of b.items){
   const dx=String(x.de||"").toLowerCase().replace(/^(der|die|das)\s+/,"");
   if(dx.split(/[\s\-–—]+/).includes(key))return{fa:x.fa,de:x.de,note:x.note,partial:true};
  }
 }
 return null;
}
function bindTap(l){
 app.onclick=e=>{
  const w=e.target.closest(".w");
  if(!w){hideTap();return}
  const s=getSelection();
  if(s&&!s.isCollapsed){hideTap();return} // a real selection → let selection handler work
  e.stopPropagation();
  const key=w.dataset.w,hit=tapLookup(l,key),fa=hit&&hit.fa;
  const pop=$("#tapPop");
  pop.innerHTML=`<div class="de" style="font-size:18px;color:var(--accent)">${esc(w.textContent)}</div>
   ${fa?`<div style="margin:4px 0">${esc(fa)}</div>${hit.partial&&hit.de?`<div class="mute sm">از: ${esc(hit.de)}</div>`:""}${hit.note?`<div class="mute sm">${fmt(hit.note)}</div>`:""}`:`<div class="mute sm" style="margin:4px 0">معنی دقیق را نمی‌دانم — از دیکشنری بپرس</div>`}
   ${fa?`<button class="btn ghost sm" id="tapAdd" style="padding:6px 14px;font-size:14px">+ کارت</button>`:""}`;
  const r=w.getBoundingClientRect();
  pop.hidden=false;
  pop.style.top=Math.min(innerHeight-140,r.bottom+8+scrollY)+"px";
  pop.style.left=Math.max(10,Math.min(innerWidth-190,r.left+r.width/2-85))+"px";
  const add=$("#tapAdd");
  if(add)add.onclick=ev=>{ev.stopPropagation();hideTap();
   $("#cF").value=w.textContent;$("#cB").value=fa||"";
   const ds=(db.decks&&db.decks.length?db.decks:[{id:"default",name:"پیش‌فرض"}]);
   $("#cD").innerHTML=ds.map(d=>`<option value="${esc(d.id)}" ${d.id===(db.active||"default")?"selected":""}>${esc(d.name)}</option>`).join("");
   $("#sheet").hidden=false;$("#cB").focus();
  };
 };
}
document.addEventListener("click",e=>{if(!e.target.closest("#tapPop")&&!e.target.closest(".w"))hideTap()});

 if(!$("#sheet").hidden)return;

 const el=s.anchorNode.parentElement&&s.anchorNode.parentElement.closest(".de"),txt=s.toString().replace(/\s+/g," ").trim();
 if(!el||!app.contains(el)||!txt||txt.length>200)return hideSel();

 pend={txt,ctx:ctxFor(el,txt)};b.hidden=false;

},180)});
function ctxFor(el,txt){const hit=el.textContent.trim().split(/(?<=[.!?])\s+/).find(x=>x.includes(txt));return hit&&hit!==txt?hit:""}
function vocabHit(txt){

 for(const b of l.blocks)if(b.type==="vocab")for(const x of b.items)if(nz(x.de.replace(/^(der|die|das)\s+/i,""))===k)return x;return null;
}

    blocks: [

      { type: "text", de: "Sollten Hochschulen alle Vorlesungen aufzeichnen?\n\nDigitale Aufzeichnungen können den Zugang zur Hochschullehre erleichtern. Dennoch ist umstritten, ob sämtliche Vorlesungen grundsätzlich aufgezeichnet werden sollten. Entscheidend ist dabei nicht allein die technische Machbarkeit, sondern auch die Frage, unter welchen Bedingungen Aufzeichnungen das Lernen tatsächlich unterstützen.\n\nFür ein breites Angebot spricht zunächst die zeitliche Flexibilität. Wer neben dem Studium arbeitet oder Angehörige betreut, kann versäumte Inhalte nachholen. Auch Studierende, die in einer Fremdsprache lernen, profitieren davon, schwierige Passagen mehrfach anzuhören. Eine Aufzeichnung ermöglicht somit eine individuellere Nachbereitung, ersetzt jedoch nicht automatisch die aktive Auseinandersetzung mit dem Stoff.\n\nGegen eine uneingeschränkte Aufzeichnungspflicht lässt sich einwenden, dass nicht jede Lehrveranstaltung dafür geeignet ist. Werden persönliche Erfahrungen oder sensible Fallbeispiele besprochen, kann die Aufnahme die Offenheit der Beteiligten beeinträchtigen. Zwar ließen sich einzelne Beiträge aus der Aufnahme entfernen, doch wäre damit zusätzlicher Aufwand verbunden. Zudem darf aus der bloßen Verfügbarkeit eines Videos nicht auf einen höheren Lernerfolg geschlossen werden.\n\nEine tragfähige Lösung wäre daher, Vorlesungen mit überwiegend vermittelndem Charakter aufzuzeichnen und für interaktive Formate begründete Ausnahmen vorzusehen. Dies setzt allerdings voraus, dass der Zugang klar geregelt ist und Lehrende angemessen unterstützt werden. Ergänzende Aufgaben könnten dazu beitragen, dass die Videos nicht nur passiv konsumiert werden.\n\nInsgesamt überwiegen die Vorteile eines gezielten Angebots gegenüber denen einer pauschalen Pflicht. Hochschulen sollten Aufzeichnungen deshalb als ergänzendes Lernangebot ausbauen, ohne die unterschiedlichen Anforderungen ihrer Lehrveranstaltungen aus dem Blick zu verlieren.", fa: "آیا دانشگاه‌ها باید همهٔ درس‌گفتارها را ضبط کنند؟\n\nفایل‌های ضبط‌شدهٔ دیجیتال می‌توانند دسترسی به آموزش دانشگاهی را آسان‌تر کنند. بااین‌حال، دربارهٔ اینکه آیا اصولاً باید همهٔ درس‌گفتارها ضبط شوند اختلاف‌نظر وجود دارد. مسئله فقط امکان فنی نیست؛ این هم مهم است که ضبط کلاس تحت چه شرایطی واقعاً از یادگیری پشتیبانی می‌کند.\n\nنخستین دلیل به نفع ارائهٔ گستردهٔ این امکان، انعطاف زمانی است. کسی که در کنار تحصیل کار می‌کند یا از اعضای خانواده مراقبت می‌کند، می‌تواند مطالب ازدست‌رفته را جبران کند. دانشجویانی که به زبانی غیربومی درس می‌خوانند نیز از چندبار گوش‌دادن به بخش‌های دشوار سود می‌برند. بنابراین، ضبط کلاس مرور متناسب با نیاز فرد را ممکن می‌کند، اما خودبه‌خود جای درگیری فعال با مطالب را نمی‌گیرد.\n\nدر برابر الزام بی‌استثنا به ضبط می‌توان گفت که هر کلاس برای این کار مناسب نیست. وقتی تجربه‌های شخصی یا نمونه‌های حساس مطرح می‌شوند، ضبط ممکن است صراحت شرکت‌کنندگان را کاهش دهد. درست است که می‌توان برخی گفته‌ها را از فایل حذف کرد، اما این کار زحمت بیشتری دارد. افزون بر این، صرفِ در دسترس بودن ویدئو اجازه نمی‌دهد یادگیری بیشتر را نتیجه بگیریم.\n\nبنابراین، راه‌حلی عملی این است که درس‌گفتارهایی با ماهیت عمدتاً انتقال مطالب ضبط شوند و برای قالب‌های تعاملی استثناهای موجه در نظر گرفته شود. البته این کار مستلزم قواعد روشن دسترسی و حمایت مناسب از مدرسان است. تمرین‌های تکمیلی می‌توانند کمک کنند ویدئوها صرفاً به‌شکلی منفعلانه مصرف نشوند.\n\nدر مجموع، مزایای ارائهٔ هدفمند این امکان از مزایای الزام همگانی بیشتر است. بنابراین، دانشگاه‌ها باید ضبط کلاس را به‌عنوان امکان یادگیری تکمیلی گسترش دهند، بدون اینکه نیازهای متفاوت کلاس‌هایشان را نادیده بگیرند." },
