<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>POOF · مسیر یادگیری</title>
<style>
/* ===== tokens (same as main app) ===== */
:root{--bg:#111111;--surface:#1b1814;--text:#f5f1e8;--muted:#b8b0a4;--accent:#e6b96f;--error:#ff8f87;--ok:#9fd8a8;--border:#4a4032;
--r-sm:12px;--r-md:16px;--r-lg:20px;
--sans:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;--serif:ui-serif,Georgia,"Times New Roman",serif;color-scheme:dark}
html[data-theme=snowy]{--bg:#081421;--surface:#10263a;--text:#f3f8fc;--muted:#b8c7d3;--accent:#f3c879;--error:#ff9d9d;--ok:#9fe0c0;--border:#294861}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.75 var(--sans);-webkit-tap-highlight-color:transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 25px/1 var(--serif)}
h1{margin:0;font:600 21px/1.2 var(--serif);letter-spacing:.16em;color:var(--accent)}.sub{color:var(--muted);font-size:14px}
main{max-width:720px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px))}
h2{margin:6px 0 14px;font-size:21px;color:var(--accent)}h3{margin:0 0 10px;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card.tip{border:1.5px dashed var(--accent)}
.mk{display:grid;gap:10px}.mk .wrong{color:#e08080}.mk .right{color:#9fd6a4}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mute{color:var(--muted)}.sm{font-size:14px}
.de{direction:ltr;unicode-bidi:isolate;font-family:var(--serif)}
div.de{text-align:left}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:700 16px var(--sans);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--accent)}.btn.full{width:100%;margin-top:14px}.btn:disabled{opacity:.5}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* path */
.lesson{display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s}.lesson:hover{border-color:var(--accent)}
.lesson.locked{opacity:.45;cursor:default}.lesson .t{flex:1;min-width:0}.lesson b{display:block;font-size:17px}
.num{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;font:600 21px var(--serif);color:var(--accent);flex:none}
.badge{display:inline-block;padding:0 10px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);font-size:12px;margin-inline-end:8px}
.st{color:var(--muted)}.st.completed{color:var(--ok)}.st.available,.st.in-progress{color:var(--accent)}
/* lesson */
.bub{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;border:1px solid var(--border)}
.bub.a{background:var(--bg);margin-inline-end:auto;border-end-start-radius:4px}.bub.b{background:color-mix(in srgb,var(--accent) 12%,transparent);margin-inline-start:auto;border-end-end-radius:4px}
.bub .de{font-size:18px}
.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}.v:last-child{border:0}
.v .de{font-size:18px;color:var(--accent)}
.gb{white-space:normal;line-height:2}.gb .de{color:var(--accent);font-size:17px}
.read .de{font-size:20px;line-height:2}
/* exercises */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--border)}
.dot.cur{border-color:var(--accent);background:var(--accent)}.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.bad{background:var(--error);border-color:var(--error)}
.q{font-size:19px;margin-bottom:14px}.q .de{color:var(--accent)}
.opt{display:block;width:100%;margin-top:10px;padding:14px 16px;text-align:start;border:1px solid var(--border);border-radius:var(--r-md);background:transparent;color:var(--text);font:500 17px var(--sans);cursor:pointer}
.opt.de{text-align:left}.opt.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.wrong{border-color:var(--error);color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font:17px var(--sans);margin-bottom:6px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 4px}
.fb{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid}.fb.ok{border-color:var(--ok);color:var(--ok)}.fb.bad{border-color:var(--error);color:var(--error)}.fb .de{color:var(--text)}
.score{font:600 58px/1.2 var(--serif);color:var(--accent);text-align:center}.center{text-align:center}
/* floating add-card + sheet + toast */
#selBtn{position:fixed;z-index:50;padding:9px 16px;border-radius:99px;border:0;background:var(--accent);color:var(--bg);font:700 15px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tapPop{position:absolute;z-index:60;min-width:150px;max-width:190px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-pop)}
.w{cursor:pointer;border-bottom:1px dotted var(--muted)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sc{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sc label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
#toast{position:fixed;z-index:80;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:10px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--accent);opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="hd"><span class="mark" aria-hidden="true">P</span><div style="flex:1"><h1>POOF</h1><div class="sub">مسیر یادگیری</div></div>
 <button class="btn ghost" id="backApp" aria-label="بازگشت"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button></div></header>
<main id="app"><div class="spin" aria-label="در حال بارگذاری"></div></main>

<button id="selBtn" hidden>+ کارت</button>
<div id="tapPop" hidden></div>
<div id="sheet" hidden><div class="sc">
 <div class="row"><b>کارت جدید</b><button class="x" id="shX" aria-label="بستن">×</button></div>
 <label for="cF">آلمانی</label><input id="cF" dir="ltr" autocomplete="off">
 <label for="cB">معنی فارسی (الزامی)</label><input id="cB" dir="auto" autocomplete="off">
 <label for="cC">جمله‌ی نمونه</label><input id="cC" dir="ltr" autocomplete="off">
 <label for="cD">دسته</label><select id="cD"></select>
 <button class="btn full" id="cS">ذخیره</button>
</div></div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   POOF Learn Path — standalone. Reads shared localStorage "poof_v2".
   Writes ONLY: db.learn (progress) and db.cards (new cards from lessons).
   ===================================================================== */

/* ---------- 1) LESSON DATA (extend by appending objects) ----------
   block types: dialog{lines:[{de,fa}]} · vocab{items:[{de,fa,note}]} · grammar{title,body} · text{de,fa}
   exercise types: mc{q,options,answer(index),why?} · type{q,answer,accept?} · blank{text("___"),answer,accept?,hint?}
   In Persian strings, [[German]] marks LTR German inside the sentence. */
const EN_LESSONS_PART1=[
{id:"en01",order:1,level:"A1",minutes:12,title:"سلام و معرفی",titleEn:"Greetings and Introductions",
glossary:{"hello":"سلام","how":"چطور","are":"هستی / هستند","you":"تو / شما","i":"من","am":"هستم","fine":"خوب","thank":"تشکر کردن (در thank you: ممنونم)","and":"و","anna":"آنا (اسم)","what":"چه","is":"است / هست","your":"تو (مال تو)","name":"اسم","my":"من (مال من)","ali":"علی (اسم)","nice":"خوشایند","to":"به","meet":"ملاقات کردن","too":"هم / نیز","sara":"سارا (اسم)","a":"یک","teacher":"معلم","from":"از / اهل","iran":"ایران","this":"این","friend":"دوست","he":"او (مذکر)","student":"دانش‌آموز","we":"ما","happy":"خوشحال","good":"خوب","morning":"صبح","evening":"عصر","goodbye":"خداحافظ","please":"لطفاً","sorry":"ببخشید","be":"بودن","not":"نه (نفی)","tired":"خسته","an":"یک (قبل از صدادار)","apple":"سیب","sun":"خورشید","book":"کتاب","see":"دیدن","car":"ماشین","red":"قرمز","think":"فکر کردن","wine":"شراب","vine":"تاک انگور","west":"غرب","vest":"جلیقه"},
blocks:[
{type:"dialog",lines:[
{de:"Hello! How are you?",fa:"سلام! حالت چطوره؟"},
{de:"I am fine, thank you. And you?",fa:"خوبم، ممنون. تو چطوری؟"},
{de:"I am Anna. What is your name?",fa:"من آنا هستم. اسم تو چیه؟"},
{de:"My name is Ali. Nice to meet you!",fa:"اسم من علیه. از دیدنت خوشحالم!"},
{de:"Nice to meet you too!",fa:"منم از دیدنت خوشحالم!"}]},
{type:"vocab",items:[
{de:"hello",fa:"سلام",note:"برای هر وقتی از روز"},
{de:"good morning",fa:"صبح بخیر",note:"تا حدود ظهر"},
{de:"good evening",fa:"عصر بخیر",note:"از عصر به بعد"},
{de:"goodbye",fa:"خداحافظ",note:"غیررسمی: bye"},
{de:"please",fa:"لطفاً",note:"برای درخواست مؤدبانه"},
{de:"thank you",fa:"ممنونم",note:"کوتاه‌شده: thanks"},
{de:"sorry",fa:"ببخشید",note:"هم برای عذرخواهی، هم برای رد شدن"},
{de:"name",fa:"اسم",note:"My name is... یعنی اسم من ... است"},
{de:"friend",fa:"دوست",note:"جمع: friends"},
{de:"teacher",fa:"معلم",note:"مذکر و مؤنث یکسان است"}]},
{type:"grammar",title:"فعل be — مهم‌ترین فعل انگلیسی",body:"فعل [[to be]] یعنی «بودن» و در زمان حال برای فاعل‌های مختلف شکل‌های متفاوتی دارد: [[I am]] (من هستم)، [[you are]] (تو هستی)، [[he / she / it is]] (او هست)، [[we are]] (ما هستیم)، [[they are]] (آن‌ها هستند). برخلاف آلمانی ([[ich bin, du bist, er ist]]) که سه شکل متفاوت دارد، در انگلیسی فقط سه شکل کلی هست: [[am, is, are]]. جمله‌ی منفی با [[not]] ساخته می‌شود: [[I am not tired]] (من خسته نیستم). سؤالی با جابه‌جایی: [[Are you happy?]] (خوشحالی؟)"},
{type:"grammar",title:"حرف تعریف a / an / the",body:"[[a]] و [[an]] یعنی «یک» و برای چیزهای نامشخص به کار می‌روند: [[a book]] (یک کتاب)، [[an apple]] (یک سیب). [[an]] قبل از حروف صدادار (a, e, i, o, u) می‌آید. [[the]] یعنی «همان / آن مشخص»: [[the sun]] (خورشید — فقط یکی داریم). قانون سرانگشتی: بار اول [[a]]، دفعات بعد [[the]]. مثال: [[I see a car. The car is red.]] (یک ماشین می‌بینم. آن ماشین قرمز است.)"},
{type:"grammar",title:"تلفظ — صداهایی که در فارسی نیست",body:"دو صدای مهم را از همین اول درست یاد بگیر. اول [[th]]: در [[think]] صدای «س» ملایم بین‌دندانی است، در [[this]] صدای «ز» ملایم — نوک زبان بین دندان‌ها! دوم تفاوت [[w]] و [[v]]: در [[wine]] لب‌ها گرد و جلو می‌آیند، در [[vine]] دندان‌های بالا لب پایین را لمس می‌کنند. فارسی‌زبان‌ها این دو را قاطی می‌کنند — تمرین کن: [[west]] در برابر [[vest]]."},
{type:"text",de:"Hello! My name is Sara. I am a teacher. I am from Iran. This is my friend. He is a student. We are happy.",fa:"سلام! اسم من ساراست. من معلم هستم. من اهل ایرانم. این دوستم است. او دانش‌آموز است. ما خوشحالیم."}],
exercises:[
{type:"mc",q:"«صبح بخیر» به انگلیسی چه می‌شود؟",options:["Good morning","Good evening","Good night"],answer:0,why:"[[Good morning]] تا حدود ظهر است، [[good evening]] عصر و [[good night]] موقع خواب."},
{type:"mc",q:"کدام جمله درست است؟",options:["She are a teacher.","She is a teacher.","She am a teacher."],answer:1,why:"با [[she]] همیشه [[is]] می‌آید، نه [[are]] یا [[am]]."},
{type:"type",q:"به انگلیسی بنویس: من خوشحالم",answer:"I am happy",accept:["i am happy"]},
{type:"blank",text:"___ are my friend.",answer:"You"},
{type:"blank",text:"This ___ a book.",answer:"is"}]},

{id:"en02",order:2,level:"A1",minutes:14,title:"زندگی روزمره",titleEn:"Daily Life",
glossary:{"have":"داشتن","you":"تو / شما","got":"(در have got: داشتن)","a":"یک","car":"ماشین","yes":"بله","i":"من","red":"قرمز","how":"چطور / چند","many":"چند / زیاد","children":"بچه‌ها","two":"دو","boy":"پسر","and":"و","girl":"دختر","what":"چه","time":"وقت / ساعت","is":"است","it":"آن","half":"نیم","past":"گذشته (در half past three: سه و نیم)","three":"سه","big":"بزرگ","family":"خانواده","there":"آنجا (در there is: وجود دارد)","are":"هستند","five":"پنج","people":"افراد / مردم","in":"در","my":"من (مال من)","father":"پدر","mother":"مادر","brother":"برادر","sister":"خواهر","me":"من (مفعول)","we":"ما","small":"کوچک","house":"خانه","garden":"باغ","behind":"پشت","the":"(حرف تعریف معین)","like":"دوست داشتن","very":"خیلی","much":"زیاد (در very much: خیلی)","child":"بچه","man":"مرد","woman":"زن","water":"آب","money":"پول","clock":"ساعت دیواری","has":"دارد (سوم شخص)","not":"نه (نفی)","book":"کتاب","books":"کتاب‌ها","table":"میز","bank":"بانک","near":"نزدیک","here":"اینجا","bus":"اتوبوس","watch":"ساعت مچی / تماشا کردن","city":"شهر","men":"مردها","women":"زن‌ها","foot":"پا","feet":"پاها","tooth":"دندان","teeth":"دندان‌ها","today":"امروز","go":"رفتن","school":"مدرسه","no":"هیچ / نه"},
blocks:[
{type:"dialog",lines:[
{de:"Have you got a car?",fa:"ماشین داری؟"},
{de:"Yes, I have got a red car.",fa:"بله، یک ماشین قرمز دارم."},
{de:"How many children have you got?",fa:"چند تا بچه داری؟"},
{de:"I have got two children, a boy and a girl.",fa:"دو تا بچه دارم، یک پسر و یک دختر."},
{de:"What time is it?",fa:"ساعت چنده؟"},
{de:"It is half past three.",fa:"ساعت سه و نیمه."}]},
{type:"vocab",items:[
{de:"house",fa:"خانه",note:"با have got: I have got a house"},
{de:"family",fa:"خانواده",note:"جمع: families"},
{de:"child",fa:"بچه",note:"جمع بی‌قاعده: children"},
{de:"man",fa:"مرد",note:"جمع: men"},
{de:"woman",fa:"زن",note:"جمع: women"},
{de:"boy",fa:"پسر",note:"جمع: boys"},
{de:"girl",fa:"دختر",note:"جمع: girls"},
{de:"water",fa:"آب",note:"غیرقابل شمارش — a نمی‌گیرد"},
{de:"money",fa:"پول",note:"غیرقابل شمارش است"},
{de:"clock",fa:"ساعت دیواری",note:"ساعت مچی: watch"}]},
{type:"grammar",title:"have got — داشتن",body:"برای «داشتن» معمولاً [[have got]] به کار می‌رود: [[I have got a car]] (من ماشین دارم). شکل‌ها: [[I / you / we / they have got]] و [[he / she / it has got]]. سؤالی با جابه‌جایی: [[Have you got a car?]] (ماشین داری؟). منفی: [[I have not got a car]] یا کوتاه‌شده‌ی [[haven't got]]. در انگلیسی آمریکایی بیشتر فقط [[have]] می‌گویند: [[I have a car]] — هر دو درست است."},
{type:"grammar",title:"there is / there are — وجود داشتن",body:"برای گفتن «هست / وجود دارد»: مفرد [[there is]] و جمع [[there are]]. مثال: [[There is a book on the table]] (یک کتاب روی میز است)، [[There are two books]] (دو کتاب هست). سؤالی: [[Is there a bank near here?]] (اینجا بانکی هست؟). دقت کن: جمله با [[there]] شروع می‌شود، نه با فاعل — مثل آلمانی [[Es gibt]] فکر کن!"},
{type:"grammar",title:"جمع بستن اسم‌ها",body:"معمولاً با [[-s]]: [[book → books]] و [[car → cars]]. بعد از [[s, x, ch, sh]] با [[-es]]: [[bus → buses]] و [[watch → watches]]. اگر [[y]] بعد از حرف بی‌صدا باشد به [[ies]] تبدیل می‌شود: [[family → families]] و [[city → cities]]. بی‌قاعده‌ها را باید حفظ کرد: [[man → men]]، [[woman → women]]، [[child → children]]، [[foot → feet]]، [[tooth → teeth]]."},
{type:"grammar",title:"مقایسه با آلمانی — ترتیب کلمات",body:"در انگلیسی ترتیب جمله تقریباً همیشه [[فاعل + فعل + بقیه]] (SVO) است و مثل آلمانی فعل به جایگاه دوم نمی‌پرد! مقایسه کن — آلمانی: [[Heute gehe ich in die Schule]] (فعل دوم)، انگلیسی: [[Today I go to school]] (فعل همیشه بعد از فاعل). پس جمله‌ی آلمانی‌ات را کلمه‌به‌کلمه ترجمه نکن: [[Ich habe heute keine Zeit]] می‌شود [[I have no time today]] نه [[I have today no time]]. این مهم‌ترین تفاوت برای توست و بیشتر اشتباه‌هایت از همین‌جا می‌آید."},
{type:"text",de:"I have got a big family. There are five people in my family: my father, my mother, my brother, my sister and me. We have got a small house. There is a garden behind the house. I like my family very much.",fa:"من خانواده‌ی بزرگی دارم. پنج نفر در خانواده‌ی من هستند: پدرم، مادرم، برادرم، خواهرم و من. ما یک خانه‌ی کوچک داریم. پشت خانه یک باغ هست. خانواده‌ام را خیلی دوست دارم."}],
exercises:[

{type:"grammar",title:"گذشته‌ی ساده — افعال باقاعده",body:"برای کارهای تمام‌شده در گذشته، به فعل [[-ed]] اضافه می‌کنیم: [[play → played]] (بازی کرد)، [[work → worked]] (کار کرد)، [[watch → watched]] (تماشا کرد). منفی و سؤالی با [[did]] ساخته می‌شود: سؤالی [[Did you play?]] (بازی کردی؟)، منفی [[I did not play]] یا کوتاه‌شده‌ی [[didn't]]. نکته‌ی طلایی: وقتی [[did]] آمد، فعل به شکل ساده برمی‌گردد — هرگز نگو [[Did you played]]!"},
{type:"grammar",title:"افعال بی‌قاعده",body:"حدود دویست فعل بی‌قاعده‌اند و شکل گذشته‌شان را باید حفظ کرد. مهم‌ترین‌ها: [[go → went]]، [[come → came]]، [[eat → ate]]، [[see → saw]]، [[buy → bought]]، [[drink → drank]]، [[have → had]]، [[do → did]]. ترفند حفظی: آن‌ها را در جمله حفظ کن، نه تکی — [[I went home]] خیلی بهتر از فقط [[went]] در ذهن می‌ماند."},
{type:"grammar",title:"مقایسه با آلمانی — Perfekt در برابر Past Simple",body:"در آلمانی برای گذشته‌ی گفتاری [[Perfekt]] می‌سازی و دو کلمه لازم داری: [[Ich habe gespielt]]. در انگلیسی فقط یک کلمه: [[I played]]. پس وسوسه نشو که بگویی [[I have played]] وقتی فقط می‌خواهی بگویی «بازی کردم» — آن می‌شود [[Present Perfect]] که معنی دیگری دارد (اثرش تا حالا ادامه دارد). قانون سرانگشتی: هر وقت زمان مشخصی از گذشته در کار است (دیروز، هفته‌ی پیش، سال ۲۰۲۰) → همیشه [[Past Simple]]: [[I saw him yesterday]] — نه [[I have seen him yesterday]]!"},
{type:"grammar",title:"قیدهای زمان گذشته",body:"این قیدها همیشه با [[Past Simple]] می‌آیند: [[yesterday]] (دیروز)، [[last night]] (دیشب)، [[last week]] (هفته‌ی پیش)، [[two days ago]] (دو روز پیش)، [[in 2020]] (در سال ۲۰۲۰). مثال: [[She bought a car last week]] (هفته‌ی پیش ماشین خرید). اگر یکی از این‌ها را دیدی، شک نکن: گذشته‌ی ساده!"},
{type:"text",de:"Last Saturday was a great day. I woke up at seven, ate breakfast and went to the city with my brother. We saw an old castle and took many photos. In the evening we watched a football match. Our team won! I came home late and slept very well.",fa:"شنبه‌ی گذشته روز فوق‌العاده‌ای بود. ساعت هفت بیدار شدم، صبحانه خوردم و با برادرم رفتم شهر. یک قلعه‌ی قدیمی دیدیم و عکس‌های زیادی گرفتیم. عصر یک مسابقه‌ی فوتبال تماشا کردیم. تیم ما برد! دیر برگشتم خونه و خیلی خوب خوابیدم."}],

{type:"grammar",title:"will در برابر going to",body:"برای تصمیم لحظه‌ای (تصمیمی که همین الان گرفتی) از [[will]] استفاده کن: «I'm thirsty. I [[will]] drink water.» اما برای تصمیمی که از قبل گرفته شده از [[going to]] استفاده کن: «I [[am going to]] buy a car next month.» نکته‌ی مهم برای آلمانی‌زبان‌ها: انگلیسی مثل آلمانی یک فعل کمکی آینده‌ی واحد ([[werden]]) ندارد — این دو ساختار کاربرد متفاوت دارند، آن‌ها را قاطی نکن!"},
{type:"grammar",title:"حال استمراری برای آینده",body:"برای برنامه‌ی قطعی و زمان‌دار (که معمولاً با کسی هماهنگ شده) از حال استمراری استفاده می‌کنیم: «I [[am meeting]] Ali at 5.» یعنی قرار ساعت ۵ با علی قطعی است. فرقش با [[going to]]: حال استمراری = قرار ثبت‌شده با زمان مشخص، [[going to]] = قصد و تصمیم قبلی بدون زمان قطعی."},
{type:"text",de:"Next week will be busy. On Monday I'm meeting my teacher at school. We are going to talk about my exams. On Tuesday I will help my brother. He must study for his test, so I should be patient. In the evening I'm going to watch a film with my friends.",fa:"هفته‌ی آینده شلوغ خواهد بود. دوشنبه قراره معلمم رو توی مدرسه ببینم. می‌خوایم درباره‌ی امتحان‌هام حرف بزنیم. سه‌شنبه به برادرم کمک می‌کنم. اون باید برای امتحانش درس بخونه، پس باید صبور باشم. عصر می‌خوام با دوستام فیلم ببینم."}],

{type:"grammar",title:"حال کامل در برابر Perfekt آلمانی",body:"این سخت‌ترین نکته برای آلمانی‌زبانهاست! در آلمانی [[Ich habe gegessen]] یعنی پرفکت — و در گفتار روزمره جای گذشته‌ی ساده را می‌گیرد. ولی در انگلیسی [[I have eaten]] یعنی حال کامل: گذشته‌ای که هنوز به حال وصل است و اثرش باقی است. قانون طلایی انگلیسی: اگر زمان مشخص بگویی ([[yesterday]]، [[last year]]، [[in 2020]]) حتماً باید گذشته‌ی ساده بگویی: [[I went to London last year]] — نه [[I have gone]]! آلمانی این محدودیت را ندارد. فرمول حال کامل: [[have/has + شکل سوم فعل]] مثل [[gone]]، [[eaten]]، [[seen]]."},
{type:"vocab",items:[
{de:"although",fa:"اگرچه",note:"بعدش جمله‌ی کامل می‌آید: although it rained"},
{de:"however",fa:"با این حال، اما",note:"اول جمله + کاما: However, I went."},
{de:"since",fa:"از وقتی که / چونکه",note:"دو معنی! since 2020 (از ۲۰۲۰) / since you're tired (چون خسته‌ای)"},
{de:"while",fa:"در حالی که",note:"برای دو کار همزمان: while I cook"},
{de:"already",fa:"قبلاً، دیگه",note:"وسط جمله‌ی مثبت: I have already eaten"},
{de:"just",fa:"تازه، همین الان",note:"I have just finished = تازه تموم کردم"},
{de:"ever",fa:"تا حالا",note:"فقط در سؤال: Have you ever...؟"},
{de:"never",fa:"هیچ‌وقت",note:"خودش جمله را منفی می‌کند، پس not نمی‌خواهد!"},
{de:"yet",fa:"هنوز",note:"آخر جمله‌ی منفی یا سؤالی: not yet"},
{de:"for / since",fa:"به مدت / از",note:"for two years (مدت) در برابر since 2020 (نقطه‌ی شروع)"}]},
{type:"grammar",title:"جملات موصولی: who / which / that",body:"[[who]] برای انسان: «the man [[who]] helped me». [[which]] برای اشیا و حیوانات: «the book [[which]] I bought». [[that]] برای هر دو و رایج‌ترین گزینه در گفتار روزمره. نکته‌ی ظریف: اگر اطلاعات اضافه و غیرضروری باشد، بعد از [[which]] کاما می‌گذاریم: «My car, [[which]] is old, still works.»"},
{type:"text",de:"I have known my teacher for three years. She is a woman who never gives up. Although she is busy, she always helps her students. I have learned a lot from her since I started school here. She has just published a book which is about learning languages. I have already bought it, but I have not read it yet.",fa:"سه ساله معلمم رو می‌شناسم. اون زنیه که هیچ‌وقت تسلیم نمیشه. اگرچه سرش شلوغه، همیشه به شاگرداش کمک می‌کنه. از وقتی اینجا مدرسه رو شروع کردم خیلی ازش یاد گرفتم. اون تازه کتابی منتشر کرده که درباره‌ی یادگیری زبان‌هاست. قبلاً خریدمش ولی هنوز نخوندمش."}],

{de:"hang out",fa:"وقت گذراندن با دوستان",note:"جدانشدنی — خیلی محاوره‌ای و رایج"}]},
{type:"grammar",title:"جداشدنی در برابر جدانشدنی",body:"قانون طلایی: اگر فعل عبارتی [[جداشدنی (separable)]] باشد، می‌توانی مفعول را وسط بگذاری: [[take your shoes off]] یا [[take off your shoes]] — هر دو درست! ولی اگر مفعول ضمیر باشد ([[it]]، [[them]]، [[him]]) حتماً باید وسط باشد: [[take them off]] — نه [[take off them]]! اگر [[جدانشدنی (inseparable)]] باشد (مثل [[run into]] و [[look after]]) هرگز آن را جدا نکن: [[I ran into him]] — نه [[I ran him into]]. نکته برای آلمانی‌زبان‌ها: برخلاف فعل‌های جداشدنی آلمانی ([[anrufen ← ich rufe an]]) اینجا معنی کاملاً اصطلاحی است و از اجزای کلمات حدس زده نمی‌شود."},
{type:"text",de:"I got up late this morning. I quickly put on my clothes and left the house. On the way, I ran into my neighbor. She told me the bus had broken down, so I had to find out another way. I decided not to give up. I called my friend, and he picked me up in ten minutes. We talked and laughed, and I calmed down. When I got to school, I took off my jacket and sat down.",fa:"امروز صبح دیر بیدار شدم. سریع لباس‌هامو پوشیدم و از خونه زدم بیرون. توی راه همسایه‌مون رو اتفاقی دیدم. گفت اتوبوس خراب شده، پس باید یه راه دیگه پیدا می‌کردم. تصمیم گرفتم تسلیم نشم. به دوستم زنگ زدم و ده دقیقه بعد اومد دنبالم. حرف زدیم و خندیدیم و آروم شدم. وقتی رسیدم مدرسه کتم رو درآوردم و نشستم."}],

{type:"blank",text:"Please ___ down the music. It's too loud.",answer:"turn"},

{type:"type",q:"به انگلیسی بنویس: تسلیم نشو!",answer:"Don't give up",accept:["don't give up","do not give up","dont give up"]},
{type:"blank",text:"I ___ forward to seeing you.",answer:"look"}]}

 {type:"grammar",title:"Akkusativ (مفعول) — مقدماتی",body:"فقط حرف تعریف مذکر تغییر می‌کند:\n[[der Kaffee]] → [[Ich möchte den Kaffee.]]\n[[ein Kaffee]] → [[Ich möchte einen Kaffee.]]\nبرای خنثی، مؤنث و جمع تغییری نیست: [[das Brot]] → [[Ich möchte das Brot.]] — [[die Milch]] → [[Ich möchte eine Milch.]]\nمنفی و ملکی هم همین‌طور: [[keinen]]، [[meinen]] (فقط مذکر)."}],

  {type:"blank",text:"Das ___ sechs Euro.",answer:"macht",accept:["kostet"]}]},

{id:"l05",order:5,level:"A2",minutes:20,title:"گذشته‌ی ساده (Perfekt)",titleDe:"Das Perfekt",blocks:[
 {type:"grammar",title:"ساختار Perfekt",body:"گذشته‌ی گفتاری = [[haben]] یا [[sein]] (صرف‌شده، جایگاه دوم) + [[Partizip II]] (آخر جمله):\n[[Ich habe Pizza gegessen.]] (پیتزا خوردم)\nمنظم: [[ge-]] + ریشه + [[-t]]: [[machen → gemacht]]، [[lernen → gelernt]]\nنامنظم: [[ge-]] + ... + [[-en]]: [[essen → gegessen]]، [[sehen → gesehen]]\nفعل‌های جداشدنی: [[einkaufen → eingekauft]]. فعل‌های پیشوندی غیرجدا، [[ge-]] نمی‌گیرند: [[besuchen → besucht]]."},
 {type:"grammar",title:"haben یا sein؟",body:"فعل‌های حرکت و تغییر حالت با [[sein]]: [[gehen → ist gegangen]]، [[fahren → ist gefahren]]، [[kommen → ist gekommen]]، [[bleiben → ist geblieben]]، [[aufstehen → ist aufgestanden]].\nبقیه‌ی فعل‌ها با [[haben]]: [[Ich habe gearbeitet.]]، [[Ich habe geschlafen.]]"},
 {type:"vocab",items:[
  {de:"gestern",fa:"دیروز"},{de:"letzte Woche",fa:"هفته‌ی گذشته"},{de:"machen → gemacht",fa:"انجام دادن"},{de:"lernen → gelernt",fa:"یاد گرفتن"},{de:"essen → gegessen",fa:"خوردن"},
  {de:"trinken → getrunken",fa:"نوشیدن"},{de:"sehen → gesehen",fa:"دیدن"},{de:"schlafen → geschlafen",fa:"خوابیدن"},{de:"arbeiten → gearbeitet",fa:"کار کردن",note:"ریشه‌ی [[t]] می‌گیرد: [[-et]]"},
  {de:"gehen → ist gegangen",fa:"رفتن"},{de:"fahren → ist gefahren",fa:"رانندگی کردن / سفر کردن"},{de:"bleiben → ist geblieben",fa:"ماندن"}]},
 {type:"dialog",lines:[
  {de:"Was hast du gestern gemacht?",fa:"دیروز چه کار کردی؟"},
  {de:"Ich habe lange geschlafen und dann Deutsch gelernt.",fa:"زیاد خوابیدم و بعد آلمانی یاد گرفتم."},
  {de:"Bist du ins Kino gegangen?",fa:"به سینما رفتی؟"},
  {de:"Nein, ich bin zu Hause geblieben. Ich habe Pizza gegessen und einen Film gesehen.",fa:"نه، در خانه ماندم. پیتزا خوردم و یک فیلم دیدم."}]},
 {type:"text",de:"Letzte Woche bin ich nach Berlin gefahren. Ich habe das Brandenburger Tor gesehen und viele Fotos gemacht. Am Abend habe ich im Restaurant gegessen. Es hat mir sehr gut gefallen.",fa:"هفته‌ی گذشته به برلین رفتم. دروازه‌ی براندنبورگ را دیدم و عکس‌های زیادی گرفتم. شب در رستوران غذا خوردم. خیلی خوشم آمد."}],
 exercises:[
  {type:"mc",q:"[[Ich ___ gestern Pizza gegessen.]]",options:["habe","bin","hat"],answer:0,why:"[[essen]] فعل حرکتی نیست و با [[haben]] می‌آید."},
  {type:"mc",q:"Partizip II فعل [[gehen]] کدام است؟",options:["gegeht","gegangen","gegehen"],answer:1},
  {type:"type",q:"به آلمانی بنویس: دیروز آلمانی یاد گرفتم",answer:"Ich habe gestern Deutsch gelernt",accept:["gestern habe ich deutsch gelernt"]},
  {type:"blank",text:"Wir sind nach Hamburg ___.",answer:"gefahren"},
  {type:"blank",text:"Er ___ zu Hause geblieben.",answer:"ist"}]},

{id:"l06",order:6,level:"B1",minutes:22,title:"آرزوها و برنامه‌ها",titleDe:"Wünsche und Pläne",blocks:[
 {type:"grammar",title:"بیان برنامه و آینده",body:"برای برنامه‌ها اغلب همان حال ساده با قید زمان کافی است: [[Nächstes Jahr mache ich einen Kurs.]]\nآینده‌ی صریح: [[werden]] + مصدر در آخر جمله:\n[[ich werde]] · [[du wirst]] · [[er / sie / es wird]] · [[wir werden]] · [[ihr werdet]] · [[sie / Sie werden]]\n[[Ich werde nach Deutschland ziehen.]] (به آلمان نقل مکان خواهم کرد)\nآرزو: [[Ich möchte ...]] یا [[Ich würde gern ...]] (دوست دارم ...)"},
 {type:"grammar",title:"Nebensätze با weil و dass",body:"بعد از [[weil]] (چون) و [[dass]] (که) فعل صرف‌شده می‌رود آخر جمله:\n[[Ich lerne Deutsch, weil ich in Deutschland studieren möchte.]]\n[[Ich hoffe, dass ich bald eine Wohnung finde.]]\n[[Ich weiß, dass das schwer ist.]]\nاگر جمله با [[weil]] شروع شود، فعل جمله‌ی اصلی بلافاصله بعد از ویرگول می‌آید: [[Weil ich studieren möchte, lerne ich Deutsch.]]"},
 {type:"vocab",items:[
  {de:"der Plan",fa:"برنامه"},{de:"der Wunsch",fa:"آرزو"},{de:"die Zukunft",fa:"آینده"},{de:"hoffen",fa:"امیدوار بودن"},{de:"planen",fa:"برنامه‌ریزی کردن"},
  {de:"träumen von",fa:"رؤیای ... را داشتن",note:"بعدش حالت [[Dativ]]"},{de:"nächstes Jahr",fa:"سال آینده"},{de:"bald",fa:"به‌زودی"},{de:"studieren",fa:"در دانشگاه خواندن"},
  {de:"die Wohnung",fa:"آپارتمان / خانه"},{de:"weil",fa:"چون"},{de:"dass",fa:"که"}]},
 {type:"dialog",lines:[
  {de:"Was sind deine Pläne für die Zukunft?",fa:"برنامه‌هایت برای آینده چیست؟"},
  {de:"Nächstes Jahr werde ich nach Deutschland ziehen.",fa:"سال آینده به آلمان نقل مکان خواهم کرد."},
  {de:"Warum möchtest du dorthin ziehen?",fa:"چرا می‌خواهی به آنجا بروی؟"},
  {de:"Weil ich dort Informatik studieren möchte.",fa:"چون می‌خواهم آنجا انفورماتیک بخوانم."},
  {de:"Ich hoffe, dass du bald eine gute Wohnung findest.",fa:"امیدوارم زود یک خانه‌ی خوب پیدا کنی."},
  {de:"Danke! Ich hoffe es auch.",fa:"ممنون! من هم امیدوارم."}]},
 {type:"text",de:"Mein Traum ist es, in Deutschland zu studieren. Deshalb lerne ich jeden Tag Deutsch. Ich weiß, dass das viel Zeit braucht, aber ich werde nicht aufgeben. In fünf Jahren möchte ich als Ingenieur arbeiten.",fa:"رؤیای من این است که در آلمان درس بخوانم. برای همین هر روز آلمانی یاد می‌گیرم. می‌دانم که این زمان زیادی می‌برد، اما تسلیم نخواهم شد. می‌خواهم پنج سال دیگر مهندس باشم."}],
 exercises:[
  {type:"mc",q:"کدام جمله درست است؟",options:["Ich lerne Deutsch, weil ich möchte in Deutschland studieren.","Ich lerne Deutsch, weil ich in Deutschland studieren möchte.","Ich lerne Deutsch, weil möchte ich in Deutschland studieren."],answer:1,why:"بعد از [[weil]] فعل صرف‌شده ([[möchte]]) آخر جمله می‌رود."},
  {type:"mc",q:"[[Ich ___ nächstes Jahr nach Berlin fahren.]]",options:["werde","wirst","wird"],answer:0},
  {type:"type",q:"به آلمانی بنویس: امیدوارم زود موفق شوم",answer:"Ich hoffe, dass ich bald Erfolg habe",accept:["ich hoffe, dass ich bald erfolgreich bin"]},
  {type:"blank",text:"Ich weiß, ___ das schwer ist.",answer:"dass"},
  {type:"blank",text:"Sie bleibt zu Hause, ___ sie krank ist.",answer:"weil"}]}
]

{id:"l07",order:7,level:"B2",minutes:25,title:"گذشته‌ی آرزوها",titleDe:"Konjunktiv II – Wünsche und irreale Bedingungen",blocks:[
{type:"dialog",lines:[
{de:"Was würdest du mit einer Million Euro tun?",fa:"با یک میلیون یورو چیکار می‌کردی؟"},
{de:"Ich würde sofort kündigen und ein Jahr lang reisen.",fa:"فوراً استعفا می‌دادم و یک سال سفر می‌کردم."},
{de:"Wirklich? Ich wünschte, ich hätte so viel Mut.",fa:"واقعاً؟ کاش منم این‌قدر جسارت داشتم."},
{de:"Ach, wenn wir nur mehr Zeit hätten! Die Zeit vergeht so schnell.",fa:"آه، کاش فقط وقت بیشتری داشتیم! زمان خیلی زود می‌گذره."},
{de:"Stimmt. Wäre ich doch damals in Deutschland geblieben!",fa:"درسته. کاش اون موقع توی آلمان مونده بودم!"}

{type:"vocab",items:[

{type:"grammar",title:"آینده‌ی آرزویی: [[würde]] + مصدر",body:"برای موقعیت‌های غیرواقعی در حال و آینده، از [[würde]] + مصدر استفاده می‌کنیم: «اگر پول داشتم، سفر می‌کردم» → [[Wenn ich Geld hätte, würde ich reisen.]] صرف [[würden]]: ich würde، du würdest، er würde، wir würden، ihr würdet، sie würden. ⚠️ نکته‌ی امتحانی — رایج‌ترین غلط B2: با [[sein]]، [[haben]] و افعال مدال از [[würde]] استفاده نکن! درست: [[Ich wäre glücklich]] (نه [[ich würde glücklich sein]])؛ [[Ich hätte Zeit]] (نه [[ich würde Zeit haben]])؛ [[Ich könnte kommen]] (نه [[ich würde kommen können]]). همچنین در جمله‌ی شرطی رسمی، [[würde]] بعد از [[wenn]] نمی‌آید: [[Wenn ich Zeit hätte]] (نه [[wenn ich Zeit haben würde]])."},
{type:"grammar",title:"[[hätte]] و [[wäre]]: آرزوهای گذشته",body:"برای گذشته‌ی غیرواقعی (کاری که نشد ولی کاش می‌شد)، از [[hätte]]/[[wäre]] + اسم مفعول استفاده می‌کنیم: [[Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.]] — «اگر بیشتر خوانده بودم، قبول می‌شدم.» با افعال حرکتی [[sein]] می‌آید: [[Wäre ich nur zu Hause geblieben!]] — «کاش خونه مونده بودم!» آرزو با [[wünschte]]: [[Ich wünschte, ich hätte mehr Zeit.]] نکته‌ی امتحانی: در سبک رسمی می‌شود [[wenn]] را حذف کرد و فعل را اول آورد: [[Hätte ich mehr Zeit, würde ich reisen.]] — این ساختار در متن‌های C1 زیاد می‌آید و در امتحان نمره دارد."},
{type:"text",de:"Wenn ich die Wahl hätte, würde ich in einer kleinen Stadt am Meer leben. Ich würde jeden Morgen schwimmen gehen und hätte keine Eile mehr. Leider habe ich damals eine andere Entscheidung getroffen. Wäre ich doch mutiger gewesen! Aber man kann die Vergangenheit nicht ändern – man kann nur aus ihr lernen.",fa:"اگر انتخاب داشتم، توی یک شهر کوچک کنار دریا زندگی می‌کردم. هر صبح شنا می‌کردم و دیگر عجله‌ای نداشتم. متأسفانه آن موقع تصمیم دیگری گرفتم. کاش جسورتر بوده بودم! ولی گذشته را نمی‌شود عوض کرد — فقط می‌شود از آن یاد گرفت."},
{type:"vocab",items:[
{de:"An deiner Stelle würde ich...",fa:"اگر جای تو بودم...",note:"مودبانه‌ترین شکل نصیحت"},
{de:"Ich würde vorschlagen, dass...",fa:"پیشنهاد می‌کنم که...",note:"رسمی، مناسب ایمیل کاری"},
{de:"Würdest du mir bitte helfen?",fa:"ممکن است لطفاً کمکم کنی؟",note:"درخواست خیلی مودبانه"},
{de:"Das würde mich freuen.",fa:"خوشحال می‌شوم.",note:"پذیرفتن با اشتیاق"},
{de:"Ich hätte gern einen Kaffee.",fa:"یک قهوه می‌خواستم.",note:"سفارش مودبانه در کافه/رستوران"},
{de:"Ich wünschte, ...",fa:"کاش...",note:"همیشه با hätte/wäre ادامه می‌یابد"},
{de:"Hätte ich doch nur...!",fa:"کاش فقط...!",note:"آرزوی پررنگ برای گذشته"},
{de:"Was wäre, wenn...?",fa:"چه می‌شد اگر...؟",note:"شروع یک تجربه‌ی ذهنی"}
]}
],
exercises:[
{type:"mc",q:"«اگر وقت داشتم، می‌آمدم.» کدام درست است؟",options:["Wenn ich Zeit habe, würde ich kommen.","Wenn ich Zeit hätte, würde ich kommen.","Wenn ich Zeit hätte, komme ich."],answer:1,why:"شرط غیرواقعی حال → hätte (Konjunktiv II) + würde. گزینه‌ی اول وجه اخباری است و گزینه‌ی سوم ترکیب نادرست دو وجه است."},
{type:"type",q:"گذشته‌ی غیرواقعی بساز: Ich kann nicht schwimmen — ich habe es nie gelernt. → Wenn ich es gelernt ___, könnte ich jetzt schwimmen.",answer:"hätte",accept:["hätte"]},
{type:"blank",text:"Ich wünschte, ich ___ Klavier spielen.",answer:"könnte"},
{type:"mc",q:"کدام جمله غلط است؟",options:["Ich wäre lieber zu Hause geblieben.","Ich würde lieber zu Hause bleiben.","Ich würde lieber zu Hause geblieben sein."],answer:2,why:"با sein همیشه از wäre استفاده می‌شود، نه würde + sein. ترکیب گزینه‌ی سوم ممنوعه است."},
{type:"type",q:"آرزو را کامل کن: I wish I had studied medicine. → Ich wünschte, ich ___ Medizin studiert.",answer:"hätte",accept:["hätte"]}
]},
{id:"l08",order:8,level:"B2",minutes:25,title:"مجهول در همه‌ی زمان‌ها",titleDe:"Das Passiv in allen Zeiten",blocks:[
{type:"dialog",lines:[
{de:"Hast du gehört? Das alte Kino in der Stadt wird abgerissen.",fa:"شنیدی؟ سینمای قدیمی شهر دارد تخریب می‌شود."},
{de:"Wirklich? Es wurde doch erst vor zehn Jahren renoviert!",fa:"واقعاً؟ مگر همین ده سال پیش بازسازی نشد!"},
{de:"Ja, aber das Gebäude ist schon zweimal verkauft worden.",fa:"بله، ولی ساختمان تا حالا دو بار فروخته شده است."},
{de:"Weiß man schon, was dort gebaut wird?",fa:"می‌دانند قرار است آنجا چه ساخته شود؟"},
{de:"Die Pläne sind schon genehmigt worden. Ein Einkaufszentrum soll entstehen.",fa:"طرح‌ها قبلاً تأیید شده‌اند. قرار است یک مرکز خرید ساخته شود."}
]},
{type:"vocab",items:[

{de:"renovieren",fa:"بازسازی کردن",note:"die Wohnung renovieren"},
{de:"genehmigen",fa:"تأیید / تصویب کردن",note:"einen Antrag genehmigen؛ رسمی"},
{de:"entstehen (entstand, entstanden)",fa:"به وجود آمدن",note:"ناگذر است ← هیچ‌وقت مجهول نمی‌سازد!"},
{de:"zerstören",fa:"نابود کردن",note:"durch das Feuer zerstört"},

{de:"der Täter",fa:"مجرم، فاعل",note:"در مجهول معمولاً حذف می‌شود"},

{de:"stattfinden (fand statt, stattgefunden)",fa:"برگزار شدن",note:"جداشدنی؛ مجهول ندارد: Es findet statt."},
{de:"die Beute",fa:"غنیمت، اموال مسروقه",note:"die Beute sicherstellen"}
]},
{type:"grammar",title:"ساخت مجهول: [[werden]] + اسم مفعول",body:"فرمول همیشه یکی است: [[werden]] صرف‌شده + Partizip II. فقط زمانِ [[werden]] عوض می‌شود — حال: [[Das Haus wird gebaut.]] / گذشته‌ی ساده: [[Das Haus wurde gebaut.]] / گذشته‌ی کامل: [[Das Haus ist gebaut worden.]] / گذشته‌ی بعید: [[Das Haus war gebaut worden.]] / آینده: [[Das Haus wird gebaut werden.]] ⚠️ نکته‌ی امتحانی — کلاسیک‌ترین تله: در Perfekt مجهول، [[worden]] می‌آید نه [[geworden]]! و مجهول فقط با افعال متعدی (که مفعول Akkusativ می‌گیرند) ساخته می‌شود. با افعال Dativ، مجهول غیرشخصی می‌سازیم: [[Mir wird geholfen.]] درست است ولی [[Ich werde geholfen.]] غلط!"},
{type:"grammar",title:"[[von]] یا [[durch]]؟ و جایگزین‌های مجهول",body:"عامل انسانی کار با [[von]] می‌آید: [[Das Bild wurde von Picasso gemalt.]] — ولی وسیله یا علت طبیعی با [[durch]]: [[Die Stadt wurde durch das Erdbeben zerstört.]] در زبان رسمی، مجهول را این‌طور هم می‌سازند: ۱) با [[man]]: [[Man baut hier ein Hotel.]] ۲) با [[sich lassen]] + مصدر: [[Das Problem lässt sich leicht lösen.]] (= می‌شود حلش کرد) ۳) با [[sein]] + [[zu]] + مصدر: [[Die Aufgabe ist bis morgen zu erledigen.]] (= باید انجام شود). نکته‌ی امتحانی: [[sich lassen]] همیشه با [[sich]] می‌آید و معنای «امکان/قابلیت» می‌دهد؛ از نادر ساختارهایی است که امتحان B2 دوست دارد."},
{type:"text",de:"Gestern Abend wurde in der Innenstadt ein Juweliergeschäft überfallen. Der Täter wurde noch in der Nacht von der Polizei verhaftet. Die Beute ist bereits sichergestellt worden. Die Ermittlungen werden von der Kriminalpolizei durchgeführt. Zeugen werden gebeten, sich zu melden.",fa:"دیشب در مرکز شهر به یک جواهرفروشی دستبرد زده شد. مجرم همان شب توسط پلیس دستگیر شد. اموال مسروقه قبلاً ضبط شده است. تحقیقات توسط پلیس جنایی انجام می‌شود. از شاهدان خواسته می‌شود خودشان را معرفی کنند."},
{type:"vocab",items:[
{de:"sichergestellt werden",fa:"ضبط / توقیف شدن",note:"Die Beute wurde sichergestellt."},
{de:"durchgeführt werden",fa:"انجام شدن",note:"Ermittlungen durchführen"},
{de:"gebeten werden",fa:"خواسته شدن",note:"Zeugen werden gebeten, sich zu melden."},
{de:"gemeldet werden",fa:"گزارش شدن",note:"Der Unfall wurde gemeldet."},
{de:"das unpersönliche Passiv",fa:"مجهول غیرشخصی",note:"Es wird getanzt / gelacht."},
{de:"der Einbrecher",fa:"سارق منزل",note:"جمع: die Einbrecher"},
{de:"überfallen (überfiel, überfallen)",fa:"دستبرد زدن، حمله کردن",note:"جدا نمی‌شود!"},
{de:"die Ermittlung",fa:"تحقیق، بازجویی",note:"جمع: Ermittlungen"}
]}
],

{type:"mc",q:"«روستا در اثر آتش‌سوزی نابود شد.»",options:["Das Dorf wurde vom Feuer zerstört.","Das Dorf wurde durch das Feuer zerstört.","Das Dorf wurde mit dem Feuer zerstört."],answer:1,why:"durch برای علت و وسیله است؛ von فقط برای عامل انسانی (شخص) به کار می‌رود."},
{type:"type",q:"با sich lassen بازنویسی کن: Man kann das Fenster leicht öffnen. → Das Fenster ___ sich leicht ___.",answer:"lässt öffnen",accept:["lässt öffnen","läßt öffnen"]}

{id:"l09",order:9,level:"B2",minutes:20,title:"ترکیب‌های اسم و فعل",titleDe:"Nomen-Verb-Verbindungen",blocks:[
{type:"dialog",lines:[
{de:"Haben Sie meine E-Mail schon zur Kenntnis genommen?",fa:"ایمیل مرا ملاحظه کردید؟"},
{de:"Ja. Wir müssen dazu Stellung nehmen.",fa:"بله. باید در این مورد موضع بگیریم."},
{de:"Können wir die hohen Kosten in Kauf nehmen?",fa:"می‌توانیم این هزینه‌های بالا را قبول کنیم؟"},
{de:"Ich denke, wir sollten Ihren Vorschlag in Betracht ziehen.",fa:"فکر می‌کنم باید پیشنهاد شما را در نظر بگیریم."},
{de:"Einverstanden. Alle Unterlagen stehen Ihnen ab morgen zur Verfügung.",fa:"موافقم. همه‌ی مدارک از فردا در اختیار شماست."}
]},
{type:"vocab",items:[
{de:"eine Entscheidung treffen",fa:"تصمیم گرفتن",note:"معنی تحت‌اللفظی بی‌معنی است؛ همیشه با treffen، نه machen!"},
{de:"in Frage stellen",fa:"زیر سؤال بردن",note:"etwas in Frage stellen + Akk"},
{de:"zur Verfügung stehen",fa:"در دسترس / اختیار بودن",note:"jemandem (Dativ) zur Verfügung stehen"},
{de:"in Anspruch nehmen",fa:"استفاده کردن (از خدمات)",note:"Hilfe in Anspruch nehmen؛ رسمی"},
{de:"zum Ausdruck bringen",fa:"بیان کردن",note:"seine Meinung zum Ausdruck bringen"},
{de:"in Betracht ziehen",fa:"در نظر گرفتن",note:"bei Entscheidungen؛ ziehen→zog→gezogen"},
{de:"einen Beitrag leisten",fa:"سهم داشتن، کمک کردن",note:"zum Umweltschutz einen Beitrag leisten"},
{de:"zur Kenntnis nehmen",fa:"مطلع شدن، ملاحظه کردن",note:"اداری: Haben Sie mein Schreiben zur Kenntnis genommen؟"},
{de:"in Kauf nehmen",fa:"به جان خریدن، قبول کردن",note:"Nachteile / Kosten in Kauf nehmen"},
{de:"Stellung nehmen (zu)",fa:"موضع گرفتن درباره",note:"zu + Dativ: Stellung zu dem Plan nehmen"},
{de:"Rücksicht nehmen (auf)",fa:"مراعات / ملاحظه کردن",note:"auf + Akk: Rücksicht auf andere nehmen"},
{de:"in Erfahrung bringen",fa:"پی بردن، فهمیدن",note:"Ich habe in Erfahrung gebracht, dass..."},
{de:"zur Anwendung kommen",fa:"به کار رفتن، اجرا شدن",note:"Die neue Regel kommt ab Mai zur Anwendung."},
{de:"Abschied nehmen (von)",fa:"خداحافظی کردن",note:"von + Dativ؛ احساسی و رسمی"},
{de:"Maßnahmen ergreifen",fa:"اقدام کردن",note:"Die Regierung ergreift Maßnahmen."}
]},
{type:"grammar",title:"ترکیب اسم و فعل: بیشتر از جمع اجزا",body:"[[Nomen-Verb-Verbindungen]] (یا [[Funktionsverbgefüge]]) ترکیب‌هایی‌اند که معنایشان از جمع معنای کلمات به دست نمی‌آید: [[eine Entscheidung treffen]] یعنی «تصمیم گرفتن»، نه «تصمیمی را ملاقات کردن»! سه ویژگی مهم: ۱) فعل معمولاً کم‌معنی است ([[treffen]]، [[nehmen]]، [[stellen]]، [[bringen]]) و بار معنا روی اسم است. ۲) حرف اضافه ثابت دارند — باید با حرف اضافه حفظشان کنی. ۳) زبان رسمی و نوشتاری‌اند و در امتحان B2/C1 نمره می‌آورند. ⚠️ نکته‌ی امتحانی: رایج‌ترین غلط، فعل اشتباه است — [[eine Entscheidung *machen]] غلط و [[treffen]] درست؛ [[einen Vorschlag *tun]] غلط و [[machen]] درست."},
{type:"text",de:"Sehr geehrte Damen und Herren, wir haben Ihr Schreiben zur Kenntnis genommen. Nach reiflicher Überlegung müssen wir Ihnen mitteilen, dass wir Ihre Bedingungen nicht in vollem Umfang in Kauf nehmen können. Wir sind jedoch bereit, Ihren Vorschlag in Betracht zu ziehen. Bitte nehmen Sie bis Freitag Stellung zu unserem Gegenvorschlag. Alle Details stehen Ihnen in der Anlage zur Verfügung.",fa:"خانم‌ها و آقایان گرامی، نامه‌ی شما را ملاحظه کردیم. پس از بررسی دقیق، باید به اطلاع برسانیم که نمی‌توانیم شرایط شما را به‌طور کامل بپذیریم. با این حال آماده‌ایم پیشنهاد شما را در نظر بگیریم. لطفاً تا جمعه نسبت به پیشنهاد متقابل ما موضع بگیرید. همه‌ی جزئیات در پیوست در اختیار شماست."},
{type:"grammar",title:"فرمول حفظ حرف اضافه‌ها",body:"حرف اضافه‌ی هر ترکیب را با یک جمله‌ی کوتاهِ شخصی حفظ کن، نه تکی: [[Ich nehme Rücksicht auf meine Nachbarn.]] (نه فقط [[auf + Akk]]). سه خانواده‌ی بزرگ: ۱) با [[auf]] + Akkusativ: [[Rücksicht nehmen auf]] ۲) با [[zu]] + Dativ: [[Stellung nehmen zu]]، [[im Gegensatz zu]] ۳) بدون حرف اضافه‌ی دوم: [[zur Kenntnis nehmen]]، [[in Kauf nehmen]]، [[in Betracht ziehen]]. نکته‌ی امتحانی: اگر حرف اضافه را اشتباه بگویی، کل ترکیب غلط حساب می‌شود — در پاسخ تشریحی اول حرف اضافه را مشخص کن، بعد جمله را بساز."},
{type:"grammar",title:"تله‌های امتحانی",body:"۱) [[in Frage stellen]] (زیر سؤال بردن) با [[sich fragen]] (از خود پرسیدن) فرق دارد — امتحان عاشق این تله است. ۲) بعضی ترکیب‌ها بازتابی‌اند: [[sich in Acht nehmen vor]] + Dativ یعنی «مواظب بودن». ۳) در جمله‌ی فرعی، اسم و فعل از هم جدا نمی‌شوند مثل فعل‌های جداشدنی: [[..., weil er eine Entscheidung getroffen hat]] — ترتیب [[getroffen hat]] آخر جمله می‌ماند. ۴) [[zum Ausdruck bringen]] را با [[ausdrücken]] قاطی نکن؛ اولی رسمی‌تر و امتحانی‌تر است."}
],
exercises:[
{type:"mc",q:"«تصمیم گرفتن» به آلمانی؟",options:["eine Entscheidung machen","eine Entscheidung treffen","eine Entscheidung geben"],answer:1,why:"این ترکیب همیشه با treffen می‌آید؛ machen رایج‌ترین غلط زبان‌آموزان است."},
{type:"type",q:"کامل کن (Perfekt): Er hat die Nachteile ___ ___. (in Kauf nehmen)",answer:"in Kauf genommen",accept:["in Kauf genommen"]},
{type:"blank",text:"Alle Unterlagen stehen Ihnen ___ Verfügung.",answer:"zur"},
{type:"mc",q:"«in Frage stellen» یعنی چه؟",options:["سؤال پرسیدن","زیر سؤال بردن","جواب دادن"],answer:1,why:"یعنی اعتبار چیزی را زیر سؤال بردن، نه سؤال پرسیدن (fragen)."},
{type:"type",q:"حرف اضافه‌ی درست را بگذار: Bitte nehmen Sie ___ unserem Vorschlag Stellung.",answer:"zu",accept:["zu"]}
]},
{id:"l10",order:10,level:"B2",minutes:20,title:"حرف زدن مثل امتحان",titleDe:"Redemittel für Diskussionen",blocks:[
{type:"dialog",lines:[
{de:"Also, was hältst du vom Homeoffice?",fa:"خب، نظرت درباره‌ی دورکاری چیست؟"},
{de:"Zunächst einmal spare ich viel Zeit, weil ich nicht pendeln muss. Darüber hinaus kann ich mich zu Hause besser konzentrieren.",fa:"اول از همه خیلی وقت ذخیره می‌کنم چون رفت‌وآمد ندارم. علاوه بر این، در خانه بهتر تمرکز می‌کنم."},
{de:"Das stimmt zwar, aber mir fehlt der Kontakt zu den Kollegen. Man vereinsamt schnell.",fa:"این درست است، ولی ارتباط با همکاران را از دست می‌دهم. آدم زود تنها می‌شود."},
{de:"Hingegen finde ich, dass man produktiver ist. Man wird nicht ständig unterbrochen.",fa:"در مقابل، من فکر می‌کنم آدم پربازده‌تر است. مدام کارش قطع نمی‌شود."},
{de:"Zusammenfassend lässt sich sagen: Es hat Vor- und Nachteile. Die Mischung macht's.",fa:"خلاصه می‌شود گفت: مزایا و معایبی دارد. ترکیبش خوب است."}
]},
{type:"vocab",items:[
{de:"zunächst",fa:"اول از همه",note:"شروع بحث و اولین استدلال"},
{de:"darüber hinaus",fa:"علاوه بر این",note:"رسمی‌تر از außerdem"},
{de:"hingegen",fa:"در مقابل",note:"تضاد مستقیم با جمله‌ی قبل"},
{de:"jedoch",fa:"ولی (رسمی)",note:"جایگاه دوم: ..., jedoch ..."},
{de:"einerseits ... andererseits",fa:"از یک طرف ... از طرف دیگر",note:"ساختار دوقلوی کلاسیک"},
{de:"zwar ... aber",fa:"هرچند ... ولی",note:"پذیرش حرف طرف + نظر مخالف"},
{de:"zusammenfassend",fa:"خلاصه",note:"شروع جمع‌بندی"},
{de:"abschließend",fa:"در پایان",note:"lässt sich abschließend sagen"},
{de:"meines Erachtens",fa:"به نظر من (رسمی)",note:"با حالت Genitiv!"},
{de:"im Gegensatz zu",fa:"برخلاف",note:"zu + Dativ"},
{de:"trotz",fa:"علی‌رغم",note:"+ Genitiv! در محاوره Dativ هم هست ولی امتحان Genitiv می‌خواهد"},
{de:"unter dem Strich",fa:"در مجموع",note:"اصطلاحی، برای نتیجه‌گیری"}
]},
{type:"grammar",title:"اسکلت یک بحث امتحانی",body:"بحث خوب سه بخش دارد: ۱) [[Einleitung]] — موضوع را معرفی کن: [[Heute möchte ich über ... sprechen.]] ۲) [[Argumente]] — اول موافق، بعد مخالف (یا برعکس)، با رابط‌ها: شروع با [[Zunächst einmal ...]]، ادامه با [[Darüber hinaus ...]]، بعد تضاد: [[Andererseits ...]]، [[Hingegen ...]] ۳) [[Schluss]] — نظر شخصی + جمع‌بندی: [[Zusammenfassend bin ich der Meinung, dass ...]] ⚠️ نکته‌ی امتحانی: در B2 حداقل ۳ رابط متفاوت لازم داری؛ تکرار فقط [[aber]] و [[weil]] نمره را پایین می‌آورد. هر پاراگراف را با یک رابط شروع کن."},
{type:"grammar",title:"هنر «هرچند... ولی»: [[Konzession]]",body:"برای نشان دادن اینکه حرف طرف را شنیده‌ای ولی نظر دیگری داری، از ساختار امتیازدهی استفاده کن: [[Zwar]] + جمله، [[aber]] + جمله: [[Zwar spart man Zeit, aber man vereinsamt.]] با [[obwohl]]: [[Obwohl man Zeit spart, vereinsamt man.]] (فعل آخر جمله‌ی فرعی می‌رود!) با [[trotz]] + اسم: [[Trotz der Vorteile bin ich dagegen.]] — [[trotz]] با Genitiv می‌آید: [[trotz des Regens]]، نه [[trotz dem Regen]]. نکته‌ی امتحانی: [[trotzdem]] قید است و جمله‌ی مستقل می‌خواهد: [[Es regnet. Trotzdem gehen wir raus.]] — آن را با [[trotz]] قاطی نکن."},
{type:"text",de:"Sollten Handys in der Schule verboten werden? Zunächst einmal lenken sie vom Unterricht ab. Darüber hinaus können sie für Cybermobbing missbraucht werden. Andererseits sind sie im Notfall nützlich, und man kann sie sinnvoll im Unterricht einsetzen. Zwar überwiegen meiner Meinung nach die Nachteile, aber ein generelles Verbot halte ich für übertrieben. Zusammenfassend plädiere ich für klare Regeln statt eines Verbots.",fa:"آیا موبایل باید در مدرسه ممنوع شود؟ اول از همه، حواس را از درس پرت می‌کند. علاوه بر این، می‌تواند برای آزار سایبری سوءاستفاده شود. از طرف دیگر، در مواقع اضطراری مفید است و می‌شود در کلاس به‌طور معنادار از آن استفاده کرد. هرچند به نظر من معایب بیشتر است، ولی ممنوعیت کلی را اغراق‌آمیز می‌دانم. خلاصه، به‌جای ممنوعیت، طرفدار قوانین شفاف هستم."},
{type:"vocab",items:[
{de:"seine Meinung äußern",fa:"نظر دادن",note:"formell für sagen"},
{de:"ein Argument anführen",fa:"استدلال آوردن",note:"für/gegen etwas anführen"},
{de:"zum Schluss kommen",fa:"به نتیجه رسیدن",note:"Wir kommen zum Schluss, dass..."},
{de:"den Standpunkt vertreten",fa:"از موضع دفاع کردن",note:"Ich vertrete den Standpunkt, dass..."},
{de:"auf den Punkt bringen",fa:"خلاصه و دقیق گفتن",note:"Um es auf den Punkt zu bringen: ..."},
{de:"Da hast du recht, aber...",fa:"حق با توست، ولی...",note:"مودبانه وارد مخالفت شدن"}
]}
],
exercises:[
{type:"mc",q:"برای شروع اولین استدلال کدام بهتر است؟",options:["Hingegen","Zunächst einmal","Zusammenfassend"],answer:1,why:"zunächst einmal شروع‌کننده است؛ hingegen برای تضاد و zusammenfassend برای جمع‌بندی پایانی است."},
{type:"type",q:"با zwar...aber بازنویسی کن: Obwohl es regnet, gehen wir spazieren. → ___ es regnet, ___ wir spazieren.",answer:"Zwar aber",accept:["zwar aber","Zwar aber"]},
{type:"blank",text:"___ lässt sich sagen, dass beide Seiten gute Argumente haben.",answer:"Zusammenfassend"},
{type:"mc",q:"trotz در آلمانی استاندارد با کدام حالت می‌آید؟",options:["Akkusativ","Dativ","Genitiv"],answer:2,why:"trotz + Genitiv: trotz des Wetters. در محاوره Dativ هم شنیده می‌شود، ولی در امتحان کتبی Genitiv بنویس."},
{type:"type",q:"کامل کن: Er ist zwar müde, ___ bleibt er noch eine Stunde wach.",answer:"aber",accept:["aber"]}
]}
];

    blocks: [
      { type: "dialog", lines: [
        { de: "If the weather stays clear, we'll take the early train. If it rains, we can wait here and leave later.", fa: "اگر هوا صاف بماند، قطار زودهنگام را می‌گیریم. اگر باران ببارد، می‌توانیم همین‌جا صبر کنیم و بعدتر برویم." },
        { de: "Unless the train is delayed, we should arrive before noon. If I had checked the forecast, I'd have brought my coat.", fa: "مگر اینکه قطار تأخیر داشته باشد، باید پیش از ظهر برسیم. اگر پیش‌بینی هوا را بررسی کرده بودم، کتم را می‌آوردم." }
      ]},
      { type: "grammar", title: "چهار شرط اصلی را از زمان نتیجه تشخیص بده", body: "[[Zero conditional]] برای واقعیت‌های همیشگی است: [[If you heat ice, it melts]]. هر دو بخش معمولاً حال ساده‌اند. [[First conditional]] دربارهٔ آینده‌ای واقعی و ممکن است: [[If it rains, we will stay home]]. در بند if معمولاً [[will]] نمی‌آید. [[Second conditional]] برای حال یا آیندهٔ فرضی و کم‌احتمال است: [[If I had more time, I would travel]]. پس از [[if]] از گذشتهٔ ساده استفاده می‌کنیم، اما منظور الزاماً گذشته نیست. [[Third conditional]] دربارهٔ گذشته‌ای انجام‌نشده و نتیجهٔ فرضی آن است: [[If we had left earlier, we would have caught the train]]." },
      { type: "grammar", title: "شرط‌های ترکیبی و wish", body: "در شرط ترکیبی، زمان شرط و نتیجه یکی نیستند. شرط گذشته با نتیجهٔ حال: [[If I had studied medicine, I would be a doctor now]]. حالِ فرضی با نتیجهٔ گذشته: [[If she were more careful, she wouldn't have made that mistake]]. اول زمان شرط را مشخص کن و بعد زمان نتیجه را جداگانه بساز. [[I wish I knew the answer]] یعنی اکنون جواب را نمی‌دانم و آرزو می‌کنم بدانم. [[I wish I had listened]] دربارهٔ حسرت گذشته است. [[If only]] همان معنا را با تأکید بیشتر می‌رساند." },
      { type: "vocab", items: [
        { de: "unless", fa: "مگر اینکه", note: "معنای if ... not دارد؛ آن را با شرط مثبت دوباره منفی نکن." },
        { de: "provided that", fa: "به‌شرط آنکه", note: "شرطی روشن و نسبتاً رسمی معرفی می‌کند." },
        { de: "as long as", fa: "تا وقتی که / به‌شرط آنکه", note: "در شرط، زمان یا شرط لازم را بیان می‌کند." },
        { de: "otherwise", fa: "در غیر این صورت", note: "نتیجهٔ انجام‌نشدن شرط را معرفی می‌کند." },
        { de: "if only", fa: "ای‌کاش", note: "برای آرزو یا حسرت پررنگ‌تر از wish به کار می‌رود." }
      ]},
      { type: "text", de: "If Mina gets the scholarship, she will move to Bristol in September. She would share a flat with two students if the rent were lower. Last year, she missed an application deadline; if she had submitted the form on time, she would have been considered. She now says, “If only I had checked my email every day.” If she had done that, she might be starting university already. Still, she knows that if she keeps applying, another opportunity will appear.", fa: "اگر مینا بورسیه بگیرد، در ماه سپتامبر به بریستول نقل‌مکان می‌کند. اگر اجاره کمتر بود، با دو دانشجو هم‌خانه می‌شد. سال گذشته مهلت درخواست را از دست داد؛ اگر فرم را به‌موقع فرستاده بود، درخواستش بررسی می‌شد. حالا می‌گوید: «ای‌کاش هر روز ایمیلم را بررسی کرده بودم.» اگر این کار را کرده بود، شاید اکنون دانشگاه را شروع کرده بود. بااین‌حال، می‌داند اگر به درخواست‌دادن ادامه دهد، فرصت دیگری پیدا خواهد شد." },
      { type: "grammar", title: "نکته‌ی امتحانی: شکل گذشته همیشه به گذشته اشاره نمی‌کند", body: "در [[If I were you, I would ask]]، [[were]] نشانهٔ فرضی‌بودن است و دربارهٔ توصیه‌ای در حال حاضر حرف می‌زند. برای هر بند جداگانه مشخص کن: زمان شرط، میزان واقع‌بودن آن، و زمان نتیجه. سپس فعل‌ها را بساز. با [[unless]] مفهوم منفی در خود واژه هست: [[Unless you hurry, you'll miss the bus]]؛ نگوییم [[unless you don't hurry]] مگر آنکه معنای دوگانه واقعاً مدنظر باشد." }
    ],
    exercises: [
      { type: "blank", text: "If you ___ water to 100°C, it boils. (heat)", answer: "heat" },
      { type: "mc", q: "کدام جمله دربارهٔ آینده‌ای واقعی و ممکن است؟", options: ["If I had wings, I would fly.", "If it rains tonight, we will stay in.", "If I had left earlier, I would have arrived on time."], answer: 1, why: "First conditional از حال ساده در بند if و will در نتیجه برای امکان واقعی آینده استفاده می‌کند." },
      { type: "type", q: "جمله را به شرط نوع سوم تبدیل کن: We missed the bus, so we were late.", answer: "If we had caught the bus, we would not have been late.", accept: ["If we had caught the bus, we wouldn't have been late.", "If we had caught the bus, we would not have been late"] },
      { type: "mc", q: "If I had taken that job, I would live in Berlin now. این چه رابطه‌ای دارد؟", options: ["شرط صفر", "شرط ترکیبی: شرط گذشته و نتیجهٔ حال", "شرط اول"], answer: 1, why: "شرطِ گرفتن شغل در گذشته است؛ پیامد فرضی آن، محل زندگی کنونی است." },
      { type: "blank", text: "I wish I ___ the answer now. (know)", answer: "knew" }
    ]
  },

    blocks: [
      { type: "text", de: "The city council has opened a new library near the station. It was designed by a local architect and is used by thousands of residents each month. Staff are adding a quiet study room this week. The council says the project will have improved access to books, but the final survey has not been published yet.", fa: "شورای شهر کتابخانه‌ای تازه نزدیک ایستگاه افتتاح کرده است. این کتابخانه را معماری محلی طراحی کرده و هزاران نفر از ساکنان هر ماه از آن استفاده می‌کنند. کارکنان این هفته اتاق مطالعه‌ای آرام به آن اضافه می‌کنند. شورا می‌گوید این طرح دسترسی به کتاب را بهبود خواهد داد، اما بررسی نهایی هنوز منتشر نشده است." },
      { type: "grammar", title: "مجهول را با زمان درست بساز", body: "ساخت پایهٔ [[Passive]] چنین است: [[be + past participle]]. زمان را فعل [[be]] نشان می‌دهد: [[is made]] حال ساده، [[was made]] گذشتهٔ ساده، [[is being made]] حال استمراری، [[has been made]] حال کامل، [[had been made]] گذشتهٔ کامل و [[will be made]] آینده. عامل با [[by]] می‌آید، اما اگر نامشخص یا کم‌اهمیت باشد حذف می‌شود: [[My bike was stolen]]. برای افعال مُدال: [[must be completed]] و [[could have been avoided]]. مفعول جملهٔ معلوم معمولاً فاعل جملهٔ مجهول می‌شود." },
      { type: "grammar", title: "Reported speech: جمله، پرسش و دستور", body: "برای گزارش جمله می‌توان از [[said (that)]] استفاده کرد؛ پس از [[told]] معمولاً شخص می‌آید: [[She told me that ...]]. وقتی فعل گزارش در گذشته باشد، زمان اغلب یک مرحله عقب می‌رود: [[I am tired → He said he was tired]]؛ [[I have finished → She said she had finished]]. این عقب‌بردن در واقعیت‌هایی که هنوز درست‌اند اجباری نیست. پرسش بله/خیر با [[if/whether]] و ترتیب خبری می‌آید: [[He asked whether I was ready]]. دستور: [[The manager told us to wait]]؛ منفی: [[not to wait]]." },
      { type: "vocab", items: [
        { de: "announce", fa: "اعلام‌کردن", note: "در مجهول: be announced." },
        { de: "report", fa: "گزارش‌دادن", note: "برای بازگویی خبر یا گفته از reported استفاده کن." },
        { de: "warn somebody not to do something", fa: "به کسی هشدار دادن که کاری نکند", note: "پس از warn شخص می‌آید و مصدر با to می‌گیرد." },
        { de: "whether", fa: "آیا", note: "برای گزارش پرسش بله/خیر؛ ترتیب جمله خبری می‌ماند." },
        { de: "by", fa: "توسط", note: "عامل مجهول را معرفی می‌کند و فقط وقتی مهم است می‌آید." }
      ]},
      { type: "dialog", lines: [
        { de: "“We have finished the survey,” the researcher said. She told the team that the data had been checked.", fa: "پژوهشگر گفت: «بررسی را تمام کرده‌ایم.» او به گروه گفت که داده‌ها بررسی شده بودند." },
        { de: "The director asked whether the results would be published. The assistant replied that they would be shared on Friday.", fa: "مدیر پرسید آیا نتایج منتشر خواهند شد. دستیار پاسخ داد که روز جمعه به اشتراک گذاشته می‌شوند." }
      ]},
      { type: "grammar", title: "نکته‌ی امتحانی: تغییر ضمیر و قید زمان", body: "در نقل غیرمستقیم، ضمیرها بر اساس گوینده و شنونده تغییر می‌کنند و قیدها نیز ممکن است جابه‌جا شوند: [[today → that day]], [[tomorrow → the next day]], [[here → there]]. اگر زمان و مکان همچنان همان باشد، تغییر مکانیکی لازم نیست. در مجهول مراقب زنجیرهٔ [[be]] باش: [[has been built]] حال کامل مجهول است؛ [[is being built]] حال استمراری مجهول. شکل سوم فعل پس از آخرین فعل کمکی می‌آید." }
    ],
    exercises: [
      { type: "blank", text: "The first version ___ in 2022. (publish, past simple passive)", answer: "was published" },
      { type: "mc", q: "مجهولِ درستِ They are repairing the road کدام است؟", options: ["The road is repaired.", "The road is being repaired.", "The road has repaired."], answer: 1, why: "حال استمراری مجهول با is/are being + past participle ساخته می‌شود." },
      { type: "type", q: "نقل غیرمستقیم بساز: Mia said, “I have lost my keys.”", answer: "Mia said that she had lost her keys.", accept: ["Mia said she had lost her keys.", "Mia said that she had lost her keys."] },
      { type: "mc", q: "گزارش درستِ “Are you ready?” he asked کدام است؟", options: ["He asked was I ready.", "He asked whether I was ready.", "He asked whether was I ready."], answer: 1, why: "در پرسش غیرمستقیم از if/whether و ترتیب خبری استفاده می‌کنیم." },
      { type: "blank", text: "The guard told us ___ the door. (not / touch)", answer: "not to touch" }
    ]
  },

    blocks: [
      { type: "grammar", title: "Relative clauses: اطلاعات ضروری یا توضیح اضافه", body: "[[Defining relative clause]] مشخص می‌کند دربارهٔ کدام شخص یا چیز حرف می‌زنیم: [[The student who sits near me is from Spain]]. ویرگول نمی‌گیرد و اگر ضمیر موصولی مفعول باشد، گاهی حذف می‌شود: [[The book (that) I borrowed]]. [[Non-defining relative clause]] اطلاعات اضافه می‌دهد و با ویرگول جدا می‌شود: [[My sister, who lives in Leeds, is a doctor]]. در این نوع معمولاً [[that]] نمی‌آید و ضمیر حذف نمی‌شود. [[whose]] مالکیت، [[where]] مکان و [[when]] زمان را نشان می‌دهند." },
      { type: "text", de: "The science centre, which opened in 2010, attracts families from across the region. Visitors who book online can enter through a separate door. A guide who speaks three languages leads the morning tour. The café, which overlooks the river, serves lunch until three. The building was designed by an architect whose work has won several awards.", fa: "مرکز علمی که در سال ۲۰۱۰ افتتاح شد، خانواده‌هایی را از سراسر منطقه جذب می‌کند. بازدیدکنندگانی که آنلاین رزرو می‌کنند می‌توانند از در جداگانه‌ای وارد شوند. راهنمایی که به سه زبان صحبت می‌کند تور صبحگاهی را می‌گرداند. کافه که رو به رودخانه است تا ساعت سه ناهار سرو می‌کند. ساختمانی را معماری طراحی کرده که آثارش چند جایزه برده است." },
      { type: "grammar", title: "Participle clauses: جمله را فشرده کن", body: "برای کوتاه‌کردن بندها، فاعل مشترک را بررسی کن. [[Walking through the park, I found a quiet path]] یعنی «وقتی در پارک قدم می‌زدم، مسیر آرامی پیدا کردم». فاعل walk باید همان [[I]] باشد. شکل سوم فعل معمولاً معنای مجهول یا حالت کامل دارد: [[Built in 1890, the bridge is still in use]]. برای کامل‌بودنِ پیش از عمل اصلی می‌توان از [[having + past participle]] استفاده کرد: [[Having finished the report, she went home]]." },
      { type: "vocab", items: [
        { de: "who / that", fa: "که؛ برای انسان یا چیز", note: "در بند محدودکننده می‌تواند فاعل باشد؛ that در بند توضیحی نمی‌آید." },
        { de: "whose", fa: "که ... مال اوست", note: "مالکیت را نشان می‌دهد و پیش از اسم می‌آید." },
        { de: "overlook", fa: "رو به ... بودن / مشرف بودن", note: "اغلب برای پنجره، اتاق یا کافه‌ای با منظره به کار می‌رود." },
        { de: "having + past participle", fa: "پس از آنکه ... کرده بود", note: "عمل بند وصفی پیش از فعل جملهٔ اصلی کامل شده است." },
        { de: "inversion", fa: "وارونگی ترتیب معمول جمله", note: "پس از قیدهای منفی یا محدودکننده، فعل کمکی پیش از فاعل می‌آید." }
      ]},
      { type: "dialog", lines: [
        { de: "Never have I seen the gallery so crowded. Only after the guide explained the map did we understand the route.", fa: "هرگز گالری را این‌قدر شلوغ ندیده بودم. فقط پس از آنکه راهنما نقشه را توضیح داد، مسیر را فهمیدیم." },
        { de: "Rarely does the museum close early, but on Monday it will. Not until we reached the entrance did I notice the sign.", fa: "موزه به‌ندرت زود می‌بندد، اما دوشنبه این کار را می‌کند. تازه وقتی به ورودی رسیدیم، تابلوی اعلان را دیدم." }
      ]},
      { type: "grammar", title: "نکته‌ی امتحانی: وارونگی فقط در ساختارهای مشخص", body: "پس از آغاز جمله با [[Never]], [[Rarely]], [[Seldom]], [[Only then]] یا [[Not until ...]] معمولاً وارونگی می‌آید: [[Never have I seen this]]. اگر [[only after]] یک بند را معرفی کند، وارونگی در بند اصلی می‌آید: [[Only after the talk did we understand]]. برای فعل اصلیِ حال یا گذشتهٔ ساده، از [[do/does/did]] کمک بگیر. وارونگی را فقط در جایگاه‌های تأکیدی و منفیِ مناسب به کار ببر." }
    ],
    exercises: [
      { type: "mc", q: "کدام جمله به ویرگول نیاز دارد؟", options: ["People who arrive early can choose a seat.", "My brother who lives in Leeds is visiting.", "My brother, who lives in Leeds, is visiting."], answer: 2, why: "وقتی اطلاعات دربارهٔ برادر توضیح اضافه است و فرد از قبل مشخص است، بند موصولی با ویرگول جدا می‌شود." },
      { type: "type", q: "با یک عبارت participle جمله را کوتاه کن: Because she had finished the report, she went home.", answer: "Having finished the report, she went home.", accept: ["Having finished the report, she went home"] },
      { type: "blank", text: "Never ___ I seen such a quiet place. (have)", answer: "have" },
      { type: "mc", q: "کدام جمله وارونگی درست دارد؟", options: ["Rarely she visits the archive.", "Rarely does she visit the archive.", "Rarely visits she the archive."], answer: 1, why: "در حال ساده پس از قید منفی Rarely، فعل کمکی does پیش از فاعل می‌آید." },
      { type: "type", q: "در جملهٔ The woman who lives next door works at the museum، بند موصولی چه نوعی است؟", answer: "defining", accept: ["A defining relative clause", "Defining relative clause"] }
    ]
  },

// re-read fresh data, apply a mutation, write back (safe even if the main app changed data meanwhile)
function commit(fn){
 const d=readRaw();if(!d){toast("داده‌ی اپ اصلی پیدا نشد");return false}
 if(!d.learn||typeof d.learn!=="object")d.learn={};if(!Array.isArray(d.cards))d.cards=[];
 fn(d);try{localStorage.setItem(K,JSON.stringify(d));db=d;return true}catch(e){toast("ذخیره‌سازی ناموفق بود");return false}
}

/* ---------- 6) EXERCISE ENGINE ---------- */
let X=null; // {l,i,ok,res[]}
const accepts=e=>[e.answer,...(e.accept||[])].map(nz);
function viewEx(l){
 if(!X||X.l.id!==l.id)X={l,i:0,ok:0,res:[]};
 const E=l.exercises;if(!E||!E.length)return viewResult();
 if(X.i>=E.length)return viewResult();
 const e=E[X.i],dots=E.map((_,k)=>`<i class="dot ${k<X.i?(X.res[k]?"ok":"bad"):k===X.i?"cur":""}"></i>`).join("");
 let body="";
 if(e.type==="mc")body=`<div class="q">${fmt(e.q)}</div>${e.options.map((o,k)=>`<button class="opt ${/[A-Za-z]/.test(o)?"de":""}" data-k="${k}">${esc(o)}</button>`).join("")}`;
 else if(e.type==="type")body=`<div class="q">${fmt(e.q)}</div><input id="ans" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deutsch"><button class="btn full" id="chk">بررسی</button>`;
 else{const [a,b]=e.text.split("___");body=`<div class="q de" style="font-size:22px">${esc(a)}<span class="gap"></span>${esc(b||"")}</div>${e.hint?`<p class="mute sm">${fmt(e.hint)}</p>`:""}<input id="ans" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deutsch"><button class="btn full" id="chk">بررسی</button>`}
 app.innerHTML=`<div class="dots">${dots}</div><div class="card" id="exc">${body}<div id="fb"></div></div>`;
 const fin=(ok,correct)=>{
  X.res[X.i]=ok;if(ok)X.ok++;const last=X.i===E.length-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"درست!":`پاسخ درست: <span class="de">${esc(correct)}</span>`}${e.why?`<div class="mute sm" style="margin-top:6px">${fmt(e.why)}</div>`:""}</div><button class="btn full" id="nx">${last?"پایان تمرین":"بعدی"}</button>`;
  $("#nx").onclick=()=>{X.i++;viewEx(l);scrollTo(0,0)};$("#nx").focus();
 };
 if(e.type==="mc")$$(".opt").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k;$$(".opt").forEach((x,j)=>{x.disabled=true;if(j===e.answer)x.classList.add("right")});
  if(k!==e.answer)b.classList.add("wrong");fin(k===e.answer,e.options[e.answer]);
 });
 else{
  const chk=()=>{const v=$("#ans").value;if(!v.trim())return;$("#ans").disabled=true;$("#chk").hidden=true;
   const full=e.type==="blank"?e.text.replace("___",e.answer):e.answer;fin(accepts(e).includes(nz(v)),full)};
  $("#chk").onclick=chk;$("#ans").onkeydown=ev=>{if(ev.key==="Enter")chk()};$("#ans").focus();
 }
}
function viewResult(){
 const l=X.l,n=l.exercises.length,pct=Math.round(X.ok/n*100),pass=pct>=60;
 commit(d=>{const p=d.learn[l.id]||{},now=Date.now();
  d.learn[l.id]={...p,startedAt:p.startedAt||now,score:Math.max(p.score||0,pct),...(pass?{completedAt:p.completedAt||now}:{})}});
 const nxt=LESSONS.find(x=>x.order===l.order+1);

  <button class="btn full" id="again">تلاش مجدد</button><a class="btn ghost full" href="#/">بازگشت به مسیر</a></div>`;
 $("#again").onclick=()=>{X=null;viewEx(l);scrollTo(0,0)};
}

/* ---------- 6b) TAP-A-WORD glossary ---------- */
function tapWords(t){
 return t.split(/(\s+)/).map(p=>{
  if(/^\s+$/.test(p)||!p)return p;
  const m=p.match(/^([^A-Za-z'’-]*)([A-Za-z'’-]+)([^A-Za-z'’-]*)$/);
  if(!m)return p;
  return `${m[1]}<span class="w" data-w="${esc(m[2].toLowerCase())}">${m[2]}</span>${m[3]}`;
 }).join("");
}
function hideTap(){const p=$("#tapPop");if(p)p.hidden=true}
function bindTap(l){
 const gl=l.glossary||{};
 app.onclick=e=>{
  const w=e.target.closest(".w");
  if(!w){hideTap();return}
  const s=getSelection();
  if(s&&!s.isCollapsed){hideTap();return} // a real selection → let selection handler work
  e.stopPropagation();
  const key=w.dataset.w,fa=gl[key];
  const pop=$("#tapPop");
  pop.innerHTML=`<div class="de" style="font-size:18px;color:var(--accent)">${esc(w.textContent)}</div>
   ${fa?`<div style="margin:4px 0">${esc(fa)}</div>`:`<div class="mute sm" style="margin:4px 0">معنی دقیق را نمی‌دانم — از دیکشنری بپرس</div>`}
   ${fa?`<button class="btn ghost sm" id="tapAdd" style="padding:6px 14px;font-size:14px">+ کارت</button>`:""}`;
  const r=w.getBoundingClientRect();
  pop.hidden=false;
  pop.style.top=Math.min(innerHeight-140,r.bottom+8+scrollY)+"px";
  pop.style.left=Math.max(10,Math.min(innerWidth-190,r.left+r.width/2-85))+"px";
  const add=$("#tapAdd");
  if(add)add.onclick=ev=>{ev.stopPropagation();hideTap();
   $("#cF").value=w.textContent;$("#cB").value=fa||"";
   const ds=(db.decks&&db.decks.length?db.decks:[{id:"default",name:"پیش‌فرض"}]);
   $("#cD").innerHTML=ds.map(d=>`<option value="${esc(d.id)}" ${d.id===(db.active||"default")?"selected":""}>${esc(d.name)}</option>`).join("");
   $("#sheet").hidden=false;$("#cB").focus();
  };
 };
}
document.addEventListener("click",e=>{if(!e.target.closest("#tapPop")&&!e.target.closest(".w"))hideTap()});

let pend=null,st;
function hideSel(){$("#selBtn").hidden=true;pend=null}
document.addEventListener("selectionchange",()=>{clearTimeout(st);st=setTimeout(()=>{
 if(!$("#sheet").hidden)return;
 const s=getSelection();if(!s||s.isCollapsed||!s.anchorNode||!/^#\/[a-z]+\d+$/.test(location.hash))return hideSel();
 const el=s.anchorNode.parentElement&&s.anchorNode.parentElement.closest(".de"),txt=s.toString().replace(/\s+/g," ").trim();
 if(!el||!app.contains(el)||!txt||txt.length>200)return hideSel();
 const r=s.getRangeAt(0).getBoundingClientRect(),b=$("#selBtn");
 pend={txt,ctx:ctxFor(el,txt)};b.hidden=false;
 b.style.top=Math.min(innerHeight-60,r.bottom+14)+"px";b.style.left=Math.max(10,Math.min(innerWidth-100,r.left+r.width/2-45))+"px"; // below selection (native toolbar sits above)
},180)});
function ctxFor(el,txt){const hit=el.textContent.trim().split(/(?<=[.!?])\s+/).find(x=>x.includes(txt));return hit&&hit!==txt?hit:""}
function vocabHit(txt){
 const l=byId((location.hash.match(/^#\/([a-z]+\d+)/)||[])[1]);if(!l)return null;const k=nz(txt.replace(/^(der|die|das)\s+/i,""));
 for(const b of l.blocks)if(b.type==="vocab")for(const x of b.items)if(nz(x.de.replace(/^(der|die|das)\s+/i,""))===k)return x;return null;
}

 $("#sheet").hidden=false;$("#selBtn").hidden=true;$("#cB").focus();
};

      { type: "grammar", title: "مصدر و صفت چگونه اسم می‌شوند؟", body: "مصدرِ اسمی‌شده خنثی است و با حرف بزرگ نوشته می‌شود: [[das Lesen]]، [[beim Lesen]] و [[das sorgfältige Prüfen der Unterlagen]]. صفت اسمی‌شده نیز حرف بزرگ می‌گیرد، اما پایانهٔ صفت را حفظ می‌کند: [[das Neue]]، [[etwas Neues]]، [[mit etwas Neuem]]. برای اشخاص، جنس و شمار اهمیت دارد: [[der Angestellte]]، [[eine Angestellte]] و [[die Angestellten]]. شکل [[die Antragstellenden]] از Partizip I اسمی‌شده است و در کاربرد اداری به متقاضیان اشاره می‌کند. اسم‌سازی اجازه می‌دهد اطلاعات را فشرده کنیم، ولی انباشتن اسم‌ها می‌تواند خوانایی را کم کند." },
      { type: "vocab", items: [
        { de: "nach erfolgter Prüfung", fa: "پس از انجام بررسی", note: "بازنویسی روشن‌تر: nachdem die Unterlagen geprüft worden sind." },
        { de: "bei unvollständiger Vorlage", fa: "در صورت ارائهٔ ناقص", note: "bei در اینجا شرطی است؛ می‌توان از wenn ... nicht vollständig vorgelegt werden استفاده کرد." },
        { de: "zwecks Überprüfung", fa: "به‌منظور بررسی", note: "zwecks با گنتیو می‌آید؛ سبک اداری و فشرده دارد." },
        { de: "fristgerecht nachreichen", fa: "مدارک باقی‌مانده را در مهلت مقرر ارائه کردن", note: "nachreichen یعنی چیزی را پس از ارسال اولیه اضافه یا تکمیل کردن." },
        { de: "die Bearbeitung des Antrags", fa: "رسیدگی به درخواست", note: "des Antrags وابستهٔ گنتیو است؛ معادل فعلی: den Antrag bearbeiten." }
      ]},
      { type: "grammar", title: "نکته‌ی امتحانی: تبدیل ساختار بدون تغییر معنا", body: "در تبدیل [[Verbalstil]] به [[Nominalstil]]، رابطهٔ منطقی را حفظ کن: [[Nachdem die Behörde die Unterlagen geprüft hat]] می‌تواند به [[Nach der Prüfung der Unterlagen durch die Behörde]] تبدیل شود. مفعول به وابستهٔ گنتیو و فاعل به عبارت [[durch]] تبدیل شده است. برای شرط: [[Wenn die Unterlagen fehlen → Bei Fehlen der Unterlagen]]. برای علت: [[Weil die Unterlagen fehlen → Wegen des Fehlens der Unterlagen]]. این دو را جابه‌جا نکن؛ شرط با علت یکی نیست. در پایان، حرف بزرگ، حالت دستوری و پایانهٔ صفت را جداگانه بررسی کن." }
    ],

      { type: "text", de: "Sollten Hochschulen alle Vorlesungen aufzeichnen?\n\nDigitale Aufzeichnungen können den Zugang zur Hochschullehre erleichtern. Dennoch ist umstritten, ob sämtliche Vorlesungen grundsätzlich aufgezeichnet werden sollten. Entscheidend ist dabei nicht allein die technische Machbarkeit, sondern auch die Frage, unter welchen Bedingungen Aufzeichnungen das Lernen tatsächlich unterstützen.\n\nFür ein breites Angebot spricht zunächst die zeitliche Flexibilität. Wer neben dem Studium arbeitet oder Angehörige betreut, kann versäumte Inhalte nachholen. Auch Studierende, die in einer Fremdsprache lernen, profitieren davon, schwierige Passagen mehrfach anzuhören. Eine Aufzeichnung ermöglicht somit eine individuellere Nachbereitung, ersetzt jedoch nicht automatisch die aktive Auseinandersetzung mit dem Stoff.\n\nGegen eine uneingeschränkte Aufzeichnungspflicht lässt sich einwenden, dass nicht jede Lehrveranstaltung dafür geeignet ist. Werden persönliche Erfahrungen oder sensible Fallbeispiele besprochen, kann die Aufnahme die Offenheit der Beteiligten beeinträchtigen. Zwar ließen sich einzelne Beiträge aus der Aufnahme entfernen, doch wäre damit zusätzlicher Aufwand verbunden. Zudem darf aus der bloßen Verfügbarkeit eines Videos nicht auf einen höheren Lernerfolg geschlossen werden.\n\nEine tragfähige Lösung wäre daher, Vorlesungen mit überwiegend vermittelndem Charakter aufzuzeichnen und für interaktive Formate begründete Ausnahmen vorzusehen. Dies setzt allerdings voraus, dass der Zugang klar geregelt ist und Lehrende angemessen unterstützt werden. Ergänzende Aufgaben könnten dazu beitragen, dass die Videos nicht nur passiv konsumiert werden.\n\nInsgesamt überwiegen die Vorteile eines gezielten Angebots gegenüber denen einer pauschalen Pflicht. Hochschulen sollten Aufzeichnungen deshalb als ergänzendes Lernangebot ausbauen, ohne die unterschiedlichen Anforderungen ihrer Lehrveranstaltungen aus dem Blick zu verlieren.", fa: "آیا دانشگاه‌ها باید همهٔ درس‌گفتارها را ضبط کنند؟\n\nفایل‌های ضبط‌شدهٔ دیجیتال می‌توانند دسترسی به آموزش دانشگاهی را آسان‌تر کنند. بااین‌حال، دربارهٔ اینکه آیا اصولاً باید همهٔ درس‌گفتارها ضبط شوند اختلاف‌نظر وجود دارد. مسئله فقط امکان فنی نیست؛ این هم مهم است که ضبط کلاس تحت چه شرایطی واقعاً از یادگیری پشتیبانی می‌کند.\n\nنخستین دلیل به نفع ارائهٔ گستردهٔ این امکان، انعطاف زمانی است. کسی که در کنار تحصیل کار می‌کند یا از اعضای خانواده مراقبت می‌کند، می‌تواند مطالب ازدست‌رفته را جبران کند. دانشجویانی که به زبانی غیربومی درس می‌خوانند نیز از چندبار گوش‌دادن به بخش‌های دشوار سود می‌برند. بنابراین، ضبط کلاس مرور متناسب با نیاز فرد را ممکن می‌کند، اما خودبه‌خود جای درگیری فعال با مطالب را نمی‌گیرد.\n\nدر برابر الزام بی‌استثنا به ضبط می‌توان گفت که هر کلاس برای این کار مناسب نیست. وقتی تجربه‌های شخصی یا نمونه‌های حساس مطرح می‌شوند، ضبط ممکن است صراحت شرکت‌کنندگان را کاهش دهد. درست است که می‌توان برخی گفته‌ها را از فایل حذف کرد، اما این کار زحمت بیشتری دارد. افزون بر این، صرفِ در دسترس بودن ویدئو اجازه نمی‌دهد یادگیری بیشتر را نتیجه بگیریم.\n\nبنابراین، راه‌حلی عملی این است که درس‌گفتارهایی با ماهیت عمدتاً انتقال مطالب ضبط شوند و برای قالب‌های تعاملی استثناهای موجه در نظر گرفته شود. البته این کار مستلزم قواعد روشن دسترسی و حمایت مناسب از مدرسان است. تمرین‌های تکمیلی می‌توانند کمک کنند ویدئوها صرفاً به‌شکلی منفعلانه مصرف نشوند.\n\nدر مجموع، مزایای ارائهٔ هدفمند این امکان از مزایای الزام همگانی بیشتر است. بنابراین، دانشگاه‌ها باید ضبط کلاس را به‌عنوان امکان یادگیری تکمیلی گسترش دهند، بدون اینکه نیازهای متفاوت کلاس‌هایشان را نادیده بگیرند." },
      { type: "grammar", title: "کالبدشکافی متن نمونه", body: "بند اول با [[Dennoch ist umstritten, ob ...]] پرسش بحث را مشخص می‌کند و با [[unter welchen Bedingungen]] از پاسخ سادهٔ بله/خیر فراتر می‌رود. بند دوم ادعای [[zeitliche Flexibilität]] را با دو گروه مشخص، یعنی شاغلان و مراقبان خانواده، توضیح می‌دهد؛ پس ادعا بی‌پشتوانه رها نشده است. جملهٔ [[ersetzt jedoch nicht automatisch ...]] همان‌جا حدِ استدلال را روشن می‌کند. بند سوم با [[Zwar ... doch ...]] یک راه‌حل احتمالی را می‌پذیرد، سپس هزینه‌اش را نشان می‌دهد. بند چهارم پیشنهاد مشروط ارائه می‌کند؛ [[Dies setzt allerdings voraus, dass ...]] شرط اجرای آن را روشن می‌کند. نتیجه به پرسش آغازین پاسخ می‌دهد و هیچ آمار ساختگی وارد متن نمی‌کند." },
      { type: "grammar", title: "انسجام و دستور: پیچیدگیِ کنترل‌شده", body: "در [[Obwohl Aufzeichnungen hilfreich sind, ersetzen sie keine Übungen]] فعل بند وابسته در پایان است و فعل بند اصلی پس از ویرگول می‌آید. در [[Aufzeichnungen sind hilfreich; dennoch ersetzen sie keine Übungen]] واژهٔ [[dennoch]] جایگاه اولِ بند اصلی را گرفته و فعل پس از آن است. ضمیرهایی مانند [[dies]] و [[daraus]] باید به گزاره‌ای روشن ارجاع دهند. از ادعاهای مطلق مثل [[Videos verbessern immer den Lernerfolg]] پرهیز کن؛ [[können]]، [[unter bestimmten Bedingungen]] و [[nicht zwangsläufig]] دقت استدلال را بالا می‌برند. ساختار پیچیده زمانی ارزش دارد که رابطهٔ علت، شرط یا تقابل را روشن‌تر کند." },
      { type: "grammar", title: "نکته‌ی امتحانی: بازبینی بر اساس خطاهای پُرهزینه", body: "ابتدا بررسی کن همهٔ خواسته‌های صورت‌سؤال پوشش داده شده و موضعت روشن است. سپس ببین هر بند دلیل یا مثالی دارد و نتیجه واقعاً از متن برمی‌آید. در بازبینی زبانی، جای فعل، تطابق فاعل و فعل، حالت پس از حرف اضافه و ارجاع ضمیر را بررسی کن. میان [[einerseits ... andererseits]] برای سنجش دو سوی مسئله و [[zwar ... aber]] برای پذیرش همراه با محدودیت فرق بگذار. برای اثبات یک ادعا، نام پژوهش یا درصدی را که نمی‌دانی نساز؛ مثال فرضیِ روشن بهتر از شاهد جعلی است." }
