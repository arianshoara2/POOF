const EN_LESSONS_PART2=[{"id":"en04","order":4,"level":"A2","minutes":15,"title":"آینده و برنامه‌ها","titleEn":"Future and Plans","blocks":[{"type":"dialog","lines":[{"de":"Are you free this weekend, Mina?","fa":"مینا، این آخر هفته وقت داری؟"},{"de":"Not on Saturday. I'm visiting my parents in the morning.","fa":"شنبه نه. صبح می‌رم دیدن پدر و مادرم."},{"de":"Oh, I see. What are you doing on Sunday?","fa":"آها، فهمیدم. یکشنبه چی کار می‌کنی؟"},{"de":"I'm meeting Sara at the library at ten.","fa":"قراره ساعت ده سارا رو توی کتابخونه ببینم."},{"de":"Are you going to study together?","fa":"می‌خواین با هم درس بخونین؟"},{"de":"Yes, we've planned it. Our exam is next week.","fa":"آره، از قبل برنامه‌ریزی کردیم. امتحانمون هفتهٔ بعده."},{"de":"That sounds useful. I'll bring you some coffee.","fa":"به نظر مفید میاد. من براتون قهوه میارم."},{"de":"Thanks! But you don't have to come so early.","fa":"مرسی! ولی لازم نیست این‌قدر زود بیای."},{"de":"No problem. I can come around eleven.","fa":"مشکلی نیست. می‌تونم حدود یازده بیام."},{"de":"Great. We're going to take a short break then.","fa":"عالیه. قرارِ اون موقع یه استراحت کوتاه کنیم."},{"de":"Look at those dark clouds. It's going to rain.","fa":"اون ابرای تیره رو ببین. انگار قراره بارون بیاد."},{"de":"You're right. We should take umbrellas.","fa":"درست می‌گی. بهتره چتر ببریم."},{"de":"Don't worry, I'll check the weather tonight.","fa":"نگران نباش، امشب هوا رو چک می‌کنم."},{"de":"Perfect. See you at the library on Sunday!","fa":"عالیه. یکشنبه توی کتابخونه می‌بینمت!"}]},{"type":"vocab","items":[{"de":"weekend","fa":"آخر هفته","note":"در بریتانیا معمولاً شنبه و یکشنبه را دربر می‌گیرد؛ at the weekend بریتانیایی است."},{"de":"appointment","fa":"قرارِ مشخص","note":"برای وقت دکتر یا دیدار رسمی: a doctor’s appointment."},{"de":"arrangement","fa":"هماهنگی از پیش","note":"با present continuous برای برنامهٔ قطعی زیاد می‌آید."},{"de":"plan","fa":"برنامه / برنامه‌ریزی کردن","note":"I have a plan؛ I plan to study."},{"de":"schedule","fa":"برنامهٔ زمانی","note":"اسم یا فعل است؛ a busy schedule."},{"de":"weekdays","fa":"روزهای کاری هفته","note":"معمولاً دوشنبه تا جمعه."},{"de":"next week","fa":"هفتهٔ آینده","note":"زمان آینده؛ بدون in: next week."},{"de":"tomorrow morning","fa":"فردا صبح","note":"همراه with / on نمی‌خواهد: see you tomorrow morning."},{"de":"tonight","fa":"امشب","note":"معمولاً بدون حرف اضافه: tonight."},{"de":"to visit","fa":"سر زدن / دیدن","note":"visit someone؛ نه visit to someone."},{"de":"to meet","fa":"ملاقات کردن","note":"meet someone؛ در برنامهٔ قطعی: I’m meeting her."},{"de":"to arrange","fa":"هماهنگ کردن","note":"arrange a meeting؛ arrange to meet."},{"de":"to decide","fa":"تصمیم گرفتن","note":"decide to + فعل ساده."},{"de":"to promise","fa":"قول دادن","note":"promise to help؛ برای قول‌ها will طبیعی است."},{"de":"to predict","fa":"پیش‌بینی کردن","note":"predict the future؛ پیش‌بینی بر پایهٔ شواهد متفاوت است."},{"de":"evidence","fa":"شواهد","note":"dark clouds are evidence of rain."},{"de":"available","fa":"وقت‌داشتن / در دسترس","note":"Are you available at five?"},{"de":"busy","fa":"مشغول","note":"I’m busy on Tuesday؛ busy with homework."},{"de":"probably","fa":"احتمالاً","note":"It will probably rain."},{"de":"definitely","fa":"قطعاً","note":"She is definitely coming."},{"de":"umbrella","fa":"چتر","note":"an umbrella چون با صدای واکه شروع می‌شود."},{"de":"forecast","fa":"پیش‌بینی هوا","note":"the weather forecast."},{"de":"to charge","fa":"شارژ کردن","note":"charge my phone؛ با charge به معنی هزینه گرفتن اشتباه نشود."},{"de":"broken","fa":"خراب / شکسته","note":"My old phone is broken."},{"de":"should","fa":"بهتر است / بایدِ توصیه‌ای","note":"You should rest؛ پیشنهاد نه اجبار."},{"de":"must","fa":"بایدِ ضروری","note":"You must wear a helmet؛ اجبار قوی‌تر از should."},{"de":"have to","fa":"مجبور بودن","note":"I have to work؛ الزام ناشی از شرایط یا قانون."},{"de":"might","fa":"شاید / ممکن است","note":"I might stay home؛ عدم قطعیت."}]},{"type":"grammar","title":"will و going to: تصمیم، قصد و پیش‌بینی","body":"برای تصمیمی که همان لحظه می‌گیری، قول یا پیشنهاد کمک معمولاً از [[will + base verb]] استفاده می‌کنیم. برای قصدی که از قبل شکل گرفته، [[am/is/are going to + base verb]] مناسب است. هر دو می‌توانند برای پیش‌بینی به کار بروند؛ با شواهدی که همین حالا می‌بینیم، [[going to]] اغلب طبیعی‌تر است. این‌ها قانون‌های کاربردی‌اند، نه مرزهای مطلق. جملهٔ منفی و سؤالی: [[I won’t]] و [[Will you...?]]؛ [[I’m not going to]] و [[Are you going to...?]].\nمثال‌ها: [[The phone is ringing. I’ll answer it.]] (گوشی زنگ می‌خورد؛ من جواب می‌دهم)؛ [[I’ll help you with your bags.]] (کمکت می‌کنم کیسه‌هایت را ببری)؛ [[I think it will be fine.]] (فکر می‌کنم خوب می‌شود)؛ [[We’re going to buy a new laptop.]] (از قبل قصد داریم لپ‌تاپ بخریم)؛ [[Look at the clouds. It’s going to rain.]] (ابرها را ببین؛ انگار باران می‌آید)؛ [[She isn’t going to travel tomorrow.]] (او قصد ندارد فردا سفر کند)؛ [[Will you call me later?]] (بعداً زنگ می‌زنی؟)؛ [[Are they going to move next month?]] (آیا قصد دارند ماه آینده اسباب‌کشی کنند؟)."},{"type":"tip","body":"بعد از [[will]]، [[should]] و [[must]] فعل همیشه بدون [[to]] می‌آید: [[I will call you.]]، [[You should sleep.]]؛ اما در [[going to]]، حرف [[to]] بخشی از ساختار است: [[I am going to study.]]."},{"type":"grammar","title":"حال استمراری برای برنامهٔ هماهنگ‌شده","body":"وقتی جزئیات یک برنامه، مثل زمان، مکان یا شخص مقابل، هماهنگ شده‌اند می‌توانیم از [[am/is/are + verb-ing]] برای آینده استفاده کنیم. معمولاً از متن یا قید زمان می‌فهمیم منظور آینده است. [[going to]] بیشتر بر قصد تأکید می‌کند و حال استمراری بر ترتیبات انجام‌شده؛ گاهی هر دو درست‌اند. برای رویدادهای ثابت مثل حرکت قطار، حال ساده هم کاربرد دارد.\nمثال‌ها: [[I’m meeting my teacher at four tomorrow.]] (فردا ساعت چهار با معلمم قرار دارم)؛ [[We’re having dinner with Ali on Friday.]] (جمعه قرار است با علی شام بخوریم)؛ [[She’s flying to Berlin next week.]] (هفتهٔ آینده بلیت پرواز برلین دارد)؛ [[Are you working on Saturday?]] (شنبه سر کار هستی؟)؛ [[They aren’t coming tonight.]] (آن‌ها امشب نمی‌آیند)؛ [[I’m going to learn Python this year.]] (قصد دارم امسال پایتون یاد بگیرم)؛ [[The train leaves at eight.]] (قطار طبق برنامه ساعت هشت حرکت می‌کند)؛ [[We’re meeting at the station at seven.]] (قرارمان ساعت هفت در ایستگاه است)."},{"type":"tip","body":"برای پرسیدن برنامهٔ طرف مقابل، [[What are you doing this weekend?]] معمولاً طبیعی‌تر از سؤال خشک [[What will you do this weekend?]] است. اما برای پیشنهاد ناگهانی، [[I’ll help you.]] روان‌تر است."},{"type":"grammar","title":"افعال وجهی در برنامه‌ها: must، have to، should، might","body":"برنامه فقط «قرار است» نیست؛ گاهی باید الزام، توصیه یا احتمال را هم بیان کنی. [[must]] و [[have to]] الزام را نشان می‌دهند، [[should]] توصیه را و [[might]] احتمال را. تفاوت مهم: [[don’t have to]] یعنی «لازم نیست»، ولی [[mustn’t]] یعنی «ممنوع است». بعد از must / should / might فعل ساده می‌آید؛ پس [[must to go]] غلط است.\nمثال‌ها: [[I have to finish my homework tonight.]] (باید تکلیفم را امشب تمام کنم)؛ [[You must bring your ID.]] (حتماً باید کارت شناسایی بیاوری)؛ [[You should take an umbrella.]] (بهتر است چتر ببری)؛ [[I might stay home on Sunday.]] (شاید یکشنبه خانه بمانم)؛ [[You don’t have to wake up early.]] (لازم نیست زود بیدار شوی)؛ [[You mustn’t park here.]] (اینجا پارک کردن ممنوع است)؛ [[Should we book a table?]] (بهتر است میز رزرو کنیم؟)؛ [[He might be late because of traffic.]] (شاید به خاطر ترافیک دیر کند)."},{"type":"mistakes","items":[{"wrong":"I will to call you tomorrow.","right":"I will call you tomorrow.","fa":"پس از will و دیگر فعل‌های وجهی، فعل اصلی بدون to می‌آید."},{"wrong":"You mustn't come early if you're tired.","right":"You don't have to come early if you're tired.","fa":"برای «لازم نیست»، don’t have to درست است؛ mustn’t یعنی «نباید/ممنوع است»."}]},{"type":"tip","body":"در جملهٔ [[I’m meeting Sara on Sunday.]]، فعل حال استمراری است ولی معنی‌اش آینده است. وجود [[on Sunday]] و هماهنگی قبلی به شنونده کمک می‌کند زمان را بفهمد."},{"type":"text","de":"Next week is going to be busy, but I think it will be interesting. On Monday morning, I'm meeting my teacher at the library. We are going to talk about my English exam and make a study plan. On Tuesday, I have to work until five, so I can't join my friends for dinner. I'm visiting my brother on Wednesday evening. He has a broken phone, and I'm going to help him choose a new one. On Thursday, Sara and I are meeting at a cafe to practise speaking English. We should prepare some questions before we go. Friday is different: I don't have any appointments, but I might stay home and read. On Saturday, we're taking a train to another city. We've already bought the tickets, and the train leaves at eight in the morning. My brother says the weather will be sunny. I'm not so sure. Look at those dark clouds! It might rain, so we'll take our umbrellas. On Sunday, I'm going to rest. If I'm tired, I won't make any new plans. I must sleep well before another busy week starts.","fa":"هفتهٔ آینده قرار است شلوغ باشد، اما فکر می‌کنم جالب هم باشد. دوشنبه صبح در کتابخانه با معلمم قرار دارم تا دربارهٔ امتحان انگلیسی‌ام حرف بزنیم و برنامهٔ مطالعه بچینیم. سه‌شنبه باید تا ساعت پنج کار کنم و نمی‌توانم با دوستانم شام بخورم. چهارشنبه عصر به برادرم سر می‌زنم؛ گوشی‌اش خراب شده و می‌خواهم کمکش کنم گوشی تازه‌ای انتخاب کند. پنجشنبه با سارا در کافه قرار داریم که مکالمهٔ انگلیسی تمرین کنیم. بهتر است قبلش چند سؤال آماده کنیم. جمعه هیچ قراری ندارم، شاید خانه بمانم و کتاب بخوانم. شنبه با قطار به شهر دیگری می‌رویم؛ بلیت‌ها را قبلاً خریده‌ایم و قطار ساعت هشت صبح حرکت می‌کند. برادرم می‌گوید هوا آفتابی خواهد بود. من مطمئن نیستم؛ آن ابرهای تیره را ببین! شاید باران ببارد، پس چتر می‌بریم. یکشنبه می‌خواهم استراحت کنم. اگر خسته باشم، برنامهٔ جدیدی نمی‌گذارم. باید قبل از شروع هفتهٔ شلوغ بعدی خوب بخوابم."}],"exercises":[{"type":"mc","q":"گوشی زنگ می‌خورد و همین لحظه تصمیم می‌گیری جواب بدهی. کدام طبیعی‌تر است؟","options":["I'll answer it.","I'm answering it yesterday.","I answer it last week."],"answer":0,"why":"تصمیم آنی را معمولاً با [[will]] نشان می‌دهیم."},{"type":"blank","text":"Look at those clouds! It ___ rain.","answer":"is going to","hint":"پیش‌بینی براساس شواهد فعلی."},{"type":"type","q":"به انگلیسی بنویس: «فردا با معلمم قرار دارم.»","answer":"I'm meeting my teacher tomorrow","accept":["I am meeting my teacher tomorrow"]},{"type":"mc","q":"کدام جمله یعنی «لازم نیست زود بیایی»؟","options":["You mustn't come early.","You don't have to come early.","You can't come early."],"answer":1,"why":"[[don’t have to]] عدم ضرورت است؛ [[mustn’t]] ممنوعیت."},{"type":"blank","text":"I ___ help you with those bags.","answer":"will","hint":"پیشنهاد کمک در لحظه."},{"type":"type","q":"به انگلیسی بنویس: «قرار است شنبه به والدینم سر بزنم.»","answer":"I'm visiting my parents on Saturday","accept":["I am visiting my parents on Saturday","I'm going to visit my parents on Saturday","I am going to visit my parents on Saturday"]},{"type":"mc","q":"برای حرکت قطار طبق جدول رسمی کدام گزینه معمول‌تر است؟","options":["The train leaves at eight.","The train leaving at eight yesterday.","The train will to leave at eight."],"answer":0,"why":"رویدادهای زمان‌بندی‌شده مثل حرکت قطار را اغلب با حال ساده بیان می‌کنیم."},{"type":"blank","text":"You ___ take an umbrella; it might rain.","answer":"should","hint":"توصیه با should."},{"type":"type","q":"به انگلیسی بنویس: «فکر می‌کنم فردا باران ببارد.»","answer":"I think it will rain tomorrow","accept":["I think it'll rain tomorrow"]},{"type":"mc","q":"کدام جمله دربارهٔ یک برنامهٔ از پیش هماهنگ‌شده است؟","options":["I'm meeting Sara at six tonight.","I met Sara last night.","I will to meet Sara."],"answer":0,"why":"[[present continuous]] همراه زمان آینده می‌تواند قرار قطعی را بیان کند."},{"type":"blank","text":"She ___ going to buy a laptop next month.","answer":"is","hint":"فاعل she در going to به is نیاز دارد."},{"type":"type","q":"به انگلیسی بنویس: «شاید یکشنبه خانه بمانم.»","answer":"I might stay home on Sunday","accept":["I might stay at home on Sunday"]}],"glossary":{"a":"یک","about":"درباره","already":"قبلاً","and":"و","another":"دیگری","any":"هیچ / هر","appointment":"قرار ملاقات / وقت مشخص","appointments":"قرارها","are":"هستی / هستیم","around":"حدوداً","arrange":"هماهنگ کردن","arrangement":"هماهنگی قبلی","at":"در / ساعت","available":"در دسترس / وقت‌دار","be":"بودن","before":"قبل از","bought":"خریده‌ایم","break":"استراحت","bring":"آوردن","broken":"خراب","brother":"برادر","busy":"شلوغ","but":"اما","cafe":"کافه","can":"توانستن","can't":"نمی‌توانم","charge":"شارژ کردن","check":"بررسی کردن","choose":"انتخاب کردن","city":"شهر","clouds":"ابرها","coffee":"قهوه","come":"آمدن","dark":"تیره","decide":"تصمیم گرفتن","definitely":"قطعاً","different":"متفاوت","dinner":"شام","doing":"انجام می‌دهی","don't":"نکن / نمی‌کنند","early":"زود","eight":"هشت","eleven":"یازده","english":"انگلیسی","evening":"عصر","evidence":"شواهد","exam":"امتحان","five":"پنج","for":"برای","forecast":"پیش‌بینی هوا","free":"آزاد / وقت‌داشتن","friday":"جمعه","friends":"دوستان","go":"رفتن","going":"می‌روم","great":"عالی","has":"دارد","have":"داشتن","he":"او (مرد)","help":"کمک کردن","him":"او را / به او","home":"خانه","i":"من","i'll":"من ... خواهم","i'm":"من هستم / قرار است","if":"اگر","in":"در","interesting":"جالب","is":"است","it":"آن","it's":"آن هست / قرار است","join":"ملحق شدن","leaves":"حرکت می‌کند / ترک می‌کند","library":"کتابخانه","look":"نگاه کردن","make":"ساختن / ترتیب دادن","meet":"ملاقات کردن","meeting":"ملاقات کردن","might":"شاید","mina":"مینا (اسم)","monday":"دوشنبه","morning":"صبح","must":"باید","my":"مال من","new":"جدید","next":"آینده","no":"نه","not":"نه / منفی","oh":"آه / آها","on":"در (روز)","one":"یکی","our":"مال ما","parents":"والدین","perfect":"عالی / بی‌نقص","phone":"تلفن","plan":"برنامه","planned":"برنامه‌ریزی کرده‌ایم","plans":"برنامه‌ها","practise":"تمرین کردن","predict":"پیش‌بینی کردن","prepare":"آماده کردن","probably":"احتمالاً","problem":"مشکل","promise":"قول دادن","questions":"سؤال‌ها","rain":"باریدن باران","read":"خواندن","rest":"استراحت کردن","right":"درست","sara":"سارا (اسم)","saturday":"شنبه","says":"می‌گوید","schedule":"برنامهٔ زمانی","see":"دیدن","short":"کوتاه","should":"بهتر است","sleep":"خوابیدن","so":"این‌قدر / پس","some":"مقداری","sounds":"به نظر می‌آید","speaking":"صحبت کردن","starts":"شروع می‌شود","stay":"ماندن","study":"مطالعه کردن","sunday":"یکشنبه","sunny":"آفتابی","sure":"مطمئن","take":"برداشتن / همراه بردن","taking":"با وسیله‌ای رفتن / گرفتن","talk":"حرف زدن","teacher":"معلم","ten":"ده","thanks":"ممنون","that":"آن / که","the":"حرف تعریف معین","then":"آن‌وقت / سپس","think":"فکر کردن","this":"این","those":"آن‌ها / آن","thursday":"پنجشنبه","tickets":"بلیت‌ها","tired":"خسته","to":"به / برای","together":"با هم","tomorrow":"فردا","tonight":"امشب","train":"قطار","tuesday":"سه‌شنبه","umbrella":"چتر","umbrellas":"چترها","until":"تا","useful":"مفید","visit":"دیدن / سر زدن","visiting":"سر زدن","we":"ما","we'll":"ما خواهیم","we're":"ما هستیم","we've":"ما ... کرده‌ایم","weather":"آب‌وهوا","wednesday":"چهارشنبه","week":"هفته","weekdays":"روزهای کاری هفته","weekend":"آخر هفته","well":"خوب","what":"چه","will":"خواهد / فعل آینده","won't":"نخواهد","work":"کار کردن","worry":"نگران شدن","yes":"بله","you":"تو","you're":"تو هستی"}},{"id":"en05","order":5,"level":"B1","minutes":18,"title":"ربط دادن ایده‌ها","titleEn":"Connecting Ideas","blocks":[{"type":"dialog","lines":[{"de":"Have you ever taken an online English course?","fa":"تا حالا دورهٔ آنلاین انگلیسی گذروندی؟"},{"de":"Yes, I have. I started one last autumn.","fa":"آره. پاییز پارسال یکی رو شروع کردم."},{"de":"How long have you been learning English?","fa":"چند وقته داری انگلیسی یاد می‌گیری؟"},{"de":"I've studied it for two years, but I'm still shy when I speak.","fa":"دو ساله می‌خونم، ولی هنوز موقع حرف زدن خجالت می‌کشم."},{"de":"I know a teacher who gives free conversation lessons.","fa":"معلمی رو می‌شناسم که کلاس مکالمهٔ رایگان می‌ذاره."},{"de":"Really? Has she taught you before?","fa":"جدی؟ قبلاً بهت درس داده؟"},{"de":"Yes, she has. I met her at a workshop in April.","fa":"آره. آوریل توی یک کارگاه دیدمش."},{"de":"I've never joined a workshop. Was it useful?","fa":"من تا حالا توی کارگاه شرکت نکردم. به دردت خورد؟"},{"de":"Definitely. Although it was short, I learned a lot.","fa":"قطعاً. با اینکه کوتاه بود، خیلی چیز یاد گرفتم."},{"de":"Have you finished the book which she recommended?","fa":"کتابی رو که پیشنهاد کرده بود تموم کردی؟"},{"de":"Not yet. I've already read six chapters, though.","fa":"هنوز نه. البته شش فصلش رو قبلاً خوندم."},{"de":"I've just bought the same book. Maybe we can practise together.","fa":"من تازه همون کتاب رو خریدم. شاید بتونیم با هم تمرین کنیم."},{"de":"That sounds great! We can meet after class if you're free.","fa":"عالیه! اگه وقت داری می‌تونیم بعد کلاس همدیگه رو ببینیم."},{"de":"Perfect. Let's start tomorrow, since we both have time.","fa":"عالی. چون هردومون وقت داریم، از فردا شروع کنیم."}]},{"type":"vocab","items":[{"de":"present perfect","fa":"حال کامل","note":"have/has + past participle؛ زمان دقیقِ تمام‌شده ذکر نمی‌شود."},{"de":"experience","fa":"تجربه","note":"Have you ever...? برای سؤال دربارهٔ تجربهٔ زندگی."},{"de":"ever","fa":"تا حالا","note":"اغلب در سؤال یا جملهٔ شرطی؛ نه محدود به سؤال."},{"de":"never","fa":"هرگز","note":"معنی منفی دارد: I have never been there."},{"de":"already","fa":"قبلاً / همین حالا","note":"معمولاً قبل از قسمت سوم فعل: I have already eaten."},{"de":"just","fa":"همین تازگی","note":"I have just arrived؛ در انگلیسی آمریکایی گذشتهٔ ساده هم رایج است."},{"de":"yet","fa":"هنوز / تا حالا","note":"عموماً در جملهٔ منفی و سؤال: not yet."},{"de":"recently","fa":"اخیراً","note":"I have recently started a course."},{"de":"since","fa":"از زمانی که / چون","note":"نقطهٔ شروع: since 2024؛ همچنین «چون» در متن."},{"de":"for","fa":"به مدت","note":"بازهٔ زمان: for two years."},{"de":"although","fa":"اگرچه","note":"بعدش جملهٔ کامل می‌آید: although I was tired."},{"de":"however","fa":"بااین‌حال","note":"اغلب دو جمله را با نشانه‌گذاری به هم مرتبط می‌کند."},{"de":"because","fa":"زیرا / چون","note":"علت: because I was ill."},{"de":"therefore","fa":"بنابراین","note":"رسمی‌تر از so؛ بین دو جمله با علامت‌گذاری مناسب."},{"de":"while","fa":"در حالی که","note":"هم‌زمانی یا تضاد: while I was reading."},{"de":"whereas","fa":"درحالی‌که (تضاد)","note":"I like tea, whereas she likes coffee."},{"de":"who","fa":"که (برای شخص)","note":"the teacher who helped me؛ در جملهٔ موصولی."},{"de":"which","fa":"که (برای چیز)","note":"the book which I read."},{"de":"that","fa":"که","note":"در موصولیِ تعیین‌کننده می‌تواند برای اشخاص/اشیا به کار رود."},{"de":"whose","fa":"که ... او / مالکیت","note":"the girl whose bag is blue."},{"de":"to recommend","fa":"توصیه کردن","note":"recommend a book؛ recommend doing something."},{"de":"to improve","fa":"بهتر کردن / پیشرفت دادن","note":"improve my speaking."},{"de":"to attend","fa":"شرکت کردن / حضور داشتن","note":"attend a workshop؛ بدون to."},{"de":"workshop","fa":"کارگاه آموزشی","note":"a writing workshop."},{"de":"chapter","fa":"فصل کتاب","note":"chapter six یعنی فصل ششم."},{"de":"achievement","fa":"دستاورد","note":"an important achievement."},{"de":"to give up","fa":"تسلیم شدن","note":"never give up؛ فعل عبارتی."},{"de":"on the other hand","fa":"از سوی دیگر","note":"برای آوردن دیدگاه متضاد در نوشته."}]},{"type":"grammar","title":"Present Perfect در برابر Past Simple","body":"ساختار حال کامل [[have/has + past participle]] است و معمولاً تجربه، نتیجهٔ فعلی یا دورهٔ زمانی ادامه‌دار تا اکنون را نشان می‌دهد. وقتی زمانِ مشخص و تمام‌شده را بیان می‌کنی، معمولاً [[Past Simple]] لازم است؛ برعکس، [[since]] و [[for]] می‌توانند به وضعیتِ ادامه‌دار اشاره کنند. در آلمانی [[Perfekt]] اغلب روایتِ معمول گذشته است، ولی کاربرد انگلیسی با آن یکی نیست.\nمثال‌ها: [[I have visited London twice.]] (تا حالا دو بار لندن رفته‌ام)؛ [[I visited London in 2022.]] (سال ۲۰۲۲ لندن رفتم)؛ [[She has lost her keys.]] (کلیدهایش را گم کرده و هنوز پیدا نکرده)؛ [[She lost her keys yesterday.]] (دیروز کلیدهایش را گم کرد)؛ [[We have known each other for years.]] (سال‌هاست همدیگر را می‌شناسیم)؛ [[He has lived here since 2020.]] (از ۲۰۲۰ اینجا زندگی می‌کند)؛ [[Have you ever tried this app?]] (تا حالا این برنامه را امتحان کرده‌ای؟)؛ [[When did you try it?]] (چه زمانی امتحانش کردی؟)."},{"type":"tip","body":"[[for]] مدت را بیان می‌کند: [[for three months]] (سه ماه)؛ [[since]] نقطهٔ آغاز را: [[since January]] (از ژانویه). جملهٔ [[I have lived here since last year.]] یعنی هنوز هم اینجا زندگی می‌کنم."},{"type":"grammar","title":"ever، never، just، already و yet","body":"این قیدها به زمان و رابطهٔ رویداد با اکنون معنی دقیق‌تری می‌دهند. [[ever]] برای «در هر زمانی تا حالا» در پرسش‌ها و برخی جمله‌های شرطی است؛ [[never]] خودش بار منفی دارد. [[just]] تازگی، [[already]] انجام‌شدن زودتر از انتظار یا پیش‌تر و [[yet]] انتظارِ انجام کاری را نشان می‌دهد. در انگلیسی بریتانیایی این‌ها اغلب با Present Perfect می‌آیند؛ در آمریکایی گذشتهٔ ساده نیز در بعضی موقعیت‌ها طبیعی است.\nمثال‌ها: [[Have you ever met her?]] (تا حالا او را دیده‌ای؟)؛ [[I have never eaten sushi.]] (هیچ‌وقت سوشی نخورده‌ام)؛ [[We have just arrived.]] (تازه رسیده‌ایم)؛ [[She has already sent the email.]] (او ایمیل را قبلاً فرستاده)؛ [[I haven’t finished yet.]] (هنوز تمام نکرده‌ام)؛ [[Have you read the book yet?]] (هنوز کتاب را خوانده‌ای؟)؛ [[If you have ever felt nervous, you understand.]] (اگر تا حالا مضطرب شده باشی، می‌فهمی)؛ [[They have recently moved here.]] (اخیراً به اینجا نقل‌مکان کرده‌اند)."},{"type":"tip","body":"بعد از [[although]] جملهٔ کامل می‌آید و معمولاً در همان جمله [[but]] نمی‌آوریم: [[Although I was tired, I studied.]] درست است، نه [[Although I was tired, but I studied.]]."},{"type":"grammar","title":"ربط‌دهنده‌ها: تضاد، علت، نتیجه و زمان","body":"برای متنِ منسجم از ربط‌دهنده‌ها استفاده کن: [[although]] تضادِ برخلاف انتظار، [[because]] علت، [[so]] پیامد، [[while / whereas]] هم‌زمانی یا تضاد و [[however / therefore]] پیوند بین جمله‌ها را می‌سازند. [[however]] معمولاً بعد از نقطه یا نقطه‌ویرگول می‌آید و با ویرگول از ادامه جدا می‌شود؛ با but از نظر نشانه‌گذاری یکسان نیست.\nمثال‌ها: [[Although I was tired, I finished the task.]] (با اینکه خسته بودم، کار را تمام کردم)؛ [[I stayed home because I was ill.]] (چون بیمار بودم خانه ماندم)؛ [[It was raining, so we took a taxi.]] (باران می‌بارید، پس تاکسی گرفتیم)؛ [[I enjoy reading while my brother prefers films.]] (من خواندن را دوست دارم، درحالی‌که برادرم فیلم را ترجیح می‌دهد)؛ [[She likes cities, whereas I prefer nature.]] (او شهرها را دوست دارد، اما من طبیعت را ترجیح می‌دهم)؛ [[The course was difficult. However, it was useful.]] (دوره سخت بود؛ بااین‌حال مفید بود)؛ [[I missed the bus. Therefore, I was late.]] (اتوبوس را از دست دادم؛ بنابراین دیر رسیدم)؛ [[Since we have time, let’s practise.]] (چون وقت داریم، تمرین کنیم)."},{"type":"mistakes","items":[{"wrong":"I have seen him yesterday.","right":"I saw him yesterday.","fa":"با زمانِ مشخص و تمام‌شده مثل yesterday، معمولاً Past Simple لازم است."},{"wrong":"Although I was tired, but I went.","right":"Although I was tired, I went.","fa":"although خودش رابطهٔ تضاد را می‌سازد؛ but اضافی است."}]},{"type":"grammar","title":"جملهٔ موصولی: who، which، that و whose","body":"جملهٔ موصولی اطلاعاتی دربارهٔ اسم پیش از خود اضافه می‌کند. در جملهٔ تعیین‌کننده (اطلاعات لازم)، [[who]] برای اشخاص، [[which]] برای چیزها، [[that]] برای هر دو و [[whose]] برای مالکیت به کار می‌روند. در جملهٔ توضیحیِ غیرضروری از کاما استفاده می‌کنیم و [[that]] به جای who/which نمی‌آید. اگر ضمیر موصولی «مفعول» باشد، در جملهٔ تعیین‌کننده گاهی می‌توان آن را حذف کرد.\nمثال‌ها: [[The teacher who helped me is kind.]] (معلمی که کمکم کرد مهربان است)؛ [[The book which I bought is useful.]] (کتابی که خریدم مفید است)؛ [[The book that I bought is useful.]] (همان جمله با that)؛ [[The book I bought is useful.]] (همان جمله با ضمیر موصولیِ حذف‌شده)؛ [[The student whose bag is blue is here.]] (دانشجویی که کیفش آبی است اینجاست)؛ [[Sara, who lives nearby, is my friend.]] (سارا که این نزدیکی زندگی می‌کند دوست من است)؛ [[My phone, which is old, still works.]] (گوشی‌ام که قدیمی است هنوز کار می‌کند)؛ [[This is the class that changed my life.]] (این همان کلاسی است که زندگی‌ام را تغییر داد)."},{"type":"tip","body":"برای متن نوشتاری، یک الگوی سادهٔ قابل‌استفاده این است: ادعا + دلیل + تضاد. مثلاً [[I enjoy learning English because it helps me communicate. However, I still need more practice.]] (یادگیری انگلیسی را دوست دارم چون کمکم می‌کند ارتباط برقرار کنم؛ بااین‌حال هنوز تمرین بیشتری لازم دارم)."},{"type":"text","de":"I have studied English for almost three years, but I haven't always enjoyed speaking it. Last year, I joined a language workshop that changed my attitude. Our teacher, who had lived in several countries, asked us to speak in small groups. I was nervous because I thought everyone would notice my mistakes. However, the other students were friendly, and nobody laughed at me. Since that first workshop, I have attended a conversation group every Thursday. I have already made two good friends there, and I've just started reading a novel in English. The novel, which a classmate recommended, is difficult but interesting. Although I don't understand every word, I can follow the story. I haven't finished it yet, whereas my friend Sara has already read it twice. She is the student whose notes always help me. We sometimes talk about a chapter while we walk home. I used to avoid speaking, but now I ask questions when I don't understand something. I have never been completely confident, yet I have improved a lot. Next month, we're giving a short presentation together. I'm still a little worried; nevertheless, I want to try, because progress matters more than perfection.","fa":"نزدیک سه سال است انگلیسی می‌خوانم، اما همیشه از حرف زدن به این زبان لذت نبرده‌ام. پارسال در کارگاه زبانی شرکت کردم که نگرشم را تغییر داد. معلممان که در چند کشور زندگی کرده بود، از ما خواست در گروه‌های کوچک صحبت کنیم. مضطرب بودم، چون فکر می‌کردم همه اشتباه‌هایم را می‌بینند. بااین‌حال دانشجوهای دیگر مهربان بودند و کسی به من نخندید. از آن کارگاه به بعد، هر پنجشنبه در گروه مکالمه شرکت کرده‌ام. دو دوست خوب پیدا کرده‌ام و تازه شروع به خواندن رمانی انگلیسی کرده‌ام. این رمان که هم‌کلاسی‌ام پیشنهاد داده، سخت ولی جذاب است. با اینکه تک‌تک کلمات را نمی‌فهمم، داستان را دنبال می‌کنم. هنوز تمامش نکرده‌ام، درحالی‌که دوستم سارا دو بار خوانده است. او همان دانشجویی است که یادداشت‌هایش همیشه کمکم می‌کند. گاهی در راه خانه دربارهٔ یک فصل حرف می‌زنیم. قبلاً از صحبت کردن فرار می‌کردم، ولی حالا وقتی چیزی را نمی‌فهمم سؤال می‌پرسم. هنوز کاملاً مطمئن نیستم، اما خیلی پیشرفت کرده‌ام. ماه آینده با هم ارائهٔ کوتاهی داریم. هنوز کمی نگرانم؛ بااین‌حال می‌خواهم امتحان کنم، چون پیشرفت از بی‌نقص‌بودن مهم‌تر است."}],"exercises":[{"type":"mc","q":"برای بیان سفر در سال مشخص ۲۰۲۲ کدام درست است؟","options":["I have visited London in 2022.","I visited London in 2022.","I have visit London in 2022."],"answer":1,"why":"وقتی زمان تمام‌شده و مشخص است، [[Past Simple]] می‌آید."},{"type":"blank","text":"She has lived here ___ 2020.","answer":"since","hint":"نقطهٔ شروع با since."},{"type":"type","q":"به انگلیسی بنویس: «سه سال است اینجا زندگی می‌کنم.»","answer":"I have lived here for three years","accept":["I've lived here for three years","I have been living here for three years","I've been living here for three years"]},{"type":"mc","q":"جملهٔ درست را انتخاب کن.","options":["Although it was raining, but we went out.","Although it was raining, we went out.","Although raining, but we went out."],"answer":1,"why":"[[although]] با but در همان ساختار ترکیب نمی‌شود."},{"type":"blank","text":"Have you ___ been to London?","answer":"ever","hint":"سؤال دربارهٔ تجربه با ever."},{"type":"type","q":"به انگلیسی بنویس: «من هنوز این کتاب را تمام نکرده‌ام.»","answer":"I haven't finished this book yet","accept":["I have not finished this book yet"]},{"type":"mc","q":"کدام ضمیر موصولی مالکیت را نشان می‌دهد؟","options":["who","whose","whereas"],"answer":1,"why":"[[whose]] مالکیت را در جملهٔ موصولی نشان می‌دهد."},{"type":"blank","text":"This is the book ___ I bought last week.","answer":"that","hint":"ضمیر موصولیِ تعیین‌کننده؛ which هم ممکن است.","accept":["which"]},{"type":"type","q":"به انگلیسی بنویس: «با اینکه خسته بودم، درس خواندم.»","answer":"Although I was tired, I studied","accept":["I studied although I was tired"]},{"type":"mc","q":"کدام نشانه‌گذاری برای however درست است؟","options":["The course was hard. However, it was useful.","The course was hard, however it was useful.","The course was hard however it was useful."],"answer":0,"why":"[[however]] بین دو جملهٔ مستقل معمولاً با نقطه یا نقطه‌ویرگول جدا می‌شود."},{"type":"blank","text":"She has ___ sent the email, so you don't need to remind her.","answer":"already","hint":"قید already پیش از قسمت سوم فعل."},{"type":"type","q":"به انگلیسی بنویس: «این معلمی است که به من کمک کرد.»","answer":"This is the teacher who helped me","accept":["This is the teacher that helped me"]}],"glossary":{"a":"یک","about":"دربارهٔ","achievement":"دستاورد","after":"بعد از","almost":"تقریباً","already":"قبلاً","although":"اگرچه","always":"همیشه","an":"یک","and":"و","april":"آوریل","ask":"پرسیدن","asked":"درخواست کرد","at":"در","attend":"شرکت کردن","attended":"شرکت کرده‌ام","attitude":"نگرش","autumn":"پاییز","avoid":"دوری کردن","because":"چون","been":"بوده / در حال","before":"قبلاً","book":"کتاب","both":"هر دو","bought":"خریدم","but":"اما","can":"توانستن","changed":"تغییر داد","chapter":"فصل کتاب","chapters":"فصل‌ها","class":"کلاس","classmate":"هم‌کلاسی","completely":"کاملاً","confident":"بااعتمادبه‌نفس","conversation":"مکالمه","countries":"کشورها","course":"دوره","definitely":"قطعاً","difficult":"دشوار","don't":"نمی‌کنم","english":"زبان انگلیسی","enjoyed":"لذت برده‌ام","ever":"تا حالا","every":"هر","everyone":"همه","experience":"تجربه","finished":"تمام کرده‌ام","first":"اول","follow":"دنبال کردن","for":"به مدت / برای","free":"رایگان","friend":"دوست","friendly":"دوستانه","friends":"دوستان","give":"دادن","gives":"می‌دهد","giving":"ارائه دادن","good":"خوب","great":"عالی","group":"گروه","groups":"گروه‌ها","had":"داشت / فعل کمکی","hand":"دست (در on the other hand: از سوی دیگر)","has":"دارد / فعل کمکی","have":"داشتن / فعل کمکی","haven't":"نکرده‌ام / هنوز نکرده‌ام","help":"کمک کردن","her":"مال او / او را","home":"خانه","how":"چقدر","however":"بااین‌حال","i":"من","i'm":"من هستم","i've":"من ... کرده‌ام","if":"اگر","improve":"بهبود دادن","improved":"پیشرفت کرده‌ام","in":"در","interesting":"جالب","is":"است","it":"آن","joined":"شرکت کردم","just":"تازه","know":"شناختن / دانستن","language":"زبان","last":"گذشته","laughed":"خندید","learned":"یاد گرفتم","learning":"یاد گرفتن","lessons":"درس‌ها","let's":"بیا / بیایید","little":"کمی / کوچک","lived":"زندگی کرده","long":"مدت","lot":"زیاد","made":"ساخته‌ام / پیدا کرده‌ام","matters":"اهمیت دارد","maybe":"شاید","me":"من را / به من","meet":"دیدن / ملاقات کردن","met":"ملاقات کردم","mistakes":"اشتباه‌ها","month":"ماه","more":"بیشتر","my":"مال من","nervous":"مضطرب","never":"هرگز","nevertheless":"بااین‌حال","next":"بعدی / آینده","nobody":"هیچ‌کس","not":"نه","notes":"یادداشت‌ها","notice":"متوجه شدن","novel":"رمان","now":"حالا","on":"در","one":"یکی","online":"آنلاین","other":"دیگر","our":"مال ما","perfect":"کامل / بی‌نقص","perfection":"بی‌نقصی","practise":"تمرین کردن","present":"حال / حاضر","presentation":"ارائه","progress":"پیشرفت","questions":"سؤال‌ها","read":"خوانده / خواندن","reading":"خواندن","really":"واقعاً","recently":"اخیراً","recommend":"توصیه کردن","recommended":"توصیه کرد","same":"یکسان / همان","sara":"سارا (اسم)","several":"چند","she":"او (زن)","short":"کوتاه","shy":"خجالتی","since":"از زمانِ / چون","six":"شش","small":"کوچک","something":"چیزی","sometimes":"گاهی","sounds":"به نظر می‌رسد","speak":"صحبت کردن","speaking":"صحبت کردن","start":"شروع کردن","started":"شروع کردم","still":"هنوز","story":"داستان","student":"دانشجو","students":"دانشجوها","studied":"درس خوانده‌ام","taken":"گذراندن / گرفته","talk":"حرف زدن","taught":"درس داده","teacher":"معلم","than":"از (مقایسه)","that":"که","the":"حرف تعریف معین","there":"آنجا","therefore":"بنابراین","though":"البته / با این حال","thought":"فکر کردم","three":"سه","thursday":"پنجشنبه","time":"زمان","to":"به / برای","together":"با هم","tomorrow":"فردا","try":"امتحان کردن","twice":"دو بار","two":"دو","understand":"فهمیدن","up":"بالا / کنار","us":"از ما / ما را","used":"عادت داشتم","useful":"مفید","walk":"راه رفتن","want":"خواستن","was":"بود","we":"ما","we're":"ما هستیم / قرار است","were":"بودند","when":"وقتی","whereas":"درحالی‌که (برای تضاد)","which":"که (برای چیز)","while":"درحالی‌که","who":"که (برای شخص)","whose":"که ... او","word":"کلمه","workshop":"کارگاه","worried":"نگران","would":"می‌شد","year":"سال","years":"سال‌ها","yes":"بله","yet":"هنوز / بااین‌حال","you":"تو","you're":"تو هستی"}},{"id":"en06","order":6,"level":"B1","minutes":20,"title":"فعل‌های عبارتی","titleEn":"Phrasal Verbs","blocks":[{"type":"dialog","lines":[{"de":"Hey, did you find out what time the workshop starts?","fa":"هی، فهمیدی کارگاه چه ساعتی شروع می‌شه؟"},{"de":"Yes, it starts at nine. Can you pick me up at eight?","fa":"آره، ساعت نُه. می‌تونی ساعت هشت بیای دنبالم؟"},{"de":"Sure. Just don't forget to get up early!","fa":"حتماً. فقط یادت نره زود بیدار شی!"},{"de":"I won't. I need to look up a few words first.","fa":"یادم نمی‌ره. فقط اول باید چند کلمه رو توی فرهنگ لغت پیدا کنم."},{"de":"Why don't you write them down?","fa":"چرا یادداشتشون نمی‌کنی؟"},{"de":"Good idea. I ran into Amir yesterday, by the way.","fa":"فکر خوبیه. راستی دیروز اتفاقی امیر رو دیدم."},{"de":"Really? How is he getting on with his project?","fa":"واقعاً؟ پروژه‌اش چطور پیش می‌ره؟"},{"de":"Not well. His computer broke down again.","fa":"خوب نیست. کامپیوترش دوباره خراب شده."},{"de":"Oh no! Did he give up?","fa":"وای نه! بی‌خیال پروژه شد؟"},{"de":"No. He put off his presentation until next week.","fa":"نه. ارائه‌اش رو تا هفتهٔ بعد عقب انداخت."},{"de":"That makes sense. We shouldn't let problems get us down.","fa":"منطقیه. نباید بذاریم مشکل‌ها دلسردمون کنن."},{"de":"Exactly. Let's carry on and finish our own work.","fa":"دقیقاً. بیا ادامه بدیم و کار خودمون رو تموم کنیم."},{"de":"Before we leave, please turn off the lights.","fa":"قبل از رفتن لطفاً چراغ‌ها رو خاموش کن."},{"de":"No problem. I'm looking forward to tomorrow!","fa":"حتماً. بی‌صبرانه منتظر فردام!"}]},{"type":"vocab","items":[{"de":"get up","fa":"بیدار شدن / بلند شدن","note":"برای از تخت بلند شدن: get up at seven."},{"de":"look up","fa":"در فرهنگ لغت جست‌وجو کردن","note":"جداشدنی: look it up؛ نه look up it."},{"de":"write down","fa":"یادداشت کردن","note":"جداشدنی: write them down."},{"de":"pick up","fa":"دنبال کسی رفتن / برداشتن","note":"جداشدنی: pick me up."},{"de":"take off","fa":"درآوردن / بلند شدن هواپیما","note":"جداشدنی: take your coat off."},{"de":"put on","fa":"پوشیدن / روشن کردن","note":"جداشدنی: put it on."},{"de":"turn off","fa":"خاموش کردن","note":"جداشدنی: turn the light off."},{"de":"turn on","fa":"روشن کردن","note":"جداشدنی: turn it on."},{"de":"turn down","fa":"کم کردن صدا / رد کردن پیشنهاد","note":"جداشدنی: turn the music down."},{"de":"give up","fa":"تسلیم شدن / کنار گذاشتن","note":"با مفعول جداشدنی است: give it up؛ بدون مفعول: don’t give up."},{"de":"put off","fa":"به تعویق انداختن","note":"جداشدنی: put the exam off."},{"de":"run into","fa":"اتفاقی کسی را دیدن","note":"جدانشدنی در این معنی: run into an old friend."},{"de":"find out","fa":"فهمیدن / کشف کردن","note":"اغلب جداشدنی: find it out؛ یا find out why."},{"de":"break down","fa":"خراب شدن (دستگاه)","note":"در این معنی بدون مفعول: My car broke down."},{"de":"calm down","fa":"آرام شدن / آرام کردن","note":"هم بدون مفعول و هم با مفعول: calm him down."},{"de":"carry on","fa":"ادامه دادن","note":"carry on working؛ در کاربرد با مفعول می‌تواند جداشدنی باشد."},{"de":"look after","fa":"مراقبت کردن از","note":"جدانشدنی: look after the baby."},{"de":"look forward to","fa":"مشتاقِ چیزی بودن","note":"to حرف اضافه است؛ بعدش اسم یا ing: seeing you."},{"de":"run out of","fa":"چیزی را تمام کردن / موجودی نداشتن","note":"جدانشدنی: run out of milk."},{"de":"come back","fa":"برگشتن","note":"با قید زمان: come back later."},{"de":"set up","fa":"راه‌اندازی کردن","note":"جداشدنی: set up a small business."},{"de":"throw away","fa":"دور انداختن","note":"جداشدنی: throw it away."},{"de":"hang out","fa":"وقت گذراندن با دوستان","note":"hang out with friends؛ محاوره‌ای."},{"de":"check in","fa":"ثبت پذیرش کردن","note":"در هتل / پرواز؛ check in online."},{"de":"get on with","fa":"پیش بردن / کنار آمدن با","note":"How are you getting on with your work?"},{"de":"get over","fa":"پشت سر گذاشتن / بهبود یافتن","note":"get over a difficult experience."},{"de":"get someone down","fa":"دلسرد کردن کسی","note":"get me down = من را ناامید کردن."},{"de":"take after","fa":"به خانواده شبیه بودن","note":"She takes after her father؛ جدانشدنی."}]},{"type":"grammar","title":"افعال عبارتی و تفاوتِ جداشدنی / جدانشدنی","body":"Phrasal verb از فعل و یک یا چند جزء مثل [[up]]، [[off]] یا [[into]] تشکیل می‌شود و معنایش همیشه جمع سادهٔ اجزا نیست. در فعلِ متعدیِ جداشدنی، مفعول اسمی می‌تواند وسط یا پس از جزء بیاید؛ ضمیر مفعولی باید وسط قرار بگیرد. افعال جدانشدنی مثل [[run into]] یا [[look after]] اجازهٔ جابه‌جایی ندارند. بعضی افعال مثل [[give up]] بسته به وجود مفعول بدون مفعول یا جداشدنی‌اند؛ پس به جای قانون‌سازی افراطی، الگوی هر فعل را یاد بگیر.\nمثال‌ها: [[Please turn off the light.]] (لطفاً چراغ را خاموش کن)؛ [[Please turn the light off.]] (همان معنا)؛ [[Please turn it off.]] (لطفاً خاموشش کن)؛ [[I ran into my teacher.]] (اتفاقی معلمم را دیدم)؛ [[I ran into her.]] (اتفاقی او را دیدم)؛ [[He gave up smoking.]] (سیگار را کنار گذاشت)؛ [[He gave it up.]] (آن را کنار گذاشت)؛ [[She looks after her sister.]] (او از خواهرش مراقبت می‌کند)."},{"type":"tip","body":"قاعدهٔ ضمیر را با یک جفت جمله حفظ کن: [[Turn the music down.]] و [[Turn it down.]] هر دو درست‌اند؛ اما [[Turn down it.]] غلط است. در مورد [[run into]] این جابه‌جایی را انجام نده."},{"type":"grammar","title":"چند معنایی بودن و کاربرد در موقعیت","body":"یک فعل عبارتی ممکن است چند معنی داشته باشد. [[take off]] هم دربارهٔ لباس است و هم هواپیما؛ [[pick up]] می‌تواند «برداشتن»، «دنبال کسی رفتن» یا «آموختن در روند طبیعی» باشد؛ [[turn down]] هم «کم کردن صدا» است و هم «رد کردن درخواست». معنی را از مفعول و موقعیت حدس بزن.\nمثال‌ها: [[Take off your shoes at the door.]] (دم در کفش‌هایت را دربیاور)؛ [[The plane took off on time.]] (هواپیما سر وقت بلند شد)؛ [[I’ll pick you up at eight.]] (ساعت هشت می‌آیم دنبالت)؛ [[She picked up some Italian in Rome.]] (در رم کمی ایتالیایی یاد گرفت)؛ [[Can you turn down the music?]] (می‌توانی صدا را کم کنی؟)؛ [[He turned down the job offer.]] (پیشنهاد شغلی را رد کرد)؛ [[My car broke down yesterday.]] (ماشینم دیروز خراب شد)؛ [[Please write down the address.]] (لطفاً نشانی را یادداشت کن)."},{"type":"tip","body":"برای [[look forward to]]، واژهٔ [[to]] حرف اضافه است، نه علامت مصدر. بنابراین می‌گوییم [[I look forward to seeing you.]]، نه [[I look forward to see you.]]."},{"type":"grammar","title":"فعل‌های سه‌جزئی و ادامهٔ فعل بعد از آن‌ها","body":"برخی ساختارها سه جزء دارند، مانند [[look forward to]]، [[run out of]] و [[get on with]]. این‌ها را معمولاً نباید مثل فعل‌های دو جزئیِ جداشدنی جابه‌جا کرد. بعد از حرف اضافه معمولاً اسم، ضمیر یا فعلِ ing می‌آید. [[carry on]] و [[give up]] هم اغلب با [[verb-ing]] برای ادامه یا ترک یک فعالیت همراه می‌شوند.\nمثال‌ها: [[I’m looking forward to meeting you.]] (مشتاق دیدنت هستم)؛ [[We ran out of coffee.]] (قهوه‌مان تمام شد)؛ [[How are you getting on with your studies?]] (درس‌هایت چطور پیش می‌رود؟)؛ [[They carried on working after lunch.]] (بعد از ناهار به کار ادامه دادند)؛ [[Don’t give up learning English.]] (یادگیری انگلیسی را کنار نگذار)؛ [[I want to get over this problem.]] (می‌خواهم از پس این مشکل برآیم)؛ [[He takes after his mother.]] (او به مادرش رفته است)؛ [[She is looking after her little brother.]] (از برادر کوچک‌ترش مراقبت می‌کند)."},{"type":"mistakes","items":[{"wrong":"Please turn off it.","right":"Please turn it off.","fa":"در فعل جداشدنی، ضمیر مفعولی بین فعل و جزء قرار می‌گیرد."},{"wrong":"I look forward to see you.","right":"I look forward to seeing you.","fa":"to در این عبارت حرف اضافه است؛ بعد از آن فعل به صورت -ing می‌آید."}]},{"type":"tip","body":"فعل عبارتی را با یک جملهٔ واقعی یاد بگیر، نه فقط برابرِ فارسی آن: [[My phone ran out of battery.]] (شارژ گوشی‌ام تمام شد) و [[My phone broke down.]] (گوشی‌ام خراب شد) دو موقعیت متفاوت‌اند."},{"type":"text","de":"This morning, I got up late because my alarm didn't go off. I put on my clothes quickly, picked up my bag and ran out of the house. At the bus stop, I found out that the bus had broken down. I almost gave up and went home, but then I ran into my friend Amir. He offered to pick me up in his car, so I wrote down his address and waited. While I was waiting, I looked up a few new English words on my phone. Amir arrived ten minutes later. We turned down the music and talked about our projects. He had put off his presentation because his laptop wasn't working, but he was trying to get over the problem. At the college, I took off my jacket and turned on my computer. I discovered that I had left my notes at home. My teacher told me not to worry and encouraged me to carry on. After class, I helped her set up some chairs for a workshop. We ran out of time before finishing everything, but nobody got upset. I was tired by the evening, yet I was looking forward to the next class.","fa":"امروز صبح دیر بیدار شدم، چون زنگ ساعت به صدا درنیامده بود. سریع لباس پوشیدم، کیفم را برداشتم و از خانه بیرون زدم. در ایستگاه فهمیدم اتوبوس خراب شده. نزدیک بود بی‌خیال شوم و برگردم خانه، اما اتفاقی دوستم امیر را دیدم. پیشنهاد داد با ماشین دنبالم بیاید؛ نشانی‌اش را یادداشت کردم و منتظر ماندم. تا آمدنش چند واژهٔ تازهٔ انگلیسی را با گوشی جست‌وجو کردم. ده دقیقه بعد امیر رسید. صدای موسیقی را کم کردیم و دربارهٔ پروژه‌ها حرف زدیم. او ارائه‌اش را عقب انداخته بود، چون لپ‌تاپش کار نمی‌کرد، اما تلاش می‌کرد مشکل را پشت سر بگذارد. در کالج ژاکتم را درآوردم و کامپیوترم را روشن کردم. تازه فهمیدم یادداشت‌هایم را خانه جا گذاشته‌ام. معلم گفت نگران نباشم و تشویقم کرد ادامه بدهم. بعد کلاس کمکش کردم برای کارگاه صندلی‌ها را بچیند. پیش از پایان همهٔ کارها وقتمان تمام شد، اما کسی ناراحت نشد. عصر خسته بودم، ولی مشتاق کلاس بعدی بودم."}],"exercises":[{"type":"mc","q":"کدام جمله از نظر جای ضمیر مفعولی درست است؟","options":["Turn off it.","Turn it off.","Turn it on off."],"answer":1,"why":"در phrasal verb جداشدنی، ضمیر میان فعل و جزء می‌آید."},{"type":"blank","text":"Could you pick me ___ at eight?","answer":"up","hint":"pick someone up = دنبال کسی رفتن."},{"type":"type","q":"به انگلیسی بنویس: «تسلیم نشو!»","answer":"Don't give up","accept":["Do not give up"]},{"type":"mc","q":"کدام جمله معنی «اتفاقی او را دیدم» دارد؟","options":["I ran her into.","I ran into her.","I ran up her."],"answer":1,"why":"[[run into]] در معنی ملاقات اتفاقی جدانشدنی است."},{"type":"blank","text":"I look forward to ___ you.","answer":"seeing","hint":"بعد از حرف اضافهٔ to، فعل ing می‌آید."},{"type":"type","q":"به انگلیسی بنویس: «لطفاً صدای موسیقی را کم کن.»","answer":"Please turn down the music","accept":["Please turn the music down"]},{"type":"mc","q":"[[turn down a job offer]] یعنی چه؟","options":["کم کردن صدای پیشنهاد شغلی","رد کردن پیشنهاد شغلی","خاموش کردن پیشنهاد"],"answer":1,"why":"[[turn down]] علاوه بر کم کردن صدا، معنی «رد کردن» هم دارد."},{"type":"blank","text":"Our car ___ down on the way home.","answer":"broke","hint":"گذشتهٔ break down در معنی خراب شدن."},{"type":"type","q":"به انگلیسی بنویس: «قهوه‌مان تمام شد.»","answer":"We ran out of coffee","accept":["We've run out of coffee","We have run out of coffee"]},{"type":"mc","q":"کدام جمله طبیعی و درست است؟","options":["I look forward to see you.","I look forward to seeing you.","I look forward seeing to you."],"answer":1,"why":"[[to]] در [[look forward to]] حرف اضافه است؛ دیدن = seeing."},{"type":"blank","text":"She ___ up an online shop last year.","answer":"set","hint":"set up = راه‌اندازی کردن؛ set در گذشته هم set است."},{"type":"type","q":"به انگلیسی بنویس: «لطفاً این کلمات را یادداشت کن.»","answer":"Please write down these words","accept":["Please write these words down"]}],"glossary":{"a":"یک","about":"دربارهٔ","addres ffered":"پیشنهاد داد","oh":"اوه","on":"روی / روشن","our":"مال ما","out":"بیرون","over":"غلبه کردن بر / پشت سر گذاشتن","own":"خود","phone":"گوشی","pick":"برداشتن / دنبال رفتن","picked":"برداشت / دنبال رفت","please":"لطفاً","presentation":"ارائه","problem":"مشکل","problems":"مشکلات","project":"پروژه","projects":"پروژه‌ها","put":"گذاشت","quickly":"سریع","ran":"دوید / برخورد","really":"واقعاً","run":"دویدن / برخوردن","sense":"منطق / معنی","set":"چیدن / تنظیم کردن","shouldn't":"نباید","so":"پس","some":"چند / مقداری","someone":"کسی را / یک نفر","starts":"شروع می‌شود","stop":"ایستگاه","sure":"حتماً","take":"برداشتن / درآوردن","talked":"صحبت کردیم","teacher":"معلم","ten":"ده","that":"آن","the":"حرف تعریف معین","them":"آن‌ها را","then":"بعد / سپس","this":"این","throw":"پرت کردن / دور انداختن","time":"زمان","tired":"خسته","to":"به / برای","told":"گفت","tomorrow":"فردا","took":"برداشت / درآورد","trying":"در حال تلاش","turn":"چرخاندن / کم کردن","turned":"چرخاند / کم کرد","until":"تا","up":"بالا / تکمیل","upset":"ناراحت","us":"ما را","waited":"منتظر ماند","waiting":"منتظر بودن","was":"بود","wasn't":"نبود","way":"راه","we":"ما","week":"هفته","well":"خوب","went":"رفت","what":"چه","while":"درحالی‌که","why":"چرا","with":"با","won't":"نخواهم","words":"کلمات","work":"کار","working":"کار کردن","workshop":"کارگاه","worry":"نگران شدن","write":"نوشتن","wrote":"نوشت","yes":"بله","yesterday":"دیروز","yet":"بااین‌حال / هنوز","you":"تو"}}]

const DE_BASIC=[{"id":"l01","order":1,"level":"A1","minutes":12,"title":"سلام و معرفی","titleDe":"Begrüßung und Vorstellung","blocks":[{"type":"dialog","lines":[{"de":"Guten Morgen! Ist hier noch frei?","fa":"صبح بخیر! اینجا هنوز خالی است؟"},{"de":"Ja, natürlich. Setz dich bitte!","fa":"بله، حتماً. بفرما بنشین!"},{"de":"Danke! Ich heiße Arian. Wie heißt du?","fa":"ممنون! اسمم آرین است. اسم تو چیست؟"},{"de":"Ich bin Lena. Freut mich, Arian!","fa":"من لنا هستم. خوشبختم، آرین!"},{"de":"Freut mich auch. Kommst du aus Jena?","fa":"من هم خوشبختم. اهل ینا هستی؟"},{"de":"Nein, ich komme aus Erfurt. Und du?","fa":"نه، من اهل ارفورت هستم. تو چطور؟"},{"de":"Ich komme aus dem Iran und wohne jetzt in Jena.","fa":"من اهل ایرانم و حالا در ینا زندگی می‌کنم."},{"de":"Oh, schön! Lernst du auch Deutsch?","fa":"چه خوب! تو هم آلمانی یاد می‌گیری؟"},{"de":"Ja, ich lerne Deutsch. Heute ist mein erster Tag.","fa":"بله، آلمانی یاد می‌گیرم. امروز روز اول من است."},{"de":"Willkommen! Ich bin auch neu in diesem Kurs.","fa":"خوش آمدی! من هم در این کلاس تازه‌واردم."},{"de":"Entschuldigung, sind Sie unsere Lehrerin?","fa":"ببخشید، شما معلم ما هستید؟"},{"de":"Ja, ich heiße Frau Weber. Wie heißen Sie?","fa":"بله، من خانم وبر هستم. نام شما چیست؟"},{"de":"Ich heiße Arian. Guten Tag, Frau Weber!","fa":"من آرین هستم. روز بخیر، خانم وبر!"},{"de":"Guten Tag! Wir fangen gleich an.","fa":"روز بخیر! همین حالا شروع می‌کنیم."}]},{"type":"vocab","items":[{"de":"Hallo","fa":"سلام","note":"احوالپرسی عمومی؛ رسمی‌تر از «Hi» نیست."},{"de":"Guten Morgen","fa":"صبح بخیر","note":"برای صبح؛ در محل کار و دانشگاه هم طبیعی است."},{"de":"Guten Tag","fa":"روز بخیر","note":"سلام مودبانه در طول روز."},{"de":"Guten Abend","fa":"عصر یا شب بخیر","note":"برای سلام‌کردن از عصر به بعد."},{"de":"Gute Nacht","fa":"شب بخیر","note":"هنگام خداحافظی پیش از خواب، نه برای سلام."},{"de":"Tschüss","fa":"خداحافظ","note":"خودمانی؛ پایان گفت‌وگو."},{"de":"Auf Wiedersehen","fa":"خداحافظ","note":"پایان گفت‌وگو در موقعیت رسمی."},{"de":"Bis morgen","fa":"تا فردا","note":"وقتی قرار است فردا دوباره همدیگر را ببینید."},{"de":"Bitte","fa":"لطفاً / بفرمایید / خواهش می‌کنم","note":"بسته به موقعیت معنی فرق می‌کند."},{"de":"Danke","fa":"ممنون","note":"در پاسخ: Bitte یا Gern geschehen."},{"de":"Entschuldigung","fa":"ببخشید","note":"برای جلب توجه یا عذرخواهی."},{"de":"Freut mich","fa":"خوشبختم","note":"شکل کوتاه «Es freut mich»."},{"de":"Willkommen","fa":"خوش آمدی / خوش آمدید","note":"برای استقبال از تازه‌وارد."},{"de":"der Name","fa":"نام / اسم","note":"مذکر؛ عبارت «Wie ist dein Name?» هم درست است."},{"de":"heißen","fa":"نام داشتن","note":"ich heiße؛ du heißt؛ sie heißt."},{"de":"sein","fa":"بودن","note":"ich bin؛ du bist؛ er ist؛ wir sind."},{"de":"kommen","fa":"آمدن / اهل جایی بودن","note":"Woher kommst du? — Ich komme aus ..."},{"de":"wohnen","fa":"ساکن بودن","note":"Ich wohne in Jena."},{"de":"lernen","fa":"یاد گرفتن","note":"Ich lerne Deutsch."},{"de":"der Kurs","fa":"دوره / کلاس","note":"جمع: die Kurse؛ در «im Kurs» یعنی در دوره."},{"de":"die Lehrerin","fa":"معلم زن","note":"معلم مرد: der Lehrer."},{"de":"der Student","fa":"دانشجوی مرد","note":"دانشجوی زن: die Studentin؛ جمع Studenten."},{"de":"neu","fa":"جدید / تازه‌وارد","note":"Ich bin neu hier."},{"de":"heute","fa":"امروز","note":"برای زمان روز جاری."},{"de":"hier","fa":"اینجا","note":"مخالف: dort = آنجا."},{"de":"aus","fa":"از / اهل","note":"برای کشور یا شهر مبدأ: aus dem Iran."},{"de":"du","fa":"تو","note":"خطاب غیررسمی مفرد؛ فعل با آن صرف می‌شود."},{"de":"Sie","fa":"شما (رسمی)","note":"با S بزرگ؛ فعل مانند سوم‌شخص جمع صرف می‌شود."},{"de":"Wie heißt du?","fa":"اسمت چیست؟","note":"سؤال صمیمی؛ در موقعیت رسمی «Wie heißen Sie?»."},{"de":"Woher kommst du?","fa":"اهل کجایی؟","note":"جواب: Ich komme aus ..."}]},{"type":"grammar","title":"فعل sein و معرفی خود","body":"برای معرفی، شغل و ویژگی‌ها از فعل بی‌قاعدهٔ «بودن» استفاده می‌کنیم. صرف زمان حال: ich bin، du bist، er/sie/es ist، wir sind، ihr seid، sie/Sie sind. در جملهٔ خبری معمولاً فعل صرف‌شده در جایگاه دوم قرار می‌گیرد. برای معرفی با «دانشجو هستم»، در آلمانی معمولاً قبل از عنوان شغلی بدون صفت، حرف تعریف نمی‌آوریم.\nمثال‌ها:\n[[Ich bin Arian.]] (من آرین هستم)؛ [[Du bist neu hier.]] (تو اینجا تازه‌واردی)؛ [[Lena ist Studentin.]] (لنا دانشجوست)؛ [[Wir sind im Deutschkurs.]] (ما در کلاس آلمانی هستیم)؛ [[Ihr seid pünktlich.]] (شماها سروقت هستید)؛ [[Sie sind unsere Lehrerin.]] (شما معلم ما هستید)؛ [[Ich bin nicht müde.]] (من خسته نیستم)."},{"type":"tip","body":"برای معرفی شغل، جملهٔ [[Ich bin Student.]] طبیعی است؛ بدون حرف تعریف. اگر صفت اضافه شود، ساخت تغییر می‌کند: [[Ich bin ein neuer Student.]] (من دانشجوی تازه‌واردی هستم)."},{"type":"grammar","title":"heißen، kommen، wohnen و صرف فعل‌ها","body":"بیشتر فعل‌های معمولی در زمان حال با این پسوندها صرف می‌شوند: ich -e، du -st، er/sie/es -t، wir -en، ihr -t، sie/Sie -en. فعل heißen یک تفاوت املایی دارد: با du می‌گوییم heißt، نه heißst. برای مبدأ شهر معمولاً aus + نام شهر می‌آید؛ «ایران» استثناست و همراه حرف تعریف می‌آید: aus dem Iran. برای محل سکونت از in استفاده می‌کنیم.\nمثال‌ها:\n[[Ich heiße Lena.]] (اسم من لناست)؛ [[Wie heißt du?]] (اسم تو چیست؟)؛ [[Er heißt Amir.]] (اسم او امیر است)؛ [[Ich komme aus Erfurt.]] (من اهل ارفورت هستم)؛ [[Sie kommt aus dem Iran.]] (او اهل ایران است)؛ [[Wir wohnen in Jena.]] (ما در ینا زندگی می‌کنیم)؛ [[Lernst du Deutsch?]] (تو آلمانی یاد می‌گیری؟)."},{"type":"mistakes","items":[{"wrong":"Ich bin heiße Arian.","right":"Ich heiße Arian.","fa":"heißen خودش فعل اصلی است؛ نباید هم‌زمان bin را به آن اضافه کرد."},{"wrong":"Ich komme von Iran.","right":"Ich komme aus dem Iran.","fa":"برای کشور مبدأ «aus» می‌آید و Iran در این کاربرد با حرف تعریف مذکر است."},{"wrong":"Du heißtst Lena.","right":"Du heißt Lena.","fa":"به‌خاطر پایان ریشه با ß، در du فقط -t اضافه می‌شود."}]},{"type":"grammar","title":"سؤال ساختن و تفاوت du و Sie","body":"در سؤالِ پرسشی، واژهٔ پرسش (wie، woher، wo) اول می‌آید و بعد فعل صرف‌شده و فاعل. در سؤال بله/خیر فعل اول قرار می‌گیرد. «du» برای دوستان و هم‌کلاسی‌ها رایج است؛ «Sie» برای خطاب رسمی، مثل گفت‌وگو با کارمند یا مدرس ناآشنا. خطاب رسمیِ Sie همیشه با حرف بزرگ نوشته می‌شود. فعلِ Sie به شکل جمع صرف می‌شود.\nمثال‌ها:\n[[Wie heißt du?]] (اسم تو چیست؟)؛ [[Wie heißen Sie?]] (اسم شما چیست؟)؛ [[Woher kommst du?]] (اهل کجایی؟)؛ [[Wo wohnen Sie?]] (کجا زندگی می‌کنید؟)؛ [[Bist du neu hier?]] (آیا اینجا تازه‌واردی؟)؛ [[Sind Sie Frau Weber?]] (آیا شما خانم وبر هستید؟)؛ [[Kommen Sie aus Jena?]] (شما اهل ینا هستید؟)."},{"type":"tip","body":"به نقش [[Gute Nacht!]] دقت کن: یعنی «شب بخیر» موقع رفتن یا خوابیدن، نه «سلام، شب‌به‌خیر». برای شروع گفت‌وگو در شب از [[Guten Abend!]] استفاده کن."},{"type":"text","de":"Heute ist mein erster Tag in einem Deutschkurs in Jena. Ich heiße Arian und komme aus dem Iran. Jetzt wohne ich in Jena. Am Morgen gehe ich in den Kurs. Vor der Tür steht eine junge Frau. Sie sagt: „Guten Morgen! Ich bin Lena. Wie heißt du?“ Ich antworte: „Ich heiße Arian. Freut mich!“ Lena kommt aus Erfurt. Sie wohnt aber jetzt auch in Jena. Wir sind beide neu im Kurs. Das ist schön, denn ich kenne hier noch nicht viele Leute. Im Raum sind schon andere Studenten. Ein Mann sagt „Hallo“, und eine Frau sagt „Guten Tag“. Alle sind freundlich. Dann kommt unsere Lehrerin. Sie heißt Frau Weber. Ich sage: „Entschuldigung, sind Sie unsere Lehrerin?“ Sie lächelt und sagt: „Ja. Wie heißen Sie?“ Ich nenne meinen Namen und setze mich. Frau Weber schreibt ihren Namen an die Tafel. Dann fragen wir einander: „Woher kommst du?“ und „Wo wohnst du?“ Ich höre zu und spreche langsam. Am Ende sagt Lena: „Bis morgen!“ Ich sage: „Tschüss, Lena! Bis morgen!“ Ich bin froh. Mein erster Tag ist gut.","fa":"امروز اولین روز من در یک کلاس آلمانی در یناست. اسمم آرین است، اهل ایرانم و حالا در ینا زندگی می‌کنم. صبح به کلاس می‌روم. جلوی در زنی جوان ایستاده. می‌گوید: «صبح بخیر! من لنا هستم. اسمت چیست؟» پاسخ می‌دهم: «آرین هستم، خوشبختم!» لنا اهل ارفورت است، ولی اکنون او هم در ینا زندگی می‌کند. هر دو در کلاس تازه‌واردیم. خوشحالم، چون اینجا هنوز آدم‌های زیادی را نمی‌شناسم. در اتاق دانشجوهای دیگری هستند. مردی سلام می‌کند و زنی می‌گوید روز بخیر. همه مهربان‌اند. سپس معلممان می‌آید. اسمش خانم وبر است. می‌پرسم: «ببخشید، شما معلم ما هستید؟» لبخند می‌زند و می‌پرسد: «اسم شما چیست؟» نامم را می‌گویم و می‌نشینم. خانم وبر اسمش را روی تخته می‌نویسد. بعد از هم می‌پرسیم اهل کجا هستیم و کجا زندگی می‌کنیم. گوش می‌دهم و آرام حرف می‌زنم. پایان کلاس لنا می‌گوید تا فردا، و من هم خداحافظی می‌کنم. خوشحالم؛ روز اولم خوب بود."},{"type":"tip","body":"در شروع گفت‌وگو با فرد ناآشنا، [[Entschuldigung]] راه طبیعی برای جلب توجه است. بعد می‌توانی با [[Sind Sie ...?]] یا [[Wie heißen Sie?]] مؤدبانه بپرسی."}],"exercises":[{"type":"mc","q":"برای سلام‌کردن به کسی در ساعت ۱۹ کدام عبارت مناسب‌تر است؟","options":["Gute Nacht!","Guten Abend!","Auf Wiedersehen!"],"answer":1,"why":"[[Guten Abend!]] برای شروع سلام در عصر و شب است؛ [[Gute Nacht!]] برای خداحافظی پیش از خواب."},{"type":"mc","q":"کدام جمله درست است؟","options":["Ich bin heiße Arian.","Ich heiße Arian.","Ich heißt Arian."],"answer":1,"why":"[[heißen]] خودِ فعل است؛ با ich به شکل [[heiße]] می‌آید."},{"type":"blank","text":"Woher ___ du?","answer":"kommst","hint":"با du از فعل kommen استفاده کن."},{"type":"type","q":"به آلمانی بنویس: «من در ینا زندگی می‌کنم.»","answer":"Ich wohne in Jena.","accept":["Ich wohne in Jena"]},{"type":"mc","q":"اگر با کارمند اداری ناآشنا صحبت کنی، کدام مناسب‌تر است؟","options":["Wie heißt du?","Wie heißen Sie?","Wie heißen du?"],"answer":1,"why":"[[Sie]] خطاب رسمی است و فعل با آن به شکل [[heißen]] صرف می‌شود."},{"type":"blank","text":"Ich ___ neu im Kurs.","answer":"bin"},{"type":"type","q":"به آلمانی بنویس: «من اهل ایران هستم.»","answer":"Ich komme aus dem Iran.","accept":["Ich komme aus dem Iran"]},{"type":"mc","q":"جای فعل در یک سؤال بله/خیر کجاست؟","options":["معمولاً اول جمله","همیشه آخر جمله","بعد از دو اسم"],"answer":0,"why":"در سؤال بله/خیر، فعل صرف‌شده معمولاً در آغاز جمله می‌آید: [[Bist du neu?]]"},{"type":"blank","text":"Frau Weber, ___ Sie unsere Lehrerin?","answer":"sind","hint":"در سؤال رسمی، فعل sein برای Sie = sind."},{"type":"type","q":"به آلمانی بنویس: «اسم من لناست.»","answer":"Ich heiße Lena.","accept":["Ich heiße Lena","Mein Name ist Lena.","Mein Name ist Lena"]},{"type":"mc","q":"کدام معنی [[Freut mich!]] است؟","options":["من خسته‌ام","خوشبختم / از آشنایی خوشحالم","فردا می‌بینمت"],"answer":1,"why":"[[Freut mich!]] عبارت رایج هنگام آشنایی است."},{"type":"blank","text":"Du ___ aus Erfurt.","answer":"kommst","hint":"صرف kommen با du."}],"glossary":{"abend":"عصر / شب","aber":"اما","alle":"همه","am":"در / کنار (an dem)","an":"در / روی / کنار","andere":"دیگران / دیگر","antworte":"پاسخ می‌دهم","arian":"آرین (نام)","auch":"هم / نیز","auf":"روی / به","aus":"از / اهل","beide":"هردو","bin":"هستم","bis":"تا","bitte":"لطفاً","danke":"ممنون","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","denn":"زیرا / چون","der":"حرف تعریف مذکر","deutsch":"زبان آلمانی","deutschkurs":"کلاس زبان آلمانی","dich":"تو (مفعولی)","die":"حرف تعریف مؤنث / جمع","diesem":"این (داتیو مذکر/خنثی)","du":"تو","ein":"یک (مذکر/خنثی)","einander":"همدیگر","eine":"یک (مؤنث)","einem":"یک (داتیو مذکر/خنثی)","ende":"پایان","entschuldigung":"ببخشید","erfurt":"ارفورت","erster":"اولین","fangen":"گرفتن / آغاز کردن","fragen":"می‌پرسند / پرسیدن","frau":"خانم","frei":"آزاد / خالی","freundlich":"مهربان / دوستانه","freut":"خوشحال می‌کند (freut mich: خوشبختم)","froh":"خوشحال","gehe":"می‌روم","gleich":"همین الآن / به‌زودی","gut":"خوب","gute":"خوب (در شب‌بخیر)","guten":"خوب (صرف‌شده)","hallo":"سلام","heiße":"اسمم ... است","heißen":"نام داشتن / نام دارند","heißt":"نام دارد / اسمش ... است","heute":"امروز","hier":"اینجا","höre":"می‌شنوم","ich":"من","ihren":"مال او / مال شما (مفعولی مذکر)","im":"در / درونِ","in":"در","iran":"ایران","ist":"است","ja":"بله","jena":"ینا (شهر)","jetzt":"حالا","junge":"جوان","kenne":"می‌شناسم","komme":"می‌آیم","kommen":"آمدن","kommst":"می‌آیی / اهل ... هستی","kommt":"می‌آید","kurs":"دورهٔ درسی","langsam":"آهسته","lehrerin":"معلم زن","lena":"لنا (نام)","lerne":"یاد می‌گیرم","lernen":"یاد گرفتن / یاد می‌گیرند","lernst":"یاد می‌گیری","leute":"آدم‌ها","lächelt":"لبخند می‌زند","mann":"مرد","mein":"مال من (مذکر/خنثی)","meinen":"مال من در حالت مفعولی مذکر","mich":"من (مفعولی)","morgen":"صبح / فردا","nacht":"شب","name":"نام","namen":"نام (مفعولی)","natürlich":"البته / حتماً","nein":"نه","nenne":"نام می‌برم / می‌گویم","neu":"جدید / تازه‌وارد","nicht":"نه / نفی","noch":"هنوز / دیگر","oh":"اوه","raum":"اتاق","sage":"می‌گویم","sagt":"می‌گوید","schon":"از قبل / همین حالا","schreibt":"می‌نویسد","schön":"زیبا / خوب","sein":"مال او (مذکر) / بودن","setz":"بنشین (امر)","setze":"می‌نشینم (خودم)","sie":"او / آن‌ها / شما (با توجه به متن)","sind":"هستند / هستیم / هستید","spreche":"حرف می‌زنم","steht":"ایستاده است / قرار دارد","student":"دانشجو (مذکر)","studenten":"دانشجویان","tafel":"تخته","tag":"روز","tschüss":"خداحافظ","tür":"در","und":"و","unsere":"مال ما (مؤنث/جمع)","viele":"بسیار / چندین","vor":"پیش از / جلوی","weber":"وبر (نام خانوادگی)","wie":"چگونه / چطور / چه","wiedersehen":"دیدار دوباره / خداحافظ","willkommen":"خوش آمدید","wir":"ما","wo":"کجا","woher":"اهل کجا / از کجا","wohne":"ساکنم","wohnen":"ساکن‌اند / زندگی می‌کنند","wohnst":"ساکنی","wohnt":"ساکن است","zu":"به / در خانهٔ"}},{"id":"l02","order":2,"level":"A1","minutes":15,"title":"اعداد و ساعت","titleDe":"Zahlen und Uhrzeit","blocks":[{"type":"dialog","lines":[{"de":"Entschuldigung, wie spät ist es?","fa":"ببخشید، ساعت چند است؟"},{"de":"Es ist halb acht. Warum fragst du?","fa":"هفت و نیم است. چرا می‌پرسی؟"},{"de":"Mein Deutschkurs beginnt um acht Uhr.","fa":"کلاس آلمانی من ساعت هشت شروع می‌شود."},{"de":"Keine Sorge. Du hast noch dreißig Minuten.","fa":"نگران نباش. هنوز سی دقیقه وقت داری."},{"de":"Stimmt. Hast du heute auch Unterricht?","fa":"درست است. تو هم امروز کلاس داری؟"},{"de":"Ja, aber erst um Viertel nach neun.","fa":"بله، اما تازه ساعت نه و ربع."},{"de":"Treffen wir uns um zwölf Uhr zum Essen?","fa":"ساعت دوازده برای غذا همدیگر را ببینیم؟"},{"de":"Um zwölf kann ich nicht. Ich habe bis halb eins Unterricht.","fa":"ساعت دوازده نمی‌توانم. تا دوازده و نیم کلاس دارم."},{"de":"Dann vielleicht um Viertel vor eins?","fa":"پس شاید یک ربع به یک؟"},{"de":"Das passt. Also um zwölf Uhr fünfundvierzig.","fa":"مناسب است. پس ساعت دوازده و چهل‌وپنج."},{"de":"Super. Wie viele Leute kommen?","fa":"عالیه. چند نفر می‌آیند؟"},{"de":"Vier: du, ich und zwei Freunde.","fa":"چهار نفر: تو، من و دو دوست."},{"de":"Gut! Ich bin lieber fünf Minuten früher da.","fa":"خوبه! ترجیح می‌دهم پنج دقیقه زودتر آنجا باشم."},{"de":"Perfekt. Bis später, und sei pünktlich!","fa":"عالی. بعداً می‌بینمت، و سروقت باش!"}]},{"type":"vocab","items":[{"de":"eins","fa":"یک (۱)","note":"وقتی ساعت ۱ است می‌گوییم «ein Uhr»، نه eins Uhr."},{"de":"zwei","fa":"دو (۲)","note":"کاربرد برای ساعت دو و تعداد دو."},{"de":"drei","fa":"سه (۳)","note":"سه و ربع: Viertel nach drei."},{"de":"vier","fa":"چهار (۴)","note":"halb vier = ساعت ۳:۳۰."},{"de":"fünf","fa":"پنج (۵)","note":"برای شمارش دقیقه و نفر."},{"de":"sechs","fa":"شش (۶)","note":"شش نفر: sechs Personen."},{"de":"sieben","fa":"هفت (۷)","note":"هفت و نیم: halb acht."},{"de":"acht","fa":"هشت (۸)","note":"um acht Uhr = رأس ساعت ۸."},{"de":"neun","fa":"نه (۹)","note":"عدد ۹؛ ساعت: neun Uhr."},{"de":"zehn","fa":"ده (۱۰)","note":"zehn Minuten = ده دقیقه."},{"de":"elf","fa":"یازده (۱۱)","note":"به تلفظ f آخر دقت کن."},{"de":"zwölf","fa":"دوازده (۱۲)","note":"حرف ö را درست تلفظ کن."},{"de":"dreizehn","fa":"سیزده (۱۳)","note":"drei + zehn به‌هم پیوسته نوشته می‌شود."},{"de":"vierzehn","fa":"چهارده (۱۴)","note":"چهارده دقیقه: vierzehn Minuten."},{"de":"fünfzehn","fa":"پانزده (۱۵)","note":"یک ربع = fünfzehn Minuten."},{"de":"sechzehn","fa":"شانزده (۱۶)","note":"sechs → sechzehn؛ s حذف می‌شود."},{"de":"siebzehn","fa":"هفده (۱۷)","note":"sieben → siebzehn؛ en حذف می‌شود."},{"de":"achtzehn","fa":"هجده (۱۸)","note":"acht + zehn."},{"de":"neunzehn","fa":"نوزده (۱۹)","note":"neun + zehn."},{"de":"zwanzig","fa":"بیست (۲۰)","note":"بیست‌ویک: einundzwanzig."},{"de":"die Uhr","fa":"ساعت / واحد اعلام ساعت","note":"جمع: die Uhren؛ در «um acht Uhr» شکل مفرد."},{"de":"die Stunde","fa":"ساعت (مدت‌زمان)","note":"یک ساعت زمان = eine Stunde."},{"de":"die Minute","fa":"دقیقه","note":"جمع: die Minuten."},{"de":"die Viertelstunde","fa":"یک ربع (۱۵ دقیقه)","note":"Viertel nach = ربع گذشته از؛ Viertel vor = ربع مانده."},{"de":"halb","fa":"نیم / نیمه","note":"halb vier = ۳:۳۰، نه ۴:۳۰."},{"de":"vor","fa":"مانده به / قبل از","note":"zehn vor acht = ۷:۵۰."},{"de":"nach","fa":"گذشته از / بعد از","note":"zehn nach acht = ۸:۱۰."},{"de":"um","fa":"در ساعتِ مشخص","note":"um acht Uhr؛ اما es ist acht Uhr."},{"de":"pünktlich","fa":"سروقت","note":"به‌موقع به یک قرار یا کلاس رسیدن."},{"de":"zu spät","fa":"خیلی دیر / دیرکرده","note":"مخالف: zu früh = زودتر از وقت."}]},{"type":"grammar","title":"اعداد ۱ تا ۲۰ و ساخت عددهای بزرگ‌تر","body":"در آلمانی اعداد ۱۳ تا ۱۹ معمولاً از عدد یکان + zehn ساخته می‌شوند؛ دو استثنای املایی مهم sechzehn و siebzehn هستند. برای ۲۱ تا ۹۹ معمولاً ابتدا یکان و سپس und و دهگان می‌آید: einundzwanzig. در نام ساعتِ یک، ein به‌جای eins می‌نشیند. موقع خواندن عدد تلفن، رقم‌ها را غالباً جداجدا می‌گویند.\nمثال‌ها:\n[[Ich habe zwei Bücher.]] (دو کتاب دارم)؛ [[Wir sind sieben Personen.]] (ما هفت نفریم)؛ [[Das Kind ist sechzehn Jahre alt.]] (بچه شانزده ساله است)؛ [[Hier sind siebzehn Studenten.]] (اینجا هفده دانشجو هستند)؛ [[Sie hat zwanzig Minuten Zeit.]] (او بیست دقیقه وقت دارد)؛ [[Ich bin einundzwanzig Jahre alt.]] (من بیست‌ویک ساله‌ام)؛ [[Es ist ein Uhr.]] (ساعت یک است)."},{"type":"tip","body":"[[sechzehn]] و [[siebzehn]] را جدا حفظ کن: شکل‌های غلط [[sechszehn]] و [[siebenzehn]] زیاد دیده می‌شوند. از ۲۱ به بعد ترتیب یکان و دهگان را وارونه می‌گوییم: [[einundzwanzig]]."},{"type":"grammar","title":"پرسیدن و خواندن ساعت: نیم، ربع، پیش و پس","body":"برای پرسیدن ساعت دو سؤال رایج داریم: Wie spät ist es? و Wie viel Uhr ist es? در گفتار روزمره بعد از عدد یا بخشِ ربع و نیم، Uhr را همیشه تکرار نمی‌کنیم. «halb» به ساعت بعدی نگاه می‌کند: halb vier یعنی ۳:۳۰. «Viertel nach» یعنی ربع بعد از ساعت، و «Viertel vor» یعنی ربع مانده به ساعت. برای رفع ابهام، شکل دیجیتال ساعت مثل acht Uhr dreißig هم رایج است.\nمثال‌ها:\n[[Wie spät ist es?]] (ساعت چند است؟)؛ [[Es ist acht Uhr.]] (ساعت هشت است)؛ [[Es ist zehn nach acht.]] (هشت و ده دقیقه است)؛ [[Es ist Viertel nach acht.]] (هشت و ربع است)؛ [[Es ist halb neun.]] (هشت و نیم است)؛ [[Es ist Viertel vor neun.]] (یک ربع به نه است)؛ [[Es ist fünf vor neun.]] (پنج دقیقه به نه است)."},{"type":"mistakes","items":[{"wrong":"Es ist halb vier. = 4:30","right":"Es ist halb vier. = 3:30","fa":"در آلمانی halb به ساعت بعدی اشاره می‌کند: نیم ساعت مانده به چهار."},{"wrong":"Der Kurs beginnt in acht Uhr.","right":"Der Kurs beginnt um acht Uhr.","fa":"برای زمانِ دقیقِ شروعِ رویداد از حرف اضافهٔ um استفاده می‌شود."},{"wrong":"Es ist eins Uhr.","right":"Es ist ein Uhr.","fa":"هنگام اعلام ساعت یک، شکل درست ein Uhr است."}]},{"type":"grammar","title":"فعل haben و تعیین زمان قرار","body":"فعل haben در زمان حال این‌طور صرف می‌شود: ich habe، du hast، er/sie/es hat، wir haben، ihr habt، sie/Sie haben. برای بیان داشتنِ وقت می‌گوییم Zeit haben. در جملهٔ خبری، فعل صرف‌شده جایگاه دوم دارد. با um زمان شروع قرار را مشخص می‌کنیم؛ با von ... bis ... بازهٔ زمانی بیان می‌شود. بین ساعت وقوع یک رویداد و مدت آن فرق است: Uhr برای ساعتِ روز، Stunde برای مدت.\nمثال‌ها:\n[[Ich habe heute Zeit.]] (من امروز وقت دارم)؛ [[Hast du zehn Minuten?]] (ده دقیقه وقت داری؟)؛ [[Er hat um acht Uhr Unterricht.]] (او ساعت هشت کلاس دارد)؛ [[Wir haben eine Stunde Pause.]] (ما یک ساعت استراحت داریم)؛ [[Der Kurs beginnt um neun Uhr.]] (کلاس ساعت نه شروع می‌شود)؛ [[Ich lerne von acht bis zehn Uhr.]] (از ساعت هشت تا ده درس می‌خوانم)؛ [[Wir treffen uns um Viertel vor eins.]] (ساعت یک ربع به یک همدیگر را می‌بینیم)."},{"type":"tip","body":"[[Uhr]] و [[Stunde]] یکی نیستند: [[Es ist drei Uhr.]] (ساعت سه است)، اما [[Ich habe drei Stunden Zeit.]] (سه ساعت وقت دارم)."},{"type":"text","de":"Heute ist Montag. Ich habe um acht Uhr einen Deutschkurs. Am Morgen sehe ich auf die Uhr. Es ist sieben Uhr zwanzig. Ich habe also vierzig Minuten Zeit. Ich esse schnell etwas und gehe aus dem Haus. An der Haltestelle warten schon fünf Personen. Der Bus kommt um halb acht. Ich bin froh, denn ich bin nicht zu spät. Um Viertel vor acht bin ich im Kursraum. Die Lehrerin kommt pünktlich um acht Uhr. Der Unterricht dauert zwei Stunden. Um zehn Uhr haben wir eine Pause. Meine Freundin Lena fragt: „Hast du heute Mittag Zeit?“ Ich antworte: „Ja, aber nur bis halb eins.“ Sie möchte zusammen essen. Wir treffen uns um Viertel nach zwölf vor dem Café. Dort sitzen schon zwei Freunde. Jetzt sind wir vier Personen. Wir bestellen etwas zu essen. Um zwölf Uhr zwanzig trinken wir Wasser und sprechen über den Tag. Lena fragt: „Wie viel Uhr ist es?“ Ich sage: „Es ist zehn vor halb eins.“ Wir haben noch zehn Minuten. Um halb eins muss ich zurück. Am Abend sehe ich auf meinen Plan: Morgen beginnt mein Kurs erst um neun Uhr. Gut, ich kann länger schlafen!","fa":"امروز دوشنبه است. ساعت هشت کلاس آلمانی دارم. صبح به ساعت نگاه می‌کنم: هفت و بیست است. پس چهل دقیقه وقت دارم. سریع چیزی می‌خورم و از خانه بیرون می‌روم. در ایستگاه پنج نفر منتظرند. اتوبوس ساعت هفت و نیم می‌آید. خوشحالم چون دیر نکرده‌ام. یک ربع به هشت در کلاس هستم. معلم دقیقاً ساعت هشت می‌آید. کلاس دو ساعت طول می‌کشد. ساعت ده استراحت داریم. دوستم لنا می‌پرسد ظهر وقت داری؟ پاسخ می‌دهم فقط تا دوازده و نیم. او می‌خواهد با هم غذا بخوریم. ساعت دوازده و ربع جلوی کافه همدیگر را می‌بینیم. دو دوست دیگر هم آنجا نشسته‌اند؛ حالا چهار نفریم. غذایی سفارش می‌دهیم. دوازده و بیست آب می‌نوشیم و دربارهٔ روز صحبت می‌کنیم. لنا می‌پرسد ساعت چند است؟ می‌گویم ده دقیقه به دوازده و نیم است. هنوز ده دقیقه وقت داریم. ساعت دوازده و نیم باید برگردم. عصر برنامه‌ام را می‌بینم: فردا کلاس ساعت نه شروع می‌شود. عالی، می‌توانم بیشتر بخوابم!"},{"type":"tip","body":"برای قرارگذاشتن ساعت را دوباره به شکل دیجیتال تکرار کن: [[Viertel vor eins, also zwölf Uhr fünfundvierzig.]] این کار در مکالمه جلوی اشتباه را می‌گیرد."}],"exercises":[{"type":"mc","q":"ساعت ۳:۳۰ به آلمانی چه می‌شود؟","options":["halb drei","halb vier","Viertel nach drei"],"answer":1,"why":"[[halb vier]] یعنی ۳۰ دقیقه مانده به چهار، یعنی ۳:۳۰."},{"type":"mc","q":"کدام گزینه به معنی ۸:۴۵ است؟","options":["Viertel vor neun","Viertel nach neun","halb neun"],"answer":0,"why":"[[Viertel vor neun]] یک ربع مانده به ساعت نه است."},{"type":"blank","text":"Der Kurs beginnt ___ acht Uhr.","answer":"um","hint":"برای ساعت دقیق از um استفاده کن."},{"type":"type","q":"به آلمانی بنویس: «ساعت هفت و نیم است.»","answer":"Es ist halb acht.","accept":["Es ist halb acht"]},{"type":"mc","q":"شکل درست ۱۷ در آلمانی کدام است؟","options":["siebenzehn","siebzehn","siebenzig"],"answer":1,"why":"در [[siebzehn]] بخش en از sieben حذف شده است."},{"type":"blank","text":"Du ___ heute noch zehn Minuten.","answer":"hast","hint":"صرف haben برای du."},{"type":"type","q":"به آلمانی بنویس: «ما ساعت نه وقت داریم.»","answer":"Wir haben um neun Uhr Zeit.","accept":["Wir haben um neun Uhr Zeit"]},{"type":"mc","q":"فرق [[Uhr]] و [[Stunde]] چیست؟","options":["هر دو همیشه یک معنی دارند","Uhr ساعتِ روز است؛ Stunde مدتِ زمان","Stunde برای بیان دقیقه است"],"answer":1,"why":"[[Uhr]] در ۸:۰۰ و [[Stunde]] در مدتِ یک ساعت کاربرد دارد."},{"type":"blank","text":"Es ist Viertel ___ zwölf. (11:45)","answer":"vor"},{"type":"type","q":"به آلمانی بنویس: «ساعت چند است؟»","answer":"Wie spät ist es?","accept":["Wie spät ist es","Wie viel Uhr ist es?","Wie viel Uhr ist es"]},{"type":"mc","q":"جملهٔ درست برای ۱:۰۰ کدام است؟","options":["Es ist eins Uhr.","Es ist ein Uhr.","Es ist eine Uhr."],"answer":1,"why":"برای ساعت یک می‌گوییم [[ein Uhr]]، نه [[eins Uhr]]."},{"type":"blank","text":"Wir ___ eine Stunde Pause.","answer":"haben"}],"glossary":{"abend":"عصر / شب","aber":"اما","acht":"هشت","achtzehn":"هجده","also":"پس / بنابراین","am":"در / کنار (an dem)","an":"در / روی / کنار","antworte":"پاسخ می‌دهم","auch":"هم / نیز","auf":"روی / به","aus":"از / اهل","beginnt":"شروع می‌شود","bestellen":"سفارش‌دادن","bin":"هستم","bis":"تا","bus":"اتوبوس","café":"کافه","da":"آنجا / حاضر","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dauert":"طول می‌کشد","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","denn":"زیرا / چون","der":"حرف تعریف مذکر","deutschkurs":"کلاس زبان آلمانی","die":"حرف تعریف مؤنث / جمع","dort":"آنجا","drei":"سه","dreizehn":"سیزده","dreißig":"سی","du":"تو","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","eins":"یک","elf":"یازده","entschuldigung":"ببخشید","erst":"تازه / تنها در آن زمان","es":"آن","esse":"می‌خورم","essen":"خوردن / غذا","etwas":"چیزی / مقداری","fragst":"می‌پرسی","fragt":"می‌پرسد","freunde":"دوستان","freundin":"دوست دختر (دوست مؤنث)","froh":"خوشحال","früher":"زودتر","fünf":"پنج","fünfundvierzig":"چهل‌وپنج","fünfzehn":"پانزده","gehe":"می‌روم","gut":"خوب","habe":"دارم","haben":"داشتن / دارند / داریم","halb":"نیمِ ساعتِ بعد","haltestelle":"ایستگاه اتوبوس","hast":"داری","haus":"خانه","heute":"امروز","ich":"من","im":"در / درونِ","ist":"است","ja":"بله","jetzt":"حالا","kann":"می‌توانم","keine":"هیچ / ندارم (جمع یا مؤنث)","kommen":"آمدن","kommt":"می‌آید","kurs":"دورهٔ درسی","kursraum":"اتاق کلاس","lehrerin":"معلم زن","lena":"لنا (نام)","leute":"آدم‌ها","lieber":"ترجیحاً","länger":"مدت بیشتری / طولانی‌تر","mein":"مال من (مذکر/خنثی)","meine":"مال من (مؤنث/جمع)","meinen":"مال من در حالت مفعولی مذکر","minute":"دقیقه","minuten":"دقیقه‌ها","mittag":"ظهر","montag":"دوشنبه","morgen":"صبح / فردا","muss":"باید","möchte":"می‌خواهم / می‌خواهد","nach":"بعد از","neun":"نه","neunzehn":"نوزده","nicht":"نه / نفی","noch":"هنوز / دیگر","nur":"فقط","passt":"مناسب است","pause":"استراحت","perfekt":"عالی / بی‌نقص","personen":"نفر / اشخاص","plan":"برنامه","pünktlich":"سروقت","sage":"می‌گویم","schlafen":"خوابیدن","schnell":"سریع","schon":"از قبل / همین حالا","sechs":"شش","sechzehn":"شانزده","sehe":"می‌بینم","sei":"باش (امر مفردِ sein)","sie":"او / آن‌ها / شما (با توجه به متن)","sieben":"هفت","siebzehn":"هفده","sind":"هستند / هستیم / هستید","sitzen":"نشسته‌اند / نشستن","sorge":"نگرانی","sprechen":"حرف می‌زنند / صحبت کردن","spät":"دیر","später":"بعداً","stimmt":"درست است","stunde":"یک ساعت مدت","stunden":"ساعت (مدت، جمع)","super":"عالی","tag":"روز","treffen":"همدیگر را دیدن","trinken":"می‌نوشند","uhr":"ساعت (زمانِ روز)","um":"در ساعت / دور","und":"و","uns":"ما را / برای ما","unterricht":"کلاس / آموزش","viel":"زیاد","viele":"بسیار / چندین","vielleicht":"شاید","vier":"چهار","viertel":"یک‌ربع","viertelstunde":"یک ربع ساعت","vierzehn":"چهارده","vierzig":"چهل","vor":"پیش از / جلوی","warten":"منتظرند","warum":"چرا","wasser":"آب","wie":"چگونه / چطور / چه","wir":"ما","zehn":"ده","zeit":"وقت","zu":"به / در خانهٔ","zum":"به (zu dem)","zurück":"برگشت / عقب","zusammen":"با هم","zwanzig":"بیست","zwei":"دو","zwölf":"دوازده","über":"دربارهٔ / بالای"}},{"id":"l03","order":3,"level":"A1","minutes":15,"title":"خانواده","titleDe":"Die Familie","blocks":[{"type":"dialog","lines":[{"de":"Was ist das für ein Foto?","fa":"این چه عکسی است؟"},{"de":"Das ist meine Familie. Hier sind meine Eltern.","fa":"این خانوادهٔ من است. اینجا پدر و مادرم هستند."},{"de":"Oh, schön! Wie heißt dein Vater?","fa":"چه خوب! اسم پدرت چیست؟"},{"de":"Mein Vater heißt Reza. Meine Mutter heißt Maryam.","fa":"اسم پدرم رضاست. اسم مادرم مریم است."},{"de":"Hast du auch Geschwister?","fa":"خواهر یا برادر هم داری؟"},{"de":"Ja, ich habe einen Bruder und eine Schwester.","fa":"بله، یک برادر و یک خواهر دارم."},{"de":"Wie heißen sie?","fa":"اسم‌هایشان چیست؟"},{"de":"Mein Bruder heißt Ali und meine Schwester heißt Sara.","fa":"برادرم علی و خواهرم سارا نام دارند."},{"de":"Wie alt ist dein Bruder?","fa":"برادرت چند ساله است؟"},{"de":"Er ist zwanzig Jahre alt. Sara ist sechzehn.","fa":"او بیست ساله است. سارا شانزده ساله است."},{"de":"Wohnt deine Familie auch in Jena?","fa":"خانواده‌ات هم در ینا زندگی می‌کند؟"},{"de":"Nein, meine Eltern wohnen im Iran. Meine Geschwister auch.","fa":"نه، پدر و مادرم در ایران زندگی می‌کنند. خواهر و برادرم هم همین‌طور."},{"de":"Vermisst du deine Familie manchmal?","fa":"گاهی دلت برای خانواده‌ات تنگ می‌شود؟"},{"de":"Ja, natürlich. Wir telefonieren aber oft miteinander.","fa":"بله، البته. اما زیاد با هم تلفنی حرف می‌زنیم."}]},{"type":"vocab","items":[{"de":"die Familie","fa":"خانواده","note":"جمع: die Familien."},{"de":"der Vater","fa":"پدر","note":"جمع: die Väter؛ اسم مذکر."},{"de":"die Mutter","fa":"مادر","note":"جمع: die Mütter؛ اسم مؤنث."},{"de":"die Eltern","fa":"پدر و مادر / والدین","note":"فقط به صورت جمع؛ meine Eltern."},{"de":"der Bruder","fa":"برادر","note":"جمع: die Brüder."},{"de":"die Schwester","fa":"خواهر","note":"جمع: die Schwestern."},{"de":"die Geschwister","fa":"خواهر و برادرها","note":"جمع؛ برای یک یا چند خواهر و برادر."},{"de":"der Sohn","fa":"پسر (فرزند)","note":"جمع: die Söhne."},{"de":"die Tochter","fa":"دختر (فرزند)","note":"جمع: die Töchter."},{"de":"das Kind","fa":"بچه / کودک","note":"جمع: die Kinder."},{"de":"die Großmutter","fa":"مادربزرگ","note":"شکل صمیمی: die Oma."},{"de":"der Großvater","fa":"پدربزرگ","note":"شکل صمیمی: der Opa."},{"de":"die Oma","fa":"مامان‌بزرگ","note":"خودمانی‌تر از Großmutter."},{"de":"der Opa","fa":"بابابزرگ","note":"خودمانی‌تر از Großvater."},{"de":"der Onkel","fa":"عمو / دایی","note":"در آلمانی برای هر دو یک کلمه است."},{"de":"die Tante","fa":"عمه / خاله","note":"در آلمانی برای هر دو یک کلمه است."},{"de":"der Cousin","fa":"پسرعمو / پسردایی / پسرخاله / پسرعمه","note":"مؤنث: die Cousine؛ تلفظ واژه فرانسوی‌ریشه است."},{"de":"die Cousine","fa":"دخترعمو / دختردایی / دخترخاله / دخترعمه","note":"مذکر: der Cousin."},{"de":"die Großeltern","fa":"پدربزرگ و مادربزرگ","note":"صورت جمع؛ مانند Eltern."},{"de":"verheiratet","fa":"متأهل","note":"Ich bin verheiratet؛ صفت همراه sein."},{"de":"ledig","fa":"مجرد (در وضعیت تأهل)","note":"در فرم‌های اداری هم می‌آید."},{"de":"alt","fa":"دارای سن / پیر","note":"Wie alt bist du? برای پرسیدن سن."},{"de":"das Alter","fa":"سن","note":"اسم خنثی؛ mit 20 Jahren = در ۲۰سالگی."},{"de":"mein / meine","fa":"مال من","note":"mein Vater ولی meine Mutter و meine Eltern."},{"de":"dein / deine","fa":"مال تو","note":"dein Bruder ولی deine Schwester."},{"de":"sein / seine","fa":"مال او (مذکر)","note":"sein Vater / seine Mutter؛ مالک مرد است."},{"de":"ihr / ihre","fa":"مال او (مؤنث)","note":"ihr Vater / ihre Mutter؛ مالک زن است."},{"de":"das Foto","fa":"عکس","note":"جمع: die Fotos."},{"de":"vermissen","fa":"دلتنگ شدن برای کسی","note":"jemanden vermissen؛ مفعول مستقیم می‌گیرد."},{"de":"telefonieren","fa":"تلفنی حرف زدن","note":"با mit: Ich telefoniere mit meiner Mutter."}]},{"type":"grammar","title":"اعضای خانواده، حرف تعریف و جمع اسم‌ها","body":"در آلمانی هر اسم یک جنس دستوری دارد: der (مذکر)، die (مؤنث) یا das (خنثی). جنس دستوری را باید همراه خودِ واژه یاد گرفت. والدین و خواهر و برادرها در این کاربرد جمع‌اند: die Eltern و die Geschwister. جمع همیشه با die می‌آید، اما شکل اسم ممکن است تغییر کند؛ مثلاً Vater → Väter و Kind → Kinder. اسم‌ها در آلمانی با حرف بزرگ شروع می‌شوند.\nمثال‌ها:\n[[Das ist mein Vater.]] (این پدر من است)؛ [[Meine Mutter heißt Maryam.]] (اسم مادرم مریم است)؛ [[Meine Eltern wohnen im Iran.]] (پدر و مادرم در ایران زندگی می‌کنند)؛ [[Mein Bruder ist Student.]] (برادرم دانشجوست)؛ [[Ich habe zwei Schwestern.]] (من دو خواهر دارم)؛ [[Meine Großeltern sind freundlich.]] (پدربزرگ و مادربزرگم مهربان‌اند)؛ [[Das Kind ist sechs Jahre alt.]] (آن کودک شش سال دارد)."},{"type":"tip","body":"واژه‌های خانواده را همیشه با حرف تعریف حفظ کن: [[der Vater]]، [[die Mutter]]، [[das Kind]]. [[die Eltern]] از نظر دستوری جمع است، پس فعل جمع می‌گیرد."},{"type":"grammar","title":"ضمایر ملکی در Nominativ: mein، dein، sein، ihr","body":"برای گفتن «پدرم» یا «خواهرت» از ضمیر ملکی قبل از اسم استفاده می‌کنیم. در حالت فاعلی (Nominativ)، برای اسم مفرد مذکر و خنثی، شکل بدون -e می‌آید: mein Vater، mein Kind؛ برای مؤنث و جمع، -e اضافه می‌شود: meine Mutter، meine Eltern. دربارهٔ مالک: mein = مال من، dein = مال تو، sein = مال او (مذکر)، ihr = مال او (مؤنث). پس جنسِ مالک تعیین می‌کند sein یا ihr باشد؛ اما پایانِ ضمیر ملکی را جنس و شمارِ اسمِ پس از آن مشخص می‌کند.\nمثال‌ها:\n[[Mein Vater heißt Reza.]] (اسم پدرم رضاست)؛ [[Meine Mutter arbeitet heute.]] (مادرم امروز کار می‌کند)؛ [[Dein Bruder ist zwanzig.]] (برادرت بیست سال دارد)؛ [[Deine Schwester lernt Deutsch.]] (خواهرت آلمانی یاد می‌گیرد)؛ [[Sein Sohn ist noch klein.]] (پسر او [مرد] هنوز کوچک است)؛ [[Ihre Tochter ist in der Schule.]] (دختر او [زن] در مدرسه است)؛ [[Meine Eltern sind zu Hause.]] (پدر و مادرم خانه هستند)."},{"type":"mistakes","items":[{"wrong":"Mein Mutter heißt Sara.","right":"Meine Mutter heißt Sara.","fa":"Mutter مؤنث است؛ در Nominativ باید meine بیاید."},{"wrong":"Meine Bruder ist Student.","right":"Mein Bruder ist Student.","fa":"Bruder مذکر است؛ در Nominativ باید mein بیاید."},{"wrong":"Ich habe zwei Bruder.","right":"Ich habe zwei Brüder.","fa":"جمعِ Bruder در این کاربرد Brüder است و اوملاوت می‌گیرد."}]},{"type":"grammar","title":"پرسیدن سن و داشتن خواهر و برادر","body":"برای پرسیدن سن از Wie alt ...? و برای پاسخ از sein + عدد + Jahre alt استفاده می‌کنیم؛ برخلاف فارسی که می‌گوییم «... سال دارم»، آلمانی می‌گوید «... ساله هستم». برای پرسیدن داشتن خواهر و برادر از Hast du Geschwister? استفاده می‌شود. دقت کن: پس از haben، مفعول در Akkusativ می‌آید؛ بنابراین برای اسم مذکرِ نامعین «einen Bruder» درست است، اما برای مؤنث «eine Schwester». جملهٔ منفیِ داشتن با kein ساخته می‌شود.\nمثال‌ها:\n[[Wie alt bist du?]] (چند سالت است؟)؛ [[Ich bin zwanzig Jahre alt.]] (من بیست ساله‌ام)؛ [[Meine Schwester ist sechzehn.]] (خواهرم شانزده سال دارد)؛ [[Hast du Geschwister?]] (خواهر یا برادر داری؟)؛ [[Ich habe einen Bruder.]] (یک برادر دارم)؛ [[Sie hat eine Schwester.]] (او یک خواهر دارد)؛ [[Ich habe keine Geschwister.]] (من هیچ خواهر یا برادری ندارم)."},{"type":"tip","body":"در آلمانی نگوییم [[Ich habe zwanzig Jahre.]]؛ الگوی درست [[Ich bin zwanzig Jahre alt.]] است. برای خانواده هم [[Hast du Geschwister?]] بسیار رایج‌تر از سؤال‌های طولانی است."},{"type":"text","de":"Auf meinem Schreibtisch ste
