<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>POOF · مسیر یادگیری</title>
<style>
/* ===== tokens (same as main app) ===== */
:root{--bg:#111111;--surface:#1b1814;--text:#f5f1e8;--muted:#b8b0a4;--accent:#e6b96f;--error:#ff8f87;--ok:#9fd8a8;--border:#4a4032;
--r-sm:12px;--r-md:16px;--r-lg:20px;
--sans:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;--serif:ui-serif,Georgia,"Times New Roman",serif;color-scheme:dark}
html[data-theme=snowy]{--bg:#081421;--surface:#10263a;--text:#f3f8fc;--muted:#b8c7d3;--accent:#f3c879;--error:#ff9d9d;--ok:#9fe0c0;--border:#294861}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.75 var(--sans);-webkit-tap-highlight-color:transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 25px/1 var(--serif)}
h1{margin:0;font:600 21px/1.2 var(--serif);letter-spacing:.16em;color:var(--accent)}.sub{color:var(--muted);font-size:14px}
main{max-width:720px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom,0px))}
h2{margin:6px 0 14px;font-size:21px;color:var(--accent)}h3{margin:0 0 10px;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card.tip{border:1.5px dashed var(--accent)}
.mk{display:grid;gap:10px}.mk .wrong{color:#e08080}.mk .right{color:#9fd6a4}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.mute{color:var(--muted)}.sm{font-size:14px}
.de{direction:ltr;unicode-bidi:isolate;font-family:var(--serif)}
div.de{text-align:left}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:700 16px var(--sans);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--accent)}.btn.full{width:100%;margin-top:14px}.btn:disabled{opacity:.5}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* path */
.lesson{display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s}.lesson:hover{border-color:var(--accent)}
.lesson.locked{opacity:.45;cursor:default}.lesson .t{flex:1;min-width:0}.lesson b{display:block;font-size:17px}
.num{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;font:600 21px var(--serif);color:var(--accent);flex:none}
.badge{display:inline-block;padding:0 10px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);font-size:12px;margin-inline-end:8px}
.st{color:var(--muted)}.st.completed{color:var(--ok)}.st.available,.st.in-progress{color:var(--accent)}
/* lesson */
.bub{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;border:1px solid var(--border)}
.bub.a{background:var(--bg);margin-inline-end:auto;border-end-start-radius:4px}.bub.b{background:color-mix(in srgb,var(--accent) 12%,transparent);margin-inline-start:auto;border-end-end-radius:4px}
.bub .de{font-size:18px}
.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}.v:last-child{border:0}
.v .de{font-size:18px;color:var(--accent)}
.gb{white-space:normal;line-height:2}.gb .de{color:var(--accent);font-size:17px}
.read .de{font-size:20px;line-height:2}
/* exercises */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--border)}
.dot.cur{border-color:var(--accent);background:var(--accent)}.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.bad{background:var(--error);border-color:var(--error)}
.q{font-size:19px;margin-bottom:14px}.q .de{color:var(--accent)}
.opt{display:block;width:100%;margin-top:10px;padding:14px 16px;text-align:start;border:1px solid var(--border);border-radius:var(--r-md);background:transparent;color:var(--text);font:500 17px var(--sans);cursor:pointer}
.opt.de{text-align:left}.opt.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.wrong{border-color:var(--error);color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font:17px var(--sans);margin-bottom:6px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 4px}
.fb{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid}.fb.ok{border-color:var(--ok);color:var(--ok)}.fb.bad{border-color:var(--error);color:var(--error)}.fb .de{color:var(--text)}
.score{font:600 58px/1.2 var(--serif);color:var(--accent);text-align:center}.center{text-align:center}
/* floating add-card + sheet + toast */
#selBtn{position:fixed;z-index:50;padding:9px 16px;border-radius:99px;border:0;background:var(--accent);color:var(--bg);font:700 15px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tapPop{position:absolute;z-index:60;min-width:150px;max-width:190px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-pop)}
.w{cursor:pointer;border-bottom:1px dotted var(--muted)}
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sc{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sc label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
#toast{position:fixed;z-index:80;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:10px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--accent);opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="hd"><span class="mark" aria-hidden="true">P</span><div style="flex:1"><h1>POOF</h1><div class="sub">مسیر یادگیری</div></div>
 <button class="btn ghost" id="backApp" aria-label="بازگشت"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button></div></header>
<main id="app"><div class="spin" aria-label="در حال بارگذاری"></div></main>

<button id="selBtn" hidden>+ کارت</button>
<div id="tapPop" hidden></div>
<div id="sheet" hidden><div class="sc">
 <div class="row"><b>کارت جدید</b><button class="x" id="shX" aria-label="بستن">×</button></div>
 <label for="cF">آلمانی</label><input id="cF" dir="ltr" autocomplete="off">
 <label for="cB">معنی فارسی (الزامی)</label><input id="cB" dir="auto" autocomplete="off">
 <label for="cC">جمله‌ی نمونه</label><input id="cC" dir="ltr" autocomplete="off">
 <label for="cD">دسته</label><select id="cD"></select>
 <button class="btn full" id="cS">ذخیره</button>
</div></div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   POOF Learn Path — standalone. Reads shared localStorage "poof_v2".
   Writes ONLY: db.learn (progress) and db.cards (new cards from lessons).
   ===================================================================== */

/* ---------- 1) LESSON DATA (extend by appending objects) ----------
   block types: dialog{lines:[{de,fa}]} · vocab{items:[{de,fa,note}]} · grammar{title,body} · text{de,fa}
   exercise types: mc{q,options,answer(index),why?} · type{q,answer,accept?} · blank{text("___"),answer,accept?,hint?}
   In Persian strings, [[German]] marks LTR German inside the sentence. */
const EN_LESSONS_PART1=[{"id":"en01","order":1,"level":"A1","minutes":12,"title":"سلام و معرفی","titleEn":"Greetings and Introductions","blocks":[{"type":"dialog","lines":[{"de":"Hi! Is this seat free?","fa":"سلام! این صندلی خالیه؟"},{"de":"Yes, it is. Please sit down.","fa":"آره، خالیه. بفرما بشین."},{"de":"Thanks. I'm Ali. What's your name?","fa":"ممنون. من علی‌ام. اسمت چیه؟"},{"de":"I'm Emma. Nice to meet you, Ali.","fa":"من اِما هستم. از آشنایی باهات خوشحالم، علی."},{"de":"Nice to meet you too. Are you a student?","fa":"من هم خوشحالم. دانشجویی؟"},{"de":"Yes, I am. I study English here.","fa":"آره. اینجا انگلیسی می‌خونم."},{"de":"That's great! I'm an English student too.","fa":"عالیه! منم دانشجوی زبان انگلیسی‌ام."},{"de":"Are you from this city?","fa":"اهل همین شهری؟"},{"de":"No, I'm from Iran. What about you?","fa":"نه، اهل ایرانم. تو چطور؟"},{"de":"I'm from Italy, but I live here now.","fa":"من اهل ایتالیا هستم، اما الان اینجا زندگی می‌کنم."},{"de":"Is that your English book?","fa":"اون کتاب انگلیسی مال توئه؟"},{"de":"Yes, it is. Is your class at nine?","fa":"آره. کلاس تو ساعت نُهه؟"},{"de":"Yes! We are in the same class.","fa":"آره! ما توی یه کلاسیم."},{"de":"Perfect. See you tomorrow, Ali!","fa":"عالیه. فردا می‌بینمت، علی!"}]},{"type":"vocab","items":[{"de":"hello","fa":"سلام","note":"کمی خنثی‌تر از hi؛ هم رسمی و هم دوستانه است."},{"de":"hi","fa":"سلام","note":"برای احوالپرسی خودمانی."},{"de":"good morning","fa":"صبح بخیر","note":"معمولاً از صبح تا قبل از ظهر."},{"de":"good afternoon","fa":"بعدازظهر بخیر","note":"از ظهر تا اواخر بعدازظهر."},{"de":"good evening","fa":"عصر بخیر","note":"برای سلام کردن در عصر یا شب."},{"de":"goodbye","fa":"خداحافظ","note":"در گفتار معمولی bye هم می‌گویند."},{"de":"see you","fa":"می‌بینمت","note":"در خداحافظی دوستانه کاربرد دارد."},{"de":"please","fa":"لطفاً","note":"درخواست را مؤدبانه‌تر می‌کند."},{"de":"thank you","fa":"ممنونم","note":"Thanks شکل خودمانی‌تر است."},{"de":"you're welcome","fa":"خواهش می‌کنم","note":"پاسخ رایج به thank you."},{"de":"excuse me","fa":"ببخشید","note":"برای جلب توجه یا پرسیدن سؤال."},{"de":"sorry","fa":"متأسفم / ببخشید","note":"برای عذرخواهی؛ با excuse me فرق دارد."},{"de":"name","fa":"اسم","note":"What is your name? یعنی اسمت چیست؟"},{"de":"student","fa":"دانشجو / دانش‌آموز","note":"با a/an: I am a student."},{"de":"teacher","fa":"معلم","note":"برای زن و مرد یک واژه دارد."},{"de":"class","fa":"کلاس","note":"هم به درس و هم به گروه کلاسی اشاره دارد."},{"de":"classmate","fa":"هم‌کلاسی","note":"My classmate is here."},{"de":"friend","fa":"دوست","note":"جمع آن friends است."},{"de":"seat","fa":"صندلی / جای نشستن","note":"Is this seat free? یعنی اینجا خالیه؟"},{"de":"free","fa":"خالی / آزاد / رایگان","note":"در گفت‌وگو دربارهٔ صندلی یعنی خالی."},{"de":"new","fa":"جدید / تازه‌وارد","note":"I am new here = تازه اینجا آمده‌ام."},{"de":"first","fa":"اول / نخستین","note":"My first day = روز اولم."},{"de":"from","fa":"از / اهل","note":"برای معرفی کشور: I am from Iran."},{"de":"live","fa":"زندگی کردن","note":"I live in Jena = در ینا زندگی می‌کنم."},{"de":"meet","fa":"آشنا شدن / دیدن","note":"Nice to meet you عبارت ثابت است."},{"de":"nice to meet you","fa":"از آشنایی خوشحالم","note":"هنگام آشنایی اولیه استفاده می‌شود."},{"de":"how are you?","fa":"حالت چطوره؟","note":"جواب رایج: I am fine, thanks."},{"de":"same","fa":"یکسان / همان","note":"We are in the same class."}]},{"type":"grammar","title":"فعل to be: شکل مثبت، منفی و کوتاه‌شده","body":"در جمله‌های معرفی، «بودن» را با [[am]]، [[is]] و [[are]] بیان می‌کنیم. با [[I]] از [[am]]، با [[he / she / it]] از [[is]] و با [[you / we / they]] از [[are]] استفاده کن. در انگلیسی بر خلاف فارسی نمی‌توانی «هستم/است» را از جملهٔ کامل حذف کنی. کوتاه‌شده‌ها در گفتار بسیار رایج‌اند: [[I am → I'm]]، [[you are → you're]] و [[she is → she's]].\nمثال‌ها: [[I am Ali.]] (من علی‌ام)؛ [[You are a student.]] (تو دانشجویی)؛ [[She is my teacher.]] (او معلم من است)؛ [[We are happy.]] (ما خوشحالیم)؛ [[They are friends.]] (آن‌ها دوست هستند)؛ [[I am not tired.]] (من خسته نیستم)؛ [[He isn't here.]] (او اینجا نیست)؛ [[We aren't late.]] (ما دیر نکرده‌ایم)."},{"type":"tip","body":"برای معرفی خودت لازم نیست جملهٔ پیچیده بسازی. سه الگوی بسیار کاربردی: [[My name is Ali.]]، [[I am from Iran.]] و [[I live in Jena.]] آن‌ها را با اطلاعات واقعی خودت جایگزین کن."},{"type":"grammar","title":"سؤال‌سازی با be و کلمات پرسشی","body":"برای سؤال بله/خیر، [[am / is / are]] را قبل از فاعل بگذار: [[Are you... ?]]؛ جواب کوتاه، ضمیر و فعل دارد: [[Yes, I am.]] یا [[No, I'm not.]]. برای پرسیدن اسم و زادگاه، [[What]] و [[Where]] را ابتدای سؤال می‌آوریم. [[What about you?]] یعنی «تو چطور؟» و برای برگرداندن همان سؤال به طرف مقابل طبیعی است.\nمثال‌ها: [[Are you a student?]] (دانشجویی؟)؛ [[Yes, I am.]] (بله، هستم)؛ [[Is he your friend?]] (او دوست توست؟)؛ [[No, he isn't.]] (نه، نیست)؛ [[What is your name?]] (اسمت چیه؟)؛ [[Where are you from?]] (اهل کجایی؟)؛ [[How are you today?]] (امروز چطوری؟)؛ [[Is this seat free?]] (این صندلی خالیه؟)."},{"type":"tip","body":"[[Good evening]] برای «سلام» در عصر و شب است؛ اما [[Good night]] معمولاً برای خداحافظی شبانه یا قبل از خواب گفته می‌شود، نه برای شروع دیدار."},{"type":"grammar","title":"a، an و the: معرفی اسم‌ها","body":"برای یک اسم مفردِ قابل‌شمارش و ناشناخته، اغلب [[a]] یا [[an]] لازم است. انتخابشان به «صدا» بستگی دارد نه صرفاً حرف اول: قبل از صدای واکه [[an]] می‌آید، وگرنه [[a]]. برای چیزی که هر دو طرف آن را می‌شناسند [[the]] می‌آید. اسم شغل مفرد هم معمولاً a/an می‌گیرد.\nمثال‌ها: [[I am a student.]] (من دانشجو هستم)؛ [[She is a teacher.]] (او معلم است)؛ [[He is an artist.]] (او هنرمند است)؛ [[This is a book.]] (این یک کتاب است)؛ [[The book is new.]] (آن کتاب جدید است)؛ [[I have an apple.]] (من یک سیب دارم)؛ [[It is an hour.]] (یک ساعت است؛ h تلفظ نمی‌شود)؛ [[She is a university student.]] (او دانشجوست؛ university با صدای «یـ» شروع می‌شود)."},{"type":"mistakes","items":[{"wrong":"I student.","right":"I am a student.","fa":"در انگلیسی هم فعل be و هم حرف تعریف a برای شغل یا نقش مفرد لازم است."},{"wrong":"Are you from Iran? Yes, I'm.","right":"Are you from Iran? Yes, I am.","fa":"در پاسخ کوتاه مثبت، I am را به I'm کوتاه نمی‌کنیم."}]},{"type":"grammar","title":"ضمیرها و صفت‌های ملکی در معرفی","body":"ضمیر فاعلی می‌گوید «چه کسی؟»؛ صفت ملکی می‌گوید «مال چه کسی؟». تفاوت [[I / my]]، [[you / your]]، [[he / his]]، [[she / her]] و [[we / our]] را در جمله ببین. در انگلیسی، صفت ملکی همیشه قبل از اسم می‌آید و با جمع شدن اسم تغییر نمی‌کند.\nمثال‌ها: [[I am Emma.]] (من اِما هستم)؛ [[My name is Emma.]] (اسم من اِماست)؛ [[You are in my class.]] (تو در کلاس من هستی)؛ [[Your book is here.]] (کتابت اینجاست)؛ [[He is my friend.]] (او دوست من است)؛ [[His name is Ali.]] (اسمش علی است)؛ [[Her teacher is nice.]] (معلم او مهربان است)؛ [[Our class is small.]] (کلاس ما کوچک است)."},{"type":"tip","body":"تفاوت تلفظ را از ابتدا جدی بگیر: در [[think]] و [[this]] نوک زبان نزدیک یا بین دندان‌ها قرار می‌گیرد. برای [[wine]] لب‌ها گرد می‌شوند، اما در [[vine]] دندان‌های بالا به لب پایین می‌خورند."},{"type":"text","de":"My name is Ali, and I am a new student in this city. I am from Iran, but I live here now. Today is my first day at an English school. I am a little nervous, but I am happy too. My English book is in my bag. At nine, I am in the classroom. The room is small, and the teacher is very nice. Her name is Ms. Green. She says, 'Good morning, everyone!' We say, 'Good morning!' My seat is next to a girl from Italy. Her name is Emma. She is friendly. I say, 'Hi, I am Ali. Nice to meet you.' She smiles and says, 'Nice to meet you too.' Emma is a student like me. We are in the same class, and our teacher is happy to meet us. At the end of the class, I say, 'Thank you, Ms. Green. Goodbye!' Emma asks, 'Are you here tomorrow?' I say, 'Yes, I am. See you tomorrow!' My first day is good. I am not nervous now. I have a new friend.","fa":"اسم من علی است و در این شهر دانشجوی تازه‌واردی هستم. اهل ایرانم ولی حالا اینجا زندگی می‌کنم. امروز اولین روز من در یک مدرسهٔ زبان انگلیسی است. کمی استرس دارم، اما خوشحال هم هستم. کتاب انگلیسی‌ام در کیفم است. ساعت نه در کلاس هستم. اتاق کوچک است و معلم خیلی مهربان است. اسم او خانم گرین است. می‌گوید: «صبح بخیر، همگی!» ما هم سلام می‌کنیم. جای من کنار دختری از ایتالیاست. اسمش اِماست و برخورد دوستانه‌ای دارد. می‌گویم: «سلام، من علی‌ام، از آشنایی خوشحالم.» او لبخند می‌زند و همین را جواب می‌دهد. اِما هم مثل من دانشجوست. در یک کلاس هستیم و معلم از آشنایی با ما خوشحال است. آخر کلاس می‌گویم: «ممنونم خانم گرین، خداحافظ!» اِما می‌پرسد: «فردا هم می‌آیی؟» می‌گویم: «آره، فردا می‌بینمت!» روز اول خوب پیش می‌رود. دیگر استرس ندارم. یک دوست جدید پیدا کرده‌ام."}],"exercises":[{"type":"mc","q":"برای سلام کردن ساعت ۸ شب کدام مناسب‌تر است؟","options":["Good evening","Good night","Goodbye"],"answer":0,"why":"[[Good evening]] برای شروع دیدار شبانه است؛ [[Good night]] معمولاً هنگام رفتن یا خواب است."},{"type":"mc","q":"جملهٔ درست را انتخاب کن.","options":["She are my teacher.","She is my teacher.","She am my teacher."],"answer":1,"why":"[[She]] با [[is]] صرف می‌شود."},{"type":"type","q":"به انگلیسی بنویس: «من اهل ایران هستم.»","answer":"I am from Iran","accept":["I'm from Iran"]},{"type":"blank","text":"My name ___ Emma.","answer":"is","hint":"فعل be را برای name انتخاب کن."},{"type":"mc","q":"کدام حرف تعریف برای artist صحیح است؟","options":["a artist","an artist","the an artist"],"answer":1,"why":"چون [[artist]] با صدای واکه آغاز می‌شود، [[an]] می‌گیرد."},{"type":"type","q":"به انگلیسی بنویس: «از آشنایی با تو خوشحالم.»","answer":"Nice to meet you","accept":["It's nice to meet you","It is nice to meet you"]},{"type":"blank","text":"___ you a student?","answer":"Are","hint":"در سؤال، فعل be پیش از you قرار می‌گیرد."},{"type":"mc","q":"پاسخ کوتاه درست به «Are you new here?» کدام است؟","options":["Yes, I'm.","Yes, I am.","Yes, I is."],"answer":1,"why":"جواب کوتاه مثبت [[Yes, I am.]] است."},{"type":"type","q":"به انگلیسی بنویس: «اسم تو چیست؟»","answer":"What is your name?","accept":["What's your name?"]},{"type":"blank","text":"This is ___ English book.","answer":"my","hint":"ضمیر ملکیِ «من» را می‌خواهیم."},{"type":"mc","q":"برای پرسیدن اینکه صندلی خالی است کدام طبیعی‌تر است؟","options":["Is this seat free?","This seat is?","Are this seat free?"],"answer":0,"why":"در سؤال با [[is]] جای فعل و فاعل عوض می‌شود."},{"type":"type","q":"به انگلیسی بنویس: «ما در یک کلاس هستیم.»","answer":"We are in the same class","accept":["We're in the same class"]}],"glossary":{"a":"یک","about":"درباره","afternoon":"بعدازظهر","ali":"علی (اسم)","am":"هستم","an":"یک (قبل از صدای واکه)","and":"و","anna":"آنا (اسم)","apple":"سیب","are":"هستند / هستی","asks":"می‌پرسد","at":"در (ساعت / مکان)","bag":"کیف","be":"بودن","book":"کتاب","but":"اما","car":"ماشین","city":"شهر","class":"کلاس","classmate":"هم‌کلاسی","classroom":"کلاس درس","day":"روز","down":"پایین؛ در sit down: نشستن","emma":"اِما (اسم)","end":"پایان","english":"انگلیسی","evening":"عصر","everyone":"همگی","excuse":"عذر خواستن؛ در excuse me: ببخشید","fine":"خوب","first":"اول","free":"خالی / آزاد / رایگان","friend":"دوست","friendly":"خوش‌برخورد / دوستانه","from":"اهل / از","girl":"دختر","good":"خوب","goodbye":"خداحافظ","great":"عالی","green":"گرین (نام خانوادگی) / سبز","happy":"خوشحال","have":"داشتن","he":"او (مذکر)","hello":"سلام","her":"مال او (مونث)","here":"اینجا","hi":"سلام","how":"چطور","i":"من","i'm":"من هستم","in":"در","iran":"ایران","is":"است","it":"آن","italy":"ایتالیا","like":"مانند / دوست داشتن","little":"کمی / کوچک","live":"زندگی کردن","me":"من (مفعولی)","meet":"ملاقات کردن","morning":"صبح","ms":"خانم (عنوان پیش از نام)","my":"مال من","name":"اسم","nervous":"مضطرب","new":"جدید","next":"کنار / بعدی","nice":"خوب / خوشایند","nine":"نُه","no":"نه","not":"نه (نفی)","now":"حالا","of":"از","our":"مال ما","perfect":"عالی / بی‌نقص","please":"لطفاً","red":"قرمز","room":"اتاق","same":"یکسان","sara":"سارا (اسم)","say":"می‌گوییم / گفتن","says":"می‌گوید","school":"مدرسه","seat":"صندلی / جای نشستن","see":"دیدن","she":"او (مونث)","sit":"نشستن","small":"کوچک","smiles":"لبخند می‌زند","sorry":"متأسف / ببخشید","student":"دانش‌آموز","study":"درس خواندن","sun":"خورشید","teacher":"معلم","thank":"تشکر کردن","thanks":"ممنون","that":"آن","that's":"آن است / این عالی است","the":"حرف تعریف معین","think":"فکر کردن","this":"این","tired":"خسته","to":"به / برای","today":"امروز","tomorrow":"فردا","too":"هم","us":"ما را / به ما","very":"خیلی","vest":"جلیقه","vine":"تاک انگور","we":"ما","welcome":"خوش‌آمد / خواهش می‌کنم","west":"غرب","what":"چه","what's":"چیست","wine":"شراب","yes":"بله","you":"تو / شما","you're":"تو هستی / شما هستید","your":"مال تو / شما"}},{"id":"en02","order":2,"level":"A1","minutes":14,"title":"زندگی روزمره","titleEn":"Daily Life","blocks":[{"type":"dialog","lines":[{"de":"Do you live near the school?","fa":"نزدیک مدرسه زندگی می‌کنی؟"},{"de":"Yes, I do. My house is next to the park.","fa":"آره. خونم کنار پارکه."},{"de":"Is it a big house?","fa":"خونهٔ بزرگیه؟"},{"de":"Not really. It's small, but it has a garden.","fa":"نه خیلی. کوچیکه، ولی باغچه داره."},{"de":"How many people are there in your family?","fa":"خانواده‌ات چند نفرن؟"},{"de":"There are four of us: my parents, my sister and me.","fa":"چهار نفریم: پدر و مادرم، خواهرم و من."},{"de":"Have you got a brother?","fa":"برادر هم داری؟"},{"de":"No, I haven't. Have you got any brothers?","fa":"نه، ندارم. تو برادر داری؟"},{"de":"Yes, I've got two brothers. They're both students.","fa":"آره، دو تا برادر دارم. هر دو دانشجو هستن."},{"de":"What time do you get up?","fa":"ساعت چند بیدار می‌شی؟"},{"de":"At half past six. I have breakfast at seven.","fa":"شش و نیم. ساعت هفت صبحونه می‌خورم."},{"de":"Do you walk to school?","fa":"پیاده میری مدرسه؟"},{"de":"Usually, yes. It takes ten minutes.","fa":"معمولاً آره. ده دقیقه طول می‌کشه."},{"de":"Great! See you at eight tomorrow.","fa":"عالیه! فردا ساعت هشت می‌بینمت."}]},{"type":"vocab","items":[{"de":"family","fa":"خانواده","note":"برای تعداد اعضا: people in your family."},{"de":"parents","fa":"پدر و مادر","note":"جمع parent است."},{"de":"mother","fa":"مادر","note":"محاوره‌ای: mum یا mom."},{"de":"father","fa":"پدر","note":"محاوره‌ای: dad."},{"de":"sister","fa":"خواهر","note":"جمع: sisters."},{"de":"brother","fa":"برادر","note":"جمع: brothers."},{"de":"child / children","fa":"کودک / کودکان","note":"جمع child بی‌قاعده و children است."},{"de":"person / people","fa":"فرد / مردم یا افراد","note":"جمع رایج person در این معنا people است."},{"de":"house","fa":"خانه (ساختمان)","note":"با home به معنی «خانه/محل زندگی» فرق دارد."},{"de":"room","fa":"اتاق","note":"There is a room upstairs."},{"de":"garden","fa":"باغ / باغچه","note":"برای فضای سبز کنار خانه."},{"de":"kitchen","fa":"آشپزخانه","note":"اتاق آشپزی در خانه."},{"de":"table","fa":"میز","note":"دو میز: two tables."},{"de":"clock","fa":"ساعت دیواری / رومیزی","note":"ساعت مچی: watch."},{"de":"watch","fa":"ساعت مچی","note":"همچنین فعل «تماشا کردن»."},{"de":"get up","fa":"بلند شدن از خواب","note":"I get up at seven."},{"de":"breakfast","fa":"صبحانه","note":"have breakfast = صبحانه خوردن."},{"de":"lunch","fa":"ناهار","note":"have lunch = ناهار خوردن."},{"de":"dinner","fa":"شام","note":"have dinner = شام خوردن."},{"de":"usually","fa":"معمولاً","note":"قید تکرار؛ معمولاً قبل از فعل اصلی."},{"de":"sometimes","fa":"گاهی","note":"برای عادت‌های غیرهمیشگی."},{"de":"every day","fa":"هر روز","note":"دو کلمه است؛ everyday صفت است."},{"de":"half past","fa":"نیم ساعت بعد از","note":"half past six = ۶:۳۰."},{"de":"quarter past","fa":"ربع گذشته از","note":"quarter past eight = ۸:۱۵."},{"de":"quarter to","fa":"یک ربع مانده به","note":"quarter to nine = ۸:۴۵."},{"de":"near","fa":"نزدیک","note":"near the school = نزدیک مدرسه."},{"de":"behind","fa":"پشت","note":"behind the house = پشت خانه."},{"de":"walk","fa":"پیاده رفتن","note":"walk to school = پیاده به مدرسه رفتن."},{"de":"water","fa":"آب","note":"غیرقابل‌شمارش: some water."},{"de":"money","fa":"پول","note":"غیرقابل‌شمارش: much money، نه many moneys."}]},{"type":"grammar","title":"داشتن: have و have got","body":"در انگلیسی دو ساختار رایج داریم: [[I have a sister.]] و [[I have got a sister.]] هر دو «یک خواهر دارم» معنی می‌دهند. [[have got]] در گفتار بریتانیایی بسیار معمول است؛ [[have]] تنها، در انگلیسی آمریکایی پرکاربردتر است. این دو الگوی سؤال و منفی متفاوت دارند: [[Do you have...?]] / [[I don't have...]] در برابر [[Have you got...?]] / [[I haven't got...]]. برای he/she در حالت خبری [[has]] و [[has got]] می‌آید.\nمثال‌ها: [[I have two brothers.]] (دو برادر دارم)؛ [[I have got a sister.]] (یک خواهر دارم)؛ [[She has a small house.]] (او خانهٔ کوچکی دارد)؛ [[He has got a bike.]] (او دوچرخه دارد)؛ [[Do you have a watch?]] (ساعت مچی داری؟)؛ [[Have you got a watch?]] (ساعت مچی داری؟)؛ [[I don't have a car.]] (ماشین ندارم)؛ [[She hasn't got a car.]] (او ماشین ندارد)."},{"type":"tip","body":"[[I've got]] شکل کوتاه [[I have got]] است. اما [[I have breakfast]] یعنی «صبحانه می‌خورم»، نه «صبحانه را مالک هستم»؛ برای کارهای روزانه، [[have]] معمولاً بدون [[got]] می‌آید."},{"type":"grammar","title":"there is / there are: توصیف آنچه وجود دارد","body":"برای معرفی چیزی در یک مکان از [[There is]] با اسم مفرد و [[There are]] با اسم جمع استفاده کن. [[There is]] با اسم غیرقابل‌شمارش هم به کار می‌رود. سؤال را با [[Is there...?]] یا [[Are there...?]] بساز. در سؤال و منفی معمولاً [[any]] مفید است؛ در جملهٔ مثبت غالباً [[some]] می‌آید. [[There]] در این ساختار الزاماً به معنی «آنجا» نیست.\nمثال‌ها: [[There is a book on the table.]] (روی میز یک کتاب هست)؛ [[There are three chairs.]] (سه صندلی وجود دارد)؛ [[There is some water in the kitchen.]] (کمی آب در آشپزخانه هست)؛ [[Is there a garden?]] (باغچه‌ای هست؟)؛ [[Are there any students here?]] (اینجا دانشجویی هست؟)؛ [[There isn't a bus today.]] (امروز اتوبوسی نیست)؛ [[There aren't any apples.]] (هیچ سیبی نیست)؛ [[There are four people in my family.]] (خانوادهٔ ما چهار نفره است)."},{"type":"mistakes","items":[{"wrong":"There is two books.","right":"There are two books.","fa":"با اسم جمع مثل books باید there are به کار ببری."},{"wrong":"I have got three childs.","right":"I have got three children.","fa":"جمع child بی‌قاعده است: children."}]},{"type":"grammar","title":"جمع اسم‌ها و اسم‌های غیرقابل‌شمارش","body":"بیشتر اسم‌های قابل‌شمارش با [[-s]] جمع بسته می‌شوند. پس از [[s, x, ch, sh]] معمولاً [[-es]] می‌آید؛ بعد از صامت + [[y]]، پایان واژه به [[-ies]] تبدیل می‌شود. چند اسم رایج مثل [[child / children]] و [[person / people]] بی‌قاعده‌اند. واژه‌هایی مثل [[water]] و [[money]] معمولاً قابل‌شمارش نیستند؛ برای مقدار از [[some / much]] استفاده کن.\nمثال‌ها: [[one book, two books]] (یک کتاب، دو کتاب)؛ [[one bus, two buses]] (یک اتوبوس، دو اتوبوس)؛ [[one family, two families]] (یک خانواده، دو خانواده)؛ [[one child, two children]] (یک کودک، دو کودک)؛ [[one man, two men]] (یک مرد، دو مرد)؛ [[one woman, two women]] (یک زن، دو زن)؛ [[some water]] (کمی آب)؛ [[much money]] (پول زیاد)."},{"type":"grammar","title":"حال ساده برای عادت‌ها: do / does و قیدهای تکرار","body":"برای عادت‌ها و برنامهٔ تکراری از حال ساده استفاده می‌کنیم. با [[I / you / we / they]] فعل شکل پایه دارد، ولی با [[he / she / it]] معمولاً [[-s]] یا [[-es]] می‌گیرد. برای سؤال با فعل‌های اصلی از [[do / does]] و برای منفی از [[don't / doesn't]] استفاده می‌کنیم. پس از does و doesn't فعل اصلی دوباره ساده می‌شود. قیدهایی مثل [[usually]] و [[sometimes]] معمولاً پیش از فعل اصلی می‌آیند، اما بعد از be قرار می‌گیرند.\nمثال‌ها: [[I walk to school every day.]] (هر روز پیاده به مدرسه می‌روم)؛ [[She walks to school.]] (او پیاده به مدرسه می‌رود)؛ [[We usually eat at seven.]] (ما معمولاً ساعت هفت غذا می‌خوریم)؛ [[He sometimes reads at night.]] (او گاهی شب‌ها مطالعه می‌کند)؛ [[Do you live here?]] (اینجا زندگی می‌کنی؟)؛ [[Does he have a sister?]] (او خواهر دارد؟)؛ [[I don't work on Sundays.]] (یکشنبه‌ها کار نمی‌کنم)؛ [[She doesn't get up early.]] (او زود بیدار نمی‌شود)."},{"type":"tip","body":"[[How many]] برای چیزهای قابل‌شمارش است: [[How many books?]]؛ [[How much]] برای چیزهای غیرقابل‌شمارش: [[How much water?]]. [[How much is it?]] می‌تواند دربارهٔ قیمت هم باشد."},{"type":"grammar","title":"ساعت و برنامهٔ روزانه","body":"برای پرسیدن زمان بگو [[What time is it?]] یا [[What time do you get up?]]. شکل سادهٔ عددی هم طبیعی است: [[It's six thirty.]]. برای ساعت دقیق [[o'clock]]، برای نیم‌ساعت [[half past]] و برای ربع [[quarter past / quarter to]] کاربرد دارد. ساعت‌ها با [[at]]، روزهای هفته با [[on]] و بخش‌های روز معمولاً با [[in the morning]] بیان می‌شوند؛ استثنا: [[at night]].\nمثال‌ها: [[It is seven o'clock.]] (ساعت هفت است)؛ [[It is half past six.]] (ساعت شش‌ونیم است)؛ [[It is quarter past eight.]] (هشت‌وربع است)؛ [[It is quarter to nine.]] (یک ربع به نُه است)؛ [[I get up at seven.]] (ساعت هفت بیدار می‌شوم)؛ [[We have lunch at twelve.]] (ساعت دوازده ناهار می‌خوریم)؛ [[I study on Monday.]] (دوشنبه درس می‌خوانم)؛ [[She works in the morning.]] (او صبح کار می‌کند)."},{"type":"tip","body":"[[half past six]] یعنی ۶:۳۰؛ در آلمانی [[halb sieben]] نیز همین زمان است. در انگلیسی برای برنامهٔ ثابت، حال ساده به‌کار ببر: [[I get up at seven every day.]]"},{"type":"text","de":"My name is Sara, and I live with my family in a small house near the city centre. There are four people in my family: my father, my mother, my younger brother and me. We have got two bedrooms, a kitchen and a living room. There is a little garden behind the house. My mother has got many flowers there. On school days I get up at half past six. I have breakfast with my brother at seven. We usually eat bread and cheese, and we drink water or tea. At quarter past seven we leave the house. Our school is not far away, so we walk. It takes about fifteen minutes. There are many students in our class, but our teacher knows our names. At twelve we have lunch. In the afternoon I do my homework at the kitchen table. Sometimes my friend Emma comes to our house. We study together and talk about our day. At six o'clock we have dinner with our parents. In the evening I read a book or listen to music. I go to bed at ten. I like our simple routine.","fa":"اسم من ساراست و با خانواده‌ام در خانه‌ای کوچک نزدیک مرکز شهر زندگی می‌کنم. خانواده‌ام چهار نفر است: پدر، مادر، برادر کوچک‌ترم و من. دو اتاق‌خواب، آشپزخانه و نشیمن داریم. پشت خانه باغچهٔ کوچکی هست که مادرم در آن گل‌های زیادی دارد. روزهای مدرسه شش‌ونیم بیدار می‌شوم. ساعت هفت با برادرم صبحانه می‌خورم. معمولاً نان و پنیر می‌خوریم و آب یا چای می‌نوشیم. هفت‌وربع از خانه بیرون می‌رویم. مدرسه دور نیست و پیاده می‌رویم. حدود پانزده دقیقه طول می‌کشد. در کلاس دانش‌آموزان زیادی هستند، اما معلم اسم‌هایمان را می‌داند. ساعت دوازده ناهار می‌خوریم. بعدازظهر پشت میز آشپزخانه تکلیفم را انجام می‌دهم. گاهی دوستم اِما به خانهٔ ما می‌آید. با هم درس می‌خوانیم و دربارهٔ روزمان حرف می‌زنیم. ساعت شش با پدر و مادر شام می‌خوریم. عصر کتاب می‌خوانم یا موسیقی گوش می‌دهم. ساعت ده می‌خوابم. برنامهٔ سادهٔ روزمره‌مان را دوست دارم."}],"exercises":[{"type":"mc","q":"کدام جمله از نظر تعداد درست است؟","options":["There is three chairs.","There are three chairs.","There am three chairs."],"answer":1,"why":"[[chairs]] جمع است، پس [[there are]] درست است."},{"type":"blank","text":"She ___ got two sisters.","answer":"has","hint":"برای she شکل [[has got]] به کار می‌رود."},{"type":"type","q":"به انگلیسی بنویس: «من دو برادر دارم.»","answer":"I have two brothers","accept":["I have got two brothers","I've got two brothers"]},{"type":"mc","q":"جمع درست child چیست؟","options":["childs","childes","children"],"answer":2,"why":"[[child → children]] جمع بی‌قاعده دارد."},{"type":"blank","text":"There ___ a garden behind the house.","answer":"is","hint":"garden مفرد است."},{"type":"type","q":"به انگلیسی بنویس: «آیا نزدیک اینجا مدرسه‌ای هست؟»","answer":"Is there a school near here?"},{"type":"mc","q":"[[half past seven]] کدام ساعت است؟","options":["۷:۳۰","۶:۳۰","۷:۱۵"],"answer":0,"why":"[[half past seven]] = سی دقیقه گذشته از هفت."},{"type":"blank","text":"I get up ___ six every day.","answer":"at","hint":"برای زمان دقیق از [[at]] استفاده کن."},{"type":"mc","q":"کدام سؤال دربارهٔ تعداد کتاب‌ها درست است؟","options":["How much books are there?","How many books are there?","How many water is there?"],"answer":1,"why":"[[books]] قابل‌شمارش است و [[many]] می‌گیرد."},{"type":"type","q":"به انگلیسی بنویس: «در خانوادهٔ من چهار نفر هستند.»","answer":"There are four people in my family"},{"type":"blank","text":"There aren't ___ apples in the kitchen.","answer":"any","hint":"در جملهٔ منفی برای تعداد نامشخص از any استفاده می‌کنیم."},{"type":"type","q":"به انگلیسی بنویس: «من هر روز ساعت هفت صبحانه می‌خورم.»","answer":"I have breakfast at seven every day","accept":["Every day I have breakfast at seven","I eat breakfast at seven every day"]}],"glossary":{"a":"یک","about":"حدود / درباره","afternoon":"بعدازظهر","and":"و","any":"هیچ / مقداری","are":"هستند","at":"در ساعت","away":"دور","bank":"بانک","bed":"تخت خواب","bedrooms":"اتاق‌خواب‌ها","behind":"پشت","big":"بزرگ","book":"کتاب","books":"کتاب‌ها","both":"هر دو","boy":"پسر","bread":"نان","breakfast":"صبحانه","brother":"برادر","brothers":"برادرها","bus":"اتوبوس","but":"اما","car":"ماشین","centre":"مرکز","cheese":"پنیر","child":"کودک","children":"کودکان","city":"شهر","class":"کلاس","clock":"ساعت دیواری","comes":"می‌آید","day":"روز","days":"روزها","dinner":"شام","do":"انجام دادن / فعل کمکی سؤال","drink":"نوشیدن","eat":"خوردن","eight":"هشت","emma":"اِما (اسم)","evening":"عصر / شب","every":"هر","family":"خانواده","far":"دور","father":"پدر","feet":"پاها","fifteen":"پانزده","five":"پنج","flowers":"گل‌ها","foot":"پا","four":"چهار","friend":"دوست","garden":"باغچه","get":"گرفتن؛ get up: بیدار شدن","girl":"دختر","go":"رفتن","got":"(در have got: داشتن)","great":"عالی","half":"نیم","has":"دارد","have":"داشتن","haven't":"ندارم / نداشته‌ام","here":"اینجا","homework":"تکلیف","house":"خانه","how":"چطور / چند","i":"من","i've":"من دارم / داشته‌ام","in":"در","is":"است","it":"آن","it's":"آن است","kitchen":"آشپزخانه","knows":"می‌داند","leave":"ترک کردن","like":"دوست داشتن","listen":"گوش دادن","little":"کوچک / اندک","live":"زندگی کردن","living":"زندگی کردن؛ در living room: نشیمن","lunch":"ناهار","man":"مرد","many":"تعداد زیاد / چند","me":"من را / من","men":"مردها","minutes":"دقیقه‌ها","money":"پول","mother":"مادر","much":"زیاد","music":"موسیقی","my":"مال من","name":"نام / اسم","names":"اسم‌ها","near":"نزدیک","next":"کنار / بعدی","no":"نه","not":"نه (نفی)","o'clock":"ساعت تمام","of":"از","on":"در / روی","or":"یا","our":"مال ما","parents":"پدر و مادر","park":"پارک","past":"گذشته از","people":"افراد","person":"فرد","quarter":"ربع","read":"خواندن","really":"واقعاً","red":"قرمز","room":"اتاق","routine":"برنامهٔ روزانه","sara":"سارا (اسم)","school":"مدرسه","see":"دیدن","seven":"هفت","simple":"ساده","sister":"خواهر","six":"شش","small":"کوچک","so":"پس / بنابراین","sometimes":"گاهی","students":"دانش‌آموزان / دانشجویان","study":"درس خواندن","table":"میز","takes":"طول می‌کشد","talk":"حرف زدن","tea":"چای","teacher":"معلم","teeth":"دندان‌ها","ten":"ده","the":"حرف تعریف معین","there":"وجود دارد / آنجا","they're":"آن‌ها هستند","three":"سه","time":"زمان / ساعت","to":"به / مانده به","today":"امروز","together":"با هم","tomorrow":"فردا","tooth":"دندان","twelve":"دوازده","two":"دو","up":"بالا","us":"ما","usually":"معمولاً","very":"خیلی","walk":"پیاده رفتن","watch":"ساعت مچی / تماشا کردن","water":"آب","we":"ما","what":"چه","with":"با","woman":"زن","women":"زن‌ها","yes":"بله","you":"تو / شما","younger":"کوچک‌تر / کم‌سن‌تر","your":"مال تو"}},{"id":"en03","order":3,"level":"A2","minutes":15,"title":"گذشته‌ی ساده","titleEn":"Past Simple","blocks":[{"type":"dialog","lines":[{"de":"Hey, Ali! How was your weekend?","fa":"سلام علی! آخر هفته‌ات چطور بود؟"},{"de":"Really good. I went to the lake with my brother.","fa":"خیلی خوب. با برادرم رفتم دریاچه."},{"de":"Nice! Did you go by bus?","fa":"چه خوب! با اتوبوس رفتی؟"},{"de":"No, we took the train. It was faster.","fa":"نه، قطار سوار شدیم. سریع‌تر بود."},{"de":"What did you do there?","fa":"اونجا چیکار کردید؟"},{"de":"We walked by the water and took some photos.","fa":"کنار آب قدم زدیم و چند تا عکس گرفتیم."},{"de":"Did you swim in the lake?","fa":"توی دریاچه شنا کردید؟"},{"de":"No, we didn't. The water was too cold.","fa":"نه، شنا نکردیم. آب خیلی سرد بود."},{"de":"Did you eat lunch there?","fa":"اونجا ناهار خوردید؟"},{"de":"Yes, we ate sandwiches at a small cafe.","fa":"آره، توی یه کافهٔ کوچیک ساندویچ خوردیم."},{"de":"What time did you come home?","fa":"کی برگشتید خونه؟"},{"de":"We came back at eight. I was tired!","fa":"ساعت هشت برگشتیم. خیلی خسته بودم!"},{"de":"Did you enjoy the trip?","fa":"از گردش خوش‌تون اومد؟"},{"de":"Absolutely! We had a great day.","fa":"صددرصد! روز خیلی خوبی داشتیم."}]},{"type":"vocab","items":[{"de":"yesterday","fa":"دیروز","note":"قید مشخص گذشته؛ اغلب Past Simple می‌خواهد."},{"de":"last night","fa":"دیشب","note":"last + بازهٔ زمانیِ گذشته."},{"de":"last weekend","fa":"آخر هفتهٔ گذشته","note":"برای صحبت دربارهٔ اتفاق تمام‌شده."},{"de":"two days ago","fa":"دو روز پیش","note":"ago بعد از فاصلهٔ زمانی می‌آید."},{"de":"go → went","fa":"رفتن → رفت","note":"بی‌قاعده؛ بعد از did از go استفاده می‌شود."},{"de":"come → came","fa":"آمدن → آمد","note":"come home / came home."},{"de":"take → took","fa":"گرفتن → گرفت","note":"take photos = عکس گرفتن."},{"de":"eat → ate","fa":"خوردن → خورد","note":"I ate lunch yesterday."},{"de":"drink → drank","fa":"نوشیدن → نوشید","note":"drink water / drank water."},{"de":"see → saw","fa":"دیدن → دید","note":"I saw a film."},{"de":"buy → bought","fa":"خریدن → خرید","note":"I bought a ticket."},{"de":"have → had","fa":"داشتن → داشت","note":"We had a good day."},{"de":"do → did","fa":"انجام دادن → انجام داد","note":"در سؤال کمکیِ گذشته هم هست."},{"de":"get → got","fa":"گرفتن / رسیدن → گرفت / رسید","note":"get home → got home."},{"de":"wake up → woke up","fa":"بیدار شدن → بیدار شد","note":"I woke up early."},{"de":"sleep → slept","fa":"خوابیدن → خوابید","note":"I slept well."},{"de":"write → wrote","fa":"نوشتن → نوشت","note":"I wrote a message."},{"de":"meet → met","fa":"دیدار کردن → دیدار کرد","note":"I met a friend."},{"de":"leave → left","fa":"ترک کردن → ترک کرد","note":"We left at nine."},{"de":"play → played","fa":"بازی کردن → بازی کرد","note":"باقاعده: -ed."},{"de":"work → worked","fa":"کار کردن → کار کرد","note":"پسوند -ed اینجا صدای t می‌دهد."},{"de":"watch → watched","fa":"تماشا کردن → تماشا کرد","note":"در گذشته با -ed."},{"de":"visit → visited","fa":"بازدید کردن → بازدید کرد","note":"بعد از t، -ed شبیه id تلفظ می‌شود."},{"de":"study → studied","fa":"درس خواندن → درس خواند","note":"y پس از صامت به i تبدیل می‌شود."},{"de":"stop → stopped","fa":"ایستادن → ایستاد","note":"حرف آخر دو برابر می‌شود."},{"de":"was / were","fa":"بود / بودند","note":"I/he/she/it was؛ you/we/they were."},{"de":"trip","fa":"سفر / گردش","note":"go on a trip = سفر رفتن."},{"de":"lake","fa":"دریاچه","note":"by the lake = کنار دریاچه."},{"de":"ticket","fa":"بلیت","note":"buy a ticket = بلیت خریدن."},{"de":"photo","fa":"عکس","note":"take a photo = عکس گرفتن."}]},{"type":"grammar","title":"گذشتهٔ سادهٔ افعال باقاعده و تلفظ -ed","body":"برای عملی که در گذشته شروع و تمام شده است، در جملهٔ خبری فعل باقاعده معمولاً [[-ed]] می‌گیرد. اگر فعل به [[e]] ختم شود، فقط [[-d]] اضافه می‌کنیم؛ صامت + [[y]] معمولاً به [[-ied]] تبدیل می‌شود؛ و بعضی افعال کوتاه مثل [[stop]] حرف آخر را دو برابر می‌کنند. پسوند [[-ed]] سه تلفظ /t/، /d/ و /ɪd/ دارد و همیشه «اِد» خوانده نمی‌شود.\nمثال‌ها: [[I played football yesterday.]] (دیروز فوتبال بازی کردم)؛ [[She worked last Saturday.]] (او شنبهٔ قبل کار کرد)؛ [[We watched a film.]] (فیلم دیدیم)؛ [[He visited his grandmother.]] (او به دیدن مادربزرگش رفت)؛ [[I studied English.]] (انگلیسی خواندم)؛ [[The bus stopped here.]] (اتوبوس اینجا ایستاد)؛ [[They lived in London.]] (آن‌ها در لندن زندگی می‌کردند)؛ [[It rained last night.]] (دیشب باران بارید)."},{"type":"tip","body":"پسوند [[-ed]] سه تلفظ دارد: در [[worked]] صدای /t/، در [[played]] صدای /d/ و در [[wanted]] صدای /ɪd/. هر سه را یک‌جور «اِد» نخوان."},{"type":"grammar","title":"گذشتهٔ افعال بی‌قاعده","body":"افعال پرکاربردی مثل [[go]] و [[eat]] از قانون -ed پیروی نمی‌کنند. شکل گذشتهٔ آن‌ها را بهتر است همراه با یک جملهٔ کامل یاد بگیری. بعد از [[did]]، فعل اصلی به شکل پایه برمی‌گردد؛ شکل بی‌قاعده فقط در جملهٔ خبری بدون did لازم است.\nمثال‌ها: [[I went to the park.]] (به پارک رفتم)؛ [[We ate lunch at one.]] (ساعت یک ناهار خوردیم)؛ [[She came home late.]] (او دیر به خانه آمد)؛ [[He bought a new book.]] (او کتاب جدیدی خرید)؛ [[They saw a beautiful lake.]] (آن‌ها دریاچهٔ زیبایی دیدند)؛ [[I took some photos.]] (چند عکس گرفتم)؛ [[My brother drank tea.]] (برادرم چای نوشید)؛ [[We had a great time.]] (خیلی خوش گذشت)."},{"type":"grammar","title":"سؤال و منفی با did / didn't","body":"برای بیشتر افعال، سؤال گذشته با [[Did + فاعل + شکل پایهٔ فعل]] و منفی با [[did not / didn't + شکل پایهٔ فعل]] ساخته می‌شود. [[did]] خودش نشانهٔ گذشته است، پس فعل اصلی را دوباره گذشته نکن. در سؤال‌هایی مثل [[What did you do?]]، واژهٔ پرسشی قبل از did می‌آید. پاسخ کوتاه: [[Yes, I did.]] و [[No, I didn't.]].\nمثال‌ها: [[Did you go to school?]] (مدرسه رفتی؟)؛ [[Yes, I did.]] (بله، رفتم)؛ [[No, I didn't.]] (نه، نرفتم)؛ [[I didn't go yesterday.]] (دیروز نرفتم)؛ [[Did she buy a ticket?]] (بلیت خرید؟)؛ [[He didn't eat lunch.]] (او ناهار نخورد)؛ [[What did you see?]] (چه دیدی؟)؛ [[When did they arrive?]] (کی رسیدند؟)."},{"type":"mistakes","items":[{"wrong":"Did you went to the park?","right":"Did you go to the park?","fa":"وقتی did داریم، فعل اصلی حتماً به شکل ساده برمی‌گردد."},{"wrong":"I didn't watched the film.","right":"I didn't watch the film.","fa":"بعد از didn't پسوند -ed روی فعل اصلی نمی‌ماند."}]},{"type":"grammar","title":"was / were و نشانه‌های زمان گذشته","body":"گذشتهٔ فعل be با [[was]] برای [[I / he / she / it]] و [[were]] برای [[you / we / they]] ساخته می‌شود. در سؤال آن‌ها را جا‌به‌جا کن: [[Were you tired?]]. برخلاف فعل‌های دیگر، برای سؤال و منفیِ be به did نیازی نیست. قیدهایی مثل [[yesterday]]، [[last weekend]] و [[two days ago]] به گذشتهٔ تمام‌شده اشاره می‌کنند. در انگلیسی با زمان گذشتهٔ مشخص، [[Past Simple]] به‌کار می‌رود؛ این با Perfekt رایج در گفتار آلمانی یکسان نیست.\nمثال‌ها: [[I was tired yesterday.]] (دیروز خسته بودم)؛ [[We were at home.]] (ما خانه بودیم)؛ [[Was she happy?]] (خوشحال بود؟)؛ [[They weren't late.]] (آن‌ها دیر نکردند)؛ [[I went there two days ago.]] (دو روز پیش آنجا رفتم)؛ [[She visited us last week.]] (هفتهٔ پیش به دیدن ما آمد)؛ [[We watched the match on Sunday.]] (یکشنبه مسابقه را دیدیم)؛ [[I saw him yesterday.]] (دیروز او را دیدم)."},{"type":"tip","body":"قانون کاربردی: [[I saw him yesterday.]] درست است، اما [[I have seen him yesterday.]] در انگلیسی معیار درست نیست؛ چون [[yesterday]] به زمان تمام‌شدهٔ مشخص اشاره می‌کند. این تفاوت را هنگام ترجمه از Perfekt آلمانی در نظر بگیر."},{"type":"text","de":"Last Saturday my brother and I went to a small town near a lake. We woke up early and had breakfast at seven. I made sandwiches, and my brother bought two train tickets online. We left home at eight and took the train. The weather was cold, but the sky was clear. When we arrived, we walked through the town and saw an old bridge. We took many photos because the view was beautiful. At noon we sat by the lake and ate our sandwiches. We wanted to swim, but the water was too cold, so we didn't go in. After lunch we visited a little museum. I learned something new about the town, and my brother bought a postcard for our mother. Later, we met two friends at a cafe. They ordered tea, and we drank hot chocolate. We talked about school and laughed a lot. At six we went back to the station, but our train was late. We waited for thirty minutes. We came home at nine. I was tired, but I didn't regret the trip. On Sunday I stayed at home, looked at the photos and wrote a short message to our friends. It was a wonderful weekend.","fa":"شنبهٔ گذشته من و برادرم به شهری کوچک نزدیک دریاچه رفتیم. زود بیدار شدیم و ساعت هفت صبحانه خوردیم. من ساندویچ درست کردم و برادرم دو بلیت قطار را اینترنتی خرید. ساعت هشت از خانه بیرون رفتیم و قطار گرفتیم. هوا سرد بود، اما آسمان صاف بود. وقتی رسیدیم، در شهر قدم زدیم و پلی قدیمی دیدیم. چون منظره زیبا بود، عکس‌های زیادی گرفتیم. ظهر کنار دریاچه نشستیم و ساندویچ خوردیم. می‌خواستیم شنا کنیم، اما آب خیلی سرد بود و وارد دریاچه نشدیم. پس از ناهار از موزهٔ کوچکی دیدن کردیم. من چیز تازه‌ای دربارهٔ شهر یاد گرفتم و برادرم برای مادرمان کارت‌پستال خرید. بعد با دو دوست در کافه دیدار کردیم. آن‌ها چای سفارش دادند و ما شکلات داغ خوردیم. دربارهٔ مدرسه حرف زدیم و زیاد خندیدیم. ساعت شش به ایستگاه برگشتیم، ولی قطار دیر کرد. سی دقیقه صبر کردیم. ساعت نُه به خانه رسیدیم. خسته بودم، اما از سفر پشیمان نشدم. یکشنبه در خانه ماندم، عکس‌ها را دیدم و پیام کوتاهی برای دوستانمان نوشتم. آخر هفتهٔ فوق‌العاده‌ای بود."}],"exercises":[{"type":"mc","q":"گذشتهٔ فعل go چیست؟","options":["goed","went","gone"],"answer":1,"why":"[[go → went]] شکل گذشتهٔ ساده است."},{"type":"blank","text":"We ___ a film last night.","answer":"watched","hint":"فعل باقاعدهٔ watch را در گذشته بنویس."},{"type":"type","q":"به انگلیسی بنویس: «دیروز به پارک رفتم.»","answer":"I went to the park yesterday","accept":["Yesterday I went to the park"]},{"type":"mc","q":"کدام سؤال درست است؟","options":["Did she bought a ticket?","Did she buy a ticket?","Did she buys a ticket?"],"answer":1,"why":"بعد از [[did]] فعل پایهٔ [[buy]] می‌آید."},{"type":"blank","text":"I ___ not go to school yesterday.","answer":"did","hint":"در گذشتهٔ سادهٔ منفی برای فعل go، کمکی did لازم است."},{"type":"type","q":"به انگلیسی بنویس: «ما ناهار نخوردیم.»","answer":"We didn't eat lunch","accept":["We did not eat lunch","We didn't have lunch","We did not have lunch"]},{"type":"mc","q":"کدام جمله دربارهٔ دیروز درست است؟","options":["I have seen him yesterday.","I saw him yesterday.","I see him yesterday."],"answer":1,"why":"[[yesterday]] زمان مشخص گذشته است؛ از Past Simple استفاده کن."},{"type":"blank","text":"They ___ tired after the trip.","answer":"were","hint":"فاعل they است؛ گذشتهٔ be را انتخاب کن."},{"type":"type","q":"به انگلیسی بنویس: «ساعت چند به خانه برگشتی؟»","answer":"What time did you come home?","accept":["When did you come home?","What time did you get home?"]},{"type":"mc","q":"کدام فعل باقاعده از نظر نوشتن درست است؟","opt
