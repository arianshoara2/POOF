ht ein Foto. Das ist meine Familie. Mein Vater heißt Reza und meine Mutter heißt Maryam. Sie wohnen im Iran. Mein Vater arbeitet viel, aber am Abend ist er gern zu Hause. Meine Mutter liest gern und telefoniert oft mit mir. Ich habe zwei Geschwister: einen Bruder und eine Schwester. Mein Bruder heißt Ali. Er ist zwanzig Jahre alt und studiert. Meine Schwester Sara ist sechzehn. Sie geht noch zur Schule und lernt Deutsch. Auf dem Foto steht Ali neben meinem Vater. Sara steht neben meiner Mutter. Ich stehe in der Mitte. Meine Großeltern sind nicht auf dem Foto. Sie wohnen in einer anderen Stadt. Meine Oma kocht gern, und mein Opa hört oft Musik. Ich habe auch einen Onkel und eine Tante. Meine Tante hat eine Tochter. Sie ist meine Cousine. Heute wohne ich in Jena und meine Familie ist weit weg. Manchmal vermisse ich sie. Aber wir telefonieren fast jeden Abend. Meine Mutter fragt immer: „Wie geht es dir?“ Ich antworte: „Mir geht es gut.“ Dann erzählen wir von unserem Tag. Das Foto auf meinem Tisch macht mich glücklich.","fa":"روی میز تحریرم یک عکس است؛ عکس خانواده‌ام. اسم پدرم رضاست و اسم مادرم مریم. آن‌ها در ایران زندگی می‌کنند. پدرم زیاد کار می‌کند ولی عصرها دوست دارد در خانه باشد. مادرم خواندن را دوست دارد و زیاد با من تلفنی حرف می‌زند. دو خواهر و برادر دارم: برادری به نام علی که بیست ساله و دانشجوست، و خواهری به نام سارا که شانزده سال دارد، به مدرسه می‌رود و آلمانی یاد می‌گیرد. در عکس، علی کنار پدرم است، سارا کنار مادرم و من وسط ایستاده‌ام. پدربزرگ و مادربزرگم در عکس نیستند؛ در شهر دیگری زندگی می‌کنند. مادربزرگم آشپزی دوست دارد و پدربزرگم اغلب موسیقی گوش می‌دهد. عمو یا دایی و عمه یا خاله هم دارم. دخترِ خاله یا عمه‌ام دخترخاله یا دخترعمه‌ام می‌شود. حالا من در ینا زندگی می‌کنم و خانواده‌ام دورند. گاهی دلم برایشان تنگ می‌شود، اما تقریباً هر عصر تلفنی حرف می‌زنیم. مادرم همیشه می‌پرسد حالم چطور است و من جواب می‌دهم خوبم. بعد دربارهٔ روزمان حرف می‌زنیم. عکس روی میزم خوشحالم می‌کند."},{"type":"tip","body":"برای معرفی اعضای خانواده با اشاره به عکس، از [[Das ist ...]] برای مفرد و [[Das sind ...]] برای جمع استفاده کن: [[Das sind meine Eltern.]] (این‌ها پدر و مادرم هستند)."}],"exercises":[{"type":"mc","q":"کدام جمله درست است؟","options":["Mein Mutter heißt Maryam.","Meine Mutter heißt Maryam.","Meinen Mutter heißt Maryam."],"answer":1,"why":"[[die Mutter]] مؤنث است؛ در حالت فاعلی باید [[meine]] بیاید."},{"type":"mc","q":"برای گفتن «پدر و مادرم» کدام درست است؟","options":["mein Eltern","meine Eltern","meinen Eltern"],"answer":1,"why":"[[Eltern]] جمع است؛ در حالت فاعلی از [[meine]] استفاده می‌شود."},{"type":"blank","text":"Das ist ___ Schwester. (خواهر تو)","answer":"deine"},{"type":"type","q":"به آلمانی بنویس: «برادرم بیست سال دارد.»","answer":"Mein Bruder ist zwanzig Jahre alt.","accept":["Mein Bruder ist zwanzig Jahre alt","Mein Bruder ist 20 Jahre alt.","Mein Bruder ist 20 Jahre alt"]},{"type":"mc","q":"«عمو» و «دایی» هر دو در آلمانی معمولاً چه می‌شوند؟","options":["der Opa","der Onkel","der Cousin"],"answer":1,"why":"[[der Onkel]] برای عمو و دایی هر دو کاربرد دارد."},{"type":"blank","text":"Ich habe einen ___ . (برادر)","answer":"Bruder","hint":"بعد از einen، نام عضو خانواده را با حرف بزرگ بنویس."},{"type":"type","q":"به آلمانی بنویس: «من یک خواهر دارم.»","answer":"Ich habe eine Schwester.","accept":["Ich habe eine Schwester"]},{"type":"mc","q":"پاسخ درست به [[Wie alt bist du?]] کدام است؟","options":["Ich habe zwanzig Jahre.","Ich bin zwanzig Jahre alt.","Ich heißt zwanzig."],"answer":1,"why":"در آلمانی سن را معمولاً با [[sein]] بیان می‌کنیم، نه haben."},{"type":"blank","text":"Meine Eltern ___ im Iran.","answer":"wohnen","hint":"Eltern جمع است؛ فعل با آن جمع صرف می‌شود."},{"type":"type","q":"به آلمانی بنویس: «اسم پدرم رضاست.»","answer":"Mein Vater heißt Reza.","accept":["Mein Vater heißt Reza","Mein Vater heisst Reza.","Mein Vater heisst Reza"]},{"type":"mc","q":"کدام جمله به معنی «هیچ خواهر یا برادری ندارم» است؟","options":["Ich habe keine Geschwister.","Ich bin keine Geschwister.","Ich habe kein Geschwister."],"answer":0,"why":"[[Geschwister]] جمع است و همراه منفیِ ملکیِ این جمله، [[keine]] می‌آید."},{"type":"blank","text":"Wie ___ ist deine Schwester?","answer":"alt"}],"glossary":{"abend":"عصر / شب","aber":"اما","ali":"علی (اسم)","alt":"ساله / مسن","alter":"سن","am":"در / کنار (an dem)","anderen":"دیگر / متفاوت","antworte":"پاسخ می‌دهم","arbeitet":"کار می‌کند","auch":"هم / نیز","auf":"روی / به","bruder":"برادر","cousin":"پسرعمو / پسرخاله / پسردایی / پسرعمه","cousine":"دخترعمو / دخترخاله / دخترعمه / دختردایی","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dein":"مال تو (مذکر/خنثی)","deine":"مال تو (مؤنث/جمع)","dem":"حرف تعریف داتیو مذکر/خنثی","der":"حرف تعریف مذکر","deutsch":"زبان آلمانی","die":"حرف تعریف مؤنث / جمع","dir":"به تو / برای تو","du":"تو","ein":"یک (مذکر/خنثی)","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","einer":"یک (مؤنث/داتیو)","eltern":"والدین","er":"او (مذکر)","erzählen":"تعریف‌کردن / روایت‌کردن","es":"آن","familie":"خانواده","fast":"تقریباً","foto":"عکس","fragt":"می‌پرسد","für":"برای","geht":"می‌رود / پیش می‌رود","gern":"با میل / دوست داشتن","geschwister":"خواهر و برادرها","glücklich":"خوشحال","großeltern":"پدربزرگ و مادربزرگ","großmutter":"مادربزرگ","großvater":"پدربزرگ","gut":"خوب","habe":"دارم","hast":"داری","hat":"دارد","hause":"خانه (در zu Hause)","heißen":"نام داشتن / نام دارند","heißt":"نام دارد / اسمش ... است","heute":"امروز","hier":"اینجا","hört":"می‌شنود","ich":"من","ihr":"شماها / مال او (مؤنث)","ihre":"مال او (مؤنث) / مال شما","im":"در / درونِ","immer":"همیشه","in":"در","iran":"ایران","ist":"است","ja":"بله","jahre":"سال (جمع)","jeden":"هر (مفعولی مذکر)","jena":"ینا (شهر)","kind":"بچه","kocht":"آشپزی می‌کند","ledig":"مجرد","lernt":"یاد می‌گیرد","liest":"می‌خواند","macht":"می‌کند / می‌سازد","manchmal":"گاهی","maryam":"مریم (اسم)","mein":"مال من (مذکر/خنثی)","meine":"مال من (مؤنث/جمع)","meinem":"مال من (داتیو مذکر/خنثی)","meiner":"مال من (داتیو مؤنث/ملکی)","mich":"من (مفعولی)","mir":"به من / برای من","mit":"با","miteinander":"با یکدیگر","mitte":"وسط","musik":"موسیقی","mutter":"مادر","natürlich":"البته / حتماً","neben":"کنار","nein":"نه","nicht":"نه / نفی","noch":"هنوز / دیگر","oft":"اغلب","oh":"اوه","oma":"مادربزرگ","onkel":"عمو / دایی","opa":"پدربزرگ","reza":"رضا (اسم)","sara":"سارا (اسم)","schreibtisch":"میز تحریر","schule":"مدرسه","schwester":"خواهر","schön":"زیبا / خوب","sechzehn":"شانزده","sein":"مال او (مذکر) / بودن","seine":"مال او (مذکر)، مؤنث/جمع","sie":"او / آن‌ها / شما (با توجه به متن)","sind":"هستند / هستیم / هستید","sohn":"پسر (فرزند)","stadt":"شهر","stehe":"ایستاده‌ام","steht":"ایستاده است / قرار دارد","studiert":"تحصیل می‌کند","tag":"روز","tante":"عمه / خاله","telefonieren":"تلفن‌زدن","telefoniert":"تلفن می‌زند","tisch":"میز","tochter":"دختر (فرزند)","und":"و","unserem":"مال ما (داتیو مذکر/خنثی)","vater":"پدر","verheiratet":"متأهل","vermisse":"دلتنگ می‌شوم","vermissen":"دلتنگ‌شدن برای کسی","vermisst":"دلتنگ می‌شود / دلت تنگ می‌شود","viel":"زیاد","von":"از","was":"چه / چی","weg":"دور / رفته","weit":"دور","wie":"چگونه / چطور / چه","wir":"ما","wohne":"ساکنم","wohnen":"ساکن‌اند / زندگی می‌کنند","wohnt":"ساکن است","zu":"به / در خانهٔ","zur":"به (zu der)","zwanzig":"بیست","zwei":"دو"}},{"id":"l04","order":4,"level":"A2","minutes":18,"title":"خرید و قیمت","titleDe":"Einkaufen und Preise","blocks":[{"type":"dialog","lines":[{"de":"Guten Morgen! Was darf es für Sie sein?","fa":"صبح بخیر! چه چیزی میل دارید؟"},{"de":"Guten Morgen. Ich hätte gern zwei Brötchen und ein Brot.","fa":"صبح بخیر. دو نان کوچک و یک نان می‌خواستم."},{"de":"Natürlich. Möchten Sie auch etwas Süßes?","fa":"حتماً. چیز شیرینی هم می‌خواهید؟"},{"de":"Vielleicht später. Wie viel kostet das Vollkornbrot?","fa":"شاید بعداً. این نان سبوس‌دار چقدر قیمت دارد؟"},{"de":"Das kostet drei Euro zwanzig. Es ist heute frisch.","fa":"قیمتش سه یورو و بیست سنت است. امروز تازه است."},{"de":"Gut, dann nehme ich das. Haben Sie auch Milch?","fa":"خوب، پس آن را برمی‌دارم. شیر هم دارید؟"},{"de":"Ja, die Milch steht hinten im Kühlregal.","fa":"بله، شیر عقب در قفسهٔ یخچالی است."},{"de":"Danke. Ich brauche noch einen Apfel und eine Banane.","fa":"ممنون. یک سیب و یک موز هم لازم دارم."},{"de":"Die Äpfel sind im Angebot: drei Stück für zwei Euro.","fa":"سیب‌ها تخفیف دارند: سه عدد به قیمت دو یورو."},{"de":"Das klingt gut. Ich nehme drei Äpfel.","fa":"خوبه. سه سیب برمی‌دارم."},{"de":"Sonst noch etwas? Möchten Sie eine Tüte?","fa":"چیز دیگری هم هست؟ کیسه می‌خواهید؟"},{"de":"Nein, danke. Ich habe meine eigene Tasche dabei.","fa":"نه، ممنون. کیف خودم را همراه دارم."},{"de":"Das macht zusammen acht Euro sechzig. Bar oder mit Karte?","fa":"روی هم می‌شود هشت یورو و شصت سنت. نقد یا با کارت؟"},{"de":"Mit Karte, bitte. Könnte ich den Kassenbon bekommen?","fa":"با کارت لطفاً. می‌شود رسید را بگیرم؟"}]},{"type":"vocab","items":[{"de":"das Brot","fa":"نان","note":"جمع: die Brote؛ یک نان کامل یا نوع نان."},{"de":"das Brötchen","fa":"نان کوچک","note":"جمع: die Brötchen؛ پسوند -chen اسم را خنثی می‌کند."},{"de":"das Vollkornbrot","fa":"نان سبوس‌دار","note":"Vollkorn = غلهٔ کامل / سبوس‌دار."},{"de":"die Bäckerei","fa":"نانوایی","note":"جمع: die Bäckereien؛ در نانوایی معمولاً نان می‌خرند."},{"de":"der Supermarkt","fa":"سوپرمارکت","note":"جمع: die Supermärkte؛ mit Akkusativ: in den Supermarkt gehen."},{"de":"der Kaffee","fa":"قهوه","note":"در سفارش: einen Kaffee، چون مذکر و مفعولی است."},{"de":"die Milch","fa":"شیر","note":"اغلب بدون حرف تعریف برای ماده: Ich brauche Milch."},{"de":"der Apfel","fa":"سیب","note":"جمع: die Äpfel؛ در مفعولی: einen Apfel."},{"de":"die Banane","fa":"موز","note":"جمع: die Bananen؛ در مفعولی: eine Banane."},{"de":"das Wasser","fa":"آب","note":"در سفارش: ein Wasser (یک لیوان/بطری آب)."},{"de":"der Preis","fa":"قیمت","note":"جمع: die Preise؛ سؤال: Wie hoch ist der Preis?"},{"de":"kosten","fa":"قیمت داشتن","note":"Was kostet das? / Was kosten die Äpfel?"},{"de":"das Angebot","fa":"تخفیف / پیشنهاد ویژه","note":"im Angebot sein = تخفیف داشتن."},{"de":"günstig","fa":"مقرون‌به‌صرفه / ارزان","note":"اغلب خنثی‌تر و مثبت‌تر از billig."},{"de":"teuer","fa":"گران","note":"zu teuer = بیش از حد گران."},{"de":"frisch","fa":"تازه","note":"frisches Brot = نان تازه."},{"de":"das Stück","fa":"عدد / تکه","note":"drei Stück = سه عدد؛ جمع غالباً Stück در شمارش."},{"de":"das Kilo","fa":"کیلوگرم","note":"ein Kilo Äpfel = یک کیلو سیب."},{"de":"die Tüte","fa":"کیسه","note":"eine Tüte bitte؛ جمع: die Tüten."},{"de":"die Tasche","fa":"کیف / ساک","note":"meine eigene Tasche = کیف خودم."},{"de":"das Kühlregal","fa":"قفسهٔ یخچالی","note":"در فروشگاه مواد سرد را اینجا پیدا می‌کنی."},{"de":"die Kasse","fa":"صندوق","note":"an der Kasse = پای صندوق."},{"de":"der Kassenbon","fa":"رسید خرید","note":"جمع: die Kassenbons؛ همچنین der Beleg."},{"de":"bar bezahlen","fa":"نقد پرداخت کردن","note":"Bar oder mit Karte? سؤال رایج صندوق."},{"de":"mit Karte zahlen","fa":"با کارت پرداخت کردن","note":"با mit همیشه Dativ می‌آید: mit Karte."},{"de":"die Rechnung","fa":"صورتحساب / فاکتور","note":"در رستوران: Die Rechnung, bitte."},{"de":"bekommen","fa":"دریافت کردن","note":"Kann ich einen Bon bekommen?"},{"de":"brauchen","fa":"نیاز داشتن","note":"مفعول مستقیم: Ich brauche einen Apfel."},{"de":"nehmen","fa":"برداشتن / انتخاب کردن","note":"Ich nehme das. در خرید خیلی طبیعی است."},{"de":"möchten","fa":"خواستن محترمانه","note":"Ich möchte ... + Akkusativ یا مصدر آخر جمله."}]},{"type":"grammar","title":"سفارش مؤدبانه: möchten، hätte gern و könnte","body":"در فروشگاه جملهٔ مستقیم [[Ich will ...]] از نظر دستوری درست است، اما ممکن است تند به گوش برسد. برای درخواست محترمانه از [[ich möchte]]، [[ich hätte gern]] یا سؤال با [[könnte]] استفاده کن. بعد از [[möchten]] یک اسم مفعولی یا مصدر در انتهای جمله می‌آید. [[hätte gern]] ساختار رایج و کاملاً طبیعیِ سفارش است؛ [[könnte]] برای درخواست و اجازه مؤدبانه کاربرد دارد.\nمثال‌های کاربردی:\n[[Ich möchte ein Brot.]] (یک نان می‌خواهم.)؛\n[[Ich hätte gern einen Kaffee.]] (یک قهوه می‌خواستم.)؛\n[[Möchten Sie noch etwas?]] (چیز دیگری میل دارید؟)؛\n[[Wir möchten mit Karte bezahlen.]] (می‌خواهیم با کارت پرداخت کنیم.)؛\n[[Könnte ich bitte eine Tüte bekommen?]] (می‌شود لطفاً یک کیسه بگیرم؟)؛\n[[Ich möchte heute nichts Süßes.]] (امروز چیز شیرینی نمی‌خواهم.)؛\n[[Was darf es für Sie sein?]] (چه چیزی میل دارید؟)."},{"type":"tip","body":"در مغازه عبارت [[Ich hätte gern ...]] هم مودبانه است و هم طبیعی. برای تأیید خرید می‌توانی بگویی [[Dann nehme ich das.]]؛ یعنی «پس همین را برمی‌دارم». [[Ich will]] اشتباه دستوری نیست، ولی لحنش معمولاً مستقیم‌تر است."},{"type":"grammar","title":"Akkusativ: چرا einen Kaffee اما ein Brot؟","body":"مفعول مستقیمِ فعل‌هایی مثل [[haben]]، [[kaufen]]، [[nehmen]]، [[brauchen]] و [[möchten]] حالت [[Akkusativ]] می‌گیرد. تغییر آشکارِ حرف تعریف فقط در مفرد مذکر است: [[der → den]] و [[ein → einen]]. مؤنث [[die / eine]] و خنثی [[das / ein]] در Nominativ و Akkusativ یکسان می‌مانند. برای منفی‌کردنِ اسم نامعین، [[kein]] همان الگوی صرفِ [[ein]] را دارد: [[keinen Kaffee]] و [[kein Brot]].\nمثال‌های کاربردی:\n[[Ich kaufe einen Apfel.]] (یک سیب می‌خرم.)؛\n[[Er nimmt den Kaffee.]] (او آن قهوه را برمی‌دارد.)؛\n[[Sie braucht eine Banane.]] (او یک موز لازم دارد.)؛\n[[Wir kaufen das Brot.]] (آن نان را می‌خریم.)؛\n[[Ich habe keinen Kassenbon.]] (رسید خرید ندارم.)؛\n[[Möchtest du ein Wasser?]] (یک آب می‌خواهی؟)؛\n[[Ich nehme die Äpfel.]] (آن سیب‌ها را برمی‌دارم.)."},{"type":"mistakes","items":[{"wrong":"Ich möchte ein Kaffee.","right":"Ich möchte einen Kaffee.","fa":"Kaffee مذکر است؛ به عنوان مفعول مستقیم ein به einen تبدیل می‌شود."},{"wrong":"Ich kaufe einen Milch.","right":"Ich kaufe eine Milch.","fa":"Milch مؤنث است؛ در این کاربردِ «یک بسته شیر»، eine درست است."},{"wrong":"Ich möchte bezahlen mit Karte.","right":"Ich möchte mit Karte bezahlen.","fa":"در جملهٔ خبری ساده با فعل مُدال، مصدر bezahlen معمولاً به انتهای جمله می‌رود."}]},{"type":"grammar","title":"پرسیدن قیمت، عدد و شیوهٔ پرداخت","body":"برای یک کالا از [[Was kostet ...?]] و برای چند کالا از [[Was kosten ...?]] استفاده می‌شود. جوابِ صندوق اغلب با [[Das macht ...]] می‌آید. قیمتِ [[8,60 €]] را می‌توان [[acht Euro sechzig]] گفت. [[bar]] یعنی نقد و [[mit Karte]] یعنی با کارت. در مکالمهٔ واقعی برای رسید می‌پرسی [[Kann ich den Kassenbon bekommen?]]. فرق [[kosten]] (قیمت داشتن)، [[bezahlen]] (هزینه را پرداخت کردن) و [[zahlen]] (پرداخت کردن) را حفظ کن.\nمثال‌های کاربردی:\n[[Was kostet das Brot?]] (این نان چقدر است؟)؛\n[[Was kosten drei Äpfel?]] (سه سیب چقدر می‌شود؟)؛\n[[Das macht acht Euro sechzig.]] (می‌شود هشت یورو و شصت سنت.)؛\n[[Kann ich bar bezahlen?]] (می‌توانم نقد پرداخت کنم؟)؛\n[[Ich zahle mit Karte.]] (با کارت پرداخت می‌کنم.)؛\n[[Ist das im Angebot?]] (این تخفیف دارد؟)؛\n[[Könnte ich den Kassenbon bekommen?]] (می‌شود رسید خرید را بگیرم؟)."},{"type":"tip","body":"در آلمان در نانوایی، فروشگاه یا رستوران ممکن است بشنوی [[Sonst noch etwas?]] (چیز دیگری هم؟). پاسخ طبیعی: [[Nein, danke. Das ist alles.]] (نه ممنون، همین بود)."},{"type":"text","de":"Am Samstag geht Mina in die Bäckerei. Sie möchte Brot für das Frühstück kaufen. Vor der Theke stehen drei Leute. Als sie an der Reihe ist, fragt die Verkäuferin: „Was darf es für Sie sein?“ Mina antwortet: „Ich hätte gern ein Vollkornbrot und zwei Brötchen.“ Das Vollkornbrot kostet drei Euro zwanzig. Die Brötchen kosten zusammen einen Euro vierzig. Mina findet den Preis in Ordnung. Danach geht sie in den Supermarkt, weil sie noch Milch, Obst und Wasser braucht. Im Kühlregal findet sie eine Packung Milch. Bei den Äpfeln sieht sie ein Schild: „Heute im Angebot!“ Drei Äpfel kosten nur zwei Euro. Mina nimmt drei Äpfel und eine Banane. An der Kasse fragt der Mitarbeiter: „Brauchen Sie eine Tüte?“ Sie sagt: „Nein, danke. Ich habe meine eigene Tasche dabei.“ Der Mitarbeiter nennt den Preis. Mina möchte mit Karte bezahlen, aber das Gerät funktioniert gerade nicht. Zum Glück hat sie Bargeld dabei. Sie bezahlt bar und bekommt den Kassenbon. Vor dem Laden prüft sie den Bon. Alles stimmt. Zu Hause macht sie Frühstück und freut sich über das frische Brot. Später erzählt sie ihrer Freundin, wo sie günstig eingekauft hat.","fa":"شنبه مینا به نانوایی می‌رود. می‌خواهد برای صبحانه نان بخرد. سه نفر جلوی پیشخوان ایستاده‌اند. وقتی نوبتش می‌شود، فروشنده می‌پرسد چه میل دارد. مینا نان سبوس‌دار و دو نان کوچک سفارش می‌دهد. نان سبوس‌دار سه یورو و بیست و دو نان کوچک روی‌هم یک یورو و چهل است. به نظرش قیمت مناسب است. بعد به سوپرمارکت می‌رود چون هنوز شیر، میوه و آب لازم دارد. در یخچال یک بسته شیر پیدا می‌کند. کنار سیب‌ها تابلوی تخفیف می‌بیند. سه سیب فقط دو یورو است. سه سیب و یک موز برمی‌دارد. پای صندوق کارمند می‌پرسد کیسه می‌خواهد یا نه. مینا می‌گوید کیف خودش را دارد. می‌خواهد با کارت بپردازد ولی دستگاه خراب است. خوشبختانه پول نقد دارد. نقد حساب می‌کند و رسید می‌گیرد. بیرون فروشگاه رسید را بررسی می‌کند و همه‌چیز درست است. خانه صبحانه درست می‌کند و از نان تازه خوشحال است. بعداً به دوستش می‌گوید از کجا ارزان خرید کرده است."},{"type":"tip","body":"به شکل [[mit Karte bezahlen]] دقت کن: بعد از [[mit]] حالت Dativ می‌آید، اما چون Karte مؤنثِ بی‌حرف تعریف است، همین شکل باقی می‌ماند. [[Bar oder mit Karte?]] یعنی «نقد یا کارت؟»."},{"type":"mistakes","items":[{"wrong":"Was kosten das Brot?","right":"Was kostet das Brot?","fa":"فاعل Brot مفرد است؛ شکل سوم‌شخصِ kosten می‌شود kostet."},{"wrong":"Das Äpfel sind günstig.","right":"Die Äpfel sind günstig.","fa":"Äpfel جمع است و در Nominativ حرف تعریف آن die است."}]}],"exercises":[{"type":"mc","q":"کدام سفارش برای یک قهوه مؤدبانه و از نظر دستوری درست است؟","options":["Ich möchte ein Kaffee.","Ich hätte gern einen Kaffee.","Ich hätte gerne einem Kaffee."],"answer":1,"why":"[[Kaffee]] مذکر است؛ بعد از [[hätte gern]] مفعول مستقیم [[einen Kaffee]] می‌آید."},{"type":"blank","text":"Ich möchte ___ Apfel kaufen.","answer":"einen","hint":"Apfel مذکر و اینجا مفعول مستقیم است.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «یک نان سبوس‌دار می‌خواستم.»","answer":"Ich hätte gern ein Vollkornbrot.","accept":["Ich hätte gerne ein Vollkornbrot.","Ich möchte ein Vollkornbrot."]},{"type":"mc","q":"[[Was kosten die Äpfel?]] به چه چیزی اشاره دارد؟","options":["قیمت چند سیب","قیمت یک قهوه","این‌که سیب‌ها کجا هستند"],"answer":0,"why":"چون [[Äpfel]] جمع است، فعل [[kosten]] می‌آید."},{"type":"blank","text":"Wir möchten mit Karte ___.","answer":"bezahlen","hint":"با möchten، مصدر در آخر جمله می‌آید.","accept":["zahlen"]},{"type":"type","q":"به آلمانی بنویس: «این چقدر است؟»","answer":"Was kostet das?","accept":["Wie viel kostet das?"]},{"type":"mc","q":"کارمند می‌پرسد [[Sonst noch etwas?]] پاسخ مناسب برای «نه، همین بود» چیست؟","options":["Nein, danke. Das ist alles.","Ja, ich bin alles.","Nein, das kostet."],"answer":0,"why":"[[Das ist alles]] یعنی «همین بود»."},{"type":"blank","text":"Ich habe ___ Kassenbon.","answer":"keinen","hint":"Kassenbon مفرد مذکر و مفعول است.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «با کارت پرداخت می‌کنم.»","answer":"Ich zahle mit Karte.","accept":["Ich bezahle mit Karte."]},{"type":"mc","q":"[[Das macht sechs Euro fünfzig.]] یعنی چه؟","options":["ساعت شش و پنجاه دقیقه است","قیمت کل شش یورو و پنجاه سنت است","شش و نیم کیلو است"],"answer":1,"why":"در صندوق، [[Das macht ...]] برای مبلغ نهایی کاربرد دارد."},{"type":"blank","text":"Die Milch steht im ___.","answer":"Kühlregal","hint":"برای مواد یخچالی.","accept":["kühlregal"]},{"type":"type","q":"به آلمانی بنویس: «می‌شود لطفاً رسید خرید را بگیرم؟»","answer":"Könnte ich bitte den Kassenbon bekommen?","accept":["Kann ich bitte den Kassenbon bekommen?"]}],"glossary":{"aber":"اما","acht":"هشت","alles":"همه‌چیز","als":"وقتی‌که / به‌عنوان","am":"درِ (an dem)","an":"در / بر / روی","angebot":"تخفیف / پیشنهاد ویژه","antwortet":"پاسخ می‌دهد","apfel":"سیب","auch":"هم","banane":"موز","bar":"نقد","bargeld":"پول نقد","bei":"نزد / کنار / هنگام","bekommen":"گرفتن / دریافت کردن","bekommt":"می‌گیرد","bezahlen":"پرداخت کردن","bezahlt":"پرداخت می‌کند / کرده","bitte":"لطفاً","bon":"رسید","brauche":"نیاز دارم","brauchen":"نیاز داشتن","braucht":"نیاز دارد","brot":"نان","brötchen":"نان‌های کوچک","bäckerei":"نانوایی","dabei":"همراه","danach":"بعد از آن","danke":"ممنون","dann":"بعد","darf":"اجازه دارم / چه میل دارید؟","das":"آن / این / حرف تعریف خنثی","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","der":"حرف تعریف مذکر / داتیو مؤنث","die":"حرف تعریف مؤنث / جمع","drei":"سه","eigene":"مالِ خود","ein":"یک","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","eingekauft":"خرید کرده","erzählt":"تعریف می‌کند","es":"آن","etwas":"چیزی","euro":"یورو","findet":"پیدا می‌کند / به نظرش می‌رسد","fragt":"می‌پرسد","freundin":"دوست مؤنث","freut":"خوشحال می‌کند / خوشحال می‌شود در sich freuen","frisch":"تازه","frische":"تازه (صرف‌شده)","frühstück":"صبحانه","funktioniert":"کار می‌کند / درست کار می‌کند","für":"برای / نسبت به","geht":"می‌رود / پیش می‌رود","gerade":"همین الان","gern":"با میل / دوست داشتن","gerät":"دستگاه","glück":"خوشبختی / شانس","gut":"خوب","guten":"خوب در احوالپرسی","günstig":"ارزان و به‌صرفه","habe":"دارم","haben":"داشتن / دارند","hat":"دارد","hause":"خانه","heute":"امروز","hinten":"عقب / قسمت پشتی","hätte":"می‌خواستم / داشتم (وجه فرضی)","ich":"من","ihrer":"مال او (مؤنث داتیو)","im":"در / درون (in dem)","in":"در","ist":"است","ja":"بله","kaffee":"قهوه","karte":"کارت","kasse":"صندوق","kassenbon":"رسید خرید","kaufen":"خریدن","kilo":"کیلوگرم","klingt":"به گوش می‌رسد","kosten":"قیمت داشتن / قیمت دارند","kostet":"قیمت دارد / می‌ارزد","könnte":"می‌توانستم / می‌شود (مودبانه)","kühlregal":"قفسه یخچال","laden":"مغازه / فروشگاه","leute":"آدم‌ها","macht":"می‌کند","meine":"مال من","milch":"شیر","mina":"مینا","mit":"با / همراه","mitarbeiter":"کارمند (مرد)","morgen":"صبح / فردا","möchte":"می‌خواهم / می‌خواهد","möchten":"مایل هستند/هستیم","natürlich":"البته / حتماً","nehme":"برمی‌دارم / انتخاب می‌کنم","nehmen":"برداشتن / انتخاب کردن","nein":"نه","nennt":"اعلام می‌کند / نام می‌برد","nicht":"نه (نفی)","nimmt":"برمی‌دارد / انتخاب می‌کند","noch":"هنوز","nur":"فقط","obst":"میوه","oder":"یا","ordnung":"نظم / در Ordnung: مناسب و درست","packung":"بسته","preis":"قیمت","prüft":"بررسی می‌کند","rechnung":"صورتحساب","reihe":"نوبت","sagt":"می‌گوید","samstag":"شنبه","schild":"تابلو","sechzig":"شصت","sein":"بودن / مال او (مذکر)","sich":"خود (ضمیر بازتابی)","sie":"او (مؤنث) / آن‌ها / شما","sieht":"می‌بیند","sind":"هستیم / هستند","sonst":"غیر از این / دیگر","später":"بعداً","stehen":"ایستادن","steht":"ایستاده است / قرار دارد","stimmt":"درست است","stück":"عدد / تکه","supermarkt":"سوپرمارکت","süßes":"چیز شیرین","tasche":"کیف / ساک","teuer":"گران","theke":"پیشخوان فروش","tüte":"کیسه","und":"و","verkäuferin":"فروشنده (زن)","viel":"زیاد","vielleicht":"شاید","vierzig":"چهل","vollkornbrot":"نان سبوس‌دار","vor":"قصد (در vorhaben) / پیش از","was":"چه","wasser":"آب","weil":"چون","wie":"چطور","wo":"کجا","zahlen":"پرداخت کردن","zu":"به / برای / نشانهٔ مصدر","zum":"به / برای (zu dem)","zusammen":"باهم","zwanzig":"بیست","zwei":"دو","äpfel":"سیب‌ها","äpfeln":"سیب‌ها (داتیو)","über":"درباره / از (خوشحال)"}},{"id":"l05","order":5,"level":"A2","minutes":20,"title":"گذشته‌ی ساده (Perfekt)","titleDe":"Das Perfekt","blocks":[{"type":"dialog","lines":[{"de":"Hey Samira, wie war dein Wochenende?","fa":"هی سمیرا، آخر هفته‌ات چطور بود؟"},{"de":"Richtig schön! Ich bin am Samstag nach Weimar gefahren.","fa":"خیلی خوب بود! شنبه به وایمار رفتم."},{"de":"Ach toll! Bist du allein gefahren?","fa":"چه عالی! تنها رفتی؟"},{"de":"Nein, ich habe meine Freundin mitgenommen.","fa":"نه، دوستم را با خودم بردم."},{"de":"Was habt ihr dort gemacht?","fa":"آن‌جا چه کار کردید؟"},{"de":"Wir haben die Altstadt besucht und viele Fotos gemacht.","fa":"شهر قدیمی را دیدیم و عکس‌های زیادی گرفتیم."},{"de":"Habt ihr auch etwas gegessen?","fa":"چیزی هم خوردید؟"},{"de":"Ja, wir haben in einem kleinen Café Kuchen gegessen.","fa":"بله، در یک کافهٔ کوچک کیک خوردیم."},{"de":"Und wann seid ihr zurückgekommen?","fa":"کی برگشتید؟"},{"de":"Erst am Abend. Der Zug hat eine halbe Stunde Verspätung gehabt.","fa":"تازه عصر. قطار نیم ساعت تأخیر داشت."},{"de":"Oh nein! Seid ihr trotzdem gut angekommen?","fa":"وای نه! با این حال سالم رسیدید؟"},{"de":"Ja, zum Glück. Danach habe ich zu Hause noch gelernt.","fa":"بله، خوشبختانه. بعدش خانه کمی هم درس خواندم."},{"de":"Du hast wirklich viel gemacht! Hast du gut geschlafen?","fa":"واقعاً کارهای زیادی کردی! خوب خوابیدی؟"},{"de":"Nicht besonders. Ich bin spät eingeschlafen, aber heute bin ich fit.","fa":"نه خیلی. دیر خوابم برد، اما امروز سرحالم."}]},{"type":"vocab","items":[{"de":"gestern","fa":"دیروز","note":"نشانهٔ زمان گذشته؛ اغلب با Perfekt در گفتار."},{"de":"vorgestern","fa":"پریروز","note":"دو روز پیش."},{"de":"letzte Woche","fa":"هفتهٔ گذشته","note":"زمان گذشتهٔ مشخص؛ با Perfekt هم طبیعی است."},{"de":"das Wochenende","fa":"آخر هفته","note":"am Wochenende = آخر هفته."},{"de":"machen → gemacht","fa":"انجام دادن → انجام داده","note":"فعل منظم: ge + mach + t."},{"de":"lernen → gelernt","fa":"یاد گرفتن → یادگرفته","note":"فعل منظم و معمولاً با haben."},{"de":"arbeiten → gearbeitet","fa":"کار کردن → کارکرده","note":"به خاطر پایان t در ریشه، -et می‌گیرد."},{"de":"kaufen → gekauft","fa":"خریدن → خریده","note":"با haben: Ich habe Brot gekauft."},{"de":"einkaufen → eingekauft","fa":"خریدکردن → خریدکرده","note":"فعل جداشدنی: ge بین پیشوند و ریشه."},{"de":"besuchen → besucht","fa":"دیدن / ملاقات‌کردن → ملاقات‌کرده","note":"پیشوند جدانشدنی be-؛ بدون ge-."},{"de":"telefonieren → telefoniert","fa":"تلفن‌زدن → تلفن‌زده","note":"افعالِ -ieren معمولاً ge- نمی‌گیرند."},{"de":"essen → gegessen","fa":"خوردن → خورده","note":"Partizip II نامنظم؛ با haben."},{"de":"trinken → getrunken","fa":"نوشیدن → نوشیده","note":"Partizip II نامنظم؛ با haben."},{"de":"sehen → gesehen","fa":"دیدن → دیده","note":"با haben؛ جمله: Ich habe dich gesehen."},{"de":"schlafen → geschlafen","fa":"خوابیدن → خوابیده","note":"با haben، نه sein."},{"de":"gehen → gegangen","fa":"رفتن → رفته","note":"با sein: Ich bin gegangen."},{"de":"fahren → gefahren","fa":"سفرکردن / رفتن با وسیله → رفته","note":"برای جابه‌جاییِ فاعل اغلب sein؛ برای راندنِ چیزی می‌تواند haben بیاید."},{"de":"kommen → gekommen","fa":"آمدن → آمده","note":"با sein: Sie ist gekommen."},{"de":"bleiben → geblieben","fa":"ماندن → مانده","note":"با sein، با وجود آن‌که حرکت ندارد."},{"de":"ankommen → angekommen","fa":"رسیدن → رسیده","note":"فعل جداشدنی؛ معمولاً با sein."},{"de":"aufstehen → aufgestanden","fa":"بلندشدن → بلندشده","note":"با sein؛ جداشدنی."},{"de":"einschlafen → eingeschlafen","fa":"خوابش بردن → به خواب رفته","note":"تغییر حالت؛ با sein."},{"de":"mitnehmen → mitgenommen","fa":"با خود بردن → برده","note":"با haben، چون مفعول مستقیم دارد."},{"de":"der Ausflug","fa":"گردش / سفر کوتاه","note":"einen Ausflug machen."},{"de":"die Altstadt","fa":"بافت قدیمی شهر","note":"در شهرهای آلمان بسیار رایج است."},{"de":"die Verspätung","fa":"تأخیر","note":"Der Zug hat Verspätung."},{"de":"der Zug","fa":"قطار","note":"جمع: die Züge."},{"de":"danach","fa":"بعد از آن","note":"قید زمانی؛ می‌تواند اول جمله بیاید."},{"de":"schon","fa":"قبلاً / از پیش","note":"Ich habe schon gegessen. = قبلاً غذا خورده‌ام."},{"de":"noch nicht","fa":"هنوز نه","note":"Ich habe noch nicht gegessen."}]},{"type":"grammar","title":"ساخت Perfekt و Partizip II","body":"در گفت‌وگوی روزانهٔ آلمانی، برای رخدادهای تمام‌شدهٔ گذشته اغلب از [[Perfekt]] استفاده می‌کنیم: [[haben / sein]] صرف‌شده در جایگاه دوم و [[Partizip II]] در انتهای جمله. فعل‌های منظم معمولاً [[ge- + ریشه + -t]] می‌سازند، ولی برای ریشه‌های ختم‌شونده به t یا d غالباً [[-et]] داریم. شکل افعال بی‌قاعده را باید حفظ کرد. در جملهٔ سؤالیِ بله/خیر، فعل کمکی به اول جمله می‌آید.\nمثال‌های کاربردی:\n[[Ich habe gestern gekocht.]] (دیروز آشپزی کردم.)؛\n[[Wir haben Deutsch gelernt.]] (آلمانی یاد گرفتیم.)؛\n[[Sie hat lange gearbeitet.]] (او مدت زیادی کار کرد.)؛\n[[Hast du den Film gesehen?]] (فیلم را دیدی؟)؛\n[[Ich habe Wasser getrunken.]] (آب نوشیدم.)؛\n[[Er hat schlecht geschlafen.]] (او بد خوابید.)؛\n[[Was habt ihr gemacht?]] (چه کار کردید؟)."},{"type":"tip","body":"در [[Perfekt]] فعل دوم را به انتهای جمله بفرست: [[Ich habe heute einen Film gesehen.]] نه [[Ich habe gesehen heute einen Film.]]. «کمکی در جایگاه دوم، Partizip II در پایان» را به‌صورت یک قاب حفظ کن."},{"type":"grammar","title":"انتخاب haben یا sein و استثناهای مهم","body":"بیشتر فعل‌ها در Perfekt با [[haben]] می‌آیند. بسیاری از فعل‌های جابه‌جایی و تغییر حالت، در کاربردِ بدون مفعول مستقیم، با [[sein]] ساخته می‌شوند؛ از جمله [[gehen]]، [[ankommen]]، [[einschlafen]] و نیز [[bleiben]]. اما این قانون «هر حرکت = sein» نیست: [[Ich habe getanzt]] و [[Ich habe das Auto gefahren]] کاربردهایی با haben هستند. تفاوت [[Ich bin nach Berlin gefahren]] (سفر کردم) و [[Ich habe das Auto gefahren]] (ماشین را راندم) را ببین.\nمثال‌های کاربردی:\n[[Ich bin nach Weimar gefahren.]] (به وایمار رفتم.)؛\n[[Sie ist nach Hause gekommen.]] (او به خانه برگشت.)؛\n[[Wir sind spät angekommen.]] (دیر رسیدیم.)؛\n[[Er ist zu Hause geblieben.]] (او در خانه ماند.)؛\n[[Ich habe acht Stunden geschlafen.]] (هشت ساعت خوابیدم.)؛\n[[Wir haben im Café gegessen.]] (در کافه غذا خوردیم.)؛\n[[Ich habe meine Freundin mitgenommen.]] (دوستم را با خودم بردم.)."},{"type":"mistakes","items":[{"wrong":"Ich habe nach Berlin gegangen.","right":"Ich bin nach Berlin gegangen.","fa":"gehen در Perfekt با sein ساخته می‌شود."},{"wrong":"Ich bin Pizza gegessen.","right":"Ich habe Pizza gegessen.","fa":"essen معمولاً با haben می‌آید."},{"wrong":"Ich habe gestern Deutsch lernen.","right":"Ich habe gestern Deutsch gelernt.","fa":"در Perfekt باید شکل Partizip II یعنی gelernt بیاید، نه مصدر lernen."}]},{"type":"grammar","title":"پیشوندها، افعال -ieren و ترتیب کلمات","body":"در فعل‌های جداشدنی [[ge]] میان پیشوند و ریشه می‌آید: [[einkaufen → eingekauft]] و [[aufstehen → aufgestanden]]. فعل‌های دارای پیشوند جدانشدنی مثل [[be-]] و [[ver-]] معمولاً [[ge-]] نمی‌گیرند: [[besuchen → besucht]] و [[verkaufen → verkauft]]. فعل‌های با پایان [[-ieren]] هم [[ge-]] نمی‌گیرند: [[telefonieren → telefoniert]]. اگر قید زمان را اول بگذاری، فعل صرف‌شده همچنان جایگاه دوم را می‌گیرد. بعد از [[weil]] جملهٔ وابسته با فعل صرف‌شدهٔ کمکی در انتها بسته می‌شود.\nمثال‌های کاربردی:\n[[Ich habe am Samstag eingekauft.]] (شنبه خرید کردم.)؛\n[[Sie hat mich besucht.]] (او به دیدنم آمد.)؛\n[[Wir haben lange telefoniert.]] (مدت زیادی تلفنی حرف زدیم.)؛\n[[Heute habe ich gearbeitet.]] (امروز کار کردم.)؛\n[[Er hat die Tür geöffnet.]] (او در را باز کرد.)؛\n[[Ich bin früh aufgestanden.]] (زود بیدار شدم و از جا بلند شدم.)؛\n[[Ich bin müde, weil ich wenig geschlafen habe.]] (خسته‌ام چون کم خوابیده‌ام.)."},{"type":"tip","body":"[[besucht]] و [[telefoniert]] بدون [[ge-]] ساخته می‌شوند. برخلاف فعل‌های جداشدنی، در فعل‌هایی با پیشوندهای [[be-]]، [[ver-]]، [[er-]] و [[ent-]] معمولاً [[ge]] اضافه نمی‌کنیم."},{"type":"text","de":"Gestern war ein langer, aber schöner Tag. Am Morgen bin ich um sieben Uhr aufgestanden. Ich habe gefrühstückt und danach mit meiner Mutter telefoniert. Dann bin ich mit dem Zug nach Weimar gefahren. Meine Freundin Leila ist am Bahnhof eingestiegen. Zusammen haben wir die Altstadt besucht und viele Fotos gemacht. Am Mittag haben wir in einem kleinen Café gegessen. Ich habe einen Kaffee getrunken, und Leila hat Kuchen bestellt. Später sind wir durch einen Park gegangen. Dort haben wir einen alten Bekannten getroffen. Wir haben eine Stunde gesprochen und viel gelacht. Am Nachmittag haben wir ein Museum besucht. Leider hat der Zug auf dem Rückweg Verspätung gehabt. Deshalb sind wir erst spät in Jena angekommen. Zu Hause habe ich noch zwanzig Minuten Deutsch gelernt, weil ich am nächsten Tag einen Test hatte. Danach habe ich meine Tasche vorbereitet. Ich war sehr müde, aber ich habe mich über den Ausflug gefreut. Um elf Uhr bin ich eingeschlafen. Heute Morgen habe ich meiner Schwester eine Nachricht geschickt. Sie hat gefragt, ob der Ausflug schön war. Ich habe ihr geantwortet: „Ja, sehr! Nächstes Mal kommst du mit.“","fa":"دیروز روزی طولانی ولی زیبا بود. صبح ساعت هفت بیدار شدم، صبحانه خوردم و بعد با مادرم تلفنی حرف زدم. با قطار به وایمار رفتم. دوستم لیلا در ایستگاه سوار شد. با هم به بافت قدیمی شهر رفتیم و کلی عکس گرفتیم. ظهر در کافه‌ای کوچک غذا خوردیم. من قهوه نوشیدم و لیلا کیک سفارش داد. بعد در پارکی قدم زدیم و آشنای قدیمی‌ای را دیدیم. یک ساعت صحبت کردیم و زیاد خندیدیم. بعدازظهر به موزه رفتیم. متأسفانه قطارِ برگشت تأخیر داشت، برای همین دیر به ینا رسیدیم. خانه بیست دقیقه هم آلمانی خواندم چون روز بعد امتحان داشتم. بعد کیفم را آماده کردم. خیلی خسته بودم ولی از گردش خوشحال بودم. ساعت یازده خوابم برد. امروز صبح به خواهرم پیامی فرستادم. پرسید گردش خوب بوده یا نه. جواب دادم: بله خیلی! دفعهٔ بعد تو هم می‌آیی."},{"type":"tip","body":"برای تعریف اتفاقات یک روز، عبارت‌های [[zuerst]] (اول)، [[dann]] (بعد)، [[danach]] (پس از آن) و [[zum Schluss]] (در پایان) را استفاده کن. این قیدها روایتِ Perfekt را طبیعی‌تر می‌کنند."},{"type":"mistakes","items":[{"wrong":"Ich habe gestern eingekaufen.","right":"Ich habe gestern eingekauft.","fa":"شکل Partizip II فعل جداشدنی einkaufen، eingekauft است."},{"wrong":"Sie hat nach Hause gekommen.","right":"Sie ist nach Hause gekommen.","fa":"kommen در معنای رسیدن/آمدن با sein ساخته می‌شود."},{"wrong":"Ich habe gestern besuche meinen Freund.","right":"Ich habe gestern meinen Freund besucht.","fa":"بعد از فعل کمکی haben، مفعول می‌آید و Partizip II معمولاً پایان جمله قرار می‌گیرد."}]}],"exercises":[{"type":"mc","q":"کدام جمله Perfekt درست دارد؟","options":["Ich habe nach Hause gegangen.","Ich bin nach Hause gegangen.","Ich bin nach Hause gehen."],"answer":1,"why":"[[gehen]] با [[sein]] و Partizip IIِ [[gegangen]] می‌آید."},{"type":"blank","text":"Wir haben gestern Deutsch ___.","answer":"gelernt","hint":"lernen → gelernt.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «دیروز فیلم دیدم.»","answer":"Ich habe gestern einen Film gesehen.","accept":["Gestern habe ich einen Film gesehen."]},{"type":"mc","q":"Partizip II برای [[besuchen]] کدام است؟","options":["gebesucht","besucht","besuchen"],"answer":1,"why":"پیشوند [[be-]] جدانشدنی است و معمولاً ge- نمی‌گیرد."},{"type":"blank","text":"Meine Freundin ___ gestern spät angekommen.","answer":"ist","hint":"ankommen معمولاً با sein می‌آید.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «ما شنبه خرید کردیم.»","answer":"Wir haben am Samstag eingekauft.","accept":["Am Samstag haben wir eingekauft."]},{"type":"mc","q":"در کدام جمله جای کلمات درست است؟","options":["Gestern ich habe gearbeitet.","Gestern habe ich gearbeitet.","Gestern gearbeitet habe ich."],"answer":1,"why":"وقتی قیدِ زمان اول جمله می‌آید، فعل صرف‌شده در جایگاه دوم می‌ماند."},{"type":"blank","text":"Ich habe mit meiner Mutter ___.","answer":"telefoniert","hint":"telefonieren → telefoniert؛ بدون ge-.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «او در خانه ماند.»","answer":"Er ist zu Hause geblieben.","accept":["Sie ist zu Hause geblieben."]},{"type":"mc","q":"کدام برای «سفر کردم به برلین» در Perfekt درست است؟","options":["Ich bin nach Berlin gefahren.","Ich habe nach Berlin gefahren.","Ich war nach Berlin gefahren."],"answer":0,"why":"[[fahren]] وقتی فاعل جابه‌جا می‌شود معمولاً با sein می‌آید؛ گزینهٔ سوم Plusquamperfekt است، نه Perfekt."},{"type":"blank","text":"Ich bin müde, weil ich wenig geschlafen ___.","answer":"habe","hint":"در جملهٔ وابسته با weil فعل صرف‌شدهٔ کمکی آخر می‌آید.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «ما در کافه کیک خوردیم.»","answer":"Wir haben im Café Kuchen gegessen.","accept":["Im Café haben wir Kuchen gegessen."]}],"glossary":{"abend":"عصر / شب","aber":"اما","ach":"آه / وای","allein":"تنها","alten":"قدیمی (صرف‌شده)","altstadt":"بافت قدیمی شهر","am":"درِ (an dem)","angekommen":"رسیده","ankommen":"رسیدن","arbeiten":"کار کردن","auch":"هم","auf":"روی / به","aufgestanden":"بلندشده از خواب","aufstehen":"بلندشدن از خواب","ausflug":"گردش کوتاه","bahnhof":"ایستگاه قطار","bekannten":"آشنا","besonders":"به‌خصوص / چندان","bestellt":"سفارش داده","besuchen":"به دیدن رفتن / بازدید کردن","besucht":"شرکت می‌کند / بازدید می‌کند","bin":"هستم / فعل کمکی Perfekt با ich","bist":"هستی","bleiben":"ماندن","café":"کافه","danach":"بعد از آن","dann":"بعد","das":"آن / این / حرف تعریف خنثی","dein":"مال تو (مذکر/خنثی)","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","der":"حرف تعریف مذکر / داتیو مؤنث","deshalb":"به همین دلیل","deutsch":"زبان آلمانی","die":"حرف تعریف مؤنث / جمع","dort":"آنجا","du":"تو","durch":"از میان / از طریق","ein":"یک","eine":"یک (مؤنث)","einem":"یک (داتیو مذکر/خنثی)","einen":"یک (مفعولی مذکر)","eingekauft":"خرید کرده","eingeschlafen":"خوابش برده","eingestiegen":"سوار شده","einkaufen":"خرید کردن","einschlafen":"به خواب رفتن","elf":"یازده","erst":"تازه","essen":"خوردن / غذا","etwas":"چیزی","fahren":"رفتن با وسیله / رانندگی کردن","fit":"سرحال","fotos":"عکس‌ها","freundin":"دوست مؤنث","geantwortet":"پاسخ داده","gearbeitet":"کار کرده","geblieben":"مانده","gefahren":"رفته با وسیله / رانده","gefragt":"پرسیده","gefreut":"خوشحال شده","gefrühstückt":"صبحانه خورده","gegangen":"رفته","gegessen":"خورده","gehabt":"داشته / گذشتهٔ haben","gehen":"رفتن","gekauft":"خریده","gekommen":"آمده","gelacht":"خندیده","gelernt":"یادگرفته / درس خوانده","gemacht":"انجام داده","geschickt":"فرستاده","geschlafen":"خوابیده","gesehen":"دیده","gesprochen":"صحبت کرده","gestern":"دیروز","getroffen":"ملاقات کرده / دیده","getrunken":"نوشیده","glück":"خوشبختی / شانس","gut":"خوب","habe":"دارم","haben":"داشتن / دارند","habt":"دارید / کرده‌اید (فعل کمکی)","halbe":"نیمِ","hast":"داری","hat":"دارد","hatte":"داشت (گذشتهٔ ساده)","hause":"خانه","heute":"امروز","hey":"سلام / هی","ich":"من","ihr":"مال او / به او / شماها","in":"در","ist":"است","ja":"بله","jena":"ینا","kaffee":"قهوه","kaufen":"خریدن","kleinen":"کوچک (صرف‌شده)","kommen":"آمدن","kommst":"می‌آیی","kuchen":"کیک","langer":"طولانی (صرف‌شده)","leider":"متأسفانه","leila":"لیلا","lernen":"یاد گرفتن / یاد می‌گیرند","letzte":"گذشته / آخرین (صرف‌شده)","machen":"انجام دادن","mal":"دفعه","meine":"مال من","meiner":"مال من (داتیو مؤنث)","mich":"من را","minuten":"دقیقه‌ها","mit":"با / همراه","mitgenommen":"با خود برده","mitnehmen":"با خود بردن","mittag":"ظهر","morgen":"صبح / فردا","museum":"موزه","mutter":"مادر","müde":"خسته","nach":"بعد از","nachmittag":"بعدازظهر","nachricht":"پیام","nein":"نه","nicht":"نه (نفی)","noch":"هنوز","nächsten":"بعدی (صرف‌شده)","nächstes":"آیندهٔ (خنثی)","ob":"آیا","oh":"اوه / وای","park":"پارک","richtig":"واقعاً / درست","rückweg":"راه برگشت","samira":"سمیرا (نام)","samstag":"شنبه","schlafen":"خوابیدن","schon":"از پیش","schwester":"خواهر","schön":"قشنگ / خوب","schöner":"زیباتر / زیبا (صرف‌شده)","sehen":"دیدن","sehr":"بسیار","seid":"هستید / فعل کمکی Perfekt","sie":"او (مؤنث) / آن‌ها / شما","sieben":"هفت","sind":"هستیم / هستند","spät":"دیر","später":"بعداً","stunde":"یک ساعت مدت","tag":"روز","tasche":"کیف / ساک","telefonieren":"تلفن‌زدن","telefoniert":"تلفن زده","test":"امتحان","toll":"عالی","trinken":"می‌نوشند","trotzdem":"با این حال","uhr":"ساعت (زمانِ روز)","um":"در ساعت / دور","und":"و","verspätung":"تأخیر","viel":"زیاد","viele":"بسیار","vorbereitet":"آماده کرده","vorgestern":"پریروز","wann":"چه وقت","war":"بود","was":"چه","weil":"چون","weimar":"وایمار (شهر)","wie":"چطور","wir":"ما","wirklich":"واقعاً","woche":"هفته","wochenende":"آخر هفته","zu":"به / برای / نشانهٔ مصدر","zug":"قطار","zum":"به / برای (zu dem)","zurückgekommen":"برگشته","zusammen":"باهم","zwanzig":"بیست","über":"درباره / از (خوشحال)"}},{"id":"l06","order":6,"level":"B1","minutes":22,"title":"آرزوها و برنامه‌ها","titleDe":"Wünsche und Pläne","blocks":[{"type":"dialog","lines":[{"de":"Hast du schon Pläne für das nächste Jahr?","fa":"برای سال آینده برنامه‌ای داری؟"},{"de":"Ja, ich möchte eine Ausbildung anfangen oder studieren.","fa":"بله، می‌خواهم آموزش حرفه‌ای شروع کنم یا در دانشگاه درس بخوانم."},{"de":"Weißt du schon, was du genau machen möchtest?","fa":"می‌دانی دقیقاً می‌خواهی چه کار کنی؟"},{"de":"Ich interessiere mich für Informatik, weil ich gern Probleme löse.","fa":"به انفورماتیک علاقه دارم، چون حل‌کردن مسئله را دوست دارم."},{"de":"Das klingt spannend. Wirst du dich in Jena bewerben?","fa":"جالب به نظر می‌رسد. در ینا درخواست خواهی داد؟"},{"de":"Wahrscheinlich. Ich hoffe, dass ich einen Studienplatz bekomme.","fa":"احتمالاً. امیدوارم جایی در دانشگاه بگیرم."},{"de":"Und wenn es diesmal nicht klappt?","fa":"اگر این دفعه نشد چه؟"},{"de":"Dann werde ich mich auch in anderen Städten bewerben.","fa":"آن‌وقت در شهرهای دیگر هم درخواست می‌دهم."},{"de":"Gibt es etwas, das dir Sorgen macht?","fa":"چیزی هست که نگرانت کند؟"},{"de":"Ja, ich habe Angst, dass mein Deutsch nicht gut genug ist.","fa":"بله، می‌ترسم آلمانی‌ام به‌اندازهٔ کافی خوب نباشد."},{"de":"Du lernst doch jeden Tag. Warum machst du dir Sorgen?","fa":"ولی تو هر روز درس می‌خوانی. چرا نگران هستی؟"},{"de":"Weil ich im Studium viele Fachtexte lesen muss.","fa":"چون باید در دانشگاه متن‌های تخصصی زیادی بخوانم."},{"de":"Ich würde gern mit dir üben. Wir könnten einen Lernplan machen.","fa":"دوست دارم با تو تمرین کنم. می‌توانیم برنامهٔ یادگیری بسازیم."},{"de":"Danke! Ich glaube, dass mir das wirklich helfen wird.","fa":"ممنون! فکر می‌کنم این واقعاً کمکم خواهد کرد."}]},{"type":"vocab","items":[{"de":"der Plan","fa":"برنامه","note":"جمع: die Pläne؛ Pläne haben."},{"de":"der Wunsch","fa":"آرزو","note":"جمع: die Wünsche؛ sich etwas wünschen."},{"de":"die Zukunft","fa":"آینده","note":"in der Zukunft = در آینده."},{"de":"das Ziel","fa":"هدف","note":"ein Ziel erreichen = به هدف رسیدن."},{"de":"der Traum","fa":"رؤیا","note":"von etwas träumen + Dativ."},{"de":"hoffen","fa":"امیدواربودن","note":"Ich hoffe, dass ... ."},{"de":"sich wünschen","fa":"آرزو داشتن","note":"Ich wünsche mir eine Chance."},{"de":"planen","fa":"برنامه‌ریزی کردن","note":"Ich plane, nächstes Jahr zu studieren."},{"de":"sich entscheiden","fa":"تصمیم گرفتن","note":"sich für etwas entscheiden + Akkusativ."},{"de":"vorhaben","fa":"قصد داشتن","note":"Ich habe vor, einen Kurs zu machen؛ جداشدنی."},{"de":"die Entscheidung","fa":"تصمیم","note":"eine Entscheidung treffen = تصمیم گرفتن."},{"de":"sich bewerben","fa":"درخواست / تقاضا دادن","note":"sich um einen Studienplatz bewerben."},{"de":"die Bewerbung","fa":"درخواست / پروندهٔ تقاضا","note":"جمع: die Bewerbungen."},{"de":"der Studienplatz","fa":"جای پذیرش دانشگاه","note":"einen Studienplatz bekommen."},{"de":"die Ausbildung","fa":"آموزش شغلی","note":"eine Ausbildung machen/anfangen."},{"de":"studieren","fa":"در دانشگاه تحصیل‌کردن","note":"etwas studieren: Informatik studieren."},{"de":"sich interessieren für","fa":"علاقه داشتن به","note":"همیشه für + Akkusativ."},{"de":"die Möglichkeit","fa":"امکان / فرصت","note":"جمع: die Möglichkeiten."},{"de":"die Chance","fa":"شانس / فرصت","note":"eine Chance bekommen / nutzen."},{"de":"die Sorge","fa":"نگرانی","note":"sich Sorgen machen."},{"de":"die Angst","fa":"ترس","note":"Angst haben, dass ... ."},{"de":"wahrscheinlich","fa":"احتمالاً","note":"برای آیندهٔ غیرقطعی."},{"de":"vielleicht","fa":"شاید","note":"در تصمیم‌های نامطمئن."},{"de":"nächstes Jahr","fa":"سال آینده","note":"قید زمانی؛ اغلب Präsens کافی است."},{"de":"bald","fa":"به‌زودی","note":"در آیندهٔ نزدیک."},{"de":"irgendwann","fa":"روزی / بالاخره","note":"زمان نامعین در آینده."},{"de":"aufgeben","fa":"تسلیم‌شدن","note":"Ich gebe nicht auf؛ فعل جداشدنی."},{"de":"erreichen","fa":"رسیدن به / محقق‌کردن","note":"Ich will mein Ziel erreichen."},{"de":"der Lernplan","fa":"برنامهٔ یادگیری","note":"einen Lernplan erstellen."},{"de":"klappen","fa":"جورشدن / موفق‌شدن","note":"Es klappt! / Es hat nicht geklappt."}]},{"type":"grammar","title":"بیان آینده: Präsens، werden + Infinitiv و برنامهٔ واقعی","body":"در آلمانی برای برنامهٔ زمان‌دارِ آینده معمولاً [[Präsens]] با قید زمان کافی است: [[Nächstes Jahr studiere ich.]]. برای تأکید بر آینده، پیش‌بینی یا وعده، از [[werden]] صرف‌شده + مصدر در انتهای جمله استفاده می‌کنیم: [[Ich werde lernen.]]. صرف werden در Präsens: [[ich werde]]، [[du wirst]]، [[er/sie/es wird]]، [[wir werden]]، [[ihr werdet]]، [[sie/Sie werden]]. برخلاف انگلیسی لازم نیست برای هر آینده‌ای حتماً Futur I بسازی.\nمثال‌های کاربردی:\n[[Nächstes Jahr beginne ich mein Studium.]] (سال آینده دانشگاه را شروع می‌کنم.)؛\n[[Ich werde mich morgen bewerben.]] (فردا درخواست خواهم داد.)؛\n[[Du wirst die Prüfung schaffen.]] (امتحان را قبول خواهی شد.)؛\n[[Sie wird bald nach Berlin ziehen.]] (او به‌زودی به برلین نقل مکان خواهد کرد.)؛\n[[Wir werden zusammen lernen.]] (با هم درس خواهیم خواند.)؛\n[[Wirst du nächstes Jahr arbeiten?]] (سال آینده کار خواهی کرد؟)؛\n[[In fünf Jahren möchte ich im Labor arbeiten.]] (پنج سال دیگر می‌خواهم در آزمایشگاه کار کنم.)."},{"type":"tip","body":"اگر زمان آینده مشخص است، [[Präsens]] کاملاً طبیعی است: [[Morgen habe ich Unterricht.]] با [[werden]] آینده را برجسته می‌کنی یا پیش‌بینی می‌کنی: [[Es wird bestimmt besser werden.]]. هر دو را با توجه به بافت انتخاب کن."},{"type":"grammar","title":"weil و dass: فعل در پایان جملهٔ وابسته","body":"[[weil]] دلیل را معرفی می‌کند («چون») و [[dass]] محتوای فکر، امید یا گفته را («که»). این دو جملهٔ وابسته می‌سازند: فعل صرف‌شده به انتهای جملهٔ وابسته می‌رود. بین جملهٔ اصلی و وابسته ویرگول می‌گذاریم. اگر جملهٔ وابسته در ابتدا بیاید، فعل صرف‌شدهٔ جملهٔ اصلی بلافاصله بعد از ویرگول می‌آید: [[Weil ich studieren möchte, lerne ich Deutsch.]]. دقت کن که در جملهٔ وابسته با فعل مدال، فعل مدالِ صرف‌شده آخر می‌آید.\nمثال‌های کاربردی:\n[[Ich lerne Deutsch, weil ich studieren möchte.]] (آلمانی می‌خوانم چون می‌خواهم دانشگاه بروم.)؛\n[[Ich hoffe, dass ich einen Platz bekomme.]] (امیدوارم جایی به دست بیاورم.)؛\n[[Sie sagt, dass der Kurs morgen beginnt.]] (او می‌گوید کلاس فردا شروع می‌شود.)؛\n[[Weil ich arbeiten muss, habe ich heute keine Zeit.]] (چون باید کار کنم، امروز وقت ندارم.)؛\n[[Ich weiß, dass die Prüfung schwer ist.]] (می‌دانم امتحان سخت است.)؛\n[[Ich bewerbe mich, weil mir das Fach gefällt.]] (درخواست می‌دهم چون این رشته را دوست دارم.)؛\n[[Er glaubt, dass er die Prüfung bestehen wird.]] (او فکر می‌کند امتحان را قبول خواهد شد.)."},{"type":"mistakes","items":[{"wrong":"Ich lerne Deutsch, weil ich möchte studieren.","right":"Ich lerne Deutsch, weil ich studieren möchte.","fa":"بعد از weil فعل صرف‌شدهٔ möchte آخرِ جملهٔ وابسته قرار می‌گیرد."},{"wrong":"Ich hoffe, dass ich bekomme einen Platz.","right":"Ich hoffe, dass ich einen Platz bekomme.","fa":"بعد از dass فعل صرف‌شدهٔ bekomme باید در پایان قرار بگیرد."},{"wrong":"Weil ich krank bin, ich bleibe zu Hause.","right":"Weil ich krank bin, bleibe ich zu Hause.","fa":"وقتی جملهٔ وابسته اول می‌آید، فعل bleibe در جملهٔ اصلی بلافاصله بعد از ویرگول می‌آید."}]},{"type":"grammar","title":"آرزو و قصد: möchte، würde gern، vorhaben و zu + مصدر","body":"برای بیان خواسته [[ich möchte ...]] و برای آرزوی مؤدبانه یا فرضی [[ich würde gern ...]] را به کار ببر. ساختار [[vorhaben]] + [[zu]] + مصدر برای برنامه‌ای که قصد اجرای آن را داری مناسب است: [[Ich habe vor, nächstes Jahr zu studieren.]]. بعد از [[planen]] یا [[versuchen]] هم معمولاً جملهٔ مصدری با [[zu]] می‌آید. برای افعال جداشدنی، [[zu]] بین پیشوند و ریشه می‌نشیند: [[anzufangen]]. در جمله‌های سادهٔ با [[möchten]] و [[werden]] از [[zu]] قبل از مصدر استفاده نمی‌شود.\nمثال‌های کاربردی:\n[[Ich möchte Informatik studieren.]] (می‌خواهم انفورماتیک بخوانم.)؛\n[[Ich würde gern im Ausland arbeiten.]] (دوست دارم خارج از کشور کار کنم.)؛\n[[Ich habe vor, einen Deutschkurs zu machen.]] (قصد دارم دورهٔ زبان آلمانی بروم.)؛\n[[Sie plant, nächstes Jahr umzuziehen.]] (او برنامه دارد سال آینده اسباب‌کشی کند.)؛\n[[Ich versuche, jeden Tag zu üben.]] (سعی می‌کنم هر روز تمرین کنم.)؛\n[[Wir hoffen, bald anfangen zu können.]] (امیدواریم بتوانیم به‌زودی شروع کنیم.)؛\n[[Er möchte seine Ziele erreichen.]] (او می‌خواهد به هدف‌هایش برسد.)."},{"type":"tip","body":"به دو جملهٔ بسیار رایج توجه کن: [[Ich hoffe, dass ...]] برای امید به یک اتفاق، و [[Ich habe vor, ... zu ...]] برای قصد خودت. [[Ich würde gern ...]] از [[Ich will ...]] ملایم‌تر است."},{"type":"text","de":"Nächstes Jahr möchte Amir eine neue Ausbildung anfangen. Er interessiert sich für Computer und Technik, deshalb denkt er über Informatik nach. Seine Freunde sagen, dass er gute Ideen hat und geduldig arbeitet. Amir weiß aber auch, dass der Weg nicht einfach sein wird. Er muss noch besser Deutsch lernen, weil er im Unterricht viele Fachtexte verstehen möchte. Im Moment besucht er einen Sprachkurs und arbeitet am Wochenende. Jeden Abend macht er einen kleinen Lernplan. Er hat vor, sich im Frühjahr an mehreren Hochschulen zu bewerben. Zuerst möchte er die Bewerbungsfristen prüfen. Danach wird er seine Unterlagen vorbereiten. Seine Schwester fragt, was passiert, wenn er keinen Studienplatz bekommt. Amir antwortet: „Dann werde ich es nächstes Semester wieder versuchen.“ Er würde gern in Jena bleiben, aber er ist auch offen für andere Städte. Manchmal hat er Angst, dass seine Deutschkenntnisse nicht reichen. Trotzdem gibt er nicht auf. Er glaubt, dass man große Ziele in kleine Schritte teilen muss. In fünf Jahren möchte er einen Beruf haben, der ihm Spaß macht. Bis dahin will er viel lernen, neue Leute kennenlernen und Erfahrungen sammeln. Sein größter Wunsch ist, später selbstständig Entscheidungen treffen zu können.","fa":"امیر می‌خواهد سال آینده دورهٔ آموزشی جدیدی شروع کند. به رایانه و فناوری علاقه دارد و برای همین به انفورماتیک فکر می‌کند. دوستانش می‌گویند ایده‌های خوبی دارد و صبورانه کار می‌کند. او می‌داند مسیر آسان نخواهد بود. باید آلمانی‌اش را بهتر کند چون می‌خواهد متن‌های تخصصی کلاس را بفهمد. اکنون دورهٔ زبان می‌رود و آخر هفته کار می‌کند. هر شب برنامهٔ کوچکی برای یادگیری می‌سازد. قصد دارد بهار به چند دانشگاه درخواست بدهد. اول مهلت‌ها را بررسی می‌کند و سپس مدارکش را آماده خواهد کرد. خواهرش می‌پرسد اگر پذیرش نگیرد چه می‌شود. می‌گوید ترم بعد دوباره تلاش می‌کند. دوست دارد در ینا بماند اما شهرهای دیگر را هم در نظر دارد. گاهی نگران است که زبانش کافی نباشد، اما تسلیم نمی‌شود. باور دارد هدف‌های بزرگ را باید به قدم‌های کوچک تقسیم کرد. دوست دارد پنج سال دیگر شغلی داشته باشد که از آن لذت ببرد. تا آن زمان می‌خواهد چیزهای زیادی یاد بگیرد، آدم‌های تازه بشناسد و تجربه جمع کند. بزرگ‌ترین آرزویش این است که بعداً بتواند مستقل تصمیم بگیرد."},{"type":"tip","body":"در آزمون نوشتاری B1 برنامه را با ترتیب زمانی روشن بیان کن: [[zuerst]] (اول)، [[danach]] (بعد)، [[anschließend]] (سپس) و [[schließlich]] (در پایان). برای دلیل [[weil]]، برای امید [[dass]] و برای قصد [[vorhaben, ... zu ...]] مفیدند."},{"type":"mistakes","items":[{"wrong":"Ich werde zu studieren.","right":"Ich werde studieren.","fa":"بعد از werden در Futur I مصدر بدون zu به انتهای جمله می‌رود."},{"wrong":"Ich habe vor, nächstes Jahr studieren.","right":"Ich habe vor, nächstes Jahr zu studieren.","fa":"بعد از vorhaben در این ساختار، zu + مصدر نیاز داریم."}]}],"exercises":[{"type":"mc","q":"کدام جمله برای آیندهٔ مشخص در آلمانی کاملاً طبیعی است؟","options":["Morgen habe ich Unterricht.","Morgen ich werde Unterricht haben.","Morgen Unterricht haben ich."],"answer":0,"why":"با قید زمان مشخص، [[Präsens]] معمولاً برای آینده کافی است."},{"type":"blank","text":"Ich hoffe, ___ ich die Prüfung bestehe.","answer":"dass","hint":"برای معرفی محتوای امید از dass استفاده می‌شود.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «من آلمانی یاد می‌گیرم چون می‌خواهم در دانشگاه درس بخوانم.»","answer":"Ich lerne Deutsch, weil ich studieren möchte.","accept":["Weil ich studieren möchte, lerne ich Deutsch."]},{"type":"mc","q":"کدام جمله با weil درست است؟","options":["Ich bleibe zu Hause, weil ich bin krank.","Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil bin ich krank."],"answer":1,"why":"بعد از weil فعل صرف‌شده [[bin]] آخر جملهٔ وابسته می‌آید."},{"type":"blank","text":"Nächstes Jahr ___ ich in Jena studieren.","answer":"werde","hint":"صرفِ werden برای ich = werde.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «امیدوارم یک جای دانشگاه بگیرم.»","answer":"Ich hoffe, dass ich einen Studienplatz bekomme.","accept":["Ich hoffe, dass ich einen Studienplatz erhalten werde."]},{"type":"mc","q":"کدام عبارت «قصد دارم سال آینده دوره‌ای شروع کنم» را درست بیان می‌کند؟","options":["Ich habe vor, nächstes Jahr einen Kurs anzufangen.","Ich habe vor, nächstes Jahr einen Kurs anfangen.","Ich vorhabe, nächstes Jahr einen Kurs zu anfangen."],"answer":0,"why":"پس از vorhaben، ساختار [[zu + مصدر]] لازم است؛ مصدر جداشدنی anfangen به شکل [[anzufangen]] درمی‌آید."},{"type":"blank","text":"Ich würde ___ im Ausland arbeiten.","answer":"gern","hint":"würde gern + مصدر برای بیان خواستهٔ مودبانه.","accept":["gerne"]},{"type":"type","q":"به آلمانی بنویس: «می‌دانم که این سخت است.»","answer":"Ich weiß, dass das schwer ist.","accept":["Ich weiss, dass das schwer ist."]},{"type":"mc","q":"وقتی جملهٔ وابسته اول بیاید، کدام جمله درست است؟","options":["Weil ich lernen muss, ich bleibe hier.","Weil ich lernen muss, bleibe ich hier.","Weil muss ich lernen, bleibe ich hier."],"answer":1,"why":"پس از جملهٔ وابستهٔ آغازین، فعل صرف‌شدهٔ اصلی بلافاصله پس از ویرگول می‌آید."},{"type":"blank","text":"Wir haben vor, uns morgen zu ___.","answer":"bewerben","hint":"ساختار haben vor, ... zu + مصدر.","accept":[]},{"type":"type","q":"به آلمانی بنویس: «دوست دارم در آلمان کار کنم.»","answer":"Ich würde gern in Deutschland arbeiten.","accept":["Ich möchte in Deutschland arbeiten."]}],"glossary":{"abend":"عصر / شب","aber":"اما","am":"درِ (an dem)","amir":"امیر (نام)","an":"در / بر / روی","andere":"دیگر","anderen":"دیگر (صرف شده)","anfangen":"شروع کردن","angst":"ترس","antwortet":"پاسخ می‌دهد","arbeitet":"کار می‌کند","auch":"هم","auf":"روی / به","aufgeben":"تسلیم‌شدن / رها کردن","ausbildung":"آموزش حرفه‌ای","bald":"به‌زودی","bekomme":"دریافت می‌کنم","bekommt":"می‌گیرد","beruf":"شغل","besser":"بهتر","besucht":"شرکت می‌کند / بازدید می‌کند","bewerben":"درخواست دادن","bewerbung":"درخواست / تقاضا","bewerbungsfristen":"مهلت‌های درخواست پذیرش","bis":"تا","bleiben":"ماندن","chance":"فرصت / شانس","computer":"رایانه","dahin":"تا آن موقع","danach":"بعد از آن","danke":"ممنون","dann":"بعد","das":"آن / این / حرف تعریف خنثی","dass":"که","denkt":"فکر می‌کند","der":"حرف تعریف مذکر / داتیو مؤنث","deshalb":"به همین دلیل","deutsch":"زبان آلمانی","deutschkenntnisse":"دانش زبان آلمانی","dich":"تو (مفعولی)","die":"حرف تعریف مؤنث / جمع","diesmal":"این دفعه","dir":"به تو","doch":"اما / ولی","du":"تو","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","einfach":"آسان","entscheiden":"تصمیم گرفتن","entscheidung":"تصمیم","entscheidungen":"تصمیم‌ها","er":"او (مذکر)","erfahrungen":"تجربه‌ها","erreiche const DE_ADV=[{"id":"l07","order":7,"level":"B2","minutes":35,"title":"گذشته‌ی آرزوها","titleDe":"Konjunktiv II – Wünsche und irreale Bedingungen","blocks":[{"type":"dialog","lines":[{"de":"Wenn du ein Jahr frei hättest, was würdest du machen?","fa":"اگر یک سال آزاد بودی، چه کار می‌کردی؟"},{"de":"Ich würde gern reisen und vielleicht einen Roman schreiben.","fa":"دوست داشتم سفر کنم و شاید یک رمان بنویسم."},{"de":"Wohin würdest du zuerst fahren?","fa":"اول کجا می‌رفتی؟"},{"de":"Am liebsten würde ich nach Portugal fahren, wenn ich genug Geld hätte.","fa":"ترجیحاً به پرتغال می‌رفتم، اگر پول کافی داشتم."},{"de":"Könntest du nicht erst einmal ein paar Wochen Urlaub nehmen?","fa":"نمی‌توانستی اول چند هفته مرخصی بگیری؟"},{"de":"Doch, aber ich müsste dafür länger sparen.","fa":"چرا، ولی برای این کار مجبور بودم بیشتر پس‌انداز کنم."},{"de":"An deiner Stelle würde ich einen konkreten Plan machen.","fa":"اگر جای تو بودم، یک برنامهٔ مشخص می‌ریختم."},{"de":"Du hast recht. Ich wünschte, ich hätte schon vor Jahren damit angefangen.","fa":"حق با توست. کاش چند سال پیش شروع کرده بودم."},{"de":"Du hast aber auch in dieser Zeit viel gelernt, oder?","fa":"ولی در این مدت چیزهای زیادی هم یاد گرفته‌ای، نه؟"},{"de":"Genau. Damals hätte ich mehr Zeit gehabt.","fa":"دقیقاً. آن موقع وقت بیشتری می‌داشتم."},{"de":"Wenn du früher gespart hättest, könntest du jetzt losfahren.","fa":"اگر زودتر پس‌انداز کرده بودی، الان می‌توانستی راه بیفتی."},{"de":"Stimmt. Aber ich hätte damals auch nicht auf alles verzichten wollen.","fa":"درست است. ولی آن زمان هم نمی‌خواستم از همه‌چیز صرف‌نظر کنم."},{"de":"Dann fang klein an. Ein kurzer Urlaub wäre immerhin möglich.","fa":"پس از کوچک شروع کن. دست‌کم یک سفر کوتاه امکان‌پذیر بود."},{"de":"Gute Idee! Würdest du vielleicht mitkommen?","fa":"فکر خوبیه! شاید تو هم همراه بیایی؟"}]},{"type":"vocab","items":[{"de":"wenn","fa":"اگر","note":"در شرط‌های غیرواقعی فعل به آخر بند وابسته می‌رود."},{"de":"die Voraussetzung","fa":"پیش‌شرط","note":"جمع: Voraussetzungen."},{"de":"der Wunsch","fa":"آرزو","note":"جمع: Wünsche."},{"de":"die Möglichkeit","fa":"امکان","note":"جمع: Möglichkeiten."},{"de":"hätte","fa":"می‌داشتم / داشت","note":"Konjunktiv II فعل haben."},{"de":"wäre","fa":"می‌بود / بود","note":"Konjunktiv II فعل sein."},{"de":"würde","fa":"می‌کردم / می‌شد","note":"معمولاً با مصدر در پایان جمله."},{"de":"könnte","fa":"می‌توانستم","note":"Konjunktiv II فعل können."},{"de":"müsste","fa":"مجبور بودم / باید","note":"Konjunktiv II فعل müssen."},{"de":"sollte","fa":"بهتر بود / می‌بایست","note":"نصیحت یا انتظار؛ بسته به بافت."},{"de":"dürfte","fa":"اجازه داشتم / احتمالاً","note":"بسته به بافت اجازه یا حدس محتاطانه."},{"de":"die Bedingung","fa":"شرط","note":"unter der Bedingung, dass ..."},{"de":"sich wünschen","fa":"آرزو کردن","note":"ich wünschte, ... برای آرزوی غیرواقعی."},{"de":"bereuen","fa":"پشیمان بودن","note":"etwas bereuen + Akkusativ."},{"de":"der Mut","fa":"شجاعت","note":"Mut haben / mutig sein."},{"de":"sich trauen","fa":"جرئت کردن","note":"sich trauen, etwas zu tun."},{"de":"sparen","fa":"پس‌انداز کردن","note":"für eine Reise sparen."},{"de":"verzichten auf","fa":"چشم پوشیدن از","note":"auf + Akkusativ."},{"de":"An deiner Stelle","fa":"اگر جای تو بودم","note":"قالب ثابت برای پیشنهاد مودبانه."},{"de":"stattdessen","fa":"در عوض","note":"قید؛ در آغاز جمله فعل بعد از آن می‌آید."},{"de":"die Entscheidung","fa":"تصمیم","note":"eine Entscheidung treffen."},{"de":"die Vergangenheit","fa":"گذشته","note":"etwas in der Vergangenheit bereuen."},{"de":"damals","fa":"آن زمان","note":"اشاره به زمان مشخص در گذشته."},{"de":"im Nachhinein","fa":"بعداً با نگاه به گذشته","note":"برای ارزیابی تصمیم قبلی."},{"de":"die Gelegenheit","fa":"فرصت","note":"eine Gelegenheit nutzen / verpassen."},{"de":"verpassen","fa":"از دست دادن","note":"eine Chance verpassen."},{"de":"je ... desto","fa":"هرچه ... به همان نسبت","note":"je länger, desto schwieriger."},{"de":"zumindest","fa":"دست‌کم","note":"برای محدود کردن ادعا."},{"de":"am liebsten","fa":"از همه بیشتر ترجیحاً","note":"میل و ترجیح را بیان می‌کند."},{"de":"sich vorstellen","fa":"تصور کردن","note":"Ich könnte mir vorstellen, ..."}]},{"type":"grammar","title":"شرط فرضی در زمان حال و آینده","body":"برای شرایط خلاف واقع یا کم‌احتمال از Konjunktiv II استفاده می‌شود. الگوی رایج: [[Wenn + ... + فعل صرف‌شده در پایان]] و سپس بند اصلی با [[würde + Infinitiv]]، یا شکل خاص فعل‌هایی مثل [[hätte]]، [[wäre]]، [[könnte]]. وجود würde در همهٔ جمله‌ها الزامی نیست.\n\n• [[Wenn ich mehr Geld hätte, würde ich weniger arbeiten.]] (اگر پول بیشتری داشتم، کمتر کار می‌کردم.)\n• [[Wenn wir Zeit hätten, kämen wir vorbei.]] (اگر وقت داشتیم، سری می‌زدیم.)\n• [[Wäre die Wohnung größer, könnten wir Gäste einladen.]] (اگر آپارتمان بزرگ‌تر بود، می‌توانستیم مهمان دعوت کنیم.)\n• [[Ich würde dich unterstützen, wenn ich könnte.]] (اگر می‌توانستم، از تو حمایت می‌کردم.)\n• [[An deiner Stelle würde ich nachfragen.]] (اگر جای تو بودم، پیگیری می‌کردم.)\n• [[Ich hätte gern ein ruhigeres Zimmer.]] (یک اتاق آرام‌تر می‌خواستم.)\n• [[Könntest du mir kurz helfen?]] (ممکن است کمی کمکم کنی؟)"},{"type":"tip","body":"[[Ich würde glücklich sein]] از نظر دستوری ممکن است؛ بااین‌حال [[Ich wäre glücklich]] معمولاً کوتاه‌تر و طبیعی‌تر است. [[würde]] را «همیشه غلط» تصور نکن."},{"type":"grammar","title":"حسرت و شرط نامحقق در گذشته","body":"برای اتفاقی که در گذشته رخ نداده است، از [[hätte/wäre + Partizip II]] استفاده کن. انتخاب haben/sein مثل Perfekt انجام می‌شود. در شرط گذشته، هر دو بند می‌توانند Konjunktiv II گذشته داشته باشند.\n\n• [[Wenn ich früher losgefahren wäre, hätte ich den Zug erreicht.]] (اگر زودتر راه افتاده بودم، به قطار می‌رسیدم.)\n• [[Ich wünschte, ich hätte mehr gelernt.]] (کاش بیشتر درس خوانده بودم.)\n• [[Wäre ich doch zu Hause geblieben!]] (کاش در خانه مانده بودم!)\n• [[Hätte sie mich angerufen, wäre ich gekommen.]] (اگر تماس گرفته بود، می‌آمدم.)\n• [[Wir hätten die Frist nicht verpassen dürfen.]] (نباید مهلت را از دست می‌دادیم.)\n• [[Er hätte früher Bescheid sagen sollen.]] (بهتر بود زودتر خبر می‌داد.)\n• [[Ich wäre gern länger geblieben.]] (دوست داشتم مدت بیشتری مانده بودم.)"},{"type":"tip","body":"در ساختار گذشته همراه فعل مدال، دو مصدر آخر جمله می‌آیند: [[Ich hätte früher gehen müssen.]] نه [[Ich hätte früher gemusst gehen.]] این ساختار [[Ersatzinfinitiv]] نام دارد."},{"type":"grammar","title":"شرط ترکیبی، حذف wenn و توصیهٔ مؤدبانه","body":"گاهی علتِ فرضی مربوط به گذشته است ولی نتیجه در زمان حال دیده می‌شود. همچنین می‌توان [[wenn]] را حذف کرد و فعل را در ابتدای جمله آورد؛ این شیوه در نوشتار رسمی رایج‌تر است. در موقعیت‌های واقعی از وجه اخباری استفاده کن، نه Konjunktiv II.\n\n• [[Wenn ich damals Deutsch gelernt hätte, könnte ich heute leichter studieren.]] (اگر آن موقع آلمانی خوانده بودم، امروز راحت‌تر درس می‌خواندم.)\n• [[Hätte ich früher angefangen, wäre ich jetzt fertig.]] (اگر زودتر شروع کرده بودم، الان کارم تمام بود.)\n• [[Würdest du an meiner Stelle kündigen?]] (اگر جای من بودی استعفا می‌دادی؟)\n• [[Wenn das Wetter besser wäre, würden wir draußen sitzen.]] (اگر هوا بهتر بود، بیرون می‌نشستیم.)\n• [[Solltest du Fragen haben, melde dich bitte.]] (اگر احیاناً سؤالی داشتی، لطفاً خبر بده.)\n• [[Ich könnte mir vorstellen, im Ausland zu arbeiten.]] (می‌توانم تصور کنم که خارج از کشور کار کنم.)\n• [[Je mehr Zeit wir hätten, desto gründlicher könnten wir planen.]] (هرچه زمان بیشتری داشتیم، می‌توانستیم دقیق‌تر برنامه‌ریزی کنیم.)"},{"type":"tip","body":"[[Wenn ich Zeit habe, komme ich.]] شرط واقعی است؛ [[Wenn ich Zeit hätte, würde ich kommen.]] شرط فرضی. آن‌ها را بر اساس منظور انتخاب کن، نه صرفاً پیچیده‌تر بودن."},{"type":"mistakes","items":[{"wrong":"Wenn ich hätte Zeit, würde ich reisen.","right":"Wenn ich Zeit hätte, würde ich reisen.","fa":"در بند وابسته با wenn، فعل صرف‌شده به انتهای همان بند می‌رود."},{"wrong":"Wenn ich früher gelernt hätte, ich hätte bestanden.","right":"Wenn ich früher gelernt hätte, hätte ich bestanden.","fa":"وقتی بند wenn اول می‌آید، بند اصلی با فعل صرف‌شده شروع می‌شود."},{"wrong":"Ich hätte gestern gehen gemusst.","right":"Ich hätte gestern gehen müssen.","fa":"در Perfekt فرضی با مصدر دوم و فعل مدال، Ersatzinfinitiv به کار می‌رود."}]},{"type":"text","de":"Als ich vor zwei Jahren meinen ersten Arbeitsplatz angenommen habe, war ich überzeugt, dass ich dort lange bleiben würde. Die Kollegen waren freundlich, aber die Aufgaben wurden mit der Zeit eintönig. Heute denke ich manchmal: Hätte ich damals einen anderen Vertrag unterschrieben, würde ich vielleicht an einem spannenderen Projekt arbeiten. Andererseits hätte ich dann viele wichtige Erfahrungen nicht gemacht.\n\nNeulich sprach ich mit einer Freundin darüber. Sie meinte, ich sollte die Vergangenheit nicht ständig mit einer idealen Alternative vergleichen. Wenn ich wirklich unzufrieden wäre, könnte ich mich jetzt nach einer neuen Stelle umsehen. Sie hätte an meiner Stelle zunächst mit der Teamleitung gesprochen, bevor sie eine Entscheidung getroffen hätte.\n\nIhre Worte haben mir geholfen. Ich wünschte zwar, ich hätte manche Gelegenheiten früher genutzt, aber das lässt sich nicht mehr ändern. Stattdessen habe ich eine Weiterbildung gefunden, die im nächsten Monat beginnt. Wenn alles gut läuft, werde ich dadurch neue Aufgaben übernehmen können. Sollte der Kurs zu teuer werden, könnte ich nach einer Förderung fragen.\n\nIch habe begriffen, dass ein Wunsch keine fertige Lebensplanung ersetzt. Es wäre schön, jede Entscheidung vorher sicher beurteilen zu können. Solange das unmöglich ist, muss ich jedoch mit Unsicherheit leben und trotzdem handeln.","fa":"وقتی دو سال پیش اولین کارم را قبول کردم، مطمئن بودم مدت زیادی آنجا می‌مانم. همکاران مهربان بودند، اما وظایف کم‌کم یکنواخت شدند. امروز گاهی فکر می‌کنم اگر قرارداد دیگری امضا کرده بودم، شاید الان روی پروژهٔ جذاب‌تری کار می‌کردم. از سوی دیگر، آن وقت تجربه‌های مهم زیادی کسب نمی‌کردم.\n\nچند وقت پیش دربارهٔ این موضوع با دوستی صحبت کردم. او گفت نباید مدام گذشته را با جایگزینی آرمانی مقایسه کنم. اگر واقعاً ناراضی بودم، می‌توانستم همین حالا دنبال کار تازه بگردم. او اگر جای من بود، پیش از تصمیم گرفتن ابتدا با سرپرست تیم گفت‌وگو می‌کرد.\n\nحرف‌هایش کمکم کرد. هرچند کاش از بعضی فرصت‌ها زودتر استفاده کرده بودم، دیگر نمی‌توانم آن را تغییر بدهم. در عوض دورهٔ تکمیلی‌ای پیدا کرده‌ام که ماه آینده آغاز می‌شود. اگر همه‌چیز خوب پیش برود، می‌توانم وظایف تازه‌ای برعهده بگیرم. اگر هزینهٔ دوره خیلی بالا برود، شاید دربارهٔ کمک‌هزینه سؤال کنم.\n\nفهمیده‌ام که آرزو جای برنامه‌ریزی واقعی را نمی‌گیرد. عالی بود اگر می‌توانستیم همهٔ تصمیم‌ها را از پیش با اطمینان ارزیابی کنیم. اما تا وقتی این ممکن نیست، باید با عدم‌قطعیت زندگی کنم و بااین‌حال عمل کنم."}],"exercises":[{"type":"mc","q":"شرط فرضیِ حال کدام است؟","options":["Wenn ich Zeit habe, komme ich.","Wenn ich Zeit hätte, würde ich kommen.","Weil ich Zeit habe, komme ich."],"answer":1,"why":"[[hätte]] و [[würde kommen]] نشان‌دهندهٔ موقعیت غیرواقعی در زمان حال‌اند."},{"type":"blank","text":"Wenn er früher losgefahren ___, hätte er den Zug erreicht.","answer":"wäre"},{"type":"type","q":"به آلمانی بنویس: اگر پول بیشتری داشتم، سفر می‌کردم.","answer":"Wenn ich mehr Geld hätte, würde ich reisen.","accept":["Wenn ich mehr Geld hätte, würde ich reisen"]},{"type":"mc","q":"کدام جمله حسرتِ گذشته را بیان می‌کند؟","options":["Ich bleibe zu Hause.","Ich wäre gern länger geblieben.","Ich werde morgen bleiben."],"answer":1,"why":"[[wäre ... geblieben]] Konjunktiv II گذشته است."},{"type":"blank","text":"Ich wünschte, ich ___ gestern mehr gelernt.","answer":"hätte"},{"type":"type","q":"با حذف wenn بازنویسی کن: Wenn ich mehr Zeit hätte, würde ich helfen.","answer":"Hätte ich mehr Zeit, würde ich helfen.","accept":["Hätte ich mehr Zeit, würde ich helfen"]},{"type":"mc","q":"کدام توضیح دربارهٔ «Ich würde glücklich sein» صحیح است؟","options":["این جمله همیشه نادرست است.","دستوری است، ولی Ich wäre glücklich اغلب طبیعی‌تر است.","فقط برای گذشته استفاده می‌شود."],"answer":1,"why":"[[würde + Infinitiv]] می‌تواند با sein بیاید، ولی شکل خاص wäre غالباً ترجیح دارد."},{"type":"blank","text":"An deiner Stelle ___ ich zuerst mit dem Chef sprechen.","answer":"würde"},{"type":"type","q":"به آلمانی بنویس: کاش زودتر شروع کرده بودم.","answer":"Ich wünschte, ich hätte früher angefangen.","accept":["Ich wünschte, ich hätte früher angefangen"]},{"type":"mc","q":"کدام جمله شرط ترکیبیِ گذشته و حال است؟","options":["Wenn ich gestern gelernt hätte, könnte ich heute mehr verstehen.","Wenn ich morgen lerne, verstehe ich mehr.","Wenn ich gestern lernte, werde ich morgen verstehen."],"answer":0,"why":"شرط گذشته با [[hätte gelernt]] و نتیجهٔ حال با [[könnte]] آمده است."},{"type":"blank","text":"Ich hätte früher gehen ___ . (müssen)","answer":"müssen"},{"type":"type","q":"به آلمانی بنویس: اگر جای تو بودم، سؤال می‌کردم.","answer":"An deiner Stelle würde ich nachfragen.","accept":["An deiner Stelle würde ich nachfragen"]}],"glossary":{"aber":"اما","alles":"همه‌چیز","als":"وقتی‌که / به‌عنوان","alternative":"جایگزین","am":"درِ (an dem)","an":"در / بر / روی","anderen":"دیگر (صرف شده)","andererseits":"از سوی دیگر","angefangen":"شروع کرده","angenommen":"پذیرفته","arbeiten":"کار کردن","arbeitsplatz":"محل کار","auch":"هم","auf":"روی / به","aufgaben":"وظایف","bedingung":"شرط","beginnt":"آغاز می‌شود","begriffen":"فهمیده","bereuen":"پشیمان شدن","beurteilen":"ارزیابی کردن","bevor":"پیش از آنکه","bleiben":"ماندن","dadurch":"از این طریق","dafür":"برای این / در عوض","damals":"آن زمان","damit":"با آن / تا اینکه","dann":"بعد","darüber":"دربارهٔ آن","das":"آن / این / حرف تعریف خنثی","dass":"که","deiner":"مال تو / تو (حالت صرف‌شده)","denke":"فکر می‌کنم","der":"حرف تعریف مذکر / داتیو مؤنث","desto":"به همان نسبت","die":"حرف تعریف مؤنث / جمع","dieser":"این (حالت صرف‌شده)","doch":"اما / ولی","dort":"آنجا","du":"تو","dürfte":"احتمالاً / اجازه داشتم","ein":"یک","eine":"یک (مؤنث)","einem":"یک (داتیو مذکر/خنثی)","einen":"یک (مفعولی مذکر)","einer":"یک (صرف‌شده)","einmal":"یک بار / ابتدا","eintönig":"یکنواخت","entscheidung":"تصمیم","erfahrungen":"تجربه‌ها","ersetzt":"جایگزین می‌کند","erst":"تازه","ersten":"اولین","es":"آن","fahren":"رفتن با وسیله / رانندگی کردن","fang":"شروع کن","fertige":"تکمیل می
