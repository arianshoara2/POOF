ن","schon":"از پیش","schreiben":"نوشتن","schön":"قشنگ / خوب","sich":"خود / ضمیر بازتابی","sicher":"مطمئن","sie":"او (مؤنث) / آن‌ها / شما","solange":"تا وقتی که","sollte":"بهتر بود / قرار بود","spannenderen":"جذاب‌تر","sparen":"پس‌انداز کردن","sprach":"حرف زد","stattdessen":"در عوض","stelle":"محل کار / جایگاه","stimmt":"درست است","ständig":"پیوسته","teamleitung":"سرپرستی تیم","teuer":"گران","trauen":"جرئت کردن","trotzdem":"با این حال","umsehen":"جست‌وجو کردن / نگاه کردن اطراف","und":"و","unmöglich":"ناممکن","unsicherheit":"عدم قطعیت","unterschrieben":"امضا کرده","unzufrieden":"ناراضی","urlaub":"مرخصی / سفر تعطیلات","vergangenheit":"گذشته","vergleichen":"مقایسه کردن","verpassen":"از دست دادن","vertrag":"قرارداد","verzichten":"چشم‌پوشی کردن","viel":"زیاد","viele":"بسیار","vielleicht":"شاید","vor":"قصد (در vorhaben) / پیش از","voraussetzung":"پیش‌شرط","vorher":"قبل‌تر","vorstellen":"تصور کردن / معرفی کردن","war":"بود","waren":"بودند","was":"چه","weiterbildung":"آموزش تکمیلی","wenn":"اگر / وقتی","werde":"خواهم (فعل کمکی آینده)","werden":"شدن / خواهند","wichtige":"مهم","wirklich":"واقعاً","wochen":"هفته‌ها","wohin":"به کجا","wollen":"خواستن","worte":"کلمات / سخنان","wunsch":"آرزو","wurden":"شدند","wäre":"می‌بود / بود","wünschen":"آرزو کردن","wünschte":"کاش / آرزو می‌کردم","würde":"می‌کرد / می‌شد","würdest":"می‌کردی","zeit":"زمان","zu":"به / برای / نشانهٔ مصدر","zuerst":"اول","zumindest":"دست‌کم","zunächst":"در ابتدا","zwar":"درست است که / هرچند","zwei":"دو","ändern":"تغییر دادن","übernehmen":"بر عهده گرفتن","überzeugt":"مطمئن / قانع"}},{"id":"l08","order":8,"level":"B2","minutes":35,"title":"مجهول در همه‌ی زمان‌ها","titleDe":"Das Passiv in allen Zeiten","blocks":[{"type":"dialog","lines":[{"de":"Hast du gehört? Das alte Kino am Bahnhof wird renoviert.","fa":"شنیدی؟ سینمای قدیمی کنار ایستگاه در حال بازسازی است."},{"de":"Ja, vor zwei Wochen wurde das Gebäude geschlossen.","fa":"بله، دو هفته پیش ساختمان بسته شد."},{"de":"Weißt du, wann die Arbeiten abgeschlossen werden?","fa":"می‌دانی کارها چه زمانی تمام خواهند شد؟"},{"de":"Die Eröffnung ist für Dezember geplant.","fa":"افتتاح برای دسامبر برنامه‌ریزی شده است."},{"de":"Ich dachte, das Haus sollte abgerissen werden.","fa":"فکر می‌کردم قرار بود ساختمان تخریب شود."},{"de":"Das stimmt. Der Plan wurde aber später geändert.","fa":"درست است. اما بعداً برنامه تغییر کرد."},{"de":"Von wem wurde die neue Lösung vorgeschlagen?","fa":"راه‌حل جدید را چه کسی پیشنهاد داد؟"},{"de":"Soweit ich weiß, von einer Bürgerinitiative.","fa":"تا جایی که می‌دانم، یک گروه ابتکار شهروندی."},{"de":"Und was wird dort in Zukunft gezeigt?","fa":"و در آینده آنجا چه چیزی نمایش داده می‌شود؟"},{"de":"Es sollen auch Dokumentarfilme gezeigt werden.","fa":"قرار است فیلم‌های مستند هم نمایش داده شوند."},{"de":"Wurden die Eintrittspreise schon bekannt gegeben?","fa":"قیمت بلیت‌ها اعلام شده است؟"},{"de":"Nein, darüber ist bisher noch nichts veröffentlicht worden.","fa":"نه، هنوز هیچ چیزی درباره‌اش منتشر نشده است."},{"de":"Schade. Hoffentlich bleibt das Kino bezahlbar.","fa":"حیف. امیدوارم سینما مقرون‌به‌صرفه بماند."},{"de":"Das hoffe ich auch. Die Räume werden jedenfalls barrierefrei gestaltet.","fa":"من هم امیدوارم. به‌هرحال فضاها برای دسترسی افراد دارای معلولیت مناسب‌سازی می‌شوند."}]},{"type":"vocab","items":[{"de":"das Vorgangspassiv","fa":"مجهول رویدادی","note":"werden + Partizip II: فرایند یا کنش."},{"de":"das Zustandspassiv","fa":"مجهول حالتی","note":"sein + Partizip II: حالت حاصل."},{"de":"das Partizip II","fa":"اسم مفعول","note":"مثل renoviert, gebaut, gefunden."},{"de":"bauen","fa":"ساختن","note":"gebaut؛ ساختن ساختمان."},{"de":"renovieren","fa":"بازسازی کردن","note":"renoviert؛ بدون ge-."},{"de":"abreißen","fa":"تخریب کردن","note":"riss ab, abgerissen؛ فعل جداشدنی."},{"de":"schließen","fa":"بستن","note":"schloss, geschlossen."},{"de":"genehmigen","fa":"تأیید کردن","note":"genehmigt؛ der Antrag wurde genehmigt."},{"de":"bekannt geben","fa":"اعلام کردن","note":"gab bekannt, bekannt gegeben."},{"de":"veröffentlichen","fa":"منتشر کردن","note":"veröffentlicht؛ اخبار، گزارش‌ها و اسناد."},{"de":"abschließen","fa":"تکمیل یا تمام کردن","note":"schloss ab, abgeschlossen."},{"de":"die Renovierung","fa":"بازسازی","note":"جمع: Renovierungen."},{"de":"das Gebäude","fa":"ساختمان","note":"جمع: Gebäude."},{"de":"die Maßnahme","fa":"اقدام","note":"Maßnahmen ergreifen."},{"de":"die Behörde","fa":"اداره یا نهاد رسمی","note":"جمع: Behörden."},{"de":"die Genehmigung","fa":"مجوز یا تصویب","note":"eine Genehmigung erhalten."},{"de":"die Eröffnung","fa":"افتتاح","note":"die Eröffnung ist geplant."},{"de":"die Bürgerinitiative","fa":"ابتکار عمل شهروندی","note":"گروه شهروندی برای هدفی مشترک."},{"de":"der Antrag","fa":"درخواست","note":"جمع: Anträge."},{"de":"der Zeuge","fa":"شاهد","note":"جمع: Zeugen."},{"de":"der Auftrag","fa":"سفارش یا مأموریت","note":"جمع: Aufträge."},{"de":"durch","fa":"بر اثر / از طریق","note":"با Akkusativ؛ عاملِ ابزاری یا واسطه."},{"de":"von","fa":"توسط / از سوی","note":"با Dativ؛ عاملِ کنش."},{"de":"mit","fa":"با / به‌وسیلهٔ","note":"ابزار همراه، با Dativ."},{"de":"der Bericht","fa":"گزارش","note":"جمع: Berichte."},{"de":"die Reparatur","fa":"تعمیر","note":"جمع: Reparaturen."},{"de":"das Ergebnis","fa":"نتیجه","note":"جمع: Ergebnisse."},{"de":"der Zustand","fa":"وضعیت","note":"جمع: Zustände."},{"de":"barrierefrei","fa":"بدون مانع دسترسی","note":"مثلاً برای ویلچر."},{"de":"erledigen","fa":"انجام دادن","note":"eine Aufgabe erledigen."}]},{"type":"grammar","title":"Vorgangspassiv و زمان‌های مختلف","body":"مجهول رویدادی با [[werden + Partizip II]] ساخته می‌شود. در فعل‌های زمان‌دار، [[werden]] یا فعل کمکی متناسب با زمان صرف می‌شود. عبارت [[worden]] در Perfekt/Plusquamperfekt مجهول می‌آید، نه [[geworden]]. در آیندهٔ مجهول شکل [[werden + Partizip II + werden]] ممکن است، هرچند اغلب زمان حال با قید آینده طبیعی‌تر است.\n\n• [[Das Museum wird renoviert.]] (موزه بازسازی می‌شود.)\n• [[Das Museum wurde letztes Jahr renoviert.]] (موزه پارسال بازسازی شد.)\n• [[Das Museum ist bereits renoviert worden.]] (موزه قبلاً بازسازی شده است.)\n• [[Das Museum war vorher renoviert worden.]] (موزه پیش‌تر بازسازی شده بود.)\n• [[Das Museum wird nächstes Jahr renoviert werden.]] (موزه سال آینده بازسازی خواهد شد.)\n• [[Die Ausstellung soll verlängert werden.]] (قرار است نمایشگاه تمدید شود.)\n• [[Das Problem hätte früher gelöst werden müssen.]] (مشکل باید زودتر حل می‌شد.)"},{"type":"tip","body":"در مجهول Perfekt بنویس [[ist gebaut worden]]؛ اما در جملهٔ [[Er ist Arzt geworden]] شکل [[geworden]] مربوط به فعل werden به معنی «شدن» است."},{"type":"grammar","title":"Zustandspassiv در برابر Vorgangspassiv","body":"[[sein + Partizip II]] معمولاً حالتِ حاصل از یک کنش را نشان می‌دهد. [[werden + Partizip II]] خود رویداد یا روند را برجسته می‌کند. جمله‌ای مثل [[Die Tür ist geschlossen]] ممکن است به صورت صفتی هم فهمیده شود؛ همیشه از بافت کمک بگیر. جملهٔ [[ist geschlossen worden]] بیان رخداد در گذشته است.\n\n• [[Die Tür wird gerade geschlossen.]] (در همین لحظه در بسته می‌شود.)\n• [[Die Tür ist geschlossen.]] (در بسته است.)\n• [[Die Tür ist gestern geschlossen worden.]] (در دیروز بسته شده است / دیروز آن را بستند.)\n• [[Die Fenster waren die ganze Nacht geöffnet.]] (پنجره‌ها تمام شب باز بودند.)\n• [[Der Brief wird geschrieben.]] (نامه در حال نوشته شدن است.)\n• [[Der Brief ist schon geschrieben.]] (نامه از قبل نوشته شده است.)\n• [[Die Aufgabe ist erledigt.]] (کار انجام شده است.)"},{"type":"tip","body":"در آلمانی، مجهول با فعل‌هایی که مفعول Akkusativ ندارند نیز گاهی به‌صورت غیرشخصی ساخته می‌شود: [[Hier wird getanzt.]] و [[Mir wird geholfen.]] پس «فقط فعل متعدی مجهول می‌شود» قانون دقیقی نیست."},{"type":"grammar","title":"عامل von/durch، مجهول غیرشخصی و جایگزین‌ها","body":"[[von + Dativ]] غالباً عامل انسانی یا نهادی را نشان می‌دهد؛ [[durch + Akkusativ]] عامل واسطه، فرایند یا علت را برجسته می‌کند. این تمایز همیشه مطلق نیست. اگر فاعلِ جملهٔ معلوم مفعول داتیو باشد، در مجهول به فاعلِ نومیناتیو تبدیل نمی‌شود. ساختارهای [[sich lassen + Infinitiv]] و [[sein + zu + Infinitiv]] هم در نوشته‌های رسمی مهم‌اند.\n\n• [[Das Bild wurde von einer Künstlerin gemalt.]] (تابلو را هنرمندی نقاشی کرد.)\n• [[Das Dach wurde durch den Sturm beschädigt.]] (سقف بر اثر طوفان آسیب دید.)\n• [[Mir wird hier gut geholfen.]] (اینجا خوب به من کمک می‌کنند.)\n• [[Im Saal wird nicht geraucht.]] (در سالن سیگار کشیده نمی‌شود.)\n• [[Das Formular lässt sich online ausfüllen.]] (می‌توان فرم را آنلاین پر کرد.)\n• [[Der Antrag ist bis Freitag einzureichen.]] (درخواست باید تا جمعه ارائه شود.)\n• [[Man hat die Regeln geändert.]] (قوانین را تغییر داده‌اند.)"},{"type":"tip","body":"[[Man hat die Regeln geändert]] جملهٔ معلوم با فاعل نامشخص است؛ [[Die Regeln wurden geändert]] مجهول است. این دو می‌توانند از نظر کاربرد نزدیک باشند، اما ساختارشان یکی نیست."},{"type":"mistakes","items":[{"wrong":"Der Antrag ist genehmigt geworden.","right":"Der Antrag ist genehmigt worden.","fa":"در مجهول Perfekt از worden استفاده می‌شود."},{"wrong":"Ich werde geholfen.","right":"Mir wird geholfen.","fa":"فعل helfen داتیو می‌گیرد؛ شخص داتیو باقی می‌ماند."},{"wrong":"Das Fenster hat gerade geöffnet worden.","right":"Das Fenster ist gerade geöffnet worden.","fa":"مجهول Perfekt با ist + Partizip II + worden ساخته می‌شود، نه hat."}]},{"type":"text","de":"In unserer Stadt wird zurzeit ein altes Schwimmbad umgebaut. Das Gebäude wurde vor fast fünfzig Jahren eröffnet und war lange Zeit ein beliebter Treffpunkt. Vor drei Jahren musste es jedoch geschlossen werden, weil schwere Schäden festgestellt worden waren. Zunächst sollte das Schwimmbad abgerissen werden. Nach Protesten aus der Nachbarschaft wurde der Beschluss noch einmal überprüft.\n\nInzwischen sind die neuen Pläne von der Stadtverwaltung genehmigt worden. Die alten Fenster werden ersetzt, das Dach wird repariert und die Umkleideräume werden barrierefrei gestaltet. Außerdem soll eine kleine Bibliothek eingerichtet werden. Einige Arbeiten können wegen des Wetters erst im Frühjahr durchgeführt werden. Wann genau das Projekt abgeschlossen sein wird, ist deshalb noch unklar.\n\nBei einer öffentlichen Veranstaltung wurde erklärt, wie die Kosten finanziert werden sollen. Mehrere Fragen aus dem Publikum konnten sofort beantwortet werden. Andere Fragen müssen erst noch geprüft werden. Den Anwohnerinnen und Anwohnern wurde zugesichert, dass sie regelmäßig informiert werden.\n\nEinige Räume sind bereits fertig renoviert; andere werden noch bearbeitet. Der Unterschied ist wichtig: Ein Raum, der gerade gestrichen wird, kann noch nicht genutzt werden. Ist der Raum gestrichen und getrocknet, steht er wieder zur Verfügung. Das neue Schwimmbad soll nicht nur moderner werden, sondern auch für möglichst viele Menschen zugänglich sein.","fa":"در شهر ما اکنون یک استخر قدیمی بازسازی می‌شود. ساختمان نزدیک پنجاه سال پیش افتتاح شد و مدت‌ها محل تجمع محبوبی بود. اما سه سال پیش به خاطر آسیب‌های جدی که شناسایی شده بود، مجبور شدند آن را ببندند. ابتدا قرار بود استخر تخریب شود. پس از اعتراض‌های همسایه‌ها تصمیم دوباره بررسی شد.\n\nدر این فاصله طرح‌های جدید توسط شهرداری تصویب شده‌اند. پنجره‌های قدیمی تعویض، سقف تعمیر و رختکن‌ها برای دسترسی بدون مانع مناسب‌سازی می‌شوند. علاوه بر این قرار است یک کتابخانهٔ کوچک ایجاد شود. برخی کارها به‌دلیل آب‌وهوا تازه در بهار قابل انجام هستند. بنابراین هنوز مشخص نیست پروژه دقیقاً چه زمانی تمام می‌شود.\n\nدر یک جلسهٔ عمومی توضیح داده شد که هزینه‌ها چطور تأمین خواهند شد. به چند سؤال حاضران فوراً پاسخ داده شد؛ سؤال‌های دیگر باید بعداً بررسی شوند. به ساکنان قول داده شد که مرتب اطلاع‌رسانی کنند.\n\nبرخی اتاق‌ها کاملاً بازسازی شده‌اند و روی بقیه هنوز کار می‌شود. این تفاوت مهم است: اتاقی که در حال رنگ شدن است قابل استفاده نیست؛ وقتی رنگ‌شدن و خشک‌شدن آن تمام شد دوباره در دسترس قرار می‌گیرد. قرار است استخر جدید نه فقط مدرن‌تر، بلکه برای افراد بیشتری دسترس‌پذیر باشد."}],"exercises":[{"type":"mc","q":"مجهول Perfekt درست کدام است؟","options":["Die Straße ist repariert geworden.","Die Straße ist repariert worden.","Die Straße hat repariert worden."],"answer":1,"why":"در [[Perfekt Vorgangspassiv]] از [[sein + Partizip II + worden]] استفاده می‌شود."},{"type":"blank","text":"Das Haus ___ im Jahr 1990 gebaut. (Präteritum Passiv)","answer":"wurde"},{"type":"type","q":"جمله را مجهول کن: Die Firma renoviert das Büro.","answer":"Das Büro wird von der Firma renoviert.","accept":["Das Büro wird von der Firma renoviert","Das Büro wird renoviert.","Das Büro wird renoviert"]},{"type":"mc","q":"کدام جمله حالت حاصل را نشان می‌دهد؟","options":["Die Tür wird geschlossen.","Die Tür ist geschlossen.","Die Tür wurde geschlossen."],"answer":1,"why":"[[ist geschlossen]] حالت موجود را نشان می‌دهد."},{"type":"blank","text":"Die Unterlagen sind bereits geprüft ___.","answer":"worden"},{"type":"type","q":"به آلمانی بنویس: اینجا سیگار کشیده نمی‌شود.","answer":"Hier wird nicht geraucht.","accept":["Hier wird nicht geraucht"]},{"type":"mc","q":"برای تأکید بر علت طبیعی، کدام مناسب‌تر است؟","options":["Das Dach wurde durch den Sturm beschädigt.","Das Dach hat den Sturm beschädigt.","Das Dach wurde sich Sturm beschädigt."],"answer":0,"why":"[[durch den Sturm]] علت آسیب را معرفی می‌کند."},{"type":"blank","text":"Mir ___ geholfen.","answer":"wird"},{"type":"type","q":"جمله را با sich lassen بساز: Man kann das Problem lösen.","answer":"Das Problem lässt sich lösen.","accept":["Das Problem lässt sich lösen"]},{"type":"mc","q":"کدام ساخت مجهول با فعل مدال درست است؟","options":["Das muss erledigt werden.","Das muss werden erledigt.","Das wird müssen erledigt."],"answer":0,"why":"در [[Modalverb + Partizip II + werden]]، مصدر werden در پایان قرار می‌گیرد."},{"type":"blank","text":"Der Antrag ist bis morgen ___ . (einreichen)","answer":"einzureichen"},{"type":"type","q":"به آلمانی بنویس: قوانین تغییر داده شدند.","answer":"Die Regeln wurden geändert.","accept":["Die Regeln wurden geändert"]}],"glossary":{"aber":"اما","abgerissen":"تخریب شده","abgeschlossen":"تکمیل‌شده / تمام‌شده","abreißen":"تخریب کردن","abschließen":"پایان دادن / قفل کردن","alte":"قدیمی","alten":"قدیمی (صرف‌شده)","altes":"قدیمی","am":"درِ (an dem)","andere":"دیگر","antrag":"درخواست رسمی . باید شرایط کارکنان را هم در نظر بگیریم."},{"de":"Ich schlage vor, zunächst ein kurzes Gespräch zu führen.","fa":"پیشنهاد می‌کنم ابتدا یک گفت‌وگوی کوتاه داشته باشیم."},{"de":"Einverstanden. Können wir dafür morgen einen Termin vereinbaren?","fa":"موافقم. می‌توانیم برای فردا قرار بگذاریم؟"},{"de":"Ja. Ich werde dann die wichtigsten Ergebnisse zum Ausdruck bringen.","fa":"بله. آن‌وقت مهم‌ترین نتایج را مطرح می‌کنم."},{"de":"Damit leisten Sie einen wertvollen Beitrag zur Planung.","fa":"با این کار کمک ارزشمندی به برنامه‌ریزی می‌کنید."},{"de":"Vielen Dank. Hoffentlich kommt unser Vorschlag bald zur Anwendung.","fa":"خیلی ممنون. امیدوارم پیشنهاد ما به‌زودی اجرا شود."}]},{"type":"vocab","items":[{"de":"eine Entscheidung treffen","fa":"تصمیم گرفتن","note":"treffen؛ نه eine Entscheidung machen در زبان معیار."},{"de":"in Betracht ziehen","fa":"در نظر گرفتن","note":"etwas in Betracht ziehen + Akkusativ."},{"de":"zur Kenntnis nehmen","fa":"ملاحظه یا دریافت و آگاهی از","note":"etwas zur Kenntnis nehmen."},{"de":"zur Verfügung stehen","fa":"در دسترس بودن","note":"jemandem + Dativ zur Verfügung stehen."},{"de":"zur Verfügung stellen","fa":"در اختیار گذاشتن","note":"jemandem + Dativ etwas + Akkusativ."},{"de":"Stellung nehmen zu","fa":"اظهارنظر یا موضع‌گیری دربارهٔ","note":"zu + Dativ."},{"de":"Rücksicht nehmen auf","fa":"ملاحظهٔ کسی یا چیزی را کردن","note":"auf + Akkusativ."},{"de":"einen Beitrag leisten","fa":"سهم یا کمک داشتن","note":"einen Beitrag zu + Dativ leisten."},{"de":"zum Ausdruck bringen","fa":"بیان کردن","note":"eine Meinung zum Ausdruck bringen."},{"de":"in Kauf nehmen","fa":"آگاهانه پذیرفتن پیامد نامطلوب","note":"Nachteile in Kauf nehmen."},{"de":"außer Acht lassen","fa":"نادیده گرفتن","note":"etwas außer Acht lassen."},{"de":"in Frage stellen","fa":"زیر سؤال بردن","note":"etwas grundsätzlich in Frage stellen."},{"de":"in Anspruch nehmen","fa":"از خدمت یا زمان استفاده کردن","note":"Hilfe in Anspruch nehmen."},{"de":"in Erfahrung bringen","fa":"کشف یا کسب اطلاع کردن","note":"in Erfahrung bringen, ob ..."},{"de":"einen Termin vereinbaren","fa":"قرار تعیین کردن","note":"mit jemandem einen Termin vereinbaren."},{"de":"ein Gespräch führen","fa":"گفت‌وگو انجام دادن","note":"ein Gespräch mit jemandem führen."},{"de":"Maßnahmen ergreifen","fa":"اقداماتی انجام دادن","note":"Maßnahmen gegen + Akk."},{"de":"einen Antrag stellen","fa":"درخواستی ثبت کردن","note":"einen Antrag auf + Akk. stellen."},{"de":"eine Rolle spielen","fa":"نقش داشتن","note":"eine wichtige Rolle spielen."},{"de":"zur Sprache bringen","fa":"مطرح کردن موضوع","note":"ein Problem zur Sprache bringen."},{"de":"in Verbindung stehen mit","fa":"در ارتباط بودن با","note":"mit + Dativ."},{"de":"einen Vorschlag machen","fa":"پیشنهاد دادن","note":"einen konkreten Vorschlag machen."},{"de":"eine Frage stellen","fa":"سؤال پرسیدن","note":"jemandem eine Frage stellen."},{"de":"zur Anwendung kommen","fa":"به اجرا درآمدن / به کار رفتن","note":"eine Regel kommt zur Anwendung."},{"de":"eine Beschwerde einreichen","fa":"شکایت رسمی ثبت کردن","note":"bei einer Behörde einreichen."},{"de":"einen Eindruck machen","fa":"تأثیر گذاشتن","note":"einen guten Eindruck machen."},{"de":"zur Folge haben","fa":"در پی داشتن / موجب شدن","note":"Auswirkungen zur Folge haben."},{"de":"unter Druck stehen","fa":"تحت فشار بودن","note":"oft beruflicher Druck."},{"de":"Verantwortung übernehmen","fa":"مسئولیت پذیرفتن","note":"für etwas Verantwortung übernehmen."},{"de":"zur Auswahl stehen","fa":"برای انتخاب موجود بودن","note":"mehrere Optionen stehen zur Auswahl."}]},{"type":"grammar","title":"Nomen-Verb-Verbindungen چه هستند؟","body":"ترکیب اسم و فعل، واحدهای واژگانی نسبتاً ثابتی‌اند که باید به‌صورت یکجا آموخته شوند. فعلِ همراه اغلب معنای عمومی‌تری دارد و هستهٔ معنی در اسم قرار می‌گیرد. برخی جایگزین فعلی ساده دارند، اما کاربرد و سبک آن‌ها کاملاً یکسان نیست. [[treffen]]، [[nehmen]]، [[stellen]] و [[bringen]] افعال پرتکرار این ساختارند.\n\n• [[Wir müssen eine Entscheidung treffen.]] (باید تصمیم بگیریم.)\n• [[Die Leitung wird Maßnahmen ergreifen.]] (مدیریت اقداماتی انجام خواهد داد.)\n• [[Sie möchte eine Frage stellen.]] (او می‌خواهد سؤالی بپرسد.)\n• [[Können wir das Thema zur Sprache bringen?]] (می‌توانیم موضوع را مطرح کنیم؟)\n• [[Das spielt für uns eine wichtige Rolle.]] (این برای ما نقش مهمی دارد.)\n• [[Ich werde Ihren Vorschlag in Betracht ziehen.]] (پیشنهادتان را در نظر می‌گیرم.)\n• [[Die Verzögerung hat zusätzliche Kosten zur Folge.]] (تأخیر موجب هزینه‌های اضافی می‌شود.)"},{"type":"tip","body":"در آلمانی [[eine Entscheidung treffen]] و [[einen Vorschlag machen]] ترکیب‌های معیارند. فعل یک ترکیب را بر اساس ترجمهٔ فارسی یا انگلیسی حدس نزن؛ کل عبارت را یاد بگیر."},{"type":"grammar","title":"حرف اضافه، حالت دستوری و جایگاه اجزا","body":"بسیاری از این ترکیب‌ها حرف اضافهٔ مشخص دارند. آن را همراه حالت دستوری حفظ کن: [[zu + Dativ]]، [[auf + Akkusativ]] و [[mit + Dativ]]. بعضی ترکیب‌ها هم از [[zur]] یا [[in]] به‌عنوان بخش ثابت عبارت استفاده می‌کنند و حرف اضافهٔ دومی ندارند. در پرسش و بند وابسته جای فعل مطابق قاعدهٔ معمول آلمانی عوض می‌شود.\n\n• [[Bitte nehmen Sie zu diesem Plan Stellung.]] (لطفاً دربارهٔ این طرح اظهار نظر کنید.)\n• [[Wir nehmen Rücksicht auf unsere Nachbarn.]] (ما حال همسایه‌ها را رعایت می‌کنیم.)\n• [[Die Unterlagen stehen Ihnen zur Verfügung.]] (اسناد در اختیار شما هستند.)\n• [[Ich stelle Ihnen den Bericht zur Verfügung.]] (گزارش را در اختیار شما می‌گذارم.)\n• [[Sie hat sich mit der Behörde in Verbindung gesetzt.]] (او با ادارهٔ مربوط تماس گرفته است.)\n• [[Ich weiß, dass sie eine Entscheidung getroffen hat.]] (می‌دانم که او تصمیمی گرفته است.)\n• [[Er nimmt regelmäßig Beratung in Anspruch.]] (او مرتب از خدمات مشاوره استفاده می‌کند.)"},{"type":"tip","body":"[[zur Verfügung stehen]] (در دسترس بودن) و [[zur Verfügung stellen]] (در اختیار گذاشتن) را جدا نگه دار: اولی بدون مفعول آکوزاتیو است و دومی کسی را دارندهٔ منبع می‌کند."},{"type":"grammar","title":"سبک رسمی، فعل ساده و تغییر معنا","body":"این ترکیب‌ها در ایمیل اداری، دانشگاه و بحث رسمی رایج‌اند، اما همیشه از فعل ساده «بهتر» نیستند. مثلاً [[helfen]] معمولاً روشن‌تر از [[Hilfe leisten]] است؛ انتخاب به متن و لحن بستگی دارد. بعضی عبارت‌ها بار معنایی دقیق دارند و قابل‌جایگزینی آزاد نیستند.\n\n• [[Wir werden Sie morgen informieren.]] (فردا به شما اطلاع خواهیم داد.)\n• [[Wir werden Sie morgen in Kenntnis setzen.]] (فردا رسماً شما را در جریان قرار خواهیم داد.)\n• [[Die Frage wurde im Meeting besprochen.]] (موضوع در جلسه بررسی شد.)\n• [[Wir haben die Frage zur Sprache gebracht.]] (موضوع را مطرح کردیم.)\n• [[Die neue Regel kommt ab Januar zur Anwendung.]] (قانون جدید از ژانویه اجرا می‌شود.)\n• [[Wir müssen gewisse Nachteile in Kauf nehmen.]] (باید برخی معایب را آگاهانه بپذیریم.)\n• [[Diese Aussage stellt das Ergebnis in Frage.]] (این گفته نتیجه را زیر سؤال می‌برد.)"},{"type":"tip","body":"در متن امتحانی بهتر است سه ترکیب دقیق و متناسب به کار ببری تا ده ترکیب ناآشنا و پرخطا. از هر ترکیب یک مثال شخصی بساز و زمان Perfekt آن را هم یاد بگیر."},{"type":"mistakes","items":[{"wrong":"Ich habe eine Entscheidung gemacht.","right":"Ich habe eine Entscheidung getroffen.","fa":"برای «تصمیم گرفتن» ترکیب معیار با treffen ساخته می‌شود."},{"wrong":"Bitte nehmen Sie auf unseren Plan Stellung.","right":"Bitte nehmen Sie zu unserem Plan Stellung.","fa":"Stellung nehmen با zu + Dativ می‌آید."},{"wrong":"Ich habe Rücksicht zu meine Kollegen genommen.","right":"Ich habe Rücksicht auf meine Kollegen genommen.","fa":"Rücksicht nehmen به auf + Akkusativ نیاز دارد."}]},{"type":"text","de":"Sehr geehrte Frau Klein,\n\nvielen Dank für Ihre Nachricht. Wir haben Ihre Vorschläge sorgfältig zur Kenntnis genommen und möchten Ihnen zunächst unsere Einschätzung mitteilen. Der Zeitplan spielt für unser Projekt eine wichtige Rolle. Deshalb haben wir mehrere Möglichkeiten in Betracht gezogen, bevor wir eine Entscheidung getroffen haben.\n\nEinige Mitarbeitende stehen derzeit unter großem Druck. Darauf müssen wir Rücksicht nehmen. Gleichzeitig möchten wir das Interesse unserer Kundinnen und Kunden nicht außer Acht lassen. Wir haben zusätzliche Informationen in Erfahrung gebracht und können Ihnen diese Unterlagen ab morgen zur Verfügung stellen. Die Übersicht soll Ihnen helfen, die unterschiedlichen Optionen zu vergleichen.\n\nAus unserer Sicht wäre es sinnvoll, zunächst ein Gespräch mit allen Beteiligten zu führen. Dabei könnten wir die offenen Fragen zur Sprache bringen und anschließend konkrete Maßnahmen ergreifen. Für die Umsetzung müssten wir allerdings gewisse zusätzliche Kosten in Kauf nehmen. Diese dürfen die Finanzierung des Projekts nicht grundsätzlich in Frage stellen.\n\nWir bitten Sie darum, bis Donnerstag zu unserem Vorschlag Stellung zu nehmen. Sollten Sie weitere Fragen haben, stehen wir Ihnen selbstverständlich zur Verfügung. Wir hoffen, dass unsere Zusammenarbeit einen wichtigen Beitrag zum Erfolg des Projekts leisten wird.\n\nMit freundlichen Grüßen\nDas Projektteam","fa":"خانم کلاین گرامی،\n\nاز پیام شما بسیار سپاسگزاریم. پیشنهادهایتان را با دقت ملاحظه کردیم و ابتدا می‌خواهیم ارزیابی خودمان را بیان کنیم. برنامهٔ زمانی برای پروژهٔ ما اهمیت زیادی دارد. ازاین‌رو پیش از تصمیم‌گیری چند امکان را در نظر گرفتیم.\n\nبرخی کارکنان در حال حاضر تحت فشار زیادی هستند و باید شرایط آنان را رعایت کنیم. درعین‌حال نمی‌خواهیم منافع مشتریان را نادیده بگیریم. اطلاعات بیشتری گردآوری کرده‌ایم و می‌توانیم مدارک را از فردا در اختیارتان بگذاریم. این خلاصه کمک می‌کند گزینه‌های مختلف را مقایسه کنید.\n\nاز نظر ما بهتر است ابتدا با همهٔ افراد درگیر جلسه‌ای بگذاریم، مسائل حل‌نشده را مطرح کنیم و سپس اقدامات مشخصی انجام دهیم. البته برای اجرا باید بعضی هزینه‌های اضافی را بپذیریم. این هزینه‌ها نباید اساس تأمین مالی پروژه را زیر سؤال ببرند.\n\nلطفاً تا پنجشنبه دربارهٔ پیشنهاد ما نظر بدهید. اگر سؤال دیگری دارید، با کمال میل پاسخ‌گو هستیم. امیدواریم همکاری ما سهم مهمی در موفقیت پروژه داشته باشد.\n\nبا احترام، گروه پروژه"}],"exercises":[{"type":"mc","q":"«تصمیم گرفتن» در آلمانی معیار چگونه بیان می‌شود؟","options":["eine Entscheidung machen","eine Entscheidung treffen","eine Entscheidung setzen"],"answer":1,"why":"ترکیب ثابت [[eine Entscheidung treffen]] است."},{"type":"blank","text":"Bitte nehmen Sie ___ unserem Vorschlag Stellung.","answer":"zu"},{"type":"type","q":"به آلمانی بنویس: اسناد در اختیار شما هستند.","answer":"Die Unterlagen stehen Ihnen zur Verfügung.","accept":["Die Unterlagen stehen Ihnen zur Verfügung"]},{"type":"mc","q":"کدام فعل برای «یک پیشنهاد دادن» درست است؟","options":["einen Vorschlag machen","einen Vorschlag treffen","einen Vorschlag nehmen"],"answer":0,"why":"[[einen Vorschlag machen]] یک ترکیب رایج و معیار است."},{"type":"blank","text":"Wir müssen Rücksicht ___ unsere Nachbarn nehmen.","answer":"auf"},{"type":"type","q":"با Perfekt بنویس: او تصمیمی گرفته است.","answer":"Sie hat eine Entscheidung getroffen.","accept":["Sie hat eine Entscheidung getroffen","Er hat eine Entscheidung getroffen.","Er hat eine Entscheidung getroffen"]},{"type":"mc","q":"کدام عبارت یعنی «از خدمات استفاده کردن»؟","options":["in Anspruch nehmen","in Frage stellen","zum Ausdruck bringen"],"answer":0,"why":"[[in Anspruch nehmen]] یعنی از خدمت، زمان یا امکان استفاده کردن."},{"type":"blank","text":"Die Dokumente stehen Ihnen zur ___ .","answer":"Verfügung"},{"type":"type","q":"به آلمانی بنویس: می‌خواهم دربارهٔ این مسئله اظهارنظر کنم.","answer":"Ich möchte zu diesem Thema Stellung nehmen.","accept":["Ich möchte zu diesem Thema Stellung nehmen"]},{"type":"mc","q":"کدام جمله از نظر حالت و حرف اضافه درست است؟","options":["Wir nehmen Rücksicht zu unseren Nachbarn.","Wir nehmen Rücksicht auf unsere Nachbarn.","Wir nehmen Rücksicht mit unsere Nachbarn."],"answer":1,"why":"[[Rücksicht nehmen auf + Akkusativ]] ساخت ثابت است."},{"type":"blank","text":"Wir sollten das Problem in Betracht ___ .","answer":"ziehen"},{"type":"type","q":"با این ترکیب جمله بساز: «این هزینه‌ها را می‌پذیریم» (in Kauf nehmen).","answer":"Wir nehmen diese Kosten in Kauf.","accept":["Wir nehmen diese Kosten in Kauf"]}],"glossary":{"ab":"از / از زمانِ","acht":"هشت","allem":"همه چیز (صرف‌شده)","allen":"همه (ص  است؛ از سوی دیگر ضبط کلاس در مرور کمک می‌کند."},{"de":"Hast du dafür ein konkretes Beispiel?","fa":"مثال مشخصی داری؟"},{"de":"Ja. Schwierige Erklärungen könnte man sich mehrmals anhören.","fa":"بله. توضیح‌های سخت را می‌شود چند بار گوش داد."},{"de":"Ich verstehe deinen Standpunkt, würde aber keine allgemeine Pflicht einführen.","fa":"موضعت را می‌فهمم، اما الزام همگانی تعیین نمی‌کردم."},{"de":"Dann sind wir uns zumindest in einem Punkt einig: Eine Mischung wäre sinnvoll.","fa":"پس دست‌کم در یک نکته توافق داریم: ترکیبی از هر دو مفید است."},{"de":"Genau. Zusammenfassend kommt es auf die Art der Lehrveranstaltung an.","fa":"دقیقاً. در جمع‌بندی همه‌چیز به نوع کلاس بستگی دارد."}]},{"type":"vocab","items":[{"de":"meiner Meinung nach","fa":"به نظر من","note":"در آغاز جمله فعل صرف‌شده بعد از عبارت می‌آید."},{"de":"meines Erachtens","fa":"از نظر من","note":"لحن رسمی‌تر؛ بدون حرف اضافه."},{"de":"aus meiner Sicht","fa":"از دید من","note":"بیان محترمانهٔ موضع."},{"de":"ich bin der Ansicht, dass","fa":"بر این باورم که","note":"فعلِ بند dass در پایان."},{"de":"zunächst einmal","fa":"در ابتدا / اول از همه","note":"برای دلیل اول."},{"de":"darüber hinaus","fa":"افزون بر این","note":"برای افزودن دلیل."},{"de":"außerdem","fa":"علاوه بر این","note":"قید ربطی؛ اگر اول جمله بیاید فعل بعدش می‌آید."},{"de":"einerseits ... andererseits","fa":"از یک سو ... از سوی دیگر","note":"بیان دو سوی مسئله."},{"de":"zwar ... aber","fa":"درست است که ... ولی","note":"پذیرش بخشی از استدلال مخالف."},{"de":"allerdings","fa":"البته / با این حال","note":"قید محدودسازی یا تضاد."},{"de":"hingegen","fa":"در مقابل","note":"برای تفاوت مستقیم؛ موقعیت جمله انعطاف دارد."},{"de":"dagegen","fa":"در برابر آن / مخالف","note":"قید تضاد؛ با gegen پیشوندی اشتباه نشود."},{"de":"trotzdem","fa":"بااین‌حال","note":"قید ربطی در بند اصلی."},{"de":"obwohl","fa":"با وجود اینکه","note":"حرف ربط؛ فعل آخر بند وابسته."},{"de":"trotz","fa":"با وجودِ","note":"معمولاً + Genitiv در نوشتار رسمی."},{"de":"dennoch","fa":"بااین‌حال","note":"رسمی‌تر از trotzdem."},{"de":"im Gegensatz dazu","fa":"در مقابلِ آن","note":"ساختار ربطی برای تضاد."},{"de":"zum Beispiel","fa":"برای مثال","note":"مثال را به استدلال وصل می‌کند."},{"de":"beispielsweise","fa":"برای نمونه","note":"جایگزین رسمی‌تر برای zum Beispiel."},{"de":"ein Argument dafür","fa":"دلیلی به نفع آن","note":"نقطهٔ شروع دلیل موافق."},{"de":"ein Einwand dagegen","fa":"اعتراضی علیه آن","note":"برای نقد یک ادعا."},{"de":"der Vorteil","fa":"مزیت","note":"جمع: Vorteile."},{"de":"der Nachteil","fa":"عیب / نقطه ضعف","note":"جمع: Nachteile."},{"de":"der Standpunkt","fa":"موضع / دیدگاه","note":"einen Standpunkt vertreten."},{"de":"zustimmen","fa":"موافق بودن","note":"jemandem + Dativ zustimmen."},{"de":"widersprechen","fa":"مخالفت کردن","note":"jemandem + Dativ widersprechen."},{"de":"begründen","fa":"استدلال یا دلیل آوردن","note":"eine Meinung begründen."},{"de":"zusammenfassend","fa":"در جمع‌بندی","note":"پیش از نتیجه‌گیری."},{"de":"abschließend","fa":"در پایان","note":"برای نتیجهٔ نهایی."},{"de":"unter dem Strich","fa":"در مجموع","note":"بیشتر محاوره‌ای تا کاملاً دانشگاهی."}]},{"type":"grammar","title":"ساختار گفت‌وگوی B2: موضع، دلیل، نمونه، جمع‌بندی","body":"در بحث سطح B2، فقط بیان نظر کافی نیست. موضعت را مشخص کن، برایش دلیل بیاور، با مثال توضیح بده و پاسخ طرف مقابل را بشنو. عبارت‌های آماده باید طبیعی و متنوع باشند، نه اینکه بدون ارتباط پشت هم ردیف شوند. هر دلیل بهتر است روشن کند «چرا» به نتیجهٔ موردنظر می‌رسد.\n\n• [[Meiner Meinung nach brauchen wir flexible Lösungen.]] (به نظر من به راهکارهای انعطاف‌پذیر نیاز داریم.)\n• [[Ich bin der Ansicht, dass Onlinekurse hilfreich sein können.]] (به نظرم کلاس‌های آنلاین می‌توانند مفید باشند.)\n• [[Ein wichtiges Argument dafür ist die Zeitersparnis.]] (یک دلیل مهم به نفع آن صرفه‌جویی در زمان است.)\n• [[Das lässt sich an einem Beispiel zeigen.]] (می‌توان این موضوع را با مثالی نشان داد.)\n• [[Könntest du diesen Punkt genauer erläutern?]] (می‌توانی این نکته را دقیق‌تر توضیح بدهی؟)\n• [[Dem kann ich nur teilweise zustimmen.]] (فقط تا حدی می‌توانم با این نظر موافق باشم.)\n• [[Zusammenfassend halte ich eine Kombination für sinnvoll.]] (در جمع‌بندی، ترکیبی از هر دو را مفید می‌دانم.)"},{"type":"tip","body":"الگوی مفید برای تمرین شفاهی: [[Behauptung → Begründung → Beispiel → Einschränkung → Fazit]]. مثلاً یک ادعا، یک دلیل، یک مثال واقعی یا فرضی و یک محدودیت روشن."},{"type":"grammar","title":"جمله‌های امتیازی: zwar/aber، obwohl، trotzdem، trotz","body":"این چهار ابزار تضاد یکسان نیستند. [[obwohl]] بند وابسته می‌سازد و فعل صرف‌شده را به آخر می‌برد. [[trotzdem]] قید است و در جملهٔ اصلی می‌تواند جای اول را بگیرد. [[trotz]] حرف اضافه است و در نوشتار معیار معمولاً با Genitiv می‌آید. [[zwar ... aber]] بخشی از حرف مخالف را می‌پذیرد اما نتیجهٔ دیگری می‌گیرد.\n\n• [[Zwar spart man Zeit, aber der persönliche Kontakt fehlt.]] (درست است که وقت ذخیره می‌شود، ولی تماس شخصی کم است.)\n• [[Obwohl das Angebot praktisch ist, hat es Nachteile.]] (با اینکه این امکان کاربردی است، عیب‌هایی هم دارد.)\n• [[Das Angebot ist praktisch. Trotzdem hat es Nachteile.]] (این امکان کاربردی است؛ بااین‌حال عیب‌هایی دارد.)\n• [[Trotz der Vorteile bin ich skeptisch.]] (با وجود مزیت‌ها، تردید دارم.)\n• [[Einerseits ist die Lösung günstig, andererseits kostet sie Zeit.]] (از یک طرف راهکار ارزان است، از طرف دیگر زمان‌بر است.)\n• [[Darüber hinaus können weitere Kosten entstehen.]] (علاوه بر این ممکن است هزینه‌های دیگری ایجاد شوند.)\n• [[Allerdings fehlen bisher zuverlässige Daten.]] (البته هنوز داده‌های قابل‌اعتماد وجود ندارند.)"},{"type":"tip","body":"[[Obwohl es regnet, gehen wir spazieren.]] ولی [[Es regnet. Trotzdem gehen wir spazieren.]] درست است؛ پس از obwohl فعل به پایان بند وابسته و پس از trotzdem در آغاز جمله فعل به جایگاه دوم می‌رود."},{"type":"grammar","title":"موافقت نسبی، اعتراض محترمانه و نتیجه‌گیری دقیق","body":"در بحث و نوشتن، مخالفتِ مؤدبانه را می‌توان بدون خنثی‌کردن نظر خود نشان داد. [[Ich verstehe Ihren Punkt, allerdings ...]] یعنی نکتهٔ مقابل را شنیده‌ای. جمع‌بندی نباید ادعای مطلق یا شاهد ساختگی داشته باشد. نتیجه را به دلایلی که مطرح کرده‌ای محدود کن.\n\n• [[Ich verstehe deinen Standpunkt, sehe das aber anders.]] (دیدگاهت را می‌فهمم، اما متفاوت فکر می‌کنم.)\n• [[Da muss ich dir in einem Punkt widersprechen.]] (در یک نکته باید با تو مخالفت کنم.)\n• [[Du hast recht, was die Kosten betrifft.]] (دربارهٔ هزینه‌ها حق با توست.)\n• [[Können wir uns darauf einigen, einen Versuch zu machen?]] (می‌توانیم توافق کنیم که آزمایشی انجام بدهیم؟)\n• [[Entscheidend ist, unter welchen Bedingungen das funktioniert.]] (نکتهٔ تعیین‌کننده این است که تحت چه شرایطی کار می‌کند.)\n• [[Daraus folgt nicht automatisch, dass alle profitieren.]] (از این الزاماً نتیجه نمی‌شود که همه سود می‌برند.)\n• [[Abschließend würde ich deshalb eine begrenzte Lösung empfehlen.]] (در پایان، به همین دلیل راهکاری محدود توصیه می‌کنم.)"},{"type":"tip","body":"به‌جای گفتن [[Alle Studierenden lernen online besser]]، بگو [[Einige Studierende könnten von digitalen Angeboten profitieren]]. در امتحان، ادعای دقیق و دفاع‌پذیر از تعمیمِ بی‌سند بهتر است."},{"type":"mistakes","items":[{"wrong":"Obwohl es ist teuer, kaufen wir es.","right":"Obwohl es teuer ist, kaufen wir es.","fa":"بعد از obwohl فعل صرف‌شده در پایان بند وابسته می‌آید."},{"wrong":"Es ist teuer. Trotzdem wir kaufen es.","right":"Es ist teuer. Trotzdem kaufen wir es.","fa":"trotzdem در جایگاه اول بند اصلی قرار می‌گیرد، پس فعل بلافاصله بعد از آن می‌آید."},{"wrong":"Ich stimme dich zu.","right":"Ich stimme dir zu.","fa":"فعل zustimmen متمم داتیو می‌گیرد؛ dir نه dich."}]},{"type":"text","de":"Sollten alle Vorlesungen an Hochschulen aufgezeichnet werden? Diese Frage wird seit einigen Jahren intensiv diskutiert. Aus meiner Sicht gibt es gute Gründe für ein solches Angebot. Allerdings sollte man genau unterscheiden, welche Lehrveranstaltungen gemeint sind und unter welchen Bedingungen die Aufnahmen genutzt werden.\n\nZunächst einmal ermöglichen Videos eine flexible Nachbereitung. Studierende, die arbeiten oder lange Wege zurücklegen müssen, können schwierige Inhalte später wiederholen. Darüber hinaus profitieren manche Lernende davon, Erklärungen mehrmals anzuhören. Ein Beispiel sind Vorlesungen mit vielen Fachbegriffen: Hier kann eine Aufnahme helfen, Notizen in Ruhe zu ergänzen.\n\nAndererseits gibt es auch Einwände. Nicht jede Lehrveranstaltung besteht aus einem Vortrag. In Seminaren werden persönliche Erfahrungen diskutiert, und die Beteiligten sollen offen sprechen können. Obwohl eine Aufnahme technisch möglich wäre, könnte sie diese Offenheit beeinträchtigen. Zudem folgt aus der Verfügbarkeit eines Videos nicht automatisch ein größerer Lernerfolg.\n\nIch kann daher beide Seiten verstehen. Meiner Meinung nach wäre eine freiwillige Aufzeichnung vieler Vorlesungen sinnvoll, während für interaktive Seminare besondere Regeln gelten sollten. Die Lehrenden müssten dabei über Datenschutz und Zugangsmöglichkeiten informiert werden.\n\nZusammenfassend lässt sich sagen, dass digitale Angebote die Präsenzlehre sinnvoll ergänzen können. Ein pauschales Verbot wäre ebenso wenig überzeugend wie eine Pflicht für jede Veranstaltung. Entscheidend ist eine Lösung, die sowohl den Studierenden als auch den Anforderungen des Unterrichts gerecht wird.","fa":"آیا باید همهٔ درس‌گفتارهای دانشگاه ضبط شوند؟ این پرسش سال‌هاست بحث می‌شود. از نظر من دلیل‌های خوبی برای این امکان وجود دارد، اما باید دید کدام نوع کلاس مدنظر است و ضبط‌ها تحت چه شرایطی استفاده می‌شوند.\n\nاول، ویدئوها مرور انعطاف‌پذیر را ممکن می‌کنند. دانشجویان شاغل یا کسانی که مسیر طولانی دارند می‌توانند مباحث سخت را دوباره ببینند. علاوه بر این برخی زبان‌آموزان از چندبار گوش‌دادن به توضیحات سود می‌برند. مثلاً در درس‌هایی که اصطلاحات تخصصی زیادی دارند، فیلم به تکمیل یادداشت‌ها کمک می‌کند.\n\nاز طرف دیگر اعتراض‌هایی هم هست. همهٔ کلاس‌ها فقط سخنرانی نیستند. در سمینارها تجربه‌های شخصی بحث می‌شوند و حاضران باید آزادانه حرف بزنند. با اینکه ضبط از نظر فنی امکان دارد، ممکن است این آزادی را کاهش دهد. همچنین صرف وجود ویدئو الزاماً به یادگیری بیشتر نمی‌انجامد.\n\nبنابراین هر دو دیدگاه را می‌فهمم. فکر می‌کنم ضبط اختیاری بسیاری از درس‌گفتارها مناسب است، درحالی‌که برای سمینارهای تعاملی باید قواعد ویژه‌ای وجود داشته باشد. استادان هم باید در مورد حریم خصوصی و دسترسی اطلاعات بگیرند.\n\nدر جمع‌بندی، امکانات دیجیتال می‌توانند مکمل مفیدی برای آموزش حضوری باشند. نه ممنوعیت کلی قانع‌کننده است و نه الزام همهٔ کلاس‌ها. مهم راه‌حلی است که هم نیاز دانشجویان و هم الزامات آموزشی را در نظر بگیرد."}],"exercises":[{"type":"mc","q":"بعد از obwohl ترتیب درست کدام است؟","options":["Obwohl es teuer ist, kaufen wir es.","Obwohl es ist teuer, kaufen wir es.","Obwohl ist es teuer, kaufen wir es."],"answer":0,"why":"obwohl بند وابسته می‌سازد؛ فعل صرف‌شده آخر بند می‌آید."},{"type":"blank","text":"Es ist teuer. Trotzdem ___ wir es.","answer":"kaufen"},{"type":"type","q":"به آلمانی بنویس: به نظر من این راهکار مفید است.","answer":"Meiner Meinung nach ist diese Lösung sinnvoll.","accept":["Meiner Meinung nach ist diese Lösung sinnvoll"]},{"type":"mc","q":"کدام عبارت برای مخالفت محترمانه مناسب است؟","options":["Du hast überhaupt keine Ahnung.","Ich verstehe deinen Punkt, sehe das aber anders.","Das ist kompletter Unsinn."],"answer":1,"why":"عبارت دوم دیدگاه مخاطب را به رسمیت می‌شناسد و بعد مخالفت می‌کند."},{"type":"blank","text":"Einerseits ist das günstig, ___ kostet es viel Zeit.","answer":"andererseits"},{"type":"type","q":"با obwohl وصل کن: Das Angebot ist praktisch. Es hat Nachteile.","answer":"Obwohl das Angebot praktisch ist, hat es Nachteile.","accept":["Obwohl das Angebot praktisch ist, hat es Nachteile"]},{"type":"mc","q":"کدام عبارت آغاز مناسبی برای جمع‌بندی است؟","options":["Zusammenfassend lässt sich sagen, dass ...","Ich weiß nicht, was ich sagen soll.","Noch etwas ganz anderes ..."],"answer":0,"why":"عبارت اول صریحاً آغاز نتیجه‌گیری را مشخص می‌کند."},{"type":"blank","text":"Ich stimme ___ teilweise zu.","answer":"dir"},{"type":"type","q":"با trotzdem بازنویسی کن: Es regnet, aber wir gehen spazieren.","answer":"Es regnet. Trotzdem gehen wir spazieren.","accept":["Es regnet. Trotzdem gehen wir spazieren"]},{"type":"mc","q":"کدام ادعا برای بحث دانشگاهی محتاطانه‌تر است؟","options":["Alle Studierenden lernen mit Videos besser.","Videos garantieren immer Erfolg.","Manche Studierende könnten von Aufzeichnungen profitieren."],"answer":2,"why":"بسته به شواهد، ادعای محدود و قابل‌دفاع بر تعمیم همگانی برتری دارد."},{"type":"blank","text":"Trotz ___ hohen Kosten halte ich die Idee für sinnvoll.","answer":"der"},{"type":"type","q":"به آلمانی بنویس: از یک سو ارزان است، از سوی دیگر زمان می‌برد.","answer":"Einerseits ist es günstig, andererseits kostet es Zeit.","accept":["Einerseits ist es günstig, andererseits kostet es Zeit"]}],"glossary":{"aber":"اما","abschließend":"در پایان","alle":"همه","allerdings":"البته / بااین‌حال","allgemeine":"همگانی / عمومی","als":"وقتی‌که / به‌عنوان","an":"در / بر / روی","anbieten":"ارائه دادن","andererseits":"از سوی دیگر","anforderungen":"الزامات / نیازمندی‌ها","angebot":"تخفیف / پیشنهاد ویژه","angebote":"گزینه‌ها / پیشنهادها","anhören":"گوش دادن","ansehen":"تماشا کردن","ansicht":"دیدگاه","anzuhören":"گوش دادن (مصدر با zu)","arbeiten":"کار کردن","argument":"استدلال","art":"نوع","auch":"هم","auf":"روی / به","aufgezeichnet":"ضبط‌شده","aufnahme":"فایل ضبط / ضبط‌کردن","aufnahmen":"فایل‌های ضبط","aufzeichnung":"ضبط / ثبت","aufzeichnungen":"ضبط‌ها","aus":"از","austausch":"تبادل / تعامل","automatisch":"به‌صورت خودکار","außerdem":"علاوه بر این","bedingungen":"شرایط","beeinträchtigen":"تضعیف کردن / تأثیر منفی گذاشتن","begründen":"دلیل آوردن","beide":"هر دو","beim":"هنگام / نزد (bei dem)","beispiel":"مثال","beispielsweise":"برای مثال","besondere":"ویژه / خاص","besteht":"تشکیل می‌شود / وجود دارد","beteiligten":"افراد مشارکت‌کننده","bin":"هستم / فعل کمکی Perfekt با ich","da":"آنجا / چون","dabei":"همراه","dafür":"برای این / در عوض","dagegen":"در مقابل / بر ضد آن","daher":"بنابراین","dann":"بعد","darüber":"دربارهٔ آن","das":"آن / این / حرف تعریف خنثی","dass":"که","datenschutz":"حفاظت از داده‌ها","davon":"از آن","dazu":"به آن / علاوه بر آن","deine":"مال
