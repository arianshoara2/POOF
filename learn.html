const DE_BASIC=[{"id":"l01","order":1,"level":"A1","minutes":12,"title":"سلام و معرفی","titleDe":"Begrüßung und Vorstellung","blocks":[{"type":"dialog","lines":[{"de":"Guten Morgen! Ist hier noch frei?","fa":"صبح بخیر! اینجا هنوز خالی است؟"},{"de":"Ja, natürlich. Setz dich bitte!","fa":"بله، حتماً. بفرما بنشین!"},{"de":"Danke! Ich heiße Arian. Wie heißt du?","fa":"ممنون! اسمم آرین است. اسم تو چیست؟"},{"de":"Ich bin Lena. Freut mich, Arian!","fa":"من لنا هستم. خوشبختم، آرین!"},{"de":"Freut mich auch. Kommst du aus Jena?","fa":"من هم خوشبختم. اهل ینا هستی؟"},{"de":"Nein, ich komme aus Erfurt. Und du?","fa":"نه، من اهل ارفورت هستم. تو چطور؟"},{"de":"Ich komme aus dem Iran und wohne jetzt in Jena.","fa":"من اهل ایرانم و حالا در ینا زندگی می‌کنم."},{"de":"Oh, schön! Lernst du auch Deutsch?","fa":"چه خوب! تو هم آلمانی یاد می‌گیری؟"},{"de":"Ja, ich lerne Deutsch. Heute ist mein erster Tag.","fa":"بله، آلمانی یاد می‌گیرم. امروز روز اول من است."},{"de":"Willkommen! Ich bin auch neu in diesem Kurs.","fa":"خوش آمدی! من هم در این کلاس تازه‌واردم."},{"de":"Entschuldigung, sind Sie unsere Lehrerin?","fa":"ببخشید، شما معلم ما هستید؟"},{"de":"Ja, ich heiße Frau Weber. Wie heißen Sie?","fa":"بله، من خانم وبر هستم. نام شما چیست؟"},{"de":"Ich heiße Arian. Guten Tag, Frau Weber!","fa":"من آرین هستم. روز بخیر، خانم وبر!"},{"de":"Guten Tag! Wir fangen gleich an.","fa":"روز بخیر! همین حالا شروع می‌کنیم."}]},{"type":"vocab","items":[{"de":"Hallo","fa":"سلام","note":"احوالپرسی عمومی؛ رسمی‌تر از «Hi» نیست."},{"de":"Guten Morgen","fa":"صبح بخیر","note":"برای صبح؛ در محل کار و دانشگاه هم طبیعی است."},{"de":"Guten Tag","fa":"روز بخیر","note":"سلام مودبانه در طول روز."},{"de":"Guten Abend","fa":"عصر یا شب بخیر","note":"برای سلام‌کردن از عصر به بعد."},{"de":"Gute Nacht","fa":"شب بخیر","note":"هنگام خداحافظی پیش از خواب، نه برای سلام."},{"de":"Tschüss","fa":"خداحافظ","note":"خودمانی؛ پایان گفت‌وگو."},{"de":"Auf Wiedersehen","fa":"خداحافظ","note":"پایان گفت‌وگو در موقعیت رسمی."},{"de":"Bis morgen","fa":"تا فردا","note":"وقتی قرار است فردا دوباره همدیگر را ببینید."},{"de":"Bitte","fa":"لطفاً / بفرمایید / خواهش می‌کنم","note":"بسته به موقعیت معنی فرق می‌کند."},{"de":"Danke","fa":"ممنون","note":"در پاسخ: Bitte یا Gern geschehen."},{"de":"Entschuldigung","fa":"ببخشید","note":"برای جلب توجه یا عذرخواهی."},{"de":"Freut mich","fa":"خوشبختم","note":"شکل کوتاه «Es freut mich»."},{"de":"Willkommen","fa":"خوش آمدی / خوش آمدید","note":"برای استقبال از تازه‌وارد."},{"de":"der Name","fa":"نام / اسم","note":"مذکر؛ عبارت «Wie ist dein Name?» هم درست است."},{"de":"heißen","fa":"نام داشتن","note":"ich heiße؛ du heißt؛ sie heißt."},{"de":"sein","fa":"بودن","note":"ich bin؛ du bist؛ er ist؛ wir sind."},{"de":"kommen","fa":"آمدن / اهل جایی بودن","note":"Woher kommst du? — Ich komme aus ..."},{"de":"wohnen","fa":"ساکن بودن","note":"Ich wohne in Jena."},{"de":"lernen","fa":"یاد گرفتن","note":"Ich lerne Deutsch."},{"de":"der Kurs","fa":"دوره / کلاس","note":"جمع: die Kurse؛ در «im Kurs» یعنی در دوره."},{"de":"die Lehrerin","fa":"معلم زن","note":"معلم مرد: der Lehrer."},{"de":"der Student","fa":"دانشجوی مرد","note":"دانشجوی زن: die Studentin؛ جمع Studenten."},{"de":"neu","fa":"جدید / تازه‌وارد","note":"Ich bin neu hier."},{"de":"heute","fa":"امروز","note":"برای زمان روز جاری."},{"de":"hier","fa":"اینجا","note":"مخالف: dort = آنجا."},{"de":"aus","fa":"از / اهل","note":"برای کشور یا شهر مبدأ: aus dem Iran."},{"de":"du","fa":"تو","note":"خطاب غیررسمی مفرد؛ فعل با آن صرف می‌شود."},{"de":"Sie","fa":"شما (رسمی)","note":"با S بزرگ؛ فعل مانند سوم‌شخص جمع صرف می‌شود."},{"de":"Wie heißt du?","fa":"اسمت چیست؟","note":"سؤال صمیمی؛ در موقعیت رسمی «Wie heißen Sie?»."},{"de":"Woher kommst du?","fa":"اهل کجایی؟","note":"جواب: Ich komme aus ..."}]},{"type":"grammar","title":"فعل sein و معرفی خود","body":"برای معرفی، شغل و ویژگی‌ها از فعل بی‌قاعدهٔ «بودن» استفاده می‌کنیم. صرف زمان حال: ich bin، du bist، er/sie/es ist، wir sind، ihr seid، sie/Sie sind. در جملهٔ خبری معمولاً فعل صرف‌شده در جایگاه دوم قرار می‌گیرد. برای معرفی با «دانشجو هستم»، در آلمانی معمولاً قبل از عنوان شغلی بدون صفت، حرف تعریف نمی‌آوریم.\nمثال‌ها:\n[[Ich bin Arian.]] (من آرین هستم)؛ [[Du bist neu hier.]] (تو اینجا تازه‌واردی)؛ [[Lena ist Studentin.]] (لنا دانشجوست)؛ [[Wir sind im Deutschkurs.]] (ما در کلاس آلمانی هستیم)؛ [[Ihr seid pünktlich.]] (شماها سروقت هستید)؛ [[Sie sind unsere Lehrerin.]] (شما معلم ما هستید)؛ [[Ich bin nicht müde.]] (من خسته نیستم)."},{"type":"tip","body":"برای معرفی شغل، جملهٔ [[Ich bin Student.]] طبیعی است؛ بدون حرف تعریف. اگر صفت اضافه شود، ساخت تغییر می‌کند: [[Ich bin ein neuer Student.]] (من دانشجوی تازه‌واردی هستم)."},{"type":"grammar","title":"heißen، kommen، wohnen و صرف فعل‌ها","body":"بیشتر فعل‌های معمولی در زمان حال با این پسوندها صرف می‌شوند: ich -e، du -st، er/sie/es -t، wir -en، ihr -t، sie/Sie -en. فعل heißen یک تفاوت املایی دارد: با du می‌گوییم heißt، نه heißst. برای مبدأ شهر معمولاً aus + نام شهر می‌آید؛ «ایران» استثناست و همراه حرف تعریف می‌آید: aus dem Iran. برای محل سکونت از in استفاده می‌کنیم.\nمثال‌ها:\n[[Ich heiße Lena.]] (اسم من لناست)؛ [[Wie heißt du?]] (اسم تو چیست؟)؛ [[Er heißt Amir.]] (اسم او امیر است)؛ [[Ich komme aus Erfurt.]] (من اهل ارفورت هستم)؛ [[Sie kommt aus dem Iran.]] (او اهل ایران است)؛ [[Wir wohnen in Jena.]] (ما در ینا زندگی می‌کنیم)؛ [[Lernst du Deutsch?]] (تو آلمانی یاد می‌گیری؟)."},{"type":"mistakes","items":[{"wrong":"Ich bin heiße Arian.","right":"Ich heiße Arian.","fa":"heißen خودش فعل اصلی است؛ نباید هم‌زمان bin را به آن اضافه کرد."},{"wrong":"Ich komme von Iran.","right":"Ich komme aus dem Iran.","fa":"برای کشور مبدأ «aus» می‌آید و Iran در این کاربرد با حرف تعریف مذکر است."},{"wrong":"Du heißtst Lena.","right":"Du heißt Lena.","fa":"به‌خاطر پایان ریشه با ß، در du فقط -t اضافه می‌شود."}]},{"type":"grammar","title":"سؤال ساختن و تفاوت du و Sie","body":"در سؤالِ پرسشی، واژهٔ پرسش (wie، woher، wo) اول می‌آید و بعد فعل صرف‌شده و فاعل. در سؤال بله/خیر فعل اول قرار می‌گیرد. «du» برای دوستان و هم‌کلاسی‌ها رایج است؛ «Sie» برای خطاب رسمی، مثل گفت‌وگو با کارمند یا مدرس ناآشنا. خطاب رسمیِ Sie همیشه با حرف بزرگ نوشته می‌شود. فعلِ Sie به شکل جمع صرف می‌شود.\nمثال‌ها:\n[[Wie heißt du?]] (اسم تو چیست؟)؛ [[Wie heißen Sie?]] (اسم شما چیست؟)؛ [[Woher kommst du?]] (اهل کجایی؟)؛ [[Wo wohnen Sie?]] (کجا زندگی می‌کنید؟)؛ [[Bist du neu hier?]] (آیا اینجا تازه‌واردی؟)؛ [[Sind Sie Frau Weber?]] (آیا شما خانم وبر هستید؟)؛ [[Kommen Sie aus Jena?]] (شما اهل ینا هستید؟)."},{"type":"tip","body":"به نقش [[Gute Nacht!]] دقت کن: یعنی «شب بخیر» موقع رفتن یا خوابیدن، نه «سلام، شب‌به‌خیر». برای شروع گفت‌وگو در شب از [[Guten Abend!]] استفاده کن."},{"type":"text","de":"Heute ist mein erster Tag in einem Deutschkurs in Jena. Ich heiße Arian und komme aus dem Iran. Jetzt wohne ich in Jena. Am Morgen gehe ich in den Kurs. Vor der Tür steht eine junge Frau. Sie sagt: „Guten Morgen! Ich bin Lena. Wie heißt du?“ Ich antworte: „Ich heiße Arian. Freut mich!“ Lena kommt aus Erfurt. Sie wohnt aber jetzt auch in Jena. Wir sind beide neu im Kurs. Das ist schön, denn ich kenne hier noch nicht viele Leute. Im Raum sind schon andere Studenten. Ein Mann sagt „Hallo“, und eine Frau sagt „Guten Tag“. Alle sind freundlich. Dann kommt unsere Lehrerin. Sie heißt Frau Weber. Ich sage: „Entschuldigung, sind Sie unsere Lehrerin?“ Sie lächelt und sagt: „Ja. Wie heißen Sie?“ Ich nenne meinen Namen und setze mich. Frau Weber schreibt ihren Namen an die Tafel. Dann fragen wir einander: „Woher kommst du?“ und „Wo wohnst du?“ Ich höre zu und spreche langsam. Am Ende sagt Lena: „Bis morgen!“ Ich sage: „Tschüss, Lena! Bis morgen!“ Ich bin froh. Mein erster Tag ist gut.","fa":"امروز اولین روز من در یک کلاس آلمانی در یناست. اسمم آرین است، اهل ایرانم و حالا در ینا زندگی می‌کنم. صبح به کلاس می‌روم. جلوی در زنی جوان ایستاده. می‌گوید: «صبح بخیر! من لنا هستم. اسمت چیست؟» پاسخ می‌دهم: «آرین هستم، خوشبختم!» لنا اهل ارفورت است، ولی اکنون او هم در ینا زندگی می‌کند. هر دو در کلاس تازه‌واردیم. خوشحالم، چون اینجا هنوز آدم‌های زیادی را نمی‌شناسم. در اتاق دانشجوهای دیگری هستند. مردی سلام می‌کند و زنی می‌گوید روز بخیر. همه مهربان‌اند. سپس معلممان می‌آید. اسمش خانم وبر است. می‌پرسم: «ببخشید، شما معلم ما هستید؟» لبخند می‌زند و می‌پرسد: «اسم شما چیست؟» نامم را می‌گویم و می‌نشینم. خانم وبر اسمش را روی تخته می‌نویسد. بعد از هم می‌پرسیم اهل کجا هستیم و کجا زندگی می‌کنیم. گوش می‌دهم و آرام حرف می‌زنم. پایان کلاس لنا می‌گوید تا فردا، و من هم خداحافظی می‌کنم. خوشحالم؛ روز اولم خوب بود."},{"type":"tip","body":"در شروع گفت‌وگو با فرد ناآشنا، [[Entschuldigung]] راه طبیعی برای جلب توجه است. بعد می‌توانی با [[Sind Sie ...?]] یا [[Wie heißen Sie?]] مؤدبانه بپرسی."}],"exercises":[{"type":"mc","q":"برای سلام‌کردن به کسی در ساعت ۱۹ کدام عبارت مناسب‌تر است؟","options":["Gute Nacht!","Guten Abend!","Auf Wiedersehen!"],"answer":1,"why":"[[Guten Abend!]] برای شروع سلام در عصر و شب است؛ [[Gute Nacht!]] برای خداحافظی پیش از خواب."},{"type":"mc","q":"کدام جمله درست است؟","options":["Ich bin heiße Arian.","Ich heiße Arian.","Ich heißt Arian."],"answer":1,"why":"[[heißen]] خودِ فعل است؛ با ich به شکل [[heiße]] می‌آید."},{"type":"blank","text":"Woher ___ du?","answer":"kommst","hint":"با du از فعل kommen استفاده کن."},{"type":"type","q":"به آلمانی بنویس: «من در ینا زندگی می‌کنم.»","answer":"Ich wohne in Jena.","accept":["Ich wohne in Jena"]},{"type":"mc","q":"اگر با کارمند اداری ناآشنا صحبت کنی، کدام مناسب‌تر است؟","options":["Wie heißt du?","Wie heißen Sie?","Wie heißen du?"],"answer":1,"why":"[[Sie]] خطاب رسمی است و فعل با آن به شکل [[heißen]] صرف می‌شود."},{"type":"blank","text":"Ich ___ neu im Kurs.","answer":"bin"},{"type":"type","q":"به آلمانی بنویس: «من اهل ایران هستم.»","answer":"Ich komme aus dem Iran.","accept":["Ich komme aus dem Iran"]},{"type":"mc","q":"جای فعل در یک سؤال بله/خیر کجاست؟","options":["معمولاً اول جمله","همیشه آخر جمله","بعد از دو اسم"],"answer":0,"why":"در سؤال بله/خیر، فعل صرف‌شده معمولاً در آغاز جمله می‌آید: [[Bist du neu?]]"},{"type":"blank","text":"Frau Weber, ___ Sie unsere Lehrerin?","answer":"sind","hint":"در سؤال رسمی، فعل sein برای Sie = sind."},{"type":"type","q":"به آلمانی بنویس: «اسم من لناست.»","answer":"Ich heiße Lena.","accept":["Ich heiße Lena","Mein Name ist Lena.","Mein Name ist Lena"]},{"type":"mc","q":"کدام معنی [[Freut mich!]] است؟","options":["من خسته‌ام","خوشبختم / از آشنایی خوشحالم","فردا می‌بینمت"],"answer":1,"why":"[[Freut mich!]] عبارت رایج هنگام آشنایی است."},{"type":"blank","text":"Du ___ aus Erfurt.","answer":"kommst","hint":"صرف kommen با du."}],"glossary":{"abend":"عصر / شب","aber":"اما","alle":"همه","am":"در / کنار (an dem)","an":"در / روی / کنار","andere":"دیگران / دیگر","antworte":"پاسخ می‌دهم","arian":"آرین (نام)","auch":"هم / نیز","auf":"روی / به","aus":"از / اهل","beide":"هردو","bin":"هستم","bis":"تا","bitte":"لطفاً","danke":"ممنون","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","denn":"زیرا / چون","der":"حرف تعریف مذکر","deutsch":"زبان آلمانی","deutschkurs":"کلاس زبان آلمانی","dich":"تو (مفعولی)","die":"حرف تعریف مؤنث / جمع","diesem":"این (داتیو مذکر/خنثی)","du":"تو","ein":"یک (مذکر/خنثی)","einander":"همدیگر","eine":"یک (مؤنث)","einem":"یک (داتیو مذکر/خنثی)","ende":"پایان","entschuldigung":"ببخشید","erfurt":"ارفورت","erster":"اولین","fangen":"گرفتن / آغاز کردن","fragen":"می‌پرسند / پرسیدن","frau":"خانم","frei":"آزاد / خالی","freundlich":"مهربان / دوستانه","freut":"خوشحال می‌کند (freut mich: خوشبختم)","froh":"خوشحال","gehe":"می‌روم","gleich":"همین الآن / به‌زودی","gut":"خوب","gute":"خوب (در شب‌بخیر)","guten":"خوب (صرف‌شده)","hallo":"سلام","heiße":"اسمم ... است","heißen":"نام داشتن / نام دارند","heißt":"نام دارد / اسمش ... است","heute":"امروز","hier":"اینجا","höre":"می‌شنوم","ich":"من","ihren":"مال او / مال شما (مفعولی مذکر)","im":"در / درونِ","in":"در","iran":"ایران","ist":"است","ja":"بله","jena":"ینا (شهر)","jetzt":"حالا","junge":"جوان","kenne":"می‌شناسم","komme":"می‌آیم","kommen":"آمدن","kommst":"می‌آیی / اهل ... هستی","kommt":"می‌آید","kurs":"دورهٔ درسی","langsam":"آهسته","lehrerin":"معلم زن","lena":"لنا (نام)","lerne":"یاد می‌گیرم","lernen":"یاد گرفتن / یاد می‌گیرند","lernst":"یاد می‌گیری","leute":"آدم‌ها","lächelt":"لبخند می‌زند","mann":"مرد","mein":"مال من (مذکر/خنثی)","meinen":"مال من در حالت مفعولی مذکر","mich":"من (مفعولی)","morgen":"صبح / فردا","nacht":"شب","name":"نام","namen":"نام (مفعولی)","natürlich":"البته / حتماً","nein":"نه","nenne":"نام می‌برم / می‌گویم","neu":"جدید / تازه‌وارد","nicht":"نه / نفی","noch":"هنوز / دیگر","oh":"اوه","raum":"اتاق","sage":"می‌گویم","sagt":"می‌گوید","schon":"از قبل / همین حالا","schreibt":"می‌نویسد","schön":"زیبا / خوب","sein":"مال او (مذکر) / بودن","setz":"بنشین (امر)","setze":"می‌نشینم (خودم)","sie":"او / آن‌ها / شما (با توجه به متن)","sind":"هستند / هستیم / هستید","spreche":"حرف می‌زنم","steht":"ایستاده است / قرار دارد","student":"دانشجو (مذکر)","studenten":"دانشجویان","tafel":"تخته","tag":"روز","tschüss":"خداحافظ","tür":"در","und":"و","unsere":"مال ما (مؤنث/جمع)","viele":"بسیار / چندین","vor":"پیش از / جلوی","weber":"وبر (نام خانوادگی)","wie":"چگونه / چطور / چه","wiedersehen":"دیدار دوباره / خداحافظ","willkommen":"خوش آمدید","wir":"ما","wo":"کجا","woher":"اهل کجا / از کجا","wohne":"ساکنم","wohnen":"ساکن‌اند / زندگی می‌کنند","wohnst":"ساکنی","wohnt":"ساکن است","zu":"به / در خانهٔ"}},{"id":"l02","order":2,"level":"A1","minutes":15,"title":"اعداد و ساعت","titleDe":"Zahlen und Uhrzeit","blocks":[{"type":"dialog","lines":[{"de":"Entschuldigung, wie spät ist es?","fa":"ببخشید، ساعت چند است؟"},{"de":"Es ist halb acht. Warum fragst du?","fa":"هفت و نیم است. چرا می‌پرسی؟"},{"de":"Mein Deutschkurs beginnt um acht Uhr.","fa":"کلاس آلمانی من ساعت هشت شروع می‌شود."},{"de":"Keine Sorge. Du hast noch dreißig Minuten.","fa":"نگران نباش. هنوز سی دقیقه وقت داری."},{"de":"Stimmt. Hast du heute auch Unterricht?","fa":"درست است. تو هم امروز کلاس داری؟"},{"de":"Ja, aber erst um Viertel nach neun.","fa":"بله، اما تازه ساعت نه و ربع."},{"de":"Treffen wir uns um zwölf Uhr zum Essen?","fa":"ساعت دوازده برای غذا همدیگر را ببینیم؟"},{"de":"Um zwölf kann ich nicht. Ich habe bis halb eins Unterricht.","fa":"ساعت دوازده نمی‌توانم. تا دوازده و نیم کلاس دارم."},{"de":"Dann vielleicht um Viertel vor eins?","fa":"پس شاید یک ربع به یک؟"},{"de":"Das passt. Also um zwölf Uhr fünfundvierzig.","fa":"مناسب است. پس ساعت دوازده و چهل‌وپنج."},{"de":"Super. Wie viele Leute kommen?","fa":"عالیه. چند نفر می‌آیند؟"},{"de":"Vier: du, ich und zwei Freunde.","fa":"چهار نفر: تو، من و دو دوست."},{"de":"Gut! Ich bin lieber fünf Minuten früher da.","fa":"خوبه! ترجیح می‌دهم پنج دقیقه زودتر آنجا باشم."},{"de":"Perfekt. Bis später, und sei pünktlich!","fa":"عالی. بعداً می‌بینمت، و سروقت باش!"}]},{"type":"vocab","items":[{"de":"eins","fa":"یک (۱)","note":"وقتی ساعت ۱ است می‌گوییم «ein Uhr»، نه eins Uhr."},{"de":"zwei","fa":"دو (۲)","note":"کاربرد برای ساعت دو و تعداد دو."},{"de":"drei","fa":"سه (۳)","note":"سه و ربع: Viertel nach drei."},{"de":"vier","fa":"چهار (۴)","note":"halb vier = ساعت ۳:۳۰."},{"de":"fünf","fa":"پنج (۵)","note":"برای شمارش دقیقه و نفر."},{"de":"sechs","fa":"شش (۶)","note":"شش نفر: sechs Personen."},{"de":"sieben","fa":"هفت (۷)","note":"هفت و نیم: halb acht."},{"de":"acht","fa":"هشت (۸)","note":"um acht Uhr = رأس ساعت ۸."},{"de":"neun","fa":"نه (۹)","note":"عدد ۹؛ ساعت: neun Uhr."},{"de":"zehn","fa":"ده (۱۰)","note":"zehn Minuten = ده دقیقه."},{"de":"elf","fa":"یازده (۱۱)","note":"به تلفظ f آخر دقت کن."},{"de":"zwölf","fa":"دوازده (۱۲)","note":"حرف ö را درست تلفظ کن."},{"de":"dreizehn","fa":"سیزده (۱۳)","note":"drei + zehn به‌هم پیوسته نوشته می‌شود."},{"de":"vierzehn","fa":"چهارده (۱۴)","note":"چهارده دقیقه: vierzehn Minuten."},{"de":"fünfzehn","fa":"پانزده (۱۵)","note":"یک ربع = fünfzehn Minuten."},{"de":"sechzehn","fa":"شانزده (۱۶)","note":"sechs → sechzehn؛ s حذف می‌شود."},{"de":"siebzehn","fa":"هفده (۱۷)","note":"sieben → siebzehn؛ en حذف می‌شود."},{"de":"achtzehn","fa":"هجده (۱۸)","note":"acht + zehn."},{"de":"neunzehn","fa":"نوزده (۱۹)","note":"neun + zehn."},{"de":"zwanzig","fa":"بیست (۲۰)","note":"بیست‌ویک: einundzwanzig."},{"de":"die Uhr","fa":"ساعت / واحد اعلام ساعت","note":"جمع: die Uhren؛ در «um acht Uhr» شکل مفرد."},{"de":"die Stunde","fa":"ساعت (مدت‌زمان)","note":"یک ساعت زمان = eine Stunde."},{"de":"die Minute","fa":"دقیقه","note":"جمع: die Minuten."},{"de":"die Viertelstunde","fa":"یک ربع (۱۵ دقیقه)","note":"Viertel nach = ربع گذشته از؛ Viertel vor = ربع مانده."},{"de":"halb","fa":"نیم / نیمه","note":"halb vier = ۳:۳۰، نه ۴:۳۰."},{"de":"vor","fa":"مانده به / قبل از","note":"zehn vor acht = ۷:۵۰."},{"de":"nach","fa":"گذشته از / بعد از","note":"zehn nach acht = ۸:۱۰."},{"de":"um","fa":"در ساعتِ مشخص","note":"um acht Uhr؛ اما es ist acht Uhr."},{"de":"pünktlich","fa":"سروقت","note":"به‌موقع به یک قرار یا کلاس رسیدن."},{"de":"zu spät","fa":"خیلی دیر / دیرکرده","note":"مخالف: zu früh = زودتر از وقت."}]},{"type":"grammar","title":"اعداد ۱ تا ۲۰ و ساخت عددهای بزرگ‌تر","body":"در آلمانی اعداد ۱۳ تا ۱۹ معمولاً از عدد یکان + zehn ساخته می‌شوند؛ دو استثنای املایی مهم sechzehn و siebzehn هستند. برای ۲۱ تا ۹۹ معمولاً ابتدا یکان و سپس und و دهگان می‌آید: einundzwanzig. در نام ساعتِ یک، ein به‌جای eins می‌نشیند. موقع خواندن عدد تلفن، رقم‌ها را غالباً جداجدا می‌گویند.\nمثال‌ها:\n[[Ich habe zwei Bücher.]] (دو کتاب دارم)؛ [[Wir sind sieben Personen.]] (ما هفت نفریم)؛ [[Das Kind ist sechzehn Jahre alt.]] (بچه شانزده ساله است)؛ [[Hier sind siebzehn Studenten.]] (اینجا هفده دانشجو هستند)؛ [[Sie hat zwanzig Minuten Zeit.]] (او بیست دقیقه وقت دارد)؛ [[Ich bin einundzwanzig Jahre alt.]] (من بیست‌ویک ساله‌ام)؛ [[Es ist ein Uhr.]] (ساعت یک است)."},{"type":"tip","body":"[[sechzehn]] و [[siebzehn]] را جدا حفظ کن: شکل‌های غلط [[sechszehn]] و [[siebenzehn]] زیاد دیده می‌شوند. از ۲۱ به بعد ترتیب یکان و دهگان را وارونه می‌گوییم: [[einundzwanzig]]."},{"type":"grammar","title":"پرسیدن و خواندن ساعت: نیم، ربع، پیش و پس","body":"برای پرسیدن ساعت دو سؤال رایج داریم: Wie spät ist es? و Wie viel Uhr ist es? در گفتار روزمره بعد از عدد یا بخشِ ربع و نیم، Uhr را همیشه تکرار نمی‌کنیم. «halb» به ساعت بعدی نگاه می‌کند: halb vier یعنی ۳:۳۰. «Viertel nach» یعنی ربع بعد از ساعت، و «Viertel vor» یعنی ربع مانده به ساعت. برای رفع ابهام، شکل دیجیتال ساعت مثل acht Uhr dreißig هم رایج است.\nمثال‌ها:\n[[Wie spät ist es?]] (ساعت چند است؟)؛ [[Es ist acht Uhr.]] (ساعت هشت است)؛ [[Es ist zehn nach acht.]] (هشت و ده دقیقه است)؛ [[Es ist Viertel nach acht.]] (هشت و ربع است)؛ [[Es ist halb neun.]] (هشت و نیم است)؛ [[Es ist Viertel vor neun.]] (یک ربع به نه است)؛ [[Es ist fünf vor neun.]] (پنج دقیقه به نه است)."},{"type":"mistakes","items":[{"wrong":"Es ist halb vier. = 4:30","right":"Es ist halb vier. = 3:30","fa":"در آلمانی halb به ساعت بعدی اشاره می‌کند: نیم ساعت مانده به چهار."},{"wrong":"Der Kurs beginnt in acht Uhr.","right":"Der Kurs beginnt um acht Uhr.","fa":"برای زمانِ دقیقِ شروعِ رویداد از حرف اضافهٔ um استفاده می‌شود."},{"wrong":"Es ist eins Uhr.","right":"Es ist ein Uhr.","fa":"هنگام اعلام ساعت یک، شکل درست ein Uhr است."}]},{"type":"grammar","title":"فعل haben و تعیین زمان قرار","body":"فعل haben در زمان حال این‌طور صرف می‌شود: ich habe، du hast، er/sie/es hat، wir haben، ihr habt، sie/Sie haben. برای بیان داشتنِ وقت می‌گوییم Zeit haben. در جملهٔ خبری، فعل صرف‌شده جایگاه دوم دارد. با um زمان شروع قرار را مشخص می‌کنیم؛ با von ... bis ... بازهٔ زمانی بیان می‌شود. بین ساعت وقوع یک رویداد و مدت آن فرق است: Uhr برای ساعتِ روز، Stunde برای مدت.\nمثال‌ها:\n[[Ich habe heute Zeit.]] (من امروز وقت دارم)؛ [[Hast du zehn Minuten?]] (ده دقیقه وقت داری؟)؛ [[Er hat um acht Uhr Unterricht.]] (او ساعت هشت کلاس دارد)؛ [[Wir haben eine Stunde Pause.]] (ما یک ساعت استراحت داریم)؛ [[Der Kurs beginnt um neun Uhr.]] (کلاس ساعت نه شروع می‌شود)؛ [[Ich lerne von acht bis zehn Uhr.]] (از ساعت هشت تا ده درس می‌خوانم)؛ [[Wir treffen uns um Viertel vor eins.]] (ساعت یک ربع به یک همدیگر را می‌بینیم)."},{"type":"tip","body":"[[Uhr]] و [[Stunde]] یکی نیستند: [[Es ist drei Uhr.]] (ساعت سه است)، اما [[Ich habe drei Stunden Zeit.]] (سه ساعت وقت دارم)."},{"type":"text","de":"Heute ist Montag. Ich habe um acht Uhr einen Deutschkurs. Am Morgen sehe ich auf die Uhr. Es ist sieben Uhr zwanzig. Ich habe also vierzig Minuten Zeit. Ich esse schnell etwas und gehe aus dem Haus. An der Haltestelle warten schon fünf Personen. Der Bus kommt um halb acht. Ich bin froh, denn ich bin nicht zu spät. Um Viertel vor acht bin ich im Kursraum. Die Lehrerin kommt pünktlich um acht Uhr. Der Unterricht dauert zwei Stunden. Um zehn Uhr haben wir eine Pause. Meine Freundin Lena fragt: „Hast du heute Mittag Zeit?“ Ich antworte: „Ja, aber nur bis halb eins.“ Sie möchte zusammen essen. Wir treffen uns um Viertel nach zwölf vor dem Café. Dort sitzen schon zwei Freunde. Jetzt sind wir vier Personen. Wir bestellen etwas zu essen. Um zwölf Uhr zwanzig trinken wir Wasser und sprechen über den Tag. Lena fragt: „Wie viel Uhr ist es?“ Ich sage: „Es ist zehn vor halb eins.“ Wir haben noch zehn Minuten. Um halb eins muss ich zurück. Am Abend sehe ich auf meinen Plan: Morgen beginnt mein Kurs erst um neun Uhr. Gut, ich kann länger schlafen!","fa":"امروز دوشنبه است. ساعت هشت کلاس آلمانی دارم. صبح به ساعت نگاه می‌کنم: هفت و بیست است. پس چهل دقیقه وقت دارم. سریع چیزی می‌خورم و از خانه بیرون می‌روم. در ایستگاه پنج نفر منتظرند. اتوبوس ساعت هفت و نیم می‌آید. خوشحالم چون دیر نکرده‌ام. یک ربع به هشت در کلاس هستم. معلم دقیقاً ساعت هشت می‌آید. کلاس دو ساعت طول می‌کشد. ساعت ده استراحت داریم. دوستم لنا می‌پرسد ظهر وقت داری؟ پاسخ می‌دهم فقط تا دوازده و نیم. او می‌خواهد با هم غذا بخوریم. ساعت دوازده و ربع جلوی کافه همدیگر را می‌بینیم. دو دوست دیگر هم آنجا نشسته‌اند؛ حالا چهار نفریم. غذایی سفارش می‌دهیم. دوازده و بیست آب می‌نوشیم و دربارهٔ روز صحبت می‌کنیم. لنا می‌پرسد ساعت چند است؟ می‌گویم ده دقیقه به دوازده و نیم است. هنوز ده دقیقه وقت داریم. ساعت دوازده و نیم باید برگردم. عصر برنامه‌ام را می‌بینم: فردا کلاس ساعت نه شروع می‌شود. عالی، می‌توانم بیشتر بخوابم!"},{"type":"tip","body":"برای قرارگذاشتن ساعت را دوباره به شکل دیجیتال تکرار کن: [[Viertel vor eins, also zwölf Uhr fünfundvierzig.]] این کار در مکالمه جلوی اشتباه را می‌گیرد."}],"exercises":[{"type":"mc","q":"ساعت ۳:۳۰ به آلمانی چه می‌شود؟","options":["halb drei","halb vier","Viertel nach drei"],"answer":1,"why":"[[halb vier]] یعنی ۳۰ دقیقه مانده به چهار، یعنی ۳:۳۰."},{"type":"mc","q":"کدام گزینه به معنی ۸:۴۵ است؟","options":["Viertel vor neun","Viertel nach neun","halb neun"],"answer":0,"why":"[[Viertel vor neun]] یک ربع مانده به ساعت نه است."},{"type":"blank","text":"Der Kurs beginnt ___ acht Uhr.","answer":"um","hint":"برای ساعت دقیق از um استفاده کن."},{"type":"type","q":"به آلمانی بنویس: «ساعت هفت و نیم است.»","answer":"Es ist halb acht.","accept":["Es ist halb acht"]},{"type":"mc","q":"شکل درست ۱۷ در آلمانی کدام است؟","options":["siebenzehn","siebzehn","siebenzig"],"answer":1,"why":"در [[siebzehn]] بخش en از sieben حذف شده است."},{"type":"blank","text":"Du ___ heute noch zehn Minuten.","answer":"hast","hint":"صرف haben برای du."},{"type":"type","q":"به آلمانی بنویس: «ما ساعت نه وقت داریم.»","answer":"Wir haben um neun Uhr Zeit.","accept":["Wir haben um neun Uhr Zeit"]},{"type":"mc","q":"فرق [[Uhr]] و [[Stunde]] چیست؟","options":["هر دو همیشه یک معنی دارند","Uhr ساعتِ روز است؛ Stunde مدتِ زمان","Stunde برای بیان دقیقه است"],"answer":1,"why":"[[Uhr]] در ۸:۰۰ و [[Stunde]] در مدتِ یک ساعت کاربرد دارد."},{"type":"blank","text":"Es ist Viertel ___ zwölf. (11:45)","answer":"vor"},{"type":"type","q":"به آلمانی بنویس: «ساعت چند است؟»","answer":"Wie spät ist es?","accept":["Wie spät ist es","Wie viel Uhr ist es?","Wie viel Uhr ist es"]},{"type":"mc","q":"جملهٔ درست برای ۱:۰۰ کدام است؟","options":["Es ist eins Uhr.","Es ist ein Uhr.","Es ist eine Uhr."],"answer":1,"why":"برای ساعت یک می‌گوییم [[ein Uhr]]، نه [[eins Uhr]]."},{"type":"blank","text":"Wir ___ eine Stunde Pause.","answer":"haben"}],"glossary":{"abend":"عصر / شب","aber":"اما","acht":"هشت","achtzehn":"هجده","also":"پس / بنابراین","am":"در / کنار (an dem)","an":"در / روی / کنار","antworte":"پاسخ می‌دهم","auch":"هم / نیز","auf":"روی / به","aus":"از / اهل","beginnt":"شروع می‌شود","bestellen":"سفارش‌دادن","bin":"هستم","bis":"تا","bus":"اتوبوس","café":"کافه","da":"آنجا / حاضر","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dauert":"طول می‌کشد","dem":"حرف تعریف داتیو مذکر/خنثی","den":"حرف تعریف مفعولی مذکر / داتیو جمع","denn":"زیرا / چون","der":"حرف تعریف مذکر","deutschkurs":"کلاس زبان آلمانی","die":"حرف تعریف مؤنث / جمع","dort":"آنجا","drei":"سه","dreizehn":"سیزده","dreißig":"سی","du":"تو","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","eins":"یک","elf":"یازده","entschuldigung":"ببخشید","erst":"تازه / تنها در آن زمان","es":"آن","esse":"می‌خورم","essen":"خوردن / غذا","etwas":"چیزی / مقداری","fragst":"می‌پرسی","fragt":"می‌پرسد","freunde":"دوستان","freundin":"دوست دختر (دوست مؤنث)","froh":"خوشحال","früher":"زودتر","fünf":"پنج","fünfundvierzig":"چهل‌وپنج","fünfzehn":"پانزده","gehe":"می‌روم","gut":"خوب","habe":"دارم","haben":"داشتن / دارند / داریم","halb":"نیمِ ساعتِ بعد","haltestelle":"ایستگاه اتوبوس","hast":"داری","haus":"خانه","heute":"امروز","ich":"من","im":"در / درونِ","ist":"است","ja":"بله","jetzt":"حالا","kann":"می‌توانم","keine":"هیچ / ندارم (جمع یا مؤنث)","kommen":"آمدن","kommt":"می‌آید","kurs":"دورهٔ درسی","kursraum":"اتاق کلاس","lehrerin":"معلم زن","lena":"لنا (نام)","leute":"آدم‌ها","lieber":"ترجیحاً","länger":"مدت بیشتری / طولانی‌تر","mein":"مال من (مذکر/خنثی)","meine":"مال من (مؤنث/جمع)","meinen":"مال من در حالت مفعولی مذکر","minute":"دقیقه","minuten":"دقیقه‌ها","mittag":"ظهر","montag":"دوشنبه","morgen":"صبح / فردا","muss":"باید","möchte":"می‌خواهم / می‌خواهد","nach":"بعد از","neun":"نه","neunzehn":"نوزده","nicht":"نه / نفی","noch":"هنوز / دیگر","nur":"فقط","passt":"مناسب است","pause":"استراحت","perfekt":"عالی / بی‌نقص","personen":"نفر / اشخاص","plan":"برنامه","pünktlich":"سروقت","sage":"می‌گویم","schlafen":"خوابیدن","schnell":"سریع","schon":"از قبل / همین حالا","sechs":"شش","sechzehn":"شانزده","sehe":"می‌بینم","sei":"باش (امر مفردِ sein)","sie":"او / آن‌ها / شما (با توجه به متن)","sieben":"هفت","siebzehn":"هفده","sind":"هستند / هستیم / هستید","sitzen":"نشسته‌اند / نشستن","sorge":"نگرانی","sprechen":"حرف می‌زنند / صحبت کردن","spät":"دیر","später":"بعداً","stimmt":"درست است","stunde":"یک ساعت مدت","stunden":"ساعت (مدت، جمع)","super":"عالی","tag":"روز","treffen":"همدیگر را دیدن","trinken":"می‌نوشند","uhr":"ساعت (زمانِ روز)","um":"در ساعت / دور","und":"و","uns":"ما را / برای ما","unterricht":"کلاس / آموزش","viel":"زیاد","viele":"بسیار / چندین","vielleicht":"شاید","vier":"چهار","viertel":"یک‌ربع","viertelstunde":"یک ربع ساعت","vierzehn":"چهارده","vierzig":"چهل","vor":"پیش از / جلوی","warten":"منتظرند","warum":"چرا","wasser":"آب","wie":"چگونه / چطور / چه","wir":"ما","zehn":"ده","zeit":"وقت","zu":"به / در خانهٔ","zum":"به (zu dem)","zurück":"برگشت / عقب","zusammen":"با هم","zwanzig":"بیست","zwei":"دو","zwölf":"دوازده","über":"دربارهٔ / بالای"}},{"id":"l03","order":3,"level":"A1","minutes":15,"title":"خانواده","titleDe":"Die Familie","blocks":[{"type":"dialog","lines":[{"de":"Was ist das für ein Foto?","fa":"این چه عکسی است؟"},{"de":"Das ist meine Familie. Hier sind meine Eltern.","fa":"این خانوادهٔ من است. اینجا پدر و مادرم هستند."},{"de":"Oh, schön! Wie heißt dein Vater?","fa":"چه خوب! اسم پدرت چیست؟"},{"de":"Mein Vater heißt Reza. Meine Mutter heißt Maryam.","fa":"اسم پدرم رضاست. اسم مادرم مریم است."},{"de":"Hast du auch Geschwister?","fa":"خواهر یا برادر هم داری؟"},{"de":"Ja, ich habe einen Bruder und eine Schwester.","fa":"بله، یک برادر و یک خواهر دارم."},{"de":"Wie heißen sie?","fa":"اسم‌هایشان چیست؟"},{"de":"Mein Bruder heißt Ali und meine Schwester heißt Sara.","fa":"برادرم علی و خواهرم سارا نام دارند."},{"de":"Wie alt ist dein Bruder?","fa":"برادرت چند ساله است؟"},{"de":"Er ist zwanzig Jahre alt. Sara ist sechzehn.","fa":"او بیست ساله است. سارا شانزده ساله است."},{"de":"Wohnt deine Familie auch in Jena?","fa":"خانواده‌ات هم در ینا زندگی می‌کند؟"},{"de":"Nein, meine Eltern wohnen im Iran. Meine Geschwister auch.","fa":"نه، پدر و مادرم در ایران زندگی می‌کنند. خواهر و برادرم هم همین‌طور."},{"de":"Vermisst du deine Familie manchmal?","fa":"گاهی دلت برای خانواده‌ات تنگ می‌شود؟"},{"de":"Ja, natürlich. Wir telefonieren aber oft miteinander.","fa":"بله، البته. اما زیاد با هم تلفنی حرف می‌زنیم."}]},{"type":"vocab","items":[{"de":"die Familie","fa":"خانواده","note":"جمع: die Familien."},{"de":"der Vater","fa":"پدر","note":"جمع: die Väter؛ اسم مذکر."},{"de":"die Mutter","fa":"مادر","note":"جمع: die Mütter؛ اسم مؤنث."},{"de":"die Eltern","fa":"پدر و مادر / والدین","note":"فقط به صورت جمع؛ meine Eltern."},{"de":"der Bruder","fa":"برادر","note":"جمع: die Brüder."},{"de":"die Schwester","fa":"خواهر","note":"جمع: die Schwestern."},{"de":"die Geschwister","fa":"خواهر و برادرها","note":"جمع؛ برای یک یا چند خواهر و برادر."},{"de":"der Sohn","fa":"پسر (فرزند)","note":"جمع: die Söhne."},{"de":"die Tochter","fa":"دختر (فرزند)","note":"جمع: die Töchter."},{"de":"das Kind","fa":"بچه / کودک","note":"جمع: die Kinder."},{"de":"die Großmutter","fa":"مادربزرگ","note":"شکل صمیمی: die Oma."},{"de":"der Großvater","fa":"پدربزرگ","note":"شکل صمیمی: der Opa."},{"de":"die Oma","fa":"مامان‌بزرگ","note":"خودمانی‌تر از Großmutter."},{"de":"der Opa","fa":"بابابزرگ","note":"خودمانی‌تر از Großvater."},{"de":"der Onkel","fa":"عمو / دایی","note":"در آلمانی برای هر دو یک کلمه است."},{"de":"die Tante","fa":"عمه / خاله","note":"در آلمانی برای هر دو یک کلمه است."},{"de":"der Cousin","fa":"پسرعمو / پسردایی / پسرخاله / پسرعمه","note":"مؤنث: die Cousine؛ تلفظ واژه فرانسوی‌ریشه است."},{"de":"die Cousine","fa":"دخترعمو / دختردایی / دخترخاله / دخترعمه","note":"مذکر: der Cousin."},{"de":"die Großeltern","fa":"پدربزرگ و مادربزرگ","note":"صورت جمع؛ مانند Eltern."},{"de":"verheiratet","fa":"متأهل","note":"Ich bin verheiratet؛ صفت همراه sein."},{"de":"ledig","fa":"مجرد (در وضعیت تأهل)","note":"در فرم‌های اداری هم می‌آید."},{"de":"alt","fa":"دارای سن / پیر","note":"Wie alt bist du? برای پرسیدن سن."},{"de":"das Alter","fa":"سن","note":"اسم خنثی؛ mit 20 Jahren = در ۲۰سالگی."},{"de":"mein / meine","fa":"مال من","note":"mein Vater ولی meine Mutter و meine Eltern."},{"de":"dein / deine","fa":"مال تو","note":"dein Bruder ولی deine Schwester."},{"de":"sein / seine","fa":"مال او (مذکر)","note":"sein Vater / seine Mutter؛ مالک مرد است."},{"de":"ihr / ihre","fa":"مال او (مؤنث)","note":"ihr Vater / ihre Mutter؛ مالک زن است."},{"de":"das Foto","fa":"عکس","note":"جمع: die Fotos."},{"de":"vermissen","fa":"دلتنگ شدن برای کسی","note":"jemanden vermissen؛ مفعول مستقیم می‌گیرد."},{"de":"telefonieren","fa":"تلفنی حرف زدن","note":"با mit: Ich telefoniere mit meiner Mutter."}]},{"type":"grammar","title":"اعضای خانواده، حرف تعریف و جمع اسم‌ها","body":"در آلمانی هر اسم یک جنس دستوری دارد: der (مذکر)، die (مؤنث) یا das (خنثی). جنس دستوری را باید همراه خودِ واژه یاد گرفت. والدین و خواهر و برادرها در این کاربرد جمع‌اند: die Eltern و die Geschwister. جمع همیشه با die می‌آید، اما شکل اسم ممکن است تغییر کند؛ مثلاً Vater → Väter و Kind → Kinder. اسم‌ها در آلمانی با حرف بزرگ شروع می‌شوند.\nمثال‌ها:\n[[Das ist mein Vater.]] (این پدر من است)؛ [[Meine Mutter heißt Maryam.]] (اسم مادرم مریم است)؛ [[Meine Eltern wohnen im Iran.]] (پدر و مادرم در ایران زندگی می‌کنند)؛ [[Mein Bruder ist Student.]] (برادرم دانشجوست)؛ [[Ich habe zwei Schwestern.]] (من دو خواهر دارم)؛ [[Meine Großeltern sind freundlich.]] (پدربزرگ و مادربزرگم مهربان‌اند)؛ [[Das Kind ist sechs Jahre alt.]] (آن کودک شش سال دارد)."},{"type":"tip","body":"واژه‌های خانواده را همیشه با حرف تعریف حفظ کن: [[der Vater]]، [[die Mutter]]، [[das Kind]]. [[die Eltern]] از نظر دستوری جمع است، پس فعل جمع می‌گیرد."},{"type":"grammar","title":"ضمایر ملکی در Nominativ: mein، dein، sein، ihr","body":"برای گفتن «پدرم» یا «خواهرت» از ضمیر ملکی قبل از اسم استفاده می‌کنیم. در حالت فاعلی (Nominativ)، برای اسم مفرد مذکر و خنثی، شکل بدون -e می‌آید: mein Vater، mein Kind؛ برای مؤنث و جمع، -e اضافه می‌شود: meine Mutter، meine Eltern. دربارهٔ مالک: mein = مال من، dein = مال تو، sein = مال او (مذکر)، ihr = مال او (مؤنث). پس جنسِ مالک تعیین می‌کند sein یا ihr باشد؛ اما پایانِ ضمیر ملکی را جنس و شمارِ اسمِ پس از آن مشخص می‌کند.\nمثال‌ها:\n[[Mein Vater heißt Reza.]] (اسم پدرم رضاست)؛ [[Meine Mutter arbeitet heute.]] (مادرم امروز کار می‌کند)؛ [[Dein Bruder ist zwanzig.]] (برادرت بیست سال دارد)؛ [[Deine Schwester lernt Deutsch.]] (خواهرت آلمانی یاد می‌گیرد)؛ [[Sein Sohn ist noch klein.]] (پسر او [مرد] هنوز کوچک است)؛ [[Ihre Tochter ist in der Schule.]] (دختر او [زن] در مدرسه است)؛ [[Meine Eltern sind zu Hause.]] (پدر و مادرم خانه هستند)."},{"type":"mistakes","items":[{"wrong":"Mein Mutter heißt Sara.","right":"Meine Mutter heißt Sara.","fa":"Mutter مؤنث است؛ در Nominativ باید meine بیاید."},{"wrong":"Meine Bruder ist Student.","right":"Mein Bruder ist Student.","fa":"Bruder مذکر است؛ در Nominativ باید mein بیاید."},{"wrong":"Ich habe zwei Bruder.","right":"Ich habe zwei Brüder.","fa":"جمعِ Bruder در این کاربرد Brüder است و اوملاوت می‌گیرد."}]},{"type":"grammar","title":"پرسیدن سن و داشتن خواهر و برادر","body":"برای پرسیدن سن از Wie alt ...? و برای پاسخ از sein + عدد + Jahre alt استفاده می‌کنیم؛ برخلاف فارسی که می‌گوییم «... سال دارم»، آلمانی می‌گوید «... ساله هستم». برای پرسیدن داشتن خواهر و برادر از Hast du Geschwister? استفاده می‌شود. دقت کن: پس از haben، مفعول در Akkusativ می‌آید؛ بنابراین برای اسم مذکرِ نامعین «einen Bruder» درست است، اما برای مؤنث «eine Schwester». جملهٔ منفیِ داشتن با kein ساخته می‌شود.\nمثال‌ها:\n[[Wie alt bist du?]] (چند سالت است؟)؛ [[Ich bin zwanzig Jahre alt.]] (من بیست ساله‌ام)؛ [[Meine Schwester ist sechzehn.]] (خواهرم شانزده سال دارد)؛ [[Hast du Geschwister?]] (خواهر یا برادر داری؟)؛ [[Ich habe einen Bruder.]] (یک برادر دارم)؛ [[Sie hat eine Schwester.]] (او یک خواهر دارد)؛ [[Ich habe keine Geschwister.]] (من هیچ خواهر یا برادری ندارم)."},{"type":"tip","body":"در آلمانی نگوییم [[Ich habe zwanzig Jahre.]]؛ الگوی درست [[Ich bin zwanzig Jahre alt.]] است. برای خانواده هم [[Hast du Geschwister?]] بسیار رایج‌تر از سؤال‌های طولانی است."},{"type":"text","de":"Auf meinem Schreibtisch steht ein Foto. Das ist meine Familie. Mein Vater heißt Reza und meine Mutter heißt Maryam. Sie wohnen im Iran. Mein Vater arbeitet viel, aber am Abend ist er gern zu Hause. Meine Mutter liest gern und telefoniert oft mit mir. Ich habe zwei Geschwister: einen Bruder und eine Schwester. Mein Bruder heißt Ali. Er ist zwanzig Jahre alt und studiert. Meine Schwester Sara ist sechzehn. Sie geht noch zur Schule und lernt Deutsch. Auf dem Foto steht Ali neben meinem Vater. Sara steht neben meiner Mutter. Ich stehe in der Mitte. Meine Großeltern sind nicht auf dem Foto. Sie wohnen in einer anderen Stadt. Meine Oma kocht gern, und mein Opa hört oft Musik. Ich habe auch einen Onkel und eine Tante. Meine Tante hat eine Tochter. Sie ist meine Cousine. Heute wohne ich in Jena und meine Familie ist weit weg. Manchmal vermisse ich sie. Aber wir telefonieren fast jeden Abend. Meine Mutter fragt immer: „Wie geht es dir?“ Ich antworte: „Mir geht es gut.“ Dann erzählen wir von unserem Tag. Das Foto auf meinem Tisch macht mich glücklich.","fa":"روی میز تحریرم یک عکس است؛ عکس خانواده‌ام. اسم پدرم رضاست و اسم مادرم مریم. آن‌ها در ایران زندگی می‌کنند. پدرم زیاد کار می‌کند ولی عصرها دوست دارد در خانه باشد. مادرم خواندن را دوست دارد و زیاد با من تلفنی حرف می‌زند. دو خواهر و برادر دارم: برادری به نام علی که بیست ساله و دانشجوست، و خواهری به نام سارا که شانزده سال دارد، به مدرسه می‌رود و آلمانی یاد می‌گیرد. در عکس، علی کنار پدرم است، سارا کنار مادرم و من وسط ایستاده‌ام. پدربزرگ و مادربزرگم در عکس نیستند؛ در شهر دیگری زندگی می‌کنند. مادربزرگم آشپزی دوست دارد و پدربزرگم اغلب موسیقی گوش می‌دهد. عمو یا دایی و عمه یا خاله هم دارم. دخترِ خاله یا عمه‌ام دخترخاله یا دخترعمه‌ام می‌شود. حالا من در ینا زندگی می‌کنم و خانواده‌ام دورند. گاهی دلم برایشان تنگ می‌شود، اما تقریباً هر عصر تلفنی حرف می‌زنیم. مادرم همیشه می‌پرسد حالم چطور است و من جواب می‌دهم خوبم. بعد دربارهٔ روزمان حرف می‌زنیم. عکس روی میزم خوشحالم می‌کند."},{"type":"tip","body":"برای معرفی اعضای خانواده با اشاره به عکس، از [[Das ist ...]] برای مفرد و [[Das sind ...]] برای جمع استفاده کن: [[Das sind meine Eltern.]] (این‌ها پدر و مادرم هستند)."}],"exercises":[{"type":"mc","q":"کدام جمله درست است؟","options":["Mein Mutter heißt Maryam.","Meine Mutter heißt Maryam.","Meinen Mutter heißt Maryam."],"answer":1,"why":"[[die Mutter]] مؤنث است؛ در حالت فاعلی باید [[meine]] بیاید."},{"type":"mc","q":"برای گفتن «پدر و مادرم» کدام درست است؟","options":["mein Eltern","meine Eltern","meinen Eltern"],"answer":1,"why":"[[Eltern]] جمع است؛ در حالت فاعلی از [[meine]] استفاده می‌شود."},{"type":"blank","text":"Das ist ___ Schwester. (خواهر تو)","answer":"deine"},{"type":"type","q":"به آلمانی بنویس: «برادرم بیست سال دارد.»","answer":"Mein Bruder ist zwanzig Jahre alt.","accept":["Mein Bruder ist zwanzig Jahre alt","Mein Bruder ist 20 Jahre alt.","Mein Bruder ist 20 Jahre alt"]},{"type":"mc","q":"«عمو» و «دایی» هر دو در آلمانی معمولاً چه می‌شوند؟","options":["der Opa","der Onkel","der Cousin"],"answer":1,"why":"[[der Onkel]] برای عمو و دایی هر دو کاربرد دارد."},{"type":"blank","text":"Ich habe einen ___ . (برادر)","answer":"Bruder","hint":"بعد از einen، نام عضو خانواده را با حرف بزرگ بنویس."},{"type":"type","q":"به آلمانی بنویس: «من یک خواهر دارم.»","answer":"Ich habe eine Schwester.","accept":["Ich habe eine Schwester"]},{"type":"mc","q":"پاسخ درست به [[Wie alt bist du?]] کدام است؟","options":["Ich habe zwanzig Jahre.","Ich bin zwanzig Jahre alt.","Ich heißt zwanzig."],"answer":1,"why":"در آلمانی سن را معمولاً با [[sein]] بیان می‌کنیم، نه haben."},{"type":"blank","text":"Meine Eltern ___ im Iran.","answer":"wohnen","hint":"Eltern جمع است؛ فعل با آن جمع صرف می‌شود."},{"type":"type","q":"به آلمانی بنویس: «اسم پدرم رضاست.»","answer":"Mein Vater heißt Reza.","accept":["Mein Vater heißt Reza","Mein Vater heisst Reza.","Mein Vater heisst Reza"]},{"type":"mc","q":"کدام جمله به معنی «هیچ خواهر یا برادری ندارم» است؟","options":["Ich habe keine Geschwister.","Ich bin keine Geschwister.","Ich habe kein Geschwister."],"answer":0,"why":"[[Geschwister]] جمع است و همراه منفیِ ملکیِ این جمله، [[keine]] می‌آید."},{"type":"blank","text":"Wie ___ ist deine Schwester?","answer":"alt"}],"glossary":{"abend":"عصر / شب","aber":"اما","ali":"علی (اسم)","alt":"ساله / مسن","alter":"سن","am":"در / کنار (an dem)","anderen":"دیگر / متفاوت","antworte":"پاسخ می‌دهم","arbeitet":"کار می‌کند","auch":"هم / نیز","auf":"روی / به","bruder":"برادر","cousin":"پسرعمو / پسرخاله / پسردایی / پسرعمه","cousine":"دخترعمو / دخترخاله / دخترعمه / دختردایی","dann":"بعد / سپس","das":"این / حرف تعریف خنثی","dein":"مال تو (مذکر/خنثی)","deine":"مال تو (مؤنث/جمع)","dem":"حرف تعریف داتیو مذکر/خنثی","der":"حرف تعریف مذکر","deutsch":"زبان آلمانی","die":"حرف تعریف مؤنث / جمع","dir":"به تو / برای تو","du":"تو","ein":"یک (مذکر/خنثی)","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","einer":"یک (مؤنث/داتیو)","eltern":"والدین","er":"او (مذکر)","erzählen":"تعریف‌کردن / روایت‌کردن","es":"آن","familie":"خانواده","fast":"تقریباً","foto":"عکس","fragt":"می‌پرسد","für":"برای","geht":"می‌رود / پیش می‌رود","gern":"با میل / دوست داشتن","geschwister":"خواهر و برادرها","glücklich":"خوشحال","großeltern":"پدربزرگ و مادربزرگ","großmutter":"مادربزرگ","großvater":"پدربزرگ","gut":"خوب","habe":"دارم","hast":"داری","hat":"دارد","hause":"خانه (در zu Hause)","heißen":"نام داشتن / نام دارند","heißt":"نام دارد / اسمش ... است","heute":"امروز","hier":"اینجا","hört":"می‌شنود","ich":"من","ihr":"شماها / مال او (مؤنث)","ihre":"مال او (مؤنث) / مال شما","im":"در / درونِ","immer":"همیشه","in":"در","iran":"ایران","ist":"است","ja":"بله","jahre":"سال (جمع)","jeden":"هر (مفعولی مذکر)","jena":"ینا (شهر)","kind":"بچه","kocht":"آشپزی می‌کند","ledig":"مجرد","lernt":"یاد می‌گیرد","liest":"می‌خواند","macht":"می‌کند / می‌سازد","manchmal":"گاهی","maryam":"مریم (اسم)","mein":"مال من (مذکر/خنثی)","meine":"مال من (مؤنث/جمع)","meinem":"مال من (داتیو مذکر/خنثی)","meiner":"مال من (داتیو مؤنث/ملکی)","mich":"من (مفعولی)","mir":"به من / برای من","mit":"با","miteinander":"با یکدیگر","mitte":"وسط","musik":"موسیقی","mutter":"مادر","natürlich":"البته / حتماً","neben":"کنار","nein":"نه","nicht":"نه / نفی","noch":"هنوز / دیگر","oft":"اغلب","oh":"اوه","oma":"مادربزرگ","onkel":"عمو / دایی","opa":"پدربزرگ","reza":"رضا (اسم)","sara":"سارا (اسم)","schreibtisch":"میز تحریر","schule":"مدرسه","schwester":"خواهر","schön":"زیبا / خوب","sechzehn":"شانزده","sein":"مال او (مذکر) / بودن","seine":"مال او (مذکر)، مؤنث/جمع","sie":"او / آن‌ها / شما (با توجه به متن)","sind":"هستند / هستیم / هستید","sohn":"پسر (فرزند)","stadt":"شهر","stehe":"ایستاده‌ام","steht":"ایستاده است / قرار دارد","studiert":"تحصیل می‌کند","tag":"روز","tante":"عمه / خاله","telefonieren":"تلفن‌زدن","telefoniert":"تلفن می‌زند","tisch":"میز","tochter":"دختر (فرزند)","und":"و","unserem":"مال ما (داتیو مذکر/خنثی)","vater":"پدر","verheiratet":"متأهل","vermisse":"دلتنگ می‌شوم","vermissen":"دلتنگ‌شدن برای کسی","vermisst":"دلتنگ می‌شود / دلت تنگ می‌شود","viel":"زیاد","von":"از","was":"چه / چی","weg":"دور / رفته","weit":"دور","wie":"چگونه / چطور / چه","wir":"ما","wohne":"ساکنم","wohnen":"ساکن‌اند / زندگی می‌کنند","wohnt":"ساکن است","zu":"به / در خانهٔ","zur":"به (zu der)","zwanzig":"بیست","zwei":"دو"}},{"id":"l04","order":4,"level":"A2","minutes":18,"title":"خرید و قیمت","titleDe":"Einkaufen und Preise","blocks":[{"type":"dialog","lines":[{"de":"Guten Tag! Was möchten Sie?","fa":"روز بخیر! چه میل دارید؟"},{"de":"Ich möchte ein Brot und zwei Brötchen, bitte.","fa":"یک نان و دو نان کوچک می‌خواهم، لطفاً."},{"de":"Sonst noch etwas?","fa":"چیز دیگری هم هست؟"},{"de":"Ja, ich möchte auch einen Kaffee. Was kostet das?","fa":"بله، یک قهوه هم می‌خواهم. این چقدر می‌شود؟"},{"de":"Das macht sechs Euro fünfzig.","fa":"می‌شود شش یورو و پنجاه سنت."},{"de":"Hier, bitte. Stimmt so!","fa":"بفرمایید. باقی‌اش مال شما!"},{"de":"Vielen Dank! Schönen Tag noch!","fa":"خیلی ممنون! روز خوبی داشته باشید!"}]},{"type":"vocab","items":[{"de":"das Brot","fa":"نان"},{"de":"das Brötchen","fa":"نان کوچک"},{"de":"der Kaffee","fa":"قهوه"},{"de":"die Milch","fa":"شیر"},{"de":"der Apfel","fa":"سیب"},{"de":"das Wasser","fa":"آب"},{"de":"kosten","fa":"قیمت داشتن","note":"[[Was kostet das?]] = این چند است؟"},{"de":"bezahlen","fa":"پرداخت کردن"},{"de":"teuer","fa":"گران"},{"de":"billig / günstig","fa":"ارزان"},{"de":"der Euro / der Cent","fa":"یورو / سنت"}]},{"type":"grammar","title":"فعل مُدال möchten (می‌خواهم / میل دارم)","body":"[[ich möchte]] · [[du möchtest]] · [[er / sie / es möchte]]\n[[wir möchten]] · [[ihr möchtet]] · [[sie / Sie möchten]]\nبعد از آن یا اسم می‌آید: [[Ich möchte einen Kaffee.]]\nیا مصدر در آخر جمله: [[Ich möchte bezahlen.]]"},{"type":"grammar","title":"Akkusativ (مفعول) — مقدماتی","body":"فقط حرف تعریف مذکر تغییر می‌کند:\n[[der Kaffee]] → [[Ich möchte den Kaffee.]]\n[[ein Kaffee]] → [[Ich möchte einen Kaffee.]]\nبرای خنثی، مؤنث و جمع تغییری نیست: [[das Brot]] → [[Ich möchte das Brot.]] — [[die Milch]] → [[Ich möchte eine Milch.]]\nمنفی و ملکی هم همین‌طور: [[keinen]]، [[meinen]] (فقط مذکر)."}],"exercises":[{"type":"mc","q":"کدام جمله درست است؟","options":["Ich möchte ein Kaffee","Ich möchte einen Kaffee","Ich möchte einem Kaffee"],"answer":1,"why":"[[der Kaffee]] مذکر است و مفعول → [[einen]]."},{"type":"mc","q":"[[Was kostet das?]] یعنی چه؟","options":["این چند است؟","این کجاست؟","این چیست؟"],"answer":0},{"type":"type","q":"به آلمانی بنویس: یک قهوه می‌خواهم","answer":"Ich möchte einen Kaffee","accept":["ich moechte einen kaffee"]},{"type":"blank","text":"Ich möchte ___ Apfel.","answer":"einen","hint":"[[der Apfel]]، نامعین، مفعول"},{"type":"blank","text":"Das ___ sechs Euro.","answer":"macht","accept":["kostet"]}]},{"id":"l05","order":5,"level":"A2","minutes":20,"title":"گذشته‌ی ساده (Perfekt)","titleDe":"Das Perfekt","blocks":[{"type":"grammar","title":"ساختار Perfekt","body":"گذشته‌ی گفتاری = [[haben]] یا [[sein]] (صرف‌شده، جایگاه دوم) + [[Partizip II]] (آخر جمله):\n[[Ich habe Pizza gegessen.]] (پیتزا خوردم)\nمنظم: [[ge-]] + ریشه + [[-t]]: [[machen → gemacht]]، [[lernen → gelernt]]\nنامنظم: [[ge-]] + ... + [[-en]]: [[essen → gegessen]]، [[sehen → gesehen]]\nفعل‌های جداشدنی: [[einkaufen → eingekauft]]. فعل‌های پیشوندی غیرجدا، [[ge-]] نمی‌گیرند: [[besuchen → besucht]]."},{"type":"grammar","title":"haben یا sein؟","body":"فعل‌های حرکت و تغییر حالت با [[sein]]: [[gehen → ist gegangen]]، [[fahren → ist gefahren]]، [[kommen → ist gekommen]]، [[bleiben → ist geblieben]]، [[aufstehen → ist aufgestanden]].\nبقیه‌ی فعل‌ها با [[haben]]: [[Ich habe gearbeitet.]]، [[Ich habe geschlafen.]]"},{"type":"vocab","items":[{"de":"gestern","fa":"دیروز"},{"de":"letzte Woche","fa":"هفته‌ی گذشته"},{"de":"machen → gemacht","fa":"انجام دادن"},{"de":"lernen → gelernt","fa":"یاد گرفتن"},{"de":"essen → gegessen","fa":"خوردن"},{"de":"trinken → getrunken","fa":"نوشیدن"},{"de":"sehen → gesehen","fa":"دیدن"},{"de":"schlafen → geschlafen","fa":"خوابیدن"},{"de":"arbeiten → gearbeitet","fa":"کار کردن","note":"ریشه‌ی [[t]] می‌گیرد: [[-et]]"},{"de":"gehen → ist gegangen","fa":"رفتن"},{"de":"fahren → ist gefahren","fa":"رانندگی کردن / سفر کردن"},{"de":"bleiben → ist geblieben","fa":"ماندن"}]},{"type":"dialog","lines":[{"de":"Was hast du gestern gemacht?","fa":"دیروز چه کار کردی؟"},{"de":"Ich habe lange geschlafen und dann Deutsch gelernt.","fa":"زیاد خوابیدم و بعد آلمانی یاد گرفتم."},{"de":"Bist du ins Kino gegangen?","fa":"به سینما رفتی؟"},{"de":"Nein, ich bin zu Hause geblieben. Ich habe Pizza gegessen und einen Film gesehen.","fa":"نه، در خانه ماندم. پیتزا خوردم و یک فیلم دیدم."}]},{"type":"text","de":"Letzte Woche bin ich nach Berlin gefahren. Ich habe das Brandenburger Tor gesehen und viele Fotos gemacht. Am Abend habe ich im Restaurant gegessen. Es hat mir sehr gut gefallen.","fa":"هفته‌ی گذشته به برلین رفتم. دروازه‌ی براندنبورگ را دیدم و عکس‌های زیادی گرفتم. شب در رستوران غذا خوردم. خیلی خوشم آمد."}],"exercises":[{"type":"mc","q":"[[Ich ___ gestern Pizza gegessen.]]","options":["habe","bin","hat"],"answer":0,"why":"[[essen]] فعل حرکتی نیست و با [[haben]] می‌آید."},{"type":"mc","q":"Partizip II فعل [[gehen]] کدام است؟","options":["gegeht","gegangen","gegehen"],"answer":1},{"type":"type","q":"به آلمانی بنویس: دیروز آلمانی یاد گرفتم","answer":"Ich habe gestern Deutsch gelernt","accept":["gestern habe ich deutsch gelernt"]},{"type":"blank","text":"Wir sind nach Hamburg ___.","answer":"gefahren"},{"type":"blank","text":"Er ___ zu Hause geblieben.","answer":"ist"}]},{"id":"l06","order":6,"level":"B1","minutes":22,"title":"آرزوها و برنامه‌ها","titleDe":"Wünsche und Pläne","blocks":[{"type":"grammar","title":"بیان برنامه و آینده","body":"برای برنامه‌ها اغلب همان حال ساده با قید زمان کافی است: [[Nächstes Jahr mache ich einen Kurs.]]\nآینده‌ی صریح: [[werden]] + مصدر در آخر جمله:\n[[ich werde]] · [[du wirst]] · [[er / sie / es wird]] · [[wir werden]] · [[ihr werdet]] · [[sie / Sie werden]]\n[[Ich werde nach Deutschland ziehen.]] (به آلمان نقل مکان خواهم کرد)\nآرزو: [[Ich möchte ...]] یا [[Ich würde gern ...]] (دوست دارم ...)"},{"type":"grammar","title":"Nebensätze با weil و dass","body":"بعد از [[weil]] (چون) و [[dass]] (که) فعل صرف‌شده می‌رود آخر جمله:\n[[Ich lerne Deutsch, weil ich in Deutschland studieren möchte.]]\n[[Ich hoffe, dass ich bald eine Wohnung finde.]]\n[[Ich weiß, dass das schwer ist.]]\nاگر جمله با [[weil]] شروع شود، فعل جمله‌ی اصلی بلافاصله بعد از ویرگول می‌آید: [[Weil ich studieren möchte, lerne ich Deutsch.]]"},{"type":"vocab","items":[{"de":"der Plan","fa":"برنامه"},{"de":"der Wunsch","fa":"آرزو"},{"de":"die Zukunft","fa":"آینده"},{"de":"hoffen","fa":"امیدوار بودن"},{"de":"planen","fa":"برنامه‌ریزی کردن"},{"de":"träumen von","fa":"رؤیای ... را داشتن","note":"بعدش حالت [[Dativ]]"},{"de":"nächstes Jahr","fa":"سال آینده"},{"de":"bald","fa":"به‌زودی"},{"de":"studieren","fa":"در دانشگاه خواندن"},{"de":"die Wohnung","fa":"آپارتمان / خانه"},{"de":"weil","fa":"چون"},{"de":"dass","fa":"که"}]},{"type":"dialog","lines":[{"de":"Was sind deine Pläne für die Zukunft?","fa":"برنامه‌هایت برای آینده چیست؟"},{"de":"Nächstes Jahr werde ich nach Deutschland ziehen.","fa":"سال آینده به آلمان نقل مکان خواهم کرد."},{"de":"Warum möchtest du dorthin ziehen?","fa":"چرا می‌خواهی به آنجا بروی؟"},{"de":"Weil ich dort Informatik studieren möchte.","fa":"چون می‌خواهم آنجا انفورماتیک بخوانم."},{"de":"Ich hoffe, dass du bald eine gute Wohnung findest.","fa":"امیدوارم زود یک خانه‌ی خوب پیدا کنی."},{"de":"Danke! Ich hoffe es auch.","fa":"ممنون! من هم امیدوارم."}]},{"type":"text","de":"Mein Traum ist es, in Deutschland zu studieren. Deshalb lerne ich jeden Tag Deutsch. Ich weiß, dass das viel Zeit braucht, aber ich werde nicht aufgeben. In fünf Jahren möchte ich als Ingenieur arbeiten.","fa":"رؤیای من این است که در آلمان درس بخوانم. برای همین هر روز آلمانی یاد می‌گیرم. می‌دانم که این زمان زیادی می‌برد، اما تسلیم نخواهم شد. می‌خواهم پنج سال دیگر مهندس باشم."}],"exercises":[{"type":"mc","q":"کدام جمله درست است؟","options":["Ich lerne Deutsch, weil ich möchte in Deutschland studieren.","Ich lerne Deutsch, weil ich in Deutschland studieren möchte.","Ich lerne Deutsch, weil möchte ich in Deutschland studieren."],"answer":1,"why":"بعد از [[weil]] فعل صرف‌شده ([[möchte]]) آخر جمله می‌رود."},{"type":"mc","q":"[[Ich ___ nächstes Jahr nach Berlin fahren.]]","options":["werde","wirst","wird"],"answer":0},{"type":"type","q":"به آلمانی بنویس: امیدوارم زود موفق شوم","answer":"Ich hoffe, dass ich bald Erfolg habe","accept":["ich hoffe, dass ich bald erfolgreich bin"]},{"type":"blank","text":"Ich weiß, ___ das schwer ist.","answer":"dass"},{"type":"blank","text":"Sie bleibt zu Hause, ___ sie krank ist.","answer":"weil"}]}]

{de:"Ich würde sofort kündigen und ein Jahr lang reisen.",fa:"فوراً استعفا می‌دادم و یک سال سفر می‌کردم."},

]},
{type:"grammar",title:"آینده‌ی آرزویی: [[würde]] + مصدر",body:"برای موقعیت‌های غیرواقعی در حال و آینده، از [[würde]] + مصدر استفاده می‌کنیم: «اگر پول داشتم، سفر می‌کردم» → [[Wenn ich Geld hätte, würde ich reisen.]] صرف [[würden]]: ich würde، du würdest، er würde، wir würden، ihr würdet، sie würden. ⚠️ نکته‌ی امتحانی — رایج‌ترین غلط B2: با [[sein]]، [[haben]] و افعال مدال از [[würde]] استفاده نکن! درست: [[Ich wäre glücklich]] (نه [[ich würde glücklich sein]])؛ [[Ich hätte Zeit]] (نه [[ich würde Zeit haben]])؛ [[Ich könnte kommen]] (نه [[ich würde kommen können]]). همچنین در جمله‌ی شرطی رسمی، [[würde]] بعد از [[wenn]] نمی‌آید: [[Wenn ich Zeit hätte]] (نه [[wenn ich Zeit haben würde]])."},
{type:"grammar",title:"[[hätte]] و [[wäre]]: آرزوهای گذشته",body:"برای گذشته‌ی غیرواقعی (کاری که نشد ولی کاش می‌شد)، از [[hätte]]/[[wäre]] + اسم مفعول استفاده می‌کنیم: [[Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.]] — «اگر بیشتر خوانده بودم، قبول می‌شدم.» با افعال حرکتی [[sein]] می‌آید: [[Wäre ich nur zu Hause geblieben!]] — «کاش خونه مونده بودم!» آرزو با [[wünschte]]: [[Ich wünschte, ich hätte mehr Zeit.]] نکته‌ی امتحانی: در سبک رسمی می‌شود [[wenn]] را حذف کرد و فعل را اول آورد: [[Hätte ich mehr Zeit, würde ich reisen.]] — این ساختار در متن‌های C1 زیاد می‌آید و در امتحان نمره دارد."},
{type:"text",de:"Wenn ich die Wahl hätte, würde ich in einer kleinen Stadt am Meer leben. Ich würde jeden Morgen schwimmen gehen und hätte keine Eile mehr. Leider habe ich damals eine andere Entscheidung getroffen. Wäre ich doch mutiger gewesen! Aber man kann die Vergangenheit nicht ändern – man kann nur aus ihr lernen.",fa:"اگر انتخاب داشتم، توی یک شهر کوچک کنار دریا زندگی می‌کردم. هر صبح شنا می‌کردم و دیگر عجله‌ای نداشتم. متأسفانه آن موقع تصمیم دیگری گرفتم. کاش جسورتر بوده بودم! ولی گذشته را نمی‌شود عوض کرد — فقط می‌شود از آن یاد گرفت."},
{type:"vocab",items:[
{de:"An deiner Stelle würde ich...",fa:"اگر جای تو بودم...",note:"مودبانه‌ترین شکل نصیحت"},
{de:"Ich würde vorschlagen, dass...",fa:"پیشنهاد می‌کنم که...",note:"رسمی، مناسب ایمیل کاری"},
{de:"Würdest du mir bitte helfen?",fa:"ممکن است لطفاً کمکم کنی؟",note:"درخواست خیلی مودبانه"},
{de:"Das würde mich freuen.",fa:"خوشحال می‌شوم.",note:"پذیرفتن با اشتیاق"},
{de:"Ich hätte gern einen Kaffee.",fa:"یک قهوه می‌خواستم.",note:"سفارش مودبانه در کافه/رستوران"},
{de:"Ich wünschte, ...",fa:"کاش...",note:"همیشه با hätte/wäre ادامه می‌یابد"},
{de:"Hätte ich doch nur...!",fa:"کاش فقط...!",note:"آرزوی پررنگ برای گذشته"},
{de:"Was wäre, wenn...?",fa:"چه می‌شد اگر...؟",note:"شروع یک تجربه‌ی ذهنی"}
]}
],
exercises:[
{type:"mc",q:"«اگر وقت داشتم، می‌آمدم.» کدام درست است؟",options:["Wenn ich Zeit habe, würde ich kommen.","Wenn ich Zeit hätte, würde ich kommen.","Wenn ich Zeit hätte, komme ich."],answer:1,why:"شرط غیرواقعی حال → hätte (Konjunktiv II) + würde. گزینه‌ی اول وجه اخباری است و گزینه‌ی سوم ترکیب نادرست دو وجه است."},
{type:"type",q:"گذشته‌ی غیرواقعی بساز: Ich kann nicht schwimmen — ich habe es nie gelernt. → Wenn ich es gelernt ___, könnte ich jetzt schwimmen.",answer:"hätte",accept:["hätte"]},
{type:"blank",text:"Ich wünschte, ich ___ Klavier spielen.",answer:"könnte"},
{type:"mc",q:"کدام جمله غلط است؟",options:["Ich wäre lieber zu Hause geblieben.","Ich würde lieber zu Hause bleiben.","Ich würde lieber zu Hause geblieben sein."],answer:2,why:"با sein همیشه از wäre استفاده می‌شود، نه würde + sein. ترکیب گزینه‌ی سوم ممنوعه است."},
{type:"type",q:"آرزو را کامل کن: I wish I had studied medicine. → Ich wünschte, ich ___ Medizin studiert.",answer:"hätte",accept:["hätte"]}
]},
{id:"l08",order:8,level:"B2",minutes:25,title:"مجهول در همه‌ی زمان‌ها",titleDe:"Das Passiv in allen Zeiten",blocks:[
{type:"dialog",lines:[
{de:"Hast du gehört? Das alte Kino in der Stadt wird abgerissen.",fa:"شنیدی؟ سینمای قدیمی شهر دارد تخریب می‌شود."},
{de:"Wirklich? Es wurde doch erst vor zehn Jahren renoviert!",fa:"واقعاً؟ مگر همین ده سال پیش بازسازی نشد!"},
{de:"Ja, aber das Gebäude ist schon zweimal verkauft worden.",fa:"بله، ولی ساختمان تا حالا دو بار فروخته شده است."},
{de:"Weiß man schon, was dort gebaut wird?",fa:"می‌دانند قرار است آنجا چه ساخته شود؟"},
{de:"Die Pläne sind schon genehmigt worden. Ein Einkaufszentrum soll entstehen.",fa:"طرح‌ها قبلاً تأیید شده‌اند. قرار است یک مرکز خرید ساخته شود."}
]},
{type:"vocab",items:[
{de:"abreißen (riss ab, abgerissen)",fa:"تخریب کردن",note:"جداشدنی"},
{de:"renovieren",fa:"بازسازی کردن",note:"die Wohnung renovieren"},
{de:"genehmigen",fa:"تأیید / تصویب کردن",note:"einen Antrag genehmigen؛ رسمی"},
{de:"entstehen (entstand, entstanden)",fa:"به وجود آمدن",note:"ناگذر است ← هیچ‌وقت مجهول نمی‌سازد!"},
{de:"zerstören",fa:"نابود کردن",note:"durch das Feuer zerstört"},
{de:"eröffnen",fa:"افتتاح کردن",note:"das Geschäft eröffnen"},
{de:"verhaften",fa:"دستگیر کردن",note:"von der Polizei verhaftet"},
{de:"der Täter",fa:"مجرم، فاعل",note:"در مجهول معمولاً حذف می‌شود"},
{de:"das Opfer",fa:"قربانی",note:"جمع: die Opfer"},

{de:"stattfinden (fand statt, stattgefunden)",fa:"برگزار شدن",note:"جداشدنی؛ مجهول ندارد: Es findet statt."},
{de:"die Beute",fa:"غنیمت، اموال مسروقه",note:"die Beute sicherstellen"}
]},
{type:"grammar",title:"ساخت مجهول: [[werden]] + اسم مفعول",body:"فرمول همیشه یکی است: [[werden]] صرف‌شده + Partizip II. فقط زمانِ [[werden]] عوض می‌شود — حال: [[Das Haus wird gebaut.]] / گذشته‌ی ساده: [[Das Haus wurde gebaut.]] / گذشته‌ی کامل: [[Das Haus ist gebaut worden.]] / گذشته‌ی بعید: [[Das Haus war gebaut worden.]] / آینده: [[Das Haus wird gebaut werden.]] ⚠️ نکته‌ی امتحانی — کلاسیک‌ترین تله: در Perfekt مجهول، [[worden]] می‌آید نه [[geworden]]! و مجهول فقط با افعال متعدی (که مفعول Akkusativ می‌گیرند) ساخته می‌شود. با افعال Dativ، مجهول غیرشخصی می‌سازیم: [[Mir wird geholfen.]] درست است ولی [[Ich werde geholfen.]] غلط!"},
{type:"grammar",title:"[[von]] یا [[durch]]؟ و جایگزین‌های مجهول",body:"عامل انسانی کار با [[von]] می‌آید: [[Das Bild wurde von Picasso gemalt.]] — ولی وسیله یا علت طبیعی با [[durch]]: [[Die Stadt wurde durch das Erdbeben zerstört.]] در زبان رسمی، مجهول را این‌طور هم می‌سازند: ۱) با [[man]]: [[Man baut hier ein Hotel.]] ۲) با [[sich lassen]] + مصدر: [[Das Problem lässt sich leicht lösen.]] (= می‌شود حلش کرد) ۳) با [[sein]] + [[zu]] + مصدر: [[Die Aufgabe ist bis morgen zu erledigen.]] (= باید انجام شود). نکته‌ی امتحانی: [[sich lassen]] همیشه با [[sich]] می‌آید و معنای «امکان/قابلیت» می‌دهد؛ از نادر ساختارهایی است که امتحان B2 دوست دارد."},
{type:"text",de:"Gestern Abend wurde in der Innenstadt ein Juweliergeschäft überfallen. Der Täter wurde noch in der Nacht von der Polizei verhaftet. Die Beute ist bereits sichergestellt worden. Die Ermittlungen werden von der Kriminalpolizei durchgeführt. Zeugen werden gebeten, sich zu melden.",fa:"دیشب در مرکز شهر به یک جواهرفروشی دستبرد زده شد. مجرم همان شب توسط پلیس دستگیر شد. اموال مسروقه قبلاً ضبط شده است. تحقیقات توسط پلیس جنایی انجام می‌شود. از شاهدان خواسته می‌شود خودشان را معرفی کنند."},
{type:"vocab",items:[

{de:"gebeten werden",fa:"خواسته شدن",note:"Zeugen werden gebeten, sich zu melden."},
{de:"gemeldet werden",fa:"گزارش شدن",note:"Der Unfall wurde gemeldet."},
{de:"das unpersönliche Passiv",fa:"مجهول غیرشخصی",note:"Es wird getanzt / gelacht."},
{de:"der Einbrecher",fa:"سارق منزل",note:"جمع: die Einbrecher"},
{de:"überfallen (überfiel, überfallen)",fa:"دستبرد زدن، حمله کردن",note:"جدا نمی‌شود!"},
{de:"die Ermittlung",fa:"تحقیق، بازجویی",note:"جمع: Ermittlungen"}
]}
],
exercises:[

{id:"l09",order:9,level:"B2",minutes:20,title:"ترکیب‌های اسم و فعل",titleDe:"Nomen-Verb-Verbindungen",blocks:[
{type:"dialog",lines:[
{de:"Haben Sie meine E-Mail schon zur Kenntnis genommen?",fa:"ایمیل مرا ملاحظه کردید؟"},
{de:"Ja. Wir müssen dazu Stellung nehmen.",fa:"بله. باید در این مورد موضع بگیریم."},
{de:"Können wir die hohen Kosten in Kauf nehmen?",fa:"می‌توانیم این هزینه‌های بالا را قبول کنیم؟"},
{de:"Ich denke, wir sollten Ihren Vorschlag in Betracht ziehen.",fa:"فکر می‌کنم باید پیشنهاد شما را در نظر بگیریم."},
{de:"Einverstanden. Alle Unterlagen stehen Ihnen ab morgen zur Verfügung.",fa:"موافقم. همه‌ی مدارک از فردا در اختیار شماست."}
]},
{type:"vocab",items:[
{de:"eine Entscheidung treffen",fa:"تصمیم گرفتن",note:"معنی تحت‌اللفظی بی‌معنی است؛ همیشه با treffen، نه machen!"},
{de:"in Frage stellen",fa:"زیر سؤال بردن",note:"etwas in Frage stellen + Akk"},
{de:"zur Verfügung stehen",fa:"در دسترس / اختیار بودن",note:"jemandem (Dativ) zur Verfügung stehen"},
{de:"in Anspruch nehmen",fa:"استفاده کردن (از خدمات)",note:"Hilfe in Anspruch nehmen؛ رسمی"},
{de:"zum Ausdruck bringen",fa:"بیان کردن",note:"seine Meinung zum Ausdruck bringen"},
{de:"in Betracht ziehen",fa:"در نظر گرفتن",note:"bei Entscheidungen؛ ziehen→zog→gezogen"},
{de:"einen Beitrag leisten",fa:"سهم داشتن، کمک کردن",note:"zum Umweltschutz einen Beitrag leisten"},
{de:"zur Kenntnis nehmen",fa:"مطلع شدن، ملاحظه کردن",note:"اداری: Haben Sie mein Schreiben zur Kenntnis genommen؟"},
{de:"in Kauf nehmen",fa:"به جان خریدن، قبول کردن",note:"Nachteile / Kosten in Kauf nehmen"},
{de:"Stellung nehmen (zu)",fa:"موضع گرفتن درباره",note:"zu + Dativ: Stellung zu dem Plan nehmen"},
{de:"Rücksicht nehmen (auf)",fa:"مراعات / ملاحظه کردن",note:"auf + Akk: Rücksicht auf andere nehmen"},
{de:"in Erfahrung bringen",fa:"پی بردن، فهمیدن",note:"Ich habe in Erfahrung gebracht, dass..."},
{de:"zur Anwendung kommen",fa:"به کار رفتن، اجرا شدن",note:"Die neue Regel kommt ab Mai zur Anwendung."},
{de:"Abschied nehmen (von)",fa:"خداحافظی کردن",note:"von + Dativ؛ احساسی و رسمی"},
{de:"Maßnahmen ergreifen",fa:"اقدام کردن",note:"Die Regierung ergreift Maßnahmen."}
]},
{type:"grammar",title:"ترکیب اسم و فعل: بیشتر از جمع اجزا",body:"[[Nomen-Verb-Verbindungen]] (یا [[Funktionsverbgefüge]]) ترکیب‌هایی‌اند که معنایشان از جمع معنای کلمات به دست نمی‌آید: [[eine Entscheidung treffen]] یعنی «تصمیم گرفتن»، نه «تصمیمی را ملاقات کردن»! سه ویژگی مهم: ۱) فعل معمولاً کم‌معنی است ([[treffen]]، [[nehmen]]، [[stellen]]، [[bringen]]) و بار معنا روی اسم است. ۲) حرف اضافه ثابت دارند — باید با حرف اضافه حفظشان کنی. ۳) زبان رسمی و نوشتاری‌اند و در امتحان B2/C1 نمره می‌آورند. ⚠️ نکته‌ی امتحانی: رایج‌ترین غلط، فعل اشتباه است — [[eine Entscheidung *machen]] غلط و [[treffen]] درست؛ [[einen Vorschlag *tun]] غلط و [[machen]] درست."},
{type:"text",de:"Sehr geehrte Damen und Herren, wir haben Ihr Schreiben zur Kenntnis genommen. Nach reiflicher Überlegung müssen wir Ihnen mitteilen, dass wir Ihre Bedingungen nicht in vollem Umfang in Kauf nehmen können. Wir sind jedoch bereit, Ihren Vorschlag in Betracht zu ziehen. Bitte nehmen Sie bis Freitag Stellung zu unserem Gegenvorschlag. Alle Details stehen Ihnen in der Anlage zur Verfügung.",fa:"خانم‌ها و آقایان گرامی، نامه‌ی شما را ملاحظه کردیم. پس از بررسی دقیق، باید به اطلاع برسانیم که نمی‌توانیم شرایط شما را به‌طور کامل بپذیریم. با این حال آماده‌ایم پیشنهاد شما را در نظر بگیریم. لطفاً تا جمعه نسبت به پیشنهاد متقابل ما موضع بگیرید. همه‌ی جزئیات در پیوست در اختیار شماست."},
{type:"grammar",title:"فرمول حفظ حرف اضافه‌ها",body:"حرف اضافه‌ی هر ترکیب را با یک جمله‌ی کوتاهِ شخصی حفظ کن، نه تکی: [[Ich nehme Rücksicht auf meine Nachbarn.]] (نه فقط [[auf + Akk]]). سه خانواده‌ی بزرگ: ۱) با [[auf]] + Akkusativ: [[Rücksicht nehmen auf]] ۲) با [[zu]] + Dativ: [[Stellung nehmen zu]]، [[im Gegensatz zu]] ۳) بدون حرف اضافه‌ی دوم: [[zur Kenntnis nehmen]]، [[in Kauf nehmen]]، [[in Betracht ziehen]]. نکته‌ی امتحانی: اگر حرف اضافه را اشتباه بگویی، کل ترکیب غلط حساب می‌شود — در پاسخ تشریحی اول حرف اضافه را مشخص کن، بعد جمله را بساز."},
{type:"grammar",title:"تله‌های امتحانی",body:"۱) [[in Frage stellen]] (زیر سؤال بردن) با [[sich fragen]] (از خود پرسیدن) فرق دارد — امتحان عاشق این تله است. ۲) بعضی ترکیب‌ها بازتابی‌اند: [[sich in Acht nehmen vor]] + Dativ یعنی «مواظب بودن». ۳) در جمله‌ی فرعی، اسم و فعل از هم جدا نمی‌شوند مثل فعل‌های جداشدنی: [[..., weil er eine Entscheidung getroffen hat]] — ترتیب [[getroffen hat]] آخر جمله می‌ماند. ۴) [[zum Ausdruck bringen]] را با [[ausdrücken]] قاطی نکن؛ اولی رسمی‌تر و امتحانی‌تر است."}
],
exercises:[
{type:"mc",q:"«تصمیم گرفتن» به آلمانی؟",options:["eine Entscheidung machen","eine Entscheidung treffen","eine Entscheidung geben"],answer:1,why:"این ترکیب همیشه با treffen می‌آید؛ machen رایج‌ترین غلط زبان‌آموزان است."},
{type:"type",q:"کامل کن (Perfekt): Er hat die Nachteile ___ ___. (in Kauf nehmen)",answer:"in Kauf genommen",accept:["in Kauf genommen"]},
{type:"blank",text:"Alle Unterlagen stehen Ihnen ___ Verfügung.",answer:"zur"},
{type:"mc",q:"«in Frage stellen» یعنی چه؟",options:["سؤال پرسیدن","زیر سؤال بردن","جواب دادن"],answer:1,why:"یعنی اعتبار چیزی را زیر سؤال بردن، نه سؤال پرسیدن (fragen)."},
{type:"type",q:"حرف اضافه‌ی درست را بگذار: Bitte nehmen Sie ___ unserem Vorschlag Stellung.",answer:"zu",accept:["zu"]}
]},
{id:"l10",order:10,level:"B2",minutes:20,title:"حرف زدن مثل امتحان",titleDe:"Redemittel für Diskussionen",blocks:[
{type:"dialog",lines:[
{de:"Also, was hältst du vom Homeoffice?",fa:"خب، نظرت درباره‌ی دورکاری چیست؟"},
{de:"Zunächst einmal spare ich viel Zeit, weil ich nicht pendeln muss. Darüber hinaus kann ich mich zu Hause besser konzentrieren.",fa:"اول از همه خیلی وقت ذخیره می‌کنم چون رفت‌وآمد ندارم. علاوه بر این، در خانه بهتر تمرکز می‌کنم."},
{de:"Das stimmt zwar, aber mir fehlt der Kontakt zu den Kollegen. Man vereinsamt schnell.",fa:"این درست است، ولی ارتباط با همکاران را از دست می‌دهم. آدم زود تنها می‌شود."},
{de:"Hingegen finde ich, dass man produktiver ist. Man wird nicht ständig unterbrochen.",fa:"در مقابل، من فکر می‌کنم آدم پربازده‌تر است. مدام کارش قطع نمی‌شود."},
{de:"Zusammenfassend lässt sich sagen: Es hat Vor- und Nachteile. Die Mischung macht's.",fa:"خلاصه می‌شود گفت: مزایا و معایبی دارد. ترکیبش خوب است."}
]},
{type:"vocab",items:[
{de:"zunächst",fa:"اول از همه",note:"شروع بحث و اولین استدلال"},
{de:"darüber hinaus",fa:"علاوه بر این",note:"رسمی‌تر از außerdem"},
{de:"hingegen",fa:"در مقابل",note:"تضاد مستقیم با جمله‌ی قبل"},
{de:"jedoch",fa:"ولی (رسمی)",note:"جایگاه دوم: ..., jedoch ..."},
{de:"einerseits ... andererseits",fa:"از یک طرف ... از طرف دیگر",note:"ساختار دوقلوی کلاسیک"},
{de:"zwar ... aber",fa:"هرچند ... ولی",note:"پذیرش حرف طرف + نظر مخالف"},

]},
{type:"grammar",title:"اسکلت یک بحث امتحانی",body:"بحث خوب سه بخش دارد: ۱) [[Einleitung]] — موضوع را معرفی کن: [[Heute möchte ich über ... sprechen.]] ۲) [[Argumente]] — اول موافق، بعد مخالف (یا برعکس)، با رابط‌ها: شروع با [[Zunächst einmal ...]]، ادامه با [[Darüber hinaus ...]]، بعد تضاد: [[Andererseits ...]]، [[Hingegen ...]] ۳) [[Schluss]] — نظر شخصی + جمع‌بندی: [[Zusammenfassend bin ich der Meinung, dass ...]] ⚠️ نکته‌ی امتحانی: در B2 حداقل ۳ رابط متفاوت لازم داری؛ تکرار فقط [[aber]] و [[weil]] نمره را پایین می‌آورد. هر پاراگراف را با یک رابط شروع کن."},
{type:"grammar",title:"هنر «هرچند... ولی»: [[Konzession]]",body:"برای نشان دادن اینکه حرف طرف را شنیده‌ای ولی نظر دیگری داری، از ساختار امتیازدهی استفاده کن: [[Zwar]] + جمله، [[aber]] + جمله: [[Zwar spart man Zeit, aber man vereinsamt.]] با [[obwohl]]: [[Obwohl man Zeit spart, vereinsamt man.]] (فعل آخر جمله‌ی فرعی می‌رود!) با [[trotz]] + اسم: [[Trotz der Vorteile bin ich dagegen.]] — [[trotz]] با Genitiv می‌آید: [[trotz des Regens]]، نه [[trotz dem Regen]]. نکته‌ی امتحانی: [[trotzdem]] قید است و جمله‌ی مستقل می‌خواهد: [[Es regnet. Trotzdem gehen wir raus.]] — آن را با [[trotz]] قاطی نکن."},
{type:"text",de:"Sollten Handys in der Schule verboten werden? Zunächst einmal lenken sie vom Unterricht ab. Darüber hinaus können sie für Cybermobbing missbraucht werden. Andererseits sind sie im Notfall nützlich, und man kann sie sinnvoll im Unterricht einsetzen. Zwar überwiegen meiner Meinung nach die Nachteile, aber ein generelles Verbot halte ich für übertrieben. Zusammenfassend plädiere ich für klare Regeln statt eines Verbots.",fa:"آیا موبایل باید در مدرسه ممنوع شود؟ اول از همه، حواس را از درس پرت می‌کند. علاوه بر این، می‌تواند برای آزار سایبری سوءاستفاده شود. از طرف دیگر، در مواقع اضطراری مفید است و می‌شود در کلاس به‌طور معنادار از آن استفاده کرد. هرچند به نظر من معایب بیشتر است، ولی ممنوعیت کلی را اغراق‌آمیز می‌دانم. خلاصه، به‌جای ممنوعیت، طرفدار قوانین شفاف هستم."},
{type:"vocab",items:[
{de:"seine Meinung äußern",fa:"نظر دادن",note:"formell für sagen"},
{de:"ein Argument anführen",fa:"استدلال آوردن",note:"für/gegen etwas anführen"},

{de:"auf den Punkt bringen",fa:"خلاصه و دقیق گفتن",note:"Um es auf den Punkt zu bringen: ..."},
{de:"Da hast du recht, aber...",fa:"حق با توست، ولی...",note:"مودبانه وارد مخالفت شدن"}
]}
],

{type:"type",q:"با zwar...aber بازنویسی کن: Obwohl es regnet, gehen wir spazieren. → ___ es regnet, ___ wir spazieren.",answer:"Zwar aber",accept:["zwar aber","Zwar aber"]},

]}
