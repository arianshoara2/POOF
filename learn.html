وند»؟"},{"de":"Das sind Nachweise, die du noch einreichen musst.","fa":"مدارکی هستند که هنوز باید ارائه کنی."},{"de":"Warum schreiben Behörden so kompliziert?","fa":"چرا اداره‌ها این‌قدر پیچیده می‌نویسند؟"},{"de":"Solche Partizipialgruppen verdichten viele Informationen.","fa":"چنین گروه‌های وصفی اطلاعات زیادی را فشرده می‌کنند."},{"de":"Ich finde „wegen fehlender Nachweise“ aber verständlicher.","fa":"اما من «به‌خاطر مدارکِ موجودنبودن» را قابل‌فهم‌تر می‌دانم."},{"de":"Es ist kürzer, doch man muss die Bedeutung genau prüfen.","fa":"کوتاه‌تر است، اما باید معنا را دقیق بررسی کرد."},{"de":"Kann ich „bei fehlenden Nachweisen“ genauso verwenden?","fa":"می‌توانم «در صورت نبود مدارک» را همان‌طور به کار ببرم؟"},{"de":"Nicht immer: „wegen“ nennt einen Grund, „bei“ oft eine Bedingung.","fa":"نه همیشه: «wegen» علت را و «bei» اغلب شرط را بیان می‌کند."},{"de":"Jetzt verstehe ich den Unterschied zwischen Ursache und Bedingung.","fa":"حالا تفاوت علت و شرط را می‌فهمم."},{"de":"Würdest du meinen Entwurf trotzdem gegenlesen?","fa":"بااین‌حال پیش‌نویسم را بازخوانی می‌کنی؟"},{"de":"Gern. Wir können unnötige Nominalisierungen vereinfachen.","fa":"با کمال میل؛ می‌توانیم اسم‌سازی‌های غیرضروری را ساده کنیم."}]},{"type":"vocab","items":[{"de":"nach erfolgter Prüfung","fa":"پس از انجام بررسی","note":"بازنویسی روشن‌تر: nachdem die Unterlagen geprüft worden sind."},{"de":"bei unvollständiger Vorlage","fa":"در صورت ارائهٔ ناقص","note":"bei در اینجا شرطی است؛ می‌توان از wenn ... nicht vollständig vorgelegt werden استفاده کرد."},{"de":"zwecks Überprüfung","fa":"به‌منظور بررسی","note":"zwecks با گنتیو می‌آید؛ سبک اداری و فشرده دارد."},{"de":"fristgerecht nachreichen","fa":"مدارک باقی‌مانده را در مهلت مقرر ارائه کردن","note":"nachreichen یعنی چیزی را پس از ارسال اولیه اضافه یا تکمیل کردن."},{"de":"die Bearbeitung des Antrags","fa":"رسیدگی به درخواست","note":"des Antrags وابستهٔ گنتیو است؛ معادل فعلی: den Antrag bearbeiten."},{"de":"die Voraussetzung","fa":"پیش‌شرط","note":"Voraussetzung für + Akkusativ."},{"de":"die Richtlinie","fa":"دستورالعمل","note":"در مقررات اداری؛ جمع: Richtlinien."},{"de":"das Verfahren","fa":"روند / فرایند","note":"در زبان اداری بسیار رایج."},{"de":"der Nachweis","fa":"مدرک اثباتی","note":"جمع: Nachweise؛ einen Nachweis erbringen."},{"de":"die Frist","fa":"مهلت","note":"eine Frist einhalten / versäumen."},{"de":"fristgerecht","fa":"در مهلت مقرر","note":"قید؛ die fristgerecht eingereichten Unterlagen."},{"de":"nachreichen","fa":"بعداً تکمیل و ارسال کردن","note":"jdm. etwas nachreichen."},{"de":"die Bescheinigung","fa":"گواهی","note":"جمع: Bescheinigungen."},{"de":"die Vollständigkeit","fa":"کامل‌بودن","note":"auf Vollständigkeit prüfen."},{"de":"die Bearbeitung","fa":"رسیدگی / پردازش","note":"die Bearbeitung des Antrags."},{"de":"die Verzögerung","fa":"تأخیر","note":"جمع: Verzögerungen."},{"de":"das Partizip","fa":"وجه وصفی","note":"Partizip I و Partizip II."},{"de":"die Nominalisierung","fa":"اسم‌سازی","note":"به اسم تبدیل‌کردن فعل یا صفت."},{"de":"der Verbalstil","fa":"سبک فعلی","note":"ساختارهای دارای بند و فعل."},{"de":"der Nominalstil","fa":"سبک اسمی","note":"نام‌سازی برای فشرده‌سازی."},{"de":"ausstellen","fa":"صادر کردن","note":"eine Bescheinigung ausstellen."},{"de":"einreichen","fa":"تحویل دادن / ارائه کردن","note":"einen Antrag einreichen."},{"de":"die Anerkennung","fa":"تأیید / به‌رسمیت‌شناختن","note":"Anerkennung eines Abschlusses."},{"de":"die Zuständigkeit","fa":"مسئولیت اداری","note":"für etwas zuständig sein."},{"de":"die Vorgangsnummer","fa":"شمارهٔ پرونده","note":"در مکاتبات اداری."},{"de":"die Bedingung","fa":"شرط","note":"در مقابل Ursache = علت."},{"de":"die Ursache","fa":"علت","note":"wegen + Genitiv برای علت."},{"de":"die Satzumformung","fa":"بازنویسی ساختاری جمله","note":"دقت در حفظ معنای اصلی."}]},{"type":"grammar","title":"Partizip I و II به‌عنوان صفت","body":"[[Partizip I]] با [[Infinitiv + d]] ساخته می‌شود: [[warten → wartend]]. در نقش صفت، پایانهٔ صفت می‌گیرد: [[die wartenden Personen]]. معمولاً کنش فعال و هم‌زمان یا یک ویژگی جاری را بیان می‌کند: [[die noch fehlenden Nachweise]] یعنی مدارکی که هنوز موجود نیستند. [[Partizip II]] با افعال متعدی غالباً معنای مجهول یا نتیجهٔ عمل دارد: [[die eingereichten Unterlagen]] یعنی مدارکی که ارائه شده‌اند. اما همیشه مجهول نیست: [[die angekommenen Gäste]] مهمانانی هستند که رسیده‌اند؛ [[ankommen]] لازم است. بنابراین تفاوت را فقط به «حال در برابر گذشته» تقلیل نده؛ نقش کنشگر، نتیجه و نوع فعل را هم بررسی کن.\n\nنمونه‌های تحلیلی:\n• [[Die vor dem Büro wartenden Personen wurden aufgerufen.]] (افرادی که جلوی دفتر منتظر بودند صدا زده شدند.)\n• [[Die eingegangenen Anträge werden geprüft.]] (درخواست‌های دریافت‌شده بررسی می‌شوند.)\n• [[Die frisch renovierten Räume sind hell.]] (اتاق‌های تازه بازسازی‌شده روشن‌اند.)\n• [[Ein noch fehlender Nachweis muss eingereicht werden.]] (یک مدرک باقی‌مانده باید ارائه شود.)\n• [[Die von der Behörde geprüften Unterlagen liegen vor.]] (مدارک بررسی‌شده توسط اداره موجودند.)\n• [[Die gestern angekommenen Gäste haben eingecheckt.]] (مهمانانی که دیروز رسیده‌اند پذیرش کرده‌اند.)\n• [[Die gerade laufende Untersuchung dauert länger.]] (بررسیِ در حال انجام طولانی‌تر می‌شود.)"},{"type":"grammar","title":"گسترش عبارت وصفی و بازکردن آن","body":"در [[die von der Behörde sorgfältig geprüften Unterlagen]] تمام عبارتِ پیش از اسم به [[Unterlagen]] وابسته است. برای فهم، اول هسته را پیدا کن: [[die Unterlagen]]؛ سپس فعل: [[geprüft]]؛ بعد عامل و قید: [[von der Behörde]] و [[sorgfältig]]. بازنویسی موصولی: [[die Unterlagen, die von der Behörde sorgfältig geprüft wurden]]. زمان دقیقِ بند موصولی را با بافت انتخاب کن؛ خودِ صفت به‌تنهایی همهٔ اطلاعات زمانی را نمی‌دهد. ساختار [[die einzureichenden Unterlagen]] الزام یا انتظار را بیان می‌کند: [[die Unterlagen, die eingereicht werden müssen/sollen]]. این ساختار را با [[die eingereichten Unterlagen]]، یعنی مدارکی که ارائه شده‌اند، اشتباه نگیر.\n\nنمونه‌های تحلیلی:\n• [[Die gestern eingereichten Unterlagen sind vollständig.]] (مدارک دیروز ارسال‌شده کامل‌اند.)\n• [[Die Unterlagen, die gestern eingereicht wurden, sind vollständig.]] (مدارکی که دیروز ارسال شدند کامل‌اند.)\n• [[Die noch zu prüfenden Unterlagen liegen im Büro.]] (مدارکی که هنوز باید بررسی شوند در دفترند.)\n• [[Die vor Kurzem ernannte Leiterin spricht morgen.]] (مدیر تازه منصوب‌شده فردا صحبت می‌کند.)\n• [[Wir benötigen die von Ihnen unterschriebenen Formulare.]] (به فرم‌های امضاشده توسط شما نیاز داریم.)\n• [[Die künftig geltenden Regeln wurden veröffentlicht.]] (قواعدی که در آینده معتبر خواهند بود منتشر شدند.)\n• [[Die sorgfältig zu lesenden Hinweise stehen unten.]] (توضیحاتی که باید دقیق خوانده شوند پایین آمده‌اند.)"},{"type":"grammar","title":"مصدر و صفت چگونه اسم می‌شوند؟","body":"مصدرِ اسمی‌شده خنثی است و با حرف بزرگ نوشته می‌شود: [[das Lesen]]، [[beim Lesen]] و [[das sorgfältige Prüfen der Unterlagen]]. صفت اسمی‌شده نیز حرف بزرگ می‌گیرد، اما پایانهٔ صفت را حفظ می‌کند: [[das Neue]]، [[etwas Neues]]، [[mit etwas Neuem]]. برای اشخاص، جنس و شمار اهمیت دارد: [[der Angestellte]]، [[eine Angestellte]] و [[die Angestellten]]. شکل [[die Antragstellenden]] از Partizip I اسمی‌شده است و در کاربرد اداری به متقاضیان اشاره می‌کند. اسم‌سازی اجازه می‌دهد اطلاعات را فشرده کنیم، ولی انباشتن اسم‌ها می‌تواند خوانایی را کم کند.\n\nنمونه‌های تحلیلی:\n• [[Das Lesen komplexer Texte erfordert Konzentration.]] (خواندن متن‌های پیچیده تمرکز می‌خواهد.)\n• [[Beim Ausfüllen des Formulars darf nichts fehlen.]] (هنگام پرکردن فرم نباید چیزی کم باشد.)\n• [[Etwas Neues auszuprobieren kann hilfreich sein.]] (امتحان‌کردن چیز تازه‌ای می‌تواند مفید باشد.)\n• [[Die Angestellten erhalten eine Mitteilung.]] (کارمندان اطلاعیه دریافت می‌کنند.)\n• [[Eine Angestellte hat die Unterlagen geprüft.]] (یک کارمند زن مدارک را بررسی کرده است.)\n• [[Das sorgfältige Prüfen spart später Zeit.]] (بررسی دقیق بعدها زمان صرفه‌جویی می‌کند.)\n• [[Die Antragstellenden warten auf eine Antwort.]] (متقاضیان منتظر پاسخ هستند.)"},{"type":"grammar","title":"نکته‌ی امتحانی: تبدیل ساختار بدون تغییر معنا","body":"در تبدیل [[Verbalstil]] به [[Nominalstil]]، رابطهٔ منطقی را حفظ کن: [[Nachdem die Behörde die Unterlagen geprüft hat]] می‌تواند به [[Nach der Prüfung der Unterlagen durch die Behörde]] تبدیل شود. مفعول به وابستهٔ گنتیو و فاعل به عبارت [[durch]] تبدیل شده است. برای شرط: [[Wenn die Unterlagen fehlen → Bei Fehlen der Unterlagen]]. برای علت: [[Weil die Unterlagen fehlen → Wegen des Fehlens der Unterlagen]]. این دو را جابه‌جا نکن؛ شرط با علت یکی نیست. در پایان، حرف بزرگ، حالت دستوری و پایانهٔ صفت را جداگانه بررسی کن.\n\nنمونه‌های تحلیلی:\n• [[Wegen der fehlenden Unterlagen verzögert sich die Prüfung.]] (به علت کمبود مدارک بررسی به تأخیر می‌افتد.)\n• [[Bei fehlenden Unterlagen fragen wir nach.]] (در صورت نبود مدارک پیگیری می‌کنیم.)\n• [[Nach Abschluss des Verfahrens folgt ein Bescheid.]] (پس از پایان فرایند تصمیم اداری صادر می‌شود.)\n• [[Durch die sorgfältige Kontrolle sinkt das Fehlerrisiko.]] (از طریق کنترل دقیق احتمال خطا پایین می‌آید.)\n• [[Trotz der Verzögerung blieb die Frist bestehen.]] (با وجود تأخیر، مهلت همچنان برقرار ماند.)\n• [[Vor der Einreichung muss alles überprüft werden.]] (پیش از ارسال باید همه‌چیز بررسی شود.)\n• [[Zur Klärung der Frage brauchen wir Unterlagen.]] (برای روشن‌شدن مسئله به مدارک نیاز داریم.)"},{"type":"tip","body":"[[Partizip I]] همیشه «زمان حال» نیست و [[Partizip II]] هم همیشه «گذشتهٔ مجهول» نیست: نوع فعل و بافت تعیین‌کننده‌اند. [[die angekommenen Gäste]] فعال است."},{"type":"tip","body":"[[die einzureichenden Dokumente]] معمولاً معنی الزام یا ضرورت دارد؛ با [[die eingereichten Dokumente]] که کار انجام‌شده را نشان می‌دهد یکی نیست."},{"type":"tip","body":"تبدیل [[wegen]] به [[bei]] رابطهٔ منطقی را عوض می‌کند. در بازنویسی آزمونی، شرط، علت و زمان را جداگانه کنترل کن."},{"type":"mistakes","items":[{"wrong":"die eingereichen Unterlagen","right":"die eingereichten Unterlagen","fa":"Partizip II در نقش صفت باید بر اساس حرف تعریف و حالت دستوری صرف شود."},{"wrong":"Ich habe das Lesen gerne.","right":"Ich lese gern.","fa":"اگر منظور «دوست دارم بخوانم» است، شکل فعلی طبیعی‌تر است؛ اسم‌سازی همیشه بهترین انتخاب نیست."},{"wrong":"wegen dem Fehlen der Nachweise","right":"wegen des Fehlens der Nachweise","fa":"در آلمانی معیارِ رسمی معمولاً wegen با Genitiv می‌آید؛ شکل Dativ در گفتار برخی مناطق وجود دارد."}]},{"type":"text","de":"Die fristgerecht eingereichten Bewerbungsunterlagen werden zunächst auf Vollständigkeit geprüft. Alle noch fehlenden Nachweise sind bis zum angegebenen Termin nachzureichen. Nach erfolgter Prüfung erhalten die Antragstellenden eine schriftliche Mitteilung. Bei unvollständiger Vorlage der erforderlichen Dokumente kann sich die Bearbeitung erheblich verzögern.\n\nIn der vergangenen Woche wurde außerdem eine neue Richtlinie veröffentlicht. Die darin festgelegten Voraussetzungen gelten für alle ab November eingehenden Anträge. Besonders sorgfältig zu prüfen sind die von ausländischen Einrichtungen ausgestellten Bescheinigungen. Die für die Anerkennung zuständige Stelle bittet darum, solche Unterlagen möglichst früh einzureichen.\n\nWer eine Rückfrage hat, sollte sich auf die im Schreiben genannte Vorgangsnummer beziehen. Statt einer langen Darstellung des gesamten Falls genügt häufig eine präzise Beschreibung des noch ungeklärten Problems. Beim Ausfüllen des Formulars ist darauf zu achten, dass die angegebenen Daten mit den beigefügten Nachweisen übereinstimmen.\n\nDie Behörde weist darauf hin, dass das Einreichen zusätzlicher Dokumente nicht automatisch zu einer schnelleren Entscheidung führt. Wegen der hohen Zahl eingehender Anträge kann die Bearbeitung länger dauern. Nach Abschluss der Prüfung werden die Ergebnisse schriftlich mitgeteilt. Das sorgfältige Lesen der Hinweise hilft dabei, vermeidbare Fehler zu erkennen und unnötige Verzögerungen zu verhindern.","fa":"مدارک درخواست که در مهلت مقرر ارسال شده‌اند ابتدا از نظر کامل بودن بررسی می‌شوند. همهٔ مدارک باقی‌مانده باید تا تاریخ اعلام‌شده فرستاده شوند. پس از پایان بررسی، متقاضیان نامه‌ای دریافت می‌کنند. ارائهٔ ناقص مدارک ممکن است رسیدگی را به‌طور محسوسی عقب بیندازد.\n\nهفتهٔ گذشته دستورالعمل جدیدی منتشر شد. شرایط تعیین‌شده در آن برای همهٔ درخواست‌هایی که از نوامبر دریافت می‌شوند اعتبار دارد. گواهی‌های صادرشده از سوی مراکز خارجی باید با دقت ویژه بررسی شوند. ادارهٔ مسئول تأیید مدارک می‌خواهد که این مدارک هرچه زودتر ارائه شوند.\n\nکسی که سؤالی دارد بهتر است به شمارهٔ پروندهٔ درج‌شده در نامه اشاره کند. به‌جای شرح طولانی کل ماجرا اغلب توضیح دقیقی از مشکل حل‌نشده کافی است. هنگام پر کردن فرم باید توجه کرد که اطلاعات واردشده با اسناد پیوست مطابقت داشته باشند.\n\nاداره اشاره می‌کند که ارائهٔ مدارک اضافی لزوماً تصمیم سریع‌تر را تضمین نمی‌کند. به‌سبب شمار زیاد درخواست‌های دریافتی، رسیدگی ممکن است طولانی شود. بعد از پایان بررسی، نتایج کتبی اعلام می‌شوند. خواندن دقیق راهنما به شناسایی خطاهای قابل پیشگیری و جلوگیری از تأخیرهای غیرضروری کمک می‌کند."}],"exercises":[{"type":"blank","text":"Die vor dem Büro ___ Personen haben einen Termin. (warten, Partizip I mit Endung)","answer":"wartenden"},{"type":"mc","q":"die bis Freitag einzureichenden Unterlagen یعنی چه؟","options":["مدارکی که جمعهٔ گذشته ارائه شده‌اند.","مدارکی که باید تا جمعه ارائه شوند.","مدارکی که خودشان درخواست دیگری را بررسی می‌کنند."],"answer":1,"why":"ساختار zu + Partizip I در نقش صفت، مانند einzureichend، معمولاً ضرورت یا انتظار انجام کار را می‌رساند."},{"type":"type","q":"عبارت die von der Kommission geprüften Anträge را به عبارت موصولی با wurden بازنویسی کن.","answer":"die Anträge, die von der Kommission geprüft wurden","accept":["Die Anträge, die von der Kommission geprüft wurden","die Anträge, die von der Kommission geprüft wurden."]},{"type":"blank","text":"In diesem Kurs beschäftigen wir uns mit etwas ___. (neu, substantiviert)","answer":"Neuem"},{"type":"mc","q":"کدام بازنویسی رابطهٔ شرطیِ Wenn die Unterlagen fehlen را حفظ می‌کند؟","options":["Wegen des Fehlens der Unterlagen","Trotz des Fehlens der Unterlagen","Bei Fehlen der Unterlagen"],"answer":2,"why":"bei در این کاربرد شرط را بیان می‌کند. wegen علت و trotz رابطهٔ امتیازی یا خلاف انتظار را نشان می‌دهد."},{"type":"mc","q":"کدام عبارت یعنی «مدارکی که باید ارائه شوند»؟","options":["die eingereichten Unterlagen","die einzureichenden Unterlagen","die einreichenden Unterlagen"],"answer":1,"why":"[[einzureichend]] از الگوی [[zu + Partizip I]] برای ضرورت یا انتظار استفاده می‌کند."},{"type":"blank","text":"Die sorgfältig ___ Unterlagen liegen vor. (prüfen, Partizip II)","answer":"geprüften"},{"type":"type","q":"عبارت وصفی بساز: die Anträge, die bereits genehmigt wurden","answer":"die bereits genehmigten Anträge","accept":["die bereits genehmigten Anträge"]},{"type":"mc","q":"کدام جمله از نظر معنای منطقی علت را بیان می‌کند؟","options":["Bei fehlenden Nachweisen kann sich alles verzögern.","Wegen fehlender Nachweise kam es zu einer Verzögerung.","Falls Nachweise fehlen, fragen wir nach."],"answer":1,"why":"[[wegen]] معمولاً رابطهٔ علت را بیان می‌کند؛ [[bei]] و [[falls]] می‌توانند شرط باشند."},{"type":"blank","text":"___ sorgfältigen Lesen erkennt man oft Fehler. (beim)","answer":"Beim"},{"type":"type","q":"به سبک اسمی تبدیل کن: Nachdem die Prüfung abgeschlossen wurde, ...","answer":"Nach Abschluss der Prüfung ...","accept":["Nach Abschluss der Prüfung"]},{"type":"mc","q":"کدام شکل اسم‌سازیِ صفت درست است؟","options":["etwas neues","etwas Neues","etwas Neu"],"answer":1,"why":"بعد از etwas صفتِ اسمی‌شده با حرف بزرگ و پایانهٔ مناسب می‌آید."}],"glossary":{"ab":"از / از زمانِ","aber":"اما","alle":"همه","auf":"روی / به","automatisch":"به‌صورت خودکار","außerdem":"علاوه بر این","bedingung":"شرط","behörde":"ادارهٔ دولتی","bei":"نزد / کنار / هنگام","beim":"هنگام / نزد (bei dem)","besonders":"به‌خصوص / چندان","bis":"تا","dabei":"همراه","darauf":"بر آن / بر این","darum":"برای همین / دربارهٔ آن","das":"آن / این / حرف تعریف خنثی","dass":"که","den":"حرف تعریف مفعولی مذکر / داتیو جمع","der":"حرف تعریف مذکر / داتیو مؤنث","des":"حرف تعریف گنتیو مذکر/خنثی","die":"حرف تعریف مؤنث / جمع","doch":"اما / ولی","du":"تو","eine":"یک (مؤنث)","einen":"یک (مفعولی مذکر)","einer":"یک (صرف‌شده)","einreichen":"ارائه / ثبت کردن","entscheidung":"تصمیم lems":"مشکل","präzise":"دقیق","rückfrage":"پرسش پیگیری","schnelleren":"سریع‌تر","schriftlich":"کتبی","schriftliche":"کتبی","sorgfältige":"دقیق / با دقت","statt":"به‌جای","ungeklärten":"روشن‌نشده","unnötige":"غیرضروری","verdichten":"فشرده‌کردن","vereinfachen":"ساده کردن","vergangenen":"گذشته","verhindern":"جلوگیری کردن","vermeidbare":"قابل پیشگیری","verstanden":"فهمید","verständlicher":"قابل‌فهم‌تر","verwenden":"استفاده کردن","verzögern":"به تأخیر انداختن","verzögerungen":"تأخیرها","voraussetzungen":"پیش‌شرط‌ها","weist":"اشاره می‌کند / نشان می‌دهد","zahl":"تعداد","zuständige":"مسئول / مربوطه","zusätzlicher":"اضافی","übereinstimmen":"مطابقت داشتن"}},{"id":"l13","order":13,"level":"C1","minutes":25,"title":"۲۰ اصطلاح آلمانی و انتخاب لحن درست","titleDe":"Redewendungen: Bedeutung, Kontext und Register","blocks":[{"type":"dialog","lines":[{"de":"Ich glaube, wir schieben diese Entscheidung seit Wochen auf die lange Bank.","fa":"فکر کنم چند هفته است این تصمیم را مدام عقب می‌اندازیم."},{"de":"Da triffst du den Nagel auf den Kopf.","fa":"دقیقاً به نکتهٔ اصلی اشاره کردی."},{"de":"Dann sollten wir endlich Nägel mit Köpfen machen.","fa":"پس باید بالاخره اقدام جدی و عملی کنیم."},{"de":"Moment, wir dürfen nichts übers Knie brechen.","fa":"صبر کن، نباید عجولانه تصمیم بگیریم."},{"de":"Keine Sorge. Wir wollen nur einen realistischen Zeitplan festlegen.","fa":"نگران نباش. فقط می‌خواهیم برنامهٔ زمانی واقع‌بینانه تنظیم کنیم."},{"de":"Gut, denn ich möchte die Risiken nicht unter den Teppich kehren.","fa":"خوب است، چون نمی‌خواهم خطرها را زیر فرش پنهان کنم."},{"de":"Wie würdest du das in einem offiziellen Bericht formulieren?","fa":"این را در یک گزارش رسمی چطور می‌نوشتی؟"},{"de":"Ich würde schreiben: „Mögliche Risiken sollten transparent benannt werden.“","fa":"می‌نوشتم: «خطرهای احتمالی باید شفاف بیان شوند.»"},{"de":"Stimmt. Im Gespräch sind Redewendungen oft lebendiger.","fa":"درست است. در گفت‌وگو اصطلاح‌ها اغلب زنده‌ترند."},{"de":"Aber in einem wissenschaftlichen Text können sie unpassend wirken.","fa":"اما در متن علمی ممکن است نامناسب به نظر برسند."},{"de":"Übrigens: Ich habe vorhin völlig den Faden verloren.","fa":"راستی: کمی قبل کاملاً رشتهٔ کلام از دستم رفت."},{"de":"Kein Problem. Ich bringe die Ergebnisse kurz auf den Punkt.","fa":"مشکلی نیست؛ نتایج را کوتاه و دقیق بیان می‌کنم."},{"de":"Danke! Jetzt verstehe ich wieder, worauf es ankommt.","fa":"ممنون! حالا دوباره می‌فهمم چه چیزی مهم است."},{"de":"Super. Dann drücke ich uns für morgen die Daumen.","fa":"عالی. پس امیدوارم فردا موفق شویم."}]},{"type":"vocab","items":[{"de":"ins Gras beißen","fa":"مردن؛ به لحن عامیانه «ریغ رحمت را سر کشیدن»","note":"لفظی: علف را گاز گرفتن. لحن: عامیانه، زمخت یا طنز تلخ؛ برای تسلیت مناسب نیست."},{"de":"den Nagel auf den Kopf treffen","fa":"دقیقاً به نکتهٔ اصلی اشاره کردن","note":"لفظی: میخ را روی سرش زدن. لحن: محاوره‌ای؛ در بحث کاری هم طبیعی است."},{"de":"Tomaten auf den Augen haben","fa":"چیز واضحی را ندیدن","note":"لفظی: گوجه روی چشم داشتن. لحن: شوخ یا سرزنش‌آمیز؛ خطاب مستقیم ممکن است آزاردهنده باشد."},{"de":"nur Bahnhof verstehen","fa":"هیچ‌چیز از حرف‌ها نفهمیدن","note":"لفظی: فقط «ایستگاه قطار» را فهمیدن. لحن: کاملاً محاوره‌ای."},{"de":"jemandem die Daumen drücken","fa":"برای موفقیت کسی آرزو کردن","note":"لفظی: شست‌ها را برای کسی فشردن. لحن: دوستانه و رایج؛ شخص در داتیو می‌آید."},{"de":"zwei Fliegen mit einer Klappe schlagen","fa":"با یک تیر دو نشان زدن","note":"لفظی: دو مگس را با یک مگس‌کش زدن. لحن: محاوره‌ای و تصویری."},{"de":"etwas auf die lange Bank schieben","fa":"کاری را مرتب به تعویق انداختن","note":"لفظی: چیزی را روی نیمکت بلند هل دادن. لحن: محاوره‌ای؛ بار انتقادی دارد."},{"de":"den Kopf in den Sand stecken","fa":"از پذیرفتن یا مواجهه با مشکل فرار کردن","note":"لفظی: سر را در شن فرو کردن. لحن: تصویری و انتقادی."},{"de":"Nägel mit Köpfen machen","fa":"کار را قاطع و عملی پیش بردن","note":"لفظی: میخ‌های سر‌دار ساختن. لحن: محاوره‌ای؛ تأکید بر اقدام واقعی."},{"de":"etwas übers Knie brechen","fa":"کاری را نسنجیده و عجولانه انجام دادن","note":"لفظی: چیزی را روی زانو شکستن. لحن: محاوره‌ای؛ اغلب در توصیهٔ منفی می‌آید."},{"de":"um den heißen Brei herumreden","fa":"حاشیه رفتن و اصل حرف را نگفتن","note":"لفظی: دورِ حریرهٔ داغ حرف زدن. لحن: محاوره‌ای؛ ممکن است انتقادی باشد."},{"de":"das Handtuch werfen","fa":"تسلیم شدن و کنار کشیدن","note":"لفظی: حوله را انداختن. لحن: محاوره‌ای؛ استعاره‌ای از بوکس."},{"de":"über den eigenen Schatten springen","fa":"بر مانع درونی خود غلبه کردن","note":"لفظی: از روی سایهٔ خود پریدن. لحن: تصویری؛ برای کنارگذاشتن ترس، غرور یا عادت."},{"de":"aus allen Wolken fallen","fa":"از شنیدن چیزی کاملاً شوکه شدن","note":"لفظی: از همهٔ ابرها افتادن. لحن: محاوره‌ای؛ اغلب دربارهٔ خبر غیرمنتظره."},{"de":"jemandem einen Bären aufbinden","fa":"با داستانی ساختگی کسی را فریب دادن","note":"لفظی: خرسی به کسی بستن. لحن: محاوره‌ای و گاهی شوخ؛ شخص داتیو است."},{"de":"auf dem Schlauch stehen","fa":"موقتاً مطلبی را نگرفتن؛ ذهن قفل کردن","note":"لفظی: روی شلنگ ایستادن. لحن: غیررسمی؛ دربارهٔ ناتوانی موقت در فهمیدن."},{"de":"etwas in Kauf nehmen","fa":"پیامد ناخوشایندی را آگاهانه پذیرفتن","note":"لفظی: چیزی را در خرید پذیرفتن. لحن: خنثی؛ در متن تحلیلی و رسمی هم مناسب است."},{"de":"auf etwas Wert legen","fa":"برای چیزی اهمیت قائل بودن","note":"لفظی: بر چیزی ارزش گذاشتن. لحن: خنثی تا رسمی؛ auf با آکوزاتیو."},{"de":"etwas auf den Punkt bringen","fa":"مطلب را دقیق و موجز بیان کردن","note":"لفظی: چیزی را به نقطه رساندن. لحن: خنثی؛ برای بحث و ارائه مناسب است."},{"de":"den Faden verlieren","fa":"رشتهٔ کلام یا فکر را گم کردن","note":"لفظی: نخ را گم کردن. لحن: خنثی تا محاوره‌ای."},{"de":"etwas unter den Teppich kehren","fa":"چیزی را لاپوشانی کردن","note":"محاوره‌ای؛ رسمی: ein Problem verschweigen."},{"de":"auf etwas hinauslaufen","fa":"به چیزی منتهی شدن","note":"auf + Akkusativ؛ لحن خنثی."},{"de":"etwas ins Rollen bringen","fa":"کاری را راه انداختن","note":"محاوره‌ای تا خنثی؛ یک فرایند آغاز می‌شود."},{"de":"sich ins Zeug legen","fa":"حسابی تلاش کردن","note":"محاوره‌ای، دوستانه."},{"de":"der Tonfall","fa":"لحنِ گفتار","note":"der angemessene Tonfall."},{"de":"das Register","fa":"سطح و سبک زبانی","note":"گفتاری، اداری یا دانشگاهی."},{"de":"die Umschreibung","fa":"بازنویسی با عبارتی دیگر","note":"eine neutrale Umschreibung wählen."},{"de":"die Redewendung","fa":"اصطلاح","note":"جمع: Redewendungen."}]},{"type":"grammar","title":"قالب ثابت، صرف متغیر","body":"در اصطلاح‌ها بخش‌هایی ثابت‌اند، اما فعل، ضمیر و زمان تغییر می‌کنند: [[Ich drücke dir die Daumen]]، [[Sie hat mir die Daumen gedrückt]]. حالت دستوری را همراه اصطلاح یاد بگیر: [[jemandem einen Bären aufbinden]] یعنی شخص داتیو و [[einen Bären]] آکوزاتیو است. در [[auf etwas Wert legen]] حرف اضافهٔ [[auf]] آکوزاتیو می‌گیرد: [[Wir legen Wert auf eine klare Begründung]]. ترجمهٔ واژه‌به‌واژه برای یادآوری تصویر مفید است، اما ترجمهٔ نهایی باید معنای اصطلاح را منتقل کند.\n\nنمونه‌های تحلیلی:\n• [[Sie hat den Nagel auf den Kopf getroffen.]] (او دقیقاً به نکتهٔ اصلی اشاره کرد.)\n• [[Wir sollten keine Risiken unter den Teppich kehren.]] (نباید خطرها را لاپوشانی کنیم.)\n• [[Ich habe den Faden verloren.]] (رشتهٔ کلام از دستم رفت.)\n• [[Er legt großen Wert auf Pünktlichkeit.]] (او به وقت‌شناسی اهمیت زیادی می‌دهد.)\n• [[Lasst uns Nägel mit Köpfen machen.]] (بیایید بالاخره جدی اقدام کنیم.)\n• [[Wir dürfen diese Aufgabe nicht länger aufschieben.]] (نباید این کار را دیگر عقب بیندازیم.)\n• [[Ich drücke euch für die Prüfung die Daumen.]] (برای امتحان برایتان آرزوی موفقیت دارم.)"},{"type":"grammar","title":"نکته‌ی امتحانی: اصطلاح مناسب از اصطلاح زیاد مهم‌تر است","body":"در نگارش رسمی، [[Risiken in Kauf nehmen]] یا [[Wert auf Transparenz legen]] معمولاً مناسب‌اند؛ [[nur Bahnhof verstehen]] یا [[ins Gras beißen]] را به متن دانشگاهی تحمیل نکن. برای بازنویسی، [[das Handtuch werfen → aufgeben]] و [[etwas auf die lange Bank schieben → etwas wiederholt aufschieben]] را بشناس. میان [[den Nagel auf den Kopf treffen]]، یعنی درست تشخیص دادن، و [[Nägel mit Köpfen machen]]، یعنی عملی و قاطع اقدام کردن، فرق بگذار. شباهت تصویر به معنی یکسان‌بودن کاربرد نیست.\n\nنمونه‌های تحلیلی:\n• [[Sie sprach um den heißen Brei herum.]] (او حاشیه رفت.)\n• [[Die Mitarbeiterin hat das Handtuch geworfen.]] (کارمند تسلیم شد.)\n• [[Er steht heute völlig auf dem Schlauch.]] (او امروز اصلاً موضوع را نمی‌گیرد.)\n• [[Die Bewerberin fiel aus allen Wolken.]] (متقاضی کاملاً شوکه شد.)\n• [[Wir müssen die Entscheidung auf den Punkt bringen.]] (باید تصمیم را دقیق بیان کنیم.)\n• [[Das Team hat große Nachteile in Kauf genommen.]] (گروه معایب بزرگی را پذیرفت.)\n• [[Sie schieben das Problem auf die lange Bank.]] (آن‌ها رسیدگی به مشکل را مدام عقب می‌اندازند.)"},{"type":"grammar","title":"تفاوت زبان تصویری و سبک خنثی","body":"در سطح C1 باید بتوانی اصطلاح را بدون تغییر معنای اصلی برای مخاطب و قالب دیگر بازنویسی کنی. محاوره‌ای بودن، «غلط» نیست؛ اما معیار مناسبت در نوشتار رسمی فرق دارد. [[das Handtuch werfen]] در گفت‌وگو طبیعی است، [[aufgeben]] در گزارش خنثی‌تر. اصطلاح باید در بافت و با حالت دستوری صحیح بیاید.\n\nنمونه‌های تحلیلی:\n• [[Der Verein hat das Handtuch geworfen.]] (انجمن کنار کشیده است؛ محاوره‌ای.)\n• [[Der Verein hat das Vorhaben aufgegeben.]] (انجمن پروژه را کنار گذاشته است؛ خنثی.)\n• [[Wir sollten die Risiken nicht unter den Teppich kehren.]] (نباید خطرها را پنهان کنیم؛ محاوره‌ای.)\n• [[Die Risiken müssen offen benannt werden.]] (باید خطرها آشکارا بیان شوند؛ رسمی.)\n• [[Das bringt die Ergebnisse auf den Punkt.]] (این نتایج را موجز و دقیق بیان می‌کند.)\n• [[Der Bericht fasst die Ergebnisse präzise zusammen.]] (گزارش نتایج را دقیق خلاصه می‌کند.)\n• [[Ich verstehe nur Bahnhof.]] (هیچ‌چیزی نمی‌فهمم؛ محاوره‌ای.)"},{"type":"tip","body":"همهٔ اصطلاح‌های تصویری برای نامهٔ رسمی مناسب نیستند. [[das Handtuch werfen]] را در گزارش دانشگاهی معمولاً با [[aufgeben]] بازنویسی کن."},{"type":"tip","body":"بخش ثابت اصطلاح را با صرف فعل اشتباه نگیر: [[Ich lege Wert auf ...]] و [[Ich habe Wert auf ... gelegt.]] حرف اضافه و حالت هم ثابت می‌مانند."},{"type":"tip","body":"شباهت ظاهری دو اصطلاح معنی یکسان نمی‌سازد: [[den Nagel auf den Kopf treffen]] = درست تشخیص دادن، ولی [[Nägel mit Köpfen machen]] = اقدام عملی."},{"type":"mistakes","items":[{"wrong":"Ich drücke dich die Daumen.","right":"Ich drücke dir die Daumen.","fa":"شخصِ دریافت‌کننده در این اصطلاح Dativ می‌گیرد."},{"wrong":"Wir legen Wert an Transparenz.","right":"Wir legen Wert auf Transparenz.","fa":"حرف اضافهٔ ثابت auf با Akkusativ می‌آید."},{"wrong":"Im offiziellen Bericht steht: „Ich verstehe nur Bahnhof.“","right":"Im offiziellen Bericht steht: „Ich habe die Erklärung nicht verstanden.“","fa":"جملهٔ اول دستوری است اما به‌دلیل لحن محاوره‌ای برای گزارش رسمی معمولاً نامناسب است."}]},{"type":"text","de":"Im Vorbereitungstreffen für ein Kulturprojekt geriet die Diskussion zunächst ins Stocken. Einige Mitglieder wollten den Termin erneut verschieben; andere fanden, man dürfe die Entscheidung nicht länger auf die lange Bank schieben. Die Projektleiterin brachte die Lage auf den Punkt: Ohne verbindliche Zusagen könne die Veranstaltung nicht seriös geplant werden. Damit traf sie den Nagel auf den Kopf.\n\nEin Teilnehmer schlug vor, sofort alle Räume zu buchen. Seine Kollegin widersprach: Man solle nichts übers Knie brechen, bevor die Finanzierung geklärt sei. Gleichzeitig wollte sie nicht das Handtuch werfen. Stattdessen regte sie an, zwei Möglichkeiten parallel zu prüfen. Auf diese Weise könnten sie vielleicht zwei Fliegen mit einer Klappe schlagen: Kosten sparen und zusätzliche Gäste erreichen.\n\nAls die technischen Fragen immer komplizierter wurden, verlor ein neuer Mitarbeiter kurz den Faden. Er erklärte offen, er verstehe gerade nur Bahnhof. Niemand machte sich darüber lustig; eine Kollegin fasste die wichtigsten Punkte verständlich zusammen.\n\nZum Schluss beschlossen alle, Nägel mit Köpfen zu machen. Bis Freitag sollten konkrete Angebote eingeholt werden. Die Leiterin versprach, dabei auf Transparenz Wert zu legen und mögliche Nachteile nicht zu verschweigen. Sie drückte dem Team die Daumen. Im anschließenden Protokoll ersetzte sie die meisten umgangssprachlichen Redewendungen durch sachliche Formulierungen. Der Ton musste schließlich zu einer offiziellen Mitteilung passen.","fa":"در جلسهٔ آماده‌سازی یک برنامهٔ فرهنگی، بحث ابتدا گیر کرد. بعضی اعضا می‌خواستند تاریخ را دوباره عقب بیندازند؛ دیگران معتقد بودند نباید تصمیم‌گیری را باز هم به تعویق انداخت. مدیر پروژه موضوع را خلاصه و دقیق بیان کرد: بدون تعهدهای قطعی نمی‌توان برنامه را جدی سازمان داد. او دقیقاً به اصل مسئله اشاره کرد.\n\nیکی پیشنهاد کرد فوراً همهٔ سالن‌ها رزرو شوند. همکارش مخالفت کرد و گفت پیش از روشن‌شدن تأمین مالی نباید عجولانه عمل کرد. درعین‌حال نمی‌خواست تسلیم شود. پیشنهاد داد هم‌زمان دو گزینه بررسی شوند تا شاید با یک تیر دو نشان بزنند: هزینه کم شود و مهمان‌های بیشتری بیایند.\n\nوقتی سؤال‌های فنی پیچیده‌تر شدند، کارمند جدید برای لحظه‌ای رشتهٔ کلام را از دست داد. صادقانه گفت فعلاً هیچ‌چیز از بحث نمی‌فهمد. کسی مسخره‌اش نکرد؛ همکار دیگری نکات اصلی را روشن خلاصه کرد.\n\nدر پایان همه تصمیم گرفتند دست به اقدام عملی بزنند. قرار شد تا جمعه پیشنهادهای مشخص جمع شوند. مدیر قول داد برای شفافیت ارزش قائل شود و معایب احتمالی را پنهان نکند. برای گروه آرزوی موفقیت کرد. در صورت‌جلسهٔ رسمی، بیشتر اصطلاح‌های محاوره‌ای را با عبارت‌های خنثی عوض کرد، چون لحن باید برای اطلاعیهٔ رسمی مناسب می‌بود."}],"exercises":[{"type":"mc","q":"کدام اصطلاح برای بیان رسمیِ «پذیرفتن آگاهانهٔ پیامدهای منفی» مناسب است؟","options":["Nachteile in Kauf nehmen","Tomaten auf den Augen haben","ins Gras beißen"],"answer":0,"why":"in Kauf nehmen در متن رسمی و تحلیلی هم به کار می‌رود و پذیرش آگاهانهٔ هزینه یا پیامد ناخوشایند را بیان می‌کند."},{"type":"blank","text":"Für deine Prüfung drücke ich dir die ___.","answer":"Daumen"},{"type":"type","q":"با اصطلاحی دارای Faden بگو «رشتهٔ کلامم را گم کرده‌ام». از Perfekt استفاده کن.","answer":"Ich habe den Faden verloren.","accept":["Ich habe den Faden verloren"]},{"type":"mc","q":"همکارت می‌گوید Wir sollten nichts übers Knie brechen. منظور چیست؟","options":["باید هرچه زودتر و بدون بررسی تصمیم بگیریم.","نباید عجولانه و نسنجیده عمل کنیم.","دیگر هیچ فرصتی برای حل مسئله نداریم."],"answer":1,"why":"etwas übers Knie brechen به اقدام عجولانه و بدون سنجش کافی اشاره دارد؛ جمله توصیه می‌کند چنین نکنیم."},{"type":"type","q":"عبارت das Handtuch werfen را با یک فعل آلمانیِ خنثی و در حالت مصدر جایگزین کن.","answer":"aufgeben","accept":["Aufgeben"]},{"type":"mc","q":"کدام اصطلاح به معنی «به نکتهٔ اصلی اشاره‌کردن» است؟","options":["den Nagel auf den Kopf treffen","Nägel mit Köpfen machen","Tomaten auf den Augen haben"],"answer":0,"why":"اصطلاح اول به تشخیص درست اشاره می‌کند؛ دومی به اقدام قاطع."},{"type":"blank","text":"Bitte schieb die Entscheidung nicht länger auf die lange ___ .","answer":"Bank"},{"type":"type","q":"به آلمانی و با اصطلاح بنویس: برایت آرزوی موفقیت می‌کنم.","answer":"Ich drücke dir die Daumen.","accept":["Ich drücke dir die Daumen"]},{"type":"mc","q":"برای متن دانشگاهی کدام عبارت مناسب‌تر است؟","options":["Wir verstehen nur Bahnhof.","Die Erklärung war unverständlich.","Die Daten haben Tomaten auf den Augen."],"answer":1,"why":"گزینهٔ دوم زبانی روشن و خنثی دارد؛ بقیه محاوره‌ای یا بی‌معنی‌اند."},{"type":"blank","text":"Wir legen großen Wert ___ nachvollziehbare Entscheidungen.","answer":"auf"},{"type":"type","q":"اصطلاح را رسمی بازنویسی کن: „Wir dürfen die Probleme nicht unter den Teppich kehren.“","answer":"Wir dürfen die Probleme nicht verschweigen.","accept":["Die Probleme dürfen nicht verschwiegen werden."]},{"type":"mc","q":"„Wir sollten nichts übers Knie brechen“ یعنی چه؟","options":["باید فوری کار را تمام کنیم.","نباید نسنجیده و شتاب‌زده عمل کنیم.","باید بحث را کنار بگذاریم."],"answer":1,"why":"[[übers Knie brechen]] اشاره به تصمیم عجولانه دارد."}],"glossary":{"aber":"اما","alle":"همه","allen":"همه (صرف‌شده)","als":"وقتی‌که / به‌عنوان","an":"در / بر / روی","andere":"دیگر","angebote":"گزینه‌ها / پیشنهادها","auf":"روی / به","aus":"از","bahnhof":"ایستگاه قطار","bericht":"گزارش","bevor":"پیش از اینکه","bis":"تا","bringen":"آوردن","da":"آنجا / چون","dabei":"همراه","damit":"با آن / تا اینکه","danke":"ممنون","dann":"بعد","darüber":"دربارهٔ آن","das":"آن / این ن","team":"تیم","technischen":"فنی","teilnehmer":"شرکت‌کننده","ton":"لحن / صدا","traf":"هدف را زد / برخورد کرد","transparent":"شفاف","transparenz":"شفافیت","triffst":"می‌زنی / به هدف می‌زنی","umgangssprachlichen":"محاوره‌ای","unpassend":"نامناسب","verbindliche":"الزام‌آور / قطعی","verlor":"از دست داد","verschieben":"عقب انداختن","verschweigen":"پنهان کردن / ناگفته گذاشتن","versprach":"قول داد","vorbereitungstreffen":"نشست آماده‌سازی","vorhin":"کمی پیش","völlig":"کاملاً","weise":"شیوه","widersprach":"مخالفت کرد","wirken":"به نظر رسیدن / اثر گذاشتن","wissenschaftlichen":"علمی","wollte":"می‌خواست / می‌خواستند","wollten":"می‌خواست / می‌خواستند","zusagen":"قول‌ها / تعهدها","übrigens":"راستی / ضمناً"}},{"id":"l14","order":14,"level":"C1","minutes":30,"title":"نوشتن استدلالی در سطح C1","titleDe":"C1 Schreiben: Differenziert argumentieren","blocks":[{"type":"dialog","lines":[{"de":"Ich habe meinen Text über aufgezeichnete Vorlesungen fertig.","fa":"متنم دربارهٔ ضبط درس‌گفتارها آماده شده."},{"de":"Welche These vertrittst du darin?","fa":"در آن از چه ادعای اصلی دفاع می‌کنی؟"},{"de":"Ich bin für Aufzeichnungen, allerdings nicht für eine Pflicht ohne Ausnahmen.","fa":"طرفدار ضبط کلاس‌ها هستم، البته نه الزام بی‌استثنا."},{"de":"Worauf stützt du diese Position?","fa":"این موضع را بر چه چیزی استوار می‌کنی؟"},{"de":"Vor allem auf die zeitliche Flexibilität für berufstätige Studierende.","fa":"بیش از همه بر انعطاف زمانی برای دانشجویان شاغل."},{"de":"Das klingt plausibel, aber welche Gegenargumente berücksichtigst du?","fa":"قابل‌قبول است؛ اما چه دلایل مخالفی را در نظر می‌گیری؟"},{"de":"In Seminaren könnten vertrauliche Beiträge weniger offen werden.","fa":"در سمینارها ممکن است مشارکت‌های محرمانه کمتر صریح شوند."},{"de":"Gut. Kannst du diesen Einwand mit einer Bedingung beantworten?","fa":"خوب است. می‌توانی با طرح شرطی به این ایراد پاسخ بدهی؟"},{"de":"Ja: Aufzeichnungen wären sinnvoll, sofern der Datenschutz gewährleistet ist.","fa":"بله: ضبط مفید است، به شرط آنکه حفاظت از داده‌ها تضمین شده باشد."},{"de":"Und behauptest du, Videos verbesserten immer den Lernerfolg?","fa":"و آیا ادعا می‌کنی ویدئوها همیشه یادگیری را بهتر می‌کنند؟"},{"de":"Nein. Daraus folgt nicht zwangsläufig ein höherer Lernerfolg.","fa":"نه. از این لزوماً یادگیری بیشتر نتیجه نمی‌شود."},{"de":"Dann braucht dein Schluss keine neue Behauptung.","fa":"پس نتیجه‌گیری‌ات نباید ادعای تازه‌ای داشته باشد."},{"de":"Stimmt. Ich fasse die abgewogenen Argumente zusammen.","fa":"درست است. استدلال‌های سنجیده‌شده را جمع‌بندی می‌کنم."},{"de":"Genau. Und prüfe am Ende die Aufgabenstellung und die Wortzahl.","fa":"دقیقاً. و در پایان صورت‌سؤال و تعداد واژه را بررسی کن."}]},{"type":"vocab","items":[{"de":"Angesichts der Tatsache, dass …","fa":"با توجه به این واقعیت که ...","note":"برای بیان زمینه؛ فعل بند dass در پایان می‌آید. فقط چیزی را Tatsache بنام که واقعاً بتوانی از آن دفاع کنی."},{"de":"Für diese Position spricht, dass …","fa":"آنچه از این موضع پشتیبانی می‌کند این است که ...","note":"برای معرفی دلیل؛ پس از آن سازوکار یا مثال بیاور."},{"de":"Zwar …, jedoch …","fa":"درست است که ...، بااین‌حال ...","note":"برای پذیرفتن بخشی از اعتراض و سپس محدودکردن آن؛ هر دو بند اصلی ترتیب فعلِ جایگاه دوم دارند."},{"de":"Dem lässt sich entgegenhalten, dass …","fa":"در برابر این می‌توان استدلال کرد که ...","note":"برای طرح پاسخ یا اعتراض؛ dem باید مرجع روشن داشته باشد."},{"de":"Dies setzt allerdings voraus, dass …","fa":"البته این مستلزم آن است که ...","note":"برای بیان شرط لازم و جلوگیری از ادعای مطلق."},{"de":"Daraus folgt nicht zwangsläufig, dass …","fa":"از این الزاماً نتیجه نمی‌شود که ...","note":"برای محدودکردن نتیجه‌گیری بیش از حد."},{"de":"Unter der Voraussetzung, dass …","fa":"به شرط آنکه ...","note":"اگر بند وابسته اول بیاید، فعل بند اصلی بلافاصله پس از آن می‌آید."},{"de":"Insgesamt überwiegen …","fa":"در مجموع، ... بیشتر می‌چربند","note":"برای جمع‌بندیِ سنجش؛ باید روشن باشد چه مزایا یا معایبی را مقایسه کرده‌ای."},{"de":"die These","fa":"مدعای اصلی","note":"eine These aufstellen und begründen."},{"de":"das Argument","fa":"استدلال","note":"ein Argument anführen / entkräften."},{"de":"das Gegenargument","fa":"استدلال مخالف","note":"ein Gegenargument fair berücksichtigen."},{"de":"die Abwägung","fa":"سنجش دو سوی مسئله","note":"Vor- und Nachteile abwägen."},{"de":"der Einwand","fa":"ایراد / اعتراض","note":"einen Einwand berücksichtigen."},{"de":"entkräften","fa":"ردِ مستدل کردن","note":"ein Argument entkräften."},{"de":"belegen","fa":"با شاهد پشتیبانی کردن","note":"eine Behauptung belegen."},{"de":"die Schlussfolgerung","fa":"نتیجه‌گیری","note":"eine Schlussfolgerung ziehen."},{"de":"der Zusammenhang","fa":"ارتباط / پیوند","note":"einen Zusammenhang erläutern."},{"de":"die Voraussetzung","fa":"پیش‌شرط","note":"etwas setzt voraus, dass ..."},{"de":"sofern","fa":"به شرط آنکه","note":"جملهٔ وابسته؛ فعل در پایان."},{"de":"wenngleich","fa":"هرچند","note":"رسمی؛ فعل در پایان بند وابسته."},{"de":"gleichwohl","fa":"بااین‌حال","note":"رسمی؛ در جملهٔ مستقل با جایگاه دوم فعل."},{"de":"folgerichtig","fa":"به‌طور منطقی","note":"نتیجه باید از دلایل پیروی کند."},{"de":"nicht zwangsläufig","fa":"نه لزوماً","note":"برای محدود کردن ادعای قطعی."},{"de":"differenziert","fa":"با درنظرگرفتن تفاوت‌ها","note":"eine differenzierte Betrachtung."},{"de":"die Kohärenz","fa":"انسجام منطقی","note":"Kohärenz zwischen Absätzen."},{"de":"der Beleg","fa":"شاهد / مدرک","note":"بدون منبع، آمار قطعی نساز."},{"de":"der Absatz","fa":"پاراگراف","note":"هر بند یک نقش استدلالی."},{"de":"die Überleitung","fa":"عبارت انتقالی","note":"یک Übergang بین بندها."}]},{"type":"grammar","title":"ساختار مقاله: هر بند یک وظیفه","body":"در [[Einleitung]] مسئله و پرسش اصلی را مشخص کن؛ مقدمه نباید فقط جمله‌ای کلی مثل «این موضوع امروزه مهم است» باشد. در [[Hauptteil]] هر بند را با یک ادعا آغاز کن، دلیلش را توضیح بده و با مثال یا پیامد روشنش کن. سپس یک اعتراض جدی را مطرح و منصفانه بررسی کن. در [[Schluss]] به پرسش مقدمه پاسخ بده و موضعی متناسب با دلایل ارائه کن؛ استدلال کاملاً تازه وارد نکن. قالب امتحان‌ها یکسان نیست: تعداد واژه، نوع متن و نکات الزامیِ همان صورت‌سؤال اولویت دارند.\n\nنمونه‌های تحلیلی:\n• [[Umstritten ist, ob die Regelung sinnvoll ist.]] (اختلاف‌نظر هست که آیا این مقررات مناسب‌اند یا نه.)\n• [[Für diesen Vorschlag spricht seine Umsetzbarkeit.]] (قابلیت اجرا به نفع این پیشنهاد است.)\n• [[Gegen den Vorschlag spricht der hohe Aufwand.]] (هزینهٔ اجرایی بالا به ضرر این پیشنهاد است.)\n• [[Dies setzt voraus, dass alle zustimmen.]] (این مستلزم موافقت همه است.)\n• [[Daraus folgt nicht zwangsläufig, dass die Methode funktioniert.]] (از این الزاماً کارکرد روش نتیجه نمی‌شود.)\n• [[Ein Beispiel verdeutlicht diesen Zusammenhang.]] (یک مثال این پیوند را روشن می‌کند.)\n• [[Die These bedarf einer Begründung.]] (این ادعا به استدلال نیاز دارد.)"},{"type":"grammar","title":"کالبدشکافی متن نمونه","body":"بند اول با [[Dennoch ist umstritten, ob ...]] پرسش بحث را مشخص می‌کند و با [[unter welchen Bedingungen]] از پاسخ سادهٔ بله/خیر فراتر می‌رود. بند دوم ادعای [[zeitliche Flexibilität]] را با دو گروه مشخص، یعنی شاغلان و مراقبان خانواده، توضیح می‌دهد؛ پس ادعا بی‌پشتوانه رها نشده است. جملهٔ [[ersetzt jedoch nicht automatisch ...]] همان‌جا حدِ استدلال را روشن می‌کند. بند سوم با [[Zwar ... doch ...]] یک راه‌حل احتمالی را می‌پذیرد، سپس هزینه‌اش را نشان می‌دهد. بند چهارم پیشنهاد مشروط ارائه می‌کند؛ [[Dies setzt allerdings voraus, dass ...]] شرط اجرای آن را روشن می‌کند. نتیجه به پرسش آغازین پاسخ می‌دهد و هیچ آمار ساختگی وارد متن نمی‌کند.\n\nنمونه‌های تحلیلی:\n• [[Obwohl die Maßnahme Vorteile hat, ist sie umstritten.]] (اگرچه این اقدام مزایایی دارد، محل اختلاف است.)\n• [[Die Maßnahme hat Vorteile; dennoch gibt es Bedenken.]] (این اقدام مزایایی دارد؛ بااین‌حال نگرانی‌هایی هست.)\n• [[Zwar spart das Verfahren Zeit, jedoch kostet es Geld.]] (درست است که روش در زمان صرفه‌جویی می‌کند، اما هزینه دارد.)\n• [[Wenngleich die Daten begrenzt sind, lässt sich eine Tendenz erkennen.]] (هرچند داده‌ها محدودند، می‌توان گرایشی تشخیص داد.)\n• [[Diese Behauptung müsste erst belegt werden.]] (این ادعا ابتدا باید مستند شود.)\n• [[Insgesamt überwiegen die Vorteile unter bestimmten Bedingungen.]] (در کل، تحت شرایطی مشخص مزایا بیشترند.)\n• [[Ein Einwand verdient besondere Beachtung.]] (یک اعتراض شایستهٔ توجه ویژه است.)"},{"type":"grammar","title":"انسجام و دستور: پیچیدگیِ کنترل‌شده","body":"در [[Obwohl Aufzeichnungen hilfreich sind, ersetzen sie keine Übungen]] فعل بند وابسته در پایان است و فعل بند اصلی پس از ویرگول می‌آید. در [[Aufzeichnungen sind hilfreich; dennoch ersetzen sie keine Übungen]] واژهٔ [[dennoch]] جایگاه اولِ بند اصلی را گرفته و فعل پس از آن است. ضمیرهایی مانند [[dies]] و [[daraus]] باید به گزاره‌ای روشن ارجاع دهند. از ادعاهای مطلق مثل [[Videos verbessern immer den Lernerfolg]] پرهیز کن؛ [[können]]، [[unter bestimmten Bedingungen]] و [[nicht zwangsläufig]] دقت استدلال را بالا می‌برند. ساختار پیچیده زمانی ارزش دارد که رابطهٔ علت، شرط یا تقابل را روشن‌تر کند.\n\nنمونه‌های تحلیلی:\n• [[Erstens sollte die Aufgabenstellung genau gelesen werden.]] (ابتدا باید صورت‌سؤال دقیق خوانده شود.)\n• [[Darüber hinaus ist der Bezug zwischen den Absätzen wichtig.]] (علاوه بر آن، ارتباط بین بندها مهم است.)\n• [[Die Verfügbarkeit allein beweist noch keinen Lernerfolg.]] (دردسترس‌بودنِ صرف هنوز موفقیت یادگیری را ثابت نمی‌کند.)\n• [[Ein Gegenargument sollte fair dargestellt werden.]] (دلیل مخالف باید منصفانه ارائه شود.)\n• [[Der Schluss greift die Ausgangsfrage wieder auf.]] (نتیجه دوباره به پرسش آغازین بازمی‌گردد.)\n• [[Die Aussage lässt sich vorsichtiger formulieren.]] (می‌توان ادعا را محتاطانه‌تر بیان کرد.)\n• [[Diese Formulierung verweist auf den vorherigen Absatz.]] (این عبارت به پاراگراف پیشین ارجاع دارد.)"},{"type":"grammar","title":"نکته‌ی امتحانی: بازبینی بر اساس خطاهای پُرهزینه","body":"ابتدا بررسی کن همهٔ خواسته‌های صورت‌سؤال پوشش داده شده و موضعت روشن است. سپس ببین هر بند دلیل یا مثالی دارد و نتیجه واقعاً از متن برمی‌آید. در بازبینی زبانی، جای فعل، تطابق فاعل و فعل، حالت پس از حرف اضافه و ارجاع ضمیر را بررسی کن. میان [[einerseits ... andererseits]] برای سنجش دو سوی مسئله و [[zwar ... aber]] برای پذیرش همراه با محدودیت فرق بگذار. برای اثبات یک ادعا، نام پژوهش یا درصدی را که نمی‌دانی نساز؛ مثال فرضیِ روشن بهتر از شاهد جعلی است.\n\nنمونه‌های تحلیلی:\n• [[Vor der Abgabe überprüfe ich die Wortzahl.]] (پیش از تحویل، تعداد کلمات را بررسی می‌کنم.)\n• [[Ich kontrolliere die Stellung der Verben.]] (جایگاه فعل‌ها را کنترل می‌کنم.)\n• [[Jeder Absatz braucht einen nachvollziehbaren Gedanken.]] (هر بند به فکری قابل‌پیگیری نیاز دارد.)\n• [[Ohne Belege sollte ich keine Statistik erfinden.]] (بدون منبع نباید آماری جعل کنم.)\n• [[Eine präzise These erleichtert die Gliederung.]] (ادعای اصلی دقیق ساختاربندی را آسان می‌کند.)\n• [[Wiederholungen können den Text unnötig verlängern.]] (تکرارها ممکن است متن را بی‌دلیل طولانی کنند.)\n• [[Die Schlussfolgerung muss zur Argumentation passen.]] (نتیجه‌گیری باید با استدلال سازگار باشد.)"},{"type":"tip","body":"در C1 واژهٔ پیچیده بدون استدلال ارزش چندانی ندارد. ادعای روشن + دلیل + نمونه + محدودیت، از زنجیره‌ای از رابط‌های حفظی قوی‌تر است."},{"type":"tip","body":"[[dennoch]]، [[allerdings]] و [[gleichwohl]] قیدند؛ برخلاف [[obwohl]] و [[wenngleich]]، جای فعل صرف‌شده را در بند وابسته به آخر نمی‌برند."},{"type":"tip","body":"در صورت‌سؤال واقعیِ آزمون، تعداد کلمات و قالب خواسته‌شده بر مثال آموزشی ارجح است. هیچ عدد، پژوهش یا نقل‌قول ساختگی را شاهد واقعی معرفی نکن."},{"type":"mistakes","items":[{"wrong":"Obwohl die Videos sind nützlich, ersetzen sie keine Übungen.","right":"Obwohl die Videos nützlich sind, ersetzen sie keine Übungen.","fa":"بعد از obwohl فعل صرف‌شده در پایان بند وابسته می‌آید."},{"wrong":"Die Videos sind hilfreich, jedoch sie ersetzen keine Übungen.","right":"Die Videos sind hilfreich; jedoch ersetzen sie keine Übungen.","fa":"اگر jedoch در جایگاه اول بند مستقل بیاید، فعل صرف‌شده بلافاصله پس از آن می‌آید."},{"wrong":"Meiner Meinung nach alle Vorlesungen sollten aufgenommen werden.","right":"Meiner Meinung nach sollten alle Vorlesungen aufgenommen werden.","fa":"عبارت آغازین جایگاه اول جمله است؛ فعل صرف‌شده در جایگاه دوم می‌آید."}]},{"type":"text","de":"Sollten Hochschulen alle Vorlesungen aufzeichnen?\n\nDigitale Aufzeichnungen können den Zugang zur Hochschullehre erleichtern. Dennoch ist umstritten, ob sämtliche Vorlesungen grundsätzlich aufgezeichnet werden sollten. Entscheidend ist dabei nicht allein die technische Machbarkeit, sondern auch die Frage, unter welchen Bedingungen Aufzeichnungen das Lernen tatsächlich unterstützen.\n\nFür ein breites Angebot spricht zunächst die zeitliche Flexibilität. Wer neben dem Studium arbeitet oder Angehörige betreut, kann versäumte Inhalte nachholen. Auch Studierende, die in einer Fremdsprache lernen, profitieren davon, schwierige Passagen mehrfach anzuhören. Eine Aufzeichnung ermöglicht somit eine individuellere Nachbereitung, ersetzt jedoch nicht automatisch die aktive Auseinandersetzung mit dem Stoff.\n\nGegen eine uneingeschränkte Aufzeichnungspflicht lässt sich einwenden, dass nicht jede Lehrveranstaltung dafür geeignet ist. Werden persönliche Erfahrungen oder sensible Fallbeispiele besprochen, kann die Aufnahme die Offenheit der Beteiligten beeinträchtigen. Zwar ließen sich einzelne Beiträge aus der Aufnahme entfernen, doch wäre damit zusätzlicher Aufwand verbunden. Zudem darf aus der bloßen Verfügbarkeit eines Videos nicht auf einen höheren Lernerfolg geschlossen werden.\n\nEine tragfähige Lösung wäre daher, Vorlesungen mit überwiegend vermittelndem Charakter aufzuzeichnen und für interaktive Formate begründete Ausnahmen vorzusehen. Dies setzt allerdings voraus, dass der Zugang klar geregelt ist und Lehrende angemessen unterstützt werden. Ergänzende Aufgaben könnten dazu beitragen, dass die Videos nicht nur passiv konsumiert werden.\n\nInsgesamt überwiegen die Vorteile eines gezielten Angebots gegenüber denen einer pauschalen Pflicht. Hochschulen sollten Aufzeichnungen deshalb als ergänzendes Lernangebot ausbauen, ohne die unterschiedlichen Anforderungen ihrer Lehrveranstaltungen aus dem Blick zu verlieren.","fa":"آیا دانشگاه‌ها باید همهٔ درس‌گفتارها را ضبط کنند؟\n\nفایل‌های ضبط‌شدهٔ دیجیتال می‌توانند دسترسی به آموزش دانشگاهی را آسان‌تر کنند. بااین‌حال، دربارهٔ اینکه آیا اصولاً باید همهٔ درس‌گفتارها ضبط شوند اختلاف‌نظر وجود دارد. مسئله فقط امکان فنی نیست؛ این هم مهم است که ضبط کلاس تحت چه شرایطی واقعاً از یادگیری پشتیبانی می‌کند.\n\nنخستین دلیل به نفع ارائهٔ گستردهٔ این امکان، انعطاف زمانی است. کسی که در کنار تحصیل کار می‌کند یا از اعضای خانواده مراقبت می‌کند، می‌تواند مطالب ازدست‌رفته را جبران کند. دانشجویانی که به زبانی غیربومی درس می‌خوانند نیز از چندبار گوش‌دادن به بخش‌های دشوار سود می‌برند. بنابراین، ضبط کلاس مرور متناسب با نیاز فرد را ممکن می‌کند، اما خودبه‌خود جای درگیری فعال با مطالب را نمی‌گیرد.\n\nدر برابر الزام بی‌استثنا به ضبط می‌توان گفت که هر کلاس برای این کار مناسب نیست. وقتی تجربه‌های شخصی یا نمونه‌های حساس مطرح می‌شوند، ضبط ممکن است صراحت شرکت‌کنندگان را کاهش دهد. درست است که می‌توان برخی گفته‌ها را از فایل حذف کرد، اما این کار زحمت بیشتری دارد. افزون بر این، صرفِ در دسترس بودن ویدئو اجازه نمی‌دهد یادگیری بیشتر را نتیجه بگیریم.\n\nبنابراین، راه‌حلی عملی این است که درس‌گفتارهایی با ماهیت عمدتاً انتقال مطالب ضبط شوند و برای قالب‌های تعاملی استثناهای موجه در نظر گرفته شود. البته این کار مستلزم قواعد روشن دسترسی و حمایت مناسب از مدرسان است. تمرین‌های تکمیلی می‌توانند کمک کنند ویدئوها صرفاً به‌شکلی منفعلانه مصرف نشوند.\n\nدر مجموع، مزایای ارائهٔ هدفمند این امکان از مزایای الزام همگانی بیشتر است. بنابراین، دانشگاه‌ها باید ضبط کلاس را به‌عنوان امکان یادگیری تکمیلی گسترش دهند، بدون اینکه نیازهای متفاوت کلاس‌هایشان را نادیده بگیرند."}],"exercises":[{"type":"mc","q":"کدام جمله برای مقدمهٔ یک متن استدلالی دقیق‌تر است؟","options":["Seit Beginn der Menschheit gibt es überall sehr viele wichtige Themen.","Umstritten ist, ob Hochschulen sämtliche Vorlesungen aufzeichnen sollten.","Ich werde jetzt eine Einleitung, einen Hauptteil und einen Schluss schreiben."],"answer":1,"why":"گزینهٔ دوم مسئلهٔ مشخص و قابل بحث را معرفی می‌کند؛ دو گزینهٔ دیگر کلی یا صرفاً توضیح قالب هستند."},{"type":"blank","text":"Zwar erleichtern Videos die Wiederholung, ___ ersetzen sie keine aktive Mitarbeit. (Verwenden Sie: jedoch)","answer":"jedoch"},{"type":"type","q":"با Obwohl یک جمله بساز: Aufzeichnungen sind hilfreich. Sie ersetzen keine Übungen.","answer":"Obwohl Aufzeichnungen hilfreich sind, ersetzen sie keine Übungen.","accept":["Obwohl Aufzeichnungen hilfreich sind, ersetzen sie keine Übungen"]},{"type":"mc","q":"کدام نتیجه‌گیری با متن نمونه سازگارتر است؟","options":["Jede Lehrveranstaltung muss ausnahmslos aufgezeichnet werden.","Aufzeichnungen sollten grundsätzlich abgeschafft werden.","Ein gezieltes Angebot mit begründeten Ausnahmen ist einer pauschalen Pflicht vorzuziehen."],"answer":2,"why":"متن از ضبط هدفمند همراه با استثناهای موجه دفاع می‌کند؛ نه الزام بی‌استثنا و نه حذف کامل."},{"type":"type","q":"با حفظ جمله، قید «الزاماً» را اضافه کن تا ادعا دقیق‌تر شود: Die Verfügbarkeit eines Videos führt nicht zu einem höheren Lernerfolg.","answer":"Die Verfügbarkeit eines Videos führt nicht zwangsläufig zu einem höheren Lernerfolg.","accept":["Die Verfügbarkeit eines Videos führt nicht zwangsläufig zu einem höheren Lernerfolg","Die Verfügbarkeit eines Videos führt nicht notwendigerweise zu einem höheren Lernerfolg.","Die Verfügbarkeit eines Videos führt nicht unbedingt zu einem höheren Lernerfolg."]},{"type":"mc","q":"کدام جمله اعتراض را منصفانه به استدلال متصل می‌کند؟","options":["Es gibt kein Gegenargument.","Zwar erhöhen Aufzeichnungen die Flexibilität, jedoch entstehen Datenschutzfragen.","Aufzeichnungen sind immer perfekt."],"answer":1,"why":"ساختار [[zwar ... jedoch]] یک مزیت را می‌پذیرد و محدودیت را بیان می‌کند."},{"type":"blank","text":"Dies setzt voraus, ___ die Beteiligten zustimmen.","answer":"dass"},{"type":"type","q":"به آلمانی با «daraus folgt nicht zwangsläufig» بنویس: از این لزوماً نتیجه نمی‌شود که ویدئوها یادگیری را بهتر می‌کنند.","answer":"Daraus folgt nicht zwangsläufig, dass Videos den Lernerfolg verbessern.","accept":["Daraus folgt nicht zwangsläufig, dass Videos das Lernen verbessern."]},{"type":"mc","q":"کدام جمله ادعای محتاطانه و علمی‌تری است؟","options":["Videos verbessern immer den Lernerfolg.","Videos können unter bestimmten Bedingungen das Lernen unterstützen.","Jeder Student lernt mit Videos schneller."],"answer":1,"why":"ساختار [[können]] و قید شرط از تعمیم بی‌مدرک جلوگیری می‌کند."},{"type":"blank","text":"___ Aufzeichnungen nützlich sind, ersetzen sie keinen Austausch. (obwohl)","answer":"Obwohl"},{"type":"type","q":"جمله را با «sofern» بساز: Der Datenschutz ist gewährleistet. Aufzeichnungen sind sinnvoll.","answer":"Aufzeichnungen sind sinnvoll, sofern der Datenschutz gewährleistet ist.","accept":["Sofern der Datenschutz gewährleistet ist, sind Aufzeichnungen sinnvoll."]},{"type":"mc","q":"در پایان متن استدلالی چه کاری مناسب‌تر است؟","options":["مطرح‌کردن آمار جدید و بدون منبع","پاسخ به پرسش مقدمه بر پایهٔ دلایل بررسی‌شده","شروع‌کردن موضوعی کاملاً تازه"],"answer":1,"why":"نتیجه باید از دلایل اصلی متن حاصل شود، نه ادعای تازه."}],"glossary":{"aber":"اما","alle":"همه","allein":"تنها","allem":"همه چیز (صرف‌شده)","allerdings":"البته / بااین‌حال","als":"وقتی‌که / به‌عنوان","am":"درِ (an dem)","anforderungen":"الزامات / نیازمندی‌ها","angebot":"تخفیف / پیشنهاد ویژه","anzuhören":"گوش دادن (مصدر با zu)","arbeitet":"کار می‌کند","argument":"استدلال","auch":"هم","auf":"روی / به","aufgaben":"وظایف","aufgezeichnet":"ضبط‌شده","aufnahme":"فایل ضبط / ضبط‌کردن","aufzeichnung":"ضبط / ثبت","aufzeichnungen":"ضبط‌ها","aus":"از","automatisch":"به‌صورت خودکار","bedingung":"شرط","bedingungen":"شرایط","beeinträchtigen":"تضعیف کردن / تأثیر منفی گذاشتن","beteiligten":"افراد مشارکت‌کننده","bin":"هستم / فعل کمکی Perfekt با ich","braucht":"نیاز دارد","dabei":"همراه","dafür":"برای این / در عوض","daher":"بنابراین","damit":"با آن / تا اینکه","dann":"بعد","darf":"اجازه دارم / چه میل دارید؟","das":"آن / این / حرف تعریف خنثی","dass":"که","datenschutz":"حفاظت از داده‌ها","davon":"از آن","dazu":"به آن / علاوه بر آن","dein":"مال تو (مذکر/خنثی)
