function navigate(v){stopSpeech();view=v;render();window.scrollTo({top:0,behavior:'instant'});}
function nav(){const items=[['home','نمای کلی'],...DATA.chapters.map((c,i)=>[c.id,`${i+1}. ${c.name}`]),['exam','آزمون ترکیبی ۱۶سؤالی'],['report','کارنامه و خروجی']];return `<aside class="side"><div class="brand"><div class="logo">D</div><div><strong>TestDaF Extra</strong><small>FALLENKLINIK / PART 06</small></div></div><div class="nav-desk"><div class="side-label">مسیر تمرین</div>${items.map(([id,l])=>`<button type="button" class="navbtn ${view===id?'active':''}" data-action="nav" data-id="${id}">${E(l)}</button>`).join('')}</div><div class="side-foot">آفلاین · بدون کتابخانهٔ خارجی · متن و سؤال‌ها تألیفی · نتیجهٔ آموزشی نه TDN رسمی</div></aside><div class="nav-mobile"><select id="mobile-nav" aria-label="انتخاب فصل">${items.map(([id,l])=>`<option value="${id}" ${view===id?'selected':''}>${E(l)}</option>`).join('')}</select></div>`}
const gradeCh=c=>{let r=0;for(let i=0;i<4;i++)for(let j=0;j<2;j++){const q=c.cases[i].questions[j];if(state.answers[caseId(c,i,j)]===q.answer)r++}return r};
function headerHTML(){return `<div class="topbar"><span class="crumb">Digital TestDaF / Extra / <b>${E(view==='home'?'Fallenklinik':view==='exam'?'Prüfungssimulation':view==='report'?'Lernbericht':DATA.chapters[idx(view)]?.name||'')}</b></span><div class="actions"><button class="btn small" data-action="export">دریافت پاسخ‌ها (JSON)</button><button class="btn small" data-action="exportTxt">گزارش متنی</button></div></div>`}
function home(){let done=Object.keys(state.graded).length;return `<div class="hero"><div class="eyebrow">DIGITAL TESTDAF · EXTRA SERIES · PART 6</div><h1>کلینیک هشت دام معنایی</h1><p class="lead">Fallenklinik: یک مجموعهٔ تألیفی B2–C1 برای تشخیص جابه‌جایی کمیت، الزام، علت، شرط، زمان، گوینده، دامنهٔ پژوهش و پاسخِ ظاهراً درست اما بی‌ربط.</p></div><div class="stats"><div class="stat"><b>۸</b><span>فصل تشخیصی</span></div><div class="stat"><b>۶۴</b><span>سؤال فصل‌ها</span></div><div class="stat"><b>۱۶</b><span>آزمون پایانی</span></div><div class="stat"><b>۱۶</b><span>تمرین نوشتن و گفتار</span></div></div><div class="panel"><h2>چطور با این فایل کار کنی؟</h2><ol class="steps"><li>هر فصل را با درس کوتاه و <b>مثال حل‌شده</b> شروع کن.</li><li>چهار موقعیت تازه را حل کن؛ هر موقعیت دو سؤال دارد. در مورد صوتی، تا پایان پاسخ‌گویی رونوشت را نخوان.</li><li>پایین فصل روی «ثبت و نمایش پاسخ‌نامهٔ تشریحی» بزن تا <b>دلیل درست و غلط بودن هر گزینه</b> را ببینی.</li><li>تمرین نوشتن و گفتار همان فصل را انجام بده و بعد با نمونه‌پاسخ مقایسه کن.</li><li>پس از هشت فصل، آزمون ترکیبی زمان‌دار ۱۶سؤالی را انجام بده؛ در حالت آزمون <b>به سؤال قبلی برنمی‌گردی.</b></li></ol><div class="notice">برای شنیدن، از <b>صدای آلمانی نصب‌شده روی گوشی یا رایانه</b> استفاده می‌شود. هیچ فایل صوتی حجیمی وجود ندارد؛ کیفیت و امکان پخش به دستگاه بستگی دارد. این شبیه‌سازی، آزمون رسمی و روش محاسبهٔ TDN نیست.</div><div class="between"><span class="meta">فصل‌های تصحیح‌شده: ${done} از ۸</span><button class="btn primary" data-action="nav" data-id="${DATA.chapters.find(c=>!state.graded[c.id])?.id||'exam'}">${done===8?'شروع آزمون پایانی':'ادامهٔ تمرین فصل‌ها'}</button></div></div><h2>فصل‌ها</h2><div class="chapter-list">${DATA.chapters.map((c,i)=>`<article class="chapter-card"><span class="pill">FALLE ${i+1} · ${state.graded[c.id]?`${gradeCh(c)}/8`:'۸ سؤال'}</span><h3>${E(c.name)}</h3><p class="tagline">${E(c.subtitle)}</p><p class="muted mini">${E(c.meaning)} · چهار متن دانشگاهی · مثال حل‌شده · نوشتن و گفتار</p><button class="btn primary small" data-action="nav" data-id="${c.id}">${state.graded[c.id]?'مرور و تحلیل فصل':'حل تمرین فصل'}</button></article>`).join('')}</div><div class="panel"><h3>تطبیق با ساختار TestDaF دیجیتال</h3><p class="muted">این کلینیک آزمون کامل ۳۴سؤالی Lesen یا ۳۰سؤالی Hören نیست؛ برای <b>رفع خطاهای معناییِ مشترک در چهار مهارت</b> طراحی شده است. در آزمون دیجیتال رسمی، خواندن و شنیدن هرکدام هفت نوع تکلیف دارند و پس از عبور از یک تکلیف امکان بازگشت نیست. تمرین حاضر این ویژگی را فقط در آزمون پایانیِ خود شبیه‌سازی می‌کند.</p><p class="mini">منابع رسمی برای ساختار: <a target="_blank" rel="noopener noreferrer" href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/">TestDaF – Aufbau</a> و <a target="_blank" rel="noopener noreferrer" href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/vorbereitung-auf-den-digitalen-testdaf/">Übungsmaterialien</a>. لینک‌ها تنها برای رجوع اختیاری‌اند و فایل بدون اینترنت کار می‌کند.</p></div>`}
function voicePanel(uid,text,isHidden=false){return `<div class="voice-controls"><button class="btn small primary" data-action="speak" data-key="${uid}">▶ پخش آلمانی</button><button class="btn small" data-action="stopSpeech">■ توقف</button><label class="mini">سرعت: <select data-action="rate"><option value="0.85" ${state.voiceRate==0.85?'selected':''}>آرام 0.85×</option><option value="0.95" ${state.voiceRate==0.95?'selected':''}>0.95×</option><option value="1" ${state.voiceRate==1?'selected':''}>طبیعی 1×</option><option value="1.1" ${state.voiceRate==1.1?'selected':''}>1.1×</option></select></label>${isHidden?`<button class="btn small" data-action="toggleTranscript" data-key="${uid}">${state.seen[uid]?'پنهان‌کردن رونوشت':'نمایش رونوشت پس از تمرین'}</button>`:''}</div>`}
function passage(caseObj,uid,graded){return caseObj.mode==='listening'?`<div class="source ${(!state.seen[uid]&&!graded)?'hidden':''}"><div class="case-title">HÖREN · شبیه‌سازی با صدای دستگاه</div>${voicePanel(uid,caseObj.source,true)}${(state.seen[uid]||graded)?de(caseObj.source):`<p class="audio-placeholder">رونوشت پنهان است. ابتدا صوت را پخش کن و سپس به سؤال‌ها پاسخ بده. اگر صدای آلمانی دستگاه در دسترس نبود، دکمهٔ نمایش رونوشت را بزن.</p>`}</div>`:`<div class="source">${de(caseObj.source)}</div>`}
function questionHTML(q,id,number,locked=false){const selected=state.answers[id];return `<div class="question" id="q_${id}"><strong class="de prompt">${number}. ${E(q.text)}</strong><div class="options">${q.options.map((o,k)=>`<label class="option"><input type="radio" name="${id}" data-action="answer" data-id="${id}" value="${k}" ${selected===k?'checked':''} ${locked?'disabled':''} /><span><span class="letters">${'ABC'[k]}.</span> ${E(o)}</span></label>`).join('')}</div></div>`}
function keyHTML(q,chosen,num){return `<div class="keybox"><div class="between"><strong>سؤال ${num} · پاسخ درست: <span class="letters">${'ABC'[q.answer]}</span></strong><span class="mini" style="color:${chosen===q.answer?'#137852':'#aa5449'}">${chosen===undefined?'پاسخ نداده‌ای':chosen===q.answer?'درست':'نیازمند اصلاح'}</span></div><div class="de muted mini" style="margin:5px 0 10px">${E(q.text)}</div>${q.options.map((o,i)=>`<div class="reason ${i===q.answer?'right':'wrong'}"><div class="de mini"><b>${'ABC'[i]}.</b> ${E(o)}</div><div>${i===q.answer?'✓ ': '✕ '}${E(q.reasons[i])}</div></div>`).join('')}</div>`}
function workedExample(c){const q=c.worked;return `<div class="panel"><div class="tagline">BEISPIEL · مثال حل‌شده</div><p class="de prompt"><b>${E(q.text)}</b></p>${q.options.map((o,i)=>`<div class="reason ${i===q.answer?'right':'wrong'}"><div class="de"><b>${'ABC'[i]}.</b> ${E(o)}</div><div class="mini">${i===q.answer?'✓':'✕'} ${E(q.reasons[i])}</div></div>`).join('')}</div>`}
function production(c,kind){let uid=c.id+'_'+kind,p=c[kind],shown=state.samples[uid];let value=state.writing[uid]||'';return `<div class="panel"><div class="between"><h3>${kind==='writing'?'Schreiben — انتقال تحلیل به نوشتن':'Sprechen — انتقال تحلیل به گفتار'}</h3><span class="stage">${kind==='writing'?'تمرین تألیفی · ۹۰ تا ۱۴۰ واژه':'تمرین شفاهی · ۶۰ ثانیه'}</span></div><p class="de prompt">${E(p.prompt)}</p>${kind==='writing'?`<textarea class="textbox de" data-writing="${uid}" placeholder="Schreiben Sie Ihren Text hier ...">${E(value)}</textarea><div class="between"><span class="meta" id="wc_${uid}">${countWords(value)} Wörter</span><button class="btn small" data-action="clearWrite" data-id="${uid}">پاک‌کردن متن</button></div>`:`<div class="voice-controls"><button class="btn primary small" data-action="speakTimer">شروع زمان‌سنج ۶۰ ثانیه</button><span class="clock" id="speak-clock">01:00</span><button class="btn small" data-action="micStart">شروع ضبط در مرورگر سازگار</button><button class="btn small" data-action="micStop">توقف ضبط</button><button class="btn small" data-action="downloadRecording">دریافت ضبط</button></div><p class="meta">در فایل محلی، دسترسی به میکروفون ممکن است در بعضی مرورگرها بسته باشد. در این صورت از ضبط‌کنندهٔ خود گوشی استفاده کن؛ صدا به هیچ سروری ارسال نمی‌شود.</p>`}<div style="margin-top:12px"><button class="btn small" data-action="sample" data-id="${uid}">${shown?'پنهان‌کردن نمونه‌پاسخ':'نمایش نمونه‌پاسخ و نقد آموزشی'}</button></div>${shown?`<div class="sample" style="margin-top:12px"><div class="tagline">MUSTERANTWORT · نمونهٔ آموزشی</div>${de(p.sample)}${p.analysis?`<p><b>تحلیل فارسی:</b> ${E(p.analysis)}</p>`:''}<p class="muted mini">این نمونه پاسخ تنها یک راه حل ممکن است و ارزیابی رسمی TDN محسوب نمی‌شود.</p></div>`:''}</div>`}
function chapterHTML(c){const graded=!!state.graded[c.id];return `<div class="between"><div><div class="eyebrow muted">FALLENKLINIK · KAPITEL ${idx(c.id)+1} VON 8</div><h1>${E(c.name)}</h1><p class="tagline">${E(c.meaning)} — ${E(c.subtitle)}</p></div><button class="btn" data-action="nav" data-id="${idx(c.id)<7?DATA.chapters[idx(c.id)+1].id:'exam'}">${idx(c.id)<7?'فصل بعد ←':'آزمون پایانی ←'}</button></div><div class="panel"><h2>درس کوتاه</h2><p>${E(c.lesson)}</p><h3>نشانگرهای مهم</h3><div class="signals">${c.signals.map(x=>`<span class="signal">${E(x)}</span>`).join('')}</div><div class="notice"><b>روش تصمیم‌گیری:</b> ${E(c.strategy)}</div><div class="notice warning"><b>دام رایج:</b> ${E(c.pitfall)}</div></div>${workedExample(c)}<h2>چهار موقعیت تازه · هشت سؤال</h2><div class="meta">سؤال‌ها بدون کلید پاسخ نشان داده می‌شوند؛ پاسخ‌نامهٔ تشریحی در پایین فصل است.</div>${c.cases.map((sc,i)=>`<div class="case"><div class="between"><span class="case-title">موقعیت ${i+1} از ۴ · ${E(sc.label)}</span><span class="stage">${sc.mode==='listening'?'Hören · صدای دستگاه':'Lesen'}</span></div>${passage(sc,c.id+'-audio-'+i,graded)}${sc.questions.map((q,j)=>questionHTML(q,caseId(c,i,j),i*2+j+1,graded)).join('')}</div>`).join('')}<div class="panel"><h2>تمرین‌های تولیدی</h2><p class="muted">این دو تمرین را پیش از دیدن نمونه‌پاسخ انجام بده. هدف، استفادهٔ دقیق از معنی و محدودیت ادعا در نوشتن و صحبت‌کردن است.</p></div>${production(c,'writing')}${production(c,'speaking')}<div class="panel" id="end-solutions"><div class="between"><h2>پاسخ‌نامهٔ تشریحی فصل</h2><span class="pill">۸ سؤال</span></div>${graded?`<p>امتیاز فعلی: <span class="score">${gradeCh(c)}/8</span></p><p class="muted">برای هر گزینه دلیل درست یا غلط بودن آن درج شده است. به‌ویژه خطاهای خودت را با قاعدهٔ فصل مقایسه کن.</p>${c.cases.flatMap((sc,i)=>sc.questions.map((q,j)=>keyHTML(q,state.answers[caseId(c,i,j)],i*2+j+1))).join('')}<div class="actions"><button class="btn" data-action="resetChapter" data-id="${c.id}">تمرین دوباره (حذف جواب‌های این فصل)</button><button class="btn primary" data-action="nav" data-id="${idx(c.id)<7?DATA.chapters[idx(c.id)+1].id:'exam'}">${idx(c.id)<7?'رفتن به فصل بعد':'رفتن به آزمون پایانی'}</button></div>`:`<p>تا پاسخ‌ها را ثبت نکنی، تحلیل گزینه‌ها مخفی می‌ماند. برای تکمیل تمرین می‌توانی سؤال‌های بی‌پاسخ را خالی بگذاری، اما امتیازی دریافت نمی‌کنند.</p><button class="btn primary" data-action="gradeChapter" data-id="${c.id}">ثبت و نمایش پاسخ‌نامهٔ تشریحی</button>`}</div>`}
function mixKey(){return DATA.mixed.map((q,i)=>keyHTML(q,state.mix.answers[i],i+1)).join('')}
function startExam(){state.mix={started:true,finished:false,index:0,answers:{},endAt:Date.now()+25*60*1000};save();render()}
function finishExam(){if(!state.mix.started)return;state.mix.finished=true;save();stopSpeech();render();}
function mixScore(){return DATA.mixed.reduce((n,q,i)=>n+(state.mix.answers[i]===q.answer),0)}
function examHTML(){const m=state.mix;if(!m.started)return `<div class="hero"><div class="eyebrow">FINAL CHECK · 16 ITEMS</div><h1>آزمون ترکیبی هشت دام</h1><p class="lead">۱۶ سؤال از موقعیت‌های جدید · ۲۵ دقیقه · حرکت رو به جلو بدون بازگشت · پاسخ‌نامه فقط پس از پایان</p></div><div class="panel"><h2>قبل از شروع</h2><p>این یک شبیه‌سازی <b>آموزشی</b> برای تصمیم‌گیری تحت محدودیت زمانی است، نه بخش کامل Lesen/Hören آزمون TestDaF. بعضی سؤال‌ها به‌صورت شنیدن ارائه می‌شوند و از صدای نصب‌شدهٔ دستگاه استفاده می‌کنند.</p><ol class="steps"><li>با زدن شروع، زمان ۲۵ دقیقه فعال می‌شود.</li><li>هر بار فقط یک سؤال را می‌بینی. پس از ثبت و عبور، به سؤال قبلی برنمی‌گردی.</li><li>اگر دکمهٔ صوت در دستگاه کار نکرد، می‌توانی رونوشت اضطراری را ببینی.</li><li>در پایان، نمرهٔ تمرینی و تحلیل تمام گزینه‌ها را دریافت می‌کنی.</li></ol><button class="btn primary" data-action="startExam">شروع آزمون ۲۵ دقیقه‌ای</button></div>`;
if(m.finished){return `<div class="hero"><div class="eyebrow">PRÜFUNG BEENDET</div><h1>نتیجهٔ آزمون ترکیبی</h1><p class="lead">درست‌ها: ${mixScore()} از ۱۶. این نسبت، معادل امتیاز رسمی یا TDN نیست.</p></div><div class="panel"><div class="between"><span class="score">${mixScore()}/16</span><div class="actions"><button class="btn" data-action="restartExam">آزمون مجدد و حذف پاسخ‌های قبلی</button><button class="btn primary" data-action="export">خروجی پاسخ‌ها</button></div></div><p>پاسخ‌های هر مورد را با تحلیلِ تک‌تک گزینه‌ها مرور کن. اگر در دو مورد از یک دام خطا داشتی، فصل مربوط را دوباره حل کن.</p></div><h2>پاسخ‌نامهٔ پایانی</h2>${DATA.mixed.map((q,i)=>`<div class="case"><span class="case-title">سؤال ${i+1} · ${E(DATA.chapters.find(c=>c.id===q.theme).name)}</span>${de(q.source)}${keyHTML(q,m.answers[i],i+1)}</div>`).join('')}`}
const i=m.index;const q=DATA.mixed[i];const aud=q.mode==='listening';const uid='mixed-'+i;return `<div class="between"><div><h1>آزمون ترکیبی</h1><p class="tagline">سؤال ${i+1} از ۱۶ · ${E(DATA.chapters.find(c=>c.id===q.theme).name)}</p></div><div class="clock" id="mix-clock">--:--</div></div><div class="exam-top"><div class="between"><span>پیشرفت: ${i+1}/16</span><span>بازگشت به سؤال قبلی غیرفعال است.</span></div><div class="progress"><div style="width:${(i/16*100)}%"></div></div></div><div class="case"><span class="case-title">${aud?'HÖREN / صدای آلمانی دستگاه':'LESEN / متن دانشگاهی'}</span>${aud?`<div class="source hidden">${voicePanel(uid,q.source,true)}${state.seen[uid]?de(q.source):`<p class="audio-placeholder">ابتدا صوت را بشنو. در صورت کارنکردن گفتارساز، نمایش رونوشت اضطراری در دسترس است.</p>`}</div>`:`<div class="source">${de(q.source)}</div>`}<div class="question"><strong class="de prompt">${i+1}. ${E(q.text)}</strong><div class="options">${q.options.map((o,k)=>`<label class="option"><input type="radio" data-action="mixAnswer" name="mix-${i}" value="${k}" ${m.answers[i]===k?'checked':''}><span><b>${'ABC'[k]}.</b> ${E(o)}</span></label>`).join('')}</div></div><div class="between"><span class="muted mini">${m.answers[i]===undefined?'هنوز پاسخی انتخاب نشده':'پاسخ ثبت‌شده است'}</span><button class="btn primary" data-action="examNext">${i===15?'پایان آزمون و دریافت پاسخ‌نامه':'ثبت و رفتن به سؤال بعد ←'}</button></div></div>`}
function reportHTML(){const completed=DATA.chapters.filter(c=>state.graded[c.id]);const correct=completed.reduce((s,c)=>s+gradeCh(c),0);const total=completed.length*8;return `<div class="hero"><h1>کارنامهٔ آموزشی و صادرات پاسخ‌ها</h1><p class="lead">این کارنامه فقط دقت پاسخ‌ها در تمرین‌های همین فایل را نشان می‌دهد؛ نه سطح واقعی TDN در TestDaF.</p></div><div class="stats"><div class="stat"><b>${completed.length}/8</b><span>فصل‌های تکمیل‌شده</span></div><div class="stat"><b>${correct}/${total||0}</b><span>پاسخ‌های درست فصل‌ها</span></div><div class="stat"><b>${state.mix.finished?mixScore()+'/16':'—'}</b><span>آزمون ترکیبی</span></div><div class="stat"><b>${Object.values(state.writing).filter(x=>String(x).trim()).length}/8</b><span>متن‌های نوشته‌شده</span></div></div><div class="panel"><h2>عملکرد در هشت دام</h2>${DATA.chapters.map(c=>`<div class="between" style="margin:13px 0 5px"><span>${E(c.meaning)}</span><strong>${state.graded[c.id]?gradeCh(c)+'/8':'انجام نشده'}</strong></div><div class="progress"><div style="width:${state.graded[c.id]?gradeCh(c)*12.5:0}%"></div></div>`).join('')}</div><div class="panel"><h2>خروجی برای تصحیح و تحلیل با ChatGPT</h2><p>فایل JSON پاسخ‌های انتخابی، نوشته‌های آلمانی و نتایج تمرینی را ذخیره می‌کند. آن را به همین گفتگو بفرست تا الگوی خطاها بررسی شود. تمرین شفاهی را اگر لازم است جداگانه با ضبط‌کنندهٔ گوشی بفرست.</p><div class="actions"><button class="btn primary" data-action="export">دریافت JSON</button><button class="btn" data-action="exportTxt">گزارش TXT</button><button class="btn danger" data-action="resetAll">پاک‌کردن تمام پیشرفت در این دستگاه</button></div></div><div class="panel"><h3>معیار آموزشی پیشنهادی</h3><p>اگر از ۸ سؤال یک دام، دست‌کم ۷ مورد را درست پاسخ دادی و توانستی اشتباه‌های سه گزینه را توضیح بدهی، می‌توانی سراغ دام بعدی بروی. این معیار صرفاً برای مرور شخصی است و نباید به TDN تبدیل شود.</p></div>`}
function render(){if(state.mix.started&&!state.mix.finished&&Date.now()>=state.mix.endAt){state.mix.finished=true;save()}const inner=view==='home'?home():view==='exam'?examHTML():view==='report'?reportHTML():chapterHTML(DATA.chapters[idx(view)]||DATA.chapters[0]);root.innerHTML=`<div class="shell">${nav()}<main class="main">${headerHTML()}${inner}<div class="footer">Digital TestDaF · Extra Part 6 · Fallenklinik · تألیف آموزشی مستقل · آفلاین · پاسخ‌های محلی در مرورگر · بدون ادعای نمرهٔ رسمی</div></main></div>`;refreshTimer()}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function speakText(text){if(!('speechSynthesis' in window)){toast('گفتارساز دستگاه در این مرورگر فعال نیست؛ از گزینهٔ رونوشت اضطراری استفاده کن.');return}stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=Number(state.voiceRate)||.95;u.pitch=1;const voices=speechSynthesis.getVoices().filter(x=>/^de/i.test(x.lang));if(voices.length)u.voice=voices[0];speechSynthesis.speak(u);toast(voices.length?'صدا با گویندهٔ آلمانی دستگاه پخش می‌شود.':'صدای آلمانی مشخصی یافت نشد؛ ممکن است از صدای پیش‌فرض استفاده شود.')}
function refreshTimer(){const el=document.getElementById('mix-clock');if(!el||!state.mix.started||state.mix.finished)return;const sec=Math.max(0,Math.ceil((state.mix.endAt-Date.now())/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0){state.mix.finished=true;save();render();toast('زمان آزمون به پایان رسید؛ پاسخ‌نامه باز شد.')}}
let stEnd=0;setInterval(()=>{refreshTimer();if(stEnd){const el=document.getElementById('speak-clock');const left=Math.max(0,Math.ceil((stEnd-Date.now())/1000));if(el)el.textContent='00:'+String(left).padStart(2,'0');if(!left){stEnd=0;toast('۶۰ ثانیه صحبت به پایان رسید.')}}},500);
const dl=(name,data,type)=>{let blob=new Blob([data],{type});let url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function exportData(txt=false){const report={title:'Digital TestDaF Extra Part 6',created:new Date().toISOString(),answers:state.answers,graded:state.graded,writing:state.writing,mixed:state.mix,chapterScores:Object.fromEntries(DATA.chapters.map(c=>[c.id,state.graded[c.id]?gradeCh(c):null])),notes:'نمره رسمی TestDaF نیست'};if(!txt){dl('Digital_TestDaF_Extra_Part6_Antworten.json',JSON.stringify(report,null,2),'application/json');return}const lines=['Digital TestDaF Extra – Part 6 / Antworten','',...DATA.chapters.map(c=>`${c.name}: ${state.graded[c.id]?gradeCh(c)+'/8':'nicht bewertet'}`),'','Mixed: '+(state.mix.finished?mixScore()+'/16':'nicht abgeschlossen'),'',...DATA.chapters.flatMap(c=>['== '+c.name+' ==',...c.cases.flatMap((s,i)=>s.questions.map((q,j)=>{const a=state.answers[caseId(c,i,j)];return `${i*2+j+1}. ${q.text}\nMeine Antwort: ${a===undefined?'—':q.options[a]}\nLösung: ${q.options[q.answer]}`})),`Schreiben:\n${state.writing[c.id+'_writing']||''}`])];dl('Digital_TestDaF_Extra_Part6_Bericht.txt',lines.join('\n'),'text/plain;charset=utf-8')}
async function micStart(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('مرورگر فایل محلی اجازهٔ ضبط مستقیم نمی‌دهد؛ از ضبط‌کنندهٔ گوشی استفاده کن.');return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micChunks=[];mic=new MediaRecorder(micStream);mic.ondataavailable=e=>{if(e.data.size)micChunks.push(e.data)};mic.onstop=()=>{recordedBlob=new Blob(micChunks,{type:mic.mimeType||'audio/webm'});recordedURL=URL.createObjectURL(recordedBlob);micStream.getTracks().forEach(t=>t.stop());toast('ضبط آماده است؛ دکمهٔ دریافت ضبط را بزن.');};mic.start();toast('ضبط آغاز شد.');}catch(e){toast('دسترسی میکروفون مجاز نیست؛ از ضبط‌کنندهٔ گوشی استفاده کن.')}}
function micStop(){if(mic&&mic.state==='recording'){mic.stop();toast('ضبط متوقف شد.')}else toast('ضبط فعالی وجود ندارد.')}
function micDownload(){if(!recordedBlob){toast('ابتدا پاسخ را ضبط و متوقف کن.');return}const url=recordedURL;const a=document.createElement('a');a.href=url;a.download='Digital_TestDaF_Part6_Sprechen.webm';document.body.append(a);a.click();a.remove()}
root.addEventListener('change',e=>{const x=e.target;if(x.id==='mobile-nav'){navigate(x.value);return}if(x.dataset.action==='answer'){state.answers[x.dataset.id]=Number(x.value);save()}if(x.dataset.action==='mixAnswer'){state.mix.answers[state.mix.index]=Number(x.value);save();render()}if(x.dataset.action==='rate'){state.voiceRate=Number(x.value);save()}});
root.addEventListener('input',e=>{const x=e.target;if(x.dataset.writing){state.writing[x.dataset.writing]=x.value;save();const wc=document.getElementById('wc_'+x.dataset.writing);if(wc)wc.textContent=countWords(x.value)+' Wörter'}});
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const ac=el.dataset.action,id=el.dataset.id;switch(ac){case'nav':navigate(id);break;case'gradeChapter':state.graded[id]=true;save();render();document.getElementById('end-solutions')?.scrollIntoView({behavior:'smooth'});break;case'resetChapter':if(confirm('جواب‌های هشت سؤال این فصل حذف شوند؟ متن نوشتاری حفظ می‌شود.')){let c=DATA.chapters.find(x=>x.id===id);c.cases.forEach((x,i)=>x.questions.forEach((y,j)=>delete state.answers[caseId(c,i,j)]));delete state.graded[id];save();render()}break;case'export':exportData(false);break;case'exportTxt':exportData(true);break;case'sample':state.samples[id]=!state.samples[id];save();render();break;case'clearWrite':if(confirm('متن نوشته‌شده حذف شود؟')){delete state.writing[id];save();render()}break;case'speakTimer':stEnd=Date.now()+60000;toast('زمان‌سنج گفتار آغاز شد.');break;case'micStart':micStart();break;case'micStop':micStop();break;case'downloadRecording':micDownload();break;case'speak':{const uid=el.dataset.key;let txt;if(uid.startsWith('mixed-'))txt=DATA.mixed[Number(uid.split('-')[1])].source;else{let parts=uid.split('-audio-');txt=DATA.chapters.find(c=>c.id===parts[0])?.cases[Number(parts[1])]?.source}if(txt)speakText(txt);break}case'stopSpeech':stopSpeech();break;case'toggleTranscript':state.seen[el.dataset.key]=!state.seen[el.dataset.key];save();render();break;case'startExam':startExam();break;case'examNext':if(state.mix.index===15){finishExam();break}stopSpeech();state.mix.index++;save();render();window.scrollTo({top:0,behavior:'instant'});break;case'restartExam':if(confirm('آزمون ترکیبی از نو شروع شود و پاسخ‌های قبلی آن پاک شوند؟'))startExam();break;case'resetAll':if(confirm('آیا تمام پاسخ‌ها و پیشرفت این فایل در همین مرورگر پاک شود؟')){try{localStorage.removeItem(STORE)}catch(e){}state=structuredClone(BASE);view='home';render()}break;default:break}});
render();
</script>
