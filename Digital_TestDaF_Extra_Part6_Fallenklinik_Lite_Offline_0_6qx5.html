*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.85}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}a{color:var(--accent)}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{background:var(--deep);color:#e6f2f1;position:sticky;top:0;height:100vh;overflow-y:auto;padding:25px 16px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:25px}.logo{width:45px;height:45px;border-radius:13px;background:linear-gradient(135deg,#84d4bf,#34aaa2);display:grid;place-items:center;color:#103946;font-size:22px;font-weight:bold}.brand strong{font-family:Arial,sans-serif;font-size:17px}.brand small{display:block;color:#bed8db;font-size:11px}.side-label{color:#a3c0c6;font-size:11px;margin:18px 8px 8px;letter-spacing:.7px}.navbtn{display:block;background:transparent;border:1px solid transparent;color:#d6e8e9;text-align:right;border-radius:10px;width:100%;padding:9px 11px;font-size:13px;margin:3px 0;line-height:1.7}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.14)}.side-foot{font-size:11px;color:#abc8cd;border-top:1px solid rgba(255,255,255,.14);margin-top:20px;padding-top:16px}.main{min-width:0;padding:25px clamp(14px,3vw,48px) 70px;max-width:1340px;width:100%;margin-inline:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:24px}.crumb{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border-radius:10px;padding:9px 13px;border:1px solid var(--border);background:white;color:var(--ink);font-size:13px;font-weight:bold;line-height:1.65}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--red);border-color:#e7c9c8}.btn.ghost{background:transparent}.btn.small{font-size:12px;padding:6px 10px}.btn:hover:not(:disabled){filter:brightness(.97)}.hero{border-radius:20px;padding:30px;background:linear-gradient(125deg,#13344a,#176762);color:#fff;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;left:-75px;top:-90px;width:280px;height:280px;border:2px solid rgba(255,255,255,.10);border-radius:50%;box-shadow:0 0 0 55px rgba(255,255,255,.03)}h1{font-size:clamp(25px,3vw,37px);line-height:1.5;margin:8px 0}h2{font-size:23px;line-height:1.55;margin:0 0 11px}h3{font-size:17px;line-height:1.55;margin:0 0 9px}.lead{max-width:850px;margin:7px 0;font-size:14px;color:inherit;opacity:.88}.eyebrow{font-size:12px;letter-spacing:1px;font-family:Arial,sans-serif;opacity:.75}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat,.panel,.chapter-card,.case,.question,.note{background:white;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:16px;text-align:center}.stat b{font:700 29px Arial,sans-serif;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{padding:21px;margin:15px 0}.chapter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.chapter-card{padding:18px}.chapter-card h3{margin:0 0 7px}.pill{display:inline-flex;padding:2px 9px;border-radius:999px;background:var(--pale);color:#146b67;font-size:11px;font-weight:bold;margin-bottom:9px}.meta{font-size:12px;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}.tagline{color:var(--accent);font-weight:bold;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.steps{margin:8px 0;padding:0 20px}.steps li{margin:6px 0}.signals{display:flex;gap:7px;flex-wrap:wrap}.signal{display:inline-block;background:#eef3f6;border:1px solid #dde6ea;padding:4px 9px;border-radius:7px;font-family:Arial,sans-serif;font-size:13px;direction:ltr}.notice{border-right:4px solid var(--accent);padding:12px 14px;background:#ebf6f2;border-radius:10px;margin:13px 0}.warning{border-right-color:#b37b32;background:#fff7e8}.de{direction:ltr;text-align:left;font-family:Arial,"Segoe UI",sans-serif;line-height:1.72;unicode-bidi:plaintext;font-size:15px}.de.prompt{font-size:16px;color:#122f40}.source{border:1px solid #d9e5e9;border-radius:12px;padding:16px;margin:10px 0 18px;background:#f8fafb}.source.hidden{background:#f2f6f6;text-align:center;color:var(--muted)}.case{padding:20px;margin:17px 0}.case-title{font-size:13px;font-weight:bold;color:var(--accent)}.question{padding:14px 15px;margin:12px 0;background:#fbfcfc;box-shadow:none}.question strong{display:block;margin-bottom:8px}.options{display:grid;gap:7px}.option{display:flex;align-items:flex-start;gap:10px;background:white;border:1px solid #d9e4e7;border-radius:10px;padding:9px 11px;cursor:pointer;direction:ltr;text-align:left;font-family:Arial,sans-serif;line-height:1.55;font-size:14px}.option:has(input:checked){border-color:var(--accent);background:#e9f6f3}.option input{accent-color:var(--accent);margin-top:4px;flex-shrink:0}.keybox{background:#f4f8f8;border:1px solid #dce5e5;padding:17px;border-radius:12px;margin:10px 0}.reason{padding:9px 12px;border-radius:9px;background:white;border:1px solid #e2e9ec;margin:6px 0;font-size:13px}.reason.right{border-right:3px solid #278b65}.reason.wrong{border-right:3px solid #be7a60}.letters{font-family:Arial,sans-serif;font-weight:bold;direction:ltr;display:inline-block}.split{border:0;border-top:1px solid var(--border);margin:20px 0}.textbox{width:100%;min-height:170px;resize:vertical;border-radius:11px;border:1px solid #d2e0e1;padding:13px;font-family:Arial,sans-serif;font-size:15px;line-height:1.7;background:#fff}.textbox:focus{outline:2px solid #84c9c2}.sample{background:#f4f8f7;padding:15px;border-radius:11px;border:1px solid #dceae5}.progress{height:9px;border-radius:6px;background:#e1e9e8;overflow:hidden}.progress>div{height:100%;background:#258f88;transition:width .3s}.score{font-size:26px;font-weight:bold;color:var(--accent);direction:ltr}.footer{font-size:11px;color:var(--muted);text-align:center;margin:45px 0 5px}.voice-controls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;align-items:center}.voice-controls select{border:1px solid var(--border);border-radius:8px;background:#fff;padding:6px;max-width:100%;font-size:12px}.exam-top{background:#f0f6f5;border:1px solid #d1e6e0;border-radius:13px;padding:14px;margin:15px 0}.clock{font:700 22px Arial,sans-serif;direction:ltr;color:var(--accent);letter-spacing:1px}.stage{display:inline-block;padding:3px 8px;background:#e7f1ef;border-radius:7px;color:#215c55;font-size:12px}.nav-mobile{display:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:5px 9px;background:white;border:1px solid var(--border);border-radius:8px;font-size:12px}.mini{font-size:12px}.empty{background:#fff8ef;border:1px solid #eddcc0;border-radius:8px;padding:12px}.audio-placeholder{font-size:13px;color:#45636b}.num{font-family:Arial,sans-serif;direction:ltr;display:inline-block}.toasts{position:fixed;bottom:19px;left:20px;background:#183a43;color:white;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:9;font-size:13px;max-width:min(360px,90vw)}
@media(max-width:920px){.shell{display:block}.side{height:auto;position:relative;padding:12px 15px}.side .nav-desk,.side-foot,.side-label{display:none}.brand{margin:0}.main{padding:16px 14px 50px}.nav-mobile{display:block;margin:0 0 14px}.nav-mobile select{width:100%;max-width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);background:white}.hero{padding:22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter-list,.two{grid-template-columns:1fr}}@media(max-width:430px){h2{font-size:19px}.hero h1{font-size:25px}.panel,.case{padding:14px}.option{font-size:13px}.stat b{font-size:24px}.topbar{align-items:start}.btn{padding:7px 10px}}

<script>
'use strict';
const DATA={"chapters":[{"id":"quant","name":"Quantoren","meaning":"کمیت‌سازها و دامنهٔ ادعا","subtitle":"Einige ≠ die meisten ≠ alle","lesson":"کمیت‌ساز (Quantor) دامنهٔ افراد، موارد یا دفعات را مشخص می‌کند. «viele» لزوماً «اکثریت» نیست و «fast alle» به معنای «همه» نیست. در داده‌های علمی باید میان تعداد مطلق، درصد، زیرگروه و کل جامعه تفاوت بگذاری.","signals":["alle / ausnahmslos","die meisten / mehr als die Hälfte","viele / zahlreiche","einige / mehrere","kaum / nur wenige","mindestens / höchstens"],"strategy":"کمیت‌ساز متن و گزینه را جدا خط بکش؛ بپرس کدام مجموعه یا زیرگروه توصیف شده است. برای «بیش از نصف»، متن باید واقعاً شواهدی دربارهٔ نسبت ارائه کند.","pitfall":"«اغلب» در گفتار روزمره گاهی مبهم است؛ در سؤال آزمون نباید از واژهٔ مبهم، ادعای مطلق استخراج کرد.","worked":{"text":"Welche Aussage folgt aus „Fast alle Teilnehmenden beendeten die Befragung“?","options":["Niemand brach die Befragung ab.","Nur ein kleiner Teil schloss die Befragung nicht ab.","Genau die Hälfte beendete die Befragung."],"answer":1,"reasons":["«fast alle» استثنا را ممکن می‌داند؛ «هیچ‌کس» بیش‌ازحد قطعی است.","«تقریباً همه» یعنی فقط بخش کوچکی ممکن است به پایان نرسیده باشند.","برای نصف‌بودن هیچ مبنایی در گزاره وجود ندارد."],"focus":""},"writing":{"prompt":"Formulieren Sie in 90–130 Wörtern vorsichtig, was folgende Angabe bedeutet: „Von 240 Befragten nutzten 168 das Angebot mindestens einmal; 52 nutzten es wöchentlich.“ Vermeiden Sie unzulässige Verallgemeinerungen.","sample":"Von den 240 befragten Personen haben 168 das Angebot mindestens einmal genutzt. Das entspricht 70 Prozent der Stichprobe. Eine wöchentliche Nutzung wurde dagegen nur von 52 Personen angegeben. Aus diesen Zahlen lässt sich nicht ableiten, dass 70 Prozent aller Studierenden das Angebot nutzen. Außerdem sagt die Angabe „mindestens einmal“ nichts darüber aus, ob die Nutzung regelmäßig erfolgt. Um die allgemeine Reichweite zu beurteilen, wären Informationen zur Auswahl der Befragten notwendig.  Die Zahl der wöchentlichen Nutzerinnen und Nutzer liegt deutlich unter der Zahl der Personen, die das Angebot überhaupt ausprobiert haben. Gerade dieser Unterschied ist für die Planung entscheidend: Ein einmaliger Kontakt mit dem Angebot sagt wenig über dessen langfristige Bedeutung aus. Auch ist unbekannt, ob alle 240 Personen die Frage gleich verstanden.","analysis":"میان حداقل یک‌بار استفاده، استفادهٔ هفتگی و تعمیم به کل جامعه تمایز بگذار. «mindestens einmal» تکرار منظم را اثبات نمی‌کند."},"speaking":{"prompt":"Sie stellen im Seminar eine Umfrage vor. Von 100 Befragten befürworten 57 eine Maßnahme, 31 lehnen sie ab und 12 sind unentschlossen. Fassen Sie die Verteilung in 45–60 Sekunden präzise zusammen.","sample":"Die Umfrage zeigt, dass 57 von 100 Befragten die Maßnahme unterstützen. Damit gibt es in dieser Stichprobe eine knappe Mehrheit dafür. 31 Personen lehnen sie ab, während zwölf noch keine eindeutige Position haben. Die Ergebnisse beschreiben zunächst nur die befragte Gruppe. Ohne Informationen zur Stichprobenauswahl sollte man sie nicht auf alle Studierenden übertragen.  Außerdem ist zu berücksichtigen, dass die drei Gruppen die Frage unterschiedlich beantworten: Eine knappe Mehrheit spricht sich für die Maßnahme aus, fast ein Drittel lehnt sie ab und ein kleinerer Teil hat noch keine Entscheidung getroffen. Daraus folgt nicht, dass die Maßnahme in der gesamten Bevölkerung genauso bewertet wird. Die Umfrage zeigt zunächst eine Verteilung innerhalb der befragten Personen."},"cases":[{"source":"In einer Untersuchung an drei Hochschulen wurden 480 Studierende befragt. 276 gaben an, gelegentlich die digitale Bibliothek zu nutzen. Nur 84 berichteten von einer täglichen Nutzung.","questions":[{"text":"Welche Aussage wird durch den Text gestützt?","options":["Alle Befragten nutzten die digitale Bibliothek.","Mehr als die Hälfte gab eine gelegentliche Nutzung an.","Die meisten nutzten die Bibliothek täglich."],"answer":1,"reasons":["204 Personen gaben dies nicht an; «alle» ist falsch.","276 von 480 liegen über der Hälfte von 240.","84 von 480 sind eine Minderheit, keine Mehrheit."],"focus":""},{"text":"Welche Aussage ist NICHT belegt?","options":["Die Zahl der täglich Nutzenden war geringer als die der gelegentlich Nutzenden.","Ein Teil der Befragten gab tägliche Nutzung an.","Die Mehrheit aller Studierenden Deutschlands nutzt die Bibliothek gelegentlich."],"answer":2,"reasons":["84 ist kleiner als 276.","84 Personen wurden genannt.","Die Stichprobe an drei Hochschulen erlaubt keine unbedingte Aussage über alle Studierenden Deutschlands."],"focus":""}],"mode":"reading","label":"Digitale Bibliothek"},{"source":"Bei einer Befragung unter wissenschaftlichen Mitarbeitenden berichteten mehrere Personen von Schwierigkeiten bei der Datenarchivierung. Der Bericht nennt weder die genaue Zahl dieser Personen noch den Anteil an allen Befragten.","questions":[{"text":"Was lässt sich sicher sagen?","options":["Mehr als die Hälfte hatte Probleme.","Mindestens zwei Personen berichteten von Schwierigkeiten.","Niemand konnte Daten archivieren."],"answer":1,"reasons":["«mehrere» begründet keine Mehrheit.","«mehrere» steht für mehr als eine Person, also mindestens zwei.","Aus berichteten Schwierigkeiten folgt kein vollständiges Unvermögen aller."],"focus":""},{"text":"Welche Information fehlt für eine Mehrheitsaussage?","options":["Die Gesamtzahl der Befragten und die genaue Zahl der Betroffenen.","Der Wochentag, an dem der Bericht veröffentlicht wurde.","Die Postanschrift des Forschungsinstituts."],"answer":0,"reasons":["Mit Zähler und Nenner lässt sich der Anteil prüfen.","Der Wochentag sagt nichts über den Anteil aus.","Die Postanschrift sagt nichts über den Anteil aus."],"focus":""}],"mode":"listening","label":"Datenarchivierung"},{"source":"Von 120 angemeldeten Personen erschienen 118 zum Workshop. Die Organisatoren sprachen anschließend von einer außergewöhnlich hohen Beteiligung. Zwei Personen blieben fern.","questions":[{"text":"Welche Formulierung ist exakt?","options":["Alle Angemeldeten nahmen teil.","Fast alle Angemeldeten nahmen teil.","Höchstens die Hälfte nahm teil."],"answer":1,"reasons":["Zwei Personen fehlten; deshalb nicht alle.","118 von 120 entspricht fast allen.","118 ist deutlich mehr als die Hälfte."],"focus":""},{"text":"Was ist durch den Text ausdrücklich ausgeschlossen?","options":["Es gab zwei Abwesende.","Die Teilnahmequote war hoch.","Jede angemeldete Person war anwesend."],"answer":2,"reasons":["Zwei Abwesende stehen direkt im Text.","118 von 120 stützt eine hohe Quote.","Zwei Personen fehlten, also kann nicht jede anwesend gewesen sein."],"focus":""}],"mode":"reading","label":"Workshop"},{"source":"Eine Hochschule vergibt höchstens 30 Plätze pro Semester für ein Austauschprogramm. Im vergangenen Semester erhielten genau 27 Studierende einen Platz; es lagen 64 Bewerbungen vor.","questions":[{"text":"Was bedeutet die Obergrenze?","options":["Es müssen in jedem Semester genau 30 Plätze vergeben werden.","Mehr als 30 Plätze dürfen pro Semester nicht vergeben werden.","Mindestens 30 Plätze müssen vergeben werden."],"answer":1,"reasons":["«höchstens» bezeichnet eine Obergrenze, kein Pflichtminimum.","Eine Vergabe über 30 widerspricht der Regel.","Das wäre «mindestens», nicht «höchstens»."],"focus":""},{"text":"Welche Aussage ist nach den Zahlen zutreffend?","options":["Alle Bewerbenden wurden aufgenommen.","Es wurden weniger Plätze als die Höchstzahl vergeben.","Es gab weniger Bewerbungen als Plätze."],"answer":1,"reasons":["27 von 64 sind nicht alle.","27 liegt unter der Obergrenze 30.","64 Bewerbungen sind mehr als 27 Plätze."],"focus":""}],"mode":"reading","label":"Austauschprogramm"}]},{"id":"modal","name":"Modalverben","meaning":"افعال وجهی و شدت الزام","subtitle":"muss nicht ≠ darf nicht","lesson":"افعال وجهی (Modalverben) ممکن‌بودن، اجازه، توصیه یا الزام را تغییر می‌دهند. شکل منفی «muss nicht» به معنای «لازم نیست» است؛ «darf nicht» به معنای «مجاز نیست». همچنین «könnte» را نباید به نتیجهٔ قطعی تبدیل کرد.","signals":["muss / verpflichtend","sollte / empfohlen","darf / ist berechtigt","darf nicht / verboten","muss nicht / freiwillig","kann / könnte / möglicherweise"],"strategy":"از خود بپرس: آیا متن الزام می‌سازد، فقط اجازه می‌دهد، پیشنهاد می‌کند یا امکان را مطرح می‌کند؟ سپس نفی فعل وجهی را دقیق بررسی کن.","pitfall":"«Nicht müssen» نبود الزام است، نه الزام به انجام‌ندادن؛ «nicht dürfen» ممنوعیت است.","worked":{"text":"Was bedeutet „Die Teilnahme ist nicht verpflichtend“?","options":["Man darf nicht teilnehmen.","Man kann freiwillig teilnehmen.","Alle müssen teilnehmen."],"answer":1,"reasons":["غیرالزامی‌بودن به معنی ممنوعیت نیست.","شرکت اختیاری است؛ نه اجبار و نه ممنوعیت.","متن دقیقاً الزام را نفی کرده است."],"focus":""},"writing":{"prompt":"Die Fakultät empfiehlt die Teilnahme an einem Schreibkurs, verlangt sie aber nicht. Verfassen Sie eine sachliche Mitteilung (80–110 Wörter), die Empfehlung, Freiwilligkeit und mögliche Vorteile unterscheidet.","sample":"Die Fakultät empfiehlt allen Erstsemestern die Teilnahme an einem wissenschaftlichen Schreibkurs. Die Veranstaltung ist jedoch freiwillig; eine Teilnahme ist keine Voraussetzung für die Prüfungszulassung. Im Kurs können Studierende lernen, Fachtexte klarer zu strukturieren und Quellen korrekt zu verwenden. Wer bereits über entsprechende Kenntnisse verfügt, muss den Kurs nicht besuchen. Interessierte sollten sich wegen der begrenzten Plätze frühzeitig anmelden.  Eine Teilnahme kann dennoch hilfreich sein, insbesondere wenn Unsicherheit beim Verfassen längerer Hausarbeiten besteht. Aus der Empfehlung lässt sich aber weder eine Prüfungsverpflichtung noch ein Verbot für Personen ohne Vorkenntnisse ableiten. Die Universität sollte die Regel entsprechend klar kommunizieren, damit es nicht zu Missverständnissen bei der Anmeldung kommt.","analysis":"توصیه و شرط امتحان را یکی نکن: «empfiehlt» با «verlangt» تفاوت بنیادی دارد."},"speaking":{"prompt":"Erklären Sie in 60 Sekunden den Unterschied zwischen „Studierende dürfen das Labor nutzen“, „Studierende müssen das Labor nutzen“ und „Studierende dürfen das Labor nicht nutzen“.","sample":"Die drei Aussagen unterscheiden sich erheblich. „Dürfen“ beschreibt eine Erlaubnis; man kann das Labor benutzen, ist dazu aber nicht verpflichtet. „Müssen“ bedeutet, dass die Nutzung vorgeschrieben ist. „Dürfen nicht“ dagegen beschreibt ein Verbot. Gerade bei Sicherheitsregeln wäre es problematisch, diese Formulierungen zu verwechseln.  Für die Organisation des Studienalltags ist diese Unterscheidung wichtig. Wenn eine Veranstaltung nur erlaubt ist, dürfen Studierende selbst entscheiden, ob sie das Angebot nutzen möchten. Bei einer Pflicht müssen sie hingegen eine Vorgabe erfüllen. Bei einem Verbot muss die Nutzung unterbleiben. Gerade bei offiziellen Mitteilungen sollte man deshalb auf das genaue Modalverb achten."},"cases":[{"source":"Die Universitätsbibliothek kann in Ausnahmefällen zusätzliche Arbeitsplätze bereitstellen. Für Gruppenräume muss vorab eine Reservierung erfolgen. Einzeltische dürfen dagegen ohne Buchung genutzt werden.","questions":[{"text":"Welche Aussage entspricht der Regel?","options":["Gruppenräume sind ohne Reservierung zugänglich.","Für Einzeltische ist keine Reservierung notwendig.","Zusätzliche Arbeitsplätze werden grundsätzlich immer bereitgestellt."],"answer":1,"reasons":["Für Gruppenräume besteht eine Reservierungspflicht.","«ohne Buchung» bedeutet, dass keine Reservierung notwendig ist.","«kann in Ausnahmefällen» ist weder immer noch verpflichtend."],"focus":""},{"text":"Welche Aussage über Zusatzplätze ist angemessen?","options":["Ihre Bereitstellung ist unter bestimmten Umständen möglich.","Die Hochschule muss sie allen Nutzenden anbieten.","Sie dürfen niemals eingerichtet werden."],"answer":0,"reasons":["«kann in Ausnahmefällen» drückt Möglichkeit aus.","Eine Pflicht ergibt sich nicht aus «kann».","Das Gegenteil der genannten Möglichkeit ist nicht korrekt."],"focus":""}],"mode":"reading","label":"Bibliotheksregeln"},{"source":"Für das neue Praktikum sollten Teilnehmende Grundkenntnisse in Statistik mitbringen. Ein formaler Nachweis wird jedoch nicht verlangt. Ein freiwilliger Vorbereitungskurs steht online zur Verfügung.","questions":[{"text":"Was ist formal erforderlich?","options":["Ein verpflichtendes Statistikzertifikat.","Der Besuch des Onlinekurses.","Kein formaler Nachweis der Vorkenntnisse."],"answer":2,"reasons":["Der Nachweis wird ausdrücklich nicht verlangt.","Der Vorbereitungskurs ist freiwillig.","Dies ist die direkte Aussage des Textes."],"focus":""},{"text":"Welche Bedeutung hat „sollten“ hier?","options":["Es handelt sich um eine Empfehlung.","Es liegt ein ausdrückliches Verbot vor.","Die Teilnehmenden müssen eine Prüfung ablegen."],"answer":0,"reasons":["«sollten» kennzeichnet hier eine Empfehlung.","Ein Verbot wird nicht genannt.","Eine Prüfung wird nicht verlangt."],"focus":""}],"mode":"listening","label":"Praktikum"},{"source":"Eine neue Software könnte die Auswertung von Laborprotokollen beschleunigen. Bevor sie regulär eingesetzt werden darf, muss allerdings eine Datenschutzprüfung erfolgreich abgeschlossen werden.","questions":[{"text":"Welche Schlussfolgerung ist zulässig?","options":["Die Software beschleunigt nachweislich jede Auswertung.","Ein Zeitgewinn wird als Möglichkeit beschrieben.","Der Datenschutz wurde bereits geprüft."],"answer":1,"reasons":["«könnte» drückt eine Möglichkeit aus, keine Gewissheit.","Der Text behauptet eine mögliche Beschleunigung.","Die Prüfung steht noch vor dem regulären Einsatz."],"focus":""},{"text":"Unter welcher Voraussetzung ist regulärer Einsatz erlaubt?","options":["Nach einer erfolgreichen Datenschutzprüfung.","Sobald die Software installiert wurde, unabhängig von Prüfungen.","Nur wenn sämtliche Mitarbeitenden freiwillig zustimmen; sonst nie."],"answer":0,"reasons":["Die Prüfung wird als notwendige Bedingung genannt.","Installation allein reicht nicht.","Eine solche Zustimmungspflicht steht nicht im Text."],"focus":""}],"mode":"reading","label":"Laborsoftware"},{"source":"Während der Prüfungsphase dürfen Lernräume bis 23 Uhr genutzt werden. Nach 22 Uhr muss jedoch auf laute Gruppengespräche verzichtet werden. Studierende müssen nicht an betreuten Lerngruppen teilnehmen.","questions":[{"text":"Was ist nach 22 Uhr verboten?","options":["Jede Form des Lernens.","Laute Gruppengespräche.","Die Nutzung aller Lernräume."],"answer":1,"reasons":["Lernen bleibt bis 23 Uhr erlaubt.","Der Text verlangt ausdrücklich, auf laute Gespräche zu verzichten.","Die Räume können weiter genutzt werden."],"focus":""},{"text":"Was folgt aus der Regel über Lerngruppen?","options":["Betreute Lerngruppen sind freiwillig.","Die Teilnahme ist gesetzlich verboten.","Alle müssen teilnehmen."],"answer":0,"reasons":["«müssen nicht» bedeutet fehlende Verpflichtung.","Ein Verbot wird nicht ausgesprochen.","Der Text verneint eine Teilnahmeverpflichtung."],"focus":""}],"mode":"reading","label":"Lernräume"}]},{"id":"causal","name":"Korrelation und Kausalität","meaning":"همبستگی و علیت","subtitle":"Zusammenhang ≠ Ursache","lesson":"همبستگی (Korrelation) به معنای همراه‌بودن تغییرات دو متغیر است، اما علیت (Kausalität) نیاز به شواهد بیشتر دارد. ممکن است متغیر سوم، سوگیری نمونه یا جهت معکوس رابطه وجود داشته باشد. همچنین «nach einer Maßnahme» به تنهایی مساوی «wegen einer Maßnahme» نیست.","signals":["hängt zusammen mit","korreliert mit","geht einher mit","verursacht","führt zu","lässt sich zurückführen auf"],"strategy":"فعل پژوهش را علامت بزن. اگر فقط «Zusammenhang / korrelieren» آمده، جواب نباید به شکل «bewiesen verursacht» بازنویسی شود.","pitfall":"اگر پژوهش آزمایشی کنترل‌شده یا شواهد علّی مشخص ارائه نکرده، رابطه را با واژه‌های محتاطانه بازگو کن.","worked":{"text":"Was ist aus „A und B korrelieren miteinander“ ableitbar?","options":["A verursacht nachweislich B.","A und B treten in der beobachteten Stichprobe gemeinsam auf.","B ist die einzige mögliche Ursache von A."],"answer":1,"reasons":["Eine Korrelation beweist keine Ursache.","Genau das beschreibt eine beobachtete statistische Beziehung.","Eindeutige Kausalität wird nicht berichtet."],"focus":""},"writing":{"prompt":"Eine Beobachtungsstudie zeigt: Studierende, die regelmäßig Sport treiben, berichten häufiger über guten Schlaf. Schreiben Sie 110–140 Wörter, ohne eine unzulässige Kausalbehauptung aufzustellen.","sample":"In der Beobachtungsstudie wird ein Zusammenhang zwischen regelmäßiger sportlicher Aktivität und selbst berichtetem gutem Schlaf festgestellt. Die Ergebnisse zeigen jedoch nicht, dass Sport allein die Schlafqualität verbessert. Denkbar ist beispielsweise, dass Personen mit einem insgesamt gesundheitsbewussteren Lebensstil sowohl häufiger Sport treiben als auch bessere Schlafgewohnheiten entwickeln. Außerdem beruhen die Angaben zum Schlaf auf Selbstauskünften. Für belastbare Aussagen über Ursache und Wirkung wären weitere Untersuchungen erforderlich.  Es wäre auch denkbar, dass Menschen, die gut schlafen, tagsüber mehr Energie für Bewegung haben. Damit könnte die Richtung der beobachteten Beziehung teilweise umgekehrt sein. Die Studie liefert deshalb einen interessanten Hinweis für weitere Forschung, aber keine eindeutige Handlungsanweisung oder einen Beweis für eine einzelne Ursache.","analysis":"نمونهٔ خوداظهاری و متغیر سوم را توضیح بده؛ «bewirkt» را بدون دلیل نیاور."},"speaking":{"prompt":"Ein Kommilitone behauptet: „In Städten mit mehr Fahrradwegen gibt es mehr Radfahrer, also beweisen die Wege, dass Menschen zum Radfahren gezwungen werden.“ Korrigieren Sie die Schlussfolgerung in 60–75 Sekunden.","sample":"Die Beobachtung eines Zusammenhangs beweist weder einen Zwang noch eine eindeutige Ursache. Möglich wäre, dass bessere Radwege das Radfahren attraktiver machen. Denkbar ist aber auch, dass Städte gerade dort neue Radwege bauen, wo bereits viele Menschen Rad fahren. Für eine zuverlässige Erklärung müsste man weitere Daten und die zeitliche Entwicklung untersuchen.  Der Zusammenhang allein verrät auch nicht, ob beide Entwicklungen von weiteren Faktoren beeinflusst werden. Denkbar sind etwa eine veränderte Verkehrspolitik oder neue Gewohnheiten der Bevölkerung. Um die Aussage zu prüfen, könnte man verschiedene Städte über längere Zeit vergleichen. Erst dann ließe sich besser einschätzen, welche Rolle das Angebot an Radwegen tatsächlich spielt."},"cases":[{"source":"In einem Bericht wurden 18 Seminare untersucht. Seminare mit kleineren Gruppen erzielten im Durchschnitt höhere Zufriedenheitswerte. Die Autorinnen weisen ausdrücklich darauf hin, dass auch die Erfahrung der Lehrenden eine Rolle gespielt haben könnte.","questions":[{"text":"Welche Aussage passt zum Forschungsbericht?","options":["Kleine Gruppen haben nachweislich allein die Zufriedenheit verursacht.","Zwischen Gruppengröße und Zufriedenheit wurde ein Zusammenhang beobachtet.","Die Erfahrung der Lehrenden spielte sicher keine Rolle."],"answer":1,"reasons":["Eine Alleinursache ist nicht belegt.","Dies gibt den beobachteten Zusammenhang korrekt wieder.","Die Autorinnen erwähnen gerade eine mögliche Rolle der Erfahrung."],"focus":""},{"text":"Welcher zusätzliche Faktor wird genannt?","options":["Die Erfahrung der Lehrenden.","Die Länge des Semestertickets.","Die Zahl der Bibliotheken."],"answer":0,"reasons":["Der Text nennt diesen möglichen Einfluss ausdrücklich.","Im Berichtsauszug nicht erwähnt.","Im Berichtsauszug nicht erwähnt."],"focus":""}],"mode":"reading","label":"Seminarqualität"},{"source":"An einer Hochschule sank der Stromverbrauch im Jahr nach einer Informationskampagne um acht Prozent. Im selben Zeitraum wurden mehrere alte Heizungsanlagen erneuert. Die Verwaltung kann daher den Rückgang nicht ausschließlich der Kampagne zuschreiben.","questions":[{"text":"Welche Aussage ist gerechtfertigt?","options":["Die Kampagne war zweifelsfrei die einzige Ursache.","Der Verbrauch ging zurück, aber die Ursache ist nicht eindeutig.","Der Verbrauch stieg um acht Prozent."],"answer":1,"reasons":["Die gleichzeitig erneuerten Anlagen sind ein möglicher Einfluss.","Rückgang ist belegt, exklusive Kausalität nicht.","Der Text nennt einen Rückgang."],"focus":""},{"text":"Warum ist die Ursache unklar?","options":["Weil der Messwert vollständig fehlt.","Weil im gleichen Zeitraum weitere Maßnahmen umgesetzt wurden.","Weil Strom grundsätzlich nicht messbar ist."],"answer":1,"reasons":["Der Rückgang von acht Prozent wurde gemessen.","Heizungsanlagen wurden ebenfalls verändert.","Stromverbrauch lässt sich messen; der Text tut es."],"focus":""}],"mode":"listening","label":"Energieverbrauch"},{"source":"Eine Umfrage ergab, dass Studierende mit häufiger Nutzung digitaler Karteikarten bessere Testergebnisse erzielten. Die Untersuchung erfasste weder den vorherigen Leistungsstand noch die tägliche Lernzeit.","questions":[{"text":"Welche Interpretation überschreitet die Daten?","options":["Es besteht in der Stichprobe ein Zusammenhang.","Die Karteikarten verursachten eindeutig die besseren Leistungen.","Andere Lerngewohnheiten könnten mitwirken."],"answer":1,"reasons":["Genau diese Beobachtung wurde berichtet.","Ohne Kontrolle relevanter Faktoren ist Kausalität nicht nachgewiesen.","Vorerfahrung und Lernzeit wurden nicht erfasst."],"focus":""},{"text":"Welche Information würde die Interpretation stärken?","options":["Daten zum Vorwissen und zur Lernzeit.","Die Lieblingsfarbe der Befragten.","Die Reihenfolge der Nachnamen."],"answer":0,"reasons":["Damit könnten wichtige alternative Erklärungen geprüft werden.","Kein plausibler Bezug zur Leistungsdifferenz.","Kein plausibler Bezug zur Leistungsdifferenz."],"focus":""}],"mode":"reading","label":"Digitale Karteikarten"},{"source":"Ein Versuch teilte 200 Freiwillige per Zufall einer Interventions- und einer Kontrollgruppe zu. Die Interventionsgruppe erhielt ein zusätzliches Training; anschließend erzielte sie im Mittel bessere Werte. Der Bericht betont dennoch, dass die Übertragbarkeit auf andere Altersgruppen nicht geprüft wurde.","questions":[{"text":"Welche Besonderheit stärkt die kausale Interpretation?","options":["Die zufällige Zuteilung zu zwei Gruppen.","Die ausschließliche Beobachtung ohne Vergleich.","Die fehlende Prüfung anderer Altersgruppen."],"answer":0,"reasons":["Randomisierte Zuteilung verringert systematische Gruppenunterschiede.","Es wurde gerade eine Kontrollgruppe genutzt.","Das betrifft externe Übertragbarkeit, nicht den Gruppenvergleich selbst."],"focus":""},{"text":"Welche Grenze bleibt bestehen?","options":["Die Befunde sind ohne Weiteres auf jede Altersgruppe übertragbar.","Die Untersuchung beweist, dass Training immer wirkt.","Die Übertragbarkeit auf andere Altersgruppen bleibt offen."],"answer":2,"reasons":["Der Bericht nennt die fehlende Übertragbarkeitsprüfung.","«immer» überschreitet die Aussage des Gruppenmittelwerts.","Genau diese Einschränkung wird ausdrücklich beschrieben."],"focus":""}],"mode":"reading","label":"Randomisierter Versuch"}]},{"id":"condition","name":"Bedingungen","meaning":"حذف یا تغییر شرط","subtitle":"nur wenn ≠ wenn","lesson":"شرط (Bedingung) می‌تواند لازم یا کافی باشد. «nur wenn P» یعنی P شرط لازم است، نه اینکه P به تنهایی نتیجه را تضمین کند. «wenn P, dann Q» می‌گوید تحقق P برای Q کفایت می‌کند، اما بدون P ممکن است مسیر دیگری هم برای Q وجود داشته باشد.","signals":["nur wenn","sofern","vorausgesetzt, dass","unter der Bedingung","falls","erst nach","es sei denn"],"strategy":"شرط را به شکل پیکان یادداشت کن: «Zugang nur wenn Anmeldung» یعنی دسترسی ⇒ ثبت‌نام. این لزوماً به معنای ثبت‌نام ⇒ دسترسی نیست.","pitfall":"«es sei denn» یک استثنا می‌سازد. دقت کن استثنا مربوط به کدام قاعده است.","worked":{"text":"Was folgt aus „Die Zulassung erfolgt nur, wenn alle Unterlagen vollständig sind“?","options":["Vollständige Unterlagen garantieren die Zulassung.","Ohne vollständige Unterlagen erfolgt keine Zulassung.","Eine Zulassung ist völlig unabhängig von Unterlagen."],"answer":1,"reasons":["«nur wenn» یک شرط لازم می‌دهد، نه کافی.","اگر پذیرش رخ دهد، مدارک باید کامل باشند.","متن دقیقاً وابستگی را بیان می‌کند."],"focus":""},"writing":{"prompt":"Erklären Sie in 100–130 Wörtern die Bedingungen dieser Regel: „Eine Förderung kann gewährt werden, wenn ein Antrag fristgerecht eingereicht wird. Voraussetzung ist außerdem eine fachliche Begutachtung; verfügbare Mittel sind begrenzt.“","sample":"Für eine Förderung ist zunächst ein fristgerecht eingereichter Antrag erforderlich. Darüber hinaus muss eine fachliche Begutachtung stattfinden. Selbst wenn beide Bedingungen erfüllt sind, ist die Förderung nicht automatisch gesichert, denn die verfügbaren Mittel sind begrenzt. Deshalb wäre es unzutreffend zu behaupten, dass jeder fristgerechte Antrag zu einer Bewilligung führt. Die Regel beschreibt mehrere Voraussetzungen und einen zusätzlichen Finanzierungsvorbehalt.  Zudem muss zwischen einer positiven fachlichen Bewertung und der tatsächlichen Bewilligung unterschieden werden. Ist das Budget bereits ausgeschöpft, könnte auch ein fachlich geeignetes Projekt keine Mittel erhalten. Wer einen Antrag vorbereitet, sollte deshalb alle genannten Bedingungen sorgfältig prüfen und nicht von einer automatischen Förderung ausgehen.","analysis":"یک شرط لازم را با تضمین نتیجه اشتباه نگیر. محدودیت بودجه را نیز لحاظ کن."},"speaking":{"prompt":"Ein Freund sagt: „Wenn ich die erforderlichen Unterlagen einreiche, bekomme ich auf jeden Fall den Studienplatz.“ Erklären Sie in 60 Sekunden, warum diese Schlussfolgerung möglicherweise falsch ist.","sample":"Vollständige Unterlagen können eine notwendige Voraussetzung sein, ohne einen Studienplatz zu garantieren. Zusätzlich könnten zum Beispiel Zulassungskriterien, Kapazitätsgrenzen oder Auswahlverfahren gelten. Du solltest deshalb zwischen der formalen Prüfung deiner Bewerbung und der eigentlichen Zulassungsentscheidung unterscheiden.  Gerade bei Studienplätzen kann es sein, dass mehr formal geeignete Bewerbungen vorliegen als Plätze verfügbar sind. Dann muss die Hochschule weitere Auswahlentscheidungen treffen. Man sollte also erst nach einer offiziellen Zulassungsmitteilung von einem sicheren Studienplatz sprechen. Die vollständige Bewerbung ist wichtig, aber sie ist nicht identisch mit einer endgültigen Zusage."},"cases":[{"source":"Die Teilnahme am Laborpraktikum ist nur möglich, wenn die Sicherheitsunterweisung abgeschlossen wurde. Darüber hinaus müssen die Studierenden einen freien Platz erhalten; die Plätze werden nach Anmeldedatum vergeben.","questions":[{"text":"Welche Aussage ist sicher richtig?","options":["Die Sicherheitsunterweisung allein garantiert einen Platz.","Ohne abgeschlossene Unterweisung ist die Teilnahme nicht möglich.","Alle Angemeldeten dürfen automatisch teilnehmen."],"answer":1,"reasons":["Ein freier Platz ist zusätzlich notwendig.","Der Text nennt dies als notwendige Bedingung.","Die Plätze sind begrenzt und werden vergeben."],"focus":""},{"text":"Was ist neben der Unterweisung erforderlich?","options":["Ein verfügbarer Praktikumsplatz.","Ein Auslandssemester.","Die Mitgliedschaft in einem Sportverein."],"answer":0,"reasons":["Der Text nennt ausdrücklich den freien Platz.","Nicht erwähnt.","Nicht erwähnt."],"focus":""}],"mode":"reading","label":"Laborpraktikum"},{"source":"Wer das Leihfahrrad länger als zwei Stunden nutzen will, muss vorher eine Verlängerung beantragen. Eine Verlängerung wird jedoch nur gewährt, sofern ausreichend Fahrräder verfügbar bleiben.","questions":[{"text":"Welche Aussage ist zutreffend?","options":["Jeder Antrag auf Verlängerung wird bewilligt.","Eine bewilligte Verlängerung hängt von der Verfügbarkeit ab.","Ein Antrag ist bei mehr als zwei Stunden unnötig."],"answer":1,"reasons":["Ein Antrag garantiert nichts.","«sofern» setzt die Verfügbarkeit als Bedingung.","Der Antrag ist gerade vorgeschrieben."],"focus":""},{"text":"Welche Voraussetzung gilt für eine Nutzung von über zwei Stunden?","options":["Der vorherige Verlängerungsantrag.","Nur die Zustimmung der Eltern.","Ein abgeschlossener Sprachkurs."],"answer":0,"reasons":["Die Pflicht wird direkt genannt.","Nicht erwähnt.","Nicht erwähnt."],"focus":""}],"mode":"listening","label":"Leihfahrrad"},{"source":"Eine Hausarbeit wird anerkannt, wenn sie fristgerecht eingereicht wird und den formalen Anforderungen genügt. Die inhaltliche Bewertung erfolgt anschließend getrennt; eine gute Note ist damit nicht zugesichert.","questions":[{"text":"Was folgt aus einer fristgerechten, formal korrekten Abgabe?","options":["Eine gute Note ist garantiert.","Die Arbeit kann anerkannt werden; die Note wird separat beurteilt.","Es ist keine inhaltliche Bewertung mehr nötig."],"answer":1,"reasons":["Der Text verneint eine Notengarantie.","Formale Anerkennung und Inhalt werden getrennt behandelt.","Die inhaltliche Bewertung folgt danach."],"focus":""},{"text":"Welche Aussage beschreibt die Grenze der Regel?","options":["Formale Anerkennung und gute Bewertung sind nicht identisch.","Jede pünktliche Arbeit erhält eine Eins.","Alle verspäteten Arbeiten werden automatisch mit Eins benotet."],"answer":0,"reasons":["Die Trennung steht ausdrücklich im Text.","Eine Eins wird nicht zugesichert.","Widerspricht dem Sinn von Frist und Bewertung."],"focus":""}],"mode":"reading","label":"Hausarbeit"},{"source":"Die Hochschulbibliothek bleibt samstags geschlossen, es sei denn, während der Prüfungsphase wird ein Sonderbetrieb eingerichtet. Ob dies geschieht, entscheidet die Leitung jeweils zwei Wochen vorher.","questions":[{"text":"Welche Aussage ist gerechtfertigt?","options":["Die Bibliothek ist an allen Samstagen geöffnet.","Eine Öffnung am Samstag ist als Ausnahme möglich.","Die Bibliothek öffnet samstags automatisch in jeder Prüfungsphase."],"answer":1,"reasons":["Die Grundregel lautet geschlossen.","Die Ausnahme wird ausdrücklich genannt.","Sonderbetrieb muss eigens beschlossen werden."],"focus":""},{"text":"Wann wird über den Sonderbetrieb entschieden?","options":["Zwei Wochen vorher.","Erst nach Ende der Prüfungsphase.","Jeden Samstag um Mitternacht."],"answer":0,"reasons":["Der Entscheidungszeitpunkt steht im Text.","Das wäre zu spät und wird nicht gesagt.","Nicht erwähnt."],"focus":""}],"mode":"reading","label":"Bibliothek im Prüfungsbetrieb"}]},{"id":"timeline","name":"Zeitbezüge","meaning":"جابه‌جایی زمان و ترتیب رویداد","subtitle":"ursprünglich ≠ inzwischen ≠ künftig","lesson":"در گزارش‌های علمی و اطلاعیه‌های دانشگاهی، زمان برنامه‌ریزی‌شده، زمان واقعی، زمان اعلام نتیجه و چشم‌انداز آینده باید از هم جدا شوند. واژه‌های زمان‌نما (Zeitmarker) مانند ursprünglich، mittlerweile، inzwischen و erst ab در تعیین پاسخ مهم‌اند.","signals":["ursprünglich / zunächst","inzwischen / mittlerweile","bereits / erst","nachdem / bevor","voraussichtlich / spätestens","verschoben / verlängert"],"strategy":"خط زمانی سه‌ستونی درست کن: «قرار اولیه → تغییر → وضعیت کنونی». اگر سؤال دربارهٔ تاریخ قطعی است، «voraussichtlich» را با «definitiv» اشتباه نگیر.","pitfall":"گاهی دو زمان هر دو در متن درست‌اند، اما یکی زمان ثبت‌نام و دیگری زمان اجرای برنامه است.","worked":{"text":"Was bedeutet „Der ursprünglich für April geplante Workshop wurde auf Juni verschoben“?","options":["Der Workshop findet nach aktuellem Plan im Juni statt.","Der Workshop wurde bereits im April durchgeführt.","Im Juni begann nur die Anmeldung."],"answer":0,"reasons":["«auf Juni verschoben» به زمان جدید اشاره دارد.","برگزاری در آوریل با انتقال زمان ناسازگار است.","دربارهٔ ثبت‌نام چیزی گفته نشده است."],"focus":""},"writing":{"prompt":"Fassen Sie den zeitlichen Verlauf in 90–120 Wörtern zusammen: „Antrag im Januar; Prüfung im Februar; geplante Entscheidung im März; wegen fehlender Unterlagen auf April verschoben; tatsächlicher Bescheid am 18. April.“","sample":"Der Antrag wurde bereits im Januar gestellt und im Februar geprüft. Ursprünglich war vorgesehen, im März eine Entscheidung zu treffen. Da jedoch Unterlagen fehlten, musste der Entscheidungsprozess verschoben werden. Der Bescheid wurde schließlich am 18. April erteilt. Deshalb wäre es falsch, den März als tatsächlichen Entscheidungstermin zu nennen: In diesem Monat war die Entscheidung lediglich geplant.  Aus dem ursprünglichen Plan allein lässt sich somit kein tatsächlicher Verlauf ableiten. Für eine korrekte Zusammenfassung sind die Verben „geplant“, „verschoben“ und „erteilt“ entscheidend: Sie kennzeichnen unterschiedliche Stufen des Verfahrens. Eine Aussage wie „Der Antrag wurde im März bewilligt“ wäre daher sachlich falsch, selbst wenn der März zunächst als Zieltermin genannt worden war.","analysis":"«geplant» و «tatsächlich» را صریحاً از هم جدا کن؛ فقط تاریخ انتهایی را نقل نکن."},"speaking":{"prompt":"Erklären Sie in 60 Sekunden den Unterschied zwischen geplantem, angekündigtem und tatsächlichem Projektstart, wenn eine Renovierung von März auf Mai verschoben wurde.","sample":"Der geplante Projektstart war zunächst im März vorgesehen. Das bedeutet aber nicht, dass die Arbeiten tatsächlich im März begannen. Später wurde angekündigt, dass sich der Beginn auf Mai verschiebt. Ob die Renovierung tatsächlich im Mai begonnen hat, müsste man anhand einer weiteren Mitteilung prüfen. Plan, Ankündigung und Durchführung sind unterschiedliche Zeitpunkte.  Erst wenn eine Quelle die tatsächliche Durchführung bestätigt, kann man den neuen Termin als realisierten Beginn bezeichnen. Falls im Mai nur ein weiterer Plan veröffentlicht wurde, bleibt auch dieser Termin vorläufig. Bei einer Zusammenfassung sollte man deshalb darauf achten, ob eine Quelle von einer Absicht, einer Verschiebung, einer Ankündigung oder einem bereits erfolgten Ereignis spricht."},"cases":[{"source":"Der Fakultätsrat wollte die neue Prüfungsordnung ursprünglich zum Sommersemester 2027 einführen. Nach einer Anhörung beschloss er jedoch, die Einführung auf das Wintersemester 2027/28 zu verschieben. Bestehende Prüfungen bleiben bis dahin unverändert.","questions":[{"text":"Wann soll die neue Ordnung nach dem Beschluss gelten?","options":["Ab dem Sommersemester 2027.","Ab dem Wintersemester 2027/28.","Sie galt bereits im Jahr 2026."],"answer":1,"reasons":["Dies war nur der ursprüngliche Plan.","Der verschobene Termin ist ausdrücklich genannt.","Der Text beschreibt eine zukünftige Einführung."],"focus":""},{"text":"Was gilt bis zur Einführung?","options":["Die bisherigen Prüfungsregeln gelten weiter.","Alle Prüfungen werden abgesagt.","Die neuen Regeln gelten rückwirkend."],"answer":0,"reasons":["«bleiben bis dahin unverändert» bestätigt die bestehenden Regeln.","Von Absagen ist keine Rede.","Eine rückwirkende Geltung wird nicht erwähnt."],"focus":""}],"mode":"reading","label":"Prüfungsordnung"},{"source":"Das Forschungsprojekt startete im Februar. Die erste Auswertung war für Juni vorgesehen, wurde aber wegen unvollständiger Datensätze erst im August abgeschlossen. Eine Veröffentlichung soll voraussichtlich im November folgen.","questions":[{"text":"Wann wurde die erste Auswertung tatsächlich abgeschlossen?","options":["Im Februar.","Im Juni.","Im August."],"answer":2,"reasons":["Im Februar begann das Gesamtprojekt.","Juni war der geplante Termin.","August ist der tatsächliche Abschluss."],"focus":""},{"text":"Wie sicher ist der Veröffentlichungstermin?","options":["Er steht als endgültiger Termin fest.","Er wird nur voraussichtlich im November liegen.","Die Veröffentlichung fand schon im August statt."],"answer":1,"reasons":["«voraussichtlich» ist keine endgültige Garantie.","Genau diese Unsicherheit trägt die Formulierung.","August betrifft die Auswertung."],"focus":""}],"mode":"listening","label":"Forschungsprojekt"},{"source":"Die Bewerbungsfrist endet am 3. Juli. Die Auswahlgespräche werden ab dem 19. Juli geführt. Spätestens am 12. August sollen alle Bewerbenden informiert sein. Der Kurs beginnt am 1. September.","questions":[{"text":"Welche zeitliche Reihenfolge ist richtig?","options":["Kursbeginn – Interviews – Bewerbungsfrist.","Bewerbungsfrist – Auswahlgespräche – Rückmeldung – Kursbeginn.","Rückmeldung – Bewerbungsfrist – Interviews."],"answer":1,"reasons":["Umgekehrte Chronologie.","Diese Reihenfolge entspricht den vier genannten Daten.","Die Rückmeldung erfolgt nach den Gesprächen."],"focus":""},{"text":"Wofür steht der 12. August?","options":["Für den Kursbeginn.","Für den spätesten Zeitpunkt der Rückmeldung.","Für den Bewerbungsschluss."],"answer":1,"reasons":["Kursbeginn ist 1. September.","«spätestens» legt den äußersten Rückmeldungstermin fest.","Fristende ist 3. Juli."],"focus":""}],"mode":"reading","label":"Bewerbungsablauf"},{"source":"Eine neue Mensa-App wurde im Oktober getestet und nach einer technischen Überarbeitung im Januar für alle freigeschaltet. Seit März kann sie zusätzlich Allergene anzeigen. Die ursprünglich geplante Bezahlfunktion wurde dagegen noch nicht aktiviert.","questions":[{"text":"Welche Funktion wurde seit März ergänzt?","options":["Die Anzeige von Allergenen.","Die erste Testphase.","Eine bereits aktivierte Bezahlfunktion."],"answer":0,"reasons":["Diese Funktion steht seit März zur Verfügung.","Die Testphase lag im Oktober.","Die Bezahlfunktion ist noch nicht aktiviert."],"focus":""},{"text":"Welcher Schluss wäre falsch?","options":["Die App war vor Januar in einer Testphase.","Die App wurde im Januar allgemein freigeschaltet.","Die Bezahlfunktion ist inzwischen nutzbar."],"answer":2,"reasons":["Der Test begann im Oktober.","Die Freischaltung für alle erfolgte im Januar.","Der Text stellt klar, dass sie noch nicht aktiviert wurde."],"focus":""}],"mode":"reading","label":"Mensa-App"}]},{"id":"speaker","name":"Perspektiven und Sprecher","meaning":"جابجایی صاحب دیدگاه و نقل قول","subtitle":"wer sagt was?","lesson":"در متن‌های چندصدایی، یک جمله ممکن است نظر منتقد، نتیجهٔ پژوهش، ادعای یک عضو هیئت علمی یا تصمیم نهاد باشد. آزمون می‌تواند همان ادعا را به شخص دیگری نسبت دهد. «sagt»، «vermutet»، «kritisiert» و «widerspricht» نشان می‌دهند چه کسی چه موضعی دارد.","signals":["laut X / X zufolge","X behauptet / vermutet","X bezweifelt / widerspricht","dagegen / hingegen","aus Sicht von","die Autorinnen berichten"],"strategy":"نام یا نقش گوینده را با نشانهٔ ساده یادداشت کن: «Verwaltung: P»، «Studierende: ¬P»، «Studie: unklar». نظر گزارشگر را با نظر نقل‌شده یکی ندان.","pitfall":"«Die Studie berichtet, dass viele Befragte X glauben» به معنای تأیید X از سوی پژوهش نیست.","worked":{"text":"Was folgt aus „Die Studierenden kritisieren die Regelung; die Verwaltung hält sie hingegen für notwendig“?","options":["Beide Gruppen lehnen die Regelung ab.","Die Verwaltung verteidigt die Regelung, während Studierende sie kritisieren.","Die Studierenden haben die Regelung beschlossen."],"answer":1,"reasons":["Die Positionen sind ausdrücklich entgegengesetzt.","Genau der Gegensatz wird beschrieben.","Kritik ist keine Beschlusskompetenz."],"focus":""},"writing":{"prompt":"Schreiben Sie 100–130 Wörter zu drei Positionen: Studierende fordern längere Bibliothekszeiten; das Personal warnt vor Überlastung; die Hochschulleitung möchte zunächst einen Testbetrieb. Ordnen Sie jede Aussage korrekt zu.","sample":"Studierende fordern eine Ausweitung der Bibliotheksöffnungszeiten, weil sie insbesondere abends zusätzliche Lernmöglichkeiten benötigen. Das Bibliothekspersonal steht dem Vorschlag kritischer gegenüber und verweist auf eine mögliche Überlastung. Die Hochschulleitung lehnt die Idee nicht grundsätzlich ab, möchte jedoch zunächst prüfen, wie ein zeitlich begrenzter Testbetrieb funktioniert. Es wäre deshalb falsch, die Warnung des Personals der Hochschulleitung zuzuschreiben. Die drei Gruppen unterscheiden sich sowohl in ihren Interessen als auch in ihren vorgeschlagenen Schritten.  Für eine sachliche Zusammenfassung ist wichtig, diese Aussagen ihren jeweiligen Urhebern zuzuordnen. Während die Studierenden vor allem bessere Lernbedingungen wünschen, hebt das Personal die praktischen Grenzen hervor. Die Hochschulleitung versucht mit dem Testbetrieb, zunächst Erfahrungen zu sammeln, ohne sich schon auf eine dauerhafte Erweiterung festzulegen.","analysis":"سه نقش را نام‌گذاری کن؛ «kritisiert» الزاماً معادل رد کامل طرح نیست."},"speaking":{"prompt":"Fassen Sie in 60 Sekunden zwei gegensätzliche Meinungen zusammen: Eine Professorin bevorzugt Präsenzprüfungen; ein Student spricht sich für mehr digitale Prüfungen aus.","sample":"Die Professorin spricht sich für Präsenzprüfungen aus, weil sie unter anderem die persönliche Aufsicht für wichtig hält. Der Student vertritt dagegen die Ansicht, dass digitale Prüfungen flexibler organisiert werden könnten. Beide bewerten also dieselbe Frage unterschiedlich. Ob eine Mischform sinnvoll wäre, müsste man anhand der jeweiligen Prüfungsziele prüfen.  Die Professorin beurteilt die persönliche Kontrolle als Vorteil, während der Student stärker auf organisatorische Flexibilität achtet. Für eine faire Wiedergabe sollte ich beide Perspektiven getrennt darstellen, ohne einer Person Argumente zuzuschreiben, die sie nicht genannt hat. Anschließend könnte ich meine eigene Einschätzung ergänzen, falls die Aufgabenstellung das ausdrücklich verlangt."},"cases":[{"source":"Die Studierendenvertretung fordert mehr ruhige Lernplätze. Die Universitätsverwaltung verweist dagegen auf begrenzte Raumkapazitäten. Eine externe Gutachterin empfiehlt, bestehende Räume zunächst effizienter zu nutzen.","questions":[{"text":"Wer betont die begrenzte Raumkapazität?","options":["Die Studierendenvertretung.","Die Universitätsverwaltung.","Die externe Gutachterin."],"answer":1,"reasons":["Die Studierendenvertretung fordert mehr Plätze.","Diese Begründung wird ausdrücklich der Verwaltung zugeschrieben.","Die Gutachterin empfiehlt eine effizientere Nutzung."],"focus":""},{"text":"Welche Empfehlung stammt von der Gutachterin?","options":["Vorhandene Räume besser nutzen.","Alle Lernplätze sofort schließen.","Unbedingt neue Gebäude errichten."],"answer":0,"reasons":["Das ist die wörtlich sinngemäße Empfehlung.","Schließungen erwähnt sie nicht.","Neubauten werden nicht vorgeschlagen."],"focus":""}],"mode":"reading","label":"Lernraumdebatte"},{"source":"In einem Interview erklärt ein Forscher, die bisherigen Messdaten deuteten auf einen positiven Trend hin. Die Moderatorin fragt kritisch, ob die Stichprobe dafür ausreichend groß sei. Der Forscher räumt ein, dass weitere Daten nötig seien.","questions":[{"text":"Wer zweifelt die Größe der Stichprobe an?","options":["Der Forscher zu Beginn.","Die Moderatorin.","Die Universität als Institution."],"answer":1,"reasons":["Der Forscher beschreibt zunächst den positiven Trend.","Die kritische Nachfrage kommt von der Moderatorin.","Die Institution äußert sich im Text nicht."],"focus":""},{"text":"Welche Position nimmt der Forscher am Ende ein?","options":["Er erkennt weiteren Datenbedarf an.","Er behauptet, die Ergebnisse seien endgültig.","Er erklärt die gesamte Studie für erfunden."],"answer":0,"reasons":["Er räumt die Notwendigkeit weiterer Daten ein.","Er behauptet nicht, der Befund sei endgültig.","Von erfundenen Daten ist keine Rede."],"focus":""}],"mode":"listening","label":"Forschungsinterview"},{"source":"Der Dekan hält das neue Tutorienprogramm für vielversprechend. Zwei Lehrende bezweifeln jedoch, dass ausreichend Personal zur Verfügung steht. Die Studierendeninitiative begrüßt die Idee und bietet ehrenamtliche Unterstützung an.","questions":[{"text":"Wer bezweifelt die Personalverfügbarkeit?","options":["Der Dekan.","Zwei Lehrende.","Die Studierendeninitiative."],"answer":1,"reasons":["Der Dekan bewertet das Programm positiv.","Diese Sorge wird den Lehrenden zugeschrieben.","Die Initiative bietet Unterstützung an."],"focus":""},{"text":"Welche Gruppe bietet freiwillige Hilfe an?","options":["Die Studierendeninitiative.","Die Lehrenden.","Die Hochschulleitung."],"answer":0,"reasons":["Die Initiative bietet ehrenamtliche Unterstützung.","Die Lehrenden äußern Zweifel.","Von einem Angebot der Leitung wird nichts berichtet."],"focus":""}],"mode":"reading","label":"Tutorienprogramm"},{"source":"In einem Forschungsbericht heißt es: Viele Befragte glauben, dass kurze Videos das Lernen grundsätzlich erleichtern. Die Autorinnen selbst betonen jedoch, dass ihre Untersuchung lediglich Einstellungen erfasst hat und keine Lernerfolge gemessen wurden.","questions":[{"text":"Was ist die Position der Autorinnen?","options":["Die Videos verbessern nachweislich jede Lernleistung.","Es wurden Einstellungen, nicht tatsächliche Lernerfolge gemessen.","Die Befragten lehnen Videos vollständig ab."],"answer":1,"reasons":["Dies ist der Glaube einiger Befragter, kein Studiennachweis.","Das ist die ausdrückliche methodische Einschränkung.","Viele Befragte glauben an Vorteile."],"focus":""},{"text":"Welche Aussage wird nur als Meinung der Befragten dargestellt?","options":["Die Daten umfassen keine Leistungsmessung.","Die Studie hat ausschließlich Interviews untersucht.","Kurze Videos erleichtern grundsätzlich das Lernen."],"answer":2,"reasons":["Das ist die Aussage der Autorinnen über die Methode.","Ein konkretes Interviewverfahren wird nicht genannt.","Diese Überzeugung wird den Befragten zugeschrieben."],"focus":""}],"mode":"reading","label":"Video-Lernen"}]},{"id":"general","name":"Generalisierung","meaning":"تعمیم ناروا و محدودیت نمونه","subtitle":"Stichprobe ≠ Grundgesamtheit","lesson":"نمونهٔ آماری (Stichprobe) همان جامعهٔ هدف (Grundgesamtheit) نیست. تعمیم یک یافته به تمام دانشگاه‌ها، کشورهای دیگر یا همهٔ سنین نیازمند شواهد و نمونه‌گیری مناسب است. در مطالعهٔ کیفی حتی گاهی هدف، یافتن الگوهاست نه اندازه‌گیری فراوانی در جمعیت.","signals":["an einer Hochschule","unter 40 Befragten","nicht repräsentativ","nur in dieser Gruppe","Ergebnisse sind nicht übertragbar","Hinweise / erste Befunde"],"strategy":"مشخص کن چه کسانی بررسی شده‌اند، از کجا آمده‌اند و کدام گروه در گزینه مطرح است. اگر حوزهٔ نتیجه بزرگ‌تر از حوزهٔ داده است، نسبت به تعمیم حساس باش.","pitfall":"یافتهٔ صحیح در نمونه همچنان می‌تواند واقعی باشد؛ مسئله انتقال بی‌دلیل آن به جمعیت دیگر است.","worked":{"text":"Was ist aus „25 Studierende eines Seminars wurden befragt“ ableitbar?","options":["Die Ergebnisse beschreiben zunächst diese befragten Personen.","Die Ergebnisse gelten sicher für alle Studierenden Europas.","Es wurden alle Studierenden Deutschlands befragt."],"answer":0,"reasons":["دقیقاً به نمونهٔ محدود اشاره می‌کند.","هیچ شاهدی برای تعمیم به اروپا نیست.","نمونه یک سمینار بوده، نه کل کشور."],"focus":""},"writing":{"prompt":"Ein Bericht beschreibt Interviews mit 18 Studierenden eines einzigen Studiengangs. Schreiben Sie 110–140 Wörter über Aussagekraft und Grenzen der Ergebnisse, ohne die Erkenntnisse pauschal abzuwerten.","sample":"Die Interviews mit 18 Studierenden können wertvolle Einblicke in Erfahrungen innerhalb des untersuchten Studiengangs bieten. Sie erlauben jedoch keine sichere Aussage darüber, wie häufig dieselben Probleme an anderen Hochschulen auftreten. Dazu wäre eine breitere und möglichst systematische Datenerhebung nötig. Die Ergebnisse sollten deshalb als Hinweise und als Ausgangspunkt für weitere Untersuchungen verstanden werden. Die begrenzte Übertragbarkeit bedeutet nicht, dass die Erfahrungen der Befragten unwichtig sind.  Darüber hinaus können freiwillig Teilnehmende besonders stark von dem Thema betroffen sein und sich deshalb eher melden. Auch dieser Auswahlmechanismus kann die Übertragbarkeit einschränken. Eine anschließende quantitative Untersuchung mit Personen aus verschiedenen Hochschulen und Fachbereichen könnte klären, wie verbreitet die beschriebenen Erfahrungen tatsächlich sind.","analysis":"نمونهٔ کوچک لزوماً بی‌ارزش نیست؛ فقط دامنهٔ نتیجه‌گیری محدودتر است."},"speaking":{"prompt":"Ein Freund sagt: „In einer Umfrage unter 30 Studierenden meiner Fakultät fanden 24 Onlinelehre gut; also bevorzugen 80 Prozent aller Studierenden in Deutschland Onlinelehre.“ Erklären Sie den Denkfehler.","sample":"24 von 30 entsprechen tatsächlich 80 Prozent der befragten Gruppe. Der Fehler entsteht bei der Übertragung dieser Zahl auf alle Studierenden Deutschlands. Die Befragten stammen nur aus einer Fakultät und wurden möglicherweise nicht repräsentativ ausgewählt. Deshalb beschreibt die Prozentzahl zunächst nur diese Umfrage. Für eine nationale Aussage bräuchte man eine geeignete Stichprobe.  Man müsste zunächst untersuchen, ob die Befragten hinsichtlich Fachrichtungen, Hochschultypen und Studienphasen die Gesamtgruppe angemessen abbilden. Außerdem kann es sein, dass Personen mit besonders positiven Erfahrungen häufiger an der Befragung teilgenommen haben. Die Aussage über die 30 Befragten ist richtig; problematisch ist ausschließlich die unbegründete Übertragung auf eine viel größere Gruppe."},"cases":[{"source":"Eine qualitative Studie führte zwölf Interviews mit Doktorandinnen und Doktoranden einer technischen Fakultät. Mehrere berichteten von Unsicherheit beim Publizieren. Der Bericht betont, dass keine repräsentative Häufigkeit ermittelt werden sollte.","questions":[{"text":"Was ist ein angemessenes Ergebnis?","options":["Die Interviews liefern Einblicke in einzelne Erfahrungen.","Die Mehrheit aller Promovierenden hat nachweislich dieselbe Unsicherheit.","Es wurde eine repräsentative Quote für Deutschland erhoben."],"answer":0,"reasons":["Qualitative Interviews können solche Einblicke bieten.","Keine repräsentative Häufigkeit wurde gemessen.","Die Studie verneint diesen Anspruch."],"focus":""},{"text":"Welche Behauptung wäre eine unzulässige Verallgemeinerung?","options":["Mehrere Befragte berichteten von Unsicherheit.","Die Studie beschränkt sich auf eine technische Fakultät.","Alle Promovierenden in Deutschland sind unsicher beim Publizieren."],"answer":2,"reasons":["Direkte und begrenzte Aussage des Textes.","Die Quelle der Befragten ist klar beschrieben.","Aus zwölf Interviews folgt keine universelle Aussage."],"focus":""}],"mode":"reading","label":"Promotionsinterviews"},{"source":"Bei einem Pilotprojekt in zwei ländlichen Gemeinden wurde ein neues Busangebot gut angenommen. Die Projektleitung weist darauf hin, dass sich die Ergebnisse nicht ohne Weiteres auf Großstädte übertragen lassen.","questions":[{"text":"Welche Schlussfolgerung ist zulässig?","options":["Das Modell ist in den beiden Pilotgemeinden auf Interesse gestoßen.","In allen Großstädten würde es genauso funktionieren.","Die Nachfrage war nachweislich überall in Deutschland identisch."],"answer":0,"reasons":["Der Erfolg im Pilotgebiet ist berichtet.","Die Übertragbarkeit auf Großstädte wird ausdrücklich eingeschränkt.","Eine bundesweite Gleichheit wurde nicht untersucht."],"focus":""},{"text":"Warum ist Vorsicht bei der Übertragung nötig?","options":["Weil Gemeinden und Großstädte unterschiedliche Bedingungen haben könnten.","Weil Busse grundsätzlich nur auf dem Land fahren dürfen.","Weil im Projekt keine Gemeinden beteiligt waren."],"answer":0,"reasons":["Unterschiedliche Rahmenbedingungen können Übertragbarkeit begrenzen.","Keine solche gesetzliche Aussage.","Zwei Gemeinden wurden untersucht."],"focus":""}],"mode":"listening","label":"Busprojekt"},{"source":"Ein Unternehmen testete eine Lernplattform mit 60 Beschäftigten aus der IT-Abteilung. 42 bewerteten das Angebot positiv. Beschäftigte aus Produktion und Verwaltung nahmen an dem Test nicht teil.","questions":[{"text":"Welche Aussage ist korrekt?","options":["42 von 60 Teilnehmenden bewerteten das Angebot positiv.","70 Prozent aller Beschäftigten des Unternehmens fanden die Plattform gut.","Alle Abteilungen waren vertreten."],"answer":0,"reasons":["Der Anteil in der untersuchten Gruppe ist korrekt wiedergegeben.","Andere Abteilungen wurden nicht getestet.","Produktion und Verwaltung fehlten."],"focus":""},{"text":"Was müsste für eine Aussage über die Gesamtbelegschaft geprüft werden?","options":["Eine angemessene Einbeziehung weiterer Abteilungen.","Nur die Lieblingsfarbe der IT-Beschäftigten.","Nur das Veröffentlichungsdatum der Plattform."],"answer":0,"reasons":["Die bisherige Auswahl ist auf IT begrenzt.","Kein Bezug zur Repräsentativität.","Das Datum behebt die Stichprobenverzerrung nicht."],"focus":""}],"mode":"reading","label":"Lernplattform"},{"source":"Eine Studie über Ernährung befragte ausschließlich Personen zwischen 18 und 25 Jahren in einer Universitätsstadt. Die Autorinnen stellen fest, dass die Ergebnisse keine Aussagen über ältere Menschen oder ländliche Regionen erlauben.","questions":[{"text":"Für welche Gruppe gelten die Beobachtungen zunächst?","options":["Für die tatsächlich befragten jungen Personen.","Für alle Altersgruppen in Europa.","Für alle ländlichen Regionen."],"answer":0,"reasons":["Die Stichprobe ist 18–25 in einer Universitätsstadt.","Andere Altersgruppen wurden nicht untersucht.","Ländliche Regionen wurden nicht untersucht."],"focus":""},{"text":"Welche Aussage widerspricht der methodischen Einschränkung?","options":["Die Studie untersucht eine begrenzte Altersgruppe.","Die Ergebnisse gelten zuverlässig auch für ältere Landbewohner.","Eine Überprüfung in anderen Gruppen wäre sinnvoll."],"answer":1,"reasons":["Die Einschränkung wird korrekt benannt.","Der Text verneint gerade eine solche Aussage.","Weitere Prüfung wäre eine angemessene Konsequenz."],"focus":""}],"mode":"reading","label":"Ernährungsstudie"}]},{"id":"relevance","name":"Relevanz und Hauptaussage","meaning":"گزارهٔ درست ولی بی‌ربط به پرسش","subtitle":"richtig ≠ relevante Antwort","lesson":"ممکن است یک گزینه از نظر اطلاعاتی درست باشد، اما به خواستهٔ سؤال پاسخ ندهد. فرق «Hauptaussage» (پیام اصلی)، «Grund» (دلیل)، «Folge» (پیامد)، «Absicht» (هدف نویسنده) و «Beispiel» (مثال) را تشخیص بده. نتیجهٔ درستِ فرعی را جای پاسخ به پیام مرکزی ننشان.","signals":["zentrale Aussage / Kernaussage","Hauptgrund","welcher Zweck / Absicht","welche Folge","welche Einschränkung","welches Beispiel"],"strategy":"پیش از دیدن گزینه‌ها، نوع پاسخ را در یک کلمه تعیین کن: «دلیل» یا «هدف» یا «نتیجه» یا «پیام اصلی». اگر گزینه درست است اما به آن نوع تعلق ندارد، حذفش کن.","pitfall":"گزینه‌ای با واژگان زیاد از متن ممکن است حاشیه‌ای باشد و گزینهٔ درست معنای کل متن را بازنویسی کند.","worked":{"text":"Der Text erklärt Vor- und Nachteile digitaler Lehre und empfiehlt ein Kombinationsmodell. Was ist seine Hauptaussage?","options":["Eine einzelne Universität besitzt 25 Computer.","Eine Kombination digitaler und analoger Lehre erscheint sinnvoll.","In einem Beispiel findet ein Seminar montags statt."],"answer":1,"reasons":["این یک جزئیات احتمالی است، نه پیام اصلی.","هم مزایا و معایب و هم نتیجهٔ توصیه را پوشش می‌دهد.","مثال یک زمان، پیام مرکزی مقاله نیست."],"focus":""},"writing":{"prompt":"Ein Artikel schildert drei Probleme bei der Einführung neuer Labortechnik und schlägt eine schrittweise Umsetzung vor. Schreiben Sie 100–130 Wörter, die zuerst die Hauptaussage und danach zwei unterstützende Details nennen.","sample":"Der Artikel kommt zu dem Schluss, dass neue Labortechnik am besten schrittweise eingeführt werden sollte. Zur Begründung werden mehrere praktische Probleme beschrieben. Erstens benötigen Mitarbeitende Zeit, um sich mit den Geräten vertraut zu machen. Zweitens müssen bestehende Arbeitsabläufe angepasst werden, damit Fehler vermieden werden. Die einzelnen Beispiele verdeutlichen somit die zentrale Empfehlung. Sie ersetzen jedoch nicht die Hauptaussage, sondern stützen sie.  Die einzelnen Beispiele für technische Schwierigkeiten dienen dazu, diese Empfehlung nachvollziehbar zu machen. Sie sind jedoch nicht selbst die zentrale Aussage des Artikels. In einer Zusammenfassung sollte man deshalb die Hauptforderung zuerst nennen und anschließend nur die Probleme auswählen, die sie am stärksten begründen. So bleibt der Argumentationsgang erkennbar.","analysis":"ابتدا پیام مرکزی را بگو، بعد جزئیاتِ پشتیبان. ترتیب برعکس باعث گم‌شدن هدف می‌شود."},"speaking":{"prompt":"Ein Vortrag nennt Kosten, technische Probleme und Zeitaufwand und schließt mit der Empfehlung eines Pilotprojekts. Fassen Sie in 60 Sekunden die zentrale Empfehlung zusammen und unterscheiden Sie sie von einem Einzelbeispiel.","sample":"Die zentrale Aussage des Vortrags lautet, dass das neue Verfahren zunächst in einem begrenzten Pilotprojekt getestet werden sollte. Diese Empfehlung beruht auf mehreren Schwierigkeiten, insbesondere auf Kosten und technischen Fragen. Ein genanntes Beispiel verdeutlicht zwar ein einzelnes Problem, ist aber nicht die Hauptbotschaft. Entscheidend ist die vorgeschlagene vorsichtige Einführung.  Beispielsweise können hohe Anschaffungskosten eine wichtige Information sein. Sie sind aber nur ein Argument, das die Empfehlung stützt, und nicht die eigentliche Schlussfolgerung. Wenn ich den Vortrag zusammenfasse, beginne ich deshalb mit der zentralen Forderung nach einem Pilotprojekt und erläutere danach, welche Probleme diese vorsichtige Vorgehensweise begründen."},"cases":[{"source":"Ein Kommentar über Universitätsbibliotheken beschreibt zunächst überfüllte Arbeitsräume, nennt Beispiele aus drei Städten und diskutiert anschließend digitale Reservierungssysteme. Am Ende empfiehlt der Autor, sowohl zusätzliche Lernplätze zu schaffen als auch bestehende Räume besser zu verwalten.","questions":[{"text":"Was ist die zentrale Empfehlung?","options":["Die meisten Städte liegen in Deutschland.","Mehr Lernplätze schaffen und die Nutzung besser organisieren.","In einem Beispiel wurde ein Raum im Sommer renoviert."],"answer":1,"reasons":["Die Aussage ist nicht der argumentative Kern.","Der Schluss fasst genau diese kombinierte Lösung zusammen.","Ein mögliches Einzelbeispiel ersetzt nicht die Empfehlung."],"focus":""},{"text":"Welche Funktion haben die Beispiele aus Städten?","options":["Sie illustrieren das Problem und verschiedene Situationen.","Sie beweisen, dass Reservierungssysteme immer scheitern.","Sie ersetzen die gesamte Argumentation."],"answer":0,"reasons":["Beispiele veranschaulichen die beschriebenen Situationen.","Ein universeller Misserfolg wird nicht behauptet.","Der Kommentar entwickelt darüber hinaus eine Empfehlung."],"focus":""}],"mode":"reading","label":"Bibliothekskommentar"},{"source":"In einem Vortrag über Forschungsdaten erklärt die Referentin zunächst, wie teuer Server sein können. Anschließend stellt sie mehrere Lösungen zur sicheren Speicherung vor. Ihr Fazit lautet: Nicht die Anschaffung allein, sondern ein langfristiges Datenmanagement ist entscheidend.","questions":[{"text":"Welche Hauptaussage vertritt die Referentin?","options":["Server können teuer sein.","Langfristiges Datenmanagement ist wichtiger als eine reine Anschaffung.","Eine der Lösungen nutzt externe Speicher."],"answer":1,"reasons":["Das ist ein richtiges Nebendetail, aber nicht das Fazit.","Die Aussage entspricht dem ausdrücklich genannten Fazit.","Eine einzelne Speicherlösung wäre nur ein Beispiel."],"focus":""},{"text":"Welche Funktion hat der Hinweis auf Serverkosten?","options":["Er ist ein einleitendes Detail im Problemaufbau.","Er ist die alleinige Schlussfolgerung des Vortrags.","Er beweist, dass Datenmanagement nicht nötig ist."],"answer":0,"reasons":["Die Kosten führen in das Thema ein.","Das Fazit betrifft langfristiges Management.","Der Schluss zieht die gegenteilige Konsequenz."],"focus":""}],"mode":"listening","label":"Forschungsdaten"},{"source":"Eine Studie zu Gruppenarbeit beschreibt Befragungsmethoden und weist auf die geringe Teilnehmerzahl hin. Das wichtigste Ergebnis ist jedoch, dass klare Rollenverteilungen Konflikte in Lerngruppen verringern könnten. Die Forschenden schlagen weitere Untersuchungen vor.","questions":[{"text":"Was ist das wichtigste berichtete Ergebnis?","options":["Die Teilnehmenden füllten einen Fragebogen aus.","Klare Rollen könnten Konflikte in Lerngruppen reduzieren.","Die Studie wurde an einem Dienstag veröffentlicht."],"answer":1,"reasons":["Die Methode ist nicht das Kernergebnis.","Der Text bezeichnet diese Erkenntnis als wichtigste.","Ein Veröffentlichungstag wird nicht erwähnt."],"focus":""},{"text":"Welche Einschränkung nennen die Forschenden?","options":["Die geringe Teilnehmerzahl.","Die hohe Anzahl internationaler Bibliotheken.","Die fehlende Existenz von Lerngruppen."],"answer":0,"reasons":["Die kleine Stichprobe wird ausdrücklich erwähnt.","Keine entsprechende Angabe.","Der Text handelt gerade von Lerngruppen."],"focus":""}],"mode":"reading","label":"Lerngruppen"},{"source":"Ein Artikel über wissenschaftliches Schreiben erläutert das Zitieren, den Aufbau von Literaturverzeichnissen und die Vermeidung unbeabsichtigter Übernahmen. Das Ziel des Artikels ist, Studierende zu einer nachvollziehbaren und transparenten Arbeitsweise anzuleiten.","questions":[{"text":"Welche Absicht verfolgt der Artikel?","options":["Die Lesenden zu transparentem wissenschaftlichem Arbeiten anleiten.","Die Anzahl aller Quellen im Internet berechnen.","Eine neue Bibliothek gründen."],"answer":0,"reasons":["Das genannte Ziel ist eine Anleitung.","Eine Internetstatistik ist nicht das Ziel.","Der Artikel handelt nicht von einer Gründung."],"focus":""},{"text":"Welche Aussage ist ein Detail, nicht das übergeordnete Ziel?","options":["Studierende sollen nachvollziehbar arbeiten.","Der Artikel erklärt den Aufbau von Literaturverzeichnissen.","Transparenz wissenschaftlicher Arbeit soll gefördert werden."],"answer":1,"reasons":["Dies ist die übergeordnete Zielsetzung.","Ein einzelner inhaltlicher Baustein.","Ebenfalls das übergeordnete Ziel."],"focus":""}],"mode":"reading","label":"Wissenschaftliches Schreiben"}]}],"mixed":[{"theme":"quant","source":"Für das Sommerprogramm haben sich 150 Personen registriert. Rund ein Drittel davon nahm später am optionalen Sprachtraining teil.","text":"Welche Aussage ist angemessen?","options":["Ungefähr 50 Registrierte nahmen am Sprachtraining teil.","Alle Registrierten besuchten das Sprachtraining.","Genau 150 Personen haben das Training abgeschlossen."],"answer":0,"reasons":["Ein Drittel von 150 sind ungefähr 50.","Die Teilnahme war optional und lag bei etwa einem Drittel.","Registrierung ist nicht gleich Teilnahme oder Abschluss."],"mode":"reading"},{"theme":"modal","source":"Studierende können ihre Projekte im Rahmen einer Ausstellung vorstellen. Für die Veröffentlichung personenbezogener Daten ist jedoch die Einwilligung der betroffenen Personen erforderlich.","text":"Was muss vor der Veröffentlichung solcher Daten vorliegen?","options":["Eine Einwilligung der Betroffenen.","Nur die Teilnahme an der Ausstellung.","Die Zustimmung aller Universitäten Deutschlands."],"answer":0,"reasons":["Diese Voraussetzung wird ausdrücklich genannt.","Eine Ausstellung ersetzt die Einwilligung nicht.","Eine bundesweite Zustimmung wird nicht erwähnt."],"mode":"listening"},{"theme":"causal","source":"In einer Kohortenstudie zeigte sich, dass längere Fahrzeiten mit geringerer Seminarteilnahme einhergingen. Andere Einflussfaktoren wie Arbeitszeiten wurden nicht erfasst.","text":"Welche Aussage überschreitet die Daten?","options":["Ein statistischer Zusammenhang wurde beobachtet.","Längere Wege sind nachweislich die einzige Ursache der geringeren Teilnahme.","Nicht erfasste Arbeitszeiten könnten eine Rolle spielen."],"answer":1,"reasons":["«einhergingen» beschreibt einen Zusammenhang.","Alleinursache ist nicht belegt; Arbeitszeiten wurden nicht kontrolliert.","Der fehlende Faktor wird ausdrücklich genannt."],"mode":"reading"},{"theme":"condition","source":"Alle bis Freitag eingegangenen Anmeldungen werden in die Verlosung aufgenommen. Wer sich später anmeldet, kann nicht teilnehmen. Wegen der begrenzten Plätze entscheidet anschließend das Los.","text":"Was garantiert eine rechtzeitige Anmeldung?","options":["Einen festen Teilnahmeplatz.","Die Berücksichtigung bei der Verlosung.","Die kostenlose Anreise zur Exkursion."],"answer":1,"reasons":["Über Plätze entscheidet anschließend das Los.","Rechtzeitigkeit ist notwendig für Berücksichtigung.","Zur Anreise steht nichts im Text."],"mode":"reading"},{"theme":"timeline","source":"Die Beratungsstelle öffnete früher erst um 10 Uhr. Seit Anfang Oktober öffnet sie werktags um 9 Uhr; eine Ausweitung auf Wochenenden ist für das nächste Jahr lediglich geplant.","text":"Wann beginnt die Beratung derzeit an Werktagen?","options":["Um 10 Uhr.","Um 9 Uhr.","Erst im kommenden Jahr."],"answer":1,"reasons":["10 Uhr beschreibt die frühere Regelung.","Seit Oktober gilt 9 Uhr.","Das nächste Jahr betrifft Wochenenden."],"mode":"listening"},{"theme":"speaker","source":"Der Hochschulrat will die Gebühren unverändert lassen. Die Fachschaft fordert ihre Senkung; das Finanzdezernat warnt vor Einnahmeausfällen.","text":"Wer fordert ausdrücklich niedrigere Gebühren?","options":["Der Hochschulrat.","Die Fachschaft.","Das Finanzdezernat."],"answer":1,"reasons":["Der Rat will den Status quo.","Die Fachschaft fordert die Senkung.","Das Dezernat benennt finanzielle Risiken."],"mode":"reading"},{"theme":"general","source":"In einer kleinen Onlineumfrage beteiligten sich 75 Freiwillige, die überwiegend aus dem Bereich Informatik kamen. 60 gaben an, künstliche Intelligenz regelmäßig einzusetzen.","text":"Welche Aussage ist wissenschaftlich vertretbar?","options":["80 Prozent der Freiwilligen gaben regelmäßige Nutzung an.","80 Prozent der gesamten deutschen Bevölkerung nutzen KI regelmäßig.","Alle Hochschulfächer sind repräsentativ vertreten."],"answer":0,"reasons":["60 von 75 entsprechen 80 Prozent dieser Gruppe.","Freiwillige Informatiknahe sind keine nationale Stichprobe.","Andere Fächer sind kaum vertreten."],"mode":"reading"},{"theme":"relevance","source":"Ein Artikel schildert drei gelungene Beispiele für Mentoring im ersten Semester, nennt aber auch Organisationsprobleme. Er schließt mit der Empfehlung, Mentoringprogramme regelmäßig auszuwerten und an den Bedarf anzupassen.","text":"Was ist die zentrale Empfehlung?","options":["Ein Mentoringfall fand im Winter statt.","Mentoringangebote evaluieren und bedarfsgerecht anpassen.","Einzelne Beispiele zeigen engagierte Personen."],"answer":1,"reasons":["Das ist ein beiläufiges Detail, nicht die Empfehlung.","Dies fasst den Schlusspunkt zusammen.","Das illustriert den Text, aber nicht die zentrale Empfehlung."],"mode":"reading"},{"theme":"quant","source":"Für ein Forschungsseminar sind mindestens 24 Anmeldungen nötig. Bisher liegen 23 gültige Anmeldungen vor.","text":"Welche Feststellung ist richtig?","options":["Die Mindestzahl ist bereits erreicht.","Es fehlt mindestens eine weitere gültige Anmeldung.","Mit 23 Anmeldungen muss das Seminar bereits stattfinden."],"answer":1,"reasons":["23 ist kleiner als 24.","24 minus 23 ist 1.","Die Mindestbedingung ist nicht erfüllt."],"mode":"reading"},{"theme":"modal","source":"Bei der Projektpräsentation dürfen die Teams digitale Grafiken verwenden; sie müssen aber keine Folien vorbereiten. Die Präsentationszeit darf 15 Minuten nicht überschreiten.","text":"Welche Aussage trifft zu?","options":["Folien sind Pflicht.","Teams können ohne Folien präsentieren.","Mehr als 15 Minuten sind ausdrücklich erlaubt."],"answer":1,"reasons":["«müssen nicht» verneint die Pflicht.","Folien sind optional.","15 Minuten sind die Obergrenze."],"mode":"reading"},{"theme":"causal","source":"Nach dem Umbau stieg die Zahl der Bibliotheksbesuche. Gleichzeitig führte die Hochschule einen kostenlosen Fahrdienst ein. Der Bericht kann den Anstieg keinem einzelnen Faktor eindeutig zuordnen.","text":"Was ist über die Ursache bekannt?","options":["Der Umbau allein hat die Zunahme bewiesen.","Die Zunahme wurde beobachtet; die Ursache bleibt unklar.","Der Fahrdienst hatte nachweislich keinerlei Einfluss."],"answer":1,"reasons":["Es gibt mindestens einen konkurrierenden Faktor.","Das ist die Schlussfolgerung des Berichts.","Ein Einfluss kann weder bestätigt noch ausgeschlossen werden."],"mode":"listening"},{"theme":"condition","source":"Eine Prüfung kann bei nachgewiesener Erkrankung verschoben werden, sofern der Antrag fristgerecht gestellt wurde. Die Entscheidung trifft nach Prüfung der Unterlagen das zuständige Amt.","text":"Welche Aussage ist zu stark?","options":["Eine fristgerechte Antragstellung ist relevant.","Der Antrag wird nach Unterlagenprüfung entschieden.","Jeder fristgerechte Antrag führt automatisch zur Verschiebung."],"answer":2,"reasons":["Die Frist ist als Bedingung genannt.","Die Entscheidung liegt beim Amt.","Eine automatische Zusage folgt nicht aus «kann»."],"mode":"reading"},{"theme":"timeline","source":"Eine Vortragsreihe sollte zunächst im April enden. Wegen hoher Nachfrage wurde sie bis Ende Juni verlängert; die Anmeldephase für Zusatztermine ist seit dem 10. Mai abgeschlossen.","text":"Welche Aussage beschreibt die Lage korrekt?","options":["Die Reihe endete definitiv im April.","Die Reihe wurde bis Ende Juni verlängert.","Die Anmeldephase beginnt erst im Juni."],"answer":1,"reasons":["April war der ursprüngliche Endtermin.","Die Verlängerung wurde ausdrücklich genannt.","Die Zusatzanmeldung ist seit Mai geschlossen."],"mode":"reading"},{"theme":"speaker","source":"Ein studentischer Bericht empfiehlt mehr Online-Tutorien. Die Lehrendenvertretung unterstützt die Idee teilweise, fordert aber zusätzliche Betreuung. Die Hochschulleitung kündigt zunächst eine Machbarkeitsprüfung an.","text":"Wer fordert ausdrücklich zusätzliche Betreuung?","options":["Die Lehrendenvertretung.","Die Hochschulleitung.","Der studentische Bericht."],"answer":0,"reasons":["Die Forderung wird direkt der Vertretung zugeschrieben.","Die Leitung prüft die Machbarkeit.","Der Bericht empfiehlt mehr Online-Tutorien."],"mode":"listening"},{"theme":"general","source":"Ein Feldversuch zur Nutzung von Lastenrädern wurde in einem verkehrsarmen Innenstadtviertel durchgeführt. Die Autorinnen betonen, dass die Ergebnisse nicht ohne Weiteres für ländliche Regionen gelten.","text":"Was ist eine zulässige Aussage?","options":["Das Ergebnis gilt ohne Einschränkung für jedes Dorf.","Die Ergebnisse betreffen zunächst das untersuchte Stadtviertel.","Die Studie beweist die Nutzung von Lastenrädern in allen Ländern."],"answer":1,"reasons":["Ländliche Bedingungen wurden nicht geprüft.","Die Studie bezieht sich auf dieses Gebiet.","Eine weltweite Generalisierung ist nicht belegt."],"mode":"reading"},{"theme":"relevance","source":"Ein Artikel beschreibt zunächst verschiedene Fehler bei der Datenablage, diskutiert dann Standards zur Dokumentation und plädiert abschließend für verbindliche, verständliche Richtlinien in Forschungsgruppen.","text":"Was ist die Absicht des Autors?","options":["Eine einzige fehlerhafte Datei zu beschreiben.","Für klare verbindliche Dokumentationsrichtlinien argumentieren.","Die Zahl aller Forschungsgruppen in Europa ermitteln."],"answer":1,"reasons":["Einzelbeispiel wäre nicht die Absicht.","Diese Forderung steht im Fazit.","Eine statistische Erhebung ist nicht das Thema."],"mode":"reading"}]};
const STORE='TestDaF_Extra_Part6_Fallenklinik_v1';
const BASE={answers:{},graded:{},writing:{},samples:{},seen:{},voiceRate:0.95,voiceURI:'',mix:{started:false,finished:false,index:0,answers:{},endAt:0},micNotes:{}};
let state;try{state=Object.assign({},BASE,JSON.parse(localStorage.getItem(STORE)||'{}'));}catch(e){state=structuredClone(BASE)};
state.mix=Object.assign({},BASE.mix,state.mix||{});for(const k of ['answers','graded','writing','samples','seen'])state[k]??={};
let view='home',talking=null,mic=null,micChunks=[],micStream=null,recordedURL=null,recordedBlob=null,micTimerEnd=0,toastT=null;
const E=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const de=s=>`<div class="de">${E(s)}</div>`;
const escAttr=s=>E(s);
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){console.warn('local save unavailable',e)}};
const root=document.getElementById('root');
const idx=theme=>DATA.chapters.findIndex(c=>c.id===theme);
const caseId=(c,i,j)=>`${c.id}-${i}-${j}`;
const countWords=s=>(s.trim().match(/\S+/g)||[]).length;
function toast(s){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.className='toasts';document.body.append(x)}x.textContent=s;clearTimeout(toastT);toastT=setTimeout(()=>x.remove(),4000)}
