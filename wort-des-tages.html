<style>
:root{--bg:#111111;--gold:#e6b96f;--gold2:#c99a4e;--ink:#f5f1e8;--mute:#b8b0a4;--glass:#1b1814;--edge:rgba(230,185,111,.28);color-scheme:dark}
html[data-theme=snowy]{--bg:#081421;--gold:#f3c879;--gold2:#d9ab5e;--ink:#f3f8fc;--mute:#b8c7d3;--glass:#10263a;--edge:rgba(185,220,244,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.8;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 118px);position:relative;overflow-x:hidden;background:var(--bg)}
#scenicBg{position:fixed;inset:0;z-index:0;pointer-events:none}
#scenicBg::after{content:"";position:absolute;inset:0}
html[data-theme=snowy] #scenicBg::after{background:linear-gradient(to bottom,rgba(8,20,33,.55),rgba(8,20,33,.82))}
html[data-theme=classic] #scenicBg::after,html:not([data-theme]) #scenicBg::after{background:linear-gradient(to bottom,rgba(17,17,17,.55),rgba(17,17,17,.82))}
main,.poof-back,.whd{position:relative;z-index:1}
main{max-width:480px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.poster{padding:26px 20px 20px;text-align:center}
.date{color:var(--mute);font-size:.85rem}
.art{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--gold);font-size:1.3rem;direction:ltr;margin-top:14px;min-height:1.6em}
.word{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:clamp(2.2rem,12vw,3.4rem);font-weight:400;direction:ltr;letter-spacing:.01em;line-height:1.15;word-break:break-word;margin:0;background:linear-gradient(180deg,#f7e3ac,var(--gold) 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ipa,.pl{direction:ltr;color:var(--mute);font-size:.95rem}
.rule{width:56px;height:1px;background:var(--gold);margin:16px auto;opacity:.7}
.fa{font-size:1.45rem;font-weight:700}
.blk{text-align:right;margin-top:16px;padding-top:14px;border-top:1px solid var(--edge)}
.blk h3{margin:0 0 4px;font-size:.88rem;color:var(--gold);font-weight:700}
.de{direction:ltr;text-align:left;unicode-bidi:isolate}
.exde{font-family:Georgia,serif;font-size:1.02rem}
.exfa{color:var(--mute);font-size:.88rem;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{direction:ltr;border:1px solid var(--edge);border-radius:20px;padding:1px 12px;font-size:.9rem;background:var(--glass)}
.chip.ant{border-color:rgba(230,120,100,.5)}
.chip[data-w],.ptok{cursor:pointer}
.ptok{border-bottom:1px dotted rgba(230,185,111,.55);-webkit-touch-callout:none;user-select:none}
.ptok.sel{background:rgba(230,185,111,.28);border-radius:4px}
#wsheet{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:110;background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));box-shadow:0 16px 50px rgba(0,0,0,.55);max-height:72vh;overflow:auto;text-align:right}
#wsheet[hidden]{display:none}
#wphrase{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:111;background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));box-shadow:0 16px 50px rgba(0,0,0,.55);max-height:72vh;overflow:auto;text-align:right}
#wphrase[hidden]{display:none}
#wsDict,#wpDict{padding:14px 16px;font-size:1.05rem}
#wphrase .wp-word{font-family:Georgia,serif;font-size:1.3rem;direction:ltr;text-align:left}
#wsheet .ws-word{font-family:Georgia,serif;font-size:1.6rem;direction:ltr}
#wsheet .ws-art{font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:1.1rem;direction:ltr}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{padding:11px 6px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1307;font-weight:700;border-color:transparent}
.btn:disabled{opacity:.35}
.cal{margin-top:14px;padding:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ch b{font-size:.95rem}.ch button{background:none;border:0;font-size:1.3rem;padding:0 10px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid span{color:var(--mute);font-size:.75rem}
.grid button{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:transparent;font-size:.85rem}
.grid button.past{background:rgba(230,185,111,.12)}
.grid button.today{border-color:var(--gold)}
.grid button.sel{background:var(--gold);color:#1a1307;font-weight:700}
.grid button:disabled{color:rgba(241,234,217,.22)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 22px);margin:auto;width:max-content;max-width:90%;background:var(--gold);color:#1a1307;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion:no-preference){.poster{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}}}

.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.poof-back{max-width:480px;margin:0 auto 12px}.poof-back a{display:inline-flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-weight:700;font-size:.9rem}.poof-back a:hover{text-decoration:underline}
.whd{max-width:480px;margin:0 auto 10px;display:flex;align-items:center;gap:10px}
.whd .brand-mascot{width:56px;height:56px;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center;animation:poof-float 3s ease-in-out infinite}
@keyframes poof-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.whd h2{margin:0;font-size:1.15rem;color:var(--gold);line-height:1.4}.whd .wsub{color:var(--mute);font-size:.8rem;direction:ltr;text-align:left}
nav.poof-nav{position:fixed;right:16px;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;max-width:688px;margin:0 auto;overflow:visible;background:rgba(27,24,20,.78);border:1px solid rgba(230,185,111,.25);box-shadow:0 12px 32px rgba(0,0,0,.45);border-radius:24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:transform .42s cubic-bezier(.4,0,.2,1),opacity .35s ease}
nav.poof-nav.nav-hidden{opacity:0;transform:translateY(calc(100% + 48px));pointer-events:none}
nav.poof-nav:focus-within{opacity:1;transform:none;pointer-events:auto}
html[data-theme=snowy] nav.poof-nav{background:rgba(11,29,45,.78);border-color:rgba(185,220,244,.28);box-shadow:0 12px 32px rgba(0,8,16,.55)}
nav.poof-nav button{padding:10px 2px;border:0;border-radius:16px;background:transparent;color:var(--mute);box-shadow:none}
nav.poof-nav button.on{background:rgba(230,185,111,.14);color:var(--gold)}
html[data-theme=snowy] nav.poof-nav button.on{background:rgba(243,200,121,.16)}
nav.poof-nav .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav.poof-nav button.hero{width:54px;height:54px;margin:0 auto;border-radius:50%;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1307;box-shadow:0 8px 22px rgba(0,0,0,.45);display:grid;place-items:center}
nav.poof-nav button.hero .ic{width:26px;height:26px}

} html[data-theme=sun] #scenicBg{background-image:url('pouf-sun-scene-library.webp');background-size:cover;background-position:center} html[data-theme=nebula] #scenicBg{background-image:url('pouf-nebula-library.webp');background-size:cover;background-position:center}</style>

<script>
// فرمت: کلمه|مقاله|جمع|IPA|معنی|ریشه و ساخت|مثال۱|ترجمه۱|مثال۲|ترجمه۲|هم‌معنی‌ها (با ویرگول)|متضاد

Verantwortung|die|(معمولاً مفرد)|/fɛɐ̯ˈʔantvɔʁtʊŋ/|مسئولیت|ver- + antworten (پاسخ دادن) + پسوند ‎-ung|Er übernimmt die Verantwortung für das Projekt.|او مسئولیت پروژه را می‌پذیرد.|Das ist eine große Verantwortung.|این مسئولیت بزرگی است.|Pflicht,Zuständigkeit|Gleichgültigkeit

/* POOF Select: عین بخش دیکشنری — تک‌ضرب = ورق معنی، نگه‌داشتن + کشیدن = انتخاب عبارت */
const normW=s=>(s||'').trim().toLowerCase().replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'');

const ptokHTML=s=>s.split(/(\s+)/).map(p=>/\s/.test(p)?p:(normW(p)?`<span class="ptok" data-w="${escA(normW(p))}">${p}</span>`:p)).join('');
/* ریشه: فقط ردیف‌های لاتین (کلمات آلمانی) ضربه‌پذیر می‌شوند، متن فارسی دست نمی‌خورد */
const tokRoot=s=>String(s).replace(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g,m=>`<span class="ptok" data-w="${escA(normW(m))}">${m}</span>`);

  :`<p style="color:var(--mute)">این کلمه در بانک کلمه‌ی روز نیست؛ معنی کاملش را در دیکشنری POOF ببین.</p>`;

window.addEventListener('popstate',()=>{const wp=$('wphrase');if(wp&&!wp.hidden){wp.hidden=true;wpPushed=false;return}const sh=$('wsheet');if(sh&&!sh.hidden){sh.hidden=true;wsPushed=false}});
/* موتور ژست‌ها — پارامترها عین دیکشنری: ضرب تمیز زیر ۲۵۰ms و جابه‌جایی زیر ۱۰px = ورق؛ نگه‌داشتن ~۳۵۰ms با تحمل ۲۴px = انتخاب عبارت */
let gt=null,lastTouchEl=null,lastTouchAt=0;
function gtReset(){if(gt&&gt.timer)clearTimeout(gt.timer);if(gt&&gt.spans)gt.spans.forEach(s=>s.classList.remove('sel'));gt=null}
function gtContainer(el){return el.closest('.exde,.rootline,.chips')}
document.addEventListener('touchstart',e=>{
  const t=e.target.closest('.ptok');if(!t)return;
  gt={el:t,x0:e.touches[0].clientX,y0:e.touches[0].clientY,t0:Date.now(),moved:false,armed:false,spans:null,anchor:null,cont:gtContainer(t)};
  if(gt.cont){const all=[...gt.cont.querySelectorAll('.ptok')];if(all.length>1){gt.all=all;gt.anchor=all.indexOf(t);
    gt.timer=setTimeout(()=>{if(!gt||gt.moved)return;gt.armed=true;gt.spans=[t];t.classList.add('sel')},350)}}
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!gt)return;const x=e.touches[0].clientX,y=e.touches[0].clientY;
  const dx=x-gt.x0,dy=y-gt.y0,dist=Math.hypot(dx,dy);
  if(!gt.armed&&dist>24){gt.moved=true;if(gt.timer)clearTimeout(gt.timer)}
  if(gt.armed&&gt.all){const u=document.elementFromPoint(x,y);const s=u&&u.closest?u.closest('.ptok'):null;
    if(s&&gt.cont.contains(s)){const j=gt.all.indexOf(s);if(j>=0){const a=Math.min(gt.anchor,j),b=Math.max(gt.anchor,j);
      gt.all.forEach(el=>el.classList.remove('sel'));gt.spans=gt.all.slice(a,b+1);gt.spans.forEach(el=>el.classList.add('sel'))}}}
},{passive:true});
function gtEnd(e){
  if(!gt)return;const g=gt;const dt=Date.now()-g.t0;
  const moved=g.moved||(e.changedTouches&&Math.hypot(e.changedTouches[0].clientX-g.x0,e.changedTouches[0].clientY-g.y0)>10);
  lastTouchEl=g.el;lastTouchAt=Date.now();
  if(g.armed&&g.spans&&g.spans.length>1){const phrase=g.spans.map(s=>s.textContent).join(' ');gtReset();openPhrase(phrase);return}
  gtReset();
  if(!moved&&dt<250){const w=g.el.dataset.w;if(w)openSheet(w)}
}
document.addEventListener('touchend',gtEnd,{passive:true});
document.addEventListener('touchcancel',gtReset,{passive:true});
document.addEventListener('click',e=>{
  const t=e.target.closest('.ptok');if(!t)return;
  if(lastTouchEl&&t===lastTouchEl&&Date.now()-lastTouchAt<700)return; /* کلیک مصنوعی بعد از لمس */

});
/* سوایپ روی پوستر: چپ = بعدی، راست = قبلی (چیدمان راست‌به‌چپ)؛ مثل دکمه‌ها در امروز قفل می‌شود، به عقب نامحدود است */
let sw=null;
$('poster').addEventListener('touchstart',e=>{

$('poster').addEventListener('touchend',e=>{
  if(!sw)return;const s=sw;sw=null;
  if(!$('wsheet').hidden||!$('wphrase').hidden)return;
  const dx=e.changedTouches[0].clientX-s.x0,dy=e.changedTouches[0].clientY-s.y0;

/* نوار پایین: مخفی‌شدن خودکار با اسکرول، عین اپ اصلی — پایین‌رفتن بیش از ۴۰px مخفی، بالاآمدن بیش از ۴۰px آشکار، زیر ۹۰px همیشه آشکار؛ هنگام باز بودن ورق، تغییری نمی‌کند */
let wortLastToggleY=window.scrollY;
window.addEventListener('scroll',function(){
  var nav=document.getElementById('poofNav');if(!nav)return;
  var ws=document.getElementById('wsheet'),wp=document.getElementById('wphrase');
  if((ws&&!ws.hidden)||(wp&&!wp.hidden))return; /* ورق باز است: نوار سر جایش می‌ماند */

  else if(y<wortLastToggleY-40){nav.classList.remove('nav-hidden');wortLastToggleY=y}
},{passive:true});
render();
</script>

<script>
/* POOF position wiring (Part B): this page had NO resume marker, so PoofPos
   is its first restore path. section=day/random, cat=ISO date of the shown
   day, anchor=day index (dayIdx(view), or the random index ov), selected=
   open sheet word. The date clamp-forward rule is mirrored in the validator:
   a date after today is clamped to today (future calendar days are disabled
   in render() too); day indexes are clamped to 0..W.length-1 (365). */
(function(){
  if(!window.PoofPos) return;
  var PAGE='wort-des-tages.html';
  var wortGo=window.go, wortOpenSheet=window.openSheet;
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){
    try{ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    catch(e){ return ''; }
  }
  function parseISO(s){
    try{
      var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
      if(!m) return null;
      var d=new Date(+m[1], +m[2]-1, +m[3]);
      if(d.getFullYear()!==+m[1] || d.getMonth()!==+m[2]-1 || d.getDate()!==+m[3]) return null;
      return d;
    }catch(e){ return null; }
  }
  function y(){ try{ return Math.round(window.scrollY||0); }catch(e){ return 0; } }
  function sheetSelected(){
    try{
      var sh=document.getElementById('wsheet');
      if(sh && !sh.hidden){
        var t=document.getElementById('wsTitle');
        return t ? (t.textContent||'').trim() : '';
      }
    }catch(e){}
    return '';
  }
  function curPos(){
    try{
      var idx=(ov!==null) ? ov : dayIdx(view);
      var sel=sheetSelected();
      return window.PoofPos.make(PAGE, (ov!==null) ? 'random' : 'day', {
        cat: iso(view), anchor: String(idx),
        selected: sel, view: sel ? 'sheet' : '', scrollY: y()
      });
    }catch(e){ return null; }
  }
  function restoreScroll(pos){
    var t=(pos && typeof pos.scrollY==='number' && isFinite(pos.scrollY)) ? Math.round(pos.scrollY) : 0;
    if(!t) return;
    try{ requestAnimationFrame(function(){ try{ window.scrollTo(0,t); }catch(e){} }); }catch(e){}
    setTimeout(function(){ try{ window.scrollTo(0,t); }catch(e){} }, 350);
  }
  window.PoofPos.registerValidator(PAGE, function(pos){
    try{
      if(pos.section!=='day' && pos.section!=='random') pos.section='day';
      var d=parseISO(pos.cat), t=parseISO(iso(today));
      if(!d) d=t;
      if(d>t) d=t;
      pos.cat=iso(d);
      var max=W.length-1;
      if(pos.section==='random'){
        var ix=parseInt(pos.anchor,10);
        if(!isFinite(ix)) ix=0;
        pos.anchor=String(Math.min(Math.max(0,ix), max));
      } else {
        pos.anchor=String(dayIdx(d));
      }
      return pos;
    }catch(e){ return null; }
  });
  window.PoofPos.init({ page: PAGE, apply: function(pos){
    try{
      var d=parseISO(pos.cat) || today;
      if(pos.section==='random'){
        view=new Date(d);
        var ix=parseInt(pos.anchor,10);
        ov=isFinite(ix) ? ix : null;
        cm=view.getMonth(); cy=view.getFullYear();
        render();
      } else if(typeof wortGo==='function'){
        wortGo(d);
      }
      if(pos.selected && typeof wortOpenSheet==='function'){
        try{ wortOpenSheet(pos.selected); }catch(e){}
      }
      restoreScroll(pos);
    }catch(e){}
  }});
  window.addEventListener('scroll', function(){ var p=curPos(); if(p) window.PoofPos.saveSoon(p); }, {passive:true});
  var navBtns=document.querySelectorAll('#poofNav [data-tab]');
  navBtns.forEach(function(b){
    b.addEventListener('click', function(){ var p=curPos(); if(p) window.PoofPos.saveNow(p); });
  });
  var backLink=document.querySelector('.poof-back a');
  if(backLink) backLink.addEventListener('click', function(){ var p=curPos(); if(p) window.PoofPos.saveNow(p); });
  ['prev','next','tod','rnd'].forEach(function(id){
    var b=document.getElementById(id);
    if(b) b.addEventListener('click', function(){ setTimeout(function(){ var p=curPos(); if(p) window.PoofPos.go(p); }, 0); });
  });
  var grid=document.getElementById('grid');
  if(grid) grid.addEventListener('click', function(){ setTimeout(function(){ var p=curPos(); if(p) window.PoofPos.go(p); }, 0); });
  /* Sheet open is progress (track); sheet close is left alone on purpose:
     the close handlers may call history.back(), which a track/go here
     would fight. The next scroll or tap re-tracks the position. */
  document.addEventListener('click', function(e){
    var t=e.target && e.target.closest ? e.target.closest('.ptok') : null;
    if(t) setTimeout(function(){ var p=curPos(); if(p) window.PoofPos.track(p); }, 0);
  });
  document.addEventListener('click', function(e){
    var a=e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(a){ var p=curPos(); if(p) window.PoofPos.saveNow(p); }
  });
})();
</script>
