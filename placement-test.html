 const wjson=wrong.filter(e=>(e.skill==='v'||e.skill==='g'||e.skill==='w')&&e.q.answer!==null&&e.q.answer!==undefined).map(e=>({front:e.q.question,back:e.q.kind==='mc'?e.q.options[e.q.answer]:e.q.answer,context:e.q.explain}));store(KEYS.wrong,wjson);
 app.innerHTML=`<div class="card"><p class="mu center">سطح برآوردی تو</p><div class="badge" dir="ltr">${lev(ol)}</div><p class="center mu">CEFR کلی: <b dir="ltr">${lev(ol).split('.')[0]}</b></p><p>${DESCS[ol]}</p>
 <p class="mu">${answered} سؤال · ${pct}٪ پاسخ امتیازدار درست · ${unknown} بار «نمی‌دانم» · مدت ${fmt(secs)}</p>
 <p class="note">این یک برآورد آموزشی است، نه گواهی یا نتیجهٔ رسمی CEFR. خرده‌سطح‌های .1 و .2 نام‌گذاری آموزشی‌اند و سطح واقعی شش مهارت باید با آزمون استاندارد تأیید شود.</p>
 <h2>نمودار شش مهارت</h2>${each.map(x=>`<div class="sk"><div class="t"><span>${SK[x.k]} ${x.estimated?'<small>(برآورد)</small>':''}</span><span dir="ltr">${x.n<2?'شواهد ناکافی':lev(x.l)}</span></div><div class="b"><i style="width:${x.n<2?0:(x.l+1)*10}%"></i></div><div class="mu">${x.n} سؤال مؤثر ${x.n<3?'· اطمینان پایین':''}</div></div>`).join('')}
 ${uneven?'<div class="note attention"><b>پروفایل ناهموار:</b> اختلاف دست‌کم دو خرده‌سطح میان مهارت‌ها دیده می‌شود. بهتر است روی مهارت پایین‌تر تمرکز کنی؛ اختلاف مهارت‌ها طبیعی است.</div>':''}
 ${each.some(x=>x.n<3)?'<p class="note">دربارهٔ مهارت‌هایی که کمتر از سه سؤال معتبر دارند نباید نتیجهٔ قاطع گرفت؛ شنیداریِ خوانده‌شده جای شنیدن محاسبه نشده است.</p>':''}
 <h2>نقاط ضعف قابل مشاهده</h2>${weaklist.length?`<ul>${weaklist.map(([k,c])=>`<li>${safe(k)} — ${c} پاسخ نادرست</li>`).join('')}</ul>`:'<p class="mu">از پاسخ‌های ثبت‌شده ضعف موضوعی مشخصی پیدا نشد.</p>'}
 <h2>مسیر پیشنهادی سه‌مرحله‌ای</h2><ol>${steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol>
 <h2>مرور پاسخ‌های نادرست (${wrong.length})</h2>${wrong.length?`<details><summary>بازکردن اشتباه‌ها و توضیح فارسی</summary>${wrong.slice(0,60).map(e=>`<div class="mistake"><b>${safe(SK[e.skill])} · ${safe(e.q.level)}</b><p dir="ltr" lang="de">${safe(e.q.question)}</p><p>جواب تو: <span class="bad" dir="ltr">${safe(e.answer)}</span></p><p>جواب درست: <span class="good" dir="ltr">${safe(e.q.kind==='mc'?e.q.options[e.q.answer]:e.q.answer)}</span></p><p class="mu">${safe(e.q.explain)}</p></div>`).join('')}</details>`:'<p class="mu">اشتباهی برای مرور باقی نمانده است.</p>'}
 <h2>ابزارها</h2><div class="actions"><button class="btn" id="copy">کپی کارنامه</button><button class="btn s" id="export">خروجی JSON واژه‌ها و ساختارهای غلط</button><button class="btn s" id="reset">آزمون دوباره</button></div><textarea id="copybox" class="hide" readonly></textarea>
 </div>`;
 $('copy').onclick=()=>clip(report);$('export').onclick=()=>{const blob=new Blob([JSON.stringify(wjson,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutsche-fehlerkarteikarten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('reset').onclick=intro;
}
function boot(){const saved=read(KEYS.session,null);if(saved?.track==='de'){app.innerHTML=`<div class="card"><h2>آزمون نیمه‌تمام</h2><p>یک آزمون قبلی ذخیره شده است. می‌توانی از همان سؤال ادامه بدهی.</p><button class="btn" id="resume">ادامهٔ آزمون</button><button class="btn s" id="new">شروع از ابتدا</button></div>`;$('resume').onclick=resume;$('new').onclick=intro}else intro()}
boot();

</script>
</body></html>
