<script>
(function(){
var nav=document.getElementById('poofNav');
if(!nav)return;
function ptResumeSnapshot(){
try{
if(typeof window.__ptResumeSnapshot==='function'){
var s=window.__ptResumeSnapshot();
if(s&&s.track)return{track:s.track,section:s.skill||null,skill:s.skill||null,itemIndex:s.itemId||null,itemId:s.itemId||null,scrollY:window.scrollY};
}
}catch(e){}
var track='de';
try{var deBtn=document.getElementById('trackDE');if(deBtn&&!deBtn.classList.contains('on'))track='en';}catch(e){}
var itemId=null;
try{var sess=JSON.parse(window.localStorage.getItem('pt_session_'+track+'_v2')||'null');if(sess&&sess.index)itemId=sess.index;}catch(e){}
return{track:track,section:null,skill:null,itemIndex:itemId,itemId:itemId,scrollY:window.scrollY};
}
function ptSaveResume(){
try{window.localStorage.setItem('poof_practice_resume',JSON.stringify({page:'placement-test.html',state:ptResumeSnapshot(),ts:Date.now()}));}catch(e){}
}
nav.addEventListener('click',function(ev){
var b=ev.target&&ev.target.closest?ev.target.closest('[data-nav-tab]'):null;
if(!b)return;
try{ptSaveResume();}catch(e){}
var tab=b.getAttribute('data-nav-tab');
var textId=null;
if(tab==='read'){try{var prev=JSON.parse(window.localStorage.getItem('poof_last_state')||'null');if(prev&&prev.textId)textId=prev.textId;}catch(e){}}
try{window.localStorage.setItem('poof_last_state',JSON.stringify({tab:tab,scrollY:0,dictQ:'',textId:textId}));}catch(e){}
window.location.href='./';
});
var backLink=document.querySelector('.poof-back a');
if(backLink){backLink.addEventListener('click',function(){try{ptSaveResume();}catch(e){}});}
var sheet=document.getElementById('poofSelectSheet');
if(sheet&&window.MutationObserver){
var sync=function(){nav.classList.toggle('poof-nav-hidden',!sheet.classList.contains('hide'));};
new window.MutationObserver(sync).observe(sheet,{attributes:true,attributeFilter:['class']});
sync();
}
var lastToggleY=window.scrollY;
window.addEventListener('scroll',function(){
var y=window.scrollY;
var sh=document.getElementById('poofSelectSheet');
if(sh&&!sh.classList.contains('hide'))return;
if(y<=90){nav.classList.remove('nav-hidden');lastToggleY=y;}
else if(y>lastToggleY+40){nav.classList.add('nav-hidden');lastToggleY=y;}
else if(y<lastToggleY-40){nav.classList.remove('nav-hidden');lastToggleY=y;}
},{passive:true});
})();
</script>

/* POOF Select: tappable words in passages + meaning sheet + phrase selection (gestures mirror the main app) */
function selectTokenize(raw){
  const src=String(raw??'');
  let out='',last=0;
  const re=/[\p{L}\p{M}0-9]+(?:['’\-][\p{L}\p{M}0-9]+)*/gu;
  let m;
  while((m=re.exec(src))!==null){
    out+=safe(src.slice(last,m.index));
    out+='<span class="lk" data-w="'+safe(m[0])+'">'+safe(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  out+=safe(src.slice(last));
  return out.replace(/\n/g,'<br>');
}
function selectNorm(w){return TRACK==='en'?normalizeEnglish(w):normalize(w);}
function selectDict(){
  if(selectDict._t===TRACK&&selectDict._d)return selectDict._d;
  const d=new Map();
  const items=(BANKS[TRACK]&&BANKS[TRACK].v)||[];
  for(const it of items){
    if(!it||!it.word)continue;
    const key=selectNorm(it.word);
    if(!key||d.has(key))continue;
    let meaning=null,example=null;
    const ex=String(it.explain||'');
    const mm=ex.match(/«[^»]+»\s*(?:در این بافت\s*)?یعنی\s*«([^»]+)»/)||ex.match(/به معنای\s*«([^»]+)»/);
    if(mm)meaning=mm[1];
    if(!meaning&&Array.isArray(it.options)){
      const ans=it.options[Number(it.answer)];
      if(ans&&/[\u0600-\u06FF]/.test(String(ans)))meaning=String(ans);
    }
    const em=ex.match(/مثال:\s*(.+)$/);
    if(em)example=em[1].trim();
    d.set(key,{word:it.word,meaning:meaning,example:example});
  }
  selectDict._t=TRACK;selectDict._d=d;return d;
}
function selectLookup(word,nextWord){
  const d=selectDict();
  if(nextWord){
    const pk=selectNorm(word+' '+nextWord);
    if(d.has(pk))return d.get(pk);

  return d.get(selectNorm(word))||null;
}

let selectPress=null;
function selectCancelPress(){if(selectPress&&selectPress.timer)clearTimeout(selectPress.timer);selectPress=null;}
document.addEventListener('touchstart',e=>{
  const t=e.target.closest?e.target.closest('.lk'):null;
  if(!t)return;
  selectCancelPress();
  const touch=e.changedTouches[0];
  const container=t.closest('.passage');
  const spans=container?Array.from(container.querySelectorAll('.lk')):[t];
  selectPress={start:t,container:container,spans:spans,startX:touch.clientX,startY:touch.clientY,startT:Date.now(),maxDist:0,armed:false,selecting:false,timer:null,endIdx:-1};
  selectPress.timer=setTimeout(()=>{
    if(!selectPress)return;
    selectPress.armed=true;selectPress.selecting=true;
    selectClearPhrase();
    selectPress.start.classList.add('phrase-sel');
    selectPress.endIdx=selectPress.spans.indexOf(selectPress.start);
  },350);
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!selectPress)return;
  const touch=e.changedTouches[0];
  const dx=touch.clientX-selectPress.startX,dy=touch.clientY-selectPress.startY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>selectPress.maxDist)selectPress.maxDist=dist;
  if(!selectPress.armed){
    if(dist>24){selectCancelPress();}
    return;
  }
  e.preventDefault();
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  const span=el&&el.closest?el.closest('.lk'):null;
  if(!span||!selectPress.container||!selectPress.container.contains(span))return;
  const a=selectPress.spans.indexOf(selectPress.start),b=selectPress.spans.indexOf(span);
  if(a<0||b<0)return;
  const lo=Math.min(a,b),hi=Math.max(a,b);
  selectPress.spans.forEach((s,i)=>s.classList.toggle('phrase-sel',i>=lo&&i<=hi));
  selectPress.endIdx=b;
},{passive:false});
function selectFinishTouch(){
  if(!selectPress)return;
  const pr=selectPress;
  if(pr.timer)clearTimeout(pr.timer);
  selectPress=null;
  const dur=Date.now()-pr.startT;
  if(pr.selecting){
    const a=pr.spans.indexOf(pr.start),b=(pr.endIdx>=0?pr.endIdx:a);
    const lo=Math.min(a,b),hi=Math.max(a,b);
    const phrase=pr.spans.slice(lo,hi+1).map(s=>s.textContent).join(' ');
    selectSuppressUntil=Date.now()+80;
    selectLastTouchEnd=Date.now();
    selectOpenPhrase(phrase);
    return;
  }
  if(dur<250&&pr.maxDist<10){
    const idx=pr.spans.indexOf(pr.start);
    const next=(idx>=0&&idx+1<pr.spans.length)?pr.spans[idx+1].textContent:null;
    selectLastTouchEnd=Date.now();
    selectOpenWord(pr.start.textContent,next);
  }

document.addEventListener('touchend',selectFinishTouch);
document.addEventListener('touchcancel',()=>{selectCancelPress();});
document.addEventListener('click',e=>{
  const t=e.target.closest?e.target.closest('.lk'):null;
  if(!t)return;
  if(Date.now()<selectSuppressUntil){e.preventDefault();e.stopPropagation();return;}
  if(Date.now()-selectLastTouchEnd<600)return;
  const container=t.closest('.passage');
  const spans=container?Array.from(container.querySelectorAll('.lk')):[];
  const idx=spans.indexOf(t);
  const next=(idx>=0&&idx+1<spans.length)?spans[idx+1].textContent:null;
  selectOpenWord(t.textContent,next);
});

 const wjson=wrong.filter(e=>(e.skill==='v'||e.skill==='g'||e.skill==='w')&&e.q.answer!==null&&e.q.answer!==undefined).map(e=>({front:e.q.question,back:e.q.kind==='mc'?e.q.options[e.q.answer]:e.q.answer,context:e.q.explain,...(TRACK==='en'?{lang:'en'}:{})}));store(activeKeys().wrong,wjson);
 app.innerHTML=`<div class="card"><p class="mu center">سطح برآوردی تو</p><div class="badge" dir="ltr">${lev(ol)}</div><p class="center mu">CEFR کلی: <b dir="ltr">${lev(ol).split('.')[0]}</b></p><p>${DESCS[ol]}</p>
 <p class="mu">${answered} سؤال · ${pct}٪ پاسخ امتیازدار درست · ${unknown} بار «نمی‌دانم» · مدت ${fmt(secs)}</p>
 <p class="note">این یک برآورد آموزشی است، نه گواهی یا نتیجهٔ رسمی CEFR. خرده‌سطح‌های .1 و .2 نام‌گذاری آموزشی‌اند و سطح واقعی شش مهارت باید با آزمون استاندارد تأیید شود.</p>
 <h2>نمودار شش مهارت</h2>${each.map(x=>`<div class="sk"><div class="t"><span>${SK[x.k]} ${x.estimated?'<small>(برآورد)</small>':''}</span><span dir="ltr">${x.n<2?'شواهد ناکافی':lev(x.l)}</span></div><div class="b"><i style="width:${x.n<2?0:(x.l+1)*10}%"></i></div><div class="mu">${x.n} سؤال مؤثر ${x.n<3?'· اطمینان پایین':''}</div></div>`).join('')}
 ${uneven?'<div class="note attention"><b>پروفایل ناهموار:</b> اختلاف دست‌کم دو خرده‌سطح میان مهارت‌ها دیده می‌شود. بهتر است روی مهارت پایین‌تر تمرکز کنی؛ اختلاف مهارت‌ها طبیعی است.</div>':''}
 ${each.some(x=>x.n<3)?'<p class="note">دربارهٔ مهارت‌هایی که کمتر از سه سؤال معتبر دارند نباید نتیجهٔ قاطع گرفت؛ شنیداریِ خوانده‌شده جای شنیدن محاسبه نشده است.</p>':''}
 <h2>نقاط ضعف قابل مشاهده</h2>${weaklist.length?`<ul>${weaklist.map(([k,c])=>`<li>${safe(k)} — ${c} پاسخ نادرست</li>`).join('')}</ul>`:'<p class="mu">از پاسخ‌های ثبت‌شده ضعف موضوعی مشخصی پیدا نشد.</p>'}
 <h2>مسیر پیشنهادی سه‌مرحله‌ای</h2><ol>${steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol>
 <h2>مرور پاسخ‌های نادرست (${wrong.length})</h2>${wrong.length?`<details><summary>بازکردن اشتباه‌ها و توضیح فارسی</summary>${wrong.slice(0,60).map(e=>`<div class="mistake"><b>${safe(SK[e.skill])} · ${safe(e.q.level)}</b><p dir="ltr" lang="${TRACK}">${safe(e.q.question)}</p><p>جواب تو: <span class="bad" dir="ltr">${safe(e.answer)}</span></p><p>جواب درست: <span class="good" dir="ltr">${safe(e.q.kind==='mc'?e.q.options[e.q.answer]:e.q.answer)}</span></p><p class="mu">${safe(e.q.explain)}</p></div>`).join('')}</details>`:'<p class="mu">اشتباهی برای مرور باقی نمانده است.</p>'}
 <h2>ابزارها</h2><div class="actions"><button class="btn" id="copy">کپی کارنامه</button><button class="btn s" id="export">خروجی JSON واژه‌ها و ساختارهای غلط</button><button class="btn s" id="reset">آزمون دوباره</button></div><textarea id="copybox" class="hide" readonly></textarea>
 </div>`;
 $('copy').onclick=()=>clip(report);$('export').onclick=()=>{const blob=new Blob([JSON.stringify(wjson,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TRACK==='de'?'deutsche-fehlerkarteikarten.json':'english-error-flashcards.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('reset').onclick=intro;
}
function boot(){const saved=read(activeKeys().session,null);if(saved?.track===TRACK){app.innerHTML=`<div class="card"><h2>آزمون نیمه‌تمام</h2><p>یک آزمون قبلی ذخیره شده است. می‌توانی از همان سؤال ادامه بدهی.</p><button class="btn" id="resume">ادامهٔ آزمون</button><button class="btn s" id="new">شروع از ابتدا</button></div>`;$('resume').onclick=resume;$('new').onclick=intro}else intro()}
function switchTrack(to){if(to!=='de'&&to!=='en')return;stopAudio();clearInterval(ticker);S=null;TRACK=to;byId=Object.fromEntries(Object.values(BANKS[TRACK]).flat().map(x=>[x.id,x]));$('trackDE').classList.toggle('on',TRACK==='de');$('trackEN').classList.toggle('on',TRACK==='en');$('trackDE').setAttribute('aria-pressed',String(TRACK==='de'));$('trackEN').setAttribute('aria-pressed',String(TRACK==='en'));refreshVoices();boot()}
$('trackDE').onclick=()=>switchTrack('de');
$('trackEN').onclick=()=>switchTrack('en');
function applyTheme(){let t;try{t=JSON.parse(localStorage.getItem('poof_v2')||'{}').theme==='snowy'?'snowy':'classic'}catch(e){t='classic'}document.documentElement.dataset.theme=t;const tc=document.getElementById('themeCss');if(tc){const f='theme-'+t+'.css?v=15';if(!tc.href.endsWith(f))tc.href=f}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='snowy'?'#081421':'#111111';document.querySelectorAll('[data-th]').forEach(b=>{b.classList.toggle('on',b.dataset.th===t);b.setAttribute('aria-pressed',String(b.dataset.th===t))})}
document.querySelectorAll('[data-th]').forEach(b=>{b.onclick=()=>{try{const cur=JSON.parse(localStorage.getItem('poof_v2')||'{}');cur.theme=b.dataset.th;localStorage.setItem('poof_v2',JSON.stringify(cur))}catch(e){localStorage.setItem('poof_v2',JSON.stringify({theme:b.dataset.th}))}applyTheme()}});
applyTheme();
var __ptResumeMatched=false,__ptResumeState=null;
try{var __ptMarker=JSON.parse(window.localStorage.getItem('poof_practice_resume')||'null');if(__ptMarker&&__ptMarker.page==='placement-test.html'){__ptResumeMatched=true;__ptResumeState=(__ptMarker&&__ptMarker.state)?__ptMarker.state:null;}}catch(e){}
if(__ptResumeMatched){
var __ptRestored=false;
try{__ptRestored=ptRestoreResume(__ptResumeState);}catch(e){__ptRestored=false;}
try{window.localStorage.removeItem('poof_practice_resume');}catch(e){}
if(!__ptRestored)boot();
}else boot();

</script>
