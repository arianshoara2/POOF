px}.count.ok{color:#217d62}.count.no{color:#aa502e}.timer{font-variant-numeric:tabular-nums;direction:ltr;font-size:23px;font-weight:800;background:#eff5f5;border-radius:10px;padding:4px 13px;display:inline-block}.timer.low{color:#a74a33;background:#fff2e9}.texttable{width:100%;border-collapse:collapse;direction:ltr;text-align:left;margin:12px 0;font:14px Arial,sans-serif}.texttable th,.texttable td{padding:9px;border:1px solid #c9d8df}.texttable th{background:#e9f3f5}.barchart{direction:ltr;margin:18px 0;border:1px solid #d7e5e5;padding:15px;border-radius:13px}.barrow{padding:5px 0;border-bottom:1px solid #eef2f3}.barrow:last-child{border-bottom:0}.barname{font-size:13px;font-weight:700;line-height:1.4}.bartrack{height:13px;background:#eaf0f2;border-radius:4px;overflow:hidden;margin:4px 0;position:relative}.barfill{height:100%;background:#26939b;border-radius:4px}.barfill.s1{background:#547cae}.barfill.s2{background:#bc9270}.barcaption{display:flex;justify-content:space-between;gap:5px;align-items:center;font-size:11px;color:#506575}.hidden{display:none!important}.note{border-right:4px solid #719ba0;background:#f1f7f7;border-radius:10px;padding:13px;margin:11px 0}.warn{border-right-color:#c18d38;background:#fff7e9}.rubric{display:grid;grid-template-columns:1fr 1fr;gap:11px}.rubric label{border:1px solid var(--line);padding:11px;border-radius:10px;display:block;font-size:12px}.rubric select{display:block;width:100%;border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff;margin-top:7px}.model{white-space:pre-line;font-size:15px}.biling{border-bottom:1px solid #edf1f3;padding:9px 0}.biling .de{font-weight:700}.quiz{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}.quiz .option{display:block;margin:7px 0;line-height:1.7;direction:ltr;text-align:left;font-family:Arial,sans-serif;font-size:14px;font-weight:400;width:100%}.quiz .option.selected{background:#e2f2ee;border-color:#5da99a}.quiz .option.good{background:#e1f3e9;border-color:#4b9e68}.quiz .option.bad{background:#fff0ed;border-color:#d89785}.quiz .explain{background:#f5f9fa;padding:10px;border-radius:8px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.divider{height:1px;background:var(--line);margin:22px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.set-card{display:block;text-align:right;border-radius:15px;border:1px solid #d1e2e3;background:#fff;padding:20px;transition:transform .2s}.set-card:hover{transform:translateY(-2px)}.set-card strong{display:block;font-size:17px;margin:6px 0}.set-card small{font-size:12px;color:var(--muted);display:block}.progress{height:9px;background:#e4ebee;overflow:hidden;border-radius:30px}.progress>span{display:block;height:100%;background:#2b9c82}.footer{font-size:12px;color:var(--muted);margin-top:38px}.footer a{color:#1c6875}.key{border:1px solid #d8e9e6;border-radius:12px;padding:15px;margin:10px 0;background:#f8fcfb}a{color:#135f75}details{background:#f9fbfc;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}summary{cursor:pointer;font-weight:700}code{direction:ltr;display:inline-block}#toast{position:fixed;bottom:17px;left:17px;background:#173f55;color:#fff;padding:10px 16px;border-radius:9px;max-width:320px;font-size:13px;z-index:50;display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.results{margin:15px 0;background:#f5faf8;padding:16px;border-radius:12px}.english-num{direction:ltr;display:inline-block}.bigcta{width:100%;padding:14px;font-size:16px}.backtop{position:fixed;left:15px;bottom:15px;z-index:5;background:#fff;border-radius:50%;height:42px;width:42px;padding:0}.no-print{}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:17px}.sidebar p,.side-bottom{display:none}.sidebar .section-label{margin:12px 0 5px}.side-nav{display:flex;flex-wrap:wrap;gap:4px}.side-btn{width:auto;font-size:12px;margin:2px;padding:8px 10px}.main{padding:15px 14px 60px}.hero{padding:20px}.hero h2{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards,.grid2,.rubric{grid-template-columns:1fr}.panel{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.taskbox textarea{min-height:280px}.hero{border-radius:12px}.barname{font-size:12px}}@media print{body{background:white}.sidebar,.no-print,.actions,.toolbar,.backtop{display:none!important}.layout{display:block}.main{max-width:none}.panel,.hero{box-shadow:none;break-inside:avoid}.model{white-space:pre-line}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo">Digital TestDaF · EXTRA</div><h1>پارت ۳: Schreiben</h1><p>بانک مستقل نوشتن دیجیتال، شش آزمون دو‌بخشی و کلینیک تشخیص خطا. تک‌فایل، آفلاین و مناسب GitHub.</p><div class="section-label">مسیر یادگیری</div><div class="side-nav"><button class="side-btn active" data-nav="home">خانه و راهنما</button><button class="side-btn" data-nav="sets">انتخاب آزمون‌ها</button><button class="side-btn" data-nav="clinic">کلینیک ۱۶ خطا</button><button class="side-btn" data-nav="answers">پاسخ‌نامهٔ تشریحی</button><button class="side-btn" data-nav="phrases">عبارت‌ها و معیارها</button><button class="side-btn" data-nav="export">خروجی پاسخ‌ها</button></div><div class="section-label">ست‌های تمرین</div><div id="sideSets" class="side-nav"></div><div class="side-bottom">ساخته‌شده بدون کتابخانهٔ بیرونی، بدون فونت آنلاین، بدون صوت خارجی.<br><strong>نمرهٔ خودارزیابی = نمرهٔ رسمی TDN نیست.</strong></div></aside><main class="main" id="main"></main></div><button class="backtop no-print" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="برو بالا">↑</button><div id="toast" aria-live="polite"></div><script id="datastore" type="application/json">{"sets":[{"code":"A","title":"Offene Forschungsdaten und Lernposter","topic":"Wissenschaft & Studienalltag","argument":"In einem interdisziplinären Forschungsseminar diskutieren Sie mit Ihrer Dozentin und anderen Studierenden darüber, ob Hochschulen die Daten aus öffentlich finanzierten Forschungsprojekten möglichst frei zugänglich machen sollten.\n\nSchreiben Sie einen Beitrag für die Lernplattform. Erläutern Sie die Chancen und Risiken einer solchen Regelung für Nachwuchsforschende und für Hochschulen. Berücksichtigen Sie dabei auch Datenschutz und wissenschaftliche Nachprüfbarkeit. Nehmen Sie abschließend begründet Stellung.\n\nSchreiben Sie mindestens 200 Wörter. Sie haben 30 Minuten Zeit.","essay":"Ob Hochschulen ihre Forschungsdaten grundsätzlich öffentlich zugänglich machen sollten, wird zunehmend diskutiert. Eine solche Öffnung kann die Wissenschaft transparenter machen, wirft aber zugleich praktische und rechtliche Fragen auf.\n\nFür Nachwuchsforschende bieten frei verfügbare Datensätze erhebliche Chancen. Wer nicht über ein großes Budget verfügt, kann vorhandenes Material auswerten und eigene Fragestellungen entwickeln. Außerdem lassen sich Ergebnisse leichter überprüfen, wenn andere Forschende die verwendeten Daten nachvollziehen können. Dadurch könnten Fehler früher erkannt und unnötige Wiederholungen vermieden werden.\n\nAllerdings wäre eine uneingeschränkte Veröffentlichung problematisch. Gerade Daten aus medizinischen Befragungen können sensible Angaben enthalten. Selbst wenn Namen entfernt werden, besteht unter bestimmten Umständen das Risiko, einzelne Personen wiederzuerkennen. Hinzu kommt, dass die sorgfältige Dokumentation und Aufbereitung von Daten Zeit kostet. Für Hochschulen bedeutet dies zusätzliche finanzielle und organisatorische Aufgaben. Auch junge Wissenschaftlerinnen und Wissenschaftler könnten Nachteile haben, wenn andere ihre aufwendig erhobenen Daten nutzen, bevor sie selbst zentrale Ergebnisse veröffentlicht haben.\n\nMeiner Ansicht nach sollten öffentlich finanzierte Daten deshalb grundsätzlich geteilt werden, allerdings nicht ohne klare Regeln. Personenbezogene Informationen müssten ausreichend geschützt und sensible Datensätze gegebenenfalls nur auf Antrag zugänglich gemacht werden. Gleichzeitig sollten Forschende verpflichtet sein, Herkunft und Grenzen der Daten transparent zu dokumentieren. Eine faire Anerkennung der ursprünglichen Forschungsarbeit wäre ebenfalls wichtig.\n\nInsgesamt halte ich einen geregelten Zugang für sinnvoller als entweder vollständige Geheimhaltung oder uneingeschränkte Veröffentlichung. So ließen sich Offenheit und Verantwortung miteinander verbinden.","essay_fa":"این متن ابتدا مسئله را معرفی می‌کند؛ سپس فرصت‌ها برای پژوهشگران جوان، مزایای بازبینی علمی، خطرهای حریم خصوصی و هزینه‌های دانشگاه را می‌سنجد. در پایان به‌جای موضع مطلق، مدل «دسترسی قاعده‌مند» را پیشنهاد می‌کند. ","essay_notes":["پوشش هر دو گروهِ Nachwuchsforschende و Hochschulen؛ فقط دربارهٔ دانشجویان ننویس.","تفاوت anonymisieren و خطر بازشناسایی را محتاطانه بیان کن؛ قطعیت ناموجه نساز.","از ساختار «grundsätzlich … allerdings nicht ohne …» برای موضع مشروط استفاده کن.","نتیجه، تصمیم روشن است؛ تکرار مقدمه نیست."],"summary_question":"In einem Seminar zur Wissenschaftskommunikation schreiben Sie einen Abschnitt über diese Frage: Welche Wirkung haben unterschiedliche Posterformate auf das Verstehen wissenschaftlicher Ergebnisse? Fassen Sie die wichtigsten Informationen aus Text und Grafik in eigenen Worten zusammen. Fügen Sie keine eigene Meinung hinzu. Schreiben Sie ca. 100–150 Wörter. Sie haben 30 Minuten Zeit.","source":"An einer fiktiven Modellhochschule wurden drei Formate wissenschaftlicher Poster getestet. Insgesamt 180 Studierende sahen jeweils nur eines der Formate: ein textreiches Poster, ein Poster mit Grafiken und knappen Erläuterungen oder ein interaktives Poster mit digital abrufbaren Zusatzinformationen. Direkt nach der Betrachtung beantworteten sie Fragen zu den zentralen Ergebnissen und zum Aufbau der Untersuchung.\n\nIn den Rückmeldungen wurde deutlich, dass eine größere Menge an Informationen nicht automatisch zu einem besseren Verständnis führt. Vor allem bei textreichen Postern übersahen Teilnehmende häufig die zentrale Aussage. Grafiken mit kurzen Erläuterungen erleichterten dagegen die Orientierung. Die interaktive Variante ermöglichte vertiefende Informationen, verlangte aber zusätzliche Zeit und eine funktionierende technische Ausstattung.\n\nDie Ergebnisse zeigen keine langfristigen Lerneffekte, weil ausschließlich das unmittelbare Verständnis gemessen wurde. Auch waren die Teilnehmenden nicht gleichmäßig auf alle Studienfächer verteilt. Die Autoren empfehlen deshalb, das Format an Zielgruppe und Nutzungssituation anzupassen, statt eine einzige Variante als grundsätzlich überlegen zu betrachten.","rows":[["Textreiches Poster",54],["Grafik + Kurztext",78],["Interaktives Poster",70]],"summary":"An einer Modellhochschule wurde untersucht, wie gut Studierende Informationen aus drei wissenschaftlichen Posterformaten unmittelbar verstehen. Die Grafik zeigt, dass 78 Prozent der Befragten bei Postern mit Grafiken und kurzen Erläuterungen die wichtigsten Fragen richtig beantworteten. Bei interaktiven Postern waren es 70 Prozent, bei textreichen Varianten nur 54 Prozent.\n\nDer begleitende Text erklärt, dass umfangreiche Informationen nicht zwangsläufig das Verständnis verbessern. Visuelle Darstellungen können die Orientierung erleichtern, während interaktive Angebote mehr Vertiefung erlauben, jedoch Zeit und technische Ausstattung voraussetzen. Die Untersuchung erfasst nur das unmittelbare Verständnis und erlaubt daher keine Aussagen über langfristige Lernerfolge. Zudem waren die Studienfächer ungleich vertreten. Insgesamt sprechen die Ergebnisse für eine situationsabhängige Gestaltung wissenschaftlicher Poster.","summary_fa":"خلاصه باید سؤال «تأثیر قالب بر فهم فوری» را پاسخ دهد، هر سه عدد را درست به قالب‌ها نسبت دهد و محدودیت پژوهش را حفظ کند. این داده‌ها برای تمرین ساخته شده‌اند، نه آمار واقعی دانشگاه. ","summary_notes":["از ۷۸٪ نمی‌توان نتیجه گرفت ۷۸٪ دانشجویان «برای همیشه» بهتر یاد می‌گیرند.","مقایسهٔ ۷۸ و ۵۴ = ۲۴ واحد درصد، نه ۲۴ درصد افزایش نسبی.","متن دربارهٔ توزیع نامتوازن رشته‌ها هشدار می‌دهد؛ آن را تعمیم سراسری نکن."],"trap":"تلهٔ اصلی: «بیشترین فهم فوری» با «بهترین یادگیری بلندمدت» یکسان نیست.","essay_translation":"این موضوع که آیا دانشگاه‌ها باید داده‌های پژوهشی خود را اصولاً در دسترس عموم قرار دهند، بیشتر مورد بحث قرار می‌گیرد. این گشودگی می‌تواند علم را شفاف‌تر کند، اما هم‌زمان پرسش‌های اجرایی و حقوقی ایجاد می‌کند.\n\nبرای پژوهشگران جوان، مجموعه‌داده‌های آزاد فرصت‌های مهمی فراهم می‌آورند. کسانی که بودجهٔ بزرگی ندارند می‌توانند داده‌های موجود را تحلیل کرده و پرسش‌های پژوهشی تازه طراحی کنند. به‌علاوه، هنگامی که دیگر پژوهشگران بتوانند داده‌های استفاده‌شده را بررسی کنند، بازبینی نتایج آسان‌تر می‌شود؛ در نتیجه خطاها زودتر شناسایی و تکرارهای غیرضروری کمتر می‌شوند.\n\nبااین‌حال، انتشار بی‌قیدوشرط مشکل‌ساز است. داده‌های نظرسنجی پزشکی ممکن است حاوی اطلاعات حساس باشند. حتی با حذف نام‌ها گاهی خطر شناسایی دوبارهٔ افراد وجود دارد. مستندسازی و آماده‌سازی درست داده‌ها نیز زمان‌بر و برای دانشگاه‌ها هزینه‌آور است. پژوهشگران جوان ممکن است از انتشار داده‌هایی که با زحمت جمع کرده‌اند پیش از انتشار یافته‌های خودشان زیان ببینند.\n\nاز نظر من، داده‌هایی که از بودجهٔ عمومی تهیه شده‌اند اصولاً باید به اشتراک گذاشته شوند، اما با قواعد روشن. اطلاعات شخصی باید محافظت شوند و برای داده‌های حساس دسترسی محدود به درخواست امکان‌پذیر باشد. علاوه بر این، خاستگاه و محدودیت داده‌ها باید روشن ثبت شود و به کار پژوهشگران اولیه اعتبار منصفانه داده شود.\n\nدر مجموع، دسترسی قاعده‌مند را منطقی‌تر از پنهان‌کاری کامل یا انتشار نامحدود می‌دانم؛ به این ترتیب می‌توان شفافیت و مسئولیت‌پذیری را با هم حفظ کرد.","summary_translation":"در یک دانشگاه فرضی بررسی شد که دانشجویان اطلاعات سه نوع پوستر علمی را بلافاصله پس از مشاهده چقدر خوب می‌فهمند. طبق نمودار، در پوسترهای دارای نمودار و توضیح کوتاه، ۷۸ درصد پرسش‌های اصلی درست پاسخ داده شد. این میزان برای پوستر تعاملی ۷۰ درصد و پوستر متنی ۵۴ درصد بود.\n\nمتن توضیح می‌دهد که فراوانی اطلاعات لزوماً فهم را بهتر نمی‌کند. نمایش دیداری جهت‌یابی را آسان می‌کند، درحالی‌که قالب تعاملی امکان پرداختن عمیق‌تر به موضوع را می‌دهد، اما به زمان و تجهیزات نیاز دارد. چون فقط فهم فوری سنجیده شده، نتیجه‌ای دربارهٔ یادگیری بلندمدت نمی‌توان گرفت. همچنین رشته‌های تحصیلی به‌طور برابر در نمونه حضور نداشتند. بنابراین نتایج از انتخاب قالب متناسب با موقعیت حمایت می‌کنند."},{"code":"B","title":"Peer-Feedback und Erstsemester-Mentoring","topic":"Lehrgestaltung & Chancengleichheit","argument":"In einem Hochschulseminar wird diskutiert, ob alle Studierenden verpflichtet werden sollten, die Entwürfe ihrer Kommilitoninnen und Kommilitonen schriftlich zu kommentieren.\n\nVerfassen Sie einen Beitrag für die Seminarplattform. Erörtern Sie mögliche Vor- und Nachteile verpflichtenden Peer-Feedbacks für Lernende und Lehrende. Gehen Sie auf die Qualität der Rückmeldungen sowie den zusätzlichen Zeitaufwand ein. Entwickeln Sie eine begründete Position.\n\nSchreiben Sie mindestens 200 Wörter. Sie haben 30 Minuten Zeit.","essay":"In vielen Seminaren wird überlegt, schriftliches Peer-Feedback zu einem verpflichtenden Bestandteil der Studienleistung zu machen. Damit könnten Studierende nicht nur von Lehrenden, sondern auch voneinander lernen. Allerdings hängt der Nutzen stark von der Umsetzung ab.\n\nEin Vorteil besteht darin, dass man beim Lesen fremder Entwürfe die eigenen Schreibentscheidungen bewusster wahrnimmt. Wer begründen muss, warum ein Argument unklar ist, entwickelt häufig auch mehr Aufmerksamkeit für die Struktur eigener Texte. Für Lehrende können zusätzliche Rückmeldungen hilfreich sein, weil Studierende bereits vor der endgültigen Abgabe Hinweise zur Verständlichkeit erhalten.\n\nProblematisch ist jedoch, dass nicht alle Teilnehmenden über ausreichende Erfahrung verfügen, um fachlich zuverlässige Kritik zu formulieren. Oberflächliche Kommentare wie „gut geschrieben“ helfen kaum weiter. Umgekehrt können ungenaue oder übermäßig harte Rückmeldungen verunsichern. Außerdem müssen Studierende Zeit für die Texte anderer aufbringen, während Lehrende die Feedbackregeln erklären und ihre Einhaltung überprüfen müssen. Eine verpflichtende Aufgabe ohne Anleitung könnte deshalb vor allem zusätzlichen Arbeitsdruck erzeugen.\n\nMeiner Auffassung nach ist Peer-Feedback sinnvoll, wenn die Pflicht mit klaren Kriterien verbunden wird. Beispielsweise könnten Rückmeldungen ausdrücklich zwischen Aufbau, Argumentation und sprachlicher Verständlichkeit unterscheiden. Eine kurze Einführung und ein Musterkommentar wären notwendig. Außerdem sollte der Umfang begrenzt bleiben, damit die Aufgabe nicht zulasten anderer Studienleistungen geht.\n\nIch befürworte daher keine uneingeschränkte Pflicht, sondern ein angeleitetes, zeitlich überschaubares Feedbackverfahren. Dann kann die Zusammenarbeit tatsächlich zum Lernen beitragen.","essay_fa":"موضع متن «بله، اما با طراحی آموزشی درست» است. برای دانشجو، فایدهٔ خودآگاهی در نوشتن و خطر بازخورد کم‌کیفیت را می‌گوید؛ برای استاد، مزیت مشارکت و هزینهٔ نظارت را بررسی می‌کند. ","essay_notes":["یکسان ندانستن Peer-Feedback و تصحیح تخصصی استاد.","در تحلیل مزایا و معایب، نقش دو طرف را جدا نگه دار.","از الگوی «nicht … sondern …» برای نتیجه‌گیری دقیق بهره ببر.","دلیلِ «الزام با معیار مشخص» با مشکل کیفیت بازخورد ارتباط مستقیم دارد."],"summary_question":"In einer Hausarbeit über den Studienbeginn untersuchen Sie: Welche Veränderungen zeigen sich nach der Einführung eines freiwilligen Mentoringprogramms für Erstsemester? Fassen Sie Text und Grafik sachlich zusammen. Verwenden Sie eigene Worte. Schreiben Sie ca. 100–150 Wörter. Sie haben 30 Minuten Zeit.","source":"Eine fiktive Fachhochschule hat ein freiwilliges Mentoringprogramm für Studienanfänger eingeführt. Ältere Studierende begleiteten kleine Gruppen während der ersten acht Wochen, erklärten organisatorische Abläufe und vermittelten Kontakte zu Beratungsstellen. Um mögliche Veränderungen zu untersuchen, wurden zwei aufeinanderfolgende Studienjahrgänge jeweils am Ende des ersten Semesters befragt.\n\nDer Bericht beschreibt, dass sich Teilnehmende des neuen Programms häufiger zutrauten, bei Schwierigkeiten rechtzeitig Unterstützung zu suchen. Gleichzeitig wird ausdrücklich darauf hingewiesen, dass das Mentoring nicht die einzige Veränderung zwischen den Jahrgängen war: Die Hochschule hatte außerdem ihre Einführungsveranstaltungen erweitert.\n\nDie Grafik vergleicht den Anteil der Befragten, die auf drei Aussagen mit „trifft zu“ antworteten. Es handelt sich nicht um Messungen der tatsächlichen Studienleistungen. Weil die Teilnahme am Mentoring freiwillig war und unterschiedliche Jahrgänge verglichen wurden, lässt sich aus den Daten kein eindeutiger kausaler Effekt des Programms ableiten.","rows":[["Wissen, wo Hilfe erhältlich ist",52,74],["Kontakt zu Mitstudierenden",61,79],["Sicherheit bei Studienplanung",48,65]],"summary":"An einer Modellhochschule wurde nach Einführung eines freiwilligen Mentoringprogramms untersucht, wie Erstsemester ihren Studienbeginn einschätzen. Laut Text unterstützten ältere Studierende kleine Gruppen acht Wochen lang und informierten über organisatorische Abläufe sowie Beratungsangebote.\n\nDie Grafik zeigt in drei Bereichen höhere Zustimmungswerte im späteren Jahrgang: Das Wissen über Hilfsangebote stieg von 52 auf 74 Prozent, der wahrgenommene Kontakt zu Mitstudierenden von 61 auf 79 Prozent und die Sicherheit bei der Studienplanung von 48 auf 65 Prozent. Die Werte beruhen auf Selbstauskünften, nicht auf objektiven Leistungsdaten. Außerdem wurden verschiedene Jahrgänge verglichen, und parallel fanden erweiterte Einführungsveranstaltungen statt. Deshalb können die Veränderungen nicht ausschließlich auf das Mentoring zurückgeführt werden.","summary_fa":"باید اختلاف بین «پاسخ نظرسنجی» و «اثر اثبات‌شدهٔ برنامه» را حفظ کنی. دو سال/گروه متفاوت‌اند و برنامه‌های معارفه نیز تغییر کرده‌اند. این مانع نسبت‌دادن قطعی علت به Mentoring می‌شود. ","summary_notes":["کلمات «freiwillig» و «verschiedene Jahrgänge» را حذف نکن.","افزایش ۵۲ به ۷۴ برابر ۲۲ واحد درصد است.","جملهٔ «Das Mentoring hat nachweislich die Leistungen verbessert» از منابع پشتیبانی نمی‌شود."],"trap":"تلهٔ اصلی: افزایش گزارش‌شده با اثبات اثر علّی یک برنامه یکی نیست.","essay_translation":"در بسیاری از سمینارها این پیشنهاد مطرح است که بازخورد نوشتاری هم‌دانشجویان بخشی اجباری از فعالیت درسی باشد. این روش می‌تواند یادگیری جمعی را تقویت کند، اما فایدهٔ آن به شیوهٔ اجرا بستگی دارد.\n\nیکی از مزیت‌ها این است که خواندن پیش‌نویس‌های دیگران، توجه فرد را به انتخاب‌های خودش در نوشتن بیشتر می‌کند. وقتی باید توضیح دهی چرا استدلال دیگری مبهم است، ساختار متن خودت را هم آگاهانه‌تر بررسی می‌کنی. استادان نیز از بازخورد زودهنگام سود می‌برند، زیرا دانشجویان پیش از تحویل نهایی پیشنهادهایی برای بهبود وضوح متن دریافت می‌کنند.\n\nبااین‌حال، همهٔ دانشجویان تجربهٔ کافی برای نقد تخصصی ندارند. نظرهای سطحی مثل «خوب نوشته شده» کمک زیادی نمی‌کند؛ نقد نادقیق یا بیش‌ازحد تند هم می‌تواند ایجاد تردید کند. افزون بر این، دانشجویان باید برای خواندن کار دیگران زمان بگذارند و استادان نیز باید قواعد را آموزش دهند و اجرای آن را نظارت کنند. بنابراین الزام بدون راهنمایی می‌تواند فشار کاری اضافه ایجاد کند.\n\nبه نظر من، بازخورد هم‌دانشجویان زمانی سودمند است که معیارهای مشخص داشته باشد. مثلاً نظرها باید ساختار، استدلال و قابل‌فهم‌بودن زبان را جداگانه بررسی کنند. یک معرفی کوتاه و نمونهٔ بازخورد لازم است و حجم کار باید محدود بماند.\n\nبنابراین نه یک الزام نامحدود، بلکه روشی هدایت‌شده و کوتاه‌مدت را ترجیح می‌دهم؛ در این صورت همکاری واقعاً می‌تواند به یادگیری کمک کند.","summary_translation":"در دانشگاهی فرضی، پس از معرفی برنامهٔ داوطلبانهٔ راهنمایی دانشجویان سال اول، تجربهٔ شروع تحصیل بررسی شد. دانشجویان باتجربه‌تر به‌مدت هشت هفته گروه‌های کوچک را دربارهٔ امور اداری و خدمات مشاوره راهنمایی می‌کردند.\n\nنمودار نشان می‌دهد سهم پاسخ‌های مثبت در گروه سال بعد در سه زمینه افزایش یافته است: آگاهی از محل دریافت کمک از ۵۲ به ۷۴ درصد، احساس ارتباط با هم‌دانشگاهی‌ها از ۶۱ به ۷۹ درصد و اطمینان در برنامه‌ریزی تحصیل از ۴۸ به ۶۵ درصد رسید. این نتایج بر گزارش شخصی افراد تکیه دارند، نه عملکرد تحصیلی اندازه‌گیری‌شده. همچنین دو گروه از دو سال مختلف بودند و هم‌زمان برنامه‌های معارفه نیز گسترش یافته بود. پس نمی‌توان تمام تغییرات را فقط ناشی از برنامهٔ راهنمایی دانست."},{"code":"C","title":"Lernzonen in der Mensa und Campusbeleuchtung","topic":"Campusgestaltung & Umwelt","argument":"Der Studierendenrat diskutiert, ob außerhalb der Essenszeiten ein Teil der Mensa als ruhiger Lernbereich genutzt werden sollte.\n\nSchreiben Sie einen Beitrag in einem Hochschulforum. Erläutern Sie mögliche Vor- und Nachteile für Studierende sowie für die Betreiber der Mensa. Berücksichtigen Sie organisatorische Voraussetzungen und begründen Sie, welche Lösung Sie empfehlen.\n\nSchreiben Sie mindestens 200 Wörter. Sie haben 30 Minuten Zeit.","essay":"An vielen Hochschulen sind geeignete Arbeitsplätze besonders vor Prüfungen knapp. Deshalb erscheint der Vorschlag attraktiv, einen Teil der Mensa außerhalb der Essenszeiten als Lernbereich zu öffnen. Allerdings handelt es sich bei einer Mensa nicht um einen gewöhnlichen Seminarraum.\n\nFür Studierende wäre ein zusätzlicher Arbeitsplatz vor allem dann hilfreich, wenn Bibliothek und Gruppenräume überfüllt sind. Bestehende Tische und Stühle könnten ohne größeren Neubau genutzt werden. Zudem läge der Bereich für viele Studierende zentral und wäre leicht erreichbar. Gerade kurze Pausen zwischen zwei Lehrveranstaltungen ließen sich so produktiv nutzen.\n\nAus Sicht der Betreiber entstehen jedoch Herausforderungen. Vorbereitungen für die nächste Mahlzeit, Reinigung und Lieferungen verursachen Geräusche. Wenn Lernende ihre Unterlagen auf den Tischen ausbreiten, kann der Wechsel zwischen Lern- und Essensbetrieb zusätzlichen Aufwand erfordern. Auch Fragen der Aufsicht, der Sicherheit und des Stromverbrauchs müssten geklärt werden. Für Studierende wiederum könnte eine angeblich ruhige Zone enttäuschend sein, wenn Küchenbetrieb und Gespräche deutlich hörbar bleiben.\n\nIch würde deshalb eine begrenzte Pilotphase empfehlen. Zunächst sollte ein klar abgegrenzter Bereich für einige Stunden geöffnet werden. Feste Zeiten und verständliche Regeln könnten Konflikte verhindern. Anschließend ließe sich durch eine Befragung prüfen, ob das Angebot genutzt wird, ohne den Mensabetrieb zu behindern.\n\nInsgesamt kann die doppelte Nutzung vorhandener Räume sinnvoll sein. Voraussetzung ist allerdings, dass Ruhe und Verpflegung nicht gegeneinander ausgespielt werden.","essay_fa":"نمونه، مزیت استفاده از فضای موجود و دسترسی مرکزی را در برابر نیازهای خدماتی و نویز قرار می‌دهد. راهکار «آزمایش محدود» است، نه حکم قطعی برای همهٔ دانشگاه‌ها. ","essay_notes":["به هر دو ذی‌نفع Studierende و Betreiber پاسخ بده.","مفهوم «außerhalb der Essenszeiten» را رعایت کن؛ نباید فرض کنی زمان نهار هم محل مطالعه است.","Pilotphase پیشنهاد مشخص و قابل ارزیابی است.","استدلال هزینه و نظارت را با واقعیت عملی بهره‌برداری پیوند بده."],"summary_question":"Für einen Kurs in Stadtökologie bearbeiten Sie diese Frage: Welche Veränderungen wurden nach der Anpassung der nächtlichen Campusbeleuchtung beobachtet, und welche Grenzen hat die Untersuchung? Fassen Sie Text und Grafik ohne eigene Meinung zusammen (ca. 100–150 Wörter; 30 Minuten).","source":"Auf dem Gelände einer fiktiven Universität wurden in drei Innenhöfen Lampen mit einer geringeren Lichtintensität und einer stärker nach unten gerichteten Beleuchtung installiert. Damit sollten Wege weiterhin nutzbar bleiben, während weniger Licht in benachbarte Grünflächen fiel. Eine studentische Arbeitsgruppe erfasste vor und nach der Umrüstung mit identischen Messgeräten die Zahl nachtaktiver Insekten an ausgewählten Messpunkten.\n\nDie Grafik stellt die durchschnittlichen Beobachtungen pro Messabend dar. In zwei der drei Höfe wurden nach dem Umbau mehr Insekten registriert; in einem Hof blieb die Zahl nahezu unverändert. Die Arbeitsgruppe vermutet, dass die veränderte Lichtführung eine Rolle gespielt haben könnte. Gleichzeitig betont sie, dass Temperatur und Niederschlag zwischen den Untersuchungszeiträumen unterschiedlich waren und die Erhebung nur wenige Wochen dauerte.\n\nZur Orientierung der Studierenden wurden zusätzlich kurze Befragungen durchgeführt. Eine Mehrheit berichtete, die Wege weiterhin ausreichend erkennen zu können. Ein direkter Vergleich mit einem unveränderten Campusbereich fand jedoch nicht statt.","rows":[["Innenhof Nord",18,31],["Innenhof Mitte",25,27],["Innenhof Süd",14,26]],"summary":"An einer Modelluniversität wurde die nächtliche Beleuchtung von drei Innenhöfen verändert, damit weniger Licht auf angrenzende Grünflächen fällt. Eine Arbeitsgruppe zählte vor und nach der Umrüstung nachtaktive Insekten an ausgewählten Messpunkten.\n\nLaut Grafik stieg der durchschnittliche Wert im Nordhof von 18 auf 31 und im Südhof von 14 auf 26 Beobachtungen pro Messabend. Im mittleren Hof änderte er sich dagegen kaum: von 25 auf 27. Der Text berichtet außerdem, dass die meisten befragten Studierenden die Wege weiterhin ausreichend erkennen konnten. Die Ergebnisse erlauben jedoch keinen eindeutigen Nachweis eines Lichteffekts, da sich Wetterbedingungen unterschieden, die Erhebung kurz war und ein unveränderter Vergleichsbereich fehlte.","summary_fa":"این خلاصه به الگوی «تفاوت چشمگیر در دو حیاط، اندک در یک حیاط» وفادار می‌ماند و کاهش شدت نور را بی‌دلیل عامل قطعی رشد حشرات نمی‌نامد. ","summary_notes":["عددها شمار متوسط مشاهده در هر شب‌اند، نه درصد جمعیت کل حشرات.","مقایسهٔ قبل/بعد به‌تنهایی رابطهٔ علّی را اثبات نمی‌کند.","از «in zwei der drei Höfe» استفاده کن تا تعمیم ناروا ایجاد نشود."],"trap":"تلهٔ اصلی: قبل/بعد و هم‌زمانی دو تغییر، علت قطعی را ثابت نمی‌کند.","essay_translation":"در بسیاری از دانشگاه‌ها، به‌خصوص پیش از امتحان‌ها، فضای مناسب مطالعه کم است. ازاین‌رو پیشنهاد تبدیل بخشی از سلف در خارج از ساعات غذا به محل مطالعه جذاب به نظر می‌رسد. بااین‌حال، سلف یک کلاس معمولی نیست.\n\nبرای دانشجویان، فضای اضافی هنگامی سودمند است که کتابخانه و اتاق‌های گروهی پُر باشند. میز و صندلی‌های موجود بدون ساخت ساختمان تازه استفاده می‌شوند. همچنین این فضا معمولاً در محل مرکزی دانشگاه قرار دارد و برای فاصلهٔ کوتاه بین دو کلاس قابل‌استفاده است.\n\nاما کارکنان و بهره‌برداران با مشکلاتی روبه‌رو می‌شوند. آماده‌سازی غذا، نظافت و تحویل کالا سروصدا ایجاد می‌کند. حضور دانشجویانی که وسایلشان را روی میزها پخش کرده‌اند، تبدیل سریع سلف به محل صرف غذا را دشوار می‌کند. مسائل مربوط به نظارت، ایمنی و برق نیز باید روشن شوند. از طرف دیگر، خود دانشجویان ممکن است از محیطی که قرار بود آرام باشد ولی صدای آشپزخانه در آن شنیده می‌شود ناراضی باشند.\n\nپیشنهاد من اجرای آزمایشی محدود است: در چند ساعت مشخص، بخشی جداگانه باز شود و زمان و قواعد روشن وجود داشته باشد. سپس با نظرسنجی می‌توان بررسی کرد که آیا این فضا بدون آسیب‌زدن به خدمات غذا استفاده می‌شود یا نه.\n\nدر مجموع، استفادهٔ دوگانه از اتاق‌های موجود منطقی است، به‌شرط آنکه سکوت و خدمات غذایی در تعارض قرار نگیرند.","summary_translation":"در دانشگاهی فرضی، نورپردازی شبانهٔ سه حیاط تغییر داده شد تا نور کمتری به فضای سبز اطراف برسد. یک گروه دانشجویی تعداد حشرات شب‌فعال را پیش و پس از تغییر در چند محل اندازه‌گیری کرد.\n\nطبق نمودار، شمار متوسط مشاهده‌ها در حیاط شمالی از ۱۸ به ۳۱ و در حیاط جنوبی از ۱۴ به ۲۶ مورد در هر شب رسید. اما در حیاط میانی تغییر اندکی از ۲۵ به ۲۷ مشاهده ثبت شد. متن می‌گوید بیشتر دانشجویان شرکت‌کننده در پرسش‌نامه همچنان می‌توانستند مسیرها را به‌خوبی تشخیص دهند. بااین‌حال، نمی‌توان اثر نور را به‌طور قطعی ثابت کرد، زیرا شرایط آب‌وهوایی تغییر کرده بود، بررسی کوتاه بود و منطقهٔ مقایسهٔ بدون تغییر وجود نداشت."},{"code":"D","title":"Kommunale Praxisprojekte und Leihtechnik","topic":"Kooperation & Lerninfrastruktur","argument":"Ihre Hochschule erwägt, in jedem Bachelorstudiengang ein Projekt mit einer kommunalen Einrichtung vorzusehen, etwa mit einer Stadtbibliothek oder einem Umweltamt.\n\nSchreiben Sie für ein Seminarforum einen argumentativen Text. Erörtern Sie Chancen und Schwierigkeiten solcher verpflichtenden Praxisprojekte sowohl für Studierende als auch für die kommunalen Partner. Begründen Sie, ob Sie ein solches Pflichtmodell oder eine freiwillige Lösung bevorzugen.\n\nSchreiben Sie mindestens 200 Wörter. Zeit: 30 Minuten.","essay":"Die Zusammenarbeit zwischen Hochschulen und kommunalen Einrichtungen kann den Studienalltag mit konkreten gesellschaftlichen Aufgaben verbinden. Ob solche Projekte in allen Bachelorstudiengängen verpflichtend sein sollten, ist jedoch umstritten.\n\nFür Studierende liegt ein wesentlicher Vorteil im Praxisbezug. Wer beispielsweise untersucht, wie eine Stadtbibliothek besser erreichbar wird, muss theoretische Kenntnisse auf eine reale Situation übertragen. Zugleich können Teamarbeit und Kommunikation mit externen Partnern geübt werden. Kommunale Einrichtungen profitieren möglicherweise von frischen Ideen oder zusätzlichen Erhebungen, für die im Alltag wenig Zeit bleibt.\n\nDem stehen erhebliche Schwierigkeiten gegenüber. Die Projekte müssen zum jeweiligen Fach passen und sollten nicht nur einfache Routinearbeiten ersetzen. Studierende haben unterschiedliche Vorkenntnisse und zeitliche Möglichkeiten. Für berufstätige Personen könnte ein fester Termin außerhalb der Hochschule besonders belastend sein. Auch die kommunalen Partner tragen Verantwortung: Sie müssen geeignete Aufgaben formulieren, Ansprechpartner bereitstellen und Ergebnisse prüfen. Wenn jedes Semester neue Gruppen betreut werden, kann der Aufwand den Nutzen übersteigen.\n\nIch würde deshalb ein Wahlmodell bevorzugen. Die Hochschule sollte geprüfte Praxisprojekte anbieten, aber gleichwertige Alternativen innerhalb des Studiums ermöglichen. Für die Teilnahme müssten Lernziele, zeitlicher Umfang und Zuständigkeiten im Voraus feststehen. Außerdem sollten die Ergebnisse den Partnern tatsächlich zugutekommen und nicht nur als Prüfungsleistung dienen.\n\nInsgesamt halte ich kommunale Kooperationen für eine Bereicherung. Eine allgemeine Pflicht erscheint mir jedoch zu unflexibel, solange die Voraussetzungen zwischen Studiengängen und Einrichtungen so unterschiedlich sind.","essay_fa":"پاراگراف‌ها مزایا و محدودیت‌های هر دو طرف را پوشش می‌دهند؛ نتیجه راه‌حل انتخابی با معادل آموزشی است. توجه کن *Pflichtmodell* با *freiwilliges Wahlmodell* تضاد دقیق دارد. ","essay_notes":["«تجربهٔ عملی» را با هدف آموزشی روشن توضیح بده.","برای نهاد شهری، هزینهٔ راهبری و بررسی خروجی‌ها را فراموش نکن.","در نتیجه موضع «اجباری یا داوطلبانه» را صریح بیان کن."],"summary_question":"In einer Hausarbeit über die Nutzung von Hochschulbibliotheken untersuchen Sie: Welche Auswirkungen hatte die Einführung eines Verleihservices für technische Geräte auf die Ausleihe und welche Grenzen zeigen die Daten? Fassen Sie Text und Grafik zusammen, ohne eigene Bewertung. Ca. 100–150 Wörter, 30 Minuten.","source":"Eine fiktive Hochschulbibliothek bietet seit Beginn eines Sommersemesters die Ausleihe von Aufnahmegeräten, kleinen Scannern und mobilen Messgeräten an. Die Geräte können für Seminare und Projektarbeiten maximal sieben Tage ausgeliehen werden. Der Bericht vergleicht die Zahl der Ausleihvorgänge in den ersten drei Monaten des Angebots.\n\nAm häufigsten wurden Aufnahmegeräte genutzt, etwa für Interviews in sozialwissenschaftlichen Projekten. Bei Scannern war die Nachfrage geringer und nahm nur leicht zu. Mobile Messgeräte wurden anfangs selten ausgeliehen, später jedoch deutlich häufiger. Die Bibliotheksleitung wertet dies als Hinweis darauf, dass der neue Service verschiedene Studienbereiche erreicht.\n\nDer Bericht warnt zugleich vor weitreichenden Schlussfolgerungen: Die Gerätebestände wurden zwischen den Monaten erweitert, und manche Geräte waren vorübergehend wegen Wartung nicht verfügbar. Zudem zählt die Statistik Ausleihvorgänge, nicht die Zahl unterschiedlicher Personen. Eine Person kann daher mehrfach in den Daten enthalten sein.","rows":[["Aufnahmegeräte",42,57,64],["Mobile Scanner",18,20,23],["Messgeräte",9,21,40]],"summary":"Eine Modellhochschulbibliothek untersuchte, wie häufig technische Geräte in den ersten drei Monaten eines neuen Verleihservices genutzt wurden. Laut Text können Studierende Aufnahmegeräte, Scanner und mobile Messgeräte für maximal sieben Tage ausleihen.\n\nDie Grafik zeigt bei allen Gerätetypen steigende Ausleihzahlen. Aufnahmegeräte wurden am häufigsten genutzt; ihre Ausleihen erhöhten sich von 42 auf 64 pro Monat. Besonders deutlich war die Entwicklung bei Messgeräten, deren Nutzung von neun auf 40 Vorgänge stieg. Scanner nahmen dagegen nur leicht von 18 auf 23 zu. Allerdings wuchs im Untersuchungszeitraum auch der Gerätebestand, und einzelne Geräte waren wegen Wartung nicht verfügbar. Da Ausleihvorgänge und nicht Personen gezählt wurden, lassen sich daraus keine genauen Aussagen über die Zahl der Nutzenden ableiten.","summary_fa":"نکتهٔ مهم: «Ausleihvorgänge» تعداد دفعات امانت است، نه تعداد کاربران یکتا. رشد امانت‌گیری را نباید الزاماً نشانهٔ رشد همان‌قدر کاربران دانست. ","summary_notes":["«auf 40» با «um 40» فرق دارد: ۹ به ۴۰ یعنی افزایش ۳۱ مورد.","تفاوت موجودی دستگاه‌ها عامل مداخله‌گر است.","در خلاصهٔ ۱۰۰–۱۵۰ واژه، همهٔ اعداد فرعی لازم نیست؛ الگوهای کلیدی را انتخاب کن."],"trap":"تلهٔ اصلی: شمار تراکنش‌ها با شمار افراد یکی نیست.","essay_translation":"همکاری دانشگاه با نهادهای شهری می‌تواند دانش نظری را با مسائل واقعی جامعه پیوند بدهد. بااین‌حال، این‌که چنین پروژه‌هایی در همهٔ دوره‌های کارشناسی اجباری باشند، موضوع بحث است.\n\nبرای دانشجویان، فایدهٔ اصلی ارتباط با تجربهٔ عملی است. کسی که مثلاً راه‌های دسترس‌پذیرترکردن کتابخانهٔ شهر را بررسی می‌کند، باید نظریه را به یک موقعیت واقعی منتقل کند و هم‌زمان همکاری گروهی و ارتباط با شریک بیرونی را تمرین کند. نهادهای شهری هم ممکن است از ایده‌های تازه یا جمع‌آوری اطلاعاتی بهره ببرند که برای آن وقت کافی ندارند.\n\nدر مقابل، هر پروژه باید با رشته مرتبط باشد و نباید جای کارهای تکراری کارکنان را بگیرد. دانشجویان از نظر زمان و مهارت یکسان نیستند؛ دانشجوی شاغل ممکن است از برنامهٔ ثابت خارج دانشگاه فشار بیشتری تحمل کند. نهاد شهری نیز باید مسئلهٔ مناسب تعریف کند، راهنما در اختیار بگذارد و نتیجه را ارزیابی کند. اگر هر ترم گروه‌های تازه‌ای را راهبری کند، شاید هزینهٔ کار از فایده‌اش بیشتر شود.\n\nمن مدل انتخابی را ترجیح می‌دهم. دانشگاه می‌تواند پروژه‌های بررسی‌شده عرضه کند، اما گزینهٔ درسی هم‌ارز نیز وجود داشته باشد. هدف آموزشی، زمان و مسئولیت‌ها باید از پیش روشن باشند. نتیجهٔ پروژه نیز باید به کار نهاد شهری بیاید، نه اینکه فقط نمرهٔ دانشگاهی تولید کند.\n\nدر کل، این همکاری‌ها ارزشمندند، ولی اجبار عمومی بدون توجه به تفاوت شرایط رشته‌ها و نهادها انعطاف کافی ندارد.","summary_translation":"کتابخانهٔ دانشگاهی فرضی بررسی کرد که ابزارهای فنی در سه ماه اول خدمت امانت‌دهی چه میزان استفاده شده‌اند. طبق متن، دانشجویان می‌توانند دستگاه ضبط صدا، اسکنر و ابزار اندازه‌گیری را تا هفت روز امانت بگیرند.\n\nنمودار رشد امانت‌دهی در هر سه گروه را نشان می‌دهد. دستگاه‌های ضبط صدا بیشترین استفاده را داشتند و تعداد امانت آن‌ها از ۴۲ به ۶۴ مورد در ماه رسید. بیشترین رشد نسبی مربوط به دستگاه‌های اندازه‌گیری بود که از ۹ به ۴۰ مورد افزایش یافتند. اسکنرها فقط از ۱۸ به ۲۳ مورد رسیدند. بااین‌حال، موجودی ابزار نیز افزایش یافت و بعضی دستگاه‌ها موقتاً برای تعمیر از دسترس خارج بودند. چون آمار تعداد امانت‌ها را ثبت کرده، نه افراد یکتا را، تعداد دقیق استفاده‌کنندگان از آن معلوم نیست."},{"code":"E","title":"Open-Book-Prüfungen und Labortechnik","topic":"Prüfungskultur & Ressourcen","argument":"In einem Seminar diskutieren Sie, ob schriftliche Hochschulprüfungen häufiger als Open-Book-Prüfungen durchgeführt werden sollten. Dabei dürfen Studierende ausgewählte Unterlagen nutzen.\n\nVerfassen Sie einen Beitrag, in dem Sie Vorteile und Nachteile für Studierende und Prüfende erläutern. Gehen Sie darauf ein, welche Kompetenzen solche Prüfungen messen und welche Probleme bei der Chancengleichheit entstehen könnten. Begründen Sie Ihre Position. Mindestens 200 Wörter, 30 Minuten.","essay":"Bei Open-Book-Prüfungen dürfen Studierende bestimmte Materialien verwenden. Befürworter sehen darin eine zeitgemäße Prüfungsform, während Kritiker befürchten, dass Fachwissen weniger gründlich gelernt wird. Entscheidend ist aus meiner Sicht nicht allein, ob Unterlagen zugelassen sind, sondern wie die Aufgaben gestaltet werden.\n\nEin Vorteil besteht darin, dass Prüfungsfragen stärker auf Anwendung und Bewertung von Informationen ausgerichtet werden können. Studierende müssen dann beispielsweise verschiedene Lösungswege vergleichen, statt nur Definitionen zu reproduzieren. Auch im späteren Berufsleben werden Aufgaben häufig mithilfe verfügbarer Informationen bearbeitet. Für Prüfende eröffnet dies die Möglichkeit, komplexere und realitätsnähere Probleme zu stellen.\n\nAllerdings ist eine Open-Book-Prüfung nicht automatisch fairer oder leichter. Wer eine gut geordnete Materialsammlung besitzt oder besonders schnell recherchiert, kann Vorteile haben. Außerdem kann die Suche nach Informationen viel Zeit kosten. Lehrende müssen Aufgaben entwickeln, deren Lösungen sich nicht einfach abschreiben lassen. Das erhöht unter Umständen den Vorbereitungs- und Korrekturaufwand. Zugleich dürfen grundlegende Kenntnisse nicht vollständig vernachlässigt werden, weil man ohne sie auch zuverlässige Quellen kaum beurteilen kann.\n\nIch befürworte daher einen gezielten Einsatz. In Modulen, in denen Transfer und Problemlösen im Mittelpunkt stehen, erscheint das Format besonders geeignet. Die zugelassenen Materialien sollten klar definiert sein, und alle Teilnehmenden müssten gleiche technische Bedingungen erhalten.\n\nZusammenfassend sollten Open-Book-Prüfungen klassische Prüfungen nicht pauschal ersetzen. Als bewusst gestaltete Ergänzung können sie jedoch wichtige Kompetenzen sichtbar machen.","essay_fa":"در پاسخ خوب باید نشان بدهی Open-Book به معنای حذف یادگیری نیست. شایستگیِ هدف، کاربرد و ارزیابی اطلاعات است. برای Prüfende طراحی سؤال و تصحیح نیز هزینه دارد. ","essay_notes":["دوگانهٔ سادهٔ «آسان/سخت» را جایگزین تحلیل مهارتِ موردسنجش نکن.","ارتباط بین مهارت جست‌وجو و عدالتِ شرایط آزمون را توضیح بده.","پیشنهاد «in geeigneten Modulen» از ممنوعیت یا جایگزینی کامل دقیق‌تر است."],"summary_question":"Im Seminar Nachhaltige Technik schreiben Sie einen Abschnitt zu folgender Frage: Welche Veränderungen ergaben sich nach einer Reparaturinitiative für ältere Laborgeräte? Fassen Sie die Angaben aus Text und Grafik neutral zusammen. Ca. 100–150 Wörter, 30 Minuten.","source":"Ein fiktives Lehrlabor erfasste die Nutzung von 120 älteren Messgeräten. Vor Beginn eines Reparaturprojekts wurden defekte Geräte häufig nicht mehr eingesetzt, obwohl einzelne Bauteile ersetzt werden konnten. Eine studentische Arbeitsgruppe arbeitete mit dem technischen Dienst zusammen, um kleinere Schäden zu dokumentieren und ausgewählte Geräte instand zu setzen.\n\nDie Grafik vergleicht drei Kategorien vor und sechs Monate nach Beginn der Initiative. Der Anteil voll funktionsfähiger Geräte nahm zu, während weniger Geräte dauerhaft außer Betrieb waren. Gleichzeitig stieg jedoch die Zahl der Geräte, die nur eingeschränkt genutzt werden konnten. Die Projektleitung erklärt dies damit, dass einige zuvor aussortierte Geräte zwar wieder einsetzbar waren, aber weiterhin Messgrenzen aufwiesen.\n\nÜber mögliche Einsparungen liegen bisher keine zuverlässigen Angaben vor. Weder wurde der personelle Zeitaufwand vollständig erfasst noch wurden die Kosten einer Neuanschaffung systematisch verglichen. Deshalb kann die Untersuchung keinen abschließenden Nachweis liefern, dass Reparaturen finanziell grundsätzlich günstiger sind.","rows":[["Voll funktionsfähig",54,76],["Eingeschränkt nutzbar",16,28],["Außer Betrieb",50,16]],"summary":"In einem fiktiven Lehrlabor wurde untersucht, wie sich der Zustand von 120 älteren Messgeräten nach einer Reparaturinitiative veränderte. Eine studentische Gruppe dokumentierte Schäden und setzte gemeinsam mit dem technischen Dienst ausgewählte Geräte instand.\n\nLaut Grafik stieg die Zahl voll funktionsfähiger Geräte innerhalb von sechs Monaten von 54 auf 76. Gleichzeitig sank die Zahl der außer Betrieb befindlichen Geräte von 50 auf 16. Die Anzahl eingeschränkt nutzbarer Geräte erhöhte sich dagegen von 16 auf 28. Laut Bericht wurden einige zuvor ausgesonderte Geräte wieder verwendbar, blieben jedoch in ihrer Messgenauigkeit begrenzt. Aussagen über allgemeine finanzielle Vorteile der Reparatur sind nicht möglich, da Personalaufwand und Anschaffungskosten nicht systematisch erfasst beziehungsweise verglichen wurden.","summary_fa":"به تفاوت «voll funktionsfähig» و «eingeschränkt nutzbar» توجه کن؛ نمی‌توان همهٔ ۱۰۴ دستگاهِ قابل‌استفاده را کاملاً سالم معرفی کرد. ","summary_notes":["گراف تعداد دستگاه‌ها را نشان می‌دهد، نه درصد؛ ۱۲۰ دستگاه در هر دو زمان ثابت است.","جمع هر سه دسته در هر زمان ۱۲۰ است، یک کنترل خوب برای دقت داده‌ها.","متن دادهٔ مالی ندارد؛ «باعث صرفه‌جویی قطعی شد» غلط است."],"trap":"تلهٔ اصلی: افزایش قابلیت استفاده به معنای اثبات سود اقتصادی نیست.","essay_translation":"در امتحان‌های کتاب‌باز، دانشجویان اجازه دارند از منابع مشخصی استفاده کنند. طرفداران آن را شیوه‌ای امروزی می‌دانند، اما منتقدان نگران‌اند دانش تخصصی کمتر آموخته شود. به نظر من موضوع اصلی این نیست که منبع مجاز باشد یا نه، بلکه این است که سؤال‌ها چگونه طراحی شوند.\n\nیکی از مزیت‌ها این است که سؤال‌ها می‌توانند بیشتر بر کاربرد و ارزیابی اطلاعات تمرکز کنند. دانشجو به‌جای بازگویی تعریف‌ها باید راه‌حل‌های مختلف را مقایسه کند. در کار واقعی نیز معمولاً به منابع دسترسی وجود دارد. استادان هم می‌توانند مسئله‌های پیچیده‌تر و نزدیک‌تر به واقعیت طراحی کنند.\n\nبااین‌حال، چنین آزمونی خودبه‌خود عادلانه‌تر یا آسان‌تر نیست. کسی که منابع منظم‌تری دارد یا سریع‌تر جست‌وجو می‌کند ممکن است برتری پیدا کند. جست‌وجو نیز زمان می‌برد. استادان باید سؤال‌هایی طراحی کنند که پاسخشان را نتوان ساده کپی کرد؛ این کار احتمالاً زمان آماده‌سازی و تصحیح را افزایش می‌دهد. همچنین دانش پایه را نباید کنار گذاشت؛ بدون آن ارزیابی اعتبار منابع دشوار است.\n\nازاین‌رو کاربرد هدفمند را مناسب می‌دانم. در درس‌هایی که حل مسئله و انتقال دانش اهمیت دارد، این قالب سودمند است. منابع مجاز باید دقیق تعریف شوند و شرایط فنی برابر باشد.\n\nدر مجموع، امتحان‌های کتاب‌باز نباید همهٔ آزمون‌های سنتی را جایگزین کنند، ولی اگر آگاهانه طراحی شوند مکمل مفیدی خواهند بود.","summary_translation":"در یک آزمایشگاه آموزشی فرضی بررسی شد که تعمیر ابزارهای اندازه‌گیری قدیمی چه تغییری در وضعیت ۱۲۰ دستگاه ایجاد کرد. گروهی از دانشجویان همراه مسئولان فنی خرابی‌ها را ثبت و بعضی دستگاه‌ها را تعمیر کردند.\n\nطبق نمودار، شمار ابزارهای کاملاً سالم ظرف شش ماه از ۵۴ به ۷۶ رسید. هم‌زمان شمار دستگاه‌های ازکارافتاده از ۵۰ به ۱۶ کاهش یافت. دستگاه‌های با قابلیت استفادهٔ محدود از ۱۶ به ۲۸ افزایش پیدا کردند. طبق گزارش، برخی ابزارهای کنارگذاشته‌شده دوباره قابل‌استفاده شدند، اما محدودیت دقت اندازه‌گیری داشتند. دربارهٔ صرفه‌جویی مالی کلی نمی‌توان نتیجه گرفت، زیرا زمان کار کارکنان و هزینهٔ خرید دستگاه جدید به‌صورت نظام‌مند اندازه‌گیری و مقایسه نشده است."},{"code":"F","title":"Kurzpräsentationen und Hochschulgärten","topic":"Lernkultur & Nachhaltigkeit","argument":"Ihre Fachschaft schlägt vor, dass in jedem Seminar alle Studierenden mindestens einmal eine dreiminütige Kurzpräsentation halten. Andere halten dies für unnötigen Druck.\n\nSchreiben Sie einen Beitrag für eine hochschulinterne Diskussionsplattform. Erörtern Sie die Vor- und Nachteile eines solchen Modells für Studierende und Lehrende. Berücksichtigen Sie unterschiedliche Voraussetzungen beim öffentlichen Sprechen und entwickeln Sie einen begründeten Vorschlag. Mindestens 200 Wörter; Zeit: 30 Minuten.","essay":"Eine kurze Präsentation vor anderen Studierenden kann eine gute Gelegenheit sein, wissenschaftliche Inhalte verständlich darzustellen. Dennoch ist die Forderung, alle Teilnehmenden in jedem Seminar zu einer solchen Leistung zu verpflichten, nicht unproblematisch.\n\nFür Studierende könnte die regelmäßige Übung ein wichtiger Vorteil sein. Wer lernt, ein komplexes Thema auf drei Minuten zu begrenzen, muss Schwerpunkte setzen und Zusammenhänge deutlich machen. Wiederholte kleine Auftritte können außerdem helfen, Sicherheit beim Sprechen vor Gruppen zu entwickeln. Lehrende erhalten zugleich einen Einblick, welche Konzepte bereits verstanden wurden und welche Erklärungen noch fehlen.\n\nAllerdings sind die Voraussetzungen unterschiedlich. Manche Studierende sprechen bereits sehr sicher, während andere noch mit der Unterrichtssprache oder mit starken Hemmungen kämpfen. Eine Pflicht in jedem Seminar könnte deshalb zu unnötigem Leistungsdruck führen. Auch drei Minuten pro Person summieren sich bei großen Gruppen zu erheblicher Unterrichtszeit. Wenn Kurzvorträge nur oberflächlich bewertet werden, ist der zusätzliche Lerngewinn außerdem fraglich.\n\nIch würde daher ein abgestuftes Modell vorschlagen. In den ersten Wochen könnten Präsentationen in kleinen Gruppen stattfinden. Später wäre ein kurzer Einzelbeitrag möglich, wobei Themen und Termine früh festgelegt werden müssten. Bewertet werden sollten vor allem Verständlichkeit, Aufbau und inhaltliche Richtigkeit, nicht ein besonders selbstbewusster Auftritt. Für begründete Einzelfälle könnten gleichwertige alternative Leistungen vorgesehen werden.\n\nDamit würde das Format den Aufbau von Kommunikationskompetenz fördern, ohne alle Studierenden unter denselben unnötigen Druck zu setzen.","essay_fa":"الگو به تفاوت سطح آمادگی شفاهی دانشجویان حساس است، اما هدف آموزشی را هم حفظ می‌کند. در نتیجه پیشنهاد تدریجی و معیارهای ارزیابی منصفانه می‌دهد. ","essay_notes":["در تکلیف، «mindestens einmal in jedem Seminar» را تحلیل کن؛ نه ارائهٔ یک‌بار در کل تحصیل.","اثر بر زمان کلاس برای Lehrende را فراموش نکن.","ارزیابی «Inhalt, Aufbau, Verständlichkeit» متناسب‌تر از شخصیت و اعتمادبه‌نفس است."],"summary_question":"In einem Seminar über städtische Umweltprojekte fragen Sie: Welche Entwicklungen zeigen sich bei der Wassernutzung in einem studentisch betreuten Hochschulgarten, und welche Schlussfolgerungen sind möglich? Fassen Sie Text und Grafik in eigenen Worten zusammen, ohne Ihre Meinung einzufügen. 100–150 Wörter, 30 Minuten.","source":"In einem fiktiven Hochschulgarten wurde über drei Vegetationsperioden die Bewässerung mehrerer gleich großer Beete dokumentiert. Im ersten Jahr wurden die Pflanzen überwiegend mit Trinkwasser versorgt. Danach installierte eine studentische Arbeitsgruppe einen zusätzlichen Regenwasserspeicher und testete eine Mulchschicht, die die Verdunstung verringern sollte.\n\nDie Grafik unterscheidet zwischen Trink- und gesammeltem Regenwasser. Insgesamt ging die gemessene Bewässerungsmenge zurück, während der Anteil des Regenwassers anstieg. Die Betreuenden vermuten, dass die veränderte Bodenabdeckung und eine bewusstere Bewässerung dazu beigetragen haben. Zugleich weisen sie darauf hin, dass die Niederschlagsmengen zwischen den Jahren stark schwankten und im dritten Jahr weniger empfindliche Pflanzen angebaut wurden.\n\nDa weder der Pflanzenertrag noch die Bodenfeuchtigkeit systematisch verglichen wurden, lässt sich aus dem niedrigeren Wasserverbrauch nicht schließen, dass die Pflanzen grundsätzlich besser versorgt waren. Die Beobachtung soll deshalb in weiteren Jahren fortgesetzt werden.","rows":[["Jahr 1: Trinkwasser",680],["Jahr 1: Regenwasser",120],["Jahr 2: Trinkwasser",450],["Jahr 2: Regenwasser",240],["Jahr 3: Trinkwasser",270],["Jahr 3: Regenwasser",350]],"summary":"In einem fiktiven Hochschulgarten wurde der Wasserverbrauch über drei Vegetationsperioden dokumentiert. Nach dem ersten Jahr installierten Studierende einen Regenwasserspeicher und erprobten eine Mulchschicht. Laut Text sollte dadurch weniger Trinkwasser benötigt werden.\n\nDie Grafik zeigt, dass die Trinkwassermenge von 680 Litern im ersten Jahr auf 270 Liter im dritten zurückging. Gleichzeitig stieg die Nutzung von Regenwasser von 120 auf 350 Liter. Der gesamte Bewässerungsbedarf sank damit von 800 auf 620 Liter. Der Bericht nennt jedoch weitere mögliche Einflussfaktoren: unterschiedliche Niederschläge, bewusstere Bewässerung und den Anbau weniger empfindlicher Pflanzen. Da Erträge und Bodenfeuchtigkeit nicht systematisch verglichen wurden, lässt sich aus den Zahlen weder eine eindeutige Ursache noch eine bessere Versorgung der Pflanzen ableiten.","summary_fa":"اینجا باید خودت دو مؤلفهٔ نمودار را جمع کنی: مجموع سال اول ۸۰۰ و سال سوم ۶۲۰ لیتر است. ولی علت کاهش را نمی‌توان صرفاً به مخزن یا مالچ نسبت داد. ","summary_notes":["سال سوم Trinkwasser کمتر، Regenwasser بیشتر و Gesamtmenge کمتر شده است؛ سه روند جدا هستند.","کاهش مصرف به معنای افزایش محصول نیست؛ محصول اصلاً سنجیده نشده.","همهٔ آمارها مربوط به باغ تمرینی ساختگی‌اند، نه واقعیت بیرونی."],"trap":"تلهٔ اصلی: رابطهٔ زمانی میان اقدام و نتیجه، اثبات دلیل واحد نیست.","essay_translation":"ارائهٔ کوتاه در برابر هم‌دانشگاهی‌ها می‌تواند فرصتی مناسب برای توضیح قابل‌فهم موضوعات علمی باشد. بااین‌حال، اجبار به اجرای آن در هر سمینار برای تمام دانشجویان بی‌مسئله نیست.\n\nدانشجویان ممکن است از تمرین منظم سود ببرند. کسی که باید موضوع پیچیده‌ای را در سه دقیقه بیان کند، ناچار است نکات اصلی را انتخاب کند و ارتباط آن‌ها را واضح نشان دهد. تکرار ارائه‌های کوچک همچنین می‌تواند اطمینان هنگام صحبت در گروه را بیشتر کند. استادان نیز بهتر متوجه می‌شوند کدام مفاهیم فهمیده شده‌اند و چه مواردی به توضیح بیشتر نیاز دارند.\n\nبااین‌وجود، شرایط دانشجویان متفاوت است. بعضی در جمع راحت صحبت می‌کنند، درحالی‌که عده‌ای هنوز در زبان تدریس یا در غلبه بر ترس شدید مشکل دارند. الزام در هر سمینار ممکن است فشار اضافی ایجاد کند. حتی سه دقیقه برای هر نفر، در کلاس بزرگ وقت زیادی می‌گیرد. اگر ارائه‌ها سطحی ارزیابی شوند، سود آموزشی اضافه نیز نامشخص است.\n\nمن روشی مرحله‌ای پیشنهاد می‌کنم. ابتدا ارائه در گروه‌های کوچک باشد و بعد نوبت ارائهٔ کوتاه فردی برسد. موضوع و زمان باید زود مشخص شوند. در ارزیابی، فهم‌پذیری، ساختار و درستی علمی مهم‌تر از اعتمادبه‌نفس ظاهری باشد و در موارد موجه فعالیتی هم‌ارز امکان‌پذیر باشد.\n\nاین شیوه می‌تواند توانایی ارتباط علمی را افزایش دهد، بدون اینکه به تمام دانشجویان فشار غیرضروری یکسانی وارد شود.","summary_translation":"در باغ آموزشی یک دانشگاه فرضی، مصرف آب در سه فصل رشد ثبت شد. پس از سال نخست، دانشجویان مخزن آب باران نصب کردند و پوشش مالچ را به‌کار گرفتند. هدف کاهش نیاز به آب آشامیدنی برای آبیاری بود.\n\nنمودار نشان می‌دهد مصرف آب لوله‌کشی از ۶۸۰ لیتر در سال اول به ۲۷۰ لیتر در سال سوم کاهش یافت. در مقابل، استفاده از آب باران از ۱۲۰ به ۳۵۰ لیتر رسید. مجموع آبیاری نیز از ۸۰۰ به ۶۲۰ لیتر کم شد. گزارش به عوامل احتمالی دیگری مانند تغییر بارندگی، آبیاری آگاهانه‌تر و کشت گیاهان مقاوم‌تر اشاره می‌کند. ازآنجاکه محصول و رطوبت خاک به شکل نظام‌مند مقایسه نشده‌اند، نه علت دقیق کاهش مصرف و نه بهبود تغذیهٔ آبی گیاهان را نمی‌توان قطعی دانست."}],"clinics":[["مقدار و قطعیت","Eine Befragung deutet darauf hin, dass manche Teilnehmende unter Zeitdruck geraten.","Welche Wiedergabe ist inhaltlich korrekt?",["Die Befragung beweist, dass alle Teilnehmenden überfordert sind.","Die Befragung liefert Hinweise auf Zeitdruck bei einem Teil der Befragten.","Niemand empfindet Zeitdruck."],1,"*deutet darauf hin* هشدار دربارهٔ قطعیت است و *manche* برابر *alle* نیست.",{"0":"واژه‌های manche و deutet auf نه all هستند نه prove؛ دو سطح قطعیت و کمیت تغییر کرده‌اند.","2":"متن هیچ‌جا نبودِ کامل فشار زمانی را بیان نمی‌کند؛ بعضی افراد ممکن است فش function selectSets(){main.innerHTML=header('انتخاب یکی از شش آزمون Schreiben','در هر ست یک موضوع استدلالی و یک مجموعهٔ متن + نمودار مستقل وجود دارد. همهٔ موضوع‌ها و اعداد تألیفی‌اند.')+`<div class="toolbar panel"><label>حالت اجرا: <select id="modeSelect"><option value="practice">تمرین آزاد</option><option value="exam">آزمون ۶۰ دقیقه‌ای بدون بازگشت</option></select></label><p class="small muted">هر تکلیف ۳۰ دقیقه. در حالت آزمون پاسخ نمونه فقط پس از پایان هر دو تکلیف باز می‌شود.</p></div><div class="cards">${all.map(z=>`<button class="set-card" data-choice="${z.code}"><span class="pill">ست ${z.code}</span><strong>${E(z.title)}</strong><small>${E(z.topic)}</small><small>مقالهٔ استدلالی + خلاصهٔ متن و نمودار</small><small>وضعیت: ${state.submitted[z.code+':1']&&state.submitted[z.code+':2']?'هر دو تکلیف ثبت شده':state.answers[z.code+':1']||state.answers[z.code+':2']?'در حال تکمیل':'شروع‌نشده'}</small></button>`).join('')}</div>`;$('#modeSelect').value=state.mode;$('#modeSelect').onchange=e=>{state.mode=e.target.value;persist()};main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>openSet(b.dataset.choice))}

function models(z,isSummary){let t=isSummary?z.summary:z.essay,fa=isSummary?z.summary_fa:z.essay_fa,notes=isSummary?z.summary_notes:z.essay_notes;return `<div class="panel" id="answerKey"><div class="between"><h3>پاسخ‌نامهٔ تشریحی — Aufgabe ${isSummary?'2':'1'}</h3><span class="pill">مدل تألیفی · ${count(t)} واژه</span></div><div class="note"><b>توجه:</b> این تنها یک پاسخ قابل‌قبول نمونه است، نه پاسخ یگانه یا تضمین‌کنندهٔ سطح مشخص.</div><details><summary>نمایش نمونه‌پاسخ کامل آلمانی (بعد از پاسخ خودت بخوان)</summary><div class="reading model de">${E(t)}</div></details><details><summary>ترجمهٔ فارسیِ کامل نمونه‌پاسخ</summary><div style="white-space:pre-line">${E(isSummary?z.summary_translation:z.essay_translation)}</div></details><h4>تحلیل محتوایی فارسی</h4><p>${E(fa)}</p><h4>تحلیل معیارها و نکات کلیدی</h4>${notes.map(x=>`<div class="biling">✓ ${E(x)}</div>`).join('')}${isSummary?`<div class="note warn"><b>دام اصلی این منبع:</b> ${E(z.trap)}</div>`:''}<details><summary>الگوی بررسی بازنویسی با عبارت‌های مفید آلمانی</summary><div class="biling"><div class="de">Der Text weist darauf hin, dass ...</div><div>متن اشاره می‌کند که ...</div></div><div class="biling"><div class="de">Aus der Grafik geht hervor, dass ...</div><div>از نمودار برمی‌آید که ...</div></div><div class="biling"><div class="de">Allerdings lässt sich daraus nicht ableiten, dass ...</div><div>اما از این موضوع نمی‌توان نتیجه گرفت که ...</div></div></details></div>`}
function rubric(z,isSummary){let id=taskid(),criteria=isSummary?[['Quelle','دقت اطلاعات متن و نمودار'],['Frage','پوشش پرسش اصلی'],['Eigenständigkeit','بازنویسی با واژگان خود'],['Daten','مقایسهٔ صحیح اعداد و گروه‌ها'],['Neutralität','نداشتن نظر شخصی'],['Sprache','وضوح، انسجام و دستور زبان']]:[['Aufgabe','پاسخ‌گویی به تمام دستورها'],['Pro/Contra','توازن مزایا و معایب'],['Adressat','تناسب با مخاطب دانشگاهی'],['Position','موضع روشن با دلایل'],['Kohärenz','انسجام پاراگراف‌ها'],['Sprache','دقت و تنوع واژگان و گرامر']];let vals=state.rubrics[id]||{};return `<div class="panel"><h3>خودارزیابی آموزشی، نه نمرهٔ رسمی</h3><p class="muted small">در هر معیار از ۰ تا ۳، براساس متن خودت امتیاز بده. این جمع فقط برای یافتن ضعف‌هاست و قابل تبدیل مستقیم به TDN نیست.</p><div class="rubric">${criteria.map(([k,l])=>`<label><b class="de">${k}</b><br>${l}<select data-rubric="${k}"><option value="">هنوز بررسی نکرده‌ام</option><option value="0" ${vals[k]==='0'?'selected':''}>۰ — انجام نشده</option><option value="1" ${vals[k]==='1'?'selected':''}>۱ — ناقص / ضعیف</option><option value="2" ${vals[k]==='2'?'selected':''}>۲ — قابل‌قبول با کاستی</option><option value="3" ${vals[k]==='3'?'selected':''}>۳ — روشن و دقیق</option></select></label>`).join('')}</div><div class="results" id="rubricTotal">${rubricResult(vals,criteria)}</div><button class="ghost" onclick="createFeedbackPrompt()">کپی متن و درخواست بازخورد تخصصی</button></div>`}
function rubricResult(vals,criteria){let n=Object.values(vals).filter(v=>v!=='').length,sum=Object.values(vals).reduce((a,b)=>a+(b===''?0:Number(b)),0);return `معیارهای بررسی‌شده: <b>${n}/${criteria.length}</b> · جمع خودارزیابی: <b>${sum}/${criteria.length*3}</b> · <b>این عدد TDN نیست</b>.`}
function createFeedbackPrompt(){let z=name(state.active),a=state.answers[taskid()]||'',prompt=`لطفاً متن آلمانی من را برای تمرین Schreiben دیجیتال TestDaF دقیق و صریح بررسی کن. نوع تکلیف: ${taskSubtitle()}. صورت سؤال: ${state.step===0?z.argument:z.summary_question}\n${state.step===1?'متن منبع:\n'+z.source+'\nجدول:\n'+z.rows.map(x=>x.join(' | ')).join('\n'):''}\nپاسخ من:\n${a}\nمعیارها: انجام تمام دستورها، صحت اطلاعات، انسجام، واژگان، گرامر، مخاطب، بازنویسی. اشکال‌ها را با نمونهٔ جملهٔ اصلاح‌شده و ترجمهٔ فارسی توضیح بده؛ سطح TDN را فقط با عدم قطعیت و تخمینی بگو، نه نمرهٔ رسمی.`;copyText(prompt)}
function downloadSet(code){let z=name(code),s=`Digital TestDaF Extra Part 3 — Set ${code}\n${z.title}\n\nAUFGABE 1:\n${z.argument}\n\nMEINE ANTWORT:\n${state.answers[code+':1']||'[خالی]'}\n\nAUFGABE 2:\n${z.summary_question}\n\nQUELLE:\n${z.source}\n\nGRAFIK:\n${z.rows.map(r=>r.join(' | ')).join('\n')}\n\nMEINE ANTWORT:\n${state.answers[code+':2']||'[خالی]'}\n\nاین فایل برای ارسال به مدرس یا ChatGPT است.`,file=new Blob([s],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=`TestDaF_Schreiben_Set_${code}_Antworten.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function copyText(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>notice('متن کپی شد')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');notice('متن کپی شد')}catch(e){notice('امکان کپی مستقیم نیست؛ از خروجی متنی استفاده کن.')}a.remove()}
function renderClinic(){main.innerHTML=header('کلینیک نوشتن: ۱۶ دام و خطای کاربردی','سؤال‌های کوتاه تألیفی برای تشخیص تغییر معنا، خطای نمودار، بیان نادقیق و ساختار استدلال. پاسخ تشریحی هر سؤال پس از ثبت انتخاب آن نمایش داده می‌شود.')+`<div class="panel"><div class="between"><h3>تمرین‌ها</h3><span id="clinicStats" class="pill">${Object.keys(state.clinicSubmitted).length} / ${clinics.length} تکمیل‌شده</span></div><p>در هر سؤال یک گزینه را انتخاب کن؛ تصحیح خودکار فقط مربوط به این تمرین‌های چندگزینه‌ای است، نه کیفیت متن آزاد.</p><div id="clinicQs">${clinics.map((q,i)=>clinicCard(q,i)).join('')}</div></div>`;main.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.opt.split(':').map(Number);if(state.clinicSubmitted[i])return;state.clinic[i]=j;persist();$('#clinic-'+i).outerHTML=clinicCard(clinics[i],i);let fresh=$('#clinic-'+i);fresh.querySelector('[data-check]').onclick=()=>checkClinic(i);fresh.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{state.clinic[i]=Number(el.dataset.opt.split(':')[1]);persist();fresh.outerHTML=clinicCard(clinics[i],i);let nf=$('#clinic-'+i);nf.querySelector('[data-check]').onclick=()=>checkClinic(i);nf.querySelectorAll('[data-opt]').forEach(e=>e.onclick=()=>selectClinic(i,Number(e.dataset.opt.split(':')[1])))})});main.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>checkClinic(Number(b.dataset.check)))}
function selectClinic(i,j){if(state.clinicSubmitted[i])return;state.clinic[i]=j;persist();let el=$('#clinic-'+i);el.outerHTML=clinicCard(clinics[i],i);let fresh=$('#clinic-'+i);fresh.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>selectClinic(i,Number(b.dataset.opt.split(':')[1])));fresh.querySelector('[data-check]').onclick=()=>checkClinic(i)}function checkClinic(i){if(state.clinic[i]===undefined)return notice('ابتدا یک گزینه را انتخاب کن');state.clinicSubmitted[i]=true;persist();let el=$('#clinic-'+i);el.outerHTML=clinicCard(clinics[i],i);let n=Object.keys(state.clinicSubmitted).length,good=clinics.filter((q,i)=>state.clinicSubmitted[i]&&state.clinic[i]===q[4]).length;$('#clinicStats').textContent=`${n}/${clinics.length} تکمیل؛ ${good} پاسخ درست`}
function clinicCard(q,i){const done=!!state.clinicSubmitted[i],sel=state.clinic[i];return `<div class="quiz" id="clinic-${i}"><div class="between"><b>${i+1}. ${E(q[0])}</b>${done?`<span class="pill">${sel===q[4]?'درست ✓':'نیازمند مرور'}</span>`:''}</div><p class="de">${E(q[1])}</p><p class="de"><b>${E(q[2])}</b></p>${q[3].map((o,j)=>`<button class="option ${sel===j?'selected':''} ${done&&j===q[4]?'good':''} ${done&&sel===j&&j!==q[4]?'bad':''}" data-opt="${i}:${j}" ${done?'disabled':''}>${'ABC'[j]}. ${E(o)}</button>`).join('')}${!done?`<button class="primary" data-check="${i}">ثبت و تحلیل پاسخ</button>`:`<div class="explain"><b>گزینهٔ صحیح: ${'ABC'[q[4]]}</b><p>${E(q[5])}</p><p class="small">${q[3].map((o,j)=>j===q[4]?'':`گزینهٔ ${'ABC'[j]}: ${E(o)} — ${E(q[6]?.[j]||'این گزینه با متن یا دستور سؤال ناسازگار است.')}`).filter(Boolean).join('<br>')}</p></div>`}</div>`}
function renderAnswers(){main.innerHTML=header('پاسخ‌نامهٔ تشریحی و نمونه‌پاسخ‌ها','تمام پاسخ‌ها پس از ثبت تکلیف مربوط در این قسمت قرار می‌گیرند. در حالت آزمون، ابتدا هر دو تکلیف ست باید کامل شوند.')+all.map(z=>{let b=!!(state.submitted[z.code+':1']&&state.submitted[z.code+':2']),a1=!!state.submitted[z.code+':1'],a2=!!state.submitted[z.code+':2'];return `<div class="panel"><h3>ست ${z.code} — ${E(z.title)}</h3>${a1&&(state.mode!=='exam'||b)?models(z,false):'<div class="note warn">پاسخ‌نامهٔ تکلیف ۱ هنوز قفل است.</div>'}${a2&&(state.mode!=='exam'||b)?models(z,true):'<div class="note warn">پاسخ‌نامهٔ تکلیف ۲ هنوز قفل است.</div>'}</div>`}).join('')}
function phrases(){const phrases=[['Einerseits bietet ... den Vorteil, dass ...','از یک سو ... این مزیت را دارد که ...'],['Andererseits muss berücksichtigt werden, dass ...','از سوی دیگر باید در نظر گرفت که ...'],['Während ... profitiert, kann ... benachteiligt werden.','درحالی‌که ... سود می‌برد، ... ممکن است زیان ببیند.'],['Unter der Voraussetzung, dass ...','به شرط آنکه ...'],['Ein möglicher Einwand besteht darin, dass ...','یک ایراد احتمالی این است که ...'],['Daraus lässt sich jedoch nicht schließen, dass ...','از آن نمی‌توان نتیجه گرفت که ...'],['Der Text führt ... auf ... zurück.','متن ... را ناشی از ... می‌داند.'],['Die Grafik zeigt einen Anstieg von ... auf ...','نمودار افزایش از ... به ... را نشان می‌دهد.'],['Der Unterschied beträgt ... Prozentpunkte.','تفاوت ... واحد درصد است.'],['Im Vergleich zum Ausgangswert ...','در مقایسه با مقدار اولیه ...'],['Die Untersuchung beschränkt sich auf ...','پژوهش محدود به ... است.'],['Insgesamt spricht dies dafür, dass ...','در مجموع این موضوع به سود این نظر است که ...']];main.innerHTML=header('راهنمای آموزشی نوشتن و Redemittel','عبارت‌های منعطف آلمانی با ترجمهٔ فارسی و معیارهای دقیق خودارزیابی. هیچ عبارتی به‌تنهایی نمرهٔ بالا تضمین نمی‌کند.')+`<div class="panel"><h3>معیارهای رسمیِ محتوایی و زبانی</h3><p>در ارزیابی واقعی نوشتن، علاوه بر ارتباط موضوعی و اجرای کامل دستور، به بازگویی دقیق و مستقل اطلاعات منابع، وضوح بیان، تنوع ساختارهای دستوری، واژگان متناسب و فهم‌پذیری متن توجه می‌شود. <a href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/auswertung-des-digitalen-testdaf/" target="_blank" rel="noopener">معیارهای رسمی</a></p><div class="grid2"><div class="key"><b>Aufgabentyp 1 · Argumentation</b><p>برای شروع، موضوع و مسئله را معرفی کن؛ مزایا و محدودیت‌های خواسته‌شده را با دلیل بررسی کن؛ اگر گروه‌های مختلف ذکر شده‌اند به همه بپرداز؛ موضع روشن و متناسب ارائه بده؛ متن را از نظر پیوستگی بررسی کن.</p></div><div class="key"><b>Aufgabentyp 2 · Zusammenfassung</b><p>صورت سؤال را محور انتخاب اطلاعات قرار بده؛ داده‌های اصلی متن و نمودار را با عبارت‌بندی خودت ترکیب کن؛ اعداد و دسته‌ها را اشتباه نکن؛ شرایط و محدودیت را حفظ کن؛ از داوری شخصی بپرهیز.</p></div></div></div><div class="panel"><h3>عبارت‌های قابل‌استفاده با ترجمهٔ فارسی</h3>${phrases.map(x=>`<div class="biling"><div class="de">${E(x[0])}</div><div>${E(x[1])}</div></div>`).join('')}</div><div class="panel"><h3>اشتباه‌های رایج</h3><p><b>حذف شرط:</b> «könnte unter bestimmten Bedingungen» را به «führt immer zu» تبدیل نکن.</p><p><b>تبدیل رابطه به علت:</b> *ein Zusammenhang wurde beobachtet* اثبات علت نیست.</p><p><b>توصیف عددی:</b> افزایش از ۲۰٪ به ۳۵٪ برابر ۱۵ واحد درصد است، نه ۱۵ درصد افزایش نسبی.</p><p><b>داوری در خلاصه:</b> «Meiner Meinung nach» را بی‌درخواست وارد خلاصه نکن.</p><p><b>فقدان مخاطب:</b> لحن Beitrag برای Seminarforum با نامهٔ رسمی به اداره تفاوت دارد.</p></div>`}
function exportPanel(){main.innerHTML=header('پشتیبان‌گیری و ارسال پاسخ‌ها','برای اشتراک در این گفت‌وگو، می‌توانی متن آلمانیِ پاسخ‌ها و صورت سؤال‌ها را خروجی بگیری. این فایل پاسخ‌ها را روی سرور ذخیره نمی‌کند.')+`<div class="panel"><h3>داده‌های ذخیره‌شده</h3><p>پاسخ‌ها به‌صورت خودکار در حافظهٔ محلی همین مرورگر ذخیره می‌شوند، مشروط به اینکه مرورگر اجازهٔ localStorage بدهد. تغییر مرورگر، حالت ناشناس، پاک‌کردن داده‌ها یا استفاده از دامنهٔ دیگر می‌تواند باعث شود پاسخ‌ها دیده نشوند. همیشه خروجی پشتیبان بگیر.</p><div class="actions"><button class="primary" onclick="downloadJSON()">دانلود همهٔ پاسخ‌ها JSON</button><button onclick="downloadAllText()">دانلود همهٔ متن‌ها TXT</button><button onclick="copyAll()">کپی همهٔ پاسخ‌ها</button></div><div class="divider"></div><h4>ورود فایل پشتیبان</h4><input type="file" accept="application/json,.json" id="importFile"><button onclick="importJSON()">بازیابی از JSON</button><div class="divider"></div><button class="danger" onclick="clearProgress()">پاک‌کردن پاسخ‌های ذخیره‌شده</button></div>`}
function downloadBlob(str,file,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([str],{type}));a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}function downloadJSON(){downloadBlob(JSON.stringify({version:2,exported:new Date().toISOString(),state},null,2),'Digital_TestDaF_Extra_Part3_Schreiben_Answers.json','application/json;charset=utf-8')};function wholeText(){return all.map(z=>`ست ${z.code} — ${z.title}\n\nتکلیف استدلالی:\n${z.argument}\n\nپاسخ من:\n${state.answers[z.code+':1']||'(خالی)'}\n\nتکلیف خلاصه:\n${z.summary_question}\n\nمتن:\n${z.source}\n\nداده‌های نمودار:\n${z.rows.map(r=>r.join(' | ')).join('\n')}\n\nپاسخ من:\n${state.answers[z.code+':2']||'(خالی)'}`).join('\n\n========================\n\n')}function downloadAllText(){downloadBlob(wholeText(),'Digital_TestDaF_Extra_Part3_All_Writings.txt','text/plain;charset=utf-8')}function copyAll(){copyText(wholeText())}function importJSON(){const input=$('#importFile');if(!input.files?.length)return notice('یک فایل JSON انتخاب کن');const fr=new FileReader();fr.onload=()=>{try{let p=JSON.parse(fr.result);if(p.version!==2||!p.state?.answers)throw Error('فرمت فایل ناسازگار است');if(confirm('واردکردن پشتیبان، پاسخ‌های فعلی را جایگزین می‌کند. ادامه می‌دهی؟')){state={...state,...p.state,page:'home'};persist();page('home');notice('پاسخ‌ها بازیابی شدند')}}catch(e){notice('فایل JSON معتبرِ این نسخه نیست.')}};fr.readAsText(input.files[0])}function clearProgress(){if(confirm('تمام پاسخ‌ها، امتیازهای کلینیک و وضعیت تکمیل حذف شوند؟')){let keep=state.mode;state={mode:keep,active:'A',step:0,answers:{},submitted:{},rubrics:{},clinic:{},clinicSubmitted:{},locked:{},timestamps:{},completed:[],practiceTimes:{},page:'home'};persist();page('home')}}
document.addEventListener('change',e=>{if(e.target.matches('[data-rubric]')){let k=taskid();state.rubrics[k]=state.rubrics[k]||{};state.rubrics[k][e.target.dataset.rubric]=e.target.value;persist();let criteria=Array.from(document.querySelectorAll('[data-rubric]')).map(el=>[el.dataset.rubric,'']);$('#rubricTotal').innerHTML=rubricResult(state.rubrics[k],criteria)}});
nav();page('home');
