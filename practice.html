<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>POOF · تمرین</title>
<style>
:root{--bg:#111111;--surface:#1b1814;--text:#f5f1e8;--muted:#b8b0a4;--accent:#e6b96f;--error:#ff8f87;--ok:#9fd8a8;--border:#4a4032;
--r-sm:12px;--r-lg:20px;--serif:ui-serif,Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;color-scheme:dark}
html[data-theme=classic]{--bg:#111111;--surface:#1b1814;--text:#f5f1e8;--muted:#b8b0a4;--accent:#e6b96f;--error:#ff8f87;--ok:#9fd8a8;--border:#4a4032}
html[data-theme=snowy]{--bg:#081421;--surface:#10263a;--text:#f3f8fc;--muted:#b8c7d3;--accent:#f3c879;--error:#ff9d9d;--ok:#9fe0c0;--border:#294861}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100dvh;font:16px/1.6 var(--sans);color:var(--text);background:var(--bg)}
#scenicBg{position:fixed;inset:0;z-index:0;pointer-events:none}
#scenicBg::after{content:"";position:absolute;inset:0}
html[data-theme=snowy] #scenicBg::after{background:linear-gradient(to bottom,rgba(8,20,33,.55),rgba(8,20,33,.82))}
html[data-theme=classic] #scenicBg::after{background:linear-gradient(to bottom,rgba(17,17,17,.55),rgba(17,17,17,.82))}
header{position:relative;overflow:hidden;z-index:1;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
header::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
html[data-theme=snowy] header::after{background:linear-gradient(to bottom,rgba(8,20,33,.2),rgba(8,20,33,.65))}
html[data-theme=classic] header::after{background:linear-gradient(to bottom,rgba(20,16,12,.25),rgba(20,16,12,.7))}
.hd{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.theme-toggle{position:relative;z-index:1;max-width:720px;margin:10px auto 0;display:flex;gap:6px}
.theme-toggle button{background:transparent;color:var(--accent);padding:5px 12px;font-size:13px}
.theme-toggle button.on{background:var(--accent);color:var(--bg)}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--bg);font:700 20px/1 var(--serif)}
h1{margin:0;font:600 22px/1.2 var(--serif);letter-spacing:.16em;color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:20px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.card{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;background:rgba(30,24,18,.52);-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15)}
html[data-theme=snowy] .card{background:rgba(16,38,58,.5);-webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25)}
html[data-theme=classic] .card{background:rgba(30,24,18,.52);-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15)}
.mute{color:var(--muted)}.sm{font-size:13px}.big{font-size:26px;font-weight:700}.big2{font-size:22px;font-weight:700}
.de{direction:ltr;unicode-bidi:isolate}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer;font:inherit}
button:active{transform:scale(.97)}button:disabled{opacity:.45}
button.ghost{background:transparent;color:var(--accent)}
button.full{width:100%}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{cursor:pointer;text-align:right;transition:transform .15s}
.mode:active{transform:scale(.97)}
.mode.disabled{opacity:.45;cursor:default}
.mode .ic{font-size:20px}
.mode b{display:block;margin:4px 0 2px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:0 0 16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.opt{display:block;width:100%;margin:8px 0;background:transparent;color:var(--text);border:1px solid var(--border);text-align:right;font-weight:400}
.opt.right{border-color:var(--ok);background:rgba(159,216,168,.12);color:var(--ok)}
.opt.wrong{border-color:var(--error);background:rgba(255,143,135,.12);color:var(--error)}
.okmsg{color:var(--ok);font-weight:700}.badmsg{color:var(--error);font-weight:700}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{font-size:52px;font-weight:800;color:var(--accent);text-align:center;margin:10px 0}
.wr{border-top:1px solid var(--border);padding:10px 0}
.row{display:flex;gap:10px;align-items:center}
.center{text-align:center}
.pulse{animation:pp .4s ease}
@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes poof-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
html[data-theme=snowy] .brand-mascot{display:block!important;animation:poof-float 3s ease-in-out infinite}
html[data-theme=snowy] .hd h1,html[data-theme=snowy] .hd .mark{display:none}
html:not([data-theme=snowy]) .brand-mascot{display:block!important;animation:poof-float 3s ease-in-out infinite}
html:not([data-theme=snowy]) .hd h1,html:not([data-theme=snowy]) .hd .mark{display:none}
.mode .ic svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ddd-badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border:1.5px solid var(--accent);border-radius:99px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
/* ===== bottom nav (same as main app) ===== */
nav.poof-nav{position:fixed;right:16px;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;max-width:688px;margin:0 auto;overflow:visible;background:var(--nav-bg,rgba(27,24,20,.78));border:1px solid var(--nav-border,rgba(230,185,111,.25));box-shadow:var(--shadow-nav,0 12px 32px rgba(0,0,0,.45));border-radius:24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:transform .42s cubic-bezier(.4,0,.2,1),opacity .35s ease}
nav.poof-nav.nav-hidden{opacity:0;transform:translateY(calc(100% + 48px));pointer-events:none}
nav.poof-nav:focus-within{opacity:1;transform:none;pointer-events:auto}
html[data-theme=snowy] nav.poof-nav{background:rgba(11,29,45,.78);border-color:rgba(185,220,244,.28);box-shadow:0 12px 32px rgba(0,8,16,.55)}
html[data-theme=classic] nav.poof-nav{background:rgba(27,24,20,.78);border-color:rgba(230,185,111,.25);box-shadow:0 12px 32px rgba(0,0,0,.45)}
nav.poof-nav button{padding:10px 2px;border:0;border-radius:16px;background:transparent;color:var(--muted);box-shadow:none}
nav.poof-nav button:hover{background:var(--hover,rgba(230,185,111,.08));color:var(--accent);filter:none}
nav.poof-nav button:active{transform:none}
nav.poof-nav button.on{background:var(--active,rgba(230,185,111,.14));color:var(--accent)}
html[data-theme=snowy] nav.poof-nav button.on{background:rgba(243,200,121,.16)}
nav.poof-nav .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav.poof-nav button.hero{width:54px;height:54px;padding:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),#caa25e);color:var(--bg);justify-self:center;align-self:center;transform:translateY(-12px);box-shadow:0 0 0 3px var(--bg),0 8px 20px rgba(0,0,0,.45)}
nav.poof-nav button.hero:hover{background:linear-gradient(135deg,var(--accent),#caa25e);color:var(--bg);filter:brightness(1.06)}
nav.poof-nav button.hero:active{transform:translateY(-12px)}
nav.poof-nav button.hero .ic{width:26px;height:26px}
nav.poof-nav button.hero.on{background:linear-gradient(135deg,var(--accent),#caa25e);color:var(--bg);filter:brightness(1.08);box-shadow:0 0 0 3px var(--bg),0 10px 26px rgba(0,0,0,.55),0 0 20px var(--active,rgba(230,185,111,.14))}
</style>
<script>try{var _t=(JSON.parse(localStorage.getItem('poof_v2')||'{}').theme==='snowy')?'snowy':'classic';document.write('<link rel="stylesheet" id="themeCss" href="theme-'+_t+'.css?v=15">')}catch(e){document.write('<link rel="stylesheet" id="themeCss" href="theme-classic.css?v=15">')}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2.5a3 3 0 0 0-3 3v6.5a3 3 0 0 0 6 0V5.5a3 3 0 0 0-3-3z"/><path d="M18.5 10.5v1.5a6.5 6.5 0 0 1-13 0v-1.5"/><path d="M12 18.5V21"/><path d="M8.5 21h7"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><path d="M7.5 10.5h.01M12 10.5h.01M16.5 10.5h.01M7.5 14h.01M12 14h.01M16.5 14h.01"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 8.5 20.5H3.5v-5z"/><path d="M13 6l5 5"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
<symbol id="i-choice" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1.3"/><circle cx="5" cy="12" r="1.3"/><path d="M3.5 18l1 1 2-2"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
<symbol id="i-read" viewBox="0 0 24 24"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></symbol>
<symbol id="i-dict" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="11" rx="2.5"/><path d="M7 4.5h10"/></symbol>
<symbol id="i-route" viewBox="0 0 24 24"><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="6.5" r="2.5"/><path d="M9 17.5h6.5a3 3 0 0 0 0-6h-4a3 3 0 0 1-3-3V9"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5.2 20a7 7 0 0 1 13.6 0"/></symbol>
</defs></svg>
<div class="poof-img-library-bg" id="scenicBg" aria-hidden="true"></div>
<header><div class="poof-img-header-bg" aria-hidden="true" style="position:absolute;inset:0;z-index:0"></div><div class="hd"><span class="mark">P</span><div class="poof-mascot brand-mascot poof-img-snowy-wave" aria-hidden="true" style="display:none;width:56px;height:56px;margin:0"></div><div style="flex:1"><h1>POOF</h1><div class="sub">تمرین</div></div>
<button class="ghost" id="backBtn" aria-label="بازگشت" style="border:none;font-size:18px;padding:8px 12px">→</button></div><div class="theme-toggle"><button type="button" class="ghost" data-th="snowy">برفی</button><button type="button" class="ghost" data-th="classic">کلاسیک</button></div></header>
<main id="app"><div class="card center mute">در حال بارگذاری…</div></main>
<nav class="poof-nav" id="poofNav" aria-label="ناوبری اصلی">
 <button type="button" data-tab="cards" aria-label="کارت‌ها" title="کارت‌ها"><svg class="ic" aria-hidden="true"><use href="#i-cards"/></svg></button>
 <button type="button" data-tab="dict" aria-label="دیکشنری" title="دیکشنری"><svg class="ic" aria-hidden="true"><use href="#i-dict"/></svg></button>
 <button type="button" data-tab="read" class="hero" aria-label="خواندنی" title="خواندنی"><svg class="ic" aria-hidden="true"><use href="#i-read"/></svg></button>
 <button type="button" data-tab="review" class="on" aria-label="مرور و یادگیری" title="مرور و یادگیری"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg></button>
 <button type="button" data-tab="me" aria-label="پروفایل" title="پروفایل"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg></button>
</nav>
<script>
"use strict";
/* ---------- storage ---------- */
const K="poof_v2";
let db={};
try{db=JSON.parse(localStorage.getItem(K))||{}}catch(e){db={}}
db.cards=db.cards||[];
function applyTheme(){var t=db.theme==="snowy"?"snowy":"classic";document.documentElement.dataset.theme=t;var tc=document.getElementById("themeCss");if(tc)tc.href="theme-"+t+".css?v=15";var m=document.querySelector("meta[name=theme-color]");if(m)m.content=t==="snowy"?"#081421":"#111111";document.querySelectorAll("[data-th]").forEach(function(b){var on=b.dataset.th===t;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false")})}
applyTheme();
document.querySelectorAll("[data-th]").forEach(function(b){b.onclick=function(){db.theme=b.dataset.th;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}applyTheme()}});
$("#backBtn").onclick=()=>{savePracticeResume();if(history.length>1)history.back();else location.href="index.html"};
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const bare=f=>String(f||"").replace(/^(der|die|das)\s+/i,"");
const nz=s=>bare(String(s||"").trim()).toLowerCase().replace(/ä|ae/g,"a").replace(/ö|oe/g,"o").replace(/ü|ue/g,"u").replace(/ß/g,"ss").replace(/\s+/g," ");
const app=$("#app");

/* ---------- TTS ---------- */
function say(t,lang){
  try{
    const l=/[\u0600-\u06FF]/.test(t)?"fa-IR":lang==="en"?"en-US":"de-DE";
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- modes ---------- */
const MODES=[
 {id:"mcq",icon:"i-choice",name:"۴ گزینه‌ای",desc:"کلمه رو ببین، معنیش رو حدس بزن",need:4,needMsg:"حداقل ۴ کارت لازم داره"},
 {id:"type",icon:"i-key",name:"تایپی",desc:"معنی رو ببین، کلمه رو بنویس",need:1,needMsg:"حداقل ۱ کارت لازم داره"},
 {id:"listen",icon:"i-sound",name:"شنیداری",desc:"گوش کن، کلمه‌ی درست رو انتخاب کن",need:4,needMsg:"حداقل ۴ کارت لازم داره"},
 {id:"cloze",icon:"i-pencil",name:"جای خالی",desc:"جمله رو کامل کن",need:1,needMsg:"کارت‌هایی با جمله‌ی نمونه لازم داره",custom:c=>c.filter(x=>x.context&&x.context.length>10)},
 {id:"match",icon:"i-link",name:"جور کردن",desc:"کلمه‌ها رو با معنی‌هاشون جفت کن",need:5,needMsg:"حداقل ۵ کارت لازم داره"},
 {id:"speak",icon:"i-mic",name:"تلفظ",desc:"کلمه رو بلند بگو، گوش میده",need:1,needMsg:"حداقل ۱ کارت لازم داره",needsMic:true},
];
const micOK=()=>("SpeechRecognition" in window)||("webkitSpeechRecognition" in window);

/* ---------- session ---------- */
let S=null; // {mode,cards,i,ok,wrong[]}
let currentMode=null; // active data-mode id, or null on the hub home
/* ---------- practice resume (practice-page side only) ---------- */
/* Shared marker: poof_practice_resume = {page:'practice.html', state:{mode,scrollY}, ts}.
   Saved by the bottom-nav and #backBtn handlers before leaving; consumed on load here.
   index.html is intentionally untouched: it must leave a foreign-page marker alone. */
function savePracticeResume(){
  try{localStorage.setItem("poof_practice_resume",JSON.stringify({page:"practice.html",state:{mode:currentMode,scrollY:window.scrollY||0},ts:Date.now()}))}catch(e){}
}
function loadPracticeResume(){
  let raw=null;
  try{raw=localStorage.getItem("poof_practice_resume")}catch(e){return}
  if(!raw)return;
  let m=null;
  try{m=JSON.parse(raw)}catch(e){return}
  if(!m||m.page!=="practice.html")return; // foreign-page marker: leave untouched
  try{localStorage.removeItem("poof_practice_resume")}catch(e){} // consume
  const st=m.state||{};
  const y=(typeof st.scrollY==="number"&&isFinite(st.scrollY))?st.scrollY:0;
  if(st.mode&&MODES.some(x=>x.id===st.mode))startMode(st.mode); // re-enter recorded mode; else hub home stays
  const restore=()=>{try{window.scrollTo(0,y)}catch(e){}};
  try{requestAnimationFrame(restore)}catch(e){}
  setTimeout(restore,350); // fallback after render
}
function poolFor(m){
  let p=db.cards.slice();
  if(m.custom)p=m.custom(p);
  return shuffle(p);
}
function viewHome(){
  currentMode=null;
  const n=db.cards.length;
  app.innerHTML=`<div class="card"><div class="row"><div style="flex:1"><b>تمرین با کارت‌های خودت</b><div class="mute sm">${n?n+" کارت داری":"هنوز کارتی نداری"}</div></div></div></div>
  <div class="modes">${MODES.map(m=>{
    const p=poolFor(m),ok=p.length>=m.need&&!(m.needsMic&&!micOK());
    const why=m.needsMic&&!micOK()?"مرورگرت تشخیص گفتار نداره":m.needMsg+` (داری: ${p.length})`;
    return `<div class="card mode ${ok?"":"disabled"}" data-mode="${m.id}">
      <div class="ic"><svg><use href="#${m.icon}"/></svg></div><b>${m.name}</b>
      <div class="mute sm">${m.desc}</div>
      ${ok?`<div class="sm" style="color:var(--ok);margin-top:6px">شروع ←</div>`:`<div class="sm" style="color:var(--error);margin-top:6px">${why}</div>`}
    </div>`}).join("")}</div>
  <div class="card mode" onclick="location.href='der-die-das.html'">
      <div class="ic"><span class="ddd-badge" dir="ltr">der · die · das</span></div><b>بازی مقاله‌ها der / die / das</b>
      <div class="mute sm">۷۵۰ کلمه‌ی آلمانی با مقاله، لایتنر و آمار — در صفحه‌ی جدا</div>
      <div class="sm" style="color:var(--ok);margin-top:6px">بازی کن ←</div>
    </div>
  <div class="card mode" onclick="location.href='studienkolleg-trainer.html'">
      <div class="ic"><span class="ddd-badge" dir="ltr">Studienkolleg</span></div><b>تمرین آزمون ورودی Studienkolleg</b>
      <div class="mute sm">C-Test، درک مطلب، گرامر و ریاضی T-Kurs با زمان و تاریخچه — در صفحه‌ی جدا</div>
      <div class="sm" style="color:var(--ok);margin-top:6px">شروع تمرین ←</div>
    </div>
  <div class="card mode" onclick="location.href='placement-test.html'">
      <div class="ic"><span class="ddd-badge" dir="ltr">Placement</span></div><b>آزمون تعیین سطح آلمانی</b>
      <div class="mute sm">۱۰ خرده‌سطح از A1.1 تا C1.2 · ۶ مهارت · تطبیقی — در صفحه‌ی جدا</div>
      <div class="sm" style="color:var(--ok);margin-top:6px">شروع آزمون ←</div>
    </div>
  <div class="card mode" onclick="location.href='wortschatz.html'">
      <div class="ic"><span class="ddd-badge" dir="ltr">Wortschatz</span></div><b>واژه‌آموزی دسته‌بندی‌شده</b>
      <div class="mute sm">سیستم واژه‌آموزی کامل شد — هر ۷ تسک</div>
      <div class="sm" style="color:var(--ok);margin-top:6px">سطحی ۲۰۰۰ + کتابی ۱۹۲ + موضوعی ۴۰ موضوع / ۱۲۰۰ مدخل + عبارات ۶۰۰ در ۳۰ موقعیت + اصطلاحات و ضرب‌المثل‌ها ۲۰۰ + لایتنر و ذخیرهٔ پیشرفت ←</div>
    </div>
  ${n?`<p class="mute sm center">از تب «خواندن» یا «دیکشنری» کارت بیشتر بساز تا حالت‌های بیشتری باز بشن</p>`:`<div class="card center"><p>هنوز کارتی نداری.</p><button class="ghost" onclick="location.href='index.html'">رفتن به اپ و ساختن کارت</button></div>`}`;
  app.querySelectorAll(".mode[data-mode]:not(.disabled)").forEach(el=>el.onclick=()=>startMode(el.dataset.mode));
}
/* --- تلفظ --- */
function qSpeak(){
  const c=cur();
  const lang=/[\u0600-\u06FF]/.test(c.front)?"fa-IR":c.lang==="en"?"en-US":"de-DE";
  app.innerHTML=`${progress()}<div class="card center"><p class="mute sm">این کلمه رو بلند بگو</p>
   <div class="big de" style="margin:12px 0">${esc(c.front)}</div>
   <p class="mute">${esc(c.back)}</p>
   <div class="row" style="justify-content:center;margin:12px 0">
    <button class="ghost" id="hear"><svg class="ic-svg" aria-hidden="true"><use href="#i-sound"/></svg> بشنو</button>
    <button id="rec" style="font-size:18px;padding:14px 26px"><svg class="ic-svg" aria-hidden="true"><use href="#i-mic"/></svg> بگو</button>
   </div>
   <div id="st" class="mute sm"></div>
   <div id="fb"></div></div>`;
  $("#hear").onclick=()=>say(c.front,c.lang);
  let rec=null,listening=false;
  const stop=()=>{listening=false;try{rec&&rec.stop()}catch(e){}$("#rec").innerHTML='<svg class="ic-svg" aria-hidden="true"><use href="#i-mic"/></svg> بگو';$("#rec").disabled=false;$("#st").textContent=""};
  $("#rec").onclick=()=>{
    if(listening){stop();return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){$("#st").textContent="مرورگرت تشخیص گفتار نداره";return}
    rec=new SR();rec.lang=lang;rec.interimResults=false;rec.maxAlternatives=5;
    listening=true;$("#rec").innerHTML='<svg class="ic-svg" aria-hidden="true"><use href="#i-stop"/></svg> در حال گوش دادن… (بزن تا قطع شه)';$("#st").textContent="بگو…";
    $("#rec").classList.add("pulse");
    rec.onresult=e=>{
      const alts=[];
      for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
      const target=nz(c.front);
      const hit=alts.some(a=>nz(a)===target);
      const heard=alts[0]||"";
      stop();$("#rec").classList.remove("pulse");
      finish(hit,`<div class="mute sm">شنیدم: <b class="de">${esc(heard)}</b></div>${hit?"":`<div class="big2 de center" style="margin-top:8px">${esc(c.front)}</div>`}`);
    };
    rec.onerror=e=>{
      stop();$("#rec").classList.remove("pulse");
      const m={"no-speech":"چیزی نشنیدم — دوباره بگو",aborted:"قطع شد","not-allowed":"دسترسی به میکروفون داده نشد",network:"مشکل شبکه"}[e.error]||"خطا: "+e.error;
      $("#st").innerHTML=`<span class="badmsg">${m}</span>`;
    };
    rec.onend=()=>{if(listening){stop();$("#rec").classList.remove("pulse")}};
    try{rec.start()}catch(e){stop()}
  };
}
function startMode(id){
  const m=MODES.find(x=>x.id===id);
  const pool=poolFor(m).slice(0,10);
  if(pool.length<m.need)return;
  S={mode:m,cards:pool,i:0,ok:0,wrong:[]};
  currentMode=id;
  nextQ();
}
function progress(){
  return `<div class="bar"><i style="width:${Math.round(S.i/S.cards.length*100)}%"></i></div>
  <p class="mute sm center">سؤال ${S.i+1} از ${S.cards.length} · درست: ${S.ok}</p>`;
}
function cur(){return S.cards[S.i]}
function nextQ(){
  if(S.i>=S.cards.length)return viewResult();
  const q=({mcq:qMcq,type:qType,listen:qListen,cloze:qCloze,match:qMatch,speak:qSpeak})[S.mode.id];
  q();
}
function finish(ok,html){
  const c=cur();
  if(ok)S.ok++;else S.wrong.push(c);
  const el=$("#fb");
  el.innerHTML=`<div class="${ok?"okmsg":"badmsg"}" style="margin:12px 0">${ok?"✓ آفرین!":"✗ نشد"}</div>${html||""}<button class="full" id="nx" style="margin-top:10px">بعدی ←</button>`;
  el.querySelector("#nx").onclick=()=>{S.i++;nextQ()};
}
function distractors(key,n){
  const c=cur();
  return shuffle(db.cards.filter(x=>x!==c&&nz(x[key])!==nz(c[key]))).map(x=>x[key])
    .filter((v,i,a)=>a.findIndex(w=>nz(w)===nz(v))===i).slice(0,n||3);
}
/* --- ۴ گزینه‌ای --- */
function qMcq(){
  const c=cur(),rev=Math.random()<.5,key=rev?"front":"back";
  const opts=shuffle([{t:c[key],ok:true},...distractors(key).map(t=>({t,ok:false}))]);
  app.innerHTML=`${progress()}<div class="card"><p class="mute sm center">معنی درست رو انتخاب کن</p>
   <div class="big ${rev?"":"de"} center" style="margin:10px 0">${esc(rev?c.back:c.front)}</div>
   ${opts.map((o,i)=>`<button class="opt ${rev?"de":""}" data-i="${i}">${esc(o.t)}</button>`).join("")}
   <div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add("right")});
    if(!o.ok)b.classList.add("wrong");
    finish(o.ok,`<div class="mute sm">جواب درست: <b>${esc(c[key])}</b></div>`);
  });
}
/* --- تایپی --- */
function qType(){
  const c=cur();
  app.innerHTML=`${progress()}<div class="card"><p class="mute sm center">معادل آلمانی/انگلیسی رو بنویس</p>
   <div class="big center" style="margin:10px 0">${esc(c.back)}</div>
   ${c.context?`<p class="mute sm de center">«${esc(c.context)}»</p>`:""}
   <input id="ti" class="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">
   <button class="full" id="tc" style="margin-top:10px">بررسی</button><div id="fb"></div></div>`;
  const chk=()=>{
    const v=$("#ti").value;if(!v.trim())return;
    $("#ti").disabled=true;$("#tc").disabled=true;
    finish(nz(v)===nz(c.front),`<div class="big2 de center">${esc(c.front)}</div>`);
  };
  $("#tc").onclick=chk;
  $("#ti").onkeydown=e=>{if(e.key==="Enter")chk()};
  setTimeout(()=>$("#ti").focus(),100);
}
/* --- شنیداری --- */
function qListen(){
  const c=cur();
  const opts=shuffle([{t:c.front,ok:true},...distractors("front").map(t=>({t,ok:false}))]);
  app.innerHTML=`${progress()}<div class="card center"><p class="mute sm">گوش کن — کدوم کلمه رو شنیدی؟</p>
   <button class="ghost" id="pl" style="padding:12px 20px;margin:10px 0"><svg class="ic-svg" style="width:28px;height:28px" aria-hidden="true"><use href="#i-sound"/></svg></button>
   <div id="opts">${opts.map((o,i)=>`<button class="opt de" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
   <div id="fb"></div></div>`;
  const play=()=>say(c.front,c.lang);
  $("#pl").onclick=play;setTimeout(play,400);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add("right")});
    if(!o.ok)b.classList.add("wrong");
    finish(o.ok,`<div class="big2 de center">${esc(c.front)}</div><div class="mute">${esc(c.back)}</div>`);
  });
}
/* --- جای خالی --- */
function qCloze(){
  const c=cur();
  const re=new RegExp("(?<![\\p{L}])"+bare(c.front).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}])","iu");
  const sent=c.context.replace(re,"_____");
  const opts=shuffle([{t:bare(c.front),ok:true},...distractors("front").map(t=>({t:bare(t),ok:false}))]);
  app.innerHTML=`${progress()}<div class="card"><p class="mute sm center">جای خالی رو پر کن</p>
   <div class="de" style="font:20px/1.9 var(--serif);margin:10px 0">${esc(sent)}</div>
   <p class="mute center">${esc(c.back)}</p>
   ${opts.map((o,i)=>`<button class="opt de" data-i="${i}">${esc(o.t)}</button>`).join("")}
   <div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add("right")});
    if(!o.ok)b.classList.add("wrong");
    finish(o.ok,`<div class="de center" style="font-size:18px">${esc(c.context)}</div>`);
  });
}
/* --- جور کردن --- */
function qMatch(){
  const g=S.cards.slice(S.i,S.i+5);
  const L=shuffle(g),R=shuffle(g);
  let pl=null,done=0;const wrong=new Set();
  app.innerHTML=`${progress()}<div class="card"><p class="mute sm center">هر واژه رو با معنی‌ش جفت کن (${g.length} جفت)</p>
   <div class="mt"><div>${L.map((c,i)=>`<button class="opt de" data-s="l" data-i="${i}">${esc(c.front)}</button>`).join("")}</div>
   <div>${R.map((c,i)=>`<button class="opt" data-s="r" data-i="${i}">${esc(c.back)}</button>`).join("")}</div></div>
   <div id="fb"></div></div>`;
  app.querySelector("#fb").innerHTML=`<button class="full ghost" id="skip" style="margin-top:10px">رد شدن ←</button>`;
  app.querySelector("#skip").onclick=()=>{g.forEach(c=>S.wrong.push(c));S.i+=g.length;nextQ()};
  document.querySelector(".mt").onclick=e=>{
    const b=e.target.closest(".opt");if(!b||b.disabled)return;
    if(b.dataset.s==="l"){
      document.querySelectorAll('[data-s="l"]').forEach(x=>x.style.borderColor="");
      b.style.borderColor="var(--accent)";pl=b;return;
    }
    if(!pl)return;
    const lc=L[+pl.dataset.i],rc=R[+b.dataset.i];
    if(lc===rc){
      pl.disabled=b.disabled=true;pl.style.borderColor="";pl.classList.add("right");b.classList.add("right");pl=null;
      if(++done===g.length){
        g.forEach(c=>{if(wrong.has(c))S.wrong.push(c);else S.ok++});
        S.i+=g.length;nextQ();
      }
    }else{
      wrong.add(lc);wrong.add(rc);
      b.classList.add("wrong");const p=pl;pl=null;p.style.borderColor="";
      setTimeout(()=>b.classList.remove("wrong"),500);
    }
  };
}
/* --- نتیجه --- */
function viewResult(){
  const total=S.cards.length,pct=Math.round(S.ok/total*100);
  const msg=pct===100?"بی‌نقص!":pct>=70?"آفرین!":pct>=40?"خوب پیش میری":"اشکالی نداره، تمرین یعنی همین";
  app.innerHTML=`<div class="card center"><div class="score">${pct}٪</div>
   <p><b>${msg}</b></p><p class="mute">${S.ok} درست از ${total} سؤال · حالت ${S.mode.name}</p>
   <div class="row" style="justify-content:center"><button id="again">دوباره</button><button class="ghost" id="home">حالت‌ها</button></div></div>
   ${S.wrong.length?`<div class="card"><b>مرور اشتباه‌ها (${S.wrong.length})</b>${[...new Map(S.wrong.map(c=>[c.id,c])).values()].map(c=>`<div class="wr"><div class="de"><b>${esc(c.front)}</b></div><div class="mute sm">${esc(c.back)}</div></div>`).join("")}</div>`:""}`;
  $("#again").onclick=()=>startMode(S.mode.id);
  $("#home").onclick=viewHome;
}
viewHome();
loadPracticeResume();
</script>
<script>
"use strict";
/* ---------- bottom nav: restore main app on chosen tab ---------- */
document.querySelectorAll("#poofNav button[data-tab]").forEach(function(b){
  b.addEventListener("click",function(){
    try{if(typeof savePracticeResume==="function")savePracticeResume()}catch(e){}
    var tab=b.dataset.tab;
    var st={tab:tab,scrollY:0,dictQ:"",textId:null};
    if(tab==="read"){
      try{var prev=JSON.parse(localStorage.getItem("poof_last_state")||"null");if(prev&&prev.textId)st.textId=prev.textId}catch(e){}
    }
    try{localStorage.setItem("poof_last_state",JSON.stringify(st))}catch(e){}
    location.href="./";
  });
});
/* ---------- bottom nav auto-hide on scroll (same thresholds as main app) ---------- */
/* practice.html has no sheet/popup/modal of its own, so the skip guard below only
   fires for a genuinely open <dialog>; it is kept so a future overlay is respected. */
function practiceOverlayOpen(){
  try{if(document.querySelector("dialog[open]"))return true}catch(e){}
  return false;
}
let lastToggleY=window.scrollY;
window.addEventListener("scroll",function(){
  var nav=document.getElementById("poofNav");
  if(!nav)return;
  if(practiceOverlayOpen())return; // never toggle while an overlay is open
  var y=window.scrollY;
  if(y<=90){nav.classList.remove("nav-hidden");lastToggleY=y}
  else if(y>lastToggleY+40){nav.classList.add("nav-hidden");lastToggleY=y}
  else if(y<lastToggleY-40){nav.classList.remove("nav-hidden");lastToggleY=y}
},{passive:true});
</script>
