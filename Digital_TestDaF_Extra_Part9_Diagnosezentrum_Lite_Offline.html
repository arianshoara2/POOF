:root{--ink:#193246;--dark:#142e42;--accent:#187c79;--accent2:#d0ede5;--muted:#657987;--line:#dce5e7;--bg:#f5f7f8;--white:#fff;--warn:#9b6b29;--bad:#ad4946;--good:#1e8461;--shadow:0 9px 30px rgba(23,48,63,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.85 Tahoma,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}a{color:var(--accent)}.layout{display:grid;grid-template-columns:274px minmax(0,1fr);min-height:100vh}.side{background:var(--dark);color:#e5f1f0;position:sticky;top:0;height:100vh;padding:20px 14px;overflow-y:auto}.logo{background:linear-gradient(135deg,#8de0c8,#2eaaa2);color:#0d3949;display:grid;place-items:center;border-radius:13px;width:44px;height:44px;font:800 21px Arial}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.brand strong{font-size:15px}.brand small{display:block;font-size:11px;color:#a6bdc7;line-height:1.5}.sidecap{font-size:11px;color:#9ab5c0;letter-spacing:1px;padding:12px 10px 4px}.navbtn{display:block;color:#d9e9eb;background:transparent;border:1px solid transparent;padding:10px;border-radius:10px;width:100%;text-align:right;font-size:13px;line-height:1.6}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.13)}.sidebottom{border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:#b7ced3;line-height:1.9;margin-top:18px;padding:15px 5px}.main{min-width:0;max-width:1360px;width:100%;padding:24px clamp(15px,3vw,46px) 60px;margin:0 auto}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:17px}.tiny{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 12px;font-size:13px;font-weight:bold;line-height:1.7}.btn.mainbtn{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--bad);border-color:#e4cbc9}.btn:hover:not(:disabled){filter:brightness(.97)}.hero{padding:27px;border-radius:19px;background:linear-gradient(122deg,#153348,#196863);color:white;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;left:-60px;top:-85px;width:240px;height:240px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 40px rgba(255,255,255,.03)}.hero h1{margin:7px 0;font-size:clamp(23px,3vw,37px);line-height:1.45}.hero p{max-width:840px;opacity:.91;margin:8px 0}.eyebrow{font:600 11px Arial;letter-spacing:1.1px;opacity:.78}h2{font-size:22px;line-height:1.5;margin:0 0 12px}h3{font-size:17px;line-height:1.5;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:16px 0}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:14px;text-align:center}.stat b{display:block;font:750 28px Arial,sans-serif;color:var(--dark)}.stat span{color:var(--muted);font-size:11px}.panel,.card{padding:19px;margin:13px 0}.card{cursor:pointer;margin:0}.card:hover{border-color:#71bfb5}.card h3{margin-bottom:5px}.tag{background:#e5f5f0;color:#126e62;padding:3px 9px;border-radius:100px;display:inline-flex;font-size:11px;font-weight:bold}.notice{padding:12px 14px;border-radius:10px;background:#e8f5f1;border-right:4px solid var(--accent);margin:12px 0}.warning{background:#fff5e7;border-right-color:#b88940}.source{padding:17px;background:#f8fafb;border:1px solid var(--line);border-radius:11px;margin:10px 0}.de{direction:ltr;text-align:left;font:15px/1.76 Arial,"Segoe UI",sans-serif;unicode-bidi:plaintext;white-space:pre-wrap}.de b{font-weight:700}.data{width:100%;border-collapse:collapse;direction:ltr;text-align:left;font-family:Arial,sans-serif}.data th,.data td{border:1px solid #dfe7ea;padding:9px 12px}.data th{background:#e9f2f3}.tablewrap{max-width:100%;overflow:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.question{padding:13px;border-radius:11px;background:#f9fbfc;border:1px solid var(--line);margin:11px 0}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.qhead b{font-size:14px}.qtag{font-size:10px;color:var(--accent);font-weight:bold}.opts{display:grid;gap:7px;margin-top:9px}.opt{display:flex;align-items:flex-start;gap:10px;direction:ltr;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid #dbe5e8;background:#fff;font:14px/1.6 Arial,sans-serif}.opt:has(input:checked){border-color:#4bafa3;background:#e6f6f1}.opt input{accent-color:var(--accent);margin-top:4px;flex-shrink:0}.answerbox{margin-top:12px;padding:14px;border:1px solid #d8e7e2;border-radius:11px;background:#f5faf8}.answerrow{padding:9px 11px;margin:7px 0;background:white;border-radius:8px;border:1px solid var(--line);font-size:13px}.answerrow.good{border-right:4px solid var(--good)}.answerrow.bad{border-right:4px solid var(--bad)}.terms{display:flex;flex-wrap:wrap;gap:6px}.term{border-radius:8px;background:#eaf1f4;padding:5px 9px;font:13px Arial,sans-serif;direction:ltr;unicode-bidi:plaintext}.muted{color:var(--muted)}.textbox{width:100%;min-height:160px;border:1px solid #cadde0;border-radius:10px;padding:12px;font:15px/1.75 Arial,"Segoe UI",sans-serif;direction:ltr;resize:vertical}.textbox:focus{outline:2px solid #93d0c7}.info{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}.subline{height:1px;background:var(--line);margin:20px 0}.timer{font:700 21px Arial,sans-serif;direction:ltr;color:var(--accent);letter-spacing:.5px}.score{font:750 27px Arial;color:var(--accent);direction:ltr}.bigclock{font:800 29px Arial;color:white;direction:ltr}.progress{background:#dde8e8;border-radius:8px;height:9px;overflow:hidden}.fill{height:100%;background:var(--accent)}.speaker{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0}.speaker select{max-width:min(100%,290px);border:1px solid var(--line);padding:7px;border-radius:8px;background:white;font-size:12px}.small{font-size:12px}.mobilejump{display:none}.rubric{font-size:13px}.rubric li{margin-bottom:5px}.footer{font-size:11px;color:var(--muted);text-align:center;margin:40px 0 0}.status{position:fixed;bottom:20px;left:17px;z-index:10;color:white;background:#173848;box-shadow:var(--shadow);border-radius:10px;padding:10px 14px;max-width:min(380px,85vw);font-size:13px}.spacer{height:8px}.sourcewarn{background:#fff6e8;padding:11px;border-radius:9px;font-size:12px}.hidemobile{display:block}
@media(max-width:930px){.layout{display:block}.side{position:relative;height:auto;padding:11px 15px}.side .sidecap,.side .navlist,.sidebottom{display:none}.brand{margin:0}.main{padding:15px 13px 45px}.mobilejump{display:block}.mobilejump select{width:100%;border-radius:9px;padding:10px;border:1px solid var(--line);background:#fff;margin:0 0 13px}.cards,.grid2{grid-template-columns:1fr}.hero{padding:23px}.panel{padding:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:425px){.stat b{font-size:23px}.hero h1{font-size:23px}.opt{font-size:13px}.toolbar{align-items:flex-start}h2{font-size:19px}.btn{padding:7px 10px}}

.navbtn small{display:block;font-size:10px;color:#adcbcf}.hero .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:3px 10px;font-size:11px}.diaggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.diagitem{border:1px solid var(--line);border-radius:9px;padding:12px;background:white}.diagitem b{display:block;font-size:13px}.diagitem .progress{margin-top:9px}.tagline{font-size:12px;color:#57747c}.navgroup{border-top:1px solid rgba(255,255,255,.12);margin-top:10px;padding-top:9px}.source.audioonly{border-right:3px solid #b79058;background:#fffcf5}.wordline{font-size:12px;color:var(--muted)}.examcard{padding:14px;border-radius:12px;background:white;border:1px solid var(--line);margin:9px 0}.examcard.done{background:#eff8f5;border-color:#8ac9ba}.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}.dot{width:9px;height:9px;background:#a9bbc1;border-radius:99px;display:inline-block}.dot.on{background:#17a18b}.pronunciation{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.summary-list{padding-right:20px}.summary-list li{margin-bottom:7px}.preview{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#f7faf9}.panel:focus-within{scroll-margin-top:10px}.headingline{display:flex;gap:9px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.focusbar{padding:7px 11px;background:#e7f4ef;border-radius:9px;font-size:12px}.minibox{padding:11px 14px;border-radius:9px;background:#eaf3f5}.microstatus{font-size:11px;color:#697e87} .rtl{direction:rtl;text-align:right}.hidden{display:none!important}.qcounter{color:#617d84;font-size:12px}.badges{display:flex;gap:6px;flex-wrap:wrap}.navbtn .progress{height:4px;margin-top:5px;background:#496779}.loading{background:#f8ebdd}.question.unanswered{border-color:#efccb1}.caution{border-right:4px solid #c48d49;background:#fff8ef;padding:12px 14px;border-radius:10px}.badgetiny{background:#ebf2f5;color:#366270;border-radius:20px;padding:2px 9px;font-size:11px}.readingtime{font-size:13px;font-weight:bold;color:#257b79}.rec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

</style></head><body><div id="root"></div><script>const DB={"modules":[{"title":"Argumentationsstruktur erkennen","fa":"خواندن: معماری استدلال","skill":"Lesen","focus":"structure","lesson":"**Argumentationsstruktur** یعنی ساختمان استدلال: ادعا، شاهد، اعتراض و نتیجه. در این فصل تمرکز بر عملکرد جمله‌هاست، نه فقط معنی واژه‌ها. واژگان: **hingegen** (در مقابل)، **dennoch** (بااین‌حال)، **voraussetzen** (پیش‌فرض گرفتن)، **einschränken** (محدود کردن). مثال: *Die Studie liefert Hinweise, jedoch keinen Beweis.* یعنی پژوهش نشانه‌هایی می‌دهد، اما اثبات قطعی نیست.","source":"Das Institut für Wissenschaftskommunikation an der Hochschule Neustadt testet seit zwei Semestern ein neues Format für Einführungsseminare. Anstatt die Sitzungen ausschließlich mit Vorträgen zu gestalten, erhalten die Studierenden vor jeder Veranstaltung einen kurzen Fachtext und bearbeiten anschließend in kleinen Gruppen eine Forschungsfrage. Die Verantwortlichen hoffen, dass die Teilnehmenden dadurch wissenschaftliche Aussagen genauer prüfen lernen.\nEine interne Befragung ergab, dass 74 Prozent der 180 befragten Studierenden die Gruppenarbeit als hilfreich einschätzten. Allerdings wurde nur nach der Zufriedenheit gefragt; die fachlichen Leistungen der Studierenden wurden nicht mit denen anderer Seminarformen verglichen. Die Projektleiterin warnt daher davor, aus dem Ergebnis unmittelbar eine bessere Lernleistung abzuleiten.\nEin weiterer Einwand betrifft die Arbeitsbelastung. Besonders Studierende, die nebenbei arbeiten, berichten von Schwierigkeiten, die vorbereitenden Texte rechtzeitig zu lesen. Als Reaktion will das Institut die Texte kürzen und stärker zwischen unverzichtbarer und ergänzender Lektüre unterscheiden. Eine vollständige Abschaffung der Vorbereitung ist hingegen nicht vorgesehen, weil sie den Kern des Formats bildet.\nDie Hochschulleitung möchte das Modell zunächst ein weiteres Semester untersuchen. Erst wenn zusätzlich Daten zur tatsächlichen Lernentwicklung vorliegen, soll über die Einführung in anderen Fachbereichen entschieden werden.","audio":"Eine studentische Vertreterin erklärt: Ich begrüße die Gruppenarbeit, weil wir dort lernen, Argumente zu prüfen. Aber die bisherige Befragung misst die Zufriedenheit, nicht den Lernerfolg. Besonders Berufstätige brauchen kürzere Pflichttexte. Ich würde das Format deshalb weiter erproben, statt es sofort überall einzuführen.","table":[["Indikator","Wert"],["Befragte","180"],["Positive Einschätzung","74 %"],["Vergleich mit anderen Seminarformen","noch nicht durchgeführt"]],"wPrompt":"Schreiben Sie einen argumentativen Absatz: Soll die Hochschule das Seminarformat sofort auf alle Fachbereiche übertragen? Berücksichtigen Sie Nutzen, Evidenz und Belastung.","wSample":"Das neue Seminarformat bietet eine sinnvolle Gelegenheit, wissenschaftliches Denken in kleinen Gruppen zu trainieren. Die positive Einschätzung von 74 Prozent der Befragten spricht dafür, dass viele Studierende die Methode akzeptieren. Allerdings lässt sich aus ihrer Zufriedenheit noch keine Verbesserung der Lernleistung ableiten. Hinzu kommt, dass vorbereitende Texte für berufstätige Studierende eine erhebliche Belastung darstellen können. Daher halte ich eine sofortige Ausweitung auf alle Fachbereiche für verfrüht. Die Hochschule sollte zunächst kürzere Pflichttexte testen und die Lernergebnisse mit denen herkömmlicher Seminare vergleichen. Erst danach wäre eine fundierte Entscheidung möglich.","wFa":"نمونه‌پاسخ میان پذیرش روش و اثبات اثربخشی تفاوت می‌گذارد. از دادهٔ ۷۴ درصدی فقط برای «رضایت» استفاده شده؛ نه برای ادعای بهبود یادگیری. نتیجه هم مشروط به پژوهش بیشتر است.","sPrompt":"Sprechen Sie 90 Sekunden: Erklären Sie einem Kommilitonen, warum die Hochschulleitung mit einer Ausweitung wartet.","sSample":"Die Hochschulleitung möchte das neue Format nicht sofort ausweiten, weil bisher wichtige Daten fehlen. Zwar bewerten viele Befragte die Gruppenarbeit positiv, aber Zufriedenheit bedeutet nicht automatisch bessere Lernergebnisse. Außerdem berichten einige Berufstätige über die zusätzliche Vorbereitung. Meiner Meinung nach ist die Entscheidung sinnvoll: Zuerst sollten die Texte angepasst und die tatsächlichen Lernfortschritte untersucht werden. Danach kann die Hochschule besser entscheiden, ob das Konzept auch in anderen Fachbereichen funktioniert.","sFa":"در گفتار، ابتدا تصمیم مدیریت را توضیح بده و بعد دلیل‌ها را به ترتیب مطرح کن. لازم نیست تمام جزئیات متن را بازگو کنی؛ محور، علت تصمیم است.","questions":[{"p":"Welche Funktion hat der zweite Absatz?","opts":["Er bestätigt einen nachgewiesenen Lernzuwachs.","Er begrenzt die Aussagekraft der Befragung.","Er beschreibt die technische Durchführung."],"a":1,"tag":"structure","why":["عملکرد آموزشی اثبات نشده است.","درست: نتیجه فقط رضایت را می‌سنجد.","موضوع فناوری مطرح نیست."]},{"p":"Worauf beziehen sich die 74 Prozent?","opts":["Auf die Zufriedenheit mit der Gruppenarbeit.","Auf eine höhere Prüfungsleistung.","Auf den Anteil berufstätiger Studierender."],"a":0,"tag":"evidence","why":["درست: ارزیابی مفیدبودن کارگروهی.","این اثر سنجیده نشده است.","وضعیت شغلی ۷۴ درصد نبوده است."]},{"p":"Warum sind die vorbereitenden Texte problematisch?","opts":["Sie enthalten wissenschaftlich falsche Aussagen.","Sie dürfen laut Hochschulordnung nicht verteilt werden.","Sie sind für einige Berufstätige zeitlich schwer zu bewältigen."],"a":2,"tag":"precision","why":["هیچ خطای علمی در متن گزارش نشده.","ممنوعیت قانونی وجود ندارد.","درست: مسئله، فشار زمانی است."]},{"p":"Welche konkrete Anpassung ist beim Seminarformat geplant?","opts":["Sämtliche Vorbereitung streichen.","Pflichtlektüre kürzen und Zusatzlektüre kennzeichnen.","Seminare künftig ohne Gruppen durchführen."],"a":1,"tag":"action","why":["حذف کامل صریحاً رد شده است.","درست: تفکیک متن ضروری و تکمیلی.","گروه‌ها هستهٔ روش‌اند."]},{"p":"Wie ist die Haltung der Projektleiterin?","opts":["Vorsichtig hinsichtlich der Wirksamkeitsbehauptung.","Uneingeschränkt überzeugt vom Lernerfolg.","Grundsätzlich gegen Gruppenarbeit."],"a":0,"tag":"stance","why":["درست: هشدار به استنتاج شتاب‌زده.","دادهٔ عملکردی وجود ندارد.","با اجرای آزمایشی مخالف نیست."]},{"p":"Was muss vor der Ausweitung vorliegen?","opts":["Eine neue Mensa.","Ein höherer Anteil an Onlinekursen.","Daten zur tatsächlichen Lernentwicklung."],"a":2,"tag":"evidence","why":["موضوع غذا نیست.","تدریس آنلاین مطرح نشده است.","درست: معیار اصلی تصمیم بعدی."]},{"p":"Welche Aussage ist eine zulässige Schlussfolgerung?","opts":["Das Format wurde in allen Fachbereichen eingeführt.","Die Mehrheit der Befragten bewertet das Format positiv.","Die Methode verbessert nachweislich alle Prüfungsergebnisse."],"a":1,"tag":"inference","why":["گسترش هنوز تصمیم‌گیری نشده است.","درست: ۷۴ درصد بیش از نصف است.","رابطهٔ علّی و همه‌گیر اثبات نشده است."]},{"p":"Welche Formulierung gibt den Gesamtstandpunkt am besten wieder?","opts":["Vielversprechend, aber weiterer Nachweis nötig.","Wissenschaftlich widerlegt und eingestellt.","Vollständig erfolgreich und ohne Nachteile."],"a":0,"tag":"main","why":["درست: فرصت همراه با محدودیت شواهد.","آزمایش متوقف نشده است.","معایب و تردیدها ذکر شده‌اند."]}]},{"title":"Zahlen und Vergleiche exakt lesen","fa":"خواندن: تفسیر داده و مقایسه","skill":"Lesen","focus":"data","lesson":"تفاوت **Prozent** (درصد) و **Prozentpunkte** (واحد درصد) تعیین‌کننده است. افزایش سهم از ۲۴٪ به ۳۶٪ برابر ۱۲ واحد درصد و افزایش نسبی ۵۰٪ است. هنگام تفسیر جدول، جهت تغییر، مخرج هر درصد و تفاوت گروه‌ها را جداگانه کنترل کن.","source":"Die Stadtbibliothek Ostbrück hat gemeinsam mit einer Hochschule untersucht, wie Studierende Lernplätze nutzen. Zwischen 2022 und 2025 stieg die Zahl der Bibliotheksbesuche, während die Zahl der klassischen Ausleihen leicht zurückging. Die Forschenden vermuten, dass die Bibliothek zunehmend als Arbeitsort und weniger ausschließlich als Ort der Medienausleihe wahrgenommen wird.\nBesonders auffällig ist die Entwicklung bei den Gruppenräumen. Der Anteil der befragten Studierenden, die mindestens einmal wöchentlich einen solchen Raum nutzten, erhöhte sich von 24 auf 36 Prozent. Das entspricht einem Zuwachs von zwölf Prozentpunkten. Die Zahl sagt jedoch nichts darüber aus, wie lange die einzelnen Räume tatsächlich belegt waren.\nGleichzeitig zeigen die Daten eine soziale Ungleichheit: Studierende mit langen Pendelwegen berichteten seltener von einer regelmäßigen Nutzung am Abend. Die Bibliotheksleitung erwägt deshalb, digitale Reservierungen mit einer flexibleren Stornierung einzuführen. Ein längeres Offenhalten des Gebäudes ist bisher nicht beschlossen, da Personal- und Energiekosten zunächst berechnet werden müssen.\nDie Autorinnen der Studie empfehlen, im nächsten Jahr zusätzlich die tatsächlichen Belegungszeiten zu messen. Erst dann lässt sich zuverlässiger feststellen, ob neue Räume nötig sind oder bestehende Räume besser verteilt werden sollten.","audio":"Im Interview sagt die Bibliotheksleiterin: Mehr Besuche bedeuten nicht unbedingt mehr Ausleihen. Vor allem die Gruppenräume sind gefragt. Trotzdem wissen wir bisher nicht, wie viele Stunden sie wirklich belegt werden. Darum wollen wir die Nutzung präziser erfassen, bevor wir neue Flächen planen.","table":[["Indikator","2022","2025"],["Mind. wöchentliche Gruppenraumnutzung","24 %","36 %"],["Besuche","130.000","151.000"],["Klassische Ausleihen","92.000","86.000"]],"wPrompt":"Fassen Sie den Text und die Daten in 100–150 Wörtern zusammen. Vermeiden Sie unbelegte Schlussfolgerungen.","wSample":"Die Stadtbibliothek Ostbrück wird von Studierenden zunehmend als Lernort genutzt. Zwischen 2022 und 2025 stieg die Zahl der Besuche von 130.000 auf 151.000, während klassische Ausleihen von 92.000 auf 86.000 zurückgingen. Besonders deutlich entwickelte sich die Nutzung der Gruppenräume: Der Anteil der Befragten, die solche Räume mindestens wöchentlich nutzen, nahm von 24 auf 36 Prozent zu, also um zwölf Prozentpunkte. Allerdings erfassen diese Angaben nicht die tatsächliche Dauer der Raumnutzung. Zudem nutzen Studierende mit langen Pendelwegen die Räume am Abend seltener. Deshalb erwägt die Bibliothek flexiblere digitale Reservierungen. Über längere Öffnungszeiten oder den Bau neuer Räume wurde noch nicht entschieden. Zunächst sollen genauere Belegungsdaten erhoben werden.","wFa":"نمونه، هر چهار عدد را دقیق حفظ می‌کند و تفاوت «رشد استفادهٔ هفتگی» با «مدت اشغال اتاق‌ها» را مشخص می‌کند. هیچ برنامهٔ تأییدنشده‌ای را قطعی معرفی نمی‌کند.","sPrompt":"Erklären Sie die wichtigsten Unterschiede in der Tabelle in 90 Sekunden.","sSample":"Die Tabelle zeigt gegenläufige Entwicklungen. Die Besuche nahmen von 130.000 auf 151.000 zu. Gleichzeitig gingen die klassischen Ausleihen von 92.000 auf 86.000 zurück. Auch die regelmäßige Nutzung der Gruppenräume stieg, und zwar von 24 auf 36 Prozent. Das sind zwölf Prozentpunkte mehr. Daraus lässt sich schließen, dass die Bibliothek stärker als Lern- und Arbeitsort genutzt wird. Ob mehr Räume notwendig sind, lässt sich ohne Angaben zur tatsächlichen Belegung aber noch nicht sicher sagen.","sFa":"در توصیف شفاهی می‌توانی از *gegenläufige Entwicklungen* (روندهای خلاف‌جهت) استفاده کنی؛ ولی نتیجه‌گیری را به آنچه جدول واقعاً نشان می‌دهد محدود کن.","questions":[{"p":"Um wie viele Prozentpunkte stieg die regelmäßige Gruppenraumnutzung?","opts":["Um 12 Prozentpunkte.","Um 50 Prozentpunkte.","Um 36 Prozentpunkte."],"a":0,"tag":"data","why":["درست: ۳۶ منهای ۲۴ برابر ۱۲ است.","۵۰٪ رشد نسبی است، نه واحد درصد.","۳۶ درصد مقدار نهایی است."]},{"p":"Wie veränderten sich die klassischen Ausleihen?","opts":["Sie stiegen um 6.000.","Sie sanken um 6.000.","Sie blieben konstant."],"a":1,"tag":"data","why":["جهت تغییر برعکس است.","درست: ۹۲ هزار به ۸۶ هزار رسید.","مقادیر برابر نیستند."]},{"p":"Welche Information fehlt für eine verlässliche Raumbedarfsentscheidung?","opts":["Die Zahl der Lehrstühle.","Der Anteil an Erstsemestern.","Die tatsächliche Belegungsdauer."],"a":2,"tag":"evidence","why":["تعداد کرسی‌های دانشگاه مطرح نیست.","ورودی‌های جدید سنجیده نشده‌اند.","درست: استفادهٔ هفتگی مدت اشغال را نشان نمی‌دهد."]},{"p": *ich halte es für sinnvoll, allerdings ...* موافقت مشروط است، نه رد کامل.","source":"An einer Hochschule wird über eine verpflichtende Einführung elektronischer Laborprotokolle diskutiert. Bislang dokumentieren viele Studierende ihre Experimente handschriftlich. Die Verwaltung verweist darauf, dass digitale Protokolle leichter archiviert und mit Lehrenden geteilt werden könnten. Einige Institute verwenden solche Systeme bereits freiwillig. Eine verbindliche Regelung ist jedoch noch nicht beschlossen.\nDie Arbeitsgruppe empfiehlt eine Testphase in zwei Fachbereichen. Anschließend sollen Datenschutz, Kosten und technische Zuverlässigkeit untersucht werden.","audio":"Moderator: Sollten alle Studierenden ihre Laborprotokolle künftig ausschließlich digital erstellen?\nProfessorin Weber: Ich sehe Vorteile bei der Dokumentation. Elektronische Protokolle lassen sich leichter gemeinsam auswerten. Trotzdem wäre eine sofortige Pflicht problematisch: Gerade in kleinen Laboren ist die technische Ausstattung sehr unterschiedlich.\nStudentin Kaya: Ich nutze bereits eine digitale Vorlage. Bei Gruppenversuchen ist das praktisch. Aber wenn Geräte ausfallen, brauchen wir eine sichere Alternative. Außerdem darf das System nicht dazu führen, dass Studierende private Geräte anschaffen müssen.\nIT-Leiter Brandt: Wir könnten Tablets bereitstellen, doch dafür brauchen wir ein festes Budget. Wichtig ist auch, welche Daten gespeichert werden und wer sie später lesen kann. Ich empfehle zunächst einen Test in zwei Fachbereichen.\nModerator: Also sind Sie alle gegen Digitalisierung?\nProfessorin Weber: Nein, keineswegs. Wir sprechen über die Bedingungen einer sinnvollen Einführung, nicht über eine grundsätzliche Ablehnung.","table":[["Person","Schwerpunkt"],["Prof. Weber","Labor-Ausstattung"],["Studentin Kaya","Ausfallsicherheit / private Geräte"],["IT-Leiter Brandt","Budget / Datenschutz"]],"wPrompt":"Schreiben Sie einen Absatz, in dem Sie die drei Positionen korrekt wiedergeben und eine gemeinsame Lösung formulieren.","wSample":"Die Diskutierenden befürworten grundsätzlich die Möglichkeiten digitaler Laborprotokolle, betonen jedoch unterschiedliche Voraussetzungen. Professorin Weber verweist auf die uneinheitliche technische Ausstattung. Studentin Kaya schätzt digitale Gruppenarbeit, verlangt aber eine Ausweichlösung bei Störungen und lehnt private Anschaffungspflichten ab. Der IT-Leiter Brandt hält bereitgestellte Tablets für möglich, sofern ein Budget vorhanden ist und der Datenschutz geklärt wird. Gemeinsam ließe sich daher eine Pilotphase mit universitärer Ausstattung, einer Papieralternative für Störfälle und transparenten Zugriffsregeln einführen.","wFa":"در جمع‌بندی نباید هیچ شخصی را مخالف کامل دیجیتالی‌شدن معرفی کنی. هر فرد یک «شرط» یا «نگرانی خاص» دارد.","sPrompt":"Fassen Sie die unterschiedlichen Positionen in zwei Minuten zusammen. Nehmen Sie anschließend kurz Stellung.","sSample":"In der Diskussion geht es um elektronische Laborprotokolle. Professorin Weber sieht Vorteile bei der Auswertung, warnt aber vor einer sofortigen Pflicht. Kaya betont, dass technische Ausfälle berücksichtigt werden müssen und Studierende keine eigenen Geräte kaufen sollten. Brandt weist auf das Budget und den Datenschutz hin. Ich finde eine Pilotphase sinnvoll, weil sich dadurch technische Probleme erkennen lassen, bevor die Regelung für alle gilt.","sFa":"برای گزارش دیدگاه‌ها از *betont* (تأکید می‌کند)، *weist darauf hin* (اشاره می‌کند)، *schränkt ein* (محدود می‌کند) استفاده کن؛ نسبت‌ها را دقیق نگه دار.","questions":[{"p":"Welche Position vertritt Professorin Weber?","opts":["Sie lehnt elektronische Protokolle grundsätzlich ab.","Sie sieht Vorteile, warnt aber vor einer sofortigen Pflicht.","Sie fordert private Tablets für alle."],"a":1,"tag":"speaker","why":["مخالفت اصولی را صریحاً رد می‌کند.","درست: حمایت همراه با شرط.","الزام خرید شخصی دیدگاه او نیست."]},{"p":"Welches Risiko betont Kaya besonders?","opts":["Ausfälle und private Anschaffungskosten.","Fehlende wissenschaftliche Fachliteratur.","Zu viele gedruckte Lehrbücher."],"a":0,"tag":"speaker","why":["درست: پشتیبان و هزینهٔ خصوصی.","کتاب علمی موضوع سخن او نیست.","حجم کتاب چاپی بحث نشده."]},{"p":"Welche Voraussetzung nennt Brandt?","opts":["Mehr Seminarräume.","Ein anderer Studiengang.","Budget und geklärter Datenschutz."],"a":2,"tag":"condition","why":["اتاق در بحث نیست.","تغییر رشته مطرح نیست.","درست: دو نیاز مستقل."]},{"p":"Was ist der Status der verpflichtenden Regel?","opts":["Sie gilt bereits für alle.","Sie ist noch nicht beschlossen.","Sie wurde endgültig verboten."],"a":1,"tag":"time","why":["اختیاری‌بودن فعلی با الزام اشتباه شده.","درست: هنوز تصمیم نهایی نیست.","ممنوعیت قطعی مطرح نشده."]},{"p":"Wie soll die Einführung nach Empfehlung der Arbeitsgruppe beginnen?","opts":["Mit einem Test in zwei Fachbereichen.","Mit einer Pflicht in allen Laboren.","Mit der Abschaffung aller Experimente."],"a":0,"tag":"action","why":["درست: آزمایش محدود.","گسترش سراسری هنوز پیشنهاد نشده.","تجربهٔ عملی حذف نمی‌شود."]},{"p":"Welche gemeinsame Haltung lässt sich feststellen?","opts":["Alle wollen beim Papier bleiben.","Alle verlangen persönliche Laptops.","Sie halten Digitalisierung unter Bedingungen für möglich."],"a":2,"tag":"main","why":["همه مخالف دیجیتال نیستند.","خرید شخصی رد می‌شود.","درست: امکان همراه با شروط."]},{"p":"Was wäre eine falsche Wiedergabe?","opts":["Weber verweist auf unterschiedliche Ausstattung.","Kaya fordert die Abschaffung des Datenschutzes.","Brandt erwähnt Kosten für Tablets."],"a":1,"tag":"speaker","why":["درست مطابق گفتهٔ وبر است.","درست به‌عنوان گزارهٔ غلط: کایا چنین درخواستی ندارد.","برانت بودجه را مطرح کرده."]},{"p":"Welche Deutung von „keineswegs“ ist korrekt?","opts":["Eine deutliche Verneinung der Behauptung.","Ein zögerndes „vielleicht“.","Eine Zustimmung zur vollständigen Ablehnung."],"a":0,"tag":"precision","why":["درست: به‌هیچ‌وجه.","بار معنایی قوی‌تر از شاید است.","در واقع مخالفت با اتهام ضدیت کامل است."]}]},{"title":"Hörvortrag strukturiert auswerten","fa":"شنیدن: ساختار سخنرانی","skill":"Hören","focus":"lecture","lesson":"در سخنرانی دانشگاهی دنبال **Gliederungssignale** (نشانه‌های ساختار) بگرد: *zunächst* (ابتدا)، *ein weiterer Aspekt* (جنبهٔ دیگر)، *zusammenfassend* (در جمع‌بندی). نمودار یا اطلاعات عددی را با زمان و گروه همراه کن. رونوشت این بخش برای تحلیل بعد از پاسخ‌دادن است.","source":"Ein Forschungsteam untersuchte an drei Hochschulen, wie offene Lernmaterialien verwendet werden. Solche Materialien dürfen unter bestimmten Lizenzen kostenlos genutzt und angepasst werden. Die Studie fragte nicht, ob sämtliche frei zugänglichen Texte qualitativ hochwertig sind, sondern wie Lehrende sie finden, überprüfen und in ihre Kurse einbauen.\nDie Forschenden weisen darauf hin, dass die Zeit für Qualitätsprüfung oft unterschätzt wird. Auch müssen Lehrende die jeweiligen Lizenzbedingungen verstehen. Eine zentrale Beratungsstelle könnte die Nutzung erleichtern.","audio":"Guten Tag. Ich stelle Ihnen heute die Ergebnisse eines Projekts zur Nutzung offener Lehrmaterialien vor. Zunächst zum Untersuchungsdesign: An drei Hochschulen wurden 48 Lehrende befragt. Die Befragung war nicht repräsentativ für alle Hochschulen in Deutschland.\nEin erster Befund: Viele Lehrende begrüßen die Möglichkeit, Materialien kostenlos anzupassen. Das wichtigste Motiv ist dabei nicht allein die Kostenersparnis, sondern die bessere Anpassung an unterschiedliche Lerngruppen.\nEin zweiter Befund betrifft Schwierigkeiten. 29 der 48 Befragten gaben an, dass die Qualitätsprüfung viel Zeit kostet. Außerdem herrschte Unsicherheit darüber, welche Veränderungen die Lizenz erlaubt.\nDrittens wurden Unterstützungsmaßnahmen untersucht. Besonders häufig wünschten sich die Lehrenden kurze rechtliche Beratung und eine zentrale Plattform mit bereits geprüften Materialien.\nZusammenfassend lässt sich sagen: Offen verfügbare Materialien bieten Chancen. Ihr Nutzen hängt aber auch davon ab, ob Lehrende Unterstützung erhalten. Eine höhere Lernleistung der Studierenden wurde in diesem Projekt nicht gemessen.","table":[["Merkmal","Zahl"],["Befragte Lehrende","48"],["Hochschulen","3"],["Zeitaufwendige Qualitätsprüfung","29 von 48"]],"wPrompt":"Fassen Sie den Hörvortrag in etwa 130 Wörtern zusammen. Stellen Sie Methode, Befunde und Grenze der Aussagekraft dar.","wSample":"Der Vortrag beschreibt eine Befragung von 48 Lehrenden an drei Hochschulen zur Nutzung offener Lehrmaterialien. Viele Lehrende schätzen besonders die Möglichkeit, Materialien an unterschiedliche Lerngruppen anzupassen. Zugleich sehen sie Schwierigkeiten: 29 Befragte empfinden die Qualitätsprüfung als zeitaufwendig, außerdem bestehen Unsicherheiten über Lizenzbedingungen. Als Unterstützung wünschen sie sich eine zentrale Plattform mit geprüften Materialien sowie eine kurze rechtliche Beratung. Die Ergebnisse zeigen Chancen und praktische Hindernisse bei der Nutzung offener Lehrmaterialien. Allerdings ist die Befragung nicht repräsentativ für alle deutschen Hochschulen, und die Lernleistung der Studierenden wurde nicht untersucht. Daher lässt sich aus der Studie keine allgemeine Aussage über bessere Studienergebnisse ableiten.","wFa":"نمونه‌پاسخ هر سه لایهٔ روش، یافته و محدودیت را دارد. عدد ۲۹ از ۴۸ را با «همه» اشتباه نمی‌گیرد و اثر روی نمرات را ادعا نمی‌کند.","sPrompt":"Sprechen Sie zwei Minuten: Welche drei Hauptteile hat der Vortrag und welches Fazit zieht die Referentin?","sSample":"Der Vortrag besteht aus drei Hauptteilen. Zuerst erläutert die Referentin das Vorgehen: An drei Hochschulen wurden 48 Lehrende befragt. Danach beschreibt sie Vorteile und Probleme offener Materialien. Ein wichtiger Vorteil ist ihre Anpassbarkeit. Ein Problem ist der Zeitaufwand der Qualitätsprüfung. Im dritten Teil geht es um Unterstützung, etwa Beratung und eine geprüfte Plattform. Das Fazit lautet, dass offene Materialien Potenzial haben, aber nicht ohne organisatorische Hilfe erfolgreich eingesetzt werden können. Aussagen über bessere Lernergebnisse wären mit diesen Daten nicht gerechtfertigt.","sFa":"در خلاصهٔ شفاهی ساختار *zunächst – anschließend – schließlich – insgesamt* کمک می‌کند. از افزودن مزیت یا زیان پژوهش‌نشده خودداری کن.","questions":[{"p":"Wie viele Lehrende wurden befragt?","opts":["29","48","3"],"a":1,"tag":"data","why":["۲۹ تعداد افراد دارای مشکل بررسی کیفیت است.","درست: ۴۸ مدرس.","۳ تعداد دانشگاه‌هاست."]},{"p":"Wofür gilt die Befragung nicht als repräsentativ?","opts":["Für alle deutschen Hochschulen.","Für die 48 Befragten selbst.","Für die drei beteiligten Hochschulen überhaupt nicht."],"a":0,"tag":"scope","why":["درست: تعمیم ملی مجاز نیست.","برای پاسخ‌دهندگان خود داده دارد.","این نفی کلی از متن نتیجه نمی‌شود."]},{"p":"Welcher Vorteil wird besonders erwähnt?","opts":["Kostenpflichtige Zugänge.","Zentrale Prüfungen.","Anpassung an Lerngruppen."],"a":2,"tag":"main","why":["مواد آزاد رایگان یا قابل‌استفاده‌اند.","امتحان مرکزی ذکر نشده.","درست: انعطاف آموزشی."]},{"p":"Was berichteten 29 der 48 Befragten?","opts":["Die Lernleistung stieg.","Die Qualitätsprüfung kostet viel Zeit.","Alle Lizenzen seien identisch."],"a":1,"tag":"data","why":["عملکرد دانشجو سنجیده نشده.","درست: فشار زمانی کنترل کیفیت.","برعکس، مجوزها ابهام دارند."]},{"p":"Welche Unterstützung wurde gewünscht?","opts":["Rechtliche Kurzberatung und geprüfte Plattform.","Abschaffung der Lizenzbedingungen.","Nur gedruckte Bücher."],"a":0,"tag":"action","why":["درست: دو اقدام پیشنهادی.","حذف قانون مجوز مطرح نیست.","محدودکردن به چاپ خلاف هدف است."]},{"p":"Welche Aussage darf nicht aus dem Vortrag abgeleitet werden?","opts":["Offene Materialien haben Chancen.","Einige Lehrende sehen Lizenzprobleme.","Die Lernleistung wurde nachweislich verbessert."],"a":2,"tag":"evidence","why":["این در جمع‌بندی آمده.","چالش مجوزها مطرح شده.","درست به‌عنوان نتیجهٔ غیرمجاز: عملکرد سنجیده نشده."]},{"p":"Welche Reihenfolge hat der Vortrag?","opts":["Budget, Prüfungsnoten, Werbung.","Methode, Befunde, Unterstützung und Fazit.","Nur historische Entwicklung."],"a":1,"tag":"structure","why":["این ترتیب ارائه نشده.","درست: ساختار سه‌بخشی همراه با جمع‌بندی.","بحث تاریخی محور نیست."]},{"p":"Welche Wiedergabe ist sprachlich am genauesten?","opts":["Die Untersuchung deutet auf praktische Hürden hin.","Die Befragung beweist eine nationale Krise.","Die Forschenden bestätigten höhere Noten."],"a":0,"tag":"precision","why":["درست: ادعایی متناسب با داده.","شواهد ملی نیست.","نمرات بررسی نشده‌اند."]}]},{"title":"Argumentation unter Zeitdruck planen","fa":"نوشتن: طرح‌ریزی استدلال","skill":"Schreiben","focus":"writing_structure","lesson":"در مقالهٔ استدلالیِ دیجیتال باید هر جزء دستور را پوشش بدهی. **These** (موضع/ادعا)، **Begründung** (دلیل)، **Beispiel** (نمونه)، **Einwand** (اعتراض) و **Abwägung** (سنجش جوانب). این فصل به تشخیص پاراگراف ناقص و ساخت طرح واقع‌بینانه اختصاص دارد. زمان هر تکلیف نوشتاری رسمی: ۳۰ دقیقه. [در صورت تغییر مقررات: بررسی در testdaf.de]","source":"Der Senat einer Hochschule diskutiert über eine Wahlmöglichkeit zwischen Präsenz- und Online-Prüfungen. Befürworter verweisen auf die Erleichterung für pendelnde oder berufstätige Studierende. Kritiker halten dagegen, dass manche Online-Formate umfangreiche technische Kontrollen erfordern und nicht alle Prüfungsleistungen zu Hause zuverlässig vergleichbar sind.\nIm vergangenen Semester wurde eine Umfrage mit 260 Studierenden durchgeführt. 61 Prozent wünschten sich die Wahlmöglichkeit, 24 Prozent bevorzugten ausschließlich Präsenzprüfungen und 15 Prozent äußerten keine Präferenz. Die Untersuchung befasste sich mit Einstellungen, nicht mit Prüfungsergebnissen. Die Hochschulleitung erwägt deshalb eine Pilotphase für ausgewählte schriftliche Prüfungen.","audio":"Ein Mitglied des Prüfungsausschusses erklärt: Ich unterstütze Wahlmöglichkeiten grundsätzlich, aber sie funktionieren nicht für jedes Fach. Wir müssen vergleichbare Bedingungen schaffen und Datenschutzfragen klären. Eine Pilotphase erscheint mir geeigneter als eine sofortige allgemeine Verpflichtung.","table":[["Antwort","Anteil"],["Wahlmöglichkeit","61 %"],["Nur Präsenz","24 %"],["Keine Präferenz","15 %"]],"wPrompt":"Verfassen Sie einen argumentativen Text (mind. 200 Wörter): Sollte die Hochschule Studierenden grundsätzlich die Wahl zwischen Online- und Präsenzprüfungen ermöglichen? Berücksichtigen Sie Chancengleichheit, Organisation und mindestens einen Gegenstandpunkt.","wSample":"Ob Studierende zwischen Online- und Präsenzprüfungen wählen dürfen sollten, ist eine wichtige Frage für moderne Hochschulen. Eine solche Wahlmöglichkeit könnte die Teilnahme insbesondere für berufstätige Studierende und Personen mit langen Anfahrtswegen erleichtern. Wer nicht zu jeder Prüfung anreisen muss, kann Zeit und möglicherweise auch Kosten sparen. Zudem könnten Hochschulen dadurch bei räumlichen Engpässen flexibler reagieren.\nAllerdings ist nicht jede Prüfungsform ohne Weiteres für beide Varianten geeignet. Besonders bei mündlichen oder praktischen Leistungen müssen die Bedingungen vergleichbar bleiben. Auch technische Schwierigkeiten und der Schutz persönlicher Daten dürfen nicht unterschätzt werden. Kritiker wenden daher zu Recht ein, dass eine allgemeine Verpflichtung zur Bereitstellung beider Formate zusätzlichen organisatorischen Aufwand verursachen könnte.\nDie Umfrage an der Hochschule zeigt zwar, dass sich 61 Prozent der Befragten eine Wahl wünschen. Daraus folgt jedoch nicht, dass Online-Prüfungen zu besseren Ergebnissen führen oder dass sie in jedem Studiengang sinnvoll sind. Meiner Meinung nach sollte die Hochschule deshalb schrittweise vorgehen. In einer Pilotphase könnten zunächst ausgewählte schriftliche Prüfungen in beiden Formen angeboten werden. Anschließend wäre zu untersuchen, ob technische Probleme, Benachteiligungen oder Unterschiede bei der Bewertung auftreten. Erst auf dieser Grundlage ließe sich über eine umfassendere Einführung entscheiden. Wichtig wäre außerdem, die Erfahrungen der Studierenden und Lehrenden systematisch zu dokumentieren und bei Problemen klare technische Ansprechpartner bereitzustellen. Nur so könnte die Wahlmöglichkeit langfristig fair und verlässlich bleiben.","wFa":"نمونه مقاله نه فقط نظر، بلکه دلیل، اعتراض، قید اجرایی و پیشنهاد پایلوت دارد. ۶۱ درصد به «ترجیح» نسبت داده شده، نه به کیفیت نمرهٔ امتحان.","sPrompt":"Erklären Sie in 90 Sekunden, welche Argumente sich für und gegen die Wahlmöglichkeit anführen lassen.","sSample":"Für die Wahlmöglichkeit spricht vor allem die größere Flexibilität. Menschen mit langen Wegen oder einem Nebenjob könnten leichter teilnehmen. Andererseits sind Prüfungen nicht immer problemlos online durchführbar. Technische Störungen können die Chancengleichheit gefährden. Deshalb würde ich beide Formate zunächst nur bei geeigneten schriftlichen Prüfungen anbieten und die Ergebnisse vergleichen. So könnte die Hochschule Erfahrungen sammeln, bevor sie eine allgemeine Regel beschließt.","sFa":"الگوی مفید: *Dafür spricht ...; dagegen ist einzuwenden ...; deshalb schlage ich vor ...*. تعادل استدلال مهم‌تر از اصطلاحات تزئینی است.","questions":[{"p":"Welcher Satz formuliert eine passende These?","opts":["Das Thema ist interessant und modern.","Die Wahlmöglichkeit sollte zunächst erprobt werden.","Es gibt verschiedene Meinungen auf der Welt."],"a":1,"tag":"task","why":["بسیار کلی و بی‌موضع است.","درست: موضع روشن و قابل دفاع.","همچنان فاقد موضع است."]},{"p":"Welche Information ist in der Umfrage belegt?","opts":["61 % möchten eine Wahlmöglichkeit.","61 % erzielen online bessere Noten.","61 % lehnen Präsenz generell ab."],"a":0,"tag":"evidence","why":["درست: ترجیح ثبت شده.","عملکرد سنجیده نشده است.","ترجیح انتخاب، رد کامل حضوری نیست."]},{"p":"Welches Gegenargument ist für die Aufgabe relevant?","opts":["Die Mensa ist morgens voll.","Das Wetter ist im Winter schlecht.","Technische Probleme können faire Bedingungen beeinträchtigen."],"a":2,"tag":"relevance","why":["به قالب آزمون ارتباط مستقیم ندارد.","شرایط آب‌وهوا بحث اصلی نیست.","درست: عدالت در امتحان."]},{"p":"Was gehört zur geforderten Abwägung?","opts":["Nur Vorteile auflisten.","Vorteile und Risiken gegeneinander prüfen.","Ausschließlich Zahlen wiederholen."],"a":1,"tag":"structure","why":["دستور خواسته بررسی جوانب.","درست: سنجش استدلال‌های رقیب.","متن استدلالی فقط داده نیست."]},{"p":"Welche Formulierung ist unangemessen absolut?","opts":["Online-Prüfungen lösen immer alle Probleme.","Online-Prüfungen könnten Wege reduzieren.","Unter bestimmten Umständen wäre die Wahl sinnvoll."],"a":0,"tag":"precision","why":["درست به‌عنوان ادعای افراطی.","احتیاط و احتمال درست است.","شرط‌مند و دقیق است."]},{"p":"Welche Schlussfolgerung vermeidet einen Fehlschluss?","opts":["Mehrheitliche Zustimmung beweist faire Durchführung.","Alle Fächer müssen sofort umgestellt werden.","Zustimmung rechtfertigt eine Prüfung der Umsetzbarkeit."],"a":2,"tag":"inference","why":["ترجیح، انصاف را اثبات نمی‌کند.","از داده، الزام فوری حاصل نمی‌شود.","درست: بررسی امکان‌پذیری متناسب است."]},{"p":"Welche Überleitung zeigt einen Einwand an?","opts":["Zusammenfassend lässt sich sagen ...","Allerdings ist zu berücksichtigen, dass ...","Zunächst wird das Thema vorgestellt ..."],"a":1,"tag":"language","why":["جمع‌بندی است، نه اعتراض.","درست: نشانگر محدودیت یا ایراد.","نشانگر آغاز متن است."]},{"p":"Was fehlt einem Absatz, der nur „Ich bin dafür“ enthält?","opts":["Eine nachvollziehbare Begründung.","Eine bestimmte Anzahl Fremdwörter.","Eine persönliche Anschrift."],"a":0,"tag":"task","why":["درست: موضع بی‌دلیل کافی نیست.","واژهٔ بیگانه معیار نیست.","نشانی شخصی ارتباط ندارد."]}]},{"title":"Quellengetreu zusammenfassen","fa":"نوشتن: خلاصهٔ منبع و نمودار","skill":"Schreiben","focus":"summary","lesson":"در **Zusammenfassung** (خلاصه‌نویسی)، باید محتوای منبع را دقیق، گزینشی و با واژگان خودت بازگو کنی. آنچه سنجیده نشده را اضافه نکن و یک عدد را به گروه نادرست نسبت نده. هدف معمول تکلیف دیجیتال حدود ۱۰۰ تا ۱۵۰ واژه است. ساختار پیشنهادی: موضوع → روش/دامنه → یافته‌های متن و جدول → محدودیت.","source":"An der Hochschule Lindenfeld wurde untersucht, wie Studierende das Angebot psychologischer Beratung wahrnehmen. An einer freiwilligen Onlinebefragung nahmen 420 Personen teil. Die Erhebung erfasste, ob die Befragten das Angebot kannten und ob sie es schon einmal genutzt hatten. Der Gesundheitszustand der Teilnehmenden wurde nicht erhoben.\nWährend 68 Prozent angaben, von der Beratung gehört zu haben, berichteten nur 19 Prozent von einer bisherigen Nutzung. Besonders Erstsemester kannten die Angebote seltener als Studierende aus höheren Semestern. Aus den Antworten geht jedoch nicht hervor, ob fehlende Nutzung auf mangelnden Bedarf, unklare Öffnungszeiten oder andere Gründe zurückzuführen ist.\nDie Hochschulleitung plant deshalb, die Beratungsstellen bei der Erstsemesterbegrüßung sichtbarer vorzustellen und später eine weitere Befragung durchzuführen. Ob die Angebote ausgebaut werden müssen, ist derzeit offen.","audio":"Die Koordinatorin erläutert: Wir können nicht aus der niedrigen Nutzungsquote schließen, dass kaum jemand Unterstützung braucht. Die Befragung zeigt vor allem, dass Bekanntheit und Nutzung auseinanderliegen. Gründe dafür müssen wir erst genauer untersuchen.","table":[["Merkmal","Anteil der Befragten"],["Angebot bekannt","68 %"],["Angebot schon genutzt","19 %"],["Teilnehmende","420 Personen"]],"wPrompt":"Fassen Sie die Informationen aus dem Text und der Tabelle sachlich in etwa 100–150 Wörtern zusammen. Geben Sie keine eigene Empfehlung ab.","wSample":"Eine freiwillige Onlinebefragung an der Hochschule Lindenfeld untersuchte die Bekanntheit und Nutzung der psychologischen Beratungsangebote. Insgesamt nahmen 420 Studierende teil. Laut den Ergebnissen kannten 68 Prozent der Befragten das Angebot, während lediglich 19 Prozent angaben, es bereits genutzt zu haben. Besonders Studierende im ersten Semester waren seltener über die Angebote informiert als Personen aus höheren Semestern. Die Ursachen der geringen Nutzung lassen sich aus der Befragung nicht bestimmen. Insbesondere wurde nicht untersucht, ob die Befragten Unterstützung benötigten. Die Hochschule plant, die Beratungsstellen bei Veranstaltungen für Erstsemester deutlicher vorzustellen und anschließend erneut Daten zu erheben. Über eine mögliche Erweiterung des Angebots ist noch nicht entschieden worden.","wFa":"خلاصه، نظرسنجی داوطلبانه و مرز یافته‌ها را روشن نگه می‌دارد. مقدار «۱۹ درصد» استفادهٔ قبلی است، نه درصد افراد نیازمند کمک.","sPrompt":"Fassen Sie die Kernaussagen für eine studentische Arbeitsgruppe in zwei Minuten zusammen.","sSample":"Die Hochschule hat 420 Studierende freiwillig online befragt. Es ging darum, ob sie die psychologische Beratung kennen und schon einmal genutzt haben. 68 Prozent kannten das Angebot, aber nur 19 Prozent hatten es genutzt. Besonders Erstsemester wussten seltener davon. Die Untersuchung zeigt nicht, wie viele Menschen tatsächlich Beratung benötigen. Deshalb will die Hochschule zuerst besser informieren und anschließend weitere Daten sammeln. Über eine Erweiterung wurde noch nicht entschieden.","sFa":"در خلاصه شفاهی، عددها را با فعل درست بیان کن: *kennen* و *genutzt haben* یکی نیستند.","questions":[{"p":"Was wurde in der Untersuchung nicht erhoben?","opts":["Die Bekanntheit des Angebots.","Die frühere Nutzung.","Der Gesundheitszustand der Studierenden."],"a":2,"tag":"evidence","why":["شناخت طرح سنجیده شد.","استفادهٔ قبلی پرسیده شد.","درست: وضعیت سلامت سنجیده نشد."]},{"p":"Wofür stehen die 19 Prozent?","opts":["Für die bisherige Nutzung.","Für Studierende mit diagnostizierter Erkrankung.","Für die unbekannte Zielgruppe."],"a":0,"tag":"data","why":["درست: تجربهٔ استفادهٔ قبلی.","هیچ تشخیصی ثبت نشده.","۱۹ درصد ناشناختگی نیست."]},{"p":"Welche Behauptung ist unzulässig?","opts":["Die Bekanntheit ist größer als die Nutzung.","81 % benötigen nachweislich keine Beratung.","420 Personen haben teilgenommen."],"a":1,"tag":"inference","why":["درست و مبتنی بر مقادیر است.","درست به‌عنوان خطای استنتاج: استفاده‌نکردن مساوی بی‌نیازی نیست.","عدد منبع درست است."]},{"p":"Welche Maßnahme plant die Hochschule zur besseren Bek em freiwilligen Mentoringprogramm zugeordnet werden sollen. Erfahrene Studierende könnten Fragen zu Stundenplänen, Lernmaterialien und Prüfungsanmeldungen beantworten. Die Fachschaft verfügt allerdings nur über 30 Mentorinnen und Mentoren und erwartet etwa 240 neue Studierende.\nEinige Lehrende empfehlen Gruppenmentorate, damit möglichst viele Erstsemester teilnehmen können. Andere bezweifeln, dass in großen Gruppen vertrauliche Fragen gestellt werden. Noch ist offen, wie das Angebot organisiert wird.","audio":"Lena: Ich habe gerade mit dem Studium angefangen und weiß nicht, ob ich beim Mentoring mitmachen soll. Die Anmeldung wäre freiwillig, aber ich habe wenig Zeit. Was würdest du mir empfehlen?","table":[["Information","Angabe"],["Neue Studierende","ca. 240"],["Mentorinnen/Mentoren","30"],["Anmeldung","freiwillig"]],"wPrompt":"Schreiben Sie Ihrer Kommilitonin Lena eine kurze Empfehlung (ca. 120–150 Wörter). Begründen Sie die Empfehlung und berücksichtigen Sie ihre Zeit.","wSample":"Liebe Lena, ich würde dir empfehlen, das Mentoring zumindest in den ersten Wochen auszuprobieren. Gerade am Studienanfang tauchen häufig organisatorische Fragen auf, etwa zur Kurswahl oder zur Anmeldung von Prüfungen. Eine erfahrene Person kann dir helfen, wichtige Informationen schneller zu finden. Natürlich verstehe ich, dass du wenig Zeit hast. Deshalb würde ich vor der Anmeldung nachfragen, wie oft die Treffen stattfinden und ob die Teilnahme flexibel gestaltet werden kann. Vielleicht reicht zunächst ein kurzes Gruppentreffen aus. Du musst dich nicht für das gesamte Semester verpflichten, falls das Programm diese Möglichkeit anbietet. Wichtig ist, dass du Unterstützung bekommst, ohne deinen Stundenplan zusätzlich zu überlasten.","wFa":"توصیه باید با موقعیت شخصی مخاطب هماهنگ باشد. از جملهٔ «حتماً تمام ترم شرکت کن» که شرط برنامه را نمی‌دانی اجتناب شده است.","sPrompt":"Rat geben: Lena bittet um Rat. Bereiten Sie 30 Sekunden vor und antworten Sie 45 Sekunden lang.","sSample":"Ich würde dir empfehlen, das Mentoring zunächst auszuprobieren. Gerade im ersten Semester können Fragen zur Kurswahl und zu Prüfungsanmeldungen entstehen. Erfahrene Studierende können dir dabei helfen. Weil du wenig Zeit hast, würde ich vorher fragen, wie oft die Treffen stattfinden. Vielleicht gibt es kurze Gruppentermine. Wenn das Programm flexibel ist, könntest du teilnehmen, ohne dich zu stark zu belasten.","sFa":"مخاطب دوست است: *du* مناسب است، نه خطاب اداری با *Sie*. پیشنهاد باید مشخص و سازگار با «وقت کم» باشد.","questions":[{"p":"Was ist die zentrale Bitte von Lena?","opts":["Eine amtliche Bescheinigung.","Eine Empfehlung zur Teilnahme am Mentoring.","Die Finanzierung einer neuen Bibliothek."],"a":1,"tag":"task","why":["مدرک اداری نمی‌خواهد.","درست: تقاضای توصیه دارد.","کتابخانه موضوع نیست."]},{"p":"Welche Empfehlung berücksichtigt Lenas Situation?","opts":["Vor der Teilnahme zeitlichen Aufwand erfragen.","Ohne Prüfung für ein Jahr verpflichten.","Die Veranstaltungen nicht besuchen."],"a":0,"tag":"relevance","why":["درست: زمان محدود مخاطب دیده می‌شود.","الزام یک‌ساله در متن نیست.","حذف کلاس‌ها راه‌حل مرتبطی نیست."]},{"p":"Was ist über die Organisation bereits sicher?","opts":["Alle Treffen sind einzeln.","Es gibt eine feste Wochenpflicht.","Die Teilnahme ist freiwillig."],"a":2,"tag":"evidence","why":["قالب هنوز مشخص نیست.","برنامهٔ اجباری گزارش نشده.","درست: داوطلبانه است."]},{"p":"Warum werden Gruppenmentorate erwogen?","opts":["Damit möglichst viele Erstsemester profitieren.","Weil keine Mentorinnen vorhanden sind.","Damit Lehrende weniger Prüfungen korrigieren."],"a":0,"tag":"cause","why":["درست: ظرفیت ۳۰ در برابر ۲۴۰ نفر.","۳۰ راهنما وجود دارند.","تصحیح امتحان ارتباط ندارد."]},{"p":"Welches Gegenargument ist im Text genannt?","opts":["Die Räume sind zu warm.","Vertrauliche Fragen könnten in großen Gruppen seltener gestellt werden.","Erstsemester dürften keine Fragen stellen."],"a":1,"tag":"stance","why":["دما بحث نشده.","درست: نگرانی دربارهٔ محرمانگی.","پرسش‌کردن  verbessern. Eine mögliche Maßnahme ist die Beschränkung des Hauptparkplatzes. Wir erwarten weniger Stau, müssen aber die Situation von Pendelnden berücksichtigen. Vor der Entscheidung möchten wir die Stellungnahmen der Öffentlichkeit hören.","table":[["Aspekt","Status"],["Parkbeschränkung","Entwurf"],["Öffentliche Anhörung","geplant"],["Busverkehr frühmorgens","teilweise unregelmäßig"]],"wPrompt":"Schreiben Sie eine kurze Stellungnahme (ca. 140–170 Wörter) für die öffentliche Anhörung. Entwickeln Sie eine umsetzbare Alternative.","wSample":"Sehr geehrte Damen und Herren, ich begrüße das Ziel, den Verkehr rund um den Campus zu reduzieren. Eine ruhigere Umgebung und weniger Staus wären für viele Studierende von Vorteil. Die vorgeschlagene Beschränkung des Hauptparkplatzes könnte jedoch Personen benachteiligen, die aus ländlichen Regionen anreisen und morgens keine zuverlässige Busverbindung haben. Deshalb sollte die Stadt die Regelung nicht ohne ergänzende Angebote einführen. Denkbar wären ein Park-and-Ride-System mit häufigeren Anschlussbussen sowie zeitlich begrenzte Ausnahmen für nachweislich schlecht angebundene Wohnorte. Zusätzlich könnten sichere Fahrradabstellplätze geschaffen werden. Vor einer endgültigen Entscheidung wäre eine Befragung der Pendelnden sinnvoll. So ließen sich das Umweltziel und faire Zugangsmöglichkeiten zum Campus besser miteinander verbinden.","wFa":"در نامه هدف سیاست را می‌پذیری، پیامد نابرابر را بررسی می‌کنی و راه‌حلی اجرایی پیشنهاد می‌دهی. طرح پیشنهادی هنوز تصویب نشده؛ بنابراین از زمان آیندهٔ قطعی استفاده نشده است.","sPrompt":"Maßnahmen kritisieren: Nehmen Sie in 90 Sekunden zum Entwurf der Stadt Stellung und schlagen Sie eine Alternative vor.","sSample":"Ich unterstütze das Ziel, den Autoverkehr am Campus zu reduzieren. Der Entwurf zur Parkplatzbeschränkung könnte aber Studierende aus ländlichen Regionen benachteiligen, weil frühe Busverbindungen teilweise unzuverlässig sind. Deshalb würde ich die Maßnahme in dieser Form nicht sofort e 'use strict';

const KEY='digital-testdaf-extra9-diagnose-v1';
const cleanState=()=>({answers:{},graded:{},written:{},spoken:{},exam:{active:false,finished:false,stage:0,answers:{},started:0,deadline:0},voice:'',speed:0.92,exposure:false});
let state=cleanState();
try {const raw=localStorage.getItem(KEY);if(raw){let s=JSON.parse(raw);state={...state,...s,exam:{...state.exam,...s.exam}}}} catch(e){}
let page='home',timedEnd=0,timedName='',timerId=0,spokenQueue=[],recorder=null,recordChunks=[],recordLink=null,voiceList=[],statusTimeout=0;
const root=document.getElementById('root');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const em=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const wordCount=x=>(String(x||'').trim().match(/\S+/g)||[]).length;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const mq=(i,j)=>`m${i}_${j}`;
const eq=(i,j)=>`e${i}_${j}`;
const correct=(qs,ans,prefix)=>qs.reduce((a,q,j)=>a+(Number(ans[prefix(j)])===q.a?1:0),0);
const score=i=>correct(MODS[i].questions,state.answers,j=>mq(i,j));
const examScore=()=>EX.map((c,i)=>correct(c.questions,state.exam.answers,j=>eq(i,j))).reduce((a,b)=>a+b,0);
const pct=(a,b)=>b?Math.round(a/b*100):0;

function toast(s){document.querySelector('.status')?.remove();const d=document.createElement('div');d.className='status';d.textContent=s;document.body.appendChild(d);clearTimeout(statusTimeout);statusTimeout=setTimeout(()=>d.remove(),3900)}
function voiceOptions(){if(!('speechSynthesis' in window))return [];let v=speechSynthesis.getVoices();voiceList=v.filter(x=>String(x.lang).toLowerCase().startsWith('de'));return voiceList}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{voiceOptions();const e=document.getElementById('voicechoice');if(e){e.innerHTML=voicesHTML()}}}
function voicesHTML(){voiceOptions();return voiceList.length?voiceList.map(v=>`<option value="${esc(v.voiceURI)}" ${state.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">صدای آلمانی نصب نشده</option>'}
function stopVoice(){if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}spokenQueue=[]}
function speak(text){if(!('speechSynthesis' in window)){toast('این مرورگر گفتارساز ندارد. برای تمرین از متن جایگزین استفاده کن.');return}const vs=voiceOptions();if(!vs.length){toast('صدای آلمانی روی دستگاه پیدا نشد؛ می‌توانی متن را در بخش رونوشت ببینی.');return}stopVoice();let v=vs.find(x=>x.voiceURI===state.voice)||vs[0];let pieces=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];spokenQueue=pieces.flatMap(x=>x.length>200?(x.match(/.{1,160}(?:\s|$)/g)||[x]):[x]).filter(x=>x.trim());let j=0;function next(){if(j>=spokenQueue.length)return;let u=new SpeechSynthesisUtterance(spokenQueue[j++]);u.lang='de-DE';u.voice=v;u.rate=Number(state.speed)||.92;u.pitch=1;u.onend=next;u.onerror=()=>toast('پخش صوت توسط دستگاه متوقف شد. از متن جایگزین استفاده کن.');try{speechSynthesis.speak(u)}catch(e){toast('پخش صوت دستگاه ممکن نشد.')}}next()}
function speakSource(id,isExam=false){const c=isExam?EX[id]:MODS[id];speak(c.audio)}
function menu(){return `<aside class="side"><div class="brand"><div class="logo">9</div><div><strong>Digital TestDaF · Extra 9</strong><small>Diagnosezentrum | مرکز تشخیص ضعف</small></div></div><div class="navlist"><div class="sidecap">مدیریت تمرین</div><button class="navbtn ${page==='home'?'active':''}" onclick="go('home')">خانه و راهنمای تمرین</button><button class="navbtn ${page==='report'?'active':''}" onclick="go('report')">گزارش تشخیصی و برنامهٔ اصلاحی</button><div class="sidecap">هشت ماژول</div>${MODS.map((m,i)=>`<button class="navbtn ${page==='m'+i?'active':''}" onclick="go('m${i}')">${i+1}. ${esc(m.fa)} <small>${esc(m.title)} ${state.graded[i]?' · '+score(i)+'/8':''}</small></button>`).join('')}<div class="navgroup"><button class="navbtn ${page==='exam'?'active':''}" onclick="go('exam')">آزمون پایانیِ ۳ پرونده‌ای <small>۲۴ سؤال · ۳۵ دقیقه</small></button></div></div><div class="sidebottom">همهٔ مطالب تألیفی‌اند؛ نمرهٔ این برنامه سطح رسمی TDN نیست. ذخیره در دستگاه انجام می‌شود، نه سرور.</div></aside>`}

function frame(content){root.innerHTML=`<div class="layout">${menu()}<main class="main">${bar()}${content}<div class="footer">© محتوای آموزشی تألیفی | شبیه‌سازی رسمی نیست | بدون نیاز به شبکه</div></main></div>`}
function go(p){if(state.exam.active&&!state.exam.finished&&p!=='exam'){toast('آزمون در جریان است؛ برای اجرای قانون بدون بازگشت باید آن را به پایان برسانی.');return}stopVoice();page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){if(page==='home')return frame(home());if(page==='report')return frame(report());if(page==='exam')return frame(exam());if(/^m\d+$/.test(page))return frame(modulePage(+page.slice(1)));frame(home())}
const countGraded=()=>MODS.filter((_,i)=>state.graded[i]).length;
function home(){let complete=countGraded();return `<section class="hero"><span class="eyebrow">EXTRA PART 9 / DIAGNOSEZENTRUM</span><h1>آزمایشگاه تشخیص ضعف و آمادگی TDN 4</h1><p>از خواندن تحلیلی و شنیدن چندگوینده تا نوشتن علمی و پاسخ شفاهی. در هر مهارت، خطاها را دسته‌بندی کن و با تمرین هدفمند بهبود بده.</p><div class="flex"><span class="pill">۸ ماژول آموزشی</span><span class="pill">۸۸ سؤال تازه</span><span class="pill">۱۶ تمرین نوشتن و گفتار</span><span class="pill">HTML سبک و آفلاین</span></div></section><div class="stats"><div class="stat"><b>${complete}/8</b><span>ماژول تکمیل‌شده</span></div><div class="stat"><b>${MODS.reduce((a,m,i)=>a+(state.graded[i]?score(i):0),0)}/64</b><span>امتیاز تمرین آموزشی</span></div><div class="stat"><b>${state.exam.finished?examScore()+'/24':'—'}</b><span>آزمون پایانی</span></div><div class="stat"><b>${Object.keys(state.written).filter(k=>state.written[k]?.trim()).length}</b><span>متن نوشته‌شده</span></div></div><section class="panel"><h2>راهنمای استفادهٔ درست</h2><p>ابتدا ماژول‌ها را یکی‌یکی تمرین کن. در بخش‌های <b>Hören</b> تا حد امکان متن گفتاری را قبل از پاسخ‌دادن باز نکن. پاسخ‌نامهٔ تشریحی هر ماژول فقط پس از فشردن «ثبت و تصحیح» ظاهر می‌شود. وقتی حداقل شش ماژول را حل کردی، آزمون پایانی تازه را انجام بده.</p><div class="caution"><b>محدودیت واقع‌گرایانه:</b> شنیدن از صدای آلمانی نصب‌شده روی دستگاه استفاده می‌کند؛ اگر دستگاه چنین صدایی نداشته باشد، متن جایگزین موجود است. کیفیت آن برابر ضبط حرفه‌ای نیست. هیچ تبدیل خودکار درصد پاسخ درست به TDN رسمی انجام نمی‌شود.</div><div class="notice">در نسخهٔ دیجیتال واقعی، ترتیب تکالیف ثابت است و بعد از عبور از یک تکلیف امکان بازگشت ندارید. این فایل برای ارزیابی تشخیصی طراحی شده و یک آزمون رسمی چهارمهارتی کامل نیست. <a href="https://www.testdaf.de/de/teilnehmende/der-digitale-testdaf/aufbau-des-digitalen-testdaf/" target="_blank" rel="noreferrer">مشخصات رسمی TestDaF</a></div></section><section class="cards">${MODS.map((m,i)=>`<div class="card" onclick="go('m${i}')"><span class="tag">ماژول ${i+1} · ${esc(m.skill)}</span><h3>${esc(m.fa)}</h3><div class="de tiny">${esc(m.title)}</div><div class="tagline">محور تشخیصی: ${esc(m.focus)}</div><div class="progress" style="margin-top:12px"><div class="fill" style="width:${state.graded[i]?pct(score(i),8):0}%"></div></div><div class="small muted">${state.graded[i]?`امتیاز: ${score(i)}/8`:'هنوز تصحیح نشده'}</div></div>`).join('')}</section><div class="panel"><div class="headingline"><h2>آزمون پایانی سه‌مرحله‌ای</h2><span class="tag">۳۵ دقیقه · بدون بازگشت</span></div><p>سه پروندهٔ دانشگاهی کاملاً تازه، هر کدام هشت سؤال. در حالت آزمون رونوشت‌های گفتاری و پاسخ‌نامه تا پایان پنهان‌اند؛ انتخاب «بعدی» برگشت‌ناپذیر است.</p><button class="btn mainbtn" onclick="go('exam')">ورود به آزمون پایانی</button></div>`}
function dataTable(data){return `<div class="tablewrap"><table class="data">${data.map((row,i)=>`<tr>${row.map(cell=>`<${i===0?'th':'td'}>${esc(cell)}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</table></div>`}
function soundBlock(c,id,isExam,graded){return `<div class="source audioonly"><div class="headingline"><b>Hören — گفتار آلمانی</b><span class="badgetiny">گفتارساز دستگاه · صوت خارجی ندارد</span></div><p class="small muted">برای تمرین واقعی، ابتدا بدون دیدن رونوشت گوش بده. گفتارساز به صدای آلمانی موجود روی دستگاه وابسته است.</p><div class="speaker"><button class="btn mainbtn" onclick="speakSource(${id},${isExam})">▶ پخش آلمانی</button><button class="btn" onclick="stopVoice()">■ توقف</button><select id="voicechoice" onchange="state.voice=this.value;save()">${voicesHTML()}</select><label class="small">سرعت <select onchange="state.speed=Number(this.value);save()">${[.8,.92,1,1.1].map(v=>`<option value="${v}" ${state.speed===v?'selected':''}>${v}×</option>`).join('')}</select></label></div>${graded?`<details><summary>رونوشت کامل آلمانی (پس از تصحیح)</summary><div class="de source">${esc(c.audio)}</div></details>`:`<details><summary>رونوشت جایگزین برای دستگاه بدون صدای آلمانی (بازکردن آن آزمون شنیداری را آسان‌تر می‌کند)</summary><div class="de">${esc(c.audio)}</div><p class="small muted">اگر رونوشت را قبل از پاسخ دیده‌ای، نتیجهٔ بخش شنیداری را شاخص معتبر عملکرد شنیدن در نظر نگیر.</p></details>`}</div>`}
function sourceBlock(c,id,isExam,graded){let listening=isExam||c.skill==='Hören';return `<section class="panel"><div class="headingline"><h2>${listening?'منابع این پرونده':'متن دانشگاهی'}</h2><span class="tag">Deutsch · متن تألیفی</span></div>${!listening||isExam?`<div class="source de">${esc(c.source)}</div>`: `<details><summary>متن زمینهٔ پژوهشی (اختیاری؛ پس از شنیدن توصیه می‌شود)</summary><div class="source de">${esc(c.source)}</div></details>`}${soundBlock(c,id,isExam,graded)}<div class="source"><b>اطلاعات/جدول داده</b>${dataTable(c.table)}</div></section>`}
function questionHTML(q,key,graded,examMode){const val=examMode?state.exam.answers[key]:state.answers[key];return `<div class="question"><div class="qhead"><b class="de">${esc(q.p)}</b><span class="qtag">${esc(q.tag)}</span></div><div class="opts">${q.opts.map((opt,k)=>`<label class="opt"><input type="radio" name="${key}" value="${k}" ${val===k?'checked':''} ${graded?'disabled':''} onchange="setAnswer('${key}',${k},${examMode})">${'ABC'[k]}. ${esc(opt)}</label>`).join('')}</div>${graded?`<div class="answerbox"><b>پاسخ صحیح: ${'ABC'[q.a]} ${val===q.a?'<span style="color:#18815e">✓ درست</span>':'<span style="color:#a94747">✕ اشتباه یا بی‌پاسخ</span>'}</b>${q.opts.map((o,k)=>`<div class="answerrow ${k===q.a?'good':'bad'}"><b>${'ABC'[k]} — ${esc(o)}</b><div>${esc(q.why[k])}</div></div>`).join('')}</div>`:''}</div>`}
function setAnswer(key,v,isExam){if(isExam){if(!state.exam.active||state.exam.finished)return;state.exam.answers[key]=v}else{let match=/^m(\d+)_/.exec(key);if(!match||state.graded[Number(match[1])])return;state.answers[key]=v}save()}
function gradeModule(i){let c=MODS[i],missing=c.questions.map((q,j)=>state.answers[mq(i,j)]==null?j+1:null).filter(Boolean);if(missing.length&&!confirm('سؤال‌های بدون پاسخ: '+missing.join('، ')+'\nآیا تصحیح انجام شود؟'))return;state.graded[i]=true;save();render();toast(`امتیاز این ماژول: ${score(i)}/8`);window.scrollTo({top:0,behavior:'smooth'})}
function modulePage(i){let c=MODS[i],graded=!!state.graded[i];return `<section class="hero"><span class="eyebrow">DIAGNOSEMODULE ${i+1}/8 · ${esc(c.skill)}</span><h1>${esc(c.fa)}</h1><p>${esc(c.title)}</p><div class="flex"><span class="pill">۸ سؤال با تحلیل گزینه‌ها</span><span class="pill">یک تمرین نوشتن</span><span class="pill">یک تمرین گفتار</span></div></section><section class="panel"><h2>درس کوتاه و راهبرد</h2><p>${em(c.lesson)}</p><div class="focusbar">محور ارزیابی: ${esc(c.focus)}</div></section>${sourceBlock(c,i,false,graded)}<section class="panel"><div class="headingline"><h2>سؤالات تشخیصی</h2><span class="tag">${graded?'نتیجه '+score(i)+'/8':'پاسخ‌نامه تا ثبت مخفی است'}</span></div>${c.questions.map((q,j)=>questionHTML(q,mq(i,j),graded,false)).join('')}<div class="actions">${graded?`<button class="btn mainbtn" onclick="go('report')">مشاهدهٔ تحلیل پیشرفت</button>`:`<button class="btn mainbtn" onclick="gradeModule(${i})">ثبت پاسخ‌ها و نمایش تحلیل گزینه‌ها</button>`}<button class="btn" onclick="resetModule(${i})">تمرین مجدد این ماژول</button></div></section><section class="panel"><h2>تکلیف نوشتاری — Schreiben</h2><p class="de">${esc(c.wPrompt)}</p><div class="info"><span class="wordline">کلمات: <b id="wc${i}">${wordCount(state.written[i])}</b></span><button class="btn" onclick="startMiniTimer(30,'Schreiben')">۳۰ دقیقه تایمر</button><span id="miniclock" class="readingtime"></span></div><textarea id="writing${i}" class="textbox" placeholder="Antwort auf Deutsch ..." oninput="writeAnswer(${i},this.value)">${esc(state.written[i]||'')}</textarea>${graded?`<details class="answerbox"><summary>نمونه‌پاسخ آلمانی + تحلیل آموزشی فارسی</summary><div class="source de">${esc(c.wSample)}</div><p>${esc(c.wFa)}</p></details>`:`<p class="small muted">نمونه‌پاسخ پس از تصحیح سؤالات این ماژول در دسترس خواهد بود.</p>`}</section><section class="panel"><h2>تکلیف گفتاری — Sprechen</h2><p class="de">${esc(c.sPrompt)}</p><div class="actions"><button class="btn" onclick="startMiniTimer(1.5,'Sprechen')">۹۰ ثانیه صحبت</button><button class="btn" onclick="startMiniTimer(.5,'Vorbereitung')">۳۰ ثانیه آماده‌سازی</button><button class="btn" onclick="startRecording()">● ضبط</button><button class="btn" onclick="stopRecording()">■ پایان ضبط</button><button class="btn" onclick="downloadRecording()">دریافت صوت ضبط‌شده</button></div><textarea class="textbox" style="min-height:100px" placeholder="Notizen auf Deutsch ..." oninput="saveSpeech(${i},this.value)">${esc(state.spoken[i]||'')}</textarea>${graded?`<details class="answerbox"><summary>نمونه‌پاسخ گفتاری + توضیح فارسی</summary><div class="source de">${esc(c.sSample)}</div><p>${esc(c.sFa)}</p></details>`:''}<p class="small muted">ضبط میکروفون به مجوز مرورگر وابسته است. در بعضی مرورگرهای فایل‌های محلی فعال نیست؛ در آن صورت از ضبط‌کنندهٔ گوشی استفاده کن.</p></section><div class="actions"><button class="btn" onclick="go('home')">خانه</button>${i<7?`<button class="btn mainbtn" onclick="go('m${i+1}')">ماژول بعدی</button>`:`<button class="btn mainbtn" onclick="go('exam')">آزمون پایانی</button>`}</div>`}
function writeAnswer(i,v){state.written[i]=v;save();document.getElementById('wc'+i).textContent=wordCount(v)}
function saveSpeech(i,v){state.spoken[i]=v;save()}
function resetModule(i){if(!confirm('پاسخ‌های تستی این ماژول بازنشانی شوند؟ متن نوشتن و یادداشت گفتار باقی می‌مانند.'))return;MODS[i].questions.forEach((q,j)=>delete state.answers[mq(i,j)]);delete state.graded[i];save();render()}
function startMiniTimer(min,name){timedEnd=Date.now()+min*60000;timedName=name;toast('زمان‌سنج '+name+' شروع شد');const e=document.getElementById('miniclock');if(e)e.textContent=fmt(min*60)}
function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('ضبط در این مرورگر یا فایل محلی فعال نیست. از ضبط‌کنندهٔ گوشی استفاده کن.');return}if(recorder?.state==='recording')return;navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&recordChunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(recordLink)URL.revokeObjectURL(recordLink);recordLink=URL.createObjectURL(blob);toast('ضبط ذخیرهٔ موقت شد؛ روی «دریافت صوت» بزن.')};recorder.start();toast('ضبط آغاز شد. لطفاً پاسخ را به آلمانی بگو.')}).catch(()=>toast('مرورگر اجازهٔ میکروفون را نداد؛ از ضبط‌کنندهٔ گوشی استفاده کن.'))}
function stopRecording(){if(recorder?.state==='recording'){recorder.stop();toast('ضبط متوقف شد.')}}
function downloadRecording(){if(!recordLink){toast('ابتدا صدای خودت را ضبط کن.');return}const a=document.createElement('a');a.href=recordLink;a.download='TestDaF_Part9_Sprechen_'+Date.now()+'.webm';a.click()}
function exam(){let e=state.exam;if(e.finished)return examFinished();if(!e.active)return `<section class="hero"><span class="eyebrow">ABSCHLUSSDIAGNOSE · 3 FALLSTUDIEN</span><h1>آزمون پایانی — ۲۴ سؤال</h1><p>سه پروندهٔ تازه، هر کدام شامل متن دانشگاهی، صوت آلمانی و هشت سؤال. زمان کل ۳۵ دقیقه است. بعد از عبور از پروندهٔ فعلی به پروندهٔ قبلی برنمی‌گردی.</p></section><div class="panel"><h2>پیش از شروع</h2><p>این آزمون یک شبیه‌سازی تشخیصی است، نه چهار بخش کامل TestDaF. امتیاز حداکثر ۲۴ است؛ هیچ TDN رسمی از آن محاسبه نمی‌شود. بخش‌های شنیداری از گفتارساز دستگاه استفاده می‌کنند.</p><div class="caution">پس از شروع، خروج از صفحهٔ آزمون از طریق منو مسدود می‌شود. پاسخ‌نامه و رونوشت گفتار تا پایان نمایش داده نمی‌شوند. اگر مرورگر را ببندی، زمان‌سنج در ذخیرهٔ محلی ادامه می‌یابد (در صورت فعال‌بودن ذخیره در مرورگر).</div><button class="btn mainbtn" onclick="startExam()">شروع آزمون ۳۵ دقیقه‌ای</button></div>`;let i=e.stage,c=EX[i];if(Date.now()>=e.deadline){finishExam();return examFinished()}return `<section class="hero"><div class="headingline"><div><span class="eyebrow">PRÜFUNG ${i+1}/3</span><h1>${esc(c.fa)}</h1></div><div><div id="examclock" class="bigclock">${fmt((e.deadline-Date.now())/1000)}</div><span style="font-size:11px">زمان باقی‌ماندهٔ کل آزمون</span></div></div><div class="progress" style="background:#426d72"><div class="fill" style="width:${i/3*100}%"></div></div></section>${sourceBlock(c,i,true,false)}<section class="panel"><div class="headingline"><h2>۸ سؤال پروندهٔ ${i+1}</h2><span class="tag">پس از عبور، امکان بازگشت نیست</span></div>${c.questions.map((q,j)=>questionHTML(q,eq(i,j),false,true)).join('')}<div class="actions"><button class="btn mainbtn" onclick="nextExam()">${i===2?'پایان و تصحیح آزمون':'ثبت و عبور به پروندهٔ بعدی'}</button><button class="btn" onclick="finishExamConfirm()">اتمام زودهنگام</button></div></section>`}
function startExam(){if(!confirm('آزمون آغاز شود؟ بعد از عبور از پرونده‌ها برگشت ممکن نیست.'))return;state.exam={active:true,finished:false,stage:0,answers:{},started:Date.now(),deadline:Date.now()+35*60*1000};save();render()}
function nextExam(){if(!state.exam.active)return;const i=state.exam.stage;let missing=EX[i].questions.map((q,j)=>state.exam.answers[eq(i,j)]==null?j+1:null).filter(Boolean);if(missing.length&&!confirm('سؤال‌های بدون پاسخ: '+missing.join('، ')+'\nعبور بدون بازگشت انجام شود؟'))return;stopVoice();if(i===2)finishExam();else{state.exam.stage=i+1;save();render();window.scrollTo(0,0)}}
function finishExamConfirm(){if(confirm('آزمون را اکنون تمام می‌کنی؟ امکان ادامه و بازگشت به سؤال‌ها وجود نخواهد داشت.'))finishExam()}
function finishExam(){stopVoice();state.exam.active=false;state.exam.finished=true;save();page='exam';render()}
function resetExam(){if(!confirm('تمام پاسخ‌ها و نتیجهٔ آزمون پایانی حذف شوند؟'))return;state.exam={active:false,finished:false,stage:0,answers:{},started:0,deadline:0};save();render()}
function examFinished(){let total=examScore(),e=state.exam;return `<section class="hero"><span class="eyebrow">ERGEBNIS · ABSCHLUSSDIAGNOSE</span><h1>نتیجهٔ آزمون پایانی: ${total} از ۲۴</h1><p>امتیاز خام تمرینی، نه نمرهٔ رسمی TestDaF. برای مشاهدهٔ اشتباه‌ها و منطق هر گزینه، پرونده‌ها را در پایین باز کن.</p><div class="flex"><span class="pill">پروندهٔ ۱: ${correct(EX[0].questions,e.answers,j=>eq(0,j))}/8</span><span class="pill">پروندهٔ ۲: ${correct(EX[1].questions,e.answers,j=>eq(1,j))}/8</span><span class="pill">پروندهٔ ۳: ${correct(EX[2].questions,e.answers,j=>eq(2,j))}/8</span></div></section><section class="panel"><div class="actions"><button class="btn mainbtn" onclick="go('report')">گزارش خطاها و پیشنهاد تمرین</button><button class="btn" onclick="resetExam()">شروع آزمون جدید با حذف نتیجهٔ قبلی</button></div></section>${EX.map((c,i)=>`<section class="panel"><details><summary><b>پروندهٔ ${i+1}: ${esc(c.fa)}</b> — ${correct(c.questions,e.answers,j=>eq(i,j))}/8</summary><p><b>متن منبع</b></p><div class="source de">${esc(c.source)}</div><p><b>رونوشت گفتار</b></p><div class="source de">${esc(c.audio)}</div>${c.questions.map((q,j)=>questionHTML(q,eq(i,j),true,true)).join('')}</details></section>`).join('')}`}
function tagLabel(t){return ({structure:'ساختار استدلال',evidence:'دقت در شواهد',precision:'دقت زبانی',action:'تشخیص اقدام',stance:'موضع و دیدگاه',inference:'نتیجه‌گیری معتبر',main:'پیام اصلی',data:'تحلیل داده',cause:'علت و پیامد',speaker:'نسبت‌دادن دیدگاه',condition:'قید و شرط',time:'زمان و وضعیت',scope:'دامنهٔ ادعا',relevance:'ارتباط با صورت سؤال',language:'عبارت‌بندی آکادمیک',task:'انجام دستور',causality:'علیت و همبستگی'})[t]||t}
function stats(){let d={};MODS.forEach((m,i)=>{if(!state.graded[i])return;m.questions.forEach((q,j)=>{d[q.tag]??={ok:0,all:0};d[q.tag].all++;if(state.answers[mq(i,j)]===q.a)d[q.tag].ok++})});if(state.exam.finished)EX.forEach((m,i)=>m.questions.forEach((q,j)=>{d[q.tag]??={ok:0,all:0};d[q.tag].all++;if(state.exam.answers[eq(i,j)]===q.a)d[q.tag].ok++}));return d}
const recommends={data:'مقادیر جدول را با جمله‌های دقیقِ «von X auf Y» و «um X Prozentpunkte» بازگو کن و دو آمار را با هم قاطی نکن.',evidence:'برای هر پاسخ، مشخص کن کدام ادعا مستقیماً اندازه‌گیری شده و کدام ادعا صرفاً تفسیر است.',causality:'برای هر رابطهٔ مشاهده‌شده، دست‌کم یک عامل مداخله‌گر احتمالی پیدا کن؛ همبستگی را علت قطعی ننام.',speaker:'در شنیدن، برای هر گوینده سه ستون «موضع، دلیل، شرط» بساز.',time:'واژه‌های ursprünglich، inzwischen، künftig و bereits را در متن و صوت رنگی علامت بزن.',task:'دستور را به فعل‌های اصلی تقسیم کن: beschreiben، vergleichen، begründen، kritisieren.',inference:'با عبارت «از این داده دقیقاً چه چیزی نتیجه می‌شود؟» هر ادعا را ارزیابی کن.',structure:'بندها را به ادعا، شاهد، محدودیت و نتیجه تقسیم کن.',main:'در هر متن یک جملهٔ مرکزی بنویس و جزئیات فرعی را جدا نگه دار.',precision:'کمیت‌سازها، نفی، Modalverben و قیدهای شرط را جداگانه مرور کن.',stance:'پس از شنیدن، مشخص کن فرد موافق، مخالف یا موافقِ مشروط است.',relevance:'پیش از انتخاب گزینه از خودت بپرس آیا دقیقاً پاسخ سؤال است یا فقط نکته‌ای درست ولی فرعی.',language:'از یک استدلال خام، یک نسخهٔ دقیق با واژگان علمی محتاطانه بساز.',condition:'جملات دارای sofern، falls، nur wenn را به صورت شرط و نتیجه بازنویسی کن.',action:'«پیشنهاد»، «در حال آزمایش» و «تصمیم گرفته شده» را اشتباه نگیر.',scope:'دامنهٔ جامعهٔ آماری و محدودیت تعمیم را ثبت کن.',cause:'علت، هدف و پیامد را از یکدیگر جدا کن.'};
function report(){let d=stats(),tags=Object.entries(d).sort((a,b)=>pct(a[1].ok,a[1].all)-pct(b[1].ok,b[1].all));let weak=tags.filter(([t,v])=>v.all>=2&&pct(v.ok,v.all)<75).slice(0,5);let done=countGraded();return `<section class="hero"><span class="eyebrow">FEHLERDIAGNOSE · LERNEMPFEHLUNGEN</span><h1>نقشهٔ خطاهای تو</h1><p>گزارش از پاسخ‌های ثبت‌شده محاسبه می‌شود؛ هدف آن تعیین تمرین بعدی است، نه اعلام سطح رسمی TDN.</p><div class="flex"><span class="pill">${done}/8 ماژول تصحیح‌شده</span><span class="pill">${state.exam.finished?'آزمون پایانی تکمیل شده':'آزمون پایانی انجام نشده'}</span></div></section><section class="panel"><h2>عملکرد در هشت ماژول</h2><div class="diaggrid">${MODS.map((m,i)=>`<div class="diagitem"><b>${i+1}. ${esc(m.fa)}</b><span class="microstatus">${state.graded[i]?score(i)+'/8 · '+pct(score(i),8)+'٪':'هنوز ارزیابی نشده'}</span><div class="progress"><div class="fill" style="width:${state.graded[i]?pct(score(i),8):0}%"></div></div><button class="linkbtn" onclick="go('m${i}')">${state.graded[i]?'مرور خطاها':'شروع ماژول'}</button></div>`).join('')}</div></section><section class="panel"><h2>دقت بر اساس نوع خطا</h2>${tags.length?tags.map(([tag,v])=>`<div class="diagitem" style="margin:9px 0"><div class="info"><b>${esc(tagLabel(tag))}</b><span class="small">${v.ok}/${v.all} · ${pct(v.ok,v.all)}٪</span></div><div class="progress"><div class="fill" style="width:${pct(v.ok,v.all)}%"></div></div></div>`).join(''):'<p>ابتدا حداقل یک ماژول را حل و تصحیح کن تا دادهٔ تشخیصی ایجاد شود.</p>'}</section><section class="panel"><h2>برنامهٔ اصلاحی اختصاصی</h2>${weak.length?`<p>براساس خطاهای ثبت‌شده، این محورهای تمرین فعلاً در اولویت‌اند:</p><ol class="summary-list">${weak.map(([tag,v])=>`<li><b>${esc(tagLabel(tag))}</b> — ${esc(recommends[tag]||'این الگو را در تکالیف تازه تمرین کن.')}</li>`).join('')}</ol>`:done>0?'<p>در داده‌های موجود، خطای پرتکرار زیر ۷۵ درصد با حداقل دو سؤال دیده نشده است. این به معنای کسب قطعی TDN 4 نیست؛ برای سنجش بیشتر، سؤال‌های تازه و تکالیف تولیدی انجام بده.</p>':'<p>هنوز نتیجه‌ای ثبت نکرده‌ای. بعد از تصحیح فصل‌ها، پیشنهادهای اختصاصی ظاهر می‌شوند.</p>'}<div class="caution">برای Schreiben و Sprechen فقط متن‌ها و یادداشت‌ها ذخیره می‌شوند؛ سیستم خودکار نمی‌تواند کیفیت محتوایی، انسجام، تلفظ یا سطح TDN را معتبر تعیین کند. برای ارزیابی کیفی، خروجی را ارسال کن.</div><button class="btn mainbtn" onclick="exportReport(false)">دریافت JSON کامل برای تصحیح در گفت‌وگو</button></section>`}
function exportReport(isText){let o={title:'Digital TestDaF Extra Part 9 Diagnosezentrum',generated:new Date().toISOString(),notice:'educational scores only; no certified TDN',modules:MODS.map((m,i)=>({title:m.title,graded:!!state.graded[i],score:state.graded[i]?score(i):null,answers:m.questions.map((q,j)=>({question:q.p,selectedIndex:state.answers[mq(i,j)]??null,correctIndex:q.a,tag:q.tag})),writing:state.written[i]||'',speakingNotes:state.spoken[i]||''})),exam:{finished:state.exam.finished,score:state.exam.finished?examScore():null,answers:EX.map((m,i)=>({title:m.title,answers:m.questions.map((q,j)=>({question:q.p,selectedIndex:state.exam.answers[eq(i,j)]??null,correctIndex:q.a,tag:q.tag}))}))},tagDiagnostics:stats()};let str=isText?`TestDaF Extra Part 9 — Bericht\n${MODS.map((m,i)=>`\n# ${m.title}\nScore: ${state.graded[i]?score(i)+'/8':'nicht bewertet'}\nAntworten: ${m.questions.map((q,j)=>q.p+' => '+(state.answers[mq(i,j)]==null?'—':'ABC'[state.answers[mq(i,j)]])).join('\n')}\nSchreiben:\n${state.written[i]||''}\nSprechen Notizen:\n${state.spoken[i]||''}\n`).join('\n')}\nAbschluss: ${state.exam.finished?examScore()+'/24':'nicht abgeschlossen'}`:JSON.stringify(o,null,2);let blob=new Blob([str],{type:isText?'text/plain;charset=utf-8':'application/json;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Digital_TestDaF_Extra_Part9_Report.'+(isText?'txt':'json');a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('خروجی برای دانلود آماده شد.')}
function resetAll(){if(!confirm('تمام پاسخ‌های ذخیره‌شده، نوشته‌ها و نتیجهٔ آزمون پاک شوند؟'))return;state=cleanState();save();page='home';render()}
setInterval(()=>{let e=state.exam;if(e.active&&!e.finished&&Date.now()>=e.deadline){finishExam();toast('زمان آزمون به پایان رسید و پاسخ‌ها ثبت شدند.');return}let el=document.getElementById('examclock');if(el&&e.active)el.textContent=fmt((e.deadline-Date.now())/1000);let mini=document.getElementById('miniclock');if(mini&&timedEnd){let delta=(timedEnd-Date.now())/1000;mini.textContent=`${timedName}: ${fmt(delta)}`;if(delta<=0){timedEnd=0;toast('زمان مرحلهٔ '+timedName+' پایان یافت.')}}},500);
render();
