rd:{x:'Das Studienkolleg bereitet ausländische Studienbewerber auf ein Studium an einer deutschen Hochschule vor. Wer in seinem Heimatland keine Hochschulzugangsberechtigung hat, die in Deutschland anerkannt wird, muss dort zuerst ein bis zwei Semester lernen. Der Unterricht besteht aus Deutsch und Fachkursen, zum Beispiel Mathematik, Physik oder Wirtschaft. Am Ende steht die Feststellungsprüfung. Wer sie besteht, darf an einer Universität studieren. Für die Aufnahme muss man einen Test machen, bei dem Deutschkenntnisse und manchmal auch Mathematik geprüft werden. Die Plätze sind begrenzt, deshalb sollte man sich früh bewerben.',

ct:'Immer mehr Menschen {fahren} in der Stadt mit dem {Fahrrad}. Das ist {gesund}, {billig} und gut für die {Umwelt}. Außerdem {braucht} man keinen {Parkplatz}. Im {Winter} ist das Radfahren allerdings {schwierig}, weil es oft {regnet} oder {schneit}. Viele Städte {bauen} deshalb neue {Radwege}. Die {Politiker} wollen den {Verkehr} sicherer {machen}. Manche {Autofahrer} sind darüber {ärgerlich}, denn es gibt weniger {Platz} für Autos. Trotzdem {glauben} die meisten, dass die Zukunft dem Rad gehört.',
lt:{x:'Meine Schwester [1] seit drei Jahren in München. Sie arbeitet [2] Krankenschwester in einem großen Krankenhaus. Letzte Woche [3] sie eine neue Wohnung gefunden. Die Wohnung ist größer [4] die alte, aber auch teurer. Sie freut sich [5] den Umzug. Wenn sie Zeit [6], möchte sie ihre Eltern besuchen. Ich habe ihr gesagt, [7] sie mich nicht vergessen soll. Sie hat mir [8] Buch geschenkt, das ich lange lesen wollte. Zum Geburtstag [9] ich ihr eine Karte schicken. Hoffentlich kommt sie bald [10] Hause.',

rd:{x:'Immer mehr Studenten wohnen in einer Wohngemeinschaft, kurz WG. Dort teilen sich mehrere Personen eine Wohnung, haben aber jeweils ein eigenes Zimmer. Küche und Bad benutzen alle gemeinsam. Der größte Vorteil ist die Miete: Sie ist pro Person oft niedriger als bei einer eigenen Wohnung. Außerdem findet man leicht neue Freunde. Allerdings gibt es manchmal Streit, zum Beispiel über Sauberkeit oder Lärm. Deshalb machen viele WGs einen Putzplan, damit jeder weiß, wann er an der Reihe ist.',
q:[['Was bedeutet «WG»?',['Wartegruppe','Wohngemeinschaft','Wochengeld','Wegbeschreibung'],1,'متن: «Wohngemeinschaft, kurz WG».'],['Was benutzen alle Mitbewohner gemeinsam?',['Das eigene Zimmer','Den Balkon','Das Schlafzimmer','Küche und Bad'],3,'متن: آشپزخانه و حمام مشترک است.'],['Was ist der größte Vorteil einer WG?',['Mehr Platz','Weniger Lärm','Die niedrigere Miete','Ein Putzplan'],2,'متن: «Der größte Vorteil ist die Miete».'],['Worüber gibt es manchmal Streit?',['Über Sauberkeit oder Lärm','Über das Wetter','Über Hausaufgaben','Über Urlaub'],0,'متن: «über Sauberkeit oder Lärm».'],['Wozu dient der Putzplan?',['Um Geld zu sparen','Damit jeder weiß, wann er putzen muss','Um Freunde zu finden','Um Lärm zu machen'],1,'متن: تا همه بدانند نوبت چه کسی است.']]},
mt:[['Löse die Gleichung: 6x − 4 = 20. Wie groß ist x?',['2','5','4','24'],2,'۶x = ۲۴ ← x = ۴'],['Ein Pullover kostet 40 €. Der Preis steigt um 15 %. Wie hoch ist der neue Preis?',['46 €','45 €','55 €','6 €'],0,'۴۰ × ۱٫۱۵ = ۴۶'],['Berechne den Flächeninhalt eines Kreises mit dem Radius r = 3 cm (π ≈ 3,14).',['9,42 cm²','18,84 cm²','28,26 cm²','56,52 cm²'],2,'A = π·r² = ۳٫۱۴ × ۹ = ۲۸٫۲۶'],['Ein Quader ist 2 cm lang, 3 cm breit und 4 cm hoch. Wie groß ist das Volumen?',['9 cm³','14 cm³','20 cm³','24 cm³'],3,'حجم = ۲×۳×۴ = ۲۴'],['Löse die Gleichung: 3(x + 2) = 2x + 9.',['1','3','5','15'],1,'۳x + ۶ = ۲x + ۹ ← x = ۳'],['Von 250 Schülern bestehen 80 % die Prüfung. Wie viele Schüler bestehen?',['170','180','200','210'],2,'۲۵۰ × ۰٫۸ = ۲۰۰'],['Im Dreieck ist α = 50° und β = 60°. Wie groß ist der Winkel γ?',['70°','60°','110°','80°'],0,'مجموع زاویه‌ها ۱۸۰° ← ۱۸۰−۵۰−۶۰ = ۷۰'],['Der Umfang eines Rechtecks ist 30 cm, die Länge ist 9 cm. Wie breit ist es?',['15 cm','6 cm','21 cm','3 cm'],1,'u = ۲(a+b) ← a+b = ۱۵ ← b = ۶'],['Die Summe zweier aufeinanderfolgender Zahlen ist 41. Wie heißt die kleinere Zahl?',['21','22','19','20'],3,'x + (x+1) = ۴۱ ← x = ۲۰'],['Ein Kapital von 1000 € wird mit 3 % pro Jahr verzinst. Wie hoch sind die Zinsen nach einem Jahr?',['3 €','300 €','30 €','1030 €'],2,'۱۰۰۰ × ۰٫۰۳ = ۳۰']]}];

const BANK={"ct":[{"id":"ct01","topic":"دانشگاه و برنامه‌ریزی","full":"Ein Semester beginnt nicht erst mit der ersten Vorlesung. Viele Studierende müssen vorher ihren Stundenplan zusammenstellen und prüfen, welche Veranstaltungen verpflichtend sind. Besonders schwierig wird diese Aufgabe, wenn mehrere Seminare zur gleichen Zeit stattfinden. Wer rechtzeitig mit der Planung beginnt, kann Überschneidungen vermeiden und genügend Zeit zum Lernen einplanen. Trotzdem lässt sich nicht jede Woche vollständig kontrollieren. Manchmal fällt eine Veranstaltung aus oder ein Laborversuch dauert länger als erwartet. Dann hilft es, wichtige Aufgaben nach ihrer Dringlichkeit zu ordnen und die eigene Planung regelmäßig zu überprüfen.","masked":"Ein Semester beginnt nicht erst mit der ersten Vorlesung. Viele {Studierende} müssen {vorher} ihren {Stundenplan} zusammenstellen {und} prüfen, {welche} Veranstaltungen {verpflichtend} sind. {Besonders} schwierig {wird} diese {Aufgabe}, wenn {mehrere} Seminare {zur} gleichen {Zeit} stattfinden. {Wer} rechtzeitig {mit} der {Planung} beginnt, {kann} Überschneidungen {vermeiden} und {genügend} Zeit {zum} Lernen {einplanen}. Trotzdem {lässt} sich {nicht} jede {Woche} vollständig {kontrollieren}. Manchmal {fällt} eine Veranstaltung aus oder ein Laborversuch dauert länger als erwartet. Dann hilft es, wichtige Aufgaben nach ihrer Dringlichkeit zu ordnen und die eigene Planung regelmäßig zu überprüfen.","vocab":[["verpflichtend","اجباری"],["Überschneidung","تداخل"],["einplanen","در برنامه گنجاندن"],["Dringlichkeit","فوریت"],["Vorlesung","کلاس نظری"],["überprüfen","بررسی کردن"]],"gaps":25},{"id":"ct02","topic":"محیط زیست و شهر","full":"Städte werden im Sommer häufig deutlich wärmer als ihre Umgebung. Asphalt und Beton speichern die Wärme am Tag und geben sie nachts nur langsam wieder ab. Deshalb prüfen Stadtverwaltungen, wie zusätzliche Bäume und begrünte Dächer die Temperaturen senken können. Solche Maßnahmen verbessern oft auch die Luftqualität und bieten Insekten neue Lebensräume. Allerdings brauchen junge Bäume während langer Trockenperioden viel Wasser. Fachleute empfehlen daher, verschiedene Lösungen miteinander zu verbinden. Entscheidend ist nicht allein die Anzahl neuer Pflanzen, sondern auch die Frage, ob sie langfristig gepflegt werden können.","masked":"Städte werden im Sommer häufig deutlich wärmer als ihre Umgebung. Asphalt {und} Beton {speichern} die {Wärme} am {Tag} und {geben} sie {nachts} nur {langsam} wieder ab. Deshalb {prüfen} Stadtverwaltungen, {wie} zusätzliche {Bäume} und {begrünte} Dächer {die} Temperaturen {senken} können. {Solche} Maßnahmen {verbessern} oft {auch} die {Luftqualität} und {bieten} Insekten {neue} Lebensräume. {Allerdings} brauchen {junge} Bäume {während} langer {Trockenperioden} viel {Wasser}. Fachleute {empfehlen} daher, verschiedene Lösungen miteinander zu verbinden. Entscheidend ist nicht allein die Anzahl neuer Pflanzen, sondern auch die Frage, ob sie langfristig gepflegt werden können.","vocab":[["Umgebung","محیط اطراف"],["speichern","ذخیره کردن"],["begrünt","سبزپوش"],["Trockenperiode","دورهٔ خشکی"],["Maßnahme","اقدام"],["langfristig","بلندمدت"]],"gaps":25},{"id":"ct03","topic":"فناوری و داده‌ها","full":"Digitale Werkzeuge erleichtern inzwischen viele Aufgaben an Hochschulen. Mit einer Lernplattform können Studierende Materialien abrufen und ihre Übungen direkt einreichen. Gleichzeitig entstehen dabei Daten über ihr Verhalten, etwa darüber, wann sie Aufgaben öffnen oder wie häufig sie sich anmelden. Solche Informationen könnten Lehrenden helfen, Schwierigkeiten frühzeitig zu erkennen. Sie dürfen jedoch nicht ohne klare Regeln gesammelt und ausgewertet werden. Datenschutz bedeutet deshalb mehr als ein langes Formular, das niemand liest. Wichtig sind verständliche Erklärungen, sichere Systeme und die Möglichkeit, eigene Daten löschen zu lassen.","masked":"Digitale Werkzeuge erleichtern inzwischen viele Aufgaben an Hochschulen. Mit {einer} Lernplattform {können} Studierende {Materialien} abrufen {und} ihre {Übungen} direkt {einreichen}. Gleichzeitig {entstehen} dabei {Daten} über {ihr} Verhalten, {etwa} darüber, {wann} sie {Aufgaben} öffnen {oder} wie {häufig} sie {sich} anmelden. {Solche} Informationen {könnten} Lehrenden {helfen}, Schwierigkeiten {frühzeitig} zu {erkennen}. Sie {dürfen} jedoch {nicht} ohne {klare} Regeln {gesammelt} und {ausgewertet} werden. Datenschutz bedeutet deshalb mehr als ein langes Formular, das niemand liest. Wichtig sind verständliche Erklärungen, sichere Systeme und die Möglichkeit, eigene Daten löschen zu lassen.","vocab":[["abrufen","دریافت کردن"],["einreichen","تحویل دادن"],["auswerten","تحلیل کردن"],["Datenschutz","حفاظت داده"],["verständlich","قابل‌فهم"],["frühzeitig","زودهنگام"]],"gaps":25},{"id":"ct04","topic":"سلامت و خواب","full":"Ausreichender Schlaf spielt für das Lernen eine wichtige Rolle. Während der Nacht verarbeitet das Gehirn neue Informationen und verbindet sie mit bereits vorhandenem Wissen. Wer regelmäßig zu wenig schläft, kann sich am nächsten Tag häufig schlechter konzentrieren. Trotzdem versuchen manche Menschen, vor einer Prüfung möglichst lange wach zu bleiben. Forschende weisen darauf hin, dass kurze Wiederholungen und feste Schlafzeiten meist sinnvoller sind. Auch Bewegung am Tag und weniger helles Bildschirmlicht am Abend können helfen. Eine einzelne schlechte Nacht ist allerdings noch kein Beweis für eine dauerhafte Schlafstörung.","masked":"Ausreichender Schlaf spielt für das Lernen eine wichtige Rolle. Während {der} Nacht {verarbeitet} das {Gehirn} neue {Informationen} und {verbindet} sie {mit} bereits {vorhandenem} Wissen. {Wer} regelmäßig zu wenig {schläft}, kann {sich} am {nächsten} Tag {häufig} schlechter {konzentrieren}. Trotzdem {versuchen} manche {Menschen}, vor {einer} Prüfung {möglichst} lange {wach} zu {bleiben}. Forschende {weisen} darauf {hin}, dass {kurze} Wiederholungen {und} feste {Schlafzeiten} meist {sinnvoller} sind. Auch Bewegung am Tag und weniger helles Bildschirmlicht am Abend können helfen. Eine einzelne schlechte Nacht ist allerdings noch kein Beweis für eine dauerhafte Schlafstörung.","vocab":[["verarbeiten","پردازش کردن"],["vorhanden","موجود"],["konzentrieren","تمرکز کردن"],["hinweisen","اشاره کردن"],["dauerhaft","پایدار"],["Schlafstörung","اختلال خواب"]],"gaps":25},{"id":"ct05","topic":"مهاجرت و زندگی روزمره","full":"Ein Umzug in ein anderes Land verändert mehr als die Adresse. Selbst einfache Aufgaben können zunächst anstrengend sein, weil Behörden, Verkehrsregeln und soziale Gewohnheiten unbekannt sind. Viele Neuankömmlinge lernen die Sprache im Unterricht, verstehen aber Gespräche im Alltag noch nicht sofort. Geduld hilft, doch ebenso wichtig ist der Kontakt zu Menschen außerhalb des eigenen Sprachkreises. Vereine und gemeinsame Projekte schaffen Gelegenheiten, Erfahrungen auszutauschen und Missverständnisse zu klären. Mit der Zeit entstehen Routinen, die Sicherheit geben, ohne dass die eigene Herkunft an Bedeutung verliert.","masked":"Ein Umzug in ein anderes Land verändert mehr als die Adresse. Selbst {einfache} Aufgaben {können} zunächst {anstrengend} sein, {weil} Behörden, {Verkehrsregeln} und {soziale} Gewohnheiten {unbekannt} sind. {Viele} Neuankömmlinge {lernen} die {Sprache} im {Unterricht}, verstehen {aber} Gespräche im Alltag {noch} nicht {sofort}. Geduld {hilft}, doch {ebenso} wichtig {ist} der {Kontakt} zu {Menschen} außerhalb {des} eigenen {Sprachkreises}. Vereine {und} gemeinsame {Projekte} schaffen {Gelegenheiten}, Erfahrungen {auszutauschen} und Missverständnisse zu klären. Mit der Zeit entstehen Routinen, die Sicherheit geben, ohne dass die eigene Herkunft an Bedeutung verliert.","vocab":[["Neuankömmlinge","تازه‌واردان"],["Gewohnheit","عادت"],["Sprachkreis","جمع زبانی"],["Gelegenheit","فرصت"],["Missverständnis","سوءتفاهم"],["Herkunft","خاستگاه"]],"gaps":25},{"id":"ct06","topic":"علم و آزمایش","full":"Eine wissenschaftliche Behauptung muss sich grundsätzlich überprüfen lassen. In einem Experiment verändern Forschende möglichst nur einen wichtigen Faktor, während andere Bedingungen gleich bleiben. Erst dadurch können sie besser einschätzen, welche Ursache für ein beobachtetes Ergebnis verantwortlich ist. Besonders bei kleinen Stichproben treten jedoch zufällige Unterschiede auf. Deshalb wiederholen Arbeitsgruppen ihre Versuche und vergleichen die Ergebnisse mit unabhängigen Untersuchungen. Wenn eine Vermutung widerlegt wird, ist das kein Scheitern der Wissenschaft. Vielmehr ermöglicht die Korrektur, genauere Erklärungen zu entwickeln und neue Fragen zu stellen.","masked":"Eine wissenschaftliche Behauptung muss sich grundsätzlich überprüfen lassen. In {einem} Experiment {verändern} Forschende {möglichst} nur {einen} wichtigen {Faktor}, während {andere} Bedingungen {gleich} bleiben. {Erst} dadurch {können} sie {besser} einschätzen, {welche} Ursache {für} ein {beobachtetes} Ergebnis {verantwortlich} ist. {Besonders} bei {kleinen} Stichproben {treten} jedoch {zufällige} Unterschiede {auf}. Deshalb {wiederholen} Arbeitsgruppen {ihre} Versuche {und} vergleichen {die} Ergebnisse {mit} unabhängigen {Untersuchungen}. Wenn eine Vermutung widerlegt wird, ist das kein Scheitern der Wissenschaft. Vielmehr ermöglicht die Korrektur, genauere Erklärungen zu entwickeln und neue Fragen zu stellen.","vocab":[["Behauptung","ادعا"],["überprüfbar","آزمون‌پذیر"],["Stichprobe","نمونهٔ آماری"],["unabhängig","مستقل"],["widerlegen","رد کردن"],["Vermutung","فرض"]],"gaps":25},{"id":"ct07","topic":"اقتصاد و اشتغال دانشجویی","full":"Viele Studierende arbeiten neben dem Studium, um ihre Ausgaben zu decken. Ein Nebenjob kann finanzielle Unabhängigkeit schaffen und gleichzeitig praktische Erfahrungen vermitteln. Wenn die Arbeitszeiten jedoch ständig wechseln, wird eine regelmäßige Vorbereitung auf Prüfungen schwieriger. Deshalb lohnt sich ein genauer Blick auf den Vertrag und auf die erwartete Belastung. Nicht jede gut bezahlte Stelle passt zum Stundenplan oder zur persönlichen Gesundheit. Hochschulen bieten häufig Beratungen an, bei denen sich Fragen zu Beschäftigung und Studienorganisation klären lassen. Eine bewusste Entscheidung berücksichtigt daher mehr als den Stundenlohn.","masked":"Viele Studierende arbeiten neben dem Studium, um ihre Ausgaben zu decken. Ein {Nebenjob} kann {finanzielle} Unabhängigkeit {schaffen} und {gleichzeitig} praktische {Erfahrungen} vermitteln. {Wenn} die {Arbeitszeiten} jedoch {ständig} wechseln, {wird} eine {regelmäßige} Vorbereitung {auf} Prüfungen {schwieriger}. Deshalb {lohnt} sich {ein} genauer {Blick} auf {den} Vertrag {und} auf {die} erwartete {Belastung}. Nicht {jede} gut {bezahlte} Stelle {passt} zum {Stundenplan} oder {zur} persönlichen {Gesundheit}. Hochschulen bieten häufig Beratungen an, bei denen sich Fragen zu Beschäftigung und Studienorganisation klären lassen. Eine bewusste Entscheidung berücksichtigt daher mehr als den Stundenlohn.","vocab":[["Ausgaben","مخارج"],["Unabhängigkeit","استقلال"],["Belastung","فشار کاری"],["Beschäftigung","اشتغال"],["berücksichtigen","در نظر گرفتن"],["Stundenlohn","دستمزد ساعتی"]],"gaps":25},{"id":"ct08","topic":"هوش مصنوعی و آموزش","full":"Künstliche Intelligenz kann beim Lernen hilfreiche Vorschläge machen. Ein Programm erklärt beispielsweise einen mathematischen Lösungsweg oder formuliert einen schwierigen Absatz einfacher. Dabei klingt eine Antwort manchmal überzeugend, obwohl einzelne Aussagen falsch sind. Lernende sollten deshalb wichtige Informationen mit zuverlässigen Quellen vergleichen und die Begründungen selbst nachvollziehen. Lehrkräfte diskutieren außerdem, wie Aufgaben gestaltet werden können, bei denen nicht nur das Ergebnis zählt. Wer digitale Hilfe kritisch verwendet, entwickelt möglicherweise neue Fähigkeiten. Die Verantwortung für eine wissenschaftlich saubere Arbeit bleibt trotzdem bei den Menschen.","masked":"Künstliche Intelligenz kann beim Lernen hilfreiche Vorschläge machen. Ein {Programm} erklärt {beispielsweise} einen {mathematischen} Lösun  حالت یا معنای این جمله سازگار نیستند."}]}],"reading":[{"id":"rd01","topic":"زندگی در خوابگاه","genre":"گزارش","text":"In vielen Universitätsstädten sind günstige Zimmer schwer zu finden. Deshalb warten Studierende teilweise monatelang auf einen Platz im Wohnheim. Ein Forschungsprojekt untersuchte, wie sich gemeinschaftliche Räume auf den Alltag auswirken. Die Befragten schätzten besonders Küchen, in denen man sich ohne Verabredung begegnen kann. Gleichzeitig berichteten einige über Konflikte wegen Lärm und mangelnder Sauberkeit. Die Forschenden empfehlen, Bewohner schon vor dem Einzug über gemeinsame Regeln entscheiden zu lassen. Ein Putzplan allein löse jedoch keine sozialen Spannungen, wenn niemand miteinander spreche. Interessant war auch, dass nicht die Größe der Gemeinschaftsküche entscheidend war, sondern ihre regelmäßige Nutzung. Die Studie macht deshalb deutlich, dass gemeinschaftliches Wohnen sowohl räumliche als auch soziale Gestaltung braucht.","questions":[{"id":"rd01-1","kind":"پیام اصلی","question":"Was ist die wichtigste Aussage des Textes?","options":["Wohnheime sollten alle Küchen schließen.","Gemeinsames Wohnen braucht Räume und soziale Absprachen.","Eine große Küche verhindert jeden Streit.","Studierende wollen grundsätzlich allein wohnen."],"correct":1,"why":"در پایان بر طراحی فضا و ارتباط اجتماعی تأکید شده است."},{"id":"rd01-2","kind":"جزئیات","question":"Was schätzten die Befragten besonders?","options":["Küchen für spontane Begegnungen","Größere Parkplätze","Kostenlose Prüfungen","Abgeschlossene Einzelwohnungen"],"correct":0,"why":"متن ملاقات خودجوش در آشپزخانه را بیان می‌کند."},{"id":"rd01-3","kind":"واژگان","question":"Was bedeutet „mangelnde Sauberkeit“ im Zusammenhang?","options":["Übertriebene Ordnung","Fehlende Sauberkeit","Zu wenig Platz","Fehlende Beleuchtung"],"correct":1,"why":"mangelnd = ناکافی و نبودِ کافی."},{"id":"rd01-4","kind":"استنباط","question":"Warum reicht ein Putzplan nach Ansicht der Forschenden nicht immer?","options":["Weil Pläne verboten sind","Weil man auch Konflikte besprechen muss","Weil niemand putzen kann","Weil Küchen selten genutzt werden"],"correct":1,"why":"راه‌حل صرفاً سازمانی بدون گفت‌وگو کافی نیست."},{"id":"rd01-5","kind":"موضع نویسنده","question":"Wie ist die Haltung des Textes zum gemeinschaftlichen Wohnen?","options":["Ausschließlich negativ","Völlig begeistert und kritiklos","Abwägend und lösungsorientiert","Gleichgültig"],"correct":2,"why":"مزایا و مشکلات را هم‌زمان بیان می‌کند."}]},{"id":"rd02","topic":"هوش مصنوعی در یادگیری","genre":"تفسیر","text":"Immer mehr Hochschulen überlegen, wie sie mit Textgeneratoren umgehen sollen. Ein pauschales Verbot klingt zunächst einfach, lässt sich außerhalb beaufsichtigter Prüfungen jedoch kaum kontrollieren. Außerdem können digitale Werkzeuge Studierenden helfen, komplizierte Begriffe zu verstehen oder Entwürfe zu überarbeiten. Problematisch wird die Nutzung dann, wenn Lernende ungeprüfte Behauptungen übernehmen und fremde Texte als eigene Leistung ausgeben. Eine Dozentin schlägt deshalb vor, die Arbeitsprozesse stärker zu bewerten: Studierende sollen erklären, warum sie bestimmte Quellen ausgewählt haben und wie sie zu einem Ergebnis gekommen sind. Der Einsatz eines Programms wäre unter klaren Bedingungen erlaubt, aber nicht unsichtbar. Kritiker fürchten zusätzlichen Aufwand für Lehrende. Dennoch könnte eine solche Regelung langfristig mehr über das tatsächliche Verständnis aussagen als ein perfekt formulierter Text allein.","questions":[{"id":"rd02-1","kind":"پیام اصلی","question":"Welchen Umgang mit Textgeneratoren befürwortet der Text?","options":["Ein vollständiges Verbot in allen Situationen","Einen transparenten Einsatz und eine Bewertung der Arbeitswege","Die automatische Benotung aller Hausarbeiten","Die Abschaffung wissenschaftlicher Quellen"],"correct":1,"why":"اصل متن شفافیت و سنجش فرایند است."},{"id":"rd02-2","kind":"جزئیات","question":"Was sollen Studierende laut dem Vorschlag erklären?","options":["Wie teuer ihre Computer sind","Warum sie Quellen gewählt haben","Welche Programme am schnellsten sind","Ob sie gern allein lernen"],"correct":1,"why":"توضیح انتخاب منابع صریح آمده است."},{"id":"rd02-3","kind":"واژگان","question":"Was bedeutet „pauschal“ bei einem Verbot?","options":["Nur in Einzelfällen","Grundsätzlich und ohne Unterscheidung","Sehr kurzfristig","Schriftlich bestätigt"],"correct":1,"why":"pauschal یعنی کلی و بدون تفکیک."},{"id":"rd02-4","kind":"استنباط","question":"Warum könnte ein gut formulierter Text als Leistungsnachweis nicht genügen?","options":["Er kann das eigene Verständnis verdecken.","Er enthält immer Rechtschreibfehler.","Er ist meistens zu kurz.","Er lässt sich nicht speichern."],"correct":0,"why":"متن عالی لزوماً فرآیند فهم دانشجو را نشان نمی‌دهد."},{"id":"rd02-5","kind":"موضع نویسنده","question":"Wie beurteilt der Text den Vorschlag der Dozentin?","options":["Vorsichtig positiv, trotz möglicher Schwierigkeiten","Als völlig undurchführbar","Ohne erkennbare Bewertung","Als gefährlich für alle Lernenden"],"correct":0,"why":"رنج و هزینه را می‌پذیرد، امکان سود بلندمدت را نیز می‌بیند."}]},{"id":"rd03","topic":"فضای سبز شهری","genre":"گزارش","text":"Bei der Planung neuer Stadtviertel stehen häufig Wohnungen und Verkehrswege im Vordergrund. Grünflächen werden dagegen oft erst berücksichtigt, wenn die wichtigsten Gebäude bereits feststehen. Eine Untersuchung mehrerer Quartiere zeigt jedoch, dass kleine Parks und schattige Wege einen messbaren Einfluss auf die Nutzung öffentlicher Räume haben. Während heißer Tage hielten sich Menschen länger dort auf, wo Bäume ausreichend Schatten boten. Die Wirkung beschränkte sich nicht auf Freizeit: Auch Geschäfte profitierten von Wegen, die zu Fuß angenehm erreichbar waren. Allerdings sind Grünanlagen nicht kostenlos. Sie müssen gepflegt und in trockenen Sommern bewässert werden. Die Forschenden warnen deshalb vor der Vorstellung, man müsse lediglich möglichst viele Bäume pflanzen. Entscheidend sei eine langfristige Planung, die Kosten, Artenvielfalt und die Bedürfnisse der Bewohner verbindet.","questions":[{"id":"rd03-1","kind":"پیام اصلی","question":"Was ist die Kernaussage des Textes?","options":["Grünflächen sollten früh und langfristig geplant werden.","Wohngebäude sind grundsätzlich unnötig.","Nur große Parks haben einen Nutzen.","Bäume müssen in Städten verboten werden."],"correct":0,"why":"توصیه مرکزی برنامه‌ریزی بلندمدت فضاهای سبز است."},{"id":"rd03-2","kind":"جزئیات","question":"Welche Bereiche profitierten laut Untersuchung ebenfalls?","options":["Nur Schwimmbäder","Geschäfte an angenehmen Fußwegen","Ausschließlich Parkhäuser","Nur große Industrieanlagen"],"correct":1,"why":"اشاره به سود فروشگاه‌ها در مسیرهای پیاده."},{"id":"rd03-3","kind":"واژگان","question":"Was bedeutet „sich auf etwas beschränken“?","options":["Etwas vollständig verhindern","Nur einen bestimmten Bereich betreffen","Etwas schneller machen","Sich stark vermehren"],"correct":1,"why":"beschränken = محدود شدن."},{"id":"rd03-4","kind":"استنباط","question":"Warum ist allein die Zahl neuer Bäume kein guter Maßstab?","options":["Weil die Pflege und die Standortbedingungen wichtig sind.","Weil Bäume sofort wachsen.","Weil Menschen keinen Schatten mögen.","Weil jede Grünanlage kostenlos ist."],"correct":0,"why":"اثربخشی به نگهداری و شرایط وابسته است."},{"id":"rd03-5","kind":"موضع نویسنده","question":"Welche Haltung wird deutlich?","options":["Sachlich und differenziert","Spöttisch gegenüber Bewohnern","Ausschließlich werbend","Ablehnend gegenüber jeder Grünfläche"],"correct":0,"why":"متن با داده و محدودیت‌ها برخورد متعادل دارد."}]},{"id":"rd04","topic":"کار دانشجویی","genre":"گزارش","text":"Ein Nebenjob ist für viele Studierende notwendig, um Miete und Lebensmittel bezahlen zu können. Er kann aber auch wertvolle Einblicke in die Arbeitswelt bieten. Eine Befragung zeigt, dass nicht allein die Zahl der Arbeitsstunden entscheidend für den Studienerfolg ist. Besonders belastend werden Jobs erlebt, deren Schichten erst kurzfristig festgelegt werden. Studierende mit planbaren Arbeitszeiten konnten Veranstaltungen regelmäßiger besuchen und sich besser auf Prüfungen vorbereiten. Das bedeutet nicht, dass jede Person mit einem festen Arbeitsplan automatisch bessere Noten erzielt. Auch gesundheitliche Belastungen, finanzielle Sorgen und die Unterstützung durch die Hochschule spielen eine Rolle. Die Autoren empfehlen Arbeitgebern deshalb, die Stundenpläne möglichst früh zu berücksichtigen und Änderungen rechtzeitig mitzuteilen.","questions":[{"id":"rd04-1","kind":"پیام اصلی","question":"Welche Bedeutung haben planbare Arbeitszeiten laut Text?","options":["Sie erleichtern die Studienorganisation.","Sie machen Prüfungen überflüssig.","Sie garantieren gute Noten.","Sie verhindern jeden Stress."],"correct":0,"why":"قابلیت پیش‌بینی در برنامه اهمیت دارد."},{"id":"rd04-2","kind":"جزئیات","question":"Was empfanden Studierende als besonders belastend?","options":["Arbeitsplätze an der Universität","Kurzfristig festgelegte Schichten","Längere Semesterferien","Die Möglichkeit, Erfahrungen zu sammeln"],"correct":1,"why":"شیفت‌های اعلام‌شده در لحظه مسئله اصلی بود."},{"id":"rd04-3","kind":"واژگان","question":"Was bedeutet „kurzfristig“ hier?","options":["Mit großem zeitlichem Vorlauf","Erst kurz vor dem betreffenden Zeitpunkt","Nur einmal im Jahr","Ohne schriftlichen Vertrag"],"correct":1,"why":"kurzfristig = با فاصله زمانی کم."},{"id":"rd04-4","kind":"استنباط","question":"Was lässt sich aus der Befragung NICHT schließen?","options":["Planbarkeit kann helfen.","Viele Faktoren beeinflussen den Studienerfolg.","Feste Schichten garantieren gute Noten.","Arbeitgeber sollten früh informieren."],"correct":2,"why":"متن صریحاً از ضمانت نمره بهتر پرهیز می‌کند."},{"id":"rd04-5","kind":"موضع نویسنده","question":"Wie wirkt die Darstellung?","options":["Abwägend mit praktischer Empfehlung","Moralisch verurteilend","Spöttisch","Ohne Zusammenhang zur Arbeit"],"correct":0,"why":"چند عامل را بررسی و توصیه کاربردی می‌دهد."}]},{"id":"rd05","topic":"پژوهش علمی","genre":"متن علمی","text":"Wissenschaftliche Ergebnisse werden oft als eindeutige Wahrheiten dargestellt. Tatsächlich hängt ihre Aussagekraft von der Methode ab, mit der Daten erhoben wurden. Wer nur wenige Personen befragt, kann deren Erfahrungen genau beschreiben, sollte daraus aber keine allgemeingültigen Aussagen über eine ganze Bevölkerung ableiten. Größere Stichproben lösen ebenfalls nicht jedes Problem: Wenn bestimmte Gruppen kaum vertreten sind, können die Ergebnisse verzerrt sein. Deshalb berichten seriöse Studien nicht nur über ihre Resultate, sondern auch über Unsicherheiten und methodische Grenzen. Das macht Forschung nicht weniger nützlich. Im Gegenteil: Wer weiß, wie verlässlich eine Erkenntnis ist, kann bessere Entscheidungen treffen und neue Untersuchungen gezielter planen.","questions":[{"id":"rd05-1","kind":"پیام اصلی","question":"Worauf legt der Text den Schwerpunkt?","options":["Auf die Bedeutung methodischer Grenzen für die Bewertung von Studien","Auf ein Verbot kleiner Studien","Auf die Unbrauchbarkeit aller Daten","Auf die Zahl wissenschaftlicher Zeitschriften"],"correct":0,"why":"موضوع اصلی کیفیت روش و حدود تعمیم است."},{"id":"rd05-2","kind":"جزئیات","question":"Wann können auch große Stichproben problematisch sein?","options":["Wenn alle Gruppen angemessen vertreten sind","Wenn bestimmte Gruppen zu selten vorkommen","Wenn sie sorgfältig erhoben werden","Wenn sie in Fachzeitschriften erscheinen"],"correct":1,"why":"نامتوازن بودن گروه‌ها باعث سوگیری می‌شود."},{"id":"rd05-3","kind":"واژگان","question":"Was bedeutet „verzerrt“ im Text?","options":["Unverändert","Systematisch in eine Richtung verfälscht","Leicht verständlich","Vollständig ausgeschlossen"],"correct":1,"why":"verzerrt = کج‌نمایی یا سوگیری."},{"id":"rd05-4","kind":"استنباط","question":"Warum sollen Studien ihre Grenzen nennen?","options":["Um eine realistische Einordnung ihrer Ergebnisse zu ermöglichen","Um weniger Menschen zu befragen","Um alle Ergebnisse geheim zu halten","Um neue Forschung zu vermeiden"],"correct":0,"why":"بیان عدم‌قطعیت ارزیابی درست را ممکن می‌کند."},{"id":"rd05-5","kind":"موضع نویسنده","question":"Wie wird Unsicherheit in der Forschung beurteilt?","options":["Als normaler Bestandteil sorgfältiger Wissenschaft","Als Zeichen völliger Nutzlosigkeit","Als persönlicher Fehler der Teilnehmenden","Als Grund, Wissenschaft abzuschaffen"],"correct":0,"why":"عدم‌قطعیت از نظر متن نشانه دقت روش‌شناختی است."}]},{"id":"rd06","topic":"آموزش آنلاین","genre":"تفسیر","text":"Digitale Lehrveranstaltungen werden häufig als besonders flexibel gelobt. Tatsächlich sparen viele Studierende Fahrzeit und können aufgezeichnete Vorträge wiederholen. Dennoch ergeben sich aus der technischen Verfügbarkeit noch keine guten Lernbedingungen. Wer in einer kleinen Wohnung lebt oder sich einen Computer mit anderen Personen teilt, kann erheblich benachteiligt sein. Hinzu kommt, dass spontane Gespräche nach dem Unterricht online seltener entstehen. Eine Hochschule testet deshalb ein gemischtes Modell: Vorträge werden digital angeboten, während Diskussionen und praktische Übungen in kleinen Gruppen stattfinden. Erste Rückmeldungen fallen positiv aus. Die Leitung betont allerdings, dass sie langfristige Wirkungen erst nach weiteren Semestern beurteilen kann. Flexibilität allein ist somit kein ausreichendes Qualitätsmerkmal.","questions":[{"id":"rd06-1","kind":"پیام اصلی","question":"Welches Fazit zieht der Text zur digitalen Lehre?","options":["Flexibilität ist hilfreich, reicht aber als Qualitätsmaßstab nicht aus.","Präsenzunterricht muss vollständig abgeschafft werden.","Online-Lehre ist immer schlechter.","Jeder Mensch besitzt ideale Technik."],"correct":0,"why":"تمایز دسترسی فنی و کیفیت یادگیری محور متن است."},{"id":"rd06-2","kind":"جزئیات","question":"Welche Elemente finden im gemischten Modell in Präsenz statt?","options":["Alle Vorträge","Diskussionen und praktische Übungen","Nur Prüfungsanmeldungen","Nur individuelle Hausaufgaben"],"correct":1,"why":"گفت‌وگو و تمرین عملی حضوری است."},{"id":"rd06-3","kind":"واژگان","question":"Was bedeutet „benachteiligt“?","options":["Im Vorteil","Unter schlechteren Bedingungen","Besonders gut ausgerüstet","Ständig abwesend"],"correct":1,"why":"benachteiligt = در شرایط نامساعد قرارگرفتن."},{"id":"rd06-4","kind":"استنباط","question":"Warum ist die Bewertung des Modells noch vorläufig?","options":["Weil langfristige Ergebnisse noch fehlen.","Weil die Hochschule geschlossen wird.","Weil niemand Rückmeldungen gab.","Weil alle Vorträge verboten wurden."],"correct":0,"why":"دادهٔ بلندمدت هنوز وجود ندارد."},{"id":"rd06-5","kind":"موضع نویسنده","question":"Welche Haltung nimmt der Text ein?","options":["Pragmatisch und vorsichtig","Durchgehend ablehnend","Übertrieben begeistert","Spöttisch gegenüber Technik"],"correct":0,"why":"نقاط قوت را می‌بیند ولی محدودیت‌ها را یادآور می‌شود."}]},{"id":"rd07","topic":"مهاجرت و زبان","genre":"گزارش","text":"Sprachkurse vermitteln Regeln und Wortschatz, aber der Alltag stellt Zugewanderte oft vor andere Herausforderungen. Am Arbeitsplatz werden Sätze verkürzt, in Vereinen wechseln Menschen schnell zwischen Themen, und regionale Ausdrücke kommen hinzu. Eine Initiative organisiert deshalb regelmäßige Gesprächstreffen, bei denen nicht Fehlerfreiheit, sondern gegenseitiges Verstehen im Mittelpunkt steht. Die Teilnehmenden erledigen gemeinsam kleine Aufgaben, etwa das Planen eines Ausflugs. Laut den Organisatoren entstehen auf diese Weise Kontakte, die über den Kurs hinausreichen. Allerdings nimmt nicht jede Person solche Angebote gleichermaßen wahr. Wer Schichtarbeit leistet oder Angehörige betreut, findet oft schwer einen passenden Termin. Daher sollen künftig auch Treffen an Wochenenden stattfinden.","questions":[{"id":"rd07-1","kind":"پیام اصلی","question":"Welches Ziel verfolgt die Initiative?","options":["Alltagskommunikation durch gemeinsame Aktivitäten stärken","Grammatikunterricht vollständig ersetzen","Alle regionalen Ausdrücke abschaffen","Sprachprüfungen verbieten"],"correct":0,"why":"ارتباط روزمره و وظایف مشترک رویکرد محوری است."},{"id":"rd07-2","kind":"جزئیات","question":"Was machen die Teilnehmenden beispielsweise?","options":["Sie planen einen Ausflug.","Sie schreiben eine Abschlussprüfung.","Sie wechseln ihren Arbeitsplatz.","Sie bauen eine neue Schule."],"correct":0,"why":"برنامه‌ریزی گردش در متن آمده است."},{"id":"rd07-3","kind":"واژگان","question":"Was heißt „über den Kurs hinausreichen“?","options":["Schon vor dem Kurs enden","Auch nach dem Kurs eine Wirkung haben","Nur im Unterricht stattfinden","Den Kurs teurer machen"],"correct":1,"why":"یعنی ارتباطی که به بعد از دوره هم ادامه یابد."},{"id":"rd07-4","kind":"استنباط","question":"Warum sollen Treffen am Wochenende angeboten werden?","options":["Damit Menschen mit wenig Zeit leichter teilnehmen können","Damit die Kurse kürzer werden","Weil alle unter der Woche frei haben","Weil niemand am Wochenende arbeitet"],"correct":0,"why":"برای سازگاری با محدودیت کاری و خانوادگی."},{"id":"rd07-5","kind":"موضع نویسنده","question":"Wie wird das Projekt dargestellt?","options":["Grundsätzlich positiv, aber mit Zugangsproblemen","Als gescheitert","Ausschließlich kritisch","Als gesetzliche Pflicht"],"correct":0,"why":"رویکرد مثبت با محدودیت مشارکت همراه است."}]},{"id":"rd08","topic":"انرژی در ساختمان‌ها","genre":"متن علمی","text":"Bei der Sanierung älterer Gebäude wird oft zuerst an neue Heizungsanlagen gedacht. Fachleute weisen jedoch darauf hin, dass auch die Dämmung eine entscheidende Rolle spielt. Ein schlecht gedämmtes Haus verliert selbst mit moderner Technik viel Wärme. Umgekehrt bringt eine umfassende Dämmung wenig, wenn die Räume dauerhaft überheizt werden. Für sinnvolle Entscheidungen muss daher das gesamte Gebäude betrachtet werden: Fenster, Wände, Heiztechnik und das Verhalten der Bewohner. Welche Maßnahme sich wirtschaftlich lohnt, hängt unter anderem vom Zustand des Hauses und von den Energiepreisen ab. Pauschale Empfehlungen sind deshalb schwierig. Die Autoren raten, vor größeren Investitionen eine unabhängige Energieberatung einzuholen.","questions":[{"id":"rd08-1","kind":"پیام اصلی","question":"Was ist die zentrale Empfehlung?","options":["Das gesamte Gebäude vor Investitionen beurteilen","Immer zuerst neue Fenster kaufen","Heizungen grundsätzlich abschaffen","Bewohner nicht berücksichtigen"],"correct":0,"why":"بررسی جامع ساختمان اصل اصلی است."},{"id":"rd08-2","kind":"جزئیات","question":"Was kann trotz moderner Heizung zu großem Wärmeverlust führen?","options":["Schlechte Dämmung","Niedrige Außentemperatur im Sommer","Gute Fenster","Ein unabhängiger Berater"],"correct":0,"why":"عایق‌کاری ضعیف حرارت را هدر می‌دهد."},{"id":"rd08-3","kind":"واژگان","question":"Was ist mit „pauschale Empfehlungen“ gemeint?","options":["Für jeden Fall gleiche allgemeine Empfehlungen","Besonders teure Vorschläge","Nur schriftliche Beratungen","Einzelne technische Messungen"],"correct":0,"why":"pauschal = کلی و بی‌توجه به تفاوت‌ها."},{"id":"rd08-4","kind":"استنباط","question":"Warum kann dieselbe Maßnahme in verschiedenen Häusern unterschiedlich sinnvoll sein?","options":["Weil der Gebäudezustand und Energiepreise variieren","Weil alle Häuser identisch sind","Weil Dämmung nie wirkt","Weil Energiepreise keinerlei Bedeutung haben"],"correct":0,"why":"بازده اقتصادی به شرایط ساختمان و قیمت‌ها وابسته است."},{"id":"rd08-5","kind":"موضع نویسنده","question":"Welche Haltung hat der Text?","options":["Praktisch und differenziert","Werbend für eine bestimmte Firma","Ablehnend gegenüber Beratung","Nur auf Preise fixiert"],"correct":0,"why":"توصیه محتاطانه و مستقل ارائه شده است."}]},{"id":"rd09","topic":"کتابخانه‌ها و سواد اطلاعاتی","genre":"گزارش","text":"Viele Menschen suchen wissenschaftliche Informationen zuerst über eine allgemeine Suchmaschine. Das ist bequem, garantiert aber nicht, dass die gefundenen Seiten zuverlässig sind. Hochschulbibliotheken bieten deshalb kurze Workshops an, in denen Studierende lernen, verschiedene Quellen zu beurteilen. Sie untersuchen beispielsweise, wer einen Text verfasst hat, wann er veröffentlicht wurde und auf welche Belege er sich stützt. Besonders wichtig ist die Unterscheidung zwischen einer persönlichen Meinung und einer überprüfbaren Aussage. Die Kurse zeigen außerdem, wie Quellen richtig angegeben werden. Die Teilnehmenden berichten, dass sie anfangs die Suche als zeitaufwendig empfanden. Später konnten sie jedoch gezielter recherchieren und vermeidbare Fehler reduzieren. Gute Recherche spart somit häufig erst nach einer gewissen Übungszeit tatsächlich Zeit.","questions":[{"id":"rd09-1","kind":"پیام اصلی","question":"Was ist die zentrale Aussage?","options":["Informationskompetenz lässt sich üben und erleichtert später die Recherche.","Suchmaschinen sind grundsätzlich verboten.","Bibliotheken bieten nur Bücher an.","Jede Onlinequelle ist zuverlässig."],"correct":0,"why":"تمرین پژوهش اطلاعاتی و فواید آینده آن."},{"id":"rd09-2","kind":"جزئیات","question":"Was lernen die Studierenden in den Workshops?","options":["Quellen hinsichtlich Autor, Datum und Belegen zu prüfen","Computer selbst zu bauen","Nur private Meinungen zu schreiben","Alle Bücher auswendig zu lernen"],"correct":0,"why":"نام نویسنده، تاریخ و شواهد سه شاخص‌اند."},{"id":"rd09-3","kind":"واژگان","question":"Was bedeutet „sich auf Belege stützen“?","options":["Etwas ohne Grund behaupten","Aussagen mit Nachweisen begründen","Belege wegwerfen","Jede Information automatisch glauben"],"correct":1,"why":"stützen auf = بر شواهد تکیه داشتن."},{"id":"rd09-4","kind":"استنباط","question":"Warum empfinden Anfänger Recherche zunächst als zeitaufwendig?","options":["Weil die notwendigen Prüfschritte noch ungewohnt sind","Weil Bücher nicht existieren","Weil Quellen immer falsch sind","Weil sie nur mit Papier arbeiten dürfen"],"correct":0,"why":"مهارت هنوز خودکار و آشنا نشده است."},{"id":"rd09-5","kind":"موضع نویسنده","question":"Wie wird der Nutzen der Workshops eingeschätzt?","options":["Positiv mit Hinweis auf die anfängliche Mühe","Als vollständig bedeutungslos","Ausschließlich negativ","Ohne jede Bewertung"],"correct":0,"why":"نتیجه مثبت است اما به تلاش اولیه اشاره می‌شود."}]},{"id":"rd10","topic":"حافظه و تمرین","genre":"متن علمی","text":"Beim Lernen wird häufig versucht, möglichst viel Stoff unmittelbar vor einer Prüfung zu wiederholen. Dieses Vorgehen kann kurzfristig das Gefühl vermitteln, gut vorbereitet zu sein. Untersuchungen zum Gedächtnis legen jedoch nahe, dass über mehrere Tage verteilte Wiederholungen langfristig oft wirksamer sind. Besonders hilfreich ist es, Informationen aktiv abzurufen, statt denselben Text immer wieder nur zu lesen. Dabei dürfen Fehler auftreten: Wer seine Antwort mit einer zuverlässigen Lösung vergleicht, kann daraus lernen. Allerdings ist die Wirkung einzelner Lernmethoden nicht für alle Aufgaben gleich. Komplexe Probleme benötigen zusätzlich Zeit für Verständnis und Anwendung. Die Autoren empfehlen daher, verschiedene Übungsformen zu kombinieren und den eigenen Fortschritt regelmäßig zu überprüfen.","questions":[{"id":"rd10-1","kind":"پیام اصلی","question":"Was empfiehlt der Text?","options":["Verteiltes, aktives und angepasstes Üben","Nur die Nacht vor der Prüfung zu lernen","Fehler vollständig zu vermeiden","Jeden Text ausschließlich zu lesen"],"correct":0,"why":"توصیه، توزیع تمرین و بازیابی فعال و ترکیب روش‌هاست."},{"id":"rd10-2","kind":"جزئیات","question":"Welche Übung wird als besonders hilfreich genannt?","options":["Informationen aktiv aus dem Gedächtnis abrufen","Seiten nur mehrfach überfliegen","Notizen nie kontrollieren","Antworten nicht vergleichen"],"correct":0,"why":"active recall در متن اشاره شده است."},{"id":"rd10-3","kind":"واژگان","question":"Was bedeutet „etwas nahelegen“ in diesem Zusammenhang?","options":["Etwas beweisen, ohne jeden Zweifel","Auf eine Schlussfolgerung hinweisen","Etwas verbieten","Etwas zufällig vergessen"],"correct":1,"why":"nahelegen = مطرح کردن احتمالِ مستدل."},{"id":"rd10-4","kind":"استنباط","question":"Wieso können Fehler beim Üben nützlich sein?","options":["Weil der Vergleich mit Lösungen das Lernen unterstützt","Weil jede falsche Antwort volle Punkte bringt","Weil Kontrolle unnötig ist","Weil sie das Verständnis immer verschlechtern"],"correct":0,"why":"بازخورد و بررسی پاسخ درست یادگیری را تقویت می‌کند."},{"id":"rd10-5","kind":"موضع نویسنده","question":"Wie formulieren die Autoren ihre Empfehlung?","options":["Differenziert ohne allgemeines Erfolgsversprechen","Als absolute Regel für alle Aufgaben","Ablehnend gegenüber Forschung","Ausschließlich über Gefühle"],"correct":0,"why":"اثر روش‌ها با توجه به نوع تکلیف متفاوت است."}]}],"math":[{"id":"m001","topic":"معادلهٔ خطی","q":"Lösen Sie die Gleichung: 8x +13 = 109.","options":["13","12","8","10"],"correct":1,"steps":["ابتدا +13 را به طرف دیگر منتقل می‌کنیم: 8x = 96.","دو طرف را بر 8 تقسیم می‌کنیم: x = 96/8 = 12."],"terms":"Gleichung = معادله؛ lösen = حل کردن"},{"id":"m002","topic":"معادلهٔ خطی","q":"Bestimmen Sie x: 9(x -2) = 36.","options":["7","12","10","6"],"correct":3,"steps":["طرفین را بر 9 تقسیم می‌کنیم: x -2 = 4.","عدد -2 را منتقل می‌کنیم و x = 6 می‌شود."],"terms":"bestimmen = تعیین کردن؛ Klammer = پرانتز"},{"id":"m003","topic":"معادلهٔ خطی","q":"Lösen Sie: 3x + 1 = 1x + 17.","options":["11","14","8","13"],"correct":2,"steps":["جمله‌های x را یک‌طرف جمع می‌کنیم: (3−1)x = 17−1 = 16.","پس x = (16)/(2) = 8."],"terms":"umformen = تبدیل معادله؛ Gleichung = معادله"},{"id":"m004","topic":"معادلهٔ خطی","q":"Lösen Sie: x/3 +2 = 8.","options":["21","24","15","18"],"correct":3,"steps":["ابتدا +2 را منتقل می‌کنیم: x/3 = 6.","هر دو طرف را در 3 ضرب می‌کنیم: x = 18."],"terms":"Bruchgleichung = معادلهٔ کسری"},{"id":"m005","topic":"معادلهٔ خطی","q":"Lösen Sie die Gleichung: 7x +2 = 16.","options":["8","2","4","5"],"correct":1,"steps":["ابتدا +2 را به طرف دیگر منتقل می‌کنیم: 7x = 14.","دو طرف را بر 7 تقسیم می‌کنیم: x = 14/7 = 2."],"terms":"Gleichung = معادله؛ lösen = حل const uniquePick=(pool,count,predicate=()=>true,scope='')=>{
 const available=POOLS[pool].filter(predicate).map(x=>x.id);if(!available.length)return[];
 const queueId=pool+(scope?':'+scope:'');let q=Array.isArray(queues[queueId])?queues[queueId].filter(id=>available.includes(id)):[];
 const used=new Set(),selected=[];
 for(let k=0;k<count;k++){
   if(!q.some(id=>!used.has(id)))q=[...q,...shuffle(available.filter(id=>!used.has(id)))];
   const idx=q.findIndex(id=>!used.has(id)); if(idx<0)break;
   const id=q.splice(idx,1)[0];selected.push(POOLS[pool].find(x=>x.id===id));used.add(id);
 }
 queues[queueId]=q;safeWrite(QUEUEKEY,queues);return selected;
};

function renderSources(){const urls=[['فرانکفورت · نوع آزمون و تاریخ','https://www.uni-frankfurt.de/43662351/Studienkolleg'],['لایپزیگ · راهنمای آزمون','https://www.stksachs.uni-leipzig.de/bewerben/schwerpunktkurse-fsp'],['هاله · فایل‌های نمونه رسمی','https://www.studienkolleg.uni-halle.de/aufnahmetest/'],['نوردهاوزن · فرمت و زمان','https://www.hs-nordhausen.de/international/staatliches-studienkolleg/aufnahmetest/'],['TU Berlin · نمونه و زمان','https://www.tu.berlin/international/studierende/studienkolleg/faecher-und-pruefungsbeispiele'],['KIT · ساختار onSET','https://www.stk.kit.edu/t-kurs.php'],['مونیخ · آزمون فوریه ۲۰۲۷','https://xn--studienkolleg-mnchen-3ec.de/bewerben/aufnahme-in-das-studienkolleg/aufnahmepruefung']];return `<details class="pane"><summary style="cursor:pointer;font-weight:800">منابع رسمی و محدودیت‌های شبیه‌سازی</summary><p class="small muted" style="margin-top:11px">منابع فقط برای شناسایی قالب آزمون استفاده شده‌اند. زمان و تعداد فرانکفورت تأیید نشده؛ مونیخ در این نسخه بخش‌های ساخت جمله و نوشتاری ندارد؛ هاله و نوردهاوزن بخش‌هایی دارند که به‌طور کامل پیاده‌سازی نشده‌اند. آزمون‌های ریاضی این برنامه چهارگزینه‌ای‌اند، ولی الزاماً قالب اصلی کالج‌ها نیستند. آزمون واقعی ممکن است تغییر کند.</p><div class="sourcegrid">${urls.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">↗ ${esc(t)}</a>`).join('')}</div></details>`}

function reviewStart(){let due=Object.entries(mistakes).sort((a,b)=>(a[1].next||0)-(b[1].next||0)).slice(0,25);if(!due.length)return alert('هنوز اشتباهی ثبت نشده است.');if(session&&!confirm('آزمون نیمه‌تمام جایگزین شود؟'))return;
 let s={kind:'review',items:due.map(([key,m])=>({id:key,key,topic:m.topic,task:m.task}))};session={id:'review',label:'مرور فاصله‌دار اشتباه‌ها',sections:[{title:'مرور اشتباه‌ها',secs:[s],seconds:null}],index:0,answers:{},start:Date.now(),deadline:null};session.sections[0].startedAt=session.start;saveDraft();renderExam()}

app.addEventListener('input',e=>{let el=e.target;if(!session||!el.dataset.a)return;session.answers[el.dataset.a]=el.value;saveDraft();const stage=current(),n=expectedTasks(stage.secs),done=doneTasks(stage.secs);let lbl=document.getElementById('completed'),fill=document.getElementById('fill');if(lbl)lbl.textContent=fmt(done);if(fill)fill.style.width=(n?100*done/n:0)+'%'});
app.addEventListener('change',e=>{let el=e.target;if(!session||!el.dataset.a)return;session.answers[el.dataset.a]=el.value;saveDraft();const stage=current(),n=expectedTasks(stage.secs),done=doneTasks(stage.secs);let lbl=document.getElementById('completed'),fill=document.getElementById('fill');if(lbl)lbl.textContent=fmt(done);if(fill)fill.style.width=(n?100*done/n:0)+'%'});
app.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-profile],[data-classic]');if(!b)return;
 if(b.dataset.profile){profileDialog(b.dataset.profile);return}if(b.dataset.classic!=null){begin('classic'+b.dataset.classic,{label:'آزمون '+(Number(b.dataset.classic)+1)});return}
 const action=b.dataset.action;switch(action){
 case 'home':home();break;
 case 'resume':if(!session)return home();if(session.sections[session.index].endedAt&&session.index<session.sections.length-1)renderRest();else renderExam();break;
 case 'start-profile':begin(b.dataset.mode,{minutes:Math.min(120,Math.max(5,Number(document.getElementById('custom-min')?.value)||20))});break;

 case 'clearhist':if(confirm('تاریخچهٔ نمره‌ها پاک شود؟ رکورد اشتباه‌ها جداگانه باقی می‌ماند.')){history=[];safeWrite(HISTKEY,history);home()}break;
 case 'export':backup();break;
 case 'again':begin(result?.mode&&!(result.mode.startsWith('classic')||result.mode==='review')?result.mode:'general');break;
 }});
/* POOF practice resume (trainer side only): marker shared with the other practice pages.
   The trainer renders a whole exam section at once, so there is no single-question
   cursor: "section" = session.sections[session.index] (its title + task kinds),
   "questionIndex" = index of the first visible .qbox/article block in that section
   (scrollY is the authoritative restore position; the block index is recorded for
   fidelity and used only as a sanity check). index.html is never touched here. */
function trainerResumeState(){
  var stage=null, kinds=[];
  try{ stage=current(); }catch(e){}
  if(stage && Array.isArray(stage.secs)) kinds=stage.secs.map(function(s){ return s.kind; });
  var qIndex=0, blocks=document.querySelectorAll('#app .qbox');
  if(!blocks.length) blocks=document.querySelectorAll('#app article.pane');
  for(var i=0;i<blocks.length;i++){
    var r=blocks[i].getBoundingClientRect?blocks[i].getBoundingClientRect():null;
    if(r && r.bottom>0){ qIndex=i; break; }
    if(i===blocks.length-1) qIndex=blocks.length-1;
  }
  return {view:view, sectionIndex:session?session.index:0,
    sectionTitle:stage?stage.title:null, sectionKinds:kinds,
    questionIndex:qIndex, scrollY:window.scrollY||0};
}
function savePracticeResume(){
  try{ localStorage.setItem('poof_practice_resume', JSON.stringify({page:'studienkolleg-trainer.html', state:trainerResumeState(), ts:Date.now()})); }catch(e){}
}
function restorePracticeResume(){
  var raw=null; try{ raw=localStorage.getItem('poof_practice_resume'); }catch(e){}
  if(!raw) return false;
  var marker=null; try{ marker=JSON.parse(raw); }catch(e){ return false; }
  if(!marker || marker.page!=='studienkolleg-trainer.html') return false; /* foreign marker: leave untouched */
  var st=marker.state||{};
  var y=(typeof st.scrollY==='number' && isFinite(st.scrollY) && st.scrollY>=0)?st.scrollY:0;
  var restoreScroll=function(){
    requestAnimationFrame(function(){ window.scrollTo(0,y); });
    setTimeout(function(){ window.scrollTo(0,y); },350);
  };
  if((st.view==='exam' || st.view==='rest') && session && Array.isArray(session.sections) && session.sections.length){
    var idx=Number(st.sectionIndex);
    if(isFinite(idx)) session.index=Math.min(Math.max(0,Math.floor(idx)), session.sections.length-1);
    var stage=session.sections[session.index];
    if(stage && stage.endedAt && session.index<session.sections.length-1) renderRest(); else renderExam();
    try{ localStorage.removeItem('poof_practice_resume');window.__poofTrainerMarkerConsumed=true; }catch(e){} /* consume, after restore */
    restoreScroll(); return true;
  }
  home();
  try{ localStorage.removeItem('poof_practice_resume');window.__poofTrainerMarkerConsumed=true; }catch(e){} /* consume, after restore */
  restoreScroll(); return true;
}
// Resume after refresh: draft may be a live section or a stored rest.
if(session && (!Array.isArray(session.sections)||session.index>=session.sections.length))dropDraft();
if(!restorePracticeResume())home();

<script>
/* POOF Select for the trainer (added on top of the theme layer; trainer logic untouched).
   Tokenizes displayed foreign-language text blocks (reading passages, grammar sentences,
   question/stem sentences, result-review stems) into tappable .lk words. Answer-option
   labels (.options), C-Test gaps (.ctext) and vocab chips (.vocab) are never tokenized.
   Gesture model mirrors the main app: clean tap (<250ms, <10px) opens the sheet;
   hold arms at ~350ms with 24px tolerance; hold+drag selects a phrase; touchcancel poisons. */
(function(){
'use strict';
var app=document.getElementById('app');
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normKey(w){return String(w||'').toLowerCase();}
var LOCAL={};
try{
  if(typeof BANK!=='undefined'&&BANK){
    (BANK.ct||[]).forEach(function(x){(x.vocab||[]).forEach(function(p){var k=normKey(p[0]);if(k&&!LOCAL[k])LOCAL[k]={word:p[0],meaning:p[1],topic:x.topic};});});
    (BANK.math||[]).forEach(function(x){if(!x.terms)return;String(x.terms).split('؛').forEach(function(part){var i=part.indexOf('=');if(i<0)return;var w=part.slice(0,i).trim(),m=part.slice(i+1).trim();var k=normKey(w);if(k&&w&&m&&!LOCAL[k])LOCAL[k]={word:w,meaning:m,topic:x.topic};});});
  }
}catch(e){}
function lookup(w){return LOCAL[normKey(w)]||null;}
var WORDRE=/[A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+(?:['\u2019\-][A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+)*|\d+[A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+(?:['\u2019\-][A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+)*/g;
function tokenizeContainer(el){
  if(!el||el.dataset.poofBlock)return;
  el.dataset.poofBlock='1';
  var nodes=[];
  (function walk(n){var ch=n.childNodes?Array.prototype.slice.call(n.childNodes):[];ch.forEach(function(c){if(c.nodeType===3)nodes.push(c);else if(c.nodeType===1&&c.tagName!=='SELECT'&&c.tagName!=='INPUT'&&c.tagName!=='TEXTAREA')walk(c);});})(el);
  nodes.forEach(function(tn){
    var text=tn.nodeValue||'';WORDRE.lastIndex=0;if(!WORDRE.test(text))return;
    var frag=document.createDocumentFragment(),last=0,m;WORDRE.lastIndex=0;
    while((m=WORDRE.exec(text))!==null){
      if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      var sp=document.createElement('span');sp.className='lk';sp.setAttribute('data-w',m[0]);sp.setAttribute('tabindex','0');sp.setAttribute('role','button');sp.textContent=m[0];frag.appendChild(sp);last=m.index+m[0].length;
    }
    if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
    if(tn.parentNode)tn.parentNode.replaceChild(frag,tn);
  });
}
function tokenizeAll(){
  if(!app)return;
  var els=app.querySelectorAll('p.german, div.german');
  Array.prototype.forEach.call(els,function(el){
    if(el.closest('.options')||el.closest('.vocab')||el.classList.contains('ctext'))return;
    if(el.tagName==='DIV'){tokenizeContainer(el);return;}
    if(el.classList.contains('qtitle')||el.closest('.review')||(el.parentNode&&el.parentNode.tagName==='ARTICLE'))tokenizeContainer(el);
  });
}
/* --- sheet + phrase popup (built with DOM API only, no innerHTML) --- */
function mkEl(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function mkBtn(cls,text,label){var b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.setAttribute('aria-label',label);return b;}
var backdrop=mkEl('div','poof-sheet-backdrop');backdrop.hidden=true;document.body.appendChild(backdrop);

var sX=mkBtn('poof-sheet-x','✕','بستن');
sRow.appendChild(sWord);sRow.appendChild(sX);

var sSrc=mkEl('p','poof-sheet-src');
var sEx=mkEl('p','poof-sheet-ex');
var sDict=mkEl('a','poof-sheet-dict','دیدن در دیکشنری POOF');sDict.href='./';

var phraseEl=mkEl('div','poof-phrase');phraseEl.hidden=true;
var pRow=mkEl('div','poof-phrase-row');
var pText=mkEl('div','poof-phrase-text');
var pX=mkBtn('poof-sheet-x','✕','بستن');
pRow.appendChild(pText);pRow.appendChild(pX);
var pDict=mkEl('a','poof-sheet-dict','دیدن در دیکشنری POOF');pDict.href='./';
phraseEl.appendChild(pRow);phraseEl.appendChild(pDict);
document.body.appendChild(phraseEl);
var sheetOpen=false,sheetPushed=false,popOpen=false,popPushed=false,popAnchor=null;
function dictHref(w){return './?dict='+encodeURIComponent(w);}
function sentenceFor(block,word){
  var txt=block?block.textContent||'':'';var sens=txt.match(/[^.!?…]+[.!?…]?/g)||[];var lw=String(word).toLowerCase();
  for(var i=0;i<sens.length;i++){if(sens[i].toLowerCase().indexOf(lw)>=0){var s=sens[i].trim();return s.length>240?s.slice(0,240).trim()+'…':s;}}

}
function openSheet(word,span){
  var entry=lookup(word);
  sWord.textContent=word;
  sMean.textContent=entry?entry.meaning:'در واژه‌نامهٔ همین صفحه معنایی ثبت نشده است؛ معنی کامل را در دیکشنری POOF ببینید.';

function closeSheet(fromPop){

}
function clearSel(){
  var sels=document.querySelectorAll('.lk.esel');
  Array.prototype.forEach.call(sels,function(s){s.classList.remove('esel');});
}
function positionPhrase(){
  if(!popOpen||!popAnchor||phraseEl.hidden)return;
  var r=popAnchor.getBoundingClientRect?popAnchor.getBoundingClientRect():{top:0,bottom:40,left:8};
  var h=phraseEl.offsetHeight||80;var w=phraseEl.offsetWidth||280;
  var top=r.top-h-10;if(top<8)top=r.bottom+10;
  var vw=(typeof window!=='undefined'&&window.innerWidth)||400;
  var left=Math.max(8,Math.min(vw-w-8,r.left));
  phraseEl.style.top=top+'px';phraseEl.style.left=left+'px';
}
function openPhrase(phrase,anchorSpan){
  pText.textContent=phrase;pDict.href=dictHref(phrase);popAnchor=anchorSpan;
  phraseEl.hidden=false;popOpen=true;positionPhrase();
  if(!popPushed){try{history.pushState({poofPhrase:1},'');popPushed=true;}catch(e){}}
}
function closePhrase(fromPop){
  if(!popOpen)return;popOpen=false;phraseEl.hidden=true;popAnchor=null;clearSel();
  if(popPushed&&!fromPop){popPushed=false;try{history.back();}catch(e){}}else{popPushed=false;}
}
sX.addEventListener('click',function(){closeSheet(false);});
backdrop.addEventListener('click',function(){closeSheet(false);});
pX.addEventListener('click',function(){closePhrase(false);});
window.addEventListener('popstate',function(){
  if(sheetOpen){sheetOpen=false;sheet.hidden=true;backdrop.hidden=true;sheetPushed=false;}
  if(popOpen){popOpen=false;phraseEl.hidden=true;popAnchor=null;popPushed=false;clearSel();}
});
window.addEventListener('scroll',positionPhrase,true);
window.addEventListener('resize',positionPhrase);
/* --- exact gesture model --- */
function blockSpans(span){
  var b=span?span.closest('[data-poof-block]'):null;
  if(!b)return[];
  return Array.prototype.slice.call(b.querySelectorAll('.lk'));
}
function drawSel(rec){
  if(!rec.spans)return;
  rec.spans.forEach(function(s,i){s.classList.toggle('esel',i>=rec.a&&i<=rec.b);});
}
function spanAt(x,y){
  if(!document.elementFromPoint)return null;
  var el=document.elementFromPoint(x,y);if(!el||!el.closest)return null;
  var sp=el.closest('.lk');if(!sp)return null;
  var spans=blockSpans(sp);var idx=spans.indexOf(sp);if(idx<0)return null;
  var block=sp.closest('[data-poof-block]');
  return {span:sp,block:block,spans:spans,index:idx};
}
var g=null,suppressUntil=0,poisonedUntil=0;
function wordOf(sp){return sp.getAttribute('data-w')||sp.textContent;}
document.addEventListener('touchstart',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.lk'):null;if(!t)return;
  var th=e.touches&&e.touches[0];if(!th)return;
  g={span:t,block:t.closest('[data-poof-block]'),t0:Date.now(),x0:th.clientX,y0:th.clientY,lx:th.clientX,ly:th.clientY,armed:false,drag:false,spans:null,anchor:-1,a:-1,b:-1,timer:null};
  g.timer=setTimeout(function(){
    if(!g)return;g.timer=null;g.armed=true;
    var spans=blockSpans(g.span);var idx=spans.indexOf(g.span);
    if(idx<0){g=null;return;}
    g.spans=spans;g.anchor=idx;g.a=idx;g.b=idx;drawSel(g);
    if(g.block&&g.block.style)g.block.style.touchAction='none';
    try{if(navigator.vibrate)navigator.vibrate(15);}catch(err){}
  },350);
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!g)return;
  var th=e.touches&&e.touches[0];if(!th)return;
  var dx=th.clientX-g.x0,dy=th.clientY-g.y0;
  if(g.timer){
    g.lx=th.clientX;g.ly=th.clientY;
    if(dx*dx+dy*dy>576){clearTimeout(g.timer);g.timer=null;}
    return;
  }
  if(!g.armed)return;
  e.preventDefault();
  g.drag=true;
  var hit=spanAt(th.clientX,th.clientY);if(!hit)return;
  if(hit.block!==g.block)return;
  g.spans=hit.spans;g.a=Math.min(g.anchor,hit.index);g.b=Math.max(g.anchor,hit.index);drawSel(g);
},{passive:false});
document.addEventListener('touchend',function(){
  if(!g)return;
  var rec=g;g=null;
  if(rec.timer){clearTimeout(rec.timer);rec.timer=null;}
  if(rec.block&&rec.block.style)rec.block.style.touchAction='';
  var dur=Date.now()-rec.t0;
  if(!rec.armed){
    var dx=rec.lx-rec.x0,dy=rec.ly-rec.y0;
    if(dur<250&&dx*dx+dy*dy<100){suppressUntil=Date.now()+250;openSheet(wordOf(rec.span),rec.span);}
    return;
  }
  suppressUntil=Date.now()+80;
  var spans=rec.spans||blockSpans(rec.span);
  var a=rec.a>=0?rec.a:spans.indexOf(rec.span);var b=rec.b>=0?rec.b:a;
  var phrase=spans.slice(a,b+1).map(function(s){return wordOf(s);}).join(' ').replace(/\s+/g,' ').trim();
  if(phrase)openPhrase(phrase,spans[a]);else clearSel();
},{passive:true});
document.addEventListener('touchcancel',function(){
  if(g&&g.timer)clearTimeout(g.timer);
  if(g&&g.block&&g.block.style)g.block.style.touchAction='';
  g=null;suppressUntil=Date.now()+300;poisonedUntil=Date.now()+300;clearSel();
},{passive:true});
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.lk'):null;if(!t)return;
  if(Date.now()<suppressUntil||Date.now()<poisonedUntil){e.preventDefault();e.stopPropagation();return;}
  openSheet(wordOf(t),t);
},true);
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target&&e.target.closest?e.target.closest('.lk'):null;if(!t)return;
  e.preventDefault();openSheet(wordOf(t),t);
});
if(app&&typeof MutationObserver!=='undefined'){
  var mo=new MutationObserver(function(){tokenizeAll();});
  mo.observe(app,{childList:true,subtree:true});
}
tokenizeAll();
})();

</script>

<script>
/* POOF bottom nav: writes the main app's own boot state (poof_last_state) and navigates to ./.
   Also writes the practice-resume marker (poof_practice_resume) BEFORE leaving, so a
   return to this page restores the exact exercise. The header back link does the same. */
(function(){
  var nav=document.querySelector('.poof-nav');
  if(nav) nav.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button[data-tab]'):null;
    if(!b)return;
    if(typeof savePracticeResume==='function'){ try{ savePracticeResume(); }catch(err){} }
    var tab=b.getAttribute('data-tab');
    try{var prev=null;try{prev=JSON.parse(localStorage.getItem('poof_last_state')||'null');}catch(err){}var state={tab:tab,scrollY:0,dictQ:'',textId:(tab==='read'&&prev&&prev.textId)?prev.textId:null};localStorage.setItem('poof_last_state',JSON.stringify(state));}catch(err){}
    window.location.href='./';
  });
  var back=document.querySelector('.poof-back a');
  if(back) back.addEventListener('click',function(){
    if(typeof savePracticeResume==='function'){ try{ savePracticeResume(); }catch(err){} }
  });
  /* Bottom-bar auto-hide, mirroring the main app: transition + .nav-hidden on .poof-nav.
     Guard reads the sheet/phrase/backdrop hidden flags because sheetOpen/popOpen live
     inside the POOF Select IIFE above and are not visible to this script; hidden=false
     is exactly the observable open state. */
  if(!nav) return;
  function trainerOverlayOpen(){
    var s=document.querySelector('.poof-sheet'); if(s && !s.hidden) return true;
    var ph=document.querySelector('.poof-phrase'); if(ph && !ph.hidden) return true;
    var bd=document.querySelector('.poof-sheet-backdrop'); if(bd && !bd.hidden) return true;
    return false;
  }
  var lastToggleY=window.scrollY||0;
  window.addEventListener('scroll',function(){
    if(trainerOverlayOpen()) return;
    var y=window.scrollY||0;
    if(y<=90){ nav.classList.remove('nav-hidden'); lastToggleY=y; }
    else if(y>lastToggleY+40){ nav.classList.add('nav-hidden'); lastToggleY=y; }
    else if(y<lastToggleY-40){ nav.classList.remove('nav-hidden'); lastToggleY=y; }
  },{passive:true});
})();
</script>

<script>
/* POOF position wiring (Part B): restores section/index/scroll via PoofPos.
   anchor carries the section index (this page has no word keys; the section
   index is the position, per the Part B spec). Marker priority: if
   restorePracticeResume() consumed a poof_practice_resume marker at boot
   (window.__poofTrainerMarkerConsumed, set beside the existing removeItem
   calls), apply() is a NO-OP. The 'result' view is never restored (it needs
   the result object PoofPos does not carry): the validator maps it to home. */
(function(){
  if(!window.PoofPos) return;
  var PAGE='studienkolleg-trainer.html';
  var markerConsumed=!!window.__poofTrainerMarkerConsumed;
  var VIEWS=['home','exam','rest','result'];
  function y(){ try{ return Math.round(window.scrollY||0); }catch(e){ return 0; } }
  function qIndex(){
    try{
      var blocks=document.querySelectorAll('#app .qbox');
      if(!blocks.length) blocks=document.querySelectorAll('#app article.pane');
      for(var i=0;i<blocks.length;i++){
        var r=blocks[i].getBoundingClientRect ? blocks[i].getBoundingClientRect() : null;
        if(r && r.bottom>0) return i;
        if(i===blocks.length-1) return i;
      }
    }catch(e){}
    return 0;
  }
  function curPos(){
    try{
      var idx=(session && typeof session.index==='number') ? session.index : 0;
      return window.PoofPos.make(PAGE, view, {
        cat: (session && session.id) ? session.id : '',
        anchor: String(idx), seen: String(qIndex()), scrollY: y()
      });
    }catch(e){ return null; }
  }
  function restoreScroll(pos){
    var t=(pos && typeof pos.scrollY==='number' && isFinite(pos.scrollY)) ? Math.round(pos.scrollY) : 0;
    if(!t) return;
    try{ requestAnimationFrame(function(){ try{ window.scrollTo(0,t); }catch(e){} }); }catch(e){}
    setTimeout(function(){ try{ window.scrollTo(0,t); }catch(e){} }, 350);
  }
  window.PoofPos.registerValidator(PAGE, function(pos){
    try{
      if(VIEWS.indexOf(pos.section)<0) pos.section='home';
      if(pos.section==='result') pos.section='home';
      if(!session || !Array.isArray(session.sections) || !session.sections.length){
        if(pos.section!=='home'){ pos.section='home'; pos.anchor=''; }
        return pos;
      }
      var ix=parseInt(pos.anchor,10);
      if(!isFinite(ix)) ix=0;
      pos.anchor=String(Math.min(Math.max(0,ix), session.sections.length-1));
      return pos;
    }catch(e){ return null; }
  });
  window.PoofPos.init({ page: PAGE, apply: function(pos){
    if(markerConsumed) return;
    try{
      if(pos.section==='home' || !session){ home(); restoreScroll(pos); return; }
      var ix=parseInt(pos.anchor,10);
      if(!isFinite(ix)) ix=0;
      ix=Math.min(Math.max(0,ix), session.sections.length-1);
      session.index=ix;
      var stage=session.sections[ix];
      if(stage && stage.endedAt && ix<session.sections.length-1) renderRest(); else renderExam();
      restoreScroll(pos);
    }catch(e){ try{ home(); }catch(e2){} }
  }});
  window.addEventListener('scroll', function(){ var p=curPos(); if(p) window.PoofPos.saveSoon(p); }, {passive:true});
  var nav=document.querySelector('.poof-nav');
  if(nav) nav.addEventListener('click', function(){ var p=curPos(); if(p) window.PoofPos.saveNow(p); });
  var backLink=document.querySelector('.poof-back a');
  if(backLink) backLink.addEventListener('click', function(){ var p=curPos(); if(p) window.PoofPos.saveNow(p); });
  var appEl=document.getElementById('app');
  if(appEl) appEl.addEventListener('click', function(e){
    var a=e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(a){ var p=curPos(); if(p) window.PoofPos.saveNow(p); return; }
    var before=view;
    setTimeout(function(){
      var p=curPos(); if(!p) return;
      if(p.section!==before) window.PoofPos.go(p); else window.PoofPos.track(p);
    }, 0);
  });
  document.addEventListener('click', function(e){
    var a=e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(a){ var p=curPos(); if(p) window.PoofPos.saveNow(p); }
  });
})();
</script>
